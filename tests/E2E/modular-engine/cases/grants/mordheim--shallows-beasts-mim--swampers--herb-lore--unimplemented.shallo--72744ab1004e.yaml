# --- Authored scenarios ---
# Derived from the printed rule row (implemented YES, mechanic.herb-lore binding) and the printed
# Swamper profile (wounds 1); no engine output was consulted.  No charge is declared, so the round
# resolves without combat and the only candidate request would be the healing decision/die, which
# the branches gate on missing wounds: none is declared, so no herb-lore key must be requested.

- audit_id: rule/mordheim/shallows-beasts-mim/swampers--herb-lore/unimplemented.shallows-beasts-mim.swampers.herb-lore
  id: the-full-health-bearer-never-requests-the-healing-die
  covers: [heal-in-recovery-phase--scope--self-heal]
  # The bearer stays at the printed maximum of one wound for the whole duel, so the healing
  # branch is never entered: no round.N.first.herb-lore decision and die is requested.  An
  # implementation that asked for a healing roll at full health would fail this tape.
  fighters:
    first: {collection: mordheim, band_id: shallows-beasts-mim, profile_id: swampers}
    second:
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  # Neither warrior charges, but the round still resolves both attack pools; natural
  # ones are misses, so no combat consequence distracts from the absent healing request.
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The printed 4+ restoration face stays dependent on an admissible initial lost-wound state
# (conditions.yaml carries none of that class), so only the full-health face is declared here.
