# Printed rule text:
#   Ogres don't use daggers for fighting, just for eating. They don't carry them on the battlefield. If forced to, by losing a weapon or not carrying any weapon, they will fight unarmed. But since their physical strength the -1S penalty does not apply, but the +1 enemy armour save still does. They may make more than one unarmed attack, depending on their Attacks value. Note that you cannot combine this unarmed attack with another weapon, so it doesn't count as an additional attack like the dagger would. It can only be made if the ogre doesn't have any other weapons at his disposal.
# Semantic contract (check analysis_status before treating as accepted):
#   Fighting unarmed the Ogre ignores the -1 Strength penalty while the opponent still receives the +1 armour save, and he may make as many unarmed attacks as his Attacks value.
