# Register notes (context only, not behavioral authority):
#   No binding exists for this origin. The engine has an unarmed-without-penalties flag, but it also cancels the opponent's +1 armour save (the armour context removes the weapon's target bonus when that flag is set), which contradicts this print; wiring the flag as-is would therefore implement the rule wrongly. A separate effect that only drops the -1 Strength is required.

# --- Authored scenarios ---
# Derived from the printed rule text, the printed `ogre-hunter` profile and the accepted weapon.fist
# contract; no engine output was consulted.  The printed band rule `band--huuuuge` makes the Ogre
# Hunter cause Fear, so the charged defender takes the round-0 Fear test (2d6 against its Leadership)
# before the attacks; the two dice are declared first.

# The printed waiver: an unarmed Ogre Hunter wounds at its printed Strength 4.  Against Toughness 4 that is a
# 4+, while the penalised Strength 3 would need a 5+, so the declared 4 lands only when the -1 does not
# apply.  The unarmed attack also grants the enemy its printed +1 armour save, and armour die 3 fails the
# worn 4+ that bonus creates, so the wound stands.  Both attack dice of the printed A2 pool are declared.
