# --- Authored scenarios ---
# Derived from the printed sentence, the recorded contract and the accepted specification; no engine
# output was consulted.  The scarecrow is the band's printed construct, so its own row supplies the
# re-roll, and the striker's Weapon Skill and Strength fix the hit and wound thresholds.  The striker's
# Initiative 4 is a fixture fact above the scarecrow's printed 3: it fixes the striker as the first to
# act instead of leaving the pair to the equal-Initiative tie roll, which is not the clause under test.

