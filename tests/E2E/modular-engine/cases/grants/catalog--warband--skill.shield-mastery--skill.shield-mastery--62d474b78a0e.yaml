# --- Authored scenarios ---
# The warband skill list prints the canonical shield-mastery wording: the parry
# comes from the skill and the save from the ordinary shield composition, so both
# halves are consumed without either replacing the other.
# The shield is not a parrying weapon of its own, and the skill makes it parry as the
# printed buckler: the five beats the four and the wound is never rolled.
- audit_id: rule/catalog/warband/skill.shield-mastery/skill.shield-mastery
  id: the-shield-parries-as-a-buckler
  covers: [shield-parries-and-keeps-its-bonus]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      off_hand_id: defence.shield
      skill_ids: [skill.shield-mastery]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.parry, value: 5}
