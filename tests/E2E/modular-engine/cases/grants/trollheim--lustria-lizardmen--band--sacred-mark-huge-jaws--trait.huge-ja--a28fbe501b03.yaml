  id: the-marked-bite-wounds-a-toughness-three-opponent-on-a-two
  covers: [whole--scope--bite-strength]
  fighters:
    first:
      main_weapon_id: weapon.stone-axe
      characteristics: {weapon_skill: 2, strength: 3, toughness: 3, wounds: 3, initiative: 1, attacks: 1}
    second:
