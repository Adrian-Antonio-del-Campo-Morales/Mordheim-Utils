# --- Authored scenarios: the printed list access ---
# Derived from the printed row, this band's own profiles.yaml (the hero and henchman ranks with their declared
# skill_access categories) and the shared skill-availability fragment; no engine output was consulted.  Both
# tapes declare zero attacks, so the observation is the access itself and not a member's own duel consequence
# (Black Hunger's attack and backlash halves are the separate admitted clauses already evidenced above).

- audit_id: rule/mordheim/skaven-of-clan-moulder-web/band--clan-moulder-special-skills/unimplemented.skaven-of-clan-moulder-web.special.clan-moulder-special-skills
  id: the-printed-list-member-is-admitted-to-a-clan-moulder-hero
  covers: [black-hunger--scope--skill-list-access]
  # The printed permission is the required behaviour: a Clan Moulder hero may take a skill from the printed list
  # instead of the standard tables, so the build must compile and the engagement must start.  The build is
  # refused today because the row binds no member list, a KB connection gap; the expectation is deliberately NOT
  # that refusal.
  fighters:
    first:
      collection: mordheim
      band_id: skaven-of-clan-moulder-web
      profile_id: packmaster
      skill_ids: [mechanic.black-hunger]
    second:
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  initial_state: {first: {attacks: 0}, second: {attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  expect_initial: {first.attacks: 0, second.attacks: 0}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

- audit_id: rule/mordheim/skaven-of-clan-moulder-web/band--clan-moulder-special-skills/unimplemented.skaven-of-clan-moulder-web.special.clan-moulder-special-skills
  id: the-printed-list-is-not-available-to-a-henchman
  covers: [black-hunger--scope--skill-list-access]
  # The closure of the same printed sentence, which names Clan Moulder HEROES: a henchman of the band, whose own
  # profiles.yaml skill_access is empty, cannot take a member of the list.  The fragment is the shared
  # skill-availability sentence this corpus already uses for the identical closure.
  fighters:
    first:
      collection: mordheim
      band_id: skaven-of-clan-moulder-web
      profile_id: clanrats
      skill_ids: [mechanic.black-hunger]
  expect_error: "skills are not available to skaven-of-clan-moulder-web/clanrats: ['mechanic.black-hunger']"

# --- Authored scenarios: the printed Hypnotic Musk charge gate ---
# Derived from the printed member row and the accepted charge-gate reading the corridor confirmed
# against the current KB and executor contract (the 2026-10-14 snapshot predated it): the member
# band--clan-moulder-special-skills-hypnotic-musk is selectable / implemented YES with the live
# mechanic.hypnotic-musk binding, its printed sentence is exactly the animal charge gate ("Any
# animal or beast from an opposing warband wishing to charge him must pass a Leadership test...;
# mounts are immune"), and the resolve_fear path now names that gate (musking warrior, animal
# charging opponent, not mounted, not Goading-driven).  The tapes supply the same shared operator
# through the fighter's grant list, exactly as the Black Hunger tapes above supply theirs; no
# engine output was consulted.

- audit_id: rule/mordheim/skaven-of-clan-moulder-web/band--clan-moulder-special-skills/unimplemented.skaven-of-clan-moulder-web.special.clan-moulder-special-skills
  id: the-animal-charger-takes-the-musk-gate-and-fails-it
  covers: [hypnotic-musk--scope--hypnotic-musk]
  # The printed gate: an animal charger must pass a Leadership test to charge the musking
  # warrior.  The charging enemy (declared Leadership 5, normal animal) rolls 4+3 = 7, above 5,
  # so the charge fails and the round resolves without combat - the strict tape holds no combat
  # dice, even though the enemy declared one.
  fighters:
    first:
      skill_ids: [mechanic.hypnotic-musk]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 4, attacks: 1, leadership: 6}
    second:
      trait_overrides: {normal_animal: true}
      characteristics: {weapon_skill: 5, strength: 5, toughness: 3, wounds: 3, initiative: 3, attacks: 2, leadership: 5}
  duel_context: {charging: [second], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.hypnotic-musk-charge.0, value: 4}
    - {key: round.0.second.hypnotic-musk-charge.1, value: 3}
  expect_rounds:
    0: {state.engaged: false}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The control: a non-animal charger of the same build is not printed by the clause, so no gate die
