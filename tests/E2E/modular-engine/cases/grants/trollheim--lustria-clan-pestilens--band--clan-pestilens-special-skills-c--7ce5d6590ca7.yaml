# --- Authored scenarios ---
# Derived from the printed rule and the recorded contract; no engine output was consulted.  The bearer
# is a hand-built fixture that carries the printed rule (skill_ids: [trait.contagious]), the attacker
# is the fixture whose Toughness the printed test reads, and one Wound on the bearer makes the first
# unsaved wound an established Out result.  The reaction die is the `.contagious` entry the recorded
# consumer takes at the attack's own key, and the illustrated die order is hit, wound, injury, then the
# reaction.  The attacker (WS3) hits the equal-Weapon-Skill bearer on 4 and wounds Toughness 3 on 4.
- audit_id: rule/trollheim/lustria-clan-pestilens/band--clan-pestilens-special-skills-contagious/trait.contagious
  id: a-failed-toughness-test-costs-the-attacking-model-a-wound
  covers: [contagious-reaction]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      trait_overrides: {contagious: true}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 2, attacks: 1}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.injury.0, value: 6}
    - {key: round.0.first.attack.0.contagious, value: 5}
  expect_rounds:
    0: {state.second.condition: OUT, state.first.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: second_out}

