# --- Authored scenarios ---
# Derived from the printed sentence and the recorded parry-with-any-weapon contract; no engine output was
# consulted.  A mace cannot parry on its own, so the only difference between the two capacity scenarios is
# the skill; the third resolves a real mace parry, keyed on the attack being parried, of which the
# attacker's hit of 4 is beaten by the parry die of 5, so the wound never lands and the single allowance the
# clause grants is consumed.  The additional-attempt clause of this origin is deliberately not tested here
# (see the PARTIAL note in the header).
- audit_id: rule/mordheim/high-elves-lus/band--skill-miniath/skill.miniath
  id: the-skill-allows-a-parry-with-a-weapon-that-cannot-parry
  covers: [parry-with-any-weapon]
  fighters:
    first: &miniath-attacker
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      skill_ids: [skill.miniath]
      characteristics: &miniath-bearer {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: &miniath-context {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.parries_remaining: 1, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

