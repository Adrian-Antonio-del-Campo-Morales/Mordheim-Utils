# RECIPIENT BOUNDARY (checked statically in the shared construction stage, not by running it): the
# netter fixture is the printed Hero row bosses, not the Henchman row night-goblins.
# `specialRuleRestriction()`'s access stage admits a band warband_skill row with `applies_to.band: true`
# and no `eligibility` only for a recipient whose own printed `skill_access` carries the `special`
# category; night-goblins prints none and would be refused one stage before this clause is reached,
# which is the table's access requirement, not the net.  The retarget is inert for the tape: the net is
# read through Ballistic Skill and both printed rows carry BS 3, both print the same
# night-goblin-equipment-list, bosses carries no automatic profile rule, and every other
# characteristic the tape reads is declared on the fixture itself.
#   band--night-goblin-special-skills-netter  kind warband_skill  applies_to {band: true}  eligibility none
#   bosses  type hero  BS 3  skill_access [combat, shooting, speed, special]
# Derived from the printed rule, this band's printed binding and the shared netter operator; no engine
# output was consulted.  The netter fixture is the printed Night Goblin profile that carries the rule,
# with its own characteristics declared except Ballistic Skill, which the profile supplies.
#
# Known gap (recorded, not worked around): the band row band--night-goblin-special-skills-netter is a
# warband_skill whose net-charge producer is declared scope 'NO' (only condition.netted is admitted),
# so the engine raises no round.N.<side>.netter.hit / .escape request at all and the declared net dice
# stay unused; the tape owns the printed expectation (net hit, failed Strength escape, knocked-down
# automatic hit with its wound roll) and is expected to fail until that producer is implemented.  The
# control below, resolved without the band rule, is unaffected.
