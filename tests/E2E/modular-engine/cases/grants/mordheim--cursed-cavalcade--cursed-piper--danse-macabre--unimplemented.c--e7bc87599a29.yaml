# authoring_progress: the corridor re-checked the clause note because the 2026-10-14 snapshot
#   predated the KB condition and the duel seam: the cursed state IS now an admitted supplied
#   condition - catalog/rules/conditions.yaml carries condition.danse-macabre-controlled
#   (scope YES / implemented YES, "The supplied cursed target may not attack the controlling
#   Piper and takes a Leadership test in its own recovery; success clears the effect"), the
#   condition_ids build channel supplies it, and the named duel seam exists (the state carries
#   the flag, the round re-tests it at turn start and blocks its attacks while controlled).
#   The two tapes below state the admitted facet: the failure control (9 > the declared Ld 6)
#   leaves the warrior dancing - the state flag stays true and the round pool grants it no
#   attack, so only the opponent's strike is declared; and the passing tape (3+3 against Ld 6,
#   the exact boundary) clears the state, after which the recovered warrior attacks again.
#   The movement face (the Piper moving the model) is the scope-NO sibling and stays excluded;
#   the Piper's targeting/consumption is the other scope-NO face of the origin.  REVIEWED still
#   requires manual semantic review; execution_status stays UNEXECUTED.
# --- Authored scenarios ---
# Derived from the printed clause and the admitted supplied condition row; no engine output was
# consulted.  The controlled target is a hand-built recipient carrying the supplied cursed state
# (condition_ids), Leadership 6 as a declared fixture fact, acting first, with a declared charge so
# the round is a close-combat round.  The re-test is the 2d6 request round.0.first.danse-macabre;
# the declared natural-1 hits miss for everyone, so the round's wounds never change.

- audit_id: rule/mordheim/cursed-cavalcade/cursed-piper--danse-macabre/unimplemented.cursed-cavalcade.cursed-piper.danse-macabre
  id: the-failed-retest-leaves-the-warrior-dancing-and-attackless
  covers: [control-enemy--scope--danse-state]
  # The printed "will continue to be under the Pipers' control and... cannot attack": 5+4 = 9 is
  # above the declared Leadership 6, so the re-test fails, the state keeps the warrior dancing
  # (danse_macabre_controlled stays true) and its share of the round's attack pool is zero - the
  # only declared strike is the opponent's, which the pool alone supplies.
  fighters:
    first:
      condition_ids: [condition.danse-macabre-controlled]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 4, attacks: 1, leadership: 6}
    second:
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.danse-macabre.0, value: 5}
    - {key: round.0.first.danse-macabre.1, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.danse_macabre_controlled: true, attacks.0.hit: false, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The passing re-test is the printed "will have to pass a Ld test": 3+3 = 6 against the declared
# Leadership 6 is the exact boundary.  The state clears (danse_macabre_controlled false) and the
# recovered warrior resumes attacking, so the pool carries both fighters' strikes.
- audit_id: rule/mordheim/cursed-cavalcade/cursed-piper--danse-macabre/unimplemented.cursed-cavalcade.cursed-piper.danse-macabre
  id: the-passed-retest-clears-the-state-and-restores-the-attacks
  covers: [control-enemy--scope--danse-state]
  fighters:
    first:
      condition_ids: [condition.danse-macabre-controlled]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 4, attacks: 1, leadership: 6}
    second:
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.danse-macabre.0, value: 3}
    - {key: round.0.first.danse-macabre.1, value: 3}
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.danse_macabre_controlled: false, state.first.wounds: 2, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
