- audit_id: rule/mordheim/clan-angrund-kep/dwarf-troll-slayers--slayer-skills/profile.skill-access
  id: a-printed-slayer-skill-is-admitted-to-the-recipient
  covers: [whole]
  fighters:
    first:
      collection: mordheim
      band_id: clan-angrund-kep
      profile_id: dwarf-troll-slayers
      skill_ids: [skill.ferocious-charge]
      main_weapon_id: weapon.mace
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  initial_state: {first: {attacks: 0}, second: {attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  # Both fighters print the same Initiative, so the order is decided by the tie die before the
