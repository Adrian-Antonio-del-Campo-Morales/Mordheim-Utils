# --- Authored scenarios ---
# The printed target is an enemy-identity fact, not a creature kind: the opponent is
# built from the band that carries the identity.  A one always misses and a six always
# hits, which keeps both cases independent of the opponent's Weapon Skill.
# A wound roll of 5 avoids an unrelated critical. Each printed target has one Wound,
# so a failed save reaches the injury chart; a 1 leaves the target Knocked Down.
- audit_id: rule/mordheim/amazons-lustria/band--special-rules/mechanic.amazon-isolationists
  id: the-first-round-miss-against-lizardmen-is-taken-again
  covers: [isolationists]
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.amazon-isolationists]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      collection: mordheim
      band_id: lizardmen
      profile_id: skink-braves
  initial_state:
    second: {attacks: 0}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.first.attack.0.hit.reroll, value: 6}
    - {key: round.0.first.attack.0.wound, value: 5}
    - {key: round.0.first.attack.0.armour, value: 2}
    - {key: round.0.first.attack.0.injury.0, value: 1}
  expect_rounds:
    0: {attacks.0.hit: True, attacks.0.damage: 1, state.second.wounds: 0, state.second.condition: KNOCKED_DOWN}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
