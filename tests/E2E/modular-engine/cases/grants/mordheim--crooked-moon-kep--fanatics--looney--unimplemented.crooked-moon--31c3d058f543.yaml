# --- Authored scenarios ---
# Family model (Frenzy granted by the Looney's mushrooms): the bearer is Frenzied from
# duel start (doubled attacks, psychology exemption), takes no Fear test for the charge
# it receives, and loses Frenzy when an injury knocks it down; standing up does not
# regrant it.  Attack order follows core/combat-order: a charge and any strike-first
# effect share the top tier before ordinary Initiative, and a warrior that stood up
# strikes last in that turn only.  This profile declares no strike-first ability, so the
# charging opponent resolves before the bearer.  The band's printed Animosity rule is
# implemented, so the bearer tests on its own turn and a 3 passes the printed 1-fails band.

