# --- Authored scenarios ---
# Every failed To Hit roll against the bearer adds one point of Initiative penalty to the
# attacker who missed, floored at zero, and a successful parry by the bearer adds one too.
# The tape shapes mirror the canonical operator of the same effect_id, which this band origin
# repeats without adding a term.
- audit_id: rule/trollheim/lustria-savage-goblins/band--savage-goblin-special-skills-spider-infested/mechanic.spider-infested
  id: a-missed-attack-against-the-bearer-penalises-the-attacker
  covers: [whole]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: &goblin-ws3-s3-t3-w2-i5 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.spider-infested]
      characteristics: &crawler-ws3-s3-t3-w2-i2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: &charging-first {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: false, state.first.initiative_penalty: 1, state.first.initiative_floor: 0, state.second.initiative_penalty: 0}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

