# The printed profile rule is not the Unarmed Fighting skill: it keeps the printed
# Strength and Attacks and does not grant the enemy the dagger-class +1 save.  The
# profile build below is what the compiler selects for this origin.
# The fist attack resolves at the bearer's printed Strength 3, so a four wounds an
# equal Toughness 3 where a penalised unarmed attack (Strength 2) would need a five.
- audit_id: rule/mordheim/battle-monks-of-cathay/raging-peasants--unarmed/profile.fist
  id: the-profile-fist-attacks-at-its-printed-strength
  covers: [whole]
  fighters:
    first:
      collection: mordheim
      band_id: battle-monks-of-cathay
      profile_id: raging-peasants
      main_weapon_id: weapon.fist
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
