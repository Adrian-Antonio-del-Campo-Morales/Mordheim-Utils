      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.bull-charge, value: true}
  rolls:
    - {key: round.0.first.bull-charge.hit, value: 3}
  expect_rounds:
    0: {attacks.0.hit: true, state.second.condition: KNOCKED_DOWN, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
  expect_events:
    - {kind: decision, key: round.0.first.bull-charge, value: true}
    - {kind: roll, key: round.0.first.bull-charge.hit, sides: 6, value: 3}

