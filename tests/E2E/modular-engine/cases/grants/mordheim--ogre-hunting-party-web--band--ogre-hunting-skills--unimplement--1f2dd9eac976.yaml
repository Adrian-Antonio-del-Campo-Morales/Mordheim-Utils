  covers: [bull-charge]
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.bull-charge]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 2}
