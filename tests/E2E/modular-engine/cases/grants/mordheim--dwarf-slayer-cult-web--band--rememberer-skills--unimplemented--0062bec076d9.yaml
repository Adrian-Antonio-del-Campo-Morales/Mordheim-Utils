# --- Authored scenarios ---
# Derived from the printed Songster clause, the reviewed EQ-mechanic.leadership-reroll facet and the accepted
# sea-ghosts Minstrels sibling's receipt shape; no engine output was consulted.  Both fighters strike once with
# a plain mace and every declared attack die is a natural one, a miss, so the Leadership test and its reroll
# are the whole of the evidence.

- audit_id: rule/mordheim/dwarf-slayer-cult-web/band--rememberer-skills/unimplemented.dwarf-slayer-cult-web.special.rememberer-skills
  id: one-optional-reroll-turns-the-failed-leadership-test-around
  covers: [rememberer-skills--scope--leadership-reroll-aura]
  fighters:
    first:
      main_weapon_id: weapon.mace
      trait_overrides: {causes_fear: true}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 6}
    second:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.leadership-reroll]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 6}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.second.fear.charged.reroll, value: true}
  rolls:
    - {key: round.0.second.fear.charged.0, value: 6}
    - {key: round.0.second.fear.charged.1, value: 6}
    - {key: round.0.second.fear.charged.reroll.0, value: 1}
    - {key: round.0.second.fear.charged.reroll.1, value: 1}
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.fear_hit_sixes: false}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

