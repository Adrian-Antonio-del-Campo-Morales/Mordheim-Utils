# Family model (Combat Master, Dwarf Rangers printing): the bearer is the printed recipient of this
# band record, built from its own band and profile and selecting the band row named in the audit id, so
# the granted effect is what the scenario exercises.  Physical characteristics are supplied as fixture
# facts (WS3 S3 T3 W2 I2 A1) so the dice thresholds and the strike order are fixed, while the printed
# Leadership stays in place; the bearer's own attack pool is declared empty so the tape holds only the
# parry under test.  Every expectation is read from the printed rule (parries when he beats OR MATCHES
# the opponent's highest To Hit roll; two Parry weapons allow two attacks instead of the normal
# maximum of one) and the recorded contract, never from engine output; the roll tape is derived
# statically and stays unexecuted.  The printed rule of this printing has no Dwarf Axe reroll sentence,
# so no scenario asserts a reroll and every tape holds only successful parry attempts.
