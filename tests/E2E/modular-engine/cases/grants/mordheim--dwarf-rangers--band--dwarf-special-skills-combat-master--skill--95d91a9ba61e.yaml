  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      collection: mordheim
      band_id: dwarf-rangers
      profile_id: apprentice-runesmith
      special_rule_ids: [band--dwarf-special-skills-combat-master]
      main_weapon_id: weapon.sword
