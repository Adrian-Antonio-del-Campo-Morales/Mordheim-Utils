# bearer is the band Hero apprentice-runesmith, not a Henchman.  `specialRuleRestriction()`'s access
# stage admits a band warband_skill row with `applies_to.band: true` and no `eligibility` only for a
# recipient whose own printed `skill_access` carries the `special` category ("special rule is not
