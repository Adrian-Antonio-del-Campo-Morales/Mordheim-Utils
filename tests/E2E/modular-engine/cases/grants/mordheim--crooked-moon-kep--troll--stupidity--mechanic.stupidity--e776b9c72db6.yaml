# --- Authored scenarios ---
# Derived from the printed rule and the recorded semantic contract; no engine output was
# consulted.  The bearer is built from its printed profile with only the physical
# characteristics supplied as fixture facts and its printed Leadership left in place, so the
# tested value comes from the profile: a total of twelve is a certain failure (no catalogue
# Leadership reaches twelve) and a total of two a certain pass.  The opponent is supplied with
# the printed on-fire condition in the two scenarios whose point is the bearer's own
# consequence, because a burning model makes no close-combat attack and the strict tape then
# speaks about the test alone.  The bearer's strike is its ordinary attack pool: the
# printed Vomit Attack replaces the model's normal attacks only when it is declared
# (cases/mechanics/weapon.vomit-attack.yaml carries the declared and the declined
# clauses), and this scenario declares no replacement.  Pending datum: no accepted
# source fixes the default when troll--vomit-attack is undeclared, nor which weapon
# that ordinary attack uses for a profile with fixed_equipment: [].

