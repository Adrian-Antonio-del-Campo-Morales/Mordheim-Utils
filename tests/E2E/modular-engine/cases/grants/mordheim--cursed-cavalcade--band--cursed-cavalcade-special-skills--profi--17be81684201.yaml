# --- Authored scenarios ---
# Derived from the printed rule and this band's own published member rows; no engine output was consulted.

- audit_id: rule/mordheim/cursed-cavalcade/band--cursed-cavalcade-special-skills/profile.skill-access
  id: a-published-member-of-the-band-table-is-selectable
  covers: [whole]
  # The printed permission: one of these Heroes may use this list, so the band's published
  # member must be a legal selection and the engagement must start. The declared identity is
  # the band's own rule id. Both fighters declare zero attacks, so the observation is the
  # selection itself; the member's mechanic keeps its own origin.
  fighters:
    first:
      collection: mordheim
      band_id: cursed-cavalcade
      profile_id: companions
      special_rule_ids: [band--cursed-cavalcade-special-skills-torturer]
    second:
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  initial_state: {first: {attacks: 0}, second: {attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  expect_initial: {first.attacks: 0, second.attacks: 0}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

- audit_id: rule/mordheim/cursed-cavalcade/band--cursed-cavalcade-special-skills/profile.skill-access
  id: the-same-member-is-refused-for-a-thrall-the-print-excludes
  covers: [whole]
  # The printed recipient is the Hero; a Thrall carries no "special" category, so the
  # member must be refused for it. The fragment is the shared availability sentence of the
  # special-rule route.
  fighters:
    first:
      collection: mordheim
      band_id: cursed-cavalcade
      profile_id: thrall
      special_rule_ids: [band--cursed-cavalcade-special-skills-torturer]
  expect_error: "special rule is not available to cursed-cavalcade/thrall: band--cursed-cavalcade-special-skills-torturer"

- audit_id: rule/mordheim/cursed-cavalcade/band--cursed-cavalcade-special-skills/profile.skill-access
  id: a-special-skill-outside-the-printed-table-is-refused
  covers: [whole]
  # The closure of the same printed access through the list route (skill_ids). Restored
  # deliberately: its sentence is produced today by the empty member list, which is why the
  # admission tape above stands beside it as the discriminating control.
  fighters:
    first:
      collection: mordheim
      band_id: cursed-cavalcade
      profile_id: companions
      skill_ids: [skill.monster-slayer]
      main_weapon_id: weapon.mace
  expect_error: "skills are not available to cursed-cavalcade/companions: ['skill.monster-slayer']"

- audit_id: rule/mordheim/cursed-cavalcade/band--cursed-cavalcade-special-skills/profile.skill-access
  id: the-published-member-is-admitted-on-the-table-list-route
  covers: [whole]
  # R1's membership half, through the route that reads the member array: the printed permission makes
  # this band's published member a legal special selection for one of its Heroes. The declared
  # identity is the band's own published member id, because no catalogue row carries it. Today the
  # binding has no member array and the list route rejects an identity the catalogue does not carry,
  # so the build is refused with the 'skills are not available' sentence naming that very member - the
  # PENDING projection defect kept visible rather than avoided.
  fighters:
    first:
      collection: mordheim
      band_id: cursed-cavalcade
      profile_id: companions
      skill_ids: [band--cursed-cavalcade-special-skills-torturer]
      main_weapon_id: weapon.mace
    second:
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  initial_state: {first: {attacks: 0}, second: {attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  expect_initial: {first.attacks: 0, second.attacks: 0}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

- audit_id: rule/mordheim/cursed-cavalcade/band--cursed-cavalcade-special-skills/profile.skill-access
  id: a-member-of-another-bands-table-is-refused
  covers: [whole]
  # The other direction of the same table boundary: the printed permission opens THIS band's table,
  # so another band's published member is not selectable here. The declared-selection route resolves
  # the id against this band's own package rows and answers with the band-level availability sentence.
  fighters:
    first:
      collection: mordheim
      band_id: cursed-cavalcade
      profile_id: companions
      special_rule_ids: [band--amazon-special-skills-skink-hunter]
  expect_error: "special rule is not available to cursed-cavalcade: band--amazon-special-skills-skink-hunter"

