# Family model (Fungus Brew composition): the bearer is the band's printed Night Goblin Fanatics
# profile, so all its printed physical characteristics and its printed Leadership 5 stay in place and
# the doubled pool of its single printed attack is what the tape shows while the Frenzy holds.  The
# Stupidity this clause qualifies is supplied through the canonical component condition
# condition.fungus-brew-loony (Frenzy plus Stupidity), which is the supplier the record's own note
# names for the printed composition; no band grant is activated for this record, so the scenarios
# exercise the shared contracts the clause's printed consequence is carried by.  The opponent is a
# hand-built fixture, and the knock-down face uses the printed damage reaction: a wounding attack that
# takes the W1 bearer to zero wounds rolls on the injury chart, and the printed 1 knocks it down and
# clears the Frenzy.

