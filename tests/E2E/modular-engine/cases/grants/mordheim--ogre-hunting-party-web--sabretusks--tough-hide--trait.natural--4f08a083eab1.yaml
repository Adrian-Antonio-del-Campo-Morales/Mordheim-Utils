# --- Authored scenarios ---
# Derived from the printed rule and the printed profile; no engine output was consulted.
# The bearer is the profile that prints the save, and that profile prints a single Wound: an
# unsaved wound therefore takes it to zero and the Injury table follows the save step, so
# the scenarios that read a failed save declare that one injury die (a one: Knocked Down).  The attacker's Weapon Skill
# 10, Initiative 10 and Strength 3 are hand-built fixture facts, not profile values: Strength 3
# leaves the printed save unmodified and the higher Initiative with no charge declared lets the
# attacker strike first, so the bearer declares no attack of its own and the tape holds only the
# attacker's own dice.  Strength 3 against Toughness 4 wounds on a 5; the declared five is the
# printed wound, not a natural six, so no critical die precedes the armour phase.

