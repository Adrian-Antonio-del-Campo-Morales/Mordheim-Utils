- audit_id: rule/trollheim/lustria-savage-goblins/band--savage-goblin-special-skills-master-of-throwing-weapons/mechanic.master-of-throwing-weapons
  id: the-tracker-is-admitted-with-five-carried-missile-weapons
  covers: [whole]
