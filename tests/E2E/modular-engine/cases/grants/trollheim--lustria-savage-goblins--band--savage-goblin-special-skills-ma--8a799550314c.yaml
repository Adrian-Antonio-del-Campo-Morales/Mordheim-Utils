    first:
      collection: trollheim
      band_id: lustria-savage-goblins
      profile_id: trackers
      special_rule_ids: [band--savage-goblin-special-skills-master-of-throwing-weapons]
      owned_item_ids: [short_bow, short_bow, short_bow, javelin, javelin]
    second:
      collection: trollheim
      band_id: lustria-savage-goblins
      profile_id: trackers
      owned_item_ids: [short_bow]
