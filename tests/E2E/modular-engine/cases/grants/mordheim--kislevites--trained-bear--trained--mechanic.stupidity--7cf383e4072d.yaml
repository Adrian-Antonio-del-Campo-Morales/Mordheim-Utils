# --- Authored scenarios ---
# Derived from the printed rule and the recorded semantic contract; no engine output was
# consulted.  The bearer is built from its printed profile with only the physical
# characteristics supplied as fixture facts and its printed Leadership left in place, so the
# tested value comes from the profile: a total of twelve is a certain failure (no catalogue
# Leadership reaches twelve) and a total of two a certain pass.  In the two scenarios whose
# point is the bearer's own consequence the opponent is supplied with the printed on-fire
# condition, because a burning model makes no close-combat attack.

- audit_id: rule/mordheim/kislevites/trained-bear--trained/mechanic.stupidity
  id: a-failed-stupidity-test-cancels-its-charge-and-bars-its-attacks
  covers: [stupidity--scope--stupidity]
  fighters:
    first:
      collection: mordheim
      band_id: kislevites
      profile_id: trained-bear
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 1, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.stupidity.0, value: 6}
    - {key: round.0.first.stupidity.1, value: 6}
  expect_rounds:
    0: {state.first.stupidity_failed: true, state.first.condition: STANDING, state.first.wounds: 3, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: disengaged}

# The printed Trained Bear causes Fear, so the charging opponent is the model the Fear clause
# tests: its own charge-test dice are declared before the bearer's strike.
- audit_id: rule/mordheim/kislevites/trained-bear--trained/mechanic.stupidity
  id: a-passed-stupidity-test-keeps-contact-and-lets-it-strike
  covers: [stupidity--scope--stupidity]
  fighters:
    first:
      collection: mordheim
      band_id: kislevites
      profile_id: trained-bear
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 1, attacks: 1, leadership: 7}
  initial_state:
    second: {on_fire: true}
  duel_context: {charging: [second], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.stupidity.0, value: 1}
    - {key: round.0.first.stupidity.1, value: 1}
    - {key: round.0.second.fear.charge.0, value: 1}
    - {key: round.0.second.fear.charge.1, value: 1}
    - {key: round.0.first.attack.0.hit, value: 5}
    - {key: round.0.first.attack.0.wound, value: 5}
  expect_rounds:
    0: {state.first.stupidity_failed: false, state.first.condition: STANDING, state.first.wounds: 3, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# Being Frenzied removes the Stupidity die; the charging opponent's Fear test against this
