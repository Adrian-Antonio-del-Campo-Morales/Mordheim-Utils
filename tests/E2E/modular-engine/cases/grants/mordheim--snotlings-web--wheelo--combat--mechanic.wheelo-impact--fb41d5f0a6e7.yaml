# Printed rule text:
#   The statline above represents the stats of the Wheelo's Crew members, who pull out built-in weapons and hide behind wooden armour. If the Wheelo rolls into an opponent, it counts as a charge, and the crew will fight in each hand-to-hand combat phase as normal. If the Wheelo is charged by an opponent, they will likewise fight, although without the Impact Hit bonus. If the Wheelo accidentally rolls into a friendly model, that model suffers Impact Hits (see above), but the crew will not attack the model. If the Wheelo rolls into a Fear-causing opponent, it still counts as a charge (and the model still suffers Impact Hits), but the crew must pass a Leadership Test, otherwise they will not hit on anything but 6s.
