# --- Authored scenarios ---
# Derived from the printed rule text, the recorded contract and the admitted semantic
# specifications; no engine output was consulted.  The assailant is a hand-built fixture
# (Weapon Skill 10, Strength 8) whose close-combat hit of 4 and wound of 2 cannot fail
# against the Toughness-3 bearer, so the only undecided step of the attack is the special
# save itself.  Both warriors strike with their printed single Attack and the bearer's own
# strike is declared as a natural 1, so the round reports nothing else; the strict tape
# consumes exactly the declared dice, so a save the engine still asked for without the rule
# (or an extra sequential save roll for the Step Aside combination) fails the case instead
# of passing quietly.

