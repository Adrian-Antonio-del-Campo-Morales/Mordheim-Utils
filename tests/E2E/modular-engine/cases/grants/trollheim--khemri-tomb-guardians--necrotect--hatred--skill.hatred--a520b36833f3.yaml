# --- Authored scenarios ---
# Derived from the printed rule, the printed Necrotect profile of this band and the recorded contract; no
# engine output was consulted.  The vehicle is the first close-combat round's To-Hit roll of the bearer,
# whose printed reroll accepts its second result; the enemy is a hand-built fixture that declares its own
# facts and, in tapes 1 and 3, carries no enemy identity at all.  The declared miss 2 is below the WS 3
# against WS 3 to-hit target of 4, and the rerolled 4 is the printed second result the rule says must be
# accepted.

# The printed unconditional offer, with no enemy identity supplied: the reroll lands, wounds and removes a
# wound.  A consumer that requires a hated identity tag offers no reroll at all and fails here.
- audit_id: rule/trollheim/khemri-tomb-guardians/necrotect--hatred/skill.hatred
  id: a-first-round-miss-is-rerolled-against-an-enemy-without-a-hated-identity
  covers: [first-round-reroll]
  fighters:
    first: {collection: trollheim, band_id: khemri-tomb-guardians, profile_id: necrotect}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.fear.charged.0, value: 3}
    - {key: round.0.second.fear.charged.1, value: 3}
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.first.attack.0.hit.reroll, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: true, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

