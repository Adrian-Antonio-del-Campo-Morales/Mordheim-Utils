# The printed first-round-only term.  Round 0 rerolls the same miss; round 1 declares the same miss and no
# reroll die at all, so an engine that offers the reroll in the second round of the same close combat fails
# this strict tape instead of passing quietly.  Both sides miss in round 1, so the attacked warrior keeps
# the wound it lost in round 0.
