# --- Authored scenarios ---
# Derived from the printed rule ("All of Zomblintua's attacks count as if they were made with a
# blunt weapon") and the recorded contract (counts_as blunt weapon, concussion true), whose
# register note records that the origin binds the shared mace profile: the blunt term is the
# mace's concussion operator, which re-reads an injury total of two as Stunned.  The printed
# bearer never uses weapons or armour, so its attack is its own natural one and the fixture
# gives it the fist identity; the paired control repeats the same natural strike on a hand-built
# fighter that does not carry the rule.  Both tapes are fixed by their declared dice: the
# trigger declares no armour die, because the blunt substitution replaces the unarmed attack's
# own improved target save with the mace's plain one, and the control's unarmed strike declares
# the target save the fist prints.  If the engine instead keeps the fist's target save on the
# bearer, the trigger fails on an undeclared armour die, and that difference is the finding.

