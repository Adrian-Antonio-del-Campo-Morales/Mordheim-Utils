# --- Authored scenarios ---
# Family model (fen hard-to-kill): the bearer is the printed Dryads profile of this band and the
# band rule is supplied through its printed rule key, so the granted chart is what the scenarios
# exercise.  The fixture attacker is hand-built with the printed mace and fixed facts (Weapon Skill
# 10, Strength 8, Initiative 10) and the bearer starts the duel at its printed single wound with no
# attack pool, so the tape holds only the attacker's own dice and no injury roll is ambiguous.  The
# wound face is four, below a natural six, so no critical die is requested.  Every expectation is
# read from the printed rule and the recorded contract, never from engine output.

# The printed chart takes 1-2 as knocked down and 3-5 as stunned, so a five that the ordinary chart
# would take out leaves this bearer Stunned instead.
- audit_id: rule/mordheim/fen-guard-mim/band--hard-to-kill/mechanic.fen-hard-to-kill
  id: a-five-only-stuns-the-fen-bearer
  covers: [out-of-action-only-on-six]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 10, strength: 8, toughness: 3, wounds: 3, initiative: 10, attacks: 1}
    second:
      collection: mordheim
      band_id: fen-guard-mim
      profile_id: dryads
      main_weapon_id: weapon.mace
  initial_state: {second: {wounds: 1, attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.injury.0, value: 5}
  expect_rounds:
    0: {state.second.wounds: 0, state.second.condition: STUNNED}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

