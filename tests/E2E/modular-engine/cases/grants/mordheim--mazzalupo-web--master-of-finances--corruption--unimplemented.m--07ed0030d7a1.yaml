- audit_id: rule/mordheim/mazzalupo-web/master-of-finances--corruption/unimplemented.mazzalupo-web.master-of-finances.corruption
  id: the-successful-enemy-attack-is-taken-again-and-its-second-result-accepted
  covers: [corruption--scope--attack-reroll]
  # The admitted consequence: a hitting enemy re-rolls one successful attack.  The enemy's successful attack is
  # declared (4 hits), the forced second result is declared on that attack's own `.hit.reroll` die (1, a miss),
  # and the asserted outcome is the printed one - the attack is lost, so the corrupting duelist takes no wound.
  # The re-roll die belongs to the enemy attack's key under the enemy side's prefix, the mirror of the key the
  # accepted hit-re-roll tapes of this corpus declare; the tape fails on an unrequested die until the forced
  # re-take has a consumer, which is the PENDING implementation defect, not a withheld requirement.
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      collection: mordheim
      band_id: mazzalupo-web
      profile_id: master-of-finances
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.hit.reroll, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: False, attacks.0.damage: 0}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
