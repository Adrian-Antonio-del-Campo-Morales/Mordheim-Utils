# --- Authored scenarios ---
# Derived from the printed rule, the recorded semantic contract and the band binding's own member
# list; no engine output was consulted.  Both fighters are given zero attacks so the round resolves
# without dice and the observation is about admission, not about the member's mechanics.

- audit_id: rule/mordheim/adventurers-kaz/band--elf-special-skills/profile.skill-access
  id: the-declared-table-member-is-admitted-to-the-recipient
  covers: [whole]
  # The printed permission is the required behaviour: selecting a declared member of the Elf table
  # admitted to the recipient, so the build must compile and the engagement must start.  Both
  # fighters declare zero attacks, so the observation is admission itself and no member mechanic is
  # asserted here.  The build is refused today by compiler.py's legality/executable-support branch
  # ("named skills have no executable duel mechanic"), an implementation gap: the missing capability
  # is skill.fey-quickness's duel operator.  The expectation is deliberately NOT that diagnostic.
  fighters:
    first:
      collection: mordheim
      band_id: adventurers-kaz
      profile_id: elf
      skill_ids: [skill.fey-quickness]
    second:
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  initial_state: {first: {attacks: 0}, second: {attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  expect_initial: {first.attacks: 0, second.attacks: 0}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

- audit_id: rule/mordheim/adventurers-kaz/band--elf-special-skills/profile.skill-access
  id: a-special-skill-outside-the-printed-table-is-refused
  covers: [whole]
  fighters:
    first:
      collection: mordheim
      band_id: adventurers-kaz
      profile_id: elf
      skill_ids: [skill.monster-slayer]
      main_weapon_id: weapon.mace
  expect_error: "skills are not available to adventurers-kaz/elf: ['skill.monster-slayer']"
