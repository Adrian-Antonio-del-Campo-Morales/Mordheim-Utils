# --- Authored scenarios ---
# Derived from the printed rule and the recorded contract; no engine output was consulted.  The
# bearer is a hand-built fixture carrying the printed trait, because the clause is about the wound the
# bearer loses rather than about one printed statline.  The attacker is unarmoured, so the printed
# Strength 3 hit needs only its wound face, and the wound totals are chosen per tape - three each where
# only the one-damage reaction and the bearer's own lost wound are at stake, and four on the attacker
# in the critical-boundary tape so the two damage a critical would deal is a different number on the
# same assertion - so no victim reaches zero and no injury roll joins the evidence.

- audit_id: rule/mordheim/cult-of-the-possessed/band--mutations-blackblood/trait.acid-blood
  id: an-unsaved-wound-answers-with-the-printed-strength-three-hit
  covers: [whole--scope--acid-blood]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      trait_overrides: {acid_blood: true}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.acid-blood.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 1, state.first.wounds: 2, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

