# --- Authored scenarios ---
# Family model (Hatred against every enemy): the bearer is the printed Strigoi Vampire built from its
# band profile; its physical characteristics are supplied as fixture facts (WS3 S3 T3 W2 I5 A1) so the
# dice thresholds and the strike order are fixed, and its printed Leadership stays in place.  The
# recorded grant is selectable, so the bearer declares the selection that activates it.  A natural 2
# misses against WS3, the reroll is taken on a 4+ and the wound rolls a 4+, so the reroll is exactly
# what the tape shows.  The first opponent declares no identity fact at all and the third declares a
