# --- Authored scenarios ---
# Derived from the printed sentence, the catalogue's injury table and the printed recipient profile; no engine
# output was consulted.  The bearer's physical characteristics are declared fixture facts, so the wound
# threshold and the declared injury face are the only things that decide the result, and the pair differs only
# in the printed +1.

- audit_id: rule/mordheim/carnival-of-chaos/plague-cart--plague-cart/unimplemented.carnival-of-chaos.plague-cart.plague-cart
  id: the-printed-plus-one-turns-a-stunned-result-into-out-of-action
  covers: [plague-cart--scope--individual-effects]
  # The printed recipient (a Plague Bearer) inflicts the wound, the declared injury face is four (stunned on
  # the catalogue's table), and the printed +1 raises it to five, which is out of action.  Today the binding
  # records no effect id and no consumer, so the tape reads the unshifted result (stunned) - the PENDING
  # implementation defect this tape is written to detect, not a withheld requirement.
  fighters:
    first:
      collection: mordheim
      band_id: carnival-of-chaos
      profile_id: plague-bearers
      characteristics: {weapon_skill: 4, strength: 4, toughness: 4, wounds: 2, initiative: 4, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.injury.0, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 1, state.second.wounds: 0, state.second.condition: OUT}
  expect_final: {rounds_executed: 1, termination_reason: second_out}

- audit_id: rule/mordheim/carnival-of-chaos/plague-cart--plague-cart/unimplemented.carnival-of-chaos.plague-cart.plague-cart
  id: the-same-face-leaves-a-stunned-result-without-the-modifier
  covers: [plague-cart--scope--individual-effects]
  # The control: the same declared wound and the same declared injury face of four, inflicted by a plain
  # fighter with the same physical characteristics instead of the printed recipient, so no +1 applies and the
  # catalogue's table leaves the victim stunned.  The pair is what makes the shifted result attributable to
  # the printed sentence rather than to the injury table.
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 4, strength: 4, toughness: 4, wounds: 2, initiative: 4, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.injury.0, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 1, state.second.wounds: 0, state.second.condition: STUNNED}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
