  id: the-snotling-mob-counts-as-one-model-with-one-block
  covers: [single-model-projection]
  # The printed projection: however many Snotlings the Mob depicts, it is ONE duelist with one
  # characteristic block.  The band's own profile prints Wounds 3 and Attacks 3 in a single block, and the
  # declared strict tape consumes exactly three attack entries from that one fighter.
  fighters:
    first:
      collection: mordheim
      band_id: snotlings-web
      profile_id: snotling-mobs
    second:
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 1, attacks: 1}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.first.attack.1.hit, value: 1}
    - {key: round.0.first.attack.2.hit, value: 1}
