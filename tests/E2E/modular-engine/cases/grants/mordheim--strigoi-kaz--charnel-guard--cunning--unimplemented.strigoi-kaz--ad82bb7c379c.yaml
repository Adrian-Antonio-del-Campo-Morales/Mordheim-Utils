# --- Authored scenarios ---
# Derived from the printed rows of this band's special-rules.yaml, the recipient's recorded profile
# (profiles.yaml: charnel-guard) and the admitted catalogue rows the printed skills name
# (catalog/skills/general.yaml); no engine output was consulted.  The skill is supplied through the
# fixture's declared skill selection and the weapon through its declared weapon slot - both existing
# channels, exactly as the corpus's other construction-access tapes use them.

- audit_id: rule/mordheim/strigoi-kaz/charnel-guard--cunning/unimplemented.strigoi-kaz.charnel-guard.cunning
  id: the-trained-charnel-guard-may-use-a-weapon-outside-its-ordinary-allowance
  covers: [weapons-training-permission]
  # The printed permission is the required behaviour: a Charnel Guard that has taken Weapons Training may
  # use weapons outside its ordinary allowance, so the build must compile and the engagement must start.
  # Its recorded ordinary allowance is the bones it fights with, and the profile's unconditional
  # equipment ban is what the printed sentence carves the exception into; the expectation is deliberately
  # NOT that ban's refusal.
  fighters:
    first:
      collection: mordheim
      band_id: strigoi-kaz
      profile_id: charnel-guard
      skill_ids: [skill.weapons-training]
      main_weapon_id: weapon.mace
    second:
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  initial_state: {first: {attacks: 0}, second: {attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  expect_initial: {first.attacks: 0, second.attacks: 0}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

- audit_id: rule/mordheim/strigoi-kaz/charnel-guard--cunning/unimplemented.strigoi-kaz.charnel-guard.cunning
  id: the-printed-missile-skill-is-admitted-to-a-charnel-guard
  covers: [weapons-expert-missile-access]
  # skill.weapons-expert is a registered shooting row, and the recipient's recorded skill_access is
  # combat / strength / speed, so this build is admitted only by the printed exception.  The expectation
  # is that printed permission, not the refusal a missing binding would produce today.
  fighters:
    first:
      collection: mordheim
      band_id: strigoi-kaz
      profile_id: charnel-guard
      skill_ids: [skill.weapons-expert]
      main_weapon_id: weapon.pistol
    second:
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  initial_state: {first: {attacks: 0}, second: {attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  expect_initial: {first.attacks: 0, second.attacks: 0}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

- audit_id: rule/mordheim/strigoi-kaz/charnel-guard--cunning/unimplemented.strigoi-kaz.charnel-guard.cunning
  id: a-shooting-skill-that-is-not-weapons-expert-is-refused
  covers: [weapons-expert-missile-access]
  # The closure of the printed exception: a different shooting skill is not available to this recipient,
  # whose recorded access carries no shooting category.  The declared fragment is the shared
  # skill-availability sentence of this corpus's access family, so the tape does not read the printed
  # exception as general shooting access.
  fighters:
    first:
      collection: mordheim
      band_id: strigoi-kaz
      profile_id: charnel-guard
      skill_ids: [skill.quick-shot]
  expect_error: "skills are not available to strigoi-kaz/charnel-guard: ['skill.quick-shot']"
