# --- Authored scenarios ---
# Derived from the printed sentence, the recorded contract and the printed profile; no engine
# output was consulted.  The bearer prints the rule, starts the duel at two Wounds and contributes
# no attacks of its own, so round 0 carries only the attacker's dice.  The blow is an ordinary mace:
# at Weapon Skill 10 against Weapon Skill 3 it needs a 3, and Strength 8 against Toughness 4 needs
# a 2, so the declared 5 and 5 both pass.  Five is deliberately below a natural six, which would be
# a critical hit and demand a further critical die.  An unarmoured bearer keeps the armour step and,
# with no ward, the special save is reached directly.
#
# The strict tape is part of the evidence rather than decoration: StrictDice rejects a roll the
# fixture never declared, so the third scenario fails if the engine requests a Regeneration die
# against a fire attack, and the first fails if it requests none.

