# --- Authored scenarios ---
# Derived from the printed rules and this band's own published member rows; no engine output was consulted.
# Both fighters in each running tape declare zero attacks, so the observation is the access itself and not
# a member's own duel consequence - each member keeps its own origin.  Where a member's own row is
# deferred, the admitted half is asserted as that member's deferred refusal class instead of a run.

- audit_id: rule/mordheim/battle-monks-of-cathay/band--battle-monks-special-skills/profile.skill-access
  id: the-emissary-is-admitted-to-the-warmonger-skill
  covers: [emissary-limit]
  # The printed narrowing: the Warmonger skill is the one the Emissary may take. The declared
  # identity is the band's own published rule id whose recorded eligibility is exactly
  # [emissary], so the recipient stage admits the Emissary and the refusal that follows is the
  # member's own deferred sentence (scope LATER / implemented NO, "Deferred subsystem:
  # psychology") - never the availability sentence its sibling tape receives. That class is the
  # admission this clause can observe; the member's effect stays its own requirement.
  fighters:
    first:
      collection: mordheim
      band_id: battle-monks-of-cathay
      profile_id: emissary
      special_rule_ids: [band--battle-monks-special-skills-warmonger]
  expect_error: "special rule is outside the executable duel runtime: band--battle-monks-special-skills-warmonger"

- audit_id: rule/mordheim/battle-monks-of-cathay/band--battle-monks-special-skills/profile.skill-access
  id: the-emissary-cannot-take-another-member-of-the-table
  covers: [emissary-limit]
  # The printed second half: the Emissary may only pick the Warmonger skill, so a sibling
  # member is refused for it. The fragment is the shared availability sentence, raised from
  # that member's own recorded eligibility [dragon-monks], which agrees with the printed
  # narrowing.
  fighters:
    first:
      collection: mordheim
      band_id: battle-monks-of-cathay
      profile_id: emissary
      special_rule_ids: [band--battle-monks-special-skills-energy-focus]
  expect_error: "special rule is not available to battle-monks-of-cathay/emissary: band--battle-monks-special-skills-energy-focus"

- audit_id: rule/mordheim/battle-monks-of-cathay/band--battle-monks-special-skills/profile.skill-access
  id: a-published-member-of-the-band-table-is-selectable
  covers: [whole]
  # The table's printed permission: the Monks may use this list, so its published member
  # must be a legal selection for its printed recipient and the engagement must start.
  # Both fighters carry a sword so the declared zero Attacks is not replaced by the
  # printed unarmed attack; the observation stays the access itself.
  fighters:
    first:
      collection: mordheim
      band_id: battle-monks-of-cathay
      profile_id: dragon-monks
      special_rule_ids: [band--battle-monks-special-skills-energy-focus]
      main_weapon_id: weapon.sword
    second:
      main_weapon_id: weapon.sword
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  initial_state: {first: {attacks: 0}, second: {attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  expect_initial: {first.attacks: 0, second.attacks: 0}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

- audit_id: rule/mordheim/battle-monks-of-cathay/band--battle-monks-special-skills/profile.skill-access
  id: the-same-member-is-refused-for-a-henchman-the-print-excludes
  covers: [whole]
  # The printed recipient is the monk profile the member's own eligibility names; a Henchman
  # carries no "special" category, so the member must be refused for it.
  fighters:
    first:
      collection: mordheim
      band_id: battle-monks-of-cathay
      profile_id: soldiers
      special_rule_ids: [band--battle-monks-special-skills-energy-focus]
  expect_error: "special rule is not available to battle-monks-of-cathay/soldiers: band--battle-monks-special-skills-energy-focus"

- audit_id: rule/mordheim/battle-monks-of-cathay/band--battle-monks-special-skills/profile.skill-access
  id: a-special-skill-outside-the-printed-table-is-refused
  covers: [whole]
  # The closure of the same printed access through the list route (skill_ids). Restored
  # deliberately: its sentence is produced today by the empty member list, which is why the
  # admission tape above stands beside it as the discriminating control.
  fighters:
    first:
      collection: mordheim
      band_id: battle-monks-of-cathay
      profile_id: emissary
      skill_ids: [skill.monster-slayer]
      main_weapon_id: weapon.sword
  expect_error: "skills are not available to battle-monks-of-cathay/emissary: ['skill.monster-slayer']"

- audit_id: rule/mordheim/battle-monks-of-cathay/band--battle-monks-special-skills/profile.skill-access
  id: the-published-member-is-admitted-on-the-table-list-route
  covers: [whole]
  # R1's membership half, through the route that reads the member array: the printed permission makes
  # this band's published member a legal special selection for a Dragon Monk. The declared identity is
  # the band's own published member id, because no catalogue row carries it. Today the binding has no
  # member array and the list route rejects an identity the catalogue does not carry, so the build is
  # refused with the 'skills are not available' sentence naming that very member - the PENDING
  # projection defect kept visible rather than avoided.
  fighters:
    first:
      collection: mordheim
      band_id: battle-monks-of-cathay
      profile_id: dragon-monks
      skill_ids: [band--battle-monks-special-skills-energy-focus]
      main_weapon_id: weapon.mace
    second:
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  initial_state: {first: {attacks: 0}, second: {attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  expect_initial: {first.attacks: 0, second.attacks: 0}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

- audit_id: rule/mordheim/battle-monks-of-cathay/band--battle-monks-special-skills/profile.skill-access
  id: a-member-of-another-bands-table-is-refused
  covers: [whole]
  # The other direction of the same table boundary: the printed permission opens THIS band's table,
  # so another band's published member is not selectable here. The declared-selection route resolves
  # the id against this band's own package rows and answers with the band-level availability sentence.
  fighters:
    first:
      collection: mordheim
      band_id: battle-monks-of-cathay
      profile_id: dragon-monks
      special_rule_ids: [band--amazon-special-skills-skink-hunter]
  expect_error: "special rule is not available to battle-monks-of-cathay: band--amazon-special-skills-skink-hunter"

