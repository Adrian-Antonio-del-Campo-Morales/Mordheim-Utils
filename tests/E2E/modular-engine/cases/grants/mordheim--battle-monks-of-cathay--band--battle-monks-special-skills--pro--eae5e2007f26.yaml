# --- Authored scenarios ---
# Derived from the printed rule and the recorded semantic contract; no engine output was consulted.
# Both fighters are given zero attacks so the round resolves without dice and the observation is
# about access, not about the skill's mechanics.

- audit_id: rule/mordheim/battle-monks-of-cathay/band--battle-monks-special-skills/profile.skill-access
  id: the-emissary-may-take-the-warmonger-skill
  covers: [emissary-limit]
  # The printed narrowing is the required behaviour: the single Warmonger skill it allows the Emissary
  # must be admitted, so the build must compile and the engagement must start.  Both fighters declare
  # zero attacks, so the observation is admission itself and no skill mechanic is asserted here.  The
  # build is refused today by compiler.py's legality/executable-support branch ("named skills have no
  # executable duel mechanic"), an implementation gap and not a rule outcome.
  fighters:
    first:
      collection: mordheim
      band_id: battle-monks-of-cathay
      profile_id: emissary
      skill_ids: [skill.warmonger]
      main_weapon_id: weapon.natural-attacks
    second:
      main_weapon_id: weapon.natural-attacks
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  initial_state: {first: {attacks: 0}, second: {attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  expect_initial: {first.attacks: 0, second.attacks: 0}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

- audit_id: rule/mordheim/battle-monks-of-cathay/band--battle-monks-special-skills/profile.skill-access
  id: a-special-skill-outside-the-band-table-is-refused
  covers: [whole]
  fighters:
    first:
      collection: mordheim
      band_id: battle-monks-of-cathay
      profile_id: emissary
      skill_ids: [skill.monster-slayer]
  expect_error: "skills are not available to battle-monks-of-cathay/emissary: ['skill.monster-slayer']"
