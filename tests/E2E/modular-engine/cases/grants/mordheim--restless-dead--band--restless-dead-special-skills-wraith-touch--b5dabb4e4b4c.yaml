# --- Authored scenarios ---
# The bearer is the band's own Liche with a lost wound (its printed total is four).  It
# declares the Wraith Touch, so its pool is one unarmed attack that wounds automatically:
# the tape carries the To Hit die and no To Wound die at all, and the Liche's own wound
# is restored by one.
- audit_id: rule/mordheim/restless-dead/band--restless-dead-special-skills-wraith-touch/mechanic.wraith-touch
  id: the-declared-wraith-touch-wounds-automatically-and-the-liche-regains-a-wound
  covers: [whole]
  fighters:
    first: {collection: mordheim, band_id: restless-dead, profile_id: liche}
    second:
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1}
  initial_state: {first: {wounds: 1}, second: {attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.wraith-touch, value: true}
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
  expect_rounds:
    0: {attacks.0.wounded: True, attacks.0.damage: 1, state.second.wounds: 2,
        state.first.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
