# --- Authored scenarios ---
# "The Sneaky may declare one of its attacks Unpredictable; that attack cannot be parried": the declaration
# is the registered decision key and the defender carries a buckler, so the offered-and-refused parry is
# observable as the absent parry die and the unspent attempt.  The tape mirrors the authored sibling of the
# same effect_id and supplies the canonical operator id directly.
- audit_id: rule/trollheim/khemri-hobgoblin-raiders/sneaky--unpredictable/mechanic.unpredictable-attack
  id: a-declared-attack-cannot-be-parried
  covers: [whole]
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.unpredictable-attack]
      characteristics: &sneaky-ws3-s3-t3-w2-i5 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      off_hand_id: defence.buckler
      characteristics: &defender-ws3-s3-t3-w2-i2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: &charging-first {charging: [first], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.unpredictable-attack.0, value: true}
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.parried: false, state.second.parries_remaining: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

