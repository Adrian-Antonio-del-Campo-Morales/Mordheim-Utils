# Family model (Master of Blades, Chaos Streets printing of the same skill as the clan Angrund row):
# the bearer is the printed recipient of this band record, built from its own collection, band and
# profile and selecting the band row named in the audit id, so the granted effect is what the scenario
# exercises.  Physical characteristics are supplied as fixture facts (WS3 S3 T3 W2 I2 A1) so the dice
# thresholds and the strike order are fixed, while the printed Leadership stays in place; the bearer's
# own attack pool is declared empty so the tape holds only the parry under test.  Every expectation is
# read from the printed rule (parries when his roll equals or exceeds the opponent's highest To Hit
# roll; two Parry weapons allow two attempts against the two highest attack rolls; two Dwarf Axes may
# also re-roll failed parries) and the recorded contracts, never from engine output; the roll tape is
# derived statically and stays unexecuted.  The two identity rows of this printing share the same
# behaviour; the sword-master record is authored here and its sibling unbeatable-warrior row is
# authored separately in this directory.

