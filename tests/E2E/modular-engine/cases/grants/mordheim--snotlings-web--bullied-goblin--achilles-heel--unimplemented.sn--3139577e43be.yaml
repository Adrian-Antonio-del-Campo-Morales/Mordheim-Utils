- audit_id: rule/mordheim/snotlings-web/bullied-goblin--achilles-heel/unimplemented.snotlings-web.special.achilles-heel
  id: a-natural-six-to-wound-is-critical-against-toughness-five
  covers: [criticals-and-charge--scope--criticals-on-six]
  # The printed half: "Your Snotling always causes Critical Hits on rolls of 6 (when wounding) regardless
  # of opponent's toughness".  The bearer is the band's own Snotling profile whose printed Strength 2 makes
  # the required To-Wound target six against the declared Toughness 5 - exactly the case the core contract
  # excludes from criticals and this printed rule re-admits.  The strict tape declares the wound face of
  # six and the critical-chart die; a basic chart result of one leaves the printed damage of two.
  # PENDING[B] the consumer that re-admits the natural six as a critical when the required target is
  # already six (the row's binding mechanic.achilles-heel is present, so the gap is behaviour).
  fighters:
    first:
      collection: mordheim
      band_id: snotlings-web
      profile_id: bigsnotz
      special_rule_ids: [bullied-goblin--achilles-heel]
    second:
      characteristics: {weapon_skill: 3, strength: 3, toughness: 5, wounds: 3, initiative: 1, attacks: 1}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
