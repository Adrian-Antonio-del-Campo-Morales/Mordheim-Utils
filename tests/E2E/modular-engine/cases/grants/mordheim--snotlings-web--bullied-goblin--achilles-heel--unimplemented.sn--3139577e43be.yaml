    - {key: round.0.first.attack.0.wound, value: 6}
    - {key: round.0.first.attack.0.critical, value: 1}
  expect_rounds:
    0: {attacks.0.critical: True, attacks.0.damage: 2, state.second.wounds: 1, state.second.condition: STANDING}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

