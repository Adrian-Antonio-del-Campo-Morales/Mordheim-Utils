# --- Authored scenarios ---
# Derived from the printed rule and the catalog's own supplied-charge condition; no engine output was
# consulted.  The Knight Errant is read from its printed profile (Ld 7, A 1, I 3); the enemy is a
# hand-built fear-causing warrior, so the charge's psychology half is exactly the printed "fear tests
# ... that would prevent them from charging".  Every strike is declared as a natural 1, so no wound,
# save or injury die is ever needed.  Leadership tests are 2d6 against Leadership: the release test
# passes on 3+4 (7, the exact boundary) and fails on 6+6; the fear test passes on 3+2 (5).

# The psychology exemption: the compelled charge carries no fear die at all.  In the control the same
# charge without the supplied condition owes the ordinary round.0.first.fear.charge test, so the pair
# separates the exemption (which belongs to the compelled charge) from fear-free charging.
- audit_id: rule/mordheim/bretonnian-chapel-guard/knights-errant--impetuous/unimplemented.bretonnian-chapel-guard.knights-errant.impetuous
  id: the-compelled-charge-passes-the-fear-gate-without-a-die
  covers: [impetuous-charge-psychology]
  fighters:
    first:
      collection: mordheim
      band_id: bretonnian-chapel-guard
      profile_id: knights-errant
      condition_ids: [condition.impetuous-charge]
    second:
      trait_overrides: {causes_fear: true}
      characteristics: {weapon_skill: 8, strength: 8, toughness: 3, wounds: 3, initiative: 1, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.impetuous-avoid-compulsion, value: false}
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.wounds: 1, state.first.condition: STANDING, state.second.wounds: 3, state.second.condition: STANDING, state.first.fear_hit_sixes: false}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

