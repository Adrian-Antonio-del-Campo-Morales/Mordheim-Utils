# --- Authored scenarios ---
# Derived from the printed rule ("Saurus Heroes only.  Enemy models in base contact with the
# Hero suffer -1 To Hit during the first round of close combat") and the recorded contract
# (hit_modifier -1, first round only, base-contact enemies).  The bearer is the printed
# recipient with the rule selected through the band grant, and the opponent is a hand-built
# Weapon Skill 3 fixture: its ordinary target against Weapon Skill 4 is a four, so the
# declared five is reachable only through the penalty and the declared four is the boundary.
# The pair in which the bearer is taken Out of Action carries no dice for the bearer's own
# attacks, because a warrior removed from action does not strike back; the boundary scenario
# declares the bearer's weapon attack and the printed bite that always strikes last, both of
# which miss on a natural one.  Note for execution: the compiled extra bite of the Saurus
# Totem Warrior is tagged rule.bite-attack by the compiler while the engine's separate
# last-strike pool is keyed off rule.strikes-last-bite, so the pool label of that bite is the
# single sharpest assumption in this file; a failure there exposes the label, not the rule.

