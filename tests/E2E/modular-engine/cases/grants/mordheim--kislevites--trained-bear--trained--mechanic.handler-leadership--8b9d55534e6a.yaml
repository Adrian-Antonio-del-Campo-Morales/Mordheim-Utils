# The animal's own printed Leadership 3 would fail a total of eight, but the supplied handler value 8
# is the one tested, so the charge and the attacks stand.
- audit_id: rule/mordheim/kislevites/trained-bear--trained/mechanic.handler-leadership
  id: the-supplied-bear-tamer-value-is-the-one-tested
  covers: [handler-leadership--scope--stupidity]
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.handler-leadership]
      trait_overrides: {stupidity: true, stupidity_leadership: 8}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 3}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.stupidity.0, value: 4}
    - {key: round.0.first.stupidity.1, value: 4}
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.stupidity_failed: False, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
