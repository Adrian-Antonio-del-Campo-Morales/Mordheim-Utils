# Strength 4 is a fixture fact, so the wound threshold is the printed five.

- audit_id: rule/mordheim/dwarf-slayer-cult-web/rememberer--rememberer/unimplemented.dwarf-slayer-cult-web.rememberer.rememberer
  id: the-supplied-rememberer-rerolls-a-failed-to-hit-roll
  covers: [once-per-game-reroll-aura]
  # The printed benefit: a Slayer Hero fighting a Toughness 5 creature and within six inches of the Rememberer
  # may re-roll any failed To Hit rolls.  The declared miss of two is taken again on a four, which lands the
  # hit; the bearer's declared Strength 4 against the printed Toughness 5 makes the wound face five and the
  # damage one.  The `.hit.reroll` die is the corpus's own hit-re-roll route (the accepted axe-expert and Luck
  # tapes declare the same key), so the tape fails on an unrequested die until the rule's null binding is
  # projected - the PENDING implementation defect, not a withheld requirement.  The printed "once only" limit
  # and the Large-creature half of the gate are recorded in the clause marker above.
  fighters:
    first:
      collection: mordheim
      band_id: dwarf-slayer-cult-web
      profile_id: giant-slayer
      characteristics: {weapon_skill: 5, strength: 4, toughness: 4, wounds: 1, initiative: 3, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 5, wounds: 2, initiative: 2, attacks: 1}
  duel_context:
    charging: []
    active_participant: first
    nearby:
      - participant_id: rememberer
        side_id: first
        condition: standing
        fighter: {collection: mordheim, band_id: dwarf-slayer-cult-web, profile_id: rememberer}
    distances:
      - [first, rememberer, 6]
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.first.attack.0.hit.reroll, value: 4}
    - {key: round.0.first.attack.0.wound, value: 5}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: True, attacks.0.wounded: True, attacks.0.damage: 1, state.second.wounds: 1}
