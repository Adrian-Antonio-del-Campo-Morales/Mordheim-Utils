# --- Authored scenarios ---
# Derived from the printed sentence, the printed profiles and the recorded contract; no engine output was
# consulted.  The Rememberer is supplied as a nearby same-side participant (a snapshot fact, never a third
# combatant), which is the form this origin's scope review admits; the opponent's Toughness 5 is the printed
