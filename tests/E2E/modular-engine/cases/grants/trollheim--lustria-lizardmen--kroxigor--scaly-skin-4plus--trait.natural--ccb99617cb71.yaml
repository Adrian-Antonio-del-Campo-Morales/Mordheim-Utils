# --- Authored scenarios ---
# Derived from the printed rule, the recorded semantic contract of each clause
# and the band package; no engine output was consulted.  The duel is uncharged
# (`charging: []`) and the attacker holds the higher Initiative, so the only
# Strength modifier reaching the defender's save is the attacker's own Strength
# and the attacker's pool always resolves first.  A recipient that survives the
# incoming attack still strikes back, so its own attack is scripted as a miss.

