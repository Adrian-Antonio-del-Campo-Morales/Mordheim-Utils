# The control: the same duel and the same declared dice without the blessing row, where the single
# Wound is taken away and the injury chart resolves.
- audit_id: rule/mordheim/carnival-of-chaos/band--blessings-of-nurgle-mark-of-nurgle/special-rule.band--blessings-of-nurgle-mark-of-nurgle
  id: without-the-mark-the-same-wound-takes-the-bearer-out-of-the-round
  covers: [whole]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 10, strength: 3, toughness: 3, wounds: 3, initiative: 10, attacks: 1}
    second:
      collection: mordheim
      band_id: carnival-of-chaos
      # A Tainted One cannot legally be built without a Blessing, so the unmarked control
      # is another model of the same band with the same supplied characteristics.
      profile_id: brethren
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 2, attacks: 1}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.injury.0, value: 1}
  expect_initial: {second.wounds: 1}
  expect_rounds:
    0: {attacks.0.wounded: true, state.second.wounds: 0, state.second.condition: KNOCKED_DOWN}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

