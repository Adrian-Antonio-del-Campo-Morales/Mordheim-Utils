# --- Authored scenarios ---
# Derived from the printed rule, the recorded cause-fear contract and the printed profile;
# no engine output was consulted.  The causer charges, so the warrior it charged is the
# Fear-tested warrior and its two Leadership dice are declared first against the fixture's
# Leadership 7.  These scenarios are about the Fear test alone, so the causer contributes no
# attacks of its own (initial_state) and the only attack die is the charged warrior's own.

- audit_id: rule/mordheim/dark-elves/cold-one-beasthounds--fear/mechanic.causes-fear
  id: a-charged-opponent-that-fails-its-fear-test-hits-only-with-sixes
  covers: [cause-fear]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 10, strength: 8, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
    second: {collection: mordheim, band_id: dark-elves, profile_id: cold-one-beasthounds}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [second], active_participant: second}
  maximum_rounds: 1
  # The charging Fear-causer is itself subject to Stupidity, so its own turn opens with that
  # two-dice Leadership test before the charged model is tested for Fear.
  rolls:
    - {key: round.0.second.stupidity.0, value: 1}
    - {key: round.0.second.stupidity.1, value: 1}
    - {key: round.0.first.fear.charged.0, value: 5}
    - {key: round.0.first.fear.charged.1, value: 4}
    - {key: round.0.first.attack.0.hit, value: 4}
  expect_rounds:
