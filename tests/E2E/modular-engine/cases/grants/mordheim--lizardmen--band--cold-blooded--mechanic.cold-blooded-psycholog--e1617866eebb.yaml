  id: an-individual-psychology-test-keeps-the-lowest-two
  covers: [cold-blooded-psychology]
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.causes-fear]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 7}
    second:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.cold-blooded-psychology]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.fear.charged.0, value: 6}
    - {key: round.0.second.fear.charged.1, value: 6}
    - {key: round.0.second.fear.charged.2, value: 1}
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.1.hit_target: 4, state.second.fear_hit_sixes: False}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
