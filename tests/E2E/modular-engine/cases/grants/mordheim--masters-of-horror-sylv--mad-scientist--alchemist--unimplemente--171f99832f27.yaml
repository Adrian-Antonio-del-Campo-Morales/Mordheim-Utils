# --- Authored scenarios ---
# Derived from the printed potion table and the catalogue's own canonical conditions; no engine output was
# consulted.  Each tape supplies exactly one drawn result through FighterBuild.condition_ids - the channel
# compiler.resolve_supplied_conditions reads - and reads the printed consequence on the affected duelist,
# who is supplied as the printed drinker of the table (the duel's own duelist standing for him) because the
# condition is a globally supplied fact, exactly as the sibling shaman--fungus-brew file supplies its brew
# results.  Where the consequence is a characteristic, the opposing duelist is already out so no combat die
# is consumed and the grant itself is the observation.

- audit_id: rule/mordheim/masters-of-horror-sylv/mad-scientist--alchemist/unimplemented.masters-of-horror-sylv.special.alchemist
  id: the-potion-of-resilience-raises-the-drinkers-toughness-by-one
  covers: [start-of-game-potion--scope--potion-characteristic-bonuses]
  # "1: Potion of Resilience - Add +1 to Toughness for duration of game."
  fighters:
    first:
      main_weapon_id: weapon.mace
      condition_ids: [condition.alchemist-resilience]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 4, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 5, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  initial_state: {second: {condition: OUT}}
  maximum_rounds: 1
  expect_initial: {first.toughness: 4}
  expect_final: {rounds_executed: 0, termination_reason: second_out}

