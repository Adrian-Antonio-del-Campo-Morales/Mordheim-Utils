# --- Authored scenarios ---
# Derived from the printed rule text, the Ruffians profile and the recorded semantic contract; no
# engine output was consulted.  The Fear source is a hand-built opposing warrior that declares the
# printed causes_fear trait, and the fixture's Initiative is chosen so the strike order is the same
# under either reading (the higher Initiative strikes first, and the duel resolves the first
# fighter's attack before the second's).  Every strike is declared as a natural 1, so a round
# reports nothing but the Leadership request under test.

