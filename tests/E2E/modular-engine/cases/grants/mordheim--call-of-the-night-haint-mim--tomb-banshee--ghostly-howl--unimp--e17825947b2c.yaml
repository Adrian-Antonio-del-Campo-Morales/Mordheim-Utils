- audit_id: rule/mordheim/call-of-the-night-haint-mim/tomb-banshee--ghostly-howl/unimplemented.call-of-the-night-haint-mim.tomb-banshee.ghostly-howl
  id: the-howl-drops-the-tested-enemys-leadership-by-the-declared-die
  covers: [ghostly-howl]
  # The printed sentence: enemies facing the howler suffer -D6 Leadership when taking fear tests.  The enemy
  # is charged by the band's own Tomb Banshee, so it takes the charged-fear test; its declared dice total two,
  # which passes at its own Leadership 7 and fails once the declared D6 face of six is subtracted (7 - 6 = 1),
  # so the failing test is the printed drop and nothing else.  Today the origin's binding is the null
  # placeholder, so the declared D6 die is unrequested - the PENDING implementation defect.
  fighters:
    first: {collection: mordheim, band_id: call-of-the-night-haint-mim, profile_id: tomb-banshee}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.fear.charged.ghostly-howl, value: 6}
    - {key: round.0.second.fear.charged.0, value: 1}
    - {key: round.0.second.fear.charged.1, value: 1}
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.condition: STANDING, state.second.condition: STANDING, state.second.fear_hit_sixes: true}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

