# --- Authored scenarios ---
# The printed clause and the accepted M3 delivery in this scaffold's register notes
# split into two halves: the parry granted even without a buckler or sword, and the
# skill's own re-roll restricted to a sword or buckler recipient.
# A mace cannot parry, so the declared parry die exists only because the printed
# training grants one: the five beats the attack roll of four.
- audit_id: rule/catalog/warband/skill.chosen-of-the-white-tower/unclassified
  id: the-training-grants-a-parry-without-a-parrying-weapon
  covers: [parry-unarmed-and-reroll]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      skill_ids: [skill.chosen-of-the-white-tower]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.parry, value: 5}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.parried: True, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
