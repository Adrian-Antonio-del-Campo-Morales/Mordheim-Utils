# --- Authored scenarios ---
# The printed sentence is "The Captain, Champions and Youngbloods in a Remasen warband have +1
# Leadership at all times", and the band attaches the row to its `remasens` variant
# (band.yaml: variants[remasens].rule_ids).  Each recipient is built from the band package with
# the printed row selected through special_rule_ids, and the supplied Leadership is read as the
# duel's own initial characteristic; the same build without the selection supplies the printed
# base value, which is the contrast.  Both duels are uncharged, so the only thing under test is
# the compiled characteristic; every declared die is a miss (the Captain has two attacks, so its
# tapes declare two hit dice).
- audit_id: rule/mordheim/tileans/band--remasen-officer-leadership/unimplemented.tileans.band.remasen-officer-leadership
  id: the-remas-captain-is-supplied-leadership-nine
  covers: [leadership-characteristic-bonus]
  fighters:
    first:
      collection: mordheim
      band_id: tileans
      profile_id: captain
    second:
      characteristics: &tilean-fixture {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: &tilean-uncharged {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.first.attack.1.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_initial: {first.leadership: 9}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

