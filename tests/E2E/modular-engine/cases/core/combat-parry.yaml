# The reroll is spent on the first failure: a failed parry and a failed reroll
# consume the phase's single attempt, so the second hit is not offered a parry
# die either (the strict tape would fail if one were requested).
- audit_id: core/combat-parry
  id: a-failed-parry-reroll-consumes-the-phase-attempt
  covers: [reroll-and-capacity]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {<<: *ws3-s3-t3-w2-i5, attacks: 2}
    second:
      main_weapon_id: weapon.sword
      off_hand_id: defence.buckler
      characteristics: {<<: *ws3-s3-t3-w2-i2, wounds: 3}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.1.hit, value: 4}
    - {key: round.0.first.attack.0.parry, value: 3}
    - {key: round.0.first.attack.0.parry.reroll, value: 3}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.1.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.parried: false, attacks.1.parried: false,
        state.second.wounds: 1, state.second.parries_remaining: 0}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# "One attempt per phase" is renewed each phase: the same defender parries the
# first hit of round one and again the first hit of round two.
- audit_id: core/combat-parry
  id: the-parry-attempt-is-renewed-in-the-next-round
  covers: [reroll-and-capacity]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: *ws3-s3-t3-w2-i5
    second:
      main_weapon_id: weapon.sword
      characteristics: *ws3-s3-t3-w2-i2
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 2
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.parry, value: 5}
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.1.first.attack.0.hit, value: 4}
    - {key: round.1.first.attack.0.parry, value: 5}
    - {key: round.1.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.parried: true, state.second.wounds: 2}
    1: {attacks.0.parried: true, state.second.wounds: 2}
  expect_final: {rounds_executed: 2, termination_reason: horizon}
