# --- Authored scenarios ---
# mechanic/weapon.cathayan-longsword - mastercrafted: +1 Initiative and +1
# Weapon Skill for attacks made with it, and a parry.
#
# Expectations come from the printed rule and the admitted clauses, never from
# engine output.  The disputed armour-penetration parameter is deliberately not
# asserted here; the file's scenarios pin only the printed facts.
# An equal Weapon Skill would need a 4; the printed +1 Weapon Skill for attacks made with the sword moves the target to a 3, and the 3 hits.

- audit_id: mechanic/weapon.cathayan-longsword
  id: cathayan-longsword-hits-on-a-three-because-of-plus-one-weapon-skill
  covers: [whole]
  fighters:
    first:
      main_weapon_id: weapon.cathayan-longsword
      characteristics: &a-ws3-s3-t3-w2-i5 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: &d-ws3-s3-t3-w2-i2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 3}
    - {key: round.0.first.attack.0.wound, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: True, attacks.0.hit_target: 3, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
