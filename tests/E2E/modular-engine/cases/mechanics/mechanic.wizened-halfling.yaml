# --- Authored scenarios ---
# The halfling fails the stupidity Leadership test on two sixes (12 against his own 6).
# The wizened halfling leader stands four inches away and is supplied as a nearby,
# standing, same-band participant, which is what prints the reroll for a halfling
# recipient: the reroll is offered, accepted and passes on two ones, so the charge holds
# and the declared attacks follow.  The borrowed value itself is declined, so the first
# test is read against the borrower's own Leadership and the rule exercised here is the
# printed reroll.
- audit_id: mechanic/mechanic.wizened-halfling
  id: the-halfling-s-failed-leadership-test-is-taken-again
  covers: [whole]
  fighters:
    first:
      main_weapon_id: weapon.mace
      trait_overrides: {stupidity: true, species: halfling}
      collection: mordheim
      band_id: carnival-of-chaos
      profile_id: brethren
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 6}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {first_id: first, second_id: second, charging: [first], active_participant: first,
    distances: [[first, wizened-leader, 4]],
    nearby: [{participant_id: wizened-leader, side_id: first, condition: standing,
              fighter: {collection: mordheim, band_id: carnival-of-chaos, profile_id: carnival-master,
                        skill_ids: [mechanic.wizened-halfling]}}]}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.stupidity.leader.wizened-leader, value: false}
    - {key: round.0.first.stupidity.reroll, value: true}
  rolls:
    - {key: round.0.first.stupidity.0, value: 6}
    - {key: round.0.first.stupidity.1, value: 6}
    - {key: round.0.first.stupidity.reroll.0, value: 1}
    - {key: round.0.first.stupidity.reroll.1, value: 1}
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 1, state.first.stupidity_failed: false, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
