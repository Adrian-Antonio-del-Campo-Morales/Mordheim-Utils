# --- Authored scenarios ---
# mechanic/weapon.arcane-candelabrum - one-handed, Strength +1, sets targets
# alight on a 5+, and counts as a holy relic and a brazier iron.
#
# Expectations come from the printed rule and the admitted clause `whole`, never
# from engine output.  The holy-relic scenario uses the same Fear-test evidence
# shape as defence.holy-relic: a required Leadership test that consumes no die
# leaves the strict tape empty of any Fear roll and records the spent resource.
# +1 Strength moves the wound target against Toughness 3 to 3+, and an ignition roll of 4 leaves the target unburnt.

- audit_id: mechanic/weapon.arcane-candelabrum
  id: arcane-candelabrum-wounds-at-the-boosted-strength
  covers: [whole]
  fighters:
    first:
      main_weapon_id: weapon.arcane-candelabrum
      characteristics: &a-ws3-s3-t3-w2-i5 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: &d-ws3-s3-t3-w2-i2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.ignition, value: 4}
    - {key: round.0.first.attack.0.wound, value: 3}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 1, state.second.wounds: 1, state.second.on_fire: False}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
