# --- Authored scenarios ---
# # The supplied active bonus of 2 is added to this warrior's own Leadership 6 for its
# # Stupidity test only, so a total of eight passes where the bare six fails.
- audit_id: mechanic/mechanic.brood-mentality
  id: the-supplied-bonus-raises-the-stupidity-test
  covers: [brood-mentality]
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.brood-mentality]
      trait_overrides: {stupidity: true, stupidity_leadership_bonus: 2}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 6}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.stupidity.0, value: 4}
    - {key: round.0.first.stupidity.1, value: 4}
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.stupidity_failed: False, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
