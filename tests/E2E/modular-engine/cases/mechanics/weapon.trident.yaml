# --- Authored scenarios ---
# mechanic/weapon.trident - the parry and the charge-scoped strike-first.
#
# Expectations come from the printed rule and the admitted clause, never from
# engine output.  The printed "Strikes first when charged" scope is asserted
# through the resolution order of the ordered tape.
# The second fighter charges, which would normally let it strike first, yet the
# ordered tape resolves the trident first: the printed priority lifted the bearer.
- audit_id: mechanic/weapon.trident
  id: trident-strikes-first-when-its-bearer-is-charged
  covers: [whole]
  fighters:
    first:
      main_weapon_id: weapon.trident
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [second], active_participant: second}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.wounds: 2, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
  expect_events:
    - {kind: roll, key: round.0.first.attack.0.hit, sides: 6, value: 1}
    - {kind: roll, key: round.0.second.attack.0.hit, sides: 6, value: 1}
# Nobody charges and the higher Initiative resolves first, so the printed priority
