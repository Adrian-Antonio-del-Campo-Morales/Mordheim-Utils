# --- Authored scenarios ---
# mechanic/weapon.starsword - the +1 Strength, the armour denial and the parry.
#
# Expectations come from the printed rule and the admitted `whole` clause, never
# from engine output.  The source-vs-contract contradiction recorded in the header
# (item entry printing only "as user +1 Parry") is preserved, not asserted: these
# scenarios follow the mechanic reading whose clause is admitted.
# The printed +1 makes the wielder Strength 4, so Toughness 3 is wounded on 3+;
# the wielder's own Strength would have needed the 4 rolled in the next scenario.
- audit_id: mechanic/weapon.starsword
  id: starsword-adds-one-strength
  covers: [whole]
  fighters:
    first:
      main_weapon_id: weapon.starsword
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 5}
    - {key: round.0.first.attack.0.wound, value: 3}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
