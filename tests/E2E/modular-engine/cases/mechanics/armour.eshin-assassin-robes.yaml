# --- Authored scenarios ---
# mechanic/armour.eshin-assassin-robes — the 6+ save and its threshold boundary.
#
# Expectations come from the printed rule and the accepted clause
# `light-armour-six-plus-no-combining` of
# docs/knowledge/2a2b/tasks/T13-semantic-analysis.csv, never from engine output:
# the robes count as light armour and save an incoming close-combat wound on a
# 6 before Strength modifiers.  An unmodified Strength 3 attacker applies no
# save modifier, so the boundary is exactly 6: the six holds, the five fails.
# The combining restriction is not asserted here (see the clause marker).
#
# The first scenario declares the shared profiles as YAML anchors; the sibling
# aliases them and keeps its own armour face and expectation.

- audit_id: mechanic/armour.eshin-assassin-robes
  id: eshin-assassin-robes-save-holds-on-six
  covers: [light-armour-six-plus-no-combining]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: &attacker-ws3-s3-t3-w2-i5 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      armour_id: armour.eshin-assassin-robes
      characteristics: &defender-ws3-s3-t3-w2-i2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: &charging-first {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.armour, value: 6}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.saved: true, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# One face below the printed target: the five is not a 6+, so the wound would be
# taken, and printed 159's "La suerte del Asesino: los ropajes de asesino eshin
# permiten repetir las tiradas de salvacion fallidas" asks for the one second
# armour die.  The re-roll is asked for on a failed save and no limit or cost is
# printed, so the second five is accepted (a re-roll is never re-rolled) and the
# defender still drops a wound.

- audit_id: mechanic/armour.eshin-assassin-robes
  id: eshin-assassin-robes-save-fails-on-five
  covers: [light-armour-six-plus-no-combining]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: *attacker-ws3-s3-t3-w2-i5
    second:
      main_weapon_id: weapon.mace
      armour_id: armour.eshin-assassin-robes
      characteristics: *defender-ws3-s3-t3-w2-i2
  duel_context: *charging-first
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.armour, value: 5}
    - {key: round.0.first.attack.0.armour.reroll, value: 5}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.saved: false, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

