# --- Authored scenarios ---
# The marked warrior's own Leadership is 3 and his Stupidity roll of 5,5 would fail,
# but the opposing Orc is one of the printed qualifying enemies, so the test passes
# without a die: the declared tape carries no stupidity roll at all and the charge,
# which a failure cancels, stands.
- audit_id: mechanic/mechanic.sigmar-enlightened
  id: an-orc-opponent-is-passed-automatically
  covers: [whole]
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.sigmar-enlightened, mechanic.stupidity]
      trait_overrides: {species: human}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 3}
    second:
      main_weapon_id: weapon.mace
      trait_overrides: {species: orc}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.stupidity_failed: False, state.first_charged: True, attacks.0.damage: 1,
        state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
