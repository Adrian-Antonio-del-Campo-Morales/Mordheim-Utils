# --- Authored scenarios ---
# The pikeman is charged while wielding the first-strike spear, so his failed hit
# in that round is taken again.  Spear and charger share the strike-first tier and
# his higher Initiative resolves the tie in his favour.
- audit_id: mechanic/mechanic.pikewall
  id: the-charged-pikeman-rerolls-a-failed-hit
  covers: [reroll-failed-hits-when-charged]
  fighters:
    first:
      main_weapon_id: weapon.spear
      skill_ids: [mechanic.pikewall]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [second], active_participant: second}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.first.attack.0.hit.reroll, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: True, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
