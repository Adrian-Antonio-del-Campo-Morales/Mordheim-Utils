# The declaration names one attack: with two attacks the bearer keeps the parry
# window on the first and removes it from the second, which is the documented
# per-attack offer order of the declaration input.
- audit_id: mechanic/mechanic.unpredictable-attack
  id: the-declaration-names-which-attack-the-parry-cannot-stop
  covers: [whole]
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.unpredictable-attack]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 2}
    second:
      main_weapon_id: weapon.mace
      off_hand_id: defence.buckler
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.unpredictable-attack.0, value: false}
    - {key: round.0.first.unpredictable-attack.1, value: true}
  # The pool rolls every To Hit die before any defence is offered, so the parry
  # attempt for the highest hit roll follows both declared hits.
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.1.hit, value: 4}
    - {key: round.0.first.attack.0.parry, value: 5}
    - {key: round.0.first.attack.1.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.parried: true, attacks.1.parried: false, state.second.parries_remaining: 0, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
