# --- Authored scenarios ---
# mechanic/mechanic.unpredictable-attack — every expectation below comes from
# the printed rule (the Hero may declare one of its attacks Unpredictable and
# that attack cannot be parried by the opponent) and the recorded semantic
# contract, never from engine output.  The defender carries a buckler, so the
# parry would otherwise be offered: a refused parry is observed as the absent
# parry die, an unspent parry attempt and an unparried attack.
- audit_id: mechanic/mechanic.unpredictable-attack
  id: a-declared-attack-cannot-be-parried
  covers: [whole]
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.unpredictable-attack]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      off_hand_id: defence.buckler
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.unpredictable-attack.0, value: true}
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.parried: false, state.second.parries_remaining: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

