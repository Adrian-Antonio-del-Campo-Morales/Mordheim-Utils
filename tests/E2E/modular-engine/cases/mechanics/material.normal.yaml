# --- Authored scenarios ---
# mechanic/material.normal — the empty material term.
#
# Expectations come from the printed rule and the accepted clause `whole` of
# docs/knowledge/2a2b/tasks/T13-semantic-analysis.csv, never from engine output:
# the normal material adds no modifier, so a weapon declared with it carries no
# additional Strength, save or Initiative term.  Both scenarios pin a boundary
# that would move if a term were added: a 3 does not wound Toughness 3 at
# Strength 3, and heavy armour still saves on a 5.  The material is supplied on
# `main_material_id`, the documented slot for a weapon material.
#
# The first scenario declares the shared profiles as YAML anchors; the sibling
# aliases the attacker and keeps its own defender build and expectation.

- audit_id: mechanic/material.normal
  id: normal-material-keeps-the-base-wound-target
  covers: [whole]
  fighters:
    first:
      main_weapon_id: weapon.mace
      main_material_id: material.normal
      characteristics: &attacker-ws3-s3-t3-w2-i5 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: &defender-ws3-s3-t3-w2-i2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: &charging-first {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 3}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 0, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

- audit_id: mechanic/material.normal
  id: normal-material-adds-no-save-modifier
  covers: [whole]
  fighters:
    first:
      main_weapon_id: weapon.mace
      main_material_id: material.normal
      characteristics: *attacker-ws3-s3-t3-w2-i5
    second:
      main_weapon_id: weapon.mace
      armour_id: armour.heavy-armour
      characteristics: *defender-ws3-s3-t3-w2-i2
  duel_context: *charging-first
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.armour, value: 5}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.saved: true, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
