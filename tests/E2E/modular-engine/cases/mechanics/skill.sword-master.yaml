# --- Authored scenarios ---
# mechanic/skill.sword-master — every expectation below comes from the printed
# rule (the Vampire only needs to equal the opponent's roll; it may re-roll one
# failed parry but not the re-roll, and may not parry more than one attack) and
# the recorded contract, never from engine output.  The defender parries with a
# buckler so the parry window exists; equality and the single reroll are then
# read off the declared tape.
- audit_id: mechanic/skill.sword-master
  id: an-equal-parry-die-blocks-the-attack
  covers: [match-parry-and-parry-a-six]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      off_hand_id: defence.buckler
      skill_ids: [skill.sword-master]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.parry, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.parried: True, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

