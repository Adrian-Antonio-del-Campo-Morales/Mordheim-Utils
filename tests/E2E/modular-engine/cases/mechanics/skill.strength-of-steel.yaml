- audit_id: mechanic/skill.strength-of-steel
  id: without-the-charge-the-bonus-is-absent
  covers: [whole]
  fighters:
    first:
      skill_ids: [skill.strength-of-steel]
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 4, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  # The printed bonus is Strength, not To Hit: the same declared impact of four
  # hits in both scenarios (Weapon Skill 3 against 4 needs 4+), so the pair is
  # decided by the To Wound step alone.  Without the charging turn the bearer
  # keeps Strength 3, and Strength 3 against Toughness 3 needs the declared
  # four; the three scripted here is the face the charging turn's Strength 4
  # would have turned into a wound.
