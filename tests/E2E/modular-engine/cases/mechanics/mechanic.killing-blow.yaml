# --- Authored scenarios ---

# A natural six on the To Hit roll skips the To Wound roll entirely: the first attack

# wounds on the declared six alone, and the tape carries no wound die for it.  The

# second warrior still strikes back, so the missing die is not an artefact of a short

# round.

- audit_id: mechanic/mechanic.killing-blow

  id: a-natural-six-wounds-without-a-to-wound-roll

  covers: [whole]

  fighters:

    first:

      main_weapon_id: weapon.mace

      skill_ids: [mechanic.killing-blow]

      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}

    second:

      main_weapon_id: weapon.mace

      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}

  duel_context: {charging: [first], active_participant: first}

  maximum_rounds: 1

  rolls:

    - {key: round.0.first.attack.0.hit, value: 6}

    - {key: round.0.second.attack.0.hit, value: 1}

  expect_rounds:

    0: {attacks.0.wounded: true, attacks.0.damage: 1, state.second.wounds: 1}

  expect_final: {rounds_executed: 1, termination_reason: horizon}

