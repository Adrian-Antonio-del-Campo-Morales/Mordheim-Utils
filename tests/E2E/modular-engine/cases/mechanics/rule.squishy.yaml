# --- Authored scenarios ---
# The bearer carries No Pain, which would otherwise turn a Stunned injury result
# into Knocked Down.  Squishy suppresses that flag, so the printed Stunned result
# stands and the bearer's own attack is still scheduled by the round, which is why
# its declared miss is part of the tape.
- audit_id: mechanic/rule.squishy
  id: no-pain-cannot-quiet-the-stun-under-squishy
  covers: [squishy-overrides-no-pain]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      skill_ids: [skill.ignore-pain, rule.squishy]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.injury.0, value: 3}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.condition: STUNNED, state.second.wounds: 0}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
