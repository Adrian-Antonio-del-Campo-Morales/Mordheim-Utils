# --- Authored scenarios ---
# The declaration is accepted, so the charge resolves as the printed single
# attack: the raised To Hit target of three turns the declared three into a hit
# that an equal Weapon Skill would otherwise miss, and the raised Strength of
# four wounds Toughness 3 on the declared three where the plain profile would
# need a four.  The defender's reply is a declared miss, so the round carries no
# other damage.
- audit_id: mechanic/mechanic.body-slam
  id: the-declared-slam-hits-on-the-raised-target-and-wounds-on-the-raised-strength
  covers: [whole]
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.body-slam]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.body-slam, value: true}
  rolls:
    - {key: round.0.first.attack.0.hit, value: 3}
    - {key: round.0.first.attack.0.wound, value: 3}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: true, attacks.0.hit_target: 3, attacks.0.critical: false, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
