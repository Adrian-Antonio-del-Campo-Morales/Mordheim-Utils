# mechanic/weapon.misericordia - dagger profile whose Coup de Grace bypasses all
# armour saves against a Knocked Down opponent.
#
# Expectations come from the printed rule and the admitted clauses, never from
# engine output.  The Knocked Down defender is declared through the scenario's
# initial state, and the contrast with the standing scenarios isolates the
# printed exception from the dagger profile's ordinary save penalty.
# Against a Knocked Down opponent the printed Coup de Grace bypasses all armour saves: no armour die is scripted and the strict tape proves none was requested.

- audit_id: mechanic/weapon.misericordia
  id: misericordia-bypasses-the-save-of-a-knocked-down-opponent
  covers: [coup-de-grace]
  fighters:
    first:
      main_weapon_id: weapon.misericordia
      characteristics: &a-ws3-s3-t3-w2-i5 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      armour_id: armour.heavy-armour
      characteristics: &d-ws3-s3-t3-w2-i2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  initial_state:
    second: {condition: KNOCKED_DOWN}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
  expect_rounds:
    0: {attacks.0.saved: False, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
