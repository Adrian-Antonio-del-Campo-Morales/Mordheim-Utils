# --- Authored scenarios ---
# The printed wording carries no charging turn and no first-round limit, so the same
# failed axe hit is taken again in the second round as well.  In the first round the
# rerolled hit then fails its own To Wound roll, which shows only the hit is taken
# again.  Nothing here charges either fighter, so the reroll cannot come from a
# charge.
- audit_id: mechanic/skill.weapons-of-the-north
  id: an-axe-miss-is-rerolled-in-every-round
  covers: [whole]
  fighters:
    first:
      main_weapon_id: weapon.axe
      skill_ids: [skill.weapons-of-the-north]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 2
  rolls:
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.first.attack.0.hit.reroll, value: 4}
    - {key: round.0.first.attack.0.wound, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.1.first.attack.0.hit, value: 2}
    - {key: round.1.first.attack.0.hit.reroll, value: 4}
    - {key: round.1.first.attack.0.wound, value: 4}
    - {key: round.1.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: True, attacks.0.damage: 0, state.second.wounds: 2}
    1: {attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 2, termination_reason: horizon}
