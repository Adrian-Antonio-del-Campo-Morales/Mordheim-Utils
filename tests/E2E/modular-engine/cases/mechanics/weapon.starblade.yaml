# --- Authored scenarios ---
# mechanic/weapon.starblade - +1 to the enemy save and a parry of the first
# successful hit of any combat on a fixed 4+.
#
# Expectations come from the printed rule and the admitted clause `whole`, never
# from engine output.  The fixed target is the discriminating observation: a 4
# blocks a hit landed on a 5, and the second hit in the same round gets no
# attempt at all.
# The printed +1 to the enemy save turns a worn 5+ into a 4+, and the 4 now saves.

- audit_id: mechanic/weapon.starblade
  id: starblade-improves-a-worn-save-by-one
  covers: [whole]
  fighters:
    first:
      main_weapon_id: weapon.starblade
      characteristics: &a-ws3-s3-t3-w2-i5 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      armour_id: armour.heavy-armour
      characteristics: &d-ws3-s3-t3-w2-i2-heavy {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.armour, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.saved: True, attacks.0.damage: 0, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
