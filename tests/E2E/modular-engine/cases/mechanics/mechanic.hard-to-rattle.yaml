# The bearer counts as wearing a helmet, so the Stunned injury result is tested
# again: the declared four converts it to Knocked Down.
- audit_id: mechanic/mechanic.hard-to-rattle
  id: a-four-negates-the-stun
  covers: [hard-to-rattle]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 6}
    second:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.hard-to-rattle]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 2, attacks: 1, leadership: 6}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.injury.0, value: 3}
    - {key: round.0.first.attack.0.helmet, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.condition: KNOCKED_DOWN, state.second.wounds: 0}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
