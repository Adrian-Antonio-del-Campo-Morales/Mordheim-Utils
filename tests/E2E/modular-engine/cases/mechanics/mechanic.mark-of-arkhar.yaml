# --- Authored scenarios ---
# The marked leader is subject to Frenzy: the round snapshot records it and the
# printed A1 becomes two blows, so the declared tape names both of his attacks and
# the enemy's blow is only the third outcome.
- audit_id: mechanic/mechanic.mark-of-arkhar
  id: the-marked-leader-is-frenzied-and-doubles-his-attacks
  covers: [whole--scope--frenzy]
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.mark-of-arkhar]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.1.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.frenzy: True, attacks.0.damage: 1, attacks.1.hit: False,
        attacks.2.hit: False, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# The control: the same warrior and the same round without the mark, so he is not
# Frenzied and makes his single printed attack.
- audit_id: mechanic/mechanic.mark-of-arkhar
  id: without-the-mark-the-same-warrior-is-not-frenzied
  covers: [whole--scope--frenzy]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.frenzy: False, attacks.0.damage: 1, attacks.1.hit: False,
        state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
