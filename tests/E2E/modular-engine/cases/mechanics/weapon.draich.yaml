# --- Authored scenarios ---
# mechanic/weapon.draich - two-handed, Strength +2, strikes last, parry,
# Concussion on Injury 2-4 and +1 on the critical hit table.
#
# Expectations come from the printed rule and the admitted clause `whole`, never
# from engine output.  Because the weapon strikes last, every scenario gives the
# defender the first attack: the bearer's own attack is the second index of the
# round.  The critical bonus is evidenced against a control on the same face.
# Strength 5 against Toughness 3 wounds on 2+. The defender strikes first, which the same tape records.

- audit_id: mechanic/weapon.draich
  id: draich-wounds-at-the-boosted-strength
  covers: [whole]
  fighters:
    first:
      main_weapon_id: weapon.draich
      characteristics: &a-ws3-s3-t3-w2-i5 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: &d-ws3-s3-t3-w1-i2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 2}
    - {key: round.0.first.attack.0.injury.0, value: 1}
  expect_rounds:
    0: {attacks.1.damage: 1, state.second.wounds: 0, state.second.condition: KNOCKED_DOWN}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
