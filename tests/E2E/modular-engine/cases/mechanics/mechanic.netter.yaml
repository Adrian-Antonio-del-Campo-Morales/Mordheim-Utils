# --- Authored scenarios ---
# A declared net charge resolves its own Ballistic Skill die before any weapon blow
# (`round.0.first.netter.hit`).  The attacker carries the rule but no profile, so its
# compiled Ballistic Skill is 0 and the net's target is 7+: the declared six is a miss
# by construction, which is exactly the printed "if he misses ... the goblin makes a
# failed charge" branch with no knock-down consequence.  The target keeps its own
# attack and the round carries the two ordinary To Hit dice.
- audit_id: mechanic/mechanic.netter
  id: a-missed-net-leaves-the-target-standing
  covers: [whole]
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.netter]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.netter.hit, value: 6}
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: false, attacks.1.hit: false, state.second.condition: STANDING}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

