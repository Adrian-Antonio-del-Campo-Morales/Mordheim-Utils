# The printed success branch, reached through the rule's own band: the Night Goblin profile carries
# the printed Ballistic Skill the net's target comes from, so a declared four hits.  The target then
# fails the printed Strength escape test on a four (its Strength is three), so it counts as knocked
#  down, is hit automatically in the combat that follows - no To Hit die is requested for the charge -
# and the wound is still rolled.
- audit_id: mechanic/mechanic.netter
  id: a-hit-net-knocks-the-target-down-and-the-charge-strikes-home
  covers: [whole]
  fighters:
    first:
      collection: mordheim
      band_id: night-goblins-mic
      profile_id: night-goblins
      special_rule_ids: [band--night-goblin-special-skills-netter]
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  initial_state:
    second: {attacks: 0}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.netter.hit, value: 4}
    - {key: round.0.first.netter.escape, value: 4}
    - {key: round.0.first.attack.0.wound, value: 6}
  expect_rounds:
    0: {attacks.0.knocked_down_target: true, attacks.0.wounded: true, state.second.condition: KNOCKED_DOWN, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
