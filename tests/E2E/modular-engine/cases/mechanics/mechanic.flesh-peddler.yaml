# --- Authored scenarios ---
# The printed "nominated female mark" is two supplied facts: the bearer declares the
# nomination and the opposing model declares its sex, which is the fact the modifier reads.
# The two scenarios hold the declared die and every characteristic constant and vary only the
# nomination, so the difference is the printed To-Hit bonus.  Weapon Skill 3 against Weapon
# Skill 3 needs a 4+ normally and a 3+ with the bonus, so a declared three separates them.
- audit_id: mechanic/mechanic.flesh-peddler
  id: the-nominated-mark-is-hit-on-one-lower-face
  covers: [whole]
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.flesh-peddler]
      trait_overrides: {flesh_peddler_mark: true}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      trait_overrides: {sex: female}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1}
  initial_state:
    second: {wounds: 3, attacks: 0}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 3}
    - {key: round.0.first.attack.0.wound, value: 4}
  expect_rounds:
    0: {attacks.0.hit: true, attacks.0.damage: 1, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
