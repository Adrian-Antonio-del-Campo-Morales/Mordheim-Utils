# --- Authored scenarios ---
# Neither fighter charges, so the order of battle is the ordinary one: with the
# strike-last penalty removed the two-handed weapon stands in the ordinary tier
# and the higher Initiative strikes first.
- audit_id: mechanic/skill.strongman
  id: a-two-handed-weapon-keeps-the-ordinary-order
  covers: [whole]
  fighters:
    first:
      main_weapon_id: weapon.double-handed-weapon
      skill_ids: [skill.strongman]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: True, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
