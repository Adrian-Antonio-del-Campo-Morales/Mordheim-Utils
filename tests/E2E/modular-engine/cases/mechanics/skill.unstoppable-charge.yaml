- audit_id: mechanic/skill.unstoppable-charge
  id: without-the-charge-the-bonus-is-absent
  covers: [whole]
  fighters:
    first:
      skill_ids: [skill.unstoppable-charge]
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 4, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  # Weapon Skill 3 against Weapon Skill 4 hits on the declared 4+; the charging
  # turn's printed bonus is what turns a declared 3 into a hit, so the same face
