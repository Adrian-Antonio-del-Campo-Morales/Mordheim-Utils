# --- Authored scenarios ---
# The first combat round belongs to the Hero; the recorded event order then returns
# to the ordinary tier and Initiative, where the Skink's 5 resolves before the
# Hero's 2.  Every roll is declared in that order, so the tape itself carries the
# reversal, and the second-round hit is left as a miss to keep the state stable.
- audit_id: mechanic/mechanic.strike-first-vs-skinks-first-round
  id: the-spike-holds-in-the-first-round-and-lapses-afterwards
  covers: [whole]
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.strike-first-vs-skinks-first-round]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      trait_overrides: {species: skink}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
  duel_context: {charging: [second], active_participant: second}
  maximum_rounds: 2
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.1.second.attack.0.hit, value: 1}
    - {key: round.1.first.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 1, state.second.wounds: 1}
    1: {state.second.wounds: 1}
  expect_final: {rounds_executed: 2, termination_reason: horizon}
  expect_events:
    - {kind: roll, key: round.0.first.attack.0.hit, sides: 6, value: 4}
    - {kind: roll, key: round.0.first.attack.0.wound, sides: 6, value: 4}
    - {kind: roll, key: round.0.second.attack.0.hit, sides: 6, value: 1}
    - {kind: roll, key: round.1.second.attack.0.hit, sides: 6, value: 1}
    - {kind: roll, key: round.1.first.attack.0.hit, sides: 6, value: 1}
