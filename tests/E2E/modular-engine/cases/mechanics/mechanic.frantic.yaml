# --- Authored scenarios ---
# The printed clause takes the top of the close-combat order "regardless of weapon
# penalties or Initiative", so every scenario fixes a configuration in which the
# ordinary order would send somebody else first, and reads the resulting order off
# the declared roll tape.  The same configuration without the mechanic is the
# control, exactly as the sibling always-strikes-first file does: only the state
# fields are asserted there, because the attack list is indexed in resolution
# order and the control is about who opened the round.
#
# Frantic against a charging opponent who also has the higher Initiative.  Without
# the mechanic the charge alone gives that opponent the opening attack, so this
# pair isolates the printed override of both the charge and the higher Initiative.
- audit_id: mechanic/mechanic.frantic
  id: the-frantic-tier-opens-the-round-against-a-charge-and-higher-initiative
  covers: [frantic]
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.frantic]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
  duel_context: {charging: [second], active_participant: second}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
  expect_events:
    - {kind: roll, key: round.0.first.attack.0.hit, sides: 6, value: 4}
    - {kind: roll, key: round.0.first.attack.0.wound, sides: 6, value: 4}
    - {kind: roll, key: round.0.second.attack.0.hit, sides: 6, value: 1}
