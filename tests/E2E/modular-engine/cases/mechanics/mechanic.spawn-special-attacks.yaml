# --- Authored scenarios ---
# The printed "Rolls D6+1 Attacks again at the start of every close-combat phase" is a
# replacement, not an addition: the bearer prints Attacks 3 but the declared spawn roll of
# one yields exactly two attack dice, so the third outcome of the round is the
# defender's own attack (declared as a two, a miss that is nevertheless not a one).
- audit_id: mechanic/mechanic.spawn-special-attacks
  id: the-spawn-roll-replaces-the-printed-attack-count
  covers: [whole]
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.spawn-special-attacks]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 3}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.spawn-attacks, value: 1}
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.first.attack.1.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 2}
  expect_rounds:
    0: {attacks.0.hit_roll: 1, attacks.1.hit_roll: 1, attacks.2.hit_roll: 2, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
