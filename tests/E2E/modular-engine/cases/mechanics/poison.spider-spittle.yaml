  fighters:
    first:
      main_weapon_id: weapon.mace
      main_poison_id: poison.spider-spittle
      characteristics: &ss-attacker {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: &ss-defender {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
  duel_context: &ss-context {charging: [], active_participant: first}
  maximum_rounds: 1
