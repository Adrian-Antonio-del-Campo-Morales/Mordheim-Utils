# mechanic/poison.black-lotus - authored from the printed rule and the
# admitted `whole` clause, never from engine output.
# A natural 6 to hit already wounds; the declaration `round.0.first.attack.0.lotus-critical`
# decides whether the optional wound die is taken.  Declining it leaves the automatic
# wound with no die at all; taking it on a 5 leaves a normal wound and only a 6 sets
# the critical, which then rolls the ordinary critical and injury dice.
- audit_id: mechanic/poison.black-lotus
  id: the-natural-six-wounds-automatically-when-the-optional-die-is-declined
  covers: [whole]
  fighters:
    first:
      main_weapon_id: weapon.mace
      main_poison_id: poison.black-lotus
      characteristics: &bl-attacker {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: &bl-defender {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: &bl-context {charging: [], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.attack.0.lotus-critical, value: false}
  rolls:
    - {key: round.0.first.attack.0.hit, value: 6}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.critical: false, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

