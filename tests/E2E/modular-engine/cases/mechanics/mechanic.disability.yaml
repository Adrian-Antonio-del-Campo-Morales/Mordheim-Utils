# --- Authored scenarios ---
# mechanic/mechanic.disability — every expectation below comes from the printed
# rule (roll D6 once for the group and apply the result permanently) and the
# recorded contract, never from engine output.  The accepted ruling of
# 2026-10-15 makes the duel consume exactly one supplied permanent result
# (condition.disability-1..6) once at compilation and never roll group creation
# again, so each scenario declares the result its name prints instead of a die;
# result 6 leaves the bearer taking the ordinary start-of-turn Stupidity test.
#
# Result 6: a failed Stupidity test costs the turn's attack, which the printed
# clause shares with the canonical Stupidity clause the duel already carries.
- audit_id: mechanic/mechanic.disability
  id: a-head-injury-roll-subjects-the-bearer-to-stupidity
  covers: [head-injury-stupidity]
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.disability]
      condition_ids: [condition.disability-6]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 6}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 6}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.stupidity.0, value: 6}
    - {key: round.0.first.stupidity.1, value: 6}
  expect_rounds:
    0: {state.engaged: False, state.failed_charges: ['first'], state.first.stupidity_failed: True, state.first_charged: False}
  expect_final: {rounds_executed: 1, termination_reason: disengaged}

# The same roll with the test passed: the bearer is not held by the result and
# the round resolves its attacks normally.
- audit_id: mechanic/mechanic.disability
  id: a-passed-stupidity-test-keeps-the-turn-s-attacks
  covers: [head-injury-stupidity]
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.disability]
      condition_ids: [condition.disability-6]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 6}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 6}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.stupidity.0, value: 1}
    - {key: round.0.first.stupidity.1, value: 1}
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.stupidity_failed: False, state.first_charged: True}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# Result 1 (Lame and Arthritic): the bearer ends the round with an Initiative
# one point lower.  The printed penalty is read as the characteristic, which is
# one point below the supplied three; the phase order stays the declared player
# turn (the duel alternates player turns, it does not re-derive that order from
# Initiative), so the bearer's own pool resolves first.
- audit_id: mechanic/mechanic.disability
  id: a-roll-of-one-lowers-initiative-by-one
  covers: [permanent-characteristic-penalty]
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.disability]
      condition_ids: [condition.disability-1]
      # The printed result lowers both Initiative and Movement, so the supplied
      # profile has to state the base Movement the penalty applies to.
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 3, attacks: 1, movement: 3}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 3, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  # The printed one is a permanent Initiative AND Movement penalty, so the crippled
  # warrior's effective Initiative falls below the opponent's and the opponent opens
  # the round: the tape's order is that observation, not a convention.
  rolls:
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.0.first.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.initiative: 2, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
  expect_events:
    - {kind: roll, key: round.0.second.attack.0.hit, sides: 6, value: 1}
    - {kind: roll, key: round.0.first.attack.0.hit, sides: 6, value: 1}

# Result 2 (Parkinson's): the Weapon Skill is one point lower, so a four that
# would hit an equal Weapon Skill now misses.
- audit_id: mechanic/mechanic.disability
  id: a-roll-of-two-lowers-weapon-skill-by-one
  covers: [permanent-characteristic-penalty]
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.disability]
      condition_ids: [condition.disability-2]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      # Weapon Skill 5 separates the bands: the unharmed 3 hits on 4+, the
      # crippled 2 needs 5+, so the same declared four misses only with the
      # permanent penalty.  (Weapon Skill 3 against 3 would need the same 4+.)
      characteristics: {weapon_skill: 5, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: False, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

