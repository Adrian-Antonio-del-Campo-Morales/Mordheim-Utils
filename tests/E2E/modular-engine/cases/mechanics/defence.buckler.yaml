# --- Authored scenarios ---
# mechanic/defence.buckler — no armour point, one parry of an eligible hit.
#
# Expectations come from the printed rule and the two accepted clauses
# `does-not-improve-armour` / `parry-one-hit-per-round` of
# docs/knowledge/2a2b/tasks/T13-semantic-analysis.csv, never from engine output:
# the buckler never improves the armour save, and it parries an eligible
# close-combat hit when the die beats the To Hit roll (a plain parry, not the
# Swordmaster equal-or-over rule).  An unmodified Strength 3 attacker keeps the
# 6+ light-armour target unchanged, so a 5 fails exactly when the buckler adds
# nothing.  The parry die precedes the wound die, so the strict tape fixes the
# order.
#
# The first scenario declares the shared profiles as YAML anchors; the siblings
# alias them and keep their own dice and expectations.

- audit_id: mechanic/defence.buckler
  id: buckler-does-not-improve-the-armour-save
  covers: [does-not-improve-armour]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: &attacker-ws3-s3-t3-w2-i5 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      armour_id: armour.light-armour
      off_hand_id: defence.buckler
      characteristics: &defender-ws3-s3-t3-w2-i2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: &charging-first {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.parry, value: 3}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.armour, value: 5}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.saved: false, attacks.0.parried: false, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# A successful buckler parry blocks the hit outright: the die beats the To Hit
# roll, the attack is parried and no wound is resolved.

- audit_id: mechanic/defence.buckler
  id: buckler-parries-a-hit
  covers: [parry-one-hit-per-round]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: *attacker-ws3-s3-t3-w2-i5
    second:
      main_weapon_id: weapon.mace
      off_hand_id: defence.buckler
      characteristics: *defender-ws3-s3-t3-w2-i2
  duel_context: *charging-first
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.parry, value: 5}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.parried: true, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The strict boundary: a plain parry needs strictly more than the To Hit roll,
# so an equal four does not block and the wound is resolved normally.

- audit_id: mechanic/defence.buckler
  id: buckler-parry-must-beat-the-hit
  covers: [parry-one-hit-per-round]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: *attacker-ws3-s3-t3-w2-i5
    second:
      main_weapon_id: weapon.mace
      off_hand_id: defence.buckler
      characteristics: *defender-ws3-s3-t3-w2-i2
  duel_context: *charging-first
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.parry, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.parried: false, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
