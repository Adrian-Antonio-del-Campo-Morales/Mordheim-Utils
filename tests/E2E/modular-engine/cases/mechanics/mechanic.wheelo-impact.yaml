# --- Authored scenarios ---
# The Wheelo prints Attacks 2 and is built from its own band and profile, so the impact
# block is reached through the identity that owns the printed rule.  Its declared count
# die yields one Impact Hit; the impact asks for no To Hit die, wounds Toughness 3 on the
# 3+ that its fixed Strength 4 needs, meets a heavy armour save whose target the Strength
# penalty lifts to 6 (the declared one fails) and takes the target to zero Wounds, where
# the injury die leaves it Knocked Down.  The crew's own two attacks then hit automatically
# against a Knocked Down target and take only wound dice, which both miss, so the round
# closes with the Wheelo untouched and the spent wheelo.first-impact resource recorded.
- audit_id: mechanic/mechanic.wheelo-impact
  id: a-charging-wheelo-resolves-its-impact-hits-before-any-blow
  covers: [whole]
  fighters:
    first:
      collection: mordheim
      band_id: snotlings-web
      profile_id: wheelo
      main_weapon_id: weapon.dagger
    second:
      main_weapon_id: weapon.mace
      armour_id: armour.heavy-armour
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.impact-count, value: 1}
    - {key: round.0.first.impact.0.wound, value: 4}
    - {key: round.0.first.impact.0.armour, value: 1}
    - {key: round.0.first.impact.0.injury.0, value: 2}
    - {key: round.0.first.attack.0.wound, value: 1}
    - {key: round.0.first.attack.1.wound, value: 1}
  expect_rounds:
    0: {attacks.0.hit: True, attacks.0.wounded: True, attacks.0.saved: False,
        attacks.0.damage: 1, state.second.condition: KNOCKED_DOWN,
        state.second.wounds: 0, state.first.resources_spent: ['wheelo.first-impact']}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# The printed immunity, read from the same identity: the charger is the attacker, the
# Wheelo is charged, and the round asks for no impact die at all.  The first outcome is
# the charger's own declared miss, not the automatic hit a collision would be, and the
# Wheelo's two printed attacks miss as well, so no Impact Hit was dealt to the charger.
