# Printed rule text:
#   Whenever a Wheelo moves into a model, that model automatically suffers 1D3 Strength 4 hits, which are worked out before any blows are struck, in the same way as a crossbow pistol. These represent the Impact Hits of the Wheelo as it comes to a sudden stop against an unsolid object. These are only dealt in the first round of combat, and only if the Wheelo "charged" this turn. Models that charge a Wheelo during his or her turn do NOT suffer Impact Hits. If a Wheelo rolls into a friendly model, that model still suffers Impact Hits as normal. An Impact Hit does not reflect the strength of the Wheelo crew, and thus the attack will remain S4, even if the crew gains a Strength Upgrade.
