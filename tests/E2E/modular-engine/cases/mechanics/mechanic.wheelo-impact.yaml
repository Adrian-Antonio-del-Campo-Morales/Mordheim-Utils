#   When a Wheelo moves into a model that model automatically suffers 1D3 Strength 4 hits worked out before any blows are struck, only in the first round of combat and only if the Wheelo charged; the attack stays S4 even if the crew gains a Strength upgrade. Closure: a charging Wheelo resolves 1D3 automatic, unparryable Strength 4 hits before the attack pools of that round.
