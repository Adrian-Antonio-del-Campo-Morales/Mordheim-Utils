# --- Authored scenarios ---
# mechanic/weapon.ball-and-chain - Strength +2, no armour saves, D3 damage,
# and -1 to hit the wielder.
#
# Expectations come from the printed rule and the admitted clause `whole`, never
# from engine output.  The damage die is a three-sided roll, which the strict tape
# declares with its sides.  The hit-target scenarios leave the bearer unarmoured
