# The printed fire independence: the bearer carries the supplied burning state
# (initial_state: {on_fire: true}) and one lost wound. On the bearer's own round
# (index 2) the recovery die is taken while the burning state is still held and
# still succeeds (a five restores the wound), so fire does not block the attempt;
# the fire-recovery die that follows at that same round start is declared so the
# round is fully described and shows the burning state cleared (a five meets the
# fire recovery's printed 4+ recovery).  Rounds 0 and 1 fight on to reach that own
# round start: the fire recovery only runs from the second round onward, so with
# first charged the own round starts come at indices 0 and 2.  The own-turn starts
# take the recovery die before anything else in the round order, so the round-0
# own-turn start declares the attempt too (a four keeps the wound lost, waiting
# for the index-2 success while burning).  While burning the bearer prints no
# ordinary attack (its attack pool is withheld until the fire clears), so rounds
# 0 and 1 declare only the opponent's attack dice; the round-2 fight happens after
# the roll cleared the fire in that same round start.  Method note: the printed text
# supplies the expectations (one 5+ attempt regardless of fire); the exact roll keys and
# the printed no-attack behaviour of the burning bearer were read from the engine's
# known recovery order, not invented and not taken as behavioural authority — the
# scenario's contract stays the printed rule.
- audit_id: mechanic/mechanic.curse-of-the-revenant
  id: the-recovery-attempt-survives-the-bearers-burning-state
  covers: [whole]
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.curse-of-the-revenant, mechanic.great-thirster]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  initial_state:
    first: {wounds: 1, on_fire: true}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 3
  rolls:
    - {key: round.0.first.revenant, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.1.second.attack.0.hit, value: 1}
    - {key: round.2.first.revenant, value: 5}
    - {key: round.2.first.fire.extinguish, value: 5}
    - {key: round.2.first.attack.0.hit, value: 1}
    - {key: round.2.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.wounds: 1, state.first.on_fire: true}
    1: {state.first.wounds: 1, state.first.on_fire: true}
    2: {state.first.wounds: 2, state.first.on_fire: false}
  expect_final: {rounds_executed: 3, termination_reason: horizon}
