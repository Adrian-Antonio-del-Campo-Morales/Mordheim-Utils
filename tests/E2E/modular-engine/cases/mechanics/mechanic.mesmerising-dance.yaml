# --- Authored scenarios ---
# The dancer forces the opposing warrior's Leadership test at the round start.  The two
# declared sixes total twelve against Leadership 6 and fail it, so the target cannot
# attack: its pool contributes no die at all, while the dancer's own attack resolves
# normally and the target stays Standing (its defence is never removed).
- audit_id: mechanic/mechanic.mesmerising-dance
  id: a-failed-leadership-test-blocks-the-target-s-attacks
  covers: [whole]
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.mesmerising-dance]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 6}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.mesmerising-dance.0, value: 6}
    - {key: round.0.second.mesmerising-dance.1, value: 6}
    - {key: round.0.first.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: false, state.second.charm_attack_blocked: true, state.second.condition: STANDING, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

