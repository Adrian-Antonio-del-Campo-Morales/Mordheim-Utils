# --- Authored scenarios ---
# The printed chart is 1-2 knocked down, 3-5 stunned, 6 out.  A five that would be Out
# of Action on the ordinary chart leaves the Dryad Stunned instead.
- audit_id: mechanic/mechanic.fen-hard-to-kill
  id: only-a-six-takes-the-dryad-out
  covers: [out-of-action-only-on-six]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.fen-hard-to-kill]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.injury.0, value: 5}
  expect_rounds:
    0: {attacks.0.damage: 1, state.second.condition: STUNNED}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
