# --- Authored scenarios ---
# mechanic/defence.kite-shield — +2 on foot, +1 mounted.
#
# Expectations come from the printed rule and the admitted clause
# `plus-two-on-foot-plus-one-mounted` of
# docs/knowledge/2a2b/tasks/T13-semantic-analysis.csv, never from engine output.
# The kite shield is carried in the off hand and the armour choice is empty, so
# the printed bonus is the only armour modifier: on foot the defender saves on a
# 5 (7 - 2), while mounted the same shield only improves the save to 6 (7 - 2 +
# 1).  The three scenarios pin both boundaries: the 5 holds on foot, the 4 is
# one face short on foot, and the 5 that held on foot fails while mounted.  The
# strict tape also proves the shield offers no parry reaction, because no
# `parry` die is scripted or requested.
#
# The first scenario declares the shared profiles and duel context as YAML
# anchors; the siblings alias them and keep their own rolls and expectations.
# The mounted sibling declares its own defender profile so the anchor pair keeps
# a single meaning.

- audit_id: mechanic/defence.kite-shield
  id: kite-shield-on-foot-saves-on-five
  covers: [plus-two-on-foot-plus-one-mounted]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: &attacker-ws3-s3-t3-w2-i5 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      off_hand_id: defence.kite-shield
      characteristics: &defender-ws3-s3-t3-w2-i2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: &charging-first {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.armour, value: 5}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.saved: true, attacks.0.damage: 0, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

