# --- Authored scenarios ---
# mechanic/weapon.steel-whip - the refused parry and the whipcrack family.
#
# Expectations come from the printed rule and the admitted clause, never from
# engine output.  The whipcrack bonus is a shared family behaviour keyed by the
# whip tags, so these scenarios assert only the printed consequence for this
# bearer: the extra attack, its single-point cap and its timing.
# The defender wields a parrying sword and has parries left, yet the landed hit
# draws no parry die from the tape: the printed refusal is denied before the roll.
