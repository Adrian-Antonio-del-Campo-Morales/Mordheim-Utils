# --- Authored scenarios ---
# mechanic/weapon.vomit-attack - the optional whole-pool replacement.
#
# The replacement is only exposed on a bearer that carries the selectable ability
# `troll--vomit-attack` (band black-orcs, profile troll).  That bearer is a Troll
# whose automatic profile rules make the round a deception round: `troll--stupidity`
# adds `mechanic.stupidity`, so the active participant must pass a two-dice
# Leadership test before any attack (keys `round.0.first.stupidity.0` and `.1`,
# passing on a sum no greater than Leadership 4), and `troll--regeneration` and
# `troll--fear` are carried but stay idle because the Troll is neither wounded nor
# charged.  The declaration itself is the decision `round.0.first.vomit-attack`.
#
# The replacement yields exactly one attack, an automatic hit at Strength 5, no
# To Hit die, no armour die (even against plate armour) and no parry die (even
# against a sword).  The Troll acts last (Initiative 1), so the defender's own
# attack is the first entry of the round.
- audit_id: mechanic/weapon.vomit-attack
  id: the-declared-replacement-is-one-automatic-strength-five-hit-ignoring-armour-and-parry
  covers: [whole]
  fighters:
    first:
      collection: mordheim
      band_id: black-orcs
      profile_id: troll
      special_rule_ids: [troll--vomit-attack]
    second:
      main_weapon_id: weapon.sword
      armour_id: armour.plate-armour
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.vomit-attack, value: true}
  rolls:
    - {key: round.0.first.stupidity.0, value: 1}
    - {key: round.0.first.stupidity.1, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.0.first.attack.0.wound, value: 3}
  expect_rounds:
    0: {attacks.1.hit: true, attacks.1.saved: false, attacks.1.parried: false,
        attacks.1.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
  expect_events:
    - {kind: roll, key: round.0.first.stupidity.0, sides: 6, value: 1}
    - {kind: roll, key: round.0.first.stupidity.1, sides: 6, value: 1}
    - {kind: decision, key: round.0.first.vomit-attack, value: true}
    - {kind: roll, key: round.0.second.attack.0.hit, sides: 6, value: 1}
    - {kind: roll, key: round.0.first.attack.0.wound, sides: 6, value: 3}

# Declining the replacement leaves the ordinary pool of three natural attacks (the
# profile's Attacks 3), each rolling its own To Hit die: four hit dice in the round
# against the single wound die of the declared variant.
- audit_id: mechanic/weapon.vomit-attack
  id: declining-the-replacement-leaves-the-ordinary-attack-pool
  covers: [optional-declaration]
  fighters:
    first:
      collection: mordheim
      band_id: black-orcs
      profile_id: troll
      special_rule_ids: [troll--vomit-attack]
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.vomit-attack, value: false}
  rolls:
    - {key: round.0.first.stupidity.0, value: 1}
    - {key: round.0.first.stupidity.1, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.first.attack.1.hit, value: 1}
    - {key: round.0.first.attack.2.hit, value: 1}
  expect_rounds:
    0: {attacks.1.hit: false, state.first.wounds: 3, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
  expect_events:
    - {kind: roll, key: round.0.first.stupidity.0, sides: 6, value: 1}
    - {kind: roll, key: round.0.first.stupidity.1, sides: 6, value: 1}
    - {kind: decision, key: round.0.first.vomit-attack, value: false}
    - {kind: roll, key: round.0.second.attack.0.hit, sides: 6, value: 1}
    - {kind: roll, key: round.0.first.attack.0.hit, sides: 6, value: 1}
    - {kind: roll, key: round.0.first.attack.1.hit, sides: 6, value: 1}
    - {kind: roll, key: round.0.first.attack.2.hit, sides: 6, value: 1}
