# The strictures warrior charges an opponent who is neither a Carnival of Chaos
# warrior nor a follower of Onogal, so the printed permission is absent and the
# duel is refused at its initialization instead of resolving a forbidden charge.
- audit_id: mechanic/mechanic.shallya-strictures
  id: a-charge-against-an-unqualified-opponent-is-refused
  covers: [whole]
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.shallya-strictures]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  expect_error: "Shallyan Strictures permit charges only against Carnival of Chaos or followers of Onogal"
