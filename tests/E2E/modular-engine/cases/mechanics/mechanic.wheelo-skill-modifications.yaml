# Clause: whole--scope--mighty-blow (scope: YES)
# PARTIAL[whole--scope--mighty-blow]: no scenario separates the printed +1 to wound from the Strength the source replaces with it. The executor applies the swap to a bearer carrying both mechanic.wheelo-skill-modifications and skill.mighty-blow by subtracting one from strength_bonus and adding one to wound_modifier (compiler.py:581-584). The Wheelo crew's printed Strength 4 therefore enters the wound table as Strength 3, whose 4+ against Toughness 3 the printed +1 improves to 3+, exactly the 3+ Strength 4 reaches unaided: the two changes cancel on the wound target, so no wound die can evidence the bonus. The duel vocabulary also exposes neither the attack's wound modifier nor the compiled strength_bonus, so the only duel-visible difference of the swap is the one-point softer armour save (Strength 3 rather than 4) and the Strength-dependent gates, which follow from the substitution and not from the printed bonus. The missing datum is a target whose wound table separates +1 to wound from +1 Strength, or an observation of the compiled effect fields.
