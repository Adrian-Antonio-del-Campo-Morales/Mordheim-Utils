# Two attack entries are resolved on the charge turn, so attacks.1 exists.
- audit_id: mechanic/mechanic.thirst-for-vengeance
  id: a-charging-turn-carries-one-more-attack
  covers: [charge-attack-bonus]
  fighters:
    first:
      skill_ids: [mechanic.thirst-for-vengeance]
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.first.attack.1.hit, value: 2}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.1.hit: false, attacks.1.damage: 0}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
