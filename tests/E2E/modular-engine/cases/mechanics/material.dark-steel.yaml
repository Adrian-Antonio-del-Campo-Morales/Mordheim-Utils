# --- Authored scenarios ---
# mechanic/material.dark-steel — re-roll failed wound rolls once.
#
# Expectations come from the printed rule and the accepted clause `whole` of
# docs/knowledge/2a2b/tasks/T13-semantic-analysis.csv, never from engine output:
# dark steel reroll_wounds, so a failed To Wound roll is taken again once.  The
# wound die is keyed on the attack with a `.reroll` suffix, so the strict tape
# proves whether the re-roll was offered: the failed-wound scenario consumes it,
# the successful-wound scenario must not request it.
#
# The first scenario declares the shared profiles as YAML anchors; the sibling
# aliases them and keeps its own wound dice and expectation.

- audit_id: mechanic/material.dark-steel
  id: dark-steel-rerolls-a-failed-wound
  covers: [whole]
  fighters:
    first:
      main_weapon_id: weapon.mace
      main_material_id: material.dark-steel
      characteristics: &attacker-ws3-s3-t3-w2-i5 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: &defender-ws3-s3-t3-w2-i2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: &charging-first {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 3}
    - {key: round.0.first.attack.0.wound.reroll, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

- audit_id: mechanic/material.dark-steel
