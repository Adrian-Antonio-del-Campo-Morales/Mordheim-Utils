# --- Authored scenarios ---
# mechanic/weapon.hellblade - Strength +1, Soulseeking +1 To Hit, Deadly critical
# hits on 5-6, two-handed, magical, and no mortal special metal.
#
# Expectations come from the printed rule and the admitted clauses, never from
# engine output.  The Undead exception is declared through the model's own
# undead/possessed fact, which is how the roster declares that identity.
# Strength +1 moves the wound target against Toughness 3 to 3+.

- audit_id: mechanic/weapon.hellblade
  id: hellblade-wounds-at-the-boosted-strength
  covers: [whole--scope--combat-profile-and-soulseeking]
  fighters:
    first:
      main_weapon_id: weapon.hellblade
      characteristics: &a-ws3-s3-t3-w2-i5 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: &d-ws3-s3-t3-w2-i2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 3}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# An equal Weapon Skill would need a 4; Soulseeking's printed +1 To Hit moves the target to a 3, and the 3 hits.

- audit_id: mechanic/weapon.hellblade
  id: hellblade-hits-on-a-three-because-of-soulseeking
  covers: [whole--scope--combat-profile-and-soulseeking]
  fighters:
    first:
      main_weapon_id: weapon.hellblade
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 3}
    - {key: round.0.first.attack.0.wound, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: True, attacks.0.hit_target: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# The printed exception: Soulseeking does not work on Undead or Demon models, so the same 3 that hits a living opponent misses and the recorded target stays the ordinary 4.

- audit_id: mechanic/weapon.hellblade
  id: soulseeking-grants-nothing-against-the-undead
  covers: [whole--scope--combat-profile-and-soulseeking]
  fighters:
    first:
      main_weapon_id: weapon.hellblade
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      trait_overrides: {creature_kind: undead}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 3}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: False, attacks.0.hit_target: 4}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# Deadly turns a wound roll of 5 into a critical hit, which the extra critical-table die and the doubled damage prove.

- audit_id: mechanic/weapon.hellblade
  id: deadly-makes-a-five-a-critical-wound
  covers: [whole--scope--deadly]
  fighters:
    first:
      main_weapon_id: weapon.hellblade
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: &d-ws3-s3-t3-w3-i2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 5}
    - {key: round.0.first.attack.0.critical, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.critical: True, attacks.0.damage: 2, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# The printed exception: a warrior who needs 5s or higher to wound gains nothing from Deadly, so the wound roll of 5 is an ordinary wound and no critical die is requested.

- audit_id: mechanic/weapon.hellblade
  id: deadly-does-not-apply-when-five-is-needed-to-wound
  covers: [whole--scope--deadly]
  fighters:
    first:
      main_weapon_id: weapon.hellblade
      characteristics: {weapon_skill: 3, strength: 2, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: &d-ws3-s3-t4-w2-i2 {weapon_skill: 3, strength: 3, toughness: 4, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 5}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.critical: False, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# The printed prohibition on Gromril, Ithilmar or similar mortal metals is declared as a refusal.

- audit_id: mechanic/weapon.hellblade
  id: hellblade-is-refused-with-a-special-metal
  covers: [material-prohibition]
  fighters:
    first:
      main_weapon_id: weapon.hellblade
      main_material_id: material.gromril
    second:
      main_weapon_id: weapon.mace
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  expect_error: "Hellblade cannot be made of mortal special metals"
# The printed prohibition on an additional weapon is declared as a refusal.

- audit_id: mechanic/weapon.hellblade
  id: hellblade-is-refused-with-an-additional-weapon
  covers: [whole--scope--two-handed-loadout]
  fighters:
    first:
      main_weapon_id: weapon.hellblade
      off_hand_id: weapon.dagger
    second:
      main_weapon_id: weapon.mace
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  expect_error: "main weapon occupies both hands"
