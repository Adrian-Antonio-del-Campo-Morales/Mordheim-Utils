    second:
      main_weapon_id: weapon.mace
      characteristics: &ss-opponent {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1}
  duel_context: &ss-context {charging: [], active_participant: first}
  maximum_rounds: 1
