# mechanic/skill.shield-strike - authored from the printed "gains an additional
# attack at the user's Strength; armour is modified normally according to that
# Strength" clause and the recorded contract, never from engine output.
# The compiler appends the extra attack after the main weapon, so the shield's
# attack is the second weapon of the pool (attack index 1) and the main weapon's
