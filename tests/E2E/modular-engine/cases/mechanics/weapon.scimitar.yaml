# --- Authored scenarios ---
# weapon.scimitar - may parry and applies an additional -1 armour-save modifier.
# A scimitar may parry and applies an additional -1 armour-save modifier. A worn 5+ save is moved to 6+, so a 5 no longer saves.

- audit_id: mechanic/weapon.scimitar
  id: scimitar-save-fails-one-below-the-penalised-target
  covers: [whole]
  fighters:
    first:
      main_weapon_id: weapon.scimitar
      characteristics: &atk-ws3-s3-t3-w2-i5 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      armour_id: armour.heavy-armour
      characteristics: &dfn-ws3-s3-t3-w2-i2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: &charging-first {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.armour, value: 5}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.saved: false, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
