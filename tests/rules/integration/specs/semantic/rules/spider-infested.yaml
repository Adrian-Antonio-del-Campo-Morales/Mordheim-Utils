schema_version: 1
specifications:
- id: mechanic-and-editorial-spider-infested
  scope_digest: 5fd7034eceb69daeeac4b0ad8bba9f2bc5ba50ca65a102d49b69e25f85d18dc9
  category: stateful
  sources:
  - target: mechanic/mechanic.spider-infested
    digest: c251f53487ce9d32b01afc007f97de3319ff1104ebcf586345fceba107f08ab6
  - target: rule/trollheim/lustria-savage-goblins/band--savage-goblin-special-skills-spider-infested/mechanic.spider-infested
    digest: 65a2b5da1f20cd7988b822b346cc34aed724457016c63a4d13aac7cbb7a58c3f
  interpretation: Each failed to-hit roll against the hero, and each attack it parries, accumulates -1
    Initiative on the attacker while the duel continues. The penalty can reach Initiative 0. Unparried
    hits do not generate it.
  cases:
  - id: compiled
    roles:
    - compiled
    operation: compile
    attacker:
      skill_ids:
      - mechanic.spider-infested
    expect:
      attacker.fighter_id: custom:custom
    expect_contains:
      attacker.global_effects.tags:
      - mechanic.spider-infested
  - id: editorial-recipients
    roles:
    - grant
    operation: selectable_grant
    defender:
      collection: trollheim
      band_id: lustria-savage-goblins
      profile_id: big-boss
    context:
      rule_id: band--savage-goblin-special-skills-spider-infested
    expect:
      result.recipients:
      - big-boss
      - red-teeth
      - trackers
      - witch-doctor
  - id: three-misses-reach-zero
    roles:
    - active
    - boundary
    - sequence
    - consumption
    operation: spider_priority
    attacker:
      main_weapon_id: weapon.mace
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 2
        initiative: 3
        attacks: 3
    defender:
      skill_ids:
      - mechanic.spider-infested
    context:
      count: 3
    rolls:
    - key: test.attack.0.hit
      value: 1
    - key: test.attack.1.hit
      value: 1
    - key: test.attack.2.hit
      value: 1
    expect:
      result.attacker.initiative_penalty: 3
      result.attacker.initiative_floor: 0
      result.priority.initiative: 0
  - id: successful-parry-penalizes
    roles:
    - active
    - sequence
    - consumption
    operation: spider_priority
    attacker:
      main_weapon_id: weapon.mace
    defender:
      main_weapon_id: weapon.sword
      skill_ids:
      - mechanic.spider-infested
    context:
      count: 1
    rolls:
    - key: test.attack.0.hit
      value: 4
    - key: test.attack.0.parry
      value: 5
    expect:
      result.attacker.initiative_penalty: 1
      result.attacks.0.parried: true
  - id: ordinary-defender-control
    roles:
    - inactive
    operation: spider_priority
    attacker:
      main_weapon_id: weapon.mace
    defender:
      main_weapon_id: weapon.mace
    context:
      count: 1
    rolls:
    - key: test.attack.0.hit
      value: 1
    expect:
      result.attacker.initiative_penalty: 0
      result.priority.initiative: 3
  mutations:
  - id: remove-infestation
    path: defender.global_effects.tags
    value: []
    cases:
    - three-misses-reach-zero
    - successful-parry-penalizes
