schema_version: 1
specifications:
- id: skill.bellowing-battle-roar
  scope_digest: 5fd7034eceb69daeeac4b0ad8bba9f2bc5ba50ca65a102d49b69e25f85d18dc9
  category: contextual
  sources:
  - target: mechanic/skill.bellowing-battle-roar
    digest: 7ca8b52b90cca04290096d7700eb8611eddc3a9a9183354b26fca3ac5e5d9889
  interpretation: An enemy fighting the Saurus suffers -1 on every To Hit roll during the first round
    of that close combat. The modifier belongs to the defender and therefore affects its opponent; it
    expires after the first round.
  interaction_contract:
    reads:
    - round.first
    - hit.target
    writes:
    - hit.target
  cases:
  - id: compiled-on-defender
    roles:
    - compiled
    operation: compile
    defender:
      skill_ids:
      - skill.bellowing-battle-roar
      main_weapon_id: weapon.mace
    expect:
      defender.characteristics.attacks: 1
    expect_contains:
      defender.global_effects.tags:
      - skill.bellowing-battle-roar
  - id: penalizes-enemy-first-round
    roles:
    - active
    - boundary
    - consumer
    operation: hit
    attacker:
      main_weapon_id: weapon.mace
    defender:
      skill_ids:
      - skill.bellowing-battle-roar
      main_weapon_id: weapon.mace
    context:
      first_round: true
    distribution:
      observable: result.success
      max_rolls: 1
      expected:
        'true': 1/3
        'false': 2/3
  - id: expires-after-first-round
    roles:
    - inactive
    - boundary
    operation: hit
    attacker:
      main_weapon_id: weapon.mace
    defender:
      skill_ids:
      - skill.bellowing-battle-roar
      main_weapon_id: weapon.mace
    context:
      first_round: false
    distribution:
      observable: result.success
      max_rolls: 1
      expected:
        'true': 1/2
        'false': 1/2
  - id: ordinary-defender-does-not-penalize
    roles:
    - inactive
    operation: hit
    attacker:
      main_weapon_id: weapon.mace
    defender:
      main_weapon_id: weapon.mace
    context:
      first_round: true
    distribution:
      observable: result.success
      max_rolls: 1
      expected:
        'true': 1/2
        'false': 1/2
  mutations:
  - id: remove-roar
    path: defender.global_effects.tags
    value: []
    cases:
    - penalizes-enemy-first-round
