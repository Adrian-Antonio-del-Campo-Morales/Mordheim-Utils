schema_version: 1
specifications:
- id: horned-hunter-animal-friendship
  scope_digest: 5fd7034eceb69daeeac4b0ad8bba9f2bc5ba50ca65a102d49b69e25f85d18dc9
  category: contextual
  sources:
  - target: rule/mordheim/horned-hunters/band--horned-hunter-special-skills-animal-friendship/trait.animal-friendship
    digest: 3115242c7f2a688afc7a4d3ed911fb367d279487a60150e4fbb5043772202bc2
  interpretation: The three heroes with access to Horned Hunter skills may choose Animal Friendship. A
    normal animal does not make attacks against the bearer; the rule does not prevent attacking enemies
    without the animal classification.
  cases:
  - id: recipients
    roles:
    - grant
    operation: selectable_grant
    defender:
      band_id: horned-hunters
      profile_id: horned-hunter
    context:
      rule_id: band--horned-hunter-special-skills-animal-friendship
    expect:
      result.recipients:
      - horned-hunter
      - initiates
      - priest-of-taal
  - id: animal-refuses
    roles:
    - compiled
    - active
    - consumer
    - boundary
    operation: opposed_attacks
    attacker:
      band_id: witch-hunters
      profile_id: war-hounds
    defender:
      band_id: horned-hunters
      profile_id: horned-hunter
      special_rule_ids:
      - band--horned-hunter-special-skills-animal-friendship
    expect:
      result.attacks: 0
    expect_contains:
      defender.global_effects.tags:
      - animal_friendship
  - id: ordinary-warrior-attacks
    roles:
    - inactive
    operation: opposed_attacks
    attacker:
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 1
        initiative: 3
        attacks: 2
    defender:
      band_id: horned-hunters
      profile_id: horned-hunter
      special_rule_ids:
      - band--horned-hunter-special-skills-animal-friendship
    expect:
      result.attacks: 2
  mutations:
  - id: remove-friendship
    path: defender.global_effects.tags
    value: []
    cases:
    - animal-refuses
