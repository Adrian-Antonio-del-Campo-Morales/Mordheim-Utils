schema_version: 1
specifications:
- id: editorial-troll-regeneration-black-orcs
  scope_digest: 5fd7034eceb69daeeac4b0ad8bba9f2bc5ba50ca65a102d49b69e25f85d18dc9
  category: contextual
  sources:
  - target: rule/mordheim/black-orcs/troll--regeneration/skill.regeneration
    digest: 9f09a1c112c2908975b1a4e81f9f17740753fa4041991f16c1e8b1beee072c19
  depends_on:
  - mechanic/skill.regeneration
  interpretation: The Troll alone receives this inherent regeneration. It ignores a wound on 4, 5 or 6,
    but cannot regenerate fire wounds. A blocked save must not request a die. Post-battle injury rules
    are outside this combat specification.
  cases:
  - id: recipient
    roles:
    - grant
    operation: grant
    defender:
      band_id: black-orcs
      profile_id: troll
    context:
      rule_id: troll--regeneration
    expect:
      result.recipients:
      - troll
  - id: compiled
    roles:
    - compiled
    operation: compile
    defender:
      band_id: black-orcs
      profile_id: troll
    expect:
      defender.global_effects.regeneration_save: 4
      defender.global_effects.regeneration_blocked_by_fire: true
  - id: all-faces
    roles:
    - active
    - consumer
    - boundary
    operation: special_save
    defender:
      band_id: black-orcs
      profile_id: troll
    distribution:
      observable: result.saved
      max_rolls: 1
      expected:
        'true': 1/2
        'false': 1/2
  - id: three-fails
    roles:
    - boundary
    operation: special_save
    defender:
      band_id: black-orcs
      profile_id: troll
    rolls:
    - key: special.regeneration
      value: 3
    expect:
      result.saved: false
      result.ward_roll: null
      result.regeneration_roll: 3
  - id: four-saves
    roles:
    - boundary
    operation: special_save
    defender:
      band_id: black-orcs
      profile_id: troll
    rolls:
    - key: special.regeneration
      value: 4
    expect:
      result.saved: true
      result.source: regeneration
      result.ward_roll: null
      result.regeneration_roll: 4
  - id: fire-omits-roll
    roles:
    - inactive
    operation: special_save
    attacker:
      main_weapon_id: weapon.brazier-iron
    defender:
      band_id: black-orcs
      profile_id: troll
    rolls: []
    expect:
      context.regeneration_blocked: true
      result.saved: false
      result.regeneration_roll: null
  mutations:
  - id: remove-regeneration
    path: defender.global_effects.regeneration_save
    value: 7
    cases:
    - all-faces
  - id: worsen-threshold
    path: defender.global_effects.regeneration_save
    value: 5
    cases:
    - all-faces
    - four-saves
  - id: allow-fire-regeneration
    path: defender.global_effects.regeneration_blocked_by_fire
    value: false
    cases:
    - fire-omits-roll
