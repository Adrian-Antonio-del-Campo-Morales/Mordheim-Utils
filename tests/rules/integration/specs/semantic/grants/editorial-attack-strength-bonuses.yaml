schema_version: 1
specifications:
- id: editorial-red-fury-grant
  scope_digest: 5fd7034eceb69daeeac4b0ad8bba9f2bc5ba50ca65a102d49b69e25f85d18dc9
  category: permanent
  sources:
  - target: rule/trollheim/chaos-streets-undead-bloodlines/band--blood-dragon-power-red-fury/skill.red-fury
    digest: 7c625ba462f33b26a2ec5f608f898f5b3bb81b22511cd6e0a62ecbb721fc0154
  depends_on:
  - mechanic/skill.red-fury
  interpretation: Red Fury grants the Blood Dragon Vampire one additional Attack, giving three rather
    than two.
  cases:
  - id: exact-recipient
    roles:
    - grant
    - compiled
    operation: selectable_grant
    defender:
      collection: trollheim
      band_id: chaos-streets-undead-bloodlines
      profile_id: blood-dragon-vampire
    context:
      rule_id: band--blood-dragon-power-red-fury
    expect:
      result.recipients:
      - blood-dragon-vampire
  - id: granted-consumer
    roles:
    - consumer
    - boundary
    operation: attacks
    attacker:
      collection: trollheim
      band_id: chaos-streets-undead-bloodlines
      profile_id: blood-dragon-vampire
      special_rule_ids:
      - band--blood-dragon-power-red-fury
    expect:
      attacker.global_effects.attacks_bonus: 1
      result.attacks: 3
  - id: without-grant
    roles:
    - boundary
    operation: attacks
    attacker:
      collection: trollheim
      band_id: chaos-streets-undead-bloodlines
      profile_id: blood-dragon-vampire
    expect:
      result.attacks: 2
  mutations:
  - id: remove-contribution
    path: attacker.global_effects.attacks_bonus
    value: 0
    cases:
    - granted-consumer
