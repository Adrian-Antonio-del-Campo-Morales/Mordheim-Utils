    digest: de16d9489f1b052705c554f2ddf11814449c9ea3936fff4fb6ff7c502728bc3a
  interpretation: Each access rule grants exactly the editorial list of special skills to the indicated
    hero profiles. The list is consulted even when a given skill is outside the duel runtime; that does
    not make its behaviour implemented. Henchman controls receive no access.
  cases:
  - id: amazon-heroines
    roles:
    - grant
    - accepted
    operation: special_rule_access
    attacker:
      band_id: amazons-lustria
      profile_id: serpent-priestess
    expect:
      result.rules:
      - band--amazon-special-skills-concealment
      - band--amazon-special-skills-elixir-of-life
      - band--amazon-special-skills-mesmerising-dance
      - band--amazon-special-skills-savage-fury
      - band--amazon-special-skills-skink-hunter
  - id: amazon-henchman-control
    roles:
    - rejected
    operation: special_rule_access
    attacker:
      band_id: amazons-lustria
      profile_id: amazon-warriors
    expect:
      result.rules: []
  - id: arab-heroes
    roles:
    - grant
    - accepted
    operation: special_rule_access
    attacker:
      band_id: arabian-tomb-raiders
      profile_id: sheikh
    expect:
      result.rules:
      - band--arabian-tomb-raiders-special-skills-hit-and-run
      - band--arabian-tomb-raiders-special-skills-sand-worm
      - band--arabian-tomb-raiders-special-skills-weather-tolerant
  - id: cathay-dragon-monks
    roles:
    - grant
    - accepted
    operation: special_rule_access
    attacker:
      band_id: battle-monks-of-cathay
      profile_id: dragon-monks
    expect:
