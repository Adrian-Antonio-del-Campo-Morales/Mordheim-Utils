      - band--battle-monks-special-skills-energy-focus
      - band--battle-monks-special-skills-human-shield
      - band--battle-monks-special-skills-leap-of-faith
      - band--battle-monks-special-skills-lightning-speed
  - id: cathay-emissary
    roles:
    - grant
    - accepted
    operation: special_rule_access
    attacker:
      band_id: battle-monks-of-cathay
      profile_id: emissary
