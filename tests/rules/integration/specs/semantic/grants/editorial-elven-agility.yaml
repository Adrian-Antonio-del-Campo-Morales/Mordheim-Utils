schema_version: 1
specifications:
- id: editorial-elven-agility-grants
  scope_digest: 5fd7034eceb69daeeac4b0ad8bba9f2bc5ba50ca65a102d49b69e25f85d18dc9
  category: permanent
  sources:
  - target: rule/trollheim/chaos-streets-sons-of-nagarythe/band--shadow-warrior-special-skills-elven-agility/skill.elven-agility
    digest: c23afdedebd84a0164d6114cc1067ff3ce8da4d2ae40d46317ae3fe6e4008d5d
  - target: rule/trollheim/lustria-dark-elves/band--dark-elf-special-skills-elven-agility/skill.elven-agility
    digest: d3b4423da978cdc22c369332997ef8ffaab9797e5a74574a421915bdec1e82e6
  - target: rule/trollheim/lustria-high-elves/band--high-elf-special-skills-elven-agility/skill.elven-agility
    digest: 4ee7b063d118ea1b9185ecda8d692550e2ad64ab398ca4d92b424333dc2aafd4
  depends_on:
  - mechanic/skill.elven-agility
  interpretation: Each publication restricts this selectable skill to its listed Elf heroes. The three
    editorial variants compile the same canonical 6+ close-combat save; shooting and Dodge remain outside
    the duel scope.
  cases:
  - id: sons-of-nagarythe-heroes
    roles:
    - grant
    - compiled
    operation: selectable_grant
    defender:
      collection: trollheim
      band_id: chaos-streets-sons-of-nagarythe
      profile_id: shadow-master
    context:
      rule_id: band--shadow-warrior-special-skills-elven-agility
    expect:
      result.recipients:
      - shadow-master
      - shadow-walker
      - shadow-weaver
  - id: dark-elf-heroes
    roles:
    - grant
    operation: selectable_grant
    defender:
      collection: trollheim
      band_id: lustria-dark-elves
      profile_id: dark-prince
    context:
      rule_id: band--dark-elf-special-skills-elven-agility
    expect:
      result.recipients:
      - beastmaster
      - dark-elf-sorceress
      - dark-prince
      - darkblades
  - id: high-elf-heroes
    roles:
    - grant
    operation: selectable_grant
    defender:
      collection: trollheim
      band_id: lustria-high-elves
      profile_id: loremaster
    context:
      rule_id: band--high-elf-special-skills-elven-agility
    expect:
      result.recipients:
      - explorers
      - loremaster
      - sword-guardians
  - id: granted-consumer
    roles:
    - active
    - boundary
    - consumer
    operation: special_save
    defender:
      collection: trollheim
      band_id: lustria-high-elves
      profile_id: loremaster
      special_rule_ids:
      - band--high-elf-special-skills-elven-agility
    distribution:
      observable: result.saved
      max_rolls: 1
      expected:
        'true': 1/6
        'false': 5/6
  mutations:
  - id: remove-granted-agility
    changes:
    - path: defender.global_effects.ward_save
      value: 7
    - path: defender.global_effects.tags
      value: []
    cases:
    - granted-consumer
