schema_version: 1
specifications:
- id: chapel-guard-chivalry
  scope_digest: 5fd7034eceb69daeeac4b0ad8bba9f2bc5ba50ca65a102d49b69e25f85d18dc9
  category: construction
  sources:
  - target: rule/mordheim/bretonnian-chapel-guard/band--chivalry/mechanic.chivalry
    digest: 8fdab078713020c532e53b295403a25dd7cd19751640d1d087f170586a9c51e1
  interpretation: Knights cannot use missile weapons, poisons or drugs; an ordinary build remains legal.
  cases:
  - id: poison-and-drug-rejected
    roles:
    - grant
    - accepted
    - rejected
    operation: equipment_choices
    attacker:
      band_id: bretonnian-chapel-guard
      profile_id: knights-errant
    context:
      choices:
        ordinary: {}
        poison:
          main_poison_id: poison.black-lotus
        drug:
          preparation_ids:
          - preparation.crimson-shade
        missile:
          main_weapon_id: weapon.pistol
    expect:
      result.accepted:
      - ordinary
      result.rejected:
        poison: 'poisons are forbidden for Knights: bretonnian-chapel-guard/knights-errant'
        drug: 'drugs are forbidden for Knights: bretonnian-chapel-guard/knights-errant'
        missile: 'missile weapons are forbidden for Knights: bretonnian-chapel-guard/knights-errant'
  - id: contract-present
    operation: construction_tag_presence
    attacker:
      band_id: bretonnian-chapel-guard
      profile_id: knights-errant
    context:
      tag: compiler.chivalry
    expect:
      result.present: true
  mutations:
  - id: remove-chivalry-contract
    path: attacker.construction_tags
    value: []
    cases:
    - contract-present
- id: bandit-powder-restriction
  scope_digest: 5fd7034eceb69daeeac4b0ad8bba9f2bc5ba50ca65a102d49b69e25f85d18dc9
  category: construction
  sources:
  - target: rule/mordheim/hochland-bandits/band--powders-expensive/compiler.powder-s-expensive
    digest: aecdaa3d8aa7d970c9c7be6a5c4357b3f03756df71a7d5f18ea763802211484f
  interpretation: Bandit Henchmen cannot buy blackpowder weapons; Heroes keep whatever access corresponds
    to them. Campaign costs are not part of the duel.
  cases:
  - id: henchman-pistol-rejected
    roles:
    - grant
    - accepted
    - rejected
    operation: equipment_choices
    attacker:
      band_id: hochland-bandits
      profile_id: thugs
    context:
      choices:
        ordinary: {}
        pistol:
          main_weapon_id: weapon.pistol
    expect:
      result.accepted:
      - ordinary
      result.rejected:
        pistol: 'blackpowder weapons are forbidden for Bandit Henchmen: hochland-bandits/thugs'
  - id: contract-present
    operation: construction_tag_presence
    attacker:
      band_id: hochland-bandits
      profile_id: thugs
    context:
      tag: compiler.powder-s-expensive
    expect:
      result.present: true
  mutations:
  - id: remove-powder-contract
    path: attacker.construction_tags
    value: []
    cases:
    - contract-present
- id: saurus-skill-and-missile-prohibitions
  scope_digest: 5fd7034eceb69daeeac4b0ad8bba9f2bc5ba50ca65a102d49b69e25f85d18dc9
  category: construction
  sources:
  - target: rule/mordheim/lizardmen/band--saurus-skill-prohibitions/compiler.saurus-skill-prohibitions
    digest: 0dc8e64c5c1826479e053ac8cb5aa9cdb0df03afb11fe984dc444236b2ba356e
  interpretation: Saurus Totem Warriors and Braves reject Academic skills and every missile weapon, regardless
    of later generic accesses.
  cases:
  - id: academic-rejected
    roles:
    - grant
    - accepted
    - rejected
    operation: selection_choices
    attacker:
      band_id: lizardmen
      profile_id: saurus-totem-warrior
    context:
      choices:
        ordinary: {}
        academic:
          skill_ids:
          - skill.arcane-lore
    expect:
      result.accepted:
      - ordinary
      result.rejected:
        academic: 'Academic skills are forbidden for Saurus: [''skill.arcane-lore'']'
  - id: missile-rejected
    operation: equipment_choices
    attacker:
      band_id: lizardmen
      profile_id: saurus-totem-warrior
    context:
      choices:
        ordinary: {}
        missile:
          main_weapon_id: weapon.pistol
    expect:
      result.accepted:
      - ordinary
      result.rejected:
        missile: missile weapons are forbidden for Saurus
  - id: contract-present
    operation: construction_tag_presence
    attacker:
      band_id: lizardmen
      profile_id: saurus-totem-warrior
    context:
      tag: compiler.saurus-skill-prohibitions
    expect:
      result.present: true
  mutations:
  - id: remove-saurus-contract
    path: attacker.construction_tags
    value: []
    cases:
    - contract-present
