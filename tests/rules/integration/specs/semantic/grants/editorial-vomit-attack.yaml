  interpretation: Every cited profile entry grants the optional Vomit attack exclusively to the Troll
    profile. The profile's legal weapon construction exposes the canonical Vomit mechanism; all other
    profiles in each band must reject the same selection.
  cases:
  - id: black-orcs-only-troll
    roles:
    - grant
    - compiled
    operation: selectable_grant
    defender:
      collection: mordheim
      band_id: black-orcs
      profile_id: troll
    context:
      rule_id: troll--vomit-attack
    expect:
      result.recipients:
      - troll
  - id: night-goblins-mic-only-troll
    roles:
    - grant
    operation: selectable_grant
    defender:
      collection: mordheim
      band_id: night-goblins-mic
      profile_id: troll
    context:
      rule_id: troll--vomit-attack
    expect:
      result.recipients:
      - troll
  - id: night-goblins-web-only-troll
    roles:
    - grant
    operation: selectable_grant
    defender:
      collection: mordheim
      band_id: night-goblins-web
      profile_id: troll
    context:
      rule_id: troll--vomit-attack
    expect:
      result.recipients:
      - troll
  - id: orc-mob-only-troll
    roles:
    - grant
    operation: selectable_grant
    defender:
      collection: mordheim
      band_id: orc-mob
      profile_id: troll
    context:
      rule_id: troll--vomit-attack
    expect:
      result.recipients:
