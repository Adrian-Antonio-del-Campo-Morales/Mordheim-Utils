schema_version: 1
specifications:
- id: category-prohibitions-battle-monks-of-cathay-poison
  scope_digest: 5fd7034eceb69daeeac4b0ad8bba9f2bc5ba50ca65a102d49b69e25f85d18dc9
  category: construction
  sources:
  - target: rule/mordheim/battle-monks-of-cathay/band--distaste-for-poison/compiler.forbid-item-categories
    digest: 30ba946d9d1f2f57df3bdf081c099d8390beb858390e3625d68ea235ac6c0a93
  interpretation: 'Prohibition band--distaste-for-poison: recipients cross-checked against the text and
    profiles of battle-monks-of-cathay. An explicit rejection for the forbidden category is required,
    not merely the absence of the equipment from a list. Each recipient keeps its ordinary build. Projectiles:
    the two pistols represented in the duel runtime are tested, not shooting or other excluded subsystems.'
  cases:
  - id: recipients
    roles:
    - grant
    operation: grant
    defender:
      collection: mordheim
      band_id: battle-monks-of-cathay
      profile_id: dragon-monks
    context:
      rule_id: band--distaste-for-poison
    expect:
      result.recipients:
      - dragon-monks
      - warrior-monks
  - id: choices-dragon-monks
    roles:
    - accepted
    - rejected
    operation: equipment_choices
    attacker:
      collection: mordheim
      band_id: battle-monks-of-cathay
      profile_id: dragon-monks
      main_weapon_id: weapon.sword
    context:
      choices:
        ordinary: {}
        black-lotus:
          main_poison_id: poison.black-lotus
        nightshade:
          main_poison_id: poison.nightshade
    expect:
      result.accepted:
      - ordinary
      result.rejected:
        black-lotus: poisons are forbidden for battle-monks-of-cathay/dragon-monks
        nightshade: poisons are forbidden for battle-monks-of-cathay/dragon-monks
  - id: choices-warrior-monks
    roles:
    - accepted
    - rejected
    operation: equipment_choices
    attacker:
      collection: mordheim
      band_id: battle-monks-of-cathay
      profile_id: warrior-monks
      main_weapon_id: weapon.sword
    context:
      choices:
        ordinary: {}
        black-lotus:
          main_poison_id: poison.black-lotus
        nightshade:
          main_poison_id: poison.nightshade
    expect:
      result.accepted:
      - ordinary
      result.rejected:
        black-lotus: poisons are forbidden for battle-monks-of-cathay/warrior-monks
        nightshade: poisons are forbidden for battle-monks-of-cathay/warrior-monks
  - id: unrestricted-custom-control
    roles:
    - accepted
    operation: equipment_choices
    attacker:
      main_weapon_id: weapon.sword
    context:
      choices:
        ordinary: {}
        black-lotus:
          main_poison_id: poison.black-lotus
        nightshade:
          main_poison_id: poison.nightshade
    expect:
      result.accepted:
      - black-lotus
      - nightshade
      - ordinary
      result.rejected: {}
  - id: officer-not-subject-to-monks-prohibition
    roles:
    - accepted
    operation: equipment_choices
    attacker:
      collection: mordheim
      band_id: battle-monks-of-cathay
      profile_id: officer
    context:
      choices:
        ordinary: {}
        lotus:
          main_poison_id: poison.black-lotus
    expect:
      result.accepted:
      - lotus
      - ordinary
      result.rejected: {}
  mutations:
  - id: remove-category-prohibition
    runtime_fault: suppress-category-prohibitions
    cases:
    - choices-dragon-monks
    - choices-warrior-monks
