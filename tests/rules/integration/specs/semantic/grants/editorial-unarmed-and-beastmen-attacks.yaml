    attacker:
      band_id: carnival-of-chaos
      profile_id: plague-cart
      main_weapon_id: weapon.fist
    defender:
      armour_id: armour.heavy-armour
    rolls:
    - key: armour
      value: 5
    expect:
      result.saved: true
  - id: save-6
    roles:
    - active
    - boundary
    - consumer
    operation: armour
    attacker:
      band_id: carnival-of-chaos
      profile_id: plague-cart
      main_weapon_id: weapon.fist
    defender:
      armour_id: armour.heavy-armour
