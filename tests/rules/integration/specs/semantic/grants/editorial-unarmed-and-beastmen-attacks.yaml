- id: unarmed-exemption-raging-peasants
  scope_digest: 5fd7034eceb69daeeac4b0ad8bba9f2bc5ba50ca65a102d49b69e25f85d18dc9
  category: local
  sources:
  - target: rule/mordheim/battle-monks-of-cathay/raging-peasants--unarmed/profile.fist
    digest: 7891e99b68c45c732d3f0db2e03fd499829c11ac206529b1289427fedaf3e6c1
  interpretation: 'Weapons/Armour / Unarmed: keeps the profile''s Strength and Attacks and does not grant
    +1 to the enemy''s save. It is not equivalent to Unarmed Fighting, which additionally grants an attack.
    Guardian uses the component''s S3, not the chariot''s Toughness.'
  cases:
  - id: recipients
    roles:
    - grant
    operation: grant
    defender:
      band_id: battle-monks-of-cathay
      profile_id: raging-peasants
      main_weapon_id: weapon.fist
    context:
      rule_id: raging-peasants--unarmed
    expect:
      result.recipients:
      - raging-peasants
  - id: compiled
    roles:
    - compiled
    operation: compile
    attacker:
      band_id: battle-monks-of-cathay
      profile_id: raging-peasants
      main_weapon_id: weapon.fist
    expect:
      attacker.characteristics.strength: 3
      attacker.characteristics.attacks: 1
  - id: strength
    roles:
    - active
    - consumer
    operation: strength
    attacker:
      band_id: battle-monks-of-cathay
      profile_id: raging-peasants
      main_weapon_id: weapon.fist
    expect:
      result.wound: 3
      result.armour: 3
  - id: attacks
    roles:
    - active
    - consumer
    - boundary
    operation: attacks
    attacker:
      band_id: battle-monks-of-cathay
      profile_id: raging-peasants
      main_weapon_id: weapon.fist
    expect:
      result.attacks: 1
  - id: advanced-attacks
    roles:
    - active
    - consumer
    - boundary
    operation: attacks
    attacker:
      band_id: battle-monks-of-cathay
      profile_id: raging-peasants
      main_weapon_id: weapon.fist
      characteristics:
        weapon_skill: 3
        strength: 4
        toughness: 3
        wounds: 1
        initiative: 3
        attacks: 3
    expect:
      result.attacks: 3
  - id: untrained-strength
    roles:
    - inactive
    operation: strength
    attacker:
      main_weapon_id: weapon.fist
    expect:
      result.wound: 2
      result.armour: 2
  - id: save-1
    roles:
    - active
    - boundary
    - consumer
    operation: armour
    attacker:
      band_id: battle-monks-of-cathay
      profile_id: raging-peasants
      main_weapon_id: weapon.fist
    defender:
      armour_id: armour.heavy-armour
    rolls:
    - key: armour
      value: 1
    expect:
      result.saved: false
  - id: save-2
    roles:
    - active
    - boundary
    - consumer
    operation: armour
    attacker:
      band_id: battle-monks-of-cathay
      profile_id: raging-peasants
      main_weapon_id: weapon.fist
    defender:
      armour_id: armour.heavy-armour
    rolls:
    - key: armour
      value: 2
    expect:
      result.saved: false
  - id: save-3
    roles:
    - active
    - boundary
    - consumer
    operation: armour
    attacker:
      band_id: battle-monks-of-cathay
      profile_id: raging-peasants
      main_weapon_id: weapon.fist
    defender:
      armour_id: armour.heavy-armour
    rolls:
    - key: armour
      value: 3
    expect:
      result.saved: false
  - id: save-4
    roles:
    - active
    - boundary
    - consumer
    operation: armour
    attacker:
      band_id: battle-monks-of-cathay
      profile_id: raging-peasants
      main_weapon_id: weapon.fist
    defender:
      armour_id: armour.heavy-armour
    rolls:
    - key: armour
      value: 4
    expect:
      result.saved: false
  - id: save-5
    roles:
    - active
    - boundary
    - consumer
    operation: armour
    attacker:
      band_id: battle-monks-of-cathay
      profile_id: raging-peasants
      main_weapon_id: weapon.fist
    defender:
      armour_id: armour.heavy-armour
    rolls:
    - key: armour
      value: 5
    expect:
      result.saved: true
  - id: save-6
    roles:
    - active
    - boundary
    - consumer
    operation: armour
    attacker:
      band_id: battle-monks-of-cathay
      profile_id: raging-peasants
      main_weapon_id: weapon.fist
    defender:
      armour_id: armour.heavy-armour
    rolls:
    - key: armour
      value: 6
    expect:
      result.saved: true
  - id: untrained-armour
    roles:
    - inactive
    operation: armour
    attacker:
      main_weapon_id: weapon.fist
    defender:
      armour_id: armour.heavy-armour
    rolls:
    - key: armour
      value: 4
    expect:
      result.saved: true
  mutations:
  - id: remove-exemption
    path: attacker.global_effects.tags
    value: []
    cases:
    - strength
    - advanced-attacks
    - save-4
- id: unarmed-exemption-plague-cart
