    - consumer
    operation: strength
    attacker:
      band_id: carnival-of-chaos
      profile_id: plague-cart
      main_weapon_id: weapon.fist
    expect:
      result.wound: 3
      result.armour: 3
  - id: attacks
    roles:
    - active
    - consumer
    - boundary
    operation: attacks
    attacker:
      band_id: carnival-of-chaos
      profile_id: plague-cart
      main_weapon_id: weapon.fist
    expect:
