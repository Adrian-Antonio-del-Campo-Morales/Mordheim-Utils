  - id: advanced-attacks
    roles:
    - active
    - consumer
    - boundary
    operation: attacks
    attacker:
      band_id: carnival-of-chaos
      profile_id: plague-cart
      main_weapon_id: weapon.fist
      characteristics:
        weapon_skill: 3
        strength: 4
        toughness: 3
        wounds: 1
        initiative: 3
        attacks: 3
    expect:
      result.attacks: 3
  - id: untrained-strength
    roles:
    - inactive
    operation: strength
    attacker:
      main_weapon_id: weapon.fist
    expect:
      result.wound: 2
      result.armour: 2
  - id: tagged-fist-strength
    # The exemption is a property of the bearer, not of the cart's printed
    # natural attack: the granted trait must keep an actual fist at full
    # Strength and leave the enemy no extra save.  This witness supplies the
    # rule's own canonical trait so the consumer half is observable.
    roles:
    - active
    - consumer
    - boundary
    operation: strength
    attacker:
      main_weapon_id: weapon.fist
      trait_overrides:
        guardian_unarmed: true
    expect:
      result.wound: 3
      result.armour: 3
  - id: save-1
    roles:
    - active
    - boundary
    - consumer
    operation: armour
    attacker:
      band_id: carnival-of-chaos
      profile_id: plague-cart
      main_weapon_id: weapon.fist
    defender:
      armour_id: armour.heavy-armour
    rolls:
    - key: armour
      value: 1
    expect:
      result.saved: false
  - id: save-2
    roles:
    - active
    - boundary
    - consumer
    operation: armour
    attacker:
      band_id: carnival-of-chaos
