  - target: rule/mordheim/carnival-of-chaos/plague-cart--guardian-unarmed/mechanic.guardian-unarmed
    digest: 88c237df904757462fa10cd4af0b6e4e7046dd1cb45ffaef1786af3e9a7bda3c
  interpretation: 'Weapons/Armour / Unarmed: keeps the profile''s Strength and Attacks and does not grant
    +1 to the enemy''s save. It is not equivalent to Unarmed Fighting, which additionally grants an attack.
    Guardian uses the component''s S3, not the chariot''s Toughness.'
  cases:
  - id: recipients
    roles:
    - grant
    operation: grant
    defender:
      band_id: carnival-of-chaos
      profile_id: plague-cart
      main_weapon_id: weapon.fist
    context:
      rule_id: plague-cart--guardian-unarmed
    expect:
      result.recipients:
      - plague-cart
