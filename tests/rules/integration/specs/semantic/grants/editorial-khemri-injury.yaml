    digest: 540f21fd49d96fa9544d83fbed8eeddbb4cab7b6ef2fd27329d78c0457f5268f
  interpretation: Khemri p.55 / Fragile already includes No Pain in its table, giving 1-3 Knocked Down
    and 4-6 Out. It does not use the ordinary Undead threshold of 5 for Out of Action.
