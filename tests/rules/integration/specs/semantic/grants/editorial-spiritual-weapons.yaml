schema_version: 1
specifications:
- id: editorial-spirits-spiritual-weapons
  scope_digest: 5fd7034eceb69daeeac4b0ad8bba9f2bc5ba50ca65a102d49b69e25f85d18dc9
  category: local
  sources:
  - target: rule/trollheim/khemri-lahmian-brotherhood/spirits--spiritual-weapons/trait.spiritual-weapons
    digest: 0282dc4ef6cd71ed41c82c113a100668e6fdbf4030a1846d646c9e632bfa7073
  interpretation: All of the Spirit's weapons use a natural 5+ critical threshold. The rule does not turn
    an insufficient to-wound result into a wound.
  cases:
  - id: recipients
    roles:
    - grant
    - compiled
    operation: grant
    defender:
      collection: trollheim
      band_id: khemri-lahmian-brotherhood
      profile_id: spirits
    context:
      rule_id: spirits--spiritual-weapons
    expect:
      result.recipients:
      - spirits
  - id: natural-five-is-critical
    roles:
    - active
    - consumer
    - boundary
    operation: wound
    attacker:
      collection: trollheim
      band_id: khemri-lahmian-brotherhood
      profile_id: spirits
    rolls:
    - key: wound
      value: 5
    expect:
      context.critical_threshold: 5
      result.success: true
      result.critical: true
    expect_contains:
      attacker.global_effects.tags:
      - spiritual_weapons
  - id: natural-four-is-not-critical
    roles:
    - boundary
    operation: wound
    attacker:
      collection: trollheim
      band_id: khemri-lahmian-brotherhood
      profile_id: spirits
    rolls:
    - key: wound
      value: 4
    expect:
      result.success: true
      result.critical: false
  - id: five-cannot-overcome-six-required
    roles:
    - boundary
    operation: wound
    attacker:
      collection: trollheim
      band_id: khemri-lahmian-brotherhood
      profile_id: spirits
    defender:
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 6
        wounds: 3
        initiative: 3
        attacks: 1
    rolls:
    - key: wound
      value: 5
    expect:
      result.success: false
      result.critical: false
  - id: ordinary-fighter-five-is-not-critical
    roles:
    - inactive
    operation: wound
    attacker:
      main_weapon_id: weapon.sword
    rolls:
    - key: wound
      value: 5
    expect:
      context.critical_threshold: 6
      result.success: true
      result.critical: false
  mutations:
  - id: remove-spiritual-weapons
    path: attacker.global_effects.tags
    value: []
    cases:
    - natural-five-is-critical
