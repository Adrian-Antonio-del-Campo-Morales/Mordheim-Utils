    rolls:
    - key: test.injury
      value: 2
    expect:
      result.condition: KNOCKED_DOWN
  - id: injury-3
    roles:
    - active
    - consumer
    operation: injury
    defender:
      collection: mordheim
      band_id: restless-dead
      profile_id: liche
    rolls:
    - key: test.injury
      value: 3
    expect:
      result.condition: KNOCKED_DOWN
  - id: injury-4
    roles:
    - active
    - consumer
    operation: injury
    defender:
      collection: mordheim
      band_id: restless-dead
      profile_id: liche
    rolls:
    - key: test.injury
      value: 4
    expect:
      result.condition: KNOCKED_DOWN
  - id: injury-5
    roles:
    - inactive
    - boundary
    operation: injury
    defender:
      collection: mordheim
      band_id: restless-dead
      profile_id: liche
    rolls:
    - key: test.injury
      value: 5
    expect:
      result.condition: OUT
  - id: injury-6
    roles:
    - inactive
    - boundary
    operation: injury
    defender:
      collection: mordheim
