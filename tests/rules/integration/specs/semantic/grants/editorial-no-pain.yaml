specifications:
- id: grant-mordheim-restless-dead-liche--no-pain
  scope_digest: 5fd7034eceb69daeeac4b0ad8bba9f2bc5ba50ca65a102d49b69e25f85d18dc9
  category: local
  sources:
  - target: rule/mordheim/restless-dead/liche--no-pain/skill.ignore-pain
    digest: 5a25885b078ac0cb47ceca3058c523b3d5aa0b164f08d3b9f673788b66ce08ee
  interpretation: The named profile treats a Stunned injury as Knocked Down. The rule's recipient is the
    named profile, not every profile in the warband. All six faces are transcribed independently from
    that replacement and the normal injury table.
  cases:
  - id: compiled-recipient
    roles:
    - compiled
    - grant
    operation: grant
    defender:
      collection: mordheim
      band_id: restless-dead
      profile_id: liche
    context:
      rule_id: liche--no-pain
    expect:
      result.recipients:
      - liche
    expect_contains:
      defender.global_effects.tags:
      - skill.ignore-pain
  - id: injury-1
    roles:
    - inactive
    - boundary
    operation: injury
    defender:
      collection: mordheim
      band_id: restless-dead
      profile_id: liche
    rolls:
    - key: test.injury
      value: 1
    expect:
      result.condition: KNOCKED_DOWN
  - id: injury-2
    roles:
    - inactive
    - boundary
    operation: injury
    defender:
      collection: mordheim
      band_id: restless-dead
