schema_version: 1
specifications:
- id: editorial-berserker-dwarf-rangers
  scope_digest: 5fd7034eceb69daeeac4b0ad8bba9f2bc5ba50ca65a102d49b69e25f85d18dc9
  category: contextual
  sources:
  - target: rule/mordheim/dwarf-rangers/band--slayer-special-skills-berserker/skill.berserker
    digest: eb130db67564a31e4f3e51b3b616d91acf807dcbdccf31d280865e95e2bb4dc6
  depends_on:
  - mechanic/skill.berserker
  interpretation: Only the Slayer profile may select this Slayer skill. During a charge it adds one to
    hit rolls, not to Weapon Skill. Against WS4, the Slayer's WS4 needs 3+ with this bonus and 4+ without
    charging.
  cases:
  - id: recipients
    roles:
    - grant
    - compiled
    operation: selectable_grant
    defender:
      band_id: dwarf-rangers
      profile_id: dwarf-troll-slayers
    context:
      rule_id: band--slayer-special-skills-berserker
    expect:
      result.recipients:
      - dwarf-troll-slayers
  - id: charge-boundary
    roles:
    - active
    - consumer
    - boundary
    operation: hit
    attacker:
      band_id: dwarf-rangers
      profile_id: dwarf-troll-slayers
      special_rule_ids:
      - band--slayer-special-skills-berserker
    defender:
      characteristics:
        weapon_skill: 4
        strength: 3
        toughness: 3
        wounds: 1
        initiative: 3
        attacks: 1
    context:
      first_round: true
      charging: true
    rolls:
    - key: hit
      value: 3
    expect:
      context.attacker_ws: 4
      context.modifier: 1
      result.target: 3
      result.success: true
  - id: charge-all-faces
    roles:
    - boundary
    operation: hit
    attacker:
      band_id: dwarf-rangers
      profile_id: dwarf-troll-slayers
      special_rule_ids:
      - band--slayer-special-skills-berserker
    defender:
      characteristics:
        weapon_skill: 4
        strength: 3
        toughness: 3
        wounds: 1
        initiative: 3
        attacks: 1
    context:
      first_round: true
      charging: true
    distribution:
      observable: result.success
      max_rolls: 1
      expected:
        'true': 2/3
        'false': 1/3
  - id: no-charge
    roles:
    - inactive
    operation: hit
    attacker:
      band_id: dwarf-rangers
      profile_id: dwarf-troll-slayers
      special_rule_ids:
      - band--slayer-special-skills-berserker
    defender:
      characteristics:
        weapon_skill: 4
        strength: 3
        toughness: 3
        wounds: 1
        initiative: 3
        attacks: 1
    context:
      first_round: true
      charging: false
    rolls:
    - key: hit
      value: 3
    expect:
      context.attacker_ws: 4
      context.modifier: 0
      result.target: 4
      result.success: false
  mutations:
  - id: remove-bonus
    path: attacker.global_effects.tags
    value: []
    cases:
    - charge-boundary
    - charge-all-faces
