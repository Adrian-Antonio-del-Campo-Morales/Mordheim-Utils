schema_version: 1
specifications:
- id: editorial-monster-slayer-dwarf-rangers
  scope_digest: 5fd7034eceb69daeeac4b0ad8bba9f2bc5ba50ca65a102d49b69e25f85d18dc9
  category: local
  sources:
  - target: rule/mordheim/dwarf-rangers/band--slayer-special-skills-monster-slayer/skill.monster-slayer
    digest: 031cf39526e8cd9003efc76bad117a7daa72596303c2bf183885cd7bc61f7604
  depends_on:
  - mechanic/skill.monster-slayer
  interpretation: Only Slayers may choose this skill. It limits the wound threshold to 4+ without reducing
    naturally easier thresholds. S3 against T6 therefore wounds on 4+, while S3 against T2 still wounds
    on 3+.
  cases:
  - id: recipients
    roles:
    - grant
    - compiled
    operation: selectable_grant
    defender:
      band_id: dwarf-rangers
      profile_id: dwarf-troll-slayers
    context:
      rule_id: band--slayer-special-skills-monster-slayer
    expect:
      result.recipients:
      - dwarf-troll-slayers
  - id: tough-opponent-boundary
    roles:
    - active
    - consumer
    - boundary
    operation: wound
    attacker:
      band_id: dwarf-rangers
      profile_id: dwarf-troll-slayers
      special_rule_ids:
      - band--slayer-special-skills-monster-slayer
      main_weapon_id: weapon.dagger
    defender:
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 6
        wounds: 1
        initiative: 3
        attacks: 1
    rolls:
    - key: wound
      value: 4
    expect:
      result.target: 4
      result.success: true
    expect_contains:
      attacker.global_effects.tags:
      - skill.monster-slayer
  - id: tough-opponent-all-faces
    roles:
    - boundary
    operation: wound
    attacker:
      band_id: dwarf-rangers
      profile_id: dwarf-troll-slayers
      special_rule_ids:
      - band--slayer-special-skills-monster-slayer
      main_weapon_id: weapon.dagger
    defender:
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 6
        wounds: 1
        initiative: 3
        attacks: 1
    distribution:
      observable: result.success
      max_rolls: 1
      expected:
        'true': 1/2
        'false': 1/2
  - id: easier-target-retained
    roles:
    - inactive
    - boundary
    operation: wound
    attacker:
      band_id: dwarf-rangers
      profile_id: dwarf-troll-slayers
      special_rule_ids:
      - band--slayer-special-skills-monster-slayer
      main_weapon_id: weapon.dagger
    defender:
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 2
        wounds: 1
        initiative: 3
        attacks: 1
    rolls:
    - key: wound
      value: 3
    expect:
      result.target: 3
      result.success: true
  - id: easier-target-all-faces
    roles:
    - inactive
    - boundary
    operation: wound
    attacker:
      band_id: dwarf-rangers
      profile_id: dwarf-troll-slayers
      special_rule_ids:
      - band--slayer-special-skills-monster-slayer
      main_weapon_id: weapon.dagger
    defender:
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 2
        wounds: 1
        initiative: 3
        attacks: 1
    distribution:
      observable: result.success
      max_rolls: 1
      expected:
        'true': 2/3
        'false': 1/3
  mutations:
  - id: remove-threshold-limit
    path: attacker.global_effects.tags
    value: []
    cases:
    - tough-opponent-boundary
    - tough-opponent-all-faces
