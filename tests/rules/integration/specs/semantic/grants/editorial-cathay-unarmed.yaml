schema_version: 1
specifications:
- id: editorial-cathay-unarmed-dragon-monks
  scope_digest: 5fd7034eceb69daeeac4b0ad8bba9f2bc5ba50ca65a102d49b69e25f85d18dc9
  category: contextual
  sources:
  - target: rule/mordheim/battle-monks-of-cathay/dragon-monks--unarmed-fighting/skill.unarmed-fighting
    digest: 96afc47a20f0c7d8c12ffeb0e3622956d15a0ddee55e42813327a231b80b24c6
  depends_on:
  - mechanic/skill.unarmed-fighting
  interpretation: Weapons/Armour / Unarmed Fighting removes the usual fist penalties and adds one attack
    while unarmed. Printed S3 and A1 therefore give strength 3 and two attacks, without improving enemy
    armour. An equipped sword does not receive the extra unarmed attack.
  cases:
  - id: recipients
    roles:
    - grant
    - compiled
    operation: grant
    defender:
      collection: mordheim
      band_id: battle-monks-of-cathay
      profile_id: dragon-monks
      main_weapon_id: weapon.fist
    context:
      rule_id: dragon-monks--unarmed-fighting
    expect:
      result.recipients:
      - dragon-monks
  - id: full-strength
    roles:
    - active
    - consumer
    operation: strength
    attacker:
      collection: mordheim
      band_id: battle-monks-of-cathay
      profile_id: dragon-monks
      main_weapon_id: weapon.fist
    expect:
      result.wound: 3
      result.armour: 3
    expect_contains:
      attacker.global_effects.tags:
      - skill.unarmed-fighting
  - id: extra-attack
    roles:
    - active
    - consumer
    operation: attacks
    attacker:
      collection: mordheim
      band_id: battle-monks-of-cathay
      profile_id: dragon-monks
      main_weapon_id: weapon.fist
    expect:
      result.attacks: 2
  - id: sword-no-extra
    roles:
    - inactive
    operation: attacks
    attacker:
      collection: mordheim
      band_id: battle-monks-of-cathay
      profile_id: dragon-monks
      main_weapon_id: weapon.sword
    expect:
      result.attacks: 1
  - id: unarmoured-no-save
    roles:
    - active
    - consumer
    operation: armour
    attacker:
      collection: mordheim
      band_id: battle-monks-of-cathay
      profile_id: dragon-monks
      main_weapon_id: weapon.fist
    expect:
      result.eligible: false
      result.saved: false
  - id: armour-1
    roles:
    - boundary
    - consumer
    operation: armour
    attacker:
      collection: mordheim
      band_id: battle-monks-of-cathay
      profile_id: dragon-monks
      main_weapon_id: weapon.fist
    defender:
      armour_id: armour.heavy-armour
    rolls:
    - key: armour
      value: 1
    expect:
      result.target: 5
      result.saved: false
  - id: armour-2
    roles:
    - boundary
    - consumer
    operation: armour
    attacker:
      collection: mordheim
      band_id: battle-monks-of-cathay
      profile_id: dragon-monks
      main_weapon_id: weapon.fist
    defender:
      armour_id: armour.heavy-armour
    rolls:
    - key: armour
      value: 2
    expect:
      result.target: 5
      result.saved: false
  - id: armour-3
    roles:
    - boundary
    - consumer
    operation: armour
    attacker:
      collection: mordheim
      band_id: battle-monks-of-cathay
      profile_id: dragon-monks
      main_weapon_id: weapon.fist
    defender:
      armour_id: armour.heavy-armour
    rolls:
    - key: armour
      value: 3
    expect:
      result.target: 5
      result.saved: false
  - id: armour-4
    roles:
    - boundary
    - consumer
    operation: armour
    attacker:
      collection: mordheim
      band_id: battle-monks-of-cathay
      profile_id: dragon-monks
      main_weapon_id: weapon.fist
    defender:
      armour_id: armour.heavy-armour
    rolls:
    - key: armour
      value: 4
    expect:
      result.target: 5
      result.saved: false
  - id: armour-5
    roles:
    - boundary
    - consumer
    operation: armour
    attacker:
      collection: mordheim
      band_id: battle-monks-of-cathay
      profile_id: dragon-monks
      main_weapon_id: weapon.fist
    defender:
      armour_id: armour.heavy-armour
    rolls:
    - key: armour
      value: 5
    expect:
      result.target: 5
      result.saved: true
  - id: armour-6
    roles:
    - boundary
    - consumer
    operation: armour
    attacker:
      collection: mordheim
      band_id: battle-monks-of-cathay
      profile_id: dragon-monks
      main_weapon_id: weapon.fist
    defender:
      armour_id: armour.heavy-armour
    rolls:
    - key: armour
      value: 6
    expect:
      result.target: 5
      result.saved: true
  mutations:
  - id: remove-training
    path: attacker.global_effects.tags
    value: []
    cases:
    - full-strength
    - extra-attack
    - armour-4
