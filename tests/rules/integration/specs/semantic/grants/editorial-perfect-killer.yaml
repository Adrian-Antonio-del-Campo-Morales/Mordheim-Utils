schema_version: 1
specifications:
- id: perfect-killer-eshin-mordheim
  scope_digest: 5fd7034eceb69daeeac4b0ad8bba9f2bc5ba50ca65a102d49b69e25f85d18dc9
  category: contextual
  sources:
  - target: rule/mordheim/skaven-clan-eshin/assassin-adept--perfect-killer/trait.perfect-killer
    digest: af183fdfb85bddb2202a6623ef764a1eef5fdc98674fd48a6ff62742cbd96a92
  interpretation: Each wound imposes an extra -1 on the save; it stacks with Strength and does not change
    To Wound.
  cases:
  - id: recipient
    roles:
    - grant
    operation: grant
    defender:
      collection: mordheim
      band_id: skaven-clan-eshin
      profile_id: assassin-adept
    context:
      rule_id: assassin-adept--perfect-killer
    expect:
      result.recipients:
      - assassin-adept
  - id: gromril-target
    roles:
    - compiled
    - active
    - consumer
    operation: armour
    attacker:
      collection: mordheim
      band_id: skaven-clan-eshin
      profile_id: assassin-adept
      main_weapon_id: weapon.sword
    defender:
      armour_id: armour.gromril-armour
    rolls:
    - key: armour
      value: 5
    expect:
      attacker.global_effects.armour_penetration: 1
      result.target: 6
      result.saved: false
  - id: heavy-armour-denied
    roles:
    - active
    - consumer
    - boundary
    operation: armour
    attacker:
      collection: mordheim
      band_id: skaven-clan-eshin
      profile_id: assassin-adept
      main_weapon_id: weapon.sword
    defender:
      armour_id: armour.heavy-armour
    expect:
      result.target: 7
      result.eligible: false
      result.roll: null
  - id: combines-with-strength
    roles:
    - active
    - boundary
    operation: armour
    attacker:
      collection: mordheim
      band_id: skaven-clan-eshin
      profile_id: assassin-adept
      main_weapon_id: weapon.sword
      characteristics:
        weapon_skill: 4
        strength: 5
        toughness: 3
        wounds: 1
        initiative: 4
        attacks: 1
    defender:
      armour_id: armour.gromril-armour
    expect:
      result.target: 7
      result.eligible: false
      result.roll: null
  - id: wound-target-unchanged
    roles:
    - boundary
    operation: wound
    attacker:
      collection: mordheim
      band_id: skaven-clan-eshin
      profile_id: assassin-adept
      main_weapon_id: weapon.sword
    rolls:
    - key: wound
      value: 4
    expect:
      result.target: 3
      result.success: true
  - id: ordinary-strength-four-control
    roles:
    - inactive
    operation: armour
    attacker:
      main_weapon_id: weapon.sword
      characteristics:
        weapon_skill: 4
        strength: 4
        toughness: 3
        wounds: 1
        initiative: 4
        attacks: 1
    defender:
      armour_id: armour.gromril-armour
    rolls:
    - key: armour
      value: 5
    expect:
      result.target: 5
      result.saved: true
  mutations:
  - id: remove-extra-penetration
    path: attacker.global_effects.armour_penetration
    value: 0
    cases:
    - gromril-target
