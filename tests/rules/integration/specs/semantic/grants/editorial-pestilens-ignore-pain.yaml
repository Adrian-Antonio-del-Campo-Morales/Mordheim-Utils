      collection: mordheim
      band_id: skaven-clan-pestilens
      profile_id: plague-priest
      special_rule_ids:
      - band--clan-pestilens-special-skills-ignore-pain
      skill_ids:
      - skill.resilient
    rolls:
    - key: test.injury
      value: 4
    expect:
      result.condition: KNOCKED_DOWN
  - id: injury-5
    roles:
    - inactive
    - boundary
    operation: injury
    defender:
      collection: mordheim
      band_id: skaven-clan-pestilens
      profile_id: plague-priest
      special_rule_ids:
      - band--clan-pestilens-special-skills-ignore-pain
      skill_ids:
      - skill.resilient
    rolls:
    - key: test.injury
      value: 5
    expect:
      result.condition: OUT
  - id: injury-6
    roles:
    - inactive
    - boundary
    operation: injury
    defender:
      collection: mordheim
      band_id: skaven-clan-pestilens
      profile_id: plague-priest
      special_rule_ids:
      - band--clan-pestilens-special-skills-ignore-pain
      skill_ids:
      - skill.resilient
    rolls:
    - key: test.injury
      value: 6
    expect:
      result.condition: OUT
  mutations:
  - id: remove-injury-replacement
    path: defender.global_effects.tags
    value: []
    cases:
    - injury-3
    - injury-4
