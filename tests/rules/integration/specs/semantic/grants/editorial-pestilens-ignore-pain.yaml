schema_version: 1
specifications:
- id: editorial-pestilens-ignore-pain-mordheim
  scope_digest: 5fd7034eceb69daeeac4b0ad8bba9f2bc5ba50ca65a102d49b69e25f85d18dc9
  category: local
  sources:
  - target: rule/mordheim/skaven-clan-pestilens/band--clan-pestilens-special-skills-ignore-pain/skill.ignore-pain
    digest: 5099136e5969ff062c65fa70e7426216ccddabb7fcc8e88c44bae933a5cda994
  depends_on:
  - mechanic/skill.ignore-pain
  interpretation: Ignore Pain requires Resilient. Among the current unpromoted profiles only Plague Priest
    and Plague Monks have the Strength access needed to select that prerequisite. Injury faces 1-4 become
    Knocked Down; 5-6 remain Out of Action. This is not immunity to all injuries.
  cases:
  - id: legal-recipients-with-prerequisite
    roles:
    - grant
    - compiled
    operation: selectable_grant
    defender:
      collection: mordheim
      band_id: skaven-clan-pestilens
      profile_id: plague-priest
      skill_ids:
      - skill.resilient
    context:
      rule_id: band--clan-pestilens-special-skills-ignore-pain
    expect:
      result.recipients:
      - plague-monks
      - plague-priest
  - id: missing-resilient
    roles:
    - rejected
    operation: compile
    attacker:
      collection: mordheim
      band_id: skaven-clan-pestilens
      profile_id: plague-priest
      special_rule_ids:
      - band--clan-pestilens-special-skills-ignore-pain
    reject: Ignore Pain requires Resilient
  - id: injury-1
    roles:
    - inactive
    - boundary
    operation: injury
    defender:
      collection: mordheim
      band_id: skaven-clan-pestilens
      profile_id: plague-priest
      special_rule_ids:
      - band--clan-pestilens-special-skills-ignore-pain
      skill_ids:
      - skill.resilient
    rolls:
    - key: test.injury
      value: 1
    expect:
      result.condition: KNOCKED_DOWN
  - id: injury-2
    roles:
    - inactive
    - boundary
    operation: injury
    defender:
      collection: mordheim
      band_id: skaven-clan-pestilens
      profile_id: plague-priest
      special_rule_ids:
      - band--clan-pestilens-special-skills-ignore-pain
      skill_ids:
      - skill.resilient
    rolls:
    - key: test.injury
      value: 2
    expect:
      result.condition: KNOCKED_DOWN
  - id: injury-3
    roles:
    - active
    - consumer
    - boundary
    operation: injury
    defender:
      collection: mordheim
      band_id: skaven-clan-pestilens
      profile_id: plague-priest
      special_rule_ids:
      - band--clan-pestilens-special-skills-ignore-pain
      skill_ids:
      - skill.resilient
    rolls:
    - key: test.injury
      value: 3
    expect:
      result.condition: KNOCKED_DOWN
  - id: injury-4
    roles:
    - active
