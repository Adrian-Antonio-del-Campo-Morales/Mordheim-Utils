schema_version: 1
specifications:
- id: lustrian-reaver-survivor
  scope_digest: 5fd7034eceb69daeeac4b0ad8bba9f2bc5ba50ca65a102d49b69e25f85d18dc9
  category: contextual
  sources:
  - target: rule/mordheim/lustrian-reavers/conqueror--survivor/trait.survivor
    digest: 22b3b0b45bbcd57fd9be959efbbead42b45fd1c3b0bf677d04285c39274b0cc1
  interpretation: Survivor turns Out of Action into Stunned only if the Conqueror was standing. If it
    was already Knocked Down or Stunned, the same result leaves it Out of Action. The Dead replacement
    in Serious Injury belongs to campaign and is outside the executed scope.
  cases:
  - id: recipient
    roles:
    - grant
    operation: grant
    defender:
      band_id: lustrian-reavers
      profile_id: conqueror
    context:
      rule_id: conqueror--survivor
    expect:
      result.recipients:
      - conqueror
  - id: standing-face-1
    roles:
    - compiled
    - inactive
    - boundary
    operation: injury
    defender:
      band_id: lustrian-reavers
      profile_id: conqueror
    rolls:
    - key: test.injury
      value: 1
    expect:
      result.condition: KNOCKED_DOWN
    expect_contains:
      defender.global_effects.tags:
      - survivor
  - id: standing-face-2
    roles:
    - compiled
    - inactive
    - boundary
    operation: injury
    defender:
      band_id: lustrian-reavers
      profile_id: conqueror
    rolls:
    - key: test.injury
      value: 2
    expect:
      result.condition: KNOCKED_DOWN
    expect_contains:
      defender.global_effects.tags:
      - survivor
  - id: standing-face-3
    roles:
    - compiled
    - inactive
    - boundary
    operation: injury
    defender:
      band_id: lustrian-reavers
      profile_id: conqueror
    rolls:
    - key: test.injury
      value: 3
    expect:
      result.condition: STUNNED
    expect_contains:
      defender.global_effects.tags:
      - survivor
  - id: standing-face-4
    roles:
    - compiled
    - inactive
    - boundary
    operation: injury
    defender:
      band_id: lustrian-reavers
      profile_id: conqueror
    rolls:
    - key: test.injury
      value: 4
    expect:
      result.condition: STUNNED
    expect_contains:
      defender.global_effects.tags:
      - survivor
  - id: standing-face-5
    roles:
    - compiled
    - active
    - consumer
    - boundary
    operation: injury
    defender:
      band_id: lustrian-reavers
      profile_id: conqueror
    rolls:
    - key: test.injury
      value: 5
    expect:
      result.condition: STUNNED
    expect_contains:
      defender.global_effects.tags:
      - survivor
  - id: standing-face-6
    roles:
    - compiled
    - active
    - consumer
    - boundary
    operation: injury
    defender:
      band_id: lustrian-reavers
      profile_id: conqueror
    rolls:
    - key: test.injury
      value: 6
    expect:
      result.condition: STUNNED
    expect_contains:
      defender.global_effects.tags:
      - survivor
  - id: already-knocked_down-can-go-out
    roles:
    - active
    - consumer
    - boundary
    operation: injury
    defender:
      band_id: lustrian-reavers
      profile_id: conqueror
    defender_state:
      condition: KNOCKED_DOWN
    rolls:
    - key: test.injury
      value: 6
    expect:
      result.condition: OUT
  - id: already-stunned-can-go-out
    roles:
    - active
    - consumer
    - boundary
    operation: injury
    defender:
      band_id: lustrian-reavers
      profile_id: conqueror
    defender_state:
      condition: STUNNED
    rolls:
    - key: test.injury
      value: 6
    expect:
      result.condition: OUT
  - id: ordinary-standing-warrior-goes-out
    roles:
    - inactive
    operation: injury
    rolls:
    - key: test.injury
      value: 6
    expect:
      result.condition: OUT
  mutations:
  - id: remove-survivor
    path: defender.global_effects.tags
    value: []
    cases:
    - standing-face-5
    - standing-face-6
