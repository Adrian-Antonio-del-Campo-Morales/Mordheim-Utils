specifications:
- id: lustria-scaly-skin-skink-priest
  scope_digest: 5fd7034eceb69daeeac4b0ad8bba9f2bc5ba50ca65a102d49b69e25f85d18dc9
  category: local
  sources:
  - target: rule/trollheim/lustria-lizardmen/skink-priest--scaly-skin-6plus/trait.natural-armour-save
    digest: 224fb09235f66e5ef14a6ea85b34c48f6be369845c8aa7654ed5c57cb306795b
  - target: rule/trollheim/lustria-lizardmen/skink-priest--scaly-skin-6plus/trait.natural-armour-stacks
    digest: 224fb09235f66e5ef14a6ea85b34c48f6be369845c8aa7654ed5c57cb306795b
  - target: rule/trollheim/lustria-lizardmen/skink-priest--scaly-skin-6plus/trait.natural-armour-worst-save
    digest: 224fb09235f66e5ef14a6ea85b34c48f6be369845c8aa7654ed5c57cb306795b
  interpretation: Lustria pp.54-56 grants scaly skin 6+. It combines with ordinary armour, receives Strength
    modifiers, but the natural contribution never worsens from 6+. Ignoring armour still nullifies the
    whole save.
  cases:
  - id: recipient
    roles:
    - grant
    operation: grant
    defender:
      collection: trollheim
      band_id: lustria-lizardmen
      profile_id: skink-priest
    context:
      rule_id: skink-priest--scaly-skin-6plus
    expect:
      result.recipients:
      - skink-priest
  - id: base-distribution
    roles:
    - compiled
    - active
    - consumer
    - boundary
    operation: armour
    attacker:
      main_weapon_id: weapon.sword
    defender:
      collection: trollheim
      band_id: lustria-lizardmen
      profile_id: skink-priest
    distribution:
      observable: result.saved
      max_rolls: 1
      expected:
        'true': 1/6
        'false': 5/6
  - id: strength-six-retains-six
    roles:
    - active
    - boundary
    operation: armour
    attacker:
      main_weapon_id: weapon.mace
      characteristics:
        weapon_skill: 3
        strength: 6
        toughness: 3
        wounds: 1
        initiative: 3
        attacks: 1
    defender:
      collection: trollheim
      band_id: lustria-lizardmen
      profile_id: skink-priest
    rolls:
    - key: armour
      value: 6
    expect:
      defender.natural_armour_worst_save: 6
      result.target: 6
      result.saved: true
  - id: stacks-with-light-armour
    roles:
    - consumer
    - boundary
    operation: armour
    attacker:
      main_weapon_id: weapon.mace
    defender:
      collection: trollheim
      band_id: lustria-lizardmen
      profile_id: skink-priest
      armour_id: armour.light-armour
    rolls:
    - key: armour
      value: 5
    expect:
      result.target: 5
      result.saved: true
  - id: armour-denial
    roles:
    - inactive
    - boundary
    operation: armour
    attacker:
      main_weapon_id: weapon.vomit-attack
    defender:
      collection: trollheim
      band_id: lustria-lizardmen
      profile_id: skink-priest
      armour_id: armour.light-armour
    expect:
      result.eligible: false
      result.saved: false
  mutations:
  - id: remove-skin
    changes:
    - path: defender.natural_armour_save
      value: 7
    - path: defender.armour_save
      value: 7
    - path: defender.natural_armour_worst_save
      value: 7
    cases:
    - base-distribution
  - id: remove-worst-save
    path: defender.natural_armour_worst_save
    value: 7
    cases:
    - strength-six-retains-six
