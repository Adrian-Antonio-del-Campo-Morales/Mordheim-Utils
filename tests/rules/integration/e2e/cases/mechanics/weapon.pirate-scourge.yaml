# --- Authored scenarios ---
# mechanic/weapon.pirate-scourge - cannot be parried by swords or bucklers, Weak
# and Whipcrack.
#
# Expectations come from the printed rule and the admitted clause `whole`, never
# from engine output.  The printed Weak modifier improves the target's save rather
# than the bearer's attack, so both an armoured and an unarmoured target carry a
# scenario.
# Weak grants the target +1 to its armour save, so a worn 5+ becomes a 4+ and the 4 now saves.

- audit_id: mechanic/weapon.pirate-scourge
  id: pirate-scourge-improves-a-worn-save-by-one
  covers: [whole]
  fighters:
    first:
      main_weapon_id: weapon.pirate-scourge
      characteristics: &a-ws3-s3-t3-w2-i5 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      armour_id: armour.heavy-armour
      characteristics: &d-ws3-s3-t3-w2-i2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.1.hit, value: 1}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.armour, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.saved: True, attacks.0.damage: 0, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
