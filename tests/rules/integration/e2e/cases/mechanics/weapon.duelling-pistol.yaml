# --- Authored scenarios ---
# mechanic/weapon.duelling-pistol - a close-combat pistol with +1 to hit in the
# first round.
#
# Expectations come from the printed rule and the admitted clause `whole`, never
# from engine output.  The two-round scenario fixes where the pistol attack lives:
# one die in the first round and none afterwards.
# An equal Weapon Skill would need a 4; the printed +1 to hit moves the target to a 3, and the Strength 4 shot wounds Toughness 3 on the same 3.

- audit_id: mechanic/weapon.duelling-pistol
  id: duelling-pistol-hits-on-a-three-because-of-plus-one-to-hit
  covers: [whole]
  fighters:
    first:
      main_weapon_id: weapon.duelling-pistol
      characteristics: &a-ws3-s3-t3-w2-i5 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: &d-ws3-s3-t3-w2-i2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 3}
    - {key: round.0.first.attack.0.wound, value: 3}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: True, attacks.0.hit_target: 3, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
