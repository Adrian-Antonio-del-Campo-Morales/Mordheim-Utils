# The retained dagger tag is observable, not a dead label: the admitted skill.knife-fighting
# clause grants +1 Weapon Skill "while using a Dagger", and the executor reads that condition from
# the `weapon.dagger` tag which this pair carries.  The hit target on an equal Weapon Skill is three
# (the file's own first scenario pins four without the skill), so the declared three hits.
- audit_id: mechanic/weapon.long-daggers
  id: knife-fighting-reads-the-retained-dagger-tag-for-the-better-weapon-skill
  covers: [whole]
  fighters:
    first:
      main_weapon_id: weapon.long-daggers
      skill_ids: [skill.knife-fighting]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 3}
    - {key: round.0.first.attack.1.hit, value: 1}
    # A two on the wound die fails against Toughness 3, which keeps this scenario on
    # the to-hit half the skill reads.
    - {key: round.0.first.attack.0.wound, value: 2}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: true, attacks.0.hit_target: 3, attacks.0.wounded: false, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
