# --- Authored scenarios ---
# The active duelist tests his own Leadership 6 at the start of his turn and the two
# declared sixes fail it, so the round resolves no close-combat attack at all: the
# voluntary charge is cancelled and the duel is no longer engaged.  No enemy roll is
# changed anywhere in the tape.
- audit_id: mechanic/mechanic.stupidity
  id: a-failed-test-costs-the-turn-s-attacks
  covers: [stupidity]
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.stupidity]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 6}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 6}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.stupidity.0, value: 6}
    - {key: round.0.first.stupidity.1, value: 6}
  expect_rounds:
    0: {attacks: [], state.first.stupidity_failed: True, state.first_charged: False, state.engaged: False, state.failed_charges: ['first'], state.round_index: 1}
  expect_final: {rounds_executed: 1, termination_reason: disengaged}
