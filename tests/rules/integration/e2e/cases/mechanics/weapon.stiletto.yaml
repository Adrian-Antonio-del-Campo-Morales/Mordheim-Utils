# weapon.stiletto - grants +1 Attack but resolves its attacks at -1 Strength.
# A stiletto grants +1 Attack. The ordered tape carries two attack dice for the bearer.

- audit_id: mechanic/weapon.stiletto
  id: stiletto-grants-one-additional-attack
  covers: [whole]
  fighters:
    first:
      main_weapon_id: weapon.stiletto
      characteristics: &atk-ws3-s3-t3-w2-i5 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: &dfn-ws3-s3-t3-w2-i2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: &charging-first {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.first.attack.1.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.wounds: 2, state.first.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
  expect_events:
    - {kind: roll, key: round.0.first.attack.0.hit, sides: 6, value: 1}
    - {kind: roll, key: round.0.first.attack.1.hit, sides: 6, value: 1}
    - {kind: roll, key: round.0.second.attack.0.hit, sides: 6, value: 1}
# A stiletto resolves its attacks at -1 Strength. Against Toughness 3 the bonus moves the wound target to 5+.
# The +1 Attack is the extra attack die, scripted as a miss so one wound is the whole
# outcome. One unsaved wound against a two-wound defender leaves it on one wound, so the
# printed injury table is not reached, no injury die is rolled, and the defender is still
# standing when its own attack comes, which is scripted as a miss.

- audit_id: mechanic/weapon.stiletto
  id: stiletto-wounds-at-the-boosted-strength
  covers: [whole]
  fighters:
    first:
      main_weapon_id: weapon.stiletto
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.1.hit, value: 1}
    - {key: round.0.first.attack.0.wound, value: 5}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 1, state.second.wounds: 1, state.second.condition: STANDING}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# One face below the boosted wound target. No wound is taken, so no injury die is rolled
