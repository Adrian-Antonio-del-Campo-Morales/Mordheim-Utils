# The halfling declares the belch in the first round and the enemy fails the Leadership
# test on two sixes against its own 7.  The enemy strikes with two Attacks, but the lost
# first attack consumes no die at all: the tape carries only the second attack die.
- audit_id: mechanic/skill.crude-belch-halfling
  id: a-failed-test-costs-the-enemy-its-first-attack
  covers: [whole]
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [skill.crude-belch-halfling]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 7}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 2, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.crude-belch, value: true}
  rolls:
