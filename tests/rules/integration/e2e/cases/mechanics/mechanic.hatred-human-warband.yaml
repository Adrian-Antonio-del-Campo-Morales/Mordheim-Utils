# The opponent belongs to a Human warband, so the printed Hatred grants the
# first-round reroll of the failed hit and the reroll wounds.
- audit_id: mechanic/mechanic.hatred-human-warband
  id: a-first-round-miss-is-taken-again-against-a-human-warband
  covers: [hatred]
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.hatred-human-warband]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 6}
    second:
      main_weapon_id: weapon.mace
      trait_overrides: {mercenary_origin: reikland}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.first.attack.0.hit.reroll, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: True, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
