# --- Authored scenarios ---
# mechanic/defence.helmet — the 4+ stun reaction after the injury table.
#
# Expectations come from the printed rule and the accepted clause
# `four-plus-against-stun` of
# docs/knowledge/2a2b/tasks/T13-semantic-analysis.csv, never from engine output:
# a Stunned injury result becomes Knocked Down on a 4+, and the reaction is
# rolled only when the result is Stunned.  The reaction die is keyed on the
# attack, so the strict tape distinguishes an offered reaction from none.  The
# attacker wields a sword (no Concussion) so an injury total of 2 is a plain
# Knocked Down and the helmet reaction is the only variable.
#
# The first scenario declares the shared profiles as YAML anchors; the siblings
# alias the defender and keep their own injury and reaction dice.

- audit_id: mechanic/defence.helmet
  id: helmet-converts-stun-on-four
  covers: [four-plus-against-stun]
  fighters:
    first:
      main_weapon_id: weapon.sword
      characteristics: &attacker-ws3-s3-t3-w2-i5 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      defence_ids: [defence.helmet]
      characteristics: &defender-ws3-s3-t3-w1-i2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 2, attacks: 1}
  duel_context: &charging-first {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.injury.0, value: 3}
    - {key: round.0.first.attack.0.helmet, value: 4}
  expect_rounds:
    0: {state.second.condition: KNOCKED_DOWN, state.second.wounds: 0}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# One face below the printed target: a 3 leaves the Stunned result in place.

- audit_id: mechanic/defence.helmet
  id: helmet-does-not-convert-on-three
  covers: [four-plus-against-stun]
  fighters:
    first:
      main_weapon_id: weapon.sword
      characteristics: *attacker-ws3-s3-t3-w2-i5
    second:
      main_weapon_id: weapon.mace
      defence_ids: [defence.helmet]
      characteristics: *defender-ws3-s3-t3-w1-i2
  duel_context: *charging-first
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.injury.0, value: 3}
    - {key: round.0.first.attack.0.helmet, value: 3}
  expect_rounds:
    0: {state.second.condition: STUNNED, state.second.wounds: 0}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# A 2 is already Knocked Down, so no helmet reaction is offered at all; the
# strict tape would fail if the engine requested the helmet die.

- audit_id: mechanic/defence.helmet
  id: helmet-reaction-is-only-for-stunned
  covers: [four-plus-against-stun]
  fighters:
    first:
      main_weapon_id: weapon.sword
      characteristics: *attacker-ws3-s3-t3-w2-i5
    second:
      main_weapon_id: weapon.mace
      defence_ids: [defence.helmet]
      characteristics: *defender-ws3-s3-t3-w1-i2
  duel_context: *charging-first
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.injury.0, value: 2}
  expect_rounds:
    0: {state.second.condition: KNOCKED_DOWN, state.second.wounds: 0}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
