# --- Authored scenarios ---
# mechanic/armour.no-armour — no body save, while other saves still apply.
#
# Expectations come from the printed rule and the accepted clause
# `no-body-armour` of docs/knowledge/2a2b/tasks/T13-semantic-analysis.csv,
# never from engine output: no body armour is equipped, so the armour phase
# falls back to the natural and special saves only.  The strict tape proves
# the absence: the first scenario scripts no armour face, so an unsolicited
# armour die would fail as an unscripted request.  The second scenario keeps
# the same unarmoured build but adds a documented special save (the lucky
# charm) to show that the clause's "other saves may still apply" still holds.
