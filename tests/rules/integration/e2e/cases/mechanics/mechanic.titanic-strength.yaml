# --- Authored scenarios ---
# The bearer attacks last in the round (the opponent charges first), so the
# failed wound and everything it triggers close the round with no further roll to
# account for.  The hit is declared on four and the wound die of one cannot wound
# Toughness 3 from Strength 3, which is exactly the printed trigger; the Strength
# test against the defender's Strength 3 then fails on the declared six and
# leaves the defender Knocked Down.
- audit_id: mechanic/mechanic.titanic-strength
  id: a-failed-strength-test-knocks-the-defender-down
  covers: [whole]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.titanic-strength]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 4}
    - {key: round.0.second.attack.0.wound, value: 1}
    - {key: round.0.second.attack.0.titanic-strength, value: 6}
  expect_rounds:
    0: {state.first.condition: KNOCKED_DOWN, state.first.wounds: 2, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
