# --- Authored scenarios ---
# The three admitted clauses are resolved one at a time, each with the same
# configuration repeated without the skill as its control, because the printed
# sentence claims an improvement over the ordinary rule and the improvement is
# only observable against that ordinary rule.  The engine's contribution of the
# skill in an attack pool is one further attack plus a lower critical threshold,
# and the paired property of the Fighting Claws profile is what the second
# clause adds on top of it; the counts below are derived from the printed
# "+1 Attack"/"+2 Attacks instead of +1" and from the claw profile's printed
# "gets an additional attack".
#
# Clause critical-5-6: with the skill a To Wound five is a critical wound.
- audit_id: mechanic/skill.art-of-silent-death
  id: art-of-silent-death-a-five-is-a-critical
  covers: [critical-5-6]
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [skill.art-of-silent-death]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 5}
    - {key: round.0.first.attack.0.critical, value: 2}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.critical: True, attacks.0.damage: 2, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
