# The printed stomp: against a defender already Knocked Down the warrior's allocation carries one extra attack at
# its own Strength, so the same declared faces take a second wound from the three-wound fixture.
- audit_id: rule/mordheim/cursed-cavalcade/band--cursed-cavalcade-special-skills-noblesse-obliges/unimplemented.cursed-cavalcade.band.cursed-cavalcade-special-skills-noblesse-obliges
  id: the-stomp-adds-one-attack-against-a-knocked-down-opponent
  covers: [noblesse-stomp]
  fighters:
    first: {collection: mordheim, band_id: cursed-cavalcade, profile_id: aristocrat, special_rule_ids: [band--cursed-cavalcade-special-skills-noblesse-obliges]}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1}
  initial_state:
    second: {condition: KNOCKED_DOWN, attacks: 0}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  # A Knocked Down defender is hit automatically, so neither attack asks for a hit die; the stomp is
  # its own allocated attack (round.N.first.stomp.attack.M) at the warrior's own Strength.  The
  # dagger attack fails its wound roll and the stomp lands: a Knocked Down warrior that suffers a
  # wound is taken Out of Action, so the stomp is what ends the fight.  The Out of Action condition
  # is recorded on the state; the Wounds characteristic itself is not rewritten.
  rolls:
    - {key: round.0.first.attack.0.wound, value: 1}
    - {key: round.0.first.stomp.attack.0.wound, value: 4}
  expect_rounds:
    0: {attacks.0.hit: true, attacks.0.wounded: false, attacks.1.hit: true,
        attacks.1.wounded: true, attacks.1.damage: 1,
        state.second.wounds: 3, state.second.condition: OUT}
  expect_final: {rounds_executed: 1, termination_reason: second_out}

# The control for the same fixture with a standing opponent: only the ordinary attack die is allocated, so the
# identical hit and wound faces leave the fixture one wound higher.  The two tapes differ only in the stomp.
- audit_id: rule/mordheim/cursed-cavalcade/band--cursed-cavalcade-special-skills-noblesse-obliges/unimplemented.cursed-cavalcade.band.cursed-cavalcade-special-skills-noblesse-obliges
  id: without-a-knocked-down-opponent-there-is-no-stomp
  covers: [noblesse-stomp]
  fighters:
    first: {collection: mordheim, band_id: cursed-cavalcade, profile_id: aristocrat, special_rule_ids: [band--cursed-cavalcade-special-skills-noblesse-obliges]}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1}
  initial_state:
    second: {attacks: 0}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  # The aristocrat's dagger lets the standing, unarmoured defender save at 6+, and the declared save
  # fails.  No stomp attack follows, so the round ends after this one wound.
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.armour, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 1, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
