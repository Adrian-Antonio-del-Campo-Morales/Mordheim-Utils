- audit_id: rule/mordheim/snotlings-web/band--pointy-stick/unimplemented.snotlings-web.item.pointy-stick
  id: the-granted-six-plus-save-holds-against-the-pointy-stick
  covers: [armour-penalty]
  # The printed consequence where the enemy has no save of his own: the pointy stick grants him a 6+ armour
  # save, so the armour die is requested and, taken on a six, it prevents the wound that the declared wound
  # face would otherwise inflict.  A weapon without the printed +1 would request no armour die at all.
  fighters:
    first:
      collection: mordheim
      band_id: snotlings-web
      profile_id: bigsnotz
      main_weapon_id: weapon.dagger
    second:
      armour_id: armour.no-armour
      characteristics: {weapon_skill: 3, strength: 3, toughness: 2, wounds: 2, initiative: 1, attacks: 1}
