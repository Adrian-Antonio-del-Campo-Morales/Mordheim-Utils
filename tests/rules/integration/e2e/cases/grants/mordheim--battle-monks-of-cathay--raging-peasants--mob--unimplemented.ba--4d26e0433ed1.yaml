    distances: [[second, ally-one, 1], [second, ally-two, 2]]
    nearby:
    - participant_id: ally-one
      side_id: second
      condition: standing
      fighter: {collection: mordheim, band_id: battle-monks-of-cathay, profile_id: raging-peasants}
    - participant_id: ally-two
      side_id: second
      condition: standing
      fighter: {collection: mordheim, band_id: battle-monks-of-cathay, profile_id: raging-peasants}
  maximum_rounds: 1
  rolls:
