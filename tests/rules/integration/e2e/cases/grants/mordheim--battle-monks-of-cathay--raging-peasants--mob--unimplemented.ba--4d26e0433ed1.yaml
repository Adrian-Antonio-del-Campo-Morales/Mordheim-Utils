# --- Authored scenarios ---
# Derived from the printed rules, the printed profiles of this band and the supplied-participant vocabulary;
# no engine output was consulted.  The vehicle is the round-0 Fear test of the charged warrior, the individual
# Leadership test this setup can force; the charger is a hand-built fixture that declares its own facts, and the
# nearby allies and leader are supplied participants, never simulated fighters with turns of their own.

# The printed bonus: two allied Peasants within 3 inches supply +1 Ld each, so the carrier's printed
# Leadership 6 becomes 8 and the declared 3+4 passes.  The count travels as the admitted mob_allies fact the
# printed rule names, supplied here together with the two allies the caller counted.
