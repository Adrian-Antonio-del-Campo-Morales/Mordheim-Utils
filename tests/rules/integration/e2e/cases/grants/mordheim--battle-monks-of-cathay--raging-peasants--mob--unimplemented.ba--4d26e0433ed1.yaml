  covers: [individual-leadership-bonus]
  fighters:
    first:
      trait_overrides: {causes_fear: true}
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 10, attacks: 1, leadership: 7}
    second:
      collection: mordheim
      band_id: battle-monks-of-cathay
      profile_id: raging-peasants
      trait_overrides: {mob_allies: 2}
  duel_context:
    first_id: first
    second_id: second
    charging: [first]
