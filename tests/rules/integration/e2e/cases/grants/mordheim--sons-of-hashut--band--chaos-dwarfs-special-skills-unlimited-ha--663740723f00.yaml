# --- Authored scenarios ---
# Family model (Hatred against every enemy, a selectable warband skill): the bearers are printed band
# heroes built from their profiles, so the granted skill is what each scenario exercises; their
# physical characteristics are supplied as fixture facts (WS3 S3 T3 W2 I5 A1) so the dice thresholds
# and the strike order are fixed, and their printed Leadership stays in place.  The opponent fixture
# declares no identity fact at all, because the recorded contract qualifies every enemy and the
# identity gate is therefore open.  A natural 2 misses against WS3, the reroll is taken on a 4+ and the
# wound rolls a 4+, so the reroll is exactly what the tape shows.  The record is selectable, so the
# selection is what activates it: the contrast bearer is a hero of the same printed eligibility list
# that declares no selection, and its tape holds no reroll key at all.

