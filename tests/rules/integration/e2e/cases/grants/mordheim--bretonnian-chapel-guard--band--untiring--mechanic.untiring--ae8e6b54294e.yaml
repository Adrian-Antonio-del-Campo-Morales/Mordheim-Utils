# --- Authored scenarios ---
# Derived from the printed rule and the recorded contract; no engine output was consulted.  Heavy
# armour is the printed 5+ and the floor clamps the Strength 5 penalty back to it.
- audit_id: rule/mordheim/bretonnian-chapel-guard/band--untiring/mechanic.untiring
  id: the-strength-five-attacker-cannot-worsen-the-floor
  covers: [save-floor]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 5, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      armour_id: armour.heavy-armour
      skill_ids: [mechanic.untiring]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 2}
    - {key: round.0.first.attack.0.armour, value: 5}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.saved: true, attacks.0.damage: 0, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
