# --- Authored scenarios ---
# The supplied leader is a nearby participant of the borrower's own side and band; the borrower is the
# band's printed beardlings profile (Leadership 8) and the leader is the band's printed dwarf-noble profile
# (Leadership 9), whose printed borrow radius is 15 cm = 6 inches.
#
# The charged borrower fails against its own Leadership and passes with the supplied leader's value, so the
# charge it received leaves it unclamped.
