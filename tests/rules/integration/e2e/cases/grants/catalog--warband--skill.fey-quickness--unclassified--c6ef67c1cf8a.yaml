# --- Authored scenarios ---
# Derived from the printed rule, the recorded contract and the admitted elven-agility
# semantic specifications; no engine output was consulted.  The assailant is a hand-built
# fixture (Weapon Skill 10, Strength 8) whose hit of 4 and wound of 2 cannot fail against the
# Toughness-3 bearer, so the only undecided step is the special save; both warriors strike
# once and the bearer's strike is a declared natural 1.  The strict tape consumes exactly the
# declared dice, so an extra sequential save or a save requested without the rule fails the
# case instead of passing quietly.

