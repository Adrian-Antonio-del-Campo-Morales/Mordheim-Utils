# --- Authored scenarios ---
# Derived from the printed rule and the recorded contract; no engine output was consulted.  The
# bearer is a hand-built fixture carrying the printed trait, because the clause is about the automatic
# contacting hit rather than about one printed statline, and both fighters strike with natural ones so
# the attack pools stay out of the way.  The victim's wound total is chosen per tape - two where only
# the automatic hit's one damage is at stake, three in the critical-boundary tape so the two damage a
# critical would deal is a different number on the same assertion - and in every tape it stays above
# zero, so no injury roll joins the evidence.

- audit_id: rule/mordheim/cult-of-the-possessed/band--mutations-spines/trait.spines
  id: the-automatic-spines-hit-lands-on-the-contacting-opponent
  covers: [whole--scope--spines]
  fighters:
    first:
      main_weapon_id: weapon.mace
      trait_overrides: {spines: true}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 2, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.spines.wound, value: 5}
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.wounds: 1, state.first.wounds: 2, state.second.condition: STANDING}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

