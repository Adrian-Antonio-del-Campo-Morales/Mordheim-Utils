# --- Authored scenarios ---
# Derived from the printed rule and this band's own published member rows; no engine output was consulted.

- audit_id: rule/mordheim/arabian-tomb-raiders/band--arabian-tomb-raiders-special-skills/profile.skill-access
  id: the-printed-member-is-admitted-for-the-arab-hero
  covers: [whole]
  # The printed permission: an Arab Hero may use this table, so the band's published member must
  # clear the recipient gate. Its own row is scope NO / implemented NO ("Out of scope: movement"),
  # so the declared selection is refused with that row's own deferred sentence: the refusal names
  # the member's effect, not its availability, which is the separation this tape asserts. A build
  # that rejected the table wholesale would answer with the availability sentence and fail here.
  fighters:
    first:
      collection: mordheim
      band_id: arabian-tomb-raiders
      profile_id: sheikh
      special_rule_ids: [band--arabian-tomb-raiders-special-skills-sand-worm]
  expect_error: "special rule is outside the executable duel runtime: band--arabian-tomb-raiders-special-skills-sand-worm"

- audit_id: rule/mordheim/arabian-tomb-raiders/band--arabian-tomb-raiders-special-skills/profile.skill-access
  id: a-member-of-another-bands-table-is-refused
  covers: [whole]
  # The printed permission opens THIS band's table; the declared-selection route resolves the id
  # against this band's own package rows, so another band's published member is refused with the
  # band-level availability sentence. The recipient-level refusal a Henchman receives is not
  # reachable through this channel for this band (MISSING CAPABILITY 2) and is not asserted here.
  fighters:
    first:
      collection: mordheim
      band_id: arabian-tomb-raiders
      profile_id: sheikh
      special_rule_ids: [band--amazon-special-skills-skink-hunter]
  expect_error: "special rule is not available to arabian-tomb-raiders: band--amazon-special-skills-skink-hunter"

- audit_id: rule/mordheim/arabian-tomb-raiders/band--arabian-tomb-raiders-special-skills/profile.skill-access
  id: a-special-skill-outside-the-printed-table-is-refused
  covers: [whole]
  # The closure of the same printed access through the list route (skill_ids). Restored
  # deliberately: its sentence is produced today by the empty member list, which is why the
  # admission tape above stands beside it as the discriminating control.
  fighters:
    first:
      collection: mordheim
      band_id: arabian-tomb-raiders
      profile_id: sheikh
      skill_ids: [skill.monster-slayer]
      main_weapon_id: weapon.mace
  expect_error: "skills are not available to arabian-tomb-raiders/sheikh: ['skill.monster-slayer']"

- audit_id: rule/mordheim/arabian-tomb-raiders/band--arabian-tomb-raiders-special-skills/profile.skill-access
  id: the-published-member-is-admitted-on-the-table-list-route
  covers: [whole]
  # R1's membership half, through the route that reads the member array: the printed permission makes
  # this band's published member a legal special selection for an Arab Hero, which is the selection
  # requirement the member's own deferred effect does not decide. The declared identity is the band's
  # own published member id, because no catalogue row carries it. Today the binding has no member
  # array and the list route rejects an identity the catalogue does not carry, so the build is refused
  # with the 'skills are not available' sentence naming that very member - the PENDING projection
  # defect kept visible rather than avoided.
  fighters:
    first:
      collection: mordheim
      band_id: arabian-tomb-raiders
      profile_id: sheikh
      skill_ids: [band--arabian-tomb-raiders-special-skills-sand-worm]
      main_weapon_id: weapon.mace
    second:
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  initial_state: {first: {attacks: 0}, second: {attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  expect_initial: {first.attacks: 0, second.attacks: 0}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

