# --- Authored scenarios ---
# Derived from the printed rule text, the band package and the recorded semantic contract; no engine
# output was consulted.  The Fear source is the printed Chainsaw Sword grant ("A model bearing a
# Chainsaw Sword causes Fear"); because that bearer also causes Fear, the charging side takes no
# charge test, so the only Psychology request this setup can make is the charged warrior's Fear
# test - the one the immunity removes.  Both warriors fight unarmed, each striking with the printed
# Attacks value of its own profile, and every strike is declared as a natural 1, so the round
# reports nothing but that request.

- audit_id: rule/mordheim/dwarf-slayer-cult-web/band--slayer-rules/mechanic.psychology-immunity
  id: the-immune-warrior-is-not-tested-for-fear
  covers: [psychology-immunity--scope--psychology-immunity]
  fighters:
    first:
      main_weapon_id: weapon.chainsaw-sword
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 7, attacks: 1, leadership: 7}
    second: {collection: mordheim, band_id: dwarf-slayer-cult-web, profile_id: troll-slayers}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.wounds: 3, state.second.wounds: 1, state.second.condition: STANDING}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

- audit_id: rule/mordheim/dwarf-slayer-cult-web/band--slayer-rules/mechanic.psychology-immunity
  id: a-band-mate-without-the-immunity-is-tested
  covers: [psychology-immunity--scope--psychology-immunity]
  fighters:
    first:
      main_weapon_id: weapon.chainsaw-sword
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 7, attacks: 1, leadership: 7}
    second: {collection: mordheim, band_id: dwarf-slayer-cult-web, profile_id: rememberer}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.fear.charged.0, value: 1}
    - {key: round.0.second.fear.charged.1, value: 1}
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.wounds: 3, state.second.wounds: 1, state.second.condition: STANDING}
  expect_final: {rounds_executed: 1, termination_reason: horizon}