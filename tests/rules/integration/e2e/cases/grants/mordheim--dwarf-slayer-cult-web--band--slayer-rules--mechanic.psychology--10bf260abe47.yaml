#
# Clause: psychology-immunity--scope--psychology-immunity (scope: YES)
# PARTIAL[psychology-immunity--scope--psychology-immunity]: [C] 2 scenarios evidence the printed immunity
#   through the one Psychology request this
#   setup can make - the round-0 Fear test of the charged warrior.  In the immune scenario the
#   tape declares no Fear die at all, and the strict tape consumes exactly the declared dice and
#   rejects both an undeclared request and an unused entry, so a test the engine still asked for
#   fails the case instead of passing quietly - the absence is the assertion.
#   In the contrast scenario the non-immune band-mate rememberer is charged the same way and its
#   two Leadership dice are declared and pass on 1+1, so the same setup does produce the request
#   when the immunity is absent.
#   NOT YET EVIDENCED: the clause is not fully evidenced.  Its recorded contract covers any
#   individual Psychology test and the denial of a Hatred reroll and of a Frenzy bonus, so these
#   variants stay unobserved: (a) a Stupidity test skipped for the same warrior - no corpus
#   profile pairs this immunity with a Stupidity grant, so the variant needs that grant (or an
#   accepted equivalent fixture); (b) the denial of a Hatred reroll and of a Frenzy bonus - the
#   same missing second grant.
#   Dice derivation (sources): the warrior strikes with its printed Attacks value A1 and its rules
#   []
#   add no round-0 die request of their own - every strike is declared as a natural 1, so no
#   on-hit, wound, save or injury effect can trigger, and a charged model takes no charge bonus.
#   Immunity source (sources): the band rule band--slayer-rules binds mechanic.psychology-immunity, profile.equipment-restrictions with applies_to ['giant-slayer', 'doomseeker', 'troll-slayers', 'stubbles', 'axe-hurlers'], so it covers
#   the carrier troll-slayers and not the contrast rememberer.
#   The Fear test itself is a 2D6 Leadership test, so the variant list above concerns the
#   clause's other consequences, not an unavailable tape.
