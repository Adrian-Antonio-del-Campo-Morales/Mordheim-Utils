    second:
      main_weapon_id: weapon.mace
      skill_ids: [skill.tough-as-steel]
      characteristics: &tg-bearer {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 2, attacks: 1}
  duel_context: &tg-context {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls: &tg-five
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 5}
    - {key: round.0.first.attack.0.injury.0, value: 5}
  expect_rounds:
    0: {attacks.0.wounded: True, attacks.0.damage: 1, state.second.wounds: 0, state.second.condition: STUNNED}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

