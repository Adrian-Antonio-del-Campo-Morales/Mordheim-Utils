# --- Authored scenarios ---
# Derived from the printed sentence and the register's true-grit branch (out at 6+, stunned at 4-5, knocked
# down below 4); no engine output was consulted.  The bearer starts the duel at one wound and the attacker's
# plain axe adds neither a Concussion conversion nor a Strength bonus, so the declared injury die is the
# injury total itself (its armour-save modifier changes nothing against an unarmoured bearer); the attacker's
# higher Initiative and the uncharged context let it strike first, and the bearer declares no attack of its
# own because every scenario leaves it Stunned, Knocked Down or Out of Action in this round.
