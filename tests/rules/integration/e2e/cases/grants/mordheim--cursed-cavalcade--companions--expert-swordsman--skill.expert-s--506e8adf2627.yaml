# --- Authored scenarios ---
# Derived from the printed rule and the recorded contract; no engine output was consulted.  Every
# fighter is hand-built so the tape holds only the dice the operator touches, and the charged
# opponent strikes with a natural one.

- audit_id: rule/mordheim/cursed-cavalcade/companions--expert-swordsman/skill.expert-swordsman
  id: a-charging-sword-rerolls-its-failed-hit
  covers: [whole]
  fighters:
    first:
      main_weapon_id: weapon.sword
      skill_ids: [skill.expert-swordsman]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.first.attack.0.hit.reroll, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: true, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The printed weapon restriction: a two-handed sword is outside the operator's scope, so the charged
# miss stands and no second die is requested for it.  The weapon also strikes last, so the mace
# opponent resolves first and the refused reroll is the second attack of the round.
- audit_id: rule/mordheim/cursed-cavalcade/companions--expert-swordsman/skill.expert-swordsman
