schema_version: 1
policy: critical_and_high_required
description: >-
  Interactions rated critical and high require explicit evidence. Medium ones are recommended and
  low ones optional; they stay visible to widen coverage. Overrides are reviewed semantic decisions
  recorded here after a source-backed triage.
overrides:
# Triage 2026-09-03 (outputs/audit/interaction-triage.csv): the ten body-armour × body-armour pairs
# share the armour.target concept but can never co-occur in legal construction. FighterBuild carries
# a single armour_id slot (src/mordheim_core/models.py); armour.no-armour is the empty default ("No
# body armour is equipped. Other saves may still apply." - catalog/mechanics/close-combat.yaml); two
# body armours can never be granted to one fighter and opposing fighters' armour saves resolve
# disjointly (each incoming attack is saved only against its own target). Recorded as illegal
# instead of requiring a pair spec.
- bindings:
  - '{"id": "armour.gromril-armour", "kind": "mechanic", "parameters": {}}'
  - '{"id": "armour.heavy-armour", "kind": "mechanic", "parameters": {}}'
  risk_level: high
  verification_requirement: required
  status: illegal
  risk_reasons:
  - same_slot:body-armour
  evidence:
  - 'construction: single armour_id per FighterBuild (src/mordheim_core/models.py); catalog/mechanics/close-combat.yaml armour family'
