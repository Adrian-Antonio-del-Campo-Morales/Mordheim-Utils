schema_version: 1
specifications:
- id: weapon.rapier
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: stateful
  sources:
  - target: mechanic/weapon.rapier
    digest: 58631cdc655d0cee862ba7e174211f6b9c9e36ce1bc62e226fc79e2c7b344fb5
  interpretation: Rapier uses user Strength, parries and grants the enemy +1 armour. After each failed
    wound Barrage may continue with a cumulative -1 hit penalty, capped at 6 to hit.
  cases:
  - id: compiled-strength
    roles:
    - compiled
    - active
    - consumer
    operation: strength
    attacker:
      main_weapon_id: weapon.rapier
    expect:
      attacker.main_weapon.strength_bonus: 0
      attacker.main_weapon.parry: true
      result.wound: 3
      result.armour: 3
      attacker.main_weapon.target_armour_bonus: 1
  - id: parry
    roles:
    - active
    - boundary
    operation: parry
    defender:
      main_weapon_id: weapon.rapier
    context:
      hit_roll: 4
    rolls:
    - key: test.parry
      value: 5
    expect:
      result.blocked: true
  - id: failed-wound-extra-attack-succeeds
    roles:
    - active
    - consumer
    - sequence
    - consumption
    - boundary
    operation: attack
    attacker:
      main_weapon_id: weapon.rapier
    rolls:
    - key: test.hit
      value: 4
    - key: test.wound
      value: 1
    - key: test.barrage.1.hit
      value: 5
    - key: test.barrage.1.wound
      value: 5
    - key: test.barrage.1.armour
      value: 1
    expect:
      result.hit: true
      result.wounded: true
      result.damage: 1
      result.defender.wounds: 2
  - id: failed-extra-hit-omits-extra-wound
    roles:
    - inactive
    - sequence
    - consumption
    - boundary
    operation: attack
    attacker:
      main_weapon_id: weapon.rapier
    rolls:
    - key: test.hit
      value: 4
    - key: test.wound
      value: 1
    - key: test.barrage.1.hit
      value: 4
    expect:
      result.hit: true
      result.wounded: false
      result.damage: 0
  - id: second-continuation
    roles:
    - active
    - consumer
    - sequence
    - consumption
    - boundary
    operation: attack
    attacker:
      main_weapon_id: weapon.rapier
    rolls:
    - key: test.hit
      value: 4
    - key: test.wound
      value: 1
    - key: test.barrage.1.hit
      value: 5
    - key: test.barrage.1.wound
      value: 1
    - key: test.barrage.2.hit
      value: 6
    - key: test.barrage.2.wound
      value: 4
    - key: test.barrage.2.armour
      value: 1
    expect:
      result.hit: true
      result.wounded: true
      result.damage: 1
      result.defender.wounds: 2
  mutations:
  - id: invent-strength-penalty
    path: attacker.main_weapon.strength_bonus
    value: -1
    cases:
    - compiled-strength
  - id: remove-parry
    path: defender.main_weapon.parry
    value: false
    cases:
    - parry
  - id: remove-extra-attack-tag
    path: attacker.main_weapon.tags
    value: []
    cases:
    - failed-wound-extra-attack-succeeds
- id: weapon.cutlass
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: stateful
  sources:
  - target: mechanic/weapon.cutlass
    digest: 55cbb4f41cbba42e65a323dc875edb4006a067d482b6f7ab2420ef25531cfb11
  interpretation: A successful parry with Cutlass cancels the hit and immediately triggers a normal riposte.
    A failed parry creates no riposte.
  cases:
  - id: compiled
    roles:
    - compiled
    operation: compile
    defender:
      main_weapon_id: weapon.cutlass
    expect:
      defender.main_weapon.parry: true
  - id: parry-counterattack
    roles:
    - active
    - consumer
    - sequence
    - consumption
    - boundary
    operation: attack
    attacker:
      main_weapon_id: weapon.mace
    defender:
      main_weapon_id: weapon.cutlass
    rolls:
    - key: test.hit
      value: 4
    - key: test.parry
      value: 5
    - key: test.cutlass-counter.hit
      value: 4
    - key: test.cutlass-counter.wound
      value: 4
    expect:
      result.parried: true
      result.attacker.wounds: 2
      result.defender.wounds: 3
  - id: failed-parry-no-counterattack
    roles:
    - inactive
    - sequence
    - consumption
    - boundary
    operation: attack
    attacker:
      main_weapon_id: weapon.mace
    defender:
      main_weapon_id: weapon.cutlass
    rolls:
    - key: test.hit
      value: 4
    - key: test.parry
      value: 4
    - key: test.wound
      value: 4
    expect:
      result.parried: false
      result.wounded: true
      result.defender.wounds: 2
  mutations:
  - id: remove-cutlass-counter
    path: defender.main_weapon.tags
    value: []
    cases:
    - parry-counterattack
  - id: remove-cutlass-parry
    path: defender.main_weapon.parry
    value: false
    cases:
    - parry-counterattack
- id: weapon.blackpowder-melee-family
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: contextual
  sources:
  - target: mechanic/weapon.pistol
    digest: c02ed0e5077a7533b720f84b63452a07d4cb883e83f1882528fb77b984131cd2
  - target: mechanic/weapon.duelling-pistol
    digest: f151573db54ef70c804cd7b47370df81937af44c61e02bcdc7ceb1020e12a089
  interpretation: Pistols fire at Strength 4 with one additional penetration point (total armour modifier
    -2). Their shot is limited to the first combat turn; Duelling Pistols add +1 to hit.
  cases:
  - id: pistol-compiled-strength
    roles:
    - compiled
    - active
    - consumer
    operation: strength
    attacker:
      main_weapon_id: weapon.pistol
    context:
      first_round: true
    expect:
      attacker.main_weapon.fixed_strength: 4
      attacker.main_weapon.armour_penetration: 1
      result.wound: 4
      result.armour: 4
  - id: pistol-first-round-one-attack
    roles:
    - active
    - boundary
    operation: attacks
    attacker:
      main_weapon_id: weapon.pistol
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 3
        attacks: 3
    context:
      first_round: true
    expect:
      result.attacks: 1
  - id: pistol-later-round-no-attacks
    roles:
    - inactive
    - boundary
    - consumption
    operation: attacks
    attacker:
      main_weapon_id: weapon.pistol
    context:
      first_round: false
    expect:
      result.attacks: 0
  - id: pistol-and-dagger-later-use-dagger-only
    roles:
    - inactive
    - boundary
    operation: attacks
    attacker:
      main_weapon_id: weapon.pistol
      off_hand_id: weapon.dagger
    context:
      first_round: false
    expect:
      result.attacks: 1
  - id: duelling-pistol-hit-bonus
    roles:
    - compiled
    - active
    - consumer
    - boundary
    operation: hit
    attacker:
      main_weapon_id: weapon.duelling-pistol
    context:
      first_round: true
    rolls:
    - key: hit
      value: 3
    expect:
      attacker.main_weapon.fixed_strength: 4
      attacker.main_weapon.armour_penetration: 1
      context.modifier: 1
      result.target: 3
      result.success: true
  - id: ordinary-pistol-has-no-hit-bonus
    roles:
    - inactive
    - boundary
    operation: hit
    attacker:
      main_weapon_id: weapon.pistol
    context:
      first_round: true
    rolls:
    - key: hit
      value: 3
    expect:
      context.modifier: 0
      result.target: 4
      result.success: false
  mutations:
  - id: remove-pistol-strength
    path: attacker.main_weapon.fixed_strength
    value: 0
    cases:
    - pistol-compiled-strength
  - id: make-pistol-persistent
    path: attacker.main_weapon.tags
    value: []
    cases:
    - pistol-later-round-no-attacks
  - id: remove-duelling-accuracy
    path: attacker.main_weapon.hit_modifier
    value: 0
    cases:
    - duelling-pistol-hit-bonus
- id: weapon.unarmed-family
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: local
  sources:
  - target: mechanic/weapon.natural-attacks
    digest: 70e06e5275219e3099a8eaf430dce2737492c5d5989e0e3c40b29a4a7a3915d1
  - target: mechanic/weapon.fist
    digest: 361dde1c6030df509c50a3cc97867a4d4a20afd8209c226f2a1692460ed630e0
  interpretation: Natural Attacks uses the profile's Strength and number of attacks without penalty or
    off hand. Fist limits to one attack, applies Strength -1 and improves the target's save by one, creating
    6+ if it had no armour.
  cases:
  - id: natural-profile-strength
    roles:
    - compiled
    - active
    - consumer
    operation: strength
    attacker:
      main_weapon_id: weapon.natural-attacks
    expect:
      attacker.main_weapon.strength_bonus: 0
      result.wound: 3
      result.armour: 3
  - id: natural-profile-attacks
    roles:
    - active
    - boundary
    operation: attacks
    attacker:
      main_weapon_id: weapon.natural-attacks
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 3
        attacks: 3
    expect:
      result.attacks: 3
  - id: natural-rejects-offhand
    roles:
    - rejected
    operation: compile
    attacker:
      main_weapon_id: weapon.natural-attacks
      off_hand_id: weapon.dagger
    reject: weapon.natural-attacks cannot be combined with weapon.dagger
  - id: fist-strength
    roles:
    - compiled
    - active
    - consumer
    operation: strength
    attacker:
      main_weapon_id: weapon.fist
    expect:
      attacker.main_weapon.strength_bonus: -1
      attacker.main_weapon.target_armour_bonus: 1
      result.wound: 2
      result.armour: 2
  - id: fist-limits-attacks
    roles:
    - active
    - boundary
    operation: attacks
    attacker:
      main_weapon_id: weapon.fist
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 3
        attacks: 4
    expect:
      result.attacks: 1
  - id: ordinary-weapon-keeps-profile-attacks
    roles:
    - inactive
    - boundary
    operation: attacks
    attacker:
      main_weapon_id: weapon.mace
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 3
        attacks: 4
    expect:
      result.attacks: 4
  - id: fist-creates-six-plus-save
    roles:
    - active
    - consumer
    - boundary
    operation: armour
    attacker:
      main_weapon_id: weapon.fist
    rolls:
    - key: armour
      value: 6
    expect:
      result.target: 6
      result.eligible: true
      result.saved: true
  - id: fist-rejects-offhand
    roles:
    - rejected
    operation: compile
    attacker:
      main_weapon_id: weapon.fist
      off_hand_id: weapon.dagger
    reject: weapon.fist cannot be combined with weapon.dagger
  mutations:
  - id: weaken-natural-attacks
    path: attacker.main_weapon.strength_bonus
    value: -1
    cases:
    - natural-profile-strength
  - id: remove-fist-penalty
    path: attacker.main_weapon.strength_bonus
    value: 0
    cases:
    - fist-strength
  - id: remove-fist-limit
    path: attacker.main_weapon.tags
    value: []
    cases:
    - fist-limits-attacks
  - id: remove-fist-armour-bonus
    path: attacker.main_weapon.target_armour_bonus
    value: 0
    cases:
    - fist-creates-six-plus-save
- id: weapon.impact-and-fire-family
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: stateful
  sources:
  - target: mechanic/weapon.brazier-iron
    digest: bf539c7fd2a610b98bdbec9492020e03057f45911166f2b8febfb617ce4127ca
  - target: mechanic/weapon.brass-knuckles
    digest: 2940ef4a1cf060ec51838d5eb518c4884e87e65b7e4585c7a97df9205f295d04
  - target: mechanic/weapon.war-maul
    digest: 4f2a0b7379bc60173b56d6d89448709f5548aa755b6b2da584af2838270549b8
  - target: mechanic/weapon.double-bladed-sword
    digest: 05847de2b7387a26feb59cdb63474205577abf3a4288400ff40d6346bdf470b4
  interpretation: The Brazier's 5+ fire and Strength +1, the paired set of Brass Knuckles, the heavy unparriable
    package of the War Maul, and the repeated attack/parry of the Double-bladed Sword are verified separately.
  cases:
  - id: brazier-ignites-on-five
    roles:
    - compiled
    - active
    - consumer
    - sequence
    - consumption
    - boundary
    operation: attack
    attacker:
      main_weapon_id: weapon.brazier-iron
    rolls:
    - key: test.hit
      value: 4
    - key: test.ignition
      value: 5
    - key: test.wound
      value: 3
    expect:
      attacker.main_weapon.strength_bonus: 1
      attacker.main_weapon.two_handed: true
      result.defender.on_fire: true
      result.wounded: true
  - id: brazier-four-does-not-ignite
    roles:
    - inactive
    - boundary
    - sequence
    operation: attack
    attacker:
      main_weapon_id: weapon.brazier-iron
    rolls:
    - key: test.hit
      value: 4
    - key: test.ignition
      value: 4
    - key: test.wound
      value: 3
    expect:
      result.defender.on_fire: false
  - id: brass-knuckles-pair
    roles:
    - compiled
    - active
    - consumer
    operation: attacks
    attacker:
      main_weapon_id: weapon.brass-knuckles
    expect:
      attacker.main_weapon.paired: true
      attacker.main_weapon.strength_bonus: 1
      result.attacks: 2
  - id: war-maul-strength
    roles:
    - compiled
    - active
    - consumer
    operation: strength
    attacker:
      main_weapon_id: weapon.war-maul
    expect:
      attacker.main_weapon.strength_bonus: 2
      attacker.main_weapon.armour_penetration: 1
      attacker.main_weapon.priority: -1
      attacker.main_weapon.initiative_bonus: -1
      attacker.main_weapon.cannot_be_parried: true
      result.wound: 5
      result.armour: 5
  - id: war-maul-cannot-be-parried
    roles:
    - active
    - boundary
    - consumption
    operation: attack
    attacker:
      main_weapon_id: weapon.war-maul
    defender:
      main_weapon_id: weapon.sword
    rolls:
    - key: test.hit
      value: 4
    - key: test.wound
      value: 2
    expect:
      result.parried: false
      result.wounded: true
  - id: double-bladed-extra-attack
    roles:
    - compiled
    - active
    - consumer
    operation: attacks
    attacker:
      main_weapon_id: weapon.double-bladed-sword
    expect:
      attacker.main_weapon.two_handed: true
      attacker.main_weapon.attacks_bonus: 1
      attacker.main_weapon.parry: true
      result.attacks: 2
  - id: double-bladed-second-parry-attempt
    roles:
    - active
    - boundary
    - sequence
    - consumption
    operation: parry
    defender:
      main_weapon_id: weapon.double-bladed-sword
    context:
      hit_roll: 4
    rolls:
    - key: test.parry
      value: 4
    - key: test.parry.reroll
      value: 5
    expect:
      result.blocked: true
      result.rerolled: true
  mutations:
  - id: remove-brazier-ignition
    path: attacker.main_weapon.ignition_threshold
    value: 7
    cases:
    - brazier-ignites-on-five
  - id: remove-brass-pair
    path: attacker.main_weapon.paired
    value: false
    cases:
    - brass-knuckles-pair
  - id: remove-war-maul-strength
    path: attacker.main_weapon.strength_bonus
    value: 0
    cases:
    - war-maul-strength
  - id: allow-war-maul-parry
    path: attacker.main_weapon.cannot_be_parried
    value: false
    cases:
    - war-maul-cannot-be-parried
  - id: remove-double-bladed-attack
    path: attacker.main_weapon.attacks_bonus
    value: 0
    cases:
    - double-bladed-extra-attack
  - id: remove-double-bladed-reroll
    path: defender.main_weapon.tags
    value: []
    cases:
    - double-bladed-second-parry-attempt
