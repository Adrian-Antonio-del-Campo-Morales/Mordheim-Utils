    operation: selectable_grant
    defender:
      band_id: bretonnian-chapel-guard
      profile_id: questing-knight
      special_rule_ids:
      - band--bulging-muscles
    context:
      rule_id: band--bulging-muscles
    expect:
      result.recipients:
      - knights-errant
      - questing-knight
  - id: compiled
    roles:
    - compiled
    operation: compile
    attacker:
      skill_ids:
      - mechanic.retain-flail-morning-star-strength-bonus
    expect:
      attacker.characteristics.strength: 3
