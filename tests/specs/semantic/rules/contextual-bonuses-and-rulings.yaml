    attacker:
      band_id: bretonnian-chapel-guard
      profile_id: questing-knight
      special_rule_ids:
      - band--bulging-muscles
      main_weapon_id: weapon.morning-star
    context:
      first_round: false
    expect:
      result.wound: 5
