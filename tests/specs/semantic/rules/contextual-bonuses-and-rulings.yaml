- id: sermon-self-attack
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: local
  sources:
  - target: mechanic/skill.inspiring-sermon
    digest: a28792979fed5f099a1c8782d6a7b7def4501c3917cd1b4a870d48e0cb26202e
  - target: rule/trollheim/chaos-streets-sigmar-protectorate/band--protectorate-special-skills-rousing-sermon/skill.inspiring-sermon
    digest: 5c9a48307a9374488ae680ded446c8790be48d21314c5078a97e63e44d6c4bac
  interpretation: 'Chaos in the Streets p.153 / Rousing Sermon: on the turn it is declared, the priest
    gains +1 Attack. This selection represents the sermon active in the tested turn. Prayers and allies
    within 6 inches do not belong to the individual duel; they are not simulated here.'
  cases:
  - id: recipients
    roles:
    - grant
    operation: selectable_grant
    defender:
      collection: trollheim
      band_id: chaos-streets-sigmar-protectorate
      profile_id: warrior-priest
      special_rule_ids:
      - band--protectorate-special-skills-rousing-sermon
    context:
      rule_id: band--protectorate-special-skills-rousing-sermon
    expect:
      result.recipients:
      - warrior-priest
  - id: compiled
    roles:
    - compiled
    operation: compile
    attacker:
      skill_ids:
      - skill.inspiring-sermon
    expect:
      attacker.characteristics.attacks: 1
    expect_contains:
      attacker.global_effects.tags:
      - skill.inspiring-sermon
  - id: active-false-false
    roles:
    - active
    - consumer
    - boundary
    operation: attacks
    attacker:
      collection: trollheim
      band_id: chaos-streets-sigmar-protectorate
      profile_id: warrior-priest
      special_rule_ids:
      - band--protectorate-special-skills-rousing-sermon
    context:
      first_round: false
      charging: false
      player_turn: true
    expect:
      result.attacks: 2
  - id: inactive-enemy-turn
    roles:
    - inactive
    - boundary
    operation: attacks
    attacker:
      collection: trollheim
      band_id: chaos-streets-sigmar-protectorate
      profile_id: warrior-priest
      special_rule_ids:
      - band--protectorate-special-skills-rousing-sermon
    context:
      first_round: false
      charging: false
      player_turn: false
    expect:
      result.attacks: 1
  - id: active-false-true
    roles:
    - active
    - consumer
    - boundary
    operation: attacks
    attacker:
      collection: trollheim
      band_id: chaos-streets-sigmar-protectorate
      profile_id: warrior-priest
      special_rule_ids:
      - band--protectorate-special-skills-rousing-sermon
    context:
      first_round: false
      charging: true
      player_turn: true
    expect:
      result.attacks: 2
  - id: active-true-false
