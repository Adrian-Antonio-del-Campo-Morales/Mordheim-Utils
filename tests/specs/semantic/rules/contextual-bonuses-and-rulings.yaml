schema_version: 1
specifications:
- id: retain-weapon-strength
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: contextual
  sources:
  - target: mechanic/mechanic.retain-flail-morning-star-strength-bonus
    digest: 12d6373b6aa56e172187767442ced1bbb65ac061823efddc020bbd6661611f5d
  - target: rule/mordheim/bretonnian-chapel-guard/band--bulging-muscles/mechanic.retain-flail-morning-star-strength-bonus
    digest: 2a1268fca63780a162f86fc3970c101f4cb604f59a15e2902dcfe0b1a9b3f93c
  interpretation: >-
    Knightly Skills / Bulging Muscles: keeps the flail's +2 S and the morning star's +1 S after the
    first round. It does not increase swords nor add more Strength to the initial bonus; wounds and
    Strength-based penetration use the same value.
  cases:
  - id: recipients
    roles:
    - grant
    operation: selectable_grant
    defender:
      band_id: bretonnian-chapel-guard
      profile_id: questing-knight
      special_rule_ids:
      - band--bulging-muscles
    context:
      rule_id: band--bulging-muscles
    expect:
      result.recipients:
      - knights-errant
      - questing-knight
  - id: compiled
    roles:
    - compiled
    operation: compile
    attacker:
      skill_ids:
      - mechanic.retain-flail-morning-star-strength-bonus
    expect:
      attacker.characteristics.strength: 3
    expect_contains:
      attacker.global_effects.tags:
      - mechanic.retain-flail-morning-star-strength-bonus
  - id: flail-false
    roles:
    - active
    - consumer
    - boundary
    operation: strength
    attacker:
      band_id: bretonnian-chapel-guard
      profile_id: questing-knight
      special_rule_ids:
      - band--bulging-muscles
      main_weapon_id: weapon.flail
    context:
      first_round: false
    expect:
      result.wound: 6
      result.armour: 6
