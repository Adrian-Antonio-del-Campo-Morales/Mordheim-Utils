- id: well-ard-no-armour-ruling
  question: Does the +1 from Well 'Ard create a 6+ armour save when the warrior has no armour save at
    all?
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: local
  sources:
  - target: mechanic/mechanic.armour-save-bonus
    digest: 081b4d3cf828f7f347c620d6add1258b32dee4eca0e75d8545111b80a116ac1a
  - target: rule/trollheim/chaos-streets-greenskins/band--orc-special-skills-well-ard/mechanic.armour-save-bonus
    digest: 1f4036afbce144b4010a56ec1d962b99b5576bfb9f503256aec91ea183dc354b
  - target: rule/mordheim/orc-mob/band--orc-special-skills-well-ard/mechanic.armour-save-bonus
    digest: 081ec5042087b2dda1cc597ee29b902ec7c60a161e33c9d6c2c9b2974dc92f0b
  ruling: Well 'Ard creates a 6+ armour save if the warrior had none.
  interpretation: Well 'Ard improves an existing armour save by one point and turns the absence of armour
    into a 6+ save. It applies as ordinary armour, so it still suffers the relevant penetration modifiers.
  cases:
  - id: compiled-bonus
    roles:
    - compiled
    operation: compile
    attacker:
      skill_ids:
      - mechanic.armour-save-bonus
    expect:
      attacker.armour_save: 6
  - id: recipients-trollheim
    roles:
    - grant
    operation: selectable_grant
    defender:
      collection: trollheim
      band_id: chaos-streets-greenskins
      profile_id: orc-boss
    context:
      rule_id: band--orc-special-skills-well-ard
    expect:
      result.recipients:
      - orc-big-uns
      - orc-boss
      - orc-shaman
  - id: existing-armour
    roles:
    - active
    - consumer
    operation: armour
    attacker:
      main_weapon_id: weapon.mace
    defender:
      armour_id: armour.heavy-armour
      skill_ids:
      - mechanic.armour-save-bonus
    rolls:
    - key: armour
      value: 4
    expect:
      result.saved: true
  - id: no-armour-six-saves
    roles:
    - active
    - boundary
    - consumer
    operation: armour
    attacker:
      main_weapon_id: weapon.mace
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 1
        initiative: 3
        attacks: 1
    defender:
      skill_ids:
      - mechanic.armour-save-bonus
    rolls:
    - key: armour
      value: 6
    expect:
      result.saved: true
  - id: no-armour-five-fails
    roles:
    - active
    - boundary
    operation: armour
    attacker:
      main_weapon_id: weapon.mace
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 1
        initiative: 3
        attacks: 1
    defender:
      skill_ids:
      - mechanic.armour-save-bonus
    rolls:
    - key: armour
      value: 5
    expect:
      result.saved: false
  - id: ordinary-unarmoured-control
    roles:
    - inactive
    operation: armour
    attacker:
      main_weapon_id: weapon.mace
    defender: {}
    expect:
      result.eligible: false
  mutations:
  - id: remove-created-save
    path: defender.armour_save
    value: 7
    cases:
    - no-armour-six-saves
- id: shield-strike-penetration-ruling
  question: Does Shield Strike apply a special penalty or the normal Strength-based modification?
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: stateful
  sources:
  - target: mechanic/skill.shield-strike
    digest: 1cd0452db62df48eaa9d47f5509bdbb2640637f745cd4784f7c9efa6198f536c
  ruling: Shield Strike modifies armour normally according to the Strength of the hit.
  interpretation: The extra attack uses the warrior's Strength and contributes no armour bonus or penalty
    of its own. The existing grant requires a standard shield.
  cases:
  - id: compiled-without-special-penetration
    roles:
    - grant
    - compiled
    operation: compile
    attacker:
      skill_ids:
      - skill.shield-strike
      off_hand_id: defence.shield
    expect:
      attacker.extra_attacks.0.target_armour_bonus: 0
    expect_contains:
      attacker.extra_attacks.0.tags:
      - rule.shield-strike
  - id: strength-four-penetrates
    roles:
    - active
    - consumer
    - sequence
    - boundary
    operation: extra_attack
    attacker:
      skill_ids:
      - skill.shield-strike
      off_hand_id: defence.shield
      characteristics:
        weapon_skill: 3
        strength: 4
        toughness: 3
        wounds: 2
        initiative: 3
        attacks: 1
    defender:
      armour_id: armour.plate-armour
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 2
        initiative: 3
        attacks: 1
    rolls:
    - key: test.hit
      value: 4
    - key: test.wound
      value: 3
    - key: test.armour
      value: 4
    expect:
      result.wounded: true
      result.defender.wounds: 1
  - id: strength-three-control
    roles:
    - inactive
    - consumption
    - boundary
    operation: extra_attack
    attacker:
      skill_ids:
      - skill.shield-strike
      off_hand_id: defence.shield
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 2
        initiative: 3
        attacks: 1
    defender:
      armour_id: armour.plate-armour
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 2
        initiative: 3
        attacks: 1
    rolls:
    - key: test.hit
      value: 4
    - key: test.wound
      value: 4
    - key: test.armour
      value: 4
    expect:
      result.defender.wounds: 2
  mutations:
  - id: restore-poor-penetration
    path: attacker.extra_attacks.0.target_armour_bonus
    value: 1
    cases:
    - strength-four-penetrates
    - strength-three-control
