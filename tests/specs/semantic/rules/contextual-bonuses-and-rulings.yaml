    attacker:
      collection: trollheim
      band_id: chaos-streets-sigmar-protectorate
      profile_id: warrior-priest
      special_rule_ids:
      - band--protectorate-special-skills-rousing-sermon
    context:
      first_round: false
      charging: false
      player_turn: false
    expect:
      result.attacks: 1
  - id: active-false-true
    roles:
    - active
    - consumer
    - boundary
    operation: attacks
    attacker:
      collection: trollheim
      band_id: chaos-streets-sigmar-protectorate
      profile_id: warrior-priest
      special_rule_ids:
      - band--protectorate-special-skills-rousing-sermon
    context:
      first_round: false
      charging: true
      player_turn: true
    expect:
      result.attacks: 2
  - id: active-true-false
