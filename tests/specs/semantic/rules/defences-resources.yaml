- id: defence.lucky-charm
  category: stateful
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  sources:
  - target: mechanic/defence.lucky-charm
    digest: b0288f5f39f69539fd51984a48ce9b695fa468e83672659a0b68c67a9288bfc7
  interpretation: The first successful hit offers a single 4+ charm save. The attempt consumes the charm
    on failure as well as success, and recovery does not replenish it. Misses do not consume it.
  interaction_contract:
    reads:
    - hit.success
    - state.lucky_charm
    writes:
    - hit.success
    - state.lucky_charm
  cases:
  - id: compiled-resource
    operation: initialize
    roles:
