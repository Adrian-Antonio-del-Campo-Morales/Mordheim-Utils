schema_version: 1
specifications:
- id: weapon.attack-bonus-family
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: local
  sources:
  - target: mechanic/weapon.bo
    digest: d56fa1c1c8905966a868837c53dca2f98bee58b513f3fe742653231e2975bd4e
  - target: mechanic/weapon.stiletto
    digest: e0fc360cb417ca8ea3c22bdd7f72d1c68d41c50f133a1cba0cb82ea406d7ffab
  interpretation: Bo occupies both hands, adds one attack and allows parrying. Stiletto adds one attack
    but all its attacks resolve at Strength -1.
  cases:
  - id: bo-extra-attack
    roles:
    - compiled
    - active
    - consumer
    - boundary
    operation: attacks
    attacker:
      main_weapon_id: weapon.bo
    expect:
      attacker.main_weapon.two_handed: true
      attacker.main_weapon.attacks_bonus: 1
      attacker.main_weapon.parry: true
      result.attacks: 2
  - id: bo-parry
    roles:
    - active
    - consumer
    operation: parry
    defender:
      main_weapon_id: weapon.bo
    context:
      hit_roll: 4
    rolls:
    - key: test.parry
      value: 5
    expect:
      result.blocked: true
  - id: stiletto-extra-attack
    roles:
    - compiled
    - active
    - consumer
    operation: attacks
    attacker:
      main_weapon_id: weapon.stiletto
    expect:
      attacker.main_weapon.attacks_bonus: 1
      attacker.main_weapon.strength_bonus: -1
      result.attacks: 2
  - id: stiletto-strength-penalty
    roles:
    - active
    - consumer
    - boundary
    operation: strength
    attacker:
      main_weapon_id: weapon.stiletto
    expect:
      result.wound: 2
      result.armour: 2
  - id: ordinary-weapon-no-extra-attack
    roles:
    - inactive
    - boundary
    operation: attacks
    attacker:
      main_weapon_id: weapon.mace
    expect:
      result.attacks: 1
  mutations:
  - id: remove-bo-attack
    path: attacker.main_weapon.attacks_bonus
    value: 0
    cases:
    - bo-extra-attack
  - id: remove-bo-parry
    path: defender.main_weapon.parry
    value: false
    cases:
    - bo-parry
  - id: remove-stiletto-attack
    path: attacker.main_weapon.attacks_bonus
    value: 0
    cases:
    - stiletto-extra-attack
  - id: remove-stiletto-penalty
    path: attacker.main_weapon.strength_bonus
    value: 0
    cases:
    - stiletto-strength-penalty
- id: weapon.poisoned-daggers
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: local
  sources:
  - target: mechanic/weapon.poisoned-daggers
    digest: cee40c5ddf5e67a9106a01c0638b7402656153370942d23de8507b387a709b90
  depends_on:
  - mechanic/poison.black-lotus
  interpretation: Poisoned Daggers are used as a paired set and apply the Black Lotus mechanism. Poison
    immunity removes the automatic wound but not the extra attack.
  cases:
  - id: paired
    roles:
    - compiled
    - active
    - consumer
    operation: attacks
    attacker:
      main_weapon_id: weapon.poisoned-daggers
    expect:
      attacker.main_weapon.paired: true
      result.attacks: 2
    expect_contains:
      attacker.main_weapon.tags:
      - poison.black-lotus
  - id: hit-six-auto-wounds
    roles:
    - active
    - consumer
    - boundary
    operation: wound
    attacker:
      main_weapon_id: weapon.poisoned-daggers
    context:
      hit_roll: 6
    expect:
      context.automatic: false
      result.success: true
      result.critical: false
      context.failure_still_wounds: true
    rolls:
    - key: wound
      value: 1
  - id: ordinary-hit-still-rolls
    roles:
    - inactive
    - boundary
    operation: wound
    attacker:
      main_weapon_id: weapon.poisoned-daggers
    context:
      hit_roll: 5
    rolls:
    - key: wound
      value: 1
    expect:
      context.automatic: false
      result.success: false
  - id: immunity-cancels-poison
    roles:
    - inactive
    - boundary
    operation: wound
    attacker:
      main_weapon_id: weapon.poisoned-daggers
    defender:
      preparation_ids:
      - preparation.tears-of-shallaya
    context:
      hit_roll: 6
    rolls:
    - key: wound
      value: 1
    expect:
      context.automatic: false
      result.success: false
  mutations:
  - id: remove-pair
    path: attacker.main_weapon.paired
    value: false
    cases:
    - paired
  - id: remove-poison
    path: attacker.main_weapon.tags
    value:
    - weapon.poisoned-daggers
    cases:
    - hit-six-auto-wounds
- id: weapon.yari-and-unholy-parry-family
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: local
  sources:
  - target: mechanic/weapon.unholy-sword
    digest: 50b028ce4ad362327f09803c811fa57c4d70797e81643af8f45fff9b15af7796
  - target: mechanic/weapon.yari-one-handed
    digest: a72ce40a1588509fc217ac1dd3cecfe467a8337a7dfbbe6276173423e3c0f7f8
  - target: mechanic/weapon.yari-two-handed
    digest: 57a651a71c43c6401ad79fc94f9b154f04b6b38b7af388dd3cd072ef78ea6505
  interpretation: The three weapons allow one parry. One-handed Unholy Sword and Yari alter neither Strength
    nor priority; the two-handed Yari occupies both hands and strikes first.
  cases:
  - id: unholy-sword-parry
    roles:
    - compiled
    - active
    - consumer
    - boundary
    operation: parry
    defender:
      main_weapon_id: weapon.unholy-sword
    context:
      hit_roll: 4
    rolls:
    - key: test.parry
      value: 5
    expect:
      defender.main_weapon.parry: true
      defender.main_weapon.strength_bonus: 0
      result.blocked: true
  - id: yari-one-parry
    roles:
    - compiled
    - active
    - consumer
    operation: parry
    defender:
      main_weapon_id: weapon.yari-one-handed
    context:
      hit_roll: 4
    rolls:
    - key: test.parry
      value: 5
    expect:
      defender.main_weapon.parry: true
      defender.main_weapon.two_handed: false
      result.blocked: true
  - id: yari-two-first
    roles:
    - compiled
    - active
    - consumer
    - boundary
    operation: acting_order
    attacker:
      main_weapon_id: weapon.yari-two-handed
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 1
        attacks: 1
    defender:
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 6
        attacks: 1
    expect:
      attacker.main_weapon.two_handed: true
      attacker.main_weapon.parry: true
      attacker.main_weapon.priority: 1
      result.first_acts: true
  - id: ordinary-yari-one-uses-initiative
    roles:
    - inactive
    - boundary
    operation: acting_order
    attacker:
      main_weapon_id: weapon.yari-one-handed
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 1
        attacks: 1
    defender:
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 6
        attacks: 1
    expect:
      result.first_acts: false
  mutations:
  - id: remove-unholy-parry
    path: defender.main_weapon.parry
    value: false
    cases:
    - unholy-sword-parry
  - id: remove-yari-one-parry
    path: defender.main_weapon.parry
    value: false
    cases:
    - yari-one-parry
  - id: remove-yari-two-priority
    path: attacker.main_weapon.priority
    value: 0
    cases:
    - yari-two-first
- id: weapon.elite-blade-family
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: stateful
  sources:
  - target: mechanic/weapon.claw-of-the-old-ones
    digest: 9da0ce074654f1f66037bc0950734701a2b5acb1bb8f7101087f3d9d9edbf3b8
  - target: mechanic/weapon.draich
    digest: 93d02fa07220f6da88c98aaa54d9c5bafc6d031b39c22408537fd3ade469c640
  interpretation: 'Claw adds one to Strength, ignores armour and allows parrying. Draich combines two
    hands, Strength +2, strikes last, parry, Concussion and +1 extra to Injury when it produces a critical.
    Draich adds to the separate critical table: 4 becomes Master Strike, rather than a flat additional
    Injury point (M01).'
  cases:
  - id: claw-strength
    roles:
    - compiled
    - active
    - consumer
    operation: strength
    attacker:
      main_weapon_id: weapon.claw-of-the-old-ones
    expect:
      attacker.main_weapon.strength_bonus: 1
      attacker.main_weapon.ignore_armour: true
      attacker.main_weapon.parry: true
      result.wound: 4
  - id: claw-ignores-armour
    roles:
    - active
    - consumer
    - boundary
    operation: armour
    attacker:
      main_weapon_id: weapon.claw-of-the-old-ones
    defender:
      armour_id: armour.gromril-armour
    expect:
      result.eligible: false
      result.saved: false
  - id: claw-parry
    roles:
    - active
    - consumer
    operation: parry
    defender:
      main_weapon_id: weapon.claw-of-the-old-ones
    context:
      hit_roll: 4
    rolls:
    - key: test.parry
      value: 5
    expect:
      result.blocked: true
  - id: draich-compiled-strength
    roles:
    - compiled
    - active
    - consumer
    operation: strength
    attacker:
      main_weapon_id: weapon.draich
    expect:
      attacker.main_weapon.two_handed: true
      attacker.main_weapon.strength_bonus: 2
      attacker.main_weapon.priority: -1
      attacker.main_weapon.parry: true
      attacker.main_weapon.concussion: true
      attacker.main_weapon.critical_injury_bonus: 1
      result.wound: 5
  - id: draich-critical-injury
    roles:
    - active
    - consumer
    - sequence
    - consumption
    - boundary
    operation: attack
    attacker:
      main_weapon_id: weapon.draich
    defender_state:
      wounds: 1
    rolls:
    - key: test.hit
      value: 4
    - key: test.wound
      value: 6
    - key: test.critical
      value: 4
    - key: test.injury.0
      value: 3
    - key: test.injury.1
      value: 1
    expect:
      result.critical: true
      result.defender.condition: OUT
  - id: ordinary-noncritical-draich-concussion
    roles:
    - inactive
    - boundary
    operation: injury
    attacker:
      main_weapon_id: weapon.draich
    rolls:
    - key: test.injury
      value: 2
    expect:
      result.condition: STUNNED
  mutations:
  - id: remove-claw-armour-ignore
    path: attacker.main_weapon.ignore_armour
    value: false
    cases:
    - claw-ignores-armour
  - id: remove-claw-parry
    path: defender.main_weapon.parry
    value: false
    cases:
    - claw-parry
  - id: remove-draich-strength
    path: attacker.main_weapon.strength_bonus
    value: 0
    cases:
    - draich-compiled-strength
  - id: remove-draich-critical-bonus
    path: attacker.main_weapon.critical_injury_bonus
    value: 0
    cases:
    - draich-critical-injury
- id: weapon.injury-and-armour-family
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: contextual
  sources:
  - target: mechanic/weapon.beastlash
    digest: 0494f0f50673c972e1c4b8ad523864f32ffcbce8fbcda6fbc6b03d576ec4af4c
  - target: mechanic/weapon.death-knife
    digest: 565804b4d78df3a6ae3c92741857e0296a731990eb2533a01e730d08d6a4676a
  - target: mechanic/weapon.disease-dagger
    digest: 8159bd99dd11422c05a389741c8140282d9cfe6d21f7d1b6242533da09d04a47
  - target: mechanic/weapon.censer
    digest: fda56f465506c94bab8c26b57f2b58b2365812fae42d88c27b39bc83ca168396
  - target: mechanic/weapon.ball-and-chain
    digest: a2e667a23f059edcf43c505efe168e868d0bd68c25b028d0284468d68582260a
  interpretation: Beastlash uses Strength -1. Death Knife adds +1 Injury and ignores armour at Strength
    -1. Disease Dagger improves the enemy save. Censer gains Strength +2 only in the first round. Ball
    and Chain keeps Strength +2 and ignores armour.
  cases:
  - id: beastlash-strength
    roles:
    - compiled
    - active
    - consumer
    - boundary
    operation: strength
    attacker:
      main_weapon_id: weapon.beastlash
    expect:
      attacker.main_weapon.strength_bonus: -1
      result.wound: 2
      result.armour: 2
  - id: death-knife-strength
    roles:
    - compiled
    - active
    - consumer
    operation: strength
    attacker:
      main_weapon_id: weapon.death-knife
    expect:
      attacker.main_weapon.strength_bonus: -1
      attacker.main_weapon.ignore_armour: true
      attacker.main_weapon.injury_modifier: 1
      result.wound: 2
  - id: death-knife-injury
    roles:
    - active
    - consumer
    - boundary
    operation: injury
    attacker:
      main_weapon_id: weapon.death-knife
    rolls:
    - key: test.injury
      value: 4
    expect:
      result.total: 5
      result.condition: OUT
  - id: death-knife-no-armour
    roles:
    - active
    - boundary
    operation: armour
    attacker:
      main_weapon_id: weapon.death-knife
    defender:
      armour_id: armour.gromril-armour
    expect:
      result.eligible: false
  - id: disease-dagger-six-plus
    roles:
    - compiled
    - active
    - consumer
    - boundary
    operation: armour
    attacker:
      main_weapon_id: weapon.disease-dagger
    rolls:
    - key: armour
      value: 6
    expect:
      attacker.main_weapon.target_armour_bonus: 1
      result.target: 6
      result.saved: true
  - id: censer-first-round
    roles:
    - compiled
    - active
    - consumer
    - boundary
    operation: strength
    attacker:
      main_weapon_id: weapon.censer
    context:
      first_round: true
    expect:
      attacker.main_weapon.two_handed: true
      attacker.main_weapon.first_round_strength_bonus: 2
      result.wound: 5
      result.armour: 5
  - id: censer-later-round
    roles:
    - inactive
    - boundary
    operation: strength
    attacker:
      main_weapon_id: weapon.censer
    context:
      first_round: false
    expect:
      result.wound: 3
      result.armour: 3
  - id: ball-chain-strength
    roles:
    - compiled
    - active
    - consumer
    operation: strength
    attacker:
      main_weapon_id: weapon.ball-and-chain
    expect:
      attacker.main_weapon.two_handed: true
      attacker.main_weapon.strength_bonus: 2
      attacker.main_weapon.ignore_armour: true
      result.wound: 5
  - id: ball-chain-no-armour
    roles:
    - active
    - boundary
    operation: armour
    attacker:
      main_weapon_id: weapon.ball-and-chain
    defender:
      armour_id: armour.gromril-armour
    expect:
      result.eligible: false
  - id: ordinary-weapon-allows-armour
    roles:
    - inactive
    - boundary
    operation: armour
    attacker:
      main_weapon_id: weapon.mace
    defender:
      armour_id: armour.gromril-armour
    rolls:
    - key: armour
      value: 4
    expect:
      result.eligible: true
      result.saved: true
  mutations:
  - id: remove-beastlash-penalty
    path: attacker.main_weapon.strength_bonus
    value: 0
    cases:
    - beastlash-strength
  - id: remove-death-injury
    path: attacker.main_weapon.injury_modifier
    value: 0
    cases:
    - death-knife-injury
  - id: restore-death-armour
    path: attacker.main_weapon.ignore_armour
    value: false
    cases:
    - death-knife-no-armour
  - id: remove-disease-armour-bonus
    path: attacker.main_weapon.target_armour_bonus
    value: 0
    cases:
    - disease-dagger-six-plus
  - id: remove-censer-first-strength
    path: attacker.main_weapon.first_round_strength_bonus
    value: 0
    cases:
    - censer-first-round
  - id: remove-ball-chain-strength
    path: attacker.main_weapon.strength_bonus
    value: 0
    cases:
    - ball-chain-strength
  - id: restore-ball-chain-armour
    path: attacker.main_weapon.ignore_armour
    value: false
    cases:
    - ball-chain-no-armour
