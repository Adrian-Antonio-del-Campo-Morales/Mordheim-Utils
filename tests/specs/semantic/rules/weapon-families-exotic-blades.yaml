schema_version: 1
specifications:
- id: weapon.attack-bonus-family
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: local
  sources:
  - target: mechanic/weapon.bo
    digest: f1f48e5ca341c76816faf57b92f51ae7e05195a4d9213935c12400946c73f66f
  - target: mechanic/weapon.stiletto
    digest: e1720aef9d34001be2a3a5c842662ee4fdc3f3e4d7cce25b211b426bf618a59b
  interpretation: Bo occupies both hands, adds one attack and allows parrying. Stiletto adds one attack
    but all its attacks resolve at Strength -1.
  cases:
  - id: bo-extra-attack
    roles:
    - compiled
    - active
    - consumer
    - boundary
    operation: attacks
    attacker:
      main_weapon_id: weapon.bo
    expect:
      attacker.main_weapon.two_handed: true
      attacker.main_weapon.attacks_bonus: 1
      attacker.main_weapon.parry: true
      result.attacks: 2
  - id: bo-parry
    roles:
    - active
    - consumer
    operation: parry
    defender:
      main_weapon_id: weapon.bo
    context:
      hit_roll: 4
    rolls:
    - key: test.parry
      value: 5
    expect:
      result.blocked: true
  - id: stiletto-extra-attack
    roles:
    - compiled
    - active
    - consumer
    operation: attacks
    attacker:
      main_weapon_id: weapon.stiletto
    expect:
      attacker.main_weapon.attacks_bonus: 1
      attacker.main_weapon.strength_bonus: -1
      result.attacks: 2
  - id: stiletto-strength-penalty
    roles:
    - active
    - consumer
    - boundary
    operation: strength
    attacker:
      main_weapon_id: weapon.stiletto
    expect:
      result.wound: 2
      result.armour: 2
  - id: ordinary-weapon-no-extra-attack
    roles:
    - inactive
    - boundary
    operation: attacks
    attacker:
      main_weapon_id: weapon.mace
    expect:
      result.attacks: 1
  mutations:
  - id: remove-bo-attack
    path: attacker.main_weapon.attacks_bonus
    value: 0
    cases:
    - bo-extra-attack
  - id: remove-bo-parry
    path: defender.main_weapon.parry
    value: false
    cases:
    - bo-parry
  - id: remove-stiletto-attack
    path: attacker.main_weapon.attacks_bonus
    value: 0
    cases:
    - stiletto-extra-attack
  - id: remove-stiletto-penalty
    path: attacker.main_weapon.strength_bonus
    value: 0
    cases:
    - stiletto-strength-penalty
- id: weapon.poisoned-daggers
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: local
  sources:
  - target: mechanic/weapon.poisoned-daggers
    digest: 35423fb88a03966af14ff3aba2ab199b1ec1a775989adedadd07250d8b7ed9a8
  depends_on:
  - mechanic/poison.black-lotus
  interpretation: Poisoned Daggers are used as a paired set and apply the Black Lotus mechanism. Poison
    immunity removes the automatic wound but not the extra attack.
  cases:
  - id: paired
    roles:
    - compiled
    - active
    - consumer
    operation: attacks
    attacker:
      main_weapon_id: weapon.poisoned-daggers
    expect:
      attacker.main_weapon.paired: true
      result.attacks: 2
    expect_contains:
      attacker.main_weapon.tags:
      - poison.black-lotus
  - id: hit-six-auto-wounds
    roles:
    - active
    - consumer
    - boundary
    operation: wound
    attacker:
      main_weapon_id: weapon.poisoned-daggers
    context:
      hit_roll: 6
    expect:
      context.automatic: false
      result.success: true
      result.critical: false
      context.failure_still_wounds: true
    rolls:
    - key: wound
      value: 1
  - id: ordinary-hit-still-rolls
    roles:
    - inactive
    - boundary
    operation: wound
    attacker:
      main_weapon_id: weapon.poisoned-daggers
    context:
      hit_roll: 5
    rolls:
    - key: wound
      value: 1
    expect:
      context.automatic: false
      result.success: false
  - id: immunity-cancels-poison
    roles:
    - inactive
    - boundary
    operation: wound
    attacker:
      main_weapon_id: weapon.poisoned-daggers
    defender:
      preparation_ids:
      - preparation.tears-of-shallaya
    context:
      hit_roll: 6
    rolls:
    - key: wound
      value: 1
    expect:
      context.automatic: false
      result.success: false
  mutations:
  - id: remove-pair
    path: attacker.main_weapon.paired
    value: false
    cases:
    - paired
  - id: remove-poison
    path: attacker.main_weapon.tags
    value:
    - weapon.poisoned-daggers
    cases:
    - hit-six-auto-wounds
- id: weapon.yari-and-unholy-parry-family
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: local
  sources:
  - target: mechanic/weapon.unholy-sword
    digest: a375ad22b51315d30cb761adeea3086d421143f1ba8a0a9e664b4177b36d256e
  - target: mechanic/weapon.yari-one-handed
    digest: 1f3365f5b63c90d758ed5a487aa66f372c684dec4e13f7d995d0bb450c6aecba
  - target: mechanic/weapon.yari-two-handed
    digest: f7a3eeb313bc3f62c577c8442dadd053aa522178d77c89843803261d414dbafa
  interpretation: The three weapons allow one parry. One-handed Unholy Sword and Yari alter neither Strength
    nor priority; the two-handed Yari occupies both hands and strikes first.
  cases:
  - id: unholy-sword-parry
    roles:
    - compiled
    - active
    - consumer
    - boundary
    operation: parry
    defender:
      main_weapon_id: weapon.unholy-sword
    context:
      hit_roll: 4
    rolls:
    - key: test.parry
      value: 5
    expect:
      defender.main_weapon.parry: true
      defender.main_weapon.strength_bonus: 0
      result.blocked: true
  - id: yari-one-parry
    roles:
    - compiled
    - active
    - consumer
    operation: parry
    defender:
      main_weapon_id: weapon.yari-one-handed
    context:
      hit_roll: 4
    rolls:
    - key: test.parry
      value: 5
    expect:
      defender.main_weapon.parry: true
      defender.main_weapon.two_handed: false
      result.blocked: true
  - id: yari-two-first
    roles:
    - compiled
    - active
    - consumer
    - boundary
    operation: acting_order
    attacker:
      main_weapon_id: weapon.yari-two-handed
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 1
        attacks: 1
    defender:
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 6
        attacks: 1
    expect:
      attacker.main_weapon.two_handed: true
      attacker.main_weapon.parry: true
      attacker.main_weapon.priority: 1
      result.first_acts: true
  - id: ordinary-yari-one-uses-initiative
    roles:
    - inactive
    - boundary
    operation: acting_order
    attacker:
      main_weapon_id: weapon.yari-one-handed
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 1
        attacks: 1
    defender:
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 6
        attacks: 1
    expect:
      result.first_acts: false
  mutations:
  - id: remove-unholy-parry
    path: defender.main_weapon.parry
    value: false
    cases:
    - unholy-sword-parry
  - id: remove-yari-one-parry
    path: defender.main_weapon.parry
    value: false
    cases:
    - yari-one-parry
  - id: remove-yari-two-priority
    path: attacker.main_weapon.priority
    value: 0
    cases:
    - yari-two-first
- id: weapon.elite-blade-family
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: stateful
  sources:
  - target: mechanic/weapon.claw-of-the-old-ones
    digest: dca4292d902c8512a858fdc6b0d3041d98d67699f5ebfe0976384962f33a28a7
  - target: mechanic/weapon.draich
    digest: 726aca0cf7d181063f758702e3b4a4b734a52debc4263fe9c6d6803ce5a33d96
  interpretation: 'Claw adds one to Strength, ignores armour and allows parrying. Draich combines two
    hands, Strength +2, strikes last, parry, Concussion and +1 extra to Injury when it produces a critical.
    Draich adds to the separate critical table: 4 becomes Master Strike, rather than a flat additional
    Injury point (M01).'
  cases:
  - id: claw-strength
    roles:
    - compiled
    - active
    - consumer
    operation: strength
    attacker:
      main_weapon_id: weapon.claw-of-the-old-ones
    expect:
      attacker.main_weapon.strength_bonus: 1
      attacker.main_weapon.ignore_armour: true
      attacker.main_weapon.parry: true
      result.wound: 4
  - id: claw-ignores-armour
    roles:
    - active
    - consumer
    - boundary
    operation: armour
    attacker:
      main_weapon_id: weapon.claw-of-the-old-ones
    defender:
      armour_id: armour.gromril-armour
    expect:
      result.eligible: false
      result.saved: false
  - id: claw-parry
    roles:
    - active
    - consumer
    operation: parry
    defender:
      main_weapon_id: weapon.claw-of-the-old-ones
    context:
      hit_roll: 4
    rolls:
    - key: test.parry
      value: 5
    expect:
      result.blocked: true
  - id: draich-compiled-strength
    roles:
    - compiled
    - active
    - consumer
    operation: strength
    attacker:
      main_weapon_id: weapon.draich
    expect:
      attacker.main_weapon.two_handed: true
      attacker.main_weapon.strength_bonus: 2
      attacker.main_weapon.priority: -1
      attacker.main_weapon.parry: true
      attacker.main_weapon.concussion: true
      attacker.main_weapon.critical_injury_bonus: 1
      result.wound: 5
  - id: draich-critical-injury
    roles:
    - active
    - consumer
    - sequence
    - consumption
    - boundary
    operation: attack
    attacker:
      main_weapon_id: weapon.draich
    defender_state:
      wounds: 1
    rolls:
    - key: test.hit
      value: 4
    - key: test.wound
      value: 6
    - key: test.critical
      value: 4
    - key: test.injury.0
      value: 3
    - key: test.injury.1
      value: 1
    expect:
      result.critical: true
      result.defender.condition: OUT
  - id: ordinary-noncritical-draich-concussion
    roles:
    - inactive
    - boundary
    operation: injury
    attacker:
      main_weapon_id: weapon.draich
    rolls:
    - key: test.injury
      value: 2
    expect:
      result.condition: STUNNED
  mutations:
  - id: remove-claw-armour-ignore
    path: attacker.main_weapon.ignore_armour
    value: false
    cases:
    - claw-ignores-armour
  - id: remove-claw-parry
    path: defender.main_weapon.parry
    value: false
    cases:
    - claw-parry
  - id: remove-draich-strength
    path: attacker.main_weapon.strength_bonus
    value: 0
    cases:
    - draich-compiled-strength
  - id: remove-draich-critical-bonus
    path: attacker.main_weapon.critical_injury_bonus
    value: 0
    cases:
    - draich-critical-injury
- id: weapon.injury-and-armour-family
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: contextual
  sources:
  - target: mechanic/weapon.beastlash
    digest: 9aae4dbda45246ddb8e49c13d78abf1cb31cd990076807225c5d13353036d067
  - target: mechanic/weapon.death-knife
    digest: 1b6c81949e01c1d6fdbcf10257e94c327420609c5e4139a43f8ae50e54617187
  - target: mechanic/weapon.disease-dagger
    digest: 43a1c08932ff8f7226a8c62a04e887ed0775496d6ccf1331f72d40426adc04e8
  - target: mechanic/weapon.censer
    digest: a8896d4137ea524525ba0b6fdfe79ff46adc14440b804a5f78f9ff0d38b97a32
  - target: mechanic/weapon.ball-and-chain
    digest: 5362ab5501d6b284c91e4352ff399f1efba124f951bbddc0941fcec8582b19c8
  interpretation: Beastlash uses Strength -1. Death Knife adds +1 Injury and ignores armour at Strength
    -1. Disease Dagger improves the enemy save. Censer gains Strength +2 only in the first round. Ball
    and Chain keeps Strength +2 and ignores armour.
  cases:
  - id: beastlash-strength
    roles:
    - compiled
    - active
    - consumer
    - boundary
    operation: strength
    attacker:
      main_weapon_id: weapon.beastlash
    expect:
      attacker.main_weapon.strength_bonus: -1
      result.wound: 2
      result.armour: 2
  - id: death-knife-strength
    roles:
    - compiled
    - active
    - consumer
    operation: strength
    attacker:
      main_weapon_id: weapon.death-knife
    expect:
      attacker.main_weapon.strength_bonus: -1
      attacker.main_weapon.ignore_armour: true
      attacker.main_weapon.injury_modifier: 1
      result.wound: 2
  - id: death-knife-injury
    roles:
    - active
    - consumer
    - boundary
    operation: injury
    attacker:
      main_weapon_id: weapon.death-knife
    rolls:
    - key: test.injury
      value: 4
    expect:
      result.total: 5
      result.condition: OUT
  - id: death-knife-no-armour
    roles:
    - active
    - boundary
    operation: armour
    attacker:
      main_weapon_id: weapon.death-knife
    defender:
      armour_id: armour.gromril-armour
    expect:
      result.eligible: false
  - id: disease-dagger-six-plus
    roles:
    - compiled
    - active
    - consumer
    - boundary
    operation: armour
    attacker:
      main_weapon_id: weapon.disease-dagger
    rolls:
    - key: armour
      value: 6
    expect:
      attacker.main_weapon.target_armour_bonus: 1
      result.target: 6
      result.saved: true
  - id: censer-first-round
    roles:
    - compiled
    - active
    - consumer
    - boundary
    operation: strength
    attacker:
      main_weapon_id: weapon.censer
    context:
      first_round: true
    expect:
      attacker.main_weapon.two_handed: true
      attacker.main_weapon.first_round_strength_bonus: 2
      result.wound: 5
      result.armour: 5
  - id: censer-later-round
    roles:
    - inactive
    - boundary
    operation: strength
    attacker:
      main_weapon_id: weapon.censer
    context:
      first_round: false
    expect:
      result.wound: 3
      result.armour: 3
  - id: ball-chain-strength
    roles:
    - compiled
    - active
    - consumer
    operation: strength
    attacker:
      main_weapon_id: weapon.ball-and-chain
    expect:
      attacker.main_weapon.two_handed: true
      attacker.main_weapon.strength_bonus: 2
      attacker.main_weapon.ignore_armour: true
      result.wound: 5
  - id: ball-chain-no-armour
    roles:
    - active
    - boundary
    operation: armour
    attacker:
      main_weapon_id: weapon.ball-and-chain
    defender:
      armour_id: armour.gromril-armour
    expect:
      result.eligible: false
  - id: ordinary-weapon-allows-armour
    roles:
    - inactive
    - boundary
    operation: armour
    attacker:
      main_weapon_id: weapon.mace
    defender:
      armour_id: armour.gromril-armour
    rolls:
    - key: armour
      value: 4
    expect:
      result.eligible: true
      result.saved: true
  mutations:
  - id: remove-beastlash-penalty
    path: attacker.main_weapon.strength_bonus
    value: 0
    cases:
    - beastlash-strength
  - id: remove-death-injury
    path: attacker.main_weapon.injury_modifier
    value: 0
    cases:
    - death-knife-injury
  - id: restore-death-armour
    path: attacker.main_weapon.ignore_armour
    value: false
    cases:
    - death-knife-no-armour
  - id: remove-disease-armour-bonus
    path: attacker.main_weapon.target_armour_bonus
    value: 0
    cases:
    - disease-dagger-six-plus
  - id: remove-censer-first-strength
    path: attacker.main_weapon.first_round_strength_bonus
    value: 0
    cases:
    - censer-first-round
  - id: remove-ball-chain-strength
    path: attacker.main_weapon.strength_bonus
    value: 0
    cases:
    - ball-chain-strength
  - id: restore-ball-chain-armour
    path: attacker.main_weapon.ignore_armour
    value: false
    cases:
    - ball-chain-no-armour
