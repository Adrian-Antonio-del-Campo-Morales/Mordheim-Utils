  - id: not-selected
    roles: [inactive]
    operation: pool
    attacker: {collection: trollheim, band_id: lustria-savage-goblins, profile_id: big-boss, main_weapon_id: weapon.mace}
    defender: {main_weapon_id: weapon.sword}
    context: {count: 1}
    rolls: [{key: test.attack.0.hit, value: 4}, {key: test.attack.0.parry, value: 4}, {key: test.attack.0.wound, value: 1}]
    expect: {result.defender.parries_remaining: 0}
  mutations:
  - {id: omit-selected-skill, path: attacker.global_effects.tags, value: [], cases: [selected]}
- id: web-of-steel-critical-injury
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: local
  sources:
  - {target: mechanic/skill.web-of-steel, digest: 67f2804e617e539e1567fa6252f5b9d0f36b7456b75b6b0d489a6e31b8969f43}
  interpretation: >-
    Web of Steel adds +1 to the Critical Injuries table in combat. The engine represents that table
    through the accumulated Injury modifier: a critical already contributes +2 and Web of Steel
    contributes the third point. With an Injury roll of 1, the total 4 stuns; without the skill the
    total 3 knocks down. A non-critical wound does not receive the bonus.
  cases:
  - id: compiled
    roles: [compiled]
    operation: compile
    attacker: {skill_ids: [skill.web-of-steel]}
    expect: {attacker.fighter_id: 'custom:custom'}
    expect_contains: {attacker.global_effects.tags: [skill.web-of-steel]}
  - id: critical-adds-one
    roles: [active, consumer, boundary]
    operation: attack
    attacker: {main_weapon_id: weapon.sword, skill_ids: [skill.web-of-steel]}
    defender: {characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 3, attacks: 1}}
    rolls: [{key: test.hit, value: 4}, {key: test.wound, value: 6}, {key: test.injury.0, value: 2}]
    expect: {result.critical: true, result.defender.condition: OUT}
  - id: without-skill
    roles: [inactive, boundary]
    operation: attack
    attacker: {main_weapon_id: weapon.sword}
    defender: {characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 3, attacks: 1}}
    rolls: [{key: test.hit, value: 4}, {key: test.wound, value: 6}, {key: test.injury.0, value: 2}]
    expect: {result.critical: true, result.defender.condition: STUNNED}
  - id: non-critical-does-not-add
    roles: [inactive, boundary]
    operation: attack
    attacker: {main_weapon_id: weapon.sword, skill_ids: [skill.web-of-steel]}
    defender: {characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 3, attacks: 1}}
    rolls: [{key: test.hit, value: 4}, {key: test.wound, value: 5}, {key: test.injury.0, value: 2}]
    expect: {result.critical: false, result.defender.condition: KNOCKED_DOWN}
  mutations:
  - {id: omit-critical-table-bonus, path: attacker.global_effects.tags, value: [], cases: [critical-adds-one]}
