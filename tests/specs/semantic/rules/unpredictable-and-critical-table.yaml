- id: web-of-steel-critical-injury
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: local
  sources:
  - target: mechanic/skill.web-of-steel
    digest: 7fa88fb115d4fb43e088ce335e649b1e7ad5be07b42d3c31b2ffba8abc488064
  interpretation: Web of Steel adds one to the basic critical result. A table roll 4 becomes Master Strike
    (5), causing two wounds with +2 Injury; without the skill it has no Injury bonus. The historical flat
    +3 Injury interpretation is superseded by the source review M01.
  cases:
  - id: compiled
    roles:
    - compiled
    operation: compile
    attacker:
      skill_ids:
      - skill.web-of-steel
    expect:
      attacker.fighter_id: custom:custom
    expect_contains:
      attacker.global_effects.tags:
      - skill.web-of-steel
  - id: critical-adds-one
    roles:
    - active
    - consumer
    - boundary
    operation: attack
    attacker:
      main_weapon_id: weapon.sword
      skill_ids:
      - skill.web-of-steel
    defender:
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 1
        initiative: 3
        attacks: 1
    rolls:
    - key: test.hit
      value: 4
    - key: test.wound
      value: 6
    - key: test.critical
      value: 4
    - key: test.injury.0
      value: 3
    - key: test.injury.1
      value: 1
    expect:
      result.critical: true
      result.defender.condition: OUT
  - id: without-skill
    roles:
    - inactive
    - boundary
    operation: attack
    attacker:
      main_weapon_id: weapon.sword
    defender:
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 1
        initiative: 3
        attacks: 1
    rolls:
    - key: test.hit
      value: 4
    - key: test.wound
      value: 6
    - key: test.critical
      value: 4
    - key: test.injury.0
      value: 3
    - key: test.injury.1
      value: 1
    expect:
      result.critical: true
      result.defender.condition: STUNNED
  - id: non-critical-does-not-add
    roles:
    - inactive
    - boundary
    operation: attack
    attacker:
      main_weapon_id: weapon.sword
      skill_ids:
      - skill.web-of-steel
    defender:
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 1
        initiative: 3
        attacks: 1
    rolls:
    - key: test.hit
      value: 4
    - key: test.wound
      value: 5
    - key: test.injury.0
      value: 2
    expect:
      result.critical: false
      result.defender.condition: KNOCKED_DOWN
  mutations:
  - id: omit-critical-table-bonus
    path: attacker.global_effects.tags
    value: []
    cases:
    - critical-adds-one
