schema_version: 1
specifications:
- id: unpredictable-attack-one-per-phase
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: stateful
  sources:
  - {target: mechanic/mechanic.unpredictable-attack, digest: 9db950a6bc077f3d96bf67d54b23296e1ebc711e8915c21ffd2f5ac615789061}
  interpretation: >-
    La convención canónica permite que un único ataque por fase no pueda ser
    parado. Con dos ataques, el primero del pool recibe la declaración y el
    segundo conserva la resolución ordinaria. La capacidad de parada no se
    consume al omitir el ataque impredecible; sí se consume al intentar parar
    el siguiente. Con un solo ataque se aplica a ese ataque.
  cases:
  - id: compiled
    roles: [compiled]
    operation: compile
    attacker: {skill_ids: [mechanic.unpredictable-attack]}
    expect: {attacker.fighter_id: 'custom:custom'}
    expect_contains: {attacker.global_effects.tags: [mechanic.unpredictable-attack]}
  - id: one-unparryable-second-parried
    roles: [active, consumer, sequence, consumption, boundary]
    operation: pool
    attacker: {skill_ids: [mechanic.unpredictable-attack], main_weapon_id: weapon.mace}
    defender: {main_weapon_id: weapon.sword, off_hand_id: weapon.sword, skill_ids: [skill.unbeatable-warrior]}
    context: {count: 2}
    rolls:
    - {key: test.attack.0.hit, value: 4}
    - {key: test.attack.1.hit, value: 5}
    - {key: test.attack.1.parry, value: 5}
    - {key: test.attack.0.wound, value: 1}
    expect:
      result.attacks.0.parried: false
      result.attacks.0.wounded: false
      result.attacks.1.parried: true
      result.defender.parries_remaining: 1
  - id: single-attack-omits-parry
    roles: [active, boundary]
    operation: pool
    attacker: {skill_ids: [mechanic.unpredictable-attack], main_weapon_id: weapon.mace}
    defender: {main_weapon_id: weapon.sword}
    context: {count: 1}
    rolls: [{key: test.attack.0.hit, value: 4}, {key: test.attack.0.wound, value: 1}]
    expect: {result.attacks.0.parried: false, result.defender.parries_remaining: 1}
  - id: without-rule-parry-is-attempted
    roles: [inactive, boundary]
    operation: pool
    attacker: {main_weapon_id: weapon.mace}
    defender: {main_weapon_id: weapon.sword}
    context: {count: 1}
    rolls: [{key: test.attack.0.hit, value: 4}, {key: test.attack.0.parry, value: 4}, {key: test.attack.0.wound, value: 1}]
    expect: {result.attacks.0.parried: false, result.defender.parries_remaining: 0}
  mutations:
  - id: remove-unpredictable-declaration
    path: attacker.global_effects.tags
    value: []
    cases: [one-unparryable-second-parried, single-attack-omits-parry]
- id: hobgoblin-sneaky-unpredictable
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: stateful
  sources:
  - {target: rule/trollheim/khemri-hobgoblin-raiders/sneaky--unpredictable/mechanic.unpredictable-attack, digest: 062303fd273859da1a71b84dd3282e6c5e7a13057093ef2212b3cfcb372e4ba9}
  depends_on: [mechanic/mechanic.unpredictable-attack]
  interpretation: >-
    Khemri p.80 / Sneaky / Unpredictable concede automáticamente el mecanismo
    al perfil Sneaky. La prueba ejecuta un ataque real del perfil y contrasta
    otro perfil de la banda sin la regla.
  cases:
  - id: recipients
    roles: [grant, compiled]
    operation: grant
    defender: {collection: trollheim, band_id: khemri-hobgoblin-raiders, profile_id: sneaky}
    context: {rule_id: sneaky--unpredictable}
    expect: {result.recipients: [sneaky]}
  - id: active
    roles: [active, consumer, sequence, consumption, boundary]
    operation: pool
    attacker: {collection: trollheim, band_id: khemri-hobgoblin-raiders, profile_id: sneaky, main_weapon_id: weapon.mace}
    defender: {main_weapon_id: weapon.sword}
    context: {count: 1}
    rolls: [{key: test.attack.0.hit, value: 4}, {key: test.attack.0.wound, value: 1}]
    expect: {result.attacks.0.parried: false, result.defender.parries_remaining: 1}
  - id: profile-control
    roles: [inactive]
    operation: pool
    attacker: {collection: trollheim, band_id: khemri-hobgoblin-raiders, profile_id: khann, main_weapon_id: weapon.mace}
    defender: {main_weapon_id: weapon.sword}
    context: {count: 1}
    rolls: [{key: test.attack.0.hit, value: 4}, {key: test.attack.0.parry, value: 4}, {key: test.attack.0.wound, value: 1}]
    expect: {result.defender.parries_remaining: 0}
  mutations:
  - {id: omit-profile-grant, path: attacker.global_effects.tags, value: [], cases: [active]}
- id: hobgoblin-special-skill-unpredictable
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: stateful
  sources:
  - {target: rule/trollheim/khemri-hobgoblin-raiders/band--hobgoblin-special-skills-unpredictable/mechanic.unpredictable-attack, digest: 659650cc976d5caf96c0b726306b207420c8a99ee3b0e19963580e380c24137f}
  depends_on: [mechanic/mechanic.unpredictable-attack]
  interpretation: >-
    Khemri p.79 / Hobgoblin Special Skills / Unpredictable está disponible
    exactamente para Khann, Hobgoblin Shaman, Scouts y Sneaky. Una vez elegida,
    un ataque evita la parada; sin elegirla el mismo ataque consume la parada.
  cases:
  - id: recipients
    roles: [grant, compiled]
    operation: selectable_grant
    defender: {collection: trollheim, band_id: khemri-hobgoblin-raiders, profile_id: khann}
    context: {rule_id: band--hobgoblin-special-skills-unpredictable}
    expect: {result.recipients: [hobgoblin-shaman, khann, scouts, sneaky]}
  - id: selected
    roles: [active, consumer, sequence, consumption, boundary]
    operation: pool
    attacker: {collection: trollheim, band_id: khemri-hobgoblin-raiders, profile_id: khann, main_weapon_id: weapon.mace, special_rule_ids: [band--hobgoblin-special-skills-unpredictable]}
    defender: {main_weapon_id: weapon.sword}
    context: {count: 1}
    rolls: [{key: test.attack.0.hit, value: 4}, {key: test.attack.0.wound, value: 1}]
    expect: {result.defender.parries_remaining: 1}
  - id: not-selected
    roles: [inactive]
    operation: pool
    attacker: {collection: trollheim, band_id: khemri-hobgoblin-raiders, profile_id: khann, main_weapon_id: weapon.mace}
    defender: {main_weapon_id: weapon.sword}
    context: {count: 1}
    rolls: [{key: test.attack.0.hit, value: 4}, {key: test.attack.0.parry, value: 4}, {key: test.attack.0.wound, value: 1}]
    expect: {result.defender.parries_remaining: 0}
  mutations:
  - {id: omit-selected-skill, path: attacker.global_effects.tags, value: [], cases: [selected]}
