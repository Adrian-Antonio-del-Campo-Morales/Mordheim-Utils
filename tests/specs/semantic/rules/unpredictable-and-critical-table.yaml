schema_version: 1
specifications:
- id: unpredictable-attack-one-per-phase
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: stateful
  sources:
  - target: mechanic/mechanic.unpredictable-attack
    digest: 93278ae4f8c04bac011115c9d3b31d3aa7561b071dd8b2710272af35ff3e236d
  interpretation: The canonical convention allows a single attack per phase to be unparriable. With two
    attacks, the first of the pool receives the declaration and the second keeps the ordinary resolution.
    The parry capability is not consumed by skipping the unpredictable attack; it is consumed when attempting
    to parry the next one. With a single attack it applies to that attack.
  cases:
  - id: compiled
    roles:
    - compiled
    operation: compile
    attacker:
      skill_ids:
      - mechanic.unpredictable-attack
    expect:
      attacker.fighter_id: custom:custom
    expect_contains:
      attacker.global_effects.tags:
      - mechanic.unpredictable-attack
  - id: one-unparryable-second-parried
    roles:
    - active
    - consumer
    - sequence
    - consumption
    - boundary
    operation: pool
    attacker:
      skill_ids:
      - mechanic.unpredictable-attack
      main_weapon_id: weapon.mace
    defender:
      main_weapon_id: weapon.sword
      off_hand_id: weapon.sword
      skill_ids:
      - skill.unbeatable-warrior
    context:
      count: 2
    rolls:
    - key: test.attack.0.hit
      value: 4
    - key: test.attack.1.hit
      value: 5
    - key: test.attack.1.parry
      value: 5
    - key: test.attack.0.wound
      value: 1
    expect:
      result.attacks.0.parried: false
      result.attacks.0.wounded: false
      result.attacks.1.parried: true
      result.defender.parries_remaining: 1
  - id: single-attack-omits-parry
    roles:
    - active
    - boundary
    operation: pool
    attacker:
      skill_ids:
      - mechanic.unpredictable-attack
      main_weapon_id: weapon.mace
    defender:
      main_weapon_id: weapon.sword
    context:
      count: 1
    rolls:
    - key: test.attack.0.hit
      value: 4
    - key: test.attack.0.wound
      value: 1
    expect:
      result.attacks.0.parried: false
      result.defender.parries_remaining: 1
  - id: without-rule-parry-is-attempted
    roles:
    - inactive
    - boundary
    operation: pool
    attacker:
      main_weapon_id: weapon.mace
    defender:
      main_weapon_id: weapon.sword
    context:
      count: 1
    rolls:
    - key: test.attack.0.hit
      value: 4
    - key: test.attack.0.parry
      value: 4
    - key: test.attack.0.wound
      value: 1
    expect:
      result.attacks.0.parried: false
      result.defender.parries_remaining: 0
  mutations:
  - id: remove-unpredictable-declaration
    path: attacker.global_effects.tags
    value: []
    cases:
    - one-unparryable-second-parried
    - single-attack-omits-parry
- id: hobgoblin-sneaky-unpredictable
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: stateful
  sources:
  - target: rule/trollheim/khemri-hobgoblin-raiders/sneaky--unpredictable/mechanic.unpredictable-attack
    digest: 058ccfb49a42e51708dbc8362d2f10ebae0ebceaac07b9f76c35b0c20dd7723e
  depends_on:
  - mechanic/mechanic.unpredictable-attack
  interpretation: Khemri p.80 / Sneaky / Unpredictable grants the mechanism to the Sneaky profile automatically.
    The test runs a real attack of the profile and contrasts another band profile without the rule.
  cases:
  - id: recipients
    roles:
    - grant
    - compiled
    operation: grant
    defender:
      collection: trollheim
      band_id: khemri-hobgoblin-raiders
      profile_id: sneaky
    context:
      rule_id: sneaky--unpredictable
    expect:
      result.recipients:
      - sneaky
  - id: active
    roles:
    - active
    - consumer
    - sequence
    - consumption
    - boundary
    operation: pool
    attacker:
      collection: trollheim
      band_id: khemri-hobgoblin-raiders
      profile_id: sneaky
      main_weapon_id: weapon.mace
    defender:
      main_weapon_id: weapon.sword
    context:
      count: 1
    rolls:
    - key: test.attack.0.hit
      value: 4
    - key: test.attack.0.wound
      value: 1
    expect:
      result.attacks.0.parried: false
      result.defender.parries_remaining: 1
  - id: profile-control
    roles:
    - inactive
    operation: pool
    attacker:
      collection: trollheim
      band_id: khemri-hobgoblin-raiders
      profile_id: khann
      main_weapon_id: weapon.mace
    defender:
      main_weapon_id: weapon.sword
    context:
      count: 1
    rolls:
    - key: test.attack.0.hit
      value: 4
    - key: test.attack.0.parry
      value: 4
    - key: test.attack.0.wound
      value: 1
    expect:
      result.defender.parries_remaining: 0
  mutations:
  - id: omit-profile-grant
    path: attacker.global_effects.tags
    value: []
    cases:
    - active
- id: hobgoblin-special-skill-unpredictable
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: stateful
  sources:
  - target: rule/trollheim/khemri-hobgoblin-raiders/band--hobgoblin-special-skills-unpredictable/mechanic.unpredictable-attack
    digest: 7103bc1ed64a9f3512835c8f561220d7e0f694e2b07cd3f203d03582e41c7b1a
  depends_on:
  - mechanic/mechanic.unpredictable-attack
  interpretation: Khemri p.79 / Hobgoblin Special Skills / Unpredictable is available exactly to Khann,
    Hobgoblin Shaman, Scouts and Sneaky. Once chosen, an attack avoids the parry; without choosing it,
    the same attack consumes the parry.
  cases:
  - id: recipients
    roles:
    - grant
    - compiled
    operation: selectable_grant
    defender:
      collection: trollheim
      band_id: khemri-hobgoblin-raiders
      profile_id: khann
    context:
      rule_id: band--hobgoblin-special-skills-unpredictable
    expect:
      result.recipients:
      - hobgoblin-shaman
      - khann
      - scouts
      - sneaky
  - id: selected
    roles:
    - active
    - consumer
    - sequence
    - consumption
    - boundary
    operation: pool
    attacker:
      collection: trollheim
      band_id: khemri-hobgoblin-raiders
      profile_id: khann
      main_weapon_id: weapon.mace
      special_rule_ids:
      - band--hobgoblin-special-skills-unpredictable
    defender:
      main_weapon_id: weapon.sword
    context:
      count: 1
    rolls:
    - key: test.attack.0.hit
      value: 4
    - key: test.attack.0.wound
      value: 1
    expect:
      result.defender.parries_remaining: 1
  - id: not-selected
    roles:
    - inactive
    operation: pool
    attacker:
      collection: trollheim
      band_id: khemri-hobgoblin-raiders
      profile_id: khann
      main_weapon_id: weapon.mace
    defender:
      main_weapon_id: weapon.sword
    context:
      count: 1
    rolls:
    - key: test.attack.0.hit
      value: 4
    - key: test.attack.0.parry
      value: 4
    - key: test.attack.0.wound
      value: 1
    expect:
      result.defender.parries_remaining: 0
  mutations:
  - id: omit-selected-skill
    path: attacker.global_effects.tags
    value: []
    cases:
    - selected
