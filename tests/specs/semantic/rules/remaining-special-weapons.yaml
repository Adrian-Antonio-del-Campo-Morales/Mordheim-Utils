schema_version: 1
specifications:
- id: serpent-whip
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: local
  sources:
  - target: mechanic/weapon.serpent-whip
    digest: e3b8045e832c183750b33dec3bf4eba41722635c618b21930196618b780f9e5e
  interpretation: The Serpent Whip cannot be parried, carries Black Lotus and adds exactly one strike-first
    attack in the first round when either combatant has charged.
  cases:
  - id: compiled
    roles:
    - compiled
    operation: compile
    attacker:
      main_weapon_id: weapon.serpent-whip
    expect:
      attacker.main_weapon.cannot_be_parried: true
      attacker.main_weapon.priority: 1
    expect_contains:
      attacker.main_weapon.tags:
      - weapon.serpent-whip
      - poison.black-lotus
  - id: charged-extra-attack
    roles:
    - active
    - consumer
    - boundary
    operation: weapon_attack_count
    attacker:
      main_weapon_id: weapon.serpent-whip
    context:
      first_round: true
      charged: true
    expect:
      result.attacks: 2
  - id: later-round
    roles:
    - inactive
    operation: weapon_attack_count
    attacker:
      main_weapon_id: weapon.serpent-whip
    context:
      first_round: false
      charged: true
    expect:
      result.attacks: 1
  - id: lotus-six-auto-wounds
    roles:
    - consumer
    - boundary
    operation: wound
    attacker:
      main_weapon_id: weapon.serpent-whip
    context:
      hit_roll: 6
    expect:
      result.success: true
      result.roll: 1
      context.failure_still_wounds: true
    rolls:
    - key: wound
      value: 1
  mutations:
  - id: remove-whip-tag
    path: attacker.main_weapon.tags
    value: []
    cases:
    - charged-extra-attack
    - lotus-six-auto-wounds
- id: boar-spear
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: contextual
  sources:
  - target: mechanic/weapon.boar-spear
    digest: fb1968f448c3370f4c428f3e59636f25dda09666935f1d179a0e29545d94ecfa
  interpretation: Boar Spear has strike-first, adds one to Strength when charging mounted and removes
    one attack, down to a minimum of one, from the enemy charging against its bearer.
  cases:
  - id: compiled
    roles:
    - compiled
    operation: compile
    attacker:
      main_weapon_id: weapon.boar-spear
      off_hand_id: defence.shield
    expect:
      attacker.main_weapon.priority: 1
      attacker.main_weapon.charge_strength_bonus: 1
  - id: mounted-charge
    roles:
    - active
    - consumer
    operation: strength
    attacker:
      main_weapon_id: weapon.boar-spear
      off_hand_id: defence.shield
      mounted: true
    context:
      first_round: true
      charging: true
    expect:
      result.wound: 4
      result.armour: 4
  - id: unmounted-charge
    roles:
    - inactive
    - boundary
    operation: strength
    attacker:
      main_weapon_id: weapon.boar-spear
      off_hand_id: defence.shield
    context:
      first_round: true
      charging: true
    expect:
      result.wound: 3
      result.armour: 3
  - id: charging-enemy-loses-one
    roles:
    - active
    - consumer
    - boundary
    operation: weapon_attack_count
    attacker:
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 2
        initiative: 3
        attacks: 3
    defender:
      main_weapon_id: weapon.boar-spear
      off_hand_id: defence.shield
    context:
      first_round: true
      charging: true
    expect:
      result.attacks: 2
  - id: minimum-one
    roles:
    - boundary
    operation: weapon_attack_count
    defender:
      main_weapon_id: weapon.boar-spear
      off_hand_id: defence.shield
    context:
      first_round: true
      charging: true
    expect:
      result.attacks: 1
  mutations:
  - id: remove-boar-effects
    changes:
    - path: attacker.main_weapon.charge_strength_bonus
      value: 0
    cases:
    - mounted-charge
- id: head-splitter-mushrooms
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: permanent
  sources:
  - target: mechanic/preparation.head-splitter-mushrooms
    digest: b2f6e72f5154de99a721d50fee76adb1b5f38aff961d0cf6723b14cf532c4367
  interpretation: Head-splitter Mushrooms grants Frenzy and doubles the base attacks; the editorial authorisation
    of Ball and Chain is validated in construction.
  cases:
  - id: compiled
    roles:
    - compiled
    operation: compile
    attacker:
      preparation_ids:
      - preparation.head-splitter-mushrooms
    expect:
      attacker.global_effects.frenzy: true
  - id: frenzy-consumed
    roles:
    - consumer
    - boundary
    operation: attacks
    attacker:
      preparation_ids:
      - preparation.head-splitter-mushrooms
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 2
        initiative: 3
        attacks: 2
    expect:
      result.attacks: 4
  mutations:
  - id: remove-frenzy
    path: attacker.global_effects.frenzy
    value: false
    cases:
    - frenzy-consumed
