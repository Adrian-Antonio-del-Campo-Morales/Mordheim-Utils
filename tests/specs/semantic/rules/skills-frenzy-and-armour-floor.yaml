schema_version: 1
specifications:
- id: preparation-mad-cap-mushrooms
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: stateful
  sources:
  - target: mechanic/preparation.mad-cap-mushrooms
    digest: 33c771360ee958b33118640ffe23206f18175da736ef6d5a94ab9b1dd94851f7
  interpretation: Mad Cap Mushrooms activates Frenzy, doubles the profile's attacks and loses it upon
    becoming Knocked Down or Stunned.
  cases:
  - id: compiled
    roles:
    - compiled
    operation: compile
    attacker:
      main_weapon_id: weapon.mace
      preparation_ids:
      - preparation.mad-cap-mushrooms
    expect:
      attacker.global_effects.frenzy: true
  - id: doubles-profile-attacks
    roles:
    - active
    - sequence
    - consumption
    - boundary
    operation: attacks
    attacker:
      main_weapon_id: weapon.mace
      preparation_ids:
      - preparation.mad-cap-mushrooms
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 3
        attacks: 2
    expect:
      result.attacks: 4
  - id: knocked-down-loses-frenzy
    roles:
    - active
    - sequence
    - consumption
    - boundary
    operation: attack
    attacker:
      main_weapon_id: weapon.mace
    defender:
      main_weapon_id: weapon.mace
      preparation_ids:
      - preparation.mad-cap-mushrooms
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 1
        initiative: 3
        attacks: 1
    rolls:
    - key: test.hit
      value: 4
    - key: test.wound
      value: 4
    - key: test.injury.0
      value: 1
    expect:
      result.defender.condition: KNOCKED_DOWN
      result.defender.frenzy: false
  - id: absent
    roles:
    - inactive
    operation: attacks
    attacker:
      main_weapon_id: weapon.mace
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 3
        attacks: 2
    expect:
      result.attacks: 2
  mutations:
  - id: remove-frenzy
    path: attacker.global_effects.frenzy
    value: false
    cases:
    - doubles-profile-attacks
- id: skill-luck
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: stateful
  sources:
  - target: mechanic/skill.luck
    digest: 76fd77d2cb2e37d310fcd7cae1c3167a1eb0c0f5add207470432c0c299573ac3
  interpretation: Luck re-rolls the first failed roll of its own, including an armour save, and consumes
    the resource for the rest of the duel.
  cases:
  - id: compiled
    roles:
    - compiled
    operation: compile
    attacker:
      main_weapon_id: weapon.mace
      skill_ids:
      - skill.luck
    expect_contains:
      attacker.global_effects.tags:
      - skill.luck
    expect:
      attacker.global_effects.strength_bonus: 0
  - id: failed-hit-rerolled
    roles:
    - active
    - sequence
    - consumption
    - boundary
    operation: attack
    attacker:
      main_weapon_id: weapon.mace
      skill_ids:
      - skill.luck
    context:
      hit_only: true
    rolls:
    - key: test.hit
      value: 1
    - key: test.hit.reroll
      value: 4
    expect:
      result.hit: true
      result.attacker.resources_spent:
      - luck
  - id: failed-armour-save-rerolled
    roles:
    - active
    - sequence
    - consumption
    - boundary
    operation: attack
    attacker:
      main_weapon_id: weapon.mace
    defender:
      armour_id: armour.light-armour
      skill_ids:
      - skill.luck
    rolls:
    - key: test.hit
      value: 4
    - key: test.wound
      value: 4
    - key: test.armour
      value: 1
    - key: test.armour.reroll
      value: 6
    expect:
      result.saved: true
      result.defender.resources_spent:
      - luck
  - id: already-consumed
    roles:
    - inactive
    - boundary
    operation: attack
    attacker:
      main_weapon_id: weapon.mace
      skill_ids:
      - skill.luck
    attacker_state:
      resources_spent:
      - luck
    context:
      hit_only: true
    rolls:
    - key: test.hit
      value: 1
    expect:
      result.hit: false
      result.attacker.resources_spent:
      - luck
  mutations:
  - id: remove-luck
    path: attacker.global_effects.tags
    value: []
    cases:
    - failed-hit-rerolled
  - id: remove-luck-from-defender
    path: defender.global_effects.tags
    value: []
    cases:
    - failed-armour-save-rerolled
- id: skill-sweep
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: contextual
  sources:
  - target: mechanic/skill.sweep
    digest: a33f172e4df5bae019714588e7cc765424c6402287ded23900363d959a7cda9c
  interpretation: Sweep with a two-handed weapon replaces the attack set with one and produces an automatic
    hit only when the opponent fails Initiative.
  cases:
  - id: one-attack
    roles:
    - compiled
    - active
    - consumer
    - boundary
    operation: attacks
    attacker:
      main_weapon_id: weapon.double-handed-weapon
      skill_ids:
      - skill.sweep
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 3
        attacks: 4
    expect:
      result.attacks: 1
    expect_contains:
      attacker.global_effects.tags:
      - skill.sweep
  - id: failed-initiative-auto-hit
    roles:
    - active
    - consumer
    - boundary
    operation: attack
    attacker:
      main_weapon_id: weapon.double-handed-weapon
      skill_ids:
      - skill.sweep
    defender:
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 3
        attacks: 1
    context:
      hit_only: true
    rolls:
    - key: test.sweep
      value: 4
    expect:
      result.hit: true
  - id: passed-initiative-no-hit
    roles:
    - inactive
    - boundary
    operation: attack
    attacker:
      main_weapon_id: weapon.double-handed-weapon
      skill_ids:
      - skill.sweep
    defender:
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 3
        attacks: 1
    context:
      hit_only: true
    rolls:
    - key: test.sweep
      value: 3
    expect:
      result.hit: false
  - id: one-handed-inactive
    roles:
    - inactive
    operation: attacks
    attacker:
      main_weapon_id: weapon.mace
      skill_ids:
      - skill.sweep
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 3
        attacks: 4
    expect:
      result.attacks: 4
  mutations:
  - id: remove-sweep
    path: attacker.global_effects.tags
    value: []
    cases:
    - one-attack
    - failed-initiative-auto-hit
- id: skill-art-of-silent-death
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: contextual
  sources:
  - target: mechanic/skill.art-of-silent-death
    digest: 3690bb2f226adafe00e0fc974aa5ad0184a1f32a557713dedb239ad6c5c30275
  interpretation: Art of Silent Death removes the fist limitation, adds an attack with Fist or Fighting
    Claws and turns natural 5-6 to-wound rolls into criticals.
  cases:
  - id: unarmed-extra-attack
    roles:
    - compiled
    - active
    - consumer
    - boundary
    operation: attacks
    attacker:
      main_weapon_id: weapon.fist
      skill_ids:
      - skill.art-of-silent-death
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 3
        attacks: 2
    expect:
      result.attacks: 3
    expect_contains:
      attacker.global_effects.tags:
      - skill.art-of-silent-death
  - id: fighting-claws-extra-attack
    roles:
    - active
    - consumer
    operation: attacks
    attacker:
      main_weapon_id: weapon.fighting-claws
      skill_ids:
      - skill.art-of-silent-death
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 3
        attacks: 1
    expect:
      result.attacks: 3
  - id: wound-five-critical
    roles:
    - active
    - boundary
    operation: wound
    attacker:
      main_weapon_id: weapon.fist
      skill_ids:
      - skill.art-of-silent-death
    rolls:
    - key: wound
      value: 5
    expect:
      context.critical_threshold: 5
      result.success: true
      result.critical: true
  - id: ordinary-unarmed
    roles:
    - inactive
    - boundary
    operation: attacks
    attacker:
      main_weapon_id: weapon.fist
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 3
        attacks: 2
    expect:
      result.attacks: 1
  mutations:
  - id: remove-art
    path: attacker.global_effects.tags
    value: []
    cases:
    - unarmed-extra-attack
    - wound-five-critical
- id: mechanic-untiring
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: local
  sources:
  - target: mechanic/mechanic.untiring
    digest: c65675b938396eff2168e42af40ccdc2723330da2e88def68724f3b0d98dd958
  interpretation: Untiring guarantees a minimum save of 5+ against modifiers and against non-magical attacks
    that normally ignore armour.
  cases:
  - id: strength-floor
    roles:
    - compiled
    - active
    - consumer
    - boundary
    operation: armour
    attacker:
      main_weapon_id: weapon.mace
      characteristics:
        weapon_skill: 3
        strength: 6
        toughness: 3
        wounds: 3
        initiative: 3
        attacks: 1
    defender:
      skill_ids:
      - mechanic.untiring
    rolls:
    - key: armour
      value: 5
    expect:
      defender.global_effects.armour_save_floor: 5
      defender.global_effects.armour_cannot_be_ignored: true
      result.target: 5
      result.saved: true
  - id: nonmagical-denial-floor
    roles:
    - active
    - consumer
    - boundary
    operation: armour
    attacker:
      main_weapon_id: weapon.vomit-attack
    defender:
      skill_ids:
      - mechanic.untiring
    rolls:
    - key: armour
      value: 5
    expect:
      result.eligible: true
      result.target: 5
      result.saved: true
  - id: ordinary-no-armour
    roles:
    - inactive
    - boundary
    operation: armour
    attacker:
      main_weapon_id: weapon.vomit-attack
    expect:
      result.eligible: false
  mutations:
  - id: remove-floor
    changes:
    - path: defender.global_effects.armour_save_floor
      value: 7
    - path: defender.global_effects.armour_cannot_be_ignored
      value: false
    cases:
    - strength-floor
    - nonmagical-denial-floor
