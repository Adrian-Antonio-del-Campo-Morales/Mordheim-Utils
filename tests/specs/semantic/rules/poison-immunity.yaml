schema_version: 1
specifications:
- id: preparation.tears-of-shallaya
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: contextual
  sources:
  - target: mechanic/preparation.tears-of-shallaya
    digest: 3866041adc4e5fe739dd79aca7ab06639c09b59aa45da59f35bda7b31b2fdbbb
  interpretation: Tears of Shallaya prevents every poison's benefits or reactions throughout battle. It
    does not remove ordinary weapon/material effects or unrelated fighter skills. Expected restored Strength,
    4+ wound threshold and one damage are independent baseline rules.
  interaction_contract:
    reads:
    - weapon.kind
    writes:
    - defender.poison_immunity
  cases:
  - id: compiled
    roles:
    - compiled
    operation: compile
    defender:
      preparation_ids:
      - preparation.tears-of-shallaya
    expect:
      defender.global_effects.poison_immunity: true
  - id: without-immunity
    roles:
    - inactive
    operation: strength
    attacker:
      main_weapon_id: weapon.mace
      main_poison_id: poison.black-venom
    expect:
      result.wound: 4
      result.armour: 4
  - id: retain-material-and-skill
