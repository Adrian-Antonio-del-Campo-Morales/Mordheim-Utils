schema_version: 1
specifications:
- id: mighty-biceps-and-pit-grants
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: contextual
  sources:
  - target: mechanic/skill.mighty-biceps
    digest: 3be23e76c79c6ed6da60193fdf32547728dbe2ca84740694641e47bcf5072bea
  - target: rule/mordheim/pit-fighters/band--pit-fighter-skill-bulging-biceps/skill.mighty-biceps
    digest: 1ab33516294d9b5ac8834a98a2f88f76147e1062ecf1dd1eb63021876ed7d8f8
  - target: rule/trollheim/chaos-streets-pit-fighters/band--pit-fighter-skill-bulging-biceps/skill.mighty-biceps
    digest: 6ce86aff97bb8a164a3114834ac7a918e3c11e39cc53410d1eb2b054cd891fa6
  interpretation: Pit Fighter Skills / Bulging Biceps keeps the Heavy weapon Strength bonus in every round.
    Flail grants +2 and Morning Star +1. It neither adds Strength to a sword nor removes Strike Last from
    a double-handed weapon; this is not Strongman. Only the three Hero profiles have special skill access.
  cases:
  - id: flail-first-false
    roles:
    - active
    - consumer
    - boundary
    - compiled
    operation: strength
    attacker:
      main_weapon_id: weapon.flail
      skill_ids:
      - skill.mighty-biceps
    context:
      first_round: false
    expect:
      result.wound: 5
      result.armour: 5
    expect_contains:
      attacker.global_effects.tags:
      - skill.mighty-biceps
  - id: flail-first-true
    roles:
    - active
    - consumer
    - boundary
    - compiled
    operation: strength
    attacker:
      main_weapon_id: weapon.flail
      skill_ids:
      - skill.mighty-biceps
    context:
      first_round: true
    expect:
      result.wound: 5
      result.armour: 5
    expect_contains:
      attacker.global_effects.tags:
      - skill.mighty-biceps
  - id: morning-star-first-false
    roles:
    - active
    - consumer
    - boundary
    - compiled
    operation: strength
    attacker:
      main_weapon_id: weapon.morning-star
      skill_ids:
      - skill.mighty-biceps
    context:
      first_round: false
    expect:
      result.wound: 4
      result.armour: 4
    expect_contains:
      attacker.global_effects.tags:
      - skill.mighty-biceps
  - id: morning-star-first-true
    roles:
    - active
    - consumer
    - boundary
    - compiled
    operation: strength
    attacker:
      main_weapon_id: weapon.morning-star
      skill_ids:
      - skill.mighty-biceps
    context:
      first_round: true
    expect:
      result.wound: 4
      result.armour: 4
    expect_contains:
      attacker.global_effects.tags:
      - skill.mighty-biceps
  - id: sword-first-false
    roles:
    - active
    - consumer
    - boundary
    - compiled
    operation: strength
    attacker:
      main_weapon_id: weapon.sword
      skill_ids:
      - skill.mighty-biceps
    context:
      first_round: false
    expect:
      result.wound: 3
      result.armour: 3
    expect_contains:
      attacker.global_effects.tags:
      - skill.mighty-biceps
  - id: sword-first-true
    roles:
    - active
    - consumer
    - boundary
    - compiled
    operation: strength
    attacker:
      main_weapon_id: weapon.sword
      skill_ids:
      - skill.mighty-biceps
    context:
      first_round: true
    expect:
      result.wound: 3
      result.armour: 3
    expect_contains:
      attacker.global_effects.tags:
      - skill.mighty-biceps
  - id: unselected-late-flail
    roles:
    - inactive
    operation: strength
    attacker:
      main_weapon_id: weapon.flail
    context:
      first_round: false
    expect:
      result.wound: 3
      result.armour: 3
  - id: not-strongman
    roles:
    - inactive
    - boundary
    operation: priority
    attacker:
      main_weapon_id: weapon.double-handed-weapon
      skill_ids:
      - skill.mighty-biceps
    expect:
      result.priority: -1
  - id: pit-fighters-recipients
    roles:
    - grant
    operation: selectable_grant
    defender:
      collection: mordheim
      band_id: pit-fighters
      profile_id: pit-king
    context:
      rule_id: band--pit-fighter-skill-bulging-biceps
    expect:
      result.recipients:
      - dwarf-troll-slayer
      - pit-king
      - pit-veterans
  - id: pit-fighters-late-flail
    roles:
    - active
    - consumer
    operation: strength
    attacker:
      collection: mordheim
      band_id: pit-fighters
      profile_id: pit-king
      main_weapon_id: weapon.flail
      special_rule_ids:
      - band--pit-fighter-skill-bulging-biceps
    context:
      first_round: false
    expect:
      result.wound: 6
      result.armour: 6
  - id: chaos-streets-pit-fighters-recipients
    roles:
    - grant
    operation: selectable_grant
    defender:
      collection: trollheim
      band_id: chaos-streets-pit-fighters
      profile_id: pit-king
    context:
      rule_id: band--pit-fighter-skill-bulging-biceps
    expect:
      result.recipients:
      - dwarf-troll-slayer
      - pit-king
      - pit-veterans
  - id: chaos-streets-pit-fighters-late-flail
    roles:
    - active
    - consumer
    operation: strength
    attacker:
      collection: trollheim
      band_id: chaos-streets-pit-fighters
      profile_id: pit-king
      main_weapon_id: weapon.flail
      special_rule_ids:
      - band--pit-fighter-skill-bulging-biceps
    context:
      first_round: false
    expect:
      result.wound: 6
      result.armour: 6
  mutations:
  - id: lose-persistent-bonus
    path: attacker.global_effects.tags
    value: []
    cases:
    - flail-first-false
    - morning-star-first-false
    - pit-fighters-late-flail
    - chaos-streets-pit-fighters-late-flail
