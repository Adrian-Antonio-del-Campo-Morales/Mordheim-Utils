schema_version: 1
specifications:
- id: hardy-constitution-and-pirate-grants
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: stateful
  sources:
  - target: mechanic/skill.hardy-constitution
    digest: 968c90847923413b0014937144221f98bcb4413b15aad12ab0273611f37b741f
  - target: rule/mordheim/pirates/band--pirate-special-skills-hardy-constitution/skill.hardy-constitution
    digest: 7263d36ef09572f61a84665fa5a5ac088cd8cd1cd13d9cc215ea36e5b90e7bbf
  - target: rule/trollheim/lustria-pirates/band--pirate-special-skills-hardy-constitution/skill.hardy-constitution
    digest: b33f71c30ad7b36b8c5d6c71e017e910644b42809f229a4e3d0df62f853237e7
  interpretation: 'Pirate Special Skills / Hardy Constitution (Mordheimer and Lustria p.91). A 5 or 6
    cancels the critical effect, not the wound. A 1-4 leaves the critical available for its resolution.
    The wound classification is checked without using the historical critical table as an oracle. The
    test does not require rolling if the wound is normal, if there is no wound, or if the critical is
    no longer available. Uncancelled criticals now resolve the basic table: two damage; the cancellation
    probability is unchanged.'
  cases:
  - id: full-hit-wound-cancellation-distribution
    roles:
    - active
    - consumer
    - sequence
    - boundary
    operation: attack
    attacker:
      main_weapon_id: weapon.mace
    defender:
      skill_ids:
      - skill.hardy-constitution
    distribution:
      observable: result.critical
      max_rolls: 4
      expected:
        'true': 1/18
        'false': 17/18
  - id: critical-cancellation-face-1
    roles:
    - compiled
    - active
    - boundary
    - consumer
    - sequence
    - consumption
    operation: attack
    attacker:
      main_weapon_id: weapon.mace
    defender:
      skill_ids:
      - skill.hardy-constitution
    rolls:
    - key: test.hit
      value: 4
    - key: test.wound
      value: 6
    - key: test.hardy-constitution
      value: 1
    - key: test.critical
      value: 1
    expect:
      result.critical: true
      result.damage: 2
      result.defender.wounds: 1
    expect_contains:
      defender.global_effects.tags:
      - skill.hardy-constitution
  - id: critical-cancellation-face-2
    roles:
    - compiled
    - active
    - boundary
    - consumer
    - sequence
    - consumption
    operation: attack
    attacker:
      main_weapon_id: weapon.mace
    defender:
      skill_ids:
      - skill.hardy-constitution
    rolls:
    - key: test.hit
      value: 4
    - key: test.wound
      value: 6
    - key: test.hardy-constitution
      value: 2
    - key: test.critical
      value: 1
    expect:
      result.critical: true
      result.damage: 2
      result.defender.wounds: 1
    expect_contains:
      defender.global_effects.tags:
      - skill.hardy-constitution
  - id: critical-cancellation-face-3
