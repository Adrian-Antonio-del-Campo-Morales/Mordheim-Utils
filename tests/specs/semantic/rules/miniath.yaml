schema_version: 1
specifications:
- id: miniath-and-high-elf-grant
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: stateful
  sources:
  - {target: mechanic/skill.miniath, digest: aba8333577f13ba5213d874c5a27f017d8f5e683f06ac242fa3227fece0277c8}
  - {target: rule/trollheim/lustria-high-elves/band--high-elf-special-skills-miniath/skill.miniath, digest: 0ec95381ee4d347cc7205a0e6df4ec4cb15179456632653057629a7c6cf23a7b}
  interpretation: "Lustria p.119 / Miniath allows parrying with any weapon, but only allows re-rolling a failed parry if the weapon already allows parrying naturally. It does not allow matching the hit, parrying a natural six, or double Strength. A re-roll does not grant a second parry."
  cases:
  - id: exact-recipients
    roles: [grant, compiled]
    operation: selectable_grant
    defender: {collection: trollheim, band_id: lustria-high-elves, profile_id: loremaster}
    context: {rule_id: band--high-elf-special-skills-miniath}
    expect: {result.recipients: [explorers, loremaster, sword-guardians]}
  - id: native-grant-consumer
    roles: [active, consumer]
    operation: parry
    attacker: {main_weapon_id: weapon.mace}
    defender: {collection: trollheim, band_id: lustria-high-elves, profile_id: loremaster, main_weapon_id: weapon.sword, special_rule_ids: [band--high-elf-special-skills-miniath]}
    context: {hit_roll: 4}
    rolls: [{key: test.parry, value: 4}, {key: test.parry.reroll, value: 5}]
    expect: {result.blocked: true, result.rerolled: true}
  - id: mace-against-1
    roles: [active, consumer, boundary]
    operation: parry
    attacker: {main_weapon_id: weapon.mace}
    defender: {skill_ids: [skill.miniath], main_weapon_id: weapon.mace}
    context: {hit_roll: 1}
    distribution:
      observable: result.blocked
      max_rolls: 1
      expected: {'true': 5/6, 'false': 1/6}
  - id: mace-against-2
    roles: [active, consumer, boundary]
    operation: parry
    attacker: {main_weapon_id: weapon.mace}
    defender: {skill_ids: [skill.miniath], main_weapon_id: weapon.mace}
    context: {hit_roll: 2}
    distribution:
      observable: result.blocked
      max_rolls: 1
      expected: {'true': 2/3, 'false': 1/3}
  - id: mace-against-3
    roles: [active, consumer, boundary]
    operation: parry
    attacker: {main_weapon_id: weapon.mace}
    defender: {skill_ids: [skill.miniath], main_weapon_id: weapon.mace}
    context: {hit_roll: 3}
    distribution:
      observable: result.blocked
      max_rolls: 1
      expected: {'true': 1/2, 'false': 1/2}
  - id: mace-against-4
    roles: [active, consumer, boundary]
    operation: parry
    attacker: {main_weapon_id: weapon.mace}
    defender: {skill_ids: [skill.miniath], main_weapon_id: weapon.mace}
    context: {hit_roll: 4}
    distribution:
      observable: result.blocked
      max_rolls: 1
      expected: {'true': 1/3, 'false': 2/3}
  - id: mace-against-5
    roles: [active, consumer, boundary]
    operation: parry
    attacker: {main_weapon_id: weapon.mace}
    defender: {skill_ids: [skill.miniath], main_weapon_id: weapon.mace}
    context: {hit_roll: 5}
    distribution:
      observable: result.blocked
      max_rolls: 1
      expected: {'true': 1/6, 'false': 5/6}
  - id: sword-against-1
    roles: [active, consumer, boundary]
    operation: parry
    attacker: {main_weapon_id: weapon.mace}
    defender: {skill_ids: [skill.miniath], main_weapon_id: weapon.sword}
    context: {hit_roll: 1}
    distribution:
      observable: result.blocked
      max_rolls: 2
      expected: {'true': 35/36, 'false': 1/36}
  - id: sword-against-2
    roles: [active, consumer, boundary]
    operation: parry
    attacker: {main_weapon_id: weapon.mace}
    defender: {skill_ids: [skill.miniath], main_weapon_id: weapon.sword}
    context: {hit_roll: 2}
    distribution:
      observable: result.blocked
      max_rolls: 2
      expected: {'true': 8/9, 'false': 1/9}
  - id: sword-against-3
    roles: [active, consumer, boundary]
    operation: parry
    attacker: {main_weapon_id: weapon.mace}
    defender: {skill_ids: [skill.miniath], main_weapon_id: weapon.sword}
    context: {hit_roll: 3}
    distribution:
      observable: result.blocked
      max_rolls: 2
      expected: {'true': 3/4, 'false': 1/4}
  - id: sword-against-4
    roles: [active, consumer, boundary]
    operation: parry
    attacker: {main_weapon_id: weapon.mace}
    defender: {skill_ids: [skill.miniath], main_weapon_id: weapon.sword}
    context: {hit_roll: 4}
    distribution:
      observable: result.blocked
      max_rolls: 2
      expected: {'true': 5/9, 'false': 4/9}
  - id: sword-against-5
    roles: [active, consumer, boundary]
    operation: parry
    attacker: {main_weapon_id: weapon.mace}
    defender: {skill_ids: [skill.miniath], main_weapon_id: weapon.sword}
    context: {hit_roll: 5}
    distribution:
      observable: result.blocked
      max_rolls: 2
      expected: {'true': 11/36, 'false': 25/36}
  - id: no-skill-no-parry
    roles: [inactive]
    operation: parry
    defender: {main_weapon_id: weapon.mace}
    expect: {result.attempted: false, result.blocked: false}
  - id: six-cannot-be-parried
    roles: [boundary, inactive]
    operation: parry
    defender: {skill_ids: [skill.miniath], main_weapon_id: weapon.sword}
    context: {hit_roll: 6}
    expect: {result.attempted: false, result.blocked: false}
  - id: double-strength-cannot-be-parried
    roles: [boundary, inactive]
    operation: parry
    attacker: {main_weapon_id: weapon.mace, characteristics: {weapon_skill: 3, strength: 6, toughness: 3, wounds: 3, initiative: 3, attacks: 1}}
    defender: {skill_ids: [skill.miniath], main_weapon_id: weapon.sword}
    expect: {result.attempted: false, result.blocked: false}
  - id: spent-parry-is-not-replenished
    roles: [consumption, inactive]
    operation: parry
    defender: {skill_ids: [skill.miniath], main_weapon_id: weapon.sword}
    defender_state: {parries_remaining: 0}
    expect: {result.attempted: false, result.blocked: false}
  - id: successful-parry-stops-wound-and-spends-capacity
    roles: [sequence, consumption, consumer]
    operation: attack
    attacker: {main_weapon_id: weapon.mace}
    defender: {skill_ids: [skill.miniath], main_weapon_id: weapon.mace}
    rolls: [{key: test.hit, value: 4}, {key: test.parry, value: 5}]
    expect: {result.parried: true, result.damage: 0, result.defender.parries_remaining: 0}
  - id: failed-mace-parry-has-no-reroll
    roles: [sequence, consumption, boundary]
    operation: attack
    attacker: {main_weapon_id: weapon.mace}
    defender: {skill_ids: [skill.miniath], main_weapon_id: weapon.mace}
    rolls: [{key: test.hit, value: 4}, {key: test.parry, value: 4}, {key: test.wound, value: 4}]
    expect: {result.parried: false, result.damage: 1, result.defender.parries_remaining: 0}
  - id: successful-sword-parry-does-not-reroll
    roles: [boundary]
    operation: parry
    defender: {skill_ids: [skill.miniath], main_weapon_id: weapon.sword}
    rolls: [{key: test.parry, value: 5}]
    expect: {result.blocked: true, result.rerolled: false}
  mutations:
  - id: lose-native-parry-qualification
    path: defender.main_weapon.parry
    value: false
    cases: [sword-against-4]
  - id: fail-to-spend-parry
    runtime_fault: retain-parry-capacity
    cases: [successful-parry-stops-wound-and-spends-capacity, failed-mace-parry-has-no-reroll]
  - id: remove-extra-parry
    path: defender.global_effects.tags
    value: []
    cases: [mace-against-4]
  - id: remove-native-reroll
    path: defender.global_effects.tags
    value: []
    cases: [sword-against-4]
