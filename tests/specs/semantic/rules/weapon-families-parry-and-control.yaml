schema_version: 1
specifications:
- id: weapon.parry-tool-family
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: contextual
  sources:
  - target: mechanic/weapon.dwarf-axe
    digest: 2cb5249b5c88eaaa94169a084a451339f2ac9ec6d9cb9c0f1ecadee53afd6020
  - target: mechanic/weapon.trident
    digest: e0ae3acd652618326b9547e2f15fd720ab437c44a8ca5ad064596a04edc30ac0
  - target: mechanic/weapon.spiked-gauntlet
    digest: deba3f6d2c4380063983a3f9eae910ccfe8fa7a0e3705d750baf5d035c4c7bd5
  interpretation: The three weapons allow an ordinary parry. Dwarf Axe adds penetration 1; Trident strikes
    first only when its bearer has received a charge; Spiked Gauntlet adds no other modifiers.
  cases:
  - id: dwarf-axe-parry
    roles:
    - compiled
    - active
    - consumer
    - boundary
    operation: parry
    defender:
      main_weapon_id: weapon.dwarf-axe
    context:
      hit_roll: 4
    rolls:
    - key: test.parry
      value: 5
    expect:
      defender.main_weapon.parry: true
      defender.main_weapon.armour_penetration: 1
      result.blocked: true
  - id: dwarf-axe-armour
    roles:
    - active
    - consumer
    operation: armour
    attacker:
      main_weapon_id: weapon.dwarf-axe
    defender:
      armour_id: armour.gromril-armour
    rolls:
    - key: armour
      value: 4
    expect:
      result.target: 5
      result.saved: false
  - id: trident-parry
    roles:
    - compiled
    - active
    - consumer
    operation: parry
    defender:
      main_weapon_id: weapon.trident
    context:
      hit_roll: 4
    rolls:
    - key: test.parry
      value: 5
    expect:
      defender.main_weapon.parry: true
      result.blocked: true
  - id: trident-first-when-charged
    roles:
    - active
    - boundary
    operation: acting_order
    attacker:
      main_weapon_id: weapon.trident
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 1
        attacks: 1
    defender:
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 6
        attacks: 1
    context:
      charged: true
    expect:
      result.first_acts: true
  - id: trident-without-charge-uses-initiative
    roles:
    - inactive
    - boundary
    operation: acting_order
    attacker:
      main_weapon_id: weapon.trident
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 1
        attacks: 1
    defender:
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 6
        attacks: 1
    context:
      charged: false
    expect:
      result.first_acts: false
  - id: spiked-gauntlet-parry
    roles:
    - compiled
    - active
    - consumer
    - boundary
    operation: parry
    defender:
      main_weapon_id: weapon.spiked-gauntlet
    context:
      hit_roll: 4
    rolls:
    - key: test.parry
      value: 5
    expect:
      defender.main_weapon.parry: true
      defender.main_weapon.strength_bonus: 0
      result.blocked: true
  mutations:
  - id: remove-dwarf-penetration
    path: attacker.main_weapon.armour_penetration
    value: 0
    cases:
    - dwarf-axe-armour
  - id: remove-dwarf-parry
    path: defender.main_weapon.parry
    value: false
    cases:
    - dwarf-axe-parry
  - id: remove-trident-tag
    path: attacker.main_weapon.tags
    value: []
    cases:
    - trident-first-when-charged
  - id: remove-spiked-parry
    path: defender.main_weapon.parry
    value: false
    cases:
    - spiked-gauntlet-parry
- id: weapon.contextual-strength-family
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: contextual
  sources:
  - target: mechanic/weapon.sigmarite-hammer
    digest: 830bf65a9160921fb330d899e236b6f60d7a78ab6d649045ead88ca5348dc409
  - target: mechanic/weapon.choppa
    digest: e908892cc763cd47214abf2a585eb990ec6b51b79c03282cbc7daddac96001f5
  - target: mechanic/weapon.witch-sword
    digest: 096a2792f91f4da9a2440492d30ab3687933260961bc749dea07116da4207de0
  interpretation: Sigmarite Hammer has Strength +1, Concussion and +1 To Wound against Undead/Possessed.
    Choppa and Witch Sword gain Strength +1 only in the first round; Choppa adds penetration and Witch
    Sword a parry.
  cases:
  - id: sigmarite-strength
    roles:
    - compiled
    - active
    - consumer
    operation: strength
    attacker:
      main_weapon_id: weapon.sigmarite-hammer
    expect:
      attacker.main_weapon.strength_bonus: 1
      attacker.main_weapon.concussion: true
      result.wound: 4
      result.armour: 4
  - id: sigmarite-undead-wound-bonus
    roles:
    - active
    - consumer
    - boundary
    operation: wound
    attacker:
      main_weapon_id: weapon.sigmarite-hammer
    defender:
      collection: mordheim
      band_id: tomb-guardians
      profile_id: liche-priest
    rolls:
    - key: wound
      value: 2
    expect:
      context.modifier: 1
      result.target: 2
      result.success: true
  - id: sigmarite-ordinary-opponent
    roles:
    - inactive
    - boundary
    operation: wound
    attacker:
      main_weapon_id: weapon.sigmarite-hammer
    rolls:
    - key: wound
      value: 2
    expect:
      context.modifier: 0
      result.target: 3
      result.success: false
  - id: sigmarite-concussion
    roles:
    - active
    - boundary
    operation: injury
    attacker:
      main_weapon_id: weapon.sigmarite-hammer
    rolls:
    - key: test.injury
      value: 2
    expect:
      result.condition: STUNNED
  - id: choppa-first-round
    roles:
    - compiled
    - active
    - consumer
    - boundary
    operation: strength
    attacker:
      main_weapon_id: weapon.choppa
    context:
      first_round: true
    expect:
      attacker.main_weapon.first_round_strength_bonus: 1
      attacker.main_weapon.armour_penetration: 1
      result.wound: 4
      result.armour: 4
  - id: choppa-later-round
    roles:
    - inactive
    - boundary
    operation: strength
    attacker:
      main_weapon_id: weapon.choppa
    context:
      first_round: false
    expect:
      result.wound: 3
      result.armour: 3
  - id: witch-sword-first-round
    roles:
    - compiled
    - active
    - consumer
    - boundary
    operation: strength
    attacker:
      main_weapon_id: weapon.witch-sword
    context:
      first_round: true
    expect:
      attacker.main_weapon.first_round_strength_bonus: 1
      attacker.main_weapon.parry: true
      result.wound: 4
  - id: witch-sword-later-round
    roles:
    - inactive
    - boundary
    operation: strength
    attacker:
      main_weapon_id: weapon.witch-sword
    context:
      first_round: false
    expect:
      result.wound: 3
  - id: witch-sword-parry
    roles:
    - active
    - consumer
    operation: parry
    defender:
      main_weapon_id: weapon.witch-sword
    context:
      hit_roll: 4
    rolls:
    - key: test.parry
      value: 5
    expect:
      result.blocked: true
  mutations:
  - id: remove-sigmarite-undead-bonus
    path: attacker.main_weapon.tags
    value: []
    cases:
    - sigmarite-undead-wound-bonus
  - id: remove-sigmarite-concussion
    path: attacker.main_weapon.concussion
    value: false
    cases:
    - sigmarite-concussion
  - id: remove-choppa-first-strength
    path: attacker.main_weapon.first_round_strength_bonus
    value: 0
    cases:
    - choppa-first-round
  - id: remove-witch-first-strength
    path: attacker.main_weapon.first_round_strength_bonus
    value: 0
    cases:
    - witch-sword-first-round
  - id: remove-witch-parry
    path: defender.main_weapon.parry
    value: false
    cases:
    - witch-sword-parry
- id: weapon.unparryable-flexible-family
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: local
  sources:
  - target: mechanic/weapon.steel-whip
    digest: 82bbfe9599f03ef3877f7b2b224ec89b56de6f394d788ef0feee521c1079c10a
  - target: mechanic/weapon.pirate-scourge
    digest: 37815c4f4d4e1fcd8b3a57abd47344821832b641bef7f712138c96aa17f7d43e
  interpretation: Both attacks ignore parries completely. They modify neither Strength, damage nor the
    to-wound roll.
  cases:
  - id: steel-whip-compiled
    roles:
    - compiled
    operation: compile
    attacker:
      main_weapon_id: weapon.steel-whip
    expect:
      attacker.main_weapon.cannot_be_parried: true
      attacker.main_weapon.strength_bonus: 0
  - id: steel-whip-skips-parry
    roles:
    - active
    - consumer
    - boundary
    operation: attack
    attacker:
      main_weapon_id: weapon.steel-whip
    defender:
      main_weapon_id: weapon.sword
    rolls:
    - key: test.hit
      value: 4
    - key: test.wound
      value: 4
    expect:
      result.parried: false
      result.wounded: true
  - id: pirate-scourge-compiled
    roles:
    - compiled
    operation: compile
    attacker:
      main_weapon_id: weapon.pirate-scourge
    expect:
      attacker.main_weapon.cannot_be_parried: true
  - id: pirate-scourge-skips-parry
    roles:
    - active
    - consumer
    - boundary
    operation: attack
    attacker:
      main_weapon_id: weapon.pirate-scourge
    defender:
      main_weapon_id: weapon.sword
    rolls:
    - key: test.hit
      value: 4
    - key: test.wound
      value: 4
    - key: test.armour
      value: 1
    expect:
      result.parried: false
      result.wounded: true
  - id: ordinary-weapon-can-be-parried
    roles:
    - inactive
    - boundary
    operation: attack
    attacker:
      main_weapon_id: weapon.mace
    defender:
      main_weapon_id: weapon.sword
    rolls:
    - key: test.hit
      value: 4
    - key: test.parry
      value: 5
    expect:
      result.parried: true
      result.wounded: false
  mutations:
  - id: allow-steel-whip-parry
    path: attacker.main_weapon.cannot_be_parried
    value: false
    cases:
    - steel-whip-skips-parry
  - id: allow-pirate-scourge-parry
    path: attacker.main_weapon.cannot_be_parried
    value: false
    cases:
    - pirate-scourge-skips-parry
- id: weapon.paired-skaven-family
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: local
  sources:
  - target: mechanic/weapon.fighting-claws
    digest: c8d3c3268b91fb859956b614900edca59716cbf685fb60bc18504bfa816269ca
  - target: mechanic/weapon.weeping-blades
    digest: 8f2e963aa826bd145a58cca57dfe884e8ecdd7e62025fe0d23ca357886593269
  depends_on:
  - mechanic/poison.black-lotus
  interpretation: Both paired weapons grant one extra attack and one parry. Weeping Blades carries Black
    Lotus; Fighting Claws does not modify wounds in the duel.
  cases:
  - id: fighting-claws-pair
    roles:
    - compiled
    - active
    - consumer
    - boundary
    operation: attacks
    attacker:
      main_weapon_id: weapon.fighting-claws
    expect:
      attacker.main_weapon.paired: true
      attacker.main_weapon.parry: true
      result.attacks: 2
  - id: fighting-claws-parry
    roles:
    - active
    - consumer
    operation: parry
    defender:
      main_weapon_id: weapon.fighting-claws
    context:
      hit_roll: 4
    rolls:
    - key: test.parry
      value: 5
    expect:
      result.blocked: true
  - id: weeping-blades-pair
    roles:
    - compiled
    - active
    - consumer
    operation: attacks
    attacker:
      main_weapon_id: weapon.weeping-blades
    expect:
      attacker.main_weapon.paired: true
      attacker.main_weapon.parry: true
      result.attacks: 2
    expect_contains:
      attacker.main_weapon.tags:
      - poison.black-lotus
  - id: weeping-blades-hit-six-auto-wounds
    roles:
    - active
    - consumer
    - boundary
    operation: wound
    attacker:
      main_weapon_id: weapon.weeping-blades
    context:
      hit_roll: 6
    expect:
      context.automatic: false
      result.success: true
      result.critical: false
      context.failure_still_wounds: true
    rolls:
    - key: wound
      value: 1
  - id: fighting-claws-hit-six-still-rolls-wound
    roles:
    - inactive
    - boundary
    operation: wound
    attacker:
      main_weapon_id: weapon.fighting-claws
    context:
      hit_roll: 6
    rolls:
    - key: wound
      value: 1
    expect:
      context.automatic: false
      result.success: false
  mutations:
  - id: remove-claws-pair
    path: attacker.main_weapon.paired
    value: false
    cases:
    - fighting-claws-pair
  - id: remove-claws-parry
    path: defender.main_weapon.parry
    value: false
    cases:
    - fighting-claws-parry
  - id: remove-weeping-pair
    path: attacker.main_weapon.paired
    value: false
    cases:
    - weeping-blades-pair
  - id: remove-weeping-poison
    path: attacker.main_weapon.tags
    value:
    - weapon.weeping-blades
    cases:
    - weeping-blades-hit-six-auto-wounds
- id: weapon.control-and-priority-family
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: stateful
  sources:
  - target: mechanic/weapon.chained-squig
    digest: 7c60f1208acfec16301018db46056418727a2d1de237ef7f132347f1ae527c1b
  - target: mechanic/weapon.squig-prodder
    digest: f74d3423df221f5a28ec7a0372c709608eb147fed9b9fa31f38d3e6b4e4a832d
  - target: mechanic/weapon.kusara-kama
    digest: 99f437d62e903c419e07c2e567ff67dcffd5d5cc04d9912eeff1aac3c2fab901
  - target: mechanic/weapon.long-boat-hook
    digest: b5d1d6ecd6c4f0dc3e43217b441938545a4499d30c6e68e40428a8a4396f3305
  interpretation: Chained Squig fixes Strength 3, strikes first, cannot be parried and entangles on a
    hit. Squig Prodder strikes first. Kusara-kama removes one attack after a 5+ hit. Long Boat Hook has
    Strength -1 and priority only in the first round.
  cases:
  - id: chained-squig-entangles-on-hit
    roles:
    - compiled
    - active
    - consumer
    - sequence
    - consumption
    - boundary
    operation: attack
    attacker:
      main_weapon_id: weapon.chained-squig
    defender:
      main_weapon_id: weapon.sword
    rolls:
    - key: test.hit
      value: 4
    - key: test.wound
      value: 1
    expect:
      attacker.main_weapon.fixed_strength: 3
      attacker.main_weapon.priority: 1
      attacker.main_weapon.cannot_be_parried: true
      result.defender.entangled: true
      result.wounded: false
  - id: chained-squig-miss-does-not-entangle
    roles:
    - inactive
    - boundary
    - sequence
    operation: attack
    attacker:
      main_weapon_id: weapon.chained-squig
    rolls:
    - key: test.hit
      value: 1
    expect:
      result.defender.entangled: false
  - id: squig-prodder-first
    roles:
    - compiled
    - active
    - consumer
    - boundary
    operation: acting_order
    attacker:
      main_weapon_id: weapon.squig-prodder
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 1
        attacks: 1
    defender:
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 6
        attacks: 1
    expect:
      attacker.main_weapon.priority: 1
      result.first_acts: true
  - id: kusara-hit-five-removes-attack
    roles:
    - compiled
    - active
    - consumer
    - sequence
    - consumption
    - boundary
    operation: attack
    attacker:
      main_weapon_id: weapon.kusara-kama
    rolls:
    - key: test.hit
      value: 5
    - key: test.wound
      value: 1
    expect:
      attacker.main_weapon.two_handed: true
      attacker.main_weapon.armour_penetration: 1
      result.defender.attack_penalty: 1
  - id: kusara-hit-four-does-not-remove-attack
    roles:
    - inactive
    - boundary
    operation: attack
    attacker:
      main_weapon_id: weapon.kusara-kama
    rolls:
    - key: test.hit
      value: 4
    - key: test.wound
      value: 1
    expect:
      result.defender.attack_penalty: 0
  - id: long-hook-first-round-priority
    roles:
    - compiled
    - active
    - consumer
    - boundary
    operation: acting_order
    attacker:
      main_weapon_id: weapon.long-boat-hook
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 1
        attacks: 1
    defender:
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 6
        attacks: 1
    context:
      first_round: true
    expect:
      attacker.main_weapon.strength_bonus: -1
      attacker.main_weapon.two_handed: true
      result.first_acts: true
  - id: long-hook-later-uses-initiative
    roles:
    - inactive
    - boundary
    operation: acting_order
    attacker:
      main_weapon_id: weapon.long-boat-hook
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 1
        attacks: 1
    defender:
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 6
        attacks: 1
    context:
      first_round: false
    expect:
      result.first_acts: false
  mutations:
  - id: remove-chained-entangle
    path: attacker.main_weapon.tags
    value: []
    cases:
    - chained-squig-entangles-on-hit
  - id: remove-prodder-priority
    path: attacker.main_weapon.priority
    value: 0
    cases:
    - squig-prodder-first
  - id: remove-kusara-control
    path: attacker.main_weapon.tags
    value: []
    cases:
    - kusara-hit-five-removes-attack
  - id: make-long-hook-always-first
    path: attacker.main_weapon.tags
    value: []
    cases:
    - long-hook-later-uses-initiative
