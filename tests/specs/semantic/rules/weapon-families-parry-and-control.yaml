schema_version: 1
specifications:
- id: weapon.parry-tool-family
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: contextual
  sources:
  - target: mechanic/weapon.dwarf-axe
    digest: df7cc10563fa12b7482d7e8b24f34779a8a8c8e911e348cafeeb3e3e92502b71
  - target: mechanic/weapon.trident
    digest: 35fceec647a6d3fc8d426dc9cf9c4344e8f9cc0f45bb54635d581a8381315519
  - target: mechanic/weapon.spiked-gauntlet
    digest: 74abb045576afe539b1c4e7dd79aee6a90001a8e8715c00f8d3c2006abcb256f
  interpretation: The three weapons allow an ordinary parry. Dwarf Axe adds penetration 1; Trident strikes
    first only when its bearer has received a charge; Spiked Gauntlet adds no other modifiers.
  cases:
  - id: dwarf-axe-parry
    roles:
    - compiled
    - active
    - consumer
    - boundary
    operation: parry
    defender:
      main_weapon_id: weapon.dwarf-axe
    context:
      hit_roll: 4
    rolls:
    - key: test.parry
      value: 5
    expect:
      defender.main_weapon.parry: true
      defender.main_weapon.armour_penetration: 1
      result.blocked: true
  - id: dwarf-axe-armour
    roles:
    - active
    - consumer
    operation: armour
    attacker:
      main_weapon_id: weapon.dwarf-axe
    defender:
      armour_id: armour.gromril-armour
    rolls:
    - key: armour
      value: 4
    expect:
      result.target: 5
      result.saved: false
  - id: trident-parry
    roles:
    - compiled
    - active
    - consumer
    operation: parry
    defender:
      main_weapon_id: weapon.trident
    context:
      hit_roll: 4
    rolls:
    - key: test.parry
      value: 5
    expect:
      defender.main_weapon.parry: true
      result.blocked: true
  - id: trident-first-when-charged
    roles:
    - active
    - boundary
    operation: acting_order
    attacker:
      main_weapon_id: weapon.trident
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 1
        attacks: 1
    defender:
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 6
        attacks: 1
    context:
      charged: true
    expect:
      result.first_acts: true
  - id: trident-without-charge-uses-initiative
    roles:
    - inactive
    - boundary
    operation: acting_order
    attacker:
      main_weapon_id: weapon.trident
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 1
        attacks: 1
    defender:
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 6
        attacks: 1
    context:
      charged: false
    expect:
      result.first_acts: false
  - id: spiked-gauntlet-parry
    roles:
    - compiled
    - active
    - consumer
    - boundary
    operation: parry
    defender:
      main_weapon_id: weapon.spiked-gauntlet
    context:
      hit_roll: 4
    rolls:
    - key: test.parry
      value: 5
    expect:
      defender.main_weapon.parry: true
      defender.main_weapon.strength_bonus: 0
      result.blocked: true
  mutations:
  - id: remove-dwarf-penetration
    path: attacker.main_weapon.armour_penetration
    value: 0
    cases:
    - dwarf-axe-armour
  - id: remove-dwarf-parry
    path: defender.main_weapon.parry
    value: false
    cases:
    - dwarf-axe-parry
  - id: remove-trident-tag
    path: attacker.main_weapon.tags
    value: []
    cases:
    - trident-first-when-charged
  - id: remove-spiked-parry
    path: defender.main_weapon.parry
    value: false
    cases:
    - spiked-gauntlet-parry
- id: weapon.contextual-strength-family
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: contextual
  sources:
  - target: mechanic/weapon.sigmarite-hammer
    digest: 6206f82444399a53a336d21ceec9377c77849da395d5114b60f88edd48da02f6
  - target: mechanic/weapon.choppa
    digest: 67e5678f6a3bcd7490ac00fb99e8b58502d7e68b883d9390a68add60ce5d23df
  - target: mechanic/weapon.witch-sword
    digest: 2d099bca9ae35500b15b8d8845d28bc8405a87865ef2c3042b87db22fdace664
  interpretation: Sigmarite Hammer has Strength +1, Concussion and +1 To Wound against Undead/Possessed.
    Choppa and Witch Sword gain Strength +1 only in the first round; Choppa adds penetration and Witch
    Sword a parry.
  cases:
  - id: sigmarite-strength
    roles:
    - compiled
    - active
    - consumer
    operation: strength
    attacker:
      main_weapon_id: weapon.sigmarite-hammer
    expect:
      attacker.main_weapon.strength_bonus: 1
      attacker.main_weapon.concussion: true
      result.wound: 4
      result.armour: 4
  - id: sigmarite-undead-wound-bonus
    roles:
    - active
    - consumer
    - boundary
    operation: wound
    attacker:
      main_weapon_id: weapon.sigmarite-hammer
    defender:
      collection: mordheim
      band_id: tomb-guardians
      profile_id: liche-priest
    rolls:
    - key: wound
      value: 2
    expect:
      context.modifier: 1
      result.target: 2
      result.success: true
  - id: sigmarite-ordinary-opponent
    roles:
    - inactive
    - boundary
    operation: wound
    attacker:
      main_weapon_id: weapon.sigmarite-hammer
    rolls:
    - key: wound
      value: 2
    expect:
      context.modifier: 0
      result.target: 3
      result.success: false
  - id: sigmarite-concussion
    roles:
    - active
    - boundary
    operation: injury
    attacker:
      main_weapon_id: weapon.sigmarite-hammer
    rolls:
    - key: test.injury
      value: 2
    expect:
      result.condition: STUNNED
  - id: choppa-first-round
    roles:
    - compiled
    - active
    - consumer
    - boundary
    operation: strength
    attacker:
      main_weapon_id: weapon.choppa
    context:
      first_round: true
    expect:
      attacker.main_weapon.first_round_strength_bonus: 1
      attacker.main_weapon.armour_penetration: 1
      result.wound: 4
      result.armour: 4
  - id: choppa-later-round
    roles:
    - inactive
    - boundary
    operation: strength
    attacker:
      main_weapon_id: weapon.choppa
    context:
      first_round: false
    expect:
      result.wound: 3
      result.armour: 3
  - id: witch-sword-first-round
    roles:
    - compiled
    - active
    - consumer
    - boundary
    operation: strength
    attacker:
      main_weapon_id: weapon.witch-sword
    context:
      first_round: true
    expect:
      attacker.main_weapon.first_round_strength_bonus: 1
      attacker.main_weapon.parry: true
      result.wound: 4
  - id: witch-sword-later-round
    roles:
    - inactive
    - boundary
    operation: strength
    attacker:
      main_weapon_id: weapon.witch-sword
    context:
      first_round: false
    expect:
      result.wound: 3
  - id: witch-sword-parry
    roles:
    - active
    - consumer
    operation: parry
    defender:
      main_weapon_id: weapon.witch-sword
    context:
      hit_roll: 4
    rolls:
    - key: test.parry
      value: 5
    expect:
      result.blocked: true
  mutations:
  - id: remove-sigmarite-undead-bonus
    path: attacker.main_weapon.tags
    value: []
    cases:
    - sigmarite-undead-wound-bonus
  - id: remove-sigmarite-concussion
    path: attacker.main_weapon.concussion
    value: false
    cases:
    - sigmarite-concussion
  - id: remove-choppa-first-strength
    path: attacker.main_weapon.first_round_strength_bonus
    value: 0
    cases:
    - choppa-first-round
  - id: remove-witch-first-strength
    path: attacker.main_weapon.first_round_strength_bonus
    value: 0
    cases:
    - witch-sword-first-round
  - id: remove-witch-parry
    path: defender.main_weapon.parry
    value: false
    cases:
    - witch-sword-parry
- id: weapon.unparryable-flexible-family
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: local
  sources:
  - target: mechanic/weapon.steel-whip
    digest: c68e8fb80d742899ca8d92dc8b0d99daa494ad588434db6a0b6aa5dd1a70e0a6
  - target: mechanic/weapon.pirate-scourge
    digest: b66cb7429fc4042834e9cdf774c53b447c5f2aa37a2ef214d239ade0c11b1599
  interpretation: Both attacks ignore parries completely. They modify neither Strength, damage nor the
    to-wound roll.
  cases:
  - id: steel-whip-compiled
    roles:
    - compiled
    operation: compile
    attacker:
      main_weapon_id: weapon.steel-whip
    expect:
      attacker.main_weapon.cannot_be_parried: true
      attacker.main_weapon.strength_bonus: 0
  - id: steel-whip-skips-parry
    roles:
    - active
    - consumer
    - boundary
    operation: attack
    attacker:
      main_weapon_id: weapon.steel-whip
    defender:
      main_weapon_id: weapon.sword
    rolls:
    - key: test.hit
      value: 4
    - key: test.wound
      value: 4
    expect:
      result.parried: false
      result.wounded: true
  - id: pirate-scourge-compiled
    roles:
    - compiled
    operation: compile
    attacker:
      main_weapon_id: weapon.pirate-scourge
    expect:
      attacker.main_weapon.cannot_be_parried: true
  - id: pirate-scourge-skips-parry
    roles:
    - active
    - consumer
    - boundary
    operation: attack
    attacker:
      main_weapon_id: weapon.pirate-scourge
    defender:
      main_weapon_id: weapon.sword
    rolls:
    - key: test.hit
      value: 4
    - key: test.wound
      value: 4
    - key: test.armour
      value: 1
    expect:
      result.parried: false
      result.wounded: true
  - id: ordinary-weapon-can-be-parried
    roles:
    - inactive
    - boundary
    operation: attack
    attacker:
      main_weapon_id: weapon.mace
    defender:
      main_weapon_id: weapon.sword
    rolls:
    - key: test.hit
      value: 4
    - key: test.parry
      value: 5
    expect:
      result.parried: true
      result.wounded: false
  mutations:
  - id: allow-steel-whip-parry
    path: attacker.main_weapon.cannot_be_parried
    value: false
    cases:
    - steel-whip-skips-parry
  - id: allow-pirate-scourge-parry
    path: attacker.main_weapon.cannot_be_parried
    value: false
    cases:
    - pirate-scourge-skips-parry
- id: weapon.paired-skaven-family
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: local
  sources:
  - target: mechanic/weapon.fighting-claws
    digest: 1b31dbc45583b0fa25a8da1d4085fe491fb119c43c4efa536df7be0c4359dd12
  - target: mechanic/weapon.weeping-blades
    digest: c84d08a34e82445f85441cb985910f90e3ed3d833ba97ffabc62c4d47483cfb0
  depends_on:
  - mechanic/poison.black-lotus
  interpretation: Both paired weapons grant one extra attack and one parry. Weeping Blades carries Black
    Lotus; Fighting Claws does not modify wounds in the duel.
  cases:
  - id: fighting-claws-pair
    roles:
    - compiled
    - active
    - consumer
    - boundary
    operation: attacks
    attacker:
      main_weapon_id: weapon.fighting-claws
    expect:
      attacker.main_weapon.paired: true
      attacker.main_weapon.parry: true
      result.attacks: 2
  - id: fighting-claws-parry
    roles:
    - active
    - consumer
    operation: parry
    defender:
      main_weapon_id: weapon.fighting-claws
    context:
      hit_roll: 4
    rolls:
    - key: test.parry
      value: 5
    expect:
      result.blocked: true
  - id: weeping-blades-pair
    roles:
    - compiled
    - active
    - consumer
    operation: attacks
    attacker:
      main_weapon_id: weapon.weeping-blades
    expect:
      attacker.main_weapon.paired: true
      attacker.main_weapon.parry: true
      result.attacks: 2
    expect_contains:
      attacker.main_weapon.tags:
      - poison.black-lotus
  - id: weeping-blades-hit-six-auto-wounds
    roles:
    - active
    - consumer
    - boundary
    operation: wound
    attacker:
      main_weapon_id: weapon.weeping-blades
    context:
      hit_roll: 6
    expect:
      context.automatic: false
      result.success: true
      result.critical: false
      context.failure_still_wounds: true
    rolls:
    - key: wound
      value: 1
  - id: fighting-claws-hit-six-still-rolls-wound
    roles:
    - inactive
    - boundary
    operation: wound
    attacker:
      main_weapon_id: weapon.fighting-claws
    context:
      hit_roll: 6
    rolls:
    - key: wound
      value: 1
    expect:
      context.automatic: false
      result.success: false
  mutations:
  - id: remove-claws-pair
    path: attacker.main_weapon.paired
    value: false
    cases:
    - fighting-claws-pair
  - id: remove-claws-parry
    path: defender.main_weapon.parry
    value: false
    cases:
    - fighting-claws-parry
  - id: remove-weeping-pair
    path: attacker.main_weapon.paired
    value: false
    cases:
    - weeping-blades-pair
  - id: remove-weeping-poison
    path: attacker.main_weapon.tags
    value:
    - weapon.weeping-blades
    cases:
    - weeping-blades-hit-six-auto-wounds
- id: weapon.control-and-priority-family
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: stateful
  sources:
  - target: mechanic/weapon.chained-squig
    digest: 7f12832c857de8a73af72b80a113fc8c9cf6de5fe2ca5ad66195e64362daea58
  - target: mechanic/weapon.squig-prodder
    digest: edc889deaded8587f68551624e6308c8cac7f127d8212a4ed232dcaddb3a3fe6
  - target: mechanic/weapon.kusara-kama
    digest: 86af957745f212b0666ee0d0be9b73df5a2c28c89e9a8df8b1dec652afb799c1
  - target: mechanic/weapon.long-boat-hook
    digest: d7196deda09f5bf98a83b6528fdb4ce9491fd325dfc78fa87bdd5c942b9271b5
  interpretation: Chained Squig fixes Strength 3, strikes first, cannot be parried and entangles on a
    hit. Squig Prodder strikes first. Kusara-kama removes one attack after a 5+ hit. Long Boat Hook has
    Strength -1 and priority only in the first round.
  cases:
  - id: chained-squig-entangles-on-hit
    roles:
    - compiled
    - active
    - consumer
    - sequence
    - consumption
    - boundary
    operation: attack
    attacker:
      main_weapon_id: weapon.chained-squig
    defender:
      main_weapon_id: weapon.sword
    rolls:
    - key: test.hit
      value: 4
    - key: test.wound
      value: 1
    expect:
      attacker.main_weapon.fixed_strength: 3
      attacker.main_weapon.priority: 1
      attacker.main_weapon.cannot_be_parried: true
      result.defender.entangled: true
      result.wounded: false
  - id: chained-squig-miss-does-not-entangle
    roles:
    - inactive
    - boundary
    - sequence
    operation: attack
    attacker:
      main_weapon_id: weapon.chained-squig
    rolls:
    - key: test.hit
      value: 1
    expect:
      result.defender.entangled: false
  - id: squig-prodder-first
    roles:
    - compiled
    - active
    - consumer
    - boundary
    operation: acting_order
    attacker:
      main_weapon_id: weapon.squig-prodder
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 1
        attacks: 1
    defender:
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 6
        attacks: 1
    expect:
      attacker.main_weapon.priority: 1
      result.first_acts: true
  - id: kusara-hit-five-removes-attack
    roles:
    - compiled
    - active
    - consumer
    - sequence
    - consumption
    - boundary
    operation: attack
    attacker:
      main_weapon_id: weapon.kusara-kama
    rolls:
    - key: test.hit
      value: 5
    - key: test.wound
      value: 1
    expect:
      attacker.main_weapon.two_handed: true
      attacker.main_weapon.armour_penetration: 1
      result.defender.attack_penalty: 1
  - id: kusara-hit-four-does-not-remove-attack
    roles:
    - inactive
    - boundary
    operation: attack
    attacker:
      main_weapon_id: weapon.kusara-kama
    rolls:
    - key: test.hit
      value: 4
    - key: test.wound
      value: 1
    expect:
      result.defender.attack_penalty: 0
  - id: long-hook-first-round-priority
    roles:
    - compiled
    - active
    - consumer
    - boundary
    operation: acting_order
    attacker:
      main_weapon_id: weapon.long-boat-hook
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 1
        attacks: 1
    defender:
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 6
        attacks: 1
    context:
      first_round: true
    expect:
      attacker.main_weapon.strength_bonus: -1
      attacker.main_weapon.two_handed: true
      result.first_acts: true
  - id: long-hook-later-uses-initiative
    roles:
    - inactive
    - boundary
    operation: acting_order
    attacker:
      main_weapon_id: weapon.long-boat-hook
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 1
        attacks: 1
    defender:
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 6
        attacks: 1
    context:
      first_round: false
    expect:
      result.first_acts: false
  mutations:
  - id: remove-chained-entangle
    path: attacker.main_weapon.tags
    value: []
    cases:
    - chained-squig-entangles-on-hit
  - id: remove-prodder-priority
    path: attacker.main_weapon.priority
    value: 0
    cases:
    - squig-prodder-first
  - id: remove-kusara-control
    path: attacker.main_weapon.tags
    value: []
    cases:
    - kusara-hit-five-removes-attack
  - id: make-long-hook-always-first
    path: attacker.main_weapon.tags
    value: []
    cases:
    - long-hook-later-uses-initiative
