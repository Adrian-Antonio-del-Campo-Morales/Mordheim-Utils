schema_version: 1
specifications:
- id: optional-bull-charge-family
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: stateful
  sources:
  - target: mechanic/mechanic.bull-charge
    digest: ac0fe8368e338df3a9548616906eb0370cf54df9c3cdd085414730a88a9cab15
  - target: rule/mordheim/maneaters/bulls--bull-charge/mechanic.bull-charge
    digest: 972de9b68d2978995787a5251c7d6ead1530c2bfef654a462cecf6da83ef10d9
  - target: rule/mordheim/maneaters/band--ogres-special-skills-bull-charge/mechanic.bull-charge
    digest: 3de733d6ec35e6526a125b6f05799b347f189ba5cbdb856e3e2b6e3e5dc22145
  - target: rule/mordheim/ostlanders/band--ostlander-special-skills-bull-rush/mechanic.bull-charge
    digest: d1d903879a086ad7e569703075d526c97ced5c3bafec16bae1143a8ffe20e950
  interpretation: Bull Charge and Bull Rush allow choosing, during a charge, to replace all attacks with
    a single attempt at +1 To Hit. If it hits, it knocks down without a to-wound roll. Declining the choice
    keeps the normal pool. Outside a charge no decision is asked nor is the number of attacks replaced.
    Bulls receives the rule automatically; the skills have their own recipients.
  cases:
  - id: canonical-compiled
    roles:
    - compiled
    operation: compile
    attacker:
      skill_ids:
      - mechanic.bull-charge
    expect_contains:
      attacker.global_effects.tags:
      - mechanic.bull-charge
    expect:
      attacker.fighter_id: custom:custom
  - id: bulls-recipients
    roles:
    - grant
    operation: grant
    defender:
      band_id: maneaters
      profile_id: bulls
    context:
      rule_id: bulls--bull-charge
    expect:
      result.recipients:
      - bulls
  - id: ogre-skill-recipients
    roles:
    - grant
    operation: selectable_grant
    defender:
      band_id: maneaters
      profile_id: captain
    context:
      rule_id: band--ogres-special-skills-bull-charge
    expect:
      result.recipients:
      - captain
      - mountain-guide
      - youngbloods
  - id: ostlander-recipients
    roles:
    - grant
    operation: selectable_grant
    defender:
      band_id: ostlanders
      profile_id: elder
    context:
      rule_id: band--ostlander-special-skills-bull-rush
    expect:
      result.recipients:
      - blood-brothers
      - elder
      - priest-of-taal
  - id: accepted-hit-knocks-down
    roles:
    - active
    - consumer
    - sequence
    - consumption
    - boundary
    operation: pool
    attacker:
      skill_ids:
      - mechanic.bull-charge
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 3
        attacks: 3
    defender:
      main_weapon_id: weapon.mace
    context:
      count: 3
      first_round: true
      charging: true
    decisions:
    - key: test.bull-charge
      value: true
    rolls:
    - key: test.bull-charge.hit
      value: 3
    expect:
      result.attacks.0.hit_target: 3
      result.attacks.0.hit: true
      result.attacks.0.wounded: false
      result.defender.condition: KNOCKED_DOWN
  - id: accepted-miss-does-not-wound
    roles:
    - active
    - boundary
    operation: pool
    attacker:
      skill_ids:
      - mechanic.bull-charge
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 3
        attacks: 3
    context:
      count: 3
      first_round: true
      charging: true
    decisions:
    - key: test.bull-charge
      value: true
    rolls:
    - key: test.bull-charge.hit
      value: 2
    expect:
      result.attacks.0.hit: false
      result.defender.condition: STANDING
  - id: declined-keeps-normal-pool
    roles:
    - inactive
    - sequence
    - boundary
    operation: pool
    attacker:
      skill_ids:
      - mechanic.bull-charge
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 3
        attacks: 2
    context:
      count: 2
      first_round: true
      charging: true
    decisions:
    - key: test.bull-charge
      value: false
    rolls:
    - key: test.attack.0.hit
      value: 1
    - key: test.attack.1.hit
      value: 1
    expect:
      result.attacks.0.hit: false
      result.attacks.1.hit: false
      result.defender.condition: STANDING
  - id: not-charging-no-choice
    roles:
    - inactive
    - boundary
    operation: attacks
    attacker:
      skill_ids:
      - mechanic.bull-charge
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 3
        attacks: 3
    context:
      first_round: true
      charging: false
    expect:
      result.attacks: 3
  mutations:
  - id: remove-bull-charge
    path: attacker.global_effects.tags
    value: []
    cases:
    - accepted-hit-knocks-down
    - accepted-miss-does-not-wound
- id: optional-body-slam-family
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: stateful
  sources:
  - target: mechanic/mechanic.body-slam
    digest: eb013900a8bdfecf3f47aa2f39f77b5900e486776c8be8e62eddd89841162457
  - target: rule/mordheim/pit-fighters/band--pit-fighter-skill-body-slam/mechanic.body-slam
    digest: 2b10ad041dea55bd952731f8bcdacd7ed8708d3ccf933005839d2288d145337d
  - target: rule/trollheim/chaos-streets-pit-fighters/band--pit-fighter-skill-body-slam/mechanic.body-slam
    digest: 00474d07b0ae5aa6dc3b666065442a833c634df57fa15d05d187e95d6fc51e7d
  interpretation: Body Slam allows choosing, during a charge, a single attack at +1 Strength and +1 To
    Hit that scores a critical on 5+. It does not use the weapon's bonuses or other skills. Declining
    keeps the ordinary pool. Both editions grant it exactly to Pit King, Pit Veterans and Dwarf Troll
    Slayer.
  cases:
  - id: canonical-compiled
    roles:
    - compiled
    operation: compile
    attacker:
      skill_ids:
      - mechanic.body-slam
    expect_contains:
      attacker.global_effects.tags:
      - mechanic.body-slam
    expect:
      attacker.fighter_id: custom:custom
  - id: mordheim-recipients
    roles:
    - grant
    operation: selectable_grant
    defender:
      band_id: pit-fighters
      profile_id: pit-king
    context:
      rule_id: band--pit-fighter-skill-body-slam
    expect:
      result.recipients:
      - dwarf-troll-slayer
      - pit-king
      - pit-veterans
  - id: trollheim-recipients
    roles:
    - grant
    operation: selectable_grant
    defender:
      collection: trollheim
      band_id: chaos-streets-pit-fighters
      profile_id: pit-king
    context:
      rule_id: band--pit-fighter-skill-body-slam
    expect:
      result.recipients:
      - dwarf-troll-slayer
      - pit-king
      - pit-veterans
  - id: accepted-ignores-weapon-strength
    roles:
    - active
    - consumer
    - sequence
    - consumption
    - boundary
    operation: pool
    attacker:
      skill_ids:
      - mechanic.body-slam
      main_weapon_id: weapon.double-handed-weapon
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 3
        attacks: 3
    defender:
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 4
        wounds: 3
        initiative: 3
        attacks: 1
    context:
      count: 3
      first_round: true
      charging: true
    decisions:
    - key: test.body-slam
      value: true
    rolls:
    - key: test.attack.0.hit
      value: 3
    - key: test.attack.0.wound
      value: 3
    expect:
      result.attacks.0.hit_target: 3
      result.attacks.0.hit: true
      result.attacks.0.wounded: false
  - id: critical-on-five
    roles:
    - active
    - boundary
    operation: pool
    attacker:
      skill_ids:
      - mechanic.body-slam
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 3
        attacks: 3
    defender:
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 4
        wounds: 3
        initiative: 3
        attacks: 1
    context:
      count: 3
      first_round: true
      charging: true
    decisions:
    - key: test.body-slam
      value: true
    rolls:
    - key: test.attack.0.hit
      value: 3
    - key: test.attack.0.wound
      value: 5
    - key: test.attack.0.critical
      value: 1
    expect:
      result.attacks.0.critical: true
      result.attacks.0.wounded: true
      result.attacks.0.damage: 2
  - id: declined-keeps-normal-pool
    roles:
    - inactive
    - sequence
    - boundary
    operation: pool
    attacker:
      skill_ids:
      - mechanic.body-slam
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 3
        attacks: 2
    context:
      count: 2
      first_round: true
      charging: true
    decisions:
    - key: test.body-slam
      value: false
    rolls:
    - key: test.attack.0.hit
      value: 1
    - key: test.attack.1.hit
      value: 1
    expect:
      result.attacks.0.hit: false
      result.attacks.1.hit: false
  - id: not-charging-no-replacement
    roles:
    - inactive
    - boundary
    operation: attacks
    attacker:
      skill_ids:
      - mechanic.body-slam
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 3
        attacks: 3
    context:
      first_round: true
      charging: false
    expect:
      result.attacks: 3
  mutations:
  - id: remove-body-slam
    path: attacker.global_effects.tags
    value: []
    cases:
    - accepted-ignores-weapon-strength
    - critical-on-five
