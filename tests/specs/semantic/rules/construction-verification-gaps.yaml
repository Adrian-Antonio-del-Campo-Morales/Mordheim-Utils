schema_version: 1
specifications:
- id: clarified-body-armours
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: local
  sources:
  - target: mechanic/armour.plate-armour
    digest: c0a774aaae3ffb6a35da2aece0172f37004ed5f5fe80e1416b5d4cb07f8524cc
  - target: mechanic/armour.wizard-s-robe
    digest: 5ee4cd47117fdcc626e72326950cd5657afea75c2c939c74a462ed4d2da7bb1e
  - target: mechanic/armour.ninja-robes
    digest: 78703dedc2b3157d2e13168ac6325670188c9f96fc485ff36c4a88f5c6210b7d
  - target: mechanic/armour.eshin-assassin-robes
    digest: d6c0411b119756b464a60b0fcd867650d790cbc337db9c1046b0c058cb257bde
  ruling: Plate Armour saves on 4+; Wizard's Robe and Eshin Assassin Robes save on 6+ and only combine
    with a helmet; Ninja Robes counts as Toughened Leathers.
  interpretation: The four armours occupy the body slot. Plate Armour can combine with a shield; its Movement
    penalty stays outside the duel. Wizard's and Eshin do not combine with shields. Ninja likewise does
    not combine with a shield, just like Toughened Leathers.
  cases:
  - id: plate-four-plus
    roles:
    - grant
    - active
    - consumer
    - boundary
    operation: armour
    attacker:
      main_weapon_id: weapon.mace
    defender:
      armour_id: armour.plate-armour
    distribution:
      observable: result.saved
      max_rolls: 1
      expected:
        'true': 1/2
        'false': 1/2
  - id: plate-and-shield
    roles:
    - compiled
    - accepted
    operation: compile
    defender:
      armour_id: armour.plate-armour
      off_hand_id: defence.shield
    expect:
      defender.armour_save: 3
  - id: wizard-six-plus
    roles:
    - active
    - consumer
    operation: armour
    attacker:
      main_weapon_id: weapon.mace
    defender:
      armour_id: armour.wizard-s-robe
    distribution:
      observable: result.saved
      max_rolls: 1
      expected:
        'true': 1/6
        'false': 5/6
  - id: wizard-helmet-allowed
    roles:
    - compiled
    - accepted
    operation: compile
    defender:
      armour_id: armour.wizard-s-robe
      defence_ids:
      - defence.helmet
    expect:
      defender.armour_save: 6
      defender.helmet_save: 4
  - id: wizard-shield-rejected
    roles:
    - rejected
    operation: compile
    defender:
      armour_id: armour.wizard-s-robe
      off_hand_id: defence.shield
    reject: cannot be combined with other armour except a helmet
  - id: ninja-six-plus
    roles:
    - active
    - consumer
    operation: armour
    attacker:
      main_weapon_id: weapon.mace
    defender:
      armour_id: armour.ninja-robes
    distribution:
      observable: result.saved
      max_rolls: 1
      expected:
        'true': 1/6
        'false': 5/6
  - id: ninja-shield-rejected
    roles:
    - rejected
    operation: compile
    defender:
      armour_id: armour.ninja-robes
      off_hand_id: defence.shield
    reject: toughened leathers cannot be combined with a shield
  - id: eshin-six-plus
    roles:
    - active
    - consumer
    operation: armour
    attacker:
      main_weapon_id: weapon.mace
    defender:
      armour_id: armour.eshin-assassin-robes
    distribution:
      observable: result.saved
      max_rolls: 1
      expected:
        'true': 1/6
        'false': 5/6
  - id: eshin-shield-rejected
    roles:
    - rejected
    operation: compile
    defender:
      armour_id: armour.eshin-assassin-robes
      off_hand_id: defence.shield
    reject: cannot be combined with other armour except a helmet
  - id: no-armour-control
    roles:
    - inactive
    operation: armour
    attacker:
      main_weapon_id: weapon.mace
    defender: {}
    expect:
      result.eligible: false
  mutations:
  - id: remove-plate-save
    path: defender.armour_save
    value: 7
    cases:
    - plate-four-plus
  - id: remove-wizard-save
    path: defender.armour_save
    value: 7
    cases:
    - wizard-six-plus
  - id: remove-ninja-save
    path: defender.armour_save
    value: 7
    cases:
    - ninja-six-plus
  - id: remove-eshin-save
    path: defender.armour_save
    value: 7
    cases:
    - eshin-six-plus
- id: quilted-silk-overlay-composition
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: construction
  sources:
  - target: mechanic/armour.cathayan-quilted-silk
    digest: a2023411032ff4b1c316adb9f2e748adc76b510ad377808fa24e996507a9f75a
  interpretation: Cathayan Quilted Silk occupies an overlay slot in defence_ids and improves any body
    armour by one point; it does not replace armour_id.
  cases:
  - id: no-body-armour
    roles:
    - compiled
    operation: compile
    attacker:
      defence_ids:
      - armour.cathayan-quilted-silk
    expect:
      attacker.armour_save: 6
  - id: light-armour-combination
    roles:
    - active
    - consumer
    - boundary
    - accepted
    - grant
    operation: armour
    attacker:
      main_weapon_id: weapon.mace
    defender:
      armour_id: armour.light-armour
      defence_ids:
      - armour.cathayan-quilted-silk
    distribution:
      observable: result.saved
      max_rolls: 1
      expected:
        'true': 1/3
        'false': 2/3
  - id: cannot-use-body-slot
    roles:
    - rejected
    operation: compile
    attacker:
      armour_id: armour.cathayan-quilted-silk
    reject: Cathayan quilted silk is an armour overlay
  mutations:
  - id: remove-silk-bonus
    path: defender.armour_save
    value: 7
    cases:
    - light-armour-combination
- id: sea-dragon-cloak-close-combat
  question: How is Sea Dragon Cloak calculated and which protections can it combine with?
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: local
  sources:
  - target: mechanic/defence.sea-dragon-cloak
    digest: 77a74ffcdcd21c50bf80ecb2275b79c457128bcb596e0ec8857bb7222b8197ab
  ruling: Sea Dragon Cloak saves on 5+ in combat and on 4+ against shooting, and cannot combine with other
    armour.
  interpretation: The duel runtime verifies the 5+ in combat and rejects body armour, shields and helmets.
    The shooting branch is outside the current scope.
  cases:
  - id: close-combat-five-plus
    roles:
    - grant
    - compiled
    - active
    - consumer
    - boundary
    operation: armour
    attacker:
      main_weapon_id: weapon.mace
    defender:
      defence_ids:
      - defence.sea-dragon-cloak
    distribution:
      observable: result.saved
      max_rolls: 1
      expected:
        'true': 1/3
        'false': 2/3
  - id: body-armour-rejected
    roles:
    - rejected
    operation: compile
    defender:
      armour_id: armour.light-armour
      defence_ids:
      - defence.sea-dragon-cloak
    reject: Sea Dragon cloak cannot be combined with other armour
  - id: shield-rejected
    roles:
    - rejected
    operation: compile
    defender:
      off_hand_id: defence.shield
      defence_ids:
      - defence.sea-dragon-cloak
    reject: Sea Dragon cloak cannot be combined with other armour
  - id: helmet-rejected
    roles:
    - rejected
    operation: compile
    defender:
      defence_ids:
      - defence.sea-dragon-cloak
      - defence.helmet
    reject: Sea Dragon cloak cannot be combined with other armour
  - id: no-cloak-control
    roles:
    - inactive
    operation: armour
    attacker:
      main_weapon_id: weapon.mace
    defender: {}
    expect:
      result.eligible: false
  mutations:
  - id: remove-cloak-save
    path: defender.armour_save
    value: 7
    cases:
    - close-combat-five-plus
- id: kite-shield-mounted-context
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: contextual
  sources:
  - target: mechanic/defence.kite-shield
    digest: 226d91de1fe7cd4c6d1c913be505ecb4fe685fb6f0438cbca581fe60d49c383b
  interpretation: Kite Shield improves the save by two points on foot and by one when mounted is true;
    the compiler always caps the final save at 1+.
  cases:
  - id: compiled-on-foot
    roles:
    - compiled
    operation: compile
    defender:
      off_hand_id: defence.kite-shield
    expect:
      defender.armour_save: 5
  - id: on-foot
    roles:
    - active
    - consumer
    operation: armour
    attacker:
      main_weapon_id: weapon.mace
    defender:
      off_hand_id: defence.kite-shield
    distribution:
      observable: result.saved
      max_rolls: 1
      expected:
        'true': 1/3
        'false': 2/3
  - id: mounted
    roles:
    - context
    - boundary
    operation: armour
    attacker:
      main_weapon_id: weapon.mace
    defender:
      off_hand_id: defence.kite-shield
      mounted: true
    distribution:
      observable: result.saved
      max_rolls: 1
      expected:
        'true': 1/6
        'false': 5/6
  - id: ordinary-shield-control
    roles:
    - inactive
    operation: armour
    attacker:
      main_weapon_id: weapon.mace
    defender:
      off_hand_id: defence.shield
      mounted: true
    distribution:
      observable: result.saved
      max_rolls: 1
      expected:
        'true': 1/6
        'false': 5/6
  mutations:
  - id: remove-kite-save
    path: defender.armour_save
    value: 7
    cases:
    - on-foot
    - mounted
- id: energy-focus-choice-convention-conflict
  question: Does Energy Focus keep the choice of how many attacks to sacrifice, or must the canonical
    convention of sacrificing all but one be applied?
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: contextual
  sources:
  - target: mechanic/mechanic.energy-focus
    digest: c4aa958f8460fdc2e4337f7eb0932030ec67d4ebdd4996d988bff77a25ff0773
  - target: rule/mordheim/battle-monks-of-cathay/band--battle-monks-special-skills-energy-focus/compiler.energy-focus
    digest: b4abde1953b661d07bbabf37ee3e05189b76bf71210354863d9110991d9f9f64
  ruling: Energy Focus allows selecting any number of attacks, including zero or all of the profile's
    attacks.
  interpretation: Battle Monks Special Skills / Energy Focus allows choosing any amount between zero and
    the profile's Attacks. Each sacrificed attack reduces A by one and grants +1 Strength while the monk
    fights unarmed. The historical convention of always keeping one attack was a simplification and is
    not part of the RAW.
  cases:
  - id: compiled-selection
    roles:
    - compiled
    operation: compile
    attacker:
      band_id: battle-monks-of-cathay
      profile_id: dragon-monks
      special_rule_ids:
      - band--battle-monks-special-skills-energy-focus
      energy_focus_attacks: 2
      characteristics:
        weapon_skill: 4
        strength: 3
        toughness: 3
        wounds: 1
        initiative: 4
        attacks: 4
    expect:
      attacker.global_effects.energy_focus_attacks: 2
  - id: selectable-recipients
    roles:
    - grant
    operation: selectable_grant
    defender:
      band_id: battle-monks-of-cathay
      profile_id: dragon-monks
    context:
      rule_id: band--battle-monks-special-skills-energy-focus
    expect:
      result.recipients:
      - dragon-monks
  - id: zero-attacks-sacrificed
    roles:
    - inactive
    - boundary
    operation: attacks
    attacker:
      band_id: battle-monks-of-cathay
      profile_id: dragon-monks
      special_rule_ids:
      - band--battle-monks-special-skills-energy-focus
      energy_focus_attacks: 0
      characteristics:
        weapon_skill: 4
        strength: 3
        toughness: 3
        wounds: 1
        initiative: 4
        attacks: 4
    expect:
      result.attacks: 4
  - id: partial-sacrifice-attacks
    roles:
    - active
    - consumer
    operation: attacks
    attacker:
      band_id: battle-monks-of-cathay
      profile_id: dragon-monks
      special_rule_ids:
      - band--battle-monks-special-skills-energy-focus
      energy_focus_attacks: 2
      characteristics:
        weapon_skill: 4
        strength: 3
        toughness: 3
        wounds: 1
        initiative: 4
        attacks: 4
    expect:
      result.attacks: 2
  - id: partial-sacrifice-strength
    roles:
    - active
    - consumer
    operation: strength
    attacker:
      band_id: battle-monks-of-cathay
      profile_id: dragon-monks
      special_rule_ids:
      - band--battle-monks-special-skills-energy-focus
      energy_focus_attacks: 2
      characteristics:
        weapon_skill: 4
        strength: 3
        toughness: 3
        wounds: 1
        initiative: 4
        attacks: 4
    expect:
      result.wound: 5
      result.armour: 5
  - id: sacrifice-all
    roles:
    - active
    - boundary
    - consumer
    operation: attacks
    attacker:
      band_id: battle-monks-of-cathay
      profile_id: dragon-monks
      special_rule_ids:
      - band--battle-monks-special-skills-energy-focus
      energy_focus_attacks: 4
      characteristics:
        weapon_skill: 4
        strength: 3
        toughness: 3
        wounds: 1
        initiative: 4
        attacks: 4
    expect:
      result.attacks: 0
  - id: too-many-rejected
    roles:
    - rejected
    - boundary
    operation: selection_choices
    attacker:
      band_id: battle-monks-of-cathay
      profile_id: dragon-monks
      special_rule_ids:
      - band--battle-monks-special-skills-energy-focus
      characteristics:
        weapon_skill: 4
        strength: 3
        toughness: 3
        wounds: 1
        initiative: 4
        attacks: 4
    context:
      choices:
        maximum:
          energy_focus_attacks: 4
        excessive:
          energy_focus_attacks: 5
    expect:
      result.accepted:
      - maximum
      result.rejected:
        excessive: Energy Focus cannot sacrifice more Attacks than the profile has
  - id: armed-inactive
    roles:
    - inactive
    operation: strength
    attacker:
      main_weapon_id: weapon.mace
      skill_ids:
      - mechanic.energy-focus
      energy_focus_attacks: 2
      characteristics:
        weapon_skill: 4
        strength: 3
        toughness: 3
        wounds: 1
        initiative: 4
        attacks: 4
    expect:
      result.wound: 3
      result.armour: 3
  mutations:
  - id: remove-selected-sacrifice
    path: attacker.global_effects.energy_focus_attacks
    value: 0
    cases:
    - partial-sacrifice-attacks
    - partial-sacrifice-strength
