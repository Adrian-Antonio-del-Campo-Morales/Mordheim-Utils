- id: armour.light-armour
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: permanent
  sources:
  - target: mechanic/armour.light-armour
    digest: 7f9131975a9637daa33dcc73b8fa92201b9ed6daf7c1f5161cf89b34e2e53701
  interpretation: The written body armour save is 6+. Against Strength 3 there is no Strength modifier;
    Strength 4 worsens the required roll by one. Movement clauses are outside the duel scope.
  cases:
  - id: compiled
    roles:
    - compiled
    operation: compile
    defender:
      armour_id: armour.light-armour
    expect:
      defender.armour_save: 6
  - id: all-d6-faces
    roles:
    - consumer
    - boundary
    operation: armour
    attacker:
      main_weapon_id: weapon.mace
    defender:
      armour_id: armour.light-armour
    distribution:
      observable: result.saved
      max_rolls: 1
      expected:
        'true': 1/6
        'false': 5/6
  - id: strength-modifier
    roles:
    - consumer
    - boundary
    operation: armour
    attacker:
      main_weapon_id: weapon.mace
      characteristics:
        weapon_skill: 3
        strength: 4
        toughness: 3
        wounds: 3
        initiative: 3
        attacks: 1
    defender:
      armour_id: armour.light-armour
    rolls: []
    expect:
      result.target: 7
      result.saved: false
  mutations:
  - id: wrong-base-save
    path: defender.armour_save
    value: 5
    cases:
    - all-d6-faces
    - strength-modifier
  interaction_contract:
    reads:
    - armour.strength
    - attack.penetration
    - armour.allowed
    writes:
    - armour.target
