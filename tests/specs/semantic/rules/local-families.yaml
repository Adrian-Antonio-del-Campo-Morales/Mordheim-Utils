- id: skill.step-aside
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: local
  sources:
  - target: mechanic/skill.step-aside
    digest: fa330a0a851b02a64dd8b68e9335a115de376506dcd77d84afde7782a723c6e1
  interpretation: The written special save succeeds on 5+ independently of armour. Its absence grants
    no such save.
  cases:
  - id: compiled
    roles:
    - compiled
    operation: compile
    defender:
      skill_ids:
      - skill.step-aside
    expect:
      defender.global_effects.step_aside: true
  - id: all-d6-faces
    roles:
    - active
    - boundary
    - consumer
    operation: special_save
    defender:
      skill_ids:
      - skill.step-aside
    distribution:
      observable: result.saved
      max_rolls: 1
      expected:
        'true': 2/6
        'false': 4/6
  - id: absent
    roles:
    - inactive
    operation: special_save
    expect:
      result.saved: false
      result.ward_roll: null
      result.regeneration_roll: null
  mutations:
  - id: remove-save
    path: defender.global_effects.step_aside
    value: false
    cases:
    - all-d6-faces
  interaction_contract:
    reads:
    - damage.wound
    writes:
    - damage.unsaved
