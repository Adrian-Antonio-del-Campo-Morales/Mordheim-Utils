- id: skill.step-aside
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: local
  sources:
  - target: mechanic/skill.step-aside
    digest: 5d13b2da5ffcebb62bed12ad75da22af778a3632ed069dfc66ce4162d656eaaa
  interpretation: The written special save succeeds on 5+ independently of armour. Its absence grants
    no such save.
  cases:
  - id: compiled
    roles:
    - compiled
    operation: compile
    defender:
      skill_ids:
      - skill.step-aside
    expect:
      defender.global_effects.step_aside: true
  - id: all-d6-faces
    roles:
    - active
    - boundary
    - consumer
    operation: special_save
    defender:
      skill_ids:
      - skill.step-aside
    distribution:
      observable: result.saved
      max_rolls: 1
      expected:
        'true': 2/6
        'false': 4/6
  - id: absent
    roles:
    - inactive
    operation: special_save
    expect:
      result.saved: false
      result.ward_roll: null
      result.regeneration_roll: null
  mutations:
  - id: remove-save
    path: defender.global_effects.step_aside
    value: false
    cases:
    - all-d6-faces
  interaction_contract:
    reads:
    - damage.wound
    writes:
    - damage.unsaved
