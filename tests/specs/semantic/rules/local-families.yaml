- id: skill.infinite-hatred
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: local
  sources:
  - target: mechanic/skill.infinite-hatred
    digest: 1d5e211bd8c705167bde654adf528fcd7852e194d3f28c316e5f2069a4cbd5e7
  interpretation: Re-roll failed rolls once. With a base 4+ target, success is 3/4. A first-roll success
    consumes no second roll.
  cases:
  - id: compiled
    roles:
    - compiled
    operation: compile
    attacker:
      main_weapon_id: weapon.mace
      skill_ids:
      - skill.infinite-hatred
    expect:
      attacker.global_effects.reroll_hits: true
  - id: all-branches
    roles:
    - active
    - boundary
    - consumer
    operation: hit
    attacker:
      main_weapon_id: weapon.mace
      skill_ids:
      - skill.infinite-hatred
    distribution:
      observable: result.success
      max_rolls: 2
      expected:
        'true': 3/4
        'false': 1/4
  - id: no-reroll-on-success
    roles:
    - inactive
    operation: hit
    attacker:
      main_weapon_id: weapon.mace
      skill_ids:
      - skill.infinite-hatred
    rolls:
    - key: hit
      value: 4
    expect:
      result.success: true
      result.rerolled: false
  mutations:
  - id: remove-reroll
    path: attacker.global_effects.reroll_hits
    value: false
    cases:
    - all-branches
  interaction_contract:
    reads:
    - hit.target
    writes:
    - hit.success
    - hit.rolls
