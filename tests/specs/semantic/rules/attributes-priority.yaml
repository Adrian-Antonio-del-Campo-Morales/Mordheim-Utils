schema_version: 1
specifications:
- id: skill.red-fury
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: permanent
  sources:
  - target: mechanic/skill.red-fury
    digest: 409eba12f269da908e1a0d3b1d9932d6ba46e539076d9559e56dac3bfe08d928
  interpretation: The rule adds one Attack to the profile, not a multiplier.
  interaction_contract:
    reads:
    - fighter.attacks
    writes:
    - attack.count
  cases:
  - id: compiled
    roles:
    - compiled
    operation: compile
    attacker:
      skill_ids:
      - skill.red-fury
      main_weapon_id: weapon.mace
    expect:
      attacker.global_effects.attacks_bonus: 1
  - id: one-base
    roles:
    - consumer
    - boundary
    operation: attacks
    attacker:
      skill_ids:
      - skill.red-fury
      main_weapon_id: weapon.mace
    expect:
      result.attacks: 2
  - id: two-base
    roles:
    - boundary
    operation: attacks
    attacker:
      skill_ids:
      - skill.red-fury
      main_weapon_id: weapon.mace
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 3
        attacks: 2
    expect:
      result.attacks: 3
  mutations:
  - id: remove-extra-attack
    path: attacker.global_effects.attacks_bonus
    value: 0
    cases:
    - one-base
    - two-base
