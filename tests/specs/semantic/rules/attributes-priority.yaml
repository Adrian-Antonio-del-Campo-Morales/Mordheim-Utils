    expect:
      attacker.characteristics.weapon_skill: 3
    expect_contains:
      attacker.global_effects.tags:
      - skill.hatred
  - id: active-all-faces
    roles:
    - active
    - boundary
    - consumer
    operation: hit
    attacker:
      skill_ids:
      - skill.hatred
      main_weapon_id: weapon.mace
    context:
      first_round: true
    distribution:
      observable: result.success
      max_rolls: 2
      expected:
        'true': 3/4
        'false': 1/4
  - id: inactive-all-faces
    roles:
    - inactive
    operation: hit
    attacker:
      skill_ids:
      - skill.hatred
      main_weapon_id: weapon.mace
    context:
      first_round: false
    distribution:
      observable: result.success
      max_rolls: 1
      expected:
        'true': 1/2
        'false': 1/2
  mutations:
  - id: remove-contextual-effect
    changes:
    - path: attacker.global_effects.tags
      value: []
    - path: attacker.global_effects.charge_reroll_hits
      value: false
    cases:
    - active-all-faces
