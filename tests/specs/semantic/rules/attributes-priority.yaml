- id: skill.unstoppable-charge
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: contextual
  sources:
  - target: mechanic/skill.unstoppable-charge
    digest: 339cd5775e3c592a76f612ee1e1f2320825fe1b8e9a326e1950df2685b7fb943
  interpretation: A charge grants +1 Weapon Skill, changing WS3 versus WS3 from a 4+ hit to 3+. Without
    charging WS is unchanged.
  interaction_contract:
    reads:
    - round.charging
    - fighter.weapon_skill
    - defender.weapon_skill
    writes:
    - hit.target
  cases:
  - id: compiled
    roles:
    - compiled
    operation: compile
    attacker:
      skill_ids:
      - skill.unstoppable-charge
      main_weapon_id: weapon.mace
    expect:
      attacker.global_effects.charge_ws_bonus: 1
  - id: charge
    roles:
    - active
    - consumer
    - boundary
    operation: hit
    attacker:
      skill_ids:
      - skill.unstoppable-charge
      main_weapon_id: weapon.mace
    context:
      first_round: true
      charging: true
    rolls:
    - key: hit
      value: 3
    expect:
      context.attacker_ws: 4
      result.target: 3
      result.success: true
  - id: not-charging
    roles:
    - inactive
    operation: hit
    attacker:
      skill_ids:
      - skill.unstoppable-charge
      main_weapon_id: weapon.mace
    context:
      first_round: true
    rolls:
    - key: hit
      value: 3
    expect:
      context.attacker_ws: 3
      result.target: 4
      result.success: false
  mutations:
  - id: remove-charge-ws
    path: attacker.global_effects.charge_ws_bonus
    value: 0
    cases:
    - charge
- id: skill.monster-slayer
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: local
  sources:
  - target: mechanic/skill.monster-slayer
    digest: 5dc089e9b8e8312933dffbb7a0ec436b1f47099c7167a71794206fda7c98a4b1
  interpretation: The wound target is no worse than 4+, while naturally easier targets are retained.
  interaction_contract:
    reads:
    - attack.strength
    - defender.toughness
    writes:
    - wound.target
  cases:
  - id: compiled
    roles:
    - compiled
    operation: compile
    attacker:
      skill_ids:
      - skill.monster-slayer
      main_weapon_id: weapon.mace
    expect:
      attacker.characteristics.strength: 3
    expect_contains:
      attacker.global_effects.tags:
      - skill.monster-slayer
  - id: otherwise-impossible
    roles:
    - active
    - consumer
    - boundary
    operation: wound
    attacker:
      skill_ids:
      - skill.monster-slayer
      main_weapon_id: weapon.mace
      characteristics:
        weapon_skill: 3
        strength: 1
        toughness: 3
        wounds: 3
        initiative: 3
        attacks: 1
    defender:
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 6
        wounds: 3
        initiative: 3
        attacks: 1
    distribution:
      observable: result.success
      max_rolls: 1
      expected:
        'true': 1/2
        'false': 1/2
  - id: easier-target-unchanged
    roles:
    - inactive
    - boundary
    operation: wound
    attacker:
      skill_ids:
      - skill.monster-slayer
      main_weapon_id: weapon.mace
      characteristics:
        weapon_skill: 3
        strength: 5
        toughness: 3
        wounds: 3
        initiative: 3
        attacks: 1
    distribution:
      observable: result.success
      max_rolls: 1
      expected:
        'true': 5/6
        'false': 1/6
  mutations:
  - id: remove-cap
    changes:
    - path: attacker.global_effects.tags
      value: []
    - path: attacker.global_effects.maximum_wound_target
      value: 7
    cases:
    - otherwise-impossible
- id: skill.always-strikes-first
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: priority
  sources:
  - target: mechanic/skill.always-strikes-first
    digest: ded49af1868c23b058e0f990ada7e2aacf606b2c9ad3acfe0cb5ab8dfa74cff7
  interpretation: Strike-first acts before ordinary attacks regardless of the ordinary attacker's higher
    Initiative.
  interaction_contract:
    reads:
    - round.charged
    - fighter.initiative
    writes:
    - priority.tier
  cases:
  - id: compiled
    roles:
    - compiled
    operation: compile
    attacker:
      skill_ids:
      - skill.always-strikes-first
      main_weapon_id: weapon.mace
    expect:
      attacker.characteristics.initiative: 3
    expect_contains:
      attacker.global_effects.tags:
      - skill.always-strikes-first
  - id: active
    roles:
    - active
    - consumer
    operation: acting_order
    attacker:
      skill_ids:
      - skill.always-strikes-first
      main_weapon_id: weapon.mace
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 1
        attacks: 1
    defender:
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 6
        attacks: 1
    context: {}
    opponent_context: {}
    expect:
      result.first_acts: true
  - id: ordinary-without-skill
    roles:
    - inactive
    operation: acting_order
    attacker:
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 1
        attacks: 1
    defender:
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 6
        attacks: 1
    expect:
      result.first_acts: false
  - id: tie-all-dice
    roles:
    - boundary
    operation: acting_order
    attacker:
      skill_ids:
      - skill.always-strikes-first
      main_weapon_id: weapon.mace
    defender:
      skill_ids:
      - skill.always-strikes-first
      main_weapon_id: weapon.mace
    context: {}
    opponent_context: {}
    distribution:
      observable: result.first_acts
      max_rolls: 1
      expected:
        'true': 1/2
        'false': 1/2
  mutations:
  - id: remove-priority
    changes:
    - path: attacker.global_effects.tags
      value: []
    - path: attacker.global_effects.priority
      value: 0
    cases:
    - active
