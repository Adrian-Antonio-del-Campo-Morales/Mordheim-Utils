- id: skill.monstrous
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: permanent
  sources:
  - target: mechanic/skill.monstrous
    digest: 0aa319f50c5d2c8de074ddd71b27a19fa93b94d7d7c6204e79f8c839a36d3d57
  interpretation: Add one Wound to the fighter's initial wounds for the duel.
  interaction_contract:
    reads:
    - fighter.wounds
    writes:
    - state.wounds
  cases:
  - id: compiled
    roles:
    - compiled
    operation: compile
    attacker:
      skill_ids:
      - skill.monstrous
      main_weapon_id: weapon.mace
    expect:
      attacker.characteristics.wounds: 3
    expect_contains:
      attacker.global_effects.tags:
      - skill.monstrous
  - id: three-to-four
    roles:
    - consumer
    operation: initialize
    attacker:
      skill_ids:
      - skill.monstrous
      main_weapon_id: weapon.mace
    expect:
      result.attacker.wounds: 4
  - id: one-to-two
    roles:
    - boundary
    operation: initialize
    attacker:
      skill_ids:
      - skill.monstrous
      main_weapon_id: weapon.mace
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 1
        initiative: 3
        attacks: 1
    expect:
      result.attacker.wounds: 2
  mutations:
  - id: remove-wound
    path: attacker.global_effects.tags
    value: []
    cases:
    - three-to-four
    - one-to-two
- id: skill.strength-of-steel
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: contextual
  sources:
  - target: mechanic/skill.strength-of-steel
    digest: ea9f63739dda008a1c6dab42433f75ec791e481908eda7e20e726fb18d722347
  interpretation: Charging grants +1 Strength. Outside the charge the ordinary Strength is unchanged.
  interaction_contract:
    reads:
    - round.charging
    - fighter.strength
    writes:
    - attack.strength
    - armour.strength
  cases:
  - id: compiled
    roles:
    - compiled
    operation: compile
    attacker:
      skill_ids:
      - skill.strength-of-steel
      main_weapon_id: weapon.mace
    expect:
      attacker.global_effects.charge_strength_bonus: 1
  - id: charge
    roles:
    - active
    - consumer
    operation: strength
    attacker:
      skill_ids:
      - skill.strength-of-steel
      main_weapon_id: weapon.mace
    context:
      first_round: true
      charging: true
    expect:
      result.wound: 4
      result.armour: 4
  - id: not-charging
    roles:
    - inactive
    operation: strength
    attacker:
      skill_ids:
      - skill.strength-of-steel
      main_weapon_id: weapon.mace
    context:
      first_round: true
    expect:
      result.wound: 3
      result.armour: 3
  - id: base-one
    roles:
    - boundary
    operation: strength
    attacker:
      skill_ids:
      - skill.strength-of-steel
      main_weapon_id: weapon.mace
      characteristics:
        weapon_skill: 3
        strength: 1
        toughness: 3
        wounds: 3
        initiative: 3
        attacks: 1
    context:
      first_round: true
      charging: true
    expect:
      result.wound: 2
      result.armour: 2
  mutations:
  - id: remove-charge-bonus
    path: attacker.global_effects.charge_strength_bonus
    value: 0
    cases:
    - charge
- id: skill.resilient
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: contextual
  sources:
  - target: mechanic/skill.resilient
    digest: 849c6b30b6927260b285a6eff26cca9fc16a6f23563f4a179277466538c0d43a
  interpretation: Incoming hits lose one Strength for wounding, minimum one. Armour modifiers use the
    unmodified attacking Strength.
  interaction_contract:
    reads:
    - attack.strength
    writes:
    - wound.target
  cases:
  - id: compiled
    roles:
    - compiled
    operation: compile
    defender:
      skill_ids:
      - skill.resilient
      main_weapon_id: weapon.mace
    expect:
      defender.global_effects.incoming_strength_modifier: -1
  - id: strength-split
    roles:
    - active
    - consumer
    operation: strength
    attacker:
      main_weapon_id: weapon.mace
      characteristics:
        weapon_skill: 3
        strength: 4
        toughness: 3
        wounds: 3
        initiative: 3
        attacks: 1
    defender:
      skill_ids:
      - skill.resilient
      main_weapon_id: weapon.mace
    expect:
      result.wound: 3
      result.armour: 4
  - id: minimum-one
    roles:
    - boundary
    operation: strength
    attacker:
      main_weapon_id: weapon.mace
      characteristics:
        weapon_skill: 3
        strength: 1
        toughness: 3
        wounds: 3
        initiative: 3
        attacks: 1
    defender:
      skill_ids:
      - skill.resilient
      main_weapon_id: weapon.mace
    expect:
      result.wound: 1
      result.armour: 1
  - id: no-resilience
    roles:
    - inactive
    operation: strength
    attacker:
      main_weapon_id: weapon.mace
      characteristics:
        weapon_skill: 3
        strength: 4
        toughness: 3
        wounds: 3
        initiative: 3
        attacks: 1
    expect:
      result.wound: 4
      result.armour: 4
  mutations:
  - id: remove-incoming-penalty
    path: defender.global_effects.incoming_strength_modifier
    value: 0
    cases:
    - strength-split
- id: skill.berserker
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: contextual
  sources:
  - target: mechanic/skill.berserker
    digest: 1c45833cdbae7ea54313ed743f66ebb7fc499d4333aeb2b7e7e5d14372a0409c
  interpretation: The charging bonus is +1 to hit, not +1 Weapon Skill. It changes an ordinary 4+ to 3+
    only while charging.
  interaction_contract:
    reads:
    - round.charging
    - hit.target
    writes:
    - hit.target
  cases:
  - id: compiled
    roles:
    - compiled
    operation: compile
    attacker:
      skill_ids:
      - skill.berserker
      main_weapon_id: weapon.mace
    expect:
      attacker.characteristics.weapon_skill: 3
    expect_contains:
      attacker.global_effects.tags:
      - skill.berserker
  - id: active-all-faces
    roles:
    - active
    - boundary
    - consumer
    operation: hit
    attacker:
      skill_ids:
      - skill.berserker
      main_weapon_id: weapon.mace
    context:
      charging: true
    distribution:
      observable: result.success
      max_rolls: 1
      expected:
        'true': 2/3
        'false': 1/3
  - id: inactive-all-faces
    roles:
    - inactive
    operation: hit
    attacker:
      skill_ids:
      - skill.berserker
      main_weapon_id: weapon.mace
    context:
      charging: false
    distribution:
      observable: result.success
      max_rolls: 1
      expected:
        'true': 1/2
        'false': 1/2
  mutations:
  - id: remove-contextual-effect
    changes:
    - path: attacker.global_effects.tags
      value: []
    - path: attacker.global_effects.charge_reroll_hits
      value: false
    cases:
    - active-all-faces
