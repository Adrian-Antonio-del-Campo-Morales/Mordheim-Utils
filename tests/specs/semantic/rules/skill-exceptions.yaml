    operation: attack
    attacker:
      main_weapon_id: weapon.sword
    defender:
      skill_ids:
      - skill.jump-up
      defence_ids:
      - defence.helmet
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 1
        initiative: 3
        attacks: 1
    rolls:
    - key: test.hit
      value: 4
    - key: test.wound
      value: 4
    - key: test.injury.0
      value: 3
    - key: test.helmet
      value: 3
    expect:
      result.defender.condition: STUNNED
  - id: helmet-4
    roles:
    - boundary
    - sequence
    operation: attack
    attacker:
      main_weapon_id: weapon.sword
    defender:
      skill_ids:
      - skill.jump-up
      defence_ids:
      - defence.helmet
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
