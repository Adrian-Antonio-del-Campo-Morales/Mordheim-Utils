    defender:
      skill_ids:
      - skill.jump-up
      - skill.ignore-pain
    rolls:
    - key: test.injury
      value: 4
    expect:
      result.condition: KNOCKED_DOWN
  - id: ordinary-5
    roles:
    - active
    - boundary
    - consumer
    operation: injury
    attacker:
      main_weapon_id: weapon.sword
    defender:
      skill_ids:
      - skill.jump-up
    rolls:
    - key: test.injury
      value: 5
    expect:
      result.condition: OUT
  - id: no-pain-5
    roles:
    - boundary
    operation: injury
    attacker:
      main_weapon_id: weapon.sword
    defender:
      skill_ids:
      - skill.jump-up
      - skill.ignore-pain
    rolls:
    - key: test.injury
      value: 5
    expect:
