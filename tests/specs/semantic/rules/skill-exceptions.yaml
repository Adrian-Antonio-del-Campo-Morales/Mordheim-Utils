schema_version: 1
specifications:
- id: skill.jump-up
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: local
  sources:
  - target: mechanic/skill.jump-up
    digest: bd0549a145021fce8abf6155da85b25ee905d7aeee2aed09bb371fdf1ef51ea2
  interpretation: 'Reviewed Skills / Jump Up (Mordheimer, 2026-08-30): ordinary injury knockdown is ignored;
    conversion from No Pain or a successful helmet save is not. Raw 1-2 still recovers immediately when
    No Pain is present.'
  interaction_contract:
    reads:
    - injury.condition
    - injury.origin
    writes:
    - injury.condition
  cases:
  - id: compiled
    roles:
    - compiled
    operation: compile
    defender:
      skill_ids:
      - skill.jump-up
    expect:
      defender.global_effects.tags:
      - skill.jump-up
      - armour.no-armour
  - id: ordinary-1
    roles:
    - active
    - boundary
    - consumer
    operation: injury
    attacker:
      main_weapon_id: weapon.sword
    defender:
      skill_ids:
      - skill.jump-up
    rolls:
    - key: test.injury
      value: 1
    expect:
      result.condition: STANDING
  - id: no-pain-1
    roles:
    - boundary
    operation: injury
    attacker:
      main_weapon_id: weapon.sword
    defender:
      skill_ids:
      - skill.jump-up
      - skill.ignore-pain
    rolls:
    - key: test.injury
      value: 1
    expect:
      result.condition: STANDING
  - id: ordinary-2
    roles:
    - active
    - boundary
    - consumer
    operation: injury
    attacker:
      main_weapon_id: weapon.sword
    defender:
      skill_ids:
      - skill.jump-up
    rolls:
    - key: test.injury
      value: 2
    expect:
      result.condition: STANDING
  - id: no-pain-2
    roles:
    - boundary
    operation: injury
    attacker:
      main_weapon_id: weapon.sword
    defender:
      skill_ids:
      - skill.jump-up
      - skill.ignore-pain
    rolls:
    - key: test.injury
      value: 2
    expect:
      result.condition: STANDING
  - id: ordinary-3
    roles:
    - active
    - boundary
    - consumer
    operation: injury
    attacker:
      main_weapon_id: weapon.sword
    defender:
      skill_ids:
      - skill.jump-up
    rolls:
    - key: test.injury
      value: 3
    expect:
      result.condition: STUNNED
  - id: no-pain-3
    roles:
