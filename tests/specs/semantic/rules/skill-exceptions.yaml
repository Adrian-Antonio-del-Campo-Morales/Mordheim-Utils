    rolls:
    - key: test.hit
      value: 4
    - key: test.wound
      value: 4
    - key: test.injury.0
      value: 3
    - key: test.helmet
      value: 5
    expect:
      result.defender.condition: KNOCKED_DOWN
  - id: helmet-6
    roles:
