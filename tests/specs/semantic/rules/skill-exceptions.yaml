        initiative: 3
        attacks: 1
    rolls:
    - key: test.hit
      value: 4
    - key: test.wound
      value: 4
    - key: test.injury.0
      value: 3
    - key: test.helmet
      value: 2
    expect:
      result.defender.condition: STUNNED
  - id: helmet-3
    roles:
    - boundary
