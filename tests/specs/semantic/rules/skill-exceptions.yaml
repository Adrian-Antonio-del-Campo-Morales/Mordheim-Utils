    rolls:
    - key: test.hit
      value: 4
    - key: test.wound
      value: 4
    - key: test.injury.0
      value: 3
    - key: test.helmet
      value: 4
    expect:
      result.defender.condition: KNOCKED_DOWN
  - id: helmet-5
    roles:
    - boundary
    - sequence
    operation: attack
    attacker:
      main_weapon_id: weapon.sword
    defender:
      skill_ids:
      - skill.jump-up
      defence_ids:
      - defence.helmet
      characteristics:
        weapon_skill: 3
