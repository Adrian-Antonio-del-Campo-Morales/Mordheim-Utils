schema_version: 1
specifications:
- id: preparation-crimson-shade
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: contextual
  sources:
  - target: mechanic/preparation.crimson-shade
    digest: 4b35e04352deb89051f7541cbc9e2399cb391d38e6ed8f46ef02cc6293c80ea8
  interpretation: Crimson Shade grants +1 Strength for the whole combat and adds a single D3 roll to Initiative
    when initialising the fighter.
  cases:
  - id: compiled-and-strength
    roles:
    - compiled
    - active
    - consumer
    operation: strength
    attacker:
      main_weapon_id: weapon.mace
      preparation_ids:
      - preparation.crimson-shade
    rolls:
    - key: a.crimson-shade
      sides: 3
      value: 1
    expect:
      attacker.global_effects.strength_bonus: 1
      result.wound: 4
      result.armour: 4
    expect_contains:
      attacker.global_effects.tags:
      - preparation.crimson-shade
  - id: initiative-minimum
    roles:
    - active
    - boundary
    operation: initialize
    attacker:
      main_weapon_id: weapon.mace
      preparation_ids:
      - preparation.crimson-shade
    rolls:
    - key: a.crimson-shade
      sides: 3
      value: 1
    expect:
      result.attacker.initiative: 4
  - id: initiative-maximum
    roles:
    - boundary
    operation: initialize
    attacker:
      main_weapon_id: weapon.mace
      preparation_ids:
      - preparation.crimson-shade
    rolls:
    - key: a.crimson-shade
      sides: 3
      value: 3
    expect:
      result.attacker.initiative: 6
  - id: absent
    roles:
    - inactive
    operation: initialize
    attacker:
      main_weapon_id: weapon.mace
    expect:
      result.attacker.initiative: 3
      result.attacker.strength: 3
  mutations:
  - id: remove-strength
    path: attacker.global_effects.strength_bonus
    value: 0
    cases:
    - compiled-and-strength
  - id: remove-initiative
    path: attacker.global_effects.tags
    value: []
    cases:
    - initiative-minimum
    - initiative-maximum
- id: poison-nightshade
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: stateful
  sources:
  - target: mechanic/poison.nightshade
    digest: ab5ed5a96a4272ed60b7483bbfadbaed5cc7cdfab08ae234f48eae8831c21a8e
  interpretation: Each unsaved wound with Nightshade reduces the defender's Initiative by one; poison
    immunity prevents the reduction.
  cases:
  - id: compiled
    roles:
    - compiled
    operation: compile
    attacker:
      main_weapon_id: weapon.mace
      main_poison_id: poison.nightshade
    expect:
      attacker.main_weapon.strength_bonus: 0
    expect_contains:
      attacker.main_weapon.tags:
      - poison.nightshade
  - id: unsaved-wound
    roles:
    - active
    - sequence
    - consumption
    - boundary
    operation: attack
    attacker:
      main_weapon_id: weapon.mace
      main_poison_id: poison.nightshade
    defender:
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 1
        attacks: 1
    rolls:
    - key: test.hit
      value: 4
    - key: test.wound
      value: 4
    expect:
      result.wounded: true
      result.defender.initiative_penalty: 1
      result.defender.wounds: 2
  - id: critical-two-wounds
    roles:
    - active
    - consumer
    - sequence
    - consumption
    - boundary
    operation: attack
    attacker:
      main_weapon_id: weapon.mace
      main_poison_id: poison.nightshade
    defender:
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 4
        initiative: 4
        attacks: 1
    rolls:
    - key: test.hit
      value: 4
    - key: test.wound
      value: 6
    - key: test.critical
      value: 1
    expect:
      result.damage: 2
      result.defender.initiative_penalty: 2
  - id: failed-wound
    roles:
    - inactive
    - boundary
    operation: attack
    attacker:
      main_weapon_id: weapon.mace
      main_poison_id: poison.nightshade
    rolls:
    - key: test.hit
      value: 4
    - key: test.wound
      value: 1
    expect:
      result.wounded: false
      result.defender.initiative_penalty: 0
  - id: poison-immunity
    roles:
    - inactive
    operation: attack
    attacker:
      main_weapon_id: weapon.mace
      main_poison_id: poison.nightshade
    defender:
      preparation_ids:
      - preparation.tears-of-shallaya
    rolls:
    - key: test.hit
      value: 4
    - key: test.wound
      value: 4
    expect:
      result.wounded: true
      result.defender.initiative_penalty: 0
      result.defender.wounds: 2
  mutations:
  - id: remove-nightshade
    path: attacker.main_weapon.tags
    value:
    - weapon.mace
    cases:
    - unsaved-wound
- id: poison-spider-spittle
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: stateful
  sources:
  - target: mechanic/poison.spider-spittle
    digest: d44d4b58958f5ee3b8a59aee02d7241f1b11292b010e202af879595c9755a60c
  interpretation: An undefended hit immediately triggers a Toughness test before wounding or saves. A
    failed test paralyses; immunity prevents the test. Paralysis grants automatic hits, not automatic
    elimination.
  cases:
  - id: compiled
    roles:
    - compiled
    operation: compile
    attacker:
      main_weapon_id: weapon.mace
      main_poison_id: poison.spider-spittle
    expect:
      attacker.main_weapon.strength_bonus: 0
    expect_contains:
      attacker.main_weapon.tags:
      - poison.spider-spittle
  - id: failed-toughness-test
    roles:
    - active
    - sequence
    - consumption
    - boundary
    operation: attack
    attacker:
      main_weapon_id: weapon.mace
      main_poison_id: poison.spider-spittle
    defender:
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 3
        attacks: 1
    rolls:
    - key: test.hit
      value: 4
    - key: test.spider-spittle
      value: 4
    - key: test.wound
      value: 4
    expect:
      result.wounded: true
      result.defender.condition: PARALYZED
      result.defender.wounds: 2
  - id: passed-toughness-test
    roles:
    - inactive
    - boundary
    operation: attack
    attacker:
      main_weapon_id: weapon.mace
      main_poison_id: poison.spider-spittle
    rolls:
    - key: test.hit
      value: 4
    - key: test.spider-spittle
      value: 3
    - key: test.wound
      value: 4
    expect:
      result.defender.condition: STANDING
      result.defender.wounds: 2
  - id: poison-immunity
    roles:
    - inactive
    operation: attack
    attacker:
      main_weapon_id: weapon.mace
      main_poison_id: poison.spider-spittle
    defender:
      preparation_ids:
      - preparation.tears-of-shallaya
    rolls:
    - key: test.hit
      value: 4
    - key: test.wound
      value: 4
    expect:
      result.defender.condition: STANDING
      result.defender.wounds: 2
  - id: failed-wound-still-paralyses
    roles:
    - active
    - sequence
    - consumption
    - boundary
    operation: attack
    attacker:
      main_weapon_id: weapon.mace
      main_poison_id: poison.spider-spittle
    defender:
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 3
        attacks: 1
    rolls:
    - key: test.hit
      value: 4
    - key: test.spider-spittle
      value: 4
    - key: test.wound
      value: 1
    expect:
      result.wounded: false
      result.defender.condition: PARALYZED
      result.defender.wounds: 3
  mutations:
  - id: remove-spittle
    path: attacker.main_weapon.tags
    value:
    - weapon.mace
    cases:
    - failed-toughness-test
- id: mechanic-disability
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: stateful
  sources:
  - target: mechanic/mechanic.disability
    digest: b85e9a28ffb97469fef81d0e3e6b057057b58c5e5551d4f71b9b0d927fe81c80
  interpretation: The simulation rolls the Disability D6 once per row and applies the representable combat
    effects of each face, keeping the consumed face in the state.
  cases:
  - id: compiled
    roles:
    - compiled
    operation: compile
    attacker:
      collection: trollheim
      band_id: chaos-streets-mordheim-inhabitants
      profile_id: cripples
    expect:
      attacker.characteristics.weapon_skill: 2
    expect_contains:
      attacker.global_effects.tags:
      - mechanic.disability
  - id: lame
    roles:
    - active
    - sequence
    - consumption
    - boundary
    operation: initialize
    attacker:
      collection: trollheim
      band_id: chaos-streets-mordheim-inhabitants
      profile_id: cripples
    rolls:
    - key: a.disability
      value: 1
    expect:
      result.attacker.initiative: 2
      result.attacker.weapon_skill: 2
      result.attacker.resources_spent:
      - disability.1
  - id: parkinsons
    roles:
    - boundary
    operation: initialize
    attacker:
      collection: trollheim
      band_id: chaos-streets-mordheim-inhabitants
      profile_id: cripples
    rolls:
    - key: a.disability
      value: 2
    expect:
      result.attacker.weapon_skill: 1
      result.attacker.resources_spent:
      - disability.2
  - id: poor-eyesight
    roles:
    - boundary
    operation: initialize
    attacker:
      collection: trollheim
      band_id: chaos-streets-mordheim-inhabitants
      profile_id: cripples
    rolls:
    - key: a.disability
      value: 3
    expect:
      result.attacker.resources_spent:
      - disability.3
  - id: sickly
    roles:
    - boundary
    operation: initialize
    attacker:
      collection: trollheim
      band_id: chaos-streets-mordheim-inhabitants
      profile_id: cripples
    rolls:
    - key: a.disability
      value: 4
    expect:
      result.attacker.toughness: 2
      result.attacker.resources_spent:
      - disability.4
  - id: weakness
    roles:
    - boundary
    operation: initialize
    attacker:
      collection: trollheim
      band_id: chaos-streets-mordheim-inhabitants
      profile_id: cripples
    rolls:
    - key: a.disability
      value: 5
    expect:
      result.attacker.strength: 2
      result.attacker.resources_spent:
      - disability.5
  - id: head-injury
    roles:
    - boundary
    operation: initialize
    attacker:
      collection: trollheim
      band_id: chaos-streets-mordheim-inhabitants
      profile_id: cripples
    rolls:
    - key: a.disability
      value: 6
    expect:
      result.attacker.resources_spent:
      - disability.6
  - id: ordinary-profile
    roles:
    - inactive
    operation: initialize
    attacker:
      main_weapon_id: weapon.mace
    expect:
      result.attacker.weapon_skill: 3
      result.attacker.resources_spent: []
  mutations:
  - id: remove-disability
    path: attacker.global_effects.tags
    value: []
    cases:
    - lame
    - parkinsons
    - sickly
    - weakness
- id: mechanic-mark-of-the-old-ones
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: stateful
  sources:
  - target: mechanic/mechanic.mark-of-the-old-ones
    digest: 0f1613a1add314c842416822062dab5e9977c66e70e1ec145780faf0f1fc76e6
  interpretation: Mark of the Old Ones turns the first failed own roll, including an armour save, into
    a success and is then consumed for the rest of the duel.
  cases:
  - id: compiled
    roles:
    - compiled
    operation: compile
    attacker:
      collection: trollheim
      band_id: lustria-lizardmen
      profile_id: skink-priest
      special_rule_ids:
      - band--sacred-mark-of-the-old-ones
    expect:
      attacker.characteristics.weapon_skill: 3
    expect_contains:
      attacker.global_effects.tags:
      - mechanic.mark-of-the-old-ones
  - id: failed-hit-converted
    roles:
    - active
    - sequence
    - consumption
    - boundary
    operation: attack
    attacker:
      collection: trollheim
      band_id: lustria-lizardmen
      profile_id: skink-priest
      special_rule_ids:
      - band--sacred-mark-of-the-old-ones
    context:
      hit_only: true
    rolls:
    - key: test.hit
      value: 1
    expect:
      result.hit: true
      result.attacker.resources_spent:
      - mark-of-the-old-ones
  - id: already-consumed
    roles:
    - inactive
    - boundary
    operation: attack
    attacker:
      collection: trollheim
      band_id: lustria-lizardmen
      profile_id: skink-priest
      special_rule_ids:
      - band--sacred-mark-of-the-old-ones
    attacker_state:
      resources_spent:
      - mark-of-the-old-ones
    context:
      hit_only: true
    rolls:
    - key: test.hit
      value: 1
    expect:
      result.hit: false
      result.attacker.resources_spent:
      - mark-of-the-old-ones
  - id: failed-wound-converted
    roles:
    - active
    - sequence
    - consumption
    operation: attack
    attacker:
      collection: trollheim
      band_id: lustria-lizardmen
      profile_id: skink-priest
      special_rule_ids:
      - band--sacred-mark-of-the-old-ones
    defender:
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 3
        attacks: 1
    rolls:
    - key: test.hit
      value: 4
    - key: test.wound
      value: 1
    - key: test.armour
      value: 1
    expect:
      result.wounded: true
      result.defender.wounds: 2
      result.attacker.resources_spent:
      - mark-of-the-old-ones
  - id: failed-armour-save-converted
    roles:
    - active
    - sequence
    - consumption
    - boundary
    operation: attack
    attacker:
      main_weapon_id: weapon.mace
    defender:
      armour_id: armour.light-armour
      skill_ids:
      - mechanic.mark-of-the-old-ones
    rolls:
    - key: test.hit
      value: 4
    - key: test.wound
      value: 4
    - key: test.armour
      value: 1
    expect:
      result.saved: true
      result.defender.resources_spent:
      - mark-of-the-old-ones
  mutations:
  - id: remove-mark
    path: attacker.global_effects.tags
    value: []
    cases:
    - failed-hit-converted
    - failed-wound-converted
  - id: remove-mark-from-defender
    path: defender.global_effects.tags
    value: []
    cases:
    - failed-armour-save-converted
