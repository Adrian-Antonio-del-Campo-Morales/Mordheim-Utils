schema_version: 1
specifications:
- id: weapon.mace
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: local
  sources:
  - target: mechanic/weapon.mace
    digest: f9a28211f0b47b9c750f59f2b4364b8fb3b1aa41a911c23c3a0bd980c46e297a
  interpretation: Concussion changes injury face 2 from Knocked Down to Stunned; faces 3-4 remain Stunned,
    and 5-6 Out.
  interaction_contract:
    reads:
    - injury.total
    writes:
    - injury.condition
  cases:
  - id: compiled
    roles:
    - compiled
    operation: compile
    attacker:
      main_weapon_id: weapon.mace
    expect:
      attacker.main_weapon.concussion: true
      attacker.main_weapon.strength_bonus: 0
  - id: face-1
    roles:
    - inactive
    - boundary
    operation: injury
    attacker:
      main_weapon_id: weapon.mace
    rolls:
    - key: test.injury
      value: 1
    expect:
      result.condition: KNOCKED_DOWN
  - id: face-2
    roles:
    - active
    - consumer
    operation: injury
    attacker:
      main_weapon_id: weapon.mace
    rolls:
    - key: test.injury
      value: 2
    expect:
      result.condition: STUNNED
  - id: face-3
    roles:
    - inactive
    - boundary
    operation: injury
    attacker:
      main_weapon_id: weapon.mace
    rolls:
    - key: test.injury
      value: 3
    expect:
      result.condition: STUNNED
  - id: face-4
    roles:
    - inactive
    - boundary
    operation: injury
    attacker:
      main_weapon_id: weapon.mace
    rolls:
    - key: test.injury
      value: 4
    expect:
      result.condition: STUNNED
  - id: face-5
    roles:
    - inactive
    - boundary
    operation: injury
    attacker:
      main_weapon_id: weapon.mace
    rolls:
    - key: test.injury
      value: 5
    expect:
      result.condition: OUT
  - id: face-6
    roles:
    - inactive
    - boundary
    operation: injury
    attacker:
      main_weapon_id: weapon.mace
    rolls:
    - key: test.injury
      value: 6
    expect:
      result.condition: OUT
  mutations:
  - id: remove-concussion
    path: attacker.main_weapon.concussion
    value: false
    cases:
    - face-2
