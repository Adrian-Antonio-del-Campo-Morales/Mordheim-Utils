- id: weapon.double-handed-weapon
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: contextual
  sources:
  - target: mechanic/weapon.double-handed-weapon
    digest: 8e54d9ce13baf2f879cf316a31fd36830786ba558db7c5a122fa6c574863789f
  interpretation: +2 Strength; occupies both hands; strikes last regardless of Initiative unless Strongman removes
    that penalty.
  interaction_contract:
    reads:
    - fighter.strength
    - fighter.initiative
    - skill.strongman
    writes:
    - attack.strength
    - armour.strength
    - priority.tier
    - build.offhand
  cases:
  - id: compiled
    roles:
    - compiled
    operation: compile
    attacker:
      main_weapon_id: weapon.double-handed-weapon
    expect:
      attacker.main_weapon.strength_bonus: 2
      attacker.main_weapon.two_handed: true
  - id: strength
    roles:
    - consumer
    - active
    operation: strength
    attacker:
      main_weapon_id: weapon.double-handed-weapon
    expect:
      result.wound: 5
      result.armour: 5
  - id: last-despite-initiative
    roles:
    - active
    - boundary
    operation: acting_order
    attacker:
      main_weapon_id: weapon.double-handed-weapon
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 6
        attacks: 1
    defender:
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 1
        attacks: 1
    expect:
      result.first_acts: false
  - id: strongman-cancels-last
    roles:
    - inactive
    - boundary
    operation: acting_order
    attacker:
      main_weapon_id: weapon.double-handed-weapon
      skill_ids:
      - skill.strongman
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 6
        attacks: 1
    defender:
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 1
        attacks: 1
    expect:
      result.first_acts: true
  - id: reject-offhand
    roles:
    - rejected
    operation: compile
    attacker:
      main_weapon_id: weapon.double-handed-weapon
      off_hand_id: weapon.dagger
    reject: main weapon occupies both hands
  mutations:
  - id: remove-strength
    path: attacker.main_weapon.strength_bonus
    value: 0
    cases:
    - strength
  - id: remove-last
    path: attacker.main_weapon.priority
    value: 0
    cases:
    - last-despite-initiative
- id: weapon.sword
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: local
  sources:
  - target: mechanic/weapon.sword
    digest: b0269721d63c45f8e54c648b250807896035778ea2cbc482cbc3f54bc6e46c18
  interpretation: The sword grants one eligible parry, governed by the independently tested core parry operator.
  interaction_contract:
    reads:
    - hit.roll
    writes:
    - state.parries
    - hit.success
  cases:
  - id: compiled
    roles:
    - compiled
    operation: compile
    defender:
      main_weapon_id: weapon.sword
    expect:
      defender.main_weapon.parry: true
  - id: all-faces
    roles:
    - active
    - consumer
    - boundary
    operation: parry
    defender:
      main_weapon_id: weapon.sword
    context:
      hit_roll: 4
    distribution:
      observable: result.blocked
      max_rolls: 1
      expected:
        'true': 1/3
        'false': 2/3
  - id: natural-six
    roles:
    - inactive
    operation: parry
    defender:
      main_weapon_id: weapon.sword
    context:
      hit_roll: 6
    expect:
      result.attempted: false
      result.blocked: false
  - id: one-per-phase
    roles:
    - boundary
    operation: initialize
    defender:
      main_weapon_id: weapon.sword
    expect:
      result.defender.parries_remaining: 1
  mutations:
  - id: remove-sword-parry
    path: defender.main_weapon.parry
    value: false
    cases:
    - all-faces
- id: armour.no-armour
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: permanent
  sources:
  - target: mechanic/armour.no-armour
    digest: ec03523647acce576db9b07c4f7e92942ce4d77a0755e931647d3a386b6350ea
  interpretation: No body armour grants no armour roll. An independent special save remains available.
  interaction_contract:
    reads:
    - armour.allowed
    writes:
    - armour.target
  cases:
  - id: compiled
    roles:
    - compiled
    operation: compile
    defender:
      armour_id: armour.no-armour
    expect:
      defender.armour_save: 7
  - id: no-roll
    roles:
    - consumer
    - boundary
    operation: armour
    attacker:
      main_weapon_id: weapon.mace
    expect:
      result.eligible: false
      result.saved: false
  - id: ward-independent
    roles:
    - boundary
