- id: weapon.halberd
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: permanent
  sources:
  - target: mechanic/weapon.halberd
    digest: a59577c4c8d600445576805c1ebe83fe1b84bde84477a20b7d4cb66790764a0f
  interpretation: 'Two-handed: no simultaneous off-hand equipment. +1 Strength on every attack.'
  interaction_contract:
    reads:
    - fighter.strength
    - round.first
    writes:
    - attack.strength
    - armour.strength
    - build.offhand
  cases:
  - id: compiled
    roles:
    - compiled
    operation: compile
    attacker:
      main_weapon_id: weapon.halberd
    expect:
      attacker.main_weapon.strength_bonus: 1
      attacker.main_weapon.two_handed: true
  - id: first-round-strength
    roles:
    - active
    - consumer
    operation: strength
    attacker:
      main_weapon_id: weapon.halberd
    context:
      first_round: true
    expect:
      result.wound: 4
      result.armour: 4
  - id: later-round-strength
    roles:
    - inactive
    - boundary
    operation: strength
    attacker:
      main_weapon_id: weapon.halberd
    context:
      first_round: false
    expect:
      result.wound: 4
      result.armour: 4
  - id: reject-offhand
    roles:
    - rejected
    operation: compile
    attacker:
      main_weapon_id: weapon.halberd
      off_hand_id: weapon.dagger
    reject: main weapon occupies both hands
  - id: reject-shield
    roles:
    - rejected
    operation: compile
    attacker:
      main_weapon_id: weapon.halberd
      off_hand_id: defence.shield
    reject: main weapon occupies both hands
  mutations:
  - id: remove-strength
    path: attacker.main_weapon.strength_bonus
    value: 0
    cases:
    - first-round-strength
