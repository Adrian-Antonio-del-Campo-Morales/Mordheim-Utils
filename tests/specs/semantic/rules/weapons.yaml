- id: weapon.axe
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: permanent
  sources:
  - target: mechanic/weapon.axe
    digest: 09c9456b69a681caf93ea7c4b8413136bc962e64361feebb2d78f7cc89acabcd
  interpretation: One additional armour-save penalty worsens a 4+ save to 5+ at Strength 3. It does not
    increase attacking Strength.
  interaction_contract:
    reads:
    - armour.target
    writes:
    - attack.penetration
  cases:
  - id: compiled
    roles:
    - compiled
    operation: compile
    attacker:
      main_weapon_id: weapon.axe
    expect:
      attacker.main_weapon.armour_penetration: 1
  - id: all-armour-faces
    roles:
    - consumer
    - boundary
    operation: armour
    attacker:
      main_weapon_id: weapon.axe
    defender:
      armour_id: armour.gromril-armour
    distribution:
      observable: result.saved
      max_rolls: 1
      expected:
        'true': 1/3
        'false': 2/3
  - id: not-a-strength-bonus
    roles:
    - consumer
    operation: strength
    attacker:
      main_weapon_id: weapon.axe
    expect:
      result.wound: 3
      result.armour: 3
  - id: save-worse-than-six
    roles:
    - boundary
    operation: armour
    attacker:
      main_weapon_id: weapon.axe
    defender:
      armour_id: armour.light-armour
    expect:
      result.target: 7
      result.eligible: false
      result.saved: false
  mutations:
  - id: remove-penetration
    path: attacker.main_weapon.armour_penetration
    value: 0
    cases:
    - all-armour-faces
    - save-worse-than-six
