  interaction_contract:
    reads:
    - armour.allowed
    writes:
    - armour.target
  cases:
  - id: compiled
    roles:
    - compiled
    operation: compile
    defender:
      armour_id: armour.no-armour
    expect:
      defender.armour_save: 7
  - id: no-roll
    roles:
    - consumer
    - boundary
    operation: armour
    attacker:
      main_weapon_id: weapon.mace
    expect:
      result.eligible: false
      result.saved: false
