- id: weapon.dagger
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: permanent
  sources:
  - target: mechanic/weapon.dagger
    digest: 53519ab3e916cc0974bfea4c91f40370cd292ab4856de4f2e11ae9f3ad25cf93
  interpretation: The target receives +1 to its armour save, including a 6+ save if normally unarmoured.
    Attacking Strength is unchanged.
  interaction_contract:
    reads:
    - armour.target
    writes:
    - armour.target
  cases:
  - id: compiled
    roles:
    - compiled
    operation: compile
    attacker:
      main_weapon_id: weapon.dagger
    expect:
      attacker.main_weapon.target_armour_bonus: 1
      attacker.main_weapon.strength_bonus: 0
  - id: otherwise-unarmoured
    roles:
    - consumer
    - boundary
    operation: armour
    attacker:
      main_weapon_id: weapon.dagger
    distribution:
      observable: result.saved
      max_rolls: 1
      expected:
        'true': 1/6
        'false': 5/6
  - id: improves-existing-save
    roles:
    - consumer
    operation: armour
    attacker:
      main_weapon_id: weapon.dagger
    defender:
      armour_id: armour.gromril-armour
    rolls:
    - key: armour
      value: 3
    expect:
      result.target: 3
      result.saved: true
  - id: strength-unchanged
    roles:
    - boundary
    operation: strength
    attacker:
      main_weapon_id: weapon.dagger
    expect:
      result.wound: 3
      result.armour: 3
  mutations:
  - id: remove-target-bonus
    path: attacker.main_weapon.target_armour_bonus
    value: 0
    cases:
    - otherwise-unarmoured
    - improves-existing-save
