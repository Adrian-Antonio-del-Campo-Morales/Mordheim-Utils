schema_version: 1
specifications:
- id: skill.shield-mastery
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: local
  sources:
  - target: mechanic/skill.shield-mastery
    digest: 9cb8e7421815d344f358097fa978c95b2839eeb5facfbec2ed7e022a6b22a79f
  interpretation: Shield Mastery allows one ordinary parry while a shield occupies the off hand. The parry
    must beat the hit roll and does not replace or consume the shield's normal +1 armour save. Without
    a shield it has no effect.
  interaction_contract:
    reads:
    - build.offhand
    - weapon.kind
    - hit.roll
    - state.parries
    writes:
    - state.parries
  cases:
  - id: compiled
    roles:
    - compiled
    operation: compile
    defender:
      skill_ids:
      - skill.shield-mastery
      main_weapon_id: weapon.axe
      off_hand_id: defence.shield
    expect:
      defender.armour_save: 6
    expect_contains:
      defender.global_effects.tags:
      - skill.shield-mastery
  - id: shield-can-parry
    roles:
    - active
    - boundary
    - consumer
    operation: parry
    attacker:
      main_weapon_id: weapon.mace
    defender:
      skill_ids:
      - skill.shield-mastery
      main_weapon_id: weapon.axe
      off_hand_id: defence.shield
    context:
      hit_roll: 4
    distribution:
      observable: result.blocked
      max_rolls: 1
      expected:
        'true': 1/3
        'false': 2/3
  - id: shield-retains-armour-save
    roles:
    - active
    - boundary
    - consumer
    operation: armour
    attacker:
      main_weapon_id: weapon.mace
    defender:
      skill_ids:
      - skill.shield-mastery
      main_weapon_id: weapon.axe
      off_hand_id: defence.shield
    distribution:
      observable: result.saved
      max_rolls: 1
      expected:
        'true': 1/6
        'false': 5/6
  - id: shield-without-skill-cannot-parry
    roles:
    - inactive
    - boundary
    operation: parry
    attacker:
      main_weapon_id: weapon.mace
    defender:
      main_weapon_id: weapon.axe
      off_hand_id: defence.shield
    context:
      hit_roll: 4
    expect:
      result.attempted: false
      result.blocked: false
  - id: skill-without-shield-cannot-parry
    roles:
    - inactive
    - boundary
    operation: parry
    attacker:
      main_weapon_id: weapon.mace
    defender:
      skill_ids:
      - skill.shield-mastery
      main_weapon_id: weapon.axe
    context:
      hit_roll: 4
    expect:
      result.attempted: false
      result.blocked: false
  - id: natural-six-remains-unparryable
    roles:
    - active
    - boundary
    operation: parry
    attacker:
      main_weapon_id: weapon.mace
    defender:
      skill_ids:
      - skill.shield-mastery
      main_weapon_id: weapon.axe
      off_hand_id: defence.shield
    context:
      hit_roll: 6
    expect:
      result.attempted: false
      result.blocked: false
  mutations:
  - id: remove-shield-mastery
    path: defender.global_effects.tags
    value: []
    cases:
    - shield-can-parry
