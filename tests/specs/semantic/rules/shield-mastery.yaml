schema_version: 1
specifications:
- id: skill.shield-mastery
  scope_digest: 5fd7034eceb69daeeac4b0ad8bba9f2bc5ba50ca65a102d49b69e25f85d18dc9
  category: local
  sources:
  - target: mechanic/skill.shield-mastery
    digest: 805ae5bc83327e8b964761d7bdcc520c5f80035f5ef97b6b83a427eba80d60e7
  interpretation: Shield Mastery allows one ordinary parry while a shield occupies the off hand. The parry
    must beat the hit roll and does not replace or consume the shield's normal +1 armour save. Without
    a shield it has no effect.
  interaction_contract:
    reads:
    - build.offhand
    - weapon.kind
    - hit.roll
    - state.parries
    writes:
    - state.parries
  cases:
  - id: compiled
    roles:
    - compiled
    operation: compile
    defender:
      skill_ids:
      - skill.shield-mastery
      main_weapon_id: weapon.axe
      off_hand_id: defence.shield
    expect:
      defender.armour_save: 6
    expect_contains:
      defender.global_effects.tags:
      - skill.shield-mastery
  - id: shield-can-parry
    roles:
    - active
    - boundary
    - consumer
    operation: parry
    attacker:
      main_weapon_id: weapon.mace
    defender:
      skill_ids:
      - skill.shield-mastery
      main_weapon_id: weapon.axe
      off_hand_id: defence.shield
    context:
      hit_roll: 4
    distribution:
      observable: result.blocked
      max_rolls: 1
      expected:
        'true': 1/3
        'false': 2/3
  - id: shield-retains-armour-save
    roles:
    - active
    - boundary
    - consumer
    operation: armour
    attacker:
      main_weapon_id: weapon.mace
    defender:
      skill_ids:
      - skill.shield-mastery
      main_weapon_id: weapon.axe
      off_hand_id: defence.shield
    distribution:
      observable: result.saved
      max_rolls: 1
      expected:
        'true': 1/6
        'false': 5/6
  - id: shield-without-skill-cannot-parry
    roles:
    - inactive
    - boundary
    operation: parry
    attacker:
      main_weapon_id: weapon.mace
    defender:
      main_weapon_id: weapon.axe
      off_hand_id: defence.shield
    context:
      hit_roll: 4
    expect:
      result.attempted: false
      result.blocked: false
  - id: skill-without-shield-cannot-parry
    roles:
    - inactive
    - boundary
    operation: parry
    attacker:
      main_weapon_id: weapon.mace
    defender:
      skill_ids:
      - skill.shield-mastery
      main_weapon_id: weapon.axe
    context:
      hit_roll: 4
    expect:
      result.attempted: false
      result.blocked: false
  - id: natural-six-remains-unparryable
    roles:
    - active
    - boundary
    operation: parry
    attacker:
      main_weapon_id: weapon.mace
    defender:
      skill_ids:
      - skill.shield-mastery
      main_weapon_id: weapon.axe
      off_hand_id: defence.shield
    context:
      hit_roll: 6
    expect:
      result.attempted: false
      result.blocked: false
  mutations:
  - id: remove-shield-mastery
    path: defender.global_effects.tags
    value: []
    cases:
    - shield-can-parry
