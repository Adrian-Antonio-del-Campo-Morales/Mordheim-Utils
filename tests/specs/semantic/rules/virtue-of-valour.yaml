schema_version: 1
specifications:
- id: virtue-of-valour-and-native-grants
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: contextual
  sources:
  - target: mechanic/skill.virtue-of-valour
    digest: 598ccea17b8187feb26fafa6b5f76b646cd10e186c89b4bf00dc87fff09aba95
  - target: rule/mordheim/bretonnian-knights/band--virtue-of-valour/skill.virtue-of-valour
    digest: c95de58f1f4c1b36713ecb86db0368d16746a1c613a562f590410b34b0cd3da5
  - target: rule/trollheim/chaos-streets-bretonnian-knights/band--virtue-of-valour/skill.virtue-of-valour
    digest: 49c822004579cf027f15a550c3697b3c7e8356c44d01856d03cd04058a321244
  interpretation: Bretonnian Knight Virtues / Virtue of Valour permits one reroll of failed melee hit
    rolls only against strictly higher Strength characteristics. Weapon bonuses are not characteristics.
    Native Bretonnian Heroes with special access may select the virtue; foreign acquisition is separate.
  cases:
  - id: opponent-strength-2
    roles:
    - inactive
    - consumer
    - boundary
    - compiled
    operation: hit
    attacker:
      main_weapon_id: weapon.mace
      skill_ids:
      - skill.virtue-of-valour
    defender:
      characteristics:
        weapon_skill: 3
        strength: 2
        toughness: 3
        wounds: 1
        initiative: 3
        attacks: 1
    distribution:
      observable: result.success
      max_rolls: 2
      expected:
        'true': 1/2
        'false': 1/2
  - id: opponent-strength-3
    roles:
    - inactive
    - consumer
    - boundary
    - compiled
    operation: hit
    attacker:
      main_weapon_id: weapon.mace
      skill_ids:
      - skill.virtue-of-valour
    defender:
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 1
        initiative: 3
        attacks: 1
    distribution:
      observable: result.success
      max_rolls: 2
      expected:
        'true': 1/2
        'false': 1/2
  - id: opponent-strength-4
    roles:
    - active
    - consumer
    - boundary
    - compiled
    operation: hit
    attacker:
      main_weapon_id: weapon.mace
      skill_ids:
      - skill.virtue-of-valour
    defender:
      characteristics:
        weapon_skill: 3
        strength: 4
        toughness: 3
        wounds: 1
        initiative: 3
        attacks: 1
    distribution:
      observable: result.success
      max_rolls: 2
      expected:
        'true': 3/4
        'false': 1/4
  - id: weapon-strength-does-not-qualify
    roles:
    - inactive
    operation: hit
    attacker:
      main_weapon_id: weapon.mace
      skill_ids:
      - skill.virtue-of-valour
    defender:
      main_weapon_id: weapon.double-handed-weapon
    rolls:
    - key: hit
      value: 3
    expect:
      context.reroll: false
      result.success: false
  - id: successful-hit-no-reroll
    roles:
    - boundary
    - consumption
    operation: hit
    attacker:
      main_weapon_id: weapon.mace
      skill_ids:
      - skill.virtue-of-valour
    defender:
      characteristics:
        weapon_skill: 3
        strength: 4
        toughness: 3
        wounds: 1
        initiative: 3
        attacks: 1
    rolls:
    - key: hit
      value: 4
    expect:
      result.success: true
      result.rerolled: false
  - id: bretonnian-knights-recipients
    roles:
    - grant
    operation: selectable_grant
    defender:
      collection: mordheim
      band_id: bretonnian-knights
      profile_id: questing-knight
    context:
      rule_id: band--virtue-of-valour
    expect:
      result.recipients:
      - knights-errant
      - questing-knight
      - squires
  - id: bretonnian-knights-reroll
    roles:
    - active
    - consumer
    operation: hit
    attacker:
      collection: mordheim
      band_id: bretonnian-knights
      profile_id: questing-knight
      main_weapon_id: weapon.sword
      special_rule_ids:
      - band--virtue-of-valour
    defender:
      characteristics:
        weapon_skill: 4
        strength: 5
        toughness: 3
        wounds: 1
        initiative: 3
        attacks: 1
    rolls:
    - key: hit
      value: 3
    - key: hit.reroll
      value: 4
    expect:
      context.reroll: true
      result.success: true
      result.rerolled: true
  - id: chaos-streets-bretonnian-knights-recipients
    roles:
    - grant
    operation: selectable_grant
    defender:
      collection: trollheim
      band_id: chaos-streets-bretonnian-knights
      profile_id: questing-knight
    context:
      rule_id: band--virtue-of-valour
    expect:
      result.recipients:
      - knights-errant
      - questing-knight
      - squires
  - id: chaos-streets-bretonnian-knights-reroll
    roles:
    - active
    - consumer
    operation: hit
    attacker:
      collection: trollheim
      band_id: chaos-streets-bretonnian-knights
      profile_id: questing-knight
      main_weapon_id: weapon.sword
      special_rule_ids:
      - band--virtue-of-valour
    defender:
      characteristics:
        weapon_skill: 4
        strength: 5
        toughness: 3
        wounds: 1
        initiative: 3
        attacks: 1
    rolls:
    - key: hit
      value: 3
    - key: hit.reroll
      value: 4
    expect:
      context.reroll: true
      result.success: true
      result.rerolled: true
  mutations:
  - id: remove-virtue
    path: attacker.global_effects.tags
    value: []
    cases:
    - opponent-strength-4
    - bretonnian-knights-reroll
    - chaos-streets-bretonnian-knights-reroll
