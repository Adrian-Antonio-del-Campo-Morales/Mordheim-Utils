- id: poison.devil-s-toxin
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: local
  sources:
  - target: mechanic/poison.devil-s-toxin
    digest: ca23dcb51e8538b1a1ec7f68768e694ff95b82db256b9c2e35b78d763ff1f9c2
  interpretation: Reroll failed wounds once, but that reroll cannot cause a critical. Original natural
    sixes still cause criticals unless six was required.
  interaction_contract:
    reads:
    - defender.poison_immunity
    - weapon.kind
    writes:
    - wound.roll
    - state.critical_available
  cases:
  - id: compiled
    roles:
    - compiled
    operation: compile
    attacker:
      main_weapon_id: weapon.sword
      main_poison_id: poison.devil-s-toxin
    expect:
      attacker.main_weapon.reroll_wounds: true
  - id: without-poison
    roles:
    - inactive
    operation: wound
    rolls:
    - key: wound
      value: 1
    expect:
      result.success: false
      result.rerolled: false
  - id: six-required
    roles:
    - boundary
    operation: wound
    attacker:
      main_weapon_id: weapon.sword
      main_poison_id: poison.devil-s-toxin
    defender:
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 5
        wounds: 3
        initiative: 3
        attacks: 1
    rolls:
    - key: wound
      value: 6
    expect:
      result.success: true
      result.critical: false
  - id: overall-success
    roles:
    - consumer
    operation: wound
    attacker:
      main_weapon_id: weapon.sword
      main_poison_id: poison.devil-s-toxin
    distribution:
      observable: result.success
      max_rolls: 2
      expected:
        'true': 3/4
        'false': 1/4
  - id: overall-critical
    roles:
    - consumer
    operation: wound
    attacker:
      main_weapon_id: weapon.sword
      main_poison_id: poison.devil-s-toxin
    distribution:
