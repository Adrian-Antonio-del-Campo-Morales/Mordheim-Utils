- id: poison.reptile-venom
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: contextual
  sources:
  - target: mechanic/poison.reptile-venom
    digest: e942ef4e90104e285b62d63d7832a8d041ab5e6bd0a7c8c7a95c74797735dc4e
  interpretation: The poison increases only Strength used to wound by one. It does not increase Strength used
    for armour penetration.
  interaction_contract:
    reads:
    - defender.poison_immunity
    - weapon.kind
    writes:
    - attack.strength
  cases:
  - id: compiled
    roles:
    - compiled
    operation: compile
    attacker:
      main_weapon_id: weapon.sword
      main_poison_id: poison.reptile-venom
    expect:
      attacker.main_weapon.strength_bonus: 1
      attacker.main_weapon.armour_strength_modifier: -1
  - id: strengths
    roles:
    - active
    - consumer
    operation: strength
    attacker:
      main_weapon_id: weapon.sword
      main_poison_id: poison.reptile-venom
    expect:
      result.wound: 4
      result.armour: 3
  - id: without-poison
    roles:
    - inactive
    operation: strength
    attacker:
      main_weapon_id: weapon.sword
    expect:
      result.wound: 3
      result.armour: 3
  - id: minimum-strength
    roles:
    - boundary
    operation: strength
    attacker:
      main_weapon_id: weapon.sword
      main_poison_id: poison.reptile-venom
      characteristics:
        weapon_skill: 3
        strength: 1
        toughness: 3
        wounds: 3
        initiative: 3
        attacks: 1
    expect:
      result.wound: 2
      result.armour: 1
  - id: material-preserved
    roles:
    - boundary
    operation: strength
    attacker:
      main_weapon_id: weapon.sword
      main_poison_id: poison.reptile-venom
      main_material_id: material.obsidian
    expect:
      result.wound: 5
      result.armour: 4
  - id: all-wound-faces
    roles:
    - consumer
    operation: wound
    attacker:
      main_weapon_id: weapon.sword
      main_poison_id: poison.reptile-venom
    distribution:
      observable: result.success
      max_rolls: 1
      expected:
        'true': 2/3
        'false': 1/3
  mutations:
  - id: remove-wound-bonus
    path: attacker.main_weapon.strength_bonus
    value: 0
    cases:
    - strengths
  - id: incorrect-penetration
    path: attacker.main_weapon.armour_strength_modifier
    value: 0
    cases:
    - strengths
