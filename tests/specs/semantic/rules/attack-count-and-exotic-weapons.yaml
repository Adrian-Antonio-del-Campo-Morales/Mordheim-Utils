schema_version: 1
specifications:
- id: mechanic-spawn-special-attacks
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: stateful
  sources:
  - target: mechanic/mechanic.spawn-special-attacks
    digest: f5f4891d6a5313715c63851d58640301faaa755030ac5e145bc8c42024bebe21
  interpretation: Special Attacks replaces, at the start of each phase, the ordinary number of attacks
    with D6+1 and rolls again in the next phase.
  cases:
  - id: compiled
    roles:
    - compiled
    operation: compile
    attacker:
      band_id: marauders-of-chaos
      profile_id: spawn-of-chaos
    expect_contains:
      attacker.global_effects.tags:
      - mechanic.spawn-special-attacks
    expect:
      attacker.random_characteristics:
      - - A
        - 1
        - 6
        - 1
  - id: minimum
    roles:
    - active
    - sequence
    - consumption
    - boundary
    operation: spawn_attacks
    attacker:
      band_id: marauders-of-chaos
      profile_id: spawn-of-chaos
    context:
      ordinary_count: 4
    rolls:
    - key: a.characteristic.A.0
      value: 1
    - key: spawn-attacks
      value: 1
    expect:
      result.attacks: 2
  - id: maximum-next-phase
    roles:
    - active
    - sequence
    - consumption
    - boundary
    operation: spawn_attacks
    attacker:
      band_id: marauders-of-chaos
      profile_id: spawn-of-chaos
    context:
      ordinary_count: 4
    rolls:
    - key: a.characteristic.A.0
      value: 1
    - key: spawn-attacks
      value: 6
    expect:
      result.attacks: 7
  - id: ordinary-fighter
    roles:
    - inactive
    operation: spawn_attacks
    attacker:
      main_weapon_id: weapon.mace
    context:
      ordinary_count: 4
    expect:
      result.attacks: 4
  mutations:
  - id: remove-random-attacks
    path: attacker.global_effects.tags
    value: []
    cases:
    - minimum
- id: editorial-spawn-special-attacks
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: construction
  sources:
  - target: rule/mordheim/marauders-of-chaos/spawn-of-chaos--special-attacks/mechanic.spawn-special-attacks
    digest: 6823f77c13a4f33d4015b74ef626974a9b8c3a339b44878046690ea75e5d609c
  depends_on:
  - mechanic/mechanic.spawn-special-attacks
  interpretation: The rule is granted only to the Spawn of Chaos and makes its attack count consume the
    canonical D6+1.
  cases:
  - id: recipient
    roles:
    - grant
    - accepted
    - rejected
    operation: grant
    defender:
      band_id: marauders-of-chaos
      profile_id: spawn-of-chaos
    context:
      rule_id: spawn-of-chaos--special-attacks
    expect:
      result.recipients:
      - spawn-of-chaos
  - id: selected
    roles:
    - accepted
    operation: spawn_attacks
    attacker:
      band_id: marauders-of-chaos
      profile_id: spawn-of-chaos
    context:
      ordinary_count: 4
    rolls:
    - key: a.characteristic.A.0
      value: 1
    - key: spawn-attacks
      value: 3
    expect:
      result.attacks: 4
  mutations:
  - id: omit-special-attacks
    path: attacker.global_effects.tags
    value: []
    cases:
    - selected
- id: skill-sigmars-sign
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: contextual
  sources:
  - target: mechanic/skill.sigmar-s-sign
    digest: 13ad1fc9c9057a89f191fe3969930d1c5758480c3d0047b9927bdc9fe358cee0
  interpretation: Sigmar's Sign removes one attack, with a minimum of one, exclusively from Undead or
    Possessed opponents during the first round.
  cases:
  - id: first-round-undead
    roles:
    - compiled
    - active
    - consumer
    - boundary
    operation: opposed_attacks
    attacker:
      main_weapon_id: weapon.mace
      trait_overrides:
        undead_or_possessed: true
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 3
        attacks: 3
    defender:
      main_weapon_id: weapon.mace
      skill_ids:
      - skill.sigmar-s-sign
    context:
      first_round: true
    expect:
      result.attacks: 2
    expect_contains:
      defender.global_effects.tags:
      - skill.sigmar-s-sign
  - id: minimum-one
    roles:
    - active
    - boundary
    operation: opposed_attacks
    attacker:
      main_weapon_id: weapon.mace
      trait_overrides:
        undead_or_possessed: true
    defender:
      main_weapon_id: weapon.mace
      skill_ids:
      - skill.sigmar-s-sign
    context:
      first_round: true
    expect:
      result.attacks: 1
  - id: later-round
    roles:
    - inactive
    - boundary
    operation: opposed_attacks
    attacker:
      main_weapon_id: weapon.mace
      trait_overrides:
        undead_or_possessed: true
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 3
        attacks: 3
    defender:
      main_weapon_id: weapon.mace
      skill_ids:
      - skill.sigmar-s-sign
    context:
      first_round: false
    expect:
      result.attacks: 3
  - id: living-opponent
    roles:
    - inactive
    operation: opposed_attacks
    attacker:
      main_weapon_id: weapon.mace
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 3
        attacks: 3
    defender:
      main_weapon_id: weapon.mace
      skill_ids:
      - skill.sigmar-s-sign
    context:
      first_round: true
    expect:
      result.attacks: 3
  mutations:
  - id: remove-sign
    path: defender.global_effects.tags
    value: []
    cases:
    - first-round-undead
- id: weapon-sun-gauntlet
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: local
  sources:
  - target: mechanic/weapon.sun-gauntlet
    digest: d47e3983e6409c4c047a9fc8a67333715d57d1f763bf91e484d124a291b3e169
  interpretation: Sun Gauntlet only occupies the off hand and resolves that attack at fixed Strength 4
    ignoring the armour save.
  cases:
  - id: compiled-strength
    roles:
    - compiled
    - active
    - consumer
    - boundary
    operation: off_hand_strength
    attacker:
      main_weapon_id: weapon.mace
      off_hand_id: weapon.sun-gauntlet
    expect:
      attacker.off_hand.fixed_strength: 4
      attacker.off_hand.ignore_armour: true
      result.wound: 4
      result.armour: 4
  - id: ignores-armour
    roles:
    - active
    - consumer
    - boundary
    operation: off_hand_armour
    attacker:
      main_weapon_id: weapon.mace
      off_hand_id: weapon.sun-gauntlet
    defender:
      armour_id: armour.gromril-armour
    expect:
      result.eligible: false
  - id: main-hand-rejected
    roles:
    - inactive
    - boundary
    operation: equipment_choices
    attacker: {}
    context:
      choices:
        ordinary:
          main_weapon_id: weapon.mace
        gauntlet-main:
          main_weapon_id: weapon.sun-gauntlet
    expect:
      result.accepted:
      - ordinary
      result.rejected:
        gauntlet-main: illegal main-hand selection
  mutations:
  - id: remove-fixed-strength
    path: attacker.off_hand.fixed_strength
    value: 0
    cases:
    - compiled-strength
  - id: restore-armour
    path: attacker.off_hand.ignore_armour
    value: false
    cases:
    - ignores-armour
- id: weapon-starblade
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: local
  sources:
  - target: mechanic/weapon.starblade
    digest: b762a9a800c0c21b7b937a03bfee634693ad1c6de1b2e1c44f70b1166a8eda44
  interpretation: Starblade grants a single fixed parry at 4+ and improves the enemy's armour save by
    one.
  cases:
  - id: fixed-parry
    roles:
    - compiled
    - active
    - consumer
    - boundary
    operation: parry
    defender:
      main_weapon_id: weapon.starblade
    context:
      hit_roll: 5
    rolls:
    - key: test.parry
      value: 4
    expect:
      defender.main_weapon.parry: true
      defender.main_weapon.target_armour_bonus: 1
      context.fixed_target: 4
      result.blocked: true
  - id: parry-three-fails
    roles:
    - active
    - boundary
    operation: parry
    defender:
      main_weapon_id: weapon.starblade
    context:
      hit_roll: 5
    rolls:
    - key: test.parry
      value: 3
    expect:
      result.blocked: false
  - id: enemy-armour-improves
    roles:
    - active
    - consumer
    - boundary
    operation: armour
    attacker:
      main_weapon_id: weapon.starblade
    defender:
      armour_id: armour.light-armour
    rolls:
    - key: armour
      value: 5
    expect:
      result.target: 5
      result.saved: true
  - id: ordinary-sword-control
    roles:
    - inactive
    operation: armour
    attacker:
      main_weapon_id: weapon.sword
    defender:
      armour_id: armour.light-armour
    rolls:
    - key: armour
      value: 5
    expect:
      result.target: 6
      result.saved: false
  mutations:
  - id: remove-fixed-parry
    path: defender.main_weapon.tags
    value: []
    cases:
    - fixed-parry
  - id: remove-armour-benefit
    path: attacker.main_weapon.target_armour_bonus
    value: 0
    cases:
    - enemy-armour-improves
