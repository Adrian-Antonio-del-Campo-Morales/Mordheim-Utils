  depends_on:
  - mechanic/mechanic.force-of-will
  interpretation: Both editions grant Force of Will exclusively to Dwarf Troll Slayer, Pit King and Pit
    Veterans and consume the same canonical rescue.
  cases:
  - id: mordheim-recipients
    roles:
