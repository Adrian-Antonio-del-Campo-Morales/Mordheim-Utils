  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: construction
  sources:
  - target: rule/mordheim/night-goblins-mic/band--night-goblin-special-skills-netter/mechanic.netter
    digest: 85d8967b2f7ef4f6bf7cac7bbb0afbe1f2e0383fcf8f134bfaff816c0f23a1db
  depends_on:
