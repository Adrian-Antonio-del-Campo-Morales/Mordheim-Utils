    - grant
    - accepted
    - rejected
    operation: selectable_grant
    defender:
      collection: trollheim
      band_id: chaos-streets-pit-fighters
      profile_id: pit-king
    context:
      rule_id: band--pit-fighter-skill-force-of-will
    expect:
      result.recipients:
