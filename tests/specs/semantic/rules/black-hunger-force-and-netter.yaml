    operation: selectable_grant
    defender:
      band_id: night-goblins-mic
      profile_id: big-boss
    context:
      rule_id: band--night-goblin-special-skills-netter
    expect:
      result.recipients:
      - big-boss
      - bosses
  - id: selected
    roles:
    - accepted
    operation: netter
    attacker:
      band_id: night-goblins-mic
      profile_id: big-boss
      special_rule_ids:
      - band--night-goblin-special-skills-netter
    rolls:
    - key: test.netter.hit
      value: 4
    - key: test.netter.escape
      value: 4
    expect:
      result.condition: KNOCKED_DOWN
  mutations:
  - id: omit-netter
    path: attacker.global_effects.tags
    value: []
    cases:
    - selected
