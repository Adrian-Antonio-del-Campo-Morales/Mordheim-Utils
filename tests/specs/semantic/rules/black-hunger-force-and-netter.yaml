  depends_on:
  - mechanic/mechanic.black-hunger
  interpretation: The four rules grant Black Hunger to their exact Hero lists; the editorial Movement
    differences stay outside the duel and share the same combat effect.
  cases:
  - id: eshin-mordheim
    roles:
    - grant
    - accepted
    - rejected
    operation: selectable_grant
    defender:
      band_id: skaven-clan-eshin
      profile_id: assassin-adept
    context:
      rule_id: band--skaven-special-skills-black-hunger
    expect:
      result.recipients:
      - assassin-adept
      - black-skaven
      - eshin-sorcerer
      - night-runners
  - id: pestilens-mordheim
    roles:
    - grant
    - accepted
    - rejected
    operation: selectable_grant
    defender:
      band_id: skaven-clan-pestilens
      profile_id: plague-priest
    context:
      rule_id: band--clan-pestilens-special-skills-black-hunger
    expect:
      result.recipients:
      - monk-initiates
      - pestilens-sorcerer
      - plague-monks
      - plague-priest
  - id: pestilens-lustria
    roles:
    - grant
    - accepted
    - rejected
    operation: selectable_grant
    defender:
      collection: trollheim
      band_id: lustria-clan-pestilens
      profile_id: plague-priest
    context:
      rule_id: band--clan-pestilens-special-skills-black-hunger
    expect:
      result.recipients:
      - monk-initiates
      - pestilens-sorcerer
      - plague-monks
      - plague-priest
  - id: eshin-trollheim
    roles:
    - grant
    - accepted
    - rejected
    operation: selectable_grant
    defender:
      collection: trollheim
      band_id: trollheim-skaven-clan-eshin
      profile_id: assassin-adept
    context:
      rule_id: band--skaven-special-skills-black-hunger
    expect:
      result.recipients:
      - assassin-adept
      - black-skaven
      - eshin-sorcerer
      - night-runners
  - id: selected-effect
    roles:
    - accepted
    operation: round
    attacker:
      band_id: skaven-clan-eshin
      profile_id: assassin-adept
      special_rule_ids:
      - band--skaven-special-skills-black-hunger
    context:
      first_charged: true
    rolls:
    - key: round.0.first.attack.0.hit
      value: 1
    - key: round.0.first.attack.1.hit
      value: 1
    - key: round.0.second.attack.0.hit
      value: 1
    - key: round.0.first.black-hunger.hits
      sides: 3
      value: 1
    - key: round.0.first.black-hunger.hit.0.wound
      value: 1
    expect:
      attacker.global_effects.attacks_bonus: 0
      result.attacks.0.hit: false
      result.attacks.1.hit: false
      result.attacks.2.hit: false
      result.attacks.3.wounded: false
  mutations:
  - id: omit-black-hunger
    path: attacker.global_effects.tags
    value: []
    cases:
    - selected-effect
- id: editorial-force-of-will-variants
  scope_digest: 5fd7034eceb69daeeac4b0ad8bba9f2bc5ba50ca65a102d49b69e25f85d18dc9
  category: construction
  sources:
  - target: rule/mordheim/pit-fighters/band--pit-fighter-skill-force-of-will/mechanic.force-of-will
    digest: e130c506dde68497c1498c9fcab18e576d56dcf8c7c9f82f101c9d69bb02a83a
  - target: rule/trollheim/chaos-streets-pit-fighters/band--pit-fighter-skill-force-of-will/mechanic.force-of-will
    digest: 0566cc8eee411b0b4d1965deb388c39e5beab3bcfca34a71e96631efc49e9d34
  depends_on:
  - mechanic/mechanic.force-of-will
  interpretation: Both editions grant Force of Will exclusively to Dwarf Troll Slayer, Pit King and Pit
    Veterans and consume the same canonical rescue.
  cases:
  - id: mordheim-recipients
    roles:
    - grant
    - accepted
    - rejected
    operation: selectable_grant
    defender:
      band_id: pit-fighters
      profile_id: pit-king
    context:
      rule_id: band--pit-fighter-skill-force-of-will
    expect:
      result.recipients:
      - dwarf-troll-slayer
      - pit-king
      - pit-veterans
  - id: trollheim-recipients
    roles:
    - grant
    - accepted
    - rejected
    operation: selectable_grant
    defender:
      collection: trollheim
      band_id: chaos-streets-pit-fighters
      profile_id: pit-king
    context:
      rule_id: band--pit-fighter-skill-force-of-will
    expect:
      result.recipients:
      - dwarf-troll-slayer
      - pit-king
      - pit-veterans
  - id: selected-rescue
    roles:
    - accepted
    operation: force_of_will
    attacker:
      band_id: pit-fighters
      profile_id: pit-king
      special_rule_ids:
      - band--pit-fighter-skill-force-of-will
    attacker_state:
      condition: OUT
      wounds: 0
    rolls:
    - key: test.force.rescue
      value: 3
    expect:
      result.condition: STANDING
      result.resources_spent:
      - force-of-will
  mutations:
  - id: omit-force
    path: attacker.global_effects.tags
    value: []
    cases:
    - selected-rescue
