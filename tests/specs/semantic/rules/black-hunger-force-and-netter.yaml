  depends_on:
  - mechanic/mechanic.black-hunger
  interpretation: The four rules grant Black Hunger to their exact Hero lists; the editorial Movement
    differences stay outside the duel and share the same combat effect.
  cases:
  - id: eshin-mordheim
    roles:
    - grant
    - accepted
    - rejected
    operation: selectable_grant
    defender:
      band_id: skaven-clan-eshin
      profile_id: assassin-adept
    context:
      rule_id: band--skaven-special-skills-black-hunger
    expect:
      result.recipients:
      - assassin-adept
      - black-skaven
      - eshin-sorcerer
      - night-runners
  - id: pestilens-mordheim
    roles:
    - grant
    - accepted
    - rejected
    operation: selectable_grant
    defender:
      band_id: skaven-clan-pestilens
      profile_id: plague-priest
    context:
      rule_id: band--clan-pestilens-special-skills-black-hunger
    expect:
      result.recipients:
      - monk-initiates
      - pestilens-sorcerer
      - plague-monks
      - plague-priest
  - id: pestilens-lustria
    roles:
    - grant
    - accepted
    - rejected
    operation: selectable_grant
    defender:
      collection: trollheim
      band_id: lustria-clan-pestilens
      profile_id: plague-priest
    context:
      rule_id: band--clan-pestilens-special-skills-black-hunger
    expect:
      result.recipients:
      - monk-initiates
      - pestilens-sorcerer
      - plague-monks
      - plague-priest
  - id: eshin-trollheim
    roles:
    - grant
    - accepted
    - rejected
    operation: selectable_grant
    defender:
      collection: trollheim
      band_id: trollheim-skaven-clan-eshin
      profile_id: assassin-adept
    context:
      rule_id: band--skaven-special-skills-black-hunger
    expect:
      result.recipients:
      - assassin-adept
      - black-skaven
      - eshin-sorcerer
      - night-runners
  - id: selected-effect
    roles:
    - accepted
    operation: round
    attacker:
      band_id: skaven-clan-eshin
      profile_id: assassin-adept
      special_rule_ids:
      - band--skaven-special-skills-black-hunger
    context:
      first_charged: true
    rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.first.attack.1.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.0.first.black-hunger.hits, sides: 3, value: 1}
    - {key: round.0.first.black-hunger.hit.0.wound, value: 1}
    expect:
      attacker.global_effects.attacks_bonus: 0
      result.attacks.0.hit: false
      result.attacks.1.hit: false
      result.attacks.2.hit: false
      result.attacks.3.wounded: false
  mutations:
  - id: omit-black-hunger
    path: attacker.global_effects.tags
    value: []
    cases:
    - selected-effect
