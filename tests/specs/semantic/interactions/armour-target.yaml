  - '{"id": "special-rule.trained-bear--bear-hug", "kind": "compiler", "parameters": {}}'
  interpretation: 'A bear hug that wins its opposed roll inflicts one automatic wound that forbids armour:
    ithilmar armour is not allowed to save. A broken hold deals no damage.'
  cases:
  - id: composition
    roles:
    - composition
    operation: pool
    attacker: *id005
    defender: &id036
      armour_id: armour.ithilmar-armour
    context:
      count: 2
    decisions:
    - key: test.bear-hug
      value: true
    rolls:
    - key: test.attack.0.hit
      value: 4
    - key: test.attack.1.hit
      value: 4
    - key: test.bear-hug.attacker
      value: 3
    - key: test.bear-hug.defender
      value: 2
    expect:
      result.attacks.0.damage: 1
      result.attacks.0.saved: false
      result.defender.wounds: 2
  - id: boundary-hold-broken
    roles:
    - boundary
    operation: pool
    attacker: *id005
    defender: *id036
    context:
      count: 2
    decisions:
    - key: test.bear-hug
      value: true
    rolls:
    - key: test.attack.0.hit
      value: 4
    - key: test.attack.1.hit
      value: 4
    - key: test.bear-hug.attacker
      value: 1
    - key: test.bear-hug.defender
      value: 6
    expect:
      result.attacks: []
      result.defender.wounds: 3
  mutations:
  - id: remove-hug
    path: attacker.global_effects.bear_hug
    value: false
    cases:
    - composition
