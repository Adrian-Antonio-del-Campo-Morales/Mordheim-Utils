- id: interaction-armour.gromril-armour--weapon.vomit-attack
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: interaction
  sources:
  - target: mechanic/armour.gromril-armour
    digest: 0fae8ce2710e1f0697ee9a67b5d4c85b93666c6dca666fba81c49989060ed348
  - target: mechanic/weapon.vomit-attack
    digest: a372171eebddf79c0abcf30a772d8e47fa6fabe20a473f756a080b0d46563217
  bindings:
  - '{"id": "armour.gromril-armour", "kind": "mechanic", "parameters": {}}'
  - '{"id": "weapon.vomit-attack", "kind": "mechanic", "parameters": {}}'
  interpretation: Vomit Attack is one automatic Strength 5 hit that ignores armour saves, so gromril armour
    grants no save and requests no armour die; an unsaved wound still applies normally.
  cases:
  - id: composition
    roles:
    - composition
    operation: armour
    attacker: &id013
      main_weapon_id: weapon.vomit-attack
    defender: &id014
      armour_id: armour.gromril-armour
    expect:
      result.target: 7
      result.eligible: false
      result.saved: false
      result.roll: null
  - id: boundary-pipeline
    roles:
    - boundary
    operation: attack
    attacker: *id013
    defender: *id014
    rolls:
    - key: test.wound
      value: 2
    expect:
      result.hit: true
      result.wounded: true
      result.saved: false
      result.defender.wounds: 2
  mutations:
  - id: drop-vomit-strength
    path: attacker.main_weapon.fixed_strength
    value: 4
    cases:
    - boundary-pipeline
