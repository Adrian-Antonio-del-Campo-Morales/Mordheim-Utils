- id: interaction-armour.gromril-armour--material.gromril
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: interaction
  sources:
  - target: mechanic/armour.gromril-armour
    digest: 1fc7584a6fae80df2fdaff5285f11fb31bcd490215a9bb43e22e618d0f30d80a
  - target: mechanic/material.gromril
    digest: fb76925bf64e3fd3a034d779fc3fecdf8ac17dfac866662c00d87b46d488904c
  bindings:
  - '{"id": "armour.gromril-armour", "kind": "mechanic", "parameters": {}}'
  - '{"id": "material.gromril", "kind": "mechanic", "parameters": {}}'
  interpretation: gromril armour saves on 4+; gromril composes the armour target to 4 plus Strength-based
    modifier, penetration and target bonus. The save is ineligible when the target exceeds 6.
  cases:
  - id: composition
    roles:
    - composition
    operation: armour
    attacker: &id001
      main_weapon_id: weapon.sword
      main_material_id: material.gromril
    defender: &id002
      armour_id: armour.gromril-armour
    rolls:
    - key: armour
      value: 5
    expect:
      result.target: 5
      result.eligible: true
      result.saved: true
  - id: boundary
    roles:
    - boundary
    operation: armour
    attacker: *id001
    defender: *id002
    rolls:
    - key: armour
      value: 4
    expect:
      result.target: 5
      result.eligible: true
      result.saved: false
  mutations:
  - id: remove-penetration
    path: attacker.main_weapon.armour_penetration
    value: 0
    cases:
    - boundary
