- id: interaction-armour.gromril-armour--special-rule.trained-bear--bear-hug
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: interaction
  sources:
  - target: mechanic/armour.no-armour
    digest: 024f80cd28d0c15004d270589c9bc082d2329171d3faf267371e19651f70f57e
  - target: rule/mordheim/kislevites/trained-bear--bear-hug/special-rule.trained-bear--bear-hug
    digest: 84c9b9fa99517158acc43f8342d8ab9cb7dda933ed43290bb1767e723dc5b0b8
  bindings:
  - '{"id": "armour.gromril-armour", "kind": "mechanic", "parameters": {}}'
  - '{"id": "special-rule.trained-bear--bear-hug", "kind": "compiler", "parameters": {}}'
  interpretation: 'A bear hug that wins its opposed roll inflicts one automatic wound that forbids armour:
    gromril armour is not allowed to save. A broken hold deals no damage.'
  cases:
  - id: composition
    roles:
    - composition
    operation: pool
    attacker: &id005
      band_id: kislevites
      profile_id: trained-bear
    defender: &id006
      armour_id: armour.gromril-armour
    context:
      count: 2
    decisions:
    - key: test.bear-hug
      value: true
    rolls:
    - key: test.attack.0.hit
      value: 4
    - key: test.attack.1.hit
      value: 4
    - key: test.bear-hug.attacker
      value: 3
    - key: test.bear-hug.defender
      value: 2
    expect:
      result.attacks.0.damage: 1
      result.attacks.0.saved: false
      result.defender.wounds: 2
  - id: boundary-hold-broken
    roles:
    - boundary
    operation: pool
    attacker: *id005
    defender: *id006
    context:
      count: 2
    decisions:
    - key: test.bear-hug
      value: true
    rolls:
    - key: test.attack.0.hit
      value: 4
    - key: test.attack.1.hit
      value: 4
    - key: test.bear-hug.attacker
      value: 1
    - key: test.bear-hug.defender
      value: 6
    expect:
      result.attacks: []
      result.defender.wounds: 3
  mutations:
  - id: remove-hug
    path: attacker.global_effects.bear_hug
    value: false
    cases:
    - composition
