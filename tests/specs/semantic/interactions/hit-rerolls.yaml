schema_version: 1
specifications:
- id: interaction-skill.axe-expert--skill.blessed-sight
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: interaction
  sources:
  - target: mechanic/skill.axe-expert
    digest: 1fde7fb9e58b29892c0d0cf1ec6588f9efdfe96b8ac4c9c04ee101b56f86ce7d
  - target: mechanic/skill.blessed-sight
    digest: 04ffa206b9b912ef721a84eda69bc6e785b7e050917b52af57c0e5ec697dec0d
  bindings:
  - '{"id": "skill.axe-expert", "kind": "mechanic", "parameters": {}}'
  - '{"id": "skill.blessed-sight", "kind": "mechanic", "parameters": {}}'
  interpretation: Blessed Sight rerolls missed hits unconditionally; Axe Expert's conditional charge reroll
    overlaps harmlessly while charging.
  cases:
  - id: composition
    roles:
    - composition
    operation: hit
    attacker: &id001
      main_weapon_id: weapon.axe
      skill_ids:
      - skill.axe-expert
      - skill.blessed-sight
    rolls:
    - key: hit
      value: 2
    - key: hit.reroll
      value: 5
    expect:
      result.success: true
      result.rerolled: true
  - id: boundary-reroll-fails
    roles:
    - boundary
    operation: hit
    attacker: *id001
    context:
      first_round: true
      charging: true
    rolls:
    - key: hit
      value: 2
    - key: hit.reroll
      value: 2
    expect:
      result.success: false
      result.rerolled: true
  mutations:
  - id: remove-reroll-source
    path: attacker.global_effects.reroll_hits
    value: false
    cases:
    - composition
