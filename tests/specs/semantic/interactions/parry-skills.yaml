    digest: 58ab55ad675e1f2a898107a0e4924f4505f0b1323689cddb3a9f328227f9d9ba
  bindings:
  - '{"id": "combat-parry", "kind": "core", "parameters": {}}'
  - '{"id": "skill.crushing-blow", "kind": "mechanic", "parameters": {}}'
  interpretation: Crushing Blow makes the attacker's hits unparriable, so even a sword-wielding defender
    attempts no parry; a natural 6 also cannot be parried.
  cases:
  - id: composition
    roles:
    - composition
    operation: parry
    attacker: &id003
      main_weapon_id: weapon.axe
      skill_ids:
      - skill.crushing-blow
    defender: &id004
      main_weapon_id: weapon.sword
      skill_ids: []
    context:
      hit_roll: 4
    expect:
      result.attempted: false
      result.blocked: false
  - id: boundary-natural-six
    roles:
    - boundary
    operation: parry
    attacker: *id003
    defender: *id004
    context:
      hit_roll: 6
    expect:
      result.attempted: false
      result.blocked: false
  mutations:
  - id: allow-parry
    path: attacker.global_effects.cannot_be_parried
    value: false
    cases:
    - composition
