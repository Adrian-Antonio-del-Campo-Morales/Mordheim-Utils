schema_version: 1
specifications:
- id: interaction-combat-parry--skill.axe-master
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: interaction
  sources:
  - target: core/combat-parry
    digest: f9d794736441b911878c20348e1f7dfac785fdca80dcc47b5eaa625514dcc9f3
  - target: mechanic/skill.axe-master
    digest: 76ad2fdf3544d16b0b9855ba09076cb541b7cf547c25efc30e0cccc2e4b3e474
  bindings:
  - '{"id": "combat-parry", "kind": "core", "parameters": {}}'
  - '{"id": "skill.axe-master", "kind": "mechanic", "parameters": {}}'
  interpretation: Axe Master lets normal axes parry one eligible hit; the parry must beat the hit roll.
  cases:
  - id: composition
    roles:
    - composition
    operation: parry
    attacker: &id001
      main_weapon_id: weapon.axe
    defender: &id002
      main_weapon_id: weapon.axe
      skill_ids:
      - skill.axe-master
    context:
      hit_roll: 4
    rolls:
    - key: test.parry
      value: 5
    expect:
      result.attempted: true
      result.blocked: true
  - id: boundary
    roles:
    - boundary
    operation: parry
    attacker: *id001
    defender: *id002
    context:
      hit_roll: 4
    rolls:
    - key: test.parry
      value: 4
    expect:
      result.attempted: true
      result.blocked: false
  mutations:
  - id: remove-parry-composition
    changes:
    - path: defender.global_effects.tags
      value: []
    cases:
    - composition
- id: interaction-combat-parry--skill.crushing-blow
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: interaction
  sources:
  - target: core/combat-parry
