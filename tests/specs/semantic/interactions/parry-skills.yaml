schema_version: 1
specifications:
- id: interaction-combat-parry--skill.axe-master
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: interaction
  sources:
  - target: core/combat-parry
    digest: 6fac0f07b95940d04ac3ce0c50ebd9c7ca68a0b454d07af8c5b6c65d0fbeea7c
  - target: mechanic/skill.axe-master
    digest: 1d27b6f5ee3aa5cbe37e614887667ccd79726c37b738d4b56f9c0a89e9b0589a
  bindings:
  - '{"id": "combat-parry", "kind": "core", "parameters": {}}'
  - '{"id": "skill.axe-master", "kind": "mechanic", "parameters": {}}'
  interpretation: Axe Master lets normal axes parry one eligible hit; the parry must beat the hit roll.
  cases:
  - id: composition
    roles:
    - composition
    operation: parry
    attacker: &id001
      main_weapon_id: weapon.axe
    defender: &id002
      main_weapon_id: weapon.axe
      skill_ids:
      - skill.axe-master
    context:
      hit_roll: 4
    rolls:
    - key: test.parry
      value: 5
    expect:
      result.attempted: true
      result.blocked: true
  - id: boundary
    roles:
    - boundary
    operation: parry
    attacker: *id001
    defender: *id002
    context:
      hit_roll: 4
    rolls:
    - key: test.parry
      value: 4
    expect:
      result.attempted: true
      result.blocked: false
  mutations:
  - id: remove-parry-composition
    changes:
    - path: defender.global_effects.tags
      value: []
    cases:
    - composition
- id: interaction-combat-parry--skill.crushing-blow
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: interaction
