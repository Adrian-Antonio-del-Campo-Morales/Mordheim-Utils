- id: gromril-axe-penetration
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: interaction
  sources:
  - target: mechanic/weapon.axe
    digest: 331fe535d241616ebe9c23e0b6084bf29105b5799abb42da5217032862efec81
  - target: mechanic/material.gromril
    digest: e7dd5d61e2f8e547890471309390d16ddbb8346753e64efc6241fcaba00aa5c4
  bindings:
  - '{"id": "weapon.axe", "kind": "mechanic", "parameters": {}}'
  - '{"id": "material.gromril", "kind": "mechanic", "parameters": {}}'
  interpretation: The axe and Gromril material each worsen the opponent's armour save by one. A 4+ save becomes
    6+ before any Strength penalty.
  cases:
  - id: all-dice
    roles:
    - composition
    - boundary
    operation: armour
    attacker:
      main_weapon_id: weapon.axe
      main_material_id: material.gromril
    defender:
      armour_id: armour.gromril-armour
    distribution:
      observable: result.saved
      max_rolls: 1
      expected:
        'true': 1/6
        'false': 5/6
  - id: unarmoured
    roles:
    - boundary
    operation: armour
    attacker:
      main_weapon_id: weapon.axe
      main_material_id: material.gromril
    expect:
      result.eligible: false
  mutations:
  - id: drop-material-penetration
    path: attacker.main_weapon.armour_penetration
    value: 1
    cases:
    - all-dice
