- id: gromril-axe-penetration
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: interaction
  sources:
  - target: mechanic/weapon.axe
    digest: 09c9456b69a681caf93ea7c4b8413136bc962e64361feebb2d78f7cc89acabcd
  - target: mechanic/material.gromril
    digest: a17de6d34129184b9269ed1921d45c3130197806de9cbdeeb36cd5a6fd7dde5a
  bindings:
  - '{"id": "weapon.axe", "kind": "mechanic", "parameters": {}}'
  - '{"id": "material.gromril", "kind": "mechanic", "parameters": {}}'
  interpretation: The axe and Gromril material each worsen the opponent's armour save by one. A 4+ save
    becomes 6+ before any Strength penalty.
  cases:
  - id: all-dice
    roles:
    - composition
    - boundary
    operation: armour
    attacker:
      main_weapon_id: weapon.axe
      main_material_id: material.gromril
    defender:
      armour_id: armour.gromril-armour
    distribution:
      observable: result.saved
      max_rolls: 1
      expected:
        'true': 1/6
        'false': 5/6
  - id: unarmoured
    roles:
    - boundary
    operation: armour
    attacker:
      main_weapon_id: weapon.axe
      main_material_id: material.gromril
    expect:
      result.eligible: false
  mutations:
  - id: drop-material-penetration
    path: attacker.main_weapon.armour_penetration
    value: 1
    cases:
    - all-dice
