- id: hatred-and-infinite-hatred
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: interaction
  sources:
  - target: mechanic/skill.hatred
    digest: 55903f96c0da47a95bba838dc0d85778de25d638c945f5d81c4fca0e83cbe923
  - target: mechanic/skill.infinite-hatred
    digest: 04e5fb5a6e2b7e4f0aa920b8ac8d0af91b41595a3259db12e42c469c65f47710
  bindings:
  - '{"id": "skill.hatred", "kind": "mechanic", "parameters": {}}'
  - '{"id": "skill.infinite-hatred", "kind": "mechanic", "parameters": {}}'
  interpretation: Two independent permissions to reroll a failed roll do not allow rerolling a reroll. On a 4+ threshold
    success is exactly 3/4, not 7/8.
  cases:
  - id: all-branches
    roles:
    - composition
    operation: hit
    attacker:
      main_weapon_id: weapon.sword
      skill_ids:
      - skill.hatred
      - skill.infinite-hatred
    context:
      first_round: true
      charging: true
    distribution:
      observable: result.success
      max_rolls: 3
      expected:
        'true': 3/4
        'false': 1/4
  - id: failed-reroll-is-final
    roles:
    - boundary
    operation: hit
    attacker:
      main_weapon_id: weapon.sword
      skill_ids:
      - skill.hatred
      - skill.infinite-hatred
    context:
      first_round: true
      charging: true
    rolls:
    - key: hit
      value: 1
    - key: hit.reroll
      value: 1
    expect:
      result.success: false
      result.rerolled: true
  mutations:
  - id: remove-reroll-permissions
    changes:
    - path: attacker.global_effects.tags
      value: []
    - path: attacker.global_effects.reroll_hits
      value: false
    - path: attacker.global_effects.reroll_wounds
      value: false
    - path: attacker.main_weapon.reroll_wounds
      value: false
    cases:
    - all-branches
