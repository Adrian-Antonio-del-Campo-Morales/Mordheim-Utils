schema_version: 1
specifications:
- id: thick-skull-replaces-helmet
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: interaction
  sources:
  - target: mechanic/skill.thick-skull
    digest: efd91f744410d43bf0bdd3cbad2087cd33e59665f5cb8810faacbb0891dd07e8
  - target: mechanic/defence.helmet
    digest: d5f71a8fcd1cd526a9c02434e677caf9432ab33e93149e0e2cc92859e9defa59
  bindings:
  - '{"id": "skill.thick-skull", "kind": "mechanic", "parameters": {}}'
  - '{"id": "defence.helmet", "kind": "mechanic", "parameters": {}}'
  interpretation: The Thick Skull text explicitly replaces the Helmet special rule. The combined threshold
    is 2+; it does not perform a 3+ Thick Skull attempt followed by a separate 4+ Helmet attempt.
  cases:
  - id: combined-threshold
    roles:
    - composition
    operation: stun_reaction
    defender:
      skill_ids:
      - skill.thick-skull
      defence_ids:
      - defence.helmet
    rolls:
    - key: test.thick-skull
      value: 2
    expect:
      result.condition: KNOCKED_DOWN
      result.threshold: 2
      result.roll: 2
  - id: failure-consumes-no-helmet-roll
    roles:
    - boundary
    operation: stun_reaction
    defender:
      skill_ids:
      - skill.thick-skull
      defence_ids:
      - defence.helmet
    rolls:
    - key: test.thick-skull
      value: 1
    expect:
      result.condition: STUNNED
      result.threshold: 2
      result.roll: 1
  mutations:
  - id: remove-replacement
    path: defender.global_effects.thick_skull
    value: false
    cases:
    - combined-threshold
- id: mighty-and-resilient
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: interaction
  sources:
  - target: mechanic/skill.mighty-blow
    digest: 2e085e3c62551f1fa511233d49cc39e6f109e947f1be486a61a0c73837ccea4a
  - target: mechanic/skill.resilient
    digest: 849c6b30b6927260b285a6eff26cca9fc16a6f23563f4a179277466538c0d43a
  bindings:
  - '{"id": "skill.mighty-blow", "kind": "mechanic", "parameters": {}}'
  - '{"id": "skill.resilient", "kind": "mechanic", "parameters": {}}'
  interpretation: Apply the independently specified Strength contributions before wounding. Resilient
    reduces only wounding Strength, not armour Strength; charging/first-round bonuses expire as stated.
  cases:
  - id: first-round
    roles:
    - composition
    operation: strength
    attacker:
      main_weapon_id: weapon.sword
      skill_ids:
      - skill.mighty-blow
    defender:
      skill_ids:
      - skill.resilient
    context:
      first_round: true
      charging: true
    expect:
      result.wound: 3
      result.armour: 4
  - id: later-round
    roles:
    - boundary
    operation: strength
    attacker:
      main_weapon_id: weapon.sword
      skill_ids:
      - skill.mighty-blow
    defender:
      skill_ids:
      - skill.resilient
    expect:
      result.wound: 3
      result.armour: 4
  mutations:
  - id: remove-contribution
    path: attacker.global_effects.strength_bonus
    value: 0
    cases:
    - first-round
