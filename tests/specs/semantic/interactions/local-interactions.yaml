schema_version: 1
specifications:
- id: thick-skull-replaces-helmet
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: interaction
  sources:
  - target: mechanic/skill.thick-skull
    digest: 4819600fd8bc2849d0a915b323b8729882c37119a23174442c005e3978ff635f
  - target: mechanic/defence.helmet
    digest: e38f4f8e7da5e91fa8400e0f91b8b4389b266c73cbde0c7896f22388719c4926
  bindings:
  - '{"id": "skill.thick-skull", "kind": "mechanic", "parameters": {}}'
  - '{"id": "defence.helmet", "kind": "mechanic", "parameters": {}}'
  interpretation: The Thick Skull text explicitly replaces the Helmet special rule. The combined threshold is 2+;
    it does not perform a 3+ Thick Skull attempt followed by a separate 4+ Helmet attempt.
  cases:
  - id: combined-threshold
    roles: [composition]
    operation: stun_reaction
    defender:
      skill_ids: [skill.thick-skull]
      defence_ids: [defence.helmet]
    rolls: [{key: test.thick-skull, value: 2}]
    expect:
      result.condition: KNOCKED_DOWN
      result.threshold: 2
      result.roll: 2
  - id: failure-consumes-no-helmet-roll
    roles: [boundary]
    operation: stun_reaction
    defender:
      skill_ids: [skill.thick-skull]
      defence_ids: [defence.helmet]
    rolls: [{key: test.thick-skull, value: 1}]
    expect:
      result.condition: STUNNED
      result.threshold: 2
      result.roll: 1
  mutations:
  - id: remove-replacement
    path: defender.global_effects.thick_skull
    value: false
    cases: [combined-threshold]
- id: mighty-and-resilient
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: interaction
  sources:
  - target: mechanic/skill.mighty-blow
