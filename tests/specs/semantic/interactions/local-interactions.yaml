- id: hatred-and-infinite-hatred
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: interaction
  sources:
  - target: mechanic/skill.hatred
    digest: 581c1dc7c5a768c0cb43f98cda42027dae221a3068f72611f9e170e72e40e8ad
  - target: mechanic/skill.infinite-hatred
    digest: 1d5e211bd8c705167bde654adf528fcd7852e194d3f28c316e5f2069a4cbd5e7
  bindings:
  - '{"id": "skill.hatred", "kind": "mechanic", "parameters": {}}'
  - '{"id": "skill.infinite-hatred", "kind": "mechanic", "parameters": {}}'
  interpretation: Two independent permissions to reroll a failed roll do not allow rerolling a reroll.
    On a 4+ threshold success is exactly 3/4, not 7/8.
  cases:
  - id: all-branches
    roles:
    - composition
    operation: hit
    attacker:
      main_weapon_id: weapon.sword
      skill_ids:
      - skill.hatred
      - skill.infinite-hatred
    context:
      first_round: true
      charging: true
    distribution:
      observable: result.success
      max_rolls: 3
      expected:
        'true': 3/4
        'false': 1/4
  - id: failed-reroll-is-final
    roles:
    - boundary
    operation: hit
    attacker:
      main_weapon_id: weapon.sword
      skill_ids:
      - skill.hatred
      - skill.infinite-hatred
    context:
      first_round: true
      charging: true
    rolls:
    - key: hit
      value: 1
    - key: hit.reroll
      value: 1
    expect:
      result.success: false
      result.rerolled: true
  mutations:
  - id: remove-reroll-permissions
    changes:
    - path: attacker.global_effects.tags
      value: []
    - path: attacker.global_effects.reroll_hits
      value: false
    - path: attacker.global_effects.reroll_wounds
      value: false
    - path: attacker.main_weapon.reroll_wounds
      value: false
    cases:
    - all-branches
