    digest: 16444ea9794523d0da8cef415f236f7de696506aa00d34440958584857358a93
  - target: mechanic/skill.resilient
    digest: 7c15682b8523bbb3e8109ed734bfd6108f07bda21d6d7f1833dca2c0170ad6d6
  bindings:
  - '{"id": "skill.mighty-blow", "kind": "mechanic", "parameters": {}}'
  - '{"id": "skill.resilient", "kind": "mechanic", "parameters": {}}'
  interpretation: Apply the independently specified Strength contributions before wounding. Resilient
    reduces only wounding Strength, not armour Strength; charging/first-round bonuses expire as stated.
  cases:
  - id: first-round
    roles:
    - composition
    operation: strength
    attacker:
      main_weapon_id: weapon.sword
      skill_ids:
      - skill.mighty-blow
    defender:
      skill_ids:
      - skill.resilient
    context:
      first_round: true
      charging: true
    expect:
      result.wound: 3
      result.armour: 4
  - id: later-round
    roles:
    - boundary
    operation: strength
    attacker:
      main_weapon_id: weapon.sword
      skill_ids:
      - skill.mighty-blow
    defender:
      skill_ids:
      - skill.resilient
    expect:
      result.wound: 3
      result.armour: 4
  mutations:
  - id: remove-contribution
    path: attacker.global_effects.strength_bonus
    value: 0
    cases:
    - first-round
