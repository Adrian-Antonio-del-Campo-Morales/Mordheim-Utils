schema_version: 1
specifications:
- id: thick-skull-replaces-helmet
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: interaction
  sources:
  - target: mechanic/skill.thick-skull
    digest: 2ecbff4a299a46b96fc4b0c5f24f4b34f75a711341173e7c2fbe06edbd3204bf
  - target: mechanic/defence.helmet
    digest: 3b7f47e7319a54f1c36099c21353c232df5bc062f87bdbd73d6d886ce0ff93c9
  bindings:
  - '{"id": "skill.thick-skull", "kind": "mechanic", "parameters": {}}'
  - '{"id": "defence.helmet", "kind": "mechanic", "parameters": {}}'
  interpretation: The Thick Skull text explicitly replaces the Helmet special rule. The combined threshold
    is 2+; it does not perform a 3+ Thick Skull attempt followed by a separate 4+ Helmet attempt.
  cases:
  - id: combined-threshold
    roles:
    - composition
    operation: stun_reaction
    defender:
      skill_ids:
      - skill.thick-skull
      defence_ids:
      - defence.helmet
    rolls:
    - key: test.thick-skull
      value: 2
    expect:
      result.condition: KNOCKED_DOWN
      result.threshold: 2
      result.roll: 2
  - id: failure-consumes-no-helmet-roll
    roles:
    - boundary
    operation: stun_reaction
    defender:
      skill_ids:
      - skill.thick-skull
      defence_ids:
      - defence.helmet
    rolls:
    - key: test.thick-skull
      value: 1
    expect:
      result.condition: STUNNED
      result.threshold: 2
      result.roll: 1
  mutations:
  - id: remove-replacement
    path: defender.global_effects.thick_skull
    value: false
    cases:
    - combined-threshold
- id: mighty-and-resilient
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: interaction
  sources:
  - target: mechanic/skill.mighty-blow
    digest: 1d501bd7dccf1fd055a2304c981bdefc880eae91807716281aba0a89cdc18752
  - target: mechanic/skill.resilient
    digest: fc71b79caf70e599197ca56a90e2083964ba604ef73688e8cb9ec5c15e3b42de
  bindings:
  - '{"id": "skill.mighty-blow", "kind": "mechanic", "parameters": {}}'
  - '{"id": "skill.resilient", "kind": "mechanic", "parameters": {}}'
  interpretation: Apply the independently specified Strength contributions before wounding. Resilient
    reduces only wounding Strength, not armour Strength; charging/first-round bonuses expire as stated.
  cases:
  - id: first-round
    roles:
    - composition
    operation: strength
    attacker:
      main_weapon_id: weapon.sword
      skill_ids:
      - skill.mighty-blow
    defender:
      skill_ids:
      - skill.resilient
    context:
      first_round: true
      charging: true
    expect:
      result.wound: 3
      result.armour: 4
  - id: later-round
    roles:
    - boundary
    operation: strength
    attacker:
      main_weapon_id: weapon.sword
      skill_ids:
      - skill.mighty-blow
    defender:
      skill_ids:
      - skill.resilient
    expect:
      result.wound: 3
      result.armour: 4
  mutations:
  - id: remove-contribution
    path: attacker.global_effects.strength_bonus
    value: 0
    cases:
    - first-round
