- id: jump-up-and-no-pain
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: interaction
  sources:
  - target: mechanic/skill.jump-up
    digest: a8bf2a5b1275d395a3bb754fdad1a5605ad20c1097f374e389c288ac75459db1
  - target: mechanic/skill.ignore-pain
    digest: b7f2f8f45188f5a498dbb8a7743fc675e38614e972004c698c7088c7584fc384
  bindings:
  - '{"id": "skill.jump-up", "kind": "mechanic", "parameters": {}}'
  - '{"id": "skill.ignore-pain", "kind": "mechanic", "parameters": {}}'
  interpretation: Apply the printed injury table, then Concussion/No Pain/Jump Up with their explicit
    exceptions. Every original D6 face has an independent expected final state.
  cases:
  - id: face-1
    roles:
    - composition
    - boundary
    operation: injury
    attacker:
      main_weapon_id: weapon.sword
    defender:
      skill_ids:
      - skill.jump-up
      - skill.ignore-pain
    rolls:
    - key: test.injury
      value: 1
    expect:
      result.condition: STANDING
  - id: face-2
    roles:
    - composition
    - boundary
    operation: injury
    attacker:
      main_weapon_id: weapon.sword
    defender:
      skill_ids:
      - skill.jump-up
      - skill.ignore-pain
    rolls:
    - key: test.injury
      value: 2
    expect:
      result.condition: STANDING
  - id: face-3
    roles:
    - composition
    - boundary
    operation: injury
    attacker:
      main_weapon_id: weapon.sword
    defender:
      skill_ids:
      - skill.jump-up
      - skill.ignore-pain
    rolls:
    - key: test.injury
      value: 3
    expect:
      result.condition: KNOCKED_DOWN
  - id: face-4
    roles:
    - composition
    - boundary
    operation: injury
    attacker:
      main_weapon_id: weapon.sword
    defender:
      skill_ids:
      - skill.jump-up
      - skill.ignore-pain
    rolls:
    - key: test.injury
      value: 4
    expect:
      result.condition: KNOCKED_DOWN
  - id: face-5
    roles:
    - composition
    - boundary
    operation: injury
    attacker:
      main_weapon_id: weapon.sword
    defender:
      skill_ids:
      - skill.jump-up
      - skill.ignore-pain
    rolls:
    - key: test.injury
      value: 5
    expect:
      result.condition: OUT
  - id: face-6
    roles:
    - composition
    - boundary
    operation: injury
    attacker:
      main_weapon_id: weapon.sword
    defender:
      skill_ids:
      - skill.jump-up
      - skill.ignore-pain
    rolls:
    - key: test.injury
      value: 6
    expect:
      result.condition: OUT
  mutations:
  - id: remove-one-operator
    path: defender.global_effects.tags
    value:
    - skill.ignore-pain
    cases:
    - face-1
    - face-2
    - face-3
    - face-4
    - face-5
    - face-6
