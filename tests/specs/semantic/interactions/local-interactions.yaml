  - target: mechanic/skill.resilient
    digest: c1d7210e8e6a2400a99605bbfc369806e39dbad2c810fe515eaf0a01ac10167a
  bindings:
  - '{"id": "skill.mighty-blow", "kind": "mechanic", "parameters": {}}'
  - '{"id": "skill.resilient", "kind": "mechanic", "parameters": {}}'
  interpretation: Apply the independently specified Strength contributions before wounding. Resilient reduces only
    wounding Strength, not armour Strength; charging/first-round bonuses expire as stated.
  cases:
  - id: first-round
    roles:
    - composition
    operation: strength
    attacker:
      main_weapon_id: weapon.sword
      skill_ids:
      - skill.mighty-blow
    defender:
      skill_ids:
      - skill.resilient
    context:
      first_round: true
      charging: true
    expect:
      result.wound: 3
      result.armour: 4
  - id: later-round
    roles:
    - boundary
    operation: strength
    attacker:
      main_weapon_id: weapon.sword
      skill_ids:
      - skill.mighty-blow
    defender:
      skill_ids:
      - skill.resilient
    expect:
      result.wound: 3
      result.armour: 4
  mutations:
  - id: remove-contribution
    path: attacker.global_effects.strength_bonus
    value: 0
    cases:
    - first-round
