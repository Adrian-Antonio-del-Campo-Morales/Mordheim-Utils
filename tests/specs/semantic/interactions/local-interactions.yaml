- id: jump-up-and-no-pain
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: interaction
  sources:
  - target: mechanic/skill.jump-up
    digest: bd0549a145021fce8abf6155da85b25ee905d7aeee2aed09bb371fdf1ef51ea2
  - target: mechanic/skill.ignore-pain
    digest: f25a1289989017d8a76c3c6230f5527ff0e1333e7fa7de218495c02db820ddc4
  bindings:
  - '{"id": "skill.jump-up", "kind": "mechanic", "parameters": {}}'
  - '{"id": "skill.ignore-pain", "kind": "mechanic", "parameters": {}}'
  interpretation: Apply the printed injury table, then Concussion/No Pain/Jump Up with their explicit
    exceptions. Every original D6 face has an independent expected final state.
  cases:
  - id: face-1
    roles:
    - composition
    - boundary
    operation: injury
    attacker:
      main_weapon_id: weapon.sword
    defender:
      skill_ids:
      - skill.jump-up
      - skill.ignore-pain
    rolls:
    - key: test.injury
      value: 1
    expect:
      result.condition: STANDING
  - id: face-2
    roles:
    - composition
    - boundary
    operation: injury
    attacker:
      main_weapon_id: weapon.sword
    defender:
      skill_ids:
      - skill.jump-up
      - skill.ignore-pain
    rolls:
    - key: test.injury
      value: 2
    expect:
      result.condition: STANDING
  - id: face-3
    roles:
    - composition
    - boundary
    operation: injury
    attacker:
      main_weapon_id: weapon.sword
    defender:
      skill_ids:
      - skill.jump-up
      - skill.ignore-pain
    rolls:
    - key: test.injury
      value: 3
    expect:
      result.condition: KNOCKED_DOWN
  - id: face-4
    roles:
    - composition
    - boundary
    operation: injury
    attacker:
      main_weapon_id: weapon.sword
    defender:
      skill_ids:
      - skill.jump-up
      - skill.ignore-pain
    rolls:
    - key: test.injury
      value: 4
    expect:
      result.condition: KNOCKED_DOWN
  - id: face-5
    roles:
    - composition
    - boundary
    operation: injury
    attacker:
      main_weapon_id: weapon.sword
    defender:
      skill_ids:
      - skill.jump-up
      - skill.ignore-pain
    rolls:
    - key: test.injury
      value: 5
    expect:
      result.condition: OUT
  - id: face-6
    roles:
    - composition
    - boundary
    operation: injury
    attacker:
      main_weapon_id: weapon.sword
    defender:
      skill_ids:
      - skill.jump-up
      - skill.ignore-pain
    rolls:
    - key: test.injury
      value: 6
    expect:
      result.condition: OUT
  mutations:
  - id: remove-one-operator
    path: defender.global_effects.tags
    value:
    - skill.ignore-pain
    cases:
    - face-1
    - face-2
    - face-3
    - face-4
    - face-5
    - face-6
