  bindings:
  - '{"id": "combat-order", "kind": "core", "parameters": {}}'
  - '{"id": "skill.lightning-reflexes", "kind": "mechanic", "parameters": {}}'
  interpretation: Lightning Reflexes strikes first when charged in the first round.
  cases:
  - id: composition
    roles:
    - composition
    operation: acting_order
    attacker: &id003
      skill_ids:
      - skill.lightning-reflexes
    context:
      first_round: true
      charged: true
    expect:
      result.first_acts: true
  - id: boundary-tie
    roles:
    - boundary
    operation: acting_order
    attacker: *id003
    expect:
      result.first_acts: false
    rolls:
    - key: priority-tie
      value: 2
  mutations:
  - id: remove-composed-priority
    path: attacker.global_effects.tags
    value: []
    cases:
    - composition
