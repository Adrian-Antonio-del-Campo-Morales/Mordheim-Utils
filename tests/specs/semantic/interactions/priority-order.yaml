schema_version: 1
specifications:
- id: interaction-combat-injury-states--combat-order
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: interaction
  sources:
  - target: core/combat-injury-states
    digest: 6ebab2fe75e34a9988241a00bb6ea24707aaca83f42bd24da2feae80d3f14f60
  - target: core/combat-order
    digest: 87d7d16095a993475ed9065b0600c9adfc774ffc7b0ac2d499da7db435ad7dde
  bindings:
  - '{"id": "combat-injury-states", "kind": "core", "parameters": {}}'
  - '{"id": "combat-order", "kind": "core", "parameters": {}}'
  interpretation: A warrior who stood up in the Recovery phase strikes last, behind ordinary order.
  cases:
  - id: composition
    roles:
    - composition
    operation: acting_order
    context:
      stood_up: true
    expect:
      result.first_acts: false
  - id: boundary
    roles:
    - boundary
    operation: acting_order
    context:
      initiative_bonus: 1
    expect:
      result.first_acts: true
  mutations:
  - id: compose-against-strike-last
    path: attacker.global_effects.priority
    value: -1
    cases:
    - boundary
- id: interaction-combat-injury-states--skill.strongman
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: interaction
  sources:
  - target: core/combat-injury-states
    digest: 6ebab2fe75e34a9988241a00bb6ea24707aaca83f42bd24da2feae80d3f14f60
  - target: mechanic/skill.strongman
    digest: ea55e115ac7781508705a6cd115f45169889e319d10ec933c3881131d97abfaa
  bindings:
  - '{"id": "combat-injury-states", "kind": "core", "parameters": {}}'
  - '{"id": "skill.strongman", "kind": "mechanic", "parameters": {}}'
  interpretation: Standing up makes even a Strongman with a double-handed weapon strike last.
  cases:
  - id: composition
    roles:
    - composition
    operation: acting_order
    attacker: &id001
      main_weapon_id: weapon.double-handed-weapon
      skill_ids:
      - skill.strongman
    context:
      stood_up: true
    expect:
      result.first_acts: false
  - id: boundary
    roles:
    - boundary
    operation: acting_order
    attacker: *id001
    defender:
      main_weapon_id: weapon.double-handed-weapon
    expect:
      result.first_acts: true
  mutations:
  - id: compose-against-strike-last
    path: defender.main_weapon.priority
    value: 0
    cases:
    - boundary
- id: interaction-combat-order--skill.always-strikes-first
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: interaction
  sources:
  - target: core/combat-order
    digest: 87d7d16095a993475ed9065b0600c9adfc774ffc7b0ac2d499da7db435ad7dde
  - target: mechanic/skill.always-strikes-first
    digest: 711130b5def4ac1dfbe955daf79ea4c9cc83258c5a793cb4c6ac3b5ee9b5552f
  bindings:
  - '{"id": "combat-order", "kind": "core", "parameters": {}}'
  - '{"id": "skill.always-strikes-first", "kind": "mechanic", "parameters": {}}'
  interpretation: Always Strikes First raises priority above the ordinary Initiative order.
  cases:
  - id: composition
    roles:
    - composition
    operation: acting_order
    attacker: &id002
      skill_ids:
      - skill.always-strikes-first
    expect:
      result.first_acts: true
  - id: boundary-opponent
    roles:
    - boundary
    operation: acting_order
    attacker: *id002
    defender:
      skill_ids:
      - skill.always-strikes-first
    expect:
      result.first_acts: false
    rolls:
    - key: priority-tie
      value: 1
  mutations:
  - id: remove-composed-priority
    path: attacker.global_effects.priority
    value: 0
    cases:
    - composition
- id: interaction-combat-order--skill.lightning-reflexes
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
