schema_version: 1
specifications:
- id: elven-agility-with-step-aside
  scope_digest: ea4090654a79e79bb19b0855371a062c6a9a10c1ab40f7d8abdb42634a425b97
  category: interaction
  sources:
  - target: mechanic/skill.elven-agility
    digest: bb0e3c7c75175768eed4f554802b456815d01f39b1ec6ef14289908d7df4d811
  - target: mechanic/skill.step-aside
    digest: 96ab9d0b363143db037d2e004af149263c7dd5a84da600222b068e9ce83381bf
  bindings:
  - '{"id": "skill.elven-agility", "kind": "mechanic", "parameters": {}}'
  - '{"id": "skill.step-aside", "kind": "mechanic", "parameters": {}}'
  interpretation: For close combat, Step Aside's 5+ and Elven Agility's 6+ do not produce sequential saves.
    Their explicit combination is a single 4+ save, so exactly one D6 is consumed.
  cases:
  - id: exact-combined-save
    roles:
    - composition
    - boundary
    operation: special_save
    defender:
      skill_ids:
      - skill.elven-agility
      - skill.step-aside
    distribution:
      observable: result.saved
      max_rolls: 1
      expected:
        'true': 1/2
        'false': 1/2
  mutations:
  - id: drop-elven-improvement
    changes:
    - path: defender.global_effects.ward_save
      value: 7
    - path: defender.global_effects.tags
      value: []
    cases:
    - exact-combined-save
