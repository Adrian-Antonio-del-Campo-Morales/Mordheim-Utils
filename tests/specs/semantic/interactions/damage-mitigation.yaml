- id: interaction-combat-injury-states--special-rule.trained-bear--bear-hug
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: interaction
  sources:
  - target: core/combat-injury-states
    digest: 64a57c5ff255e05697f2ec654d8d510bb11fd8cadf1fcbb870df5c7028ab88ed
  - target: rule/mordheim/kislevites/trained-bear--bear-hug/special-rule.trained-bear--bear-hug
    digest: 13deefeb497e8e1cc5c0f2f27763b987ec9d70b854f763ea9037d97ee0ecf326
  bindings:
  - '{"id": "combat-injury-states", "kind": "core", "parameters": {}}'
  - '{"id": "special-rule.trained-bear--bear-hug", "kind": "compiler", "parameters": {}}'
  interpretation: A won bear hug inflicts one automatic unsaved wound before the Injury states; a broken
    hold deals no damage.
  cases:
  - id: composition
    roles:
    - composition
    operation: pool
    attacker: &id012
      band_id: kislevites
      profile_id: trained-bear
    context:
      count: 2
    decisions:
    - key: test.bear-hug
      value: true
    rolls:
    - key: test.attack.0.hit
      value: 4
    - key: test.attack.1.hit
      value: 4
    - key: test.bear-hug.attacker
      value: 3
    - key: test.bear-hug.defender
      value: 2
    expect:
      result.attacks.0.damage: 1
      result.defender.wounds: 2
  - id: boundary-hold-broken
    roles:
    - boundary
    operation: pool
    attacker: *id012
    context:
      count: 2
    decisions:
    - key: test.bear-hug
      value: true
    rolls:
    - key: test.attack.0.hit
      value: 4
    - key: test.attack.1.hit
      value: 4
    - key: test.bear-hug.attacker
      value: 1
    - key: test.bear-hug.defender
      value: 6
    expect:
      result.attacks: []
      result.defender.wounds: 3
  mutations:
  - id: remove-hug
    path: attacker.global_effects.bear_hug
    value: false
    cases:
    - composition
