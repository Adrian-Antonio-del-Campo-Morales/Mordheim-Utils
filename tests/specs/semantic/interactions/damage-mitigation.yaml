schema_version: 1
specifications:
- id: interaction-combat-injury-states--defence.enchanted-skins
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: interaction
  sources:
  - target: core/combat-injury-states
    digest: 64a57c5ff255e05697f2ec654d8d510bb11fd8cadf1fcbb870df5c7028ab88ed
  - target: mechanic/defence.enchanted-skins
    digest: 3d08915534aaa2db55aa808792d27ae4a50f51d807ad70e4fdacec786919ec67
  bindings:
  - '{"id": "combat-injury-states", "kind": "core", "parameters": {}}'
  - '{"id": "defence.enchanted-skins", "kind": "mechanic", "parameters": {}}'
  interpretation: enchanted skins's ward (6+) intercepts the unsaved wound before the Injury table; when
    it fails the defender drops to zero Wounds and the ordinary Injury states resolve.
  cases:
  - id: composition
    roles:
    - composition
    operation: attack
    attacker: &id001
      main_weapon_id: weapon.sword
    defender: &id002
      defence_ids:
      - defence.enchanted-skins
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 1
        initiative: 3
        attacks: 1
    rolls:
    - key: test.hit
      value: 4
    - key: test.wound
      value: 4
    - key: test.special.ward
      value: 6
    expect:
      result.saved: true
      result.wounded: true
  - id: boundary
    roles:
    - boundary
    operation: attack
    attacker: *id001
    defender: *id002
    rolls:
    - key: test.hit
      value: 4
    - key: test.wound
      value: 4
    - key: test.special.ward
      value: 5
    - key: test.injury.0
      value: 1
    expect:
      result.saved: false
      result.defender.condition: KNOCKED_DOWN
      result.defender.wounds: 0
  mutations:
  - id: remove-ward
    path: defender.global_effects.ward_save
    value: 7
    cases:
    - composition
- id: interaction-combat-injury-states--poison.bloodroot
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: interaction
  sources:
  - target: core/combat-injury-states
    digest: 64a57c5ff255e05697f2ec654d8d510bb11fd8cadf1fcbb870df5c7028ab88ed
  - target: mechanic/poison.bloodroot
    digest: 3134964907d78b26d1da2eec50d04cf0a89261efa3764ebd5dc80c364181feb5
  bindings:
  - '{"id": "combat-injury-states", "kind": "core", "parameters": {}}'
  - '{"id": "poison.bloodroot", "kind": "mechanic", "parameters": {}}'
  interpretation: Bloodroot doubles an unsaved wound to 2; the ordinary Injury states resolve only when
    the doubled damage drives the defender to zero Wounds.
  cases:
  - id: composition
    roles:
    - composition
    operation: attack
    attacker: &id003
      main_weapon_id: weapon.sword
      main_poison_id: poison.bloodroot
    defender:
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 2
        initiative: 3
        attacks: 1
    rolls:
    - key: test.hit
      value: 4
    - key: test.wound
      value: 4
    - key: test.injury.0
      value: 1
    expect:
      result.wounded: true
      result.damage: 2
      result.defender.wounds: 0
      result.defender.condition: KNOCKED_DOWN
  - id: boundary-three-wounds
    roles:
    - boundary
    operation: attack
    attacker: *id003
    defender:
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 3
        attacks: 1
    rolls:
    - key: test.hit
      value: 4
    - key: test.wound
      value: 4
    expect:
      result.wounded: true
      result.damage: 2
      result.defender.wounds: 1
      result.defender.condition: STANDING
  mutations:
  - id: remove-bloodroot-damage
    path: attacker.main_weapon.damage
    value: 1
    cases:
    - composition
