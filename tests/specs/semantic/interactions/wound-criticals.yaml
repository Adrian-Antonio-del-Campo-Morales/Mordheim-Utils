schema_version: 1
specifications:
- id: interaction-combat-critical-hits--poison.devil-s-toxin
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: interaction
  sources:
  - target: core/combat-critical-hits
    digest: 48dc55dfd8d28ad2179d97ee7eee28475be4430d2430a6c0f491712b5bd7062c
  - target: mechanic/poison.devil-s-toxin
    digest: 1d60b4b208bcdaef2a755fd9e9f63668e79b94e1453f4efed437d6c987840275
  bindings:
  - '{"id": "combat-critical-hits", "kind": "core", "parameters": {}}'
  - '{"id": "poison.devil-s-toxin", "kind": "mechanic", "parameters": {}}'
  interpretation: Devil's Toxin rerolls failed wound rolls, and the reroll cannot cause a critical hit; an
    unrerolled natural 6 still crits.
  cases:
  - id: composition
    roles:
    - composition
    operation: wound
    attacker: &id001
      main_weapon_id: weapon.sword
      main_poison_id: poison.devil-s-toxin
    rolls:
    - key: wound
      value: 2
    - key: wound.reroll
      value: 5
    expect:
      result.success: true
      result.critical: false
      result.rerolled: true
  - id: boundary
    roles:
    - boundary
    operation: wound
    attacker: *id001
    rolls:
    - key: wound
      value: 6
    expect:
      result.success: true
      result.critical: true
      result.rerolled: false
  mutations:
  - id: remove-toxin-reroll
    path: attacker.main_weapon.reroll_wounds
    value: false
    cases:
    - composition
- id: interaction-combat-critical-hits--poison.wolfsbane
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: interaction
  sources:
  - target: core/combat-critical-hits
    digest: 48dc55dfd8d28ad2179d97ee7eee28475be4430d2430a6c0f491712b5bd7062c
  - target: mechanic/poison.wolfsbane
    digest: 38c26725d6eb0e2dcf7859c71c57c2a98b555f670abe51574ac9ff2cebc5f765
  bindings:
  - '{"id": "combat-critical-hits", "kind": "core", "parameters": {}}'
  - '{"id": "poison.wolfsbane", "kind": "mechanic", "parameters": {}}'
  interpretation: Wolfsbane causes critical hits on a wound roll of 5-6; the same roll is merely a wound without
    the poison.
  cases:
  - id: composition
    roles:
    - composition
    operation: wound
    attacker: &id002
      main_weapon_id: weapon.sword
      main_poison_id: poison.wolfsbane
    rolls:
    - key: wound
      value: 5
    expect:
      result.success: true
      result.critical: true
  - id: boundary
    roles:
    - boundary
    operation: wound
    attacker: *id002
    rolls:
    - key: wound
      value: 4
    expect:
      result.success: true
      result.critical: false
  mutations:
  - id: remove-wolfsbane
    path: attacker.main_weapon.tags
    value:
    - weapon.sword
    - material.normal
    cases:
    - composition
- id: interaction-material.dark-steel--poison.black-lotus
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: interaction
  sources:
  - target: mechanic/material.dark-steel
    digest: 8d728f140afba7fe68d83eafebfe5b51c1688d5252cee6f3c50969272b668133
  - target: mechanic/poison.black-lotus
    digest: b62d3687e6b97ea58a394f55566d5ac9c38309ebf3e938c87b53c6cf425f9c7c
  bindings:
  - '{"id": "material.dark-steel", "kind": "mechanic", "parameters": {}}'
  - '{"id": "poison.black-lotus", "kind": "mechanic", "parameters": {}}'
  interpretation: Black Lotus wounds automatically on a natural 6 to hit; Dark Steel rerolls failed wound rolls
    on ordinary hits. The optional Lotus critical attempt cannot fail the wound and is not rerolled.
  cases:
  - id: composition
    roles:
    - composition
    operation: wound
    attacker: &id003
      main_weapon_id: weapon.sword
      main_material_id: material.dark-steel
      main_poison_id: poison.black-lotus
    context:
      hit_roll: 6
    expect:
      result.success: true
      result.critical: false
      result.roll: 1
      context.failure_still_wounds: true
    rolls:
    - key: wound
      value: 1
  - id: boundary-reroll
    roles:
    - boundary
    operation: wound
    attacker: *id003
    context:
      hit_roll: 4
    rolls:
    - key: wound
      value: 2
    - key: wound.reroll
      value: 4
    expect:
      result.success: true
      result.rerolled: true
  mutations:
  - id: remove-lotus-automatic
    path: attacker.main_weapon.tags
    value:
    - weapon.sword
    - material.normal
    cases:
    - composition
