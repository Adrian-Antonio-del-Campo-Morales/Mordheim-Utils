- id: interaction-poison.devil-s-toxin--poison.wolfsbane
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: interaction
  sources:
  - target: mechanic/poison.devil-s-toxin
    digest: 1d60b4b208bcdaef2a755fd9e9f63668e79b94e1453f4efed437d6c987840275
  - target: mechanic/poison.wolfsbane
    digest: 38c26725d6eb0e2dcf7859c71c57c2a98b555f670abe51574ac9ff2cebc5f765
  bindings:
  - '{"id": "poison.devil-s-toxin", "kind": "mechanic", "parameters": {}}'
  - '{"id": "poison.wolfsbane", "kind": "mechanic", "parameters": {}}'
  interpretation: Devil's Toxin (main hand) rerolls failed wound rolls without crits; Wolfsbane (off hand)
    crits on 5-6. The phase allows at most one critical, consumed by the first.
  cases:
  - id: composition
    roles:
    - composition
    operation: pool
    attacker: &id005
      main_weapon_id: weapon.sword
      main_poison_id: poison.devil-s-toxin
      off_hand_id: weapon.dagger
      off_poison_id: poison.wolfsbane
    context:
      count: 2
    rolls:
    - key: test.attack.0.hit
      value: 4
    - key: test.attack.1.hit
      value: 4
    - key: test.attack.0.wound
      value: 2
    - key: test.attack.0.wound.reroll
      value: 5
    - key: test.attack.1.wound
      value: 5
    - key: test.attack.1.critical
      value: 1
    - key: test.attack.1.armour
      value: 5
    - key: test.attack.1.injury.0
      value: 1
    expect:
      result.attacks.0.critical: false
      result.attacks.1.critical: true
      result.attacker.critical_available: false
  - id: boundary
    roles:
    - boundary
    operation: pool
    attacker: *id005
    context:
      count: 2
    rolls:
    - key: test.attack.0.hit
      value: 4
    - key: test.attack.1.hit
      value: 4
    - key: test.attack.0.wound
      value: 6
    - key: test.attack.0.critical
      value: 1
    - key: test.attack.1.wound
      value: 5
    - key: test.attack.1.armour
      value: 5
    - key: test.attack.1.injury.0
      value: 1
    expect:
      result.attacks.0.critical: true
      result.attacks.1.critical: false
      result.attacker.critical_available: false
  mutations:
  - id: remove-wolfsbane
    path: attacker.off_hand.tags
    value:
    - weapon.dagger
    - material.normal
    cases:
    - composition
