schema_version: 1
specifications:
- id: interaction-combat-critical-hits--poison.devil-s-toxin
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: interaction
  sources:
  - target: core/combat-critical-hits
    digest: e8eca12d783ded31c450f816bbc94069e59ffe07575d75d378d642f87fdffd1d
  - target: mechanic/poison.devil-s-toxin
    digest: a73a07f2e5bb74eb2d54a1d11002e691cdda4086906a778cca870deb5fc6ba0a
  bindings:
  - '{"id": "combat-critical-hits", "kind": "core", "parameters": {}}'
  - '{"id": "poison.devil-s-toxin", "kind": "mechanic", "parameters": {}}'
  interpretation: Devil's Toxin rerolls failed wound rolls, and the reroll cannot cause a critical hit;
    an unrerolled natural 6 still crits.
  cases:
  - id: composition
    roles:
    - composition
    operation: wound
    attacker: &id001
      main_weapon_id: weapon.sword
      main_poison_id: poison.devil-s-toxin
    rolls:
    - key: wound
      value: 2
    - key: wound.reroll
      value: 5
    expect:
      result.success: true
      result.critical: false
      result.rerolled: true
  - id: boundary
    roles:
    - boundary
    operation: wound
    attacker: *id001
    rolls:
    - key: wound
      value: 6
    expect:
      result.success: true
      result.critical: true
      result.rerolled: false
  mutations:
  - id: remove-toxin-reroll
    path: attacker.main_weapon.reroll_wounds
    value: false
    cases:
    - composition
- id: interaction-combat-critical-hits--poison.wolfsbane
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: interaction
  sources:
  - target: core/combat-critical-hits
    digest: e8eca12d783ded31c450f816bbc94069e59ffe07575d75d378d642f87fdffd1d
  - target: mechanic/poison.wolfsbane
    digest: 92dcb912d65c0888c5e877ff5d7803dd29ee95bf256ac2cc6bd5d28c7674bca2
  bindings:
  - '{"id": "combat-critical-hits", "kind": "core", "parameters": {}}'
  - '{"id": "poison.wolfsbane", "kind": "mechanic", "parameters": {}}'
  interpretation: Wolfsbane causes critical hits on a wound roll of 5-6; the same roll is merely a wound
    without the poison.
  cases:
  - id: composition
    roles:
    - composition
    operation: wound
    attacker: &id002
      main_weapon_id: weapon.sword
      main_poison_id: poison.wolfsbane
    rolls:
    - key: wound
      value: 5
    expect:
      result.success: true
      result.critical: true
  - id: boundary
    roles:
    - boundary
    operation: wound
    attacker: *id002
    rolls:
    - key: wound
      value: 4
    expect:
      result.success: true
      result.critical: false
  mutations:
  - id: remove-wolfsbane
    path: attacker.main_weapon.tags
    value:
    - weapon.sword
    - material.normal
    cases:
    - composition
- id: interaction-material.dark-steel--poison.black-lotus
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: interaction
  sources:
  - target: mechanic/material.dark-steel
    digest: a639e2efdf8b946f9798a64cb54448c00c4b209515441d4bc03f7ecf3bcdea69
  - target: mechanic/poison.black-lotus
    digest: 39f0067304ff0fc77595f29c03a99645ff2bfb16aa0eb75ee820ec687ad23a00
  bindings:
  - '{"id": "material.dark-steel", "kind": "mechanic", "parameters": {}}'
  - '{"id": "poison.black-lotus", "kind": "mechanic", "parameters": {}}'
  interpretation: Black Lotus wounds automatically on a natural 6 to hit; Dark Steel rerolls failed wound
    rolls on ordinary hits. The optional Lotus critical attempt cannot fail the wound and is not rerolled.
  cases:
  - id: composition
    roles:
    - composition
    operation: wound
    attacker: &id003
      main_weapon_id: weapon.sword
      main_material_id: material.dark-steel
      main_poison_id: poison.black-lotus
    context:
      hit_roll: 6
    expect:
      result.success: true
      result.critical: false
      result.roll: 1
      context.failure_still_wounds: true
    rolls:
    - key: wound
      value: 1
  - id: boundary-reroll
    roles:
    - boundary
    operation: wound
    attacker: *id003
    context:
      hit_roll: 4
    rolls:
    - key: wound
      value: 2
    - key: wound.reroll
      value: 4
    expect:
      result.success: true
      result.rerolled: true
  mutations:
  - id: remove-lotus-automatic
    path: attacker.main_weapon.tags
    value:
    - weapon.sword
    - material.normal
    cases:
    - composition
