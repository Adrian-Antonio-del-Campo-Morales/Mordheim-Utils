schema_version: 1
specifications:
- id: interaction-combat-critical-hits--combat-injury-states
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: interaction
  sources:
  - target: core/combat-critical-hits
    digest: 2506cd4d28895fedc6cd794bb2c993439824dfae86b9390495b0c56902de6d7b
  - target: core/combat-injury-states
    digest: 6ebab2fe75e34a9988241a00bb6ea24707aaca83f42bd24da2feae80d3f14f60
  bindings:
  - '{"id": "combat-critical-hits", "kind": "core", "parameters": {}}'
  - '{"id": "combat-injury-states", "kind": "core", "parameters": {}}'
  interpretation: The basic critical table is rolled independently. This composition chooses Master Strike
    (5), two wounds with armour ignored and +2 Injury. The boundary is an ordinary wound. See docs/modular-remediation.md,
    M01.
  cases:
  - id: composition
    roles:
    - composition
    operation: attack
    attacker: &id001
      main_weapon_id: weapon.sword
    defender: &id002
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 1
        initiative: 3
        attacks: 1
    rolls:
    - key: test.hit
      value: 4
    - key: test.wound
      value: 6
    - key: test.critical
      value: 5
    - key: test.injury.0
      value: 1
    - key: test.injury.1
      value: 1
    expect:
      result.critical: true
      result.defender.condition: STUNNED
  - id: boundary
    roles:
    - boundary
    operation: attack
    attacker: *id001
    defender: *id002
    rolls:
    - key: test.hit
      value: 4
    - key: test.wound
      value: 5
    - key: test.injury.0
      value: 1
    expect:
      result.critical: false
      result.defender.condition: KNOCKED_DOWN
  mutations:
  - id: raise-wound-threshold
    path: defender.characteristics.toughness
    value: 5
    cases:
    - composition
