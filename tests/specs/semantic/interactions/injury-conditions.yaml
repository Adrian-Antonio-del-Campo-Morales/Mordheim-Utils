  - id: boundary
    roles:
    - boundary
    operation: injury_reaction
    defender: *id018
    rolls:
    - key: test.injury
      value: 6
    expect:
      result.condition: OUT
  mutations:
  - id: remove-composed-behaviour
    changes:
    - path: defender.global_effects.out_of_action_threshold
      value: 5
    - path: defender.global_effects.tags
      value: []
    cases:
    - composition
