  cases:
  - id: composition
    roles:
    - composition
    operation: injury_reaction
    defender: &id018
      skill_ids:
      - skill.hard-to-kill
    rolls:
    - key: test.injury
      value: 5
    expect:
      result.condition: STUNNED
      result.reaction.attempted: false
  - id: boundary
    roles:
    - boundary
    operation: injury_reaction
    defender: *id018
    rolls:
    - key: test.injury
      value: 6
    expect:
      result.condition: OUT
  mutations:
  - id: remove-composed-behaviour
    changes:
    - path: defender.global_effects.out_of_action_threshold
      value: 5
    - path: defender.global_effects.tags
      value: []
    cases:
    - composition
