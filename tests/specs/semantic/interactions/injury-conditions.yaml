- id: interaction-combat-injury-states--defence.cooking-pot-helmet
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: interaction
  sources:
  - target: core/combat-injury-states
    digest: 6ebab2fe75e34a9988241a00bb6ea24707aaca83f42bd24da2feae80d3f14f60
  - target: mechanic/defence.cooking-pot-helmet
    digest: 6122652bfa154e4580af9b288c41f32027b5df2f2609eb7036d116fabd80cbee
  bindings:
  - '{"id": "combat-injury-states", "kind": "core", "parameters": {}}'
  - '{"id": "defence.cooking-pot-helmet", "kind": "mechanic", "parameters": {}}'
  interpretation: A Stunned result from the Injury table can be converted to Knocked Down by the cooking
    pot helmet's unmodified 5+; the reaction consumes exactly one die.
  cases:
  - id: composition
    roles:
    - composition
    operation: injury_reaction
    defender: &id015
      defence_ids:
      - defence.cooking-pot-helmet
    rolls:
    - key: test.injury
      value: 3
    - key: test.helmet
      value: 5
    expect:
      result.condition: KNOCKED_DOWN
      result.reaction.attempted: true
      result.reaction.threshold: 5
  - id: boundary
    roles:
    - boundary
    operation: injury_reaction
    defender: *id015
    rolls:
    - key: test.injury
      value: 3
    - key: test.helmet
      value: 4
    expect:
      result.condition: STUNNED
  mutations:
  - id: remove-composed-behaviour
    path: defender.helmet_save
    value: 7
    cases:
    - composition
