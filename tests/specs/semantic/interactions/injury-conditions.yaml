    digest: 4c5af99ecd1de38b689af0a61b2d2a5479ab76a84bde0b782eb12dc17b48e608
  bindings:
  - '{"id": "combat-injury-states", "kind": "core", "parameters": {}}'
  - '{"id": "defence.cooking-pot-helmet", "kind": "mechanic", "parameters": {}}'
  interpretation: A Stunned result from the Injury table can be converted to Knocked Down by the cooking
    pot helmet's unmodified 5+; the reaction consumes exactly one die.
  cases:
  - id: composition
    roles:
    - composition
    operation: injury_reaction
    defender: &id015
      defence_ids:
      - defence.cooking-pot-helmet
    rolls:
    - key: test.injury
      value: 3
    - key: test.helmet
      value: 5
    expect:
      result.condition: KNOCKED_DOWN
      result.reaction.attempted: true
      result.reaction.threshold: 5
  - id: boundary
    roles:
    - boundary
    operation: injury_reaction
    defender: *id015
    rolls:
    - key: test.injury
      value: 3
    - key: test.helmet
      value: 4
    expect:
      result.condition: STUNNED
  mutations:
  - id: remove-composed-behaviour
    path: defender.helmet_save
    value: 7
    cases:
    - composition
