schema_version: 1
specifications:
- id: interaction-combat-two-weapons--skill.extra-attack
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: interaction
  sources:
  - target: core/combat-two-weapons
    digest: 4b9e63a5a1ca3607800f7b15c257c745c35184089ae43bd9b1cbd601504cbccf
  - target: mechanic/skill.extra-attack
    digest: 9a28c8fa3d6cb16037fb053bd60c2676bd2d8cf3e2e3ef624759e52dd98d4b5c
  bindings:
  - '{"id": "combat-two-weapons", "kind": "core", "parameters": {}}'
  - '{"id": "skill.extra-attack", "kind": "mechanic", "parameters": {}}'
  interpretation: Two one-handed weapons grant one extra Attack after other modifiers; Extra Attack adds
    one more, composing to 3.
  cases:
  - id: composition
    roles:
    - composition
    operation: attacks
    attacker: &id001
      main_weapon_id: weapon.sword
      off_hand_id: weapon.sword
      skill_ids:
      - skill.extra-attack
    expect:
      result.attacks: 3
  - id: boundary
    roles:
    - boundary
    operation: attacks
    attacker: *id001
    context:
      attack_penalty: 1
    expect:
      result.attacks: 2
  mutations:
  - id: remove-composed-attack
    path: attacker.off_hand_attacks
    value: false
    cases:
    - composition
- id: interaction-combat-two-weapons--skill.ferocious-charge
