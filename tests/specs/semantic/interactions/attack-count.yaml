    context:
      first_round: true
      charging: true
    expect:
      result.attacks: 3
  - id: boundary
    roles:
    - boundary
    operation: attacks
    attacker: *id002
    context:
      first_round: true
    expect:
      result.attacks: 2
  mutations:
  - id: remove-composed-attack
    path: attacker.global_effects.tags
    value: []
    cases:
    - composition
