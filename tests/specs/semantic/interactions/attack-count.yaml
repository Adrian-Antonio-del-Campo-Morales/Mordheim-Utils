schema_version: 1
specifications:
- id: interaction-combat-two-weapons--skill.extra-attack
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: interaction
  sources:
  - target: core/combat-two-weapons
    digest: e290594d3c6ecf49bf33cc116ac8663f5f8e293bfb69699379c899634097c87b
  - target: mechanic/skill.extra-attack
    digest: 82f5c464d737753aff836db387a8150b196246c320cb13b4e388269bb6f6567f
  bindings:
  - '{"id": "combat-two-weapons", "kind": "core", "parameters": {}}'
  - '{"id": "skill.extra-attack", "kind": "mechanic", "parameters": {}}'
  interpretation: Two one-handed weapons grant one extra Attack after other modifiers; Extra Attack adds
    one more, composing to 3.
  cases:
  - id: composition
    roles:
    - composition
    operation: attacks
    attacker: &id001
      main_weapon_id: weapon.sword
      off_hand_id: weapon.sword
      skill_ids:
      - skill.extra-attack
    expect:
      result.attacks: 3
  - id: boundary
    roles:
    - boundary
    operation: attacks
    attacker: *id001
    context:
      attack_penalty: 1
    expect:
      result.attacks: 2
  mutations:
  - id: remove-composed-attack
    path: attacker.off_hand_attacks
    value: false
    cases:
    - composition
- id: interaction-combat-two-weapons--skill.ferocious-charge
