schema_version: 1
specifications:
- id: two-strength-skills-stack
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: interaction
  sources:
  - target: mechanic/skill.mighty-blow
    digest: 2e085e3c62551f1fa511233d49cc39e6f109e947f1be486a61a0c73837ccea4a
  - target: mechanic/skill.iron-sinews
    digest: 0605cda3ab55fd3e27faf6d72c883b4f47192b2a967befd9e1c9485644955bb5
  bindings:
  - '{"id": "skill.mighty-blow", "kind": "mechanic", "parameters": {}}'
  - '{"id": "skill.iron-sinews", "kind": "mechanic", "parameters": {}}'
  interpretation: Two independent +1 Strength bonuses add to +2; swapping the declaration order does not
    change the result.
  cases:
  - id: forward
    roles:
    - composition
    - boundary
    operation: strength
    attacker:
      main_weapon_id: weapon.mace
      skill_ids:
      - skill.mighty-blow
      - skill.iron-sinews
    expect:
      result.wound: 5
      result.armour: 5
  - id: reverse
    roles:
    - composition
    - boundary
    operation: strength
    attacker:
      main_weapon_id: weapon.mace
      skill_ids:
      - skill.iron-sinews
      - skill.mighty-blow
    expect:
      result.wound: 5
      result.armour: 5
  mutations:
  - id: drop-one-contribution
    path: attacker.global_effects.strength_bonus
    value: 1
    cases:
    - forward
    - reverse
- id: step-aside-then-regeneration
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: interaction
  sources:
  - target: mechanic/skill.step-aside
    digest: 7ae349d8b7a34a2376842c454607ad2177485f898265ab2a456186ba49efc36c
  - target: mechanic/skill.regeneration-5-plus
    digest: 36585fef086ac4366ac2dcd9bfeb715168958fe78cca9bc8abf404dac6dfb28d
  bindings:
  - '{"id": "skill.step-aside", "kind": "mechanic", "parameters": {}}'
  - '{"id": "skill.regeneration-5-plus", "kind": "mechanic", "parameters": {}}'
  interpretation: 'Apply the approved phase order: special save then regeneration if unsaved. Two independent
    5+ saves ignore 5/9 wounds. Fire blocks regeneration only, leaving Step Aside.'
  cases:
  - id: all-branches
    roles:
    - composition
    operation: special_save
    defender:
      skill_ids:
      - skill.step-aside
      - skill.regeneration-5-plus
    distribution:
      observable: result.saved
      max_rolls: 2
      expected:
        'true': 5/9
        'false': 4/9
  - id: fire-only-blocks-regeneration
    roles:
    - composition
    - boundary
    operation: special_save
    attacker:
      main_weapon_id: weapon.brazier-iron
    defender:
      skill_ids:
      - skill.step-aside
      - skill.regeneration-5-plus
    distribution:
      observable: result.saved
      max_rolls: 2
      expected:
        'true': 1/3
        'false': 2/3
  - id: early-save-skips-regen
    roles:
    - boundary
    operation: special_save
    defender:
      skill_ids:
      - skill.step-aside
      - skill.regeneration-5-plus
    rolls:
    - key: special.ward
      value: 5
    expect:
      result.saved: true
      result.source: ward
      result.regeneration_roll: null
  - id: fire-failed-ward-no-regeneration-roll
    roles:
    - boundary
    operation: special_save
    attacker:
      main_weapon_id: weapon.brazier-iron
    defender:
      skill_ids:
      - skill.step-aside
      - skill.regeneration-5-plus
    rolls:
    - key: special.ward
      value: 4
    expect:
      result.saved: false
      result.regeneration_roll: null
  mutations:
  - id: remove-first-save
    path: defender.global_effects.step_aside
    value: false
    cases:
    - all-branches
  - id: remove-fire-blocker
    path: defender.global_effects.regeneration_blocked_by_fire
    value: false
    cases:
    - fire-only-blocks-regeneration
- id: hard-to-kill-plus-no-pain
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: interaction
  sources:
  - target: mechanic/skill.hard-to-kill
    digest: 15453b5e382b561d1b31d288f610e75c80138fec8fe635e8aaedfa17d178158e
  - target: mechanic/skill.ignore-pain
    digest: 71de295c56ebb02a6b4bcc65e55363d77bd532d7892580614d76c05f7f41f426
  bindings:
  - '{"id": "skill.hard-to-kill", "kind": "mechanic", "parameters": {}}'
  - '{"id": "skill.ignore-pain", "kind": "mechanic", "parameters": {}}'
  interpretation: Hard to Kill changes the injury table to 1-2 Knocked Down, 3-5 Stunned, 6 Out. No Pain
    converts those Stunned results to Knocked Down, therefore 1-5 Knocked Down and 6 Out.
  cases:
  - id: face-1
    roles:
    - composition
    - boundary
    operation: injury
    defender:
      skill_ids:
      - skill.hard-to-kill
      - skill.ignore-pain
    rolls:
    - key: test.injury
      value: 1
    expect:
      result.condition: KNOCKED_DOWN
  - id: face-2
    roles:
    - composition
    - boundary
    operation: injury
    defender:
      skill_ids:
      - skill.hard-to-kill
      - skill.ignore-pain
    rolls:
    - key: test.injury
      value: 2
    expect:
      result.condition: KNOCKED_DOWN
  - id: face-3
    roles:
    - composition
    - boundary
    operation: injury
    defender:
      skill_ids:
      - skill.hard-to-kill
      - skill.ignore-pain
    rolls:
    - key: test.injury
      value: 3
    expect:
      result.condition: KNOCKED_DOWN
  - id: face-4
    roles:
    - composition
    - boundary
    operation: injury
    defender:
      skill_ids:
      - skill.hard-to-kill
      - skill.ignore-pain
    rolls:
    - key: test.injury
      value: 4
    expect:
      result.condition: KNOCKED_DOWN
  - id: face-5
    roles:
    - composition
    - boundary
    operation: injury
    defender:
      skill_ids:
      - skill.hard-to-kill
      - skill.ignore-pain
    rolls:
    - key: test.injury
      value: 5
    expect:
      result.condition: KNOCKED_DOWN
  - id: face-6
    roles:
    - composition
    - boundary
    operation: injury
    defender:
      skill_ids:
      - skill.hard-to-kill
      - skill.ignore-pain
    rolls:
    - key: test.injury
      value: 6
    expect:
      result.condition: OUT
  mutations:
  - id: drop-no-pain
    path: defender.global_effects.tags
    value:
    - skill.hard-to-kill
    - armour.no-armour
    cases:
    - face-3
    - face-4
    - face-5
