schema_version: 1
specifications:
- id: two-strength-skills-stack
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: interaction
  sources:
  - target: mechanic/skill.mighty-blow
    digest: 1d501bd7dccf1fd055a2304c981bdefc880eae91807716281aba0a89cdc18752
  - target: mechanic/skill.iron-sinews
    digest: 69d8c114630d1390d9a9fa9d68ae7ba3dc246c2b5586a4baa884626e5095a7e5
  bindings:
  - '{"id": "skill.mighty-blow", "kind": "mechanic", "parameters": {}}'
  - '{"id": "skill.iron-sinews", "kind": "mechanic", "parameters": {}}'
  interpretation: Two independent +1 Strength bonuses add to +2; swapping the declaration order does not
    change the result.
  cases:
  - id: forward
    roles:
    - composition
    - boundary
    operation: strength
    attacker:
      main_weapon_id: weapon.mace
      skill_ids:
      - skill.mighty-blow
      - skill.iron-sinews
    expect:
      result.wound: 5
      result.armour: 5
  - id: reverse
    roles:
    - composition
    - boundary
    operation: strength
    attacker:
      main_weapon_id: weapon.mace
      skill_ids:
      - skill.iron-sinews
      - skill.mighty-blow
    expect:
      result.wound: 5
      result.armour: 5
  mutations:
  - id: drop-one-contribution
    path: attacker.global_effects.strength_bonus
    value: 1
    cases:
    - forward
    - reverse
- id: step-aside-then-regeneration
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: interaction
  sources:
  - target: mechanic/skill.step-aside
    digest: 5d13b2da5ffcebb62bed12ad75da22af778a3632ed069dfc66ce4162d656eaaa
  - target: mechanic/skill.regeneration-5-plus
    digest: 70fffa74d063f2aaf1d8e18abccddff5edff90465e1b5d4abdab72ac5209de3e
  bindings:
  - '{"id": "skill.step-aside", "kind": "mechanic", "parameters": {}}'
  - '{"id": "skill.regeneration-5-plus", "kind": "mechanic", "parameters": {}}'
  interpretation: 'Apply the approved phase order: special save then regeneration if unsaved. Two independent
    5+ saves ignore 5/9 wounds. Fire blocks regeneration only, leaving Step Aside.'
  cases:
  - id: all-branches
    roles:
    - composition
    operation: special_save
    defender:
      skill_ids:
      - skill.step-aside
      - skill.regeneration-5-plus
    distribution:
      observable: result.saved
      max_rolls: 2
      expected:
        'true': 5/9
        'false': 4/9
  - id: fire-only-blocks-regeneration
    roles:
    - composition
    - boundary
    operation: special_save
    attacker:
      main_weapon_id: weapon.brazier-iron
    defender:
      skill_ids:
      - skill.step-aside
      - skill.regeneration-5-plus
    distribution:
      observable: result.saved
      max_rolls: 2
      expected:
        'true': 1/3
        'false': 2/3
  - id: early-save-skips-regen
    roles:
    - boundary
    operation: special_save
    defender:
      skill_ids:
      - skill.step-aside
      - skill.regeneration-5-plus
    rolls:
    - key: special.ward
      value: 5
    expect:
      result.saved: true
      result.source: ward
      result.regeneration_roll: null
  - id: fire-failed-ward-no-regeneration-roll
    roles:
    - boundary
    operation: special_save
    attacker:
      main_weapon_id: weapon.brazier-iron
    defender:
      skill_ids:
      - skill.step-aside
      - skill.regeneration-5-plus
    rolls:
    - key: special.ward
      value: 4
    expect:
      result.saved: false
      result.regeneration_roll: null
  mutations:
  - id: remove-first-save
    path: defender.global_effects.step_aside
    value: false
    cases:
    - all-branches
  - id: remove-fire-blocker
    path: defender.global_effects.regeneration_blocked_by_fire
    value: false
    cases:
    - fire-only-blocks-regeneration
- id: hard-to-kill-plus-no-pain
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: interaction
  sources:
  - target: mechanic/skill.hard-to-kill
    digest: 30c6fc4070dd027a07d52d82f26be50550fc51210367834aaff08ae459928dad
  - target: mechanic/skill.ignore-pain
    digest: b7f2f8f45188f5a498dbb8a7743fc675e38614e972004c698c7088c7584fc384
  bindings:
  - '{"id": "skill.hard-to-kill", "kind": "mechanic", "parameters": {}}'
  - '{"id": "skill.ignore-pain", "kind": "mechanic", "parameters": {}}'
  interpretation: Hard to Kill changes the injury table to 1-2 Knocked Down, 3-5 Stunned, 6 Out. No Pain
    converts those Stunned results to Knocked Down, therefore 1-5 Knocked Down and 6 Out.
  cases:
  - id: face-1
    roles:
    - composition
    - boundary
    operation: injury
    defender:
      skill_ids:
      - skill.hard-to-kill
      - skill.ignore-pain
    rolls:
    - key: test.injury
      value: 1
    expect:
      result.condition: KNOCKED_DOWN
  - id: face-2
    roles:
    - composition
    - boundary
    operation: injury
    defender:
      skill_ids:
      - skill.hard-to-kill
      - skill.ignore-pain
    rolls:
    - key: test.injury
      value: 2
    expect:
      result.condition: KNOCKED_DOWN
  - id: face-3
    roles:
    - composition
    - boundary
    operation: injury
    defender:
      skill_ids:
      - skill.hard-to-kill
      - skill.ignore-pain
    rolls:
    - key: test.injury
      value: 3
    expect:
      result.condition: KNOCKED_DOWN
  - id: face-4
    roles:
    - composition
    - boundary
    operation: injury
    defender:
      skill_ids:
      - skill.hard-to-kill
      - skill.ignore-pain
    rolls:
    - key: test.injury
      value: 4
    expect:
      result.condition: KNOCKED_DOWN
  - id: face-5
    roles:
    - composition
    - boundary
    operation: injury
    defender:
      skill_ids:
      - skill.hard-to-kill
      - skill.ignore-pain
    rolls:
    - key: test.injury
      value: 5
    expect:
      result.condition: KNOCKED_DOWN
  - id: face-6
    roles:
    - composition
    - boundary
    operation: injury
    defender:
      skill_ids:
      - skill.hard-to-kill
      - skill.ignore-pain
    rolls:
    - key: test.injury
      value: 6
    expect:
      result.condition: OUT
  mutations:
  - id: drop-no-pain
    path: defender.global_effects.tags
    value:
    - skill.hard-to-kill
    - armour.no-armour
    cases:
    - face-3
    - face-4
    - face-5
