schema_version: 1
specifications:
- id: two-strength-skills-stack
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: interaction
  sources:
  - target: mechanic/skill.mighty-blow
    digest: 16444ea9794523d0da8cef415f236f7de696506aa00d34440958584857358a93
  - target: mechanic/skill.iron-sinews
    digest: e0ef11ee6c29717442a836f97bb2134b74264b7142f24d69e63c4dc3e9f4c4fd
  bindings:
  - '{"id": "skill.mighty-blow", "kind": "mechanic", "parameters": {}}'
  - '{"id": "skill.iron-sinews", "kind": "mechanic", "parameters": {}}'
  interpretation: Two independent +1 Strength bonuses add to +2; swapping the declaration order does not
    change the result.
  cases:
  - id: forward
    roles:
    - composition
    - boundary
    operation: strength
    attacker:
      main_weapon_id: weapon.mace
      skill_ids:
      - skill.mighty-blow
      - skill.iron-sinews
    expect:
      result.wound: 5
      result.armour: 5
  - id: reverse
    roles:
    - composition
    - boundary
    operation: strength
    attacker:
      main_weapon_id: weapon.mace
      skill_ids:
      - skill.iron-sinews
      - skill.mighty-blow
    expect:
      result.wound: 5
      result.armour: 5
  mutations:
  - id: drop-one-contribution
    path: attacker.global_effects.strength_bonus
    value: 1
    cases:
    - forward
    - reverse
- id: step-aside-then-regeneration
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: interaction
  sources:
  - target: mechanic/skill.step-aside
    digest: fa330a0a851b02a64dd8b68e9335a115de376506dcd77d84afde7782a723c6e1
  - target: mechanic/skill.regeneration-5-plus
    digest: 86b8f566e4f635545ceb4645928437889c94f1f8551ba2f91f79108c596ddb5e
  bindings:
  - '{"id": "skill.step-aside", "kind": "mechanic", "parameters": {}}'
  - '{"id": "skill.regeneration-5-plus", "kind": "mechanic", "parameters": {}}'
  interpretation: 'Apply the approved phase order: special save then regeneration if unsaved. Two independent
    5+ saves ignore 5/9 wounds. Fire blocks regeneration only, leaving Step Aside.'
  cases:
  - id: all-branches
    roles:
    - composition
    operation: special_save
    defender:
      skill_ids:
      - skill.step-aside
      - skill.regeneration-5-plus
    distribution:
      observable: result.saved
      max_rolls: 2
      expected:
        'true': 5/9
        'false': 4/9
  - id: fire-only-blocks-regeneration
    roles:
    - composition
    - boundary
    operation: special_save
    attacker:
      main_weapon_id: weapon.brazier-iron
    defender:
      skill_ids:
      - skill.step-aside
      - skill.regeneration-5-plus
    distribution:
      observable: result.saved
      max_rolls: 2
      expected:
        'true': 1/3
        'false': 2/3
  - id: early-save-skips-regen
    roles:
    - boundary
    operation: special_save
    defender:
      skill_ids:
      - skill.step-aside
      - skill.regeneration-5-plus
    rolls:
    - key: special.ward
      value: 5
    expect:
      result.saved: true
      result.source: ward
      result.regeneration_roll: null
  - id: fire-failed-ward-no-regeneration-roll
    roles:
    - boundary
    operation: special_save
    attacker:
      main_weapon_id: weapon.brazier-iron
    defender:
      skill_ids:
      - skill.step-aside
      - skill.regeneration-5-plus
    rolls:
    - key: special.ward
      value: 4
    expect:
      result.saved: false
      result.regeneration_roll: null
  mutations:
  - id: remove-first-save
    path: defender.global_effects.step_aside
    value: false
    cases:
    - all-branches
  - id: remove-fire-blocker
    path: defender.global_effects.regeneration_blocked_by_fire
    value: false
    cases:
    - fire-only-blocks-regeneration
- id: hard-to-kill-plus-no-pain
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: interaction
  sources:
  - target: mechanic/skill.hard-to-kill
    digest: b3210faa2837a545c46b44c18e0d505347a00ca82b80e51704cc36afb7aa6f86
  - target: mechanic/skill.ignore-pain
    digest: f25a1289989017d8a76c3c6230f5527ff0e1333e7fa7de218495c02db820ddc4
  bindings:
  - '{"id": "skill.hard-to-kill", "kind": "mechanic", "parameters": {}}'
  - '{"id": "skill.ignore-pain", "kind": "mechanic", "parameters": {}}'
  interpretation: Hard to Kill changes the injury table to 1-2 Knocked Down, 3-5 Stunned, 6 Out. No Pain
    converts those Stunned results to Knocked Down, therefore 1-5 Knocked Down and 6 Out.
  cases:
  - id: face-1
    roles:
    - composition
    - boundary
    operation: injury
    defender:
      skill_ids:
      - skill.hard-to-kill
      - skill.ignore-pain
    rolls:
    - key: test.injury
      value: 1
    expect:
      result.condition: KNOCKED_DOWN
  - id: face-2
    roles:
    - composition
    - boundary
    operation: injury
    defender:
      skill_ids:
      - skill.hard-to-kill
      - skill.ignore-pain
    rolls:
    - key: test.injury
      value: 2
    expect:
      result.condition: KNOCKED_DOWN
  - id: face-3
    roles:
    - composition
    - boundary
    operation: injury
    defender:
      skill_ids:
      - skill.hard-to-kill
      - skill.ignore-pain
    rolls:
    - key: test.injury
      value: 3
    expect:
      result.condition: KNOCKED_DOWN
  - id: face-4
    roles:
    - composition
    - boundary
    operation: injury
    defender:
      skill_ids:
      - skill.hard-to-kill
      - skill.ignore-pain
    rolls:
    - key: test.injury
      value: 4
    expect:
      result.condition: KNOCKED_DOWN
  - id: face-5
    roles:
    - composition
    - boundary
    operation: injury
    defender:
      skill_ids:
      - skill.hard-to-kill
      - skill.ignore-pain
    rolls:
    - key: test.injury
      value: 5
    expect:
      result.condition: KNOCKED_DOWN
  - id: face-6
    roles:
    - composition
    - boundary
    operation: injury
    defender:
      skill_ids:
      - skill.hard-to-kill
      - skill.ignore-pain
    rolls:
    - key: test.injury
      value: 6
    expect:
      result.condition: OUT
  mutations:
  - id: drop-no-pain
    path: defender.global_effects.tags
    value:
    - skill.hard-to-kill
    - armour.no-armour
    cases:
    - face-3
    - face-4
    - face-5
