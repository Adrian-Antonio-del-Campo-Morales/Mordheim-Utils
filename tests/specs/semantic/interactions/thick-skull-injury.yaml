schema_version: 1
specifications:
- id: thick-skull-after-core-injury
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: interaction
  sources:
  - target: core/combat-injury-states
    digest: 6ebab2fe75e34a9988241a00bb6ea24707aaca83f42bd24da2feae80d3f14f60
  - target: mechanic/skill.thick-skull
    digest: ff3d7a44336e6137f9ed98716305469db44c224f738947854e6ef59c5b4a9859
  bindings:
  - '{"id": "combat-injury-states", "kind": "core", "parameters": {}}'
  - '{"id": "skill.thick-skull", "kind": "mechanic", "parameters": {}}'
  interpretation: Resolve the ordinary Injury table first; Thick Skull reacts only when its resulting
    condition is Stunned.
  cases:
  - id: stunned-reacts
    roles:
    - composition
    operation: injury_reaction
    defender:
      skill_ids:
      - skill.thick-skull
    rolls:
    - key: test.injury
      value: 3
    - key: test.thick-skull
      value: 3
    expect:
      result.condition: KNOCKED_DOWN
      result.reaction.attempted: true
  - id: knocked-down-does-not-react
    roles:
    - boundary
    operation: injury_reaction
    defender:
      skill_ids:
      - skill.thick-skull
    rolls:
    - key: test.injury
      value: 2
    expect:
      result.condition: KNOCKED_DOWN
      result.reaction.attempted: false
  mutations:
  - id: remove-reaction
    path: defender.global_effects.thick_skull
    value: false
    cases:
    - stunned-reacts
- id: thick-skull-and-hard-to-kill
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: interaction
  sources:
  - target: mechanic/skill.hard-to-kill
    digest: 30c6fc4070dd027a07d52d82f26be50550fc51210367834aaff08ae459928dad
  - target: mechanic/skill.thick-skull
    digest: ff3d7a44336e6137f9ed98716305469db44c224f738947854e6ef59c5b4a9859
  bindings:
  - '{"id": "skill.hard-to-kill", "kind": "mechanic", "parameters": {}}'
  - '{"id": "skill.thick-skull", "kind": "mechanic", "parameters": {}}'
  interpretation: Hard to Kill makes face 5 Stunned; Thick Skull then gets its normal 3+ reaction. Face
    6 remains Out.
  cases:
  - id: face-five-reacts
    roles:
    - composition
    operation: injury_reaction
    defender:
      skill_ids:
      - skill.hard-to-kill
      - skill.thick-skull
    rolls:
    - key: test.injury
      value: 5
    - key: test.thick-skull
      value: 3
    expect:
      result.condition: KNOCKED_DOWN
  - id: face-six-does-not-react
    roles:
    - boundary
    operation: injury_reaction
    defender:
      skill_ids:
      - skill.hard-to-kill
      - skill.thick-skull
    rolls:
    - key: test.injury
      value: 6
    expect:
      result.condition: OUT
      result.reaction.attempted: false
  mutations:
  - id: remove-reaction
    path: defender.global_effects.thick_skull
    value: false
    cases:
    - face-five-reacts
- id: thick-skull-and-head-crusher
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: interaction
  sources:
  - target: mechanic/skill.head-crusher
    digest: 3a07db7e3648824bddd84f443bb97757541617f1ad02cd560b811013c5ec9676
  - target: mechanic/skill.thick-skull
    digest: ff3d7a44336e6137f9ed98716305469db44c224f738947854e6ef59c5b4a9859
  bindings:
  - '{"id": "skill.head-crusher", "kind": "mechanic", "parameters": {}}'
  - '{"id": "skill.thick-skull", "kind": "mechanic", "parameters": {}}'
  interpretation: Head Crusher promotes the attacker's Knocked Down result to Stunned before the defender's
    Thick Skull reaction.
  cases:
  - id: promoted-result-reacts
    roles:
    - composition
    operation: injury_reaction
    attacker:
      main_weapon_id: weapon.sword
      skill_ids:
      - skill.head-crusher
    defender:
      skill_ids:
      - skill.thick-skull
    rolls:
    - key: test.injury
      value: 1
    - key: test.thick-skull
      value: 3
    expect:
      result.injury.condition: STUNNED
      result.condition: KNOCKED_DOWN
  - id: failed-reaction-retains-stunned
    roles:
    - boundary
    operation: injury_reaction
    attacker:
      main_weapon_id: weapon.sword
      skill_ids:
      - skill.head-crusher
    defender:
      skill_ids:
      - skill.thick-skull
    rolls:
    - key: test.injury
      value: 1
    - key: test.thick-skull
      value: 2
    expect:
      result.condition: STUNNED
  mutations:
  - id: remove-reaction
    path: defender.global_effects.thick_skull
    value: false
    cases:
    - promoted-result-reacts
- id: thick-skull-and-ignore-pain
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: interaction
  sources:
  - target: mechanic/skill.ignore-pain
    digest: b7f2f8f45188f5a498dbb8a7743fc675e38614e972004c698c7088c7584fc384
  - target: mechanic/skill.thick-skull
    digest: ff3d7a44336e6137f9ed98716305469db44c224f738947854e6ef59c5b4a9859
  bindings:
  - '{"id": "skill.ignore-pain", "kind": "mechanic", "parameters": {}}'
  - '{"id": "skill.thick-skull", "kind": "mechanic", "parameters": {}}'
  interpretation: Ignore Pain already converts Stunned to Knocked Down, so Thick Skull requests no redundant
    die.
  cases:
  - id: no-redundant-reaction
    roles:
    - composition
    operation: injury_reaction
    defender:
      skill_ids:
      - skill.ignore-pain
      - skill.thick-skull
    rolls:
    - key: test.injury
      value: 3
    expect:
      result.condition: KNOCKED_DOWN
      result.reaction.attempted: false
  - id: out-remains-out
    roles:
    - boundary
    operation: injury_reaction
    defender:
      skill_ids:
      - skill.ignore-pain
      - skill.thick-skull
    rolls:
    - key: test.injury
      value: 5
    expect:
      result.condition: OUT
      result.reaction.attempted: false
  mutations:
  - id: remove-ignore-pain
    path: defender.global_effects.tags
    value:
    - skill.thick-skull
    - armour.no-armour
    cases:
    - no-redundant-reaction
