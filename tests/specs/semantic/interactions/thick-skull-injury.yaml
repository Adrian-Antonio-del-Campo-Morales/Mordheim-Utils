schema_version: 1
specifications:
- id: thick-skull-after-core-injury
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: interaction
  sources:
  - target: core/combat-injury-states
    digest: c3a7c3b49b566dfb68119985694de4c046ecb9212b63155a7b5fb78d8afcdcd1
  - target: mechanic/skill.thick-skull
    digest: 30869012f644e7bece0bb9c28a79f423c027db6ced91319b827c2809eb9694ee
  bindings:
  - '{"id": "combat-injury-states", "kind": "core", "parameters": {}}'
  - '{"id": "skill.thick-skull", "kind": "mechanic", "parameters": {}}'
  interpretation: Resolve the ordinary Injury table first; Thick Skull reacts only when its resulting
    condition is Stunned.
  cases:
  - id: stunned-reacts
    roles:
    - composition
    operation: injury_reaction
    defender:
      skill_ids:
      - skill.thick-skull
    rolls:
    - key: test.injury
      value: 3
    - key: test.thick-skull
      value: 3
    expect:
      result.condition: KNOCKED_DOWN
      result.reaction.attempted: true
  - id: knocked-down-does-not-react
    roles:
    - boundary
    operation: injury_reaction
    defender:
      skill_ids:
      - skill.thick-skull
    rolls:
    - key: test.injury
      value: 2
    expect:
      result.condition: KNOCKED_DOWN
      result.reaction.attempted: false
  mutations:
  - id: remove-reaction
    path: defender.global_effects.thick_skull
    value: false
    cases:
    - stunned-reacts
- id: thick-skull-and-hard-to-kill
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: interaction
  sources:
  - target: mechanic/skill.hard-to-kill
    digest: b3210faa2837a545c46b44c18e0d505347a00ca82b80e51704cc36afb7aa6f86
  - target: mechanic/skill.thick-skull
    digest: 30869012f644e7bece0bb9c28a79f423c027db6ced91319b827c2809eb9694ee
  bindings:
  - '{"id": "skill.hard-to-kill", "kind": "mechanic", "parameters": {}}'
  - '{"id": "skill.thick-skull", "kind": "mechanic", "parameters": {}}'
  interpretation: Hard to Kill makes face 5 Stunned; Thick Skull then gets its normal 3+ reaction. Face
    6 remains Out.
  cases:
  - id: face-five-reacts
    roles:
    - composition
    operation: injury_reaction
    defender:
      skill_ids:
      - skill.hard-to-kill
      - skill.thick-skull
    rolls:
    - key: test.injury
      value: 5
    - key: test.thick-skull
      value: 3
    expect:
      result.condition: KNOCKED_DOWN
  - id: face-six-does-not-react
    roles:
    - boundary
    operation: injury_reaction
    defender:
      skill_ids:
      - skill.hard-to-kill
      - skill.thick-skull
    rolls:
    - key: test.injury
      value: 6
    expect:
      result.condition: OUT
      result.reaction.attempted: false
  mutations:
  - id: remove-reaction
    path: defender.global_effects.thick_skull
    value: false
    cases:
    - face-five-reacts
- id: thick-skull-and-head-crusher
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: interaction
  sources:
  - target: mechanic/skill.head-crusher
    digest: c1ce8940c58d4c96346f41ca8e0cb6ad3c00f226d8cd5340bba04a8c1eb47657
  - target: mechanic/skill.thick-skull
    digest: 30869012f644e7bece0bb9c28a79f423c027db6ced91319b827c2809eb9694ee
  bindings:
  - '{"id": "skill.head-crusher", "kind": "mechanic", "parameters": {}}'
  - '{"id": "skill.thick-skull", "kind": "mechanic", "parameters": {}}'
  interpretation: Head Crusher promotes the attacker's Knocked Down result to Stunned before the defender's
    Thick Skull reaction.
  cases:
  - id: promoted-result-reacts
    roles:
    - composition
    operation: injury_reaction
    attacker:
      main_weapon_id: weapon.sword
      skill_ids:
      - skill.head-crusher
    defender:
      skill_ids:
      - skill.thick-skull
    rolls:
    - key: test.injury
      value: 1
    - key: test.thick-skull
      value: 3
    expect:
      result.injury.condition: STUNNED
      result.condition: KNOCKED_DOWN
  - id: failed-reaction-retains-stunned
    roles:
    - boundary
    operation: injury_reaction
    attacker:
      main_weapon_id: weapon.sword
      skill_ids:
      - skill.head-crusher
    defender:
      skill_ids:
      - skill.thick-skull
    rolls:
    - key: test.injury
      value: 1
    - key: test.thick-skull
      value: 2
    expect:
      result.condition: STUNNED
  mutations:
  - id: remove-reaction
    path: defender.global_effects.thick_skull
    value: false
    cases:
    - promoted-result-reacts
- id: thick-skull-and-ignore-pain
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: interaction
  sources:
  - target: mechanic/skill.ignore-pain
    digest: f25a1289989017d8a76c3c6230f5527ff0e1333e7fa7de218495c02db820ddc4
  - target: mechanic/skill.thick-skull
    digest: 30869012f644e7bece0bb9c28a79f423c027db6ced91319b827c2809eb9694ee
  bindings:
  - '{"id": "skill.ignore-pain", "kind": "mechanic", "parameters": {}}'
  - '{"id": "skill.thick-skull", "kind": "mechanic", "parameters": {}}'
  interpretation: Ignore Pain already converts Stunned to Knocked Down, so Thick Skull requests no redundant
    die.
  cases:
  - id: no-redundant-reaction
    roles:
    - composition
    operation: injury_reaction
    defender:
      skill_ids:
      - skill.ignore-pain
      - skill.thick-skull
    rolls:
    - key: test.injury
      value: 3
    expect:
      result.condition: KNOCKED_DOWN
      result.reaction.attempted: false
  - id: out-remains-out
    roles:
    - boundary
    operation: injury_reaction
    defender:
      skill_ids:
      - skill.ignore-pain
      - skill.thick-skull
    rolls:
    - key: test.injury
      value: 5
    expect:
      result.condition: OUT
      result.reaction.attempted: false
  mutations:
  - id: remove-ignore-pain
    path: defender.global_effects.tags
    value:
    - skill.thick-skull
    - armour.no-armour
    cases:
    - no-redundant-reaction
