schema_version: 1
specifications:
- id: editorial-brutes-strongman
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: priority
  sources:
  - target: rule/mordheim/carnival-of-chaos/brutes--unnatural-strength/skill.strongman
    digest: 360ec707defaa803e1e6ebbf90c4ed22cfca4ff74deca49fe179bba4798b87ab
  depends_on:
  - mechanic/skill.strongman
  interpretation: The profile starts with Strongman. A double-handed weapon no longer imposes strike last,
    but the fighter retains its printed Initiative and is still subject to recovery penalties. This is
    not strike first.
  cases:
  - id: recipient
    roles:
    - grant
    - compiled
    operation: grant
    defender:
      band_id: carnival-of-chaos
      profile_id: brutes
    context:
      rule_id: brutes--unnatural-strength
    expect:
      result.recipients:
      - brutes
  - id: normal-priority-restored
    roles:
    - active
    - consumer
    - boundary
    operation: priority
    attacker:
      band_id: carnival-of-chaos
      profile_id: brutes
      main_weapon_id: weapon.double-handed-weapon
    expect:
      attacker.global_effects.strongman: true
      result.priority: 0
      result.initiative: 2
  - id: recovery-still-last
    roles:
    - inactive
    - boundary
    operation: priority
    attacker:
      band_id: carnival-of-chaos
      profile_id: brutes
      main_weapon_id: weapon.double-handed-weapon
    context:
      stood_up: true
    expect:
      result.priority: -1
      result.initiative: 2
  mutations:
  - id: remove-strongman
    path: attacker.global_effects.strongman
    value: false
    cases:
    - normal-priority-restored
