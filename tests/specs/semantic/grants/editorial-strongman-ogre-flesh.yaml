- id: editorial-ogre-flesh
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: permanent
  sources:
  - target: rule/trollheim/khemri-necromancers/band--necromantic-modification-ogre-flesh/skill.monstrous
    digest: 05f8e9f274a7e3ee624c7ee8d5c5c6f5117c2217fe9960b829ff2573117dd7c1
  depends_on: [mechanic/skill.monstrous]
  interpretation: Ogre Flesh grants the Necromantic Abomination one additional Wound, taking its initial duel state
    from three to four. The acquisition roll and gold cost belong to campaign management, not this duel test.
  cases:
  - id: recipient
    roles: [grant, compiled]
    operation: selectable_grant
    defender: {collection: trollheim, band_id: khemri-necromancers, profile_id: necromantic-abomination}
    context: {rule_id: band--necromantic-modification-ogre-flesh}
    expect: {result.recipients: [necromantic-abomination]}
  - id: four-initial-wounds
    roles: [consumer, boundary]
    operation: initialize
    attacker:
      collection: trollheim
      band_id: khemri-necromancers
      profile_id: necromantic-abomination
      special_rule_ids: [band--necromantic-modification-ogre-flesh]
    expect: {result.attacker.wounds: 4}
    expect_contains:
      attacker.global_effects.tags: [skill.monstrous]
  - id: three-without-modification
    roles: [boundary]
    operation: initialize
    attacker: {collection: trollheim, band_id: khemri-necromancers, profile_id: necromantic-abomination}
    expect: {result.attacker.wounds: 3}
  mutations:
  - id: remove-extra-wound
    path: attacker.global_effects.tags
    value: []
    cases: [four-initial-wounds]
