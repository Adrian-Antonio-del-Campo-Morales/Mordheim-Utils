- id: editorial-ogre-flesh
  scope_digest: ea4090654a79e79bb19b0855371a062c6a9a10c1ab40f7d8abdb42634a425b97
  category: permanent
  sources:
  - target: rule/trollheim/khemri-necromancers/band--necromantic-modification-ogre-flesh/skill.monstrous
    digest: 2c3e36035c32788aba79c0a906c4ca6fb0fd274341281b94e203b0cc71734f0f
  depends_on:
  - mechanic/skill.monstrous
  interpretation: Ogre Flesh grants the Necromantic Abomination one additional Wound, taking its initial
    duel state from three to four. The acquisition roll and gold cost belong to campaign management, not
    this duel test.
  cases:
  - id: recipient
    roles:
    - grant
    - compiled
    operation: selectable_grant
    defender:
      collection: trollheim
      band_id: khemri-necromancers
      profile_id: necromantic-abomination
    context:
      rule_id: band--necromantic-modification-ogre-flesh
    expect:
      result.recipients:
      - necromantic-abomination
  - id: four-initial-wounds
    roles:
    - consumer
    - boundary
    operation: initialize
    attacker:
      collection: trollheim
      band_id: khemri-necromancers
      profile_id: necromantic-abomination
      special_rule_ids:
      - band--necromantic-modification-ogre-flesh
    expect:
      result.attacker.wounds: 4
    expect_contains:
      attacker.global_effects.tags:
      - skill.monstrous
  - id: three-without-modification
    roles:
    - boundary
    operation: initialize
    attacker:
      collection: trollheim
      band_id: khemri-necromancers
      profile_id: necromantic-abomination
    expect:
      result.attacker.wounds: 3
  mutations:
  - id: remove-extra-wound
    path: attacker.global_effects.tags
    value: []
    cases:
    - four-initial-wounds
