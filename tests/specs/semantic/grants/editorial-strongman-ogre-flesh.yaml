schema_version: 1
specifications:
- id: editorial-brutes-strongman
  scope_digest: ea4090654a79e79bb19b0855371a062c6a9a10c1ab40f7d8abdb42634a425b97
  category: priority
  sources:
  - target: rule/mordheim/carnival-of-chaos/brutes--unnatural-strength/skill.strongman
    digest: aff8b18ed2e236474f44e17fa97f6e49d3c06887c006b3b1e574a45263a885da
  depends_on:
  - mechanic/skill.strongman
  interpretation: The profile starts with Strongman. A double-handed weapon no longer imposes strike last,
    but the fighter retains its printed Initiative and is still subject to recovery penalties. This is
    not strike first.
  cases:
  - id: recipient
    roles:
    - grant
    - compiled
    operation: grant
    defender:
      band_id: carnival-of-chaos
      profile_id: brutes
    context:
      rule_id: brutes--unnatural-strength
    expect:
      result.recipients:
      - brutes
  - id: normal-priority-restored
    roles:
    - active
    - consumer
    - boundary
    operation: priority
    attacker:
      band_id: carnival-of-chaos
      profile_id: brutes
      main_weapon_id: weapon.double-handed-weapon
    expect:
      attacker.global_effects.strongman: true
      result.priority: 0
      result.initiative: 2
  - id: recovery-still-last
    roles:
    - inactive
    - boundary
    operation: priority
    attacker:
      band_id: carnival-of-chaos
      profile_id: brutes
      main_weapon_id: weapon.double-handed-weapon
    context:
      stood_up: true
    expect:
      result.priority: -1
      result.initiative: 2
  mutations:
  - id: remove-strongman
    path: attacker.global_effects.strongman
    value: false
    cases:
    - normal-priority-restored
