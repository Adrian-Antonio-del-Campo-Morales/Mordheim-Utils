schema_version: 1
specifications:
- id: editorial-untiring
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: construction
  sources:
  - target: rule/mordheim/bretonnian-chapel-guard/band--untiring/mechanic.untiring
    digest: ad00e642b9ea4614d9ed6e90dcef528edfd44998fadc6329a81a63da33a0dc5d
  depends_on:
  - mechanic/mechanic.untiring
  interpretation: Untiring can only be selected for Questing Knight and Knights Errant; selecting it grants
    exactly the already verified Untiring mechanism.
  cases:
  - id: recipients
    roles:
    - grant
    - accepted
    - rejected
    operation: selectable_grant
    defender:
      band_id: bretonnian-chapel-guard
      profile_id: questing-knight
    context:
      rule_id: band--untiring
    expect:
      result.recipients:
      - knights-errant
      - questing-knight
  - id: selected
    roles:
    - accepted
    operation: armour
    attacker:
      main_weapon_id: weapon.vomit-attack
    defender:
      band_id: bretonnian-chapel-guard
      profile_id: questing-knight
      special_rule_ids:
      - band--untiring
    rolls:
    - key: armour
      value: 5
    expect:
      result.eligible: true
      result.target: 5
      result.saved: true
  mutations:
  - id: omit-grant
    changes:
    - path: defender.global_effects.armour_save_floor
      value: 7
    - path: defender.global_effects.armour_cannot_be_ignored
      value: false
    cases:
    - selected
- id: editorial-great-claw-mordheim-and-trollheim
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: local
  sources:
  - target: rule/mordheim/cult-of-the-possessed/band--mutations-great-claw/special-rule.band--mutations-great-claw
    digest: 759dcfbbcde5389cab1bad95ce832c5270bde0cfd8660c28483eb1a9b838d6d4
  - target: rule/trollheim/trollheim-cult-of-the-possessed/band--mutations-great-claw/special-rule.band--mutations-great-claw
    digest: 3b8b838a3b54a81d79901676ed47dbc656633441383f9ebc1bc78e442e9340a4
  interpretation: Great Claw is selectable only by Mutants and Possessed and adds a separate attack at
    Strength +1 in both collections.
  cases:
  - id: mordheim-recipients
    roles:
    - grant
    - accepted
    - rejected
    operation: selectable_grant
    defender:
      band_id: cult-of-the-possessed
      profile_id: darksouls
    context:
      rule_id: band--mutations-great-claw
    expect:
      result.recipients:
      - mutants
      - the-possessed
  - id: trollheim-recipients
    roles:
    - grant
    - accepted
    - rejected
    operation: selectable_grant
    defender:
      collection: trollheim
      band_id: trollheim-cult-of-the-possessed
      profile_id: darksouls
    context:
      rule_id: band--mutations-great-claw
    expect:
      result.recipients:
      - mutants
      - the-possessed
  - id: claw-attack
    roles:
    - compiled
    - active
    - consumer
    - boundary
    operation: extra_attack
    attacker:
      band_id: cult-of-the-possessed
      profile_id: mutants
      special_rule_ids:
      - band--mutations-great-claw
    defender:
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 4
        wounds: 3
        initiative: 3
        attacks: 1
    rolls:
    - key: test.hit
      value: 4
    - key: test.wound
      value: 4
    expect:
      attacker.extra_attacks.0.strength_bonus: 1
      result.wounded: true
      result.defender.wounds: 2
    expect_contains:
      attacker.extra_attacks.0.tags:
      - rule.great-claw
  - id: no-claw
    roles: []
    operation: compile
    attacker:
      band_id: cult-of-the-possessed
      profile_id: darksouls
    expect:
      attacker.extra_attacks: []
  - id: ordinary-attack
    roles:
    - inactive
    operation: attacks
    attacker:
      band_id: cult-of-the-possessed
      profile_id: darksouls
    expect:
      result.attacks: 1
  mutations:
  - id: remove-strength
    path: attacker.extra_attacks.0.strength_bonus
    value: 0
    cases:
    - claw-attack
- id: editorial-tentacle-mordheim-and-trollheim
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: local
  sources:
  - target: rule/mordheim/cult-of-the-possessed/band--mutations-tentacle/special-rule.band--mutations-tentacle
    digest: 703411953088eccc4964ba663e57c0c687808cff754c2b2eb21ffc7b1af4a942
  - target: rule/trollheim/trollheim-cult-of-the-possessed/band--mutations-tentacle/special-rule.band--mutations-tentacle
    digest: b1b1e6b757527876da6e9db1a6b290a14d4bc0dda2cdf47bbc63b9426fa27547
  interpretation: Tentacle is selectable by Mutants and Possessed and removes one attack from the opponent
    without reducing it below one.
  cases:
  - id: mordheim-recipients
    roles:
    - grant
    - accepted
    - rejected
    operation: selectable_grant
    defender:
      band_id: cult-of-the-possessed
      profile_id: darksouls
    context:
      rule_id: band--mutations-tentacle
    expect:
      result.recipients:
      - mutants
      - the-possessed
  - id: trollheim-recipients
    roles:
    - grant
    - accepted
    - rejected
    operation: selectable_grant
    defender:
      collection: trollheim
      band_id: trollheim-cult-of-the-possessed
      profile_id: darksouls
    context:
      rule_id: band--mutations-tentacle
    expect:
      result.recipients:
      - mutants
      - the-possessed
  - id: reduces-three-to-two
    roles:
    - compiled
    - active
    - consumer
    - boundary
    operation: opposed_attacks
    attacker:
      main_weapon_id: weapon.mace
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 3
        attacks: 3
    defender:
      band_id: cult-of-the-possessed
      profile_id: mutants
      special_rule_ids:
      - band--mutations-tentacle
    expect:
      defender.global_effects.incoming_attacks_modifier: -1
      result.attacks: 2
  - id: minimum-one
    roles:
    - active
    - boundary
    operation: opposed_attacks
    attacker:
      main_weapon_id: weapon.mace
    defender:
      collection: trollheim
      band_id: trollheim-cult-of-the-possessed
      profile_id: mutants
      special_rule_ids:
      - band--mutations-tentacle
    expect:
      result.attacks: 1
  - id: absent
    roles:
    - inactive
    operation: opposed_attacks
    attacker:
      main_weapon_id: weapon.mace
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 3
        attacks: 3
    expect:
      result.attacks: 3
  mutations:
  - id: remove-tentacle
    path: defender.global_effects.incoming_attacks_modifier
    value: 0
    cases:
    - reduces-three-to-two
- id: editorial-extra-arm-mordheim-and-trollheim
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: local
  sources:
  - target: rule/mordheim/cult-of-the-possessed/band--mutations-extra-arm/special-rule.band--mutations-extra-arm
    digest: 4c3943a2f7a243d6fddfcb312aa20148d10a58ccfaa02285b2df5d577454fea5
  - target: rule/trollheim/trollheim-cult-of-the-possessed/band--mutations-extra-arm/special-rule.band--mutations-extra-arm
    digest: 67579da787dd1c29840d0d70630585747e281a9a64741f8b174274f6d9f26825
  interpretation: Extra Arm accepts a one-handed weapon, Shield or Buckler for Mutants and Possessed;
    the weapon creates a separate attack and the shield additionally keeps the Possessed's natural attack.
  cases:
  - id: mordheim-recipients
    roles:
    - grant
    - accepted
    - rejected
    operation: selectable_grant
    defender:
      band_id: cult-of-the-possessed
      profile_id: darksouls
    context:
      rule_id: band--mutations-extra-arm
    expect:
      result.recipients:
      - mutants
      - the-possessed
  - id: trollheim-recipients
    roles:
    - grant
    - accepted
    - rejected
    operation: selectable_grant
    defender:
      collection: trollheim
      band_id: trollheim-cult-of-the-possessed
      profile_id: darksouls
    context:
      rule_id: band--mutations-extra-arm
    expect:
      result.recipients:
      - mutants
      - the-possessed
  - id: weapon-extra-attack
    roles:
    - compiled
    - active
    - consumer
    - boundary
    operation: extra_attack
    attacker:
      band_id: cult-of-the-possessed
      profile_id: mutants
      special_rule_ids:
      - band--mutations-extra-arm
      extra_hand_id: weapon.mace
    rolls:
    - key: test.hit
      value: 4
    - key: test.wound
      value: 4
    expect:
      result.wounded: true
      result.defender.wounds: 2
    expect_contains:
      attacker.extra_attacks.0.tags:
      - weapon.mace
  - id: shield-and-possessed-attack
    roles:
    - compiled
    operation: compile
    attacker:
      collection: trollheim
      band_id: trollheim-cult-of-the-possessed
      profile_id: the-possessed
      special_rule_ids:
      - band--mutations-extra-arm
      extra_hand_id: defence.shield
    expect:
      attacker.armour_save: 5
    expect_contains:
      attacker.extra_attacks.0.tags:
      - weapon.natural-attacks
  - id: no-extra-arm
    roles: []
    operation: compile
    attacker:
      band_id: cult-of-the-possessed
      profile_id: darksouls
    expect:
      attacker.extra_attacks: []
  - id: ordinary-attack
    roles:
    - inactive
    operation: attacks
    attacker:
      band_id: cult-of-the-possessed
      profile_id: darksouls
    expect:
      result.attacks: 1
  mutations:
  - id: weaken-extra-weapon
    path: attacker.extra_attacks.0.strength_bonus
    value: -2
    cases:
    - weapon-extra-attack
- id: editorial-maddened-with-pain
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: contextual
  sources:
  - target: rule/mordheim/cursed-cavalcade/great-bear--maddened-with-pain/trait.maddened-with-pain
    digest: 84ea21c8f3c78a13ef89b7b0290fa5fcbddfe30fef6dfa146f0961bd13247282
  interpretation: Only the Great Bear receives Maddened With Pain and gains exactly one attack after having
    lost at least one Wound.
  cases:
  - id: recipient
    roles:
    - grant
    operation: grant
    defender:
      band_id: cursed-cavalcade
      profile_id: great-bear
    context:
      rule_id: great-bear--maddened-with-pain
    expect:
      result.recipients:
      - great-bear
  - id: wounded
    roles:
    - compiled
    - active
    - consumer
    - boundary
    operation: attacks
    attacker:
      band_id: cursed-cavalcade
      profile_id: great-bear
    context:
      wounded: true
    expect:
      result.attacks: 3
    expect_contains:
      attacker.global_effects.tags:
      - maddened_with_pain
  - id: unwounded
    roles:
    - inactive
    - boundary
    operation: attacks
    attacker:
      band_id: cursed-cavalcade
      profile_id: great-bear
    context:
      wounded: false
    expect:
      result.attacks: 2
  mutations:
  - id: remove-pain
    path: attacker.global_effects.tags
    value: []
    cases:
    - wounded
