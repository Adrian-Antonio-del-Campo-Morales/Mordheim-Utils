schema_version: 1
specifications:
- id: editorial-untiring
  scope_digest: ea4090654a79e79bb19b0855371a062c6a9a10c1ab40f7d8abdb42634a425b97
  category: construction
  sources:
  - target: rule/mordheim/bretonnian-chapel-guard/band--untiring/mechanic.untiring
    digest: 1bb68df93a2f4e8dd9863bc95408fe253fee819ef7886c86f808ef354723072e
  depends_on:
  - mechanic/mechanic.untiring
  interpretation: Untiring can only be selected for Questing Knight and Knights Errant; selecting it grants
    exactly the already verified Untiring mechanism.
  cases:
  - id: recipients
    roles:
    - grant
    - accepted
    - rejected
    operation: selectable_grant
    defender:
      band_id: bretonnian-chapel-guard
      profile_id: questing-knight
    context:
      rule_id: band--untiring
    expect:
      result.recipients:
      - knights-errant
      - questing-knight
  - id: selected
    roles:
    - accepted
    operation: armour
    attacker:
      main_weapon_id: weapon.vomit-attack
    defender:
      band_id: bretonnian-chapel-guard
      profile_id: questing-knight
      special_rule_ids:
      - band--untiring
    rolls:
    - key: armour
      value: 5
    expect:
      result.eligible: true
      result.target: 5
      result.saved: true
  mutations:
  - id: omit-grant
    changes:
    - path: defender.global_effects.armour_save_floor
      value: 7
    - path: defender.global_effects.armour_cannot_be_ignored
      value: false
    cases:
    - selected
- id: editorial-great-claw-mordheim-and-trollheim
  scope_digest: ea4090654a79e79bb19b0855371a062c6a9a10c1ab40f7d8abdb42634a425b97
  category: local
  sources:
  - target: rule/mordheim/cult-of-the-possessed/band--mutations-great-claw/special-rule.band--mutations-great-claw
    digest: 5e334b733518b1c4b6945f42233da054746ee5d32e7cb46186732a43c1656725
  - target: rule/trollheim/trollheim-cult-of-the-possessed/band--mutations-great-claw/special-rule.band--mutations-great-claw
    digest: ed2d21ae748f6c680d0d2af5ea95a1142025f8bdbcbc811e333ed255c8789ae7
  interpretation: Great Claw is selectable only by Mutants and Possessed and adds a separate attack at
    Strength +1 in both collections.
  cases:
  - id: mordheim-recipients
    roles:
    - grant
    - accepted
    - rejected
    operation: selectable_grant
    defender:
      band_id: cult-of-the-possessed
      profile_id: darksouls
    context:
      rule_id: band--mutations-great-claw
    expect:
      result.recipients:
      - mutants
      - the-possessed
  - id: trollheim-recipients
    roles:
    - grant
    - accepted
    - rejected
    operation: selectable_grant
    defender:
      collection: trollheim
      band_id: trollheim-cult-of-the-possessed
      profile_id: darksouls
    context:
      rule_id: band--mutations-great-claw
    expect:
      result.recipients:
      - mutants
      - the-possessed
  - id: claw-attack
    roles:
    - compiled
    - active
    - consumer
    - boundary
    operation: extra_attack
    attacker:
      band_id: cult-of-the-possessed
      profile_id: mutants
      special_rule_ids:
      - band--mutations-great-claw
    defender:
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 4
        wounds: 3
        initiative: 3
        attacks: 1
    rolls:
    - key: test.hit
      value: 4
    - key: test.wound
      value: 4
    expect:
      attacker.extra_attacks.0.strength_bonus: 1
      result.wounded: true
      result.defender.wounds: 2
    expect_contains:
      attacker.extra_attacks.0.tags:
      - rule.great-claw
  - id: no-claw
    roles: []
    operation: compile
    attacker:
      band_id: cult-of-the-possessed
      profile_id: darksouls
    expect:
      attacker.extra_attacks: []
  - id: ordinary-attack
    roles:
    - inactive
    operation: attacks
    attacker:
      band_id: cult-of-the-possessed
      profile_id: darksouls
    expect:
      result.attacks: 1
  mutations:
  - id: remove-strength
    path: attacker.extra_attacks.0.strength_bonus
    value: 0
    cases:
    - claw-attack
- id: editorial-tentacle-mordheim-and-trollheim
  scope_digest: ea4090654a79e79bb19b0855371a062c6a9a10c1ab40f7d8abdb42634a425b97
  category: local
  sources:
  - target: rule/mordheim/cult-of-the-possessed/band--mutations-tentacle/special-rule.band--mutations-tentacle
    digest: 538479c488452523d568fb600cb628aa3dabcd707a8bd2ff88c10d0768c4e384
  - target: rule/trollheim/trollheim-cult-of-the-possessed/band--mutations-tentacle/special-rule.band--mutations-tentacle
    digest: 22faefba7593ee193480bbf880f9f831aefb18dbfe9d18beb674420f07569016
  interpretation: Tentacle is selectable by Mutants and Possessed, removes one attack from the opponent
    without reducing it below one, and lets the mutant nominate which of the opponent's allocated attacks is
    lost; a lone attack cannot be taken.  The nomination is offered before any of the opponent's attacks is
    rolled, and accepting the first allocation reproduces the flat incoming modifier the optimized drivers
    apply.
  cases:
  - id: mordheim-recipients
    roles:
    - grant
    - accepted
    - rejected
    operation: selectable_grant
    defender:
      band_id: cult-of-the-possessed
      profile_id: darksouls
    context:
      rule_id: band--mutations-tentacle
    expect:
      result.recipients:
      - mutants
      - the-possessed
  - id: trollheim-recipients
    roles:
    - grant
    - accepted
    - rejected
    operation: selectable_grant
    defender:
      collection: trollheim
      band_id: trollheim-cult-of-the-possessed
      profile_id: darksouls
    context:
      rule_id: band--mutations-tentacle
    expect:
      result.recipients:
      - mutants
      - the-possessed
  - id: reduces-three-to-two
    roles:
    - compiled
    - active
    - consumer
    - boundary
    operation: opposed_attacks
    attacker:
      main_weapon_id: weapon.mace
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 3
        attacks: 3
    defender:
      band_id: cult-of-the-possessed
      profile_id: mutants
      special_rule_ids:
      - band--mutations-tentacle
    expect:
      defender.global_effects.incoming_attacks_modifier: -1
      result.attacks: 2
  - id: minimum-one
    roles:
    - active
    - boundary
    operation: opposed_attacks
    attacker:
      main_weapon_id: weapon.mace
    defender:
      collection: trollheim
      band_id: trollheim-cult-of-the-possessed
      profile_id: mutants
      special_rule_ids:
      - band--mutations-tentacle
    expect:
      result.attacks: 1
  - id: grapple-keeps-the-off-hand-attack
    roles:
    - compiled
    - active
    - consumer
    - boundary
    operation: pool
    attacker:
      main_weapon_id: weapon.sigmarite-hammer
      off_hand_id: weapon.mace
    defender:
      band_id: cult-of-the-possessed
      profile_id: mutants
      special_rule_ids:
      - band--mutations-tentacle
    context:
      count: 2
    decisions:
    - key: test.grapple-lost-attack.0
      value: true
    rolls:
    - key: test.attack.0.hit
      value: 5
    - key: test.attack.0.wound
      value: 3
    expect:
      result.attacks.0.wounded: false
  - id: grapple-nominates-the-nominated-attack
    roles:
    - active
    - consumer
    - sequence
    operation: pool
    attacker:
      main_weapon_id: weapon.sigmarite-hammer
      off_hand_id: weapon.mace
    defender:
      collection: trollheim
      band_id: trollheim-cult-of-the-possessed
      profile_id: mutants
      special_rule_ids:
      - band--mutations-tentacle
    context:
      count: 2
    decisions:
    - key: test.grapple-lost-attack.0
      value: false
    - key: test.grapple-lost-attack.1
      value: true
    rolls:
    - key: test.attack.0.hit
      value: 5
    - key: test.attack.0.wound
      value: 3
    - key: test.attack.0.injury.0
      value: 1
    expect:
      result.attacks.0.wounded: true
  - id: grapple-can-be-declined
    roles:
    - active
    - consumer
    operation: pool
    attacker:
      main_weapon_id: weapon.sigmarite-hammer
      off_hand_id: weapon.mace
    defender:
      band_id: cult-of-the-possessed
      profile_id: mutants
      special_rule_ids:
      - band--mutations-tentacle
    context:
      count: 2
    decisions:
    - key: test.grapple-lost-attack.0
      value: false
    - key: test.grapple-lost-attack.1
      value: false
    rolls:
    - key: test.attack.0.hit
      value: 1
    - key: test.attack.1.hit
      value: 1
    expect:
      result.attacks.0.hit: false
      result.attacks.1.hit: false
  - id: absent
    roles:
    - inactive
    operation: opposed_attacks
    attacker:
      main_weapon_id: weapon.mace
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 3
        attacks: 3
    expect:
      result.attacks: 3
  mutations:
  - id: remove-tentacle
    path: defender.global_effects.incoming_attacks_modifier
    value: 0
    cases:
    - reduces-three-to-two
- id: editorial-extra-arm-mordheim-and-trollheim
  scope_digest: ea4090654a79e79bb19b0855371a062c6a9a10c1ab40f7d8abdb42634a425b97
  category: local
  sources:
  - target: rule/mordheim/cult-of-the-possessed/band--mutations-extra-arm/special-rule.band--mutations-extra-arm
    digest: df8d40c43a0be948352f11442fbe52e1dde676e6b41f2e001d998682f361b088
  - target: rule/trollheim/trollheim-cult-of-the-possessed/band--mutations-extra-arm/special-rule.band--mutations-extra-arm
    digest: 9bc9a9581f9b37d701206718af7a375cd4a0384d8da8c7de028a17cb9633998b
  interpretation: Extra Arm accepts a one-handed weapon, Shield or Buckler for Mutants and Possessed;
    the weapon creates a separate attack and the shield additionally keeps the Possessed's natural attack.
  cases:
  - id: mordheim-recipients
    roles:
    - grant
    - accepted
    - rejected
    operation: selectable_grant
    defender:
      band_id: cult-of-the-possessed
      profile_id: darksouls
    context:
      rule_id: band--mutations-extra-arm
    expect:
      result.recipients:
      - mutants
      - the-possessed
  - id: trollheim-recipients
    roles:
    - grant
    - accepted
    - rejected
    operation: selectable_grant
    defender:
      collection: trollheim
      band_id: trollheim-cult-of-the-possessed
      profile_id: darksouls
    context:
      rule_id: band--mutations-extra-arm
    expect:
      result.recipients:
      - mutants
      - the-possessed
  - id: weapon-extra-attack
    roles:
    - compiled
    - active
    - consumer
    - boundary
    operation: extra_attack
    attacker:
      band_id: cult-of-the-possessed
      profile_id: mutants
      special_rule_ids:
      - band--mutations-extra-arm
      extra_hand_id: weapon.mace
    rolls:
    - key: test.hit
      value: 4
    - key: test.wound
      value: 4
    expect:
      result.wounded: true
      result.defender.wounds: 2
    expect_contains:
      attacker.extra_attacks.0.tags:
      - weapon.mace
  - id: shield-and-possessed-attack
    roles:
    - compiled
    operation: compile
    attacker:
      collection: trollheim
      band_id: trollheim-cult-of-the-possessed
      profile_id: the-possessed
      special_rule_ids:
      - band--mutations-extra-arm
      extra_hand_id: defence.shield
    expect:
      attacker.armour_save: 5
    expect_contains:
      attacker.extra_attacks.0.tags:
      - weapon.natural-attacks
  - id: no-extra-arm
    roles: []
    operation: compile
    attacker:
      band_id: cult-of-the-possessed
      profile_id: darksouls
    expect:
      attacker.extra_attacks: []
  - id: ordinary-attack
    roles:
    - inactive
    operation: attacks
    attacker:
      band_id: cult-of-the-possessed
      profile_id: darksouls
    expect:
      result.attacks: 1
  mutations:
  - id: weaken-extra-weapon
    path: attacker.extra_attacks.0.strength_bonus
    value: -2
    cases:
    - weapon-extra-attack
- id: editorial-maddened-with-pain
  scope_digest: ea4090654a79e79bb19b0855371a062c6a9a10c1ab40f7d8abdb42634a425b97
  category: contextual
  sources:
  - target: rule/mordheim/cursed-cavalcade/great-bear--maddened-with-pain/trait.maddened-with-pain
    digest: 84ea21c8f3c78a13ef89b7b0290fa5fcbddfe30fef6dfa146f0961bd13247282
  interpretation: Only the Great Bear receives Maddened With Pain and gains exactly one attack after having
    lost at least one Wound.
  cases:
  - id: recipient
    roles:
    - grant
    operation: grant
    defender:
      band_id: cursed-cavalcade
      profile_id: great-bear
    context:
      rule_id: great-bear--maddened-with-pain
    expect:
      result.recipients:
      - great-bear
  - id: wounded
    roles:
    - compiled
    - active
    - consumer
    - boundary
    operation: attacks
    attacker:
      band_id: cursed-cavalcade
      profile_id: great-bear
    context:
      wounded: true
    expect:
      result.attacks: 3
    expect_contains:
      attacker.global_effects.tags:
      - maddened_with_pain
  - id: unwounded
    roles:
    - inactive
    - boundary
    operation: attacks
    attacker:
      band_id: cursed-cavalcade
      profile_id: great-bear
    context:
      wounded: false
    expect:
      result.attacks: 2
  mutations:
  - id: remove-pain
    path: attacker.global_effects.tags
    value: []
    cases:
    - wounded
