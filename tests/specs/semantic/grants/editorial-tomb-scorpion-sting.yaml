schema_version: 1
specifications:
- id: editorial-mordheim-tomb-scorpion-sting
  scope_digest: ea4090654a79e79bb19b0855371a062c6a9a10c1ab40f7d8abdb42634a425b97
  category: local
  sources:
  - target: rule/mordheim/tomb-guardians/tomb-scorpions--scorpion-sting/poison.black-lotus
    digest: 531b3fd1c96b50d0d6c1f8bed81485e68897e0cc9e911b7b22d7a72bcd7703ca
  depends_on:
  - mechanic/poison.black-lotus
  interpretation: The Tomb Scorpion's natural attack receives Black Lotus; a natural 6 to hit wounds automatically
    unless the target is immune to poison.
  cases:
  - id: recipients
    roles:
    - grant
    - compiled
    operation: grant
    defender:
      collection: mordheim
      band_id: tomb-guardians
      profile_id: tomb-scorpions
    context:
      rule_id: tomb-scorpions--scorpion-sting
    expect:
      result.recipients:
      - tomb-scorpions
  - id: hit-six-automatic-wound
    roles:
    - active
    - consumer
    - boundary
    operation: wound
    attacker:
      collection: mordheim
      band_id: tomb-guardians
      profile_id: tomb-scorpions
    context:
      hit_roll: 6
    expect:
      context.automatic: false
      result.success: true
      result.critical: false
      context.failure_still_wounds: true
    expect_contains:
      attacker.main_weapon.tags:
      - poison.black-lotus
    rolls:
    - key: wound
      value: 1
  - id: hit-five-is-ordinary
    roles:
    - inactive
    - boundary
    operation: wound
    attacker:
      collection: mordheim
      band_id: tomb-guardians
      profile_id: tomb-scorpions
    context:
      hit_roll: 5
    rolls:
    - key: wound
      value: 1
    expect:
      context.automatic: false
      result.success: false
  - id: immunity-cancels-sting
    roles:
    - inactive
    - boundary
    operation: wound
    attacker:
      collection: mordheim
      band_id: tomb-guardians
      profile_id: tomb-scorpions
    defender:
      preparation_ids:
      - preparation.tears-of-shallaya
    context:
      hit_roll: 6
    rolls:
    - key: wound
      value: 1
    expect:
      context.automatic: false
      result.success: false
  mutations:
  - id: remove-sting
    path: attacker.main_weapon.tags
    value: []
    cases:
    - hit-six-automatic-wound
