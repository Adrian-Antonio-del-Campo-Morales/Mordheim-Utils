schema_version: 1
specifications:
- id: editorial-mordheim-tomb-scorpion-sting
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: local
  sources:
  - target: rule/mordheim/tomb-guardians/tomb-scorpions--scorpion-sting/poison.black-lotus
    digest: 6993e5ccab481e231610f52a81eb9a9c2170819b0821c0735fda8bdb676ca37b
  depends_on:
  - mechanic/poison.black-lotus
  interpretation: The Tomb Scorpion's natural attack receives Black Lotus; a natural 6 to hit wounds automatically
    unless the target is immune to poison.
  cases:
  - id: recipients
    roles:
    - grant
    - compiled
    operation: grant
    defender:
      collection: mordheim
      band_id: tomb-guardians
      profile_id: tomb-scorpions
    context:
      rule_id: tomb-scorpions--scorpion-sting
    expect:
      result.recipients:
      - tomb-scorpions
  - id: hit-six-automatic-wound
    roles:
    - active
    - consumer
    - boundary
    operation: wound
    attacker:
      collection: mordheim
      band_id: tomb-guardians
      profile_id: tomb-scorpions
    context:
      hit_roll: 6
    expect:
      context.automatic: false
      result.success: true
      result.critical: false
      context.failure_still_wounds: true
    expect_contains:
      attacker.main_weapon.tags:
      - poison.black-lotus
    rolls:
    - key: wound
      value: 1
  - id: hit-five-is-ordinary
    roles:
    - inactive
    - boundary
    operation: wound
    attacker:
      collection: mordheim
      band_id: tomb-guardians
      profile_id: tomb-scorpions
    context:
      hit_roll: 5
    rolls:
    - key: wound
      value: 1
    expect:
      context.automatic: false
      result.success: false
  - id: immunity-cancels-sting
    roles:
    - inactive
    - boundary
    operation: wound
    attacker:
      collection: mordheim
      band_id: tomb-guardians
      profile_id: tomb-scorpions
    defender:
      preparation_ids:
      - preparation.tears-of-shallaya
    context:
      hit_roll: 6
    rolls:
    - key: wound
      value: 1
    expect:
      context.automatic: false
      result.success: false
  mutations:
  - id: remove-sting
    path: attacker.main_weapon.tags
    value: []
    cases:
    - hit-six-automatic-wound
