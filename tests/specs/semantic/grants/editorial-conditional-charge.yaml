schema_version: 1
specifications:
- id: conditional-berserk-norse-explorers-btb
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: contextual
  sources:
  - target: rule/mordheim/norse-explorers-btb/band--norse-special-skills-berserk-charge/special-rule.band--norse-special-skills-berserk-charge
    digest: 56e1a81dc574f847125c1bfc960db2b3eb578545075235847ea1ee290895c110
  interpretation: 'Norse special skills / Berserk Charge: re-rolls failed to-hit rolls when charging exclusively
    with an axe or a two-handed weapon. It does not require the first round. WS4 versus WS3 hits on 3+:
    2/3 without the re-roll and 8/9 with it. Each variant tests the exact recipient list.'
  cases:
  - id: recipients
    roles:
    - grant
    operation: selectable_grant
    defender:
      band_id: norse-explorers-btb
      profile_id: jarl
    context:
      rule_id: band--norse-special-skills-berserk-charge
    expect:
      result.recipients:
      - beserkers
      - bondsmen
      - jarl
      - wulfen
  - id: axe-false-false
    roles:
    - inactive
    - consumer
    - boundary
    operation: hit
    attacker:
      band_id: norse-explorers-btb
      profile_id: jarl
      special_rule_ids:
      - band--norse-special-skills-berserk-charge
      main_weapon_id: weapon.axe
    context:
      first_round: false
      charging: false
    distribution:
      observable: result.success
      max_rolls: 2
      expected:
        'true': 2/3
        'false': 1/3
  - id: axe-false-true
    roles:
    - active
    - consumer
    - boundary
    operation: hit
    attacker:
      band_id: norse-explorers-btb
      profile_id: jarl
      special_rule_ids:
      - band--norse-special-skills-berserk-charge
      main_weapon_id: weapon.axe
    context:
      first_round: false
      charging: true
    distribution:
      observable: result.success
      max_rolls: 2
      expected:
        'true': 8/9
        'false': 1/9
