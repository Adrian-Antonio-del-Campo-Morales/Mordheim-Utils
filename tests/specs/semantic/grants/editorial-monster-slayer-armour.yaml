  depends_on: [mechanic/skill.monster-slayer]
  interpretation: Si Monster Slayer mejora la herida a 4+, la salvacion usa la Fuerza efectiva
    que produciria ese 4+. Contra R6, un Slayer F3 hiere a 4+ y calcula el modificador como F6.
    Si la Fuerza real ya es mejor, no se reduce.
