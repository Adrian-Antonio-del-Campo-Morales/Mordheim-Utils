    roles: [active, consumer]
    operation: wound
    attacker: {collection: trollheim, band_id: khemri-cursed-of-karak-zorn, profile_id: troll-slayer, special_rule_ids: [band--troll-slayer-special-skills-monster-slayer], main_weapon_id: weapon.mace}
    defender: {characteristics: {weapon_skill: 3, strength: 3, toughness: 6, wounds: 3, initiative: 3, attacks: 1}}
    rolls: [{key: wound, value: 4}]
    expect: {result.target: 4, result.success: true}
