schema_version: 1
specifications:
- id: karak-zorn-monster-slayer-effective-armour
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: contextual
  sources:
  - target: mechanic/skill.monster-slayer-effective-strength-armour
    digest: e78e44150090b7d0070a513204be2d7cc96e78c27a0d7268e122e3caab8f54ec
  - target: rule/trollheim/khemri-cursed-of-karak-zorn/band--troll-slayer-special-skills-monster-slayer/skill.monster-slayer-effective-strength-armour
    digest: b93c3e46b034f0966715e9b05d93de0651582dd9e179bfa884850f518d2e9cf5
  depends_on:
  - mechanic/skill.monster-slayer
  interpretation: If Monster Slayer improves the wound to 4+, the save uses the effective Strength that
    would produce that 4+. Against R6, a Slayer S3 wounds on 4+ and computes the modifier as S6. If the
    real Strength is already better, it is not reduced.
  cases:
  - id: recipient
    roles:
    - grant
    - compiled
    operation: selectable_grant
    defender:
      collection: trollheim
      band_id: khemri-cursed-of-karak-zorn
      profile_id: troll-slayer
    context:
      rule_id: band--troll-slayer-special-skills-monster-slayer
    expect:
      result.recipients:
      - troll-slayer
  - id: wound-toughness-six
    roles:
    - active
    - consumer
    operation: wound
    attacker:
      collection: trollheim
      band_id: khemri-cursed-of-karak-zorn
      profile_id: troll-slayer
      special_rule_ids:
      - band--troll-slayer-special-skills-monster-slayer
      main_weapon_id: weapon.mace
    defender:
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 6
        wounds: 3
        initiative: 3
        attacks: 1
    rolls:
    - key: wound
      value: 4
    expect:
      result.target: 4
      result.success: true
  - id: armour-uses-effective-six
    roles:
    - active
    - consumer
    - boundary
    operation: armour
    attacker:
      collection: trollheim
      band_id: khemri-cursed-of-karak-zorn
      profile_id: troll-slayer
      special_rule_ids:
      - band--troll-slayer-special-skills-monster-slayer
      main_weapon_id: weapon.mace
    defender:
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 6
        wounds: 3
        initiative: 3
        attacks: 1
      armour_id: armour.gromril-armour
    expect:
      result.target: 7
      result.eligible: false
      result.roll: null
  - id: strength-seven-not-reduced
    roles:
    - boundary
    operation: armour
    attacker:
      collection: trollheim
      band_id: khemri-cursed-of-karak-zorn
      profile_id: troll-slayer
      special_rule_ids:
      - band--troll-slayer-special-skills-monster-slayer
      main_weapon_id: weapon.mace
      characteristics:
        weapon_skill: 4
        strength: 7
        toughness: 4
        wounds: 1
        initiative: 3
        attacks: 1
    defender:
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 6
        wounds: 3
        initiative: 3
        attacks: 1
      armour_id: armour.gromril-armour
    expect:
      result.target: 7
      result.eligible: false
  - id: without-skill-armour-uses-real-strength
    roles:
    - inactive
    - boundary
    operation: armour
    attacker:
      main_weapon_id: weapon.sword
    defender:
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 6
        wounds: 3
        initiative: 3
        attacks: 1
      armour_id: armour.gromril-armour
    rolls:
    - key: armour
      value: 4
    expect:
      result.target: 4
      result.saved: true
  mutations:
  - id: omit-effective-armour-strength
    path: attacker.global_effects.tags
