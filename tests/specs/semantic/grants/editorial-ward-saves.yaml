schema_version: 1
specifications:
- id: editorial-ward-barbary-monkey
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: local
  sources:
  - target: rule/mordheim/lustrian-reavers/barbary-monkey--nimble/trait.ward-save
    digest: 77569b583a36ea92a05cc213b0556d0be3e5d12e289ba097b99bc06fd4a22261
  interpretation: Barbary Monkey / Nimble grants 5+ against wounds, explicitly including magic. Only its
    combat save is verified here. A Plague Bearer's Daemonic Aura supplies an actual magical attacker
    for the magic control. High Strength does not reduce this special save.
  cases:
  - id: recipients
    roles:
    - grant
    - compiled
    operation: grant
    defender:
      collection: mordheim
      band_id: lustrian-reavers
      profile_id: barbary-monkey
    context:
      rule_id: barbary-monkey--nimble
    expect:
      result.recipients:
      - barbary-monkey
  - id: face-1
    roles:
    - active
    - consumer
    - boundary
    operation: special_save
    attacker:
      main_weapon_id: weapon.mace
    defender:
      collection: mordheim
      band_id: lustrian-reavers
      profile_id: barbary-monkey
    rolls:
    - key: special.ward
      value: 1
    expect:
      defender.global_effects.ward_save: 5
      defender.global_effects.ward_save_mundane_only: false
      result.saved: false
      result.regeneration_roll: null
  - id: face-2
    roles:
    - active
    - consumer
    - boundary
    operation: special_save
    attacker:
      main_weapon_id: weapon.mace
    defender:
      collection: mordheim
      band_id: lustrian-reavers
      profile_id: barbary-monkey
    rolls:
    - key: special.ward
      value: 2
    expect:
      defender.global_effects.ward_save: 5
      defender.global_effects.ward_save_mundane_only: false
      result.saved: false
      result.regeneration_roll: null
  - id: face-3
    roles:
    - active
    - consumer
    - boundary
    operation: special_save
    attacker:
      main_weapon_id: weapon.mace
    defender:
      collection: mordheim
      band_id: lustrian-reavers
      profile_id: barbary-monkey
    rolls:
    - key: special.ward
      value: 3
    expect:
      defender.global_effects.ward_save: 5
      defender.global_effects.ward_save_mundane_only: false
      result.saved: false
      result.regeneration_roll: null
  - id: face-4
    roles:
    - active
    - consumer
    - boundary
    operation: special_save
    attacker:
      main_weapon_id: weapon.mace
    defender:
      collection: mordheim
      band_id: lustrian-reavers
      profile_id: barbary-monkey
    rolls:
    - key: special.ward
      value: 4
    expect:
      defender.global_effects.ward_save: 5
      defender.global_effects.ward_save_mundane_only: false
      result.saved: false
      result.regeneration_roll: null
  - id: face-5
    roles:
    - active
    - consumer
    - boundary
    operation: special_save
    attacker:
      main_weapon_id: weapon.mace
    defender:
      collection: mordheim
      band_id: lustrian-reavers
      profile_id: barbary-monkey
    rolls:
    - key: special.ward
      value: 5
    expect:
      defender.global_effects.ward_save: 5
      defender.global_effects.ward_save_mundane_only: false
      result.saved: true
      result.regeneration_roll: null
  - id: face-6
    roles:
    - active
    - consumer
    - boundary
    operation: special_save
    attacker:
      main_weapon_id: weapon.mace
    defender:
      collection: mordheim
      band_id: lustrian-reavers
      profile_id: barbary-monkey
    rolls:
    - key: special.ward
      value: 6
    expect:
      defender.global_effects.ward_save: 5
      defender.global_effects.ward_save_mundane_only: false
      result.saved: true
      result.regeneration_roll: null
  - id: mundane-distribution
    roles:
    - boundary
    operation: special_save
    attacker:
      main_weapon_id: weapon.mace
    defender:
      collection: mordheim
      band_id: lustrian-reavers
      profile_id: barbary-monkey
    distribution:
      observable: result.saved
      max_rolls: 1
      expected:
        'true': 1/3
        'false': 2/3
  - id: high-strength
    roles:
    - boundary
    operation: special_save
    attacker:
      main_weapon_id: weapon.mace
      characteristics:
        weapon_skill: 3
        strength: 6
        toughness: 3
        wounds: 1
        initiative: 3
        attacks: 1
    defender:
      collection: mordheim
      band_id: lustrian-reavers
      profile_id: barbary-monkey
    rolls:
    - key: special.ward
      value: 5
    expect:
      result.saved: true
      result.source: ward
  - id: magic
    roles:
    - active
    - boundary
    operation: special_save
    attacker:
      collection: mordheim
      band_id: carnival-of-chaos
      profile_id: plague-bearers
    defender:
      collection: mordheim
      band_id: lustrian-reavers
      profile_id: barbary-monkey
    rolls:
    - key: special.ward
      value: 5
    expect:
      context.ward_blocked: false
      result.saved: true
      result.ward_roll: 5
    expect_contains:
      attacker.global_effects.tags:
      - attack.magical
  - id: no-grant-control
    roles:
    - inactive
    operation: special_save
    expect:
      result.saved: false
      result.ward_roll: null
  mutations:
  - id: remove-ward
    path: defender.global_effects.ward_save
    value: 7
    cases:
    - face-5
    - mundane-distribution
  - id: invert-magic-restriction
    path: defender.global_effects.ward_save_mundane_only
    value: true
    cases:
    - magic
- id: editorial-ward-silent-walker
