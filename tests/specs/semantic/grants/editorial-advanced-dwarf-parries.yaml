    expect: {result.attacks.0.parried: true, result.attacks.1.parried: true, result.defender.parries_remaining: 0}
  mutations:
  - id: drop-axe-condition
    path: defender.global_effects.tags
    value: [skill.unbeatable-warrior, skill.sword-master]
