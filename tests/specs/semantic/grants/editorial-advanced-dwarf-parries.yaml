schema_version: 1
specifications:
- id: advanced-dwarf-parries-rangers
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: stateful
  sources:
  - {target: rule/mordheim/dwarf-rangers/band--dwarf-special-skills-combat-master/skill.unbeatable-warrior, digest: 10e88ec31dd81f50cbb6afdcd2d2699db5ae463173566ae73fddbc31bdd9569a}
  - {target: mechanic/skill.unbeatable-warrior, digest: 0374290fafb395374dd29de447a1dc3720498acc7de14302aec58a105e5dd46c}
  interpretation: El Heroe puede igualar la tirada enemiga y, con dos armas Parry, dispone de dos paradas.
    Master of Blades repite las paradas fallidas solo con dos Dwarf Axes. Un seis natural sigue
    siendo imposible de parar en estas fuentes en ausencia de una excepcion expresa.
  cases:
  - id: recipients
    roles: [grant, compiled]
    operation: selectable_grant
    defender: {collection: mordheim, band_id: dwarf-rangers, profile_id: runesmith}
    context: {rule_id: band--dwarf-special-skills-combat-master}
    expect: {result.recipients: [apprentice-runesmith, dwarf-troll-slayers, runesmith]}
  - id: equality-parries
    roles: [active, consumer, boundary]
    operation: parry
    defender: {collection: mordheim, band_id: dwarf-rangers, profile_id: runesmith, special_rule_ids: [band--dwarf-special-skills-combat-master], main_weapon_id: weapon.sword}
    context: {hit_roll: 4}
    rolls: [{key: test.parry, value: 4}]
    expect: {result.blocked: true}
  - id: two-parry-capacity
    roles: [sequence, consumption, consumer]
    operation: initialize
    defender: {collection: mordheim, band_id: dwarf-rangers, profile_id: runesmith, special_rule_ids: [band--dwarf-special-skills-combat-master], main_weapon_id: weapon.sword, off_hand_id: weapon.sword}
    expect: {result.defender.parries_remaining: 2}
  - id: one-weapon-one-capacity
    roles: [boundary]
    operation: initialize
    defender: {collection: mordheim, band_id: dwarf-rangers, profile_id: runesmith, special_rule_ids: [band--dwarf-special-skills-combat-master], main_weapon_id: weapon.sword}
    expect: {result.defender.parries_remaining: 1}
  - id: natural-six-unparryable
    roles: [inactive, boundary]
    operation: parry
    defender: {collection: mordheim, band_id: dwarf-rangers, profile_id: runesmith, special_rule_ids: [band--dwarf-special-skills-combat-master], main_weapon_id: weapon.sword}
    context: {hit_roll: 6}
    expect: {result.attempted: false, result.blocked: false}
  - id: equality-all-faces
    roles: [active, consumer, boundary]
    operation: parry
    defender: {main_weapon_id: weapon.sword, skill_ids: [skill.unbeatable-warrior]}
    context: {hit_roll: 4}
    distribution: {observable: result.blocked, max_rolls: 2, expected: {'true': 1/2, 'false': 1/2}}
  - id: highest-two-hits-consume-both-parries
    roles: [sequence, consumption, boundary]
    operation: pool
    attacker: {main_weapon_id: weapon.mace}
    defender: {collection: mordheim, band_id: dwarf-rangers, profile_id: runesmith, special_rule_ids: [band--dwarf-special-skills-combat-master], main_weapon_id: weapon.sword, off_hand_id: weapon.sword}
    context: {count: 3}
    rolls:
    - {key: test.attack.0.hit, value: 4}
    - {key: test.attack.1.hit, value: 5}
    - {key: test.attack.2.hit, value: 4}
    - {key: test.attack.1.parry, value: 5}
    - {key: test.attack.0.parry, value: 4}
    - {key: test.attack.2.wound, value: 1}
    expect:
      result.defender.parries_remaining: 0
      result.attacks.0.parried: true
      result.attacks.1.parried: true
      result.attacks.2.parried: false
      result.attacks.2.wounded: false
  - id: no-weapon-does-not-grant-parry
    roles: [inactive]
    operation: parry
    defender: {main_weapon_id: weapon.mace, skill_ids: [skill.unbeatable-warrior]}
    context: {hit_roll: 4}
    expect: {result.attempted: false, result.blocked: false}
  mutations:
  - id: remove-advanced-parry
    path: defender.global_effects.tags
    value: []
    cases: [equality-parries, two-parry-capacity, equality-all-faces]
  - id: retain-two-parry-capacity
    runtime_fault: retain-parry-capacity
    cases: [highest-two-hits-consume-both-parries]
