    context: {hit_roll: 4}
    rolls: [{key: test.parry, value: 3}, {key: test.parry.reroll, value: 4}]
    expect: {result.blocked: true, result.rerolled: true}
  - id: sword-does-not-gain-dwarf-axe-reroll
    roles: [inactive, consumer, boundary]
    operation: parry
    defender: {collection: mordheim, band_id: dwarf-treasure-hunters, profile_id: dwarf-noble, special_rule_ids: [band--dwarf-special-skills-master-of-blades], main_weapon_id: weapon.sword}
