    defender: {collection: mordheim, band_id: dwarf-treasure-hunters, profile_id: dwarf-noble, special_rule_ids: [band--dwarf-special-skills-master-of-blades], main_weapon_id: weapon.dwarf-axe, off_hand_id: weapon.dwarf-axe}
    context: {hit_roll: 4}
