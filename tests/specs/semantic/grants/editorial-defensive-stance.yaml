schema_version: 1
specifications:
- id: editorial-defensive-stance-grant
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: permanent
  sources:
  - target: rule/trollheim/chaos-streets-deathbringers/band--deathbringer-special-skills-defensive-stance/skill.defensive-stance
    digest: 7c74646dfd4f054aa2007d9893ca2f9fa04bfae1d5fb69dde6a514f551a5c646
  depends_on:
  - mechanic/skill.defensive-stance
  interpretation: The selectable Deathbringer skill is available to the four hero profiles named by the
    source and not to Snipers or Knives. Selection grants the canonical parry capability even with the
    profile's bare claws.
  cases:
  - id: only-deathbringer-heroes
    roles:
    - grant
    - compiled
    operation: selectable_grant
    defender:
      collection: trollheim
      band_id: chaos-streets-deathbringers
      profile_id: shadow-blade
    context:
      rule_id: band--deathbringer-special-skills-defensive-stance
    expect:
      result.recipients:
      - black-knives
      - shadow-blade
      - silent-hunter
      - young-claw
  - id: granted-consumer
    roles:
    - active
    - boundary
    - consumer
    operation: parry
    attacker:
      main_weapon_id: weapon.mace
    defender:
      collection: trollheim
      band_id: chaos-streets-deathbringers
      profile_id: shadow-blade
      special_rule_ids:
      - band--deathbringer-special-skills-defensive-stance
    context:
      hit_roll: 4
    distribution:
      observable: result.blocked
      max_rolls: 1
      expected:
        'true': 1/3
        'false': 2/3
  mutations:
  - id: remove-granted-stance
    changes:
    - path: defender.global_effects.tags
      value: []
    - path: defender.global_effects.parry
      value: false
    cases:
    - granted-consumer
