schema_version: 1
specifications:
- id: night-goblin-fanatic-frantic
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: priority
  sources:
  - target: rule/mordheim/night-goblins-mic/fanatics--frantic/profile-rule.fanatics--frantic
    digest: b96fb51173b9dabf4597f29fad8c441ed3530b85f201986db54ecf4d86a2a976
  interpretation: Frantic grants the Fanatic an absolute priority that prevails over Initiative and ordinary
    weapon modifiers.
  cases:
  - id: compiled
    roles:
    - grant
    - compiled
    operation: compile
    attacker:
      band_id: night-goblins-mic
      profile_id: fanatics
    expect:
      attacker.global_effects.priority: 10
  - id: priority-consumed
    roles:
    - active
    - consumer
    - boundary
    operation: priority
    attacker:
      band_id: night-goblins-mic
      profile_id: fanatics
    defender:
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 2
        initiative: 10
        attacks: 1
    expect:
      result.priority: 10
  - id: ordinary-control
    roles:
    - inactive
    operation: priority
    expect:
      result.priority: 0
  mutations:
  - id: remove-frantic
    path: attacker.global_effects.priority
    value: 0
    cases:
    - priority-consumed
- id: biggest-boss-strength-access
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: construction
  sources:
  - target: rule/mordheim/night-goblins-web/boss--da-biggest-boss/profile.skill-access
    digest: 6b52fd6d67e45c321a0ea425e422069ff1b9e36f1a01317b8300e74b8cff367f
  interpretation: Only the current Boss adds Strength to its Combat access; other profiles receive no
    Strength through this rule.
  cases:
  - id: boss-access
    roles:
    - grant
    - accepted
    operation: general_skill_access
    attacker:
      band_id: night-goblins-web
      profile_id: boss
    expect:
      result.skills:
      - skill.expert-swordsman
      - skill.jump-up
      - skill.lightning-reflexes
      - skill.mighty-blow
      - skill.resilient
      - skill.step-aside
      - skill.strike-to-injure
      - skill.strongman
      - skill.unstoppable-charge
      - skill.web-of-steel
  - id: herder-control
    roles:
    - rejected
    operation: general_skill_access
    attacker:
      band_id: night-goblins-web
      profile_id: squig-herder
    expect:
      result.skills:
      - skill.expert-swordsman
      - skill.jump-up
      - skill.lightning-reflexes
      - skill.step-aside
      - skill.strike-to-injure
      - skill.web-of-steel
  mutations:
  - id: suppress-profile-access
    runtime_fault: suppress-profile-declared-strength-access
    cases:
    - boss-access
- id: night-goblin-promoted-hero-lists
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: construction
  sources:
  - target: rule/mordheim/night-goblins-web/band--promoted-henchmen-no-strength/compiler.promoted-hero-no-strength-access
    digest: 0c5f9366e257e364011b23fb4ef32cfe5ad4de43aaed120034644838a786e117
  interpretation: A promoted Henchman chooses up to two lists through skill-list.*, but Strength is rejected;
    Combat and Speed grant their exact skills.
  cases:
  - id: combat-and-speed
    roles:
    - grant
    - accepted
    operation: general_skill_access
    attacker:
      band_id: night-goblins-web
      profile_id: night-goblin-warriors
      variant_ids:
      - skill-list.combat
      - skill-list.speed
    expect:
      result.skills:
      - skill.expert-swordsman
      - skill.jump-up
      - skill.lightning-reflexes
      - skill.step-aside
      - skill.strike-to-injure
      - skill.web-of-steel
  - id: strength-rejected
    roles:
    - rejected
    operation: selection_choices
    attacker:
      band_id: night-goblins-web
      profile_id: night-goblin-warriors
    context:
      choices:
        ordinary: {}
        strength:
          variant_ids:
          - skill-list.strength
    expect:
      result.accepted:
      - ordinary
      result.rejected:
        strength: Strength skill list is forbidden for night-goblins-web/night-goblin-warriors
  - id: contract-present
    operation: construction_tag_presence
    attacker:
      band_id: night-goblins-web
      profile_id: night-goblin-warriors
    context:
      tag: compiler.promoted-hero-no-strength-access
    expect:
      result.present: true
  mutations:
  - id: remove-promotion-contract
    path: attacker.construction_tags
    value: []
    cases:
    - contract-present
- id: promoted-ogre-combat-strength-access
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: construction
  sources:
  - target: rule/mordheim/ostlanders/ogre--skills/compiler.promoted-hero-skill-access
    digest: 6fa02bb75c117ac86b27c30ec288d039fdae8818ce6ea9c7c5802529a46bd185
  - target: rule/mordheim/pit-fighters/ogre-pit-fighter--skills/compiler.promoted-hero-skill-access
    digest: c3fc813487818e859b90eeadf67df4686df16346fbffc5af4d9417b9b4277fc0
  - target: rule/trollheim/chaos-streets-pit-fighters/ogre-pit-fighter--skills/compiler.promoted-hero-skill-access
    digest: 5e9fb552b55b1cfd27612002860f8237e9bc11f4c5a1c9191f8470a221157985
  interpretation: The three promoted Ogres access Combat and Strength; the Pit Fighters additionally keep
    their editorial Special list.
  cases:
  - id: ostlander-access
    roles:
    - grant
    - accepted
    operation: general_skill_access
    attacker:
      band_id: ostlanders
      profile_id: ogre
    expect:
      result.skills: &id001
      - skill.expert-swordsman
      - skill.mighty-blow
      - skill.resilient
      - skill.step-aside
      - skill.strike-to-injure
      - skill.strongman
      - skill.unstoppable-charge
      - skill.web-of-steel
  - id: pit-access
    roles:
    - grant
    - accepted
    operation: general_skill_access
    attacker:
      band_id: pit-fighters
      profile_id: ogre-pit-fighter
    expect:
      result.skills: *id001
  - id: streets-access
    roles:
    - grant
    - accepted
    operation: general_skill_access
    attacker:
      collection: trollheim
      band_id: chaos-streets-pit-fighters
      profile_id: ogre-pit-fighter
    expect:
      result.skills: *id001
  - id: speed-rejected
    roles:
    - rejected
    operation: compile
    attacker:
      band_id: ostlanders
      profile_id: ogre
      skill_ids:
      - skill.acrobat
    reject: skills are not available
  - id: contract-present
    operation: construction_tag_presence
    attacker:
      band_id: ostlanders
      profile_id: ogre
    context:
      tag: compiler.promoted-hero-skill-access
    expect:
      result.present: true
  mutations:
  - id: remove-ogre-access-contract
    path: attacker.construction_tags
    value: []
    cases:
    - contract-present
