schema_version: 1
specifications:
- id: mordheim-fimir-warriors-scaly-skin
  scope_digest: ea4090654a79e79bb19b0855371a062c6a9a10c1ab40f7d8abdb42634a425b97
  category: local
  sources:
  - target: rule/mordheim/lords-of-the-marsh-mim/band--scaly-skin/compiler.lizardmen-scaly-skin
    digest: 4469e090939fa2ae9d901e5b88a64c402d9de590d6436ea4f4df28421e7f57bf
  interpretation: >-
    Lords of the Marsh / Scaly Skin is one printed sentence for the whole band: "Fimir have a 6+
    armour save that cannot be modified beyond 6 by Strength; a 'no save' result on the Critical Hit
    Charts negates it. Light armour adds +1. Fimir Warriors have a 5+ armour save." The band-wide
    clause keeps the shared 6+ default, the 6+ Strength floor and the Hardened-Leather-style
    stacking behaviour; the named profile clause prints 5+ for Fimir Warriors alone. Young Nobles
    keep 6+. The printed "no save" result is represented by an attack that ignores armour.
  cases:
  - id: recipients
    roles:
    - grant
    operation: grant
    defender:
      collection: mordheim
      band_id: lords-of-the-marsh-mim
      profile_id: fimir-warriors
    context:
      rule_id: band--scaly-skin
    expect:
      result.recipients:
      - daemon-fimm
      - draich
      - fimir-warriors
      - shearls
      - young-nobles
  - id: compiled-warriors
    roles:
    - compiled
    operation: compile
    defender:
      band_id: lords-of-the-marsh-mim
      profile_id: fimir-warriors
    expect:
      defender.natural_armour_save: 5
      defender.natural_armour_worst_save: 6
      defender.construction_tags:
      - compiler.lizardmen-scaly-skin
  - id: compiled-young-nobles-control
    roles:
    - compiled
    operation: compile
    defender:
      band_id: lords-of-the-marsh-mim
      profile_id: young-nobles
    expect:
      defender.natural_armour_save: 6
      defender.natural_armour_worst_save: 6
  - id: warriors-save-holds
    roles:
    - active
    - consumer
    - boundary
    operation: armour
    attacker:
      main_weapon_id: weapon.mace
    defender:
      band_id: lords-of-the-marsh-mim
      profile_id: fimir-warriors
    rolls:
    - key: armour
      value: 5
    expect:
      context.natural_armour_save: 5
      result.target: 5
      result.saved: true
  - id: warriors-save-fails
    roles:
    - boundary
    operation: armour
    attacker:
      main_weapon_id: weapon.mace
    defender:
      band_id: lords-of-the-marsh-mim
      profile_id: fimir-warriors
    rolls:
    - key: armour
      value: 4
    expect:
      result.target: 5
      result.saved: false
  - id: strength-floor
    roles:
    - active
    - boundary
    operation: armour
    attacker:
      main_weapon_id: weapon.mace
      characteristics:
        weapon_skill: 3
        strength: 6
        toughness: 3
        wounds: 3
        initiative: 3
        attacks: 1
    defender:
      band_id: lords-of-the-marsh-mim
      profile_id: fimir-warriors
    rolls:
    - key: armour
      value: 6
    expect:
      context.natural_armour_worst_save: 6
      result.target: 6
      result.saved: true
  - id: light-armour-adds-one
    roles:
    - active
    - boundary
    operation: armour
    attacker:
      main_weapon_id: weapon.mace
    defender:
      band_id: lords-of-the-marsh-mim
      profile_id: fimir-warriors
      armour_id: armour.light-armour
    rolls:
    - key: armour
      value: 4
    expect:
      context.natural_armour_save: 5
      result.target: 4
      result.saved: true
  - id: critical-no-save-denies-the-save
    roles:
    - inactive
    - boundary
    operation: armour
    attacker:
      main_weapon_id: weapon.vomit-attack
    defender:
      band_id: lords-of-the-marsh-mim
      profile_id: fimir-warriors
    expect:
      result.eligible: false
      result.saved: false
  mutations:
  - id: restore-shared-six-plus
    path: defender.natural_armour_save
    value: 6
    cases:
    - warriors-save-holds
    - light-armour-adds-one
  - id: remove-band-strength-floor
    path: defender.natural_armour_worst_save
    value: 7
    cases:
    - strength-floor
  - id: remove-scaly-skin
    changes:
    - path: defender.armour_save
      value: 7
    - path: defender.natural_armour_save
      value: 7
    - path: defender.natural_armour_worst_save
      value: 7
    cases:
    - warriors-save-fails
