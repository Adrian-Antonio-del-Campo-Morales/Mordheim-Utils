  interpretation: Each of the six profile rules grants the Pit Fighter trait to the named profile. This
    obligation verifies the editorial grant; the trait's effects in terrain contexts are not invented
    inside the isolated duel.
  cases:
  - id: pit-king
    roles:
    - grant
    - accepted
    operation: trait_presence
    attacker:
      band_id: pit-fighters
      profile_id: pit-king
    context:
      tag: pit_fighter
    expect:
      result.present: true
  - id: slayer
    roles:
    - grant
    - accepted
    operation: trait_presence
    attacker:
      band_id: pit-fighters
      profile_id: dwarf-troll-slayer
    context:
      tag: pit_fighter
    expect:
      result.present: true
  - id: veterans
