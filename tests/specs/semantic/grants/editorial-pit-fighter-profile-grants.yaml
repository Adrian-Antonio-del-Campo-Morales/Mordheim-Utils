  - {id: pursuers, roles: [grant, accepted], operation: trait_presence, attacker: {band_id: pit-fighters, profile_id: pursuers}, context: {tag: pit_fighter}, expect: {result.present: true}}
  - {id: ogre, roles: [grant, accepted], operation: trait_presence, attacker: {band_id: pit-fighters, profile_id: ogre-pit-fighter}, context: {tag: pit_fighter}, expect: {result.present: true}}
