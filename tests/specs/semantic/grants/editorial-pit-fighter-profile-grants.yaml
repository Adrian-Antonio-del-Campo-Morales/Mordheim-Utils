    - accepted
    operation: trait_presence
    attacker:
      band_id: pit-fighters
      profile_id: pit-veterans
    context:
      tag: pit_fighter
    expect:
      result.present: true
  - id: fighters
    roles:
    - grant
    - accepted
    operation: trait_presence
    attacker:
      band_id: pit-fighters
      profile_id: pit-fighters
    context:
      tag: pit_fighter
    expect:
      result.present: true
  - id: pursuers
    roles:
    - grant
    - accepted
    operation: trait_presence
    attacker:
