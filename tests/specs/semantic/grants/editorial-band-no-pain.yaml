schema_version: 1
specifications:
- id: editorial-band-no-pain-tomb-guardians
  scope_digest: ea4090654a79e79bb19b0855371a062c6a9a10c1ab40f7d8abdb42634a425b97
  category: local
  sources:
  - target: rule/mordheim/tomb-guardians/band--no-pain/skill.ignore-pain
    digest: 6b4837c58f3ade615dd1784fba4ef34dde05915260698f6500234ff45f6c2045
  depends_on:
  - mechanic/skill.ignore-pain
  interpretation: Only profiles explicitly described as Undead receive this band rule. Stunned becomes
    Knocked Down; Knocked Down and Out of Action are unchanged. Merely being in the band or magically
    animated is not sufficient.
  cases:
  - id: exact-recipients
    roles:
    - grant
    - compiled
    operation: grant
    defender:
      collection: mordheim
      band_id: tomb-guardians
      profile_id: skeleton-warriors
    context:
      rule_id: band--no-pain
    expect:
      result.recipients:
      - acolytes
      - liche-priest
      - skeleton-warriors
      - tomb-guardians
      - tomb-lord
  - id: granted-acolytes
    roles:
    - active
    - consumer
    operation: injury
    defender:
      collection: mordheim
      band_id: tomb-guardians
      profile_id: acolytes
    rolls:
    - key: test.injury
      value: 3
    expect:
      result.condition: KNOCKED_DOWN
    expect_contains:
      defender.global_effects.tags:
      - skill.ignore-pain
  - id: granted-liche-priest
    roles:
    - active
    - consumer
    operation: injury
    defender:
      collection: mordheim
      band_id: tomb-guardians
      profile_id: liche-priest
    rolls:
    - key: test.injury
      value: 3
    expect:
      result.condition: KNOCKED_DOWN
    expect_contains:
      defender.global_effects.tags:
      - skill.ignore-pain
  - id: granted-skeleton-warriors
    roles:
    - active
    - consumer
    operation: injury
    defender:
      collection: mordheim
      band_id: tomb-guardians
      profile_id: skeleton-warriors
    rolls:
    - key: test.injury
      value: 3
    expect:
      result.condition: KNOCKED_DOWN
    expect_contains:
      defender.global_effects.tags:
      - skill.ignore-pain
  - id: granted-tomb-guardians
    roles:
    - active
    - consumer
    operation: injury
    defender:
      collection: mordheim
      band_id: tomb-guardians
      profile_id: tomb-guardians
    rolls:
    - key: test.injury
      value: 3
    expect:
      result.condition: KNOCKED_DOWN
    expect_contains:
      defender.global_effects.tags:
      - skill.ignore-pain
  - id: granted-tomb-lord
    roles:
    - active
    - consumer
    operation: injury
    defender:
      collection: mordheim
      band_id: tomb-guardians
      profile_id: tomb-lord
    rolls:
    - key: test.injury
      value: 3
    expect:
      result.condition: KNOCKED_DOWN
    expect_contains:
      defender.global_effects.tags:
      - skill.ignore-pain
  - id: excluded-tomb-scorpions
    roles:
    - inactive
    operation: injury
    defender:
      collection: mordheim
      band_id: tomb-guardians
      profile_id: tomb-scorpions
    rolls:
    - key: test.injury
      value: 3
    expect:
      result.condition: STUNNED
  - id: complete-table
    roles:
    - boundary
    operation: injury
    defender:
      collection: mordheim
      band_id: tomb-guardians
      profile_id: skeleton-warriors
    distribution:
      observable: result.condition
      max_rolls: 1
      expected:
        KNOCKED_DOWN: 2/3
        OUT: 1/3
  mutations:
  - id: remove-no-pain
    path: defender.global_effects.tags
    value: []
    cases:
    - granted-skeleton-warriors
    - complete-table
