schema_version: 1
specifications:
- id: saurus-bite-attacks-mordheim-and-lustria
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: local
  sources:
  - target: rule/mordheim/lizardmen/band--bite-attack/compiler.bite-attack
    digest: ea55bc03aef6bf308f1194ad136054a47b5b6bd3a70af87405f58a2431d22d45
  - target: rule/trollheim/lustria-lizardmen/saurus-totem-warrior--bite-attack/compiler.bite-attack
    digest: 62bea54829254e72a5002d1515d7a4b2c6cb3a95d55d4e034991660b030e7de9
  - target: rule/trollheim/lustria-lizardmen/saurus-braves--bite-attack/compiler.bite-attack
    digest: 36446632799e6438338b72b9c56f9e5e83ac17f154a98dc9414a8a96a46609eb
  interpretation: All Mordheim Saurus, plus the Lustria Saurus Totem Warrior and Saurus Braves profiles,
    receive a separate bite attack. It uses the warrior's Strength, not its weapon, suffers no unarmed
    penalty and resolves as an extra attack; a neighbouring Skink does not receive it.
  cases:
  - id: mordheim-recipients
    roles:
    - grant
    operation: grant
    defender:
      band_id: lizardmen
      profile_id: saurus-totem-warrior
    context:
      rule_id: band--bite-attack
    expect:
      result.recipients:
      - saurus-braves
      - saurus-totem-warrior
  - id: mordheim-bite
    roles:
    - compiled
    - active
    - consumer
    - boundary
    operation: extra_attack
    attacker:
      band_id: lizardmen
      profile_id: saurus-totem-warrior
    defender:
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 4
        wounds: 2
        initiative: 3
        attacks: 1
    rolls:
    - key: test.hit
      value: 4
    - key: test.wound
      value: 4
    expect:
      result.wounded: true
      result.defender.wounds: 1
    expect_contains:
      attacker.extra_attacks.0.tags:
      - rule.bite-attack
      - weapon.natural-attacks
  - id: lustria-totem-recipient
    roles:
    - grant
    operation: grant
    defender:
      collection: trollheim
      band_id: lustria-lizardmen
      profile_id: saurus-totem-warrior
    context:
      rule_id: saurus-totem-warrior--bite-attack
    expect:
      result.recipients:
      - saurus-totem-warrior
  - id: lustria-brave-recipient
    roles:
    - grant
    operation: grant
    defender:
      collection: trollheim
      band_id: lustria-lizardmen
      profile_id: saurus-braves
    context:
      rule_id: saurus-braves--bite-attack
    expect:
      result.recipients:
      - saurus-braves
  - id: lustria-bite
    roles:
    - active
    - consumer
    - boundary
    operation: extra_attack
    attacker:
      collection: trollheim
      band_id: lustria-lizardmen
      profile_id: saurus-totem-warrior
    defender:
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 4
        wounds: 2
        initiative: 3
        attacks: 1
    rolls:
    - key: test.hit
      value: 4
    - key: test.wound
      value: 4
    expect:
      result.wounded: true
      result.defender.wounds: 1
  - id: skink-control
    roles:
    - inactive
    operation: attacks
    attacker:
      band_id: lizardmen
      profile_id: skink-braves
    expect:
      result.attacks: 1
  mutations:
  - id: weaken-bite
    path: attacker.extra_attacks.0.strength_bonus
    value: -1
    cases:
    - mordheim-bite
    - lustria-bite
