schema_version: 1
specifications:
- id: saurus-bite-attacks-mordheim-and-lustria
  scope_digest: ea4090654a79e79bb19b0855371a062c6a9a10c1ab40f7d8abdb42634a425b97
  category: local
  sources:
  - target: rule/mordheim/lizardmen/band--bite-attack/compiler.bite-attack
    digest: 961c95cc0ed78b440b365c1e7e4ab1dd8e450fbc2ee410f8016078a9c3d603f6
  - target: rule/trollheim/lustria-lizardmen/saurus-totem-warrior--bite-attack/compiler.bite-attack
    digest: c16a28fb31377edf576a0872bd08a5fdf6d43298b0322f933b0924ec0981767a
  - target: rule/trollheim/lustria-lizardmen/saurus-braves--bite-attack/compiler.bite-attack
    digest: 4dcbcd042352c49e6abfc7a1506882201cb11d77da977acd1a91f50247e93e2d
  interpretation: All Mordheim Saurus, plus the Lustria Saurus Totem Warrior and Saurus Braves profiles,
    receive a separate bite attack. It uses the warrior's Strength, not its weapon, suffers no unarmed
    penalty and resolves as an extra attack; a neighbouring Skink does not receive it.
  cases:
  - id: mordheim-recipients
    roles:
    - grant
    operation: grant
    defender:
      band_id: lizardmen
      profile_id: saurus-totem-warrior
    context:
      rule_id: band--bite-attack
    expect:
      result.recipients:
      - saurus-braves
      - saurus-totem-warrior
  - id: mordheim-bite
    roles:
    - compiled
    - active
    - consumer
    - boundary
    operation: extra_attack
    attacker:
      band_id: lizardmen
      profile_id: saurus-totem-warrior
    defender:
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 4
        wounds: 2
        initiative: 3
        attacks: 1
    rolls:
    - key: test.hit
      value: 4
    - key: test.wound
      value: 4
    expect:
      result.wounded: true
      result.defender.wounds: 1
    expect_contains:
      attacker.extra_attacks.0.tags:
      - rule.bite-attack
      - weapon.natural-attacks
  - id: lustria-totem-recipient
    roles:
    - grant
    operation: grant
    defender:
      collection: trollheim
      band_id: lustria-lizardmen
      profile_id: saurus-totem-warrior
    context:
      rule_id: saurus-totem-warrior--bite-attack
    expect:
      result.recipients:
      - saurus-totem-warrior
  - id: lustria-brave-recipient
    roles:
    - grant
    operation: grant
    defender:
      collection: trollheim
      band_id: lustria-lizardmen
      profile_id: saurus-braves
    context:
      rule_id: saurus-braves--bite-attack
    expect:
      result.recipients:
      - saurus-braves
  - id: lustria-bite
    roles:
    - active
    - consumer
    - boundary
    operation: extra_attack
    attacker:
      collection: trollheim
      band_id: lustria-lizardmen
      profile_id: saurus-totem-warrior
    defender:
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 4
        wounds: 2
        initiative: 3
        attacks: 1
    rolls:
    - key: test.hit
      value: 4
    - key: test.wound
      value: 4
    expect:
      result.wounded: true
      result.defender.wounds: 1
  - id: skink-control
    roles:
    - inactive
    operation: attacks
    attacker:
      band_id: lizardmen
      profile_id: skink-braves
    expect:
      result.attacks: 1
  mutations:
  - id: weaken-bite
    path: attacker.extra_attacks.0.strength_bonus
    value: -1
    cases:
    - mordheim-bite
    - lustria-bite
