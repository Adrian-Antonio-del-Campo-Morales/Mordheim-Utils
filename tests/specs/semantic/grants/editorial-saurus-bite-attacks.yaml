schema_version: 1
specifications:
- id: saurus-bite-attacks-mordheim-and-lustria
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: local
  sources:
  - target: rule/mordheim/lizardmen/band--bite-attack/compiler.bite-attack
    digest: e1b5b1e1e49d1972ab52407f30449d43224dba068602448470eb132e4811b1df
  - target: rule/trollheim/lustria-lizardmen/saurus-totem-warrior--bite-attack/compiler.bite-attack
    digest: fcfcc1d2bcf4706feca5574d746479316cb2c418656b8842df408edca7ec4351
  - target: rule/trollheim/lustria-lizardmen/saurus-braves--bite-attack/compiler.bite-attack
    digest: 1ed8f8badbd4283592f7ff91b351978c34b42e53a3fdd6f4cd632c1646418608
  interpretation: All Mordheim Saurus, plus the Lustria Saurus Totem Warrior and Saurus Braves profiles,
    receive a separate bite attack. It uses the warrior's Strength, not its weapon, suffers no unarmed
    penalty and resolves as an extra attack; a neighbouring Skink does not receive it.
  cases:
  - id: mordheim-recipients
    roles:
    - grant
    operation: grant
    defender:
      band_id: lizardmen
      profile_id: saurus-totem-warrior
    context:
      rule_id: band--bite-attack
    expect:
      result.recipients:
      - saurus-braves
      - saurus-totem-warrior
  - id: mordheim-bite
    roles:
    - compiled
    - active
    - consumer
    - boundary
    operation: extra_attack
    attacker:
      band_id: lizardmen
      profile_id: saurus-totem-warrior
    defender:
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 4
        wounds: 2
        initiative: 3
        attacks: 1
    rolls:
    - key: test.hit
      value: 4
    - key: test.wound
      value: 4
    expect:
      result.wounded: true
      result.defender.wounds: 1
    expect_contains:
      attacker.extra_attacks.0.tags:
      - rule.bite-attack
      - weapon.natural-attacks
  - id: lustria-totem-recipient
    roles:
    - grant
    operation: grant
    defender:
      collection: trollheim
      band_id: lustria-lizardmen
      profile_id: saurus-totem-warrior
    context:
      rule_id: saurus-totem-warrior--bite-attack
    expect:
      result.recipients:
      - saurus-totem-warrior
  - id: lustria-brave-recipient
    roles:
    - grant
    operation: grant
    defender:
      collection: trollheim
      band_id: lustria-lizardmen
      profile_id: saurus-braves
    context:
      rule_id: saurus-braves--bite-attack
    expect:
      result.recipients:
      - saurus-braves
  - id: lustria-bite
    roles:
    - active
    - consumer
    - boundary
    operation: extra_attack
    attacker:
      collection: trollheim
      band_id: lustria-lizardmen
      profile_id: saurus-totem-warrior
    defender:
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 4
        wounds: 2
        initiative: 3
        attacks: 1
    rolls:
    - key: test.hit
      value: 4
    - key: test.wound
      value: 4
    expect:
      result.wounded: true
      result.defender.wounds: 1
  - id: skink-control
    roles:
    - inactive
    operation: attacks
    attacker:
      band_id: lizardmen
      profile_id: skink-braves
    expect:
      result.attacks: 1
  mutations:
  - id: weaken-bite
    path: attacker.extra_attacks.0.strength_bonus
    value: -1
    cases:
    - mordheim-bite
    - lustria-bite
