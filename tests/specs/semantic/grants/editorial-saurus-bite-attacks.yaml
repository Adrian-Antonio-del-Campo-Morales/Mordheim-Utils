schema_version: 1
specifications:
- id: saurus-bite-attacks-mordheim-and-lustria
  scope_digest: 5fd7034eceb69daeeac4b0ad8bba9f2bc5ba50ca65a102d49b69e25f85d18dc9
  category: local
  sources:
  - target: rule/mordheim/lizardmen/band--bite-attack/compiler.bite-attack
    digest: afdd525b046de6cd3bc91c17d25dedf31447dd5c1248af84585f4a4f5e1e3aee
  - target: rule/trollheim/lustria-lizardmen/saurus-totem-warrior--bite-attack/compiler.bite-attack
    digest: ef58921aee81be7dae5d8fd40d5241a49f0e0dbd4d4586df8eb610757759eae1
  - target: rule/trollheim/lustria-lizardmen/saurus-braves--bite-attack/compiler.bite-attack
    digest: 14b6da13d0e3137745494ad43c22e237ef8673255c1369de474bc9b9eda35635
  interpretation: All Mordheim Saurus, plus the Lustria Saurus Totem Warrior and Saurus Braves profiles,
    receive a separate bite attack. It uses the warrior's Strength, not its weapon, suffers no unarmed
    penalty and resolves as an extra attack; a neighbouring Skink does not receive it.
  cases:
  - id: mordheim-recipients
    roles:
    - grant
    operation: grant
    defender:
      band_id: lizardmen
      profile_id: saurus-totem-warrior
    context:
      rule_id: band--bite-attack
    expect:
      result.recipients:
      - saurus-braves
      - saurus-totem-warrior
  - id: mordheim-bite
    roles:
    - compiled
    - active
    - consumer
    - boundary
    operation: extra_attack
    attacker:
      band_id: lizardmen
      profile_id: saurus-totem-warrior
    defender:
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 4
        wounds: 2
        initiative: 3
        attacks: 1
    rolls:
    - key: test.hit
      value: 4
    - key: test.wound
      value: 4
    expect:
      result.wounded: true
      result.defender.wounds: 1
    expect_contains:
      attacker.extra_attacks.0.tags:
      - rule.bite-attack
      - weapon.natural-attacks
  - id: lustria-totem-recipient
    roles:
    - grant
    operation: grant
    defender:
      collection: trollheim
      band_id: lustria-lizardmen
      profile_id: saurus-totem-warrior
    context:
      rule_id: saurus-totem-warrior--bite-attack
    expect:
      result.recipients:
      - saurus-totem-warrior
  - id: lustria-brave-recipient
    roles:
    - grant
    operation: grant
    defender:
      collection: trollheim
      band_id: lustria-lizardmen
      profile_id: saurus-braves
    context:
      rule_id: saurus-braves--bite-attack
    expect:
      result.recipients:
      - saurus-braves
  - id: lustria-bite
    roles:
    - active
    - consumer
    - boundary
    operation: extra_attack
    attacker:
      collection: trollheim
      band_id: lustria-lizardmen
      profile_id: saurus-totem-warrior
    defender:
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 4
        wounds: 2
        initiative: 3
        attacks: 1
    rolls:
    - key: test.hit
      value: 4
    - key: test.wound
      value: 4
    expect:
      result.wounded: true
      result.defender.wounds: 1
  - id: skink-control
    roles:
    - inactive
    operation: attacks
    attacker:
      band_id: lizardmen
      profile_id: skink-braves
    expect:
      result.attacks: 1
  mutations:
  - id: weaken-bite
    path: attacker.extra_attacks.0.strength_bonus
    value: -1
    cases:
    - mordheim-bite
    - lustria-bite
