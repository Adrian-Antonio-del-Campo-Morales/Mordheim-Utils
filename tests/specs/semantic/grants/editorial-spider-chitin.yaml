schema_version: 1
specifications:
- id: editorial-gigantic-spider-chitin-armour
  scope_digest: 5fd7034eceb69daeeac4b0ad8bba9f2bc5ba50ca65a102d49b69e25f85d18dc9
  category: local
  sources:
  - target: rule/mordheim/forest-goblins/gigantic-spider--chitin-armour/trait.natural-armour-save
    digest: 8057210bd3d81488dc8d35b4fed2d2690a1937ec544e2dd07b907f330035dfc2
  ruling: Spider Chitin Armour is an intrinsic rule of the Gigantic Spider that grants natural armour
    of 4+, not selectable equipment.
  interpretation: The profile's automatic grant compiles natural_armour_save=4 and the armour resolver
    consumes that save.
  cases:
  - id: profile-grant
    roles:
    - grant
    - compiled
    operation: grant
    defender:
      band_id: forest-goblins
      profile_id: gigantic-spider
    context:
      rule_id: gigantic-spider--chitin-armour
    expect:
      result.recipients:
      - gigantic-spider
  - id: natural-four-plus
    roles:
    - active
    - consumer
    - boundary
    operation: armour
    attacker:
      main_weapon_id: weapon.mace
    defender:
      band_id: forest-goblins
      profile_id: gigantic-spider
    distribution:
      observable: result.saved
      max_rolls: 1
      expected:
        'true': 1/2
        'false': 1/2
  - id: ordinary-fighter-control
    roles:
    - inactive
    operation: armour
    attacker:
      main_weapon_id: weapon.mace
    defender: {}
    expect:
      result.eligible: false
  mutations:
  - id: remove-chitin-save
    path: defender.natural_armour_save
    value: 7
    cases:
    - natural-four-plus
