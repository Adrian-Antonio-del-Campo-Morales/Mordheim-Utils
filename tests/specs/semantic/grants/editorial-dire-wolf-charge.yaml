schema_version: 1
specifications:
- id: editorial-dire-wolf-charge-undead
  scope_digest: ea4090654a79e79bb19b0855371a062c6a9a10c1ab40f7d8abdb42634a425b97
  category: contextual
  sources:
  - target: rule/mordheim/undead/dire-wolves--charge/trait.charge-attack-bonus
    digest: d85cbc3201946dc5b9824be60039676ced8ce59b57cf2ca00b067816ce858dc3
  interpretation: Dire Wolves / Charge grants two attacks instead of the printed one on the turn the wolf
    charges. Being charged does not qualify. The source conditions this on charging, not on a global round
    number. The profile uses natural attacks with no additional off-hand attack; no dice or optional decision
    is required.
  cases:
  - id: exact-recipients
    roles:
    - grant
    - compiled
    operation: grant
    defender:
      collection: mordheim
      band_id: undead
      profile_id: dire-wolves
    context:
      rule_id: dire-wolves--charge
    expect:
      result.recipients:
      - dire-wolves
  - id: first-false-charging-false
    roles:
    - inactive
    - consumer
    - boundary
    - compiled
    operation: attacks
    attacker:
      collection: mordheim
      band_id: undead
      profile_id: dire-wolves
    context:
      first_round: false
      charging: false
    expect:
      attacker.characteristics.attacks: 1
      attacker.global_effects.charge_attacks_bonus: 1
      result.attacks: 1
  - id: first-false-charging-true
    roles:
    - active
    - consumer
    - boundary
    - compiled
    operation: attacks
    attacker:
      collection: mordheim
      band_id: undead
      profile_id: dire-wolves
    context:
      first_round: false
      charging: true
    expect:
      attacker.characteristics.attacks: 1
      attacker.global_effects.charge_attacks_bonus: 1
      result.attacks: 2
  - id: first-true-charging-false
    roles:
    - inactive
    - consumer
    - boundary
    - compiled
    operation: attacks
    attacker:
      collection: mordheim
      band_id: undead
      profile_id: dire-wolves
    context:
      first_round: true
      charging: false
    expect:
      attacker.characteristics.attacks: 1
      attacker.global_effects.charge_attacks_bonus: 1
      result.attacks: 1
  - id: first-true-charging-true
    roles:
    - active
    - consumer
    - boundary
    - compiled
    operation: attacks
    attacker:
      collection: mordheim
      band_id: undead
      profile_id: dire-wolves
    context:
      first_round: true
      charging: true
    expect:
      attacker.characteristics.attacks: 1
      attacker.global_effects.charge_attacks_bonus: 1
      result.attacks: 2
  - id: receiving-charge
    roles:
    - inactive
    - boundary
    operation: attacks
    attacker:
      collection: mordheim
      band_id: undead
      profile_id: dire-wolves
    context:
      first_round: true
      charged: true
      charging: false
    expect:
      result.attacks: 1
  - id: allocate-charge-attacks
    roles:
    - active
    - consumer
    operation: allocate
    attacker:
      collection: mordheim
      band_id: undead
      profile_id: dire-wolves
    context:
      first_round: true
      charging: true
    expect:
      result.count: 2
    expect_contains:
      result.weapons.0.tags:
      - weapon.natural-attacks
      result.weapons.1.tags:
      - weapon.natural-attacks
  - id: unrelated-fighter-charge
    roles:
    - inactive
    operation: attacks
    attacker:
      main_weapon_id: weapon.mace
    context:
      first_round: true
      charging: true
    expect:
      result.attacks: 1
      attacker.global_effects.charge_attacks_bonus: 0
  mutations:
  - id: remove-charge-bonus
    path: attacker.global_effects.charge_attacks_bonus
    value: 0
    cases:
    - first-true-charging-true
    - allocate-charge-attacks
  - id: make-bonus-permanent
    changes:
    - path: attacker.global_effects.charge_attacks_bonus
      value: 0
    - path: attacker.global_effects.attacks_bonus
      value: 1
    cases:
    - first-false-charging-false
    - receiving-charge
