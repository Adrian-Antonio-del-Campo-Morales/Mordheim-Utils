schema_version: 1
specifications:
- id: editorial-hard-head-dwarf-rangers
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: local
  sources:
  - target: rule/mordheim/dwarf-rangers/band--hard-head/trait.concussion-immune
    digest: 23a242596a7eacb7de76f6982f10b68d7db52a52b5bab8d0cc03fe5c93cd28eb
  depends_on: [mechanic/weapon.mace, mechanic/skill.hard-to-kill]
  interpretation: Special Rules / Hard Head cancels the easier stunning caused by maces and clubs.
    All current profiles in this band are Dwarfs. With their Hard to Kill rule the Injury table
    remains 1-2 Knocked Down, 3-5 Stunned, 6 Out even against Concussion. This is not immunity
    to Stunned, nor does it change an ordinary sword attack.
  cases:
  - id: exact-recipients
    roles: [grant, compiled]
    operation: grant
    defender: {collection: mordheim, band_id: dwarf-rangers, profile_id: beardlings}
    context: {rule_id: band--hard-head}
    expect: {result.recipients: [apprentice-runesmith, beardlings, dwarf-clansmen, dwarf-crossbowmen, dwarf-longbeards, dwarf-troll-slayers, runesmith]}
  - id: granted-apprentice-runesmith
    roles: [active, consumer, compiled]
    operation: injury
    attacker: {main_weapon_id: weapon.mace}
    defender: {collection: mordheim, band_id: dwarf-rangers, profile_id: apprentice-runesmith}
    rolls: [{key: test.injury, value: 2}]
    expect: {result.condition: KNOCKED_DOWN, context.concussion: true, context.concussion_immune: true}
    expect_contains:
      defender.global_effects.tags: [concussion_immune]
  - id: granted-beardlings
    roles: [active, consumer, compiled]
    operation: injury
    attacker: {main_weapon_id: weapon.mace}
    defender: {collection: mordheim, band_id: dwarf-rangers, profile_id: beardlings}
    rolls: [{key: test.injury, value: 2}]
    expect: {result.condition: KNOCKED_DOWN, context.concussion: true, context.concussion_immune: true}
    expect_contains:
      defender.global_effects.tags: [concussion_immune]
  - id: granted-dwarf-clansmen
    roles: [active, consumer, compiled]
    operation: injury
    attacker: {main_weapon_id: weapon.mace}
    defender: {collection: mordheim, band_id: dwarf-rangers, profile_id: dwarf-clansmen}
    rolls: [{key: test.injury, value: 2}]
    expect: {result.condition: KNOCKED_DOWN, context.concussion: true, context.concussion_immune: true}
    expect_contains:
      defender.global_effects.tags: [concussion_immune]
  - id: granted-dwarf-crossbowmen
    roles: [active, consumer, compiled]
    operation: injury
    attacker: {main_weapon_id: weapon.mace}
    defender: {collection: mordheim, band_id: dwarf-rangers, profile_id: dwarf-crossbowmen}
    rolls: [{key: test.injury, value: 2}]
    expect: {result.condition: KNOCKED_DOWN, context.concussion: true, context.concussion_immune: true}
    expect_contains:
      defender.global_effects.tags: [concussion_immune]
  - id: granted-dwarf-longbeards
    roles: [active, consumer, compiled]
    operation: injury
    attacker: {main_weapon_id: weapon.mace}
    defender: {collection: mordheim, band_id: dwarf-rangers, profile_id: dwarf-longbeards}
    rolls: [{key: test.injury, value: 2}]
    expect: {result.condition: KNOCKED_DOWN, context.concussion: true, context.concussion_immune: true}
    expect_contains:
      defender.global_effects.tags: [concussion_immune]
  - id: granted-dwarf-troll-slayers
    roles: [active, consumer, compiled]
    operation: injury
    attacker: {main_weapon_id: weapon.mace}
    defender: {collection: mordheim, band_id: dwarf-rangers, profile_id: dwarf-troll-slayers}
    rolls: [{key: test.injury, value: 2}]
    expect: {result.condition: KNOCKED_DOWN, context.concussion: true, context.concussion_immune: true}
    expect_contains:
      defender.global_effects.tags: [concussion_immune]
  - id: granted-runesmith
    roles: [active, consumer, compiled]
    operation: injury
    attacker: {main_weapon_id: weapon.mace}
    defender: {collection: mordheim, band_id: dwarf-rangers, profile_id: runesmith}
    rolls: [{key: test.injury, value: 2}]
    expect: {result.condition: KNOCKED_DOWN, context.concussion: true, context.concussion_immune: true}
    expect_contains:
      defender.global_effects.tags: [concussion_immune]
  - id: mace-face-1
    roles: [boundary, consumer]
    operation: injury
    attacker: {main_weapon_id: weapon.mace}
    defender: {collection: mordheim, band_id: dwarf-rangers, profile_id: beardlings}
    rolls: [{key: test.injury, value: 1}]
    expect: {result.condition: KNOCKED_DOWN}
  - id: mace-face-2
    roles: [boundary, consumer]
    operation: injury
    attacker: {main_weapon_id: weapon.mace}
    defender: {collection: mordheim, band_id: dwarf-rangers, profile_id: beardlings}
    rolls: [{key: test.injury, value: 2}]
    expect: {result.condition: KNOCKED_DOWN}
  - id: mace-face-3
    roles: [boundary, consumer]
    operation: injury
    attacker: {main_weapon_id: weapon.mace}
    defender: {collection: mordheim, band_id: dwarf-rangers, profile_id: beardlings}
    rolls: [{key: test.injury, value: 3}]
    expect: {result.condition: STUNNED}
  - id: mace-face-4
    roles: [boundary, consumer]
    operation: injury
    attacker: {main_weapon_id: weapon.mace}
    defender: {collection: mordheim, band_id: dwarf-rangers, profile_id: beardlings}
    rolls: [{key: test.injury, value: 4}]
    expect: {result.condition: STUNNED}
  - id: mace-face-5
    roles: [boundary, consumer]
    operation: injury
    attacker: {main_weapon_id: weapon.mace}
    defender: {collection: mordheim, band_id: dwarf-rangers, profile_id: beardlings}
    rolls: [{key: test.injury, value: 5}]
    expect: {result.condition: STUNNED}
  - id: mace-face-6
    roles: [boundary, consumer]
    operation: injury
    attacker: {main_weapon_id: weapon.mace}
    defender: {collection: mordheim, band_id: dwarf-rangers, profile_id: beardlings}
    rolls: [{key: test.injury, value: 6}]
    expect: {result.condition: OUT}
  - id: mace-complete-table
    roles: [boundary, active]
    operation: injury
    attacker: {main_weapon_id: weapon.mace}
    defender: {collection: mordheim, band_id: dwarf-rangers, profile_id: beardlings}
    distribution:
      observable: result.condition
      max_rolls: 1
      expected: {KNOCKED_DOWN: 1/3, STUNNED: 1/2, OUT: 1/6}
  - id: sword-complete-table
    roles: [boundary, inactive]
    operation: injury
    attacker: {main_weapon_id: weapon.sword}
    defender: {collection: mordheim, band_id: dwarf-rangers, profile_id: beardlings}
    distribution:
      observable: result.condition
      max_rolls: 1
      expected: {KNOCKED_DOWN: 1/3, STUNNED: 1/2, OUT: 1/6}
  - id: unprotected-opponent
    roles: [inactive]
    operation: injury
    attacker: {main_weapon_id: weapon.mace}
    rolls: [{key: test.injury, value: 2}]
    expect: {result.condition: STUNNED, context.concussion_immune: false}
  mutations:
  - id: remove-concussion-immunity
    path: defender.global_effects.tags
    value: [skill.hard-to-kill]
    cases: [mace-face-2, mace-complete-table]
