- id: editorial-hard-head-dwarf-rangers
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: local
  sources:
  - target: rule/mordheim/dwarf-rangers/band--hard-head/trait.concussion-immune
    digest: 048dbae08e6186980ff81579063df24008f2205fdc6742cf38c117f66e628f16
  depends_on:
  - mechanic/weapon.mace
  - mechanic/skill.hard-to-kill
  interpretation: Special Rules / Hard Head cancels the easier stunning caused by maces and clubs. All
    current profiles in this band are Dwarfs. With their Hard to Kill rule the Injury table remains 1-2
    Knocked Down, 3-5 Stunned, 6 Out even against Concussion. This is not immunity to Stunned, nor does
    it change an ordinary sword attack.
  cases:
  - id: exact-recipients
    roles:
    - grant
    - compiled
    operation: grant
    defender:
      collection: mordheim
      band_id: dwarf-rangers
      profile_id: beardlings
    context:
      rule_id: band--hard-head
    expect:
      result.recipients:
      - apprentice-runesmith
      - beardlings
      - dwarf-clansmen
      - dwarf-crossbowmen
      - dwarf-longbeards
      - dwarf-troll-slayers
      - runesmith
  - id: granted-apprentice-runesmith
    roles:
    - active
    - consumer
    - compiled
    operation: injury
    attacker:
      main_weapon_id: weapon.mace
    defender:
      collection: mordheim
      band_id: dwarf-rangers
      profile_id: apprentice-runesmith
    rolls:
    - key: test.injury
      value: 2
    expect:
      result.condition: KNOCKED_DOWN
      context.concussion: true
      context.concussion_immune: true
    expect_contains:
      defender.global_effects.tags:
      - concussion_immune
  - id: granted-beardlings
