schema_version: 1
specifications:
- id: editorial-art-of-silent-death-variants
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: construction
  sources:
  - target: rule/mordheim/skaven-clan-eshin/band--skaven-special-skills-art-of-silent-death/skill.art-of-silent-death
    digest: e947ff829d0ce68fa5d1b916edb5ed83139af45044bc9f1acdc730a477f68bce
  - target: rule/trollheim/trollheim-skaven-clan-eshin/band--skaven-special-skills-art-of-silent-death/skill.art-of-silent-death
    digest: 6aec3102331ccb763e5629a4a5af79fcb08a1daca9ed561723f5f2a76cf3fdbe
  - target: rule/trollheim/chaos-streets-deathbringers/band--deathbringer-special-skills-art-of-unarmed-combat/skill.art-of-silent-death
    digest: e8d5ff543a0417749381ff39f10b983203514414bab972e8c3a5aa8ad0289f99
  depends_on:
  - mechanic/skill.art-of-silent-death
  interpretation: The three variants grant the same mechanism, but their exact lists of eligible Heroes
    are checked separately and that each selection projects the binding onto the fighter.
  cases:
  - id: mordheim-recipients
    roles:
    - grant
    - accepted
    - rejected
    operation: selectable_grant
    defender:
      band_id: skaven-clan-eshin
      profile_id: assassin-adept
    context:
      rule_id: band--skaven-special-skills-art-of-silent-death
    expect:
      result.recipients:
      - assassin-adept
      - black-skaven
      - eshin-sorcerer
      - night-runners
  - id: trollheim-skaven-recipients
    roles:
    - grant
    - accepted
    - rejected
    operation: selectable_grant
    defender:
      collection: trollheim
      band_id: trollheim-skaven-clan-eshin
      profile_id: assassin-adept
    context:
      rule_id: band--skaven-special-skills-art-of-silent-death
    expect:
      result.recipients:
      - assassin-adept
      - black-skaven
      - eshin-sorcerer
      - night-runners
  - id: deathbringer-recipients
    roles:
    - grant
    - accepted
    - rejected
    operation: selectable_grant
    defender:
      collection: trollheim
      band_id: chaos-streets-deathbringers
      profile_id: shadow-blade
    context:
      rule_id: band--deathbringer-special-skills-art-of-unarmed-combat
    expect:
      result.recipients:
      - black-knives
      - shadow-blade
      - silent-hunter
      - young-claw
  - id: mordheim-selected
    roles:
    - accepted
    operation: wound
    attacker:
      band_id: skaven-clan-eshin
      profile_id: assassin-adept
      main_weapon_id: weapon.fist
      special_rule_ids:
      - band--skaven-special-skills-art-of-silent-death
    rolls:
    - key: wound
      value: 5
    expect:
      context.critical_threshold: 5
      result.critical: true
  - id: trollheim-skaven-selected
    roles:
    - accepted
    operation: attacks
    attacker:
      collection: trollheim
      band_id: trollheim-skaven-clan-eshin
      profile_id: night-runners
      main_weapon_id: weapon.fist
      special_rule_ids:
      - band--skaven-special-skills-art-of-silent-death
    expect_contains:
      attacker.global_effects.tags:
      - skill.art-of-silent-death
    expect:
      result.attacks: 2
  - id: deathbringer-selected
    roles:
    - accepted
    operation: wound
    attacker:
      collection: trollheim
      band_id: chaos-streets-deathbringers
      profile_id: shadow-blade
      main_weapon_id: weapon.fist
      special_rule_ids:
      - band--deathbringer-special-skills-art-of-unarmed-combat
    rolls:
    - key: wound
      value: 5
    expect:
      context.critical_threshold: 5
      result.critical: true
  mutations:
  - id: omit-mordheim-binding
    path: attacker.global_effects.tags
    value: []
    cases:
    - mordheim-selected
  - id: omit-trollheim-binding
    path: attacker.global_effects.tags
    value: []
    cases:
    - trollheim-skaven-selected
    - deathbringer-selected
- id: editorial-cripples-disability
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: construction
  sources:
  - target: rule/trollheim/chaos-streets-mordheim-inhabitants/cripples--disability/compiler.disability
    digest: bdac7729670cb236fa455a85b33d751001cdb17a719e2f00da643b77ff128be5
  depends_on:
  - mechanic/mechanic.disability
  interpretation: Disability is granted only to the Cripples profile and causes, at its initialisation,
    the persistent roll already verified by the canonical mechanism.
  cases:
  - id: recipient
    roles:
    - grant
    - accepted
    - rejected
    operation: grant
    defender:
      collection: trollheim
      band_id: chaos-streets-mordheim-inhabitants
      profile_id: cripples
    context:
      rule_id: cripples--disability
    expect:
      result.recipients:
      - cripples
  - id: selected
    roles:
    - accepted
    operation: initialize
    attacker:
      collection: trollheim
      band_id: chaos-streets-mordheim-inhabitants
      profile_id: cripples
    rolls:
    - key: a.disability
      value: 5
    expect:
      result.attacker.strength: 2
      result.attacker.resources_spent:
      - disability.5
  mutations:
  - id: omit-disability
    path: attacker.global_effects.tags
    value: []
    cases:
    - selected
- id: editorial-high-elf-luck
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: construction
  sources:
  - target: rule/trollheim/lustria-high-elves/band--high-elf-special-skills-luck/skill.luck
    digest: a4d8a19f3bf5d29dfdc292d2cf8fa78ad0e58624b57fba5daef76eb0b7220c89
  depends_on:
  - mechanic/skill.luck
  interpretation: Luck is selectable only by Explorers and re-rolls one of their own rolls, leaving the
    canonical resource consumed.
  cases:
  - id: recipients
    roles:
    - grant
    - accepted
    - rejected
    operation: selectable_grant
    defender:
      collection: trollheim
      band_id: lustria-high-elves
      profile_id: explorers
    context:
      rule_id: band--high-elf-special-skills-luck
    expect:
      result.recipients:
      - explorers
  - id: selected
    roles:
    - accepted
    operation: attack
    attacker:
      collection: trollheim
      band_id: lustria-high-elves
      profile_id: explorers
      special_rule_ids:
      - band--high-elf-special-skills-luck
    context:
      hit_only: true
    rolls:
    - key: test.hit
      value: 1
    - key: test.hit.reroll
      value: 4
    expect:
      result.hit: true
      result.attacker.resources_spent:
      - luck
  mutations:
  - id: omit-luck
    path: attacker.global_effects.tags
    value: []
    cases:
    - selected
- id: editorial-mark-of-the-old-ones
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: construction
  sources:
  - target: rule/trollheim/lustria-lizardmen/band--sacred-mark-of-the-old-ones/compiler.mark-of-the-old-ones
    digest: fcf32fa3a43b8b6d4cca5ad9c0fcc56e5782b72270aaae1974f9b07c7b696df9
  depends_on:
  - mechanic/mechanic.mark-of-the-old-ones
  interpretation: Mark of the Old Ones can only be selected for the three indicated Heroes and turns their
    first failure through the already verified consumable mechanism.
  cases:
  - id: recipients
    roles:
    - grant
    - accepted
    - rejected
    operation: selectable_grant
    defender:
      collection: trollheim
      band_id: lustria-lizardmen
      profile_id: skink-priest
    context:
      rule_id: band--sacred-mark-of-the-old-ones
    expect:
      result.recipients:
      - saurus-totem-warrior
      - skink-great-crests
      - skink-priest
  - id: selected
    roles:
    - accepted
    operation: attack
    attacker:
      collection: trollheim
      band_id: lustria-lizardmen
      profile_id: skink-priest
      special_rule_ids:
      - band--sacred-mark-of-the-old-ones
    context:
      hit_only: true
    rolls:
    - key: test.hit
      value: 1
    expect:
      result.hit: true
      result.attacker.resources_spent:
      - mark-of-the-old-ones
  mutations:
  - id: omit-mark
    path: attacker.global_effects.tags
    value: []
    cases:
    - selected
