schema_version: 1
specifications:
- id: editorial-karak-zorn-hard-head
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: local
  sources:
  - target: rule/trollheim/khemri-cursed-of-karak-zorn/band--hard-head/trait.concussion-immune
    digest: 8cc9f9dd930b3b0121fa98d86596fce9ea60f4f3c4ebc619dc54b96b9a27b2eb
  depends_on:
  - mechanic/skill.hard-to-kill
  - mechanic/weapon.mace
  interpretation: Khemri p.65 / Hard Head prevents Concussion on the Dwarfs, including the Shadowed. Hard
    to Kill retains 1-2 Knocked Down, 3-5 Stunned and 6 Out; Shadowed additionally have No Pain.
  cases:
  - id: recipients
    roles:
    - grant
    - compiled
    operation: grant
    defender:
      collection: trollheim
      band_id: khemri-cursed-of-karak-zorn
      profile_id: karak-zorn-noble
    context:
      rule_id: band--hard-head
    expect:
      result.recipients:
      - cannibal-dwarfs
      - clan-warriors
      - karak-zorn-noble
      - longbeard
      - priest-of-grungni
      - shadowed
      - troll-slayer
  - id: granted-cannibal-dwarfs
    roles:
    - active
    - consumer
    operation: injury
    attacker:
      main_weapon_id: weapon.mace
    defender:
      collection: trollheim
      band_id: khemri-cursed-of-karak-zorn
      profile_id: cannibal-dwarfs
    rolls:
    - key: test.injury
      value: 2
    expect:
      context.concussion_immune: true
      result.condition: KNOCKED_DOWN
  - id: granted-clan-warriors
    roles:
    - active
    - consumer
    operation: injury
    attacker:
      main_weapon_id: weapon.mace
    defender:
      collection: trollheim
      band_id: khemri-cursed-of-karak-zorn
      profile_id: clan-warriors
    rolls:
    - key: test.injury
      value: 2
    expect:
      context.concussion_immune: true
      result.condition: KNOCKED_DOWN
  - id: granted-karak-zorn-noble
    roles:
    - active
    - consumer
    operation: injury
    attacker:
      main_weapon_id: weapon.mace
    defender:
      collection: trollheim
      band_id: khemri-cursed-of-karak-zorn
      profile_id: karak-zorn-noble
    rolls:
    - key: test.injury
      value: 2
    expect:
      context.concussion_immune: true
      result.condition: KNOCKED_DOWN
  - id: granted-longbeard
    roles:
    - active
    - consumer
    operation: injury
    attacker:
      main_weapon_id: weapon.mace
    defender:
      collection: trollheim
      band_id: khemri-cursed-of-karak-zorn
      profile_id: longbeard
    rolls:
    - key: test.injury
      value: 2
    expect:
      context.concussion_immune: true
      result.condition: KNOCKED_DOWN
  - id: granted-priest-of-grungni
    roles:
    - active
    - consumer
    operation: injury
    attacker:
      main_weapon_id: weapon.mace
    defender:
      collection: trollheim
      band_id: khemri-cursed-of-karak-zorn
      profile_id: priest-of-grungni
    rolls:
    - key: test.injury
      value: 2
    expect:
      context.concussion_immune: true
      result.condition: KNOCKED_DOWN
  - id: granted-shadowed
    roles:
    - active
    - consumer
    operation: injury
    attacker:
      main_weapon_id: weapon.mace
    defender:
      collection: trollheim
      band_id: khemri-cursed-of-karak-zorn
      profile_id: shadowed
    rolls:
    - key: test.injury
      value: 2
    expect:
      context.concussion_immune: true
      result.condition: KNOCKED_DOWN
  - id: granted-troll-slayer
    roles:
    - active
    - consumer
    operation: injury
    attacker:
      main_weapon_id: weapon.mace
    defender:
      collection: trollheim
      band_id: khemri-cursed-of-karak-zorn
      profile_id: troll-slayer
    rolls:
    - key: test.injury
      value: 2
    expect:
      context.concussion_immune: true
      result.condition: KNOCKED_DOWN
  - id: full-table
    roles:
    - boundary
    operation: injury
    attacker:
      main_weapon_id: weapon.mace
    defender:
      collection: trollheim
      band_id: khemri-cursed-of-karak-zorn
      profile_id: karak-zorn-noble
    distribution:
      observable: result.condition
      max_rolls: 1
      expected:
        KNOCKED_DOWN: 1/3
        STUNNED: 1/2
        OUT: 1/6
  - id: ordinary-opponent
    roles:
    - inactive
    operation: injury
    attacker:
      main_weapon_id: weapon.mace
    rolls:
    - key: test.injury
      value: 2
    expect:
      result.condition: STUNNED
  mutations:
  - id: remove-hard-head
    path: defender.global_effects.tags
    value:
    - skill.hard-to-kill
    cases:
    - granted-karak-zorn-noble
- id: editorial-vulture-fragile
