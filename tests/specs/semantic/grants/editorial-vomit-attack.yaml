    - consumer
    - boundary
    operation: attacks
    attacker:
      collection: mordheim
      band_id: orc-mob
      profile_id: troll
      main_weapon_id: weapon.vomit-attack
    expect:
      result.attacks: 1
      attacker.main_weapon.automatic_hit: true
      attacker.main_weapon.fixed_strength: 5
