    operation: selectable_grant
    defender:
      collection: mordheim
      band_id: black-orcs
      profile_id: troll
    context:
      rule_id: troll--vomit-attack
    expect:
      result.recipients:
      - troll
  - id: night-goblins-mic-only-troll
    roles:
    - grant
    operation: selectable_grant
    defender:
      collection: mordheim
      band_id: night-goblins-mic
      profile_id: troll
    context:
      rule_id: troll--vomit-attack
    expect:
      result.recipients:
      - troll
  - id: night-goblins-web-only-troll
    roles:
    - grant
    operation: selectable_grant
    defender:
      collection: mordheim
      band_id: night-goblins-web
      profile_id: troll
    context:
      rule_id: troll--vomit-attack
    expect:
      result.recipients:
      - troll
  - id: orc-mob-only-troll
    roles:
    - grant
    operation: selectable_grant
