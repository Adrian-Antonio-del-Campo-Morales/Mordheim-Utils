  depends_on:
  - mechanic/weapon.vomit-attack
  interpretation: Every cited profile entry grants the optional Vomit attack exclusively to the Troll
    profile. The profile's legal weapon construction exposes the canonical Vomit mechanism; all other
    profiles in each band must reject the same selection.
  cases:
  - id: black-orcs-only-troll
    roles:
    - grant
    - compiled
    operation: selectable_grant
    defender:
      collection: mordheim
      band_id: black-orcs
      profile_id: troll
    context:
      rule_id: troll--vomit-attack
    expect:
      result.recipients:
      - troll
  - id: night-goblins-mic-only-troll
    roles:
    - grant
    operation: selectable_grant
    defender:
      collection: mordheim
      band_id: night-goblins-mic
      profile_id: troll
    context:
      rule_id: troll--vomit-attack
    expect:
      result.recipients:
      - troll
  - id: night-goblins-web-only-troll
    roles:
    - grant
    operation: selectable_grant
    defender:
      collection: mordheim
      band_id: night-goblins-web
      profile_id: troll
    context:
      rule_id: troll--vomit-attack
    expect:
      result.recipients:
      - troll
  - id: orc-mob-only-troll
    roles:
    - grant
    operation: selectable_grant
    defender:
      collection: mordheim
      band_id: orc-mob
      profile_id: troll
    context:
      rule_id: troll--vomit-attack
    expect:
      result.recipients:
      - troll
  - id: streets-greenskins-only-troll
    roles:
    - grant
    operation: selectable_grant
    defender:
      collection: trollheim
      band_id: chaos-streets-greenskins
      profile_id: troll
    context:
      rule_id: troll--troll-vomit
    expect:
      result.recipients:
      - troll
  - id: granted-consumer
    roles:
    - consumer
    - boundary
    operation: attacks
    attacker:
      collection: mordheim
      band_id: orc-mob
      profile_id: troll
      main_weapon_id: weapon.vomit-attack
    expect:
      result.attacks: 1
      attacker.main_weapon.automatic_hit: true
      attacker.main_weapon.fixed_strength: 5
  mutations:
  - id: remove-granted-replacement
    path: attacker.main_weapon.tags
    value:
    - material.normal
    cases:
    - granted-consumer
