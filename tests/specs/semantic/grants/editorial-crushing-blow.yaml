schema_version: 1
specifications:
- id: editorial-crushing-blow-grants
  scope_digest: ea4090654a79e79bb19b0855371a062c6a9a10c1ab40f7d8abdb42634a425b97
  category: permanent
  sources:
  - target: rule/mordheim/norse-explorers-btb/band--norse-special-skills-crushing-blow/skill.crushing-blow
    digest: 887a7e540939ac4cb77a5cff8c9f51f91a6514692485b026795172f56e43cd18
  - target: rule/mordheim/norse-explorers-lustria/band--norse-special-skills-crushing-blow/skill.crushing-blow
    digest: 61c1604b2c892912002595662b575dfbf1967fc97809b83393359ee1a20c80ab
  - target: rule/trollheim/lustria-norse/band--norse-special-skills-crushing-blow/skill.crushing-blow
    digest: befb1c35b0f51acc3324538cd489057daec54d2781233eea66ff919926b68fb6
  depends_on:
  - mechanic/skill.crushing-blow
  interpretation: The three Norse publications grant the same selectable skill to their four hero profiles.
    Henchmen and wolves cannot select it. The historical spelling difference between beserkers and berserkers
    is a profile ID, not a semantic difference.
  cases:
  - id: border-town-burning-heroes
    roles:
    - grant
    - compiled
    operation: selectable_grant
    defender:
      collection: mordheim
      band_id: norse-explorers-btb
      profile_id: jarl
    context:
      rule_id: band--norse-special-skills-crushing-blow
    expect:
      result.recipients:
      - beserkers
      - bondsmen
      - jarl
      - wulfen
  - id: mordheim-lustria-heroes
    roles:
    - grant
    operation: selectable_grant
    defender:
      collection: mordheim
      band_id: norse-explorers-lustria
      profile_id: jarl
    context:
      rule_id: band--norse-special-skills-crushing-blow
    expect:
      result.recipients:
      - beserkers
      - bondsmen
      - jarl
      - wulfen
  - id: trollheim-lustria-heroes
    roles:
    - grant
    operation: selectable_grant
    defender:
      collection: trollheim
      band_id: lustria-norse
      profile_id: jarl
    context:
      rule_id: band--norse-special-skills-crushing-blow
    expect:
      result.recipients:
      - berserkers
      - bondsmen
      - jarl
      - wulfen
  - id: granted-consumer
    roles:
    - consumer
    - boundary
    operation: parry
    attacker:
      collection: mordheim
      band_id: norse-explorers-btb
      profile_id: jarl
      special_rule_ids:
      - band--norse-special-skills-crushing-blow
      main_weapon_id: weapon.mace
    defender:
      main_weapon_id: weapon.sword
    context:
      hit_roll: 4
    expect:
      attacker.global_effects.cannot_be_parried: true
      result.attempted: false
      result.blocked: false
  mutations:
  - id: remove-granted-effect
    path: attacker.global_effects.cannot_be_parried
    value: false
    cases:
    - granted-consumer
