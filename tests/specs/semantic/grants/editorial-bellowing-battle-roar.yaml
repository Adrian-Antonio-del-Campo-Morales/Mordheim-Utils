schema_version: 1
specifications:
- id: editorial-bellowing-battle-roar-grants
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: permanent
  sources:
  - target: rule/mordheim/lizardmen/band--lizardmen-special-skills-saurus-only-bellowing-battle-roar/skill.bellowing-battle-roar
    digest: 6fd30e966b8abfaff5908d55ff37d475b32bc294ef1b7ae2d68f290e8464db03
  - target: rule/trollheim/lustria-lizardmen/band--lizardmen-special-skills-battle-roar/skill.bellowing-battle-roar
    digest: 9c7f37f9da7f122dfe143a8299ae04bcb8b59641e5af3bca856e54d59bae11a9
  depends_on:
  - mechanic/skill.bellowing-battle-roar
  interpretation: Both publications restrict the selectable roar to the Saurus Totem Warrior. Other Saurus
    and every Skink profile remain ineligible; selecting the rule compiles the canonical incoming hit
    penalty.
  cases:
  - id: mordheim-only-totem-warrior
    roles:
    - grant
    - compiled
    operation: selectable_grant
    defender:
      collection: mordheim
      band_id: lizardmen
      profile_id: skink-priest
    context:
      rule_id: band--lizardmen-special-skills-saurus-only-bellowing-battle-roar
    expect:
      result.recipients:
      - saurus-totem-warrior
  - id: trollheim-only-totem-warrior
    roles:
    - grant
    operation: selectable_grant
    defender:
      collection: trollheim
      band_id: lustria-lizardmen
      profile_id: skink-priest
    context:
      rule_id: band--lizardmen-special-skills-battle-roar
    expect:
      result.recipients:
      - saurus-totem-warrior
  - id: granted-consumer
    roles:
    - consumer
    - boundary
    operation: hit
    attacker:
      main_weapon_id: weapon.mace
    defender:
      collection: mordheim
      band_id: lizardmen
      profile_id: saurus-totem-warrior
      special_rule_ids:
      - band--lizardmen-special-skills-saurus-only-bellowing-battle-roar
    context:
      first_round: true
    distribution:
      observable: result.success
      max_rolls: 1
      expected:
        'true': 1/3
        'false': 2/3
  mutations:
  - id: remove-granted-roar
    path: defender.global_effects.tags
    value: []
    cases:
    - granted-consumer
