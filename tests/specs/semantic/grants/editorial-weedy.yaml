  interpretation: Henchmen / Weedy explicitly replaces the injury table with 1 Knocked Down, 2-3 Stunned,
    4-6 Out. This verifies an individual injury resolution, not the number of members in the mob.
  cases:
  - id: recipients
    roles:
    - grant
    - compiled
    operation: grant
    defender:
      collection: mordheim
      band_id: night-goblins-mic
      profile_id: snotling-mob-consists-of-5-snotlings
    context:
      rule_id: snotling-mob-consists-of-5-snotlings--weedy
    expect:
      result.recipients:
      - snotling-mob-consists-of-5-snotlings
  - id: face-1
    roles:
    - active
    - consumer
    - boundary
    operation: injury
    attacker:
      main_weapon_id: weapon.sword
    defender:
      collection: mordheim
      band_id: night-goblins-mic
      profile_id: snotling-mob-consists-of-5-snotlings
    rolls:
    - key: test.injury
      value: 1
    expect:
      defender.injury_profile: 1
      result.condition: KNOCKED_DOWN
  - id: face-2
    roles:
    - active
    - consumer
    - boundary
    operation: injury
    attacker:
      main_weapon_id: weapon.sword
    defender:
      collection: mordheim
      band_id: night-goblins-mic
      profile_id: snotling-mob-consists-of-5-snotlings
    rolls:
    - key: test.injury
      value: 2
    expect:
      defender.injury_profile: 1
      result.condition: STUNNED
  - id: face-3
    roles:
    - active
    - consumer
    - boundary
    operation: injury
    attacker:
      main_weapon_id: weapon.sword
    defender:
      collection: mordheim
      band_id: night-goblins-mic
      profile_id: snotling-mob-consists-of-5-snotlings
    rolls:
    - key: test.injury
      value: 3
    expect:
      defender.injury_profile: 1
      result.condition: STUNNED
  - id: face-4
    roles:
    - active
    - consumer
    - boundary
    operation: injury
    attacker:
      main_weapon_id: weapon.sword
    defender:
      collection: mordheim
      band_id: night-goblins-mic
      profile_id: snotling-mob-consists-of-5-snotlings
    rolls:
    - key: test.injury
      value: 4
    expect:
      defender.injury_profile: 1
      result.condition: OUT
  - id: face-5
    roles:
    - active
    - consumer
    - boundary
    operation: injury
    attacker:
      main_weapon_id: weapon.sword
