      collection: mordheim
      band_id: night-goblins-mic
      profile_id: snotling-mob-consists-of-5-snotlings
    rolls:
    - key: test.injury
      value: 5
    expect:
      defender.injury_profile: 1
      result.condition: OUT
  - id: face-6
    roles:
    - active
    - consumer
    - boundary
    operation: injury
    attacker:
      main_weapon_id: weapon.sword
    defender:
      collection: mordheim
      band_id: night-goblins-mic
      profile_id: snotling-mob-consists-of-5-snotlings
    rolls:
    - key: test.injury
      value: 6
    expect:
      defender.injury_profile: 1
      result.condition: OUT
  - id: ordinary-opponent
    roles:
    - inactive
    operation: injury
    attacker:
      main_weapon_id: weapon.sword
    rolls:
    - key: test.injury
      value: 4
    expect:
      result.condition: STUNNED
  - id: complete-table
    roles:
    - boundary
    operation: injury
    attacker:
      main_weapon_id: weapon.sword
    defender:
      collection: mordheim
      band_id: night-goblins-mic
      profile_id: snotling-mob-consists-of-5-snotlings
    distribution:
      observable: result.condition
      max_rolls: 1
      expected:
        KNOCKED_DOWN: 1/6
        STUNNED: 1/3
        OUT: 1/2
  mutations:
  - id: ordinary-injury-table
    path: defender.injury_profile
    value: 0
    cases:
    - face-2
    - face-4
    - complete-table
