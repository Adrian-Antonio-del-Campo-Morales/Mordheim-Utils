    roles:
    - active
    - boundary
    - consumer
    operation: injury
    defender:
      collection: mordheim
      band_id: sons-of-hashut
      profile_id: apprentice-sorcerer
      special_rule_ids:
      - band--chaos-dwarfs-special-skills-true-grit
    rolls:
    - key: test.injury
      value: 3
    expect:
      result.condition: KNOCKED_DOWN
  mutations:
  - id: remove-granted-true-grit
    changes:
    - path: defender.global_effects.tags
