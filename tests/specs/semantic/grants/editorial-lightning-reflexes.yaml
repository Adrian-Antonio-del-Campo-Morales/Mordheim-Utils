schema_version: 1
specifications:
- id: editorial-lightning-reflexes-grant
  scope_digest: 5fd7034eceb69daeeac4b0ad8bba9f2bc5ba50ca65a102d49b69e25f85d18dc9
  category: permanent
  sources:
  - target: rule/mordheim/merchant-caravans/knights-vanguard--lightning-reflexes/skill.lightning-reflexes
    digest: 34c67ed54ebceb89b7a880172fafb211fa1c6cdb427acf39da318816dc253ba5
  depends_on:
  - mechanic/skill.lightning-reflexes
  interpretation: Every Knights Vanguard has Lightning Reflexes as an inherent profile rule. No other
    Merchant Caravan profile receives it. When charged, its strike-first tier is resolved against the
    charger's tier by Initiative.
  cases:
  - id: only-knights-vanguard
    roles:
    - grant
    - compiled
    operation: grant
    defender:
      collection: mordheim
      band_id: merchant-caravans
      profile_id: knights-vanguard
    context:
      rule_id: knights-vanguard--lightning-reflexes
    expect:
      result.recipients:
      - knights-vanguard
  - id: inherent-priority-consumer
    roles:
    - active
    - boundary
    - consumer
    operation: acting_order
    attacker:
      collection: mordheim
      band_id: merchant-caravans
      profile_id: knights-vanguard
      main_weapon_id: weapon.dagger
    defender:
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 3
        attacks: 1
    context:
      first_round: true
      charged: true
    opponent_context:
      first_round: true
      charging: true
    expect:
      result.first_acts: true
    expect_contains:
      attacker.global_effects.tags:
      - skill.lightning-reflexes
  mutations:
  - id: remove-inherent-lightning-reflexes
    path: attacker.global_effects.tags
    value: []
    cases:
    - inherent-priority-consumer
