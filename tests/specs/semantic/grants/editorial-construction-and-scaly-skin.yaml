schema_version: 1
specifications:
- id: cathay-strictures-armour-prohibition
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: construction
  sources:
  - target: rule/mordheim/battle-monks-of-cathay/band--strictures/compiler.strictures
    digest: d22215394d16a5c5cdb907f5654b41e4fa13a8a5158a893262c4816f5dbeef5a
  interpretation: Battle Monks / Strictures forbids any armour to Dragon Monks and Warrior Monks. No Armour
    is accepted, Light Armour is specifically rejected by Strictures and the Officer serves as a non-recipient
    control.
  cases:
  - id: recipients
    roles:
    - grant
    operation: grant
    defender:
      band_id: battle-monks-of-cathay
      profile_id: dragon-monks
    context:
      rule_id: band--strictures
    expect:
      result.recipients:
      - dragon-monks
      - emissary
      - officer
      - raging-peasants
      - soldiers
      - warrior-monks
  - id: dragon-choices
    roles:
    - accepted
    - rejected
    operation: equipment_choices
    attacker:
      band_id: battle-monks-of-cathay
      profile_id: dragon-monks
    context:
      choices:
        unarmoured: {}
        light:
          armour_id: armour.light-armour
    expect:
      result.accepted:
      - unarmoured
      result.rejected:
        light: Dragon Monks and Warrior Monks may never wear armour
  - id: warrior-choices
    roles:
    - accepted
    - rejected
    operation: equipment_choices
    attacker:
      band_id: battle-monks-of-cathay
      profile_id: warrior-monks
    context:
      choices:
        unarmoured: {}
        light:
          armour_id: armour.light-armour
    expect:
      result.accepted:
      - unarmoured
      result.rejected:
        light: Dragon Monks and Warrior Monks may never wear armour
  - id: officer-control
    roles:
    - accepted
    operation: equipment_choices
    attacker:
      band_id: battle-monks-of-cathay
      profile_id: officer
    context:
      choices:
        light:
          armour_id: armour.light-armour
    expect:
      result.accepted:
      - light
      result.rejected: {}
  mutations:
  - id: omit-strictures
    runtime_fault: suppress-category-prohibitions
    cases:
    - dragon-choices
    - warrior-choices
- id: averlander-promoted-halfling-no-strength
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: construction
  sources:
  - target: rule/mordheim/averlanders/halflings-scouts--promotion/compiler.promoted-hero-no-strength-access
    digest: e013a3affd12a6318659930973e554832945343ae72f664f3a2f4a0a23e7eeee
  interpretation: 'Averlanders / Halfling Scouts / Promotion forbids choosing Strength for the promoted
    Halfling. In a henchman build, selecting a skill represents its promoted profile: Mighty Blow is rejected
    and a permitted skill from its own access is accepted. Captain does not inherit the rule.'
  cases:
  - id: recipients
    roles:
    - grant
    operation: grant
    defender:
      band_id: averlanders
      profile_id: halflings-scouts
    context:
      rule_id: halflings-scouts--promotion
    expect:
      result.recipients:
      - halflings-scouts
  - id: promoted-choices
    roles:
    - accepted
    - rejected
    operation: selection_choices
    attacker:
      band_id: averlanders
      profile_id: halflings-scouts
    context:
      choices:
        permitted-skill:
          skill_ids:
          - skill.expert-swordsman
          variant_ids:
          - skill-list.combat
          - skill-list.speed
        strength:
          skill_ids:
          - skill.mighty-blow
          variant_ids:
          - skill-list.combat
          - skill-list.strength
    expect:
      result.accepted:
      - permitted-skill
      result.rejected:
        strength: Strength skill list is forbidden for averlanders/halflings-scouts
  - id: captain-control
    roles:
    - accepted
    operation: selection_choices
    attacker:
      band_id: averlanders
      profile_id: captain
    context:
      choices:
        strength:
          skill_ids:
          - skill.mighty-blow
    expect:
      result.accepted:
      - strength
      result.rejected: {}
  - id: contract-present
    operation: construction_tag_presence
    attacker:
      band_id: averlanders
      profile_id: halflings-scouts
    context:
      tag: compiler.promoted-hero-no-strength-access
    expect:
      result.present: true
  mutations:
  - id: remove-promotion-contract
    path: attacker.construction_tags
    value: []
    cases:
    - contract-present
- id: savage-tracker-master-of-throwing-weapons
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: construction
  sources:
  - target: rule/trollheim/lustria-savage-goblins/band--savage-goblin-special-skills-master-of-throwing-weapons/mechanic.master-of-throwing-weapons
    digest: d75643f7c5d3dcb527b1c7179e230c325a8da224a8ed905cc0326e5f97f2e68e
  interpretation: Lustria p.105 / Master of Throwing Weapons is only for Trackers and raises the missile
    weapon limit from two to five. The exact recipient, the compiled value five and the ordinary control
    two without selecting are checked.
  cases:
  - id: recipients
    roles:
    - grant
    - accepted
    - rejected
    operation: selectable_grant
    defender:
      collection: trollheim
      band_id: lustria-savage-goblins
      profile_id: trackers
    context:
      rule_id: band--savage-goblin-special-skills-master-of-throwing-weapons
    expect:
      result.recipients:
      - trackers
  - id: selected-limit
    roles:
    - accepted
    operation: missile_capacity
    attacker:
      collection: trollheim
      band_id: lustria-savage-goblins
      profile_id: trackers
      special_rule_ids:
      - band--savage-goblin-special-skills-master-of-throwing-weapons
    expect:
      result.limit: 5
  - id: ordinary-limit
    roles:
    - rejected
    operation: missile_capacity
    attacker:
      collection: trollheim
      band_id: lustria-savage-goblins
      profile_id: trackers
    expect:
      result.limit: 2
  mutations:
  - id: retain-ordinary-limit
    path: attacker.missile_weapon_limit
    value: 2
    cases:
    - selected-limit
- id: mordheim-lizardmen-band-scaly-skin
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: local
  sources:
  - target: rule/mordheim/lizardmen/band--scaly-skin/compiler.lizardmen-scaly-skin
    digest: 83cd6bb2f7760337532b4e0834c88085a8636fb37c287175440497762d186447
  interpretation: Mordheim Lizardmen / Scaly Skin grants 6+ to Skinks, 5+ to Saurus and keeps the Kroxigor's
    own 4+. The natural contribution is never worsened from 6+ by Strength, stacks with Light Armour and
    Shield, and an attack that ignores armour nullifies it.
  cases:
  - id: recipients
    roles:
    - grant
    - compiled
    operation: grant
    defender:
      band_id: lizardmen
      profile_id: skink-priest
    context:
      rule_id: band--scaly-skin
    expect:
      result.recipients:
      - kroxigor
      - saurus-braves
      - saurus-totem-warrior
      - skink-braves
      - skink-great-crests
      - skink-priest
  - id: skink-base
    roles:
    - active
    - consumer
    - boundary
    operation: armour
    attacker:
      main_weapon_id: weapon.mace
    defender:
      band_id: lizardmen
      profile_id: skink-priest
    rolls:
    - key: armour
      value: 6
    expect:
      result.target: 6
      result.saved: true
  - id: saurus-base
    roles:
    - active
    - boundary
    operation: armour
    attacker:
      main_weapon_id: weapon.mace
    defender:
      band_id: lizardmen
      profile_id: saurus-braves
    rolls:
    - key: armour
      value: 5
    expect:
      result.target: 5
      result.saved: true
  - id: strength-floor
    roles:
    - active
    - boundary
    operation: armour
    attacker:
      characteristics:
        weapon_skill: 3
        strength: 6
        toughness: 3
        wounds: 3
        initiative: 3
        attacks: 1
    defender:
      band_id: lizardmen
      profile_id: saurus-braves
    rolls:
    - key: armour
      value: 6
    expect:
      result.target: 6
      result.saved: true
  - id: stacks-armour-shield
    roles:
    - active
    - boundary
    operation: armour
    attacker:
      main_weapon_id: weapon.mace
    defender:
      band_id: lizardmen
      profile_id: saurus-totem-warrior
      armour_id: armour.light-armour
      off_hand_id: defence.shield
    rolls:
    - key: armour
      value: 3
    expect:
      result.target: 3
      result.saved: true
  - id: denial
    roles:
    - inactive
    operation: armour
    attacker:
      main_weapon_id: weapon.vomit-attack
    defender:
      band_id: lizardmen
      profile_id: saurus-braves
    expect:
      result.eligible: false
  mutations:
  - id: remove-scaly-skin
    changes:
    - path: defender.armour_save
      value: 7
    - path: defender.natural_armour_save
      value: 7
    - path: defender.natural_armour_worst_save
      value: 7
    cases:
    - skink-base
    - saurus-base
    - strength-floor
- id: lustria-lizardmen-band-scaly-skin
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: local
  sources:
  - target: rule/trollheim/lustria-lizardmen/band--scaly-skin/compiler.lizardmen-scaly-skin
    digest: 551e09e5e612185f0cdaf3fcafcec2e064635313712ec2b530702b5971e24ea2
  interpretation: Lustria pp.54-56 / Scaly Skin keeps the natural saves, their 6+ floor, the combination
    with ordinary armour and the total negation when the attack does not allow armour. Hardened Leather
    adds no extra bonus.
  cases:
  - id: recipients
    roles:
    - grant
    - compiled
    operation: grant
    defender:
      collection: trollheim
      band_id: lustria-lizardmen
      profile_id: skink-priest
    context:
      rule_id: band--scaly-skin
    expect:
      result.recipients:
      - kroxigor
      - saurus-braves
      - saurus-totem-warrior
      - skink-braves
      - skink-great-crests
      - skink-priest
  - id: skink-base
    roles:
    - active
    - consumer
    - boundary
    operation: armour
    attacker:
      main_weapon_id: weapon.mace
    defender:
      collection: trollheim
      band_id: lustria-lizardmen
      profile_id: skink-priest
    rolls:
    - key: armour
      value: 6
    expect:
      result.target: 6
      result.saved: true
  - id: strength-floor
    roles:
    - active
    - boundary
    operation: armour
    attacker:
      characteristics:
        weapon_skill: 3
        strength: 6
        toughness: 3
        wounds: 3
        initiative: 3
        attacks: 1
    defender:
      collection: trollheim
      band_id: lustria-lizardmen
      profile_id: saurus-braves
    rolls:
    - key: armour
      value: 6
    expect:
      result.target: 6
      result.saved: true
  - id: ordinary-armour-stacks
    roles:
    - active
    - boundary
    operation: armour
    attacker:
      main_weapon_id: weapon.mace
    defender:
      collection: trollheim
      band_id: lustria-lizardmen
      profile_id: saurus-totem-warrior
      armour_id: armour.light-armour
    rolls:
    - key: armour
      value: 4
    expect:
      result.target: 4
      result.saved: true
  - id: hardened-leather-no-additional-bonus
    roles:
    - inactive
    - boundary
    operation: armour
    attacker:
      main_weapon_id: weapon.mace
    defender:
      armour_id: armour.toughened-leathers
      trait_overrides:
        natural_armour_save: 6
        natural_armour_stacks: true
        natural_armour_worst_save: 6
    rolls:
    - key: armour
      value: 6
    expect:
      result.target: 6
      result.saved: true
  - id: denial
    roles:
    - inactive
    operation: armour
    attacker:
      main_weapon_id: weapon.vomit-attack
    defender:
      collection: trollheim
      band_id: lustria-lizardmen
      profile_id: saurus-braves
    expect:
      result.eligible: false
  mutations:
  - id: remove-scaly-skin
    changes:
    - path: defender.armour_save
      value: 7
    - path: defender.natural_armour_save
      value: 7
    - path: defender.natural_armour_worst_save
      value: 7
    cases:
    - skink-base
    - strength-floor
- id: condemned-inconsistency-random-characteristics
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: stateful
  sources:
  - target: rule/mordheim/marauders-of-chaos/condemned--inconsistency/profile.random-characteristics
    digest: 0b098268bc8e39e59b5ca29f11550753c7268cf96b4b23400189018ff6d0cffe
  interpretation: Marauders of Chaos / Condemned / Inconsistency rolls D6 per turn for WS, S and T, and
    D3 for A. Modular initialisation consumes those four rolls, and each subsequent combat turn refreshes
    the same values before priority and attack resolution. I remains 4, and minima and maxima are preserved.
  cases:
  - id: recipient
    roles:
    - grant
    operation: grant
    defender:
      band_id: marauders-of-chaos
      profile_id: condemned
    context:
      rule_id: condemned--inconsistency
    expect:
      result.recipients:
      - condemned
  - id: compiled-dice-contract
    roles:
    - compiled
    operation: compile
    attacker:
      band_id: marauders-of-chaos
      profile_id: condemned
    expect:
      attacker.random_characteristics:
      - - WS
        - 1
        - 6
        - 0
      - - S
        - 1
        - 6
        - 0
      - - T
        - 1
        - 6
        - 0
      - - A
        - 1
        - 3
        - 0
  - id: minimum-values
    roles:
    - active
    - sequence
    - consumption
    operation: initialize
    attacker:
      band_id: marauders-of-chaos
      profile_id: condemned
    rolls:
    - key: a.characteristic.WS.0
      sides: 6
      value: 1
    - key: a.characteristic.S.0
      sides: 6
      value: 1
    - key: a.characteristic.T.0
      sides: 6
      value: 1
    - key: a.characteristic.A.0
      sides: 3
      value: 1
    expect:
      result.attacker.weapon_skill: 1
      result.attacker.strength: 1
      result.attacker.toughness: 1
      result.attacker.initiative: 4
      result.attacker.attacks: 1
  - id: maximum-values
    roles:
    - boundary
    operation: initialize
    attacker:
      band_id: marauders-of-chaos
      profile_id: condemned
    rolls:
    - key: a.characteristic.WS.0
      sides: 6
      value: 6
    - key: a.characteristic.S.0
      sides: 6
      value: 6
    - key: a.characteristic.T.0
      sides: 6
      value: 6
    - key: a.characteristic.A.0
      sides: 3
      value: 3
    expect:
      result.attacker.weapon_skill: 6
      result.attacker.strength: 6
      result.attacker.toughness: 6
      result.attacker.initiative: 4
      result.attacker.attacks: 3
  - id: refreshes-on-next-turn
    roles:
    - active
    - sequence
    - consumption
    operation: round
    attacker:
      band_id: marauders-of-chaos
      profile_id: condemned
    defender:
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 3
        attacks: 1
    attacker_state:
      condition: OUT
    defender_state:
      condition: OUT
    context:
      round_index: 1
      first_charged: true
    rolls:
    - key: a.characteristic.WS.0
      sides: 6
      value: 1
    - key: a.characteristic.S.0
      sides: 6
      value: 1
    - key: a.characteristic.T.0
      sides: 6
      value: 1
    - key: a.characteristic.A.0
      sides: 3
      value: 1
    - key: round.1.first.characteristic.WS.0
      sides: 6
      value: 6
    - key: round.1.first.characteristic.S.0
      sides: 6
      value: 6
    - key: round.1.first.characteristic.T.0
      sides: 6
      value: 6
    - key: round.1.first.characteristic.A.0
      sides: 3
      value: 3
    expect:
      result.state.first.weapon_skill: 6
      result.state.first.strength: 6
      result.state.first.toughness: 6
      result.state.first.initiative: 4
      result.state.first.attacks: 3
  - id: ordinary-profile-inactive
    roles:
    - inactive
    operation: initialize
    attacker:
      main_weapon_id: weapon.mace
    expect:
      result.attacker.weapon_skill: 3
      result.attacker.strength: 3
      result.attacker.toughness: 3
      result.attacker.initiative: 3
      result.attacker.attacks: 1
  mutations:
  - id: remove-random-characteristics
    path: attacker.random_characteristics
    value: []
    cases:
    - minimum-values
    - maximum-values
    - refreshes-on-next-turn
