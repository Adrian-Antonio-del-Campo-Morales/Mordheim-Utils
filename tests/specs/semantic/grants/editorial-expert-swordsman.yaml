schema_version: 1
specifications:
- id: editorial-expert-swordsman-companions
  scope_digest: 5fd7034eceb69daeeac4b0ad8bba9f2bc5ba50ca65a102d49b69e25f85d18dc9
  category: contextual
  sources:
  - target: rule/mordheim/cursed-cavalcade/companions--expert-swordsman/skill.expert-swordsman
    digest: 6e8e8f7bd0313422d9eff40cb7aecdb6235b127516ce27ad7c99d32b22543650
  depends_on:
  - mechanic/skill.expert-swordsman
  interpretation: companions receives Expert Swordsman automatically. With a normal sword it rerolls failed
    charge hits once, but not with a double-handed weapon or without charging. Against equal WS the 4+
    hit probability becomes 3/4 with the reroll. A failed reroll is final.
  cases:
  - id: recipients
    roles:
    - grant
    - compiled
    operation: grant
    defender:
      collection: mordheim
      band_id: cursed-cavalcade
      profile_id: companions
    context:
      rule_id: companions--expert-swordsman
    expect:
      result.recipients:
      - companions
  - id: charge-consumer
    roles:
    - active
    - consumer
    - boundary
    operation: hit
    attacker:
      collection: mordheim
      band_id: cursed-cavalcade
      profile_id: companions
      main_weapon_id: weapon.sword
    context:
      first_round: true
      charging: true
    rolls:
    - key: hit
      value: 1
    - key: hit.reroll
      value: 6
    expect:
      result.success: true
      result.rerolled: true
      result.roll: 6
    expect_contains:
      attacker.global_effects.tags:
      - skill.expert-swordsman
  - id: all-charge-branches
    roles:
    - boundary
    operation: hit
    attacker:
      collection: mordheim
      band_id: cursed-cavalcade
      profile_id: companions
      main_weapon_id: weapon.sword
    defender:
      characteristics:
        weapon_skill: 4
        strength: 3
        toughness: 3
        wounds: 1
        initiative: 3
        attacks: 1
    context:
      first_round: true
      charging: true
    distribution:
      observable: result.success
      max_rolls: 2
      expected:
        'true': 3/4
        'false': 1/4
  - id: no-charge
    roles:
    - inactive
    operation: hit
    attacker:
      collection: mordheim
      band_id: cursed-cavalcade
      profile_id: companions
      main_weapon_id: weapon.sword
    context:
      first_round: true
      charging: false
    rolls:
    - key: hit
      value: 1
    expect:
      result.success: false
      result.rerolled: false
  - id: wrong-weapon
    roles:
    - inactive
    operation: hit
    attacker:
      collection: mordheim
      band_id: cursed-cavalcade
      profile_id: companions
      main_weapon_id: weapon.double-handed-weapon
    context:
      first_round: true
      charging: true
    rolls:
    - key: hit
      value: 1
    expect:
      result.success: false
      result.rerolled: false
  - id: failed-reroll-final
    roles:
    - boundary
    operation: hit
    attacker:
      collection: mordheim
      band_id: cursed-cavalcade
      profile_id: companions
      main_weapon_id: weapon.sword
    context:
      first_round: true
      charging: true
    rolls:
    - key: hit
      value: 1
    - key: hit.reroll
      value: 1
    expect:
      result.success: false
      result.rerolled: true
      result.roll: 1
  mutations:
  - id: remove-inherent-skill
    path: attacker.global_effects.tags
    value: []
    cases:
    - charge-consumer
    - all-charge-branches
