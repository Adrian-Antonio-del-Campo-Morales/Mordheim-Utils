specifications:
- id: editorial-incoming-hit-plague-bearers
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: local
  sources:
  - target: rule/mordheim/carnival-of-chaos/plague-bearers--cloud-of-flies/trait.cloud-of-flies
    digest: c466f29f52273869f8c10ed8993b57d54cb604897e3da2cc603250d01cb20af6
  interpretation: Henchmen / plague-bearers / Cloud of Flies imposes -1 on every close combat attack of
    the opponent, not on the bearer's own attacks. Neither charging nor the first round is a prerequisite.
    Against an attacker of WS3, the printed defender WS4 gives a base target 4+ and a modified target
    5+.
  cases:
  - id: exact-recipients
    roles:
    - grant
    - compiled
    operation: grant
    defender:
      collection: mordheim
      band_id: carnival-of-chaos
      profile_id: plague-bearers
    context:
      rule_id: plague-bearers--cloud-of-flies
    expect:
      result.recipients:
      - plague-bearers
  - id: face-1
    roles:
    - active
    - consumer
    - boundary
    operation: hit
    attacker:
      main_weapon_id: weapon.mace
    defender:
      collection: mordheim
      band_id: carnival-of-chaos
      profile_id: plague-bearers
    rolls:
    - key: hit
      value: 1
    expect:
      context.modifier: -1
      result.target: 5
      result.success: false
    expect_contains:
      defender.global_effects.tags:
      - cloud_of_flies
  - id: face-2
    roles:
    - active
    - consumer
    - boundary
    operation: hit
    attacker:
      main_weapon_id: weapon.mace
    defender:
      collection: mordheim
      band_id: carnival-of-chaos
      profile_id: plague-bearers
    rolls:
    - key: hit
      value: 2
    expect:
      context.modifier: -1
      result.target: 5
      result.success: false
    expect_contains:
      defender.global_effects.tags:
