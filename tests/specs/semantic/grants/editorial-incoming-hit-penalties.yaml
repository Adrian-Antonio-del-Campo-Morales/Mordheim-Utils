    - boundary
    operation: hit
    attacker:
      main_weapon_id: weapon.mace
    defender:
      collection: mordheim
      band_id: carnival-of-chaos
      profile_id: plague-bearers
    context:
      first_round: false
      charging: false
    distribution:
      observable: result.success
      max_rolls: 1
      expected:
        'true': 1/3
        'false': 2/3
  - id: round-false-charge-true
    roles:
    - active
    - boundary
    operation: hit
    attacker:
      main_weapon_id: weapon.mace
    defender:
      collection: mordheim
