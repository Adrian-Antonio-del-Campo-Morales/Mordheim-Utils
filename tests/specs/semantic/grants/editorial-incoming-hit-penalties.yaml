specifications:
- id: editorial-incoming-hit-plague-bearers
  scope_digest: ea4090654a79e79bb19b0855371a062c6a9a10c1ab40f7d8abdb42634a425b97
  category: local
  sources:
  - target: rule/mordheim/carnival-of-chaos/plague-bearers--cloud-of-flies/trait.cloud-of-flies
    digest: b06153173074513e630a61cd592670c4d9ce078466737c14627a4acc015c0fe9
  interpretation: Henchmen / plague-bearers / Cloud of Flies imposes -1 on every close combat attack of
    the opponent, not on the bearer's own attacks. Neither charging nor the first round is a prerequisite.
    Against an attacker of WS3, the printed defender WS4 gives a base target 4+ and a modified target
    5+.
  cases:
  - id: exact-recipients
    roles:
    - grant
    - compiled
    operation: grant
    defender:
      collection: mordheim
      band_id: carnival-of-chaos
      profile_id: plague-bearers
    context:
      rule_id: plague-bearers--cloud-of-flies
    expect:
      result.recipients:
      - plague-bearers
  - id: face-1
    roles:
    - active
    - consumer
    - boundary
    operation: hit
    attacker:
      main_weapon_id: weapon.mace
    defender:
      collection: mordheim
      band_id: carnival-of-chaos
      profile_id: plague-bearers
    rolls:
    - key: hit
      value: 1
    expect:
      context.modifier: -1
      result.target: 5
      result.success: false
    expect_contains:
      defender.global_effects.tags:
      - cloud_of_flies
  - id: face-2
    roles:
    - active
    - consumer
    - boundary
    operation: hit
    attacker:
      main_weapon_id: weapon.mace
    defender:
      collection: mordheim
      band_id: carnival-of-chaos
      profile_id: plague-bearers
    rolls:
    - key: hit
      value: 2
    expect:
      context.modifier: -1
      result.target: 5
      result.success: false
    expect_contains:
      defender.global_effects.tags:
      - cloud_of_flies
  - id: face-3
    roles:
    - active
