    distribution:
      observable: result.success
      max_rolls: 1
      expected:
        'true': 1/3
        'false': 2/3
  - id: round-true-charge-true
    roles:
    - active
    - boundary
    operation: hit
    attacker:
      main_weapon_id: weapon.mace
    defender:
      collection: mordheim
      band_id: carnival-of-chaos
      profile_id: plague-bearers
    context:
      first_round: true
      charging: true
    distribution:
      observable: result.success
      max_rolls: 1
      expected:
        'true': 1/3
        'false': 2/3
  - id: outgoing-attacks-unaffected
    roles:
    - inactive
    operation: hit
    attacker:
      collection: mordheim
      band_id: carnival-of-chaos
      profile_id: plague-bearers
    rolls:
    - key: hit
      value: 4
    expect:
      context.modifier: 0
      result.target: 3
      result.success: true
  - id: unprotected-opponent
    roles:
    - inactive
    operation: hit
    attacker:
      main_weapon_id: weapon.mace
    rolls:
    - key: hit
      value: 4
    expect:
      context.modifier: 0
      result.target: 4
      result.success: true
  mutations:
  - id: remove-incoming-penalty
    path: defender.global_effects.tags
    value: []
    cases:
    - face-4
    - round-false-charge-false
