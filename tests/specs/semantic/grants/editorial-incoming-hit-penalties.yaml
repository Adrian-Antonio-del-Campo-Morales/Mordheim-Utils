    operation: hit
    attacker:
      main_weapon_id: weapon.mace
    defender:
      collection: mordheim
      band_id: carnival-of-chaos
      profile_id: plague-bearers
    rolls:
    - key: hit
      value: 5
    expect:
      context.modifier: -1
