schema_version: 1
specifications:
- id: chapel-guard-squire-knighthood
  scope_digest: ea4090654a79e79bb19b0855371a062c6a9a10c1ab40f7d8abdb42634a425b97
  category: construction
  sources:
  - target: rule/mordheim/bretonnian-chapel-guard/squires--knighthood/compiler.knighthood
    digest: 61632bb2b6fbaddfb6127b911bae562997e7ef798b99db627a17211cc5ae8d58
  interpretation: On promotion, the Squire chooses to remain a Squire or become a Knight Errant. Both
    branches accept at most two ordinary lists; the second uses Knight Equipment, adds Special and receives
    Knight, Vain and Impetuous.
  cases:
  - id: recipient
    roles:
    - grant
    operation: grant
    defender:
      band_id: bretonnian-chapel-guard
      profile_id: squires
    context:
      rule_id: squires--knighthood
    expect:
      result.recipients:
      - squires
  - id: branch-equipment
    roles:
    - accepted
    - rejected
    operation: equipment_choices
    attacker:
      band_id: bretonnian-chapel-guard
      profile_id: squires
      variant_ids:
      - promotion.knight-errant
    context:
      choices:
        knight-flail:
          main_weapon_id: weapon.flail
        squire-halberd:
          main_weapon_id: weapon.halberd
    expect:
      result.accepted:
      - knight-flail
      result.rejected:
        squire-halberd: 'equipment is not available to bretonnian-chapel-guard/squires: [''weapon.halberd'']'
  - id: knight-rules-compiled
    operation: trait_presence
    attacker:
      band_id: bretonnian-chapel-guard
      profile_id: squires
      variant_ids:
      - promotion.knight-errant
    context:
      tag: rule.knight
    expect:
      result.present: true
    expect_contains:
      attacker.global_effects.tags:
      - promotion.knight-errant
      - rule.vain
      - rule.impetuous
  - id: at-most-two-lists
    roles:
    - rejected
    operation: selection_choices
    attacker:
      band_id: bretonnian-chapel-guard
      profile_id: squires
      variant_ids:
      - promotion.squire
    context:
      choices:
        two:
          skill_ids:
          - skill.expert-swordsman
          - skill.mighty-blow
        three:
          skill_ids:
          - skill.expert-swordsman
          - skill.mighty-blow
          - skill.acrobat
    expect:
      result.accepted:
      - two
      result.rejected:
        three: a promoted Squire may use at most two ordinary skill lists
  mutations:
  - id: remove-knight-rules
    path: attacker.global_effects.tags
    value: []
    cases:
    - knight-rules-compiled
