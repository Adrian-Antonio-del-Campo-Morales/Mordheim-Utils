schema_version: 1
specifications:
- id: selectable-hit-cloud
  scope_digest: ea4090654a79e79bb19b0855371a062c6a9a10c1ab40f7d8abdb42634a425b97
  category: local
  sources:
  - target: rule/mordheim/carnival-of-chaos/band--blessings-of-nurgle-cloud-of-flies/trait.cloud-of-flies
    digest: 3e87944e30ce1ccec6f9c535444401ef05c213ff93a871c172b3b7fc377b0b31
  interpretation: 'Blessings of Nurgle / Cloud of Flies: blessing bought only by Tainted Ones. It penalises
    each enemy attack, never one''s own; it requires neither a charge nor the first round. WS3 versus
    WS3 goes from 4+ to 5+.'
  cases:
  - id: recipients
    roles:
    - grant
    operation: selectable_grant
    defender:
      collection: mordheim
      band_id: carnival-of-chaos
      profile_id: tainted-ones
      special_rule_ids:
      - band--blessings-of-nurgle-cloud-of-flies
    context:
      rule_id: band--blessings-of-nurgle-cloud-of-flies
    expect:
      result.recipients:
      - tainted-ones
  - id: active-false-false
    roles:
    - active
    - consumer
    - boundary
    operation: hit
    defender:
      collection: mordheim
      band_id: carnival-of-chaos
      profile_id: tainted-ones
      special_rule_ids:
      - band--blessings-of-nurgle-cloud-of-flies
    attacker:
      main_weapon_id: weapon.mace
    context:
      first_round: false
      charging: false
    distribution:
      observable: result.success
      max_rolls: 1
      expected:
        'true': 1/3
        'false': 2/3
  - id: active-false-true
    roles:
    - active
    - consumer
    - boundary
    operation: hit
    defender:
      collection: mordheim
      band_id: carnival-of-chaos
      profile_id: tainted-ones
      special_rule_ids:
      - band--blessings-of-nurgle-cloud-of-flies
    attacker:
      main_weapon_id: weapon.mace
    context:
      first_round: false
      charging: true
    distribution:
      observable: result.success
      max_rolls: 1
      expected:
        'true': 1/3
        'false': 2/3
  - id: active-true-false
    roles:
    - active
    - consumer
    - boundary
    operation: hit
    defender:
      collection: mordheim
      band_id: carnival-of-chaos
      profile_id: tainted-ones
      special_rule_ids:
      - band--blessings-of-nurgle-cloud-of-flies
    attacker:
      main_weapon_id: weapon.mace
    context:
      first_round: true
      charging: false
    distribution:
      observable: result.success
      max_rolls: 1
      expected:
        'true': 1/3
        'false': 2/3
  - id: active-true-true
    roles:
    - active
    - consumer
    - boundary
    operation: hit
    defender:
      collection: mordheim
      band_id: carnival-of-chaos
      profile_id: tainted-ones
      special_rule_ids:
      - band--blessings-of-nurgle-cloud-of-flies
    attacker:
      main_weapon_id: weapon.mace
    context:
      first_round: true
      charging: true
    distribution:
      observable: result.success
      max_rolls: 1
      expected:
        'true': 1/3
        'false': 2/3
  - id: unselected
    roles:
    - inactive
    - consumer
    operation: hit
    defender:
      collection: mordheim
      band_id: carnival-of-chaos
      profile_id: tainted-ones
      special_rule_ids:
      - band--blessings-of-nurgle-bloated-foulness
    attacker:
      main_weapon_id: weapon.mace
    rolls:
    - key: hit
      value: 4
    expect:
      result.target: 4
      result.success: true
  - id: owner-unaffected
    roles:
    - inactive
    operation: hit
    attacker:
      collection: mordheim
      band_id: carnival-of-chaos
      profile_id: tainted-ones
      special_rule_ids:
      - band--blessings-of-nurgle-cloud-of-flies
    rolls:
    - key: hit
      value: 4
    expect:
      result.target: 4
      result.success: true
  - id: compiled
    roles:
    - compiled
    operation: compile
    defender:
      collection: mordheim
      band_id: carnival-of-chaos
      profile_id: tainted-ones
      special_rule_ids:
      - band--blessings-of-nurgle-cloud-of-flies
    expect:
      defender.characteristics.weapon_skill: 3
    expect_contains:
      defender.global_effects.tags:
      - cloud_of_flies
  mutations:
  - id: remove-flies
    path: defender.global_effects.tags
    value: []
    cases:
    - active-false-false
