schema_version: 1
specifications:
- id: selectable-hit-cloud
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: local
  sources:
  - target: rule/mordheim/carnival-of-chaos/band--blessings-of-nurgle-cloud-of-flies/trait.cloud-of-flies
    digest: 43eec70b4166d2e988e48b174d3e26ddf5a1b8703d0244cab4a3a81f62b7feb9
  interpretation: >-
    Blessings of Nurgle / Cloud of Flies: blessing bought only by Tainted Ones. It penalises each
    enemy attack, never one's own; it requires neither a charge nor the first round. WS3 versus WS3
    goes from 4+ to 5+.
  cases:
  - id: recipients
    roles:
    - grant
    operation: selectable_grant
    defender:
      collection: mordheim
      band_id: carnival-of-chaos
      profile_id: tainted-ones
      special_rule_ids:
      - band--blessings-of-nurgle-cloud-of-flies
    context:
      rule_id: band--blessings-of-nurgle-cloud-of-flies
    expect:
      result.recipients:
      - tainted-ones
  - id: active-false-false
    roles:
    - active
    - consumer
    - boundary
    operation: hit
    defender:
      collection: mordheim
      band_id: carnival-of-chaos
      profile_id: tainted-ones
      special_rule_ids:
      - band--blessings-of-nurgle-cloud-of-flies
    attacker:
      main_weapon_id: weapon.mace
    context:
      first_round: false
      charging: false
    distribution:
      observable: result.success
      max_rolls: 1
      expected:
        'true': 1/3
        'false': 2/3
  - id: active-false-true
    roles:
    - active
    - consumer
    - boundary
    operation: hit
    defender:
      collection: mordheim
      band_id: carnival-of-chaos
      profile_id: tainted-ones
      special_rule_ids:
      - band--blessings-of-nurgle-cloud-of-flies
    attacker:
      main_weapon_id: weapon.mace
    context:
      first_round: false
      charging: true
    distribution:
      observable: result.success
      max_rolls: 1
      expected:
        'true': 1/3
        'false': 2/3
  - id: active-true-false
    roles:
    - active
    - consumer
    - boundary
    operation: hit
    defender:
      collection: mordheim
      band_id: carnival-of-chaos
      profile_id: tainted-ones
      special_rule_ids:
      - band--blessings-of-nurgle-cloud-of-flies
    attacker:
      main_weapon_id: weapon.mace
    context:
      first_round: true
      charging: false
    distribution:
      observable: result.success
      max_rolls: 1
      expected:
        'true': 1/3
        'false': 2/3
  - id: active-true-true
    roles:
    - active
    - consumer
    - boundary
    operation: hit
    defender:
      collection: mordheim
      band_id: carnival-of-chaos
      profile_id: tainted-ones
      special_rule_ids:
      - band--blessings-of-nurgle-cloud-of-flies
    attacker:
      main_weapon_id: weapon.mace
    context:
      first_round: true
      charging: true
    distribution:
      observable: result.success
      max_rolls: 1
      expected:
        'true': 1/3
        'false': 2/3
  - id: unselected
    roles:
    - inactive
    - consumer
    operation: hit
    defender:
      collection: mordheim
      band_id: carnival-of-chaos
      profile_id: tainted-ones
      special_rule_ids:
      - band--blessings-of-nurgle-bloated-foulness
    attacker:
      main_weapon_id: weapon.mace
    rolls:
    - key: hit
      value: 4
    expect:
      result.target: 4
      result.success: true
  - id: owner-unaffected
    roles:
    - inactive
    operation: hit
    attacker:
      collection: mordheim
      band_id: carnival-of-chaos
      profile_id: tainted-ones
      special_rule_ids:
      - band--blessings-of-nurgle-cloud-of-flies
    rolls:
    - key: hit
      value: 4
    expect:
      result.target: 4
      result.success: true
  - id: compiled
    roles:
    - compiled
    operation: compile
    defender:
      collection: mordheim
      band_id: carnival-of-chaos
      profile_id: tainted-ones
      special_rule_ids:
      - band--blessings-of-nurgle-cloud-of-flies
    expect:
      defender.characteristics.weapon_skill: 3
    expect_contains:
      defender.global_effects.tags:
      - cloud_of_flies
  mutations:
  - id: remove-flies
    path: defender.global_effects.tags
    value: []
    cases:
    - active-false-false
- id: selectable-hit-stench
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: local
  sources:
  - target: rule/trollheim/khemri-necromancers/band--necromantic-modification-putrid-stench/special-rule.band--necromantic-modification-putrid-stench
    digest: 1b128bef9b0bd4a1bb1da66497c3e9a4a77fca05f6a0705e3f6f4e507b6a8105
  interpretation: >-
    Khemri p.56 / Putrid Stench: only living creatures suffer -1 when hitting the Abomination. WS3
    versus WS3 goes from 4+ to 5+; an undead keeps 4+.
  cases:
  - id: recipients
    roles:
    - grant
    operation: selectable_grant
    defender:
      collection: trollheim
      band_id: khemri-necromancers
      profile_id: necromantic-abomination
      special_rule_ids:
      - band--necromantic-modification-putrid-stench
    context:
      rule_id: band--necromantic-modification-putrid-stench
    expect:
      result.recipients:
      - necromantic-abomination
  - id: active-false-false
    roles:
    - active
    - consumer
    - boundary
    operation: hit
    defender:
      collection: trollheim
      band_id: khemri-necromancers
      profile_id: necromantic-abomination
      special_rule_ids:
      - band--necromantic-modification-putrid-stench
    attacker:
      main_weapon_id: weapon.mace
    context:
      first_round: false
      charging: false
    distribution:
      observable: result.success
      max_rolls: 1
      expected:
        'true': 1/3
        'false': 2/3
  - id: active-false-true
    roles:
    - active
    - consumer
    - boundary
    operation: hit
    defender:
      collection: trollheim
      band_id: khemri-necromancers
      profile_id: necromantic-abomination
      special_rule_ids:
      - band--necromantic-modification-putrid-stench
    attacker:
      main_weapon_id: weapon.mace
    context:
      first_round: false
      charging: true
    distribution:
      observable: result.success
      max_rolls: 1
      expected:
        'true': 1/3
        'false': 2/3
  - id: active-true-false
    roles:
    - active
    - consumer
    - boundary
    operation: hit
    defender:
      collection: trollheim
      band_id: khemri-necromancers
      profile_id: necromantic-abomination
      special_rule_ids:
      - band--necromantic-modification-putrid-stench
    attacker:
      main_weapon_id: weapon.mace
    context:
      first_round: true
      charging: false
    distribution:
      observable: result.success
      max_rolls: 1
      expected:
        'true': 1/3
        'false': 2/3
  - id: active-true-true
    roles:
    - active
    - consumer
    - boundary
    operation: hit
    defender:
      collection: trollheim
      band_id: khemri-necromancers
      profile_id: necromantic-abomination
      special_rule_ids:
      - band--necromantic-modification-putrid-stench
    attacker:
      main_weapon_id: weapon.mace
    context:
      first_round: true
      charging: true
    distribution:
      observable: result.success
      max_rolls: 1
      expected:
        'true': 1/3
        'false': 2/3
  - id: unselected
    roles:
    - inactive
    - consumer
    operation: hit
    defender:
      collection: trollheim
      band_id: khemri-necromancers
      profile_id: necromantic-abomination
      special_rule_ids: []
    attacker:
      main_weapon_id: weapon.mace
    rolls:
    - key: hit
      value: 4
    expect:
      result.target: 4
      result.success: true
  - id: owner-unaffected
    roles:
    - inactive
    operation: hit
    attacker:
      collection: trollheim
      band_id: khemri-necromancers
      profile_id: necromantic-abomination
      special_rule_ids:
      - band--necromantic-modification-putrid-stench
    rolls:
    - key: hit
      value: 4
    expect:
      result.target: 4
      result.success: true
  - id: undead-unaffected
    roles:
    - inactive
    - boundary
    operation: hit
    defender:
      collection: trollheim
      band_id: khemri-necromancers
      profile_id: necromantic-abomination
      special_rule_ids:
      - band--necromantic-modification-putrid-stench
    attacker:
      main_weapon_id: weapon.mace
      trait_overrides:
        undead_or_possessed: true
    rolls:
    - key: hit
      value: 4
    expect:
      result.target: 4
      result.success: true
  - id: compiled
    roles:
    - compiled
    operation: compile
    defender:
      collection: trollheim
      band_id: khemri-necromancers
      profile_id: necromantic-abomination
      special_rule_ids:
      - band--necromantic-modification-putrid-stench
    expect:
      defender.global_effects.incoming_hit_modifier: -1
  mutations:
  - id: remove-stench
    path: defender.global_effects.incoming_hit_modifier
    value: 0
    cases:
    - active-false-false
  - id: penalize-nonliving
    path: defender.global_effects.tags
    value: []
    cases: [undead-unaffected]
- id: selected-attributes-multiple-limbs
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: local
  sources:
  - target: rule/trollheim/khemri-necromancers/band--necromantic-modification-multiple-limbs/special-rule.band--necromantic-modification-multiple-limbs
    digest: ffb855e936bfff93056378ac623aee17a25123e0e531f76975119ed3a6161261
  interpretation: >-
    Khemri p.56 / Multiple Limbs: +1 Attack on top of the profile's two attacks; it requires neither a
    charge nor the first round. It does not replace an existing attack.
  cases:
  - id: recipients
    roles:
    - grant
    operation: selectable_grant
    defender:
      collection: trollheim
      band_id: khemri-necromancers
      profile_id: necromantic-abomination
      special_rule_ids:
      - band--necromantic-modification-multiple-limbs
    context:
      rule_id: band--necromantic-modification-multiple-limbs
    expect:
      result.recipients:
      - necromantic-abomination
  - id: active-false
    roles:
    - active
    - consumer
    - boundary
    operation: attacks
    attacker:
      collection: trollheim
      band_id: khemri-necromancers
      profile_id: necromantic-abomination
      special_rule_ids:
      - band--necromantic-modification-multiple-limbs
    context:
      first_round: false
    expect:
      result.attacks: 3
  - id: active-true
    roles:
    - active
    - consumer
    - boundary
    operation: attacks
    attacker:
      collection: trollheim
      band_id: khemri-necromancers
      profile_id: necromantic-abomination
      special_rule_ids:
      - band--necromantic-modification-multiple-limbs
    context:
      first_round: true
    expect:
      result.attacks: 3
  - id: unselected
    roles:
    - inactive
    operation: attacks
    attacker:
      collection: trollheim
      band_id: khemri-necromancers
      profile_id: necromantic-abomination
      special_rule_ids: []
    expect:
      result.attacks: 2
  - id: compiled
    roles:
    - compiled
    operation: compile
    attacker:
      collection: trollheim
      band_id: khemri-necromancers
      profile_id: necromantic-abomination
      special_rule_ids:
      - band--necromantic-modification-multiple-limbs
    expect:
      attacker.global_effects.attacks_bonus: 1
  mutations:
  - id: remove-bonus
    path: attacker.global_effects.attacks_bonus
    value: 0
    cases:
    - active-false
- id: selected-attributes-monstrosity
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: local
  sources:
  - target: rule/trollheim/chaos-streets-undead-bloodlines/band--strigoi-power-monstrosity/special-rule.band--strigoi-power-monstrosity
    digest: 5c96432379404109dbc7b455c0970a530bd279b92531b84ec5644ecadb23c9e4
  interpretation: >-
    Chaos in the Streets p.183 / Monstrosity: +1 Wound, without consuming the normal maximum. The
    initialisation must use the compiled wounds: a W2 profile becomes W3; an advanced W10 profile
    becomes W11.
  cases:
  - id: recipients
    roles:
    - grant
    operation: selectable_grant
    defender:
      collection: trollheim
      band_id: chaos-streets-undead-bloodlines
      profile_id: strigoi-vampire
      special_rule_ids:
      - band--strigoi-power-monstrosity
    context:
      rule_id: band--strigoi-power-monstrosity
    expect:
      result.recipients:
      - strigoi-vampire
  - id: active
    roles:
    - active
    - consumer
    operation: initialize
    attacker:
      collection: trollheim
      band_id: chaos-streets-undead-bloodlines
      profile_id: strigoi-vampire
      special_rule_ids:
      - band--strigoi-power-monstrosity
    expect:
      result.attacker.wounds: 3
  - id: unselected
    roles:
    - inactive
    operation: initialize
    attacker:
      collection: trollheim
      band_id: chaos-streets-undead-bloodlines
      profile_id: strigoi-vampire
      special_rule_ids: []
    expect:
      result.attacker.wounds: 2
  - id: above-normal
    roles:
    - boundary
    - consumer
    operation: initialize
    attacker:
      collection: trollheim
      band_id: chaos-streets-undead-bloodlines
      profile_id: strigoi-vampire
      special_rule_ids:
      - band--strigoi-power-monstrosity
      characteristics:
        weapon_skill: 4
        strength: 4
        toughness: 4
        wounds: 10
        initiative: 5
        attacks: 3
    expect:
      result.attacker.wounds: 11
  - id: compiled
    roles:
    - compiled
    operation: compile
    attacker:
      collection: trollheim
      band_id: chaos-streets-undead-bloodlines
      profile_id: strigoi-vampire
      special_rule_ids:
      - band--strigoi-power-monstrosity
    expect:
      attacker.characteristics.wounds: 3
  mutations:
  - id: remove-wound
    path: attacker.characteristics.wounds
    value: 2
    cases:
    - active
