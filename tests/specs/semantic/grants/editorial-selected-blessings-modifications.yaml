    - active
    - consumer
    - boundary
    operation: attacks
    attacker:
      collection: trollheim
      band_id: khemri-necromancers
      profile_id: necromantic-abomination
      special_rule_ids:
      - band--necromantic-modification-multiple-limbs
    context:
      first_round: false
    expect:
      result.attacks: 3
  - id: active-true
    roles:
    - active
    - consumer
    - boundary
    operation: attacks
    attacker:
      collection: trollheim
      band_id: khemri-necromancers
      profile_id: necromantic-abomination
      special_rule_ids:
      - band--necromantic-modification-multiple-limbs
    context:
      first_round: true
    expect:
      result.attacks: 3
  - id: unselected
    roles:
    - inactive
    operation: attacks
    attacker:
      collection: trollheim
      band_id: khemri-necromancers
      profile_id: necromantic-abomination
      special_rule_ids: []
    expect:
      result.attacks: 2
  - id: compiled
    roles:
    - compiled
    operation: compile
    attacker:
      collection: trollheim
      band_id: khemri-necromancers
      profile_id: necromantic-abomination
      special_rule_ids:
      - band--necromantic-modification-multiple-limbs
    expect:
      attacker.global_effects.attacks_bonus: 1
  mutations:
  - id: remove-bonus
    path: attacker.global_effects.attacks_bonus
    value: 0
    cases:
    - active-false
- id: selected-attributes-monstrosity
  scope_digest: ea4090654a79e79bb19b0855371a062c6a9a10c1ab40f7d8abdb42634a425b97
  category: local
  sources:
  - target: rule/trollheim/chaos-streets-undead-bloodlines/band--strigoi-power-monstrosity/special-rule.band--strigoi-power-monstrosity
    digest: 55ec16c8735d226910e818707d91fe406582f00530b883d8b60d2e0b0272c5b4
  interpretation: 'Chaos in the Streets p.183 / Monstrosity: +1 Wound, without consuming the normal maximum.
    The initialisation must use the compiled wounds: a W2 profile becomes W3; an advanced W10 profile
    becomes W11.'
  cases:
  - id: recipients
    roles:
    - grant
    operation: selectable_grant
    defender:
      collection: trollheim
      band_id: chaos-streets-undead-bloodlines
      profile_id: strigoi-vampire
      special_rule_ids:
      - band--strigoi-power-monstrosity
    context:
      rule_id: band--strigoi-power-monstrosity
    expect:
      result.recipients:
      - strigoi-vampire
  - id: active
    roles:
    - active
    - consumer
    operation: initialize
    attacker:
      collection: trollheim
      band_id: chaos-streets-undead-bloodlines
      profile_id: strigoi-vampire
      special_rule_ids:
      - band--strigoi-power-monstrosity
    expect:
      result.attacker.wounds: 3
  - id: unselected
    roles:
    - inactive
    operation: initialize
    attacker:
      collection: trollheim
      band_id: chaos-streets-undead-bloodlines
      profile_id: strigoi-vampire
      special_rule_ids: []
    expect:
      result.attacker.wounds: 2
  - id: above-normal
    roles:
    - boundary
    - consumer
    operation: initialize
    attacker:
      collection: trollheim
      band_id: chaos-streets-undead-bloodlines
      profile_id: strigoi-vampire
      special_rule_ids:
      - band--strigoi-power-monstrosity
      characteristics:
        weapon_skill: 4
        strength: 4
        toughness: 4
        wounds: 10
        initiative: 5
        attacks: 3
    expect:
      result.attacker.wounds: 11
  - id: compiled
    roles:
    - compiled
    operation: compile
    attacker:
      collection: trollheim
      band_id: chaos-streets-undead-bloodlines
      profile_id: strigoi-vampire
      special_rule_ids:
      - band--strigoi-power-monstrosity
    expect:
      attacker.characteristics.wounds: 3
  mutations:
  - id: remove-wound
    path: attacker.characteristics.wounds
    value: 2
    cases:
    - active
