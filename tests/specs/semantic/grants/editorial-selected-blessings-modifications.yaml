    attacker:
      main_weapon_id: weapon.mace
    context:
      first_round: false
      charging: true
    distribution:
      observable: result.success
      max_rolls: 1
      expected:
        'true': 1/3
        'false': 2/3
  - id: active-true-false
    roles:
    - active
    - consumer
    - boundary
    operation: hit
    defender:
      collection: trollheim
      band_id: khemri-necromancers
      profile_id: necromantic-abomination
