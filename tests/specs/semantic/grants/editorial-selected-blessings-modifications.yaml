- id: selected-blessings-mark-of-nurgle
  scope_digest: ea4090654a79e79bb19b0855371a062c6a9a10c1ab40f7d8abdb42634a425b97
  category: local
  sources:
  - target: rule/mordheim/carnival-of-chaos/band--blessings-of-nurgle-mark-of-nurgle/special-rule.band--blessings-of-nurgle-mark-of-nurgle
    digest: aefcc68bf16464671b8044b9c1f2041b98897afe1c4e60cb1e26934b2f63d288
  interpretation: 'Blessings of Nurgle / Mark of Nurgle: W1 becomes W2 plus immunity to all poisons. The
    consumer''s poison matrix is shared with Tears of Shallaya; here only the grant is checked without
    granting that preparation.'
  cases:
  - id: recipients
    roles:
    - grant
    operation: selectable_grant
    defender:
      collection: mordheim
      band_id: carnival-of-chaos
      profile_id: tainted-ones
      special_rule_ids:
      - band--blessings-of-nurgle-mark-of-nurgle
    context:
      rule_id: band--blessings-of-nurgle-mark-of-nurgle
    expect:
      result.recipients:
      - tainted-ones
  - id: wounds
    roles:
    - active
    - consumer
    operation: initialize
    attacker:
      collection: mordheim
      band_id: carnival-of-chaos
      profile_id: tainted-ones
      special_rule_ids:
      - band--blessings-of-nurgle-mark-of-nurgle
    expect:
      result.attacker.wounds: 2
  - id: without-blessing
    roles:
    - inactive
    operation: initialize
    attacker:
      collection: mordheim
      band_id: carnival-of-chaos
      profile_id: tainted-ones
      special_rule_ids:
      - band--blessings-of-nurgle-cloud-of-flies
    expect:
      result.attacker.wounds: 1
  - id: poison-immune
    roles:
    - active
    - consumer
    - boundary
    operation: strength
    attacker:
      main_weapon_id: weapon.mace
      main_poison_id: poison.black-venom
    defender:
      collection: mordheim
      band_id: carnival-of-chaos
      profile_id: tainted-ones
      special_rule_ids:
      - band--blessings-of-nurgle-mark-of-nurgle
    expect:
      result.wound: 3
      result.armour: 3
  - id: poison-control
    roles:
    - inactive
    - consumer
    operation: strength
    attacker:
      main_weapon_id: weapon.mace
      main_poison_id: poison.black-venom
    defender:
      collection: mordheim
      band_id: carnival-of-chaos
      profile_id: tainted-ones
      special_rule_ids:
      - band--blessings-of-nurgle-cloud-of-flies
    expect:
      result.wound: 4
      result.armour: 4
  - id: compiled
    roles:
    - compiled
    operation: compile
    attacker:
      collection: mordheim
      band_id: carnival-of-chaos
      profile_id: tainted-ones
      special_rule_ids:
      - band--blessings-of-nurgle-mark-of-nurgle
    expect:
      attacker.characteristics.wounds: 2
  mutations:
