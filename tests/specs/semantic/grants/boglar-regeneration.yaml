schema_version: 1
specifications:
- id: mordheim-boglars-regeneration
  scope_digest: ea4090654a79e79bb19b0855371a062c6a9a10c1ab40f7d8abdb42634a425b97
  category: contextual
  sources:
  - target: rule/mordheim/underworld-alliance-mim/boglars--regeneration/skill.regeneration-5-plus
    digest: b77614d9834a752cbc11a5fdeaa858b7294ad68d06e1cfbfe59b82b313e01004
  depends_on:
  - mechanic/skill.regeneration-5-plus
  interpretation: >-
    Underworld Alliance / Boglars / Regeneration: "Whenever an enemy successfully inflicts a wound
    on a Boglar, roll a D6; on a result of 5 or more the wound is ignored and the Boglar is unhurt.
    Boglars may not regenerate wounds caused by fire or fire-based magic." Only the Boglar receives
    this inherent threshold, the five is a boundary of the same die, and a blocked regeneration must
    not request a roll. Warpstone Troll keeps the separate 4+ regeneration and is not a recipient of
    this grant.
  cases:
  - id: recipient
    roles:
    - grant
    operation: grant
    defender:
      collection: mordheim
      band_id: underworld-alliance-mim
      profile_id: boglars
    context:
      rule_id: boglars--regeneration
    expect:
      result.recipients:
      - boglars
  - id: compiled
    roles:
    - compiled
    operation: compile
    defender:
      band_id: underworld-alliance-mim
      profile_id: boglars
    expect:
      defender.global_effects.regeneration_save: 5
      defender.global_effects.regeneration_blocked_by_fire: true
  - id: compiled-warpstone-troll-control
    roles:
    - compiled
    operation: compile
    defender:
      band_id: underworld-alliance-mim
      profile_id: warpstone-troll
    expect:
      defender.global_effects.regeneration_save: 4
      defender.global_effects.regeneration_blocked_by_fire: true
  - id: all-faces
    roles:
    - active
    - consumer
    - boundary
    operation: special_save
    defender:
      band_id: underworld-alliance-mim
      profile_id: boglars
    distribution:
      observable: result.saved
      max_rolls: 1
      expected:
        'true': 1/3
        'false': 2/3
  - id: four-fails
    roles:
    - boundary
    operation: special_save
    defender:
      band_id: underworld-alliance-mim
      profile_id: boglars
    rolls:
    - key: special.regeneration
      value: 4
    expect:
      result.saved: false
      result.ward_roll: null
      result.regeneration_roll: 4
  - id: five-saves
    roles:
    - boundary
    operation: special_save
    defender:
      band_id: underworld-alliance-mim
      profile_id: boglars
    rolls:
    - key: special.regeneration
      value: 5
    expect:
      result.saved: true
      result.source: regeneration
      result.ward_roll: null
      result.regeneration_roll: 5
  - id: fire-denies-roll
    roles:
    - inactive
    operation: special_save
    attacker:
      main_weapon_id: weapon.brazier-iron
    defender:
      band_id: underworld-alliance-mim
      profile_id: boglars
    expect:
      context.regeneration_save: 5
      context.regeneration_blocked: true
      result.saved: false
      result.regeneration_roll: null
  mutations:
  - id: wrong-threshold
    path: defender.global_effects.regeneration_save
    value: 4
    cases:
    - four-fails
  - id: allow-fire-regeneration
    path: defender.global_effects.regeneration_blocked_by_fire
    value: false
    cases:
    - fire-denies-roll
