schema_version: 1
specifications:
- id: vampiric-powers-bloodline-access
  scope_digest: ea4090654a79e79bb19b0855371a062c6a9a10c1ab40f7d8abdb42634a425b97
  category: construction
  sources:
  - target: rule/trollheim/chaos-streets-undead-bloodlines/band--vampiric-powers/compiler.vampiric-powers
    digest: e989353021ec717f5ec404ec6c8e1c4a872d60b6cfc36b105207a16cca7ca9d8
  interpretation: Each Vampire accesses only the powers of its own bloodline; choosing one does not alter
    the access of the other bloodlines.
  cases:
  - id: lahmia-list
    roles:
    - grant
    - accepted
    operation: special_rule_access
    attacker:
      collection: trollheim
      band_id: chaos-streets-undead-bloodlines
      profile_id: lahmia-vampire
    expect:
      result.rules:
      - band--lahmia-power-deceive
      - band--lahmia-power-lost-innocence
      - band--lahmia-power-seduction
      - band--vampire-power-hypnotic-gaze
  - id: blood-dragon-list
    roles:
    - boundary
    operation: special_rule_access
    attacker:
      collection: trollheim
      band_id: chaos-streets-undead-bloodlines
      profile_id: blood-dragon-vampire
    expect:
      result.rules:
      - band--blood-dragon-power-infallible
      - band--blood-dragon-power-red-fury
      - band--blood-dragon-power-strength-of-steel
      - band--blood-dragon-power-sword-master
  - id: foreign-power-rejected
    roles:
    - rejected
    operation: selection_choices
    attacker:
      collection: trollheim
      band_id: chaos-streets-undead-bloodlines
      profile_id: lahmia-vampire
    context:
      choices:
        own:
          special_rule_ids:
          - band--lahmia-power-lost-innocence
        foreign:
          special_rule_ids:
          - band--blood-dragon-power-red-fury
    expect:
      result.accepted:
      - own
      result.rejected:
        foreign: 'special rule is not available to chaos-streets-undead-bloodlines/lahmia-vampire: band--blood-dragon-power-red-fury'
  - id: contract
    operation: construction_tag_presence
    attacker:
      collection: trollheim
      band_id: chaos-streets-undead-bloodlines
      profile_id: lahmia-vampire
    context:
      tag: compiler.vampiric-powers
    expect:
      result.present: true
  mutations:
  - id: remove-vampiric-contract
    path: attacker.construction_tags
    value: []
    cases:
    - contract
