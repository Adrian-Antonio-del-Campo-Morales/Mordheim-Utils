schema_version: 1
specifications:
- id: editorial-blessed-sight-grant
  scope_digest: ea4090654a79e79bb19b0855371a062c6a9a10c1ab40f7d8abdb42634a425b97
  category: permanent
  sources:
  - target: rule/mordheim/sisters-of-sigmar/augur--blessed-sight/skill.blessed-sight
    digest: e076bf8a36419a905f39a31b6cdd1659d670d9bfa4aa887197c386d854eb70f8
  depends_on:
  - mechanic/skill.blessed-sight
  interpretation: Blessed Sight is an automatic profile rule belonging only to the Augur. Compiling that
    profile grants both the close-combat hit reroll and the characteristic-test reroll represented by
    the canonical mechanism.
  cases:
  - id: only-augur-receives-rule
    roles:
    - grant
    - compiled
    operation: grant
    defender:
      collection: mordheim
      band_id: sisters-of-sigmar
      profile_id: augur
    context:
      rule_id: augur--blessed-sight
    expect:
      result.recipients:
      - augur
    expect_contains:
      defender.global_effects.tags:
      - skill.blessed-sight
  - id: granted-characteristic-consumer
    roles:
    - active
    - boundary
    - consumer
    operation: characteristic_test
    attacker:
      collection: mordheim
      band_id: sisters-of-sigmar
      profile_id: augur
    context:
      value: 3
    distribution:
      observable: result.passed
      max_rolls: 2
      expected:
        'true': 3/4
        'false': 1/4
  mutations:
  - id: remove-profile-blessing
    path: attacker.global_effects.tags
    value: []
    cases:
    - granted-characteristic-consumer
