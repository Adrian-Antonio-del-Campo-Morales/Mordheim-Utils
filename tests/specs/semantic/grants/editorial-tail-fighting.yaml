schema_version: 1
specifications:
- id: skaven-tail-fighting-mordheim-and-trollheim
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: local
  sources:
  - target: rule/mordheim/skaven-clan-eshin/band--skaven-special-skills-tail-fighting/special-rule.band--skaven-special-skills-tail-fighting
    digest: 66a2c76dcc2c5698e85edb9c0a723664117ba0d7155d08cadfca2c8da546f4de
  - target: rule/trollheim/trollheim-skaven-clan-eshin/band--skaven-special-skills-tail-fighting/special-rule.band--skaven-special-skills-tail-fighting
    digest: 0b4ff2618db2a66a660ce5469589d0f1f3e51258bd3c353e5b731e86d7347bf2
  interpretation: Tail Fighting is a skill selectable by the four hero profiles. A dagger or sword on
    the tail creates a separate attack with that weapon; a shield creates no attack and improves the save
    by one. No other objects are allowed.
  cases:
  - id: mordheim-recipients
    roles:
    - grant
    operation: selectable_grant
    defender:
      band_id: skaven-clan-eshin
      profile_id: assassin-adept
    context:
      rule_id: band--skaven-special-skills-tail-fighting
    expect:
      result.recipients:
      - assassin-adept
      - black-skaven
      - eshin-sorcerer
      - night-runners
  - id: trollheim-recipients
    roles:
    - grant
    operation: selectable_grant
    defender:
      collection: trollheim
      band_id: trollheim-skaven-clan-eshin
      profile_id: assassin-adept
    context:
      rule_id: band--skaven-special-skills-tail-fighting
    expect:
      result.recipients:
      - assassin-adept
      - black-skaven
      - eshin-sorcerer
      - night-runners
  - id: sword-tail-attack
    roles:
    - compiled
    - active
    - consumer
    - boundary
    operation: extra_attack
    attacker:
      band_id: skaven-clan-eshin
      profile_id: assassin-adept
      special_rule_ids:
      - band--skaven-special-skills-tail-fighting
      extra_hand_id: weapon.sword
    defender:
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 2
        initiative: 3
        attacks: 1
    rolls:
    - key: test.hit
      value: 4
    - key: test.wound
      value: 4
    expect:
      result.wounded: true
      result.defender.wounds: 1
    expect_contains:
      attacker.extra_attacks.0.tags:
      - weapon.sword
  - id: shield-tail-save
    roles:
    - active
    - consumer
    - boundary
    operation: armour
    attacker:
      main_weapon_id: weapon.mace
    defender:
      band_id: skaven-clan-eshin
      profile_id: assassin-adept
      special_rule_ids:
      - band--skaven-special-skills-tail-fighting
      extra_hand_id: defence.shield
    rolls:
    - key: armour
      value: 5
    expect:
      defender.extra_attacks: []
      result.target: 5
      result.saved: true
  - id: ordinary-profile-control
    roles:
    - inactive
    operation: attacks
    attacker:
      band_id: skaven-clan-eshin
      profile_id: assassin-adept
    expect:
      result.attacks: 1
  mutations:
  - id: weaken-tail-weapon
    path: attacker.extra_attacks.0.fixed_strength
    value: 1
    cases:
    - sword-tail-attack
  - id: remove-tail-shield
    path: defender.armour_save
    value: 7
    cases:
    - shield-tail-save
