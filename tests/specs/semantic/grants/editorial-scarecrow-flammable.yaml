schema_version: 1
specifications:
- id: editorial-scarecrow-flammable-and-ignition
  scope_digest: 5fd7034eceb69daeeac4b0ad8bba9f2bc5ba50ca65a102d49b69e25f85d18dc9
  category: stateful
  sources:
  - target: rule/mordheim/restless-dead/scarecrows--flammable/trait.flammable
    digest: ecfccf8d7a3ef72d00a17152b1090f4ee9725d69c98ddcc6584c15aabcd3a78e
  - target: rule/mordheim/restless-dead/scarecrows--flammable/trait.caught-fire-threshold
    digest: ecfccf8d7a3ef72d00a17152b1090f4ee9725d69c98ddcc6584c15aabcd3a78e
  interpretation: Fire causes two wounds and sets the Scarecrow alight on 3+. A non-fire attack neither
    uses the threshold nor doubles the damage.
  cases:
  - id: recipients
    roles:
    - grant
    - compiled
    operation: grant
    defender:
      collection: mordheim
      band_id: restless-dead
      profile_id: scarecrows
    context:
      rule_id: scarecrows--flammable
    expect:
      result.recipients:
      - scarecrows
  - id: ignition-three-and-double-damage
    roles:
    - active
    - consumer
    - sequence
    - consumption
    - boundary
    operation: attack
    attacker:
      main_weapon_id: weapon.brazier-iron
      characteristics:
        weapon_skill: 3
        strength: 4
        toughness: 3
        wounds: 1
        initiative: 3
        attacks: 1
    defender:
      collection: mordheim
      band_id: restless-dead
      profile_id: scarecrows
    defender_state:
      wounds: 3
    rolls:
    - key: test.hit
      value: 4
    - key: test.ignition
      value: 3
    - key: test.wound
      value: 4
    expect_contains:
      defender.global_effects.tags:
      - flammable
    expect:
      defender.global_effects.caught_fire_threshold: 3
      result.damage: 2
      result.defender.wounds: 1
      result.defender.on_fire: true
  - id: ignition-two-fails
    roles:
    - boundary
    - sequence
    operation: attack
    attacker:
      main_weapon_id: weapon.brazier-iron
      characteristics:
        weapon_skill: 3
        strength: 4
        toughness: 3
        wounds: 1
        initiative: 3
        attacks: 1
    defender:
      collection: mordheim
      band_id: restless-dead
      profile_id: scarecrows
    defender_state:
      wounds: 3
    rolls:
    - key: test.hit
      value: 4
    - key: test.ignition
      value: 2
    - key: test.wound
      value: 4
    expect:
      result.damage: 2
      result.defender.on_fire: false
  - id: ordinary-target-needs-four-and-takes-one-damage
    roles:
    - inactive
    - boundary
    operation: attack
    attacker:
      main_weapon_id: weapon.brazier-iron
      characteristics:
        weapon_skill: 3
        strength: 4
        toughness: 3
        wounds: 1
        initiative: 3
        attacks: 1
    defender_state:
      wounds: 3
    rolls:
    - key: test.hit
      value: 4
    - key: test.ignition
      value: 3
    - key: test.wound
      value: 4
    expect:
      result.damage: 1
      result.defender.wounds: 2
      result.defender.on_fire: false
  - id: non-fire-does-not-double
    roles:
    - inactive
    - consumption
    operation: attack
    attacker:
      main_weapon_id: weapon.mace
      characteristics:
        weapon_skill: 3
        strength: 4
        toughness: 3
        wounds: 1
        initiative: 3
        attacks: 1
    defender:
      collection: mordheim
      band_id: restless-dead
      profile_id: scarecrows
    defender_state:
      wounds: 3
    rolls:
    - key: test.hit
      value: 4
    - key: test.wound
      value: 4
    expect:
      result.damage: 1
      result.defender.wounds: 2
      result.defender.on_fire: false
  mutations:
  - id: remove-flammable
    path: defender.global_effects.tags
    value:
    - injury_reroll_out
    cases:
    - ignition-three-and-double-damage
  - id: restore-normal-ignition-threshold
    path: defender.global_effects.caught_fire_threshold
    value: 4
    cases:
    - ignition-three-and-double-damage
