schema_version: 1
specifications:
- id: wild-beasts-charge-attack
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: contextual
  sources:
  - {target: rule/mordheim/cursed-cavalcade/wild-beasts--charge/trait.first-round-charge-attack-bonus, digest: eb16343256b672a71c362eae26825aa0663bcad313427debffebe573264331bd}
  interpretation: Wild Beasts obtienen +1 Ataque solo durante el primer turno de combate en que cargan.
    Su perfil A2 pasa a A3; ser cargadas, cargar en una ronda posterior o la primera ronda sin carga no lo activa.
  cases:
  - id: recipient
    roles: [grant]
    operation: grant
    defender: {band_id: cursed-cavalcade, profile_id: wild-beasts}
    context: {rule_id: wild-beasts--charge}
    expect: {result.recipients: [wild-beasts]}
  - id: first-false-charging-false
    roles: [inactive, boundary]
    operation: attacks
    attacker: {band_id: cursed-cavalcade, profile_id: wild-beasts}
    context: {first_round: false, charging: false}
    expect: {result.attacks: 2}
  - id: first-false-charging-true
    roles: [inactive, boundary]
    operation: attacks
    attacker: {band_id: cursed-cavalcade, profile_id: wild-beasts}
    context: {first_round: false, charging: true}
    expect: {result.attacks: 2}
  - id: first-true-charging-false
    roles: [inactive, boundary]
    operation: attacks
    attacker: {band_id: cursed-cavalcade, profile_id: wild-beasts}
    context: {first_round: true, charging: false}
    expect: {result.attacks: 2}
  - id: first-true-charging-true
    roles: [compiled, active, consumer, boundary]
    operation: attacks
    attacker: {band_id: cursed-cavalcade, profile_id: wild-beasts}
    context: {first_round: true, charging: true}
    expect: {attacker.global_effects.first_round_charge_attacks_bonus: 1, result.attacks: 3}
  - id: neighbouring-bear-control
    roles: [inactive]
    operation: attacks
    attacker: {band_id: cursed-cavalcade, profile_id: great-bear}
    context: {first_round: true, charging: true}
    expect: {result.attacks: 2}
  mutations:
  - id: remove-charge-bonus
    path: attacker.global_effects.first_round_charge_attacks_bonus
    value: 0
    cases: [first-true-charging-true]
- id: tilean-cloak-as-buckler
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: local
  sources:
  - {target: rule/mordheim/tileans/duelists--cloak-dagger/trait.counts-as-buckler, digest: a6c13995f04fbf99f588485a417df8ed2c8c8feb1403225ad568828855e9a60e}
  interpretation: La capa cuenta como rodela en cuerpo a cuerpo y concede una parada ordinaria.
    Debe superar la tirada de impacto; no permite igualarla, no para un seis ni concede armadura.
  cases:
  - id: recipient
    roles: [grant]
    operation: grant
    defender: {band_id: tileans, profile_id: duelists}
    context: {rule_id: duelists--cloak-dagger}
    expect: {result.recipients: [duelists]}
  - id: parry-distribution
    roles: [compiled, active, consumer, boundary]
    operation: parry
    attacker: {main_weapon_id: weapon.mace}
    defender: {band_id: tileans, profile_id: duelists, main_weapon_id: weapon.dagger}
    context: {hit_roll: 4}
    distribution:
      observable: result.blocked
      max_rolls: 1
      expected: {'true': 1/3, 'false': 2/3}
  - id: equality-fails
    roles: [boundary]
    operation: parry
    defender: {band_id: tileans, profile_id: duelists}
    context: {hit_roll: 4}
    rolls: [{key: test.parry, value: 4}]
    expect: {result.attempted: true, result.blocked: false}
  - id: six-unparryable
    roles: [inactive, boundary]
    operation: parry
    defender: {band_id: tileans, profile_id: duelists}
    context: {hit_roll: 6}
    expect: {result.attempted: false, result.blocked: false}
  - id: no-armour
    roles: [inactive]
    operation: armour
    attacker: {main_weapon_id: weapon.sword}
    defender: {band_id: tileans, profile_id: duelists}
    expect: {result.eligible: false, result.saved: false}
  - id: warrior-control
    roles: [inactive]
    operation: parry
    defender: {band_id: tileans, profile_id: warriors}
    expect: {result.attempted: false, result.blocked: false}
  mutations:
  - id: remove-cloak-parry
    path: defender.global_effects.parry
    value: false
    cases: [parry-distribution]
