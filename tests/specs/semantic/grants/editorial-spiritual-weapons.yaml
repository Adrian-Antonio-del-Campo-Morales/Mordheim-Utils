schema_version: 1
specifications:
- id: editorial-spirits-spiritual-weapons
  scope_digest: ea4090654a79e79bb19b0855371a062c6a9a10c1ab40f7d8abdb42634a425b97
  category: local
  sources:
  - target: rule/trollheim/khemri-lahmian-brotherhood/spirits--spiritual-weapons/trait.spiritual-weapons
    digest: afae0c391a40177afd0c6ef8108563c7337c8ff3d316b84547a162afcd298f35
  interpretation: All of the Spirit's weapons use a natural 5+ critical threshold. The rule does not turn
    an insufficient to-wound result into a wound.
  cases:
  - id: recipients
    roles:
    - grant
    - compiled
    operation: grant
    defender:
      collection: trollheim
      band_id: khemri-lahmian-brotherhood
      profile_id: spirits
    context:
      rule_id: spirits--spiritual-weapons
    expect:
      result.recipients:
      - spirits
  - id: natural-five-is-critical
    roles:
    - active
    - consumer
    - boundary
    operation: wound
    attacker:
      collection: trollheim
      band_id: khemri-lahmian-brotherhood
      profile_id: spirits
    rolls:
    - key: wound
      value: 5
    expect:
      context.critical_threshold: 5
      result.success: true
      result.critical: true
    expect_contains:
      attacker.global_effects.tags:
      - spiritual_weapons
  - id: natural-four-is-not-critical
    roles:
    - boundary
    operation: wound
    attacker:
      collection: trollheim
      band_id: khemri-lahmian-brotherhood
      profile_id: spirits
    rolls:
    - key: wound
      value: 4
    expect:
      result.success: true
      result.critical: false
  - id: five-cannot-overcome-six-required
    roles:
    - boundary
    operation: wound
    attacker:
      collection: trollheim
      band_id: khemri-lahmian-brotherhood
      profile_id: spirits
    defender:
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 6
        wounds: 3
        initiative: 3
        attacks: 1
    rolls:
    - key: wound
      value: 5
    expect:
      result.success: false
      result.critical: false
  - id: ordinary-fighter-five-is-not-critical
    roles:
    - inactive
    operation: wound
    attacker:
      main_weapon_id: weapon.sword
    rolls:
    - key: wound
      value: 5
    expect:
      context.critical_threshold: 6
      result.success: true
      result.critical: false
  mutations:
  - id: remove-spiritual-weapons
    path: attacker.global_effects.tags
    value: []
    cases:
    - natural-five-is-critical
