schema_version: 1
specifications:
- id: editorial-infallible-grant
  scope_digest: ea4090654a79e79bb19b0855371a062c6a9a10c1ab40f7d8abdb42634a425b97
  category: permanent
  sources:
  - target: rule/trollheim/chaos-streets-undead-bloodlines/band--blood-dragon-power-infallible/skill.infallible
    digest: 9a2f4a42a3c1a4fbab7aae72bff1d5e9b06f5ba224231cd1dff0a2913f6ba88a
  depends_on:
  - mechanic/skill.infallible
  interpretation: Infallible is a selectable Blood Dragon power available only to the Blood Dragon Vampire
    profile. Selection compiles the canonical charge-only failed-hit reroll; no other Vampire bloodline
    receives it.
  cases:
  - id: only-blood-dragon-vampire
    roles:
    - grant
    - compiled
    operation: selectable_grant
    defender:
      collection: trollheim
      band_id: chaos-streets-undead-bloodlines
      profile_id: blood-dragon-vampire
    context:
      rule_id: band--blood-dragon-power-infallible
    expect:
      result.recipients:
      - blood-dragon-vampire
  - id: granted-consumer
    roles:
    - active
    - boundary
    - consumer
    operation: hit
    attacker:
      collection: trollheim
      band_id: chaos-streets-undead-bloodlines
      profile_id: blood-dragon-vampire
      special_rule_ids:
      - band--blood-dragon-power-infallible
    context:
      charging: true
    rolls:
    - key: hit
      value: 1
    - key: hit.reroll
      value: 6
    expect:
      result.success: true
      result.rerolled: true
      result.roll: 6
  mutations:
  - id: remove-granted-infallible
    changes:
    - path: attacker.global_effects.tags
      value: []
    - path: attacker.global_effects.charge_reroll_hits
      value: false
    cases:
    - granted-consumer
