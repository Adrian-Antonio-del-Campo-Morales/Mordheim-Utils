schema_version: 1
specifications:
- id: strigoi-curse-of-the-reborn
  scope_digest: ea4090654a79e79bb19b0855371a062c6a9a10c1ab40f7d8abdb42634a425b97
  category: contextual
  sources:
  - target: mechanic/skill.regeneration-blocked-by-blessed
    digest: 37a372cfbaba83bbdfc590c46b6f899a77217a521059c7f2aa2f6e2e67b21445
  - target: rule/trollheim/chaos-streets-undead-bloodlines/band--strigoi-power-curse-of-the-reborn/skill.regeneration
    digest: 5a0404a3d5b8408748a0b859077e1ff85ccc730cfb10508541905fe98d00dd28
  - target: rule/trollheim/chaos-streets-undead-bloodlines/band--strigoi-power-curse-of-the-reborn/skill.regeneration-blocked-by-blessed
    digest: 5a0404a3d5b8408748a0b859077e1ff85ccc730cfb10508541905fe98d00dd28
  depends_on:
  - mechanic/skill.regeneration
  interpretation: Curse of the Reborn regenerates each unsaved wound on 4+. Fire and blessed attacks skip
    the roll completely. Only the Strigoi can select the power.
  cases:
  - id: recipient
    roles:
    - grant
    - compiled
    operation: selectable_grant
    defender:
      collection: trollheim
      band_id: chaos-streets-undead-bloodlines
      profile_id: strigoi-vampire
    context:
      rule_id: band--strigoi-power-curse-of-the-reborn
    expect:
      result.recipients:
      - strigoi-vampire
  - id: ordinary-distribution
    roles:
    - active
    - consumer
    - boundary
    operation: special_save
    defender:
      collection: trollheim
      band_id: chaos-streets-undead-bloodlines
      profile_id: strigoi-vampire
      special_rule_ids:
      - band--strigoi-power-curse-of-the-reborn
    distribution:
      observable: result.saved
      max_rolls: 1
      expected:
        'true': 1/2
        'false': 1/2
  - id: fire-blocks-without-roll
    roles:
    - inactive
    - boundary
    operation: special_save
    attacker:
      main_weapon_id: weapon.brazier-iron
    defender:
      collection: trollheim
      band_id: chaos-streets-undead-bloodlines
      profile_id: strigoi-vampire
      special_rule_ids:
      - band--strigoi-power-curse-of-the-reborn
    expect:
      context.regeneration_blocked: true
      result.regeneration_roll: null
      result.saved: false
  - id: blessed-blocks-without-roll
    roles:
    - inactive
    - consumer
    - boundary
    operation: special_save
    defender:
      collection: trollheim
      band_id: chaos-streets-undead-bloodlines
      profile_id: strigoi-vampire
      special_rule_ids:
      - band--strigoi-power-curse-of-the-reborn
    context:
      incoming_tags:
      - attack.blessed
    expect:
      context.regeneration_blocked: true
      result.regeneration_roll: null
      result.saved: false
  - id: ordinary-three-fails
    roles:
    - boundary
    operation: special_save
    defender:
      collection: trollheim
      band_id: chaos-streets-undead-bloodlines
      profile_id: strigoi-vampire
      special_rule_ids:
      - band--strigoi-power-curse-of-the-reborn
    rolls:
    - key: special.regeneration
      value: 3
    expect:
      result.saved: false
      result.regeneration_roll: 3
  mutations:
  - id: remove-regeneration
    path: defender.global_effects.regeneration_save
    value: 7
    cases:
    - ordinary-distribution
  - id: allow-blessed-regeneration
    path: defender.global_effects.regeneration_blocked_by_blessed
    value: false
    cases:
    - blessed-blocks-without-roll
