    - grant
    - compiled
    operation: compile
    attacker:
      collection: mordheim
      band_id: cult-of-the-possessed
      profile_id: mutants
      special_rule_ids:
      - band--mutations-spines
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 3
        attacks: 1
    expect_contains:
      attacker.global_effects.tags:
