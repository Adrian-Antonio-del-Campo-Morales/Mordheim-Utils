schema_version: 1
specifications:
- id: editorial-strength-of-steel-grant
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: contextual
  sources:
  - target: rule/trollheim/chaos-streets-undead-bloodlines/band--blood-dragon-power-strength-of-steel/skill.strength-of-steel
    digest: 468119a6ea54efc7483420a909054d7a70a56012c9841318ed0fae5575d946e9
  depends_on: [mechanic/skill.strength-of-steel]
  interpretation: Strength of Steel is selectable only by the Blood Dragon Vampire. It adds one point to the effective
    Strength used for wounding and armour modification during a charge, without changing the permanent characteristic.
  cases:
  - id: only-blood-dragon-vampire
    roles: [grant, compiled]
    operation: selectable_grant
    defender:
      collection: trollheim
      band_id: chaos-streets-undead-bloodlines
      profile_id: blood-dragon-vampire
    context: {rule_id: band--blood-dragon-power-strength-of-steel}
    expect: {result.recipients: [blood-dragon-vampire]}
  - id: granted-on-charge
    roles: [active, boundary, consumer]
    operation: strength
    attacker:
      collection: trollheim
      band_id: chaos-streets-undead-bloodlines
      profile_id: blood-dragon-vampire
      special_rule_ids: [band--blood-dragon-power-strength-of-steel]
      main_weapon_id: weapon.dagger
    context: {first_round: true, charging: true}
    expect:
      attacker.characteristics.strength: 4
      attacker.global_effects.charge_strength_bonus: 1
      result.wound: 5
      result.armour: 5
  - id: granted-outside-charge
    roles: [inactive]
    operation: strength
    attacker:
      collection: trollheim
      band_id: chaos-streets-undead-bloodlines
      profile_id: blood-dragon-vampire
      special_rule_ids: [band--blood-dragon-power-strength-of-steel]
      main_weapon_id: weapon.dagger
    expect:
      attacker.characteristics.strength: 4
      result.wound: 4
      result.armour: 4
  mutations:
  - id: remove-charge-strength
    path: attacker.global_effects.charge_strength_bonus
    value: 0
    cases: [granted-on-charge]
