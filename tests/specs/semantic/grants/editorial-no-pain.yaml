- id: grant-mordheim-restless-dead-liche--no-pain
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: local
  sources:
  - target: rule/mordheim/restless-dead/liche--no-pain/skill.ignore-pain
    digest: ab4a8cc372858a04a74c56e791a74c43bd889f86ad2f9011b68bad4612ca193f
  interpretation: The named profile treats a Stunned injury as Knocked Down. The rule's recipient is the
    named profile, not every profile in the warband. All six faces are transcribed independently from
    that replacement and the normal injury table.
  cases:
  - id: compiled-recipient
    roles:
    - compiled
    - grant
    operation: grant
    defender:
      collection: mordheim
      band_id: restless-dead
      profile_id: liche
    context:
      rule_id: liche--no-pain
    expect:
      result.recipients:
      - liche
    expect_contains:
      defender.global_effects.tags:
      - skill.ignore-pain
  - id: injury-1
    roles:
    - inactive
    - boundary
    operation: injury
    defender:
      collection: mordheim
      band_id: restless-dead
      profile_id: liche
    rolls:
    - key: test.injury
      value: 1
    expect:
      result.condition: KNOCKED_DOWN
