    roles:
    - compiled
    - grant
    operation: grant
    defender:
      collection: mordheim
      band_id: restless-dead
      profile_id: liche
    context:
      rule_id: liche--no-pain
    expect:
      result.recipients:
      - liche
    expect_contains:
      defender.global_effects.tags:
      - skill.ignore-pain
  - id: injury-1
    roles:
