    digest: 704fb5415f57c34b8680299c486335f9d7f20e79460e40296787008f674b5032
  interpretation: The named profile treats a Stunned injury as Knocked Down. The rule's recipient is the named profile,
    not every profile in the warband. All six faces are transcribed independently from that replacement and the
    normal injury table.
