schema_version: 1
specifications:
- id: editorial-injury-lahmian-no-pain
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: local
  sources:
  - target: rule/trollheim/khemri-lahmian-brotherhood/band--no-pain/skill.ignore-pain
    digest: 2629975fd7dfba00d034bb10505712836b17cf248735ea6d5bbe04749d04893b
  depends_on: [mechanic/skill.ignore-pain]
  interpretation: Khemri p.85, Undead Special Rules / No Pain, applies to the Vampire, Skeleton Warriors
    and Spirits explicitly described as Undead on pp.86-89. Living band members do not receive it.
    Only Stunned becomes Knocked Down; Out of Action remains unchanged.
  cases:
  - id: exact-recipients
    roles: [grant, compiled]
    operation: grant
    defender: {collection: trollheim, band_id: khemri-lahmian-brotherhood, profile_id: skeleton-warriors}
    context: {rule_id: band--no-pain}
    expect: {result.recipients: [lahmian-vampire, skeleton-warriors, spirits]}
  - id: granted-lahmian-vampire
    roles: [active, consumer]
    operation: injury
    defender: {collection: trollheim, band_id: khemri-lahmian-brotherhood, profile_id: lahmian-vampire}
    rolls: [{key: test.injury, value: 3}]
    expect: {result.condition: KNOCKED_DOWN}
    expect_contains:
      defender.global_effects.tags: [skill.ignore-pain]
  - id: granted-skeleton-warriors
    roles: [active, consumer]
    operation: injury
    defender: {collection: trollheim, band_id: khemri-lahmian-brotherhood, profile_id: skeleton-warriors}
    rolls: [{key: test.injury, value: 3}]
    expect: {result.condition: KNOCKED_DOWN}
    expect_contains:
      defender.global_effects.tags: [skill.ignore-pain]
  - id: granted-spirits
    roles: [active, consumer]
    operation: injury
    defender: {collection: trollheim, band_id: khemri-lahmian-brotherhood, profile_id: spirits}
    rolls: [{key: test.injury, value: 3}]
    expect: {result.condition: KNOCKED_DOWN}
    expect_contains:
      defender.global_effects.tags: [skill.ignore-pain]
  - id: excluded-necromancer
    roles: [inactive]
    operation: injury
    defender: {collection: trollheim, band_id: khemri-lahmian-brotherhood, profile_id: necromancer}
    rolls: [{key: test.injury, value: 3}]
    expect: {result.condition: STUNNED}
  - id: excluded-beloved
    roles: [inactive]
    operation: injury
    defender: {collection: trollheim, band_id: khemri-lahmian-brotherhood, profile_id: beloved}
    rolls: [{key: test.injury, value: 3}]
    expect: {result.condition: STUNNED}
  - id: excluded-blood-sister
    roles: [inactive]
    operation: injury
    defender: {collection: trollheim, band_id: khemri-lahmian-brotherhood, profile_id: blood-sister}
    rolls: [{key: test.injury, value: 3}]
    expect: {result.condition: STUNNED}
  - id: excluded-lackeys
    roles: [inactive]
    operation: injury
    defender: {collection: trollheim, band_id: khemri-lahmian-brotherhood, profile_id: lackeys}
    rolls: [{key: test.injury, value: 3}]
    expect: {result.condition: STUNNED}
  - id: excluded-blood-slaves
    roles: [inactive]
    operation: injury
    defender: {collection: trollheim, band_id: khemri-lahmian-brotherhood, profile_id: blood-slaves}
    rolls: [{key: test.injury, value: 3}]
    expect: {result.condition: STUNNED}
  - id: excluded-black-hounds
    roles: [inactive]
    operation: injury
    defender: {collection: trollheim, band_id: khemri-lahmian-brotherhood, profile_id: black-hounds}
    rolls: [{key: test.injury, value: 3}]
    expect: {result.condition: STUNNED}
  - id: excluded-jackals
    roles: [inactive]
    operation: injury
    defender: {collection: trollheim, band_id: khemri-lahmian-brotherhood, profile_id: jackals}
    rolls: [{key: test.injury, value: 3}]
    expect: {result.condition: STUNNED}
  - id: complete-table
    roles: [boundary]
    operation: injury
    defender: {collection: trollheim, band_id: khemri-lahmian-brotherhood, profile_id: skeleton-warriors}
    distribution:
      observable: result.condition
      max_rolls: 1
      expected: {KNOCKED_DOWN: 2/3, OUT: 1/3}
  mutations:
  - id: remove-no-pain
    path: defender.global_effects.tags
    value: []
    cases: [granted-skeleton-warriors, complete-table]
- id: editorial-injury-lizardmen-hardened-skin
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: local
  sources:
  - target: rule/trollheim/lustria-lizardmen/band--lizardmen-special-skills-hardened-skin/skill.hard-to-kill
    digest: 9852989f9b51a49745d9e1b36c5886b9cd1f4744e1d9eb71919d278743c8a9c1
  depends_on: [mechanic/skill.hard-to-kill]
  interpretation: Lustria p.57, Lizardmen Special Skills / Hardened Skin, restricts this choice to Saurus Heroes.
    Among the current unpromoted profiles only the Saurus Totem Warrior qualifies.
    The Out of Action threshold becomes 6+, extending Stunned to 5; 1-2 remain Knocked Down.
  cases:
  - id: exact-recipients
    roles: [grant, compiled]
    operation: selectable_grant
    defender: {collection: trollheim, band_id: lustria-lizardmen, profile_id: saurus-totem-warrior}
    context: {rule_id: band--lizardmen-special-skills-hardened-skin}
    expect: {result.recipients: [saurus-totem-warrior]}
  - id: face-1
    roles: [active, consumer, boundary]
    operation: injury
    defender:
      collection: trollheim
      band_id: lustria-lizardmen
      profile_id: saurus-totem-warrior
      special_rule_ids: [band--lizardmen-special-skills-hardened-skin]
    rolls: [{key: test.injury, value: 1}]
    expect: {result.condition: KNOCKED_DOWN, defender.global_effects.out_of_action_threshold: 6}
  - id: face-2
    roles: [active, consumer, boundary]
    operation: injury
    defender:
      collection: trollheim
      band_id: lustria-lizardmen
      profile_id: saurus-totem-warrior
      special_rule_ids: [band--lizardmen-special-skills-hardened-skin]
    rolls: [{key: test.injury, value: 2}]
    expect: {result.condition: KNOCKED_DOWN, defender.global_effects.out_of_action_threshold: 6}
  - id: face-3
    roles: [active, consumer, boundary]
    operation: injury
    defender:
      collection: trollheim
      band_id: lustria-lizardmen
      profile_id: saurus-totem-warrior
      special_rule_ids: [band--lizardmen-special-skills-hardened-skin]
    rolls: [{key: test.injury, value: 3}]
    expect: {result.condition: STUNNED, defender.global_effects.out_of_action_threshold: 6}
  - id: face-4
    roles: [active, consumer, boundary]
    operation: injury
    defender:
      collection: trollheim
      band_id: lustria-lizardmen
      profile_id: saurus-totem-warrior
      special_rule_ids: [band--lizardmen-special-skills-hardened-skin]
    rolls: [{key: test.injury, value: 4}]
    expect: {result.condition: STUNNED, defender.global_effects.out_of_action_threshold: 6}
  - id: face-5
    roles: [active, consumer, boundary]
    operation: injury
    defender:
      collection: trollheim
      band_id: lustria-lizardmen
      profile_id: saurus-totem-warrior
      special_rule_ids: [band--lizardmen-special-skills-hardened-skin]
    rolls: [{key: test.injury, value: 5}]
    expect: {result.condition: STUNNED, defender.global_effects.out_of_action_threshold: 6}
  - id: face-6
    roles: [active, consumer, boundary]
    operation: injury
    defender:
      collection: trollheim
      band_id: lustria-lizardmen
      profile_id: saurus-totem-warrior
      special_rule_ids: [band--lizardmen-special-skills-hardened-skin]
    rolls: [{key: test.injury, value: 6}]
    expect: {result.condition: OUT, defender.global_effects.out_of_action_threshold: 6}
  - id: unselected
    roles: [inactive]
    operation: injury
    defender: {collection: trollheim, band_id: lustria-lizardmen, profile_id: saurus-totem-warrior}
    rolls: [{key: test.injury, value: 5}]
    expect: {result.condition: OUT}
  - id: complete-table
    roles: [boundary]
    operation: injury
    defender:
      collection: trollheim
      band_id: lustria-lizardmen
      profile_id: saurus-totem-warrior
      special_rule_ids: [band--lizardmen-special-skills-hardened-skin]
    distribution:
      observable: result.condition
      max_rolls: 1
      expected: {KNOCKED_DOWN: 1/3, STUNNED: 1/2, OUT: 1/6}
  mutations:
  - id: remove-hardened-skin
    changes:
    - {path: defender.global_effects.tags, value: []}
    - {path: defender.global_effects.out_of_action_threshold, value: 5}
    cases: [face-5, complete-table]
