schema_version: 1
specifications:
- id: equipment-vows-bretonnian-chapel-guard-questing-knight
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: construction
  sources:
  - target: rule/mordheim/bretonnian-chapel-guard/questing-knight--vow-of-poverty/profile.equipment-restrictions
    digest: 82b4e0d49f5b7f18f8a862b8817afa682f1b8e8d3110d444f680976c8cf574f0
  interpretation: 'questing-knight / vow-of-poverty: explicit prohibition of lance. Ordinary construction
    remains legal. The heavy armour category includes its gromril, ithilmar and plate variants; the helmet
    prohibition includes the improvised helmet. A specific rejection reason is required.

    '
  cases:
  - id: recipients
    roles:
    - grant
    operation: grant
    defender:
      band_id: bretonnian-chapel-guard
      profile_id: questing-knight
    context:
      rule_id: questing-knight--vow-of-poverty
    expect:
      result.recipients:
      - questing-knight
  - id: equipment-boundaries
    roles:
    - accepted
    - rejected
    operation: equipment_choices
    attacker:
      band_id: bretonnian-chapel-guard
      profile_id: questing-knight
    context:
      choices:
        ordinary: {}
        lance:
          main_weapon_id: weapon.lance
    expect:
      result.accepted:
      - ordinary
      result.rejected:
        lance: lance is forbidden for bretonnian-chapel-guard/questing-knight
  mutations:
  - id: remove-explicit-prohibition
    runtime_fault: suppress-bound-equipment-restrictions
    cases:
    - equipment-boundaries
