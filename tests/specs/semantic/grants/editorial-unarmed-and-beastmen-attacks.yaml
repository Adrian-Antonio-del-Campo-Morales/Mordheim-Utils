    operation: armour
    attacker:
      main_weapon_id: weapon.fist
    defender:
      armour_id: armour.heavy-armour
    rolls:
    - key: armour
      value: 4
    expect:
      result.saved: true
  mutations:
  - id: remove-exemption
    path: attacker.global_effects.tags
    value: []
    cases:
    - strength
    - advanced-attacks
    - save-4
