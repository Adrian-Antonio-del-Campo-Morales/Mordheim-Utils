  - id: recipients
    roles:
    - grant
    operation: grant
    defender:
      band_id: battle-monks-of-cathay
      profile_id: raging-peasants
      main_weapon_id: weapon.fist
    context:
      rule_id: raging-peasants--unarmed
    expect:
      result.recipients:
      - raging-peasants
  - id: compiled
    roles:
    - compiled
    operation: compile
    attacker:
      band_id: battle-monks-of-cathay
      profile_id: raging-peasants
      main_weapon_id: weapon.fist
    expect:
      attacker.characteristics.strength: 3
      attacker.characteristics.attacks: 1
  - id: strength
    roles:
    - active
    - consumer
    operation: strength
    attacker:
      band_id: battle-monks-of-cathay
      profile_id: raging-peasants
      main_weapon_id: weapon.fist
    expect:
      result.wound: 3
      result.armour: 3
  - id: attacks
    roles:
    - active
    - consumer
    - boundary
    operation: attacks
    attacker:
      band_id: battle-monks-of-cathay
      profile_id: raging-peasants
      main_weapon_id: weapon.fist
    expect:
      result.attacks: 1
  - id: advanced-attacks
    roles:
    - active
    - consumer
    - boundary
    operation: attacks
    attacker:
      band_id: battle-monks-of-cathay
      profile_id: raging-peasants
      main_weapon_id: weapon.fist
      characteristics:
        weapon_skill: 3
        strength: 4
        toughness: 3
        wounds: 1
        initiative: 3
        attacks: 3
    expect:
      result.attacks: 3
  - id: untrained-strength
    roles:
    - inactive
    operation: strength
    attacker:
      main_weapon_id: weapon.fist
    expect:
      result.wound: 2
      result.armour: 2
  - id: save-1
    roles:
    - active
    - boundary
    - consumer
    operation: armour
    attacker:
      band_id: battle-monks-of-cathay
      profile_id: raging-peasants
      main_weapon_id: weapon.fist
    defender:
      armour_id: armour.heavy-armour
    rolls:
    - key: armour
      value: 1
    expect:
      result.saved: false
  - id: save-2
    roles:
    - active
    - boundary
    - consumer
    operation: armour
    attacker:
      band_id: battle-monks-of-cathay
      profile_id: raging-peasants
      main_weapon_id: weapon.fist
    defender:
      armour_id: armour.heavy-armour
    rolls:
    - key: armour
      value: 2
    expect:
      result.saved: false
  - id: save-3
    roles:
    - active
    - boundary
    - consumer
    operation: armour
    attacker:
      band_id: battle-monks-of-cathay
      profile_id: raging-peasants
      main_weapon_id: weapon.fist
    defender:
      armour_id: armour.heavy-armour
    rolls:
    - key: armour
      value: 3
    expect:
      result.saved: false
  - id: save-4
    roles:
    - active
    - boundary
    - consumer
    operation: armour
    attacker:
      band_id: battle-monks-of-cathay
      profile_id: raging-peasants
      main_weapon_id: weapon.fist
    defender:
      armour_id: armour.heavy-armour
    rolls:
    - key: armour
      value: 4
    expect:
      result.saved: false
  - id: save-5
    roles:
    - active
    - boundary
    - consumer
    operation: armour
    attacker:
      band_id: battle-monks-of-cathay
      profile_id: raging-peasants
      main_weapon_id: weapon.fist
    defender:
      armour_id: armour.heavy-armour
    rolls:
    - key: armour
      value: 5
    expect:
      result.saved: true
  - id: save-6
    roles:
    - active
    - boundary
    - consumer
    operation: armour
    attacker:
      band_id: battle-monks-of-cathay
      profile_id: raging-peasants
      main_weapon_id: weapon.fist
    defender:
      armour_id: armour.heavy-armour
    rolls:
    - key: armour
      value: 6
    expect:
      result.saved: true
  - id: untrained-armour
    roles:
