- id: unarmed-exemption-raging-peasants
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: local
  sources:
  - target: rule/mordheim/battle-monks-of-cathay/raging-peasants--unarmed/profile.fist
    digest: b0b382b8abaa9ad46ec335483e728a098d0d749154a586f661d4a7754fe06abf
  interpretation: 'Weapons/Armour / Unarmed: keeps the profile''s Strength and Attacks and does not grant
    +1 to the enemy''s save. It is not equivalent to Unarmed Fighting, which additionally grants an attack.
    Guardian uses the component''s S3, not the chariot''s Toughness.'
