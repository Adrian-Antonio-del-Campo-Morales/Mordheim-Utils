schema_version: 1
specifications:
- id: rotten-body-mordheim
  scope_digest: 5fd7034eceb69daeeac4b0ad8bba9f2bc5ba50ca65a102d49b69e25f85d18dc9
  category: permanent
  sources:
  - target: rule/mordheim/skaven-clan-pestilens/band--clan-pestilens-special-skills-rotten-body/trait.poison-immune
    digest: bbf3322afceb163fd1f453575f0f54345c3e7186897710cf594a54c3d35969d8
  depends_on:
  - mechanic/preparation.tears-of-shallaya
  interpretation: Clan Pestilens Special Skills / Rotten Body (Mordheimer and Lustria p.80). Poison immunity
    upon choosing the skill, not innate to all Pestilens. The campaign recovery of the censer is outside
    scope. The nine-poison matrix shares the immunity consumer already tested by Tears of Shallaya; that
    preparation is not granted to the hero.
  cases:
  - id: exact-recipients
    roles:
    - grant
    operation: selectable_grant
    defender:
      collection: mordheim
      band_id: skaven-clan-pestilens
      profile_id: plague-priest
    context:
      rule_id: band--clan-pestilens-special-skills-rotten-body
    expect:
      result.recipients:
      - monk-initiates
      - pestilens-sorcerer
      - plague-monks
      - plague-priest
  - id: monk-initiates-venom-cancelled
    roles:
    - compiled
    - active
    - consumer
    operation: strength
    attacker:
      main_weapon_id: weapon.mace
      main_poison_id: poison.black-venom
    defender:
      collection: mordheim
      band_id: skaven-clan-pestilens
      profile_id: monk-initiates
      special_rule_ids:
      - band--clan-pestilens-special-skills-rotten-body
    expect:
      defender.global_effects.poison_immunity: true
      result.wound: 3
      result.armour: 3
  - id: pestilens-sorcerer-venom-cancelled
    roles:
    - compiled
    - active
    - consumer
    operation: strength
    attacker:
      main_weapon_id: weapon.mace
      main_poison_id: poison.black-venom
    defender:
      collection: mordheim
      band_id: skaven-clan-pestilens
      profile_id: pestilens-sorcerer
      special_rule_ids:
      - band--clan-pestilens-special-skills-rotten-body
    expect:
      defender.global_effects.poison_immunity: true
      result.wound: 3
      result.armour: 3
  - id: plague-monks-venom-cancelled
    roles:
    - compiled
    - active
    - consumer
    operation: strength
    attacker:
      main_weapon_id: weapon.mace
      main_poison_id: poison.black-venom
    defender:
      collection: mordheim
      band_id: skaven-clan-pestilens
      profile_id: plague-monks
      special_rule_ids:
      - band--clan-pestilens-special-skills-rotten-body
    expect:
      defender.global_effects.poison_immunity: true
      result.wound: 3
      result.armour: 3
  - id: plague-priest-venom-cancelled
    roles:
    - compiled
    - active
    - consumer
    operation: strength
    attacker:
      main_weapon_id: weapon.mace
      main_poison_id: poison.black-venom
    defender:
      collection: mordheim
      band_id: skaven-clan-pestilens
      profile_id: plague-priest
      special_rule_ids:
      - band--clan-pestilens-special-skills-rotten-body
    expect:
      defender.global_effects.poison_immunity: true
      result.wound: 3
      result.armour: 3
  - id: without-selection-venom-applies
    roles:
    - inactive
    operation: strength
    attacker:
      main_weapon_id: weapon.mace
      main_poison_id: poison.black-venom
    defender:
      collection: mordheim
      band_id: skaven-clan-pestilens
      profile_id: plague-priest
    expect:
      defender.global_effects.poison_immunity: false
      result.wound: 4
      result.armour: 4
  - id: no-poison-ordinary-strength
    roles:
    - boundary
    operation: strength
    attacker:
      main_weapon_id: weapon.mace
    defender:
      collection: mordheim
      band_id: skaven-clan-pestilens
      profile_id: plague-priest
      special_rule_ids:
      - band--clan-pestilens-special-skills-rotten-body
    expect:
      result.wound: 3
      result.armour: 3
  mutations:
  - id: remove-selected-immunity
    changes:
    - path: defender.global_effects.poison_immunity
      value: false
    - path: defender.global_effects.tags
      value: []
    cases:
    - plague-priest-venom-cancelled
    - plague-monks-venom-cancelled
    - pestilens-sorcerer-venom-cancelled
    - monk-initiates-venom-cancelled
