schema_version: 1
specifications:
- id: poison-grant-mordheim-carnival-of-chaos-plague-bearers
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: permanent
  sources:
  - target: rule/mordheim/carnival-of-chaos/plague-bearers--immune-to-poison/trait.poison-immune
    digest: 7bbfb6b9cdf18b7a08a4cf3052375e1be75e5cc232a2c18ec4a711a93c3e47ec
  depends_on:
  - mechanic/preparation.tears-of-shallaya
  interpretation: The source section explicitly grants poison immunity to plague-bearers, not the other
    profiles. This fixture checks that editorial grant and the actual shared immunity consumer. The full
    nine-poison consumer matrix is independently exercised by the Tears of Shallaya specification; this
    dependency does not imply the profile owns that preparation.
  interaction_contract:
    reads:
    - weapon.kind
    writes:
    - defender.poison_immunity
  cases:
  - id: exact-recipient
    roles:
    - grant
    operation: grant
    defender:
      collection: mordheim
      band_id: carnival-of-chaos
      profile_id: plague-bearers
    context:
      rule_id: plague-bearers--immune-to-poison
    expect:
      result.recipients:
      - plague-bearers
  - id: compiled-immunity
    roles:
    - compiled
    operation: compile
    defender:
      collection: mordheim
      band_id: carnival-of-chaos
      profile_id: plague-bearers
    expect:
      defender.global_effects.poison_immunity: true
  - id: poison-cancelled
    roles:
    - consumer
    operation: strength
    attacker:
      main_weapon_id: weapon.mace
      main_poison_id: poison.black-venom
    defender:
      collection: mordheim
      band_id: carnival-of-chaos
      profile_id: plague-bearers
    expect:
      result.wound: 3
      result.armour: 3
  - id: no-poison-unchanged
    roles:
    - boundary
    operation: strength
    attacker:
      main_weapon_id: weapon.mace
    defender:
      collection: mordheim
      band_id: carnival-of-chaos
      profile_id: plague-bearers
    expect:
      result.wound: 3
      result.armour: 3
  mutations:
  - id: remove-granted-immunity
    changes:
    - path: defender.global_effects.poison_immunity
      value: false
    - path: defender.global_effects.tags
      value: []
    cases:
    - poison-cancelled
