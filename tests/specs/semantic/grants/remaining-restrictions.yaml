- id: saurus-skill-and-missile-prohibitions
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: construction
  sources:
  - target: rule/mordheim/lizardmen/band--saurus-skill-prohibitions/compiler.saurus-skill-prohibitions
    digest: a973752cb109db1a41c5fa143b73e1070beddd1adff4ca719dd06546a7f6ed69
  interpretation: Saurus Totem Warriors and Braves reject Academic skills and every missile weapon, regardless
    of later generic accesses.
  cases:
  - id: academic-rejected
    roles:
    - grant
    - accepted
    - rejected
    operation: selection_choices
    attacker:
      band_id: lizardmen
      profile_id: saurus-totem-warrior
    context:
      choices:
        ordinary: {}
        academic:
          skill_ids:
          - skill.arcane-lore
    expect:
      result.accepted:
      - ordinary
      result.rejected:
        academic: 'Academic skills are forbidden for Saurus: [''skill.arcane-lore'']'
  - id: missile-rejected
    operation: equipment_choices
    attacker:
      band_id: lizardmen
      profile_id: saurus-totem-warrior
    context:
      choices:
        ordinary: {}
        missile:
          main_weapon_id: weapon.pistol
    expect:
      result.accepted:
      - ordinary
      result.rejected:
        missile: missile weapons are forbidden for Saurus
  - id: contract-present
    operation: construction_tag_presence
    attacker:
      band_id: lizardmen
      profile_id: saurus-totem-warrior
    context:
      tag: compiler.saurus-skill-prohibitions
    expect:
      result.present: true
  mutations:
  - id: remove-saurus-contract
    path: attacker.construction_tags
    value: []
    cases:
    - contract-present
