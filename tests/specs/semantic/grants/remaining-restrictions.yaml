- id: outlaw-bow-discipline
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: permanent
  sources:
  - target: rule/mordheim/outlaws-of-stirwood-forest/band--bow-discipline/mechanic.bow-discipline
    digest: cc36b20e3237414b0bf2dc25c5d5900e26129490865e22b66567fb164be1f53a
  interpretation: Bow Discipline limits each warrior to one missile weapon; the obligation to carry a bow and
    the crossbow exclusion are kept as a construction contract outside the 1v1 catalogue.
  cases:
  - id: one-missile-limit
    roles:
    - grant
    - compiled
    - consumer
    - boundary
    operation: missile_capacity
    attacker:
      band_id: outlaws-of-stirwood-forest
      profile_id: bandit-leader
    expect:
      result.limit: 1
  mutations:
  - id: restore-default-limit
    path: attacker.missile_weapon_limit
    value: 2
    cases:
    - one-missile-limit
