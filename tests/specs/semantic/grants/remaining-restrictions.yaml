    attacker:
      band_id: hochland-bandits
      profile_id: thugs
    context:
      choices:
        ordinary: {}
        pistol:
          main_weapon_id: weapon.pistol
    expect:
      result.accepted:
      - ordinary
      result.rejected:
        pistol: 'blackpowder weapons are forbidden for Bandit Henchmen: hochland-bandits/thugs'
  - id: contract-present
    operation: construction_tag_presence
    attacker:
      band_id: hochland-bandits
      profile_id: thugs
    context:
      tag: compiler.powder-s-expensive
    expect:
      result.present: true
  mutations:
  - id: remove-powder-contract
    path: attacker.construction_tags
    value: []
    cases:
    - contract-present
- id: saurus-skill-and-missile-prohibitions
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: construction
  sources:
  - target: rule/mordheim/lizardmen/band--saurus-skill-prohibitions/compiler.saurus-skill-prohibitions
