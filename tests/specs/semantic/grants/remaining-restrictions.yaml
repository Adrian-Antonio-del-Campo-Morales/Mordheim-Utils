schema_version: 1
specifications:
- id: chapel-guard-chivalry
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: construction
  sources:
  - target: rule/mordheim/bretonnian-chapel-guard/band--chivalry/mechanic.chivalry
    digest: bcf6f9dedb5a5f8f1505c123551aba414dbadc64ea3d4f273c9f1212901316cd
  interpretation: Knights cannot use missile weapons, poisons or drugs; an ordinary build remains legal.
  cases:
  - id: poison-and-drug-rejected
    roles:
    - grant
    - accepted
    - rejected
    operation: equipment_choices
    attacker:
      band_id: bretonnian-chapel-guard
      profile_id: knights-errant
    context:
      choices:
        ordinary: {}
        poison:
          main_poison_id: poison.black-lotus
        drug:
          preparation_ids:
          - preparation.crimson-shade
        missile:
          main_weapon_id: weapon.pistol
    expect:
      result.accepted:
      - ordinary
      result.rejected:
        poison: 'poisons are forbidden for Knights: bretonnian-chapel-guard/knights-errant'
        drug: 'drugs are forbidden for Knights: bretonnian-chapel-guard/knights-errant'
        missile: 'missile weapons are forbidden for Knights: bretonnian-chapel-guard/knights-errant'
  - id: contract-present
    operation: construction_tag_presence
    attacker:
      band_id: bretonnian-chapel-guard
      profile_id: knights-errant
    context:
      tag: compiler.chivalry
    expect:
      result.present: true
  mutations:
  - id: remove-chivalry-contract
    path: attacker.construction_tags
    value: []
    cases:
    - contract-present
