- id: outlaw-bow-discipline
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: permanent
  sources:
  - target: rule/mordheim/outlaws-of-stirwood-forest/band--bow-discipline/mechanic.bow-discipline
    digest: f9d55860afcdad57e2a40a2ef453164c30983d6dee8242aae59215c37700f4cc
  interpretation: Bow Discipline limits each warrior to one missile weapon; the obligation to carry a
    bow and the crossbow exclusion are kept as a construction contract outside the 1v1 catalogue.
  cases:
  - id: one-missile-limit
    roles:
    - grant
    - compiled
    - consumer
    - boundary
    operation: missile_capacity
    attacker:
      band_id: outlaws-of-stirwood-forest
      profile_id: bandit-leader
    expect:
      result.limit: 1
  mutations:
  - id: restore-default-limit
    path: attacker.missile_weapon_limit
    value: 2
    cases:
    - one-missile-limit
