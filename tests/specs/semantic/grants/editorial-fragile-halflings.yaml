  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: local
  sources:
  - target: rule/mordheim/mootlanders/band--fragile-halflings/trait.fragile-halflings
    digest: da615a8dce294a3c1160e05d30c3f6069455d1d0758f7b485c140dad8dc3b095
  interpretation: Mordheimer / Mootlanders / Special Rules. It only changes result 2 to Stunned. The unmodified
    table stays 1 Knocked Down, 2-4 Stunned, 5-6 Out of Action. A sword is used so this effect is not
    confused with the Concussion of a mace.
