schema_version: 1
specifications:
- id: averlander-halfling-promotion-lists
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: construction
  sources:
  - target: rule/mordheim/averlanders/halflings-scouts--promotion/compiler.promoted-hero-no-strength-access
    digest: e013a3affd12a6318659930973e554832945343ae72f664f3a2f4a0a23e7eeee
  interpretation: The promoted Halfling may choose up to two general lists, except Strength.
  cases:
  - id: combat-speed
    roles:
    - grant
    - accepted
    operation: general_skill_access
    attacker:
      band_id: averlanders
      profile_id: halflings-scouts
      variant_ids:
      - skill-list.combat
      - skill-list.speed
    expect:
      result.skills:
      - skill.expert-swordsman
      - skill.jump-up
      - skill.lightning-reflexes
      - skill.step-aside
      - skill.strike-to-injure
      - skill.web-of-steel
  - id: strength-rejected
    roles:
    - rejected
    operation: compile
    attacker:
      band_id: averlanders
      profile_id: halflings-scouts
      variant_ids:
      - skill-list.strength
    reject: Strength skill list is forbidden
  - id: contract
    operation: construction_tag_presence
    attacker:
      band_id: averlanders
      profile_id: halflings-scouts
    context:
      tag: compiler.promoted-hero-no-strength-access
    expect:
      result.present: true
  mutations:
  - id: remove-promotion-contract
    path: attacker.construction_tags
    value: []
    cases:
    - contract
- id: dwarf-rangers-no-arcane-lore
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: construction
  sources:
  - target: rule/mordheim/dwarf-rangers/band--no-arcane-lore/compiler.no-arcane-lore
    digest: 085fffca6905315fc6e735a68e7b1773aac0c4942e6ae0d6c25e16be393b8a57
  interpretation: No Dwarf Ranger may acquire Arcane Lore or Sorcery; the control without those choices
    remains legal.
  cases:
  - id: ordinary
    roles:
    - grant
    - accepted
    - rejected
    operation: selection_choices
    attacker:
      band_id: dwarf-rangers
      profile_id: runesmith
    context:
      choices:
        ordinary: {}
        arcane:
          skill_ids:
          - skill.arcane-lore
    expect:
      result.accepted:
      - ordinary
      result.rejected:
        arcane: 'Arcane Lore is forbidden for dwarf-rangers/runesmith: [''skill.arcane-lore'']'
  - id: sorcery-rejected
    roles: []
    operation: compile
    attacker:
      band_id: dwarf-rangers
      profile_id: apprentice-runesmith
      skill_ids:
      - skill.sorcery
    reject: Arcane Lore is forbidden
  - id: contract
    operation: construction_tag_presence
    attacker:
      band_id: dwarf-rangers
      profile_id: runesmith
    context:
      tag: compiler.no-arcane-lore
    expect:
      result.present: true
  mutations:
  - id: remove-no-arcane-contract
    path: attacker.construction_tags
    value: []
    cases:
    - contract
- id: blood-dragon-warriors-code
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: construction
  sources:
  - target: rule/trollheim/chaos-streets-undead-bloodlines/blood-dragon-vampire--warriors-code/compiler.warrior-s-code
    digest: ebecd917c56380b9539129828be903ed2210c6b26154500f0613f21998656555
  interpretation: The Blood Dragon Vampire cannot acquire magic skills; a build without them remains legal.
  cases:
  - id: ordinary
    roles:
    - grant
    - accepted
    - rejected
    operation: selection_choices
    attacker:
      collection: trollheim
      band_id: chaos-streets-undead-bloodlines
      profile_id: blood-dragon-vampire
    context:
      choices:
        ordinary: {}
        arcane:
          skill_ids:
          - skill.arcane-lore
    expect:
      result.accepted:
      - ordinary
      result.rejected:
        arcane: 'magic is forbidden by the Warrior''s Code: [''skill.arcane-lore'']'
  - id: contract
    operation: construction_tag_presence
    attacker:
      collection: trollheim
      band_id: chaos-streets-undead-bloodlines
      profile_id: blood-dragon-vampire
    context:
      tag: compiler.warrior-s-code
    expect:
      result.present: true
  mutations:
  - id: remove-warrior-code
    path: attacker.construction_tags
    value: []
    cases:
    - contract
