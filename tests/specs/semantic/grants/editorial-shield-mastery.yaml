schema_version: 1
specifications:
- id: editorial-shield-mastery-grants
  scope_digest: ea4090654a79e79bb19b0855371a062c6a9a10c1ab40f7d8abdb42634a425b97
  category: permanent
  sources:
  - target: rule/mordheim/norse-explorers-btb/band--norse-special-skills-shield-master/skill.shield-mastery
    digest: d428f30b17b5818d9b3e17cf5e50d3049520a242ee3fda06dadf4a8d1730d2b3
  - target: rule/mordheim/norse-explorers-lustria/band--norse-special-skills-shield-master/skill.shield-mastery
    digest: ebe66a4329f5be75a86c08c29312dc500871b1517fa0b70ff2f1a562ffd6e7a8
  - target: rule/trollheim/lustria-norse/band--norse-special-skills-shield-mastery/skill.shield-mastery
    digest: 3df2f11263f2e7f6a9fee2127ab10a0e900a8b7f94bb9cd57c6e81ec9fce5fb3
  depends_on:
  - mechanic/skill.shield-mastery
  interpretation: The three Norse variants grant the selectable skill to their four hero profiles. The
    spelling of the Berserker profile differs between collections, while the granted shield behaviour
    is identical.
  cases:
  - id: border-town-burning-heroes
    roles:
    - grant
    - compiled
    operation: selectable_grant
    defender:
      collection: mordheim
      band_id: norse-explorers-btb
      profile_id: jarl
    context:
      rule_id: band--norse-special-skills-shield-master
    expect:
      result.recipients:
      - beserkers
      - bondsmen
      - jarl
      - wulfen
  - id: mordheim-lustria-heroes
    roles:
    - grant
    operation: selectable_grant
    defender:
      collection: mordheim
      band_id: norse-explorers-lustria
      profile_id: jarl
    context:
      rule_id: band--norse-special-skills-shield-master
    expect:
      result.recipients:
      - beserkers
      - bondsmen
      - jarl
      - wulfen
  - id: trollheim-lustria-heroes
    roles:
    - grant
    operation: selectable_grant
    defender:
      collection: trollheim
      band_id: lustria-norse
      profile_id: jarl
    context:
      rule_id: band--norse-special-skills-shield-mastery
    expect:
      result.recipients:
      - berserkers
      - bondsmen
      - jarl
      - wulfen
  - id: granted-consumer
    roles:
    - active
    - boundary
    - consumer
    operation: parry
    attacker:
      main_weapon_id: weapon.mace
    defender:
      collection: trollheim
      band_id: lustria-norse
      profile_id: jarl
      special_rule_ids:
      - band--norse-special-skills-shield-mastery
      main_weapon_id: weapon.axe
      off_hand_id: defence.shield
    context:
      hit_roll: 4
    distribution:
      observable: result.blocked
      max_rolls: 1
      expected:
        'true': 1/3
        'false': 2/3
  mutations:
  - id: remove-granted-mastery
    path: defender.global_effects.tags
    value: []
    cases:
    - granted-consumer
