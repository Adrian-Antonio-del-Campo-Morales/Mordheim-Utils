schema_version: 1
specifications:
- id: swabbie-rabble-loadouts
  scope_digest: ea4090654a79e79bb19b0855371a062c6a9a10c1ab40f7d8abdb42634a425b97
  category: construction
  sources:
  - target: rule/mordheim/pirates/swabbies--rabble/compiler.swabbie-rabble-loadout
    digest: 19627a486399c6ef2a65392b4d77b4f870ac397df8092a76e57caa09bfca5054
  - target: rule/trollheim/lustria-pirates/swabbies--rabble/compiler.swabbie-rabble-loadout
    digest: bcc12bec835a8268a7b3aee2b05f1b4b72ca127efe75c46cdad0d023ec52ecc2
  interpretation: Each Swabbie individually uses its own list and can never acquire Sorcery or Arcane
    Lore; group homogeneity is not imposed on the compiled fighter.
  cases:
  - id: mordheim-magic-rejected
    roles:
    - grant
    - accepted
    - rejected
    operation: selection_choices
    attacker:
      band_id: pirates
      profile_id: swabbies
    context:
      choices:
        ordinary: {}
        magic:
          skill_ids:
          - skill.sorcery
    expect:
      result.accepted:
      - ordinary
      result.rejected:
        magic: 'magic is forbidden for Swabbies: [''skill.sorcery'']'
  - id: lustria-magic-rejected
    roles:
    - grant
    - accepted
    - rejected
    operation: selection_choices
    attacker:
      collection: trollheim
      band_id: lustria-pirates
      profile_id: swabbies
    context:
      choices:
        ordinary: {}
        magic:
          skill_ids:
          - skill.arcane-lore
    expect:
      result.accepted:
      - ordinary
      result.rejected:
        magic: 'magic is forbidden for Swabbies: [''skill.arcane-lore'']'
  - id: contract-present
    operation: construction_tag_presence
    attacker:
      band_id: pirates
      profile_id: swabbies
    context:
      tag: compiler.swabbie-rabble-loadout
    expect:
      result.present: true
  mutations:
  - id: remove-swabbie-contract
    path: attacker.construction_tags
    value: []
    cases:
    - contract-present
- id: liche-warrior-wizard
  scope_digest: ea4090654a79e79bb19b0855371a062c6a9a10c1ab40f7d8abdb42634a425b97
  category: construction
  sources:
  - target: rule/mordheim/restless-dead/liche--warrior-wizard/compiler.warrior-wizard
    digest: b3cdda09607bc3516c56b526e7608b3e4b695b506f2b94a0cb5018608d7ff8f2
  interpretation: The Liche may equip armour without losing its editorial spellcasting ability; magic
    is not executed in close combat.
  cases:
  - id: armour-accepted
    roles:
    - grant
    - accepted
    operation: equipment_choices
    attacker:
      band_id: restless-dead
      profile_id: liche
    context:
      choices:
        unarmoured: {}
        armoured:
          armour_id: armour.light-armour
    expect:
      result.accepted:
      - armoured
      - unarmoured
      result.rejected: {}
  - id: unavailable-item-rejected
    roles:
    - rejected
    operation: equipment_choices
    attacker:
      band_id: restless-dead
      profile_id: liche
    context:
      choices:
        ordinary: {}
        illegal:
          main_weapon_id: weapon.flail
    expect:
      result.accepted:
      - ordinary
      result.rejected:
        illegal: 'equipment is not available to restless-dead/liche: [''weapon.flail'']'
  - id: contract-present
    operation: construction_tag_presence
    attacker:
      band_id: restless-dead
      profile_id: liche
    context:
      tag: compiler.warrior-wizard
    expect:
      result.present: true
  mutations:
  - id: remove-warrior-wizard-contract
    path: attacker.construction_tags
    value: []
    cases:
    - contract-present
- id: pirate-human-mercenary-equipment
  scope_digest: ea4090654a79e79bb19b0855371a062c6a9a10c1ab40f7d8abdb42634a425b97
  category: construction
  sources:
  - target: rule/trollheim/lustria-pirates/band--hired-swords/compiler.pirate-human-mercenary-equipment-access
    digest: 72871688666080ded0585f8aac40d77362733028f2959aeb265153e6560ef608
  interpretation: The Pirates incorporate the equipment access of Human Mercenaries; the upkeep of Dwarfs
    and Elves belongs to campaign.
  cases:
  - id: mercenary-halberd-accepted
    roles:
    - grant
    - accepted
    operation: equipment_choices
    attacker:
      collection: trollheim
      band_id: lustria-pirates
      profile_id: pirate-captain
    context:
      choices:
        ordinary: {}
        mercenary:
          main_weapon_id: weapon.halberd
    expect:
      result.accepted:
      - mercenary
      - ordinary
      result.rejected: {}
  - id: exotic-item-rejected
    roles:
    - rejected
    operation: equipment_choices
    attacker:
      collection: trollheim
      band_id: lustria-pirates
      profile_id: pirate-captain
    context:
      choices:
        ordinary: {}
        exotic:
          main_weapon_id: weapon.flail
    expect:
      result.accepted:
      - ordinary
      result.rejected:
        exotic: 'equipment is not available to lustria-pirates/pirate-captain: [''weapon.flail'']'
  - id: contract-present
    operation: construction_tag_presence
    attacker:
      collection: trollheim
      band_id: lustria-pirates
      profile_id: pirate-captain
    context:
      tag: compiler.pirate-human-mercenary-equipment-access
    expect:
      result.present: true
  mutations:
  - id: remove-mercenary-contract
    path: attacker.construction_tags
    value: []
    cases:
    - contract-present
- id: savage-goblin-tracker-gear
  scope_digest: ea4090654a79e79bb19b0855371a062c6a9a10c1ab40f7d8abdb42634a425b97
  category: permanent
  sources:
  - target: rule/trollheim/lustria-savage-goblins/trackers--tracker-gear/compiler.tracker-gear
    digest: dffe935a4b0985e5604fa0beb408ee8d926d2ae8621ae25e95ce1e436dd28d44
  interpretation: The Tracker profile incorporates Rope and Hook and Bolas as fixed equipment and keeps
    the contract that prevents selling or transferring them in campaign.
  cases:
  - id: fixed-contract
    roles:
    - grant
    - compiled
    - consumer
    - boundary
    operation: construction_tag_presence
    attacker:
      collection: trollheim
      band_id: lustria-savage-goblins
      profile_id: trackers
    context:
      tag: compiler.tracker-gear
    expect:
      result.present: true
  mutations:
  - id: remove-tracker-contract
    path: attacker.construction_tags
    value: []
    cases:
    - fixed-contract
