- id: editorial-natural-armour-estalian-warhound
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: local
  sources:
  - target: rule/mordheim/lustrian-reavers/estalian-warhound--armoured/trait.natural-armour-save
    digest: 64328bcc28e1a3b26fd9e6a8c32d57db69f2bd4f4460f052685b6f4cd84fef02
  interpretation: Estalian Warhound / 5+ Armour Save grants ordinary 5+ protection from padded armour
    and an iron collar. Apply normal armour modifiers, not an independent ward save. No roll is requested
    once the target exceeds 6.
  cases:
  - id: recipients
    roles:
    - grant
    - compiled
    operation: grant
    defender:
      collection: mordheim
      band_id: lustrian-reavers
      profile_id: estalian-warhound
    context:
      rule_id: estalian-warhound--armoured
    expect:
      result.recipients:
      - estalian-warhound
  - id: face-1
    roles:
    - active
    - consumer
    - boundary
    operation: armour
    attacker:
      main_weapon_id: weapon.mace
    defender:
      collection: mordheim
      band_id: lustrian-reavers
      profile_id: estalian-warhound
    rolls:
    - key: armour
      value: 1
    expect:
      defender.natural_armour_save: 5
      result.target: 5
      result.saved: false
