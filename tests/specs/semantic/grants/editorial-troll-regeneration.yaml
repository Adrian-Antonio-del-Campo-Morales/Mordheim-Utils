schema_version: 1
specifications:
- id: editorial-troll-regeneration-black-orcs
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: contextual
  sources:
  - target: rule/mordheim/black-orcs/troll--regeneration/skill.regeneration
    digest: 8466879a38e5992c9b201104231cd3ec453a2a94b4f8cfbf5f8200cd22aacdde
  depends_on:
  - mechanic/skill.regeneration
  interpretation: The Troll alone receives this inherent regeneration. It ignores a wound on 4, 5 or 6,
    but cannot regenerate fire wounds. A blocked save must not request a die. Post-battle injury rules
    are outside this combat specification.
  cases:
  - id: recipient
    roles:
    - grant
    operation: grant
    defender:
      band_id: black-orcs
      profile_id: troll
    context:
      rule_id: troll--regeneration
    expect:
      result.recipients:
      - troll
  - id: compiled
    roles:
    - compiled
    operation: compile
    defender:
      band_id: black-orcs
      profile_id: troll
    expect:
      defender.global_effects.regeneration_save: 4
      defender.global_effects.regeneration_blocked_by_fire: true
  - id: all-faces
    roles:
    - active
    - consumer
    - boundary
    operation: special_save
    defender:
      band_id: black-orcs
      profile_id: troll
    distribution:
      observable: result.saved
      max_rolls: 1
      expected:
        'true': 1/2
        'false': 1/2
  - id: three-fails
    roles:
    - boundary
    operation: special_save
    defender:
      band_id: black-orcs
      profile_id: troll
    rolls:
    - key: special.regeneration
      value: 3
    expect:
      result.saved: false
      result.ward_roll: null
      result.regeneration_roll: 3
  - id: four-saves
    roles:
    - boundary
    operation: special_save
    defender:
      band_id: black-orcs
      profile_id: troll
    rolls:
    - key: special.regeneration
      value: 4
    expect:
      result.saved: true
      result.source: regeneration
      result.ward_roll: null
      result.regeneration_roll: 4
  - id: fire-omits-roll
    roles:
    - inactive
    operation: special_save
    attacker:
      main_weapon_id: weapon.brazier-iron
    defender:
      band_id: black-orcs
      profile_id: troll
    rolls: []
    expect:
      context.regeneration_blocked: true
      result.saved: false
      result.regeneration_roll: null
  mutations:
  - id: remove-regeneration
    path: defender.global_effects.regeneration_save
    value: 7
    cases:
    - all-faces
  - id: worsen-threshold
    path: defender.global_effects.regeneration_save
    value: 5
    cases:
    - all-faces
    - four-saves
  - id: allow-fire-regeneration
    path: defender.global_effects.regeneration_blocked_by_fire
    value: false
    cases:
    - fire-omits-roll
