    digest: 00c463e71f30f2c5a434ee90a88593e3d43cb6d3e059be3d6c7701b1798f82da
  interpretation: Lustria pp.54-56 grants scaly skin 6+. It combines with ordinary armour, receives Strength
    modifiers, but the natural contribution never worsens from 6+. Ignoring armour still nullifies the
    whole save.
  cases:
  - id: recipient
    roles:
    - grant
    operation: grant
    defender:
      collection: trollheim
      band_id: lustria-lizardmen
      profile_id: skink-priest
    context:
      rule_id: skink-priest--scaly-skin-6plus
    expect:
      result.recipients:
      - skink-priest
  - id: base-distribution
    roles:
    - compiled
    - active
    - consumer
    - boundary
    operation: armour
    attacker:
      main_weapon_id: weapon.sword
    defender:
      collection: trollheim
      band_id: lustria-lizardmen
      profile_id: skink-priest
    distribution:
      observable: result.saved
      max_rolls: 1
      expected:
        'true': 1/6
        'false': 5/6
  - id: strength-six-retains-six
    roles:
    - active
    - boundary
    operation: armour
    attacker:
      main_weapon_id: weapon.mace
      characteristics:
        weapon_skill: 3
        strength: 6
        toughness: 3
        wounds: 1
        initiative: 3
        attacks: 1
    defender:
      collection: trollheim
      band_id: lustria-lizardmen
      profile_id: skink-priest
    rolls:
    - key: armour
      value: 6
    expect:
      defender.natural_armour_worst_save: 6
      result.target: 6
      result.saved: true
  - id: stacks-with-light-armour
    roles:
    - consumer
    - boundary
    operation: armour
    attacker:
      main_weapon_id: weapon.mace
    defender:
      collection: trollheim
      band_id: lustria-lizardmen
      profile_id: skink-priest
      armour_id: armour.light-armour
    rolls:
    - key: armour
      value: 5
    expect:
      result.target: 5
      result.saved: true
  - id: armour-denial
    roles:
    - inactive
    - boundary
    operation: armour
    attacker:
      main_weapon_id: weapon.vomit-attack
    defender:
      collection: trollheim
      band_id: lustria-lizardmen
      profile_id: skink-priest
      armour_id: armour.light-armour
    expect:
      result.eligible: false
      result.saved: false
  mutations:
  - id: remove-skin
    changes:
    - path: defender.natural_armour_save
      value: 7
    - path: defender.armour_save
      value: 7
    - path: defender.natural_armour_worst_save
      value: 7
    cases:
    - base-distribution
  - id: remove-worst-save
    path: defender.natural_armour_worst_save
    value: 7
    cases:
    - strength-six-retains-six
