schema_version: 1
specifications:
- id: editorial-monster-slayer-dwarf-rangers
  scope_digest: ea4090654a79e79bb19b0855371a062c6a9a10c1ab40f7d8abdb42634a425b97
  category: local
  sources:
  - target: rule/mordheim/dwarf-rangers/band--slayer-special-skills-monster-slayer/skill.monster-slayer
    digest: 531787675304d4852122eab182826eeae5b76f18b8279827eada7f4e7bf5e891
  depends_on:
  - mechanic/skill.monster-slayer
  interpretation: Only Slayers may choose this skill. It limits the wound threshold to 4+ without reducing
    naturally easier thresholds. S3 against T6 therefore wounds on 4+, while S3 against T2 still wounds
    on 3+.
  cases:
  - id: recipients
    roles:
    - grant
    - compiled
    operation: selectable_grant
    defender:
      band_id: dwarf-rangers
      profile_id: dwarf-troll-slayers
    context:
      rule_id: band--slayer-special-skills-monster-slayer
    expect:
      result.recipients:
      - dwarf-troll-slayers
  - id: tough-opponent-boundary
    roles:
    - active
    - consumer
    - boundary
    operation: wound
    attacker:
      band_id: dwarf-rangers
      profile_id: dwarf-troll-slayers
      special_rule_ids:
      - band--slayer-special-skills-monster-slayer
      main_weapon_id: weapon.dagger
    defender:
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 6
        wounds: 1
        initiative: 3
        attacks: 1
    rolls:
    - key: wound
      value: 4
    expect:
      result.target: 4
      result.success: true
    expect_contains:
      attacker.global_effects.tags:
      - skill.monster-slayer
  - id: tough-opponent-all-faces
    roles:
    - boundary
    operation: wound
    attacker:
      band_id: dwarf-rangers
      profile_id: dwarf-troll-slayers
      special_rule_ids:
      - band--slayer-special-skills-monster-slayer
      main_weapon_id: weapon.dagger
    defender:
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 6
        wounds: 1
        initiative: 3
        attacks: 1
    distribution:
      observable: result.success
      max_rolls: 1
      expected:
        'true': 1/2
        'false': 1/2
  - id: easier-target-retained
    roles:
    - inactive
    - boundary
    operation: wound
    attacker:
      band_id: dwarf-rangers
      profile_id: dwarf-troll-slayers
      special_rule_ids:
      - band--slayer-special-skills-monster-slayer
      main_weapon_id: weapon.dagger
    defender:
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 2
        wounds: 1
        initiative: 3
        attacks: 1
    rolls:
    - key: wound
      value: 3
    expect:
      result.target: 3
      result.success: true
  - id: easier-target-all-faces
    roles:
    - inactive
    - boundary
    operation: wound
    attacker:
      band_id: dwarf-rangers
      profile_id: dwarf-troll-slayers
      special_rule_ids:
      - band--slayer-special-skills-monster-slayer
      main_weapon_id: weapon.dagger
    defender:
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 2
        wounds: 1
        initiative: 3
        attacks: 1
    distribution:
      observable: result.success
      max_rolls: 1
      expected:
        'true': 2/3
        'false': 1/3
  mutations:
  - id: remove-threshold-limit
    path: attacker.global_effects.tags
    value: []
    cases:
    - tough-opponent-boundary
    - tough-opponent-all-faces
