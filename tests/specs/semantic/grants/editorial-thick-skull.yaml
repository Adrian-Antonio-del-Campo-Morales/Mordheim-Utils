  - id: streets-dwarfs-recipients
    roles:
    - grant
    operation: selectable_grant
    defender:
      collection: trollheim
      band_id: chaos-streets-dwarf-treasure-hunters
      profile_id: dwarf-noble
    context:
      rule_id: band--dwarf-special-skills-thick-skull
    expect:
