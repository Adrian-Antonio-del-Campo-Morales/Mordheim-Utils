  - id: granted-consumer
    roles:
    - consumer
    - boundary
    operation: stun_reaction
    defender:
      collection: mordheim
      band_id: black-dwarfs
      profile_id: sorcerer
      special_rule_ids:
      - band--chaos-dwarf-special-skills-thick-skull
    rolls:
    - key: test.thick-skull
      value: 3
    expect:
      result.condition: KNOCKED_DOWN
      defender.global_effects.thick_skull: true
  mutations:
  - id: remove-granted-effect
    path: defender.global_effects.thick_skull
    value: false
    cases:
    - granted-consumer
