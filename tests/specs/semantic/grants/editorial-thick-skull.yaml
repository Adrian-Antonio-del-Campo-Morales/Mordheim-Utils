  depends_on:
  - mechanic/skill.thick-skull
  interpretation: Each cited entry is a selectable warband special skill. It is available exactly to profiles
    whose source profile grants access to the special skill table; henchmen and heroes without that table
    cannot select it. All eight texts grant the same canonical Thick Skull behaviour already verified
    independently.
  cases:
  - id: black-dwarfs-recipients
    roles:
    - grant
    - compiled
    operation: selectable_grant
    defender:
      collection: mordheim
      band_id: black-dwarfs
      profile_id: sorcerer
    context:
      rule_id: band--chaos-dwarf-special-skills-thick-skull
    expect:
      result.recipients:
      - gaolers
      - sorcerer
  - id: black-orcs-recipients
    roles:
    - grant
    operation: selectable_grant
    defender:
      collection: mordheim
      band_id: black-orcs
      profile_id: black-orc-boss
    context:
      rule_id: band--black-orc-special-skills-ard-ead
    expect:
      result.recipients:
      - black-orc-boss
      - black-orcs
      - younguns
  - id: dwarf-rangers-recipients
    roles:
    - grant
    operation: selectable_grant
    defender:
      collection: mordheim
      band_id: dwarf-rangers
      profile_id: runesmith
    context:
      rule_id: band--dwarf-special-skills-thick-skull
    expect:
      result.recipients:
      - apprentice-runesmith
      - dwarf-troll-slayers
      - runesmith
  - id: dwarf-treasure-hunters-recipients
    roles:
    - grant
    operation: selectable_grant
    defender:
      collection: mordheim
      band_id: dwarf-treasure-hunters
      profile_id: dwarf-noble
    context:
      rule_id: band--dwarf-special-skills-thick-skull
    expect:
      result.recipients:
      - dwarf-engineer
      - dwarf-noble
      - dwarf-troll-slayers
  - id: orc-mob-recipients
    roles:
    - grant
    operation: selectable_grant
    defender:
      collection: mordheim
      band_id: orc-mob
      profile_id: orc-boss
    context:
      rule_id: band--orc-special-skills-ard-ead
    expect:
      result.recipients:
      - orc-big-uns
      - orc-boss
      - orc-shaman
  - id: sons-of-hashut-recipients
    roles:
    - grant
    operation: selectable_grant
    defender:
      collection: mordheim
      band_id: sons-of-hashut
      profile_id: apprentice-sorcerer
    context:
      rule_id: band--chaos-dwarfs-special-skills-thick-skull
    expect:
      result.recipients:
      - apprentice-sorcerer
      - bull-centaur
      - chaos-dwarf-champions
  - id: streets-dwarfs-recipients
    roles:
    - grant
    operation: selectable_grant
    defender:
      collection: trollheim
      band_id: chaos-streets-dwarf-treasure-hunters
      profile_id: dwarf-noble
    context:
      rule_id: band--dwarf-special-skills-thick-skull
    expect:
      result.recipients:
      - dwarf-engineer
      - dwarf-noble
      - dwarf-troll-slayers
  - id: streets-greenskins-recipients
    roles:
    - grant
    operation: selectable_grant
    defender:
      collection: trollheim
      band_id: chaos-streets-greenskins
      profile_id: orc-boss
    context:
      rule_id: band--orc-special-skills-ard-ead
    expect:
      result.recipients:
      - orc-big-uns
      - orc-boss
      - orc-shaman
  - id: granted-consumer
    roles:
    - consumer
    - boundary
    operation: stun_reaction
    defender:
      collection: mordheim
      band_id: black-dwarfs
      profile_id: sorcerer
      special_rule_ids:
      - band--chaos-dwarf-special-skills-thick-skull
    rolls:
    - key: test.thick-skull
      value: 3
    expect:
      result.condition: KNOCKED_DOWN
      defender.global_effects.thick_skull: true
  mutations:
  - id: remove-granted-effect
    path: defender.global_effects.thick_skull
    value: false
    cases:
    - granted-consumer
