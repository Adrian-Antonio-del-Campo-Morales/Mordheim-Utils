      - dwarf-noble
      - dwarf-troll-slayers
  - id: orc-mob-recipients
    roles:
    - grant
    operation: selectable_grant
    defender:
      collection: mordheim
      band_id: orc-mob
      profile_id: orc-boss
    context:
      rule_id: band--orc-special-skills-ard-ead
    expect:
      result.recipients:
      - orc-big-uns
      - orc-boss
      - orc-shaman
  - id: sons-of-hashut-recipients
    roles:
    - grant
    operation: selectable_grant
    defender:
