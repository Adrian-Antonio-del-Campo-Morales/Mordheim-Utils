  - id: streets-dwarfs-recipients
    roles:
    - grant
    operation: selectable_grant
    defender:
      collection: trollheim
      band_id: chaos-streets-dwarf-treasure-hunters
      profile_id: dwarf-noble
    context:
      rule_id: band--dwarf-special-skills-thick-skull
    expect:
      result.recipients:
      - dwarf-engineer
      - dwarf-noble
      - dwarf-troll-slayers
  - id: streets-greenskins-recipients
    roles:
    - grant
    operation: selectable_grant
    defender:
      collection: trollheim
      band_id: chaos-streets-greenskins
      profile_id: orc-boss
    context:
      rule_id: band--orc-special-skills-ard-ead
    expect:
      result.recipients:
      - orc-big-uns
      - orc-boss
      - orc-shaman
  - id: granted-consumer
    roles:
    - consumer
    - boundary
    operation: stun_reaction
    defender:
      collection: mordheim
      band_id: black-dwarfs
      profile_id: sorcerer
      special_rule_ids:
      - band--chaos-dwarf-special-skills-thick-skull
    rolls:
    - key: test.thick-skull
      value: 3
    expect:
      result.condition: KNOCKED_DOWN
      defender.global_effects.thick_skull: true
  mutations:
  - id: remove-granted-effect
    path: defender.global_effects.thick_skull
    value: false
    cases:
    - granted-consumer
