    roles:
    - grant
    - compiled
    operation: selectable_grant
    defender:
      collection: mordheim
      band_id: black-dwarfs
      profile_id: sorcerer
    context:
      rule_id: band--chaos-dwarf-special-skills-thick-skull
    expect:
      result.recipients:
      - gaolers
      - sorcerer
