schema_version: 1
specifications:
- id: editorial-crack-shot-grant
  scope_digest: ea4090654a79e79bb19b0855371a062c6a9a10c1ab40f7d8abdb42634a425b97
  category: permanent
  sources:
  - target: rule/mordheim/gunnery-school-of-nuln/pistoliers--crack-shot/skill.crack-shot
    digest: 4c3cbae217baea620b3d1e12e40708dcf2ac17cf35768e3098e6ac70239d2640
  depends_on:
  - mechanic/skill.crack-shot
  interpretation: Crack Shot is an automatic profile rule belonging only to Pistoliers. Equipping that
    profile with a legal pistol exposes the canonical first-round close-combat reroll.
  cases:
  - id: only-pistoliers-receive-rule
    roles:
    - grant
    - compiled
    operation: grant
    defender:
      collection: mordheim
      band_id: gunnery-school-of-nuln
      profile_id: pistoliers
    context:
      rule_id: pistoliers--crack-shot
    expect:
      result.recipients:
      - pistoliers
    expect_contains:
      defender.global_effects.tags:
      - skill.crack-shot
  - id: granted-consumer
    roles:
    - active
    - boundary
    - consumer
    operation: hit
    attacker:
      collection: mordheim
      band_id: gunnery-school-of-nuln
      profile_id: pistoliers
      main_weapon_id: weapon.pistol
    context:
      first_round: true
    distribution:
      observable: result.success
      max_rolls: 2
      expected:
        'true': 8/9
        'false': 1/9
  mutations:
  - id: remove-profile-crack-shot
    path: attacker.global_effects.tags
    value: []
    cases:
    - granted-consumer
