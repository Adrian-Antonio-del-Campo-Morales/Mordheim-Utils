schema_version: 1
specifications:
- id: advanced-loadout-construction-contracts
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: construction
  sources:
  - target: rule/mordheim/black-orcs/band--black-orc-special-skills-proven-warrior/compiler.proven-warrior
    digest: 6722fb5e3911b3b504777c9b11843ed626f5f189532be3c69751d68bea8a1cc1
  - target: rule/mordheim/maneaters/band--ogres-special-skills-master-of-arms/mechanic.master-of-arms
    digest: e5f6301293580d8b41242fba591b2ce94a3ba4ba4d5c7344188473c0728c3b25
  - target: rule/mordheim/pit-fighters/band--pit-fighter-skill-arms-master/compiler.ignore-difficult-to-use-restrictions
    digest: 4b778eba290f840703073d3b0947828752b9e5101bb2cf7ce6a323df8b53ac64
  - target: rule/trollheim/chaos-streets-pit-fighters/band--pit-fighter-skill-arms-master/compiler.ignore-difficult-to-use-restrictions
    digest: 1fcd66c5b3216a29be3dcb4accd4da323ed439779613d51d061f871c9049c8de
  - target: rule/mordheim/skaven-clan-pestilens/band--clan-pestilens-special-skills-censer-bearer/compiler.censer-bearer-loadout
    digest: 5923fb42398a14523f89e9a2342d051762c42447d21328d2084960930805f412
  - target: rule/trollheim/lustria-clan-pestilens/band--clan-pestilens-special-skills-censer-bearer/compiler.censer-bearer-loadout
    digest: de69d5a5b0c6ccbed3ef9b804a3794b8c8ed2f7b22be82c9ea89e03b8dabb897
  interpretation: Proven Warrior grants the Young'un the equipment and access of a Black Orc; Master of
    Arms and Arms Master allow normally difficult combinations; Censer Bearer requires Black Hunger, grants
    Frenzy and limits the weapon to the Censer. Each contract remains present only in the build that meets
    its requirements.
  cases:
  - id: proven-youngun
    roles:
    - grant
    - accepted
    operation: construction_tag_presence
    attacker:
      band_id: black-orcs
      profile_id: younguns
      main_weapon_id: weapon.double-handed-weapon
      special_rule_ids:
      - band--black-orc-special-skills-proven-warrior
    context:
      tag: compiler.proven-warrior
    expect:
      result.present: true
  - id: proven-boss-rejected
    roles:
    - rejected
    operation: selection_choices
    attacker:
      band_id: black-orcs
      profile_id: black-orc-boss
    context:
      choices:
        ordinary: {}
        illegal:
          special_rule_ids:
          - band--black-orc-special-skills-proven-warrior
    expect:
      result.accepted:
      - ordinary
      result.rejected:
        illegal: Proven Warrior may only be selected by a Young'un
  - id: maneater-master
    roles:
    - grant
    - accepted
    operation: construction_tag_presence
    attacker:
      band_id: maneaters
      profile_id: captain
      main_weapon_id: weapon.double-handed-weapon
      off_hand_id: weapon.sword
      special_rule_ids:
      - band--ogres-special-skills-master-of-arms
    context:
      tag: compiler.master-of-arms
    expect:
      result.present: true
  - id: pit-arms-master
    roles:
    - grant
    - accepted
    operation: construction_tag_presence
    attacker:
      band_id: pit-fighters
      profile_id: pit-king
      main_weapon_id: weapon.flail
      off_hand_id: weapon.dagger
      special_rule_ids:
      - band--pit-fighter-skill-arms-master
    context:
      tag: compiler.ignore-difficult-to-use-restrictions
    expect:
      result.present: true
  - id: streets-arms-master
    roles:
    - grant
    - accepted
    operation: construction_tag_presence
    attacker:
      collection: trollheim
      band_id: chaos-streets-pit-fighters
      profile_id: pit-king
      main_weapon_id: weapon.flail
      off_hand_id: weapon.dagger
      special_rule_ids:
      - band--pit-fighter-skill-arms-master
    context:
      tag: compiler.ignore-difficult-to-use-restrictions
    expect:
      result.present: true
  - id: pestilens-censer
    roles:
    - grant
    - accepted
    operation: construction_tag_presence
    attacker:
      band_id: skaven-clan-pestilens
      profile_id: plague-priest
      main_weapon_id: weapon.censer
      special_rule_ids:
      - band--clan-pestilens-special-skills-black-hunger
      - band--clan-pestilens-special-skills-censer-bearer
    context:
      tag: compiler.censer-bearer-loadout
    expect:
      result.present: true
  - id: lustria-censer
    roles:
    - grant
    - accepted
    operation: construction_tag_presence
    attacker:
      collection: trollheim
      band_id: lustria-clan-pestilens
      profile_id: plague-priest
      main_weapon_id: weapon.censer
      special_rule_ids:
      - band--clan-pestilens-special-skills-black-hunger
      - band--clan-pestilens-special-skills-censer-bearer
    context:
      tag: compiler.censer-bearer-loadout
    expect:
      result.present: true
  - id: missing-black-hunger
    roles:
    - rejected
    operation: selection_choices
    attacker:
      band_id: skaven-clan-pestilens
      profile_id: plague-priest
    context:
      choices:
        ordinary: {}
        bearer:
          special_rule_ids:
          - band--clan-pestilens-special-skills-censer-bearer
    expect:
      result.accepted:
      - ordinary
      result.rejected:
        bearer: Censer Bearer requires Black Hunger
  mutations:
  - id: remove-proven-contract
    path: attacker.construction_tags
    value: []
    cases:
    - proven-youngun
