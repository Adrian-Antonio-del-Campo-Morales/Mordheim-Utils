schema_version: 1
specifications:
- id: natural-attacks-beastmen
  scope_digest: ea4090654a79e79bb19b0855371a062c6a9a10c1ab40f7d8abdb42634a425b97
  category: permanent
  sources:
  - target: rule/mordheim/beastmen-raiders/warhounds-of-chaos--natural-weapons/profile.natural-attacks
    digest: da92080d42da430d20ad92eaa4e0566734cf9790c0f131d40bf902dba633d78a
  interpretation: The profile fights with teeth and claws without the Fist's -1 Strength penalty. It keeps
    exactly its 1 profile attacks and each attack is assigned to the natural weapon.
  cases:
  - id: recipient
    roles:
    - grant
    operation: grant
    defender:
      collection: mordheim
      band_id: beastmen-raiders
      profile_id: warhounds-of-chaos
    context:
      rule_id: warhounds-of-chaos--natural-weapons
    expect:
      result.recipients:
      - warhounds-of-chaos
  - id: compiled-strength
    roles:
    - compiled
    - active
    - consumer
    operation: strength
    attacker:
      collection: mordheim
      band_id: beastmen-raiders
      profile_id: warhounds-of-chaos
    expect:
      result.wound: 4
      result.armour: 4
  - id: attack-count
    roles:
    - consumer
    - boundary
    operation: attacks
    attacker:
      collection: mordheim
      band_id: beastmen-raiders
      profile_id: warhounds-of-chaos
    expect:
      result.attacks: 1
  - id: natural-allocation
    roles:
    - consumer
    operation: allocate
    attacker:
      collection: mordheim
      band_id: beastmen-raiders
      profile_id: warhounds-of-chaos
    expect:
      result.count: 1
      result.weapons.0.tags:
      - weapon.natural-attacks
      - material.normal
  - id: untrained-fist-control
    roles:
    - inactive
    operation: strength
    attacker:
      main_weapon_id: weapon.fist
    expect:
      result.wound: 2
      result.armour: 2
  mutations:
  - id: remove-natural-weapon
    path: attacker.main_weapon.strength_bonus
    value: -1
    cases:
    - compiled-strength
