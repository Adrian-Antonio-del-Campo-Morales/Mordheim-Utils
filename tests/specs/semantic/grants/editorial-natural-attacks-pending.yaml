schema_version: 1
specifications:
- id: natural-attacks-beastmen
  scope_digest: 5fd7034eceb69daeeac4b0ad8bba9f2bc5ba50ca65a102d49b69e25f85d18dc9
  category: permanent
  sources:
  - target: rule/mordheim/beastmen-raiders/warhounds-of-chaos--natural-weapons/profile.natural-attacks
    digest: aba320b9a9e88bb19d9db65abdd3d817fc2e16a20ce971f1536e3565046d8052
  interpretation: The profile fights with teeth and claws without the Fist's -1 Strength penalty. It keeps
    exactly its 1 profile attacks and each attack is assigned to the natural weapon.
  cases:
  - id: recipient
    roles:
    - grant
    operation: grant
    defender:
      collection: mordheim
      band_id: beastmen-raiders
      profile_id: warhounds-of-chaos
    context:
      rule_id: warhounds-of-chaos--natural-weapons
    expect:
      result.recipients:
      - warhounds-of-chaos
  - id: compiled-strength
    roles:
    - compiled
    - active
    - consumer
    operation: strength
    attacker:
      collection: mordheim
      band_id: beastmen-raiders
      profile_id: warhounds-of-chaos
    expect:
      result.wound: 4
      result.armour: 4
  - id: attack-count
    roles:
    - consumer
    - boundary
    operation: attacks
    attacker:
      collection: mordheim
      band_id: beastmen-raiders
      profile_id: warhounds-of-chaos
    expect:
      result.attacks: 1
  - id: natural-allocation
    roles:
    - consumer
    operation: allocate
    attacker:
      collection: mordheim
      band_id: beastmen-raiders
      profile_id: warhounds-of-chaos
    expect:
      result.count: 1
      result.weapons.0.tags:
      - weapon.natural-attacks
      - material.normal
  - id: untrained-fist-control
    roles:
    - inactive
    operation: strength
    attacker:
      main_weapon_id: weapon.fist
    expect:
      result.wound: 2
      result.armour: 2
  mutations:
  - id: remove-natural-weapon
    path: attacker.main_weapon.strength_bonus
    value: -1
    cases:
    - compiled-strength
