      profile_id: beastmen-chieftain
      special_rule_ids:
      - band--beastmen-special-skills-shaggy-hide
    rolls:
    - key: armour
      value: 6
    expect:
      defender.natural_armour_save: 6
      result.target: 6
      result.saved: true
  - id: light-armour-combines
    roles:
    - active
    - consumer
    - boundary
    operation: armour
    attacker:
      main_weapon_id: weapon.mace
    defender:
      band_id: beastmen-raiders
      profile_id: beastmen-chieftain
      special_rule_ids:
      - band--beastmen-special-skills-shaggy-hide
      armour_id: armour.light-armour
    distribution:
      observable: result.saved
      max_rolls: 1
      expected:
        'true': 1/3
        'false': 2/3
  - id: light-armour-shield-combines
    roles:
    - active
    - consumer
    - boundary
    operation: armour
    attacker:
      main_weapon_id: weapon.mace
