- id: stacking-hide-shaggy-hide
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: local
  sources:
  - target: rule/mordheim/beastmen-raiders/band--beastmen-special-skills-shaggy-hide/trait.natural-armour-save
    digest: df8bd3281f775e82cd1039a720b5cba4bca1e29bb3e833b2313fe4d49cd7da29
  - target: rule/mordheim/beastmen-raiders/band--beastmen-special-skills-shaggy-hide/trait.natural-armour-stacks
    digest: df8bd3281f775e82cd1039a720b5cba4bca1e29bb3e833b2313fe4d49cd7da29
  interpretation: Mordheimer / Beastmen Special Skills / Shaggy Hide. Natural armour 6+ stackable with
    equipment; light armour 6+ plus hide produce 5+, plus a shield produce 4+. Strength 4 worsens it by
    one point; ignoring armour suppresses the save. It is neither a special save nor a second independent
    roll.
  cases:
  - id: recipients
    roles:
    - grant
    operation: selectable_grant
    defender:
      band_id: beastmen-raiders
      profile_id: beastmen-chieftain
    context:
      rule_id: band--beastmen-special-skills-shaggy-hide
    expect:
      result.recipients:
      - beastmen-chieftain
      - beastmen-shaman
      - bestigors
      - centigors
  - id: beastmen-shaman-selected-consumer
    roles:
    - compiled
    - active
    - consumer
    operation: armour
    attacker:
      main_weapon_id: weapon.mace
    defender:
      band_id: beastmen-raiders
      profile_id: beastmen-shaman
      special_rule_ids:
      - band--beastmen-special-skills-shaggy-hide
    rolls:
    - key: armour
      value: 6
    expect:
      result.target: 6
      result.saved: true
  - id: bestigors-selected-consumer
    roles:
    - compiled
    - active
    - consumer
    operation: armour
    attacker:
      main_weapon_id: weapon.mace
    defender:
      band_id: beastmen-raiders
      profile_id: bestigors
      special_rule_ids:
      - band--beastmen-special-skills-shaggy-hide
    rolls:
    - key: armour
      value: 6
    expect:
      result.target: 6
      result.saved: true
  - id: centigors-selected-consumer
    roles:
    - compiled
    - active
    - consumer
    operation: armour
    attacker:
      main_weapon_id: weapon.mace
    defender:
      band_id: beastmen-raiders
      profile_id: centigors
      special_rule_ids:
      - band--beastmen-special-skills-shaggy-hide
    rolls:
    - key: armour
      value: 6
    expect:
      result.target: 6
      result.saved: true
  - id: gor-cannot-select-skill
    roles:
    - rejected
    operation: compile
    defender:
      band_id: beastmen-raiders
      profile_id: gor
      special_rule_ids:
      - band--beastmen-special-skills-shaggy-hide
    reject: special rule is not available
  - id: ungor-cannot-select-skill
