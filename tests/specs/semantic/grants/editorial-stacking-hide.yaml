      profile_id: beastmen-chieftain
      special_rule_ids:
      - band--beastmen-special-skills-shaggy-hide
      armour_id: armour.light-armour
      off_hand_id: defence.shield
    distribution:
      observable: result.saved
      max_rolls: 1
      expected:
        'true': 1/2
        'false': 1/2
  - id: strength-four-negates-bare-hide
    roles:
    - inactive
    - boundary
    operation: armour
    attacker:
      main_weapon_id: weapon.mace
      characteristics:
        weapon_skill: 3
        strength: 4
        toughness: 3
        wounds: 1
        initiative: 3
        attacks: 1
    defender:
      band_id: beastmen-raiders
      profile_id: beastmen-chieftain
      special_rule_ids:
      - band--beastmen-special-skills-shaggy-hide
    expect:
      result.eligible: false
      result.saved: false
      result.roll: null
  - id: strength-four-modifies-combined-armour
    roles:
    - boundary
    operation: armour
    attacker:
      main_weapon_id: weapon.mace
      characteristics:
        weapon_skill: 3
        strength: 4
        toughness: 3
        wounds: 1
        initiative: 3
        attacks: 1
    defender:
      band_id: beastmen-raiders
      profile_id: beastmen-chieftain
      special_rule_ids:
      - band--beastmen-special-skills-shaggy-hide
      armour_id: armour.light-armour
    rolls:
    - key: armour
      value: 5
    expect:
      result.target: 6
      result.saved: false
  - id: ignores-armour
    roles:
    - inactive
    - boundary
    operation: armour
    attacker:
      main_weapon_id: weapon.vomit-attack
    defender:
      band_id: beastmen-raiders
