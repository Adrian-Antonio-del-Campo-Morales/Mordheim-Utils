- id: amazon-enemy-rerolls
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: contextual
  sources:
  - target: mechanic/mechanic.amazon-isolationists
    digest: be4226018b601fa9684ba19175baa4197e3a32581ca4d71ba005ec4235e94e62
  - target: rule/mordheim/amazons-lustria/band--special-rules/mechanic.amazon-isolationists
    digest: e07ba4f59d0b7eb9b67f11158727ef4edf22c0ae9ee09150f6b82117c9d8dfd8
  interpretation: 'Amazons / Isolationists: re-rolls failed to-hit rolls only in the first round against
    Lizardmen and Norse. WS4 versus WS3: 2/3 without the re-roll and 8/9 with it. The campaign effects
    of the same entry are not the combat effect traced here.'
  cases:
  - id: recipients
    roles:
    - grant
    operation: grant
    defender:
      band_id: amazons-lustria
      profile_id: serpent-priestess
    context:
      rule_id: band--special-rules
    expect:
      result.recipients:
      - amazon-warriors
      - eagle-warriors
      - jaguar-warriors
      - piranha-warriors
      - serpent-priestess
  - id: compiled
    roles:
    - compiled
    operation: compile
    attacker:
      skill_ids:
      - mechanic.amazon-isolationists
    expect:
      attacker.global_effects.reroll_hits: false
    expect_contains:
      attacker.global_effects.tags:
      - mechanic.amazon-isolationists
  - id: lizardmen-false
    roles:
    - inactive
    - consumer
    - boundary
    operation: hit
    attacker:
      band_id: amazons-lustria
      profile_id: serpent-priestess
    defender:
      band_id: lizardmen
      profile_id: skink-braves
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 3
        initiative: 10
        attacks: 1
    context:
      first_round: false
    distribution:
      observable: result.success
      max_rolls: 2
      expected:
        'true': 2/3
        'false': 1/3
