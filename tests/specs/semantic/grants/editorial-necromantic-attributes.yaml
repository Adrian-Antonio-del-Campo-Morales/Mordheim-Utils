schema_version: 1
specifications:
- id: editorial-necromantic-bone-armour
  scope_digest: 5fd7034eceb69daeeac4b0ad8bba9f2bc5ba50ca65a102d49b69e25f85d18dc9
  category: local
  sources:
  - target: rule/trollheim/khemri-necromancers/band--necromantic-modification-bone-armour/profile.characteristics
    digest: ab78e640e29115d8321faed4dcdeb2e7cb245fad68fe22935da05ba46b0e0517
  interpretation: Khemri p.56, Necromantic Modification Table / bone-armour. The selected upgrade adds
    one to the Abomination profile's toughness (base value 4). Its exclusive grant and its consumption
    by the wound phase are checked; costs and 2D6 acquisition stay outside this combat test.
  cases:
  - id: recipients
    roles:
    - grant
    operation: selectable_grant
    defender:
      collection: trollheim
      band_id: khemri-necromancers
      profile_id: necromantic-abomination
      main_weapon_id: weapon.mace
    context:
      rule_id: band--necromantic-modification-bone-armour
    expect:
      result.recipients:
      - necromantic-abomination
  - id: selected-consumer
    roles:
    - compiled
    - active
    - consumer
    - boundary
    operation: wound
    defender:
      collection: trollheim
      band_id: khemri-necromancers
      profile_id: necromantic-abomination
      main_weapon_id: weapon.mace
      special_rule_ids:
      - band--necromantic-modification-bone-armour
    expect:
      defender.characteristics.toughness: 5
      result.target: 6
    attacker:
      main_weapon_id: weapon.mace
    rolls:
    - key: wound
      value: 4
  - id: unselected-consumer
    roles:
    - inactive
    - boundary
    operation: wound
    defender:
      collection: trollheim
      band_id: khemri-necromancers
      profile_id: necromantic-abomination
      main_weapon_id: weapon.mace
    expect:
      result.target: 5
    attacker:
      main_weapon_id: weapon.mace
    rolls:
    - key: wound
      value: 4
  mutations:
  - id: remove-attribute-bonus
    path: defender.characteristics.toughness
    value: 4
    cases:
    - selected-consumer
