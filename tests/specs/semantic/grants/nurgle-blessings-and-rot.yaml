schema_version: 1
specifications:
- id: carnival-blessings-selection
  scope_digest: ea4090654a79e79bb19b0855371a062c6a9a10c1ab40f7d8abdb42634a425b97
  category: construction
  sources:
  - target: rule/mordheim/carnival-of-chaos/band--blessings-of-nurgle/mechanic.blessings-of-nurgle
    digest: 6a4f1f805681072c66dad8122fca604e7f88e29b45ee9dab1ce5642ef48946e5
  interpretation: In the construction runtime, only Tainted Ones can select one or several Blessings.
    Later purchase and increasing costs are campaign and explicitly separated outside scope.
  cases:
  - id: one-and-many
    roles:
    - grant
    - accepted
    - rejected
    operation: selection_choices
    attacker:
      band_id: carnival-of-chaos
      profile_id: tainted-ones
      special_rule_ids:
      - band--blessings-of-nurgle-nurgles-rot
    context:
      choices:
        one:
          special_rule_ids:
          - band--blessings-of-nurgle-nurgles-rot
        many:
          special_rule_ids:
          - band--blessings-of-nurgle-nurgles-rot
          - band--blessings-of-nurgle-cloud-of-flies
        none:
          special_rule_ids: []
    expect:
      result.accepted:
      - many
      - one
      result.rejected:
        none: Tainted Ones require at least one Blessing of Nurgle
  - id: other-profile-rejected
    roles:
    - rejected
    operation: compile
    attacker:
      band_id: carnival-of-chaos
      profile_id: carnival-master
      special_rule_ids:
      - band--blessings-of-nurgle-nurgles-rot
    reject: special rule is not available
  - id: band-contract-present
    operation: construction_tag_presence
    attacker:
      band_id: carnival-of-chaos
      profile_id: tainted-ones
      special_rule_ids:
      - band--blessings-of-nurgle-nurgles-rot
    context:
      tag: compiler.blessings-of-nurgle
    expect:
      result.present: true
  mutations:
  - id: remove-blessings-contract
    path: attacker.construction_tags
    value: []
    cases:
    - band-contract-present
- id: nurgles-rot-poison-immunity
  scope_digest: ea4090654a79e79bb19b0855371a062c6a9a10c1ab40f7d8abdb42634a425b97
  category: permanent
  sources:
  - target: rule/mordheim/carnival-of-chaos/band--blessings-of-nurgle-nurgles-rot/trait.poison-immune
    digest: 28b42a5eff33d10b3fe6023a97d2b22533d988ad673d9f0164d9db8a35c7113d
  interpretation: In the simulator, Nurgle's Rot grants only immunity to all poisons. Disease, contagion
    and persistence are campaign effects outside the current scope.
  cases:
  - id: recipient
    roles:
    - grant
    - compiled
    operation: selectable_grant
    defender:
      band_id: carnival-of-chaos
      profile_id: tainted-ones
      special_rule_ids:
      - band--blessings-of-nurgle-nurgles-rot
    context:
      rule_id: band--blessings-of-nurgle-nurgles-rot
    expect:
      result.recipients:
      - tainted-ones
  - id: black-lotus-is-suppressed
    roles:
    - consumer
    - boundary
    operation: wound
    attacker:
      main_weapon_id: weapon.mace
      main_poison_id: poison.black-lotus
    defender:
      band_id: carnival-of-chaos
      profile_id: tainted-ones
      special_rule_ids:
      - band--blessings-of-nurgle-nurgles-rot
    context:
      hit_roll: 6
    rolls:
    - key: wound
      value: 1
    expect:
      result.success: false
      result.roll: 1
      result.target: 4
  mutations:
  - id: remove-rot-immunity
    changes:
    - path: defender.global_effects.poison_immunity
      value: false
    - path: defender.global_effects.tags
      value: []
    cases:
    - black-lotus-is-suppressed
