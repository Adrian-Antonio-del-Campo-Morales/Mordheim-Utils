      collection: mordheim
      band_id: black-orcs
      profile_id: black-orc-boss
    context:
      rule_id: band--black-orc-special-skills-eadbasher
    expect:
      result.recipients:
      - black-orc-boss
      - black-orcs
      - younguns
  - id: orc-mob-heroes
    roles:
    - grant
    operation: selectable_grant
    defender:
      collection: mordheim
      band_id: orc-mob
      profile_id: orc-boss
    context:
      rule_id: band--orc-special-skills-eadbasher
    expect:
      result.recipients:
      - orc-big-uns
      - orc-boss
      - orc-shaman
  - id: streets-greenskin-heroes
    roles:
    - grant
    operation: selectable_grant
    defender:
      collection: trollheim
      band_id: chaos-streets-greenskins
      profile_id: orc-boss
    context:
      rule_id: band--orc-special-skills-eadbasher
    expect:
      result.recipients:
      - orc-big-uns
      - orc-boss
      - orc-shaman
  - id: granted-consumer
    roles:
    - active
    - boundary
    - consumer
    operation: injury
    attacker:
      collection: mordheim
      band_id: orc-mob
      profile_id: orc-boss
      special_rule_ids:
      - band--orc-special-skills-eadbasher
    rolls:
    - key: test.injury
      value: 1
    expect:
      result.condition: STUNNED
  mutations:
  - id: remove-granted-eadbasher
    path: attacker.global_effects.tags
    value: []
