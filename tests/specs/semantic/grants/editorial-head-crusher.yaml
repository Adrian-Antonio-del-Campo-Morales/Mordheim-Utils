    context:
      rule_id: band--orc-special-skills-eadbasher
    expect:
      result.recipients:
      - orc-big-uns
      - orc-boss
      - orc-shaman
  - id: streets-greenskin-heroes
    roles:
    - grant
    operation: selectable_grant
    defender:
      collection: trollheim
      band_id: chaos-streets-greenskins
      profile_id: orc-boss
    context:
      rule_id: band--orc-special-skills-eadbasher
    expect:
      result.recipients:
      - orc-big-uns
      - orc-boss
      - orc-shaman
