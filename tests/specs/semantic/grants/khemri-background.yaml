schema_version: 1
specifications:
- id: khemri-foreign-native-construction
  scope_digest: ea4090654a79e79bb19b0855371a062c6a9a10c1ab40f7d8abdb42634a425b97
  category: construction
  sources:
  - target: rule/trollheim/khemri-lahmian-brotherhood/band--background-selection/compiler.foreign-or-native-background
    digest: b7129ad211032e8480329ec4e500f7717c6de5456d35c81c6334018053b1ba27
  interpretation: FighterBuild represents the background applicable to its build through background.foreign
    or background.native; it cannot combine both. Later campaign changes stay outside the duel runtime.
  cases:
  - id: alternatives-exclusive
    roles:
    - grant
    - accepted
    - rejected
    - boundary
    operation: selection_choices
    attacker:
      collection: trollheim
      band_id: khemri-lahmian-brotherhood
      profile_id: lahmian-vampire
    context:
      choices:
        foreign:
          variant_ids:
          - background.foreign
        native:
          variant_ids:
          - background.native
        both:
          variant_ids:
          - background.foreign
          - background.native
    expect:
      result.accepted:
      - foreign
      - native
      result.rejected:
        both: choose exactly one Foreign or Native background
  - id: foreign-only-profile
    roles:
    - consumer
    operation: selection_choices
    attacker:
      collection: trollheim
      band_id: khemri-lahmian-brotherhood
      profile_id: blood-slaves
      variant_ids:
      - background.foreign
    context:
      choices:
        foreign:
          variant_ids:
          - background.foreign
        native:
          variant_ids:
          - background.native
    expect:
      result.accepted:
      - foreign
      result.rejected:
        native: blood-slaves requires the Foreign background
  - id: native-only-profile
    operation: selection_choices
    attacker:
      collection: trollheim
      band_id: khemri-lahmian-brotherhood
      profile_id: spirits
      variant_ids:
      - background.native
    context:
      choices:
        native:
          variant_ids:
          - background.native
        foreign:
          variant_ids:
          - background.foreign
    expect:
      result.accepted:
      - native
      result.rejected:
        foreign: spirits requires the Native background
  - id: contract
    operation: construction_tag_presence
    attacker:
      collection: trollheim
      band_id: khemri-lahmian-brotherhood
      profile_id: lahmian-vampire
    context:
      tag: compiler.foreign-or-native-background
    expect:
      result.present: true
  mutations:
  - id: remove-background-contract
    path: attacker.construction_tags
    value: []
    cases:
    - contract
