schema_version: 1
specifications:
- id: editorial-savage-extra-attack-grant
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: permanent
  sources:
  - target: rule/mordheim/black-orcs/orc-nuttaz--savage/skill.extra-attack
    digest: 8b5d37ee6e1b0df490a0642fca0095e38f4c83f8b2cce4272a8afe9eb33282b8
  depends_on:
  - mechanic/skill.extra-attack
  interpretation: Savage grants every Orc Nutta one additional close-combat attack without changing the
    printed profile or racial maximum. This specification covers only that in-scope effect; its equipment
    restrictions are separate.
  cases:
  - id: only-orc-nuttaz
    roles:
    - grant
    - compiled
    operation: grant
    defender:
      collection: mordheim
      band_id: black-orcs
      profile_id: orc-nuttaz
    context:
      rule_id: orc-nuttaz--savage
    expect:
      result.recipients:
      - orc-nuttaz
  - id: inherent-extra-attack-consumer
    roles:
    - active
    - boundary
    - consumer
    operation: attacks
    attacker:
      collection: mordheim
      band_id: black-orcs
      profile_id: orc-nuttaz
      main_weapon_id: weapon.dagger
    expect:
      attacker.characteristics.attacks: 1
      attacker.global_effects.attacks_bonus: 1
      result.attacks: 2
  mutations:
  - id: remove-savage-extra-attack
    path: attacker.global_effects.attacks_bonus
    value: 0
    cases:
    - inherent-extra-attack-consumer
