- id: middenheim-mordheim
  scope_digest: ea4090654a79e79bb19b0855371a062c6a9a10c1ab40f7d8abdb42634a425b97
  category: contextual
  sources:
  - target: rule/mordheim/mercenaries/band--middenheim-physical-prowess/profile.characteristics
    digest: b91012ef14a9472c72bd7a5ddda47a10e6c29dbeaef0ef73d7234c46eb13f388
  interpretation: Only a selected Middenheim Captain and Champions start with Strength 4 instead of 3.
    Other profiles and an unselected Captain retain Strength 3. The per-fighter API rejects selecting
    this bonus for ineligible profiles; their ordinary builds remain Strength 3.
  interaction_contract:
    reads:
    - build.profile
    - build.variant
    writes:
    - fighter.strength
  cases:
  - id: mercenary-captain-compiled
    roles:
    - compiled
    - grant
    operation: compile
    attacker:
      collection: mordheim
      band_id: mercenaries
      profile_id: mercenary-captain
      special_rule_ids:
      - band--middenheim-physical-prowess
    expect:
      attacker.characteristics.strength: 4
  - id: mercenary-captain-consumer
    roles:
    - active
    - consumer
    - boundary
    operation: strength
    attacker:
      collection: mordheim
      band_id: mercenaries
      profile_id: mercenary-captain
      special_rule_ids:
      - band--middenheim-physical-prowess
    expect:
      result.wound: 4
      result.armour: 4
  - id: champions-compiled
    roles:
    - compiled
    - grant
    operation: compile
    attacker:
      collection: mordheim
      band_id: mercenaries
      profile_id: champions
      special_rule_ids:
      - band--middenheim-physical-prowess
    expect:
      attacker.characteristics.strength: 4
  - id: champions-consumer
    roles:
