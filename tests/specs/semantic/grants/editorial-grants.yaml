- id: middenheim-mordheim
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: contextual
  sources:
  - target: rule/mordheim/mercenaries/band--middenheim-physical-prowess/profile.characteristics
    digest: 4c7ccf893a35f391f23b626da2da7a867905e75f8ca87ab5a081af80b02ac670
  interpretation: Only a selected Middenheim Captain and Champions start with Strength 4 instead of 3.
    Other profiles and an unselected Captain retain Strength 3. The per-fighter API rejects selecting
    this bonus for ineligible profiles; their ordinary builds remain Strength 3.
  interaction_contract:
    reads:
    - build.profile
    - build.variant
    writes:
    - fighter.strength
  cases:
  - id: mercenary-captain-compiled
    roles:
    - compiled
    - grant
    operation: compile
    attacker:
      collection: mordheim
      band_id: mercenaries
      profile_id: mercenary-captain
      special_rule_ids:
      - band--middenheim-physical-prowess
    expect:
      attacker.characteristics.strength: 4
  - id: mercenary-captain-consumer
    roles:
    - active
    - consumer
    - boundary
    operation: strength
    attacker:
      collection: mordheim
      band_id: mercenaries
      profile_id: mercenary-captain
      special_rule_ids:
      - band--middenheim-physical-prowess
    expect:
      result.wound: 4
      result.armour: 4
  - id: champions-compiled
    roles:
    - compiled
    - grant
    operation: compile
    attacker:
      collection: mordheim
      band_id: mercenaries
      profile_id: champions
      special_rule_ids:
      - band--middenheim-physical-prowess
    expect:
