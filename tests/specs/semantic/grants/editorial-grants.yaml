  - id: sorcerer-grant
    roles:
    - compiled
    - grant
    operation: grant
    defender:
      collection: mordheim
      band_id: black-dwarfs
      profile_id: sorcerer
    context:
      rule_id: band--hard-to-kill
    expect:
      result.recipients:
      - bull-centaur
      - chaos-dwarfs
      - gaolers
      - sorcerer
      defender.global_effects.out_of_action_threshold: 6
    expect_contains:
      defender.global_effects.tags:
