schema_version: 1
specifications:
- id: knives-dagger-master
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: contextual
  sources:
  - {target: rule/trollheim/chaos-streets-deathbringers/knives--dagger-master/trait.dagger-master, digest: 45fecab1a93bea2657d6b2fbb58ae66f4c2762e0da7c88e3c3b7cc7639219d04}
  interpretation: Chaos in the Streets p.164 / Knives / Dagger Master. Repite fallos con dagas en el turno
    de carga; no exige que sea la primera ronda. No beneficia otras armas ni turnos sin carga.
    Con HA3 contra HA3, impactar a 4+ pasa de 1/2 a 3/4. Un acierto inicial no se repite.
  cases:
  - id: recipients
    roles: [grant]
    operation: grant
    defender: {collection: trollheim, band_id: chaos-streets-deathbringers, profile_id: knives}
    context: {rule_id: knives--dagger-master}
    expect: {result.recipients: [knives]}
  - id: dagger-first-false-charge-false
    roles: [inactive, boundary]
    operation: hit
    attacker: {collection: trollheim, band_id: chaos-streets-deathbringers, profile_id: knives, main_weapon_id: weapon.dagger}
    context: {first_round: false, charging: false}
    distribution:
      observable: result.success
      max_rolls: 1
      expected: {'true': 1/2, 'false': 1/2}
  - id: dagger-first-false-charge-true
    roles: [active, consumer, boundary]
    operation: hit
    attacker: {collection: trollheim, band_id: chaos-streets-deathbringers, profile_id: knives, main_weapon_id: weapon.dagger}
    context: {first_round: false, charging: true}
    distribution:
      observable: result.success
      max_rolls: 2
      expected: {'true': 3/4, 'false': 1/4}
  - id: dagger-first-true-charge-false
    roles: [inactive, boundary]
    operation: hit
    attacker: {collection: trollheim, band_id: chaos-streets-deathbringers, profile_id: knives, main_weapon_id: weapon.dagger}
    context: {first_round: true, charging: false}
    distribution:
      observable: result.success
      max_rolls: 1
      expected: {'true': 1/2, 'false': 1/2}
  - id: dagger-first-true-charge-true
    roles: [active, consumer, boundary]
    operation: hit
    attacker: {collection: trollheim, band_id: chaos-streets-deathbringers, profile_id: knives, main_weapon_id: weapon.dagger}
    context: {first_round: true, charging: true}
    distribution:
      observable: result.success
      max_rolls: 2
      expected: {'true': 3/4, 'false': 1/4}
  - id: sword-first-false-charge-false
    roles: [inactive, boundary]
    operation: hit
    attacker: {collection: trollheim, band_id: chaos-streets-deathbringers, profile_id: knives, main_weapon_id: weapon.sword}
    context: {first_round: false, charging: false}
    distribution:
      observable: result.success
      max_rolls: 1
      expected: {'true': 1/2, 'false': 1/2}
  - id: sword-first-false-charge-true
    roles: [inactive, boundary]
    operation: hit
    attacker: {collection: trollheim, band_id: chaos-streets-deathbringers, profile_id: knives, main_weapon_id: weapon.sword}
    context: {first_round: false, charging: true}
    distribution:
      observable: result.success
      max_rolls: 1
      expected: {'true': 1/2, 'false': 1/2}
  - id: sword-first-true-charge-false
    roles: [inactive, boundary]
    operation: hit
    attacker: {collection: trollheim, band_id: chaos-streets-deathbringers, profile_id: knives, main_weapon_id: weapon.sword}
    context: {first_round: true, charging: false}
    distribution:
      observable: result.success
      max_rolls: 1
      expected: {'true': 1/2, 'false': 1/2}
  - id: sword-first-true-charge-true
    roles: [inactive, boundary]
    operation: hit
    attacker: {collection: trollheim, band_id: chaos-streets-deathbringers, profile_id: knives, main_weapon_id: weapon.sword}
    context: {first_round: true, charging: true}
    distribution:
      observable: result.success
      max_rolls: 1
      expected: {'true': 1/2, 'false': 1/2}
  - id: success-does-not-reroll
    roles: [compiled, boundary]
    operation: hit
    attacker: {collection: trollheim, band_id: chaos-streets-deathbringers, profile_id: knives, main_weapon_id: weapon.dagger}
    context: {charging: true}
    rolls: [{key: hit, value: 4}]
    expect: {result.success: true, result.rerolled: false}
    expect_contains: {attacker.global_effects.tags: [dagger_master]}
  - id: failed-reroll-is-final
    roles: [active, consumer, boundary]
    operation: hit
    attacker: {collection: trollheim, band_id: chaos-streets-deathbringers, profile_id: knives, main_weapon_id: weapon.dagger}
    context: {charging: true}
    rolls: [{key: hit, value: 1}, {key: hit.reroll, value: 3}]
    expect: {result.success: false, result.rerolled: true}
  - id: ordinary-dagger-does-not-reroll
    roles: [inactive]
    operation: hit
    attacker: {main_weapon_id: weapon.dagger}
    context: {charging: true}
    rolls: [{key: hit, value: 3}]
    expect: {result.success: false, result.rerolled: false}
  mutations:
  - id: remove-dagger-master
    path: attacker.global_effects.tags
    value: []
    cases: [dagger-first-true-charge-true, dagger-first-false-charge-true]
- id: saurus-slayer-duellist
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: contextual
  sources:
  - {target: mechanic/skill.duellist, digest: 5cf69c696199fe00d4a094e2b508b6f4ace38596f0f6a5e9341262dea2fe49c2}
  - {target: rule/mordheim/lustrian-reavers/saurus-slayer--duellist/skill.duellist, digest: d217443c4198fb0dc38748c7d8396a329bb92cbf9cce7e704fd49d79b7994b28}
  interpretation: Mordheimer / Lustrian Reavers / Saurus Slayer / Duellist. Contra un solo adversario
    repite impactos fallidos en la primera ronda, tanto al cargar como al recibir una carga.
    El simulador solo representa duelos 1v1; no se atribuye evidencia al combate con multiples enemigos.
    HA4 contra HA4 requiere 4+, con probabilidad 3/4 al repetir y 1/2 sin repeticion.
  cases:
  - id: recipients
    roles: [grant]
    operation: grant
    defender: {band_id: lustrian-reavers, profile_id: saurus-slayer}
    context: {rule_id: saurus-slayer--duellist}
    expect: {result.recipients: [saurus-slayer]}
  - id: first-false-charge-false
    roles: [inactive, boundary]
    operation: hit
    attacker: {band_id: lustrian-reavers, profile_id: saurus-slayer, main_weapon_id: weapon.mace}
    defender: {characteristics: {weapon_skill: 4, strength: 3, toughness: 3, wounds: 3, initiative: 3, attacks: 1}}
    context: {first_round: false, charging: false}
    distribution:
      observable: result.success
      max_rolls: 1
      expected: {'true': 1/2, 'false': 1/2}
  - id: first-false-charge-true
    roles: [inactive, boundary]
    operation: hit
    attacker: {band_id: lustrian-reavers, profile_id: saurus-slayer, main_weapon_id: weapon.mace}
    defender: {characteristics: {weapon_skill: 4, strength: 3, toughness: 3, wounds: 3, initiative: 3, attacks: 1}}
    context: {first_round: false, charging: true}
    distribution:
      observable: result.success
      max_rolls: 1
      expected: {'true': 1/2, 'false': 1/2}
  - id: first-true-charge-false
    roles: [active, consumer, boundary]
    operation: hit
    attacker: {band_id: lustrian-reavers, profile_id: saurus-slayer, main_weapon_id: weapon.mace}
    defender: {characteristics: {weapon_skill: 4, strength: 3, toughness: 3, wounds: 3, initiative: 3, attacks: 1}}
    context: {first_round: true, charging: false}
    distribution:
      observable: result.success
      max_rolls: 2
      expected: {'true': 3/4, 'false': 1/4}
  - id: first-true-charge-true
    roles: [active, consumer, boundary]
    operation: hit
    attacker: {band_id: lustrian-reavers, profile_id: saurus-slayer, main_weapon_id: weapon.mace}
    defender: {characteristics: {weapon_skill: 4, strength: 3, toughness: 3, wounds: 3, initiative: 3, attacks: 1}}
    context: {first_round: true, charging: true}
    distribution:
      observable: result.success
      max_rolls: 2
      expected: {'true': 3/4, 'false': 1/4}
  - id: compiled-and-successful-hit
    roles: [compiled, boundary]
    operation: hit
    attacker: {band_id: lustrian-reavers, profile_id: saurus-slayer}
    context: {first_round: true}
    rolls: [{key: hit, value: 4}]
    expect: {result.success: true, result.rerolled: false}
    expect_contains: {attacker.global_effects.tags: [skill.duellist]}
  - id: canonical-mechanism-with-dagger
    roles: [active, consumer]
    operation: hit
    attacker: {skill_ids: [skill.duellist], main_weapon_id: weapon.dagger}
    context: {first_round: true}
    rolls: [{key: hit, value: 3}, {key: hit.reroll, value: 4}]
    expect: {result.success: true, result.rerolled: true}
  - id: ordinary-fighter-no-reroll
    roles: [inactive]
    operation: hit
    attacker: {main_weapon_id: weapon.mace}
    context: {first_round: true}
    rolls: [{key: hit, value: 3}]
    expect: {result.success: false, result.rerolled: false}
  mutations:
  - id: remove-duellist
    path: attacker.global_effects.tags
    value: []
    cases: [first-true-charge-true, first-true-charge-false, canonical-mechanism-with-dagger]
