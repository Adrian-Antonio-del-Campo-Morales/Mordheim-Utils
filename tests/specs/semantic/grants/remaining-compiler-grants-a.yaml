schema_version: 1
specifications:
- id: beastmen-and-marauder-mutant-access
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: construction
  sources:
  - target: rule/mordheim/beastmen-raiders/band--beastmen-special-skills-mutant/special-rule.band--beastmen-special-skills-mutant
    digest: a1690f6269e293cd811853b2ee7e05f982f6f8ce55d965ff46610568be782263
  - target: rule/mordheim/marauders-of-chaos/band--marauder-special-skills-mutant/special-rule.band--marauder-special-skills-mutant
    digest: dbed10d3819d0060ba0bb903448df72a3df5b764e405d557e498e60b7fb927fd
  interpretation: Each Mutant selection allows acquiring exactly one external Mutation. Heroes with access
    to the special list may choose it; a second Mutation requires a second grant and is therefore rejected
    in this API.
  cases:
  - id: beastmen-recipients
    roles:
    - grant
    - accepted
    operation: selectable_grant
    defender:
      band_id: beastmen-raiders
      profile_id: beastmen-chieftain
    context:
      rule_id: band--beastmen-special-skills-mutant
      prerequisite_rule_ids:
      - band--mutations-tentacle
    expect:
      result.recipients:
      - beastmen-chieftain
      - beastmen-shaman
      - bestigors
      - centigors
  - id: marauder-recipients
    roles:
    - grant
    - accepted
    operation: selectable_grant
    defender:
      band_id: marauders-of-chaos
      profile_id: marauder-chieftain
    context:
      rule_id: band--marauder-special-skills-mutant
      prerequisite_rule_ids:
      - band--mutations-tentacle
    expect:
      result.recipients:
      - champions
      - condemned
      - marauder-chieftain
      - seer
  - id: one-mutation-compiles
    operation: opposed_attacks
    attacker:
      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 2
        initiative: 3
        attacks: 3
    defender:
      band_id: beastmen-raiders
      profile_id: beastmen-chieftain
      special_rule_ids:
      - band--beastmen-special-skills-mutant
      - band--mutations-tentacle
    expect:
      result.attacks: 2
  - id: two-mutations-rejected
    roles:
    - rejected
    operation: selection_choices
    attacker:
      band_id: beastmen-raiders
      profile_id: beastmen-chieftain
    context:
      choices:
        legal:
          special_rule_ids:
          - band--beastmen-special-skills-mutant
          - band--mutations-tentacle
        illegal:
          special_rule_ids:
          - band--beastmen-special-skills-mutant
          - band--mutations-tentacle
          - band--mutations-spines
    expect:
      result.accepted:
      - legal
      result.rejected:
        illegal: each purchased mutation requires band--beastmen-special-skills-mutant
  mutations:
  - id: remove-tentacle-effect
    path: defender.global_effects.incoming_attacks_modifier
    value: 0
    cases:
    - one-mutation-compiles
- id: chaos-engineer-contract
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: permanent
  sources:
  - target: rule/mordheim/black-dwarfs/band--chaos-dwarf-special-skills-chaos-engineer/mechanic.chaos-engineer
    digest: 39ac05f0a7a11f8c54db147815441563abd0f9713623ac99635b90ee1a2aa7a3
  interpretation: Sorcerer and Gaolers may choose Chaos Engineer. Its search modifier belongs to campaign;
    the duel contract observably keeps the selection and forbids the Engineer itself from equipping Chaos
    Armour.
  cases:
  - id: recipients
    roles:
    - grant
    operation: selectable_grant
    defender:
      band_id: black-dwarfs
      profile_id: sorcerer
    context:
      rule_id: band--chaos-dwarf-special-skills-chaos-engineer
    expect:
      result.recipients:
      - gaolers
      - sorcerer
  - id: contract-present
    roles:
    - compiled
    - consumer
    - boundary
    operation: construction_tag_presence
    attacker:
      band_id: black-dwarfs
      profile_id: sorcerer
      special_rule_ids:
      - band--chaos-dwarf-special-skills-chaos-engineer
    context:
      tag: compiler.chaos-engineer
    expect:
      result.present: true
  mutations:
  - id: remove-engineer-contract
    path: attacker.construction_tags
    value: []
    cases:
    - contract-present
- id: marksmen-quick-reload
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: permanent
  sources:
  - target: rule/mordheim/gunnery-school-of-nuln/marksmen--quick-reload/compiler.quick-reload
    digest: c93cc478066529ef3abd96a7e020fb4443b04867897dbbc58fd28c3a047ba53f
  interpretation: Marksmen have Hunter intrinsically; re-taking Hunter does not stack any additional effect.
  cases:
  - id: recipient
    roles:
    - grant
    operation: grant
    defender:
      band_id: gunnery-school-of-nuln
      profile_id: marksmen
    context:
      rule_id: marksmen--quick-reload
    expect:
      result.recipients:
      - marksmen
  - id: compiled-contract
    roles:
    - compiled
    - consumer
    - boundary
    operation: construction_tag_presence
    attacker:
      band_id: gunnery-school-of-nuln
      profile_id: marksmen
    context:
      tag: compiler.quick-reload
    expect:
      result.present: true
  mutations:
  - id: remove-quick-reload
    path: attacker.construction_tags
    value: []
    cases:
    - compiled-contract
- id: duelist-weapon-knowledge
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: permanent
  sources:
  - target: rule/mordheim/hochland-bandits/duelist--weapon-knowledge/compiler.weapon-knowledge
    digest: 87d42daf1eba8c4e24dff8dcc96f1b61006c731742896ed6b18bf1a6e665fb64
  interpretation: The Duelist may select any weapon obtained by the band, even if it is not on its initial
    list.
  cases:
  - id: recipient
    roles:
    - grant
    operation: grant
    defender:
      band_id: hochland-bandits
      profile_id: duelist
    context:
      rule_id: duelist--weapon-knowledge
    expect:
      result.recipients:
      - duelist
  - id: exotic-weapon-accepted
    roles:
    - compiled
    - consumer
    - boundary
    operation: construction_tag_presence
    attacker:
      band_id: hochland-bandits
      profile_id: duelist
      main_weapon_id: weapon.flail
    context:
      tag: compiler.weapon-knowledge
    expect:
      result.present: true
  mutations:
  - id: remove-knowledge-contract
    path: attacker.construction_tags
    value: []
    cases:
    - exotic-weapon-accepted
- id: renowned-virtue
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: construction
  sources:
  - target: rule/mordheim/bretonnian-chapel-guard/band--renowned-virtue/compiler.renowned-virtue
    digest: 4e0be4b530508c0f755d6377a9e54920d557a7c7eafd2c6ca7d846c320348bbe
  interpretation: The two Knight profiles may choose Renowned Virtue once and must accompany it with exactly
    one Virtue from the original Bretonnian band.
  cases:
  - id: recipients
    roles:
    - grant
    - accepted
    operation: selectable_grant
    defender:
      band_id: bretonnian-chapel-guard
      profile_id: questing-knight
    context:
      rule_id: band--renowned-virtue
      prerequisite_rule_ids:
      - band--virtue-of-valour
    expect:
      result.recipients:
      - knights-errant
      - questing-knight
  - id: selected-contract
    operation: construction_tag_presence
    attacker:
      band_id: bretonnian-chapel-guard
      profile_id: questing-knight
      special_rule_ids:
      - band--renowned-virtue
      - band--virtue-of-valour
    context:
      tag: compiler.renowned-virtue
    expect:
      result.present: true
  - id: exactly-one
    roles:
    - rejected
    operation: selection_choices
    attacker:
      band_id: bretonnian-chapel-guard
      profile_id: questing-knight
    context:
      choices:
        legal:
          special_rule_ids:
          - band--renowned-virtue
          - band--virtue-of-valour
        missing:
          special_rule_ids:
          - band--renowned-virtue
        two:
          special_rule_ids:
          - band--renowned-virtue
          - band--virtue-of-valour
          - band--virtue-of-valour
    expect:
      result.accepted:
      - legal
      result.rejected:
        missing: Renowned Virtue requires exactly one Bretonnian Virtue
        two: Renowned Virtue requires exactly one Bretonnian Virtue
  mutations:
  - id: remove-renowned-contract
    path: attacker.construction_tags
    value: []
    cases:
    - selected-contract
