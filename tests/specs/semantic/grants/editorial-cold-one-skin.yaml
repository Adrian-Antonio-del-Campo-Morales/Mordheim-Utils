    rolls:
    - key: armour
      value: 5
    expect:
      result.target: 6
      result.saved: false
      defender.natural_armour_unmodified: true
  - id: face-6
    roles:
    - active
    - consumer
    - boundary
    operation: armour
    attacker:
      main_weapon_id: weapon.mace
    defender:
      collection: mordheim
      band_id: dark-elves
      profile_id: cold-one-beasthounds
    rolls:
    - key: armour
      value: 6
    expect:
      result.target: 6
