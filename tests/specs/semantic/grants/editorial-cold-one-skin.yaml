- id: editorial-cold-one-skin-dark-elves
  scope_digest: ea4090654a79e79bb19b0855371a062c6a9a10c1ab40f7d8abdb42634a425b97
  category: local
  sources:
  - target: rule/mordheim/dark-elves/cold-one-beasthounds--scaly-skin/trait.natural-armour-save
    digest: 78b86dfd234ebe5f0447c02d612ebbdf7ef8cc408a13f0d164e426e1939eb20d
  - target: rule/mordheim/dark-elves/cold-one-beasthounds--scaly-skin/trait.natural-armour-unmodified
    digest: 78b86dfd234ebe5f0447c02d612ebbdf7ef8cc408a13f0d164e426e1939eb20d
  interpretation: Henchmen / Scaly Skin grants 6+ armour. This edition explicitly protects it from Strength
    modifiers, but not from armour denial. The no-armour control uses Vomit to exercise the generic denial
    consumer, not to generate a critical hit.
  cases:
  - id: recipients
    roles:
    - grant
    - compiled
    operation: grant
    defender:
      collection: mordheim
      band_id: dark-elves
      profile_id: cold-one-beasthounds
    context:
      rule_id: cold-one-beasthounds--scaly-skin
    expect:
      result.recipients:
      - cold-one-beasthounds
  - id: face-1
    roles:
    - active
    - consumer
    - boundary
    operation: armour
    attacker:
      main_weapon_id: weapon.mace
    defender:
      collection: mordheim
      band_id: dark-elves
      profile_id: cold-one-beasthounds
    rolls:
    - key: armour
      value: 1
    expect:
      result.target: 6
      result.saved: false
      defender.natural_armour_unmodified: true
  - id: face-2
    roles:
    - active
    - consumer
    - boundary
    operation: armour
    attacker:
      main_weapon_id: weapon.mace
