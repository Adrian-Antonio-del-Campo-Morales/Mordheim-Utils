schema_version: 1
specifications:
- id: editorial-cold-one-skin-dark-elves
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: local
  sources:
  - target: rule/mordheim/dark-elves/cold-one-beasthounds--scaly-skin/trait.natural-armour-save
    digest: e65efd612d52cd8f5d51ee3332de6fcf55079db5506c11059b48b93b218f63f2
  - target: rule/mordheim/dark-elves/cold-one-beasthounds--scaly-skin/trait.natural-armour-unmodified
    digest: e65efd612d52cd8f5d51ee3332de6fcf55079db5506c11059b48b93b218f63f2
  interpretation: Henchmen / Scaly Skin grants 6+ armour. This edition explicitly protects it from Strength modifiers, but not from armour denial.
    The no-armour control uses Vomit to exercise the generic denial consumer, not to generate a critical hit.
  cases:
  - id: recipients
    roles: [grant, compiled]
    operation: grant
    defender: {collection: mordheim, band_id: dark-elves, profile_id: cold-one-beasthounds}
    context: {rule_id: cold-one-beasthounds--scaly-skin}
    expect: {result.recipients: [cold-one-beasthounds]}
  - id: face-1
    roles: [active, consumer, boundary]
    operation: armour
    attacker: {main_weapon_id: weapon.mace}
    defender: {collection: mordheim, band_id: dark-elves, profile_id: cold-one-beasthounds}
    rolls: [{key: armour, value: 1}]
    expect: {result.target: 6, result.saved: false, defender.natural_armour_unmodified: true}
  - id: face-2
    roles: [active, consumer, boundary]
    operation: armour
    attacker: {main_weapon_id: weapon.mace}
    defender: {collection: mordheim, band_id: dark-elves, profile_id: cold-one-beasthounds}
    rolls: [{key: armour, value: 2}]
    expect: {result.target: 6, result.saved: false, defender.natural_armour_unmodified: true}
  - id: face-3
    roles: [active, consumer, boundary]
    operation: armour
    attacker: {main_weapon_id: weapon.mace}
    defender: {collection: mordheim, band_id: dark-elves, profile_id: cold-one-beasthounds}
    rolls: [{key: armour, value: 3}]
    expect: {result.target: 6, result.saved: false, defender.natural_armour_unmodified: true}
  - id: face-4
    roles: [active, consumer, boundary]
    operation: armour
    attacker: {main_weapon_id: weapon.mace}
    defender: {collection: mordheim, band_id: dark-elves, profile_id: cold-one-beasthounds}
    rolls: [{key: armour, value: 4}]
    expect: {result.target: 6, result.saved: false, defender.natural_armour_unmodified: true}
  - id: face-5
    roles: [active, consumer, boundary]
    operation: armour
    attacker: {main_weapon_id: weapon.mace}
    defender: {collection: mordheim, band_id: dark-elves, profile_id: cold-one-beasthounds}
    rolls: [{key: armour, value: 5}]
    expect: {result.target: 6, result.saved: false, defender.natural_armour_unmodified: true}
  - id: face-6
    roles: [active, consumer, boundary]
    operation: armour
    attacker: {main_weapon_id: weapon.mace}
    defender: {collection: mordheim, band_id: dark-elves, profile_id: cold-one-beasthounds}
    rolls: [{key: armour, value: 6}]
    expect: {result.target: 6, result.saved: true, defender.natural_armour_unmodified: true}
  - id: strength-4
    roles: [boundary]
    operation: armour
    attacker: {main_weapon_id: weapon.mace, characteristics: {weapon_skill: 3, strength: 4, toughness: 3, wounds: 1, initiative: 3, attacks: 1}}
    defender: {collection: mordheim, band_id: dark-elves, profile_id: cold-one-beasthounds}
    rolls: [{key: armour, value: 6}]
    expect: {result.eligible: true, result.saved: true}
  - id: strength-6
    roles: [boundary]
    operation: armour
    attacker: {main_weapon_id: weapon.mace, characteristics: {weapon_skill: 3, strength: 6, toughness: 3, wounds: 1, initiative: 3, attacks: 1}}
    defender: {collection: mordheim, band_id: dark-elves, profile_id: cold-one-beasthounds}
    rolls: [{key: armour, value: 6}]
    expect: {result.eligible: true, result.saved: true}
  - id: armour-denial
    roles: [inactive, boundary]
    operation: armour
    attacker: {main_weapon_id: weapon.vomit-attack}
    defender: {collection: mordheim, band_id: dark-elves, profile_id: cold-one-beasthounds}
    expect: {result.eligible: false, result.saved: false}
  mutations:
  - id: remove-skin
    path: defender.natural_armour_save
    value: 7
    cases: [face-6]
  - id: invert-strength-exception
    path: defender.natural_armour_unmodified
    value: false
    cases: [strength-4]
