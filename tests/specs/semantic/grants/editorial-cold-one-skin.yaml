    operation: armour
    attacker:
      main_weapon_id: weapon.mace
      characteristics:
        weapon_skill: 3
        strength: 6
        toughness: 3
        wounds: 1
        initiative: 3
        attacks: 1
    defender:
      collection: mordheim
      band_id: dark-elves
      profile_id: cold-one-beasthounds
    rolls:
    - key: armour
      value: 6
    expect:
      result.eligible: true
      result.saved: true
  - id: armour-denial
    roles:
    - inactive
    - boundary
    operation: armour
    attacker:
      main_weapon_id: weapon.vomit-attack
