specifications:
- id: editorial-cold-one-skin-dark-elves
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: local
  sources:
  - target: rule/mordheim/dark-elves/cold-one-beasthounds--scaly-skin/trait.natural-armour-save
    digest: 0f40b77c087ff6573828ea2d2f00b37dbede37fae53398581254fe5a6502c5bb
  - target: rule/mordheim/dark-elves/cold-one-beasthounds--scaly-skin/trait.natural-armour-unmodified
    digest: 0f40b77c087ff6573828ea2d2f00b37dbede37fae53398581254fe5a6502c5bb
  interpretation: Henchmen / Scaly Skin grants 6+ armour. This edition explicitly protects it from Strength
    modifiers, but not from armour denial. The no-armour control uses Vomit to exercise the generic denial
    consumer, not to generate a critical hit.
  cases:
  - id: recipients
    roles:
    - grant
    - compiled
    operation: grant
    defender:
      collection: mordheim
      band_id: dark-elves
      profile_id: cold-one-beasthounds
    context:
      rule_id: cold-one-beasthounds--scaly-skin
    expect:
      result.recipients:
      - cold-one-beasthounds
  - id: face-1
    roles:
    - active
    - consumer
    - boundary
    operation: armour
    attacker:
      main_weapon_id: weapon.mace
    defender:
      collection: mordheim
      band_id: dark-elves
      profile_id: cold-one-beasthounds
    rolls:
    - key: armour
      value: 1
    expect:
      result.target: 6
      result.saved: false
      defender.natural_armour_unmodified: true
  - id: face-2
    roles:
    - active
    - consumer
    - boundary
    operation: armour
    attacker:
      main_weapon_id: weapon.mace
    defender:
      collection: mordheim
      band_id: dark-elves
      profile_id: cold-one-beasthounds
    rolls:
    - key: armour
      value: 2
    expect:
      result.target: 6
      result.saved: false
      defender.natural_armour_unmodified: true
  - id: face-3
    roles:
    - active
