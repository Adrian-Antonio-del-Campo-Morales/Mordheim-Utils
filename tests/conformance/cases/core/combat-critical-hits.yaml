#
# Clause: basic-table (scope: YES)
# AUTHORED[basic-table]: 8 scenarios cover the D6 bands 1-5, the save-before-
#   doubling ordering, armour denial, the natural-six entry, and a critical-table
#   modifier (material.dark-elf-blade, +1) shifting a raw 4 into the 5+ band.
#
# Clause: critical-trigger (scope: YES)
# AUTHORED[critical-trigger]: 4 scenarios cover a natural six with target <=5, a
#   six that was required, a non-six wound, and a successful rerolled wound that
#   is not critical (poison.devil-s-toxin).
#
# Clause: damage-stacking (scope: YES)
# AUTHORED[damage-stacking]: 2 scenarios cover a critical that ties another two-
#   wound source (poison.bloodroot) and a multiple-wound source larger than the
#   critical's two (weapon.ball-and-chain, D3), both using the higher value.
#
# Clause: one-per-phase (scope: YES)
# AUTHORED[one-per-phase]: 3 scenarios cover one critical per warrior per close-
#   combat phase, the allowance restored in the next round, and two fighters each
#   scoring one critical in the same phase.
#
# --- Migrated authored scenarios ---
# Source: cases/core/critical-hits.yaml
# One-time migration authorized by the operator; see plan.md.  These
# scenarios were authored from the rule text and the accepted rulings, not
# from engine output.  Migrating them does not certify their interpretation
# or complete coverage of the identity.
# core/combat-critical-hits — trigger, allowance, table bands and damage stacking.
#
# Expectations come from the accepted clauses of
# the knowledge-base clause contracts (sources/knowledge) (identity
# core/combat-critical-hits, clauses critical-trigger / one-per-phase /
# basic-table / damage-stacking), never from engine output.
#
# The basic table is a D6 with critical-table modifiers: every result deals two
# wounds, 3 or more ignores armour, 5 or more adds two to the Injury roll, and
# 1-2 leave armour and Injury untouched (the save comes before the doubling).
#
# The first scenario declares the shared profiles as YAML anchors.
#

- audit_id: core/combat-critical-hits
  id: natural-six-critical-triggers-the-chart
  covers: [critical-trigger, basic-table]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: &s4-attacker {weapon_skill: 3, strength: 4, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: &ws3-s3-t3-w3-i2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 6}
    - {key: round.0.first.attack.0.critical, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.wounds: 1, attacks.0.critical: true, attacks.0.damage: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# "Unless a 6 was required": Strength 1 against Toughness 4 needs a 6 to wound,
# so a rolled six wounds without ever being a critical.  No critical die is
# scripted; the strict tape would fail if one were requested.

- audit_id: core/combat-critical-hits
  id: a-six-that-was-required-is-not-a-critical
  covers: [critical-trigger]
  fighters:
    first:
      main_weapon_id: weapon.sword
      characteristics: {weapon_skill: 3, strength: 1, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 4, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 6}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.critical: false, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# Basic table, result 3 or more: the armour save is ignored.  The defender wears
# light armour, so a wrongly rolled armour die fails the strict tape because it
# was never scripted.

- audit_id: core/combat-critical-hits
  id: critical-result-three-ignores-armour
  covers: [basic-table]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: *s4-attacker
    second:
      main_weapon_id: weapon.mace
      armour_id: armour.light-armour
      characteristics: {<<: *ws3-s3-t3-w3-i2, wounds: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 6}
    - {key: round.0.first.attack.0.critical, value: 3}
    - {key: round.0.first.attack.0.injury.0, value: 1}
    - {key: round.0.first.attack.0.injury.1, value: 1}
  expect_rounds:
    0: {state.second.condition: KNOCKED_DOWN, attacks.0.saved: false}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# Basic table, result 5 or more: +2 to the Injury roll.  Both rolls of one would
# be Knocked Down without the modifier; the +2 makes them Stunned, which is the
# observable that distinguishes the clause.

- audit_id: core/combat-critical-hits
  id: critical-result-five-adds-two-to-injury
  covers: [basic-table]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: *s4-attacker
    second:
      main_weapon_id: weapon.mace
      characteristics: {<<: *ws3-s3-t3-w3-i2, wounds: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 6}
    - {key: round.0.first.attack.0.critical, value: 5}
    - {key: round.0.first.attack.0.injury.0, value: 1}
    - {key: round.0.first.attack.0.injury.1, value: 1}
  expect_rounds:
    0: {state.second.condition: STUNNED}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

