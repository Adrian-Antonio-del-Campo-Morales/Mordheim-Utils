# At most one critical hit per phase: the second natural six in the same pool is
# an ordinary wound and requests no critical die.

- audit_id: core/combat-critical-hits
  id: one-critical-per-close-combat-phase
  covers: [one-per-phase]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {<<: *s4-attacker, attacks: 2}
    second:
      main_weapon_id: weapon.mace
      characteristics: {<<: *ws3-s3-t3-w3-i2, wounds: 4}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.1.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 6}
    - {key: round.0.first.attack.0.critical, value: 1}
    - {key: round.0.first.attack.1.wound, value: 6}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.critical: true, attacks.0.damage: 2,
        attacks.1.critical: false, attacks.1.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The allowance is restored at the start of the next round: the same natural six
