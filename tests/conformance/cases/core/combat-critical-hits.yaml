  covers: [one-per-phase]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: *s4-attacker
    second:
      main_weapon_id: weapon.mace
      characteristics: {<<: *ws3-s3-t3-w3-i2, wounds: 5}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 2
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 6}
    - {key: round.0.first.attack.0.critical, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.1.first.attack.0.hit, value: 4}
    - {key: round.1.first.attack.0.wound, value: 6}
    - {key: round.1.first.attack.0.critical, value: 1}
    - {key: round.1.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.critical: true, attacks.0.damage: 2, state.second.wounds: 3}
    1: {attacks.0.critical: true, attacks.0.damage: 2, state.second.wounds: 1}
  expect_final: {rounds_executed: 2, termination_reason: horizon}

