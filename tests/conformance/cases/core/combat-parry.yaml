# Governing rulings: docs/decisions/design-rulings.md
#
# Clause: parry-attempt (scope: YES)
# AUTHORED[parry-attempt]: 7 scenarios cover the strict beat (higher roll) and
#   the equal and lower rolls, the Strength edge on both sides of the double
#   boundary, the unparryable natural six, and a buckler alone.
#
# Clause: reroll-and-capacity (scope: YES)
# AUTHORED[reroll-and-capacity]: 4 scenarios cover sword-plus-buckler rerolling a
#   failed parry, a failed reroll consuming the single attempt, two swords giving
#   one attempt per phase, and the attempt being renewed in the next round.
#
# --- Migrated authored scenarios ---
# Source: cases/core/parry.yaml
# One-time migration authorized by the operator; see plan.md.  These
# scenarios were authored from the rule text and the accepted rulings, not
# from engine output.  Migrating them does not certify their interpretation
# or complete coverage of the identity.
# core/combat-parry — the parry attempt and its reroll/capacity limits.
#
# Expectations come from the accepted clauses of
# the knowledge-base clause contracts (sources/knowledge) (identity
# core/combat-parry, clauses parry-attempt / reroll-and-capacity), never from
# engine output.  The clause requires a strict comparison (the parry roll must
# beat the hit roll), an attacker Strength strictly below double the defender's,
# an unparryable natural six, one reroll with sword and buckler and a single
# attempt per phase however many parrying weapons are carried.
#
# The first scenario declares the shared profiles as YAML anchors.
#

- audit_id: core/combat-parry
  id: sword-parries-one-hit
  covers: [parry-attempt]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: &ws3-s3-t3-w2-i5 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.sword
      characteristics: &ws3-s3-t3-w2-i2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.parry, value: 5}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.parried: true, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# Beating the hit roll is strict: an equal roll does not parry, and the attack
# continues into its wound roll.

- audit_id: core/combat-parry
  id: an-equal-roll-does-not-beat-the-hit
  covers: [parry-attempt]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: *ws3-s3-t3-w2-i5
    second:
      main_weapon_id: weapon.sword
      characteristics: *ws3-s3-t3-w2-i2
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.parry, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.parried: false, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The Strength limit is strict too: Strength 4 against the defender's Strength 3
# is still below double and may be parried, no parry die at all is requested.

- audit_id: core/combat-parry
  id: strength-below-double-may-be-parried
  covers: [parry-attempt]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {<<: *ws3-s3-t3-w2-i5, strength: 4}
    second:
      main_weapon_id: weapon.sword
      characteristics: *ws3-s3-t3-w2-i2
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.parry, value: 5}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.parried: true, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# Strength equal to double the defender's excludes the parry entirely: no parry
# die is scripted and the strict tape would fail if one were requested.

- audit_id: core/combat-parry
  id: double-strength-cannot-be-parried
  covers: [parry-attempt]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {<<: *ws3-s3-t3-w2-i5, strength: 4}
    second:
      main_weapon_id: weapon.sword
      characteristics: {<<: *ws3-s3-t3-w2-i2, strength: 2}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.parried: false, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# A natural six cannot be parried, and with a single available attempt it closes
# the parry window for the phase.

- audit_id: core/combat-parry
  id: a-natural-six-cannot-be-parried
  covers: [parry-attempt]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: *ws3-s3-t3-w2-i5
    second:
      main_weapon_id: weapon.sword
      characteristics: *ws3-s3-t3-w2-i2
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 6}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.parried: false, state.second.wounds: 1, state.second.parries_remaining: 0}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# A buckler alone parries; it does not improve armour and grants no reroll.

- audit_id: core/combat-parry
  id: a-buckler-alone-parries-one-hit
  covers: [parry-attempt]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: *ws3-s3-t3-w2-i5
    second:
      main_weapon_id: weapon.mace
      off_hand_id: defence.buckler
      characteristics: *ws3-s3-t3-w2-i2
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.parry, value: 5}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.parried: true, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# Sword plus buckler rerolls a failed parry: the first attempt rolls below the
# hit roll and the reroll beats it.

- audit_id: core/combat-parry
  id: sword-and-buckler-reroll-a-failed-parry
  covers: [reroll-and-capacity]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: *ws3-s3-t3-w2-i5
    second:
      main_weapon_id: weapon.sword
      off_hand_id: defence.buckler
      characteristics: *ws3-s3-t3-w2-i2
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.parry, value: 3}
    - {key: round.0.first.attack.0.parry.reroll, value: 5}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.parried: true, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# Two swords still give one attempt per phase: the first hit is parried, the
# second is not, because the phase's single attempt is already spent.

- audit_id: core/combat-parry
  id: two-swords-give-one-attempt-per-phase
  covers: [reroll-and-capacity]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {<<: *ws3-s3-t3-w2-i5, attacks: 2}
    second:
      main_weapon_id: weapon.sword
      off_hand_id: weapon.sword
      characteristics: *ws3-s3-t3-w2-i2
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.1.hit, value: 4}
    - {key: round.0.first.attack.0.parry, value: 5}
    - {key: round.0.first.attack.1.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.0.second.attack.1.hit, value: 1}
  expect_rounds:
    0: {attacks.0.parried: true, attacks.1.parried: false,
        state.second.wounds: 1, state.second.parries_remaining: 0}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# Beating the hit roll is strict in the other direction too: a parry roll below
# the hit roll does not parry and the attack continues into its wound roll.
- audit_id: core/combat-parry
  id: a-parry-roll-below-the-hit-does-not-parry
  covers: [parry-attempt]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: *ws3-s3-t3-w2-i5
    second:
      main_weapon_id: weapon.sword
      characteristics: *ws3-s3-t3-w2-i2
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.parry, value: 3}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.parried: false, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The reroll is spent on the first failure: a failed parry and a failed reroll
# consume the phase's single attempt, so the second hit is not offered a parry
# die either (the strict tape would fail if one were requested).
- audit_id: core/combat-parry
  id: a-failed-parry-reroll-consumes-the-phase-attempt
  covers: [reroll-and-capacity]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {<<: *ws3-s3-t3-w2-i5, attacks: 2}
    second:
      main_weapon_id: weapon.sword
      off_hand_id: defence.buckler
      characteristics: {<<: *ws3-s3-t3-w2-i2, wounds: 3}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.1.hit, value: 4}
    - {key: round.0.first.attack.0.parry, value: 3}
    - {key: round.0.first.attack.0.parry.reroll, value: 3}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.1.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.parried: false, attacks.1.parried: false,
        state.second.wounds: 1, state.second.parries_remaining: 0}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# "One attempt per phase" is renewed each phase: the same defender parries the
# first hit of round one and again the first hit of round two.
- audit_id: core/combat-parry
  id: the-parry-attempt-is-renewed-in-the-next-round
  covers: [reroll-and-capacity]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: *ws3-s3-t3-w2-i5
    second:
      main_weapon_id: weapon.sword
      characteristics: *ws3-s3-t3-w2-i2
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 2
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.parry, value: 5}
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.1.first.attack.0.hit, value: 4}
    - {key: round.1.first.attack.0.parry, value: 5}
    - {key: round.1.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.parried: true, state.second.wounds: 2}
    1: {attacks.0.parried: true, state.second.wounds: 2}
  expect_final: {rounds_executed: 2, termination_reason: horizon}
