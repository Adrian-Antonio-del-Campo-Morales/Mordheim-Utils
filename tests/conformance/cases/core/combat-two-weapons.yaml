#
# Clause: extra-attack (scope: YES)
# AUTHORED[extra-attack]: 5 scenarios cover the extra attack of a second one-
#   handed weapon, its place after the frenzy doubling at A2 and at A1, the
#   absence of the extra with a single weapon, and its absence for an off-hand
#   defence.
#
# Clause: mixed-weapons (scope: YES)
# AUTHORED[mixed-weapons]: 2 scenarios cover both nominations of the single off-
#   hand attack and the remaining attacks with the other weapon, observed through
#   each weapon's own profile.
#
# --- Migrated authored scenarios ---
# Source: cases/core/two-weapons.yaml
# One-time migration authorized by the operator; see plan.md.  These
# scenarios were authored from the rule text and the accepted rulings, not
# from engine output.  Migrating them does not certify their interpretation
# or complete coverage of the identity.
# core/combat-two-weapons — the extra attack and the off-hand allocation.
#
# Expectations come from the accepted clauses of
# the knowledge-base clause contracts (sources/knowledge) (identity
# core/combat-two-weapons, clauses extra-attack / mixed-weapons), never from
# engine output.
#
# The clauses require exactly one additional attack from a second one-handed
# weapon, added after every other attack modifier including doubling; and, with
# two different weapons, exactly one attack resolved with the off-hand profile
# while all remaining attacks use the nominated main weapon.
#
# The attack count is observed through the strict dice tape: the number of hit
# rolls the pipeline requests is the number of attacks it resolved, and an extra
# or missing attack fails the scenario.  Each attack's weapon is observed through
# its own profile: a dagger grants the target +1 armour save, so the same rolled
# five is a save against the dagger and a wound against the mace.
#

- audit_id: core/combat-two-weapons
  id: two-weapons-add-one-attack
  covers: [extra-attack]
  fighters:
    first:
      main_weapon_id: weapon.mace
      off_hand_id: weapon.axe
      characteristics: &ws3-s3-t3-w2-i5-a2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 2}
    second:
      main_weapon_id: weapon.mace
      characteristics: &ws3-s3-t3-w2-i2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.main-weapon-majority, value: true}
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.first.attack.1.hit, value: 1}
    - {key: round.0.first.attack.2.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.wounds: 2, state.round_index: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
  expect_events:
    - {kind: decision, key: round.0.first.main-weapon-majority, value: true}
    - {kind: roll, key: round.0.first.attack.0.hit, sides: 6, value: 1}
    - {kind: roll, key: round.0.first.attack.1.hit, sides: 6, value: 1}
    - {kind: roll, key: round.0.first.attack.2.hit, sides: 6, value: 1}
    - {kind: roll, key: round.0.second.attack.0.hit, sides: 6, value: 1}

# The extra attack comes after the frenzy doubling: A2 doubled is four attacks
# and the second weapon adds the fifth, never six.

- audit_id: core/combat-two-weapons
  id: the-extra-attack-is-not-doubled-by-frenzy
  covers: [extra-attack]
  fighters:
    first:
      main_weapon_id: weapon.mace
      off_hand_id: weapon.axe
      characteristics: *ws3-s3-t3-w2-i5-a2
    second:
      main_weapon_id: weapon.mace
      characteristics: *ws3-s3-t3-w2-i2
  initial_state:
    first: {frenzy: true}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.main-weapon-majority, value: true}
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.first.attack.1.hit, value: 1}
    - {key: round.0.first.attack.2.hit, value: 1}
    - {key: round.0.first.attack.3.hit, value: 1}
    - {key: round.0.first.attack.4.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_initial: {first.frenzy: true}
  expect_rounds:
    0: {state.second.wounds: 2, state.round_index: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# Two different weapons: the off hand resolves exactly one attack with its own
# profile.  The defender wears light armour, so the dagger's +1 target save
# turns the rolled five into a save where the mace would have wounded.

- audit_id: core/combat-two-weapons
  id: different-weapons-give-the-off-hand-one-attack
  covers: [mixed-weapons]
  fighters:
    first:
      main_weapon_id: weapon.mace
      off_hand_id: weapon.dagger
      characteristics: *ws3-s3-t3-w2-i5-a2
    second:
      main_weapon_id: weapon.mace
      armour_id: armour.light-armour
      characteristics: *ws3-s3-t3-w2-i2
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.main-weapon-majority, value: true}
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.first.attack.1.hit, value: 1}
    - {key: round.0.first.attack.2.hit, value: 4}
    - {key: round.0.first.attack.2.wound, value: 4}
    - {key: round.0.first.attack.2.armour, value: 5}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.2.saved: true, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The nomination decides which weapon carries the majority: nominating the
# off-hand weapon moves the dagger profile onto the first two attacks and leaves
# the mace on the last one, so the same rolled five wounds instead.

- audit_id: core/combat-two-weapons
  id: nominating-the-off-hand-weapon-moves-the-profiles
  covers: [mixed-weapons]
  fighters:
    first:
      main_weapon_id: weapon.mace
      off_hand_id: weapon.dagger
      characteristics: *ws3-s3-t3-w2-i5-a2
    second:
      main_weapon_id: weapon.mace
      armour_id: armour.light-armour
      characteristics: *ws3-s3-t3-w2-i2
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.main-weapon-majority, value: false}
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.1.hit, value: 1}
    - {key: round.0.first.attack.2.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.armour, value: 5}
    - {key: round.0.first.attack.2.wound, value: 4}
    - {key: round.0.first.attack.2.armour, value: 5}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.saved: true, attacks.2.saved: false, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

