# core/combat-injury-states — chart bands, highest result and recovery timing.
#
# Expectations come from the accepted clauses of
# the knowledge-base clause contracts (sources/knowledge) (identity
# core/combat-injury-states, clauses chart / highest-result /
# stand-up-strikes-last) and the permanent design rulings, never from engine
# output.
#
# Every band edge of the printed chart has its own scenario: 1 and 2 knocked
# down, 3 and 4 stunned, 5 and 6 out of action.  A sword keeps the chart
# unmodified; a mace would add its concussion clause and turn an injury result
# of 2-4 into Stunned.
#
# The first scenario declares the shared WS3/S3/T3 I2 and I5 profiles as YAML
# anchors; siblings alias them and keep their own dice and expectations.
#

- audit_id: core/combat-injury-states
  id: chart-knocked-down-on-two
  covers: [chart]
  fighters:
    first:
      main_weapon_id: weapon.sword
      characteristics: &ws3-s3-t3-w2-i5 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      # A one-Wound defender is the shortest route to an injury roll: one
      # unsaved wound leaves it at zero Wounds.
      characteristics:
        <<: &ws3-s3-t3-w2-i2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
        wounds: 1
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.injury.0, value: 2}
  expect_rounds:
    0: {state.second.wounds: 0, state.second.condition: KNOCKED_DOWN, state.round_index: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

