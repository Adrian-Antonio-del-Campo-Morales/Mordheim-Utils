# Several unsaved wounds from one hit force more than one injury roll; the
# highest result applies.  The S4 attacker needs a 3+ to wound, so a natural
# six is a critical whose basic-table damage of two overkills the one-Wound
# target and demands two injury rolls.

- audit_id: core/combat-injury-states
  id: highest-injury-result-applies
  covers: [highest-result]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {<<: *ws3-s3-t3-w2-i5, strength: 4}
    second:
      main_weapon_id: weapon.mace
      characteristics: {<<: *ws3-s3-t3-w2-i2, wounds: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 6}
    - {key: round.0.first.attack.0.critical, value: 1}
    - {key: round.0.first.attack.0.injury.0, value: 1}
    - {key: round.0.first.attack.0.injury.1, value: 5}
  expect_rounds:
    0: {state.second.condition: OUT, attacks.0.damage: 2, attacks.0.critical: true}
  expect_final: {rounds_executed: 1, termination_reason: second_out}
  expect_events:
    - {kind: roll, key: round.0.first.attack.0.hit, sides: 6, value: 4}
    - {kind: roll, key: round.0.first.attack.0.wound, sides: 6, value: 6}
    - {kind: roll, key: round.0.first.attack.0.critical, sides: 6, value: 1}
    - {kind: roll, key: round.0.first.attack.0.injury.0, sides: 6, value: 1}
    - {kind: roll, key: round.0.first.attack.0.injury.1, sides: 6, value: 5}

# The highest result, not the first one, decides: the first roll is a Knocked
# Down and the second a Stunned, so the fighter ends Stunned.  The attacker
# carries a sword, so the chart is unmodified; a critical result of 1 adds no
# injury modifier and the critical's damage of two forces both rolls.

- audit_id: core/combat-injury-states
  id: highest-injury-result-beats-the-first-roll
  covers: [highest-result]
  fighters:
    first:
      main_weapon_id: weapon.sword
      characteristics: *ws3-s3-t3-w2-i5
    second:
      main_weapon_id: weapon.mace
      characteristics: {<<: *ws3-s3-t3-w2-i2, wounds: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 6}
    - {key: round.0.first.attack.0.critical, value: 1}
    - {key: round.0.first.attack.0.injury.0, value: 1}
    - {key: round.0.first.attack.0.injury.1, value: 3}
  expect_rounds:
    0: {state.second.condition: STUNNED, attacks.0.damage: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The recovery phase belongs to the fighter whose turn it is: a Stunned warrior
# only drops to Knocked Down on its own turn, one turn at a time.  Both start
# Stunned so neither is yet standing to press an attack; the priority
# consequence of standing up is covered under core/combat-order.

- audit_id: core/combat-injury-states
  id: recovery-belongs-to-the-fighters-own-turn
  covers: [stand-up-strikes-last, chart]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: *ws3-s3-t3-w2-i5
    second:
      main_weapon_id: weapon.mace
      characteristics: *ws3-s3-t3-w2-i2
  initial_state:
    first: {condition: STUNNED}
    second: {condition: STUNNED}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 2
  expect_initial: {first.condition: STUNNED, second.condition: STUNNED}
  expect_rounds:
    0: {state.first.condition: KNOCKED_DOWN, state.second.condition: STUNNED}
    1: {state.first.condition: KNOCKED_DOWN, state.second.condition: KNOCKED_DOWN}
  expect_final: {rounds_executed: 2, termination_reason: horizon}

# The chart applies to an *unsaved* wound: when the armour save holds the last
# Wound, no injury roll is offered at all (the strict tape would fail if one
# were requested) and the defender stays standing and fighting.
- audit_id: core/combat-injury-states
  id: no-injury-roll-when-the-last-wound-is-saved
  covers: [chart]
  fighters:
    first:
      main_weapon_id: weapon.sword
      characteristics: *ws3-s3-t3-w2-i5
    second:
      main_weapon_id: weapon.mace
      armour_id: armour.light-armour
      characteristics: {<<: *ws3-s3-t3-w2-i2, wounds: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.armour, value: 6}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.saved: true, state.second.wounds: 1, state.second.condition: STANDING}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The highest result decides whichever order it is rolled: a Stunned first roll
# and a Knocked Down second roll still leave the fighter Stunned.
- audit_id: core/combat-injury-states
  id: the-highest-injury-result-wins-even-when-it-comes-first
  covers: [highest-result]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {<<: *ws3-s3-t3-w2-i5, strength: 4}
    second:
      main_weapon_id: weapon.mace
      characteristics: {<<: *ws3-s3-t3-w2-i2, wounds: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 6}
    - {key: round.0.first.attack.0.critical, value: 1}
    - {key: round.0.first.attack.0.injury.0, value: 4}
    - {key: round.0.first.attack.0.injury.1, value: 2}
  expect_rounds:
    0: {state.second.condition: STUNNED, attacks.0.damage: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
