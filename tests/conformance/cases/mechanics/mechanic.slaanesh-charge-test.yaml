# --- Authored scenarios ---
# Printed source (Emissary of Chaos, Fanatic Online 94 p.3, Patron Slaanesh): "All enemies must pass
# Leadership to charge the Emissary."  Family model (charge gate): the bearer is hand-built with the
# mechanic injected (WS3 S3 T3 W2 I2 A1 Ld7, mace) and is charged by a hand-built opponent (WS3 S3 T3 W2
# I5 A1 Ld7, mace).  The gate is a 2D6 Leadership test keyed `round.0.<charger>.slaanesh-charge.{0,1}`
# taken before contact: 5+4 fails Ld7 and the voluntary charge is cancelled (no attack, the duel ends
# disengaged); 3+3 passes and the charge resolves as ordinary close combat (natural-1 strikes miss).
# The control is the same charger against a target without the mechanic: no gate die exists.

# The charger fails the gate: no combat dice, the charge is lost.
- audit_id: mechanic/mechanic.slaanesh-charge-test
  id: the-charger-who-fails-the-leadership-gate-cannot-close
  fighters:
    first:
      &slaanesh-charger
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 7}
    second:
      &slaanesh-bearer
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.slaanesh-charge-test]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.slaanesh-charge.0, value: 5}
    - {key: round.0.first.slaanesh-charge.1, value: 4}
  expect_rounds:
    0: {attacks: [], state.first_charged: False, state.failed_charges: ['first'], state.engaged: False}
  expect_final: {rounds_executed: 1, termination_reason: disengaged}

# The same gate passed: the charge proceeds into ordinary close combat.
- audit_id: mechanic/mechanic.slaanesh-charge-test
  id: the-charger-who-passes-the-leadership-gate-closes-and-fights
  fighters:
    first:
      <<: *slaanesh-charger
    second:
      <<: *slaanesh-bearer
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.slaanesh-charge.0, value: 3}
    - {key: round.0.first.slaanesh-charge.1, value: 3}
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first_charged: True, state.engaged: True, state.first.wounds: 2, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# Control: the same charger against a target without the mechanic owes no gate.
- audit_id: mechanic/mechanic.slaanesh-charge-test
  id: a-charger-against-a-target-without-the-mechanic-owes-no-gate
  fighters:
    first:
      <<: *slaanesh-charger
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first_charged: True, state.engaged: True, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
