# --- Authored scenarios ---
# mechanic/weapon.ceremonial-scythe - two-handed, Strength +1, and no other
# weapon, shield or buckler.
#
# Expectations come from the printed rule and the admitted clause `whole`, never
# from engine output.  Both printed prohibitions are declared as refusals because
# the loadout validation, not the duel, is where they apply.
# +1 Strength moves the wound target against Toughness 3 to 3+.

- audit_id: mechanic/weapon.ceremonial-scythe
  id: ceremonial-scythe-wounds-at-the-boosted-strength
  fighters:
    first:
      main_weapon_id: weapon.ceremonial-scythe
      characteristics: &a-ws3-s3-t3-w2-i5 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: &d-ws3-s3-t3-w2-i2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 3}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# One face below the boosted wound target.

- audit_id: mechanic/weapon.ceremonial-scythe
  id: ceremonial-scythe-does-not-wound-one-face-below
  fighters:
    first:
      main_weapon_id: weapon.ceremonial-scythe
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 2}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 0, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# The printed two-handed requirement is declared as a refusal.

- audit_id: mechanic/weapon.ceremonial-scythe
  id: ceremonial-scythe-is-refused-with-another-weapon
  fighters:
    first:
      main_weapon_id: weapon.ceremonial-scythe
      off_hand_id: weapon.dagger
    second:
      main_weapon_id: weapon.mace
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  expect_error: "main weapon occupies both hands"
# The printed prohibition on a shield in the other hand is declared as a refusal.

- audit_id: mechanic/weapon.ceremonial-scythe
  id: ceremonial-scythe-is-refused-with-a-shield
  fighters:
    first:
      main_weapon_id: weapon.ceremonial-scythe
      off_hand_id: defence.shield
    second:
      main_weapon_id: weapon.mace
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  expect_error: "main weapon occupies both hands"

