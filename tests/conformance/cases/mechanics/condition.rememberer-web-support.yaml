- audit_id: mechanic/condition.rememberer-web-support
  id: the-supplied-rememberer-rerolls-a-failed-to-hit-roll
  # The printed benefit: a Slayer Hero fighting a Toughness 5 creature and within six inches of the Rememberer
  # may re-roll any failed To Hit rolls.  The declared miss of two is taken again on a four, which lands the
  # hit; the bearer's declared Strength 4 against the printed Toughness 5 makes the wound face five and the
  # damage one.  The `.hit.reroll` die is the corpus's own hit-re-roll route (the accepted axe-expert and Luck
  # tapes declare the same key).  The earlier note that this tape failed on an unrequested die until the
  # rule's null binding was projected is stale: the re-roll is requested and the case passes.  The printed
  # "once only" limit and the Large-creature half of the gate are authored as the two scenarios below.
  fighters:
    first:
      collection: mordheim
      band_id: dwarf-slayer-cult-web
      profile_id: giant-slayer
      main_weapon_id: weapon.mace
      condition_ids: [condition.rememberer-web-support]
      characteristics: {weapon_skill: 5, strength: 4, toughness: 4, wounds: 1, initiative: 3, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 5, wounds: 2, initiative: 2, attacks: 1}
  duel_context:
    charging: []
    active_participant: first
    nearby:
      - participant_id: rememberer
        side_id: first
        condition: standing
        fighter: {collection: mordheim, band_id: dwarf-slayer-cult-web, profile_id: rememberer}
    distances:
      - [first, rememberer, 6]
  initial_state: {first: {strength: 4}}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.attack.0.rememberer, value: true}
  rolls:
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.first.attack.0.hit.reroll, value: 4}
    - {key: round.0.first.attack.0.wound, value: 5}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: True, attacks.0.wounded: True, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The printed Large half of the gate (2026-11-18): "any Slayer Hero fighting against a Large creature
# or a creature with Toughness 5 or greater".  The opponent here is Toughness 4 - below the Toughness
# half - and is supplied as Large (condition.large-target, whose execution row tags the bearer
# size.large), so only the Large half of the printed disjunction can open the re-roll.  The declared
# miss of two is taken again on a four, which lands the hit; the declared wound face of three does not
# beat the Strength 4 against Toughness 4 target of 4+, so nothing follows the re-roll.  The opponent's
# own blow is a declared natural 1.
- audit_id: mechanic/condition.rememberer-web-support
  id: the-supplied-rememberer-rerolls-against-a-large-creature-below-toughness-five
  fighters:
    first:
      &web-slayer-hero
      collection: mordheim
      band_id: dwarf-slayer-cult-web
      profile_id: giant-slayer
      main_weapon_id: weapon.mace
      condition_ids: [condition.rememberer-web-support]
      characteristics: {weapon_skill: 5, strength: 4, toughness: 4, wounds: 1, initiative: 3, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      condition_ids: [condition.large-target]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 4, wounds: 2, initiative: 2, attacks: 1}
  duel_context:
    &web-rememberer-context
    charging: []
    active_participant: first
    nearby:
      - participant_id: rememberer
        side_id: first
        condition: standing
        fighter: {collection: mordheim, band_id: dwarf-slayer-cult-web, profile_id: rememberer}
    distances:
      - [first, rememberer, 6]
  initial_state: {first: {strength: 4}}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.attack.0.rememberer, value: true}
  rolls:
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.first.attack.0.hit.reroll, value: 4}
    - {key: round.0.first.attack.0.wound, value: 3}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: True, attacks.0.wounded: False, attacks.0.damage: 0, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The printed limit (2026-11-18): the benefit is "Once per game ... may re-roll any failed To Hit rolls
# once only".  The inputs are the first scenario's Toughness 5 duel extended to a second close-combat
# phase (maximum_rounds: 2) with the same declared miss of two in both rounds.  In round 0 the benefit
# is taken: the re-roll of four lands the hit and the wound face of five wounds (Strength 4 against
# Toughness 5 needs 5+), leaving the two-Wound opponent at one.  In round 1 the same failed To Hit roll
# must stand: the printed once-per-game is spent, so the tape declares no
# `round.1.first.attack.0.hit.reroll` die and no second `rememberer` decision - under the strict runner
# an offered re-roll die or decision would be an unscripted request and fail the case, so the absence is
# the assertion.  The opponent's blows are declared natural ones in both rounds.
- audit_id: mechanic/condition.rememberer-web-support
  id: the-supplied-rememberer-reroll-is-offered-once-per-game-only
  fighters:
    first: *web-slayer-hero
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 5, wounds: 2, initiative: 2, attacks: 1}
  duel_context: *web-rememberer-context
  initial_state: {first: {strength: 4}}
  maximum_rounds: 2
  decisions:
    - {key: round.0.first.attack.0.rememberer, value: true}
  rolls:
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.first.attack.0.hit.reroll, value: 4}
    - {key: round.0.first.attack.0.wound, value: 5}
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.1.first.attack.0.hit, value: 2}
    - {key: round.1.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: True, attacks.0.wounded: True, attacks.0.damage: 1, state.second.wounds: 1}
    1: {attacks.0.hit: False, attacks.0.damage: 0, state.second.wounds: 1}
  expect_final: {rounds_executed: 2, termination_reason: horizon}
