#
# AUTHORED: the printed source (Town Cryer 22, Marianna / No Pain: the Countess's No Pain is expressly
#   combined with her Jump Up so the Knocked Down results it produces do not leave her prone) is the
#   recorded contract in packages/python/combat-engine/mordheim_combat/modular/attacks.py: when the
#   defender carries mechanic.marianna-no-pain-jump-up together with skill.jump-up and
#   skill.ignore-pain, an aggregated Knocked Down injury condition becomes Standing.  This is the
#   exception to the general Jump Up print ("not after No Pain"): the injury table itself
#   (phases.py injury_condition) turns Stunned into Knocked Down for No Pain and refuses Jump Up on
#   that knock-down, which the shared skill.jump-up file evidences; this operator then lifts exactly
#   that result.  Semantic note: the engine resolves Jump Up at the Injury roll (the bearer never lies
#   down), as the AUTHORED skill.jump-up model does, rather than as a recovery-phase stand; the
#   scenarios follow that adopted reading.
#
# Family model (the skill.ignore-pain mechanics file).  The attacker is the stronger hand-built fixture
# (WS10 S8 I10, mace): 3+ to hit, 2+ to wound with no critical face, and no parry is eligible against
# twice the bearer's Strength (a mace has none anyway).  The bearer is hand-built with the mechanics
# injected through skill_ids (shared mechanic file: the removal probe reports it inert by design), has
# one Wound so the first wound reaches the Injury table, and contributes no attack (initial_state).
# Injury faces: 1-2 Knocked Down, 3-4 Stunned, 5-6 Out of Action on the printed table.

# --- Authored scenarios ---

- audit_id: mechanic/mechanic.marianna-no-pain-jump-up
  id: a-stunned-result-leaves-the-bearer-standing-through-no-pain-and-jump-up
  fighters:
    first:
      &strong-attacker
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 10, strength: 8, toughness: 3, wounds: 3, initiative: 10, attacks: 1}
    second:
      &bearer
      main_weapon_id: weapon.mace
      skill_ids: [skill.ignore-pain, skill.jump-up, mechanic.marianna-no-pain-jump-up]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 5, attacks: 1}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 5}
    # 3 is Stunned: No Pain makes it Knocked Down, and this combination lets Jump Up lift it.
    - {key: round.0.first.attack.0.injury.0, value: 3}
  expect_rounds:
    0: {state.second.wounds: 0, state.second.condition: STANDING}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

