# --- Authored scenarios ---
# Printed source (Knights of the Bitter Moors, Mutiny in Marienburg p.4, Questing Knight / Righteous
# Charge): see the PARTIAL note.  Family model: the bearer is hand-built with the mechanic injected (WS3
# S3 T3 W2 I5 A1, mace) against a hand-built opponent (WS3 S3 T3 W3 I2 A1 Ld7, mace).  The activation is
# the supplied campaign fact `righteous_charge_active` (the charge the Knight leads with another model
# within 2"), which the compiler accepts only on a mounted build.  On foot WS3 against WS3 hits on 4+
# and the opponent, charged by a fighter that does not cause Fear, takes no Fear test.

# The supplied activation on a bearer that is not mounted is refused by name.
- audit_id: mechanic/mechanic.righteous-charge
  id: a-supplied-righteous-charge-on-an-unmounted-bearer-is-refused
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.righteous-charge]
      trait_overrides: {righteous_charge_active: true}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  expect_error: "Righteous Charge requires a mounted recipient"

# The bearer charging on foot: no activation, so the plain 4+ to hit and no Fear test for the opponent.
- audit_id: mechanic/mechanic.righteous-charge
  id: the-bearer-charging-on-foot-hits-on-four-and-imposes-no-fear
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.righteous-charge]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 3}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit_target: 4, attacks.0.hit: false, state.second.fear_hit_sixes: false, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
