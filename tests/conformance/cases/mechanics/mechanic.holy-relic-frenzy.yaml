# --- Authored scenarios ---
# Printed source (mordheimer.net, Bretonnian Chapel Guard / 0-5 Battle Pilgrims / Holy Relics, bound by
# battle-pilgrims--holy-relics through compiler.holy-relic-frenzy): "If a Battle Pilgrim owns a Holy
# Relic, he gains the ability Frenzy (Reminder: when frenzied, he is immune to Hatred.)"  The grant
# follows the owned piece: the construction layer adds this mechanic to a Battle Pilgrim whose
# owned_item_ids carry the relic (holy_relic_pilgrim_only, the band's own list entry), and the mechanic's
# execution entry sets Frenzy.  Frenzy model (the authored band file ...459fbf1b6b26 is the template): a
# frenzied fighter doubles a supplied attacks 1 into two To Hit dice, and a frenzied fighter is not
# subject to Hatred, so no round.0.<side>.attack.<n>.hit.reroll key exists even against an enemy its
# Hatred would otherwise reach (the Battle Pilgrims' own printed Hatred reaches every enemy).  The owned
# relic also carries defence.holy-relic (an automatic first Leadership pass), which no scenario here
# requests.  Scenarios 1-2 inject the mechanic into a hand-built fixture through skill_ids; scenarios 3-4
# build the printed Battle Pilgrim with the fixture facts, mace in hand.

# The bearer is frenzied: its supplied single attack becomes two To Hit dice (both misses).
- audit_id: mechanic/mechanic.holy-relic-frenzy
  id: the-bearer-is-frenzied-and-strikes-twice
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.holy-relic-frenzy]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      &opponent
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.first.attack.1.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.frenzy: true, attacks.0.hit: false, attacks.1.hit: false, attacks.2.hit: false, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The printed reminder: a frenzied bearer is immune to Hatred, so its two first-round misses (natural 2s)
# are offered no re-roll key although the fixture also carries Hatred.
- audit_id: mechanic/mechanic.holy-relic-frenzy
  id: the-frenzied-bearer-is-immune-to-its-own-hatred
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.holy-relic-frenzy, skill.hatred]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      <<: *opponent
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.first.attack.1.hit, value: 2}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.frenzy: true, attacks.0.hit: false, attacks.1.hit: false, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

