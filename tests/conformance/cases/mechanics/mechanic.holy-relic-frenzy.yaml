  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The control: the same Battle Pilgrim without the relic is not frenzied, strikes once, and its printed
# Hatred re-rolls the first-round miss, which then hits and wounds.
- audit_id: mechanic/mechanic.holy-relic-frenzy
  id: the-battle-pilgrim-without-the-relic-is-not-frenzied-and-keeps-its-hatred
  fighters:
    first:
      collection: mordheim
      band_id: bretonnian-chapel-guard
      profile_id: battle-pilgrims
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      <<: *opponent
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.first.attack.0.hit.reroll, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
