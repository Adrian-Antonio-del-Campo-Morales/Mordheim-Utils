# Conformance authoring scaffold; generated comments, manually authored scenarios.
# audit_id: mechanic/mechanic.sigmar-enlightened
# authoring_status: AUTHORED
# authoring_progress: the admitted clause carries authored scenarios derived from the printed rule and the recorded contract; REVIEWED still requires manual semantic review and execution_status stays UNEXECUTED.
# execution_status: UNEXECUTED (this scaffold has no behavioral result)
#
# Derive inputs and expectations from rule text and accepted rulings.
# Do not derive them from the engine or execute combat during authoring.
# REVIEWED requires semantic review; covers labels alone are insufficient.
# Preserve audit_id when filling this file.
# Governing rulings: docs/decisions/design-rulings.md
#
# AUTHORED: 3 scenarios cover the automatic pass against an Orc opponent and against a Daemon opponent, each with the qualifying opponent supplying the opponent facts and with no Leadership die requested, plus the same Leadership 3 warrior failing the identical test against a Dwarf opponent that qualifies for nothing. Documented gap: the printed clause names Orcs, Goblins and followers of Chaos, while the executor reads the opponent's own tags (species.orc, species.goblin, warband-group.chaotic, nature.daemon, nature.possessed, identity.chaos-follower); nothing in the clause text maps those names to the tags, so each scenario supplies the fact the executor reads and the mapping stays a caller-supplied fact, not an authored decision (leadership.py:33-43).

# --- Authored scenarios ---
# The marked warrior's own Leadership is 3 and his Stupidity roll of 5,5 would fail,
# but the opposing Orc is one of the printed qualifying enemies, so the test passes
# without a die: the declared tape carries no stupidity roll at all and the charge,
# which a failure cancels, stands.
- audit_id: mechanic/mechanic.sigmar-enlightened
  id: an-orc-opponent-is-passed-automatically
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.sigmar-enlightened, mechanic.stupidity]
      trait_overrides: {species: human}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 3}
    second:
      main_weapon_id: weapon.mace
      trait_overrides: {species: orc}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.stupidity_failed: False, state.first_charged: True, attacks.0.damage: 1,
        state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
