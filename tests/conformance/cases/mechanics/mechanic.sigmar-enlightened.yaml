# The control: the same warrior and the same enemy Leadership against a Dwarf, who
# qualifies for nothing, so the test is rolled after all, fails on 5 and 5, and the
# cancelled charge resolves no attack.
- audit_id: mechanic/mechanic.sigmar-enlightened
  id: an-opponent-that-qualifies-for-nothing-forces-the-rolled-test
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.sigmar-enlightened, mechanic.stupidity]
      trait_overrides: {species: human}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 3}
    second:
      main_weapon_id: weapon.mace
      trait_overrides: {species: dwarf}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.stupidity.0, value: 5}
    - {key: round.0.first.stupidity.1, value: 5}
  expect_rounds:
    0: {attacks: [], state.first.stupidity_failed: True, state.first_charged: False,
        state.engaged: False, state.failed_charges: ['first']}
  expect_final: {rounds_executed: 1, termination_reason: disengaged}
