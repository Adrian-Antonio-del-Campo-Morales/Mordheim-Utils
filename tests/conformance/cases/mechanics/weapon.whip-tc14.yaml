# Disarm replaces the injury, including a coup de grace: against a knocked-down opponent the whip
# still rolls to hit (no automatic hit), the hold fails, and the opponent keeps his wounds and his
# condition while losing the mace.  A knocked-down warrior makes no reply.
- audit_id: mechanic/weapon.whip-tc14
  id: the-disarm-still-rolls-to-hit-and-spares-a-knocked-down-enemy
  fighters:
    first:
      main_weapon_id: weapon.whip-tc14
      characteristics: *wh-bearer
    second:
      main_weapon_id: weapon.mace
      characteristics: *wh-opponent
  initial_state: {second: {condition: KNOCKED_DOWN}}
  duel_context: *wh-uncharged
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.attack.0.whip-disarm.main, value: true}
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.disarm-hold, value: 2}
  expect_rounds:
    0: {attacks.0.hit: true, attacks.0.hit_roll: 4, attacks.0.disarm_slot: main, attacks.0.wounded: false,
        state.second.broken_hands: [main], state.second.wounds: 2, state.second.condition: KNOCKED_DOWN}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

