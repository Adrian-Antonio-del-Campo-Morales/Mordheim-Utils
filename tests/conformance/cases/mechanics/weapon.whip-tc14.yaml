# The declared disarm: the mace is named before the hit roll, the 4 hits, the opponent's single
# hold die 4 does not beat it, and the mace is dropped instead of any wound.  The reply of the
# same round is made with fists: Strength 2 needs a 5 against T3, so the 4 that a mace would have
# wounded with fails.
- audit_id: mechanic/weapon.whip-tc14
  id: a-declared-disarm-strips-the-mace-when-the-hold-fails
  fighters:
    first:
      main_weapon_id: weapon.whip-tc14
      characteristics: *wh-bearer
    second:
      main_weapon_id: weapon.mace
      characteristics: *wh-opponent
  duel_context: *wh-uncharged
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.attack.0.whip-disarm.main, value: true}
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.disarm-hold, value: 4}
    - {key: round.0.second.attack.0.hit, value: 4}
    - {key: round.0.second.attack.0.wound, value: 4}
  expect_rounds:
    0: {attacks.0.hit: true, attacks.0.disarm_slot: main, attacks.0.parried: false, attacks.0.wounded: false,
        attacks.0.damage: 0, state.second.broken_hands: [main], state.second.wounds: 2,
        attacks.1.hit: true, attacks.1.wounded: false, state.first.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

