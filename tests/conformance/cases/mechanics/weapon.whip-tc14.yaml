# --- Authored scenarios ---
# mechanic/weapon.whip-tc14 - Town Cryer 14, Mule Skinner / Whip (PDF p.11), ruling "TC14 whip:
# disarm is a declared replacement action" (design-rulings.md, 2026-10-15): melee at Strength as
# user -1, cannot be parried, +1 enemy armour save; the target physical weapon is declared before
# the hit roll; the disarm replaces the injury (including a coup de grace) but still rolls to hit;
# the enemy gets exactly one independent hold parry irrespective of equipment, Strength or the
# whip's no-parry clause, on the ordinary strict-higher comparison (a six cannot be beaten); the
# dropped piece is unavailable for the rest of the combat and the fighter falls back to backups in
# kit order, otherwise to fists, already for the reply of the same round.  Indestructible and
# natural weapons (and fists) are not disarm targets.
#
# Record: execution.yaml weapon.whip-tc14 (strength_bonus -1, target_armour_bonus 1,
# cannot_be_parried).  Consumer: packages/python/combat-engine/mordheim_combat/modular/attacks.py
# (_choose_whip_disarm, decision `round.<i>.<side>.attack.<n>.whip-disarm.<slot>` offered per
# held candidate before the hit; the disarm hold `...attack.<n>.disarm-hold` resolved as a parry
# with can_parry_six and the strict comparison; `broken_hands` gains the slot) and
# modular/equipment.py (a broken main slot falls to the compiled unarmed fallback) with
# modular/rounds.py (the reply of the same round uses the surviving equipment).  The compiled hand
# slots are `main` and `off` (mordheim_core/models.py).
#
# Expectations come from the printed entry and the ruling, never from engine output.  Fixtures:
# a WS3 S3 T3 W2 I5 A1 bearer against a WS3 S3 T3 W2 I2 A1 mace opponent; uncharged, so the bearer
# strikes first.  WS3 against WS3 hits on 4+.  The whip strikes at Strength 2, which wounds T3 on
# 5+ (the mace's Strength 3 on 4+) and carries no save penalty, so the unarmoured opponent is
# granted the printed 6+.  A hold parry must beat the hit roll: against a 4 the die 5 holds and
# the 4 does not; against a 6 nothing can.  The disarmed opponent replies with fists (Strength 2,
# one attack), whose wound die 4 fails where the mace's 4 wounds.

# The printed Strength -1: the bearer's whip strikes at Strength 2, the 5 reaches the T3 target,
# and the granted 6+ save fails on a 1.  The declared decision declines the disarm of the mace.
- audit_id: mechanic/weapon.whip-tc14
  id: the-whip-strikes-at-strength-minus-one
  fighters:
    first:
      main_weapon_id: weapon.whip-tc14
      characteristics: &wh-bearer {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: &wh-opponent {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: &wh-uncharged {charging: [], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.attack.0.whip-disarm.main, value: false}
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 5}
    - {key: round.0.first.attack.0.armour, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: true, attacks.0.wounded: true, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

