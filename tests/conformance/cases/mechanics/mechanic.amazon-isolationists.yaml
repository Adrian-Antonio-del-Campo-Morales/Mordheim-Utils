#
# AUTHORED: 3 scenarios cover the first-round reroll of a missed attack against a Lizardmen opponent, the same against a Norse opponent, and the same miss standing when the opponent is outside the printed list.

# --- Authored scenarios ---
# The printed target of this shared mechanic is an enemy-identity fact, not a creature kind:
# the Lizardmen band supplies the band identity the reroll reads, exactly as the Chaotic
# warband case does for Hatred.  The bearer carries only this mechanic, so the reroll is the
# only difference from the control below.  A one always misses and a six always hits, which
# keeps both cases independent of the opponent profile's Weapon Skill, and the supplied wound
# total keeps the tape on the wound step instead of an injury.
- audit_id: mechanic/mechanic.amazon-isolationists
  id: the-first-round-miss-against-lizardmen-is-taken-again
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.amazon-isolationists]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      collection: mordheim
      band_id: lizardmen
      profile_id: skink-braves
  initial_state:
    second: {attacks: 0}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.first.attack.0.hit.reroll, value: 5}
    - {key: round.0.first.attack.0.wound, value: 5}
    - {key: round.0.first.attack.0.armour, value: 1}
    - {key: round.0.first.attack.0.injury.0, value: 1}
  expect_rounds:
    0: {attacks.0.hit: true, attacks.0.damage: 1, state.second.wounds: 0,
        state.second.condition: KNOCKED_DOWN}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# The printed list names the Norse as well as the Lizardmen, and the second band supplies only
# the other identity, so the same first-round reroll is offered there too.
- audit_id: mechanic/mechanic.amazon-isolationists
