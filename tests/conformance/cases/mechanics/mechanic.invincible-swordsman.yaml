# The target ignores the enemy's Weapon Skill: against WS6 (ordinarily 5+) the bearer's 2 still hits.
- audit_id: mechanic/mechanic.invincible-swordsman
  id: the-target-ignores-the-enemys-weapon-skill
  fighters:
    first:
      main_weapon_id: weapon.sword
      skill_ids: [mechanic.invincible-swordsman]
      characteristics: *is-bearer
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 6, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: *is-uncharged
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.first.attack.0.wound, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: true, attacks.0.hit_target: 2, attacks.0.wounded: false, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
