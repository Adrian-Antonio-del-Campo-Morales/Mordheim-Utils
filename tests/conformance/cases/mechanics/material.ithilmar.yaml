# --- Authored scenarios ---
# mechanic/material.ithilmar — +1 Initiative while the weapon is equipped.
#
# Expectations come from the printed rule and the accepted clause `whole` of
# the knowledge-base clause contracts (sources/knowledge), never from engine output:
# ithilmar adds initiative_bonus 1 to the equipped weapon, which the priority
# resolution sums into the tie-break term.  The two scenarios fix the bonus at
# exactly one point through the acting order: an Initiative 3 bearer with the
# weapon beats an Initiative 3 opponent outright, and an Initiative 2 bearer
# only reaches a tie (a 2 would lose it, a 4 could not), so the unbiased die is
# required.  No charge is declared, so only Initiative decides.
#
# The first scenario declares the shared profiles as YAML anchors; the sibling
# aliases the defender and keeps its own Initiative and priority die.

- audit_id: mechanic/material.ithilmar
  id: ithilmar-raises-initiative-above-an-equal-opponent
  fighters:
    first:
      main_weapon_id: weapon.mace
      main_material_id: material.ithilmar
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 3, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: &equal-opponent {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 3, attacks: 1}
  duel_context: &no-charge {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
  expect_events:
    - {kind: roll, key: round.0.first.attack.0.hit, sides: 6, value: 1}
    - {kind: roll, key: round.0.second.attack.0.hit, sides: 6, value: 1}

- audit_id: mechanic/material.ithilmar
  id: ithilmar-reaches-exactly-a-tie-from-one-below
  fighters:
    first:
      main_weapon_id: weapon.mace
      main_material_id: material.ithilmar
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: *equal-opponent
  duel_context: *no-charge
  maximum_rounds: 1
  rolls:
    - {key: round.0.priority-tie, value: 4}
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
  expect_events:
    - {kind: roll, key: round.0.priority-tie, sides: 6, value: 4}
    - {kind: roll, key: round.0.first.attack.0.hit, sides: 6, value: 1}
    - {kind: roll, key: round.0.second.attack.0.hit, sides: 6, value: 1}
