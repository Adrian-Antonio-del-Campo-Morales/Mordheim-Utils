# A natural 6 with Black Lotus offers the optional critical attempt; declining it leaves the automatic wound, so no wound die is requested at all and the target loses a wound.

- audit_id: mechanic/weapon.poisoned-daggers
  id: a-natural-six-wounds-automatically-without-a-wound-die
  fighters:
    first:
      main_weapon_id: weapon.poisoned-daggers
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.attack.0.lotus-critical, value: false}
  rolls:
