  expect_rounds:
    0: {attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# Taking the printed optional attempt substitutes the ordinary wound roll for the automatic wound, and a critical result doubles the damage.

