#
# AUTHORED: 2 scenarios evidence the printed Injury
#   modifier on a Dagger and its absence.  Documented gap: the printed +1
#   Weapon Skill (contexts.ws) and the opponent's unchanged +1 armour-save
#   modifier are not separately taped here; the tape supplies the hit roll
#   that both Weapon Skills would pass.

# --- Authored scenarios ---
# # While using the dagger the printed +1 on the Injury roll turns the two into a three, so
# # the face that the ordinary chart prints as Knocked Down Stuns instead.
- audit_id: mechanic/skill.knife-fighting
  id: the-dagger-adds-one-to-the-injury-roll
  fighters:
    first:
      main_weapon_id: weapon.dagger
      skill_ids: [skill.knife-fighting]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.armour, value: 5}
    - {key: round.0.first.attack.0.injury.0, value: 2}
  expect_rounds:
    0: {attacks.0.damage: 1, state.second.condition: STUNNED}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# # The same two on the same dagger Knocks Down when the skill is absent, which isolates the
# # printed modifier.
- audit_id: mechanic/skill.knife-fighting
  id: the-same-roll-knocks-down-without-the-skill
  fighters:
    first:
      main_weapon_id: weapon.dagger
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.armour, value: 5}
    - {key: round.0.first.attack.0.injury.0, value: 2}
  expect_rounds:
    0: {state.second.condition: KNOCKED_DOWN}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

