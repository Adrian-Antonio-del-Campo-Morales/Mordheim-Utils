# --- Authored scenarios ---
# Printed source (mordheimer.net, Protectorate of Sigmar / 0-5 Hounds / Devoted, bound by hound--devoted):
# "A Hound may re-roll a failed Leadership check if within 12 inches of the Warrior Priest."  Provider
# model (the authored band file ...357661203cdb and the B04 leadership files are the template): the
# Warrior Priest - the band's only Leader profile - is supplied as a nearby participant of the hound's own
# side with its distance row; the hound (printed Ld6, W1, S4) charges a hand-built Fear-causer, fails its
# Fear test (6+6) and is offered one re-roll as the decision round.0.first.fear.charge.reroll with dice
# .reroll.{0,1}.  A failed charge test ends in termination_reason disengaged.  The hound's natural
# attacks need no weapon; S4 wounds T3 on 3+ and the unarmoured opponent has no save die.

# The re-roll taken: the second pair of ones passes against Ld6 and the charge survives.
- audit_id: mechanic/mechanic.devoted
  id: the-offered-reroll-turns-the-failed-leadership-check-around
  fighters:
    first:
      &hound
      {collection: mordheim, band_id: protectorate-of-sigmar-lotd3, profile_id: hound}
    second:
      &fear_causer
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.causes-fear]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 6}
  duel_context:
    first_id: first
    second_id: second
    charging: [first]
    active_participant: first
    nearby:
      - participant_id: priest
        side_id: first
        condition: standing
        fighter: {collection: mordheim, band_id: protectorate-of-sigmar-lotd3, profile_id: warrior-priest}
    distances:
      - [first, priest, 10]
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.fear.charge.reroll, value: true}
  rolls:
    - {key: round.0.first.fear.charge.0, value: 6}
    - {key: round.0.first.fear.charge.1, value: 6}
    - {key: round.0.first.fear.charge.reroll.0, value: 1}
    - {key: round.0.first.fear.charge.reroll.1, value: 1}
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 1, state.first_charged: true, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The offer is optional: declining it consumes no die, the failure stands and the charge is cancelled.
- audit_id: mechanic/mechanic.devoted
  id: declining-the-offer-keeps-the-first-failure
  fighters:
    first:
      <<: *hound
    second:
      <<: *fear_causer
  duel_context:
    first_id: first
    second_id: second
    charging: [first]
    active_participant: first
    nearby:
      - participant_id: priest
        side_id: first
        condition: standing
        fighter: {collection: mordheim, band_id: protectorate-of-sigmar-lotd3, profile_id: warrior-priest}
    distances:
      - [first, priest, 10]
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.fear.charge.reroll, value: false}
  rolls:
    - {key: round.0.first.fear.charge.0, value: 6}
    - {key: round.0.first.fear.charge.1, value: 6}
  expect_rounds:
    0: {attacks: [], state.first_charged: false, state.failed_charges: ['first'], state.engaged: false}
  expect_final: {rounds_executed: 1, termination_reason: disengaged}

