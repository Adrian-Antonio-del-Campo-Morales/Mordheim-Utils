# Conformance authoring scaffold; generated comments, manually authored scenarios.
# audit_id: mechanic/mechanic.devoted
# authoring_status: AUTHORED
# authoring_progress: 6 authored scenarios (hatred batch, 2026-11-18): the failed Leadership check is
#   re-rolled while the supplied Warrior Priest is within 12 inches and the second pair passes; the offer
#   declined keeps the failure; the Priest at 13 inches offers nothing; a Knocked Down Priest still grants
#   the re-roll (the print requires no standing Priest); a Priest out of action grants nothing; a supplied
#   band-mate who is not the Leader grants nothing.  REVIEWED still requires manual semantic review.
# Carrier note: the recorded contract reads the provider through the recipient's own band tag (a same-band
#   Leader within range), which a hand-built fixture does not carry, so the bearer is the printed hound of
#   the single binding band (mordheim/protectorate-of-sigmar-lotd3, hound--devoted) with its printed
#   Warrior Priest supplied as a nearby participant; the removal probe neutralises this mechanic's
#   execution entry on that build.
# AUTHORED: 6 scenarios cover the re-roll taken and declined, the printed range, a Knocked Down and an out-of-action Warrior Priest and a non-Leader band-mate.  REVIEWED still requires manual semantic review.
# execution_status: UNEXECUTED (this scaffold has no behavioral result)
