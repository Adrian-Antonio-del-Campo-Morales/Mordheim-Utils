# The rolled face of 2 is raised by the printed +1 to 3, which is a Stunned result rather than the knocked-down result the same face gives an ordinary weapon.

- audit_id: mechanic/weapon.death-knife
  id: death-knife-adds-one-to-the-injury-roll
  fighters:
    first:
      main_weapon_id: weapon.death-knife
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: &d-ws3-s3-t3-w1-i2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 5}
    - {key: round.0.first.attack.0.injury.0, value: 2}
  expect_rounds:
    0: {attacks.0.damage: 1, state.second.wounds: 0, state.second.condition: STUNNED}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# Control on the same face: without the printed +1 the lowest injury face is a knocked-down result, so the Stunned result above is the modifier and not the table.

