# Bearing the candelabrum counts as carrying a holy relic, so the Fear test the charge would otherwise require consumes the single shared pass instead of a die: the strict tape has no Fear roll at all and the resource set records the use.

- audit_id: mechanic/weapon.arcane-candelabrum
  id: arcane-candelabrum-grants-the-holy-relic-first-pass
  covers: [whole]
  fighters:
    first:
      main_weapon_id: weapon.arcane-candelabrum
      characteristics: &a-relic-ws3-s3-t3-w2-i5-ld8 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 8}
    second:
      main_weapon_id: weapon.mace
      trait_overrides: {causes_fear: True}
      characteristics: &d-fear-ws3-s3-t3-w2-i2-ld8 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 8}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.resources_spent: ['leadership.holy-relic'], state.first.condition: STANDING}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
