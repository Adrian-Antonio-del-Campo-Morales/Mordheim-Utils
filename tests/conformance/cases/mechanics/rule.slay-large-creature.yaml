# Conformance authoring scaffold; generated comments, manually authored scenarios.
# audit_id: mechanic/rule.slay-large-creature
# authoring_status: AUTHORED
# authoring_progress: 3 authored scenarios: the charge against a supplied Large target gains the printed
#   +1 Strength; the same charge against a non-Large opponent gains no bonus; the bearer who is charged
#   instead of charging gains no bonus.  REVIEWED still requires manual semantic review.
# AUTHORED: the activation, absence and not-charging boundary scenarios are declared below (see
#   authoring_progress); REVIEWED still requires manual semantic review.
# execution_status: UNEXECUTED (this scaffold has no behavioral result)
#
# Derive inputs and expectations from rule text and accepted rulings.
# Do not derive them from the engine or execute combat during authoring.
# REVIEWED requires semantic review; covers labels alone are insufficient.
# Preserve audit_id when filling this file.
# Governing rulings: docs/decisions/design-rulings.md
# Record: sources/knowledge/catalog/mechanics/close-combat.yaml
#
# --- Authored scenarios ---
# Printed text (Halfling Knight, sources/knowledge/catalog/hirelings/hired-swords/grade-2a.yaml):
# "A Halfling Knight, when charging a Large sized creature, gains +1S."  The Large size of the target is
# supplied as a duel fact (condition.large-target, sources/knowledge/catalog/rules/conditions.yaml); no
# size trait is assumed.  The rule is injected on a hand-built fighter through skill_ids, the same
# kind:profile route as cases/mechanics/mechanic.shallya-strictures.yaml.  Arithmetic: S3 wounds T3 on
# 4+; the +1S of the charge against a Large target (S4 vs T3) wounds on 3+, so the one declared wound
# roll of 3 separates every pair.  The printed bonus is for *charging*: being charged grants nothing, and
# in this duel model the charge is the opening phase, so the charged-instead sibling carries the
# not-charging boundary (a later-round tape would add no further printed clause).  Both fighters carry
# maces, so no save die is ever requested; the opponent's own blow is a declared natural 1.

# The bearer charges the supplied Large target: the wound roll of 3 wounds (S4 vs T3 needs 3+).
- audit_id: mechanic/rule.slay-large-creature
  id: charging-a-supplied-large-creature-gains-plus-one-strength
  fighters:
    first:
      &bearer
      main_weapon_id: weapon.mace
      skill_ids: [rule.slay-large-creature]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      condition_ids: [condition.large-target]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 3}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: True, attacks.0.wounded: True, attacks.0.damage: 1, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The same charge against an opponent who is not Large: no bonus, and the same wound roll of 3 fails.
- audit_id: mechanic/rule.slay-large-creature
  id: the-same-charge-against-a-non-large-opponent-gains-no-bonus
  fighters:
    first:
      <<: *bearer
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 3}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: True, attacks.0.wounded: False, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The not-charging boundary: the Large opponent charges the bearer instead.  The printed bonus is only
# for charging, so the bearer's own blow stays S3 and the same wound roll of 3 fails.  The charger opens
# the ledger (attack 0, a declared natural 1); the bearer's blow is attack 1.
- audit_id: mechanic/rule.slay-large-creature
  id: the-bearer-who-is-charged-instead-of-charging-gains-no-bonus
  fighters:
    first:
      <<: *bearer
    second:
      main_weapon_id: weapon.mace
      condition_ids: [condition.large-target]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [second], active_participant: second}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 3}
  expect_rounds:
    0: {attacks.1.hit: True, attacks.1.wounded: False, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
