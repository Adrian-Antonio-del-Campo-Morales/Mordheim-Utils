# --- Authored scenarios ---
# Fixtures: the printed Mad Scientist with fixture characteristics WS3 S3 T3 W2 I5 A1 (printed Ld8
# stays), mace; hand-built opponent (WS3 S3 T3 W3 I2 A1 Ld7, mace); already engaged, no charge.  WS3
# against WS3 hits on 4+; S4 wounds T3 on 3+ and S3 on 4+; no armour die exists.  The Scientist strikes
# first (I5 over I2), so attacks.0 is his blow.

# The brew: Strength 4 at initialization, so the declared three wounds.
- audit_id: mechanic/condition.alchemist-strength
  id: the-supplied-brew-raises-strength-by-one-so-a-three-wounds
  fighters:
    first:
      collection: mordheim
      band_id: masters-of-horror-sylv
      profile_id: mad-scientist
      main_weapon_id: weapon.mace
      condition_ids: [condition.alchemist-strength]
      characteristics: &as-scientist {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: &as-opponent {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 3}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_initial: {first.strength: 4}
  expect_rounds:
    0: {attacks.0.hit: true, attacks.0.wounded: true, attacks.0.damage: 1, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The control: without the brew the identical three fails to wound at Strength 3.
- audit_id: mechanic/condition.alchemist-strength
  id: without-the-brew-the-same-three-fails-to-wound
  fighters:
    first:
      collection: mordheim
      band_id: masters-of-horror-sylv
      profile_id: mad-scientist
      main_weapon_id: weapon.mace
      characteristics: *as-scientist
    second:
      main_weapon_id: weapon.mace
      characteristics: *as-opponent
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 3}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_initial: {first.strength: 3}
  expect_rounds:
    0: {attacks.0.hit: true, attacks.0.wounded: false, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The gate: a hand-built recipient of the supplied brew is refused with the compiler's own sentence.
- audit_id: mechanic/condition.alchemist-strength
  id: the-supplied-brew-is-refused-outside-the-mad-scientist
  fighters:
    first:
      main_weapon_id: weapon.mace
      condition_ids: [condition.alchemist-strength]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 7}
  expect_error: "the Alchemist's supplied potion requires the Mad Scientist recipient"
