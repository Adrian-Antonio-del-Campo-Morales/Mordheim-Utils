#
# AUTHORED: 2 scenarios cover the subject warrior testing despite
#   causing Fear and the same duel without the rule.

# --- Authored scenarios ---
# Both warriors cause Fear, which would ordinarily exempt them; Craven keeps the
# bearer subject to Fear, so he still tests before his charge and the failed test
# cancels it.
- audit_id: mechanic/mechanic.craven
  id: a-fear-causing-warrior-tests-anyway
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.craven, mechanic.causes-fear]
      trait_overrides: {species: human}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 6}
    second:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.causes-fear]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.fear.charge.0, value: 6}
    - {key: round.0.first.fear.charge.1, value: 6}
  expect_rounds:
    0: {attacks: [], state.first_charged: False, state.failed_charges: ['first'], state.engaged: False}
  expect_final: {rounds_executed: 1, termination_reason: disengaged}
# The identical duel without the rule: no Leadership die appears and the charge
# proceeds, isolating the printed exception to Craven.
- audit_id: mechanic/mechanic.craven
  id: without-craven-the-mutual-fear-warrior-tests-nothing
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.causes-fear]
      trait_overrides: {species: human}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 6}
    second:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.causes-fear]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 1, state.first_charged: True, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

