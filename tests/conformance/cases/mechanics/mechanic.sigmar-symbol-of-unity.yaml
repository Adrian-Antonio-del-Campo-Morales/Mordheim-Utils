# Preserve audit_id when filling this file.
# Governing rulings: docs/decisions/design-rulings.md
#
# AUTHORED: 2 scenarios evidence the printed -1 To Hit for a source-qualified
#   enemy warrior (a mercenary warband other than Marienburg or Middenheim), and the
#   printed exclusion of a Marienburg mercenary, which keeps the unmodified target.
#   The canonical hireling print names the qualifying enemies: "Enemy warriors from
#   Witch Hunters, Sisters of Sigmar or mercenary warbands except Marienburg/Middenheim".

# --- Authored scenarios ---
# The printed clause is source-qualified: the -1 reaches enemy warriors from Witch
# Hunters, Sisters of Sigmar or mercenary warbands.  The attacker here is an ordinary
# mercenary warrior of a non-excepted origin, so the plain 4+ of two equal Weapon
# Skills becomes 5+ and the declared four misses.
- audit_id: mechanic/mechanic.sigmar-symbol-of-unity
  id: an-ordinary-enemy-needs-five-to-hit-the-priest
  fighters:
    first:
      main_weapon_id: weapon.mace
      trait_overrides: {mercenary_origin: reikland}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
      skill_ids: [mechanic.sigmar-symbol-of-unity]
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: false, attacks.0.damage: 0, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# The printed exception is the other way round from the one this file first recorded:
# Marienburg and Middenheim mercenaries are the excluded origins, so a Marienburg
# mercenary keeps the unmodified 4+ and the same declared four hits and wounds.
- audit_id: mechanic/mechanic.sigmar-symbol-of-unity
  id: a-human-mercenary-is-excluded
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
      trait_overrides: {mercenary_origin: marienburg}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
      skill_ids: [mechanic.sigmar-symbol-of-unity]
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: true, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

