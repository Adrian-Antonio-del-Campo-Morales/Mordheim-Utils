# --- Authored scenarios ---
# mechanic/weapon.long-boat-hook - two-handed, Strength -1 and Strike First in
# the first round of any close combat.
#
# Expectations come from the printed rule and the admitted clause `whole`, never
# from engine output.  The two-round scenario shows the printed turn scope: the
# bearer opens the first round and the defender opens the second.
# Strength 2 against Toughness 3 wounds on a 5+, so the 4 that would wound at the bearer's own Strength 3 fails.

- audit_id: mechanic/weapon.long-boat-hook
  id: long-boat-hook-attacks-at-one-less-strength
  fighters:
    first:
      main_weapon_id: weapon.long-boat-hook
      characteristics: &a-ws3-s3-t3-w2-i5 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: &d-ws3-s3-t3-w2-i2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 0, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# Neither fighter charges, so only the printed strike-first priority can lift the lower-Initiative bearer above the defender.

- audit_id: mechanic/weapon.long-boat-hook
  id: long-boat-hook-strikes-first-in-the-first-round
  fighters:
    first:
      main_weapon_id: weapon.long-boat-hook
      characteristics: &a-ws3-s3-t3-w2-i2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.wounds: 2, state.first.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
  expect_events:
    - {kind: roll, key: round.0.first.attack.0.hit, sides: 6, value: 1}
    - {kind: roll, key: round.0.second.attack.0.hit, sides: 6, value: 1}
# The printed Strike First is scoped to the first round of the close combat: the second round's tape opens with the higher-Initiative defender.

- audit_id: mechanic/weapon.long-boat-hook
  id: long-boat-hook-stops-striking-first-after-the-first-round
  fighters:
    first:
      main_weapon_id: weapon.long-boat-hook
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 2
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.1.second.attack.0.hit, value: 1}
    - {key: round.1.first.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.wounds: 2, state.first.wounds: 2}
    1: {state.second.wounds: 2, state.first.wounds: 2}
  expect_final: {rounds_executed: 2, termination_reason: horizon}
  expect_events:
    - {kind: roll, key: round.0.first.attack.0.hit, sides: 6, value: 1}
    - {kind: roll, key: round.0.second.attack.0.hit, sides: 6, value: 1}
    - {kind: roll, key: round.1.second.attack.0.hit, sides: 6, value: 1}
    - {kind: roll, key: round.1.first.attack.0.hit, sides: 6, value: 1}
