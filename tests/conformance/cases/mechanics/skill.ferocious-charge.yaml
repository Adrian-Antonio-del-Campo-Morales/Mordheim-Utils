# --- Authored scenarios ---
# The charge doubles the printed Attacks 1 into two attacks and the same turn
# raises the To Hit target from the ordinary 4 to 5, so the first attack needs the
# declared five while the second, rolled as a two, fails.
- audit_id: mechanic/skill.ferocious-charge
  id: the-charging-turn-doubles-the-pool-and-penalises-the-hit
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [skill.ferocious-charge]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.ferocious-charge, value: true}
  rolls:
    - {key: round.0.first.attack.0.hit, value: 5}
    - {key: round.0.first.attack.1.hit, value: 2}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit_target: 5, attacks.0.damage: 1, attacks.1.hit: False, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# The same charging turn without the skill: a single attack at the ordinary To Hit
# target of four, which fixes both printed terms to the skill.
- audit_id: mechanic/skill.ferocious-charge
  id: without-the-skill-one-attack-keeps-the-ordinary-target
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit_target: 4, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

