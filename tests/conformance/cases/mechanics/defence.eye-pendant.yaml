  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: *ep-undead-attacker
    second:
      main_weapon_id: weapon.mace
      defence_ids: [defence.eye-pendant]
      characteristics: *ep-defender
  initial_state: {second: {attacks: 0}}
  duel_context: *ep-charging-first
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.special.ward, value: 3}
  expect_rounds:
    0: {state.first.charm_attack_blocked: false, attacks.0.saved: false, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# No retained success: the Undead attacker that passed in the first turn (and
# missed) is tested again in the second and the failure blocks that turn.
- audit_id: mechanic/defence.eye-pendant
  id: the-undead-attacker-tests-again-each-combat-turn
  fighters:
    first:
      main_weapon_id: weapon.mace
      trait_overrides: {creature_kind: undead}
      characteristics: *ep-undead-attacker
    second:
      main_weapon_id: weapon.mace
      defence_ids: [defence.eye-pendant]
      characteristics: *ep-defender
  initial_state: {second: {attacks: 0}}
  duel_context: *ep-charging-first
  maximum_rounds: 2
  rolls:
    - {key: round.0.first.eye-pendant.0, value: 3}
    - {key: round.0.first.eye-pendant.1, value: 3}
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.1.first.eye-pendant.0, value: 5}
    - {key: round.1.first.eye-pendant.1, value: 4}
  expect_rounds:
    0: {state.first.charm_attack_blocked: false, attacks.0.hit: false, state.second.wounds: 2}
    1: {state.first.charm_attack_blocked: true, state.second.wounds: 2}
  expect_final: {rounds_executed: 2, termination_reason: horizon}
