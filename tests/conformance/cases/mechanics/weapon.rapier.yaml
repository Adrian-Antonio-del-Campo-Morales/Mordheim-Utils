# The first strike hits and fails to wound, so the printed Barrage continues with the next attack one point harder to land: the continuation needs a 5 and wounds the target.

- audit_id: mechanic/weapon.rapier
  id: barrage-continues-after-a-hit-that-fails-to-wound
  covers: [barrage]
  fighters:
    first:
      main_weapon_id: weapon.rapier
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  decisions:
