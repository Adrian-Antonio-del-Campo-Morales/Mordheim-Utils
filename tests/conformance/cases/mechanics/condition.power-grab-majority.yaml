# A race is either the majority or the minority at match start, never both: the supplied-result
# resolver refuses the pair with its own sentence.
- audit_id: mechanic/condition.power-grab-majority
  id: the-majority-and-minority-results-cannot-both-be-supplied
  fighters:
    first:
      collection: mordheim
      band_id: underworld-alliance-mim
      profile_id: goblin-bully
      main_weapon_id: weapon.club
      condition_ids: [condition.power-grab-majority, condition.power-grab-minority]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 4, attacks: 1}
  expect_error: "choose only one supplied result of the same potion table"

# The recipient gate: the adjustment belongs to the Underworld Alliance, so a hand-built fixture is
# refused by the compiler's own sentence.
- audit_id: mechanic/condition.power-grab-majority
