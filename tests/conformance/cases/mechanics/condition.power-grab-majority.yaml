# --- Authored scenarios ---
# Fear 2D6 test: a total at or under Leadership passes.  The fear-causer charges and is silenced
# (attacks: 0), so the tape is the Bully's charged Fear pair and its single hit die (a natural 1, so no
# wound die exists); the Bully carries the band list's club.

# The majority race is supplied Leadership 8 and passes the charged Fear test on an 8.
- audit_id: mechanic/condition.power-grab-majority
  id: the-majority-race-is-supplied-leadership-eight-and-passes-the-fear-test-on-an-8
  fighters:
    first:
      &power-grab-majority-bully
      collection: mordheim
      band_id: underworld-alliance-mim
      profile_id: goblin-bully
      main_weapon_id: weapon.club
      condition_ids: [condition.power-grab-majority]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 4, attacks: 1}
    second:
      &power-grab-majority-fear-causer
      trait_overrides: {causes_fear: true}
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [second], active_participant: second}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.fear.charged.0, value: 4}
    - {key: round.0.first.fear.charged.1, value: 4}
    - {key: round.0.first.attack.0.hit, value: 1}
  expect_fighters: {first.characteristics.leadership: 8}
  expect_rounds:
    0: {state.first.fear_hit_sixes: false, attacks.0.hit: false, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

