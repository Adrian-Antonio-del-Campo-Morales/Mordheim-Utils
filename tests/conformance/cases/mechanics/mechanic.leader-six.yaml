  id: the-standing-leader-lends-his-value
  fighters:
    first:
      main_weapon_id: weapon.mace
      trait_overrides: {stupidity: true}
      collection: mordheim
      band_id: carnival-of-chaos
      profile_id: brethren
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 3}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  initial_state:
    first: {attacks: 0}
  duel_context: {first_id: first, second_id: second, charging: [first], active_participant: first,
    distances: [[first, carnival-master, 4]],
    nearby: [{participant_id: carnival-master, side_id: first, condition: standing,
              fighter: {collection: mordheim, band_id: carnival-of-chaos, profile_id: carnival-master}}]}
  maximum_rounds: 1
