  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The control: the plain fist is Strength as user -1 and capped to one attack, so only one hit die is
# rolled and the same wound face of four fails against Toughness 3 (5+ needed).
- audit_id: mechanic/mechanic.ogre-unarmed
  id: without-the-operator-the-fist-is-penalised-and-capped-to-one-attack
  fighters:
    first:
      main_weapon_id: weapon.fist
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 2, leadership: 7}
    second:
      <<: *opponent
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: true, attacks.0.wounded: false, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
