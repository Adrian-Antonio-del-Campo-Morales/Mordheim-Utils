# --- Authored scenarios ---
# Printed source (Khemri p.90, Lahmian Vampire Special Skills / Seduction, bound by
# band--lahmian-special-skills-seduction): at the start of the Combat phase the Vampire first takes a
# Leadership test; if she passes she chooses an enemy in base contact, which must pass its own Leadership
# test or is controlled by the Vampire's player; the original owner may try to regain control in each
# Recovery phase by passing a Leadership test; if the Vampire attacks the seduced warrior the control ends.
# Operator model (the authored band file ...e460df03ebdf is the template): the Vampire's own dice are
# round.<r>.<owner>.lahmian-seduction.own-test.0/.1, the choice is a decision at
# round.<r>.<target>.lahmian-seduction, the enemy's own dice are .0/.1, a failure sets
# state.<target>.charm_attack_blocked and a lasting control, and the regain test on the victim's own turn
# is a decision at round.<r>.<target>.lahmian-seduction.regain-control with dice .0/.1.

# The printed order: the Vampire's own test (1+1 against Ld8) passes, then the chosen enemy's own test
# (6+6 against Ld7) fails and bars it for the round.
- audit_id: mechanic/mechanic.lahmian-seduction
  id: the-vampires-own-test-passes-and-the-target-fails-its-own
  fighters:
    first:
      &vampire
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.lahmian-seduction]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 8}
    second:
      &target
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.second.lahmian-seduction, value: true}
  rolls:
    - {key: round.0.first.lahmian-seduction.own-test.0, value: 1}
    - {key: round.0.first.lahmian-seduction.own-test.1, value: 1}
    - {key: round.0.second.lahmian-seduction.0, value: 6}
    - {key: round.0.second.lahmian-seduction.1, value: 6}
    - {key: round.0.first.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.charm_attack_blocked: true, state.second.condition: STANDING, attacks.0.hit: false}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The Vampire's own test fails (6+6 against Ld8): the enemy is left alone and no target die exists.
- audit_id: mechanic/mechanic.lahmian-seduction
  id: a-failed-own-test-leaves-the-victim-unbarred
  fighters:
    first:
      <<: *vampire
    second:
      <<: *target
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.lahmian-seduction.own-test.0, value: 6}
    - {key: round.0.first.lahmian-seduction.own-test.1, value: 6}
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.charm_attack_blocked: false, attacks.0.hit: false, attacks.1.hit: false}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

