# The control lasts: in the victim's own turn the printed regain test is taken and fails (6+6), so it
# stays barred.  The Vampire is silenced so no attack of hers ends the control first.
- audit_id: mechanic/mechanic.lahmian-seduction
  id: the-controlled-warrior-fails-the-regain-test-and-stays-barred
  fighters:
    first:
      <<: *vampire
    second:
      <<: *target
  initial_state: {first: {attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 2
  decisions:
    - {key: round.0.second.lahmian-seduction, value: true}
    - {key: round.1.second.lahmian-seduction.regain-control, value: true}
  rolls:
    - {key: round.0.first.lahmian-seduction.own-test.0, value: 1}
    - {key: round.0.first.lahmian-seduction.own-test.1, value: 1}
    - {key: round.0.second.lahmian-seduction.0, value: 6}
    - {key: round.0.second.lahmian-seduction.1, value: 6}
    - {key: round.1.second.lahmian-seduction.regain-control.0, value: 6}
    - {key: round.1.second.lahmian-seduction.regain-control.1, value: 6}
  expect_rounds:
    0: {state.second.charm_attack_blocked: true}
    1: {state.second.charm_attack_blocked: true, state.second.condition: STANDING}
  expect_final: {rounds_executed: 2, termination_reason: horizon}

