#   fear-causer, and no Animosity die is asked of it.

# --- Authored scenarios ---
# Every strike is a natural 1 so no wound die exists; the opponent is silenced (attacks: 0).

# The required charge is declared: the Nuttaz under the supplied compulsion fights its printed Attack
# plus the Savage extra attack.
- audit_id: mechanic/condition.nuttaz-charge
  id: the-nuttaz-making-its-required-charge-fights
  fighters:
    first:
      collection: mordheim
      band_id: black-orcs
      profile_id: orc-nuttaz
      main_weapon_id: weapon.axe
      condition_ids: [condition.nuttaz-charge]
    second:
      &nuttaz-opponent
      characteristics: {weapon_skill: 3, strength: 3, toughness: 4, wounds: 3, initiative: 1, attacks: 1, leadership: 7}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.first.attack.1.hit, value: 1}
  expect_rounds:
    0: {state.first_charged: true, attacks.0.hit: false, attacks.1.hit: false, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The compulsion: the supplied fact says the Nuttaz is actually charging, so a duel in which nobody
# charges contradicts it and is refused at duel start.
- audit_id: mechanic/condition.nuttaz-charge
  id: the-supplied-compulsion-without-a-declared-charge-is-refused
  fighters:
    first:
      collection: mordheim
      band_id: black-orcs
      profile_id: orc-nuttaz
      main_weapon_id: weapon.axe
      condition_ids: [condition.nuttaz-charge]
    second: *nuttaz-opponent
  duel_context: {charging: [], active_participant: first}
  expect_error: "A supplied compulsory charge requires its initial in-range charging attempt"

# The control: the same Nuttaz without the supplied fact may stand uncharging and the duel runs.
