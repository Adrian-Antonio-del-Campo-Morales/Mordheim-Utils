      profile_id: malignant-spirits
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 4, strength: 4, toughness: 3, wounds: 1, initiative: 5, attacks: 1}
    second: *summoned-opponent
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.fear.charged.0, value: 3}
    - {key: round.0.second.fear.charged.1, value: 3}
    - {key: round.0.first.attack.0.hit, value: 3}
  expect_rounds:
    0: {attacks.0.hit: false, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The bonus is paid in the charge only: the second round of the same duel is no longer the summoning
# turn's charge, so the same 3 misses there.
- audit_id: mechanic/condition.summoned-this-turn
  id: the-bonus-belongs-to-the-charge-only-and-the-second-round-misses-on-the-same-3
  fighters:
    first: *summoned-spirit
    second: *summoned-opponent
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 2
  rolls:
    - {key: round.0.second.fear.charged.0, value: 3}
    - {key: round.0.second.fear.charged.1, value: 3}
    - {key: round.0.first.attack.0.hit, value: 3}
    - {key: round.0.first.attack.0.wound, value: 3}
    - {key: round.1.first.attack.0.hit, value: 3}
  expect_rounds:
    0: {attacks.0.hit: true, attacks.0.wounded: true, state.second.wounds: 2}
    1: {attacks.0.hit: false, state.second.wounds: 2}
  expect_final: {rounds_executed: 2, termination_reason: horizon}

# The recipient gate: the summoning fact belongs to the Malignant Spirits, so a hand-built fixture is
# refused by the compiler's own sentence.
- audit_id: mechanic/condition.summoned-this-turn
  id: the-supplied-summoning-turn-is-refused-outside-the-malignant-spirits
  fighters:
    first:
      main_weapon_id: weapon.mace
      condition_ids: [condition.summoned-this-turn]
      characteristics: {weapon_skill: 4, strength: 4, toughness: 3, wounds: 1, initiative: 5, attacks: 1, leadership: 7}
  expect_error: "a supplied summon turn requires a Malignant Spirits recipient of the Call of the Night Haint"
