# One charm, one hit discarded: only the first successful hit of the phase may
# be discarded, so the second hit resolves with no charm die.

- audit_id: mechanic/defence.lucky-charm
  id: charm-is-consumed-after-one-hit
  covers: [first-hit-discarded-on-four]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {<<: *ws3-s3-t3-w2-i5, attacks: 2}
    second:
      main_weapon_id: weapon.mace
      defence_ids: [defence.lucky-charm]
      characteristics: *ws3-s3-t3-w2-i2
  duel_context: *charging-first
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.1.hit, value: 4}
    - {key: round.0.first.attack.0.lucky-charm, value: 4}
    - {key: round.0.first.attack.1.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.saved: true, attacks.1.saved: false, state.second.wounds: 1,
        state.second.lucky_charm: false}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# Owning two charms is a supported configuration and confers no extra benefit:
# the charm check is offered exactly once for the phase, and the failed attempt
# spends it, so the second hit of the same phase is resolved with no charm die.

- audit_id: mechanic/defence.lucky-charm
  id: two-charms-afford-one-attempt
  covers: [two-charms-do-not-stack]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {<<: *ws3-s3-t3-w2-i5, attacks: 2}
    second:
      main_weapon_id: weapon.mace
      defence_ids: [defence.lucky-charm, defence.lucky-charm]
      characteristics: {<<: *ws3-s3-t3-w2-i2, wounds: 3}
  duel_context: *charging-first
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.1.hit, value: 4}
    - {key: round.0.first.attack.0.lucky-charm, value: 3}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.1.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.saved: false, attacks.1.saved: false, state.second.wounds: 1,
        state.second.lucky_charm: false}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
