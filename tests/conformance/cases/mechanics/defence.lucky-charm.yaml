- audit_id: mechanic/defence.lucky-charm
  id: first-hit-discarded-on-four
  covers: [first-hit-discarded-on-four]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: &ws3-s3-t3-w2-i5 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      defence_ids: [defence.lucky-charm]
      characteristics: &ws3-s3-t3-w2-i2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: &charging-first {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.lucky-charm, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.saved: true, state.second.wounds: 2, state.second.lucky_charm: false}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

