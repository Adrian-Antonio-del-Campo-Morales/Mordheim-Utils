# Printed source (Fanatic Online 94, Emissary of Chaos, Patron Tzeentch): Academic skill access, spell
# casting excluded - in the duel the bearer is a spellcaster by identity.  The shared mechanic is
# injected through skill_ids on a hand-built warrior (WS3 S3 T3 W2 I5 A1 Ld7, mace), silenced so the
# only dice are the enemy's; the enemy is hand-built (WS3 S3 T3 W3 I2 A1 Ld7, mace) with Burn the Witch
# (Hatred of spellcasters: a first-round miss is re-rolled).  WS3 against WS3 hits on 4+.

- audit_id: mechanic/mechanic.emissary-tzeentch
  id: a-witch-burner-rerolls-a-first-round-miss-against-the-bearer
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.emissary-tzeentch]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 7}
    second:
      &tzeentch-mechanic-witch-burner
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.burn-the-witch]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  initial_state: {first: {attacks: 0}}
  duel_context: {charging: [], active_participant: second}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.attack.0.hit, value: 2}
    - {key: round.0.second.attack.0.hit.reroll, value: 1}
  expect_rounds:
    0: {attacks.0.hit_target: 4, attacks.0.hit: False, state.first.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

