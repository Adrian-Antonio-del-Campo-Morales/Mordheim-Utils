# --- Authored scenarios ---
# Printed source (mordheimer.net, Pit Fighters / Special Rules / Free the Slaves!, bound by
# shared-rule.free-the-slaves and the two Pit Fighters band rows): "Pit Fighters hate slavers and will
# never sell captured opponents to slavers."  The hated group is the opponent's own slaver identity
# (trait_overrides slaver: true, the compiled identity.slaver), so belonging to a slave-taking warband is
# not by itself enough; the never-sell clause is campaign scope.  Hatred model (the authored band file
# ...5df1c2841eac and the hireling file ...99bd3ea4081b are the template): a natural 2 misses WS3 against
# WS3; the Hatred re-roll of the first round is requested at round.0.<side>.attack.0.hit.reroll, a 4 hits
# and S3 wounds T3 on a 4; outside the hated identity the strict tape holds no re-roll key.  The bearer is
# a hand-built fixture carrying the mechanic through skill_ids; the real Pit Fighter builds are exercised
# by the band files.

# The first-round miss against a slaver is re-rolled, hits and wounds.
- audit_id: mechanic/mechanic.hatred-slavers
  id: a-first-round-miss-against-a-slaver-is-rerolled
  fighters:
    first:
      &bearer
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.hatred-slavers]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      &slaver
      main_weapon_id: weapon.mace
      trait_overrides: {slaver: true}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.first.attack.0.hit.reroll, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: true, attacks.0.damage: 1, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# Without the slaver identity the same miss stands and no re-roll key exists.
- audit_id: mechanic/mechanic.hatred-slavers
  id: the-same-miss-stands-against-an-opponent-who-is-not-a-slaver
  fighters:
    first:
      <<: *bearer
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: false, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

