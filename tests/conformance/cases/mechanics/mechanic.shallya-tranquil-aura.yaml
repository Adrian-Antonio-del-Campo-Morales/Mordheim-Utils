# --- Authored scenarios ---
# Both duelists are in contact, so the aura bearer's Weapon Skill 4 becomes 3 and
# the opponent's 2 becomes 1: the bearer hits on 3 and the weaker opponent, whose
# Weapon Skill is now half the defender's, needs 5 instead of the 4 he would need
# unaided.
- audit_id: mechanic/mechanic.shallya-tranquil-aura
  id: the-aura-lowers-the-to-hit-targets-of-both-duelists
  covers: [whole--scope--weapon-skill-penalty]
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.shallya-tranquil-aura]
      characteristics: {weapon_skill: 4, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 2, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 5}
    - {key: round.0.second.attack.0.wound, value: 4}
  expect_rounds:
    0: {attacks.0.hit_target: 3, attacks.0.damage: 1, attacks.1.hit_target: 5,
        attacks.1.hit: True, state.first.wounds: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
