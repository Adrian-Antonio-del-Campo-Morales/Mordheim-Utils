# AUTHORED[whole--scope--weapon-skill-penalty]: 4 scenarios cover the lowered To-Hit target of both duelists while the aura is on the field regardless of which duelist bears it, the Daemon/Undead exemption, and the same weapon skills without the aura. Documented gap: the printed clause says all models within 2 inches suffer -1 Weapon Skill, and the executor reads that range as contact, so the bearer's own Weapon Skill is reduced as well (contexts.py:341-348); both readings leave the To-Hit targets asserted here unchanged, so no scenario decides the disagreement between "all models within 2 inches" and a narrower "every model but the bearer".
