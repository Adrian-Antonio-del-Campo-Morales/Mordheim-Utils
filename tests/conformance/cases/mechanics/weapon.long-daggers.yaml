# --- Authored scenarios ---
# mechanic/weapon.long-daggers - paired daggers: one additional Attack and a
# parry as a sword.
#
# Expectations come from the printed rule and the admitted clause `whole`, never
# from engine output.
# The ordered tape carries two attack dice for the paired daggers.

- audit_id: mechanic/weapon.long-daggers
  id: long-daggers-grant-one-additional-attack
  fighters:
    first:
      main_weapon_id: weapon.long-daggers
      characteristics: &a-ws3-s3-t3-w2-i5 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: &d-ws3-s3-t3-w2-i2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.first.attack.1.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.wounds: 2, state.first.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
  expect_events:
    - {kind: roll, key: round.0.first.attack.0.hit, sides: 6, value: 1}
    - {kind: roll, key: round.0.first.attack.1.hit, sides: 6, value: 1}
    - {kind: roll, key: round.0.second.attack.0.hit, sides: 6, value: 1}
# The pair may parry as a sword: the defender is offered the parry and a 5 blocks a hit landed on a 4.

- audit_id: mechanic/weapon.long-daggers
  id: long-daggers-parry-as-a-sword
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.long-daggers
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.parry, value: 5}
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.0.second.attack.1.hit, value: 1}
  expect_rounds:
    0: {attacks.0.parried: True, attacks.0.wounded: False, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The retained dagger tag is observable, not a dead label: the admitted skill.knife-fighting
# clause grants +1 Weapon Skill "while using a Dagger", and the executor reads that condition from
# the `weapon.dagger` tag which this pair carries.  The hit target on an equal Weapon Skill is three
# (the file's own first scenario pins four without the skill), so the declared three hits.
- audit_id: mechanic/weapon.long-daggers
  id: knife-fighting-reads-the-retained-dagger-tag-for-the-better-weapon-skill
  fighters:
    first:
      main_weapon_id: weapon.long-daggers
      skill_ids: [skill.knife-fighting]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 3}
    - {key: round.0.first.attack.1.hit, value: 1}
    # A two on the wound die fails against Toughness 3, which keeps this scenario on
    # the to-hit half the skill reads.
    - {key: round.0.first.attack.0.wound, value: 2}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: true, attacks.0.hit_target: 3, attacks.0.wounded: false, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# The same readership on the injury branch: the pair wounds with its ordinary tape and the
# skill's printed +1 turns the injury-table two into a three, so the defender stuns where the
# plain chart (the file's earlier parry scenario and knife-fighting's own control) knocks down.
- audit_id: mechanic/weapon.long-daggers
  id: knife-fighting-reads-the-retained-dagger-tag-for-the-better-injury
  fighters:
    first:
      main_weapon_id: weapon.long-daggers
      skill_ids: [skill.knife-fighting]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 3}
    - {key: round.0.first.attack.1.hit, value: 1}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.injury.0, value: 2}
  expect_rounds:
    0: {attacks.0.hit: true, attacks.0.wounded: true, attacks.0.damage: 1,
        state.second.condition: STUNNED}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
