#   stored Ballistic Skill pair (one lower with result 3; the printed 2 with a sibling result), the
#   unchanged close-combat round (the result adjusts stored BS only), and the refusal of the result on
#   a build without the Cripples' Disability.  REVIEWED still requires manual semantic review and
