# Conformance authoring scaffold; generated comments, manually authored scenarios.
# audit_id: mechanic/defence.plate-armour
# authoring_status: AUTHORED
# authoring_progress: 3 scenarios pin the printed 4+ armour save on a hand-built
#   wearer (the die 4 saves the wound, the 3 is one face short) and on the real
#   Imperial Tactician wearing his printed plate (save die in the duel plus the
#   compiled armour_save).  REVIEWED still requires manual semantic review and
#   execution_status stays UNEXECUTED.
# execution_status: UNEXECUTED (this scaffold has no behavioral result)
#
# Derive inputs and expectations from rule text and accepted rulings.
# Do not derive them from the engine or execute combat during authoring.
# REVIEWED requires semantic review; covers labels alone are insufficient.
# Preserve audit_id when filling this file.
# Governing rulings: docs/decisions/design-rulings.md
# Record: sources/knowledge/catalog/mechanics/close-combat.yaml
#
# AUTHORED: 3 scenarios cover the printed 4+ armour save boundary pair on a
#   hand-built wearer and the real Imperial Tactician's worn plate.

# --- Authored scenarios ---
# mechanic/defence.plate-armour - the Imperial Tactician's printed "plate armour
# (4+ save, -1M)" (Fanatic Online 94; design ruling 2026-11-18: the trading-post
# Masterwork Heavy Armour statline carried by its own mechanic).  The 4+ is an
# ordinary armour save; the -1 Movement is outside the duel.
#
# Expectations come from the printed statline, never from engine output.  The
# plate is worn gear, declared through defence_ids; with no other armour the
# compiled save is exactly the printed 4+, so the armour die 4 is the boundary.

# The printed save on its own face.
- audit_id: mechanic/defence.plate-armour
  id: plate-armour-saves-on-four
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: &pa-attacker {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      defence_ids: [defence.plate-armour]
      characteristics: &pa-defender {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: &pa-charging-first {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.armour, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.saved: true, attacks.0.damage: 0, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# One face below the printed target: the 3 is not a 4+ and the wound is taken.
- audit_id: mechanic/defence.plate-armour
  id: plate-armour-does-not-save-on-three
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: *pa-attacker
    second:
      main_weapon_id: weapon.mace
      defence_ids: [defence.plate-armour]
      characteristics: *pa-defender
  duel_context: *pa-charging-first
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.armour, value: 3}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.saved: false, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The real Imperial Tactician (hireling route, fixture characteristics, printed
# Ld9 stays) wears his printed plate through defence_ids and keeps the simple
# kit dagger in hand; his attacks are silenced so the attacker's tape is the
# only one.  The compiled save is the printed 4+ and the die 4 turns the wound.
- audit_id: mechanic/defence.plate-armour
  id: the-real-imperial-tactician-saves-on-his-printed-plate
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: *pa-attacker
    second:
      collection: mordheim
      band_id: hirelings.hired-sword.2a
      profile_id: hireling.hired-sword.imperial-tactician
      main_weapon_id: weapon.dagger
      defence_ids: [defence.plate-armour]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
  initial_state: {second: {attacks: 0}}
  duel_context: *pa-charging-first
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.armour, value: 4}
  expect_rounds:
    0: {attacks.0.saved: true, attacks.0.damage: 0, state.second.wounds: 2}
  expect_fighters:
    second.armour_save: 4
  expect_final: {rounds_executed: 1, termination_reason: horizon}
