# authoring_progress: 11 authored scenarios (hatred-frenzy-and-charge-rages batch, 2026-11-18): the declared
#   grapple holds a victim that fails the escape test; the escape boundary (strictly under Strength -1) at S3
#   and S4; a declined grapple and a missed grapple hit; the two-round repeat of the escape test at the start
#   of the next phase (released, and still held with the holder only holding); the printed immunities (Large,
#   Undead, Daemon, pain-immune).  REVIEWED still requires manual semantic review.
# Semantic wrinkle (2026-11-18, recorded): the grapple's hit is an ordinary To Hit roll under the key
#   `round.<i>.<side>.grapple.hit` and the victim's escape test is `round.<i>.<side>.grapple.strength`
#   (the holder's side); the repeated test at the start of the next phase is keyed on the victim's side
#   (`round.<i>.<victim>.grapple-escape`).  "Dead targets are immune" is unobservable in a duel that ends
#   when a warrior is out of action.  The pain-immune immunity is reached through the only catalogue
