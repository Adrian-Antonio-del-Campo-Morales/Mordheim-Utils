# The escape test is repeated at the beginning of the next melee phase: a 1 frees the victim, who acts
# while still engaged; the released holder is offered the grapple again (declined) and both strike.
- audit_id: mechanic/mechanic.gaoler-grapple
  id: the-held-victim-escapes-at-the-start-of-the-next-phase-and-acts
  fighters:
    first:
      <<: *grappler
    second:
      <<: *victim
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 2
  decisions:
    - {key: round.0.first.torturer-grapple, value: true}
    - {key: round.1.first.torturer-grapple, value: false}
  rolls:
    - {key: round.0.first.grapple.hit, value: 4}
    - {key: round.0.first.grapple.strength, value: 2}
    - {key: round.1.second.grapple-escape, value: 1}
    - {key: round.1.first.attack.0.hit, value: 1}
    - {key: round.1.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.grappled: True, state.first.grappling: True}
    1: {state.second.grappled: False, state.first.grappling: False, state.first.wounds: 2, state.second.wounds: 3}
  expect_final: {rounds_executed: 2, termination_reason: horizon}

# Failing the repeated test keeps the victim held and the holder can only hold: neither side is asked
# for a decision or an attack in the second phase.
- audit_id: mechanic/mechanic.gaoler-grapple
