# AUTHORED: 2 scenarios evidence the printed two attacks on the charging turn and
#   the profile single attack when the bearer did not charge.

# --- Authored scenarios ---
# The profile A1 becomes A2 on the charge, so a second attack entry exists.
- audit_id: mechanic/mechanic.sabretusk-charge
  id: the-charging-turn-carries-two-attacks
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
      skill_ids: [mechanic.sabretusk-charge]
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.first.attack.1.hit, value: 2}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.1.hit: false, attacks.1.damage: 0}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# Without a charge only one attack is resolved, so attacks.1 does not exist.
- audit_id: mechanic/mechanic.sabretusk-charge
  id: the-profile-single-attack-returns-without-a-charge
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
      skill_ids: [mechanic.sabretusk-charge]
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 0}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

