# --- Authored scenarios ---
# mechanic/weapon.squig-prodder - strikes first and only combines with a shield
# or a spiked gauntlet.
#
# Expectations come from the printed rule and the admitted clause `whole`, never
# from engine output.
# Neither fighter charges, so only the printed strike-first priority can lift the lower-Initiative bearer above the defender.

- audit_id: mechanic/weapon.squig-prodder
  id: squig-prodder-strikes-first-despite-lower-initiative
  fighters:
    first:
      main_weapon_id: weapon.squig-prodder
      characteristics: &a-ws3-s3-t3-w2-i2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.wounds: 2, state.first.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
  expect_events:
    - {kind: roll, key: round.0.first.attack.0.hit, sides: 6, value: 1}
    - {kind: roll, key: round.0.second.attack.0.hit, sides: 6, value: 1}
# The printed shield-or-spiked-gauntlet restriction is declared as a refusal.

- audit_id: mechanic/weapon.squig-prodder
  id: squig-prodder-is-refused-with-an-unlisted-off-hand
  fighters:
    first:
      main_weapon_id: weapon.squig-prodder
      off_hand_id: weapon.dagger
    second:
      main_weapon_id: weapon.mace
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  expect_error: "weapon.squig-prodder cannot be combined with weapon.dagger"
# Control: the permitted spiked gauntlet compiles and resolves a round.

