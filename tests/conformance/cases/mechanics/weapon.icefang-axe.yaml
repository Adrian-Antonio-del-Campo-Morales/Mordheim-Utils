# The same +1 at the Out of Action edge: the die 4 (Stunned on the ordinary chart)
# becomes 5 and the victim is taken out, ending the duel.
- audit_id: mechanic/weapon.icefang-axe
  id: icefang-injury-4-is-out-of-action
  fighters:
    first:
      main_weapon_id: weapon.icefang-axe
      characteristics: *ia-bearer
    second:
      main_weapon_id: weapon.mace
      characteristics: *ia-defender-w1
  duel_context: *ia-no-charge
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 2}
    - {key: round.0.first.attack.0.injury.0, value: 4}
  expect_rounds:
    0: {attacks.1.damage: 1, state.second.wounds: 0, state.second.condition: OUT}
  expect_final: {rounds_executed: 1, termination_reason: second_out}

# The real Drenok (hireling route, fixture characteristics, printed Ld8 stays)
# wields his printed axe by its mechanic id: the compiled main weapon shows the
# printed double-handed profile plus Parry and the +1 injury modifier.  He
# charges, so Fearsome makes the opponent test for Fear (3+3 passes Ld7); his
# printed Strongman lifts the strike-last tier (the double-handed-weapon
# exception), so the charger resolves first.  Both declared hit dice miss.
- audit_id: mechanic/weapon.icefang-axe
  id: the-real-drenok-compiles-his-printed-axe
  fighters:
    first:
      collection: mordheim
      band_id: hirelings.dramatis-personae.1b
      profile_id: hireling.dramatis.drenok-johansen-wielder-of-the-great-axe
      main_weapon_id: weapon.icefang-axe
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    # Fearsome: the charged opponent's Fear test, passed.
    - {key: round.0.second.fear.charged.0, value: 3}
    - {key: round.0.second.fear.charged.1, value: 3}
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_fighters:
    first.main_weapon.strength_bonus: 2
    first.main_weapon.two_handed: true
    first.main_weapon.parry: true
    first.main_weapon.injury_modifier: 1
  expect_final: {rounds_executed: 1, termination_reason: horizon}
