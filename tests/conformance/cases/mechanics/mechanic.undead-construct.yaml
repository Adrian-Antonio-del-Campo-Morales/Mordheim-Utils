# --- Authored scenarios ---
# Printed text (grade-1c.yaml, Undead Construct): "For each Injury result roll a D6: on 4+ the
# result is ignored, without restoring lost Wounds. Magical attacks and magical weapons bypass this
# roll. The ordinary Undead No Pain conversion still applies independently."  The binding is
# mechanic.undead-construct, consumed by modular/attacks.py ~836-843: after each injury die
# round.<i>.<attacker>.attack.<n>.injury.<k> the construct rolls
# round.<i>.<attacker>.attack.<n>.injury.<k>.undead-construct; a 4+ (5+ under an active Djinn's
# Curse) discards that Injury result, the lost Wound stays lost and no pre-damage save is created;
# an attack tagged attack.magical is offered no construct die.  No Pain (skill.ignore-pain, Stunned
# read as Knocked Down inside phases.py injury_condition) is the sibling binding of this rule
# (...519b13280505) and the profile's own No Pain rule (...b1c3b1729796); its Stunned-to-Knocked-Down
# face is not duplicated here, so every Injury face declared is a five (Out of Action on the
# ordinary chart) that only the construct die can discard.
# Hireling family model: the recipient is the printed Bone Goliath compiled through the hireling
# route (hirelings.hired-sword.1c / hireling.hired-sword.bone-goliath) with the fixture facts (WS3
# S3 T3 W2 I5 A1; the printed Ld6 stays), its innate natural attacks as kit and a single supplied
# Wound so the injury step is reached; it contributes no swing.  It causes Fear, so the charging
# opponent tests (1+1 passes Ld7); the opponent is hand-built (mace, WS3 S3 T3 W3 I2 A1 Ld7),
# magical where the printed bypass is at stake.  It wears no armour, so the injury die follows the
# wound die directly (a four; no critical die joins).  The control is the grade-1b Bard: the same
# Out of Action face is final with no construct die.
# Semantic wrinkle (2026-11-18): a construct whose Injury result is discarded stands at zero Wounds
#   ("without restoring lost Wounds"), which the state shows as wounds 0 with condition STANDING; the
#   Djinn's Curse 5+ face needs an active Djinn as attacker and is not asserted here.

# The Out of Action face is discarded on a construct die of four: the Goliath stands, its lost
# Wound not restored.
- audit_id: mechanic/mechanic.undead-construct
  id: a-construct-die-of-four-discards-the-injury-result-without-restoring-the-wound
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
    second:
      collection: mordheim
      band_id: hirelings.hired-sword.1c
      profile_id: hireling.hired-sword.bone-goliath
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
  initial_state: {second: {attacks: 0, wounds: 1}}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.fear.charge.0, value: 1}
    - {key: round.0.first.fear.charge.1, value: 1}
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.injury.0, value: 5}
    - {key: round.0.first.attack.0.injury.0.undead-construct, value: 4}
  expect_rounds:
    0: {attacks.0.wounded: true, attacks.0.damage: 1, state.second.wounds: 0, state.second.condition: STANDING}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

