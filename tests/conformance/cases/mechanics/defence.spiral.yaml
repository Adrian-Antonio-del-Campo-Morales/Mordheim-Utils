# --- Authored scenarios ---
# mechanic/defence.spiral - the Dark Emissary's Spiral (Town Cryer 15, Albion):
# "a potent icon that protects the wearer from harm. It grants the Dark Emissary
# a 5+ save that cannot be reduced by anything."  Carried as an ordinary ward
# save (design ruling 2026-11-18: expressly unmodifiable printed saves ride the
# ordinary ward pipeline, like the Eye Pendant); worn gear through defence_ids.

# The printed save on its own face: the ward die 5 turns the wound away after
# the hit and wound have landed.
- audit_id: mechanic/defence.spiral
  id: the-spiral-saves-on-five
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: &sp-attacker {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      defence_ids: [defence.spiral]
      characteristics: &sp-defender {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: &sp-charging-first {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.special.ward, value: 5}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.saved: true, attacks.0.damage: 0, state.second.wounds: 2}
  expect_fighters:
    second.global_effects.ward_save: 5
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# One face below the printed target: the 4 is not a 5+ and the wound is taken.
- audit_id: mechanic/defence.spiral
  id: one-face-below-the-spiral-is-not-enough
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: *sp-attacker
    second:
      main_weapon_id: weapon.mace
      defence_ids: [defence.spiral]
      characteristics: *sp-defender
  duel_context: *sp-charging-first
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.special.ward, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.saved: false, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
