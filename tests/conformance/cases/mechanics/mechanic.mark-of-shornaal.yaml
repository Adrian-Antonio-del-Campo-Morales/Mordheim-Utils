# AUTHORED: 3 scenarios cover the failed 3D6-keep-highest test that blocks the enemy's attacks and leaves the marked leader's blows automatic, the passed test that spends the one-shot resource and leaves both attacks standing, and the Immune-to-Psychology enemy that passes without rolling any die. Documented gap: neither the automatic-hit consequence nor the once-per-battle duration is stated in the frozen printed clause; both come from the recorded contract, and the duration is observable only as the spent `mark-of-shornaal.passed` resource inside the single taped round (rounds.py:328-343).

# --- Authored scenarios ---
# The target's three dice 6, 6, 6 keep the two highest for twelve against its
# Leadership 6: the test fails, so its own mace blow is never made and the marked
# leader's blow needs no To-Hit die.  The declared tape carries no hit roll for the
# marked leader, which is exactly what an automatic hit means here.
- audit_id: mechanic/mechanic.mark-of-shornaal
  id: a-failed-test-blocks-the-enemy-attack-and-leaves-the-marked-leader-hitting-automatically
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.mark-of-shornaal]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 6}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 6}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.shornaal.0, value: 6}
    - {key: round.0.second.shornaal.1, value: 6}
    - {key: round.0.second.shornaal.2, value: 6}
    - {key: round.0.first.attack.0.wound, value: 4}
  expect_rounds:
    0: {state.second.charm_attack_blocked: True, state.second.charm_auto_hit: True,
        state.second.resources_spent: [], attacks.0.hit: True, attacks.0.damage: 1,
        state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
