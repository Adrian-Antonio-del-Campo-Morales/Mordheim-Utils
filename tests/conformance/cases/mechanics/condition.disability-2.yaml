# authoring_status: AUTHORED
# authoring_progress: 8 authored scenarios (supplied-condition batch, 2026-11-18): the compiled
#   Weapon Skill pair (one lower with result 2; intact with a sibling result), the two printed loadout
#   refusals (two one-handed weapons; a weapon and a shield) with the eligibility module's own
#   sentences, the admitted single weapon fighting at the lower Weapon Skill against its sibling-result
