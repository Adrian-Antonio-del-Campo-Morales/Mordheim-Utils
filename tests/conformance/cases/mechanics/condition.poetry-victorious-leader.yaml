# "First actual Leadership test" only: with a supplied Stupidity trait the Emir tests at the start
# of each own turn.  The round-0 test passes on 9 (Ld 8 + 1); the round-2 test, the second of the
# duel, is taken at the printed 8 and the same 9 fails it.
- audit_id: mechanic/condition.poetry-victorious-leader
  id: the-plus-one-is-spent-on-the-first-test-and-the-second-is-taken-at-the-printed-leadership
  fighters:
    first:
      collection: mordheim
      band_id: ghutani-rel
      profile_id: emir
      condition_ids: [condition.poetry-victorious-leader]
      trait_overrides: {stupidity: true}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  initial_state: {first: {attacks: 0}, second: {attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 3
  rolls:
    - {key: round.0.first.stupidity.0, value: 4}
    - {key: round.0.first.stupidity.1, value: 5}
    - {key: round.2.first.stupidity.0, value: 4}
    - {key: round.2.first.stupidity.1, value: 5}
  expect_rounds:
    0: {state.first.stupidity_failed: false}
    1: {state.first.stupidity_failed: false}
    2: {state.first.stupidity_failed: true}
  expect_final: {rounds_executed: 3, termination_reason: horizon}

# The recipient is "the actual Leader": the band's own Scholar, the Poet himself, is refused the
# condition by the compiler's own sentence.
- audit_id: mechanic/condition.poetry-victorious-leader
  id: a-non-leader-of-the-band-is-refused-the-condition
  fighters:
    first:
      collection: mordheim
      band_id: ghutani-rel
      profile_id: scholar
      condition_ids: [condition.poetry-victorious-leader]
  expect_error: "victorious Poetry requires the actual Leader of its printed Araby band"

# The band is one of the three printed Araby bands: a Hero outside them is refused.
- audit_id: mechanic/condition.poetry-victorious-leader
  id: a-leader-outside-the-three-printed-bands-is-refused
