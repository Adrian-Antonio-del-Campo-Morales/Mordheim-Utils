#   "The actual Leader of this Ghutani, Muzil or Turjuk band won its previous battle and receives +1
#   Leadership for its first actual Leadership test this scenario.  Rerolls use that same threshold;
#   this is not a bonus to Leadership lent to friends."  Source: Relics of the Crusades pt 2
#   (broheim.net) p4, Scholar / Field of Scholarship / Poetry: "your leader adds +1 to his Leadership
#   for his first leadership test in a scenario if your warband won the last battle they fought".
# AUTHORED: the previous victory and the Poet are outside the duel; the condition is the supplied
#   current fact declared through condition_ids on the band's printed Leader (the Emir, Ld 8, the
#   profile the band's `emir--leader` rule applies to).  Consumers: modular/leadership.py
#   (resolve_local_leadership) adds +1 to the bearer's own Leadership value while the
#   `poetry-first-leadership` resource is unspent and spends it on that first test; the compiler gate
#   (roster-construction compiler.py) refuses the condition unless band_id is ghutani-rel, muzil-rel or
#   turjuk-rel and profile_id is emir: "victorious Poetry requires the actual Leader of its printed
#   Araby band".  The first test is the Fear test of the charge the Leader receives; the "first test
#   only" clause is read with a supplied Stupidity trait (trait_overrides stupidity, as the authored
#   Barbarian Leader file does) so the Leader owes one test per own turn: round 0 at 9, round 2 at 8.
#   Both pools are silenced in that scenario (initial_state attacks 0; the Emir's default kit blade is
#   a weapon, so the pool stays silent) so the tape reads the Leadership dice only.  The re-roll
#   sentence of the row needs a Fear re-roll grant the Emir does not print; recorded, not asserted.
#   "Not lent to friends" is the leader-supply route (mechanic.leader-six), not reachable on the
#   Leader's own test here; recorded.

# --- Authored scenarios ---
# Leadership arithmetic: 4+5 = 9 passes Ld 8 + 1 and fails the printed Ld 8.  The charger is the
# hand-built fear-causing mace fixture.

# The first test at +1: charged by a fear-causer, the victorious Emir passes its Fear test on a 9.
- audit_id: mechanic/condition.poetry-victorious-leader
  id: the-victorious-leaders-first-leadership-test-is-taken-at-plus-one
  fighters:
    first:
      trait_overrides: {causes_fear: true}
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 10, attacks: 1, leadership: 7}
    second:
      collection: mordheim
      band_id: ghutani-rel
      profile_id: emir
      condition_ids: [condition.poetry-victorious-leader]
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.fear.charged.0, value: 4}
    - {key: round.0.second.fear.charged.1, value: 5}
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.fear_hit_sixes: false}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The control: the same Emir, charge and faces without the supplied victory fail at the printed Ld 8,
# so the charger's hits are clamped to sixes.
- audit_id: mechanic/condition.poetry-victorious-leader
