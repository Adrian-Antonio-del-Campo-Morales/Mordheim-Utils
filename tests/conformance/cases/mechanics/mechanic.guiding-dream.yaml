# Conformance authoring scaffold; generated comments, manually authored scenarios.
# audit_id: mechanic/mechanic.guiding-dream
# authoring_status: AUTHORED
# authoring_progress: the admitted clause carries authored scenarios derived from the printed rule and the recorded contract; REVIEWED still requires manual semantic review and execution_status stays UNEXECUTED.
# execution_status: UNEXECUTED (this scaffold has no behavioral result)
#
# Derive inputs and expectations from rule text and accepted rulings.
# Do not derive them from the engine or execute combat during authoring.
# REVIEWED requires semantic review; covers labels alone are insufficient.
# Preserve audit_id when filling this file.
# Governing rulings: docs/decisions/design-rulings.md
#
# AUTHORED: 3 scenarios cover the three printed dream results against the nominated opposing Hero: 2-3 adds one to hit (a three hits only with it), 4-5 adds one Strength (a five wounds only with it) and 6 leaves the bearer Frenzied, which is observed as the doubled attack pool.

# --- Authored scenarios ---
# mechanic/mechanic.guiding-dream — every expectation below comes from the printed
# rule (roll D6 once before battle: against the nominated opposing Hero, 2-3
# grants +1 to hit, 4-5 grants +1 Strength and 6 grants Frenzy) and the recorded
# contract, never from engine output.  The battle-start result is supplied as the
# dream die the bearer rolls when the duel is initialized, and the nomination is
# supplied as the nominated-target trait of the bearer; the nominated opponent is
# the Hero the dream points at.
#
# 2-3: the bearer hits on a three that the unmodified table would refuse.
- audit_id: mechanic/mechanic.guiding-dream
  id: a-dream-of-two-raises-the-hit-roll-against-the-nominated-hero
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.guiding-dream]
      trait_overrides: {guiding_dream_target: true}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      trait_overrides: {fighter_kind: hero}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: first.guiding-dream, value: 2}
    - {key: round.0.first.attack.0.hit, value: 3}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# 4-5: the bearer's Strength rises by one, so a five wounds a Toughness 4 target
# that the unmodified profile would need a six against.
- audit_id: mechanic/mechanic.guiding-dream
  id: a-dream-of-four-raises-strength-against-the-nominated-hero
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.guiding-dream]
      trait_overrides: {guiding_dream_target: true}
      characteristics: {weapon_skill: 3, strength: 2, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      trait_overrides: {fighter_kind: hero}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 4, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: first.guiding-dream, value: 4}
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 5}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# 6: the bearer is Frenzied, which doubles the printed one attack of the profile,
# so the round holds two attack pools for the bearer and no wound is produced.
- audit_id: mechanic/mechanic.guiding-dream
  id: a-dream-of-six-leaves-the-nominated-bearer-frenzied
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.guiding-dream]
      trait_overrides: {guiding_dream_target: true}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      trait_overrides: {fighter_kind: hero}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: first.guiding-dream, value: 6}
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.first.attack.1.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.frenzy: True, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
  expect_events:
    - {kind: roll, key: first.guiding-dream, sides: 6, value: 6}
    - {kind: roll, key: round.0.first.attack.0.hit, sides: 6, value: 1}
    - {kind: roll, key: round.0.first.attack.1.hit, sides: 6, value: 1}
    - {kind: roll, key: round.0.second.attack.0.hit, sides: 6, value: 1}
