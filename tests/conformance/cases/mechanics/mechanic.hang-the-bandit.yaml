# Printed carriers: Horned Hunters, Hang the Bandit! (bands/mordheim/horned-hunters/special-rules.yaml
# horned-hunter--hang-the-bandit and initiates--hang-the-bandit, grant profile): "A Horned Hunter hates
# all Bandits and Outlaws."  Consumer: modular/contexts.py ~262-265 - `hatred = first_round and
# psychology_allowed and (... has_tag(effect, "mechanic.hang-the-bandit") and "warband-group.bandit"
# in enemy_tags ...)`, the shared Hatred first-round hit reroll; the enemy class is the registry's
# warband-group.bandit (sources/knowledge/registry/warband-groups.yaml: hochland-bandits,
# outlaws-of-stirwood-forest and its redux), projected onto a compiled member of those bands.  Model:
# the AUTHORED Horned Hunters grant file (...8d14fc49aabd); here the operator is injected through
# skill_ids on the hand-built fixture (WS3 S3 T3 W2 I5 A1 Ld7, mace).  The qualifying opponent is the
# printed Hochland Bandits Footpad with fixture characteristics (WS3 S3 T3 W3 I2 A1 Ld7) and an axe from
# the Bandit list (no parry); its Concealment is out of runtime scope.  Its swing is a declared 1.

# The printed Hatred: a first-round miss (2) against the Footpad is rerolled (4 hits) and wounds.
- audit_id: mechanic/mechanic.hang-the-bandit
  id: a-first-round-miss-is-rerolled-against-a-bandit-warband-fighter
  fighters:
    first:
      &bearer
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.hang-the-bandit]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 7}
    second:
      &bandit
      collection: mordheim
      band_id: hochland-bandits
      profile_id: footpads
      main_weapon_id: weapon.axe
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.first.attack.0.hit.reroll, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: true, attacks.0.damage: 1, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# Without the printed enemy class no reroll is offered: the same miss stands against a hand-built
