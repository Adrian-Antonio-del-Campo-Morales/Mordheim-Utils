#
# AUTHORED: the scenarios below are declared from the printed rule ("ignores Knocked Down and Stunned
#   injury results and remains until his last Wound is lost"; Sigmund Spindle's print adds "must lose
#   his last Wound AND receive an Out of Action Injury result to be removed") and the recorded contract
#   (packages/python/combat-engine/mordheim_combat/modular/attacks.py, the post-table replacement: any
#   aggregated Injury condition other than Out of Action becomes Standing, before the helmet / Thick
#   Skull reaction).  Unlike ordinary No Pain (skill.ignore-pain, Stunned -> Knocked Down) this
#   mechanic removes both prone results; the Out of Action face is untouched.  The execution entry also
#   carries mechanic.pain-immunity (grapple immunity), which belongs to the Gaoler's grapple identity
#   and is not evidenced here.
#
# Family model (the skill.ignore-pain mechanics file and the Cairn Wraith No Pain file).  The attacker
# is the stronger hand-built fixture (WS10 S8 I10, mace): it hits WS3 on 3+, wounds T3 on 2+ with no
# critical face declared, and its Strength makes the bearer's parry ineligible, so the tape is hit,
# wound and the Injury die.  The bearer is hand-built with the mechanic injected through skill_ids
# (this is the shared mechanic file, so the removal probe reports it inert by design), has one Wound
# so the first wound reaches the Injury table, and contributes no attack of its own (initial_state).
# Injury faces: 1-2 Knocked Down, 3-4 Stunned, 5-6 Out of Action on the printed table.

# --- Authored scenarios ---

