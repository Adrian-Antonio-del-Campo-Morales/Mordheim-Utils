# weapon.kanabo - A kanabo adds +1 Strength, uses two hands and has Concussion.
# A kanabo adds +1 Strength, uses two hands and has Concussion. Against Toughness 3 the bonus moves the wound target to 3+.

- audit_id: mechanic/weapon.kanabo
  id: kanabo-wounds-at-the-boosted-strength
  fighters:
    first:
      main_weapon_id: weapon.kanabo
      characteristics: &atk-ws3-s3-t3-w2-i5 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: &dfn-ws3-s3-t3-w2-i2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: &charging-first {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 3}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# One face below the boosted wound target.

- audit_id: mechanic/weapon.kanabo
