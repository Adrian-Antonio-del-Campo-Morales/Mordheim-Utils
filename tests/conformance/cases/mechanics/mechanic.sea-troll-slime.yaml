# Equal Weapon Skill is ordinarily a To Hit target of four; the slime raises it to
# five for every enemy melee attack, so the roll of four fails.
- audit_id: mechanic/mechanic.sea-troll-slime
  id: the-bearer-imposes-a-minus-one-to-hit
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.sea-troll-slime]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit_target: 5, attacks.0.hit: False, attacks.0.damage: 0, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# The raised target is still met by the highest face, so the printed reminder that a
# natural six hits is carried by the same penalty.
- audit_id: mechanic/mechanic.sea-troll-slime
  id: a-natural-six-still-hits
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.sea-troll-slime]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 6}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit_target: 5, attacks.0.hit: True, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# The same duel without the mechanic fixes the ordinary target at four and the same
# roll hits, so the single point of difference is the slime.
- audit_id: mechanic/mechanic.sea-troll-slime
  id: the-same-roll-hits-without-the-slime
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
