# Printed rule (grade-2a.yaml, The Fallen Sister / Ashamed and Afraid: "Uses source psychology rule"; the
# source makes her test her Leadership before charging a Sister of Sigmar or a Warrior-Priest of Sigmar).
# Family model (first-batch psychology files): the bearer is a hand-built fighter carrying only this
# mechanic through skill_ids (WS3 S3 T3 W2 I5 A1 Ld7, mace) and charges; the Sigmarite opponent is a
# compiled band profile with fixture characteristics (WS3 S3 T3 W3 I2 A1, printed Ld, mace); the plain
# opponent is hand-built (Ld7, mace).  Dice: a 2D6 test of 3+3 passes Ld7 and 5+4 fails it; every strike
# is a declared natural 1; a failed charge test ends the duel `disengaged` with no blow struck.

# The charge against a Sister of Sigmar needs the test: 3+3 passes Ld7 and the charge goes in.
- audit_id: mechanic/mechanic.ashamed-and-afraid
  id: the-bearer-passing-the-test-charges-the-sister-of-sigmar
  fighters:
    first:
      &bearer
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.ashamed-and-afraid]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 7}
    second:
      &sister
      collection: mordheim
      band_id: sisters-of-sigmar
      profile_id: sigmarite-matriarch
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.ashamed-and-afraid.0, value: 3}
    - {key: round.0.first.ashamed-and-afraid.1, value: 3}
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: False, state.first.condition: STANDING, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# 5+4 fails Ld7: the charge is cancelled, no blow is struck and the duel disengages.
- audit_id: mechanic/mechanic.ashamed-and-afraid
  id: the-bearer-failing-the-test-does-not-charge-the-sister-of-sigmar
  fighters:
    first:
      <<: *bearer
    second:
      <<: *sister
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.ashamed-and-afraid.0, value: 5}
    - {key: round.0.first.ashamed-and-afraid.1, value: 4}
  expect_rounds:
    0: {state.first.condition: STANDING, state.second.condition: STANDING, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: disengaged}

