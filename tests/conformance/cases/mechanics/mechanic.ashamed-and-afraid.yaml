# The test guards her own charge: charged by the Sister of Sigmar she takes no test and fights back.
- audit_id: mechanic/mechanic.ashamed-and-afraid
  id: no-test-is-taken-when-the-sister-of-sigmar-charges-the-bearer
  fighters:
    first:
      <<: *bearer
    second:
      <<: *sister
  duel_context: {charging: [second], active_participant: second}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.attack.0.hit, value: 1}
