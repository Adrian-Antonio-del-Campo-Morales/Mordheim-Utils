# --- Authored scenarios ---
# Printed text (Mazzalupo, Master of Finances, Corruption, bands/mordheim/mazzalupo-web/special-rules.yaml
# master-of-finances--corruption): "When hit in close combat but before rolling to wound, the player
# controlling the Mazzalupo warband can give 5 gold crowns to the opponent for each model that hit the
# Master of finances.  If it does, the corrupted model must reroll a successful attack roll.  Each model
# cannot reroll more than one attack in this way ... Models immune to Psychology cannot be corrupted."
# The gold price is the band row's scope-NO clause.  Consumer: modular/attacks.py ~289-296: after a
# successful melee hit on a defender carrying mechanic.corruption by an attacker without
# mechanic.psychology-immunity, while "corruption" is unspent, the defender's decision
# round.<i>.<attacker>.attack.<n>.corruption forces the hit to be re-taken on
# round.<i>.<attacker>.attack.<n>.hit.reroll and spends the resource.  Model: the AUTHORED Mazzalupo grant
# file (...bb29e5df6335); here the operator is injected through skill_ids on the hand-built fixture (WS3
# S3 T3 W2 I5 A1 Ld7, mace) standing as the non-active second duelist; the enemy is the mace fixture
# (WS3 S3 T3 W3 I2 A1 Ld7) acting first, so its hits are attacks.0 (and attacks.1).  The bearer's own
# swing is a declared 1.

# The bribe: the enemy's 4 hits, the corruption decision is taken, the re-take on the same attack's
# reroll die is a 1 and the hit is lost; the bearer takes no wound.
- audit_id: mechanic/mechanic.corruption
  id: a-bribed-enemy-retakes-its-successful-hit-and-loses-it
  fighters:
    first:
      &enemy
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
    second:
      &bearer
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.corruption]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.attack.0.corruption, value: true}
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.hit.reroll, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: false, attacks.0.damage: 0, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# Declining the bribe keeps the hit: no reroll die is requested and the attack proceeds to its wound
# roll (a 1, which never wounds).
- audit_id: mechanic/mechanic.corruption
  id: declining-the-bribe-keeps-the-hit
  fighters:
    first:
      <<: *enemy
    second:
      <<: *bearer
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.attack.0.corruption, value: false}
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: true, attacks.0.wounded: false, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# "Models immune to Psychology cannot be corrupted": the same hit by an immune enemy requests no
# corruption decision and no reroll die; the hit stands.
- audit_id: mechanic/mechanic.corruption
  id: a-psychology-immune-enemy-cannot-be-bribed
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.psychology-immunity]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
    second:
      <<: *bearer
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: true, attacks.0.wounded: false, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# "Each model cannot reroll more than one attack in this way": an enemy with two attacks is bribed on
# its first hit (lost on the reroll) and its second hit is offered no decision, proceeding to its wound
# roll.
- audit_id: mechanic/mechanic.corruption
  id: the-same-enemy-is-bribed-at-most-once
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 2, leadership: 7}
    second:
      <<: *bearer
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.attack.0.corruption, value: true}
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.hit.reroll, value: 1}
    - {key: round.0.first.attack.1.hit, value: 4}
    - {key: round.0.first.attack.1.wound, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: false, attacks.1.hit: true, attacks.1.wounded: false, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
