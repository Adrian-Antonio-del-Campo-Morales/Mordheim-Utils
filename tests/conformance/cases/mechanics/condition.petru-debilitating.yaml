# --- Authored scenarios ---
# Arithmetic: WS3 hits WS3 on 4+; S3 wounds T2 on 3+, T3 on 4+.  Petru is the active participant (its
# own recovery) and is silenced (attacks: 0), so the tape is the recovery die followed by the
# opponent's hit and wound.  Petru declares two Wounds so a single wound leaves it standing without an
# injury die.

# The supplied draught lowers the printed Petru's Toughness by one at duel start.
- audit_id: mechanic/condition.petru-debilitating
  id: the-debilitating-draught-lowers-the-affected-heroes-toughness-by-one
  fighters:
    first:
      &petru-debilitating-drinker
      collection: mordheim
      band_id: channel-rats-mim
      profile_id: petru
      main_weapon_id: weapon.mace
      condition_ids: [condition.petru-debilitating]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 4, attacks: 1}
    second:
      &petru-debilitating-opponent
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [], active_participant: first}
  initial_state: {second: {condition: OUT}}
  maximum_rounds: 1
  expect_initial: {first.toughness: 2}
  expect_final: {rounds_executed: 0, termination_reason: second_out}

# A 5 in the drinker's own recovery keeps the penalty: the opponent's S3 wounds T2 on the declared 3.
- audit_id: mechanic/condition.petru-debilitating
  id: a-non-clearing-recovery-die-keeps-the-penalty-and-the-opponents-3-wounds-toughness-2
  fighters:
    first: *petru-debilitating-drinker
    second: *petru-debilitating-opponent
  initial_state: {first: {attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.petru-debilitating, value: 5}
    - {key: round.0.second.attack.0.hit, value: 4}
    - {key: round.0.second.attack.0.wound, value: 3}
  expect_rounds:
    0: {state.first.toughness: 2, attacks.0.hit: true, attacks.0.wounded: true, state.first.wounds: 1, state.first.condition: STANDING}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

