# --- Authored scenarios ---
# mechanic/defence.triskele - the Truthsayer's Triskele (Town Cryer 15, Albion):
# "this icon protects them from harm with its benevolent energies granting the
# Truthsayer a 4+ save, which cannot be reduced by anything."  Carried as an
# ordinary ward save (design ruling 2026-11-18, same handling as the Spiral);
# worn gear through defence_ids.

# The printed save on its own face: the ward die 4 turns the wound away after
# the hit and wound have landed.
- audit_id: mechanic/defence.triskele
  id: the-triskele-saves-on-four
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: &tk-attacker {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      defence_ids: [defence.triskele]
      characteristics: &tk-defender {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: &tk-charging-first {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.special.ward, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.saved: true, attacks.0.damage: 0, state.second.wounds: 2}
  expect_fighters:
    second.global_effects.ward_save: 4
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# One face below the printed target: the 3 is not a 4+ and the wound is taken.
- audit_id: mechanic/defence.triskele
  id: one-face-below-the-triskele-is-not-enough
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: *tk-attacker
    second:
      main_weapon_id: weapon.mace
      defence_ids: [defence.triskele]
      characteristics: *tk-defender
  duel_context: *tk-charging-first
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.special.ward, value: 3}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.saved: false, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
