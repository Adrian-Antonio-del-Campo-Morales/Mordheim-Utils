# Conformance authoring scaffold; generated comments, manually authored scenarios.
# audit_id: mechanic/defence.all-seeing-eye-of-numas
# authoring_status: AUTHORED
# authoring_progress: 4 scenarios pin the printed additional 6+ save on a hand-built
#   bearer: the ward die 6 saves and the 5 is one face short (compiled ward_save
#   observed alongside); the save is additional to a worn armour save (the armour die
#   fails first, then the ward die 6 saves); and a Strength 5 blow that would worsen an
#   armour save leaves the 6+ untouched.  The shooting half, the bearer's sight and the
#   Exploration die are excluded campaign consequences.  REVIEWED still requires manual
#   semantic review and execution_status stays UNEXECUTED.
# execution_status: UNEXECUTED (this scaffold has no behavioral result)
#
# Derive inputs and expectations from rule text and accepted rulings.
# Do not derive them from the engine or execute combat during authoring.
# REVIEWED requires semantic review; covers labels alone are insufficient.
# Preserve audit_id when filling this file.
# Governing rulings: docs/decisions/design-rulings.md
