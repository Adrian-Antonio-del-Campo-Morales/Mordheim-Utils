# "As described in the Mordheim rulebook": a frenzied warrior is immune to Psychology, so the
# drinker charged by a fear-causer owes no Fear die (the fear.charged test of the control route).
- audit_id: mechanic/condition.troll-brew-frenzy
  id: the-frenzied-drinker-takes-no-fear-test-when-charged-by-a-fear-causer
  fighters:
    first:
      trait_overrides: {causes_fear: true}
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 10, attacks: 1, leadership: 7}
    second:
      collection: mordheim
      band_id: dwarf-guildsmen-kaz
      profile_id: apprentices
      condition_ids: [condition.troll-brew-frenzy]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 7}
  initial_state: {second: {attacks: 1}}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.0.second.attack.1.hit, value: 1}
  expect_rounds:
    0: {state.second.fear_hit_sixes: false, state.second.frenzy: true}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

