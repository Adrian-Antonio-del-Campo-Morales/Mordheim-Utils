# --- Authored scenarios ---
# Condition row (catalog/rules/conditions.yaml): "The selected Solkan Witch-finder is making the actual
# compulsory charge against the supplied eligible reachable opponent."  Skill text (grade-2b.yaml,
# Witch-Finder): "must charge an eligible follower of Chaos, warlock, necromancer, sorcerer or warp-tainted
# character; only the supplied actual charge is resolved, without movement or visibility production."  The
# bearer is the printed Priest of Verena as the War-Priest of Solkan (variant deity.solkan) with the
# Witch-finder chosen and the condition supplied; fixture characteristics WS3 S3 T3 W2 I5 A1; the omitted
# weapon is the ceremonial dagger (the variant drops the Verena sword and its Strictures).  Opponents are
# hand-built (WS3 S3 T3 W3 I2 A1 Ld7, mace) with the one identity the check reads.  Every strike is a
# declared natural 1, so the admitted duel requests only the two To Hit dice.

# The supplied compulsory charge against a follower of Chaos is admitted and resolved as a charge.
- audit_id: mechanic/condition.witch-finder-charge
  id: the-supplied-compulsory-charge-against-a-chaos-follower-is-admitted
  fighters:
    first:
      &witch_finder
      collection: mordheim
      band_id: hirelings.hired-sword.2b
      profile_id: hireling.hired-sword.priest-of-verena
      variant_ids: [deity.solkan]
      special_rule_ids: [hireling.hired-sword.priest-of-verena.skill.witch-finder]
      condition_ids: [condition.witch-finder-charge]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      trait_overrides: {chaos_follower: true}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: False, state.first.wounds: 2, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

