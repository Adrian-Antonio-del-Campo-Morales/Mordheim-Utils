#   warp-tainted identities, which no supplied trait produces today).  A model merely "capable of casting
#   spells" (identity.spellcaster) is not read as a sorcerer; this is noted, not asserted.  Construction
#   admits the condition only on the War-Priest of Solkan with the chosen Mark, so no hand-built shape exists.
