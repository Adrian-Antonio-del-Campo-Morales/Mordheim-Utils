#
# PARTIAL: 2 scenarios cover the first-round reduction of an Undead
#   attacker's pool and the Daemon exclusion, which keeps both of its attacks. The
#   printed floor ("to a minimum of 1", normative text of the admitted clause) is a
#   structured dependency, with its concrete datum on record instead of a bare claim.
#   Input: an Undead attacker whose printed pool is exactly one Attack (the file's own
#   mace attacker shape) meeting this carrier, so the reduction and the floor both
#   want to fire on the same pool. Assertion that is blocked: the pre-floor pool size
#   of round 0 - for a one-attack attacker the reduced and the unreduced pool are both
#   one attack, so the resolved attacks tape cannot separate them and any scenario
#   asserting the floor on it would be asserting the reduction twice. Missing
#   capability: a pre-floor pool-size observation in the round snapshot (for example a
#   state.<side>.pool_size field or an equivalent assertion key on the attack pool)
