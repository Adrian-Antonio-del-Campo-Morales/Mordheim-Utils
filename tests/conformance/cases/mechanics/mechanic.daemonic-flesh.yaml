# --- Authored scenarios ---
# Printed text (Chaos Fury, Daemonic Flesh): "A 5+ base armour save is never modified and is
# entirely negated by magical or blessed weapons and spells. All of the daemon's close combat
# attacks count as magical."  The mechanic's execution entry carries natural_armour_negated_by_magic
# and the tags mechanic.daemonic-flesh + attack.magical; the 5+ itself and its unmodifiable flag are
# the companion trait bindings of the granting rule (trait.natural-armour-save 5,
# trait.natural-armour-unmodified), so the compiled recipient has natural_armour_save 5 and
# natural_armour_unmodified (tests/construction/test_hireling_admission.py::test_daemonic_flesh...).
# Consumers: packages/python/combat-engine/mordheim_combat/phases.py armour_target (an unmodified
# natural save ignores the Strength penalty and the incoming save modifier; magic sets it to 7 when
# negated_by_magic) and modular/attacks.py ~696-701 (the daemonic save is rolled unmodifiable),
# modular/attacks.py ~343-346 / pools.py ~177-183 (an attack tagged attack.magical is never offered
# the Ethereal interception).  The recipient is the printed Chaos Fury compiled through the hireling
# route (hirelings.hired-sword.2a / hireling.hired-sword.chaos-fury) with the fixture facts (WS3 S3
# T3 W2 I5 A1; the printed Ld10 stays); its kit is its innate natural attacks.  The Fury causes
# Fear, so a charging opponent tests Fear (1+1 passes Ld7) and a charged opponent tests Fear (3+3
# passes); the Fury itself is immune (Daemonic Mind) and is never asked.  The Strength 4 opponent
# is the hand-built fixture with Strength raised to four: a mace is Strength as user, so its hit
# worsens an ordinary save by one.  Wound dice are fours (never a six, so no critical die joins).
# Ethereal targets are hand-built fixtures with the shared mechanic injected through skill_ids,
# because the clause under test is the attacker's magical label, not the target's grant.
# Semantic wrinkle (2026-11-18): "blessed" weapons and spells have no catalog producer in a duel
#   (attack.blessed is not materialised by any build field, README "Harness capacities"), so only
#   the magical negation is evidenced; the blessed half of the sentence is left unasserted.

# A Strength 4 hit would worsen an ordinary 5+ to 6+; the daemon's save stays 5+ and holds on a five.
- audit_id: mechanic/mechanic.daemonic-flesh
  id: the-unmodified-five-plus-holds-on-five-against-a-strength-four-hit
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 4, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
    second:
      collection: mordheim
      band_id: hirelings.hired-sword.2a
      profile_id: hireling.hired-sword.chaos-fury
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.fear.charge.0, value: 1}
    - {key: round.0.first.fear.charge.1, value: 1}
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.armour, value: 5}
  expect_rounds:
    0: {attacks.0.saved: true, attacks.0.damage: 0, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

