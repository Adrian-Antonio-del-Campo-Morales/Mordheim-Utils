# --- Authored scenarios ---
# The printed +1 Strength is observable only through what Strength decides: with the
# rule the declared To Wound three reaches Strength 4 against Toughness 3 (3+), the
# same three against the same weapon and profile without it needs the 4+ of Strength 3
# and fails.  The spear strikes first in the first round, so the round's first attack
# outcome is the spear attack and the second fighter's mace answer is declared last.
- audit_id: mechanic/mechanic.seaguard-spear-master
  id: the-first-round-strength-bonus-turns-the-declared-three-into-a-wound
  fighters:
    first:
      main_weapon_id: weapon.spear
      skill_ids: [mechanic.seaguard-spear-master]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 3}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: True, attacks.0.wounded: True, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
