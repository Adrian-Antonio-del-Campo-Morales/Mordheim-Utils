#
# AUTHORED: 2 scenarios show the first-round reroll against a canonical Chaotic
#   warband opponent and its absence against an ordinary one.  The printed list of
#   qualifying warbands lives in the warband-group registry, not in this rule text.

# --- Authored scenarios ---
# The opposing member of a Chaotic warband carries the canonical warband-group fact, so
# the first round offers one reroll of the failed To-Hit roll; the single Wound profile
# then resolves its injury on the ordinary chart.
- audit_id: mechanic/mechanic.hatred-chaotic-warband
  id: the-missed-hit-against-a-chaotic-warband-is-taken-again
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.hatred-chaotic-warband]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      collection: mordheim
      band_id: carnival-of-chaos
      profile_id: brethren
  initial_state:
    second: {attacks: 0}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.first.attack.0.hit.reroll, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.injury.0, value: 3}
  expect_rounds:
    0: {attacks.0.hit: True, attacks.0.damage: 1, state.second.condition: STUNNED}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# An ordinary opponent carries no Chaotic warband identity, so the hated-enemy reroll is
# never offered and the two misses.
- audit_id: mechanic/mechanic.hatred-chaotic-warband
  id: the-same-miss-stands-against-a-non-chaotic-enemy
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.hatred-chaotic-warband]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  initial_state:
    second: {attacks: 0}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 2}
  expect_rounds:
    0: {attacks.0.damage: 0, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

