# The brew: charged by a fear-causer, the nominated Apprentice takes no Fear test - no fear die is
# requested, its hits are not clamped to sixes - and the strong brew leaves it unfrenzied.
- audit_id: mechanic/condition.troll-brew-fear-immunity
  id: the-nominated-dwarf-charged-by-a-fear-causer-takes-no-fear-test
  fighters:
    first:
      trait_overrides: {causes_fear: true}
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 10, attacks: 1, leadership: 7}
    second:
      collection: mordheim
      band_id: dwarf-guildsmen-kaz
      profile_id: apprentices
      condition_ids: [condition.troll-brew-fear-immunity]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.fear_hit_sixes: false, state.second.frenzy: false, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The control: the same Apprentice without the brew owes the Fear test, and 4+4 = 8 fails its
