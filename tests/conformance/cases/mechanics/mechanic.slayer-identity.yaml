# Record (close-combat.yaml, mechanic.slayer-identity, "Slayer", Slayer Rules): the Slayer identity of
# the Dwarf Slayer profiles, bound by dwarf-slayers-kaz giant-slayer--equipment-restrictions and
# troll-slayers--equipment-restrictions.  The compiled-tag scenario reuses the accepted projection of
# the band's giant-slayer build (the AUTHORED TC6 files of this band: mace, supplied WS4 S3 T3 W2 I3
# A1, opponent charging with a natural-1 hit, the Slayer's attacks silenced).  The gate scenarios use
# the supplied Rememberer fact condition.rememberer-kaz-support (its own identity; execution.yaml
# compiles it to condition.rememberer-support and mechanic.rememberer-large-only, with no nearby
# requirement) against an ordinary hand-built opponent, so the re-roll is never offered and the
# compiled admission is the evidence; both fighters' blows are natural 1s.

# The compiled Giant Slayer carries identity.slayer among its printed facts.
- audit_id: mechanic/mechanic.slayer-identity
  id: the-compiled-giant-slayer-carries-the-slayer-identity
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      collection: mordheim
      band_id: dwarf-slayers-kaz
      profile_id: giant-slayer
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 4, strength: 3, toughness: 3, wounds: 2, initiative: 3, attacks: 1}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
  expect_fighters:
    second.global_effects.tags: [mechanic.leader-six, identity.slayer, skill.hard-to-kill, mechanic.hatred-orcs-goblins, armour.no-armour, concussion_immune, fighter-kind.hero, band.dwarf-slayers-kaz]
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The identity's reader: a Slayer Hero is admitted the supplied Rememberer support.
- audit_id: mechanic/mechanic.slayer-identity
  id: a-troll-slayer-is-admitted-the-supplied-rememberer-support
  fighters:
    first:
      collection: mordheim
      band_id: dwarf-slayers-kaz
      profile_id: troll-slayers
      condition_ids: [condition.rememberer-kaz-support]
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second: &opponent
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.wounds: 2, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The same reader refuses a Hero of the band without the identity (the Rememberer himself).
- audit_id: mechanic/mechanic.slayer-identity
  id: a-hero-without-the-slayer-identity-is-refused-the-rememberer-support
  fighters:
    first:
      collection: mordheim
      band_id: dwarf-slayers-kaz
      profile_id: rememberer
      condition_ids: [condition.rememberer-kaz-support]
      main_weapon_id: weapon.mace
    second: *opponent
  expect_error: "Rememberer support requires a Slayer Hero of the printed source variant"
