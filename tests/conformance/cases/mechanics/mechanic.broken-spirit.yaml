# --- Authored scenarios ---
# Printed text (Slavers, Eunuchs, Broken Spirit, bands/mordheim/slavers-rel/special-rules.yaml
# eunuchs--broken-spirit): "A Eunuch will automatically pass any Leadership test he is required to make,
# as long as the Slave Merchant is not out of action.  A Eunuch may never become a warband leader."
# The leader bar is the band row's scope-NO clause.  Consumer: modular/leadership.py ~206-214: while a
# supplied nearby participant of the bearer's own side and band carries mechanic.leader-six (the Slave
# Merchant's Leader) and is not `out`, the test returns passed before any die; the clause reads no
# distance.  The borrow gate needs the bearer's own band tags, which a hand-built fighter does not
# carry, so the bearer is the printed Eunuch (W1 A1 I3 Ld10) and the provider the printed Slave Merchant
# (Leader, Ld8), supplied as a nearby local participant, as the AUTHORED grant file (...75d27f04c4fb)
# does.  The Leadership test the duel can force on the Eunuch is the charged-fear test against a
# hand-built fear-causer (WS3 S3 T3 W3 I10 A1 Ld7, mace); every strike is a declared natural 1.
# Semantic wrinkle (2026-11-18): the automatic pass is read on a Fear test, the only Leadership test
# a 1v1 round forces; the printed "any Leadership test" also covers tests outside the duel.

# The Merchant stands: the charged Eunuch's Fear test passes without a die (the strict tape holds no
# fear.charged dice) and he strikes on his ordinary target.
- audit_id: mechanic/mechanic.broken-spirit
  id: the-charged-eunuch-passes-without-a-die-while-the-slave-merchant-stands
  fighters:
    first:
      trait_overrides: {causes_fear: true}
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 10, attacks: 1, leadership: 7}
    second: {collection: mordheim, band_id: slavers-rel, profile_id: eunuchs}
  duel_context:
    charging: [first]
    active_participant: first
    nearby:
    - participant_id: slave-merchant
      side_id: second
      condition: standing
      fighter: {collection: mordheim, band_id: slavers-rel, profile_id: slave-merchant}
    distances: [[second, slave-merchant, 6]]
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.fear_hit_sixes: false, state.second.wounds: 1, state.second.condition: STANDING, state.first.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

