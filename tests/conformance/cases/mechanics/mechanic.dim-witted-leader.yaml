# --- Authored scenarios ---
# The printed rule (Karak Azgal, 0-1 Barbarian / Dim-witted): "If the Barbarian is the warband's
# leader then he has an effective Leadership of 7 for warband members within 6\" and Rout tests."
# Consumer: modular/leadership.py - a supplied leader-six provider that also carries
# mechanic.dim-witted-leader lends the printed effective 7 instead of his own Leadership, and his
# supply radius is the printed six inches (_supplied_provider).  The builds mirror the authored
# leader-six sibling of the same printed rule: the borrower is the band's printed elf
# (profiles.yaml: WS4 S3 T3 W1 I5 A1 Ld8) with its required Stupidity supplied as a trait, the
# provider is the printed Barbarian (Ld10, rule barbarian--dim-witted, grant: profile) as a
# nearby same-band participant, and the test under evidence is the elf's Stupidity test on its
# charge.  3+5 = 8 fails the borrowed effective 7 (it would pass the Barbarian's own printed 10,
# which is the dim-witted-specific consequence) and passes the elf's own printed 8.  The elf
# fights with its neutral fist, which still grants the opponent the printed 6+ save; the Rout
# half of the printed sentence stays outside the admitted scope.

# Inside the printed six inches the declared borrow tests the effective 7: the total of 8 fails,
# the charge is cancelled, and the Barbarian's own printed 10 - which would have passed that same
# total - is never the value lent.
- audit_id: mechanic/mechanic.dim-witted-leader
  id: inside-six-inches-the-lent-value-is-the-printed-seven-not-the-barbarians-ten
  fighters:
    first:
      collection: mordheim
      band_id: adventurers-kaz
      profile_id: elf
      trait_overrides: {stupidity: true}
    second:
      main_weapon_id: weapon.mace
      characteristics: &dimwit-opponent {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context:
    first_id: first
    second_id: second
    charging: [first]
    active_participant: first
    distances: [[first, barbarian-leader, 6]]
    nearby:
      - participant_id: barbarian-leader
        side_id: first
        condition: standing
        fighter: &dimwit-barbarian {collection: mordheim, band_id: adventurers-kaz, profile_id: barbarian}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.stupidity.leader.barbarian-leader, value: true}
  rolls:
    - {key: round.0.first.stupidity.0, value: 3}
    - {key: round.0.first.stupidity.1, value: 5}
  expect_rounds:
    0: {attacks: [], state.first.stupidity_failed: true, state.first_charged: false, state.engaged: false}
  expect_final: {rounds_executed: 1, termination_reason: disengaged}

# The borrow is optional, and the dim-witted 7 is below the member's own value: declining it
# tests the same total of 8 against the elf's own printed 8, which passes, and the charge strikes
# home.
