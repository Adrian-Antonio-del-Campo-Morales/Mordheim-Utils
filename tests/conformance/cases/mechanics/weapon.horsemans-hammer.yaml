# Conformance authoring scaffold; generated comments, manually authored scenarios.
# audit_id: mechanic/weapon.horsemans-hammer
# authoring_status: AUTHORED
# authoring_progress: 5 scenarios pin the printed +1 Strength at its wound boundary (a 3
#   wounds T3 with the hammer, the same 3 fails with a mace), the absence of a printed
#   strike-last tier (the higher-Initiative bearer resolves first, where the ordinary
#   great weapon's sibling duel reverses the same dice), and the real Roadwarden
#   compiled through the hireling route with his printed kit hammer (expect_fighters).
#   REVIEWED still requires manual semantic review and execution_status stays UNEXECUTED.
# execution_status: UNEXECUTED (this scaffold has no behavioral result)
#
# Derive inputs and expectations from rule text and accepted rulings.
# Do not derive them from the engine or execute combat during authoring.
# REVIEWED requires semantic review; covers labels alone are insufficient.
# Preserve audit_id when filling this file.
# Governing rulings: docs/decisions/design-rulings.md
# Record: sources/knowledge/catalog/mechanics/close-combat.yaml
#
# AUTHORED: 5 scenarios cover the +1 Strength wound boundary with its mace
#   control, the absent strike-last tier against the ordinary great weapon's
#   sibling order, and the real Roadwarden's compiled kit hammer.

# --- Authored scenarios ---
# mechanic/weapon.horsemans-hammer - Empire in Flames p.16: Strength as user +1,
# Two-handed.  The print carries NO strike-last (design ruling, 2026-11-18, second
# triage batch); the mounted Cavalry Charge +1 Strength stays outside the duel
# (deferred.mounts).
#
# Expectations come from the printed trading-post entry and the adopted ruling,
# never from engine output.  S3 +1 = S4 against T3 wounds on a 3+, so the wound
# die 3 is the boundary: it wounds with the hammer and fails with the mace
# control.  The strike-order pair reuses the double-handed-weapon contrast: the
# same uncharged dice resolve bearer-first with the hammer (no printed
# strike-last) and defender-first with the ordinary great weapon.

# The printed +1 Strength at its boundary: the wound die 3 reaches the S4 target
# against T3, and the injury 1 leaves the defender Knocked Down.
- audit_id: mechanic/weapon.horsemans-hammer
  id: horsemans-hammer-wounds-at-the-boosted-strength
  fighters:
    first:
      main_weapon_id: weapon.horsemans-hammer
      characteristics: &hh-attacker {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 2, attacks: 1}
  duel_context: &hh-charging-first {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 3}
    - {key: round.0.first.attack.0.injury.0, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 1, state.second.wounds: 0, state.second.condition: KNOCKED_DOWN}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The mace control: the identical wound die 3 is one face below the unboosted S3
# target against T3, so the point of Strength is the hammer's own.
- audit_id: mechanic/weapon.horsemans-hammer
  id: the-same-wound-die-fails-without-the-hammer
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: *hh-attacker
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 2, attacks: 1}
  duel_context: *hh-charging-first
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 3}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 0, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# No printed strike-last: neither fighter charges, so the hammer bearer's higher
# Initiative resolves first, exactly as an ordinary one-handed weapon would.
- audit_id: mechanic/weapon.horsemans-hammer
  id: the-hammer-strikes-in-ordinary-initiative-order
  fighters:
    first:
      main_weapon_id: weapon.horsemans-hammer
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: &hh-defender-w2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.wounds: 2, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
  expect_events:
    - {kind: roll, key: round.0.first.attack.0.hit, sides: 6, value: 1}
    - {kind: roll, key: round.0.second.attack.0.hit, sides: 6, value: 1}

# The sibling contrast: the ordinary double-handed weapon in the same duel DOES
# print strike-last, so the identical dice resolve in the opposite order.  The
# pair isolates the Horseman's Hammer's missing strike-last tier.
- audit_id: mechanic/weapon.horsemans-hammer
  id: the-ordinary-great-weapon-sibling-strikes-last-instead
  fighters:
    first:
      main_weapon_id: weapon.double-handed-weapon
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: *hh-defender-w2
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.0.first.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.wounds: 2, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
  expect_events:
    - {kind: roll, key: round.0.second.attack.0.hit, sides: 6, value: 1}
    - {kind: roll, key: round.0.first.attack.0.hit, sides: 6, value: 1}

# The real Roadwarden (Town Cryer 26; hireling route) carries the printed kit
# hammer: the compiled main weapon shows the trading-post statline (+1 Strength,
# two-handed).  The hammer is named explicitly: the kit's printed dagger also
# fills an omitted main hand, so the selection, not the omission, is what this
# scenario fixes.  His Stern fear re-roll requests nothing in an uncharged duel
# against a fearless opponent, and both declared hit dice are misses.
- audit_id: mechanic/weapon.horsemans-hammer
  id: the-real-roadwarden-compiles-his-printed-kit-hammer
  fighters:
    first:
      collection: mordheim
      band_id: hirelings.hired-sword.1a
      profile_id: hireling.hired-sword.roadwarden
      main_weapon_id: weapon.horsemans-hammer
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_fighters:
    first.main_weapon.strength_bonus: 1
    first.main_weapon.two_handed: true
  expect_final: {rounds_executed: 1, termination_reason: horizon}
