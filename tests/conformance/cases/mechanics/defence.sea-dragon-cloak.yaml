# Governing rulings: docs/decisions/design-rulings.md
#
# Clause: armour-choice-five-plus-in-close-combat (scope: YES)
# AUTHORED[armour-choice-five-plus-in-close-combat]: 3 scenarios cover the 5+
#   close-combat save holding at the threshold, failing one face below it, and
#   the refusal when the cloak is combined with another suit of armour. The
#   refusal needs the runner's declared `expect_error` contract to be executed;
#   see the clause note below. Pending semantic review.
#
# Clause: shooting-outside-the-duel (scope: NO)
# Outside the admitted clause scope; retained for context, not a test TODO.

# --- Authored scenarios ---
# mechanic/defence.sea-dragon-cloak — a 5+ close-combat save that occupies the
# armour choice.
#
# Expectations come from the printed rule and the admitted clause
# `armour-choice-five-plus-in-close-combat` of
# the knowledge-base clause contracts (sources/knowledge), never from engine output:
# the cloak grants a 5+ armour save in close combat and is itself the armour
# choice, so it cannot be combined with another suit.  The cloak is supplied in
# `defence_ids` (it is not a hand-held defence) and the armour choice is left
# empty, which is exactly the printed "occupies the armour choice" state.  An
# unmodified Strength 3 attacker applies no save modifier, so the armour face is
# the printed target: the five holds, the four fails.
#
# The refusal is declared with the corpus `expect_error` contract, the same one
# the migrated grant evidence uses: an ineligible build must be refused for the
# reason it names, so the case that runs fails instead of passing silently.  A
# loadout refusal is raised while the build is compiled, before any round, so no
# observation can be combined with it.  The declared reason fragment is the
# diagnostic of the armour-slot prohibition, which is the clause that forbids
# the combination.
#
# The first scenario declares the shared profiles as YAML anchors; the sibling
# aliases them and keeps its own armour face and expectation.

- audit_id: mechanic/defence.sea-dragon-cloak
  id: sea-dragon-cloak-saves-on-five
  covers: [armour-choice-five-plus-in-close-combat]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: &attacker-ws3-s3-t3-w2-i5 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      defence_ids: [defence.sea-dragon-cloak]
      characteristics: &defender-ws3-s3-t3-w2-i2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: &charging-first {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.armour, value: 5}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.saved: true, attacks.0.damage: 0, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# One face below the printed target: the four is not a 5+, so the wound is
# taken and the defender drops a wound.  No other armour face is scripted.

- audit_id: mechanic/defence.sea-dragon-cloak
  id: sea-dragon-cloak-does-not-save-on-four
  covers: [armour-choice-five-plus-in-close-combat]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: *attacker-ws3-s3-t3-w2-i5
    second:
      main_weapon_id: weapon.mace
      defence_ids: [defence.sea-dragon-cloak]
      characteristics: *defender-ws3-s3-t3-w2-i2
  duel_context: *charging-first
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.armour, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.saved: false, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The cloak occupies the armour choice, so wearing another suit with it is
# refused rather than composed: the build is rejected before any round runs.

- audit_id: mechanic/defence.sea-dragon-cloak
  id: sea-dragon-cloak-cannot-be-combined-with-another-suit
  covers: [armour-choice-five-plus-in-close-combat]
  fighters:
    first:
      main_weapon_id: weapon.mace
      defence_ids: [defence.sea-dragon-cloak]
      armour_id: armour.plate-armour
  expect_error: "Sea Dragon cloak occupies the armour choice and cannot be combined with another suit"
