# A declared one is the printed Madness: Stupidity this turn, tested on two dice against the bearer's
# own Leadership 7; 6+6 fails, so he makes no attack of his own while the opponent still strikes
# (its declared 1 misses).  The reversion half of the same result is the recorded harness gap.
- audit_id: mechanic/mechanic.bitten-transform
  id: a-declared-one-is-madness-and-a-failed-this-turn-stupidity-test
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.bitten-transform]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 7}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [second], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.bitten, value: 1}
    - {key: round.0.first.stupidity.0, value: 6}
    - {key: round.0.first.stupidity.1, value: 6}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.stupidity_failed: true, state.first.bitten_result: 1, state.first.transformed: false,
        attacks.0.hit_roll: 1, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The cast-off: while untransformed (rounds 0 and 1) the worn light armour saves the incoming wound on
# its 6+; in round 2 (the bearer's own turn again) the declared six enters the form, the armour is cast
# off with the rest of the kit, the same incoming wound asks no armour die and lands.  Round 1 is the
# opponent's turn, so no form die is asked there; the strict tape declares none.
- audit_id: mechanic/mechanic.bitten-transform
  id: transforming-casts-off-the-worn-armour-and-asks-no-die-on-the-opponents-turn
  fighters:
    first:
      main_weapon_id: weapon.mace
      armour_id: armour.light-armour
      skill_ids: [mechanic.bitten-transform]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 7}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 3
  rolls:
    - {key: round.0.first.bitten, value: 4}
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 4}
    - {key: round.0.second.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.armour, value: 6}
    - {key: round.1.first.attack.0.hit, value: 1}
    - {key: round.1.second.attack.0.hit, value: 4}
    - {key: round.1.second.attack.0.wound, value: 4}
    - {key: round.1.second.attack.0.armour, value: 6}
    - {key: round.2.first.bitten, value: 6}
    - {key: round.2.first.attack.0.hit, value: 1}
    - {key: round.2.first.attack.1.hit, value: 1}
    - {key: round.2.second.attack.0.hit, value: 4}
    - {key: round.2.second.attack.0.wound, value: 4}
  expect_rounds:
    0: {state.first.transformed: false, attacks.1.saved: true, state.first.wounds: 2}
    1: {state.first.transformed: false, attacks.1.saved: true, state.first.wounds: 2}
    2: {state.first.transformed: true, state.first.equipment_cast_off: true, attacks.2.saved: false,
        attacks.2.damage: 1, state.first.wounds: 1}
  expect_final: {rounds_executed: 3, termination_reason: horizon}

