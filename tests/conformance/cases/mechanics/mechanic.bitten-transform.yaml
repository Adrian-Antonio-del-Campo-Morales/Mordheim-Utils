# Printed carrier: Masters of Horror, The Bitten, Transform (bands/mordheim/masters-of-horror-sylv/
# special-rules.yaml the-bitten--transform, grant profile): each own turn the Bitten rolls a D6 - a 6
# transforms him (Frenzy, discards all equipment but a dagger, no unarmed penalties), 2-5 act as normal,
# a 1 is Madness (Stupidity this turn; a Transformed Bitten reverts).  Consumer: modular/rounds.py ~470-515
# (die round.<i>.<side>.bitten on the bearer's own turn unless already transformed and engaged; a 6 sets
# transformed/equipment_cast_off, a 1 sets bitten_result 1 which psychology.resolve_stupidity reads as a
# supplied Stupidity; the form grants rule.unarmed-without-penalties and Frenzy; equipment_for_state
# projects the cast-off kit).  Model: the PARTIAL grant file (...99f10ef924a1) on the real Bitten, whose
# dice grammar these tapes mirror on a hand-built fixture (WS3 S3 T3 W2 I5 A1 Ld7) carrying the shared
# operator through skill_ids.  The opponent is the mace fixture (WS3 S3 T3 W3 I2 A1 Ld7), silenced with
# attacks 0 where only the bearer's pool matters (it carries a mace, so no fist swing survives).
# Semantic wrinkle (2026-11-18): the "revert to human form" half of Madness needs a transformed bearer
# disengaged at his own turn, which the 1v1 harness cannot reach (the grant file's named gap); the
# cast-off mace leaves the transformed bearer fighting with fists, so his two Frenzy swings are unarmed.

# A declared six is the printed transformation: the state records the form and its Frenzy, so the
# bearer's single Attack becomes two blows (two hit dice are consumed).
- audit_id: mechanic/mechanic.bitten-transform
  id: a-declared-six-transforms-the-bearer-and-frenzy-doubles-his-attack
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.bitten-transform]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 7}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.bitten, value: 6}
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.first.attack.1.hit, value: 1}
  expect_rounds:
    0: {state.first.transformed: true, state.first.frenzy: true, state.first.bitten_result: 6,
        attacks.0.hit_roll: 1, attacks.1.hit_roll: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# Two to five is the printed "act as normal": the result is recorded, the form is not entered and only
