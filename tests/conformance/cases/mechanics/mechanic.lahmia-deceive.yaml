# --- Authored scenarios ---
# Printed source (Chaos in the Streets p.183, Lahmia Special Skills / Deceive, bound by
# band--lahmia-power-deceive): "Once per turn, one enemy in base contact must pass a Leadership test using
# its own Leadership.  If it fails, it may not attack the Lahmia Vampire that turn, though it may attack
# another model in base contact.  Models immune to Psychology, Undead and Daemons are unaffected."
# Operator model (the authored band file ...f3c4bd901191 is the template): the use is a decision at
# round.<r>.<target>.deceive, the target's own dice are .0/.1 (own value only), and a failure sets
# state.<target>.charm_attack_blocked.  The "may attack another model in base contact" remainder has no
# second target in a duel and is recorded, not asserted.  Not representable: "using its own Leadership"
# needs a borrowable same-band leader, which a hand-built fixture has no band tag to borrow from.

# The declared use and the failed own-value test (6+6 against Ld7): the enemy is barred for the phase.
- audit_id: mechanic/mechanic.lahmia-deceive
  id: a-declared-deceive-that-fails-bars-the-enemy-for-the-phase
  fighters:
    first:
      &deceiver
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.lahmia-deceive]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      &target
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.second.deceive, value: true}
  rolls:
    - {key: round.0.second.deceive.0, value: 6}
    - {key: round.0.second.deceive.1, value: 6}
    - {key: round.0.first.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: false, state.second.charm_attack_blocked: true, state.second.condition: STANDING}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The passed test (1+1): the enemy is not barred and both pools ask for their To Hit die.
- audit_id: mechanic/mechanic.lahmia-deceive
  id: a-passed-deceive-test-leaves-the-enemy-unbarred
  fighters:
    first:
      <<: *deceiver
    second:
      <<: *target
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.second.deceive, value: true}
  rolls:
    - {key: round.0.second.deceive.0, value: 1}
    - {key: round.0.second.deceive.1, value: 1}
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: false, attacks.1.hit: false, state.second.charm_attack_blocked: false}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

