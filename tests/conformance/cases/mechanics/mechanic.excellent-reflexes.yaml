# Conformance authoring scaffold; generated comments, manually authored scenarios.
# audit_id: mechanic/mechanic.excellent-reflexes
# authoring_status: AUTHORED
# authoring_progress: 4 authored scenarios (survival-saves-and-rerolls batch, 2026-11-18): a
#   hand-built bearer of the mechanic compiles with global_effects.ward_save 5 and, after an unsaved
#   wound, its special save die of five turns the wound while a four lets it through; a fixture
#   without the mechanic is offered no special save die; the save is also offered against a Strength
#   5 hit that denies every armour save (it is a special save, not an armour save).  REVIEWED still
#   requires manual semantic review.
# AUTHORED: the scenarios are declared below (see authoring_progress); REVIEWED still requires
#   manual semantic review.
# Semantic wrinkle (2026-11-18): the shared mechanic is injected through skill_ids on a hand-built
#   bearer, so the removal probe reports this file inert by design (the printed grant is evidenced
#   in the Tomb Robber's own file ...7f01babd948e).  The print covers "any attack, including close
#   combat, traps and spells"; traps and spells have no producer in a duel, so only close combat is
#   evidenced.  The Dodge improvement to 4+ is the separate supplied fact
#   condition.tomb-robber-dodge-known (its own mechanics file).
# execution_status: UNEXECUTED (this scaffold has no behavioral result)
#
# Derive inputs and expectations from rule text and accepted rulings.
# Do not derive them from the engine or execute combat during authoring.
# REVIEWED requires semantic review; covers labels alone are insufficient.
# Preserve audit_id when filling this file.
# Governing rulings: docs/decisions/design-rulings.md
