# A dwarf axe may parry. A parry must beat the to-hit roll, so a 5 blocks a hit landed on a 4.

- audit_id: mechanic/weapon.dwarf-axe
  id: dwarf-axe-parry-blocks-a-higher-roll
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.dwarf-axe
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.parry, value: 5}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.parried: true, attacks.0.wounded: false, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# An equal roll does not parry: the wound is taken.

- audit_id: mechanic/weapon.dwarf-axe
  id: dwarf-axe-parry-does-not-block-an-equal-roll
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: *atk-ws3-s3-t3-w2-i5
    second:
      main_weapon_id: weapon.dwarf-axe
      characteristics: *dfn-ws3-s3-t3-w2-i2
  duel_context: *charging-first
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.parry, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.parried: false, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

