# --- Authored scenarios ---
# Printed source (Chaos in the Streets p.181, Von Carstein Special Skills / Hypnotic Gaze): "Once per
# turn, one enemy in base contact must pass a Leadership test using its own Leadership, not the leader's.
# If it fails, it may not attack that turn and all attacks against it hit automatically.  Models immune
# to Psychology are unaffected."  Operator model (the authored band file ...d0f2a79f4eea is the
# template): the use is a decision at round.<r>.<target>.hypnotic-gaze, the target's own two dice are
# .0/.1 (own_value_only), a failure sets state.<target>.charm_attack_blocked and charm_auto_hit, and the
# gazer's attack then requests no To Hit die.  Not representable: "not the leader's" needs a borrowable
# same-band leader, which a hand-built fixture has no band tag to borrow from.

# The failed test (6+6 against Ld7): the target is barred and the gazer's attack hits automatically, so
# the only attack die the tape carries is the To Wound roll, which fails and leaves the target unharmed.
- audit_id: mechanic/mechanic.hypnotic-gaze
  id: a-failed-gaze-test-bars-the-target-and-makes-attacks-hit-automatically
  fighters:
    first:
      &gazer
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.hypnotic-gaze]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      &target
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.second.hypnotic-gaze, value: true}
  rolls:
    - {key: round.0.second.hypnotic-gaze.0, value: 6}
    - {key: round.0.second.hypnotic-gaze.1, value: 6}
    - {key: round.0.first.attack.0.wound, value: 1}
  expect_rounds:
    0: {attacks.0.hit: true, state.second.charm_attack_blocked: true, state.second.charm_auto_hit: true, state.second.condition: STANDING, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The passed test (1+1): nothing is barred, no attack is automatic, and both pools ask for their To Hit die.
- audit_id: mechanic/mechanic.hypnotic-gaze
  id: a-passed-gaze-test-leaves-both-pools-intact
  fighters:
    first:
      <<: *gazer
    second:
      <<: *target
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.second.hypnotic-gaze, value: true}
  rolls:
    - {key: round.0.second.hypnotic-gaze.0, value: 1}
    - {key: round.0.second.hypnotic-gaze.1, value: 1}
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: false, attacks.1.hit: false, state.second.charm_attack_blocked: false, state.second.charm_auto_hit: false}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The printed exemption: a Psychology-immune target asks for no gaze die and keeps its own attack.
- audit_id: mechanic/mechanic.hypnotic-gaze
  id: a-psychology-immune-target-skips-the-gaze
  fighters:
    first:
      <<: *gazer
    second:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.psychology-immunity]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: false, attacks.1.hit: false, state.second.charm_attack_blocked: false}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The power is used at the player's choice: declining it requests no Leadership die.
- audit_id: mechanic/mechanic.hypnotic-gaze
  id: declining-the-gaze-leaves-the-target-alone
  fighters:
    first:
      <<: *gazer
    second:
      <<: *target
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.second.hypnotic-gaze, value: false}
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: false, attacks.1.hit: false, state.second.charm_attack_blocked: false}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

