- audit_id: mechanic/weapon.chain-sticks
  id: chain-sticks-add-two-attacks-in-the-first-turn-only
  fighters:
    first:
      main_weapon_id: weapon.chain-sticks
      characteristics: &a-ws3-s3-t3-w2-i5 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
