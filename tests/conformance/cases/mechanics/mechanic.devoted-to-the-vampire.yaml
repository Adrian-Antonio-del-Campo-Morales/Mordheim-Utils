      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      <<: *killer
  duel_context: {charging: [second], active_participant: second}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.0.first.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.frenzy: false, attacks.1.hit: false, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The supplied Vampire condition belongs to this mechanic: without it the fact is refused by construction.
- audit_id: mechanic/mechanic.devoted-to-the-vampire
  id: the-supplied-vampire-fact-without-the-mechanic-is-refused
  fighters:
    first:
      main_weapon_id: weapon.mace
      trait_overrides: {devoted_vampire_down: true}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      <<: *killer
  expect_error: "supplied Vampire condition requires Devoted to the Vampire"
