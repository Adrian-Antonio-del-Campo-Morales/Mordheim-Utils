# Conformance authoring scaffold; generated comments, manually authored scenarios.
# audit_id: mechanic/mechanic.inconsistency
# authoring_status: AUTHORED
# authoring_progress: 4 authored scenarios (hatred-frenzy-and-charge-rages batch 2026-11-18): on the two
#   real carriers the Weapon Skill rolled when the blow needs it drives the hit target (the Condemned's
#   1 makes a 5+; Belandysh's 6 makes a 3+ and his rolled Strength wounds); a Condemned whose variable
#   characteristics are all fixed rolls nothing; a hand-built warrior carrying only the tag has no
#   variable profile to roll and keeps his fixed targets.  REVIEWED still requires manual semantic review.
# AUTHORED: all applicable requirements carry a scenario; REVIEWED still requires manual semantic review.
# Semantic wrinkle (2026-11-18, recorded): the mechanic is the per-turn operator over a profile's
#   compiled random rows (profile.random-characteristics); no FighterBuild trait supplies such rows
#   (contracts.py TRAIT_TYPES has only condemned_fixed_characteristics), so a skill_ids injection on a
#   hand-built fighter is inert by construction and the activation is evidenced on the real carriers
#   (the Condemned through the band route, Belandysh through the hireling route).  Both carriers also
#   author the operator in their own grant files (...condemned--inconsistency--mechanic.inconsi--
#   7d86af9261c2, ...belandysh...--0d3fde6466b9).
# execution_status: UNEXECUTED (this scaffold has no behavioral result)
#
# Derive inputs and expectations from rule text and accepted rulings.
# Do not derive them from the engine or execute combat during authoring.
# REVIEWED requires semantic review; covers labels alone are insufficient.
# Preserve audit_id when filling this file.
# Governing rulings: docs/decisions/design-rulings.md
# Record: sources/knowledge/catalog/mechanics/close-combat.yaml
