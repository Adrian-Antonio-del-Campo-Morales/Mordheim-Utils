# Clause: cannot-combine-with-big-bully (scope: YES)
# PARTIAL[cannot-combine-with-big-bully]: the exclusion is not authorable as a duel
#   scenario, with a hard reason that this intervention verified against the sources:
#   the printed partner skill `bigsnotz--big-bully` carries runtime scope LATER and
#   implemented NO with grant profile, so no runtime skill id for Big Bully exists and
#   no build can carry both skills in the compiled vocabulary. The refusal is therefore
#   a construction/eligibility coupling, and it is requested here as a dependency, not
#   left vague. Normative text: the printed sentences of both sources (bigsnotz--big-bully
#   "Cannot be combined with the skill Frustratingly Tiny"; bullied-goblin--frustratingly-tiny
#   "This skill cannot be combined with the Big Bully skill above"). Input: one build of one
#   carrier holding both printable skills - Big Bully's own profile-only grant and the
#   selectable frustratingly-tiny (the eligibility layer of
#   packages/typescript/domain/eligibility/index.ts already pairs them as
#   bullied-goblin--frustratingly-tiny against bigsnotz--big-bully). Assertion: an
#   expect_error refusal naming the printed exclusion. Missing capability: a compile-time
#   mutual-exclusion check enforced by the same compiler the runner drives (connection
#   work, register implementation_batch B17-construction) plus a runtime grant id for
#   Big Bully should the duel ever take that skill.; the pairing itself stays in the
#   register as printed.
#
# Clause: minus-one-to-hit-in-melee (scope: YES)
# AUTHORED[minus-one-to-hit-in-melee]: 2 scenarios show the same declared To-Hit face of four missing against the bearer and hitting the same way against a warrior without the trait.

# --- Authored scenarios ---
# The printed penalty is suffered against the bearer, so the trait sits on the defending model
# and the attacker's declared die is the only input that changes between the pair: Weapon Skill
# 3 against Weapon Skill 3 needs a 4+ normally and a 5+ with the penalty.
- audit_id: mechanic/mechanic.frustratingly-tiny
  id: the-same-face-of-four-misses-against-the-bearer
  covers: [minus-one-to-hit-in-melee]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.frustratingly-tiny]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1}
  initial_state:
    second: {wounds: 3, attacks: 0}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
  expect_rounds:
    0: {attacks.0.damage: 0, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# The control for the clause: the same declared four hits a warrior without the trait, so the
# miss above is the printed melee penalty and not the ordinary to-hit table.
- audit_id: mechanic/mechanic.frustratingly-tiny
  id: the-same-face-of-four-hits-without-the-trait
  covers: [minus-one-to-hit-in-melee]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1}
  initial_state:
    second: {wounds: 3, attacks: 0}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
  expect_rounds:
    0: {attacks.0.hit: true, attacks.0.damage: 1, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
