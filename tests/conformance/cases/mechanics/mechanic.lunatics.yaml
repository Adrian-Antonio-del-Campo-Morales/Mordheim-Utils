# --- Authored scenarios ---
# Printed carrier: Lustria Pygmies, Wild Lunatics, Lunatics (bands/trollheim/lustria-pygmies/
# special-rules.yaml wild-lunatics--lunatics, grant profile, Lustria p.124): "At the start of each turn,
# roll 1D6 for each Wild Lunatic in play.  On 1-3 that model gains Frenzy; on 4-6 it gains Stupidity."
# Consumer: modular/rounds.py ~520-532: every player turn the die round.<i>.<side>.lunatics is rolled
# for each bearer; <= 3 sets state frenzy, >= 4 sets lunatic_stupidity, which psychology.resolve_stupidity
# (~59-125) tests on the bearer's own turn on round.<i>.<side>.stupidity.{0,1}; a failure zeroes its
# attack pool.  Model: the AUTHORED Lustria grant file (...f3b2a5835dab) on the real Wild Lunatic; here
# the operator is injected through skill_ids on the hand-built fixture (WS3 S3 T3 W2 I5 A1 Ld7, mace).
# The opponent is the mace fixture (WS3 S3 T3 W3 I2 A1 Ld7); every strike is a declared 1.
# Semantic wrinkle (2026-11-18): the accumulated Frenzy/Stupidity across turns (stacking, duration) is
# the recorded open source question; these tapes stay within one player turn.

# A 1 is Frenzy: the bearer's single attack is doubled, so two hit dice are consumed.
- audit_id: mechanic/mechanic.lunatics
  id: a-roll-of-one-grants-frenzy-and-doubles-the-attack
  fighters:
    first:
      &bearer
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.lunatics]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 7}
    second:
      &opponent
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.lunatics, value: 1}
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.first.attack.1.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.frenzy: true, state.first.lunatic_stupidity: false, state.first.lunatic_result: 1,
        attacks.0.hit_roll: 1, attacks.1.hit_roll: 1, attacks.2.hit_roll: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# A 4 is Stupidity: on its own turn the bearer tests Leadership 7 on two dice; 6+6 fails, so it makes
# no attack while the opponent still swings.
- audit_id: mechanic/mechanic.lunatics
  id: a-roll-of-four-grants-stupidity-and-a-failed-test-silences-the-bearer
  fighters:
    first:
      <<: *bearer
    second:
      <<: *opponent
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.lunatics, value: 4}
    - {key: round.0.first.stupidity.0, value: 6}
    - {key: round.0.first.stupidity.1, value: 6}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.frenzy: false, state.first.lunatic_stupidity: true, state.first.stupidity_failed: true,
        attacks.0.hit_roll: 1, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The same 4 with a passing test (1+1): the bearer keeps its single attack.
- audit_id: mechanic/mechanic.lunatics
  id: a-passed-stupidity-test-leaves-the-bearer-fighting
  fighters:
    first:
      <<: *bearer
    second:
      <<: *opponent
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.lunatics, value: 4}
    - {key: round.0.first.stupidity.0, value: 1}
    - {key: round.0.first.stupidity.1, value: 1}
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.lunatic_stupidity: true, state.first.stupidity_failed: false, attacks.0.hit_roll: 1, attacks.1.hit_roll: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The control: without the operator no lunatics die and no Stupidity test exist in the tape.
- audit_id: mechanic/mechanic.lunatics
  id: without-the-operator-no-turn-die-is-rolled
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 7}
    second:
      <<: *opponent
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.frenzy: false, state.first.lunatic_stupidity: false, state.first.lunatic_result: 0}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
