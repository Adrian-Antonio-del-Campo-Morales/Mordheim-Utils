# Printed source (broheim.net p.26 / Town Cryer 15, Penthesilea / Man-Hater, bound by
# hireling.dramatis.penthesilea-mark-of-the-serpent.rule.man-hater): "Hatred of human males, determined by
# the individual opponent, not their warband."  The recorded contract reads both supplied facts on the
# opponent (trait_overrides species: human and sex: male; the compiled species.human and sex.male), so a
# human female and a non-human male are each outside it.  Hatred model (the authored hireling file
# ...99bd3ea4081b is the template): a natural 2 misses WS3 against WS3; the Hatred re-roll of the first
# round is requested at round.0.<side>.attack.0.hit.reroll, a 4 hits and S3 wounds T3 on a 4; outside the
# hated identity the strict tape holds no re-roll key.  The bearer is a hand-built fixture carrying the
# mechanic through skill_ids; the real Penthesilea is exercised by the hireling file ...ea1596c84215.  The
# immunity scenario applies the generic ruling "Strigoi Psychology immunity suppresses Hatred against
# everyone" (design-rulings.md).

# The first-round miss against a human male is re-rolled, hits and wounds.
- audit_id: mechanic/mechanic.man-hater
  id: a-first-round-miss-against-a-human-male-is-rerolled
  fighters:
    first:
      &bearer
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.man-hater]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      &human_male
      main_weapon_id: weapon.mace
      trait_overrides: {species: human, sex: male}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.first.attack.0.hit.reroll, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: true, attacks.0.damage: 1, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# A human female is not hated: the same miss stands and no re-roll key exists.
- audit_id: mechanic/mechanic.man-hater
