# --- Authored scenarios ---
# mechanic/weapon.barbed-whip - Whipcrack: +1 attack when the bearer charges or
# is charged, capped at one however many whips are carried.
#
# Expectations come from the printed rule and the admitted clause `whole`, never
# from engine output.  When the bearer charges, the bonus joins the ordinary pool;
# when the bearer is charged the bonus alone resolves at the strike-first tier,
# so the charged scenario's tape opens with the bonus attack.
# The charging bearer resolves one base attack and one Whipcrack attack; the ordered tape fixes the count.

- audit_id: mechanic/weapon.barbed-whip
  id: barbed-whip-grants-one-bonus-attack-when-charging
  fighters:
    first:
      main_weapon_id: weapon.barbed-whip
      characteristics: &a-ws3-s3-t3-w2-i5 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: &d-ws3-s3-t3-w2-i2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.first.attack.1.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.wounds: 2, state.first.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
  expect_events:
    - {kind: roll, key: round.0.first.attack.0.hit, sides: 6, value: 1}
    - {kind: roll, key: round.0.first.attack.1.hit, sides: 6, value: 1}
    - {kind: roll, key: round.0.second.attack.0.hit, sides: 6, value: 1}
