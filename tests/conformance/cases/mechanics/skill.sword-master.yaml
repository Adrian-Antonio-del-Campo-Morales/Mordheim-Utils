    value: 4
  - key: round.0.first.attack.1.hit
    value: 4
  - key: round.0.first.attack.0.parry
    value: 5
  - key: round.0.first.attack.1.wound
    value: 4
  - key: round.0.second.attack.0.hit
    value: 1
  expect_rounds:
    0:
      attacks.0.parried: true
      attacks.1.parried: false
      attacks.1.damage: 1
      state.second.parries_remaining: 0
      state.second.wounds: 1
  expect_final:
    rounds_executed: 1
    termination_reason: horizon

