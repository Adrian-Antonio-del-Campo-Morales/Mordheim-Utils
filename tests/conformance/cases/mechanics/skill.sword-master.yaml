      characteristics:
        weapon_skill: 3
        strength: 3
        toughness: 3
        wounds: 2
        initiative: 2
        attacks: 1
  initial_state:
    second:
      attacks: 0
  duel_context:
    charging:
    - first
    active_participant: first
  maximum_rounds: 1
