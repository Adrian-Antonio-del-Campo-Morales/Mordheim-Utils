# --- Authored scenarios ---
# Printed carriers: the Night Goblin special skill Netter (bands/mordheim/night-goblins-kaz/
# special-rules.yaml band--night-goblin-special-skills-netter and the Crooked Moon / Night Goblins
# siblings, selectable): "chuck and charge" - the goblin throws his net as a charge; a netted target
# counts as knocked down and is hit automatically.  A hand-built fighter carrying the mechanic fights an
# ordinary round: both blows are natural 1s and the round ends at the horizon, as it would without it.
- audit_id: mechanic/mechanic.netter
  id: the-mechanic-compiles-and-the-round-resolves-unchanged
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.netter]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 7}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.wounds: 2, state.second.wounds: 3, state.second.condition: STANDING, state.second.netted: false}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
