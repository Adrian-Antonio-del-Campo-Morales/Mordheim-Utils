# --- Authored scenarios ---
# mechanic/poison.nightshade - authored from the printed rule and the
# admitted `whole` clause, never from engine output.
# One point of damage that passes the saves lowers the target's Initiative by one.
# The engine carries the reduction as the lasting `initiative_penalty` field (the
# base `initiative` characteristic is unchanged; priority applies the penalty after
# flooring).  Both warriors print Initiative 5, so the round opens with the printed
# priority tie roll, declared here as a 4 that puts the poisoned bearer first.
- audit_id: mechanic/poison.nightshade
  id: an-unsaved-wound-lowers-initiative-by-one
  fighters:
    first:
      main_weapon_id: weapon.mace
      main_poison_id: poison.nightshade
      characteristics: &ns-attacker {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: &ns-defender {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
  duel_context: &ns-context {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.priority-tie, value: 4}
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 1, state.second.initiative_penalty: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# mechanic/poison.nightshade - authored from the printed rule and the
# admitted `whole` clause, never from engine output.
# One point of damage that passes the saves lowers the target's Initiative by one;
# the accumulated penalty respects the printed floor of 1.
- audit_id: mechanic/poison.nightshade
  id: the-initiative-floor-of-one-holds
  fighters:
    first:
      main_weapon_id: weapon.mace
      main_poison_id: poison.nightshade
      characteristics: *ns-attacker
    second:
      main_weapon_id: weapon.mace
      characteristics: {<<: *ns-defender, initiative: 1}
  duel_context: *ns-context
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 1, state.second.initiative: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

