# authoring_status: AUTHORED
# authoring_progress: the admitted clause carries two authored scenarios derived from the printed rule and the recorded contract: the armour-save modifier of the same attack is taken from the effective Strength with the variant skill and from the raw profile Strength without it. REVIEWED still requires manual semantic review and execution_status stays UNEXECUTED.
