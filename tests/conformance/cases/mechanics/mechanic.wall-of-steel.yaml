# Conformance authoring scaffold; generated comments, manually authored scenarios.
# audit_id: mechanic/mechanic.wall-of-steel
# authoring_status: AUTHORED
# authoring_progress: 5 authored scenarios (2026-11-18): the declared stance lets the Ashigaru's spear
#   parry (and compiles it two-handed), the ordinary parry comparison still governs (a tie does not
#   block), the same spear without the stance offers no parry die, and the two printed preconditions
#   are refusals (an occupied off hand; a non-spear main weapon).  REVIEWED still requires manual
#   semantic review and execution_status stays UNEXECUTED.
# Discrimination note (2026-11-18): per the adopted ruling (docs/decisions/design-rulings.md,
#   Conformance triage decisions, 2026-11-18: "Wall of Steel's parry is carried by the declared
#   stance"), the executable carrier of the printed choice is the build variant stance.wall-of-steel
#   in variant_ids: the Python compiler projects two-handed + parry from the variant
#   (packages/python/roster-construction/mordheim_construction/compiler.py) and never reads the
#   mechanic's own tag, while the TS eligibility gate reads the granted mechanic id, the spear main
#   and the free off hand (packages/typescript/domain/eligibility/index.ts, loadoutRestriction).
#   The mechanic-probe neutralisation of this identity's execution entry therefore changes no build
#   and no duel observable here, so the probe's non-discriminating verdict for the neutralised entry
#   is expected by design; declaring the stance as a KB record stays the ruling's recorded TODO.
# execution_status: UNEXECUTED (this scaffold has no behavioral result)
#
# Derive inputs and expectations from rule text and accepted rulings.
# Do not derive them from the engine or execute combat during authoring.
# REVIEWED requires semantic review; covers labels alone are insufficient.
# Preserve audit_id when filling this file.
# Governing rulings: docs/decisions/design-rulings.md
# Record: sources/knowledge/catalog/mechanics/close-combat.yaml
# Printed sentence (bands/mordheim/nipponese-expedition-web/special-rules.yaml,
#   ashigaru--wall-of-steel): "... if wielding a spear you may choose to wield it two-handed, in
#   which case the spear gains the parry special rule."
# AUTHORED: 5 scenarios cover the stance's compiled two-handed parrying spear, the ordinary parry
#   comparison it obeys, the parry-less spear without the stance, and the two printed-precondition
#   refusals.

# --- Authored scenarios ---
# The bearer is the band's real Ashigaru (the mechanic is grant: profile on him, so nothing is
# selected) with his printed Weapon Skill 2 in the fixture characteristics; the attacker is a
# hand-built WS3 mace fixture, so the attacker hits on 3+.  The parry the stance grants is the
# ordinary printed parry: it blocks by beating the highest enemy hit roll (5 beats a 4; a 4 does
# not), with no inversion and no fixed target.  The spear strikes first, so the Ashigaru's own
# scripted miss leads each tape; W2
# keeps the landed blows short of an injury roll.

# The printed choice declared: with the stance the compiled spear is two-handed and parries, and a
# die of 5 blocks the hit of 4.  The compiled pair below is the printed grant itself.
- audit_id: mechanic/mechanic.wall-of-steel
  id: the-declared-stance-lets-the-spear-parry
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      collection: mordheim
      band_id: nipponese-expedition-web
      profile_id: ashigaru
      main_weapon_id: weapon.spear
      variant_ids: [stance.wall-of-steel]
      characteristics: {weapon_skill: 2, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.parry, value: 5}
  expect_fighters:
    second.main_weapon.parry: True
    second.main_weapon.two_handed: True
  expect_rounds:
    0: {attacks.1.parried: True, attacks.1.wounded: False, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The granted parry follows the ordinary comparison: the die must beat the highest hit roll, so a
# tie of 4 against the hit of 4 does not block and the wound carries through.
- audit_id: mechanic/mechanic.wall-of-steel
  id: the-granted-parry-does-not-block-on-a-tie
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      collection: mordheim
      band_id: nipponese-expedition-web
      profile_id: ashigaru
      main_weapon_id: weapon.spear
      variant_ids: [stance.wall-of-steel]
      characteristics: {weapon_skill: 2, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.parry, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
  expect_rounds:
    0: {attacks.1.parried: False, attacks.1.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The control: the same Ashigaru without the declared stance wields a one-handed spear that never
# gained the parry rule, so no parry die is offered at all - the tape that carries none resolves
# straight to the wound.
- audit_id: mechanic/mechanic.wall-of-steel
  id: without-the-stance-the-same-spear-offers-no-parry-die
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      collection: mordheim
      band_id: nipponese-expedition-web
      profile_id: ashigaru
      main_weapon_id: weapon.spear
      characteristics: {weapon_skill: 2, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
  expect_fighters:
    second.main_weapon.parry: False
    second.main_weapon.two_handed: False
  expect_rounds:
    0: {attacks.1.parried: False, attacks.1.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The printed choice is to wield the spear two-handed: an off-hand item alongside the declared
# stance is refused with the gate's own sentence.
- audit_id: mechanic/mechanic.wall-of-steel
  id: the-stance-with-an-occupied-off-hand-is-refused
  fighters:
    first:
      collection: mordheim
      band_id: nipponese-expedition-web
      profile_id: ashigaru
      main_weapon_id: weapon.spear
      off_hand_id: weapon.dagger
      variant_ids: [stance.wall-of-steel]
      characteristics: {weapon_skill: 2, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  expect_error: "the Wall of Steel spear occupies both hands"

# The printed condition is "if wielding a spear": the declared stance on any other main weapon is
# refused with the gate's own sentence.
- audit_id: mechanic/mechanic.wall-of-steel
  id: the-stance-without-a-spear-main-weapon-is-refused
  fighters:
    first:
      collection: mordheim
      band_id: nipponese-expedition-web
      profile_id: ashigaru
      main_weapon_id: weapon.sword
      variant_ids: [stance.wall-of-steel]
      characteristics: {weapon_skill: 2, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  expect_error: "Wall of Steel requires the Ashigaru's actual spear"
