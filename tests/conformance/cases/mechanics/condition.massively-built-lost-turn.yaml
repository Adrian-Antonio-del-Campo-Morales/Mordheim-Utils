# authoring_status: AUTHORED
# authoring_progress: 3 authored scenarios (supplied-conditions batch, 2026-11-18): the supplied lost
#   turn silences the bearer's own turn once (no attack of its own, the state spent) while its
#   retaliation in the opponent's turn and its following own turn are untouched; the pending state
#   waits for the bearer's own turn when it is supplied on the non-active side; the control without
