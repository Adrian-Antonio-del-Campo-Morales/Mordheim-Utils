#   first-round miss becomes an automatic hit and the single use is spent; a bearer
#   who is not a Hero keeps the miss; only one miss of the first round is replaced; a
#   miss in a later round is not replaced.  The printed price discrepancy is a
#   catalogue matter outside the duel.  REVIEWED still requires manual semantic review
#   and execution_status stays UNEXECUTED.
