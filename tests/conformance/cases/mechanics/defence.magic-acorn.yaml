#
# AUTHORED: 4 scenarios cover the Hero's replaced first-round miss, the
#   non-Hero control, the single-attack limit and the first-round limit.

# --- Authored scenarios ---
# mechanic/defence.magic-acorn - the Militiant Mootlanders' / Fen Guard's Magic
# Acorn (Mutiny in Marienburg): "in the first round of each hand-to-hand combat,
# the Hero automatically hits with a single attack that was rolled as a miss."
# The execution entry carries the tag mechanic.magic-acorn and the consumer
# (modular/attacks.py) turns one failed first-round melee hit of a bearer tagged
# fighter-kind.hero into a success, spending the resource `magic-acorn` once per
# duel.  The acorn is carried through defence_ids; the Hero recipient is the
# declared fact trait_overrides: {fighter_kind: hero} (the catalogue-runtime
# convention), and a hand-built bearer without it is no Hero.
#
# Expectations come from the printed text, never from engine output.  A hit die 1
# always misses WS3; once replaced, the attack proceeds to its wound die (S3 vs T3,
# 4+).  The strict tape is consumed in request order: all hits of a side before
# its wounds.

# The Hero's first-round miss is replaced: the die 1 is recorded, the attack hits,
# the wound die follows and the single use is spent.
- audit_id: mechanic/defence.magic-acorn
  id: a-heros-first-round-miss-becomes-an-automatic-hit
  fighters:
    first:
      main_weapon_id: weapon.mace
      defence_ids: [defence.magic-acorn]
      trait_overrides: {fighter_kind: hero}
      characteristics: &ma-bearer {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: &ma-defender {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: &ma-charging-first {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: true, attacks.0.hit_roll: 1, attacks.0.damage: 1, state.second.wounds: 1, state.first.resources_spent: [magic-acorn]}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# "The Hero": a bearer who is not a Hero keeps the miss and spends nothing.
- audit_id: mechanic/defence.magic-acorn
  id: a-bearer-who-is-not-a-hero-is-refused
  # The Hero gate is a construction refusal, not a silent miss: the compiler
  # refuses the acorn on a non-Hero build.
  fighters:
    first:
      main_weapon_id: weapon.mace
      defence_ids: [defence.magic-acorn]
      characteristics: *ma-bearer
    second:
      main_weapon_id: weapon.mace
      characteristics: *ma-defender
  expect_error: "the Magic Acorn may only be carried by a Hero"

# "A single attack": with two first-round misses only the first is replaced; the
# second stays a miss and only the replaced attack asks a wound die.
- audit_id: mechanic/defence.magic-acorn
  id: only-one-first-round-miss-is-replaced
  fighters:
    first:
      main_weapon_id: weapon.mace
      defence_ids: [defence.magic-acorn]
      trait_overrides: {fighter_kind: hero}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 2}
    second:
      main_weapon_id: weapon.mace
      characteristics: *ma-defender
  duel_context: *ma-charging-first
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.first.attack.1.hit, value: 1}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: true, attacks.1.hit: false, state.second.wounds: 1, state.first.resources_spent: [magic-acorn]}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# "In the first round": the first-round attack hits on its own (no use is spent on
# a hit), and the second-round miss is not replaced.
- audit_id: mechanic/defence.magic-acorn
  id: a-later-round-miss-is-not-replaced
  fighters:
    first:
      main_weapon_id: weapon.mace
      defence_ids: [defence.magic-acorn]
      trait_overrides: {fighter_kind: hero}
      characteristics: *ma-bearer
    second:
      main_weapon_id: weapon.mace
      characteristics: *ma-defender
  duel_context: *ma-charging-first
  maximum_rounds: 2
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.1.first.attack.0.hit, value: 1}
    - {key: round.1.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: true, attacks.0.damage: 0, state.first.resources_spent: []}
    1: {attacks.0.hit: false, state.second.wounds: 2, state.first.resources_spent: []}
  expect_final: {rounds_executed: 2, termination_reason: horizon}
