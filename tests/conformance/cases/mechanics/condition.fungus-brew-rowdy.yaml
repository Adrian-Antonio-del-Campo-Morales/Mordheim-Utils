# --- Authored scenarios ---
# Fixtures: hand-built bearer (WS3 S3 T3 W2 I5 A1 Ld7, mace, goblin) charging a hand-built opponent (WS3
# S3 T3 W3 I2 A1 Ld7, mace).  The D6 is asked at the start of the bearer's own turn, before any attack;
# a failure leaves no attack die of the bearer's on the tape while the opponent's own natural 1 is still
# requested.  WS3 against WS3 hits on 4+, S3 against T3 wounds on 4+, no armour die exists.

# The widened band: a 2 at the start of the bearer's turn is a failure under the brew.
- audit_id: mechanic/condition.fungus-brew-rowdy
  id: a-two-at-the-start-of-the-bearers-turn-fails-under-the-brew
  fighters:
    first:
      main_weapon_id: weapon.mace
      condition_ids: [condition.fungus-brew-rowdy]
      trait_overrides: {species: goblin}
      characteristics: &fb-rowdy-bearer {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 7}
    second:
      main_weapon_id: weapon.mace
      characteristics: &fb-rowdy-opponent {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.animosity, value: 2}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.animosity_failed: true, state.first.wounds: 2, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The boundary: the printed band is 1 or 2, so a 3 passes and the bearer's charge lands.
- audit_id: mechanic/condition.fungus-brew-rowdy
  id: a-three-is-the-boundary-and-the-bearer-fights-normally
  fighters:
    first:
      main_weapon_id: weapon.mace
      condition_ids: [condition.fungus-brew-rowdy]
      trait_overrides: {species: goblin}
      characteristics: *fb-rowdy-bearer
    second:
      main_weapon_id: weapon.mace
      characteristics: *fb-rowdy-opponent
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.animosity, value: 3}
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.animosity_failed: false, attacks.0.hit: true, attacks.0.damage: 1, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The contrast: the ordinary goblin Animosity (mechanic.goblin-squabble, injected) fails on a 1 only, so
# the same 2 passes without the brew and the bearer strikes.
- audit_id: mechanic/condition.fungus-brew-rowdy
  id: the-ordinary-animosity-alone-passes-the-same-two
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.goblin-squabble]
      trait_overrides: {species: goblin}
      characteristics: *fb-rowdy-bearer
    second:
      main_weapon_id: weapon.mace
      characteristics: *fb-rowdy-opponent
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.animosity, value: 2}
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.animosity_failed: false, attacks.0.damage: 1, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

