# Printed source (mordheimer.net, Hired Swords grade 2a / Dark Mage / Despise Despoilers, bound by
# hireling.hired-sword.dark-mage.rule.despise-despoilers): the Dark Mage hates those who despoil the
# dead - the printed hated identity is the Necromancer, which the recorded contract reads on the
# opponent's supplied identity fact (trait_overrides necromancer: true, the compiled identity.necromancer).
# Hatred model (the authored hireling file ...99bd3ea4081b is the template): a natural 2 misses WS3 against
# WS3; the Hatred re-roll of the first round is requested at round.0.<side>.attack.0.hit.reroll, a 4 hits
# and S3 wounds T3 on a 4; without the hated identity the strict tape holds no re-roll key.  The bearer is
# a hand-built fixture carrying the mechanic through skill_ids; the real Dark Mage is exercised by the
# hireling file ...971871d97880.  A spellcaster is not a Necromancer by itself (identity.spellcaster is a
# different supplied fact), which the third scenario shows.

# The first-round miss against a Necromancer is re-rolled, hits and wounds.
- audit_id: mechanic/mechanic.despise-despoilers
  id: a-first-round-miss-against-a-necromancer-is-rerolled
  fighters:
    first:
      &bearer
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.despise-despoilers]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      &necromancer
      main_weapon_id: weapon.mace
      trait_overrides: {necromancer: true}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.first.attack.0.hit.reroll, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: true, attacks.0.damage: 1, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

