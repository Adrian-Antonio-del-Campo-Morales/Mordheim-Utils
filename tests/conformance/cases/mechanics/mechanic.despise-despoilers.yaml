# Hatred is a first-round effect: the round-0 miss is re-rolled (and misses again), the round-1 miss
# against the same Necromancer stands with no re-roll key.
- audit_id: mechanic/mechanic.despise-despoilers
  id: the-reroll-is-not-offered-in-a-later-round
  fighters:
    first:
      <<: *bearer
    second:
      <<: *necromancer
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 2
  rolls:
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.first.attack.0.hit.reroll, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.1.first.attack.0.hit, value: 2}
    - {key: round.1.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: false, state.second.wounds: 3}
    1: {attacks.0.hit: false, state.second.wounds: 3}
  expect_final: {rounds_executed: 2, termination_reason: horizon}

