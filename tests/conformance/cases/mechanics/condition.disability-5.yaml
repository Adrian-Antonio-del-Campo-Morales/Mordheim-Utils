# Preserve audit_id when filling this file.
# Governing rulings: docs/decisions/design-rulings.md
# Record: sources/knowledge/catalog/mechanics/close-combat.yaml
# Condition row: sources/knowledge/catalog/rules/conditions.yaml (condition.disability-5): "Weakness:
#   minus one Strength.  Permanent supplied result; no group creation or reroll."  Source: Chaos in
#   the Streets p149, result 5.
# AUTHORED: the row's content travels in its sibling effect condition.disability-5.characteristics
#   (profile.characteristics, strength -1) - the first triage batch's "Disability 2 and 5 were a false
#   triage flag (their content sits in sibling effects)" - applied to the compiled statline by
#   compiler.py's supplied_stat_bonuses and asserted by pair through expect_fighters; the mechanic
#   tag only marks the result (modular/state.py, the `disability.5` resource).  Wound arithmetic:
