# --- Authored scenarios ---
# Printed text (dramatis-personae grade-2a.yaml, The Foole / Poison Ring, the KB's one binder): "Once
# per battle may replace one normal close-combat attack with an automatic Strength 2 Giggle Juice hit
# that adds +1 Injury."  Consumer: modular/pools.py ~435-443 (each allocated attack is offered through
# the decision `<pool>.giggle-juice-attack.<index>` while the "giggle-juice" resource is unspent; the
# accepted one becomes an automatic hit with fixed Strength 2 and injury_modifier 1, resolved under the
# attack's ordinary key with no hit die) and modular/attacks.py ~202-204 (a poison-immune target is
# hit but the hit ends there).  Fixture: hand-built bearer (WS3 S3 T3 W2 I5 A1, mace, skill_ids
# [mechanic.giggle-juice-spray]) charging a hand-built opponent (WS3 S3 T3 I2 A1 Ld7, mace, no
# armour; W3 keeps a wound short of the injury roll, W1 reaches it).  Strength 2 wounds T3 on 5+ (the
# bearer's own S3 would wound on 4+, so the 4 is the Strength boundary); the chart's 2 (Knocked Down)
# becomes 3 (Stunned) with the +1.

# The spray: no hit die, Strength 2 wounds on the 5.
- audit_id: mechanic/mechanic.giggle-juice-spray
  id: the-spray-replaces-the-attack-with-an-automatic-strength-2-hit
  fighters:
    first: &gj-bearer
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.giggle-juice-spray]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second: &gj-opponent
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.giggle-juice-attack.0, value: true}
  rolls:
    - {key: round.0.first.attack.0.wound, value: 5}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: true, attacks.0.damage: 1, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
  expect_events:
    - {kind: decision, key: round.0.first.giggle-juice-attack.0, value: true}
    - {kind: roll, key: round.0.first.attack.0.wound, sides: 6, value: 5}
    - {kind: roll, key: round.0.second.attack.0.hit, sides: 6, value: 1}

# The Strength boundary: a 4 wounds with the bearer's own Strength 3 but not with the spray's 2.
- audit_id: mechanic/mechanic.giggle-juice-spray
  id: the-sprays-strength-2-does-not-wound-on-a-four
  fighters:
    first: *gj-bearer
    second: *gj-opponent
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.giggle-juice-attack.0, value: true}
  rolls:
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: true, attacks.0.wounded: false, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The +1 Injury: a declared 2 (Knocked Down on the ordinary chart) becomes 3, Stunned.
- audit_id: mechanic/mechanic.giggle-juice-spray
  id: the-sprays-injury-roll-is-at-plus-one
  fighters:
    first: *gj-bearer
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.giggle-juice-attack.0, value: true}
  rolls:
    - {key: round.0.first.attack.0.wound, value: 5}
    - {key: round.0.first.attack.0.injury.0, value: 2}
  expect_rounds:
    0: {attacks.0.damage: 1, state.second.condition: STUNNED}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# "Once per battle": the spray is spent in round 0 (its wound die is a natural 1), so in round 1 the
# bearer is offered no spray and his ordinary mace attack rolls its hit die.
- audit_id: mechanic/mechanic.giggle-juice-spray
  id: the-spray-is-spent-once-per-battle
  fighters:
    first: *gj-bearer
    second: *gj-opponent
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 2
  decisions:
    - {key: round.0.first.giggle-juice-attack.0, value: true}
  rolls:
    - {key: round.0.first.attack.0.wound, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.1.first.attack.0.hit, value: 1}
    - {key: round.1.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: true, attacks.0.wounded: false}
    1: {attacks.0.hit: false, state.second.wounds: 3}
  expect_final: {rounds_executed: 2, termination_reason: horizon}

# "may replace": declining the offer keeps the ordinary mace attack and its hit die.
- audit_id: mechanic/mechanic.giggle-juice-spray
