# --- Authored scenarios ---
# The printed "Animals" is the attacker's own kind: the supplied normal-animal trait is the
# fact the protection reads, and the same declaration is held constant in both scenarios so
# the bearer's trait is the only difference.  The bearer is given no attack of its own, so the
# whole tape is the animal's pool and its removal is the observation.
- audit_id: mechanic/mechanic.animal-friendship
  id: the-animals-whole-pool-never-attacks-the-bearer
  covers: [whole--scope--animal-attack-protection]
  fighters:
    first:
      main_weapon_id: weapon.mace
      trait_overrides: {normal_animal: true}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.animal-friendship]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1}
  initial_state:
    second: {wounds: 3, attacks: 0}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  expect_rounds:
    0: {attacks: [], state.second.wounds: 3, state.engaged: true}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# The control for the clause: the identical animal attacks a warrior without the lasting
# condition, and the same declared sixes wound him, so the empty pool above is the trait's
# effect and not a tape artefact.
- audit_id: mechanic/mechanic.animal-friendship
  id: the-same-animal-attacks-a-warrior-without-the-trait
  covers: [whole--scope--animal-attack-protection]
  fighters:
    first:
      main_weapon_id: weapon.mace
      trait_overrides: {normal_animal: true}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1}
  initial_state:
    second: {wounds: 3, attacks: 0}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 6}
    - {key: round.0.first.attack.0.wound, value: 5}
  expect_rounds:
    0: {attacks.0.hit: true, attacks.0.damage: 1, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
