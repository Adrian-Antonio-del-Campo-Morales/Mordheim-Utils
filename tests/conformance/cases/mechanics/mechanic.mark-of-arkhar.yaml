# Clause: whole--scope--bloodfather-role (scope: NO)
# Outside the admitted clause scope since 2026-11-16 (KB set it to NO: every Bloodfather consequence is its own effect of marauders-of-chaos band--mark-of-arkhar).
#   Earlier note: KB-FIX - the clause should not be an admitted obligation of this
#   shared mechanic.  Printed: "A Seer with this mark becomes a Bloodfather: he cannot cast spells; whenever
#   he takes an enemy Out of Action in hand-to-hand combat, he may pass a Leadership test to gain +1 WS, S, T
#   or I until the end of the battle, with each characteristic increased at most once. A Bloodfather may
#   also take Strength skills."  Becoming a Bloodfather has no effect of its own beyond these consequences,
#   and the band record that grants this mark (bands/mordheim/marauders-of-chaos/special-rules.yaml,
#   band--mark-of-arkhar) already classifies each of them as a separate effect: bloodfather--strength-access
#   (scope YES, profile.skill-access category strength for the seer; evidenced in its own corpus file
#   grants/mordheim--marauders-of-chaos--band--mark-of-arkhar--bloodfather--strengt--c121e29543a4.yaml),
#   bloodfather--cannot-cast and bloodfather--spell-targeting (scope NO, out-of-scope.magic) and
#   bloodfather--post-combat-gain (scope NO, out-of-scope.non-duel: the trigger is taking the duel opponent
#   Out of Action, which ends the duel).  So the role has no duel observable left on this identity, and its
#   only in-scope part already has its own identity.  Recommended KB change: in
#   sources/knowledge/catalog/mechanics/close-combat.yaml, record mechanic.mark-of-arkhar, set clause
#   whole--scope--bloodfather-role to scope NO (or retire it) with the reason that the role's consequences
#   are owned by the band--mark-of-arkhar bloodfather--* effects.
#   Correction: an earlier note cited "DECISION (D15-A, 2026-10-14)" for treating the role as campaign
#   progression; no such decision exists in docs/decisions/design-rulings.md (nor anywhere else in docs/),
#   so it is not relied on here.  A search of packages/python for "bloodfather" still finds no consumer;
#   the Seer's Strength access is a construction grant read through profile.skill-access.
#
# Clause: whole--scope--frenzy (scope: YES)
# AUTHORED[whole--scope--frenzy]: 2 scenarios cover the marked leader being Frenzied with his printed A1 doubled into two blows, observed through the attack indices the engine then requests, and the same warrior without the mark keeping one attack. Documented key: the mark supplies no dice of its own and grants the frenzy flag from the executor's own effect set (execution.yaml mechanic.mark-of-arkhar, frenzy: true), which state.<side>.frenzy exposes in the round snapshot.
#
# Clause: whole--scope--spell-targeting (scope: NO)
# Outside the admitted clause scope; retained for context, not a test TODO.

# --- Authored scenarios ---
# The marked leader is subject to Frenzy: the round snapshot records it and the
# printed A1 becomes two blows, so the declared tape names both of his attacks and
# the enemy's blow is only the third outcome.
- audit_id: mechanic/mechanic.mark-of-arkhar
  id: the-marked-leader-is-frenzied-and-doubles-his-attacks
  covers: [whole--scope--frenzy]
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.mark-of-arkhar]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.1.hit, value: 1}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.frenzy: True, attacks.0.damage: 1, attacks.1.hit: False,
        attacks.2.hit: False, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# The control: the same warrior and the same round without the mark, so he is not
# Frenzied and makes his single printed attack.
- audit_id: mechanic/mechanic.mark-of-arkhar
  id: without-the-mark-the-same-warrior-is-not-frenzied
  covers: [whole--scope--frenzy]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.frenzy: False, attacks.0.damage: 1, attacks.1.hit: False,
        state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
