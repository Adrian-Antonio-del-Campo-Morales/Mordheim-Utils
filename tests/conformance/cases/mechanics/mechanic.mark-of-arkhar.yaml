# authoring_progress: the frenzy clause carries authored scenarios derived from the printed rule and the recorded contract; the Bloodfather-role clause is PARTIAL because no duel observable exists for it. REVIEWED still requires manual semantic review and execution_status stays UNEXECUTED.
# execution_status: UNEXECUTED (this scaffold has no behavioral result)
#
# Derive inputs and expectations from rule text and accepted rulings.
# Do not derive them from the engine or execute combat during authoring.
# REVIEWED requires semantic review; covers labels alone are insufficient.
# Preserve audit_id when filling this file.
# Governing rulings: docs/decisions/design-rulings.md
#
# Clause: whole--scope--bloodfather-role (scope: YES)
# PARTIAL[whole--scope--bloodfather-role]: resolved by coordinator decision, closing
#   the structured dependency. The clause is delivered as a scope/ownership transfer with
#   its concrete datum, no reading pre-empted by an assertion.
#   Normative text: the printed sentence of the frozen clause ("A Seer with this mark
#   becomes a Bloodfather") together with the role's own printed consequences that
#   continue in the same source (no casting, and the after-combat Leadership test
#   granting +1 to Weapon Skill, Strength, Toughness or Initiative until the end of
#   the battle, each characteristic once, plus Strength skill access).
#   Input: a Seer declared with the_mark (the mark id this file's own record carries)
#   meeting an ordinary opponent, since every printed consequence of the role lives
#   outside the duel or before/after it.
#   Assertion that is blocked: the role's effects are not round observations at all -
#   the casting prohibition belongs to the excluded magic subsystem, the skill access
#   is construction rather than duel state, and the after-combat test happens when no
#   round resolves. The concrete missing branches:
#   (a) the inheritance question the register already records - the inherited mapping
#   reads the shared mechanic as "Frenzy and a 4+ spell save, with the Bloodfather
#   progression left to the campaign", while the printed effect in the same source
#   states the role and its own combat effects; the two branches are kept and the
#   4+ spell save is a scope-NO clause of this file, so neither is asserted;
#   (b) a consumer for the role at all: a case-insensitive search of packages/python
#   for bloodfather returns nothing, so neither branch has an executor to observe.
#   DECISION (D15-A, 2026-10-14): the role is campaign progression per the inherited
#   mapping - not a duel effect and no duel consumer is owed. The role's printed
#   after-combat consequences transfer to the campaign continuity record; no
#   additional-scenario gap remains in this file and the frenzy clause's two authored
#   scenarios (below) carry the file's executable side.
#
# Clause: whole--scope--frenzy (scope: YES)
# AUTHORED[whole--scope--frenzy]: 2 scenarios cover the marked leader being Frenzied with his printed A1 doubled into two blows, observed through the attack indices the engine then requests, and the same warrior without the mark keeping one attack. Documented key: the mark supplies no dice of its own and grants the frenzy flag from the executor's own effect set (execution.yaml mechanic.mark-of-arkhar, frenzy: true), which state.<side>.frenzy exposes in the round snapshot.
#
# Clause: whole--scope--spell-targeting (scope: NO)
# Outside the admitted clause scope; retained for context, not a test TODO.

# --- Authored scenarios ---
# The marked leader is subject to Frenzy: the round snapshot records it and the
# printed A1 becomes two blows, so the declared tape names both of his attacks and
# the enemy's blow is only the third outcome.
- audit_id: mechanic/mechanic.mark-of-arkhar
  id: the-marked-leader-is-frenzied-and-doubles-his-attacks
  covers: [whole--scope--frenzy]
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.mark-of-arkhar]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.1.hit, value: 1}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.frenzy: True, attacks.0.damage: 1, attacks.1.hit: False,
        attacks.2.hit: False, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# The control: the same warrior and the same round without the mark, so he is not
# Frenzied and makes his single printed attack.
- audit_id: mechanic/mechanic.mark-of-arkhar
  id: without-the-mark-the-same-warrior-is-not-frenzied
  covers: [whole--scope--frenzy]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.frenzy: False, attacks.0.damage: 1, attacks.1.hit: False,
        state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
