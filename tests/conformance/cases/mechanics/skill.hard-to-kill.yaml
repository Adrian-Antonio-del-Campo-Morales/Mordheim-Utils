# --- Authored scenarios ---
# # The printed Dwarf chart is 1-2 Knocked Down, 3-5 Stunned and 6 Out of Action: the five
# # that the ordinary chart prints as Out of Action only Stuns this fighter.
- audit_id: mechanic/skill.hard-to-kill
  id: a-five-stuns-instead-of-taking-him-out
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      skill_ids: [skill.hard-to-kill]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.injury.0, value: 5}
  expect_rounds:
    0: {attacks.0.damage: 1, state.second.condition: STUNNED}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# # The six is the one face of the printed chart that still takes the Dwarf out.
- audit_id: mechanic/skill.hard-to-kill
  id: only-the-six-takes-him-out
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      skill_ids: [skill.hard-to-kill]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.injury.0, value: 6}
  expect_rounds:
    0: {state.second.condition: OUT}
  expect_final: {rounds_executed: 1, termination_reason: second_out}

