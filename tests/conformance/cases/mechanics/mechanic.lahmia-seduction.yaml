# --- Authored scenarios ---
# Printed source (Chaos in the Streets p.183, Lahmia Special Skills / Seduction, bound by
# band--lahmia-power-seduction): "During each Vampire turn, one male enemy in base contact must test
# against its own Leadership.  If it fails, the Lahmia player immediately controls that warrior.  Any
# attack by the Lahmia warband that hits the controlled warrior breaks the control.  Test in each
# Recovery phase to see whether the warrior regains control.  Only one warrior may be controlled at a
# time.  Models immune to Psychology, Undead, Daemons and models subject to Stupidity are unaffected."
# Operator model (the authored band file ...d37cb13b5269 is the template): on the Vampire's own turn the
# use is a decision at round.<r>.<target>.lahmia-seduction, the male target's own dice are .0/.1, a
# failure sets state.<target>.charm_attack_blocked and a lasting control; on the victim's own turn the
# regain test is a decision at round.<r>.<target>.lahmia-seduction.regain-control with dice .0/.1.  The
# male/female fact is a supplied build fact.  In the two-round scenarios the Vampire is silenced with
# initial_state attacks 0 so that no hit of hers can break the control before the regain test.

# The male recipient fails its own test (6+6 against Ld7) on the Vampire's turn and is barred.
- audit_id: mechanic/mechanic.lahmia-seduction
  id: a-male-target-that-fails-its-own-test-is-controlled
  fighters:
    first:
      &seducer
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.lahmia-seduction]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      &male
      main_weapon_id: weapon.mace
      trait_overrides: {sex: male}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.second.lahmia-seduction, value: true}
  rolls:
    - {key: round.0.second.lahmia-seduction.0, value: 6}
    - {key: round.0.second.lahmia-seduction.1, value: 6}
    - {key: round.0.first.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: false, state.second.charm_attack_blocked: true, state.second.condition: STANDING}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The passed test (1+1): the male recipient is not controlled and both pools ask for their To Hit die.
- audit_id: mechanic/mechanic.lahmia-seduction
  id: a-male-target-that-passes-its-own-test-is-unbarred
  fighters:
    first:
      <<: *seducer
    second:
      <<: *male
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.second.lahmia-seduction, value: true}
  rolls:
    - {key: round.0.second.lahmia-seduction.0, value: 1}
    - {key: round.0.second.lahmia-seduction.1, value: 1}
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: false, attacks.1.hit: false, state.second.charm_attack_blocked: false}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

