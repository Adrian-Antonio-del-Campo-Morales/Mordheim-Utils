#
# AUTHORED: 3 scenarios cover the first-round pistol reroll, the same
#   reroll with a duelling pistol and the refusal with any other weapon.

# --- Authored scenarios ---
# Close-combat pistol attack in the first round of combat: the roll of two fails and
# the reroll turns it into a hit that wounds.
- audit_id: mechanic/skill.crack-shot
  id: a-first-round-pistol-rerolls-its-failed-shot
  fighters:
    first:
      main_weapon_id: weapon.pistol
      skill_ids: [skill.crack-shot]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.first.attack.0.hit.reroll, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: True, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# The duelling pistol is the second pistol in the accepted weapon scope and carries
# its own +1 To Hit, so its failure is a roll of two against a target of three.
- audit_id: mechanic/skill.crack-shot
  id: a-duelling-pistol-also-rerolls-its-failed-shot
  fighters:
    first:
      main_weapon_id: weapon.duelling-pistol
      skill_ids: [skill.crack-shot]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.first.attack.0.hit.reroll, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: True, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# The reroll is granted with pistols, so the same first-round close-combat miss with
# another weapon stands.
- audit_id: mechanic/skill.crack-shot
  id: a-first-round-mace-miss-is-not-rerolled
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [skill.crack-shot]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: False, attacks.0.damage: 0, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

