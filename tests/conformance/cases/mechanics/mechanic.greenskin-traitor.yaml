# Hatred re-rolls only in the first round: the Orc's round-0 miss is re-rolled (and misses again on a
# 1); its round-1 miss on the same face is not offered a re-roll.
- audit_id: mechanic/mechanic.greenskin-traitor
  id: the-orcs-reroll-belongs-to-the-first-round-only
  fighters:
    first:
      <<: *orc
    second:
      <<: *bearer
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 2
  rolls:
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.first.attack.0.hit.reroll, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.1.second.attack.0.hit, value: 1}
    - {key: round.1.first.attack.0.hit, value: 2}
  expect_rounds:
    0: {attacks.0.hit: false, state.second.wounds: 2}
    1: {state.second.wounds: 2, state.first.wounds: 3}
  expect_final: {rounds_executed: 2, termination_reason: horizon}
