# --- Authored scenarios ---
# Operator model: the mechanic is carried by the DEFENDER (the hated traitor) and read on the
# attacker's side of the hit roll (modular/contexts.py `_hit_reroll`: "has_tag(defender.global_effects,
# 'mechanic.greenskin-traitor') and {species.orc, species.goblin, species.black-orc} intersects the
# attacker's tags", under the ordinary first-round Hatred gate).  So the evidence is the opposing
# greenskin's `round.0.<side>.attack.0.hit.reroll`, requested only in the first round and only when the
# attacker declares a greenskin species.  The bearer is a hand-built fixture (WS3 S3 T3 W2 I5 A1 Ld7,
# mace) carrying the mechanic through skill_ids; the attacker is the hand-built opponent fixture (WS3
# S3 T3 W3 I2 A1 Ld7, mace) declaring the one fact the clause reads (trait_overrides species).  Dice: a
# natural 2 misses WS3-vs-WS3 (4+), the re-roll of 4 hits, S3 wounds T3 on a 4; the bearer's own swing
# is a declared natural 1; no armour is worn, so no save die joins the tape.

# An Orc charging the traitor misses on a 2, is offered the Hatred re-roll, hits on the 4 and wounds.
- audit_id: mechanic/mechanic.greenskin-traitor
  id: an-orc-attackers-first-round-miss-against-the-bearer-is-rerolled
  fighters:
    first:
      &orc
      main_weapon_id: weapon.mace
      trait_overrides: {species: orc}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
    second:
      &bearer
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.greenskin-traitor]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.first.attack.0.hit.reroll, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: true, attacks.0.damage: 1, state.second.wounds: 1, state.first.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

