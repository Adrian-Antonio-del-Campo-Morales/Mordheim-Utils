# --- Authored scenarios ---
# mechanic/defence.cooking-pot-helmet — the 5+ stun reaction.
#
# Expectations come from the printed rule and the accepted clause
# `five-plus-against-stun` of
# the knowledge-base clause contracts (sources/knowledge), never from engine output:
# a Stunned injury result becomes Knocked Down on an unmodified 5+.  The pot
# supplies a helmet stun save of 5, one point worse than the ordinary helmet,
# so the boundary is exactly 5.  The attacker wields a sword (no Concussion)
# so the injury total is the only variable.
#
# The first scenario declares the shared profiles as YAML anchors; the sibling
# aliases them and keeps its own reaction face.

- audit_id: mechanic/defence.cooking-pot-helmet
  id: cooking-pot-converts-stun-on-five
  fighters:
    first:
      main_weapon_id: weapon.sword
      characteristics: &attacker-ws3-s3-t3-w2-i5 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      defence_ids: [defence.cooking-pot-helmet]
      characteristics: &defender-ws3-s3-t3-w1-i2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 2, attacks: 1}
  duel_context: &charging-first {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.injury.0, value: 3}
    - {key: round.0.first.attack.0.helmet, value: 5}
  expect_rounds:
    0: {state.second.condition: KNOCKED_DOWN, state.second.wounds: 0}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# One face below the printed target: a 4 leaves the Stunned result in place.

- audit_id: mechanic/defence.cooking-pot-helmet
  id: cooking-pot-does-not-convert-on-four
  fighters:
    first:
      main_weapon_id: weapon.sword
      characteristics: *attacker-ws3-s3-t3-w2-i5
    second:
      main_weapon_id: weapon.mace
      defence_ids: [defence.cooking-pot-helmet]
      characteristics: *defender-ws3-s3-t3-w1-i2
  duel_context: *charging-first
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.injury.0, value: 3}
    - {key: round.0.first.attack.0.helmet, value: 4}
  expect_rounds:
    0: {state.second.condition: STUNNED, state.second.wounds: 0}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
