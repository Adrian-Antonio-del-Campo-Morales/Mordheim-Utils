# --- Authored scenarios ---
# mechanic/mechanic.main-gauche-modes - Estalian Diestro (hired-swords/grade-2a.yaml, rule
# main-gauche): "Each turn the Main Gauche either grants an additional dagger attack or parries as
# a sword, forfeiting its additional attack."  The record is kind profile, so a hand-built fighter
# injects it through skill_ids (the mechanic.estalian-technique precedent) with a mace in the main
# hand and the main gauche (weapon.main-gauche) in the off hand.  Consumer:
# packages/python/combat-engine/mordheim_combat/modular/rounds.py (each engaged round the bearer
# holding a main gauche in the off hand is asked `round.<i>.<side>.main-gauche-parry`; true keeps
# the gauche's parry and removes the off-hand attack; false drops the parry, counts the gauche as
# a dagger with +1 enemy armour save and keeps the second swing).
#
# Expectations come from the printed sentence, never from engine output.  WS3 against WS3 hits on
# 4+; S3 wounds T3 on 4+; the unarmoured opponent has no save except the 6+ a dagger-mode gauche
# grants (the mace grants none and parries nothing).  The bearer strikes first (Initiative 5 against
# 2); his second swing, when he has one, is the gauche and resolves last.

# Parry mode: the bearer makes one swing only (the strict tape declares no second hit die) and the
# opponent's hit of 4 is beaten by the parry die 5.
- audit_id: mechanic/mechanic.main-gauche-modes
  id: parry-mode-forfeits-the-second-swing-and-parries
  fighters:
    first:
      main_weapon_id: weapon.mace
      off_hand_id: weapon.main-gauche
      skill_ids: [mechanic.main-gauche-modes]
      characteristics: &mgm-bearer {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: &mgm-opponent {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: &mgm-uncharged {charging: [], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.main-gauche-parry, value: true}
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 4}
    - {key: round.0.second.attack.0.parry, value: 5}
  expect_rounds:
    0: {attacks.0.hit: false, attacks.1.parried: true, attacks.1.wounded: false, state.first.wounds: 2, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# Attack mode: the bearer swings twice, the dagger-mode gauche hits and its wound is saved on the
# granted 6+, and the opponent's hit of 4 is offered no parry die and wounds the bearer.
- audit_id: mechanic/mechanic.main-gauche-modes
  id: attack-mode-adds-the-dagger-swing-and-gives-up-the-parry
  fighters:
    first:
      main_weapon_id: weapon.mace
      off_hand_id: weapon.main-gauche
      skill_ids: [mechanic.main-gauche-modes]
      characteristics: *mgm-bearer
    second:
      main_weapon_id: weapon.mace
      characteristics: *mgm-opponent
  duel_context: *mgm-uncharged
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.main-gauche-parry, value: false}
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.first.attack.1.hit, value: 4}
    - {key: round.0.first.attack.1.wound, value: 4}
    - {key: round.0.first.attack.1.armour, value: 6}
    - {key: round.0.second.attack.0.hit, value: 4}
    - {key: round.0.second.attack.0.wound, value: 4}
  expect_rounds:
    0: {attacks.1.hit: true, attacks.1.saved: true, attacks.1.damage: 0, attacks.2.parried: false,
        attacks.2.damage: 1, state.first.wounds: 1, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The control: without the mechanic no mode is asked (the strict tape declares no decision); the
# gauche both swings and parries in the same round.
- audit_id: mechanic/mechanic.main-gauche-modes
  id: without-the-mechanic-the-gauche-both-swings-and-parries
  fighters:
    first:
      main_weapon_id: weapon.mace
      off_hand_id: weapon.main-gauche
      characteristics: *mgm-bearer
    second:
      main_weapon_id: weapon.mace
      characteristics: *mgm-opponent
  duel_context: *mgm-uncharged
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.first.attack.1.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 4}
    - {key: round.0.second.attack.0.parry, value: 5}
  expect_rounds:
    0: {attacks.2.parried: true, state.first.wounds: 2, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# "Each turn": parry mode in the first round (one swing), attack mode in the second (two swings);
# every die is a declared miss so the tape length is the evidence.
- audit_id: mechanic/mechanic.main-gauche-modes
  id: the-mode-is-chosen-anew-each-round
  fighters:
    first:
      main_weapon_id: weapon.mace
      off_hand_id: weapon.main-gauche
      skill_ids: [mechanic.main-gauche-modes]
      characteristics: *mgm-bearer
    second:
      main_weapon_id: weapon.mace
      characteristics: *mgm-opponent
  duel_context: *mgm-uncharged
  maximum_rounds: 2
  decisions:
    - {key: round.0.first.main-gauche-parry, value: true}
    - {key: round.1.first.main-gauche-parry, value: false}
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.1.first.attack.0.hit, value: 1}
    - {key: round.1.first.attack.1.hit, value: 1}
    - {key: round.1.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.wounds: 2, state.second.wounds: 2}
    1: {state.first.wounds: 2, state.second.wounds: 2}
  expect_final: {rounds_executed: 2, termination_reason: horizon}

# The choice belongs to a held main gauche: with a dagger in the off hand the same bearer is asked
# nothing and simply swings twice.
- audit_id: mechanic/mechanic.main-gauche-modes
  id: the-choice-is-only-offered-while-the-gauche-is-held
  fighters:
    first:
      main_weapon_id: weapon.mace
      off_hand_id: weapon.dagger
      skill_ids: [mechanic.main-gauche-modes]
      characteristics: *mgm-bearer
    second:
      main_weapon_id: weapon.mace
      characteristics: *mgm-opponent
  duel_context: *mgm-uncharged
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.first.attack.1.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.wounds: 2, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
