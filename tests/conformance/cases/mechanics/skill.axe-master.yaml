#
# AUTHORED: 2 scenarios cover the parry attempt a
#   normal axe produces under the skill and its absence without it.

# --- Authored scenarios ---
# A normal axe carries no Parry rule, so the declared parry die exists only because
# the skill grants one; the roll of five beats the hit roll of four and the wound
# roll is never reached.
- audit_id: mechanic/skill.axe-master
  id: an-axe-parries-under-the-skill
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.axe
      skill_ids: [skill.axe-master]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.parry, value: 5}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.parried: True, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# Without the skill no parry attempt is available and the hit proceeds to its wound
# roll, which isolates the granted capacity to the skill.
- audit_id: mechanic/skill.axe-master
  id: the-same-axe-parries-nothing-without-the-skill
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.axe
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.parried: False, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

