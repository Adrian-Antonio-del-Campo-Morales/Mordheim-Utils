# The potion: Toughness 4 at initialization, so the opponent's declared four fails to wound.
- audit_id: mechanic/condition.alchemist-resilience
  id: the-supplied-potion-raises-toughness-by-one-so-a-four-fails-to-wound
  fighters:
    first:
      collection: mordheim
      band_id: masters-of-horror-sylv
      profile_id: mad-scientist
      main_weapon_id: weapon.mace
      condition_ids: [condition.alchemist-resilience]
      characteristics: &ar-scientist {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: &ar-opponent {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 4}
    - {key: round.0.second.attack.0.wound, value: 4}
  expect_initial: {first.toughness: 4}
  expect_rounds:
    0: {attacks.1.hit: true, attacks.1.wounded: false, state.first.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The control: without the potion the identical four wounds Toughness 3.
