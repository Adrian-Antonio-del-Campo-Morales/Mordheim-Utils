      characteristics: *ar-scientist
    second:
      main_weapon_id: weapon.mace
      characteristics: *ar-opponent
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 4}
    - {key: round.0.second.attack.0.wound, value: 4}
  expect_initial: {first.toughness: 3}
  expect_rounds:
    0: {attacks.1.wounded: true, attacks.1.damage: 1, state.first.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The gate: a hand-built recipient of the supplied potion is refused with the compiler's own sentence.
- audit_id: mechanic/condition.alchemist-resilience
  id: the-supplied-potion-is-refused-outside-the-mad-scientist
  fighters:
    first:
      main_weapon_id: weapon.mace
      condition_ids: [condition.alchemist-resilience]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 7}
