# mechanic/poison.garlic-black-lotus - Countess Marianna Chevaux's Garlic-Coated
# Weapons (Town Cryer 22): "Against Vampires only, the coating acts as Black Lotus:
# a natural 6 to hit guarantees the wound, keeping the ordinary critical attempt
# and saves."  The execution entry carries the tags poison.black-lotus and
# poison.vampires-only; the consumer (mordheim_combat/phases.py,
# black_lotus_wounds) applies the Lotus operator only when the defender carries
# species.vampire, which the hand-built opponent declares through
# trait_overrides: {vampire: true}.  The coating is supplied on main_poison_id.
#
# Expectations come from the printed text and the Black Lotus model, never from
# engine output.  A natural 6 to hit against a Vampire already wounds; the
# declaration `round.0.first.attack.0.lotus-critical` decides whether the optional
# wound die is taken.  Declining it leaves the automatic wound with no die at all;
# taking it on a 5 leaves a normal wound and only a 6 sets the critical, which
# then rolls the ordinary critical and injury dice.  Against a non-Vampire no
# declaration is asked and the ordinary wound die (S3 vs T3, 4+) decides.

# Against a Vampire the natural six wounds automatically when the optional die is
# declined: no wound die is requested.
- audit_id: mechanic/poison.garlic-black-lotus
  id: against-a-vampire-the-natural-six-wounds-automatically
  fighters:
    first:
      main_weapon_id: weapon.mace
      main_poison_id: poison.garlic-black-lotus
      characteristics: &gl-attacker {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      trait_overrides: {vampire: true}
      characteristics: &gl-defender {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: &gl-context {charging: [], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.attack.0.lotus-critical, value: false}
  rolls:
    - {key: round.0.first.attack.0.hit, value: 6}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.critical: false, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

