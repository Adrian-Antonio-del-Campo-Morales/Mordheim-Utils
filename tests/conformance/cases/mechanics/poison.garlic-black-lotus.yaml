    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.critical: false, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The optional die shows a 6: the ordinary critical attempt is kept and scores,
# rolling the critical die and two injury dice against the one-Wound Vampire.
