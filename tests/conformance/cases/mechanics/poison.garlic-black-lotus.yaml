      characteristics: *gl-defender
  duel_context: *gl-context
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.attack.0.lotus-critical, value: true}
  rolls:
    - {key: round.0.first.attack.0.hit, value: 6}
