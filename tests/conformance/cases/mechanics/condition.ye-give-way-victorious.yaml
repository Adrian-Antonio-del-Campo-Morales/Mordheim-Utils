# The printed recipient is the Fallen Noble who won his challenge: a Hero outside that profile is
# refused the supplied victory by the compiler's own supplied-condition gate.
- audit_id: mechanic/condition.ye-give-way-victorious
  id: a-recipient-outside-the-fallen-noble-profile-is-refused
  fighters:
    first:
      main_weapon_id: weapon.mace
      condition_ids: [condition.ye-give-way-victorious]
      trait_overrides: {fighter_kind: hero}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
  expect_error: "Ye Give Way victory requires a Fallen Noble recipient"
