# "At the start of his Close Combat phase": the song is offered in round 0 (the singer's own
# player turn) and not in round 1 (the enemy's turn, where the strict tape declares no decision),
# and the round-0 loss of "1 Attack that turn" has expired, so the enemy resolves both attacks
# in round 1.
- audit_id: mechanic/mechanic.sea-shanty
  id: the-song-is-sung-only-in-the-singers-own-turn-and-the-loss-expires
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.sea-shanty]
      characteristics: *shanty-singer
    second:
      main_weapon_id: weapon.mace
      characteristics: *shanty-enemy
  duel_context: *shanty-context
  maximum_rounds: 2
  decisions:
    - {key: round.0.first.sea-shanty, value: true}
  rolls:
    - {key: round.0.first.sea-shanty.leadership.0, value: 5}
    - {key: round.0.first.sea-shanty.leadership.1, value: 5}
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.1.first.attack.0.hit, value: 1}
    - {key: round.1.second.attack.0.hit, value: 1}
    - {key: round.1.second.attack.1.hit, value: 1}
  expect_rounds:
    0: {attacks.1.hit: false}
    1: {attacks.2.hit: false}
  expect_final: {rounds_executed: 2, termination_reason: horizon}
