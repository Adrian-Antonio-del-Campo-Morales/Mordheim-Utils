# mechanic/weapon.weeping-blades - paired blades, a parry and the venom.
#
# Expectations come from the printed rule and the admitted clause, never from
# engine output.  The printed Venomous sentence is delivered by the Black Lotus
# operator the contract carries, whose natural-six trigger and optional critical
# are the printed consequence; the optional attempt is declared on the tape.
# The printed pair upgrades a single profile to two dice, so the ordered tape
# carries two attacks for the bearer rather than one.
- audit_id: mechanic/weapon.weeping-blades
  id: weeping-blades-grant-one-additional-attack
  fighters:
    first:
      main_weapon_id: weapon.weeping-blades
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
