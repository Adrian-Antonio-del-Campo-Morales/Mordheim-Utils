# --- Authored scenarios ---
# Printed text (call-of-the-night-haint-mim/special-rules.yaml, Mourngul / Haunter of the Dark):
# "The Mourngul's Ethereal save is increased to 3+".  The mechanic's execution entry carries
# ethereal_hit_save 3 (and its own tag); the only KB binding is the Mourngul's Haunter of the Dark
# profile grant (rule mourngul--haunter-of-the-dark), whose own identity is authored at
# ...310cbd159609.  The consumer is the shared Ethereal interception (modular/attacks.py ~343-348
# and pools.py ~177-183): after the To Hit roll a mundane attack asks the defender for the die
# round.<i>.<attacker>.attack.<n>.ethereal and discards the hit when it meets
# global_effects.ethereal_hit_save (4 by default, 3 here); an attack tagged attack.magical is never
# offered it.  The bearer is the band's Mourngul profile (both the band Ethereal rule and the
# improvement are profile grants, so nothing is selected) with hand-built fixture facts (WS3 S3 T3
# W2 I2 A1) and no swing of its own; the attacker is the hand-built fixture (mace, WS3 S3 T3 W2 I5
# A1 Ld7), which tests Fear when charging the Mourngul (1+1 passes Ld7).  The variant boundary is
# the band's Cairn Wraith, whose Ethereal save is the canonical 4+, so the same faces let the wound
# through there.  Wound dice are fours.

# The printed 3+ discards the hit on a declared three, so no wound die follows.
- audit_id: mechanic/mechanic.ethereal-hit-save-improved
  id: the-improved-ethereal-save-discards-a-hit-on-three
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 7}
    second:
      collection: mordheim
      band_id: call-of-the-night-haint-mim
      profile_id: mourngul
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  initial_state:
    second: {attacks: 0}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.fear.charge.0, value: 1}
    - {key: round.0.first.fear.charge.1, value: 1}
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.ethereal, value: 3}
  expect_rounds:
    0: {attacks.0.saved: true, attacks.0.damage: 0, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

