# Conformance authoring scaffold; generated comments, manually authored scenarios.
# audit_id: mechanic/mechanic.wheelo-skill-modifications
# authoring_status: AUTHORED
# authoring_progress: the weapons-training clause carries 2 authored scenarios (the
#   morning-star first impact at Strength 5 and the spear-fitted counter hit on a
#   charger) and the Mighty Blow clause carries 3 scenarios read from the printed
#   sentence "Mighty Blow: the crew gains +1 to wound in combat; has no effect on
#   Impact Hits" (see the clause note). REVIEWED still requires manual semantic
#   review and execution_status stays UNEXECUTED.
# execution_status: UNEXECUTED (this scaffold has no behavioral result)
#
# Derive inputs and expectations from rule text and accepted rulings.
# Do not derive them from the engine or execute combat during authoring.
# REVIEWED requires semantic review; covers labels alone are insufficient.
# Preserve audit_id when filling this file.
# Governing rulings: docs/decisions/design-rulings.md
#
# Clause: whole--scope--mighty-blow (scope: YES)
# AUTHORED[whole--scope--mighty-blow]: 3 scenarios read the printed sentence "Mighty Blow: the crew
#   gains +1 to wound in combat; has no effect on Impact Hits" on a real Wheelo (printed crew Strength 4,
#   dagger) against a Toughness 5 defender in light armour.  With the skill the crew keeps Strength 4 and
#   wounds on 4+ (5+ less the printed +1); the dagger's +1 and Strength 4's -1 leave the light-armour save
#   at 6+, so a save die is requested and a 6 saves.  An ordinary Mighty Blow (+1 Strength, Strength 5)
#   would reach the same 4+ but leave no save at all, so the requested armour die separates the printed
#   Wheelo reading from the ordinary skill; the control without the skill fails the same wound die of 4;
#   and the charging Wheelo's Strength 4 Impact Hit still needs its unmodified 5+, so a 4 fails.
#   The former note's dichotomy was false and is corrected here: the compiler mapping
#   (packages/python/roster-construction/mordheim_construction/compiler.py:1250-1254) subtracts one from
#   strength_bonus only to cancel the +1 Strength that skill.mighty-blow itself adds (catalog
#   execution.yaml skill.mighty-blow strength_bonus 1), so the crew stays at its printed Strength 4 with
#   +1 to wound - exactly the printed reading, not a Strength 3 crew.  The collision is built with an empty
#   global effect set (packages/python/combat-engine/mordheim_combat/modular/rounds.py:1179), so the
#   +1 to wound cannot reach the Impact Hits.  The cited "DECISION (D12-A, 2026-10-14)" and
#   "dec-d12-mighty-blow-prose-binding" do not appear in docs/decisions/design-rulings.md; the scenarios
#   rest on the printed sentence alone.
#
# Clause: whole--scope--weapons-training-impact-modifications (scope: YES)
# AUTHORED[whole--scope--weapons-training-impact-modifications]: 2 scenarios cover two of the printed fittings on a real Wheelo. The morning star scenario declares the fitting as the profile's supplied trait and reads the printed first-round Strength 5: the declared To Wound two wounds Toughness 3, which the unfitted Strength 4 cannot reach (its target is 3+). The spear scenario is the printed counter hit: with the Wheelo charged, the collision resolves one single hit even though the Wheelo did not charge, with no count die requested. The axe's -1 armour save, the club's Concussion and a second-round normal-Strength impact are not authored here (concussion needs the injury chart's 2-4 band and the axe/penetration facet is already a named gap in the weapon files); their keys are the same requested tape with the fitting tag changed.
#
# Clause: sprint-movement (scope: NO)
# Outside the admitted clause scope; retained for context, not a test TODO.

# --- Authored scenarios ---
# The morning star fitting declares the printed first-round improvement: the collision
# carries Strength 5, so the declared To Wound two reaches Toughness 3 on the 2+ that only
# the fitted impact has (the unfitted Strength 4 needs a 3).  The target has one Wound, so
# the injury die leaves it Knocked Down and the crew's two attacks then hit it
# automatically, taking only wound dice that both miss.
- audit_id: mechanic/mechanic.wheelo-skill-modifications
  id: the-morning-star-first-impact-resolves-at-strength-five
  covers: [whole--scope--weapons-training-impact-modifications]
  fighters:
    first:
      collection: mordheim
      band_id: snotlings-web
      profile_id: wheelo
      main_weapon_id: weapon.dagger
      trait_overrides: {wheelo_fitting: morning-star}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.impact-count, value: 1}
    - {key: round.0.first.impact.0.wound, value: 2}
    - {key: round.0.first.impact.0.injury.0, value: 2}
    - {key: round.0.first.attack.0.wound, value: 1}
    - {key: round.0.first.attack.1.wound, value: 1}
  expect_rounds:
    0: {attacks.0.hit: True, attacks.0.wounded: True, attacks.0.damage: 1,
        state.second.condition: KNOCKED_DOWN, state.first.resources_spent: ['wheelo.first-impact']}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# The spear fitting's printed exception: the Wheelo was charged, so it deals one single
# Impact Hit to the charger before attacks are made.  The printed single hit is why the
# round requests no count die at all, and the Strength 4 impact wounds Toughness 3 on the
# declared 3+ even though the Wheelo never charged.
- audit_id: mechanic/mechanic.wheelo-skill-modifications
  id: the-spear-fitted-wheelo-still-hits-a-charger-once
  covers: [whole--scope--weapons-training-impact-modifications]
  fighters:
    first:
      collection: mordheim
      band_id: snotlings-web
      profile_id: wheelo
      main_weapon_id: weapon.dagger
      trait_overrides: {wheelo_fitting: spear}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 2, attacks: 1}
  duel_context: {charging: [second], active_participant: second}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.impact.0.wound, value: 4}
    - {key: round.0.first.impact.0.injury.0, value: 2}
    - {key: round.0.first.attack.0.wound, value: 1}
    - {key: round.0.first.attack.1.wound, value: 1}
  expect_rounds:
    0: {attacks.0.hit: True, attacks.0.wounded: True, attacks.0.damage: 1,
        state.second.condition: KNOCKED_DOWN}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The printed Mighty Blow modification on the crew.  No charge, so no Impact Hit: the Wheelo (I5) strikes
# first with its two crew attacks; the second misses.  Strength 4 against Toughness 5 needs 5+, the printed
# +1 to wound makes the declared 4 wound, and the light-armour save (6+, dagger +1, Strength 4 -1) is 6+,
# which the declared 6 makes.  The defender's own attacks are supplied as zero.
- audit_id: mechanic/mechanic.wheelo-skill-modifications
  id: the-crew-mighty-blow-is-plus-one-to-wound-at-printed-strength
  covers: [whole--scope--mighty-blow]
  fighters:
    first: &mighty-blow-wheelo
      collection: mordheim
      band_id: snotlings-web
      profile_id: wheelo
      main_weapon_id: weapon.dagger
      skill_ids: [skill.mighty-blow]
    second: &mighty-blow-target
      main_weapon_id: weapon.mace
      armour_id: armour.light-armour
      characteristics: {weapon_skill: 3, strength: 3, toughness: 5, wounds: 2, initiative: 2, attacks: 1}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.1.hit, value: 1}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.armour, value: 6}
  expect_rounds:
    0: {attacks.0.hit: true, attacks.0.saved: true, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# The control: the same crew without the skill needs 5+ to wound Toughness 5, so the same 4 fails and no
# armour die is requested.
- audit_id: mechanic/mechanic.wheelo-skill-modifications
  id: without-mighty-blow-the-same-wound-die-fails
  covers: [whole--scope--mighty-blow]
  fighters:
    first:
      collection: mordheim
      band_id: snotlings-web
      profile_id: wheelo
      main_weapon_id: weapon.dagger
    second: *mighty-blow-target
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.1.hit, value: 1}
    - {key: round.0.first.attack.0.wound, value: 4}
  expect_rounds:
    0: {attacks.0.hit: true, attacks.0.damage: 0, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# "Has no effect on Impact Hits": the charging Wheelo's one Impact Hit (count die 1) is Strength 4 against
# Toughness 5 and still needs 5+, so the declared 4 fails even with the skill; both crew attacks then miss.
- audit_id: mechanic/mechanic.wheelo-skill-modifications
  id: mighty-blow-does-not-improve-the-impact-hit
  covers: [whole--scope--mighty-blow]
  fighters:
    first: *mighty-blow-wheelo
    second: *mighty-blow-target
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.impact-count, value: 1}
    - {key: round.0.first.impact.0.wound, value: 4}
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.first.attack.1.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: true, attacks.0.damage: 0, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
