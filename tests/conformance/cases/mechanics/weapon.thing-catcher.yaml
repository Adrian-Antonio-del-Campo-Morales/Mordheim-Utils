# --- Authored scenarios ---
# mechanic/weapon.thing-catcher - Clan Pristekk (Sealed City): "Range: Close
# Combat; Strength: as user; special rules: two-handed, capture."  No Strength
# bonus, no strike-last, no parry: a two-handed pole that fights at the bearer's
# own Strength in ordinary Initiative order.
#
# Expectations come from the printed text, never from engine output.  S3 against
# T3 wounds on a 4+, so the wound die 4 wounds and the 3 fails - the same faces a
# bare mace shows, which is the point: the catcher adds nothing.  The order pair
# reuses the double-handed-weapon contrast.

# Strength as user: the wound die 4 reaches the unboosted S3 target against T3
# and the injury 1 leaves the single-wound defender Knocked Down.
- audit_id: mechanic/weapon.thing-catcher
  id: thing-catcher-wounds-at-the-users-own-strength
  fighters:
    first:
      main_weapon_id: weapon.thing-catcher
      characteristics: &tc-attacker {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: &tc-defender-w1 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 2, attacks: 1}
  duel_context: &tc-charging-first {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.injury.0, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 1, state.second.wounds: 0, state.second.condition: KNOCKED_DOWN}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# No printed Strength bonus: the wound die 3 is one face below the S3 target.
- audit_id: mechanic/weapon.thing-catcher
  id: thing-catcher-does-not-wound-one-face-below-the-users-strength
  fighters:
    first:
      main_weapon_id: weapon.thing-catcher
      characteristics: *tc-attacker
    second:
      main_weapon_id: weapon.mace
      characteristics: *tc-defender-w1
  duel_context: *tc-charging-first
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 3}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 0, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# No printed strike-last: neither fighter charges, so the catcher bearer's higher
# Initiative resolves first.  The compiled weapon is two-handed with no bonus.
- audit_id: mechanic/weapon.thing-catcher
  id: the-thing-catcher-strikes-in-ordinary-initiative-order
  fighters:
    first:
      main_weapon_id: weapon.thing-catcher
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: &tc-defender-w2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.wounds: 2, state.second.wounds: 2}
  expect_fighters:
    first.main_weapon.two_handed: true
    first.main_weapon.strength_bonus: 0
    first.main_weapon.priority: 0
  expect_final: {rounds_executed: 1, termination_reason: horizon}
  expect_events:
    - {kind: roll, key: round.0.first.attack.0.hit, sides: 6, value: 1}
    - {kind: roll, key: round.0.second.attack.0.hit, sides: 6, value: 1}

# The sibling contrast: the ordinary double-handed weapon in the same duel prints
# strike-last, so the identical dice resolve in the opposite order.
- audit_id: mechanic/weapon.thing-catcher
  id: the-ordinary-great-weapon-sibling-strikes-last-instead
  fighters:
    first:
      main_weapon_id: weapon.double-handed-weapon
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: *tc-defender-w2
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.0.first.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.wounds: 2, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
  expect_events:
    - {kind: roll, key: round.0.second.attack.0.hit, sides: 6, value: 1}
    - {kind: roll, key: round.0.first.attack.0.hit, sides: 6, value: 1}

# The printed two-handed occupancy is declared as a refusal.
- audit_id: mechanic/weapon.thing-catcher
  id: the-thing-catcher-occupies-both-hands-so-an-off-hand-weapon-is-refused
  fighters:
    first:
      main_weapon_id: weapon.thing-catcher
      off_hand_id: weapon.dagger
    second:
      main_weapon_id: weapon.mace
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  expect_error: "main weapon occupies both hands"
