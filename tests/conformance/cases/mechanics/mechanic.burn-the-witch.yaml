# Printed carriers: the Witch Hunters' Burn the Witch! (bands/mordheim/witch-hunters/special-rules.yaml
# witch-hunter-captain--burn-the-witch and witch-hunters--burn-the-witch, grant profile; the Trollheim
# copies): the Witch Hunter hates all models capable of casting spells (the shared Hatred contract: a
# first-round reroll of missed To Hit rolls).  Consumer: modular/contexts.py ~262-265 - `hatred =
# first_round and psychology_allowed and (... has_tag(effect, "mechanic.burn-the-witch") and
# "identity.spellcaster" in enemy_tags ...)`, feeding the hit reroll; psychology_allowed excludes a
# frenzied or Psychology-immune attacker.  The enemy fact is `trait_overrides: {spellcaster: true}`
# (compiler.py ~1073 projects identity.spellcaster), as TODO.md's "Witch Hunter Burn the Witch binds
# the general skill.hatred" note records.  Model: the AUTHORED Witch Hunters grant file (...3b27b35c3916);
# here the operator is injected through skill_ids on the hand-built fixture (WS3 S3 T3 W2 I5 A1 Ld7,
# mace).  The opponent is the mace fixture (WS3 S3 T3 W3 I2 A1 Ld7) and swings a declared 1.  The reroll
# is automatic (no decision), on key round.<i>.<side>.attack.<n>.hit.reroll.

# The printed Hatred: a first-round miss (2) against a declared spellcaster is rerolled (4 hits) and
# wounds.
- audit_id: mechanic/mechanic.burn-the-witch
  id: a-first-round-miss-is-rerolled-against-a-spellcaster
  fighters:
    first:
      &bearer
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.burn-the-witch]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 7}
    second:
      &caster
      main_weapon_id: weapon.mace
      trait_overrides: {spellcaster: true}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.first.attack.0.hit.reroll, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: true, attacks.0.damage: 1, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# Without the printed qualifying identity no reroll is offered: the same miss stands (the strict tape
# holds no reroll die).
- audit_id: mechanic/mechanic.burn-the-witch
  id: the-same-miss-stands-against-a-non-caster
  fighters:
    first:
      <<: *bearer
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: false, attacks.0.damage: 0, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# Hatred rerolls only in the first round of combat: the round-0 miss is rerolled (and the reroll's
# wound fails), the identical round-1 miss stands.
- audit_id: mechanic/mechanic.burn-the-witch
  id: the-reroll-belongs-to-the-first-round-only
  fighters:
    first:
      <<: *bearer
    second:
      <<: *caster
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 2
  rolls:
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.first.attack.0.hit.reroll, value: 4}
    - {key: round.0.first.attack.0.wound, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.1.first.attack.0.hit, value: 2}
    - {key: round.1.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: true, attacks.0.wounded: false}
    1: {attacks.0.hit: false, state.second.wounds: 3}
  expect_final: {rounds_executed: 2, termination_reason: horizon}

