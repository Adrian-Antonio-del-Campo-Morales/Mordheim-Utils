# AUTHORED[self-attack-bonus]: 2 scenarios cover the declared sermon that adds one attack for the combat phase and records the once-per-duel resource as spent, and the declined declaration that leaves the same warrior with his printed single attack and no spent resource. The +1 attack is observed structurally: with the declaration the first warrior's blow occupies attack indices 0 and 1 and the enemy's follows at index 2, and the declared tape names those rolls, so a missing or extra attack changes which roll the engine requests. Documented gap: the resource key round.<round>.rousing-sermon exists only in the executor (rounds.py:112-121); the clause text states once per duel without naming it.
