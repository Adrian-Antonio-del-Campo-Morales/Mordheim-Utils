# --- Authored scenarios ---
# Hatred family model (the AUTHORED hireling hatred files): the bearer is a hand-built fighter carrying only
# this mechanic through skill_ids (WS3 S3 T3 W2 I5 A1, mace), charging so it strikes first; a natural 2
# misses WS3 and the first-round Hatred re-roll is requested under `round.0.first.attack.0.hit.reroll`;
# the re-rolled 4 hits, S3 wounds T3 on 4+, and the opponent's fixture W3 keeps the tape off the injury
# table.  The hated opponents are compiled band profiles with fixture characteristics (WS3 S3 T3 W3 I2 A1,
# printed Ld) and a printed kit weapon; the controls are hand-built (Ld7, mace).

# A Dreg of the Undead warband is human, and hated all the same.
- audit_id: mechanic/mechanic.gaoler-hatred
  id: a-first-round-miss-is-rerolled-against-a-member-of-an-undead-warband
  fighters:
    first:
      &bearer
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.gaoler-hatred]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      collection: mordheim
      band_id: undead
      profile_id: dregs
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.first.attack.0.hit.reroll, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: True, attacks.0.damage: 1, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

