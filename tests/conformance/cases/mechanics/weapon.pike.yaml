# Conformance authoring scaffold; generated comments, manually authored scenarios.
# audit_id: mechanic/weapon.pike
# authoring_status: PARTIAL
# authoring_progress: the `whole` clause carries three authored scenarios for the strike-first priority, the wielder's Strength and one refusal; the `first-turn-scope` clause stays unauthored because it is an open source-vs-contract conflict (see the clause note below). REVIEWED still requires manual semantic review and execution_status stays UNEXECUTED.
# execution_status: UNEXECUTED (this scaffold has no behavioral result)
#
# Derive inputs and expectations from rule text and accepted rulings.
# Do not derive them from the engine or execute combat during authoring.
# REVIEWED requires semantic review; covers labels alone are insufficient.
# Preserve audit_id when filling this file.
# Governing rulings: docs/decisions/design-rulings.md
#
# Clause: first-turn-scope (scope: YES)
# PARTIAL[first-turn-scope]: the printed scope (strike first in the first turn of a
#   hand-to-hand combat) is resolved for the engine ([M2-offensive 2026-10-08]:
#   resolve_priority drops the pike's strike-first layer once the first round is
#   over, as it does for the spear and the long-boat-hook) and is now authored as the
#   differential variant below: the same two fighters across two rounds, where round
#   0 the low-Initiative bearer strikes first through the pike's priority and round 1
#   the faster defender strikes first again because the layer has lapsed. The
#   editorial residual is kept, not decided: the mechanic record's prose is
#   unqualified while the item prose prints 'first turn', so the mechanic record
#   still needs its text aligned with the entry it answers.
#
# Clause: whole (scope: YES)
# AUTHORED[whole]: 3 scenarios and 1 refusal cover the first-round strike-first priority, the wielder's own Strength on both faces and the two-handed occupancy.

# --- Authored scenarios ---
# mechanic/weapon.pike - two-handed, strikes first with the wielder's Strength.
#
# Expectations come from the printed rule and the admitted clauses, never from
# engine output.  The scope conflict between the printed turn limit and the
# contract is deliberately not asserted here.
# Neither fighter charges, so only the printed strike-first priority can lift the lower-Initiative bearer above the defender.

- audit_id: mechanic/weapon.pike
  id: pike-strikes-first-in-the-first-round
  covers: [whole]
  fighters:
    first:
      main_weapon_id: weapon.pike
      characteristics: &a-ws3-s3-t3-w2-i2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.wounds: 2, state.first.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
  expect_events:
    - {kind: roll, key: round.0.first.attack.0.hit, sides: 6, value: 1}
    - {kind: roll, key: round.0.second.attack.0.hit, sides: 6, value: 1}
# The pike uses the wielder's Strength: Toughness 3 is wounded on the ordinary 4+.

- audit_id: mechanic/weapon.pike
  id: pike-wounds-on-the-wielders-own-strength-target
  covers: [whole]
  fighters:
    first:
      main_weapon_id: weapon.pike
      characteristics: &a-ws3-s3-t3-w2-i5 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: &d-ws3-s3-t3-w2-i2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# One face below the wielder's own wound target, which rules out any hidden Strength bonus.

- audit_id: mechanic/weapon.pike
  id: pike-does-not-wound-one-face-below
  covers: [whole]
  fighters:
    first:
      main_weapon_id: weapon.pike
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 3}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 0, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# The printed two-handed occupancy is declared as a refusal.

- audit_id: mechanic/weapon.pike
  id: pike-occupies-both-hands-so-an-off-hand-weapon-is-refused
  covers: [whole]
  fighters:
    first:
      main_weapon_id: weapon.pike
      off_hand_id: weapon.dagger
    second:
      main_weapon_id: weapon.mace
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  expect_error: "main weapon occupies both hands"


# The printed first-turn scope as a differential: round 0 the Initiative 3 bearer
#   strikes first through the pike's priority (wounding the Initiative 5 defender),
#   and round 1 the same build orders the Initiative 5 defender first because the
#   pike's first-turn layer has lapsed - the faster fighter is back in charge.
- audit_id: mechanic/weapon.pike
  id: the-pikes-strike-first-lapse-hands-the-first-rounds-order-back
  covers: [first-turn-scope]
  fighters:
    first:
      main_weapon_id: weapon.pike
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 3, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 2
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.1.second.attack.0.hit, value: 4}
    - {key: round.1.second.attack.0.wound, value: 4}
    - {key: round.1.first.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: true, attacks.0.wounded: true, attacks.0.damage: 1,
        state.second.wounds: 1}
    1: {attacks.0.hit: true, attacks.0.wounded: true, attacks.0.damage: 1,
        state.first.wounds: 1}
  expect_final: {rounds_executed: 2, termination_reason: horizon}
