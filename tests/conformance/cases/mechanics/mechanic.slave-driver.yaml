# --- Authored scenarios ---
# Printed carriers: Slavers, Overseer, Slave Driver (bands/mordheim/slavers-rel/special-rules.yaml
# overseer--slave-driver, grant profile; the Skaven of Clan Skryre Overseer binds the same id): "Any slave
# within 3 inches may use his leadership.  If he is armed with a scourge, this increases to 6 inches."
# Consumer: modular/leadership.py ~27-32 (`_supplied_provider`: a provider carrying mechanic.slave-driver
# lends his own Leadership within 3 inches, 6 while he carries condition.scourge-armed or a
# weapon.pirate-scourge) and ~239-241 (only a borrower tagged identity.slave may use him).  The provider is
# the printed Overseer (Ld7) supplied as a nearby local participant of the borrower's side, as the
# AUTHORED Slavers grant file (...b65229a8a1f7) does (this provider contract reads no band gate); the
# borrower is the hand-built fixture (WS3 S3 T3 W2 I2 A1 Ld3, mace) declaring the printed recipient fact
# trait_overrides: {slave: true}.  The Leadership test is the charged-fear test against a hand-built
# fear-causer (WS3 S3 T3 W3 I10 A1 Ld7, mace); 3+3 passes only through the borrowed 7.  The borrow is
# the decision round.0.second.fear.charged.leader.overseer.  Every strike is a declared 1.

# Within the printed three inches the slave borrows the Overseer's Leadership 7 and passes 3+3.
- audit_id: mechanic/mechanic.slave-driver
  id: a-supplied-overseer-at-three-inches-lends-his-leadership-to-a-slave
  fighters:
    first:
      &fear_causer
      trait_overrides: {causes_fear: true}
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 10, attacks: 1, leadership: 7}
    second:
      &slave
      trait_overrides: {slave: true}
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 3}
  duel_context:
    charging: [first]
    active_participant: first
    nearby:
      - participant_id: overseer
        side_id: second
        condition: standing
        fighter: {collection: mordheim, band_id: slavers-rel, profile_id: overseer}
    distances: [[second, overseer, 3]]
  decisions:
    - {key: round.0.second.fear.charged.leader.overseer, value: true}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.fear.charged.0, value: 3}
    - {key: round.0.second.fear.charged.1, value: 3}
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.fear_hit_sixes: false, state.second.wounds: 2, state.first.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

