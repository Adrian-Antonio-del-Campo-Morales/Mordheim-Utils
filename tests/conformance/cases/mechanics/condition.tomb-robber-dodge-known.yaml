# --- Authored scenarios ---
# Printed text (Town Cryer 19 p.21, Tomb Robber / Excellent Reflexes, as recorded in grade-1b.yaml):
# "The Tomb Robber has a special 5+ save against any attack ... If he learns Dodge this improves to
# 4+."  The condition (close-combat.yaml condition.tomb-robber-dodge-known, "Tomb Robber knows
# Dodge"; execution.yaml effect-set with the tag alone) is the supplied fact that he has learned
# Dodge, declared through condition_ids on the bearer.  Compiler: compiler.py ~1169-1172 refuses the
# condition unless the build's profile is hireling.hired-sword.tomb-robber ("the Dodge upgrade
# requires the Tomb Robber's Excellent Reflexes").  Engine: contexts.py _supplied_ward (~620-623)
# reads the Excellent Reflexes tag and lowers the ward to 4 when the condition tag is present (5
# otherwise); phases.py resolve_special_save (~669-673) asks round.<i>.<attacker>.attack.<n>
# .special.ward and a roll at or above the ward turns the wound.
# Hireling family model (README, Hireling recipients; the Tomb Robber's own grant file
# ...7f01babd948e is the tape model): the printed Tomb Robber through the hireling route
# (hirelings.hired-sword.1b / hireling.hired-sword.tomb-robber) with the fixture facts (WS3 S3 T3 W2
# I5 A1; the printed Ld7 stays), his kit sword named (its parry die follows every hit, declared a
# one), nothing worn (no armour die), silenced.  The attacker is hand-built (mace, WS3 S3 T3 W3 I2
# A1 Ld7): 4+ to hit, 4+ to wound (fours, never a six).  The duel is uncharged.  The refusal supplies
# the fact to the grade-1b Bard.

# With the Dodge fact the special save is 4+: the four turns the unsaved wound.
- audit_id: mechanic/condition.tomb-robber-dodge-known
  id: with-dodge-known-the-special-save-turns-the-wound-on-four
  fighters:
    first:
      &attacker
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
    second:
      &dodging-tomb-robber
      collection: mordheim
      band_id: hirelings.hired-sword.1b
      profile_id: hireling.hired-sword.tomb-robber
      main_weapon_id: weapon.sword
      condition_ids: [condition.tomb-robber-dodge-known]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
  initial_state: {second: {attacks: 0}}
  duel_context: &uncharged {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.parry, value: 1}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.special.ward, value: 4}
  expect_rounds:
    0: {attacks.0.wounded: true, attacks.0.saved: true, attacks.0.damage: 0, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# One face below the improved 4+ fails and the wound lands.
