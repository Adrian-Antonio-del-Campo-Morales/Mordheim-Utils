# Disposition (carried as the PARTIAL block until 2026-11-18): the flag the clause needs is representable; the attack it must meet is not. The defender's flag is supplied exactly as the printed clause states it, through the combat trait regeneration_blocked_by_blessed (compiler.py:559, contracts.py:63), and the executor's consumer is the blocking term of prepare_special_save_context (contexts.py:408-414): with the flag set and attack.blessed on the incoming effect the Regeneration die is never requested. No admitted build source grants attack.blessed, so no corpus configuration can produce that incoming effect: a case-insensitive search of the whole repository finds the tag only as data for the consumer (phases.py/vectorized) and as a direct benchmark injection in the combat-lab CLI (apps/combat-lab/mordheim_combat_lab/cli/scenarios.py:401, first_attack_tags=('attack.blessed',), asserted in tests/python/cli/test_benchmarking.py:101), while the corpus builds every effect through the compiler from catalogue ids this repository does not contain for that tag. What IS authorable, and is authored below, is the boundary the same code path draws: the flag alone does not touch an unblessed attack, whose Regeneration die is requested and resolves normally. Missing datum: a selectable catalogue source of attack.blessed (or a supplied-input route for effect tags) so the blocked branch can be configured.

# Status corrected 2026-11-18: the recorded blocker was stale, and the gap it named is now closed.
#   An admitted build source of attack.blessed does exist in this corpus: condition.blessed-weapon
#   (sources/knowledge/catalog/rules/conditions.yaml) binds profile.item-modifiers with
#   effect_parameters tags [blessing.undead-possessed-on-two, attack.blessed] on the slot named by
#   blessed_weapon_slots, for bearers tagged band.sisters-of-sigmar or band.witch-hunters - the route
#   the accepted strigoi sibling already uses.  The blocked branch is therefore authored below on a
#   Witch Hunter, so the printed core has a scenario and no applicable requirement is left open.
#   The earlier 'missing datum' note is superseded; the block above is kept for the record.
# AUTHORED: three scenarios - a blessed attack prevents the Regeneration roll entirely, while the
#   same flag leaves an unblessed attack's Regeneration die intact on both of its faces.

# --- Authored scenarios ---
# The boundary of the printed rule, from the blocker's own flag: the defender carries the
# regeneration trait together with the blocked-by-blessed flag, and the ordinary mace blow
# is not a blessed attack.  The Regeneration die is therefore requested as usual and the
# declared four on a 4+ special save takes the wound back.  The save is reached after the
# armour step (none is carried) and before any damage is applied, so the defender keeps
# both Wounds, and its own declared To Hit one misses.
- audit_id: mechanic/skill.regeneration-blocked-by-blessed
  id: the-blocked-flag-leaves-an-unblessed-attack-s-regeneration-intact
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      trait_overrides: {regeneration_save: 4, regeneration_blocked_by_blessed: true}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.special.regeneration, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.wounded: True, attacks.0.saved: True, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
