# The printed core, authored 2026-11-18: a blessed attack prevents the Regeneration roll entirely.
# The attacker is a Witch Hunter, a printed bearer of the supplied Blessed Weapon result, whose
# main-hand mace is the blessed item (condition.blessed-weapon with blessed_weapon_slots [main] -
# the same admitted build route the accepted strigoi sibling uses,
# trollheim--chaos-streets-undead-bloodlines--band--strigoi-power-curse-of--b1c7be7591f4.yaml).  The
# defender is the identical regenerating fixture of the two scenarios above, so the only change is
# that the incoming attack is blessed: no Regeneration die is declared and the strict tape rejects
# the request if it is still made, the unsaved Wound stands and the defender drops to one Wound.
- audit_id: mechanic/skill.regeneration-blocked-by-blessed
  id: a-blessed-attack-prevents-the-regeneration-roll
  fighters:
    first:
      collection: mordheim
      band_id: witch-hunters
      profile_id: witch-hunters
      main_weapon_id: weapon.mace
      condition_ids: [condition.blessed-weapon]
      trait_overrides: {blessed_weapon_slots: [main]}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      trait_overrides: {regeneration_save: 4, regeneration_blocked_by_blessed: true}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.wounded: True, attacks.0.saved: False, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
