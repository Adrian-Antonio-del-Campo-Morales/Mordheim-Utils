#
# AUTHORED: 6 scenarios cover the three printed clauses of the sword - +1
#   Strength with its mace control, the 5-6 critical with its plain-sword
#   control, and the parry on both faces - on a hand-built bearer; the real
#   Aenur is evidenced in the three rule files of his unique item.

# --- Authored scenarios ---
# mechanic/weapon.ienh-khain - Aenur's Ienh-Khain (Mordheim rulebook, Dramatis
# Personae): a sword that "can parry", "adds +1 Strength" and "causes a critical
# hit on a wound roll of 5-6".  Execution: tags weapon.ienh-khain + weapon.sword,
# parry true, strength_bonus 1, critical_threshold 5.  The sword is wielded by
# its mechanic id on a hand-built bearer here.
#
# Expectations come from the printed text, never from engine output.  S3 +1 = S4
# against T3 wounds on a 3+, so the wound die 3 is the Strength boundary.  The
# wound die 5 is the critical boundary: a plain sword's 5 wounds without a
# critical.  A critical die of 1 is the lowest band of the basic table (2
# wounds, armour allowed, no injury modifier), so an unarmoured 3-wound target
# drops to 1 with no armour or injury die.  An ordinary parry must beat the hit
# die: a 5 blocks a hit landed on a 4, an equal 4 does not.

# The printed +1 Strength at its boundary: the wound die 3 reaches the S4 target
# against T3; the injury 1 leaves the single-wound defender Knocked Down.  The
# compiled sword shows the printed statline.
- audit_id: mechanic/weapon.ienh-khain
  id: ienh-khain-wounds-at-the-boosted-strength
  fighters:
    first:
      main_weapon_id: weapon.ienh-khain
      characteristics: &ik-attacker {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: &ik-defender-w1 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 2, attacks: 1}
  duel_context: &ik-charging-first {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 3}
    - {key: round.0.first.attack.0.injury.0, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 1, state.second.wounds: 0, state.second.condition: KNOCKED_DOWN}
  expect_fighters:
    first.main_weapon.parry: true
    first.main_weapon.strength_bonus: 1
    first.main_weapon.critical_threshold: 5
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The mace control: the identical wound die 3 is one face below the unboosted S3
# target, so the point of Strength is the sword's own.
- audit_id: mechanic/weapon.ienh-khain
  id: the-same-wound-die-fails-without-ienh-khain
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: *ik-attacker
    second:
      main_weapon_id: weapon.mace
      characteristics: *ik-defender-w1
  duel_context: *ik-charging-first
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 3}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 0, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The printed critical on a 5: the wound die 5 opens the critical table and the
# critical die 1 doubles the damage on the unarmoured three-wound target.
- audit_id: mechanic/weapon.ienh-khain
  id: ienh-khain-criticals-on-a-wound-roll-of-five
  fighters:
    first:
      main_weapon_id: weapon.ienh-khain
      characteristics: *ik-attacker
    second:
      main_weapon_id: weapon.mace
      characteristics: &ik-defender-w3 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1}
  duel_context: *ik-charging-first
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 5}
    - {key: round.0.first.attack.0.critical, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.critical: true, attacks.0.damage: 2, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The plain-sword control: the same wound die 5 wounds (S3 against T3 needs 4+)
# but is no critical, so no critical die is requested and one wound is dealt.
- audit_id: mechanic/weapon.ienh-khain
  id: a-plain-swords-wound-roll-of-five-is-no-critical
  fighters:
    first:
      main_weapon_id: weapon.sword
      characteristics: *ik-attacker
    second:
      main_weapon_id: weapon.mace
      characteristics: *ik-defender-w3
  duel_context: *ik-charging-first
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 5}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.critical: false, attacks.0.damage: 1, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The printed parry: the bearer, struck on a 4, is offered the parry and a 5
# beats the hit die, so the blow is turned.
- audit_id: mechanic/weapon.ienh-khain
  id: ienh-khain-parries-a-hit-it-beats
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: *ik-attacker
    second:
      main_weapon_id: weapon.ienh-khain
      characteristics: &ik-defender-w2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: *ik-charging-first
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.parry, value: 5}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.parried: true, attacks.0.wounded: false, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# An equal parry die does not beat the hit: the 4 fails and the wound is taken.
- audit_id: mechanic/weapon.ienh-khain
  id: an-equal-parry-die-does-not-block
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: *ik-attacker
    second:
      main_weapon_id: weapon.ienh-khain
      characteristics: *ik-defender-w2
  duel_context: *ik-charging-first
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.parry, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.parried: false, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
