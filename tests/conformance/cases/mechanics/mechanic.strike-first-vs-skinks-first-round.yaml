# The first combat round belongs to the Hero; the recorded event order then returns
# to the ordinary tier and Initiative, where the Skink's 5 resolves before the
# Hero's 2.  Every roll is declared in that order, so the tape itself carries the
# reversal, and the second-round hit is left as a miss to keep the state stable.
