# --- Authored scenarios ---
# mechanic/skill.web-of-steel - authored from the printed "+1 on close-combat
# Critical Hit tables" clause and the recorded contract, never from engine output.
# The pair is the same wound and the same raw critical-table die; the only
# difference is the skill.  The basic table denies armour from a modified three
# upwards, so two plus the skill's point reaches the band while a bare two does
# not, and the armour stage is reached only in the second scenario.
- audit_id: mechanic/skill.web-of-steel
  id: the-skill-moves-a-raw-two-into-the-armour-denying-band
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [skill.web-of-steel]
      characteristics: &wos-attacker {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      armour_id: armour.light-armour
      characteristics: &wos-defender {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1}
  duel_context: &wos-context {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 6}
    - {key: round.0.first.attack.0.critical, value: 2}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.critical: True, attacks.0.saved: False, attacks.0.damage: 2, state.second.wounds: 1}
