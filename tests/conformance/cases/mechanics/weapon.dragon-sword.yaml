# Conformance authoring scaffold; generated comments, manually authored scenarios.
# audit_id: mechanic/weapon.dragon-sword
# authoring_status: AUTHORED
# authoring_progress: the admitted clause carries three refusals for the printed loadout restriction, one control scenario a boundary pair for the printed +1 Strength, and a boundary pair for the parry the Dragon Sword takes from the older Katana wording (ruling 2026-11-16). The printed ranged armour bonus is a clause outside the admitted scope. REVIEWED still requires manual semantic review and execution_status stays UNEXECUTED.
# execution_status: UNEXECUTED (this scaffold has no behavioral result)
#
# Derive inputs and expectations from rule text and accepted rulings.
# Do not derive them from the engine or execute combat during authoring.
# REVIEWED requires semantic review; covers labels alone are insufficient.
# Preserve audit_id when filling this file.
# Governing rulings: docs/decisions/design-rulings.md
#
# Clause: whole--scope--two-handed-loadout (scope: YES)
# AUTHORED[whole--scope--two-handed-loadout]: 3 refusals declare the printed prohibition on a shield, a buckler or an additional weapon, 1 control scenario shows the bare loadout compiling and resolving, 2 scenarios sit on both faces of the 3+ wound target the printed +1 Strength gives against Toughness 3, and 2 show the parry blocking a hit it beats and not an equal roll.
#
# Clause: whole--scope--ranged-armour-bonus (scope: NO)
# Outside the admitted clause scope; retained for context, not a test TODO.

# --- Authored scenarios ---
# mechanic/weapon.dragon-sword - the printed prohibition of any second item in
# close combat.
#
# Expectations come from the printed rule and the admitted clause only, never from
# engine output.  Every refusal shares the same loadout message because the
# restriction is the two-handed occupancy of the main hand, and the control
# scenario shows the bare profile is legal.
# The printed prohibition on an additional weapon is declared as a refusal.

- audit_id: mechanic/weapon.dragon-sword
  id: dragon-sword-is-refused-with-an-additional-weapon
  covers: [whole--scope--two-handed-loadout]
  fighters:
    first:
      main_weapon_id: weapon.dragon-sword
      off_hand_id: weapon.dagger
    second:
      main_weapon_id: weapon.mace
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  expect_error: "main weapon occupies both hands"
# The printed prohibition on a shield is declared as a refusal.

- audit_id: mechanic/weapon.dragon-sword
  id: dragon-sword-is-refused-with-a-shield
  covers: [whole--scope--two-handed-loadout]
  fighters:
    first:
      main_weapon_id: weapon.dragon-sword
      off_hand_id: defence.shield
    second:
      main_weapon_id: weapon.mace
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  expect_error: "main weapon occupies both hands"
# The printed prohibition on a buckler is declared as a refusal.

- audit_id: mechanic/weapon.dragon-sword
  id: dragon-sword-is-refused-with-a-buckler
  covers: [whole--scope--two-handed-loadout]
  fighters:
    first:
      main_weapon_id: weapon.dragon-sword
      off_hand_id: defence.buckler
    second:
      main_weapon_id: weapon.mace
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  expect_error: "main weapon occupies both hands"
# Control: the same warrior with no off hand at all compiles and resolves, so the refusals above are the printed loadout restriction rather than a broken profile.

- audit_id: mechanic/weapon.dragon-sword
  id: dragon-sword-alone-compiles-and-resolves-a-round
  covers: [whole--scope--two-handed-loadout]
  fighters:
    first:
      main_weapon_id: weapon.dragon-sword
      characteristics: &a-ws3-s3-t3-w2-i5 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: &d-ws3-s3-t3-w2-i2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.wounds: 2, state.first.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}


# The printed "Strength: As user +1".  The bearer's Strength 3 plus the weapon's +1
# is Strength 4 against Toughness 3, which wounds on a 3+ on the core wound chart
# (at Strength 3 it would need a 4+).  The pair sits on both faces of that target:
# a 3 wounds only because of the bonus, and a 2 still fails with it.  The
# opponent's pool is suppressed so no strike order between the two is assumed.
# Authored 2026-11-16: the scenarios above never reached the printed Strength.
- audit_id: mechanic/weapon.dragon-sword
  id: dragon-sword-wounds-on-three-at-the-boosted-strength
  covers: [whole--scope--two-handed-loadout]
  fighters:
    first:
      main_weapon_id: weapon.dragon-sword
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  initial_state:
    second: {attacks: 0}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 3}
  expect_rounds:
    0: {attacks.0.wounded: true, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# One face below the boosted target: a 2 fails to wound even at Strength 4.
- audit_id: mechanic/weapon.dragon-sword
  id: dragon-sword-does-not-wound-on-two
  covers: [whole--scope--two-handed-loadout]
  fighters:
    first:
      main_weapon_id: weapon.dragon-sword
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  initial_state:
    second: {attacks: 0}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 2}
  expect_rounds:
    0: {attacks.0.wounded: false, attacks.0.damage: 0, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The parry, read from the older Katana wording the Dragon Sword print points to
# (ruling "The Dragon Sword keeps the Katana's parry", design-rulings.md).  The
# core parry must beat the attacker's to-hit roll: a 5 blocks a hit landed on a 4.
- audit_id: mechanic/weapon.dragon-sword
  id: dragon-sword-parries-a-hit-it-beats
  covers: [whole--scope--two-handed-loadout]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.dragon-sword
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.parry, value: 5}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.parried: true, attacks.0.wounded: false, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# An equal parry die does not beat the hit, so the blow goes on to wound.
- audit_id: mechanic/weapon.dragon-sword
  id: dragon-sword-does-not-parry-an-equal-roll
  covers: [whole--scope--two-handed-loadout]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.dragon-sword
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.parry, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.parried: false, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
