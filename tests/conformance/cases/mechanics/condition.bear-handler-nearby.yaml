# authoring_progress: the undivided supplied condition carries 4 authored scenarios derived from its
#   catalogue row (sources/knowledge/catalog/rules/conditions.yaml: "The Trained Bear has its actual
#   friendly Bear Tamer within 6 inches. This exempts Stupidity; an Out of Action Tamer does not
#   qualify."): the declared condition waives the native bear's Stupidity without a die, the bear
