    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: False, attacks.0.hit_target: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# A Strength 1 bearer would need a 6+ to wound Toughness 3, so the 3 that wounds proves the printed fixed Strength 4.

- audit_id: mechanic/weapon.duelling-pistol
  id: duelling-pistol-uses-strength-four-not-the-bearers-strength
  fighters:
    first:
      main_weapon_id: weapon.duelling-pistol
      characteristics: &a-ws3-s1-t3-w2-i5 {weapon_skill: 3, strength: 1, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 3}
    - {key: round.0.first.attack.0.wound, value: 3}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# The pistol's armour penetration moves a worn 5+ save to 6+ (Strength 4 also costs a point), so the 6 still saves.

- audit_id: mechanic/weapon.duelling-pistol
  id: duelling-pistol-save-holds-on-the-penalised-target
  fighters:
    first:
      main_weapon_id: weapon.duelling-pistol
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      armour_id: armour.gromril-armour
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 3}
    - {key: round.0.first.attack.0.wound, value: 3}
    - {key: round.0.first.attack.0.armour, value: 6}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.saved: True, attacks.0.damage: 0, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
