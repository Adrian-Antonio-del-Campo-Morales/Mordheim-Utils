# The first round carries one pistol attack; in the second round the bearer has no attack at all, which the ordered tape shows by carrying only the defender's die.

- audit_id: mechanic/weapon.duelling-pistol
  id: duelling-pistol-fires-in-the-first-round-only
  fighters:
    first:
      main_weapon_id: weapon.duelling-pistol
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 2
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
    # The spent pistol is an ordinary club in the second round, so the bearer
    # still strikes before the slower defender.
    - {key: round.1.first.attack.0.hit, value: 1}
    - {key: round.1.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.wounds: 2, state.first.wounds: 2}
    1: {state.second.wounds: 2, state.first.wounds: 2}
  expect_final: {rounds_executed: 2, termination_reason: horizon}
  expect_events:
    - {kind: roll, key: round.0.first.attack.0.hit, sides: 6, value: 1}
    - {kind: roll, key: round.0.second.attack.0.hit, sides: 6, value: 1}
    - {kind: roll, key: round.1.first.attack.0.hit, sides: 6, value: 1}
    - {kind: roll, key: round.1.second.attack.0.hit, sides: 6, value: 1}

