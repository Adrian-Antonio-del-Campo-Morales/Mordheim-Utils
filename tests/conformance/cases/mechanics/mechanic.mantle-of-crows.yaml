# --- Authored scenarios ---
# Operator model (modular/rounds.py:1207-1240): at the start of each hand-to-hand phase, while both are
# active, the bearer's opponent suffers one automatic hit (`automatic_hit`, `fixed_strength=2`,
# `cannot_be_parried`) resolved before any blow with no To Hit die and none of the bearer's personal weapon
# effects; it is keyed on the TARGET's side, `round.N.<target-label>.mantle-of-crows`, so its wound die is
# `round.N.<target-label>.mantle-of-crows.wound`.  Printed text (Crow Master): "Any enemy model in base-to-base
# contact ... at the start of the Hand-to-hand Combat phase suffers a single automatic Strength 2 hit before
# any blows are struck."  The bearer is a hand-built fixture (WS3 S3 T3 W2 I5 A1 Ld7, mace) carrying the
# mechanic through skill_ids; the opponent is the hand-built fixture (WS3 S3 T3 W3 I2 A1 Ld7, mace, no
# armour, so no save die).  Strength 2 wounds Toughness 3 on a 5+; a six would be a critical candidate and
# is never declared.  Both swings are declared natural 1s; the crows' outcome is the first attack of the
# round's ledger.

# The automatic hit opens the phase and a five wounds: the opponent loses one wound before any blow.
- audit_id: mechanic/mechanic.mantle-of-crows
  id: the-automatic-strength-two-hit-wounds-the-contacting-opponent-on-a-five
  fighters:
    first:
      &bearer
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.mantle-of-crows]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 7}
    second:
      &opponent
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.mantle-of-crows.wound, value: 5}
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: true, attacks.0.damage: 1, state.second.wounds: 2, state.first.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# One face below the Strength 2 target: the four does not wound.
- audit_id: mechanic/mechanic.mantle-of-crows
  id: a-four-on-the-strength-two-hit-does-not-wound
  fighters:
    first:
      <<: *bearer
    second:
      <<: *opponent
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.mantle-of-crows.wound, value: 4}
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: true, attacks.0.damage: 0, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

