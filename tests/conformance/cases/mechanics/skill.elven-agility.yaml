#
# AUTHORED: 5 scenarios show the 6+ special save holding on its own face
#   and failing one below it, the printed improvement to 4+ when the warrior also has
#   Step Aside (the close-combat skill of the two; held on 4, failed on 3) and a
#   non-bearer control offered no save at all (added 2026-11-16).  Printed: "The warrior
#   avoids close-combat and missile attacks on a 6+. If he also has Dodge or Step Aside,
#   the corresponding save improves to 4+" (catalog/skills/warband.yaml); Step Aside
#   alone is a 5+ save, so a 4 that is saved can only come from the combination.

# --- Authored scenarios ---

- audit_id: mechanic/skill.elven-agility
  id: the-special-save-holds-on-6
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      skill_ids: [skill.elven-agility]
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.special.ward, value: 6}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.saved: true, attacks.0.damage: 0, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

