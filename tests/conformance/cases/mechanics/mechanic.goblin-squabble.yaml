  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The D6 belongs to the goblin's own turn: charged in the enemy's turn he rolls nothing, and the
# die is asked at the start of his own turn in the next round, where the 1 squabbles.
- audit_id: mechanic/mechanic.goblin-squabble
  id: the-die-is-rolled-only-at-the-start-of-the-goblins-own-turn
  fighters:
    first:
