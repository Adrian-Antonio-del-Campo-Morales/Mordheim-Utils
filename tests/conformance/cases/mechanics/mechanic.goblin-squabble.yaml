# --- Authored scenarios ---
# Hand-built fixtures: the bearer injects the shared mechanic through skill_ids and declares the
# goblin species (WS3 S3 T3 W2 I5 A1 Ld7); the opponent is the hand-built mace fixture
# (WS3 S3 T3 W3 I2 A1 Ld7).  The D6 is asked at the start of the bearer's own turn, before any
# attack; a 1 squabbles and the strict tape then holds no attack die of his, while the enemy's own
# natural 1 is still requested.  WS3 against WS3 hits on 4+, S3 against T3 wounds on 4+, and an
# unarmoured mace fixture rolls no save, so a 4/4 pair is exactly one wound.

# A 1 at the start of the goblin's turn: he squabbles, his attack is never requested and the
# opponent's own strike still happens.
- audit_id: mechanic/mechanic.goblin-squabble
  id: a-one-at-the-start-of-the-goblins-turn-makes-him-squabble
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.goblin-squabble]
      trait_overrides: {species: goblin}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 7}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.animosity, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.animosity_failed: True, state.first.wounds: 2, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The boundary: a 2 is not a squabble, so the goblin's charge lands normally.
