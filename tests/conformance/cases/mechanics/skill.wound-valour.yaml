#
# AUTHORED: 2 scenarios cover the wound reroll against a strictly
#   higher printed Strength and its refusal against an equal one.

# --- Authored scenarios ---
# The bearer's printed Strength 3 is lower than the opponent's 4, so the failed wound
# roll is taken again and the reroll wounds.  Only the wound roll is offered again,
# never the hit roll.
- audit_id: mechanic/skill.wound-valour
  id: a-failed-wound-against-a-stronger-opponent-is-rerolled
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [skill.wound-valour]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 4, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 1}
    - {key: round.0.first.attack.0.wound.reroll, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: True, attacks.0.wounded: True, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# The same charge, the same hit and the same failed wound roll against an equal
# printed Strength: the re-roll is refused, so only the strict comparison the
# accepted wording carries distinguishes this case from the previous one.
- audit_id: mechanic/skill.wound-valour
  id: an-equal-strength-opponent-grants-no-wound-reroll
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [skill.wound-valour]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: True, attacks.0.wounded: False, attacks.0.damage: 0, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

