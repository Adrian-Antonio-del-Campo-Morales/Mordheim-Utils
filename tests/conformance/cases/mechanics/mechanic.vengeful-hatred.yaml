# --- Authored scenarios ---
# Printed source (mordheimer.net, Campaigns / Serious Injuries / Heroes' chart / 56 Bitter Enmity;
# catalog/campaign/serious-injuries.yaml): the warrior permanently hates an enemy determined by a further
# D6 - 1-3 the individual who caused the injury (the enemy leader if a Henchman), 4 the leader of that
# warband, 5 the entire warband, 6 all warbands of that type.  Recorded contract (close-combat.yaml note):
# the duel is supplied the printed kind and the concrete identity (trait_overrides enmity_kind /
# enmity_target); the three instance kinds read the opponent's supplied instance_id or warband_instance,
# never a catalogue profile or band; only the warband-type kind reads the opponent's compiled warband
# group; a missing target never grants the re-roll and the campaign D6 is not simulated.  Hatred model
# (mechanics/skill.hatred.yaml is the template): a natural 2 misses WS3 against WS3; the first-round
# re-roll is requested at round.0.<side>.attack.0.hit.reroll, a 4 hits and S3 wounds T3 on a 4; outside the
# hated identity the strict tape holds no re-roll key.  The warband-type scenarios use the compiled group
# tag of a hand-built Mercenary (trait_overrides mercenary_origin, the warband-group.human-mercenary tag).

# Individual kind: the opponent is the supplied instance, so the first-round miss is re-rolled.
- audit_id: mechanic/mechanic.vengeful-hatred
  id: the-individual-kind-rerolls-against-the-supplied-instance
  fighters:
    first:
      &avenger_individual
      main_weapon_id: weapon.mace
      trait_overrides: {enmity_kind: individual, enmity_target: grimgor-7}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      &grimgor
      main_weapon_id: weapon.mace
      trait_overrides: {instance_id: grimgor-7}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.first.attack.0.hit.reroll, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: true, attacks.0.damage: 1, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# Individual kind: another instance - even of the same build - is not the hated warrior; the miss stands.
- audit_id: mechanic/mechanic.vengeful-hatred
  id: the-individual-kind-does-not-reroll-against-another-instance
  fighters:
    first:
      <<: *avenger_individual
    second:
      main_weapon_id: weapon.mace
      trait_overrides: {instance_id: snaga-2}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: false, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

