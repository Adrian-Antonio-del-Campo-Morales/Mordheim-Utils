# A weapon outside the printed axe / two-handed scope keeps its failed hit.
- audit_id: mechanic/skill.weapons-of-the-north
  id: an-out-of-scope-weapon-miss-is-not-rerolled
  fighters:
    first:
      main_weapon_id: weapon.mace
