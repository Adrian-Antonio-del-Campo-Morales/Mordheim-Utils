- audit_id: mechanic/condition.alchemist-addicted
  id: a-failed-brew-keeps-the-scientist-brewing-and-barred
  fighters:
    first:
      collection: mordheim
      band_id: masters-of-horror-sylv
      profile_id: mad-scientist
      main_weapon_id: weapon.mace
      condition_ids: [condition.alchemist-addicted]
      characteristics: *aa-scientist
    second:
      main_weapon_id: weapon.mace
      characteristics: *aa-opponent
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 3
  rolls:
    - {key: round.0.first.alchemist-brew, value: 3}
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.1.second.attack.0.hit, value: 1}
    - {key: round.2.first.alchemist-brew, value: 2}
    - {key: round.2.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.strength: 3, state.first.toughness: 3, state.second.wounds: 3}
    2: {state.first.strength: 3, state.second.wounds: 3, state.first.condition: STANDING}
  expect_final: {rounds_executed: 3, termination_reason: horizon}

# The cadence: supplied on the non-active side, round 0 (the opponent's turn) holds no brew die and no
# attack of his; the first attempt comes at the start of his own turn (round 1), the 6 releases him and
# he strikes with Strength 4 in that same turn.
- audit_id: mechanic/condition.alchemist-addicted
  id: no-attempt-is-made-on-the-opponents-turn
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: *aa-opponent
    second:
      collection: mordheim
      band_id: masters-of-horror-sylv
      profile_id: mad-scientist
      main_weapon_id: weapon.mace
      condition_ids: [condition.alchemist-addicted]
      characteristics: *aa-scientist
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 2
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.1.second.alchemist-brew, value: 6}
    - {key: round.1.second.attack.0.hit, value: 4}
    - {key: round.1.second.attack.0.wound, value: 3}
    - {key: round.1.first.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.strength: 3, state.second.toughness: 3, state.first.wounds: 3}
    1: {state.second.strength: 4, state.second.toughness: 4, attacks.0.wounded: true, state.first.wounds: 2}
  expect_final: {rounds_executed: 2, termination_reason: horizon}

# The no-duplication guard: an already supplied Aberrantius Vigortia (S4 T4 at initialization) is not
# doubled when the release brews another dose - the Scientist stays S4 T4 and strikes.
