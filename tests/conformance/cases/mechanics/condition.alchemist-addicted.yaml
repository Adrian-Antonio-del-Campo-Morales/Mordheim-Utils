  id: an-already-supplied-dose-is-not-duplicated-on-release
  fighters:
    first:
      collection: mordheim
      band_id: masters-of-horror-sylv
      profile_id: mad-scientist
      main_weapon_id: weapon.mace
      condition_ids: [condition.alchemist-addicted, condition.alchemist-aberrantius-vigortia]
      characteristics: *aa-scientist
    second:
      main_weapon_id: weapon.mace
      characteristics: *aa-opponent
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.alchemist-brew, value: 6}
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 3}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_initial: {first.strength: 4, first.toughness: 4}
  expect_rounds:
    0: {state.first.strength: 4, state.first.toughness: 4, attacks.0.wounded: true, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

