# --- Authored scenarios ---
# Fixtures: the printed Mad Scientist with fixture characteristics WS3 S3 T3 W2 I5 A1 (printed Ld8
# stays), mace; hand-built opponent (WS3 S3 T3 W3 I2 A1 Ld7, mace); already engaged, no charge.  WS3
# against WS3 hits on 4+; S4 wounds T3 on 3+; no armour die exists (the S4 save modifier has no armour
# to act on).  The Scientist strikes first (I5 over I2) whenever he strikes at all.

# The release: the 6 at the start of his own turn ends the restriction that turn, supplies S4 T4 once,
# his blow lands with Strength 4, and no brew die is asked in his next own turn (round 2).
- audit_id: mechanic/condition.alchemist-addicted
  id: a-brew-of-six-at-the-start-of-his-own-turn-releases-the-scientist-that-turn
  fighters:
    first:
      collection: mordheim
      band_id: masters-of-horror-sylv
      profile_id: mad-scientist
      main_weapon_id: weapon.mace
      condition_ids: [condition.alchemist-addicted]
      characteristics: &aa-scientist {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: &aa-opponent {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 3
  rolls:
    - {key: round.0.first.alchemist-brew, value: 6}
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 3}
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.1.first.attack.0.hit, value: 1}
    - {key: round.1.second.attack.0.hit, value: 1}
    - {key: round.2.first.attack.0.hit, value: 1}
    - {key: round.2.second.attack.0.hit, value: 1}
  expect_initial: {first.strength: 3, first.toughness: 3, first.wounds: 2}
  expect_rounds:
    0: {state.first.strength: 4, state.first.toughness: 4, state.first.wounds: 2, attacks.0.wounded: true, state.second.wounds: 2}
    2: {state.first.strength: 4, state.first.toughness: 4}
  expect_final: {rounds_executed: 3, termination_reason: horizon}

