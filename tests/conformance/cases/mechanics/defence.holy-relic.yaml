# --- Authored scenarios ---
# mechanic/defence.holy-relic — one automatic Leadership pass per bearer, never
# per copy.
#
# Expectations come from the printed rule and the admitted clauses
# `first-leadership-pass--scope--first-leadership-pass` and
# `first-leadership-pass--scope--single-relic-rule` of
# the knowledge-base clause contracts (sources/knowledge), never from engine output:
# "A model with a holy relic will automatically pass the first Leadership test he
# is required to make in the game ... owning two or more holy relics will not
# allow him to ignore second and subsequent tests."  The relic is carried, not
# equipped: it is declared through `owned_item_ids`, which is how the printed
# carried item grants the effect.
#
# The rule is observable in two independent ways.  First, an auto-passed test
# consumes no die at all, and the strict tape would fail if one were requested,
# so the state's spent-resource set is the observable that the single shared use
# happened.  Second, the same set proves that a following required test was NOT
# auto-passed: the recorded test is rolled normally and can fail.
#
# The required tests used here are the Fear test at the charge and the Stupidity
# test of a Head Injury.  Both are printed Leadership tests: the fear-causing
# opponent charges the bearer, and the Head Injury result 6 of the printed
# Disability table makes a group "subject to Stupidity".  A failed charge fear
# test cancels the charge, which is why the second scenario terminates as
# disengaged instead of reaching the attack phase.
#
# The first scenario declares the shared profiles and duel context as YAML
# anchors; the sibling aliases them and keeps its own Leadership dice.

- audit_id: mechanic/defence.holy-relic
  id: holy-relic-passes-the-first-leadership-test-without-a-die
  covers: [first-leadership-pass--scope--first-leadership-pass]
  fighters:
    first:
      main_weapon_id: weapon.mace
      owned_item_ids: [holy_relic]
      characteristics: &relic-bearer-ws3-s3-t3-w2-i5-ld8 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 8}
    second:
      main_weapon_id: weapon.mace
      trait_overrides: {causes_fear: true}
      characteristics: &fear-causer-ws3-s3-t3-w2-i2-ld8 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 8}
  duel_context: &charging-first {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.resources_spent: [leadership.holy-relic], state.first.condition: STANDING, attacks.0.wounded: false, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The once-per-game use is spent by the first required test, so the next required
# test of the same bearer is rolled: the Head Injury Stupidity test is
# auto-passed with no die, and the charge Fear test then rolls two dice and fails
# on a total of twelve against Leadership 8, so the charge is cancelled before
# any attack.

- audit_id: mechanic/defence.holy-relic
  id: holy-relic-does-not-pass-a-second-required-test
  covers: [first-leadership-pass--scope--first-leadership-pass, first-leadership-pass--scope--single-relic-rule]
  fighters:
    first:
      main_weapon_id: weapon.mace
      owned_item_ids: [holy_relic]
      characteristics: *relic-bearer-ws3-s3-t3-w2-i5-ld8
    second:
      main_weapon_id: weapon.mace
      trait_overrides: {causes_fear: true}
      characteristics: *fear-causer-ws3-s3-t3-w2-i2-ld8
  initial_state:
    first: {resources_spent: [disability.6]}
  duel_context: *charging-first
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.fear.charge.0, value: 6}
    - {key: round.0.first.fear.charge.1, value: 6}
  expect_rounds:
    0: {state.first.resources_spent: [disability.6, leadership.holy-relic], state.first.stupidity_failed: false, state.first.condition: STANDING}
  expect_final: {rounds_executed: 1, termination_reason: disengaged}

# The two siblings below declare the printed Head Injury result 6 (subject to
# Stupidity) as an initial resource, which is what asks for the first required
# Leadership test and what the relic's auto-pass spends its one use on.  The
# spent-resource set is therefore the declared entry together with the single
# relic use, and it never gains a second relic use.
#
# A second relic is a second copy of one carried item, not a second use: the
# bearer still spends exactly one shared resource and the second required test is
# still rolled and can fail, exactly as with a single relic.

- audit_id: mechanic/defence.holy-relic
  id: two-holy-relics-still-grant-only-one-pass
  covers: [first-leadership-pass--scope--single-relic-rule]
  fighters:
    first:
      main_weapon_id: weapon.mace
      owned_item_ids: [holy_relic, holy_relic]
      characteristics: *relic-bearer-ws3-s3-t3-w2-i5-ld8
    second:
      main_weapon_id: weapon.mace
      trait_overrides: {causes_fear: true}
      characteristics: *fear-causer-ws3-s3-t3-w2-i2-ld8
  initial_state:
    first: {resources_spent: [disability.6]}
  duel_context: *charging-first
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.fear.charge.0, value: 6}
    - {key: round.0.first.fear.charge.1, value: 6}
  expect_rounds:
    0: {state.first.resources_spent: [disability.6, leadership.holy-relic], state.first.stupidity_failed: false}
  expect_final: {rounds_executed: 1, termination_reason: disengaged}
