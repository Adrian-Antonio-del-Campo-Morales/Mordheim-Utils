# The supplied draught starts the printed Petru with one Wound more than it declares.
- audit_id: mechanic/condition.petru-fortitude
  id: the-fortitude-draught-grants-the-affected-hero-one-extra-wound
  fighters:
    first:
      &petru-fortitude-drinker
      collection: mordheim
      band_id: channel-rats-mim
      profile_id: petru
      main_weapon_id: weapon.mace
      condition_ids: [condition.petru-fortitude]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 4, attacks: 1}
    second:
      &petru-fortitude-opponent
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [], active_participant: first}
  initial_state: {second: {condition: OUT}}
  maximum_rounds: 1
  expect_initial: {first.wounds: 3}
  expect_final: {rounds_executed: 0, termination_reason: second_out}

