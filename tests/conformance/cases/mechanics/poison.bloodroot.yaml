# mechanic/poison.bloodroot - authored from the printed rule and the
# admitted `whole` clause, never from engine output.
# The coating doubles the wounds caused, so a single unsaved wound takes two
# points of a three-wound profile.
- audit_id: mechanic/poison.bloodroot
  id: bloodroot-inflicts-two-wounds
  fighters:
    first:
      main_weapon_id: weapon.mace
      main_poison_id: poison.bloodroot
      characteristics: &br-attacker {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: &br-defender {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1}
  duel_context: &br-context {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 2, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

