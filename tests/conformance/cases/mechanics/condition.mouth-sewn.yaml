# --- Authored scenarios ---
# Supplied-leader family model (mechanics/mechanic.leader-twelve.yaml): a hand-built borrower carries
# no band.* tag and is never offered a provider, so the real Mercenaries pair is used - the printed
# warriors profile (fixture Ld3) borrows from the printed mercenary-captain (Leader rule, fixture Ld8)
# supplied as a standing same-side nearby participant at the printed six inches.  The vehicle is the
# Fear test of the received charge from a hand-built fear-causer: 2d6 <= Leadership passes, so the
# declared 4+4 = 8 passes only through the borrowed 8 and fails the borrower's own 3; the printed
# consequence of a standing failure is state.second.fear_hit_sixes.  Both swings are natural 1s.

# The sewn mouth on the provider: no leader decision is offered at all (an offered borrow would
# request an undeclared decision), so the test stands on the borrower's own Leadership 3 and fails.
- audit_id: mechanic/condition.mouth-sewn
  id: without-the-sewn-mouth-the-same-leader-is-offered
  fighters:
    first:
      trait_overrides: {causes_fear: true}
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
    second:
      collection: mordheim
      band_id: mercenaries
      profile_id: warriors
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 7}
  duel_context:
    charging: [first]
    active_participant: first
    nearby:
      - participant_id: leader
        side_id: second
        condition: standing
        fighter:
          collection: mordheim
          band_id: mercenaries
          profile_id: mercenary-captain
          characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 8}
    distances:
      - [second, leader, 6]
  maximum_rounds: 1
  decisions:
    - {key: round.0.second.fear.charged.leader.leader, value: true}
  rolls:
    - {key: round.0.second.fear.charged.0, value: 4}
    - {key: round.0.second.fear.charged.1, value: 4}
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.fear_hit_sixes: false, state.first.wounds: 3, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The fact is read on the provider only: the printed consequence is that *leaders* cannot use their
# leader ability, so a borrower whose own mouth is sewn still takes its tests and still borrows from
# an unsewn leader - the borrow is offered and the eight passes through the captain's 8.
