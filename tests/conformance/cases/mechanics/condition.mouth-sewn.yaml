# Governing rulings: docs/decisions/design-rulings.md
# Record: sources/knowledge/catalog/mechanics/close-combat.yaml (condition.mouth-sewn, "Supplied Sewn
#   Mouth": "Supplied fact that this model's mouth was sewn shut by Needle and Thread, so it can no
#   longer use a leader ability. The leader borrow refuses a supplied provider carrying this fact;
#   sewing a duel opponent is the producer the duel itself can perform.")
# Semantic wrinkle (2026-11-18, recorded): the printed Needle and Thread also silences spell casting
#   (out-of-scope.magic, not bound here).  The duel's own producer (mechanic.needle-and-thread sets the
#   lasting FighterState field `mouth_sewn` on the stunned duelist) never feeds this consumer inside the
#   same duel: the borrow block reads the tag on a supplied nearby provider (modular/leadership.py:236-238),
#   and a duelist is never its own side's provider.  The two halves are therefore evidenced separately
#   (producer: mechanics/mechanic.needle-and-thread.yaml; consumer: this file).  No compiler gate exists
#   for the condition, so any build may carry it; the supplied row is catalog/rules/conditions.yaml.
#
# --- Authored scenarios ---
# Supplied-leader family model (mechanics/mechanic.leader-twelve.yaml): a hand-built borrower carries
# no band.* tag and is never offered a provider, so the real Mercenaries pair is used - the printed
# warriors profile (fixture Ld7) borrows from the printed mercenary-captain (Leader rule, fixture Ld8)
# supplied as a standing same-side nearby participant at the printed six inches.  The vehicle is the
# Fear test of the received charge from a hand-built fear-causer: 2d6 <= Leadership passes, so the
# declared 4+4 = 8 passes only through the borrowed 8 and fails the borrower's own 7; the printed
# consequence of a standing failure is state.second.fear_hit_sixes.  Both swings are natural 1s.

# The sewn mouth on the provider ("Leaders cannot then use their leader ability"): no leader decision
# is offered at all (an offered borrow would request an undeclared decision), so the test stands on
# the borrower's own Leadership 7 and fails.
- audit_id: mechanic/condition.mouth-sewn
  id: a-leader-with-a-sewn-mouth-lends-no-leadership
  fighters:
    first:
      trait_overrides: {causes_fear: true}
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
    second:
      collection: mordheim
      band_id: mercenaries
      profile_id: warriors
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 7}
  duel_context:
    charging: [first]
    active_participant: first
    nearby:
      - participant_id: leader
        side_id: second
        condition: standing
        fighter:
          collection: mordheim
          band_id: mercenaries
          profile_id: mercenary-captain
          condition_ids: [condition.mouth-sewn]
          characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 8}
    distances:
      - [second, leader, 6]
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.fear.charged.0, value: 4}
    - {key: round.0.second.fear.charged.1, value: 4}
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.fear_hit_sixes: true, state.first.wounds: 3, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

