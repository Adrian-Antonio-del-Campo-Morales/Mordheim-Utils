# AUTHORED: the 3 scenarios below cover the refused provider, the control without the fact and the
#   provider-only reading; REVIEWED still requires manual semantic review.
# Semantic wrinkle (2026-11-18, recorded): the printed Needle and Thread also silences spell casting
#   (out-of-scope.magic, not bound here).  The duel's own producer (mechanic.needle-and-thread sets the
#   lasting FighterState field `mouth_sewn` on the stunned duelist) never feeds this consumer inside the
#   same duel: the borrow block reads the tag on a supplied nearby provider (modular/leadership.py:236-238),
#   and a duelist is never its own side's provider.  The two halves are therefore evidenced separately
