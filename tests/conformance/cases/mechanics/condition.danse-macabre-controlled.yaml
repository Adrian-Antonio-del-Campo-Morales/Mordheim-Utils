# --- Authored scenarios ---
# Leadership 2D6: a total at or under Leadership passes.  Every strike is a natural 1 so no wound die
# exists; the controlled fighter declares Leadership 6.

# The failed re-test: 5+4 = 9 fails Leadership 6, the warrior keeps dancing (danse_macabre_controlled
# true) and its attack share is zero - the only attack die in the tape is the opponent's.
- audit_id: mechanic/condition.danse-macabre-controlled
  id: the-failed-own-recovery-retest-leaves-the-warrior-dancing-and-attackless
  fighters:
    first:
      &danse-controlled
      condition_ids: [condition.danse-macabre-controlled]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 4, attacks: 1, leadership: 6}
    second:
      &danse-opponent
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.danse-macabre.0, value: 5}
    - {key: round.0.first.danse-macabre.1, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.danse_macabre_controlled: true, attacks.0.hit: false, state.first.wounds: 2, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The passed re-test: 3+3 = 6 against Leadership 6 is the exact boundary; the state clears and the
# recovered warrior resumes attacking, so the pool carries both fighters' strikes.
- audit_id: mechanic/condition.danse-macabre-controlled
  id: the-passed-own-recovery-retest-clears-the-state-and-restores-the-attacks
  fighters:
    first: *danse-controlled
    second: *danse-opponent
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.danse-macabre.0, value: 3}
    - {key: round.0.first.danse-macabre.1, value: 3}
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.danse_macabre_controlled: false, state.first.wounds: 2, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The re-test belongs to the controlled warrior's own recovery: with the opponent active no
# danse-macabre die is asked, the state persists and the held warrior still contributes no attack.
- audit_id: mechanic/condition.danse-macabre-controlled
  id: with-the-controlled-side-inactive-no-retest-is-asked-and-its-attack-share-stays-empty
  fighters:
    first: *danse-opponent
    second: *danse-controlled
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.danse_macabre_controlled: true, attacks.0.hit: false, state.first.wounds: 2, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
