#
# AUTHORED: the printed "Oh no, not Snakes" (Khemri Dramatis Personae p.18, Heinrich Altdorf
#   Schmidt) is Fear whose direction is inverted: the BEARER is the one who fears, and only a snake
#   enemy (species.snake or species.serpent) causes it.  Consumer: modular/psychology.py
#   causes_fear() (mechanic.fear-of-snakes on the enemy of a species.snake/serpent fighter), then
#   resolve_fear()/needs_test() for the bearer's charge and charged tests.  REVIEWED still
#   requires manual semantic review.

# --- Authored scenarios ---
# Hand-built fixtures: the bearer injects the shared mechanic through skill_ids (WS3 S3 T3 W2 I5
# A1 Ld7); the enemy is the hand-built mace fixture (WS3 S3 T3 W3 I2 A1 Ld7) declaring the one
# fact the rule reads (species: snake or serpent; human for the absence case).  A snake species
# also compiles the animal tag, which nothing in these builds reads.  A 2D6 Fear test of 5+4 fails
# Ld7 and 3+3 passes; the failed charged test raises the bearer's hit target to 6, so his declared
# 4 misses where it hit before.  The enemy is silenced (attacks 0) where the bearer's hit target is
# the observable.  A failed charge test cancels the charge and the duel ends disengaged.

# A snake charges the bearer; his 9 fails Ld7 and his 4 now needs a 6.
- audit_id: mechanic/mechanic.fear-of-snakes
  id: the-bearer-charged-by-a-snake-that-fails-his-fear-test-hits-only-on-sixes
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.fear-of-snakes]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 7}
    second:
      main_weapon_id: weapon.mace
      trait_overrides: {species: snake}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [second], active_participant: second}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.fear.charged.0, value: 5}
    - {key: round.0.first.fear.charged.1, value: 4}
    - {key: round.0.first.attack.0.hit, value: 4}
  expect_rounds:
    0: {state.first.fear_hit_sixes: True, attacks.0.hit_target: 6, attacks.0.hit: False, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

