- audit_id: mechanic/condition.rememberer-kaz-support
  id: the-supplied-rememberer-rerolls-a-failed-to-hit-roll-against-a-large-creature
  # The printed benefit: once per game a Slayer Hero fighting a large creature and within six inches of the
  # allied Rememberer may re-roll any failed To Hit rolls once only.  The declared miss of two is taken again
  # on a four, which lands the hit; the declared wound face of two does not wound the Troll (Strength 3
  # against its own Toughness), so the tape reads the re-roll and nothing else and the Troll's Regeneration is
  # never reached.  The supplied Rememberer is a nearby same-side participant at the printed six inches.  The
  # `.hit.reroll` die is the corpus's own hit-re-roll route, so the tape fails on an unrequested die until the
  # row's unimplemented binding projects the granted re-roll - the PENDING implementation defect.  The printed
  # "once only" limit is recorded in the clause marker above.
  fighters:
    first:
      collection: mordheim
      band_id: dwarf-slayers-kaz
      profile_id: troll-slayers
      condition_ids: [condition.rememberer-kaz-support]
      main_weapon_id: weapon.mace
    second:
      collection: mordheim
      band_id: black-orcs
      profile_id: troll
      # Since the uniform Large Target binding (2026-11-18) the troll's own
      # band rule already grants size.large; the supplied condition is kept as
      # this scenario's declared fact and stacks harmlessly with it.
      condition_ids: [condition.large-target]
  duel_context:
    charging: []
    active_participant: first
    nearby:
      - participant_id: rememberer
        side_id: first
        condition: standing
        fighter: {collection: mordheim, band_id: dwarf-slayers-kaz, profile_id: rememberer}
    distances:
      - [first, rememberer, 6]
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.attack.0.rememberer, value: true}
  rolls:
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.first.attack.0.hit.reroll, value: 4}
    - {key: round.0.first.attack.0.wound, value: 2}
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.0.second.attack.1.hit, value: 1}
    - {key: round.0.second.attack.2.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: True, attacks.0.wounded: False, attacks.0.damage: 0, state.first.wounds: 1, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The printed limit (2026-11-18): the benefit is "once per game ... may re-roll any failed To Hit rolls
# once only".  The inputs are the first scenario's, extended to a second close-combat phase
# (maximum_rounds: 2) with the same declared miss of two in both.  In the first round the benefit is
# taken: the declared re-roll of four lands the hit and the declared wound of two does not wound the
# Troll.  In the second round the same failed To Hit roll stands: the printed "once per game" is spent,
# so the tape declares no `round.1.first.attack.0.hit.reroll` die and no second `rememberer` decision -
# under the strict runner an offered re-roll die or an offered decision would be an unscripted request
# and fail the case, so the absence is the assertion.  The Troll's three attacks are declared natural
# ones in both rounds, so nothing else enters either tape.
- audit_id: mechanic/condition.rememberer-kaz-support
  id: the-supplied-rememberer-reroll-is-offered-once-per-game-only
  fighters:
    first:
      collection: mordheim
      band_id: dwarf-slayers-kaz
      profile_id: troll-slayers
      condition_ids: [condition.rememberer-kaz-support]
      main_weapon_id: weapon.mace
    second:
      collection: mordheim
      band_id: black-orcs
      profile_id: troll
      condition_ids: [condition.large-target]
  duel_context:
    charging: []
    active_participant: first
    nearby:
      - participant_id: rememberer
        side_id: first
        condition: standing
        fighter: {collection: mordheim, band_id: dwarf-slayers-kaz, profile_id: rememberer}
    distances:
      - [first, rememberer, 6]
  maximum_rounds: 2
  decisions:
    - {key: round.0.first.attack.0.rememberer, value: true}
  rolls:
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.first.attack.0.hit.reroll, value: 4}
    - {key: round.0.first.attack.0.wound, value: 2}
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.0.second.attack.1.hit, value: 1}
    - {key: round.0.second.attack.2.hit, value: 1}
    # The Troll's own printed Stupidity is tested from the second round onwards; both dice are
    # declared as natural ones so the test is passed and its three attacks still happen.
    - {key: round.1.second.stupidity.0, value: 1}
    - {key: round.1.second.stupidity.1, value: 1}
    - {key: round.1.first.attack.0.hit, value: 2}
    - {key: round.1.second.attack.0.hit, value: 1}
    - {key: round.1.second.attack.1.hit, value: 1}
    - {key: round.1.second.attack.2.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: True, attacks.0.wounded: False, attacks.0.damage: 0, state.first.wounds: 1, state.second.wounds: 3}
    1: {attacks.0.hit: False, attacks.0.damage: 0, state.first.wounds: 1, state.second.wounds: 3}
  expect_final: {rounds_executed: 2, termination_reason: horizon}
