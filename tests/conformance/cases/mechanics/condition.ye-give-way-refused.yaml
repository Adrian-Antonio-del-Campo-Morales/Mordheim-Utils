# --- Authored scenarios ---
# Fixture arithmetic: WS3 against WS3 hits on 4+; the printed -1 makes the target a 5, so a 4 misses
# and a 5 still hits.  Both sides are hand-built fixtures (W2 keeps every failure short of an injury
# roll) and the opponent's own swing is a scripted miss.

# The refusal boundary: the bearer's 4, a hit under the normal rules, misses under the printed -1.
- audit_id: mechanic/condition.ye-give-way-refused
  id: the-refused-heroes-four-misses-in-melee
  fighters:
    first:
      main_weapon_id: weapon.mace
      condition_ids: [condition.ye-give-way-refused]
      trait_overrides: {fighter_kind: hero}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: False, attacks.0.hit_target: 5, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The penalty is exactly one, as printed: a 5 still hits through the refusal and the blow lands.
- audit_id: mechanic/condition.ye-give-way-refused
  id: a-five-still-hits-through-the-refusal
  fighters:
    first:
      main_weapon_id: weapon.mace
      condition_ids: [condition.ye-give-way-refused]
      trait_overrides: {fighter_kind: hero}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 5}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: True, attacks.0.hit_target: 5, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The control: the identical Hero without the supplied refusal hits on the same 4, so the missed 4
# above is attributable to the condition and not to the build shape.
- audit_id: mechanic/condition.ye-give-way-refused
  id: without-the-supplied-refusal-the-same-four-hits
  fighters:
    first:
      main_weapon_id: weapon.mace
