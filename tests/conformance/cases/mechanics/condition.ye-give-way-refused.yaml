# The printed recipient is "the Hero who refused": a non-Hero recipient of the supplied refusal is
# refused by the compiler's own supplied-condition gate.
- audit_id: mechanic/condition.ye-give-way-refused
  id: a-non-hero-recipient-of-the-refusal-is-refused
  fighters:
    first:
      main_weapon_id: weapon.mace
      condition_ids: [condition.ye-give-way-refused]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
  expect_error: "Ye Give Way refusal requires the challenged Hero recipient"
