# Conformance authoring scaffold; generated comments, manually authored scenarios.
# audit_id: mechanic/weapon.draich-druchii
# authoring_status: AUTHORED
# authoring_progress: 5 scenarios and 1 refusal pin the printed +2 Strength at its wound
#   boundary (a 2 wounds T3 with the draich, the same 2 fails with a mace), the printed
#   Swift clause (no strike-last: the higher-Initiative bearer resolves first, where the
#   ordinary great weapon's sibling duel reverses the same dice), the compiled statline
#   (+2 S, two-handed, no priority tier, no parry) and the two-handed occupancy refusal
#   (equipment-items batch 2026-11-18).  REVIEWED still requires manual semantic review
#   and execution_status stays UNEXECUTED.
# execution_status: UNEXECUTED (this scaffold has no behavioral result)
#
# Derive inputs and expectations from rule text and accepted rulings.
# Do not derive them from the engine or execute combat during authoring.
# REVIEWED requires semantic review; covers labels alone are insufficient.
# Preserve audit_id when filling this file.
# Governing rulings: docs/decisions/design-rulings.md
# Record: sources/knowledge/catalog/mechanics/close-combat.yaml
#
# AUTHORED: 5 scenarios and 1 refusal cover the +2 Strength wound boundary with
#   its mace control, the absent strike-last tier against the ordinary great
#   weapon's sibling order, the compiled statline and the two-handed occupancy.

# --- Authored scenarios ---
# mechanic/weapon.draich-druchii - the Druchii Executioners' draich (mordheimer.net,
# Druchii special equipment): "Strength: As user +2.  Special Rules: Two-handed,
# Swift.  Unlike other double-handed weapons, it does not Strike last.  This
# printed variant carries no parry, Concussion or Critical Hit bonus."  It is a
# different print from the canonical weapon.draich (which parries, Concusses and
# adds +1 on the critical table); only the Strength and the hands are shared.
#
# Expectations come from the printed text, never from engine output.  S3 +2 = S5
# against T3 wounds on a 2+, so the wound die 2 is the boundary: it wounds with
# the draich and fails with the mace control.  The strike-order pair reuses the
# double-handed-weapon contrast: the same uncharged dice resolve bearer-first
# with the draich (Swift) and defender-first with the ordinary great weapon.

# The printed +2 Strength at its boundary: the wound die 2 reaches the S5 target
# against T3, and the injury 1 leaves the single-wound defender Knocked Down.
- audit_id: mechanic/weapon.draich-druchii
  id: druchii-draich-wounds-at-the-boosted-strength
  fighters:
    first:
      main_weapon_id: weapon.draich-druchii
      characteristics: &dd-attacker {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: &dd-defender-w1 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 2, attacks: 1}
  duel_context: &dd-charging-first {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 2}
    - {key: round.0.first.attack.0.injury.0, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 1, state.second.wounds: 0, state.second.condition: KNOCKED_DOWN}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The mace control: the identical wound die 2 is two faces below the unboosted S3
# target against T3, so the Strength is the draich's own.
- audit_id: mechanic/weapon.draich-druchii
  id: the-same-wound-die-fails-without-the-draich
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: *dd-attacker
    second:
      main_weapon_id: weapon.mace
      characteristics: *dd-defender-w1
  duel_context: *dd-charging-first
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 2}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 0, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# Swift: neither fighter charges, so the draich bearer's higher Initiative
# resolves first, exactly as an ordinary one-handed weapon would.  The compiled
# weapon shows the printed statline: +2 Strength, two-handed, no strike-last tier
# and no parry.
- audit_id: mechanic/weapon.draich-druchii
  id: the-druchii-draich-strikes-in-ordinary-initiative-order
  fighters:
    first:
      main_weapon_id: weapon.draich-druchii
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: &dd-defender-w2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.wounds: 2, state.second.wounds: 2}
  expect_fighters:
    first.main_weapon.strength_bonus: 2
    first.main_weapon.two_handed: true
    first.main_weapon.priority: 0
    first.main_weapon.parry: false
  expect_final: {rounds_executed: 1, termination_reason: horizon}
  expect_events:
    - {kind: roll, key: round.0.first.attack.0.hit, sides: 6, value: 1}
    - {kind: roll, key: round.0.second.attack.0.hit, sides: 6, value: 1}

# The sibling contrast: the ordinary double-handed weapon in the same duel DOES
# print strike-last, so the identical dice resolve in the opposite order.  The
# pair isolates the Swift clause.
- audit_id: mechanic/weapon.draich-druchii
  id: the-ordinary-great-weapon-sibling-strikes-last-instead
  fighters:
    first:
      main_weapon_id: weapon.double-handed-weapon
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: *dd-defender-w2
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.0.first.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.wounds: 2, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
  expect_events:
    - {kind: roll, key: round.0.second.attack.0.hit, sides: 6, value: 1}
    - {kind: roll, key: round.0.first.attack.0.hit, sides: 6, value: 1}

# No printed parry: the draich bearer, struck on a 4, is offered no parry die and
# the wound is taken - the strict tape holds no parry request.
- audit_id: mechanic/weapon.draich-druchii
  id: the-druchii-draich-offers-no-parry
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: *dd-attacker
    second:
      main_weapon_id: weapon.draich-druchii
      characteristics: *dd-defender-w2
  duel_context: *dd-charging-first
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.parried: false, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The printed two-handed occupancy is declared as a refusal.
- audit_id: mechanic/weapon.draich-druchii
  id: the-druchii-draich-occupies-both-hands-so-an-off-hand-weapon-is-refused
  fighters:
    first:
      main_weapon_id: weapon.draich-druchii
      off_hand_id: weapon.dagger
    second:
      main_weapon_id: weapon.mace
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  expect_error: "main weapon occupies both hands"
