# --- Authored scenarios ---
# Printed carrier: Cursed Cavalcade special skill Noblesse Obliges (bands/mordheim/cursed-cavalcade/
# special-rules.yaml band--cursed-cavalcade-special-skills-noblesse-obliges, selectable; it also binds
# mechanic.fear-immunity, its own identity): "can stomp opponents who are knocked down with his iron-shod
# boots.  This gives them additional attack against Knocked down opponents at their own Strength."
# Consumer: modular/rounds.py ~1418 (the stomp counts as an extra attack of the bearer while the target is
# KNOCKED_DOWN) and ~1483-1490 (one stomp event with a bare rule.noblesse-stomp weapon - Strength as user -
# on key round.<i>.<side>.stomp.attack.0.*).  Model: the AUTHORED Cursed Cavalcade grant file
# (...b8e73cdb813d) on the real Aristocrat with a dagger; here the operator is injected through skill_ids
# on the hand-built fixture (WS3 S3 T3 W2 I5 A1 Ld7, mace).  The opponent is the mace fixture (WS3 S3 T3
# W3 I2 A1 Ld7), silenced with attacks 0 (it carries a mace, so no fist swing survives) and declared
# Knocked Down through initial_state where the clause's condition applies.  A Knocked Down warrior is hit
# automatically (no hit die) and is taken out of action by any wound it suffers.
# Semantic wrinkle (2026-11-18): the print names Knocked Down only; a Stunned opponent is not asserted.

# The stomp: against the Knocked Down fixture the ordinary attack (wound 1, fails) is followed by the
# stomp's own wound die (4, S3 against T3); the helpless defender wounded is out of action.
- audit_id: mechanic/mechanic.noblesse-stomp
  id: the-stomp-adds-one-attack-against-a-knocked-down-opponent
  fighters:
    first:
      &bearer
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.noblesse-stomp]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 7}
    second:
      &opponent
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  initial_state: {second: {condition: KNOCKED_DOWN, attacks: 0}}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.wound, value: 1}
    - {key: round.0.first.stomp.attack.0.wound, value: 4}
  expect_rounds:
    0: {attacks.0.hit: true, attacks.0.wounded: false, attacks.1.hit: true, attacks.1.wounded: true,
        attacks.1.damage: 1, state.second.condition: OUT}
  expect_final: {rounds_executed: 1, termination_reason: second_out}

# Against a standing opponent no stomp is allocated: the ordinary attack hits and wounds (no armour, no
# save die) and the round ends after that one Wound.
- audit_id: mechanic/mechanic.noblesse-stomp
  id: without-a-knocked-down-opponent-there-is-no-stomp
  fighters:
    first:
      <<: *bearer
    second:
      <<: *opponent
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
  expect_rounds:
    0: {attacks.0.damage: 1, state.second.wounds: 2, state.second.condition: STANDING}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The control: without the operator the Knocked Down opponent receives the ordinary attack alone (its
# wound of 1 fails), so no stomp die is requested and the defender stays Knocked Down at full Wounds.
- audit_id: mechanic/mechanic.noblesse-stomp
  id: without-the-operator-the-knocked-down-opponent-is-not-stomped
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 7}
    second:
      <<: *opponent
  initial_state: {second: {condition: KNOCKED_DOWN, attacks: 0}}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.wound, value: 1}
  expect_rounds:
    0: {attacks.0.hit: true, attacks.0.wounded: false, state.second.wounds: 3, state.second.condition: KNOCKED_DOWN}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
