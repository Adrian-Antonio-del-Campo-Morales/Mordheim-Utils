#
# AUTHORED: the printed Skull Rack ("The bearer causes fear in all Beastmen", Town Cryer 28) is
#   Fear scoped to the enemy's species: only an enemy that is a Beastman (species.beastman) takes
#   the ordinary Fear tests against the bearer.  Consumer: modular/psychology.py causes_fear()
#   (mechanic.fear-beastmen on the fighter against species.beastman on the enemy), then
#   resolve_fear()/needs_test() for the charge and charged tests.  REVIEWED still requires manual
#   semantic review.

# --- Authored scenarios ---
# Hand-built fixtures: the bearer injects the shared mechanic through skill_ids (WS3 S3 T3 W2 I5
# A1 Ld7); the enemy is the hand-built mace fixture (WS3 S3 T3 W3 I2 A1 Ld7) that declares the
# one fact the rule reads (species: beastman, or human for the absence case).  A 2D6 Fear test of
# 5+4 fails Ld7 and 3+3 passes it; the failed charged test raises the enemy's hit target to 6, so
# its declared 4 (a hit on the ordinary 4+) misses.  The bearer is silenced (attacks 0) where the
# enemy's hit target is the observable.  A failed charge test cancels the charge: no blow is struck
# and the duel ends disengaged.

# The bearer charges a Beastman; the charged Beastman's 9 fails Ld7 and its 4 now needs a 6.
- audit_id: mechanic/mechanic.fear-beastmen
  id: a-charged-beastman-that-fails-its-fear-test-hits-only-on-sixes
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.fear-beastmen]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 7}
    second:
      main_weapon_id: weapon.mace
      trait_overrides: {species: beastman}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  initial_state: {first: {attacks: 0}}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.fear.charged.0, value: 5}
    - {key: round.0.second.fear.charged.1, value: 4}
    - {key: round.0.second.attack.0.hit, value: 4}
  expect_rounds:
    0: {state.second.fear_hit_sixes: True, attacks.0.hit_target: 6, attacks.0.hit: False, state.first.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

