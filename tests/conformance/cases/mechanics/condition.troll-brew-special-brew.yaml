- audit_id: mechanic/condition.troll-brew-special-brew
  id: two-brew-results-on-one-build-are-refused
  fighters:
    first:
      collection: mordheim
      band_id: dwarf-guildsmen-kaz
      profile_id: apprentices
      condition_ids: [condition.troll-brew-special-brew, condition.troll-brew-fear-immunity]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 7}
  expect_error: "choose only one supplied result of the same potion table"
