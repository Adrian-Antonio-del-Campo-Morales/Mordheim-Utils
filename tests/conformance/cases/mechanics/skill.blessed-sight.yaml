# authoring_status: AUTHORED
# authoring_progress: the admitted whole-rule clause carries three authored scenarios derived from the printed rule and the recorded contract (a failed characteristic test rerolled into a pass and rerolled into a second failure, and a missed close-combat hit rerolled); the excluded Exploration dice stay outside the duel. REVIEWED still requires manual semantic review and execution_status stays UNEXECUTED.
# execution_status: UNEXECUTED (this scaffold has no behavioral result)
