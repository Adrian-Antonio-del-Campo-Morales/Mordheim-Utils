# --- Authored scenarios ---
# Printed text (grade-1b.yaml, Inured to Pain): "All Injury rolls against the Gaoler have -1. An Injury
# result of zero ignores the damage entirely."  Family model: the bearer is a hand-built defender carrying
# only this mechanic through skill_ids (WS3 S3 T3 W2 I5 A1, mace), silenced (attacks: 0) and brought to
# its last Wound (initial_state wounds: 1) so the attacker's single wounding blow reaches the Injury
# table; the attacker is hand-built (WS3 S3 T3 W3 I2 A1 Ld7, axe) and charges.  Arithmetic: 4 hits
# (WS3 vs WS3), 4 wounds (S3 vs T3; a 6 would add a critical die), no save is owned.  Ordinary table:
# 1-2 knocked down, 3-4 stunned, 5-6 out of action; with -1 the roll of 1 totals zero.

# A roll of 1 totals zero: the damage is ignored entirely, the Wound is kept and the bearer stays standing.
- audit_id: mechanic/mechanic.inured-to-pain
  id: an-injury-roll-reduced-to-zero-ignores-the-damage-entirely
  fighters:
    first:
      &bearer
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.inured-to-pain]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      &attacker
      main_weapon_id: weapon.axe
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  initial_state: {first: {attacks: 0, wounds: 1}}
  duel_context: {charging: [second], active_participant: second}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.attack.0.hit, value: 4}
    - {key: round.0.second.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.injury.0, value: 1}
  expect_rounds:
    0: {attacks.0.hit: True, attacks.0.damage: 0, state.first.wounds: 1, state.first.condition: STANDING}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# A roll of 2 totals 1: the Wound is lost and the bearer is knocked down.
- audit_id: mechanic/mechanic.inured-to-pain
  id: an-injury-roll-of-two-still-knocks-the-bearer-down
  fighters:
    first:
      <<: *bearer
    second:
      <<: *attacker
  initial_state: {first: {attacks: 0, wounds: 1}}
  duel_context: {charging: [second], active_participant: second}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.attack.0.hit, value: 4}
    - {key: round.0.second.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.injury.0, value: 2}
  expect_rounds:
    0: {attacks.0.damage: 1, state.first.wounds: 0, state.first.condition: KNOCKED_DOWN}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

