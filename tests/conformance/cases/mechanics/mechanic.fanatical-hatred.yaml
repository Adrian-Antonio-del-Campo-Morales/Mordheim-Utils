# --- Authored scenarios ---
# Printed source (Maximilian the Mad, mordheimer.net grade-1b Dramatis Personae, Fanatical): he hates
# the warbands the print lists - Orcs and Goblins (with the Black Orc, Forest Goblin and Horned Hunter
# lists), Skaven, the Undead, Beastmen, the Possessed, the Carnival of Chaos, the Sisters of Sigmar and
# Middenheimers - and so re-rolls his missed hits in the first round of combat against them, as the
# Hatred rule prints.  Family model (shared Hatred contract): the bearer is hand-built with the
# mechanic injected (WS3 S3 T3 W2 I5 A1, mace) and charges a hand-built opponent (WS3 S3 T3 W3 I2 A1
# Ld7, mace) that declares the one fact the rule reads: a supplied Mercenary origin
# (trait_overrides mercenary_origin, which the compiler projects as warband-group.human-mercenary plus
# mercenary-origin.<origin>), or a compiled band identity (a printed Carnival of Chaos Brethren,
# silenced, whose wound resolves on the ordinary Injury chart as in the hatred-chaotic-warband file).
# A natural 2 misses WS3 on 4+; the re-roll of 4 hits and S3 wounds T3 on 4+.

# A Middenheim Mercenary: the first-round miss is re-rolled, hits and wounds.
- audit_id: mechanic/mechanic.fanatical-hatred
  id: a-first-round-miss-is-rerolled-against-a-middenheim-mercenary
  fighters:
    first:
      &fanatic
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.fanatical-hatred]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      trait_overrides: {mercenary_origin: middenheim}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.first.attack.0.hit.reroll, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: true, attacks.0.damage: 1, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# A printed Carnival of Chaos warrior carries the hated band identity itself: the same re-roll.
- audit_id: mechanic/mechanic.fanatical-hatred
  id: a-first-round-miss-is-rerolled-against-a-carnival-of-chaos-warrior
  fighters:
    first:
      <<: *fanatic
    second:
      collection: mordheim
      band_id: carnival-of-chaos
      profile_id: brethren
  initial_state:
    second: {attacks: 0}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.first.attack.0.hit.reroll, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.injury.0, value: 3}
  expect_rounds:
    0: {attacks.0.hit: true, attacks.0.damage: 1, state.second.condition: STUNNED}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# A Reikland Mercenary is a human warband the print never names: no re-roll key and the 2 stands.
- audit_id: mechanic/mechanic.fanatical-hatred
  id: the-same-miss-stands-against-a-reikland-mercenary
  fighters:
    first:
      <<: *fanatic
    second:
      main_weapon_id: weapon.mace
      trait_overrides: {mercenary_origin: reikland}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: false, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
