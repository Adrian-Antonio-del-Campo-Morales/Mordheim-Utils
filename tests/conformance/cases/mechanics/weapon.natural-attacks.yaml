# Re-authored 2026-11-16 on the real recipient (the scenario
# `the-printed-plague-cart-guardian-keeps-its-fist-strength` of the retired Guardian Unarmed identity was
# lost while that identity was folded into this one).  The printed Plague Cart "and its Guardian cannot use
# weapons or wear armour"; a profile with no equipment lists fights with its natural attacks, so the Guardian
# strikes at its printed Strength 3 with no unarmed penalty: a wound roll of 4 wounds Toughness 3, where a
# penalised fist (Strength 2) would need 5.  No armour die: natural attacks give the target no +1 save.
- audit_id: mechanic/weapon.natural-attacks
  id: the-printed-plague-cart-guardian-strikes-at-its-printed-strength
  fighters:
    first:
      collection: mordheim
      band_id: carnival-of-chaos
      profile_id: plague-cart
      characteristics: {weapon_skill: 3, strength: 3, toughness: 8, wounds: 4, initiative: 3, attacks: 1, leadership: 7}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
  expect_rounds:
    0: {attacks.0.hit: true, attacks.0.wounded: true, attacks.0.damage: 1, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
