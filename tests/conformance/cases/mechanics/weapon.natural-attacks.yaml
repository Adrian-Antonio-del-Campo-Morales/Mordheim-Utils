# --- Authored scenarios ---
# mechanic/weapon.natural-attacks - innate claws that use the model profile and
# leave no off-hand weapon.
#
# Expectations come from the printed rule and the admitted clause `whole`, never
# from engine output.
# The innate profile resolves one attack, the model's own Attacks characteristic, with no weapon allocation.

- audit_id: mechanic/weapon.natural-attacks
  id: natural-attacks-use-the-model-profile
  fighters:
    first:
      main_weapon_id: weapon.natural-attacks
      characteristics: &a-ws3-s3-t3-w2-i5 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: &d-ws3-s3-t3-w2-i2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.wounds: 2, state.first.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
  expect_events:
    - {kind: roll, key: round.0.first.attack.0.hit, sides: 6, value: 1}
    - {kind: roll, key: round.0.second.attack.0.hit, sides: 6, value: 1}
# No weapon bonus leaks into the innate profile: Strength 3 wounds Toughness 3 on the ordinary 4+, so the 3 fails.

- audit_id: mechanic/weapon.natural-attacks
  id: natural-attacks-keep-the-model-strength
  fighters:
    first:
      main_weapon_id: weapon.natural-attacks
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 3}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 0, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# The printed absence of an off-hand weapon is declared as a refusal.

- audit_id: mechanic/weapon.natural-attacks
  id: natural-attacks-leave-no-off-hand-weapon
  fighters:
    first:
      main_weapon_id: weapon.natural-attacks
      off_hand_id: weapon.dagger
    second:
      main_weapon_id: weapon.mace
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  expect_error: "weapon.natural-attacks cannot be combined with weapon.dagger"

