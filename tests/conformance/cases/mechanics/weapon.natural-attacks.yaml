# Conformance authoring scaffold; generated comments, manually authored scenarios.
# audit_id: mechanic/weapon.natural-attacks
# authoring_status: AUTHORED
# authoring_progress: the admitted clause carries three authored scenarios for the innate attack pool, the model's own Strength and the refused off-hand. REVIEWED still requires manual semantic review and execution_status stays UNEXECUTED.
# execution_status: UNEXECUTED (this scaffold has no behavioral result)
#
# Note (2026-11-16): a profile with no equipment lists fights with its natural attacks (compiler
#   convention, the single source). The printed Natural Weapons rules, the Raging Peasants' penalty-free
#   unarmed rule and the Plague Cart Guardian's unarmed waiver now defer to it (covered.elsewhere);
#   their scenarios were moved here with the source entry in the id.
#
# Derive inputs and expectations from rule text and accepted rulings.
# Do not derive them from the engine or execute combat during authoring.
# REVIEWED requires semantic review; covers labels alone are insufficient.
# Preserve audit_id when filling this file.
# Governing rulings: docs/decisions/design-rulings.md
#
# AUTHORED: 3 scenarios cover the innate attack pool, the model's own Strength and the refused off-hand weapon.

# --- Authored scenarios ---
# mechanic/weapon.natural-attacks - innate claws that use the model profile and
# leave no off-hand weapon.
#
# Expectations come from the printed rule and the admitted clause `whole`, never
# from engine output.
# The innate profile resolves one attack, the model's own Attacks characteristic, with no weapon allocation.

- audit_id: mechanic/weapon.natural-attacks
  id: natural-attacks-use-the-model-profile
  fighters:
    first:
      main_weapon_id: weapon.natural-attacks
      characteristics: &a-ws3-s3-t3-w2-i5 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: &d-ws3-s3-t3-w2-i2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.wounds: 2, state.first.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
  expect_events:
    - {kind: roll, key: round.0.first.attack.0.hit, sides: 6, value: 1}
    - {kind: roll, key: round.0.second.attack.0.hit, sides: 6, value: 1}
# No weapon bonus leaks into the innate profile: Strength 3 wounds Toughness 3 on the ordinary 4+, so the 3 fails.

- audit_id: mechanic/weapon.natural-attacks
  id: natural-attacks-keep-the-model-strength
  fighters:
    first:
      main_weapon_id: weapon.natural-attacks
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 3}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 0, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# The printed absence of an off-hand weapon is declared as a refusal.

- audit_id: mechanic/weapon.natural-attacks
  id: natural-attacks-leave-no-off-hand-weapon
  fighters:
    first:
      main_weapon_id: weapon.natural-attacks
      off_hand_id: weapon.dagger
    second:
      main_weapon_id: weapon.mace
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  expect_error: "weapon.natural-attacks cannot be combined with weapon.dagger"

# The printed profile rule is not the Unarmed Fighting skill: it keeps the printed
# Strength and Attacks and does not grant the enemy the dagger-class +1 save.  The
# profile build below is what the compiler selects for this origin.
# The fist attack resolves at the bearer's printed Strength 3, so a four wounds an
# equal Toughness 3 where a penalised unarmed attack (Strength 2) would need a five.
- audit_id: mechanic/weapon.natural-attacks
  id: the-profile-fist-attacks-at-its-printed-strength--battle-monks-of-cathay--raging-peasants--unarmed
  fighters:
    first:
      collection: mordheim
      band_id: battle-monks-of-cathay
      profile_id: raging-peasants
      main_weapon_id: weapon.fist
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.wounded: True, attacks.0.damage: 1, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The second printed consequence: the enemy wears light armour, which saves on its own
# 6+, and the profile's fist does not hand it the dagger-class +1 save; with that +1 the
# same five would have saved.  The bearer's fists are still the printed unarmed attack,
# so the wound face above is the one a penalised fist would miss.
- audit_id: mechanic/weapon.natural-attacks
  id: the-fist-does-not-grant-the-enemy-the-dagger-save-bonus--battle-monks-of-cathay--raging-peasants--unarmed
  fighters:
    first:
      collection: mordheim
      band_id: battle-monks-of-cathay
      profile_id: raging-peasants
      main_weapon_id: weapon.fist
    second:
      main_weapon_id: weapon.mace
      armour_id: armour.light-armour
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.armour, value: 5}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.saved: False, attacks.0.damage: 1, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

