# --- Authored scenarios ---
# Printed text (grade-2b.yaml, Inquisitor): "At the beginning of each new round of combat roll a D6 for an
# opponent who is neither Undead nor a follower of Chaos. On a 6 apply a D66 Random Mutation as a brand.
# The Inquisitor is immune to Psychology."  Family model: the bearer is a hand-built fighter carrying only
# this mechanic through skill_ids (WS3 S3 T3 W2 I5 A1, mace), charging so it strikes first; the opponent is
# hand-built (WS3 S3 T3 W3 I2 A1 Ld7, mace) plus the one fact a clause reads.  Arithmetic: 4 hits (WS3 vs
# WS3); S3 wounds T3 on 4+ and the branded T2 on 3+, so the declared wound roll of 3 separates the branded
# opponent from the unbranded one; no save is owned and the fixture W3 keeps the tape off the injury table.

# The judgement die of 6 brands the opponent: tens 1 + units 2 = 12 (Emaciated Appearance, Toughness halved
# to 2) and the bearer's 3 now wounds.
- audit_id: mechanic/mechanic.solkan-inquisitor
  id: a-judgement-of-six-brands-the-opponent-and-the-wound-roll-reads-the-brand
  fighters:
    first:
      &bearer
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.solkan-inquisitor]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      &opponent
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.inquisitor.judgement, value: 6}
    - {key: round.0.first.inquisitor.mutation.tens, value: 1}
    - {key: round.0.first.inquisitor.mutation.units, value: 2}
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 3}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: True, attacks.0.wounded: True, attacks.0.damage: 1, state.second.wounds: 2,
        state.second.toughness: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# A judgement below 6 brands nothing: the same 3 fails against the unbranded T3.
- audit_id: mechanic/mechanic.solkan-inquisitor
  id: a-judgement-below-six-brands-nothing
  fighters:
    first:
      <<: *bearer
    second:
      <<: *opponent
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.inquisitor.judgement, value: 3}
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 3}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: True, attacks.0.wounded: False, state.second.wounds: 3, state.second.toughness: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# No judgement die is rolled for an Undead opponent: the strict tape holds none.
- audit_id: mechanic/mechanic.solkan-inquisitor
  id: no-judgement-is-rolled-for-an-undead-opponent
  fighters:
    first:
      <<: *bearer
    second:
      main_weapon_id: weapon.mace
      trait_overrides: {creature_kind: undead}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.wounds: 3, state.second.toughness: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

