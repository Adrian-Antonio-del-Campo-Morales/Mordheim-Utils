#
# AUTHORED: the printed Fear Elves (Chaos in the Streets p.133, Goblin Warriors) is Fear whose
#   direction is inverted: the BEARER fears, and any Elf enemy causes it.  Consumer:
#   modular/psychology.py causes_fear() (mechanic.fear-of-elves on the enemy of a fighter tagged
#   species.elf, species.high-elf, species.dark-elf or species.wood-elf), then
#   resolve_fear()/needs_test() for the bearer's charge and charged tests; the compiler materialises
#   species.elf from any trait_overrides elf_kind and the kind tag from high|dark|wood.  REVIEWED
#   still requires manual semantic review.

# --- Authored scenarios ---
# Hand-built fixtures: the bearer injects the shared mechanic through skill_ids (WS3 S3 T3 W2 I5
# A1 Ld7); the enemy is the hand-built mace fixture (WS3 S3 T3 W3 I2 A1 Ld7) declaring the one
# fact the rule reads (elf_kind; human for the absence case).  A 2D6 Fear test of 5+4 fails Ld7
# and 3+3 passes; the failed charged test raises the bearer's hit target to 6, so his declared 4
# misses where it hit before.  The enemy is silenced (attacks 0) where the bearer's hit target is
# the observable.  A failed charge test cancels the charge and the duel ends disengaged.

# A Dark Elf charges the bearer; his 9 fails Ld7 and his 4 now needs a 6.
- audit_id: mechanic/mechanic.fear-of-elves
  id: the-bearer-charged-by-a-dark-elf-that-fails-his-fear-test-hits-only-on-sixes
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.fear-of-elves]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 7}
    second:
      main_weapon_id: weapon.mace
      trait_overrides: {elf_kind: dark}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [second], active_participant: second}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.fear.charged.0, value: 5}
    - {key: round.0.first.fear.charged.1, value: 4}
    - {key: round.0.first.attack.0.hit, value: 4}
  expect_rounds:
    0: {state.first.fear_hit_sixes: True, attacks.0.hit_target: 6, attacks.0.hit: False, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

