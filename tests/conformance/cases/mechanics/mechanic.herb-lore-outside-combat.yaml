# Operator model: at the start of the active fighter's own turn a bearer below its maximum Wounds is offered
# `round.N.<label>.herb-lore` (decision, then a die; 4+ restores one wound).  The unrestricted mechanic.herb-lore
# offers it always; this carrier offers it only when the duel is not engaged.  The bearer is a hand-built
# fixture (WS3 S3 T3 W2 I5 A1 Ld7, mace) starting at one of its two wounds (initial_state), the opponent the
# hand-built fixture (WS3 S3 T3 W3 I2 A1 Ld7, mace); neither charges, so the duel is engaged from the start
# and both swings are declared natural 1s.

# Engaged, the bearer at a lost wound is offered nothing: the tape holds only the two swings and the wound
# stays lost.
- audit_id: mechanic/mechanic.herb-lore-outside-combat
  id: the-engaged-bearer-is-never-offered-the-healing-request
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.herb-lore-outside-combat]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 7}
    second:
      &opponent
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  initial_state: {first: {wounds: 1}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.wounds: 1, state.second.wounds: 3, state.engaged: true}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

