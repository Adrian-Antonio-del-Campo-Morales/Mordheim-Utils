# The knock-down takes the Frenzy away in the round it happens, and in the bearer's next own turn the
# Stupidity the clause prints applies normally again: the two sixes fail it and its attacks are barred.
- audit_id: mechanic/condition.fungus-brew-loony
  id: once-the-frenzy-is-lost-to-a-knockdown-the-stupidity-applies-again
  fighters:
    first:
      collection: mordheim
      band_id: night-goblins-web
      profile_id: night-goblin-fanatics
      condition_ids: [condition.fungus-brew-loony]
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 8, strength: 8, toughness: 3, wounds: 3, initiative: 1, attacks: 1, leadership: 7}
  duel_context: {charging: [second], active_participant: first}
  maximum_rounds: 3
  rolls:
    - {key: round.0.second.attack.0.hit, value: 4}
    - {key: round.0.second.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.injury.0, value: 1}
    - {key: round.1.second.attack.0.wound, value: 1}
    - {key: round.2.first.stupidity.0, value: 6}
    - {key: round.2.first.stupidity.1, value: 6}
    - {key: round.2.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.frenzy: false, state.first.condition: KNOCKED_DOWN, state.first.stupidity_failed: false}
    1: {state.first.condition: KNOCKED_DOWN}
    2: {state.first.stupidity_failed: true, state.first.condition: STANDING}
  expect_final: {rounds_executed: 3, termination_reason: horizon}

# Under the Mad Caps the printed composition holds the Frenzy, so no Stupidity die is asked for and
# the bearer strikes with its doubled pool.  The doubled pool is resolved as one pool: both To Hit
# dice are requested before the wound die of the attack that hit (tests/conformance/README.md,
# cases/mechanics/mechanic.black-hunger.yaml), and the hand-built opponent wears no armour, so no
# armour die exists to declare even though the wound carries one point of damage.
- audit_id: mechanic/condition.fungus-brew-loony
  id: the-mad-capped-bearer-rolls-no-stupidity-die-while-its-frenzy-holds
  fighters:
    first:
      collection: mordheim
      band_id: night-goblins-web
      profile_id: night-goblin-fanatics
      condition_ids: [condition.fungus-brew-loony]
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 1, attacks: 1, leadership: 7}
  duel_context: {charging: [second], active_participant: first}
  maximum_rounds: 1
  # The bearer carries no weapon in this fixture, so the printed one-attack cap of an unarmed
  # attack limits its pool to a single die even while Frenzy doubles the count: the doubled pool
  # is read from the surviving `frenzy` flag below, not from a second declared To Hit die.
  # The same unarmed profile hands the defender its +1 armour save, so the failing armour
  # die (five against the printed six) is part of the printed unarmed attack, not the clause.
  rolls:
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.0.first.attack.0.hit, value: 5}
    - {key: round.0.first.attack.0.wound, value: 5}
    - {key: round.0.first.attack.0.armour, value: 5}
  expect_rounds:
    0: {state.first.frenzy: true, state.first.stupidity_failed: false, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
