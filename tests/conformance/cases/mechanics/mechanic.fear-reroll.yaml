# --- Authored scenarios ---
# One failed Fear test, one offered reroll and the accepted second result which passes
# on a total of two: the charge stands and the attacks follow.
- audit_id: mechanic/mechanic.fear-reroll
  id: the-failed-fear-test-is-taken-again
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.fear-reroll]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 6}
    second:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.causes-fear]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 6}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.fear.charge.reroll, value: true}
  rolls:
    - {key: round.0.first.fear.charge.0, value: 6}
    - {key: round.0.first.fear.charge.1, value: 6}
    - {key: round.0.first.fear.charge.reroll.0, value: 1}
    - {key: round.0.first.fear.charge.reroll.1, value: 1}
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 1, state.first_charged: True, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# No decision is declared and none is requested: the reroll is printed for Fear, so
# the failed Stupidity test stands and the turn loses its attacks.
- audit_id: mechanic/mechanic.fear-reroll
  id: a-stupidity-test-is-not-offered-the-reroll
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.stupidity, mechanic.fear-reroll]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 6}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 6}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.stupidity.0, value: 6}
    - {key: round.0.first.stupidity.1, value: 6}
  expect_rounds:
    0: {attacks: [], state.first.stupidity_failed: True, state.first_charged: False, state.engaged: False}
  expect_final: {rounds_executed: 1, termination_reason: disengaged}

