#
# AUTHORED: 3 scenarios cover the supplied 1 (Stupidity test), 6 (Frenzy)
#   and the ordinary 2-5 band.  The 1D6 itself is a supplied start-of-turn fact.

# --- Authored scenarios ---
# The start-of-turn D6 is supplied by the tape.  A result of 1 makes the warrior stupid
# for that turn, so the own-turn Stupidity test follows and the two sixes fail it.
- audit_id: mechanic/mechanic.centigor-drunken
  id: a-roll-of-one-forces-the-stupidity-test
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.centigor-drunken]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 3}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.drunken, value: 1}
    - {key: round.0.first.stupidity.0, value: 6}
    - {key: round.0.first.stupidity.1, value: 6}
  expect_rounds:
    0: {attacks: [], state.first.stupidity_failed: True, state.first_charged: False, state.engaged: False}
  expect_final: {rounds_executed: 1, termination_reason: disengaged}
# A result of 6 is the printed Frenzy for that turn: no Stupidity test is resolved and
# the doubled attack pool strikes twice.
- audit_id: mechanic/mechanic.centigor-drunken
  id: a-roll-of-six-grants-frenzy
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.centigor-drunken]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 3}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  # The whole Frenzied pool rolls its To Hit dice first; each attack then resolves its
  # own To Wound in allocation order, and only afterwards does the standing opponent
  # make its single reply.
  rolls:
    - {key: round.0.first.drunken, value: 6}
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.1.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.1.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 1, state.second.wounds: 1, state.first.frenzy: True, state.first.stupidity_failed: False}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# Nothing happens on the ordinary results: one attack, no Frenzy, no Stupidity test.
- audit_id: mechanic/mechanic.centigor-drunken
  id: results-two-to-five-do-nothing
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.centigor-drunken]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 3}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.drunken, value: 3}
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 1, state.second.wounds: 1, state.first.frenzy: False, state.first.stupidity_failed: False}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

