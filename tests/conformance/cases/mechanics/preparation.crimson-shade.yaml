- audit_id: mechanic/preparation.crimson-shade
  id: crimson-shade-adds-one-strength-and-a-rolled-initiative-bonus
  fighters:
    first:
      main_weapon_id: weapon.mace
      preparation_ids: [preparation.crimson-shade]
      characteristics: &cs-attacker {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: &cs-defender {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: &cs-context {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: first.crimson-shade, sides: 3, value: 3}
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 3}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 1, state.first.initiative: 8, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}


