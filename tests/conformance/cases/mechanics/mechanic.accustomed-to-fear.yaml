# Conformance authoring scaffold; generated comments, manually authored scenarios.
# audit_id: mechanic/mechanic.accustomed-to-fear
# authoring_status: AUTHORED
# authoring_progress: 6 authored scenarios (psy-tests-and-enemy-effects batch, 2026-11-18): the
#   bearer charged by a fear-causing Vampire, Skeleton or Spirit is asked no Fear die (three
#   scenarios), the bearer charging a Skeleton takes no charge test either, a fear-causer outside
#   the three printed kinds still forces the test, and the same Vampire charge is tested when the
#   bearer lacks the mechanic.  REVIEWED still requires manual semantic review.
# execution_status: UNEXECUTED (this scaffold has no behavioral result)
#
# Derive inputs and expectations from rule text and accepted rulings.
# Do not derive them from the engine or execute combat during authoring.
# REVIEWED requires semantic review; covers labels alone are insufficient.
# Preserve audit_id when filling this file.
# Governing rulings: docs/decisions/design-rulings.md
# Record: sources/knowledge/catalog/mechanics/close-combat.yaml
#
# AUTHORED: the printed Accustomed to Fear (Khemri p.86, 0-1 Beloved) exempts the bearer from Fear
#   caused by the three Undead kinds it names - Vampires, Skeletons and Spirits - and from nothing
#   else.  Consumer: modular/psychology.py needs_test() (mechanic.accustomed-to-fear on the bearer
#   against species.vampire, undead-kind.skeleton or undead-kind.spirit on the enemy returns
#   before any test); the compiler materialises those tags from trait_overrides vampire: true and
#   undead_kind: skeleton|spirit.  REVIEWED still requires manual semantic review.

# --- Authored scenarios ---
# Hand-built fixtures: the bearer injects the shared mechanic through skill_ids (WS3 S3 T3 W2 I5
# A1 Ld7); the enemy is the hand-built mace fixture (WS3 S3 T3 W3 I2 A1 Ld7) declaring causes_fear
# plus the one kind fact the rule reads.  The exempt bearer's own 4 hits on its ordinary 4+ and
# S3 wounds T3 on 4+, which is the positive evidence for the skip: a warrior that had taken and
# failed the Fear test would hit only on sixes.  A 2D6 Fear test of 5+4 fails Ld7.  The enemy is
# silenced (attacks 0) where the bearer's hit target is the observable.

# A fear-causing Vampire charges the bearer: no Fear die is asked and the bearer's 4 hits.
- audit_id: mechanic/mechanic.accustomed-to-fear
  id: no-fear-test-against-a-fear-causing-vampire
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.accustomed-to-fear]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 7}
    second:
      main_weapon_id: weapon.mace
      trait_overrides: {causes_fear: true, vampire: true}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [second], active_participant: second}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
  expect_rounds:
    0: {state.first.fear_hit_sixes: False, attacks.0.hit_target: 4, attacks.0.damage: 1, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

