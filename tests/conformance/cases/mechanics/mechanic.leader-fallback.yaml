# Conformance authoring scaffold; generated comments, manually authored scenarios.
# audit_id: mechanic/mechanic.leader-fallback
# authoring_status: AUTHORED
# authoring_progress: the undivided mechanic carries 3 authored scenarios derived from the printed
#   Second in Command sentence ("If the Witch Doctor's Leadership cannot be used, the Big Boss gains
#   the Leader rule with a 4\" range", Lustria p.100), through the real Savage Goblin profiles that
#   carry it: a usable standing Witch Doctor withholds the fallback (the strict decision tape proves
#   it), while a knocked-down or absent Witch Doctor leaves the Big Boss's four-inch borrow offered
#   and his Leadership 7 is the one tested.  REVIEWED still requires manual semantic review and
#   execution_status stays UNEXECUTED.
# execution_status: UNEXECUTED (this scaffold has no behavioral result)
#
# Derive inputs and expectations from rule text and accepted rulings.
# Do not derive them from the engine or execute combat during authoring.
# REVIEWED requires semantic review; covers labels alone are insufficient.
# Preserve audit_id when filling this file.
# Governing rulings: docs/decisions/design-rulings.md
# Record: sources/knowledge/catalog/mechanics/close-combat.yaml
#
# AUTHORED: the flag marks a conditional fallback Leader: his borrow is offered only while no other
#   usable same-band leader can lend his Leadership, and a fallback never suppresses itself.  The
#   carrier is the real Lustria Savage Goblins Big Boss (Leadership 7, whose printed rule also
#   carries the four-inch radius); the senior leader is the band's Witch Doctor (Leader, Leadership
#   6).  The borrower is the band's Trackers fixture (Leadership 6) with a supplied Stupidity test as
#   the Leadership-test vehicle.  Dice: 2d6 <= Leadership passes, so the declared 3+4=7 passes only
#   the Big Boss's 7 and fails both printed sixes.  A wrongly offered fallback or senior borrow would
#   request an undeclared leader decision and fail the strict tape.

# --- Authored scenarios ---
# The suppression itself: the standing Witch Doctor five inches away is usable (his own printed
# radius is six), so the fallback Big Boss at four inches is not offered at all.  The declined
# senior borrow leaves the borrower's own Leadership 6, which fails the declared seven and cancels
# the charge; an offered Big Boss decision would be undeclared and fail the tape.
- audit_id: mechanic/mechanic.leader-fallback
  id: a-usable-senior-leader-withholds-the-fallback
  fighters:
    first:
      collection: trollheim
      band_id: lustria-savage-goblins
      profile_id: trackers
      trait_overrides: {stupidity: true}
    second:
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 7}
  initial_state: {first: {attacks: 0}, second: {attacks: 0}}
  duel_context:
    first_id: first
    second_id: second
    charging: [first]
    active_participant: first
    distances: [[first, witch-doctor, 5], [first, big-boss, 4]]
    nearby:
      - participant_id: witch-doctor
        side_id: first
        condition: standing
        fighter: {collection: trollheim, band_id: lustria-savage-goblins, profile_id: witch-doctor}
      - participant_id: big-boss
        side_id: first
        condition: standing
        fighter: {collection: trollheim, band_id: lustria-savage-goblins, profile_id: big-boss}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.stupidity.leader.witch-doctor, value: false}
  rolls:
    - {key: round.0.first.stupidity.0, value: 3}
    - {key: round.0.first.stupidity.1, value: 4}
  expect_rounds:
    0: {attacks: [], state.first.stupidity_failed: true, state.first_charged: false, state.engaged: false}
  expect_final: {rounds_executed: 1, termination_reason: disengaged}

# A knocked-down senior leader cannot lend his Leadership, so the fallback is offered: the Big
# Boss's 7 is borrowed at four inches and the identical seven passes.
