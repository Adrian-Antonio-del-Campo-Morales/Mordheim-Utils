# (all three above) supply Great Thirster, so the pair evaluates the coupling whole.
- audit_id: mechanic/mechanic.curse-of-the-revenant
  id: a-bearer-without-great-thirster-is-refused-the-recovery-grant
  covers: [requires-great-thirster]
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.curse-of-the-revenant]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
