# --- Authored scenarios ---
# mechanic/mechanic.curse-of-the-revenant — every expectation below comes from the
# printed rule (at own-turn start recover at most one lost wound on 5+, unaffected
# by fire; requires Great Thirster) and the recorded contract, never from engine
# output.  The bearer carries the recovery tag and, because the printed rule
# requires it, Great Thirster as well; the attempt is taken at the start of the
# bearer's own turn and restores at most one wound.
- audit_id: mechanic/mechanic.curse-of-the-revenant
  id: a-five-restores-one-lost-wound-at-the-own-turn-start
  covers: [whole]
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.curse-of-the-revenant, mechanic.great-thirster]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  initial_state:
    first: {wounds: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.revenant, value: 5}
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

