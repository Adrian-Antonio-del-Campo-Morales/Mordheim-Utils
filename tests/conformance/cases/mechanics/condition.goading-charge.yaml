# --- Authored scenarios ---
# Both builds are weaponless fixtures and compile to fists; every strike is a natural 1 so no wound die
# exists.  Fear 2D6 / Leadership: a total at or under Leadership passes.

# The goaded animal charges the Musk bearer without a Leadership die and the combat resolves.
- audit_id: mechanic/condition.goading-charge
  id: the-goaded-animal-charges-the-musk-bearer-without-a-leadership-die
  fighters:
    first:
      &goading-musk-bearer
      skill_ids: [mechanic.hypnotic-musk]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 4, attacks: 1, leadership: 6}
    second:
      trait_overrides: {normal_animal: true}
      condition_ids: [condition.goading-charge]
      characteristics: {weapon_skill: 5, strength: 5, toughness: 3, wounds: 3, initiative: 3, attacks: 2, leadership: 5}
  duel_context: {charging: [second], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.0.second.attack.1.hit, value: 1}
    - {key: round.0.first.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.engaged: true, state.second_charged: true, state.first.wounds: 2, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The control: the same animal without the supplied Goading fact owes the Musk gate; 4+3 = 7 fails its
# Leadership 5 and the charge is cancelled, so the round holds no combat dice.
- audit_id: mechanic/condition.goading-charge
  id: without-the-goading-the-same-animal-owes-the-musk-test-and-its-charge-is-cancelled
  fighters:
    first: *goading-musk-bearer
    second:
      trait_overrides: {normal_animal: true}
      characteristics: {weapon_skill: 5, strength: 5, toughness: 3, wounds: 3, initiative: 3, attacks: 2, leadership: 5}
  duel_context: {charging: [second], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.hypnotic-musk-charge.0, value: 4}
    - {key: round.0.second.hypnotic-musk-charge.1, value: 3}
  expect_rounds:
    0: {state.engaged: false, state.second_charged: false, state.failed_charges: ['second']}
  expect_final: {rounds_executed: 1, termination_reason: disengaged}
