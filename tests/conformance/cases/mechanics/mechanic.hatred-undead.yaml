  id: the-printed-not-undead-golem-is-not-a-hatred-undead-target--khemri-stone-golem
  fighters:
    first:
      skill_ids: [mechanic.hatred-undead]
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 7}
    second: {collection: trollheim, band_id: khemri-tomb-guardians, profile_id: stone-golem}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.fear.charge.0, value: 1}
    - {key: round.0.first.fear.charge.1, value: 1}
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.0.second.attack.1.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 0}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
