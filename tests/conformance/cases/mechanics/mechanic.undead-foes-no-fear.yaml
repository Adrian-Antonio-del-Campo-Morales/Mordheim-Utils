# authoring_status: AUTHORED
# authoring_progress: 7 authored scenarios (psy-tests-and-enemy-effects batch, 2026-11-18): the
#   bearer charged by a fear-causing Vampire, Necromancer or Undead follower is asked no Fear die
#   (three scenarios), the bearer charging an Undead fear-causer takes no charge test either, a
#   living fear-causer still forces the test, a mere spellcaster is not a Necromancer and still
#   forces it, and the same Vampire charge is tested when the bearer lacks the mechanic.  REVIEWED
#   still requires manual semantic review.
# execution_status: UNEXECUTED (this scaffold has no behavioral result)
