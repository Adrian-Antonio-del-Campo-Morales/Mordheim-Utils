#
# AUTHORED: the printed Fearless Against the Undead Servants of Necromancers (Dreamwalkers, Cult of
#   Morr, band-wide: "they do not feel any fear when fighting both vampires and necromancers and
#   their undead followers") exempts the bearer from Fear caused by a Vampire, a Necromancer or an
#   Undead enemy and from nothing else; the KB binds it on the Dreamwalkers band rule
#   band--undead-foes-no-fear (its own authored file).  Consumer: modular/leadership.py
#   undead_foes_fear_immunity() (mechanic.undead-foes-no-fear on the bearer against
#   species.vampire, identity.necromancer or nature.undead on the enemy), read by
#   modular/psychology.py needs_test() and by resolve_local_leadership's fear short-circuit; the
#   compiler materialises those tags from trait_overrides vampire: true, necromancer: true and
#   creature_kind: undead, and a spellcaster: true is only identity.spellcaster.  REVIEWED still
#   requires manual semantic review.

# --- Authored scenarios ---
# Hand-built fixtures: the bearer injects the shared mechanic through skill_ids (WS3 S3 T3 W2 I5
# A1 Ld7); the enemy is the hand-built mace fixture (WS3 S3 T3 W3 I2 A1 Ld7) declaring causes_fear
# plus the one identity fact the rule reads.  The exempt bearer's own 4 hits on its ordinary 4+
# and S3 wounds T3 on 4+, the positive evidence for the skip: a warrior that had taken and failed
# the Fear test would hit only on sixes.  A 2D6 Fear test of 5+4 fails Ld7.  The enemy is silenced
# (attacks 0) where the bearer's hit target is the observable.

# A fear-causing Vampire charges the bearer: no Fear die is asked and the bearer's 4 hits.
- audit_id: mechanic/mechanic.undead-foes-no-fear
  id: no-fear-test-against-a-fear-causing-vampire
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.undead-foes-no-fear]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 7}
    second:
      main_weapon_id: weapon.mace
      trait_overrides: {causes_fear: true, vampire: true}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [second], active_participant: second}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
  expect_rounds:
    0: {state.first.fear_hit_sixes: False, attacks.0.hit_target: 4, attacks.0.damage: 1, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

