# "Undead are knocked down as normal": the Undead victim's own No Pain turns the
# artefact's Stunned 1 into Knocked Down.
- audit_id: mechanic/weapon.count-of-ventimiglias-misericordia
  id: an-undead-victim-with-no-pain-is-knocked-down-on-the-stunned-face
  fighters:
    first:
      main_weapon_id: weapon.count-of-ventimiglias-misericordia
      characteristics: *cm-bearer
    second:
      main_weapon_id: weapon.mace
      skill_ids: [skill.ignore-pain]
      trait_overrides: {creature_kind: undead}
      characteristics: *cm-victim-w1
  duel_context: *cm-charging-first
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.injury.0, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 1, state.second.wounds: 0, state.second.condition: KNOCKED_DOWN}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# "Treated as a sword": the bearer is hit on a 4 and the misericordia's parry die 5
# beats it, so no wound die is reached.
- audit_id: mechanic/weapon.count-of-ventimiglias-misericordia
  id: misericordia-parries-as-a-sword
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.count-of-ventimiglias-misericordia
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: *cm-charging-first
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.parry, value: 5}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.parried: true, attacks.0.wounded: false, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The ordinary sword control: the identical injury die 1 is Knocked Down on the
# printed chart, so the Stunned 1 is the artefact's own.
- audit_id: mechanic/weapon.count-of-ventimiglias-misericordia
  id: an-ordinary-sword-knocks-down-on-the-same-die
  fighters:
    first:
      main_weapon_id: weapon.sword
      characteristics: *cm-bearer
    second:
      main_weapon_id: weapon.mace
