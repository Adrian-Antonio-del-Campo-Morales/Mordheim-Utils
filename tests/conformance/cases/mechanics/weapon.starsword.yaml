# The worn 5+ suit never gets an armour die: the ordered tape jumps from the
# wound roll straight to the opposing attack, and the wound is taken.
- audit_id: mechanic/weapon.starsword
  id: starsword-denies-a-worn-suit-its-save
  covers: [whole]
  fighters:
    first:
      main_weapon_id: weapon.starsword
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      armour_id: armour.heavy-armour
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 5}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# A parry must beat the to-hit roll, so a 5 blocks a hit that landed on a 4.
- audit_id: mechanic/weapon.starsword
  id: starsword-parries-a-higher-roll
  covers: [whole]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.starsword
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.parry, value: 5}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.parried: True, attacks.0.wounded: False, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# The dodge-exception scenario under the D9 ruling (ward == dodge).  The suit is
# worn and the attacker's denial suppresses the armour die (the tape jumps from the
# wound roll straight to the ward face).  The defender's ward source is the admitted
# ward-granting row mechanic.snorri-lucky: a five meets the printed ward face, so the
# ward die saves and the wound is not taken.
- audit_id: mechanic/weapon.starsword
  id: the-starsword-leaves-the-defenders-ward-face-standing-under-the-dodge-ward-ruling
  covers: [dodge-exception]
  fighters:
    first:
      main_weapon_id: weapon.starsword
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      armour_id: armour.heavy-armour
      skill_ids: [mechanic.snorri-lucky]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.special.ward, value: 5}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.saved: True, attacks.0.damage: 0, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
