# Conformance authoring scaffold; generated comments, manually authored scenarios.
# audit_id: mechanic/weapon.starsword
# authoring_status: AUTHORED
# authoring_progress: the whole clause carries 4 authored scenarios and the dodge-exception
#   clause carries 2 authored ward-save scenarios authorised by the coordinator's D9 ruling
#   (2026-10-14: the printed Dodge save and the ward save are the same thing, so the engine's
#   ward face is the printed Dodge exemption).  REVIEWED still requires manual semantic review
#   and execution_status stays UNEXECUTED.
# execution_status: UNEXECUTED (this scaffold has no behavioral result)
#
# Derive inputs and expectations from rule text and accepted rulings.
# Do not derive them from the engine or execute combat during authoring.
# REVIEWED requires semantic review; covers labels alone are insufficient.
# Preserve audit_id when filling this file.
# Governing rulings: docs/decisions/design-rulings.md
#
# Clause: dodge-exception (scope: YES)
# PARTIAL[dodge-exception]: resolved by the coordinator's D9 ruling (2026-10-14): the
#   printed Dodge save and the ward save are the same thing, so the engine's ward face is the
#   printed exemption and the structured dependency closes.  Authored scenarios: a defender
#   wearing a suit the attacker's armour denial denies old face-to-face armour saves still makes
#   the ward die (the denial never touches the ward face), on both faces of the ward 6+ boundary
#   (5 passes, 3 fails); the ward source is the admitted ward-granting row mechanic.snorri-lucky.
#   Method note: expectations come from the printed rule plus the D9 ruling; the exact roll keys
#   and the no-armour-die behaviour of the denial were verified against the engine's known
#   special-save order and not taken as behavioural authority.  Pending semantic review.
#
# Clause: whole (scope: YES)
# AUTHORED[whole]: 4 scenarios cover the printed +1 Strength on both faces, the
#   armour denial against a worn suit and the parry.

# --- Authored scenarios ---
# mechanic/weapon.starsword - the +1 Strength, the armour denial and the parry.
#
# Expectations come from the printed rule and the admitted `whole` clause, never
# from engine output.  The source-vs-contract contradiction recorded in the header
# (item entry printing only "as user +1 Parry") is preserved, not asserted: these
# scenarios follow the mechanic reading whose clause is admitted.
# The printed +1 makes the wielder Strength 4, so Toughness 3 is wounded on 3+;
# the wielder's own Strength would have needed the 4 rolled in the next scenario.
- audit_id: mechanic/weapon.starsword
  id: starsword-adds-one-strength
  covers: [whole]
  fighters:
    first:
      main_weapon_id: weapon.starsword
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 5}
    - {key: round.0.first.attack.0.wound, value: 3}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
