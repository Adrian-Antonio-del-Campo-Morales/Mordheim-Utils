# Conformance authoring scaffold; generated comments, manually authored scenarios.
# audit_id: mechanic/skill.strongman
# authoring_status: AUTHORED
# authoring_progress: the admitted clauses carry authored scenarios derived from the printed rule and the recorded contract; REVIEWED still requires manual semantic review and execution_status stays UNEXECUTED.
# execution_status: UNEXECUTED (this scaffold has no behavioral result)
#
# Derive inputs and expectations from rule text and accepted rulings.
# Do not derive them from the engine or execute combat during authoring.
# REVIEWED requires semantic review; covers labels alone are insufficient.
# Preserve audit_id when filling this file.
# Governing rulings: docs/decisions/design-rulings.md
#
# AUTHORED: 4 scenarios cover the ordinary order with a two-handed
#   weapon and with a broadsword, each paired with the same weapon without
#   the skill.  Corrected 2026-11-16: the printed Broadsword
#   (catalog/items/weapons-close-combat.yaml, id broadsword: "Strength: As user
#   +1 Difficult to use ...") has no strike-last rule and Strongman names only
#   "a double-handed weapon", so the broadsword pair is a control in which the
#   ordinary Initiative order holds with and without the skill.  The earlier
#   expectation that a broadsword strikes last without the skill came from the
#   engine parameters (weapon.broadsword priority -1), not from the print.

# --- Authored scenarios ---
# Neither fighter charges, so the order of battle is the ordinary one: with the
# strike-last penalty removed the two-handed weapon stands in the ordinary tier
# and the higher Initiative strikes first.
- audit_id: mechanic/skill.strongman
  id: a-two-handed-weapon-keeps-the-ordinary-order
  fighters:
    first:
      main_weapon_id: weapon.double-handed-weapon
      skill_ids: [skill.strongman]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: True, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# The identical duel without the skill: the same weapon keeps its printed strike-last
# penalty, so the mace opponent resolves before it despite the Initiative, which
# isolates the exception to the skill.
- audit_id: mechanic/skill.strongman
  id: without-the-strongman-the-same-weapon-strikes-last
  fighters:
    first:
      main_weapon_id: weapon.double-handed-weapon
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
  expect_rounds:
    0: {attacks.0.hit: False, attacks.1.hit: True, attacks.1.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# The broadsword carries no printed strike-last penalty, so with the skill the
# I5 bearer simply keeps the ordinary Initiative order (control for the pair).
- audit_id: mechanic/skill.strongman
  id: a-broadsword-keeps-the-ordinary-order
  fighters:
    first:
      main_weapon_id: weapon.broadsword
      skill_ids: [skill.strongman]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: True, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# The same broadsword without the skill.  Body corrected 2026-11-16 (the id is
# historical and protected): the printed Broadsword has no strike-last rule, so
# without Strongman the I5 bearer still strikes before the I2 mace, exactly as
# with it.  A strike-last order here would be an engine defect, not the print.
- audit_id: mechanic/skill.strongman
  id: a-broadsword-without-the-skill-strikes-last
  fighters:
    first:
      main_weapon_id: weapon.broadsword
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: True, attacks.0.damage: 1, attacks.1.hit: False, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

