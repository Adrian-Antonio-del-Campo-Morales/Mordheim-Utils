# --- Authored scenarios ---
# mechanic/armour.plate-armour — the 4+ save and the printed shield combination.
#
# Expectations come from the printed rule and the accepted clause
# `four-plus-and-shield` of the knowledge-base clause contracts (sources/knowledge),
# never from engine output: plate armour saves on a 4, and a shield may be
# combined with it.  An unmodified Strength 3 attacker applies no save
# modifier, so plate alone saves on 4 and plate with a shield improves the
# composed save by one point to 3 (still short of the 1+ floor).  The excluded
# Movement consequence has no duel-time observable and is not asserted here.
#
# The first scenario declares the shared profiles as YAML anchors; the siblings
# alias the attacker and keep their own builds, armour faces and expectations.

- audit_id: mechanic/armour.plate-armour
  id: plate-armour-save-holds-on-four
  covers: [four-plus-and-shield]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: &attacker-ws3-s3-t3-w2-i5 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      armour_id: armour.plate-armour
      characteristics: &defender-ws3-s3-t3-w2-i2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: &charging-first {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.armour, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.saved: true, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# One face below the printed target with no shield: the three is not a 4+, so
# the wound is taken and the defender drops a wound.

- audit_id: mechanic/armour.plate-armour
  id: plate-armour-save-fails-on-three
  covers: [four-plus-and-shield]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: *attacker-ws3-s3-t3-w2-i5
    second:
      main_weapon_id: weapon.mace
      armour_id: armour.plate-armour
      characteristics: *defender-ws3-s3-t3-w2-i2
  duel_context: *charging-first
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.armour, value: 3}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.saved: false, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The shield combination the clause prints: off-hand shield improves the 4+
# save to 3+, so a three now saves where it failed without the shield.

- audit_id: mechanic/armour.plate-armour
  id: plate-armour-with-a-shield-saves-on-three
  covers: [four-plus-and-shield]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: *attacker-ws3-s3-t3-w2-i5
    second:
      main_weapon_id: weapon.mace
      armour_id: armour.plate-armour
      off_hand_id: defence.shield
      characteristics: *defender-ws3-s3-t3-w2-i2
  duel_context: *charging-first
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.armour, value: 3}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.saved: true, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The other side of the combined threshold: a two fails against the improved
# 3+, leaving the shield as a bonus rather than an unconditional save.

- audit_id: mechanic/armour.plate-armour
  id: plate-armour-with-a-shield-fails-on-two
  covers: [four-plus-and-shield]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: *attacker-ws3-s3-t3-w2-i5
    second:
      main_weapon_id: weapon.mace
      armour_id: armour.plate-armour
      off_hand_id: defence.shield
      characteristics: *defender-ws3-s3-t3-w2-i2
  duel_context: *charging-first
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
