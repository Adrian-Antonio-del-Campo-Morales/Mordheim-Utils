# --- Authored scenarios ---
# Printed text ("Oh no, not Snakes", Khemri Dramatis Personae p.18): Heinrich FEARS snakes - the
# direction is inverted from ordinary Fear.  The binding is the shared mechanic.fear-of-snakes: a
# snake enemy (species.snake or species.serpent) causes Fear in the bearer and in nobody else.
# Consumer: modular/psychology.py causes_fear() and resolve_fear()/needs_test().
# Hireling family model (P0, 2026-11-17).  Heinrich is compiled through the hireling route
# (hirelings.dramatis-personae.1b / hireling.dramatis.heinrich-altdorf-schmidt) with the fixture
# facts (WS3 S3 T3 W2 I5 A1; his printed Ld8 stays).  His kit's first close-combat weapon is the
# whip, whose Whip Master grant would add hit-reroll requests, so the kit sword is declared as his
# main weapon (as his authored Luck file does).  Heinrich is silenced (attacks 0) in every scenario:
# his printed Luck would offer a reroll decision on any failed hit of his own, and the observable
# here is his Fear test and its state flag; his Lightning Reflexes, Step Aside and Dodge request
# nothing against the enemy's declared natural-1 miss.  The enemy is hand-built (mace, WS3 S3 T3
# W3 I2 A1 Ld7) and declares the one fact the rule reads (species: snake or serpent; human for the
# absence case).  Dice: a 2D6 Fear test of 5+4 = 9 fails his Ld8 and 4+4 = 8 passes it; a failed
# charge test cancels the charge.  The control is the grade-1b Bard; the refusal selects the printed
# rule on the Bard (the compiler's fragment, another package).

# A snake charges Heinrich; his 9 fails Ld8 and he is clamped to sixes for the round.
- audit_id: rule/catalog/dramatis-personae/hireling.dramatis.heinrich-altdorf-schmidt.rule.snake-fear/mechanic.fear-of-snakes
  id: heinrich-charged-by-a-snake-that-fails-his-fear-test-is-clamped-to-sixes
  fighters:
    first:
      &recipient
      collection: mordheim
      band_id: hirelings.dramatis-personae.1b
      profile_id: hireling.dramatis.heinrich-altdorf-schmidt
      main_weapon_id: weapon.sword
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      trait_overrides: {species: snake}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  initial_state: {first: {attacks: 0}}
  duel_context: {charging: [second], active_participant: second}
  maximum_rounds: 1
  decisions:
    # Heinrich's printed Luck offers a reroll of his own fear die; declined.
    - {key: round.0.first.fear.charged.0.luck, value: false}
    - {key: round.0.first.fear.charged.1.luck, value: false}
  rolls:
    - {key: round.0.first.fear.charged.0, value: 5}
    - {key: round.0.first.fear.charged.1, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.fear_hit_sixes: True, state.first.condition: STANDING, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

