# armour permission and the rule row, and the striker's Weapon Skill and Strength fix the thresholds.

- audit_id: rule/mordheim/restless-dead/liche--warrior-wizard/compiler.warrior-wizard
  id: the-printed-liche-wears-armour-and-its-save-is-offered
  covers:
  - whole--scope--armour-allowance
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 3, attacks: 1}
    second:
      collection: mordheim
      band_id: restless-dead
      profile_id: liche
      armour_id: armour.light-armour
  initial_state:
    second: {attacks: 0}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.armour, value: 6}
  expect_rounds:
    0: {attacks.0.saved: True, state.second.wounds: 4}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The allowance is armour from the printed list, not a general equipment access: the same printed Liche
# supplied an item its list does not offer is refused.  The fragment is quoted from the shared template
# `equipment is not available to <band>/<profile>: [...]` with this band and profile, which is the item
# the accepted specification uses for this recipient.

- audit_id: rule/mordheim/restless-dead/liche--warrior-wizard/compiler.warrior-wizard
