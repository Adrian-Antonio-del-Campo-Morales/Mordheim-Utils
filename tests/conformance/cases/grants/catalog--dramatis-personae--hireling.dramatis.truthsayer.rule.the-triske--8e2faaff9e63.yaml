# --- Authored scenarios ---
# Hireling family model.  The printed rule (Town Cryer 15, Albion): the Triskele
# protects the Truthsayer "granting the Truthsayer a 4+ save, which cannot be
# reduced by anything", carried as an ordinary ward (design ruling 2026-11-18,
# same handling as the Spiral).  The Triskele is a worn icon, so the real
# Truthsayer wears it through defence_ids; his omitted main hand takes the kit's
# Staff of Light, which counts as a halberd, and his attacks are silenced so the
# attacker's tape is the only one.  Fixture characteristics (WS3 S3 T3 W2 I5 A1;
# the printed Ld9 stays).  The control is the grade-1b Bard: the same hit and
# wound reach him with no ward die requested.

# The printed save on its own face.
- audit_id: rule/catalog/dramatis-personae/hireling.dramatis.truthsayer.rule.the-triskele/defence.triskele
  id: the-truthsayers-triskele-saves-on-four
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: &gtk-attacker {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
    second:
      &gtk-truthsayer
      collection: mordheim
      band_id: hirelings.dramatis-personae.1b
      profile_id: hireling.dramatis.truthsayer
      defence_ids: [defence.triskele]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
  initial_state: {second: {attacks: 0}}
  duel_context: &gtk-charging-first {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.special.ward, value: 4}
  expect_rounds:
    0: {attacks.0.saved: true, attacks.0.damage: 0, state.second.wounds: 2}
  expect_fighters:
    second.global_effects.ward_save: 4
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# One face below the printed target: the 3 is not a 4+ and the wound is taken.
- audit_id: rule/catalog/dramatis-personae/hireling.dramatis.truthsayer.rule.the-triskele/defence.triskele
  id: one-face-below-the-triskele-is-not-enough
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: *gtk-attacker
    second:
      <<: *gtk-truthsayer
  initial_state: {second: {attacks: 0}}
  duel_context: *gtk-charging-first
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.special.ward, value: 3}
  expect_rounds:
    0: {attacks.0.saved: false, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The control: the same attack against a hireling without the icon (the Bard)
# requests no ward die - the strict tape ends at the wound and the damage goes
# straight through.
- audit_id: rule/catalog/dramatis-personae/hireling.dramatis.truthsayer.rule.the-triskele/defence.triskele
  id: a-hireling-without-the-triskele-has-no-ward-die
