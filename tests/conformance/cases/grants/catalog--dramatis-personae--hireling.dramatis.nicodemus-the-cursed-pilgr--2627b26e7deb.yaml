  fighters:
    first:
      <<: *nicodemus-two-handed
      main_weapon_id: weapon.club
    second: *opponent
  duel_context: *uncharged
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 4}
    - {key: round.0.second.attack.0.wound, value: 4}
  expect_rounds:
    0: {attacks.1.parried: false, attacks.1.damage: 1, state.first.wounds: 1}
