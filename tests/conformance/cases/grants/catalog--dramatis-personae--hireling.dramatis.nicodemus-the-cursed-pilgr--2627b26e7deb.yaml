# Rule (grade-1a.yaml, hireling.dramatis.nicodemus-the-cursed-pilgrim.rule.wizard-s-staff, grant
# profile): "The staff may be used two-handed, counting as a Club and allowing Nicodemus to parry as
# if armed with a buckler, or in his left hand as a normal Club while the Sword of Rezhebel spell
# occupies his right hand" - binding weapon.wizards-staff (two-handed, Concussion, parry; model
# mechanics/weapon.wizards-staff.yaml).  Hireling family model (README, Hireling recipients): the
# real Nicodemus through the hireling route (hirelings.dramatis-personae.1a /
# hireling.dramatis.nicodemus-the-cursed-pilgrim) with the fixture facts (WS3 S3 T3 W2 I5 A1; the
# printed Ld8 stays) and the unique staff named in hand under each printed grip.  The opponent is
# hand-built (WS3 S3 T3 I2 A1 Ld7, mace; W3, or W1 where the Injury roll is the observable).  The
# duels are uncharged: Nicodemus's Fearsome skill causes Fear, and only a charge requests a Fear
# test, so none is declared; his Initiative 5 strikes before the opponent's 2.  The control is the
# grade-1b Bard with his kit dagger.  Dice: WS3 against WS3 hits on 4+, S3 wounds T3 on 4+; the
# parry die must beat the hit roll.

# Two-handed: Nicodemus's own strike misses first, then the staff's parry die 5 beats the hit
# landed on a 4; the compiled staff is a two-handed club that parries.
- audit_id: rule/catalog/dramatis-personae/hireling.dramatis.nicodemus-the-cursed-pilgrim.rule.wizard-s-staff/weapon.wizards-staff
  id: the-two-handed-staff-parries-like-a-buckler
  fighters:
    first: &nicodemus-two-handed
      collection: mordheim
      band_id: hirelings.dramatis-personae.1a
      profile_id: hireling.dramatis.nicodemus-the-cursed-pilgrim
      main_weapon_id: weapon.wizards-staff
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second: &opponent
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: &uncharged {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 4}
    - {key: round.0.second.attack.0.parry, value: 5}
  expect_rounds:
    0: {attacks.1.parried: true, attacks.1.wounded: false, state.first.wounds: 2}
  expect_fighters:
    first.main_weapon.two_handed: true
    first.main_weapon.parry: true
    first.main_weapon.concussion: true
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# Two-handed, counting as a Club: the ordinary chart's Knocked Down of 2 becomes Stunned.
- audit_id: rule/catalog/dramatis-personae/hireling.dramatis.nicodemus-the-cursed-pilgrim.rule.wizard-s-staff/weapon.wizards-staff
  id: the-two-handed-staff-is-a-club-whose-concussion-stuns-on-two
  fighters:
    first: *nicodemus-two-handed
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 2, attacks: 1, leadership: 7}
  duel_context: *uncharged
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.injury.0, value: 2}
  expect_rounds:
    0: {attacks.0.damage: 1, state.second.wounds: 0, state.second.condition: STUNNED}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

