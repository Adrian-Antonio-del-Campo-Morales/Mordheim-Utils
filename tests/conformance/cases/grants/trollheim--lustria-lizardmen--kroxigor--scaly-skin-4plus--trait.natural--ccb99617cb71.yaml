#
# Clause: four-plus-scaly-skin (scope: YES)
# AUTHORED[four-plus-scaly-skin]: 5 scenarios cover the printed 4+ Scaly Skin save on the real attack
#   route (saved on 4, wounded on 3), its per-profile value against another
#   Lizardman of the band that keeps its own save, and the Strength cap.
#
# Clause: stacks-with-armour-but-not-hardened-leather (scope: YES)
# PARTIAL[stacks-with-armour-but-not-hardened-leather]: the printed exception - "Scaly Skin may be combined with other armour, except Hardened Leather provides no additional bonus" (bands/trollheim/lustria-lizardmen/special-rules.yaml, Scaly Skin, p.53) - needs a legal bearer wearing hardened or toughened leathers, and no source in this revision supplies one: skinks-, saurus- and kroxigor-equipment-list (Lustria p.53-56) offer no hardened or toughened leather, and no band package pairs the item with a Scaly Skin profile.  The leather's save-cancellation (the better of the two saves applies and the leather can never improve the scaly save) therefore has no observable and is asserted nowhere in this corpus; nothing is authored for that behaviour and no relaxation of the printed lists is assumed.  On this profile the printed entry bars the armour outright: "May select either a Halberd or a Great Weapon; no other weapons or armour are permitted" (profiles.yaml, Kroxigor, p.56).  What the source does make checkable is that prohibition, authored below as a construction refusal with the corpus's established armour-prohibition diagnostic `armour is forbidden for <band>/<profile>` - the same contract the sibling Dwarf Slayer and Orc Nuttaz armour refusals use - so an illegally armoured Kroxigor is refused instead of silently keeping the natural save.
# Missing datum: a legal Scaly Skin bearer that may wear Hardened Leather - a printed list or a fixture route for a post-battle acquisition - which this revision does not contain.
#
# Clause: strength-cannot-go-beyond-six (scope: YES)
# AUTHORED[strength-cannot-go-beyond-six]: 2 scenarios cover the printed cap - a Strength 6 attacker still
#   leaves the save on 6 and its own five does not save, so the Strength modifier
#   applies up to the cap and no further.
# --- Authored scenarios ---
# Derived from the printed rule, the recorded semantic contract of each clause
# and the band package; no engine output was consulted.  The duel is uncharged
# (`charging: []`) and the attacker holds the higher Initiative, so the only
# Strength modifier reaching the defender's save is the attacker's own Strength
# and the attacker's pool always resolves first.  A recipient that survives the
# incoming attack still strikes back, so its own attack is scripted as a miss.

