# --- Authored scenarios ---
# Derived from the printed sentence and this origin's recorded contract; no engine output was consulted.  The
# corrupting model is the band's own printed Master of Finances profile and the enemy is a hand-built fixture.

- audit_id: rule/mordheim/mazzalupo-web/master-of-finances--corruption/mechanic.corruption
  id: the-successful-enemy-attack-is-taken-again-and-its-second-result-accepted
  covers: [corruption--scope--attack-reroll]
  # The admitted consequence: a hitting enemy re-rolls one successful attack.  The enemy's successful attack is
  # declared (4 hits), the forced second result is declared on that attack's own `.hit.reroll` die (1, a miss),
  # and the asserted outcome is the printed one - the attack is lost, so the corrupting duelist takes no wound.
  # The re-roll die belongs to the enemy attack's key under the enemy side's prefix, the mirror of the key the
  # accepted hit-re-roll tapes of this corpus declare.  The bribe itself is declared as the corruption
  # decision, so the forced re-take is accepted on that enemy attack.
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      collection: mordheim
      band_id: mazzalupo-web
      profile_id: master-of-finances
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.hit.reroll, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  decisions:
    - {key: round.0.first.attack.0.corruption, value: true}
  expect_rounds:
    0: {attacks.0.hit: False, attacks.0.damage: 0}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

- audit_id: rule/mordheim/mazzalupo-web/master-of-finances--corruption/mechanic.corruption
  id: a-psychology-immune-enemy-cannot-be-corrupted-and-its-hit-stands
  covers: [corruption--scope--psychology-immunity-limit]
  # The printed limit: "Models immune to Psychology cannot be corrupted."  The enemy is the attack-reroll
  # tape's own fixture with the canonical immunity added, and its attack hits on the same 4.  No corruption
  # decision is declared and no re-roll die is declared, so the hit is kept and the attack proceeds to its
  # wound roll, declared as a natural 1 (which never wounds) so nothing follows.
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.psychology-immunity]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      collection: mordheim
      band_id: mazzalupo-web
      profile_id: master-of-finances
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: True, attacks.0.damage: 0, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
