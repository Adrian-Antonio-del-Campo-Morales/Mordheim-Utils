# Printed text (dramatis-personae/grade-2a.yaml, Daemonic Flesh): "A 5+ base armour save is never modified and is
# entirely negated by magical or blessed weapons and spells. All of the daemon's close combat
# attacks count as magical."  This binding is the mechanic (natural_armour_negated_by_magic, tags
# mechanic.daemonic-flesh + attack.magical); the sibling trait bindings of the same rule supply the
# 5+ and its unmodifiable flag, so the compiled recipient has natural_armour_save 5 and
# natural_armour_unmodified (tests/construction/test_hireling_admission.py::test_daemonic_flesh...).
# Consumers: phases.py armour_target (an unmodified natural save ignores the Strength penalty; magic
# sets it to 7 when negated_by_magic), modular/attacks.py ~696-701 (the daemonic save is rolled
# unmodifiable), modular/attacks.py ~343-346 (an attack tagged attack.magical is never offered the
# Ethereal interception).
# Hireling family model: the recipient is the printed Aksho'akhash the Vile Dreadwing compiled through the hireling route
# (hirelings.dramatis-personae.2a / hireling.dramatis.aksho-akhash-the-vile-dreadwing-lord-of-the-carrion-throne) with the fixture facts (WS3 S3 T3 W2 I5 A1; the printed Leadership stays);
# its kit is its innate natural attacks and the rule is granted by the profile, so nothing is
# selected.  The opponent is hand-built (mace, WS3 T3 W3 I2 A1 Ld7) with Strength 4 where the save
# modification is at stake (a mace is Strength as user) and Strength 3 otherwise.  The recipient
# causes Fear: a charging opponent tests (1+1 passes Ld7) and a charged opponent tests (3+3 passes).
# Aksho is not immune to psychology (Coward King binds mechanic.craven), but no opponent here causes Fear, so he is never asked a test.  Wound dice are fours (never a six, so no critical die joins).  The Ethereal
# target is a hand-built fixture with the shared mechanic injected through skill_ids, because the
# clause under test is the attacker's magical label.  The control is the grade-1b Bard; the refusal
# selects this rule on the Bard.
# Semantic wrinkle (2026-11-18): "blessed" weapons and spells have no catalog producer in a duel
#   (attack.blessed is not materialised by any build field, README "Harness capacities"), so only
#   the magical negation is evidenced; the blessed half of the printed sentence stays unasserted.

