# --- Authored scenarios ---
# Hireling family model (P0, 2026-11-17) combined with the fear-reroll family model (the authored
# Sisters of Sigmar Absolute Faith file of this directory).  The recipient is the printed Roadwarden
# profile compiled through the hireling route (hirelings.hired-sword.1a /
# hireling.hired-sword.roadwarden); his Stern rule is a profile grant, so nothing is selected.  His
# physical characteristics are the fixture facts (WS3 S3 T3 W2 I5 A1) and his printed Leadership 8
# stays.  His omitted main weapon would default to the kit's Horseman's Hammer; the kit dagger is
# declared instead so the recipient carries the simplest kit piece (he strikes no blow anyway).
# The opponent is hand-built (WS3 S3 T3 W3 I2 A1 Ld7, mace) and declares the one fact the rule reads
# (causes_fear); it charges, so the test under evidence is the Roadwarden's own charged Fear test.
# The recipient is silenced (attacks: 0) and every declared opponent attack is a natural 1, a miss,
# so the Fear test and its reroll are the whole of the evidence: a 2D6 of 5+4 = 9 fails Ld8, a
# reroll of 4+4 = 8 passes it, and the printed consequence of a standing failure is explicit in
# state.first.fear_hit_sixes.

# The charged Roadwarden fails the Fear test (9 over Ld8), takes the one optional reroll Stern
# prints, and the second result of 8 passes, so his hits are not clamped to sixes.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.roadwarden.rule.stern/mechanic.fear-reroll
  id: the-roadwarden-rerolls-a-failed-fear-test-and-the-second-result-passes
  fighters:
    first:
      &recipient
      collection: mordheim
      band_id: hirelings.hired-sword.1a
      profile_id: hireling.hired-sword.roadwarden
      main_weapon_id: weapon.dagger
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      trait_overrides: {causes_fear: true}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  initial_state: {first: {attacks: 0}}
  duel_context: {charging: [second], active_participant: second}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.fear.charged.reroll, value: true}
  rolls:
    - {key: round.0.first.fear.charged.0, value: 5}
    - {key: round.0.first.fear.charged.1, value: 4}
    - {key: round.0.first.fear.charged.reroll.0, value: 4}
    - {key: round.0.first.fear.charged.reroll.1, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.fear_hit_sixes: False, state.first.wounds: 2, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The reroll is a single second attempt: a reroll of 9 fails Ld8 again and the second result stands.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.roadwarden.rule.stern/mechanic.fear-reroll
  id: the-second-result-stands-when-the-reroll-fails-again
  fighters:
    first:
      <<: *recipient
    second:
      main_weapon_id: weapon.mace
      trait_overrides: {causes_fear: true}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  initial_state: {first: {attacks: 0}}
  duel_context: {charging: [second], active_participant: second}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.fear.charged.reroll, value: true}
  rolls:
    - {key: round.0.first.fear.charged.0, value: 5}
    - {key: round.0.first.fear.charged.1, value: 4}
    - {key: round.0.first.fear.charged.reroll.0, value: 5}
    - {key: round.0.first.fear.charged.reroll.1, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.fear_hit_sixes: True, state.first.wounds: 2, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

