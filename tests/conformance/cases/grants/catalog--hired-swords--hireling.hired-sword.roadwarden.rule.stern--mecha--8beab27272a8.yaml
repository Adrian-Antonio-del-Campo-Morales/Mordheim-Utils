# The printed grant belongs to the Roadwarden's profile; selecting it on a hireling of another
# package is refused by the compiler (the fragment is the common refusal prefix).
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.roadwarden.rule.stern/mechanic.fear-reroll
  id: the-rule-is-refused-on-a-hireling-outside-its-printed-profile
