# --- Authored scenarios ---
# Derived from the printed sentence and the recorded contract; no engine output was consulted.  The
# bearer prints the rule and contributes no attacks of its own, so round 0 carries only the
# attacker's dice.  The blow is an ordinary mace: at Weapon Skill 10 against this bearer's printed
# Weapon Skill it needs a 3, and Strength 8 against Toughness 3 needs a 2, so the declared 5 and 5
# both pass.  Five is deliberately below a natural six, which would be a critical hit and add a
# further critical die.  Unarmoured and with no ward, the bearer reaches the damage step, and the
# strict tape declares nothing after the wound roll: an injury die requested here would fail the
# fixture, so the two scenarios prove the printed 'do not roll for injury' rather than assume it.

- audit_id: rule/mordheim/battle-monks-of-cathay/raging-peasants--downtrodden/trait.injury-profile
  id: the-first-wound-takes-the-peasant-out-without-an-injury-roll
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 10, strength: 8, toughness: 3, wounds: 3, initiative: 10, attacks: 1}
    second: {collection: mordheim, band_id: battle-monks-of-cathay, profile_id: raging-peasants}
  initial_state: {second: {wounds: 1, attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 5}
    - {key: round.0.first.attack.0.wound, value: 5}
  expect_rounds:
    0: {attacks.0.wounded: True, state.second.condition: OUT}
  expect_final: {rounds_executed: 1, termination_reason: second_out}

# Body corrected 2026-11-16 (the id is kept for the accepted-evidence baseline and no longer
# describes the setup): the former body raised the bearer to two Wounds, above the printed W1 the
# runner now refuses, and no legal Raging Peasant build carries more than one Wound (no equipment
# list, no armour, no wound-granting rule).  The corrected body keeps the printed W1 and varies the
# attack instead: the attacker strikes twice (both to-hit dice are rolled together, the second
# misses), the one hitting blow wounds, and the bearer is out at once with no injury die requested;
# the strict tape declares none.
- audit_id: rule/mordheim/battle-monks-of-cathay/raging-peasants--downtrodden/trait.injury-profile
  id: the-first-wound-takes-out-a-peasant-above-its-printed-wounds
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 10, strength: 8, toughness: 3, wounds: 3, initiative: 10, attacks: 2}
    second: {collection: mordheim, band_id: battle-monks-of-cathay, profile_id: raging-peasants}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 5}
    - {key: round.0.first.attack.1.hit, value: 1}
    - {key: round.0.first.attack.0.wound, value: 5}
  expect_rounds:
    0: {attacks.0.wounded: True, attacks.1.hit: False, state.second.condition: OUT}
  expect_final: {rounds_executed: 1, termination_reason: second_out}
