# --- Authored scenarios ---
# Family model (conditional Stupidity): the bearer is the printed recipient of this record, built
# from its band profile, so the granted mechanic.stupidity is what the scenarios exercise.  Its
# physical characteristics are supplied as fixture facts (WS3 S3 T3 W3 I2 A1) so the dice thresholds
# and the strike order are fixed, while its printed Leadership stays in place: a total of twelve is a
# certain failure (no catalogue Leadership reaches twelve) and a total of two a certain pass.  The
# printed clause exempts the bearer while a Skaven Hero is within 6 inches; the accepted
# representation of that exemption is the admitted supplied fact condition.stupidity-exempt
# (trait_overrides: {stupidity_exempt: true}), which the record's own register note prescribes,
# because nothing derives the handler's 6-inch proximity from a group and the handler's Leadership
# value belongs to the sibling borrowing clause (supplying stupidity_leadership without that mechanic
# is refused by the compiler contract).  The supplied fact stands for the band's printed Assassin hero
# (Leadership 7) present within the printed 6 inches.  The opponent is a hand-built fixture with one
# attack, so the tape speaks about the bearer's own test alone.

# The bearer's own Leadership fails the two declared sixes, so the voluntary charge is cancelled and
# no close-combat attack is resolved at all.
- audit_id: rule/trollheim/trollheim-skaven-clan-eshin/rat-ogre--stupidity/mechanic.stupidity
  id: a-failed-stupidity-test-cancels-its-charge-and-bars-its-attacks
  fighters:
    first:
      collection: trollheim
      band_id: trollheim-skaven-clan-eshin
      profile_id: rat-ogre
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 1, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.stupidity.0, value: 6}
    - {key: round.0.first.stupidity.1, value: 6}
  expect_rounds:
    0: {state.first.stupidity_failed: true, state.first.condition: STANDING, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: disengaged}

