# The printed item rule belongs to the recipient's profile; selecting it on another
# hireling is refused.
- audit_id: rule/catalog/dramatis-personae/hireling.dramatis.drenok-johansen-wielder-of-the-great-axe.rule.sabertooth-tiger-hide/defence.sabertooth-hide
  id: the-rule-is-refused-on-a-hireling-outside-its-printed-profile
  fighters:
    first: *opponent
    second:
      <<: *control
      special_rule_ids: [hireling.dramatis.drenok-johansen-wielder-of-the-great-axe.rule.sabertooth-tiger-hide]
  expect_error: "special rule is not available to hirelings.hired-sword.1b"

# The unique hide itself is not part of any other printed kit: another hireling
