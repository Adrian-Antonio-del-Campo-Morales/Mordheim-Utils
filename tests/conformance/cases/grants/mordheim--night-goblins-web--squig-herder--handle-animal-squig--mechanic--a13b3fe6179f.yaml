# --- Authored scenarios ---
# Handle Animal is granted to the canonical Herder. The receiving Cave Squig
# has no purchased handler skill or arbitrary supplied Leadership. Nearby
# provider identity, side, condition and distance are explicit duel facts.
# Ld6 of the Herder passes 3+3; the printed Squig Ld5 fails the same roll.

- audit_id: rule/mordheim/night-goblins-web/squig-herder--handle-animal-squig/mechanic.handler-leadership
  id: the-supplied-herders-value-is-the-one-tested
  fighters:
    first:
      collection: mordheim
      band_id: night-goblins-web
      profile_id: cave-squigs
      trait_overrides: {stupidity: true}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context:
    charging: [first]
    active_participant: first
    distances: [[first, herder, 6]]
    nearby:
      - participant_id: herder
        side_id: first
        condition: standing
        fighter: {collection: mordheim, band_id: night-goblins-web, profile_id: squig-herder}
  decisions:
    - {key: round.0.first.stupidity.handler.herder, value: true}
  maximum_rounds: 1
  rolls:
