# --- Authored scenarios ---
# Family model (Master of Blades, clan Angrund printing): the bearer is the printed recipient of this
# band record, built from its own band and profile and selecting the band row named in the audit id,
# exactly as the accepted construction test selects it (clan-angrund-kep/dwarf-noble with
# band--dwarf-special-skills-master-of-blades, which projects skill.unbeatable-warrior,
# skill.sword-master and the dwarf parry variant tag rule.dwarf-axe-parry-reroll).  Physical
# characteristics are supplied as fixture facts (WS3 S3 T3 W2 I2 A1) so the dice thresholds and the
# strike order are fixed, while the printed Leadership stays in place; the bearer's own attack pool is
# declared empty so the tape holds only the parry under test.  Every expectation is read from the
# printed rule (parries when he beats or matches the highest To Hit roll; two Parry weapons allow two
# attacks; two Dwarf axes reroll failed parries) and the recorded contracts, never from engine output;
# the roll tape is derived statically and stays unexecuted.  Where a clause is tested with swords the
# parrying weapon is the ordinary one; the Dwarf Axe cases are the printed reroll condition.

# The printed equality: a parry die equal to the declared To Hit four blocks the blow.
- audit_id: rule/mordheim/clan-angrund-kep/band--dwarf-special-skills-master-of-blades/skill.sword-master
  id: an-equal-roll-matches-the-highest-to-hit
  covers: [parry-matches]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      collection: mordheim
      band_id: clan-angrund-kep
      profile_id: dwarf-noble
      special_rule_ids: [band--dwarf-special-skills-master-of-blades]
      main_weapon_id: weapon.sword
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.parry, value: 4}
  expect_rounds:
    0: {attacks.0.parried: true, state.second.parries_remaining: 0, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

