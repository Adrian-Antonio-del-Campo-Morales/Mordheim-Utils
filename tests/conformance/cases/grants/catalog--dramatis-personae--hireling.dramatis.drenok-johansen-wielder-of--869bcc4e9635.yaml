# Hireling family model (P0, 2026-11-17; equipment batch 2026-11-18).  The recipient is
# the printed hireling profile compiled through the hireling route (band_id
# hirelings.dramatis-personae.1b, profile_id hireling.dramatis.drenok-johansen-wielder-
# of-the-great-axe); the printed rule is granted by the profile itself, so the build
# selects nothing.  He wields his unique axe by its mechanic id and does NOT wear the
# hide here, so no armour die interrupts the tape.  Physical characteristics are the
# fixture facts with Wounds 1 (WS3 S3 T3 W1 I5 A1) so the first wound reaches zero;
# the printed Ld8 stays.  The opponent is hand-built (WS3 S3 T3 W3 I2 A1 Ld7, mace)
# and charges him.  The control is the grade-1b Bard with his kit dagger and the same
# one-Wound fixture.
#
# Design ruling 2026-10-15 ("Drenok's Berserker is not the Slayer skill"): a first
# reduction to zero Wounds requires 4+ to stand fighting this turn, a fresh roll
# every subsequent player turn while still at zero, failure means Out of Action; no
# Wound is restored and no Injury die is rolled.  The consumer asks the first-crossing
# die as `round.0.first.attack.0.drenok-berserker` (modular/attacks.py) and the
# renewal as `round.<i>.second.drenok-berserker` at the start of a later round
# (modular/rounds.py).
#
# Companion printed rules, declared by name: Fearsome makes the charger test for Fear
# (3+3 passes Ld7); Step Aside asks its 5+ special save once the wound is through
# (`.special.ward`, declared as a failing 4); Strongman and Combat Master request
# nothing here.

# The first crossing to zero: Fear passed, hit, wound, Step Aside fails, and the
# continuation die 4 keeps Drenok standing and fighting at zero Wounds; his own attack
# is still requested.
- audit_id: rule/catalog/dramatis-personae/hireling.dramatis.drenok-johansen-wielder-of-the-great-axe.rule.berserker/mechanic.drenok-berserker
  id: drenok-reduced-to-zero-wounds-stands-fighting-on-four
  fighters:
    first:
      &opponent
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
    second:
      &recipient
      collection: mordheim
      band_id: hirelings.dramatis-personae.1b
      profile_id: hireling.dramatis.drenok-johansen-wielder-of-the-great-axe
      main_weapon_id: weapon.icefang-axe
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 5, attacks: 1}
  duel_context: &opponent-charges {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    # Fearsome: the charger's Fear test, passed.
    - {key: round.0.first.fear.charge.0, value: 3}
    - {key: round.0.first.fear.charge.1, value: 3}
    - {key: round.0.first.attack.0.hit, value: 4}
    # Drenok's Icefang parries: the 1 does not beat the hit.
    - {key: round.0.first.attack.0.parry, value: 1}
    - {key: round.0.first.attack.0.wound, value: 4}
    # Step Aside: the 5+ special save, failed.
    - {key: round.0.first.attack.0.special.ward, value: 4}
    - {key: round.0.first.attack.0.drenok-berserker, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 1, state.second.wounds: 0, state.second.condition: STANDING}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

