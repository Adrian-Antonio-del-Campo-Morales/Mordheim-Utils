#
# AUTHORED: 3 scenarios cover the reduced
#   To Wound target on an equal Strength attack, the same dice without the
#   skill, and the unchanged armour save modifier.

# --- Authored scenarios ---
# The canonical general skill list defines the shared resilient operator: one less
# Strength against incoming close-combat hits, with the save modifiers untouched.
# The Strength 3 attack is reduced to 2 against the resilient Toughness 3, so its To
# Wound target is five and the roll of four fails where it would wound a warrior
# without the skill.  No armour die follows a failed wound.
- audit_id: rule/catalog/general/skill.resilient/skill.resilient
  id: an-equal-strength-hit-now-fails-on-a-four
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      skill_ids: [skill.resilient]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: True, attacks.0.wounded: False, attacks.0.damage: 0, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# The same dice without the skill: Strength 3 against Toughness 3 wounds on a four,
# which fixes the comparison of the previous scenario to the reduction alone.
- audit_id: rule/catalog/general/skill.resilient/skill.resilient
  id: without-the-skill-the-same-roll-wounds
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.wounded: True, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# Wounded by a Strength 4 attack, which the skill reduces to 3 for the wound roll.
# The 6+ light armour is improved by the attack's full Strength 4 modifier to 7+,
# so no armour die is taken at all: the reduction reaches the wound roll only and
# leaves the save modifiers untouched, as printed.
- audit_id: rule/catalog/general/skill.resilient/skill.resilient
  id: the-armour-save-keeps-the-full-strength
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 4, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      armour_id: armour.light-armour
      skill_ids: [skill.resilient]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.wounded: True, attacks.0.saved: False, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
