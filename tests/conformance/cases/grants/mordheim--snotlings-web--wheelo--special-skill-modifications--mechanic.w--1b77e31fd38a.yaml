# The printed Mighty Blow sentence.  The Wheelo is not charging, so no Impact Hit is made and only the
# crew's two printed attacks (Weapon Skill 2 against 3: a 4 hits) strike, first by its Initiative 5.
# With Mighty Blow the crew keeps Strength 4 and gains +1 to wound: the 2 wounds Toughness 3 (3+ less
# one).  The target's light armour (6+) takes -1 for Strength 4 and +1 for the dagger, so it still
# saves on 6, and the six is declared and saves.  The second crew attack misses on a natural one.
- audit_id: rule/mordheim/snotlings-web/wheelo--special-skill-modifications/mechanic.wheelo-skill-modifications
  id: mighty-blow-gives-the-crew-plus-one-to-wound-not-strength
  covers: [whole--scope--weapons-training-and-mighty-blow]
  fighters:
    first:
      collection: mordheim
      band_id: snotlings-web
      profile_id: wheelo
      main_weapon_id: weapon.dagger
      skill_ids: [skill.mighty-blow]
    second:
      main_weapon_id: weapon.mace
      armour_id: armour.light-armour
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.1.hit, value: 1}
    - {key: round.0.first.attack.0.wound, value: 2}
    - {key: round.0.first.attack.0.armour, value: 6}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.wounded: true, attacks.0.saved: true, attacks.0.damage: 0, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

