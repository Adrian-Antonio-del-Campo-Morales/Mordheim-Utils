# --- Authored scenarios ---
# Uniform Large Target binding (design ruling recorded 2026-11-18): every printed "is a / counts as
# a Large Target" rule binds condition.large-target, whose execution entry tags the bearer
# [size.large]; the printed shooting consequences stay excluded as out-of-scope.shooting
# (unimplemented.night-goblins-web.great-squig.large-target).  The duel reader is the printed Slay
# Large Creature bonus ("+1 Strength when charging a Large creature in the first round"), injected
# into a hand-built charger through skill_ids - the same evidence route as the hireling Large model
# file.  Arithmetic: S3 wounds T3 on 4+, the +1S of the charge against a Large bearer (S4 vs T3) on
# 3+, so the declared wound roll of 3 separates the real recipient from the hand-built control.
# Profile dice (from the great-squig's cause-fear sibling): the Great Squig builds plain (no compile
# options) and causes Fear, so the charger (Ld7) declares the 2D6 charge test - 3+3 passes; it has
# no stupidity, armour or regeneration die, and its own blows are silenced (attacks: 0; the squig
# fights with its natural attacks, so the silence is complete).

# The Slay Large Creature charger wounds the Large Great Squig on a 3 (S4 vs T3 after the charge bonus).
- audit_id: rule/mordheim/night-goblins-web/great-squig--large-target/condition.large-target
  id: a-slay-large-creature-charger-wounds-the-large-great-squig-on-a-3
  fighters:
    first:
      &charger
      main_weapon_id: weapon.mace
      skill_ids: [rule.slay-large-creature]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
    second:
      collection: mordheim
      band_id: night-goblins-web
      profile_id: great-squig
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    # The Great Squig causes fear: the charger's 2D6 charge test of 3+3 passes Ld7.
    - {key: round.0.first.fear.charge.0, value: 3}
    - {key: round.0.first.fear.charge.1, value: 3}
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 3}
  expect_rounds:
    0: {attacks.0.hit: True, attacks.0.wounded: True, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The control: a hand-built opponent without the Large rule carries no size.large, so the same
# charge carries no bonus and the same 3 does not wound (S3 vs T3 needs 4+).
- audit_id: rule/mordheim/night-goblins-web/great-squig--large-target/condition.large-target
  id: without-the-large-rule-the-same-three-fails
  fighters:
    first:
      <<: *charger
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 7}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 3}
  expect_rounds:
    0: {attacks.0.hit: True, attacks.0.wounded: False, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
