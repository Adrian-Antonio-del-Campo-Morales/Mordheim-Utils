# AUTHORED: 3 scenarios cover the printed equality - with the skill a parry die equal to the declared To Hit four blocks the blow, and the identical configuration, tape and die without the skill leave the blow standing so the wound and its damage follow.  The register records two records of one skill (a profile grant and the shared mechanic definition) with no second contribution, so the tape reads the canonical operator through the fighter's grant list exactly as the mechanic origin's own case does; the parry source the printed clause requires is carried by the defender's sword through the executor's parry capacity.

# --- Authored scenarios ---
# The printed equality: the declared To Hit four lands on the defender's Weapon Skill 3,
# and the defender's parry die of the same four blocks it because the skill allows a parry
# on a roll equal to or over the To Hit roll.  The blow is therefore parried, the defender
# keeps both Wounds, and its own declared To Hit one misses.
- audit_id: rule/mordheim/hochland-bandits/duelist--swordmaster/skill.swordmaster
  id: the-equal-parry-roll-blocks-the-blow
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.sword
      skill_ids: [skill.swordmaster]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.parry, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.parried: True, attacks.0.wounded: False, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# The control: the same sword-armed defender, the same declared To Hit four and the same
# parry die of four, but without the skill.  A normal parry must beat the To Hit roll, so
# the attempt fails, the blow stands and its declared wound face lands.
- audit_id: rule/mordheim/hochland-bandits/duelist--swordmaster/skill.swordmaster
  id: without-the-skill-the-same-parry-die-only-matches-and-fails
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.sword
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.parry, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.parried: False, attacks.0.wounded: True, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
