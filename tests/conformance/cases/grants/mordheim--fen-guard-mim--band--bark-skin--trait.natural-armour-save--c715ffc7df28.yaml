#
# Clause: no-save-and-fire-negation (scope: YES)
# AUTHORED[no-save-and-fire-negation]: 3 scenarios take both halves of the printed sentence onto the
#   real attack route - a fire attack and an armour-penetrating 'no save' critical ask for no hide
#   die at all - and a same-Strength non-fire control keeps the die at six, so the absence is the
#   clause and not the dice.
#
# Clause: six-plus-natural-save (scope: YES)
# AUTHORED[six-plus-natural-save]: 3 scenarios take the printed 6+ on the real attack route - a six
#   saves and a five is a wound - and a shield takes the hide one step better, which is the
#   stacking half of the same printed sentence.
#
# Clause: strength-cap-at-six (scope: YES)
# AUTHORED[strength-cap-at-six]: 3 scenarios hold the printed cap and its exception - a Strength 6
#   attacker still leaves the die at six and beats it only on five - and an armour-penetrating axe
#   at the same Strength as the plain cases worsens the save past the cap, asking for no hide die.


# --- Authored scenarios ---
# Derived from the printed rule, the recorded contract of each clause and the band package; no
# engine output was consulted.  Bark Skin is the band's own grant, so it is witnessed through the
# Spiteborn profile, whose printed entry carries no rule of its own and therefore keeps this tape
# free of unrelated dice.  The attacker is a hand-built fixture, its Weapon Skill 10 and Initiative
# 10 are fixture facts, the duel is uncharged, and the bearer starts at two wounds and contributes
# no attacks of its own.  The wound face stays below a natural six so no critical die is part of
# the evidence except where the critical itself is the clause.

