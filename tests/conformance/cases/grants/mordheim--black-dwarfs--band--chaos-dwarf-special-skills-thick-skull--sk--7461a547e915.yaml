# --- Authored scenarios ---
# RECIPIENT BOUNDARY (checked statically in the shared construction stage, not by running it): the
# bearer is the printed Hero row sorcerer, not the Henchman row chaos-dwarfs.
# `specialRuleRestriction()`'s access stage admits a band warband_skill row with `applies_to.band: true`
# and no `eligibility` only for a recipient whose own printed `skill_access` carries the `special`
# category; chaos-dwarfs prints none and would be refused one stage before this clause is reached
# ("special rule is not available to black-dwarfs/chaos-dwarfs: band--chaos-dwarf-special-skills-thick-skull"),
# which is the table's access requirement, not this save.  The retarget is inert for the tape: the two
# rows print the identical characteristic line (M3 WS4 BS3 S3 T4 W1 I2 A1 Ld9) and the same
# chaos-dwarf-equipment-list, and of the Hero's automatic profile rules only sorcerer--leader is
# implemented (mechanic.leader-six, which consumes a supplied leader and none is supplied here).
#   band--chaos-dwarf-special-skills-thick-skull  kind warband_skill  applies_to {band: true}  eligibility none
#   sorcerer  type hero  skill_access [combat, academic, strength, special]
# Family model (Chaos Dwarf Thick Skull stun save): the bearer is the printed recipient of this band
# record, built from its own band and profile and selecting the band rule row named in the audit id,
# so the granted effect is what the scenario exercises.  Its physical characteristics are supplied as
# fixture facts (WS3 S3 T3 W1 I2 A1) so the dice thresholds and the strike order are fixed, while its
# printed Leadership stays in place; the bearer's own attack pool is declared empty because a Stunned
# or Knocked Down bearer contributes no attack of its own.  Every expectation is read from the printed
# rule (3+ save on a D6 to avoid being Stunned, Stunned treated as Knocked Down, helmet improves the
# save to 2+ in place of the ordinary Helmet rule) and the recorded parameters, never from engine
# output; the roll tape is derived statically and stays unexecuted.  The band's band-wide Hard to Kill
# and Hard Head rules are different printed operators and are not asserted here.

# The bearer's printed 3+ save is taken on the injury chart's Stunned result and the three is the
# threshold face itself, so the Stunned outcome is converted to Knocked Down.
- audit_id: rule/mordheim/black-dwarfs/band--chaos-dwarf-special-skills-thick-skull/skill.thick-skull
  id: the-printed-three-converts-the-stun
  covers: [thick-skull-save]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      collection: mordheim
      band_id: black-dwarfs
      profile_id: sorcerer
      special_rule_ids: [band--chaos-dwarf-special-skills-thick-skull]
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 2, attacks: 1}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.injury.0, value: 4}
    - {key: round.0.first.attack.0.thick-skull, value: 3}
  expect_rounds:
    0: {state.second.wounds: 0, state.second.condition: KNOCKED_DOWN}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

