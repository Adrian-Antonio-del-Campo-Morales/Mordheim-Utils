# AUTHORED: 5 scenarios carry both printed halves onto the real route.  The borrower is charged
# by a fear-causing fixture and its own Leadership test is the visible consequence, so a supplied same-band
# Overseer three inches away lends the value that passes the declared 3+3 = 6, the same borrower declining the
# optional use tests with its own Leadership 3 and fails, a supplied Overseer four inches away offers nothing at
# all, and the printed scourge widening is the same fixture at five inches with the supplied provider carrying
# the canonical supplied trait key scourge_armed - which passes - beside its own control at the same five
# inches without that key, which fails.  Every borrower declares the printed recipient fact through
# trait_overrides: {slave: true}, the canonical supplied key beside the printed "Any slave within 3 inches"
# gate, so no tape rests on an unnamed identity.  What these tapes detect is the recorded defect: the source row
# already binds mechanic.slave-driver (special-rules.yaml, runtime.effects[0].binding.kind/mechanic), so the
# register's "No binding on this record" is stale, and the printed 3"/6" parameter is not read by the
# borrowing consumer (a range upgrade is not another aura and no second provider is simulated here).  REVIEWED
# still requires manual semantic review.

# --- Authored scenarios ---
# Derived from the printed rule and the recorded contract; no engine output was consulted.  The supplied
# Overseer is a nearby participant of the borrower's own side and band and is the band's printed
# overseer profile; the borrower is a hand-built fixture whose Leadership 3 is a fixture fact, so the
# borrowed value is the only thing that can pass the doubled dice.  The printed "strikes fear into his
# slaves" is read as the Leadership test the borrower faces when it is charged.

