  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The Injury half: a declared 4 (Stunned on the ordinary chart) becomes 5, Out of Action.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.imperial-assassin.rule.backstabber/backstabber
  id: the-assassins-injury-roll-is-at-plus-one
  fighters:
    first: *assassin-unseen
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 3}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.injury.0, value: 4}
  expect_rounds:
    0: {attacks.0.damage: 1, state.second.condition: OUT}
  expect_final: {rounds_executed: 1, termination_reason: second_out}

