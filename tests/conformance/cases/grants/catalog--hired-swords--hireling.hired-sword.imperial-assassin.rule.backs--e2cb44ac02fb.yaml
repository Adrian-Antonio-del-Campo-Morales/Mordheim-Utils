# Printed text (grade-1a.yaml, Backstabber): "the Assassin may charge an opponent he cannot see as
# long as the target is within his charge reach; he then receives +1 to hit with all attacks and +1
# on Injury rolls for the first round of combat only.  The unseen charge is supplied as a duel fact".
# The rule is grant: profile binding skill.backstabber (consumers: modular/contexts.py ~526-528 and
# modular/attacks.py ~804-809, both gated on first_round, charging, skill.backstabber and
# condition.unseen-charge).  Recipient: hirelings.hired-sword.1a / hireling.hired-sword.imperial-assassin
# with the fixture facts (WS3 S3 T3 W2 I5 A1; the printed Ld8 stays), the kit sword as main weapon
# and the supplied fact through condition_ids.  Opponent: hand-built (WS3 S3 T3 I2 A1 Ld7, mace; W3
# keeps a wound short of the injury roll, W1 reaches it), whose own blow is a natural 1 so the sword
# offers no parry.  Arithmetic: Unstoppable Charge makes the charging Assassin WS4 against WS3 (3+);
# Backstabber lowers it to 2+; S3 wounds T3 on 4+; the injury chart is 1-2 Knocked Down, 3-4 Stunned,
# 5-6 Out of Action, so a declared 4 is the +1 boundary.  Control: the grade-1b Bard (dagger) with the
# same supplied fact, WS3 against WS3 on 4+.  Refusal: the Bard selecting the Assassin's profile rule,
# refused by the compiler with the other-package fragment.

# The Assassin's unseen charge: the 2 hits.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.imperial-assassin.rule.backstabber/backstabber
  id: the-assassin-hits-on-a-two-in-the-first-round-of-his-unseen-charge
  fighters:
    first: &assassin-unseen
      collection: mordheim
      band_id: hirelings.hired-sword.1a
      profile_id: hireling.hired-sword.imperial-assassin
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
      main_weapon_id: weapon.sword
      main_poison_id: poison.black-lotus
      condition_ids: [condition.unseen-charge]
    second: &opponent
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: true, attacks.0.hit_target: 2, attacks.0.damage: 1, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

