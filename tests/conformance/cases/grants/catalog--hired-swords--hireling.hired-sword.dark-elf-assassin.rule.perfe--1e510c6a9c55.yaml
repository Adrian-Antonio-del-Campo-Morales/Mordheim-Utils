# Hireling family model (README, Hireling recipients): the recipient is the printed Dark Elf Assassin
# compiled through the hireling route (hirelings.hired-sword.1b / hireling.hired-sword.dark-elf-assassin),
# her printed rule granted by the profile itself; fixture characteristics WS3 S3 T3 W2 I5 A1 (printed Ld8
# stays); the kit dagger is named.  The opponent is hand-built (WS3 S3 T3 W3 I2 A1, mace) with its attacks
# silenced, wearing heavy armour (5+) where the modification is at stake and nothing where the cancellation
# is.  Arithmetic (Strength 3 modifies nothing): heavy 5+, the dagger's +1 to the target's save makes 4+,
# Perfect Killer's extra -1 makes 5+, so a declared four separates the recipient (fails) from the Bard
# (saves); unarmoured, the dagger's 6+ is cancelled to a bare 7 and no armour die is requested at all, where
# the Bard's dagger asks the 6+.  Hits are fours (4+), wounds fours (S3 vs T3 on 4+, never a six).

# Against heavy armour the assassin's dagger wound is saved only on 5+: the four fails and the wound lands.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.dark-elf-assassin.rule.perfect-killer/trait.perfect-killer
  id: the-assassins-extra-penalty-takes-the-heavy-armour-save-past-the-daggers-four
  fighters:
    first:
      &recipient
      collection: mordheim
      band_id: hirelings.hired-sword.1b
      profile_id: hireling.hired-sword.dark-elf-assassin
      main_weapon_id: weapon.dagger
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      &armoured
      main_weapon_id: weapon.mace
      armour_id: armour.heavy-armour
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.armour, value: 4}
  expect_rounds:
    0: {attacks.0.saved: false, attacks.0.damage: 1, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

