# --- Authored scenarios ---
# Derived from the printed rule text, the recorded canonical contract and the accepted tomb-guardians
# immunity tape; no engine output was consulted.

- audit_id: rule/mordheim/metal-mongers-mim/machine-ogre--bio-machinery/mechanic.psychology-immunity
  id: the-machine-ogre-is-not-tested-for-fear
  fighters:
    first:
      main_weapon_id: weapon.chainsaw-sword
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 7, attacks: 1, leadership: 7}
    second: {collection: mordheim, band_id: metal-mongers-mim, profile_id: machine-ogre}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  # Both duellists strike with their whole printed pool, so every hit die is declared: the
  # attacker's single attack and the machine-ogre's printed A3, and every strike is a natural 1.
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.0.second.attack.1.hit, value: 1}
    - {key: round.0.second.attack.2.hit, value: 1}
  expect_rounds:
    0: {state.second.condition: STANDING, state.engaged: true}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# Real recipient (2026-11-16): the printed Machine-Ogre (immune to psychology, and a Fear-causer) is
# gazed by an enemy with Hypnotic Gaze, whose printed text says "Models immune to Psychology are
# unaffected": no gaze die is asked for, the ogre is not barred and resolves its three printed
# attacks (all declared misses). Unlike the Fear scenario above, its own Fear cannot produce this
# result. Because the immune model is "unaffected", the gaze is never declared against it either:
# unlike the Automatic Leadership copy (Spawn of Chaos), where the gaze is declared and its test
# passes without a die, here no declaration is scripted. (Fixed 2026-11-16: the KB record
# machine-ogre--bio-machinery carried runtime.implemented 'NO' although its only YES effect is
# bound, so the immunity never compiled; the printed expectation was kept unchanged.)
- audit_id: rule/mordheim/metal-mongers-mim/machine-ogre--bio-machinery/mechanic.psychology-immunity
  id: the-machine-ogre-ignores-a-hypnotic-gaze
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.hypnotic-gaze]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 7, attacks: 1, leadership: 7}
    second: {collection: mordheim, band_id: metal-mongers-mim, profile_id: machine-ogre}
  duel_context:
    charging: []
    active_participant: first
  maximum_rounds: 1
  rolls:
  - {key: round.0.first.attack.0.hit, value: 1}
  - {key: round.0.second.attack.0.hit, value: 1}
  - {key: round.0.second.attack.1.hit, value: 1}
  - {key: round.0.second.attack.2.hit, value: 1}
  expect_rounds:
    0: {state.second.charm_attack_blocked: false, state.second.charm_auto_hit: false, attacks.3.hit: false}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The Frenzy and Hatred faces of the same printed grant ("The Machine-Ogre is immune to psychology"),
# authored 2026-11-18.  No Metal Mongers package pairs this profile with a second psychology grant, so
# the mirror is the hand-built warrior the canonical mechanic.* tapes use - the route the accepted
# ghost-pirates gibbets immune-to-psychology file established, with the same injected grants and the
# same assertions.  Immunity suppresses Frenzy before the duel starts, skips the Stupidity test, and
# denies the Hatred (Undead) reroll of the declared natural one: every psychology die that is not
# declared is the assertion, and the strict tape rejects any undeclared request.
- audit_id: rule/mordheim/metal-mongers-mim/machine-ogre--bio-machinery/mechanic.psychology-immunity
  id: the-immunity-skips-stupidity-suppresses-frenzy-and-denies-the-hatred-reroll
  fighters:
    first:
      trait_overrides: {frenzy: true}
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.stupidity, mechanic.hatred-undead, mechanic.psychology-immunity]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 6}
    second: {collection: mordheim, band_id: undead, profile_id: zombies}
  expect_initial: {first.frenzy: false}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 0, state.first.stupidity_failed: False, state.first.frenzy: False}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
