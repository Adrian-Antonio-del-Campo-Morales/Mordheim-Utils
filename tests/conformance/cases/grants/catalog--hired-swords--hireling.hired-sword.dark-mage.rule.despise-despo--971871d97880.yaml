# Hireling family model (P0, 2026-11-17).  The recipient is the printed hireling profile, compiled
# through the hireling route (band_id hirelings.<kind>.<grade>, profile_id hireling.<kind>.<slug>); its
# printed rule is granted by the profile itself, so the build selects nothing.  Its physical
# characteristics are supplied as fixture facts (WS3 S3 T3 W2 I5 A1) so every die threshold is fixed,
# while its printed Leadership (7) stays in place; the omitted main weapon is the printed kit's own staff
# (quarterstaff: two-handed, parry, +1 Initiative), whose parry is never requested because the opponent's
# strike is a natural 1.  The opponent is hand-built (WS3 S3 T3 W3 I2 A1 Ld7, mace) and declares the one
# fact the rule reads: the Necromancer identity (trait_overrides necromancer: true), which the recorded
# Despise Despoilers contract hates.  The control is a plain hireling without any psychology rule - the
# grade-1b Bard - compiled through the same route with the same fixture, so the re-roll the rule grants is
# shown absent without it.  The refusal selects the printed rule on that control through special_rule_ids:
# a profile-granted rule is not available elsewhere.  The Dark Mage's own Wizard and Self Assured rules are
# scope NO and add no request.
# Dice: a natural 2 misses WS3; the printed Hatred re-roll of the first round is requested, 4 hits and S3
# wounds T3 on 4+; the unarmoured opponent has no save die.

# The recipient charges a Necromancer: the first-round miss is re-rolled, hits and wounds.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.dark-mage.rule.despise-despoilers/mechanic.despise-despoilers
  id: a-first-round-miss-by-the-dark-mage-is-rerolled-against-a-necromancer
  fighters:
    first:
      &recipient
      collection: mordheim
      band_id: hirelings.hired-sword.2a
      profile_id: hireling.hired-sword.dark-mage
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      &necromancer
      main_weapon_id: weapon.mace
      trait_overrides: {necromancer: true}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.first.attack.0.hit.reroll, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.wounds: 2, state.first.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# Without the hated identity the strict tape holds no re-roll key and the same miss stands.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.dark-mage.rule.despise-despoilers/mechanic.despise-despoilers
  id: the-same-miss-stands-against-an-opponent-who-is-not-a-necromancer
  fighters:
    first:
      <<: *recipient
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The control (Bard) charges the same Necromancer: the miss is not offered a re-roll.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.dark-mage.rule.despise-despoilers/mechanic.despise-despoilers
  id: a-hireling-without-the-hatred-receives-no-reroll-against-the-same-necromancer
  fighters:
    first:
      collection: mordheim
      band_id: hirelings.hired-sword.1b
      profile_id: hireling.hired-sword.bard
      main_weapon_id: weapon.dagger
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      <<: *necromancer
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.wounds: 3, attacks.0.hit: false}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The printed grant belongs to the recipient's profile; selecting it on another hireling is refused.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.dark-mage.rule.despise-despoilers/mechanic.despise-despoilers
  id: the-rule-is-refused-on-a-hireling-outside-its-printed-profile
  fighters:
    first:
      collection: mordheim
      band_id: hirelings.hired-sword.1b
      profile_id: hireling.hired-sword.bard
      main_weapon_id: weapon.dagger
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
      special_rule_ids: [hireling.hired-sword.dark-mage.rule.despise-despoilers]
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  expect_error: "special rule is not available to hirelings.hired-sword.1b"
