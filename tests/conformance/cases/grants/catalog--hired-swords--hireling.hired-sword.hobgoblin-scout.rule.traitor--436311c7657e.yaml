# Hireling family model (README, Hireling recipients): the recipient is the printed Hobgoblin Scout compiled
# through the hireling route (hirelings.hired-sword.1c / hireling.hired-sword.hobgoblin-scout), its printed
# rule granted by the profile itself; fixture characteristics WS3 S3 T3 W2 I5 A1 (printed Ld6 stays); the
# kit dagger is named.  Because the rule acts on the opponent, the Scout is the charged side here and the
# hand-built opponent (WS3 S3 T3 W3 I2 A1 Ld7, mace) declares the one fact the clause reads (species).
# Printed text: "Opposing Orcs, Goblins and Black Orcs hate the Hobgoblin Scout".  Dice: the opponent's
# natural 2 misses (4+), the Hatred re-roll of 4 hits, S3 wounds T3 on a 4, no save; the Scout's own dagger
# swing is a declared natural 1.  The control is the grade-1b Bard as the charged side: a hireling without
# any such mark, against whom the same Orc is offered no re-roll.

# An opposing Orc charges the Scout: its 2 misses, the printed hatred re-roll is requested, 4 hits, 4 wounds.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.hobgoblin-scout.rule.traitor/mechanic.greenskin-traitor
  id: an-opposing-orcs-first-round-miss-against-the-hobgoblin-scout-is-rerolled
  fighters:
    first:
      &orc
      main_weapon_id: weapon.mace
      trait_overrides: {species: orc}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
    second:
      &recipient
      collection: mordheim
      band_id: hirelings.hired-sword.1c
      profile_id: hireling.hired-sword.hobgoblin-scout
      main_weapon_id: weapon.dagger
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.first.attack.0.hit.reroll, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: true, attacks.0.damage: 1, state.second.wounds: 1, state.first.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

