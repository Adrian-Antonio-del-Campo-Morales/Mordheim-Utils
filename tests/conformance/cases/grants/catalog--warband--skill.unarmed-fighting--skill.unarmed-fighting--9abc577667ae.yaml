# --- Authored scenarios ---
# Derived from the printed stanza and the recorded contract; no engine output was consulted.  Both attacks
# of the skill bearer miss on a declared 1, so no wound die is needed and the evidence the case carries is
# the tape itself: the strict runner consumes attack.0 and attack.1 only if the unarmed pool really holds
# the printed extra attack, and the clamped control consuming attack.0 alone is the same evidence the other
# way round.
- audit_id: rule/catalog/warband/skill.unarmed-fighting/skill.unarmed-fighting
  id: the-unarmed-bearer-is-not-clamped-and-gains-one-attack
  fighters:
    first:
      skill_ids: [skill.unarmed-fighting]
      main_weapon_id: weapon.fist
      characteristics: &uf-bearer {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: &uf-opponent {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: &uf-context {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.first.attack.1.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: false, attacks.1.hit: false, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

