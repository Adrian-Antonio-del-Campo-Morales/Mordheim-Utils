# Discriminating repair (2026-11-16): the two immune scenarios above cannot tell the immunity apart.
#   Both declare the bearer's own printed Lunatics roll as a 1 ("On 1-3 that model gains Frenzy"),
#   and a frenzied warrior already ignores Fear and passes Stupidity without a test, so the Fear test
#   and the Head Injury Stupidity test are skipped with or without the immunity.  They stay as
#   evidence of the printed outcome.  This scenario declares the Lunatics roll as a 4 ("on 4-6 it
#   gains Stupidity"): the warrior is not frenzied, so only the printed "Wild Lunatics are immune to
#   Psychology" spares it the Fear test of a warrior charged by a Fear-causer.  The charger is the
#   active duelist, so the bearer takes no Stupidity test of its own this round, and it fights with
#   its unfrenzied printed A1.  Every strike is a natural 1.
