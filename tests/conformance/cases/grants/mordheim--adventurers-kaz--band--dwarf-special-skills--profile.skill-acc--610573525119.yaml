- audit_id: rule/mordheim/adventurers-kaz/band--dwarf-special-skills/profile.skill-access
  id: the-declared-table-member-is-admitted-to-the-recipient
  fighters:
    first:
      collection: mordheim
      band_id: adventurers-kaz
      profile_id: dwarf
      skill_ids: [skill.monster-slayer]
      main_weapon_id: weapon.mace
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  initial_state: {first: {attacks: 0}, second: {attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.priority-tie, value: 4}
  expect_final: {rounds_executed: 1}

- audit_id: rule/mordheim/adventurers-kaz/band--dwarf-special-skills/profile.skill-access
  id: a-special-skill-outside-the-printed-table-is-refused
  fighters:
    first:
      collection: mordheim
      band_id: adventurers-kaz
      profile_id: dwarf
      skill_ids: [skill.miniath]
      main_weapon_id: weapon.mace
  expect_error: "skills are not available to adventurers-kaz/dwarf: ['skill.miniath']"
