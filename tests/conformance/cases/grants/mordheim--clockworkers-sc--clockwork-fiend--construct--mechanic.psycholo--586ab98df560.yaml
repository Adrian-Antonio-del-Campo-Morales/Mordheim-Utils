# --- Authored scenarios ---

# The contrast: the same charger against the band's non-construct handymen, which carries no psychology immunity,
# does ask for the two-dice Fear test, declared here as a passing 1+1.
- audit_id: rule/mordheim/clockworkers-sc/clockwork-fiend--construct/mechanic.psychology-immunity
  id: a-band-mate-without-the-immunity-is-tested
  fighters:
    first:
      trait_overrides: {causes_fear: true}
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 7, attacks: 1, leadership: 7}
    second: {collection: mordheim, band_id: clockworkers-sc, profile_id: handymen}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.fear.charged.0, value: 1}
    - {key: round.0.second.fear.charged.1, value: 1}
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.wounds: 1, state.second.condition: STANDING}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The printed immunity to Psychology, read through the round-0 Fear test of the charged warrior: the charger
# declares causes_fear, and the immune construct declares no Fear die at all, so the round holds only the
# charger's strike.  The bearer's own attack dice are suppressed, as the sibling poison tapes do for this profile.
- audit_id: rule/mordheim/clockworkers-sc/clockwork-fiend--construct/mechanic.psychology-immunity
  id: the-charged-construct-is-not-tested-for-fear
  fighters:
    first:
      trait_overrides: {causes_fear: true}
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 7, attacks: 1, leadership: 7}
    second: {collection: mordheim, band_id: clockworkers-sc, profile_id: clockwork-fiend}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  # No Fear die is offered to the immune construct. Its emptied pool still resolves one printed
  # unarmed attack, declared here as a miss so the observation stays the immunity.
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 0, state.second.wounds: 3, state.second.condition: STANDING}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# Discriminating repair (2026-11-16): the Fear scenario above cannot tell the immunity apart, because
#   the bearer's own printed Fear rule already exempts it from Fear tests, so it stays as evidence
#   of the printed outcome but not of this grant.  The printed immunity ("not affected by
#   psychology" - Stupidity is a Psychology test) is read instead through Stupidity: the bearer,
#   built from its own printed profile (clockwork-fiend: W3 A3 Ld8), carries a supplied Head Injury
#   (permanent disability result 6: the warrior is subject to Stupidity, design-rulings
#   "Disability consumes a permanent supplied result - 2026-10-15") and is the active duelist with
#   no friendly Hero nearby, so a non-immune warrior must take the 2D6 Stupidity test at the start
#   of its turn.  The immune bearer declares no Stupidity die and keeps fighting: the strict tape
#   holds only its single strike (the construct carries
#   no weapon, so its printed A3 is held to one attack by the accepted one-attack fist cap,
#   design-rulings S1), a natural 1, so nothing else is resolved.  The
#   hand-built opponent fights with attacks 0.  Contrast: the band-mate handymen
#   (W1 Ld6), which binds no psychology
#   immunity, is asked for the same test; 6+6 fails it against any Leadership, so it is Stupid and
#   makes no attack.

- audit_id: rule/mordheim/clockworkers-sc/clockwork-fiend--construct/mechanic.psychology-immunity
  id: the-immune-warrior-takes-no-stupidity-test
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 10, attacks: 1, leadership: 7}
    second: {collection: mordheim, band_id: clockworkers-sc, profile_id: clockwork-fiend}
  initial_state: {first: {attacks: 0}, second: {resources_spent: [disability.6]}}
  duel_context: {charging: [], active_participant: second}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.wounds: 3, state.second.wounds: 3, state.second.stupidity_failed: false, state.second.condition: STANDING}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

- audit_id: rule/mordheim/clockworkers-sc/clockwork-fiend--construct/mechanic.psychology-immunity
  id: a-band-mate-without-the-immunity-is-tested-for-stupidity
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 10, attacks: 1, leadership: 7}
