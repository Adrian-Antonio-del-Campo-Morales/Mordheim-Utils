# --- Authored scenarios ---
# Printed text (halflings-mic/special-rules.yaml, Layers of Fat): "The Halfling always has a basic
# saving throw of 6 regardless of the enemy warrior's strength and on top of any armour he already
# wears."  This binding is the "on top of any armour he already wears" half
# (trait.natural-armour-stacks, parameters value true); the 6 itself is the sibling
# trait.natural-armour-save (...e04eb51d825c, whose runtime review note already records that light
# armour plus Layers of Fat is a single 5+ combined save) and the Strength immunity the sibling
# trait.natural-armour-unmodified (...90d491c9f5f0).  Compiler: with natural_armour_stacks and a
# natural save of 6 or better the compiled armour_save loses 7-natural steps (compiler.py
# ~1442-1443: light armour 6+ becomes 5+, nothing worn becomes 6+) and natural_armour_stacks is
# projected onto the CompiledFighter (~1490).  Engine: phases.py armour_target (~621-634) resolves
# min(armour, natural) and asks the die round.<i>.<attacker>.attack.<n>.armour while the target is 6
# or better.
# Family model (the sibling file): the bearer is the halfling-elder of halflings-mic, compiled
# without a weapon (its empty hands) and silenced, keeping its printed W1 so a failed save reaches the
# Injury die (declared a one, Knocked Down); light armour is named where the stacking is at stake.
# The attacker is a hand-built fixture (mace; Weapon Skill 10 and Initiative 10 are fixture facts)
# at Strength 3, which modifies no save; Strength 3 wounds Toughness 3 on 4+ and the wound face
# stays below a natural six.  The non-stacking control is a hand-built fixture given a natural 6+
# through trait_overrides without the stacking trait, in the same light armour.

# Fat and light armour: the compiled combined save is 5+ and the five holds.
- audit_id: rule/mordheim/halflings-mic/halfling-elder--layers-of-fat/trait.natural-armour-stacks
  id: the-fat-and-light-armour-combine-into-a-five-plus-and-the-five-holds
  fighters:
    first:
      &attacker
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 10, strength: 3, toughness: 3, wounds: 3, initiative: 10, attacks: 1}
    second: &armoured-elder {collection: mordheim, band_id: halflings-mic, profile_id: halfling-elder, armour_id: armour.light-armour}
  initial_state: {second: {attacks: 0}}
  duel_context: &uncharged {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 5}
    - {key: round.0.first.attack.0.armour, value: 5}
  expect_fighters:
    second.natural_armour_stacks: True
    second.natural_armour_save: 6
    second.armour_save: 5
  expect_rounds:
    0: {attacks.0.saved: true, attacks.0.damage: 0, state.second.wounds: 1, state.second.condition: STANDING}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# One face below the combined save is a wound; on the printed W1 the Injury die follows.
- audit_id: rule/mordheim/halflings-mic/halfling-elder--layers-of-fat/trait.natural-armour-stacks
  id: one-face-below-the-combined-save-is-a-wound
  fighters:
    first: *attacker
    second: *armoured-elder
  initial_state: {second: {attacks: 0}}
  duel_context: *uncharged
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 5}
    - {key: round.0.first.attack.0.armour, value: 4}
    - {key: round.0.first.attack.0.injury.0, value: 1}
  expect_rounds:
    0: {attacks.0.saved: false, attacks.0.damage: 1, state.second.wounds: 0, state.second.condition: KNOCKED_DOWN}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

