# The non-stacking control: a natural 6+ without the stacking trait in the same light armour keeps
# the better of two 6+ layers, so the five is a wound where the Elder's held.
- audit_id: rule/mordheim/halflings-mic/halfling-elder--layers-of-fat/trait.natural-armour-stacks
  id: a-non-stacking-natural-six-plus-and-light-armour-do-not-add
  fighters:
    first: *attacker
    second:
      main_weapon_id: weapon.mace
      armour_id: armour.light-armour
      trait_overrides: {natural_armour_save: 6}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
  initial_state: {second: {attacks: 0}}
  duel_context: *uncharged
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 5}
    - {key: round.0.first.attack.0.armour, value: 5}
  expect_fighters:
    second.natural_armour_stacks: False
    second.natural_armour_save: 6
    second.armour_save: 6
  expect_rounds:
    0: {attacks.0.saved: false, attacks.0.damage: 1, state.second.wounds: 1, state.second.condition: STANDING}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
