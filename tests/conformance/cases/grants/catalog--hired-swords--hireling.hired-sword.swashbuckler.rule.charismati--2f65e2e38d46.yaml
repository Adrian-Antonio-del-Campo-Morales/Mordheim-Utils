# Hireling family model (P0, 2026-11-17).  The recipient is the printed Swashbuckler compiled through
# the hireling route (hirelings.hired-sword.2a / hireling.hired-sword.swashbuckler) with the fixture
# facts (WS3 S3 T3 W2 I5 A1; the printed Ld8 stays) and his kit dagger in hand (the kit's rapier would
# add a parry request to any hit he takes; the duelling pistol would fire in close combat; the light
# armour stays owned, not worn).  His printed Charismatic is granted by the profile itself, so the build
# selects nothing; Acrobatic and Nimble are out of scope.  The charging opponent is hand-built (WS3 S3
# T3 W3 I2 A1 Ld7, mace) and declares its sex.  The gate is a 2D6 Leadership test keyed
# `round.0.first.charismatic-charge.{0,1}` taken before contact: 5+4 fails Ld7 and the voluntary charge
# is cancelled (no combat dice, the duel ends disengaged); 3+3 passes and the charge resolves as
# ordinary close combat with natural-1 strikes.  The control is the grade-1b Bard compiled through the
# same route with the same stated sex; the refusal selects the printed rule on that control.

# A woman charges the Swashbuckler and fails the gate: the charge is lost before any blow.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.swashbuckler.rule.charismatic/mechanic.opposite-sex-charge-test
  id: a-woman-charging-the-swashbuckler-who-fails-the-leadership-gate-cannot-close
  fighters:
    first:
      &woman-charger
      main_weapon_id: weapon.mace
      trait_overrides: {sex: female}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
    second:
      &swashbuckler
      collection: mordheim
      band_id: hirelings.hired-sword.2a
      profile_id: hireling.hired-sword.swashbuckler
      main_weapon_id: weapon.dagger
      trait_overrides: {sex: male}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.charismatic-charge.0, value: 5}
    - {key: round.0.first.charismatic-charge.1, value: 4}
  expect_rounds:
    0: {attacks: [], state.first_charged: False, state.failed_charges: ['first'], state.engaged: False}
  expect_final: {rounds_executed: 1, termination_reason: disengaged}

# The same gate passed: the charge proceeds into ordinary close combat.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.swashbuckler.rule.charismatic/mechanic.opposite-sex-charge-test
  id: a-woman-charging-the-swashbuckler-who-passes-the-leadership-gate-closes-and-fights
  fighters:
    first:
      <<: *woman-charger
    second:
      <<: *swashbuckler
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.charismatic-charge.0, value: 3}
    - {key: round.0.first.charismatic-charge.1, value: 3}
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first_charged: True, state.engaged: True, state.first.wounds: 3, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

