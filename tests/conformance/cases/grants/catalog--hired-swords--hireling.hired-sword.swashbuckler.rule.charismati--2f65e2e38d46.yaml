# The printed grant belongs to the recipient's profile; selecting it on another hireling is refused.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.swashbuckler.rule.charismatic/mechanic.opposite-sex-charge-test
  id: the-rule-is-refused-on-a-hireling-outside-its-printed-profile
  fighters:
    first:
      <<: *woman-charger
    second:
      <<: *swashbuckler-control
      special_rule_ids: [hireling.hired-sword.swashbuckler.rule.charismatic]
  expect_error: "special rule is not available to hirelings.hired-sword.1b"
