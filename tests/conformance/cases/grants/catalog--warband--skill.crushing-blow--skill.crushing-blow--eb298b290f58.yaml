# AUTHORED: 2 scenarios contrast the denied parry with the same sword
#   parrying the same roll when the skill is absent.

# --- Authored scenarios ---
# The warband skill list prints the canonical crushing-blow wording: the effect
# belongs to the fighter, so the denial is tested against a parrying opponent.
# The opposing sword would parry a four with a five, but the printed attacks cannot
# be parried: the tape resolves no parry die at all and the wound is taken.
- audit_id: rule/catalog/warband/skill.crushing-blow/skill.crushing-blow
  id: a-parrying-opponent-is-denied-the-parry
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [skill.crushing-blow]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.sword
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 1, attacks.0.parried: False, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# Without the skill the same four is parried by the sword's five, which is what the
# denial removes.
- audit_id: rule/catalog/warband/skill.crushing-blow/skill.crushing-blow
  id: the-same-sword-parries-without-the-skill
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.sword
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.parry, value: 5}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.parried: True, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
