#
# AUTHORED: 4 scenarios cover the exchange through the printed unarmed scope: the declared
#   sacrifice of one attack leaves the pool one die smaller while the same die wounds at one Strength
#   higher (Strength 5 against Toughness 3 wounds on a 2+ where Strength 4 needs a 3+), the control
#   without the sacrifice keeps the whole pool at the lower Strength, and the executor's unarmed floor
#   leaves no attack at all when the sacrifice is taken without a printed unarmed skill.  The declared
#   count is supplied as energy_focus_attacks - the same declaration route the published case of this
#   operator uses - and the band row is recorded as adding no second runtime term.
