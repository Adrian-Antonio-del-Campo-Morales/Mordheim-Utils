#
# AUTHORED: the printed rule ("For each Injury result roll a D6: on 4+ the result is ignored, without
#   restoring lost Wounds. Magical attacks and magical weapons bypass this roll. The ordinary Undead No
#   Pain conversion still applies independently") binds mechanic.undead-construct and skill.ignore-pain
#   (this identity).  Consumers: the table conversion Stunned -> Knocked Down
#   (packages/python/combat-engine/mordheim_combat/phases.py injury_condition, ignore_pain) and the
#   construct die rolled by the defender after each Injury result
#   (round.<r>.<side>.attack.<n>.injury.<i>.undead-construct, modular/attacks.py), which on 4+ drops
#   that result while the Wound stays lost.  This binding decides the face the construct die lets
#   through; the profile has no Incorporeal-style injury profile, so a real face exists.
#
# Hireling family model (P0, 2026-11-17) in the Cairn Wraith No Pain shape.  The recipient is the
# printed profile compiled through the hireling route (hirelings.hired-sword.1c /
# hireling.hired-sword.bone-goliath) with the fixture characteristics (WS3 S3 T3 I5 A1) and wounds 1 so
# the first wound reaches the Injury table; it contributes no attack of its own (initial_state).  Its
# innate natural attacks have no parry, it wears no armour, and its Fear tests only a charging
# attacker; nobody charges.  The attacker is the stronger hand-built fixture (WS10 S8 I10, mace): 3+ to
# hit, 2+ to wound with no critical face, a mundane attack so the construct die is rolled.  The control
# is the grade-1b Bard (dagger; kit armour owned, not worn) with the same fixture.

# --- Authored scenarios ---

- audit_id: rule/catalog/hired-swords/hireling.hired-sword.bone-goliath.rule.undead-construct/skill.ignore-pain
  id: when-the-construct-die-fails-the-independent-no-pain-leaves-a-stunned-result-knocked-down
  fighters:
    first:
      &strong-attacker
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 10, strength: 8, toughness: 3, wounds: 3, initiative: 10, attacks: 1}
    second:
      &recipient
      collection: mordheim
      band_id: hirelings.hired-sword.1c
      profile_id: hireling.hired-sword.bone-goliath
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 5, attacks: 1}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 5}
    # 3 is Stunned on the printed table; No Pain converts it to Knocked Down.
    - {key: round.0.first.attack.0.injury.0, value: 3}
    # The construct D6 of 2 does not ignore the result, so the converted result stands.
    - {key: round.0.first.attack.0.injury.0.undead-construct, value: 2}
  expect_rounds:
    0: {state.second.wounds: 0, state.second.condition: KNOCKED_DOWN}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# On 4+ the construct ignores the whole Injury result: nothing is left for No Pain to convert, the
# Goliath stays standing and the lost Wound is not restored.
