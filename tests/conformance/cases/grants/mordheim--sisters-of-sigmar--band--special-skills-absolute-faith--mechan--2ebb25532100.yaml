#
# Clause: fear-reroll (scope: YES)
# AUTHORED[fear-reroll]: 3 scenarios cover the printed "she may re-roll any fear tests".  The bearer is a
# hand-built fixture of the printed Leadership the charged test uses, carrying the canonical operator; the
# enemy charges it and is the fear-causer (its causes-fear fact is its own trait_override), so the test is
# the charged warrior's Fear test, whose printed consequence on a failure is that its own hits need a
# natural six.  The declared pair of sixes fails the test, the declared choice takes the single offered
# reroll and the second pair of ones passes it, so the bearer is back to its ordinary hits; the second
# scenario declares the reroll failing as well and shows the accepted second result; the third carries the
# same dice without the grant, where no reroll is offered and the failure stands.
#
# Clause: all-alone (scope: NO)
# Outside the admitted clause scope; retained for context, not a test TODO.

# --- Authored scenarios ---
# Derived from the printed rule and the recorded contract; no engine output was consulted.  Both fighters
# attack once with a plain mace and every declared attack die is a natural one, a miss, so the Fear test and
# its reroll are the whole of the evidence.

