# Poison-immunity family model (the authored necrarchs-the-soul-stealers-lotd1 and call-of-the-
# night-haint-mim files of this directory): Nightshade is the one admitted poison whose consequence
# is a state change on the warrior it wounds (one unsaved wound lowers Initiative by one, carried as
# the lasting initiative_penalty field; modular/attacks.py reads `poison.nightshade` on the attack
# and skips the rider when the defender's global effects carry `poison_immune` / poison_immunity,
# compiled from the trait by roster-construction compiler.py), so it is the rider the printed
# immunity must suppress: the coated mace wounds the bearer as any mace would, and the penalty never
# lands.  The attacker's Weapon Skill 10, Strength 8 and Initiative 10 are hand-built fixture facts,
# not profile values; its higher Initiative with no charge declared lets it strike first, and the
# bearer declares no attack of its own.  The control is a hand-built fighter carrying the bearer's
# printed characteristic line without the grant, under the same tape, so the only difference between
# the two scenarios is the immunity.  The refusal selects the printed profile rule on another
# profile of the band (not selectable: `special rule is not available to <band>`).
# Printed clause (Mousillon Necrarchs p.6, Banshee special rules): Immune to Poisons, shared with
# the band's drug-and-poison immunity (the drug half is the sibling mechanic.drug-immunity
# identity). Profile facts read: Fear (no die without a charge), Ethereal (movement only, scope NO:
# this band's Banshee has no ethereal interception save, unlike the call-of-the-night-haint-mim Tomb
# Banshee, so no `.ethereal` die is declared), Cold Steel (a steel weapon is at -1 to hit; the
# authored banshee--cold-steel file) and Wailing (LATER).  The mace is steel, so the hit die is
# declared a 5, which hits WS4 from WS10 with or without the -1 (a 4 would also hit, 3+ -> 4+, but
# the 5 keeps the tape independent of that reading); S8 v T4 wounds on 2+ (a 4 is no critical).  She
# carries no equipment and compiles to `weapon.natural-attacks`, silenced by `attacks: 0`; her blank
# Initiative makes her strike last in any case.  The printed line has one Wound, so the Nightshade
# wound is her last: the injury die is declared (a 1 is Knocked Down) and the suppressed rider is
# read on the state.  The hand-built control carries her printed line with Initiative 1 as a fixture
# fact (the hand-built form needs a number; the attacker's 10 strikes first either way) and no Cold
# Steel, so the same 5 hits it on 3+.

# The coated mace wounds the bearer (printed WS4 S3 T4 W1 I- A1 Ld5): the declared 5 hits, the declared
# 4 wounds at S8 (no critical six), the printed single Wound is lost and the declared injury die of 1 leaves the bearer Knocked Down, and the
# poisoned-wound Initiative penalty is suppressed: initiative_penalty stays 0.
- audit_id: rule/mordheim/necrarchs-mou/banshee--immune-to-poisons/trait.poison-immune
  id: the-poisoned-wound-keeps-its-wound-and-loses-its-rider
  fighters:
    first:
      main_weapon_id: weapon.mace
      main_poison_id: poison.nightshade
      characteristics: {weapon_skill: 10, strength: 8, toughness: 3, wounds: 3, initiative: 10, attacks: 1}
    second: {collection: mordheim, band_id: necrarchs-mou, profile_id: banshee}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 5}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.injury.0, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 1, state.second.wounds: 0, state.second.initiative_penalty: 0, state.second.condition: KNOCKED_DOWN}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

