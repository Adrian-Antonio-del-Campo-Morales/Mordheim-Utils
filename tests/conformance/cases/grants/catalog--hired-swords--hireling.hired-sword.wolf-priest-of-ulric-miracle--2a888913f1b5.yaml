# Rule (grade-2b.yaml, hireling.hired-sword.wolf-priest-of-ulric-miracle-workers.rule.strictures,
# grant profile): "Wolf-Priests of Ulric may never wear armour ... every Wolf-Priest is garbed in a
# cloak made from the pelt of a white wolf; the pelt allows a 6+ saving throw ... may never be
# equipped with blackpowder weapons" - this binding is the pelt's mechanic defence.wolf-pelt-cloak
# (execution.yaml: armour_save_bonus 1, so the compiled save is 7-1 = 6+); the forbids binding
# (armour, blackpowder) is the sibling identity.  Hireling family model (README, Hireling
# recipients): the real Wolf-Priest through the hireling route (hirelings.hired-sword.2b) with the
# fixture facts (WS3 S3 T3 W2 I5 A1; printed Ld8 stays), his kit dagger in hand and the kit pelt
# declared worn; he is silenced (attacks 0) so the only dice are the attacker's.  The attacker is
# hand-built (WS3 S3 T3 W3 I2 A1 Ld7, mace) and charges.  The control is the grade-1b Bard with
# nothing worn (his kit light armour is owned, not worn).  WS3 against WS3 hits on 4+; S3 against
# T3 wounds on 4+; an S3 blow carries no save modifier, so the pelt's 6+ is rolled unmodified.
# His Intense Rivals hatred reads Sigmarite enemies only, so a hand-built opponent asks nothing.

# The printed 6+ on its own face: the armour die 6 turns the wound and the compiled save is 6.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.wolf-priest-of-ulric-miracle-workers.rule.strictures/defence.wolf-pelt-cloak
  id: the-real-wolf-priests-pelt-saves-on-six
  fighters:
    first:
      &pelt-attacker
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
    second:
      &pelt-recipient
      collection: mordheim
      band_id: hirelings.hired-sword.2b
      profile_id: hireling.hired-sword.wolf-priest-of-ulric-miracle-workers
      main_weapon_id: weapon.dagger
      defence_ids: [defence.wolf-pelt-cloak]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.armour, value: 6}
  expect_rounds:
    0: {attacks.0.saved: true, attacks.0.damage: 0, state.second.wounds: 2}
  expect_fighters:
    second.armour_save: 6
  expect_final: {rounds_executed: 1, termination_reason: horizon}

