# The pelt is the Wolf-Priest's printed kit; worn by a hireling of another kit it is refused.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.wolf-priest-of-ulric-miracle-workers.rule.strictures/defence.wolf-pelt-cloak
  id: the-pelt-is-refused-on-a-hireling-outside-the-priests-printed-kit
  fighters:
    first: *pelt-attacker
    second:
      <<: *pelt-control
      defence_ids: [defence.wolf-pelt-cloak]
  expect_error: "hireling active equipment and supplied ownership do not form a complete legal printed kit"

