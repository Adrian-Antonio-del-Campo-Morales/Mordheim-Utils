- audit_id: rule/mordheim/snotlings-web/bullied-goblin--achilles-heel/mechanic.achilles-heel
  id: a-natural-six-to-wound-is-critical-against-toughness-five
  covers: [criticals-and-charge--scope--criticals-on-six]
  # The printed half: "Your Snotling always causes Critical Hits on rolls of 6 (when wounding) regardless
  # of opponent's toughness".  The bearer is the band's own Snotling profile whose printed Strength 2 makes
  # the required To-Wound target six against the declared Toughness 5 - exactly the case the core contract
  # excludes from criticals and this printed rule re-admits.  The strict tape declares the wound face of
  # six and the critical-chart die; a basic chart result of one leaves the printed damage of two.
  # The re-admission is asserted by the requested critical-chart die itself: the strict tape declares
  # exactly one, so an ordinary wound (no re-admission) would leave it unused and fail the case.
  fighters:
    first:
      collection: mordheim
      band_id: snotlings-web
      profile_id: bigsnotz
      special_rule_ids: [bullied-goblin--achilles-heel]
    second:
      characteristics: {weapon_skill: 3, strength: 3, toughness: 5, wounds: 3, initiative: 1, attacks: 1}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 6}
    - {key: round.0.first.attack.0.critical, value: 1}
    - {key: round.0.first.attack.0.armour, value: 1}
  expect_rounds:
    0: {attacks.0.critical: True, attacks.0.damage: 2, state.second.wounds: 1, state.second.condition: STANDING}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

- audit_id: rule/mordheim/snotlings-web/bullied-goblin--achilles-heel/mechanic.achilles-heel
  id: without-the-printed-rule-the-same-six-is-an-ordinary-wound
  covers: [criticals-and-charge--scope--criticals-on-six]
  # The control that separates the printed rule from the ordinary case: the identical bearer and the
  # identical declared hit and wound faces, but with no special selection, so the natural six against a
  # required target of six wounds normally and no critical-chart die is requested at all (the strict tape
  # would reject an unconsumed third roll).
  fighters:
    first:
      collection: mordheim
      band_id: snotlings-web
      profile_id: bigsnotz
    second:
      characteristics: {weapon_skill: 3, strength: 3, toughness: 5, wounds: 3, initiative: 1, attacks: 1}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 6}
    - {key: round.0.first.attack.0.armour, value: 1}
  expect_rounds:
    0: {attacks.0.critical: False, attacks.0.damage: 1, state.second.wounds: 2, state.second.condition: STANDING}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
