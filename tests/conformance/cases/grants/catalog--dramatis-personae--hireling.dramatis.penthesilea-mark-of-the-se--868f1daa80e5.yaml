# Contract fixed by the ruling "Penthesilea Weapon Master means Weapons Training - 2026-10-15"
# (docs/decisions/design-rulings.md): her undefined printed Weapon Master is proficiency with
# hand-to-hand weapons - compiler.weapon-knowledge with allowed_kinds [close-combat-weapon] - with no
# hit, attack or parry bonus; proficiency does not create physical copies, grant ranged weapons or
# transfer another character's unique gear.  The resolver's scoped-training path (`resolveHirelingKit`)
# admits a supplied inventory of the printed kit plus close-combat catalogue weapons, refuses any other
# addition with "Weapons Training does not grant ranged weapons, armour or another character's unique
# items", and requires every active position to be a supplied copy ("Weapons Training requires
# supplied physical copies of active equipment").  The recipient is the printed Penthesilea
# (hirelings.dramatis-personae.1b / hireling.dramatis.penthesilea-mark-of-the-serpent; printed kit
# starsword, starblade, amulet_of_the_moon, enchanted_skins) with the fixture facts (WS3 S3 T3 W2 I5
# A1; the printed Ld8 stays).  Her Mark is already in the printed line, Mesmerising Dance, Savage Fury
# and Man-Hater are duel effects, and Concealment / Elixir of Life are scope NO, so the construction-only
# shape (no charge, the bearer out of action before the first phase) requests no die.  Supplied
# ownership travels through owned_item_ids as in the Haunted Mien file; the admission observes the
# compiled build alone: construction_tags is the sorted list of the two compiler contracts her rules
# bind (the catalogue-wide fixed-equipment clause and the training).  The control is the corpus's
# hireling control, the grade-1b Bard, who has no such training and meets the kit matcher.

# A halberd supplied beside her printed kit and wielded: close-combat proficiency admits it.
- audit_id: rule/catalog/dramatis-personae/hireling.dramatis.penthesilea-mark-of-the-serpent.rule.weapon-master/weapon-master.melee-access
  id: a-supplied-close-combat-weapon-beyond-the-kit-is-admitted
  fighters:
    first:
      collection: mordheim
      band_id: hirelings.dramatis-personae.1b
      profile_id: hireling.dramatis.penthesilea-mark-of-the-serpent
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
      main_weapon_id: weapon.halberd
      owned_item_ids: [starsword, starblade, amulet_of_the_moon, enchanted_skins, halberd]
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [], active_participant: first}
  initial_state: {first: {condition: OUT}}
  expect_fighters:
    first.construction_tags: [compiler.hireling-fixed-equipment, compiler.weapon-knowledge]

