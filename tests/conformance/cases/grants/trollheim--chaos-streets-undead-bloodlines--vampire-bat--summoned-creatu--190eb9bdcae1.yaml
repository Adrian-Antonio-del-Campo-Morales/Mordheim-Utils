# --- Authored scenarios ---
# Derived from the printed sentence and the recorded contract; no engine output was consulted.  The
# bearer prints the rule and contributes no attacks of its own, so round 0 carries only the
# attacker's dice.  The blow is an ordinary mace: at Weapon Skill 10 against this bearer's printed
# Weapon Skill it needs a 3, and Strength 8 against Toughness 3 needs a 2, so the declared 5 and 5
# both pass.  Five is deliberately below a natural six, which would be a critical hit and add a
# further critical die.  The first tape declares nothing after the wound roll: an injury die
# requested there would fail the fixture, so the scenario proves the printed 'without rolling on the
# Injury chart' rather than assume it.

- audit_id: rule/trollheim/chaos-streets-undead-bloodlines/vampire-bat--summoned-creature/trait.injury-profile
  id: losing-the-last-wound-takes-the-bat-out-without-an-injury-roll
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 10, strength: 8, toughness: 3, wounds: 3, initiative: 10, attacks: 1}
    second: {collection: trollheim, band_id: chaos-streets-undead-bloodlines, profile_id: vampire-bat}
  initial_state: {second: {wounds: 1, attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
