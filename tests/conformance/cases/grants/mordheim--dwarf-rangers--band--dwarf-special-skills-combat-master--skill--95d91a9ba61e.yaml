# --- Authored scenarios ---
# Family model (Combat Master, Dwarf Rangers printing): the bearer is the printed recipient of this
# band record, built from its own band and profile and selecting the band row named in the audit id, so
# the granted effect is what the scenario exercises.  Physical characteristics are supplied as fixture
# facts (WS3 S3 T3 W2 I2 A1) so the dice thresholds and the strike order are fixed, while the printed
# Leadership stays in place; the bearer's own attack pool is declared empty so the tape holds only the
# parry under test.  Every expectation is read from the printed rule (parries when he beats OR MATCHES
# the opponent's highest To Hit roll; two Parry weapons allow two attacks instead of the normal
# maximum of one) and the recorded contract, never from engine output; the roll tape is derived
# statically and stays unexecuted.  The printed rule of this printing has no Dwarf Axe reroll sentence,
# so no scenario asserts a reroll and every tape holds only successful parry attempts.
# RECIPIENT BOUNDARY (checked statically in the shared construction stage, not by running it): the
# bearer is the band Hero apprentice-runesmith, not a Henchman.  `specialRuleRestriction()`'s access
# stage admits a band warband_skill row with `applies_to.band: true` and no `eligibility` only for a
# recipient whose own printed `skill_access` carries the `special` category ("special rule is not
# available to {band}/{profile}: {rid}" otherwise), and this band's printed Henchmen rows carry no
# such category while its Hero rows do.  A Henchman fixture would be refused one stage before this
# clause is reached, which is a different requirement, not this one.  The Hero's own automatic
# profile rule (apprentice-runesmith--extra-set-of-hands) is recorded `implemented: NO`, so the
# retarget adds no automatic mechanic to the tape:
#   band--dwarf-special-skills-combat-master  kind warband_skill  applies_to {band: true}  eligibility none
#   apprentice-runesmith  type hero  skill_access [combat, academic, strength, special]

# The printed equality: a parry die equal to the declared To Hit four blocks the blow.
- audit_id: rule/mordheim/dwarf-rangers/band--dwarf-special-skills-combat-master/skill.unbeatable-warrior
  id: an-equal-roll-matches-the-highest-to-hit
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      collection: mordheim
      band_id: dwarf-rangers
      profile_id: apprentice-runesmith
      special_rule_ids: [band--dwarf-special-skills-combat-master]
      main_weapon_id: weapon.sword
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.parry, value: 4}
  expect_rounds:
    0: {attacks.0.parried: true, state.second.parries_remaining: 0, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# Without the band rule the same die no longer matches: the plain parry must beat the roll, so the blow
# is resolved and wounds.
- audit_id: rule/mordheim/dwarf-rangers/band--dwarf-special-skills-combat-master/skill.unbeatable-warrior
  id: without-the-band-rule-an-equal-roll-does-not-match
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      collection: mordheim
      band_id: dwarf-rangers
      profile_id: apprentice-runesmith
      main_weapon_id: weapon.sword
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.parry, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
  expect_rounds:
    0: {attacks.0.parried: false, attacks.0.damage: 1, state.second.parries_remaining: 0, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The printed second attempt: two Parry weapons block both attacks of the pool, each die matching or
# beating its own To Hit roll.
- audit_id: rule/mordheim/dwarf-rangers/band--dwarf-special-skills-combat-master/skill.unbeatable-warrior
  id: two-parry-weapons-give-two-attempts
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 2}
    second:
      collection: mordheim
      band_id: dwarf-rangers
      profile_id: apprentice-runesmith
      special_rule_ids: [band--dwarf-special-skills-combat-master]
      main_weapon_id: weapon.sword
      off_hand_id: weapon.sword
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.1.hit, value: 4}
    - {key: round.0.first.attack.0.parry, value: 5}
    - {key: round.0.first.attack.1.parry, value: 5}
    # Two swords in the bearer's hands leave it one attack of its own even with the
    # declared empty profile, so that die is taped as a miss against Weapon Skill 3.
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.parried: true, attacks.1.parried: true, state.second.parries_remaining: 0, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

