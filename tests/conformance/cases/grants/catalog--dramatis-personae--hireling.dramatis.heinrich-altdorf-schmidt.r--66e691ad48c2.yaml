# Heinrich's Luck is a profile grant bound to the shared skill.luck; the adopted ruling
# (docs/decisions/design-rulings.md) reads it as one re-roll of a failed roll of his own (hit or
# wound), spent for the rest of the duel.  Heinrich is compiled through the hireling route
# (hirelings.dramatis-personae.1b / hireling.dramatis.heinrich-altdorf-schmidt) with the fixture
# facts (WS3 S3 T3 W2 I5 A1; his printed Ld8 stays).  His kit's first close-combat weapon is the
# whip, whose own Whip Master grant would add hit-reroll requests of its own, so the kit sword is
# declared as his main weapon to keep this tape Luck's alone; his other printed skills
# (Lightning Reflexes, Step Aside, Dodge, Snake Fear against a non-snake) request nothing here.
# The opponent is the hand-built fixture (mace, WS3 S3 T3 W3 I2 A1 Ld7) and every roll of his is
# a declared natural 1, a miss.  Heinrich's Initiative 5 strikes before the opponent's 2; WS3
# against WS3 hits on 4+ and S3 against T3 wounds on 4+.  The bearer declares the Luck choice on
# each own roll before the second die is taken (consumer: modular/contexts.py, the skill.luck
# offer and the spent `luck` resource).

# The failed hit of 2 is rolled again on the declared choice and the 4 hits; the resource is
# spent, so the later failed wound of 1 is offered nothing and stands - the strict tape declares
# no second Luck decision.
- audit_id: rule/catalog/dramatis-personae/hireling.dramatis.heinrich-altdorf-schmidt.rule.luck/skill.luck
  id: heinrichs-failed-hit-is-rerolled-and-the-spent-luck-leaves-the-failed-wound-standing
  fighters:
    first:
      collection: mordheim
      band_id: hirelings.dramatis-personae.1b
      profile_id: hireling.dramatis.heinrich-altdorf-schmidt
      main_weapon_id: weapon.sword
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.attack.0.hit.luck, value: true}
  rolls:
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.first.attack.0.hit.reroll, value: 4}
    - {key: round.0.first.attack.0.wound, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: True, attacks.0.wounded: False, attacks.0.damage: 0, state.second.wounds: 3, state.first.resources_spent: [luck]}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

