# Hireling family model (P0, 2026-11-17).  The recipient is the printed Priest of Morr compiled
# through the hireling route (hirelings.hired-sword.2b /
# hireling.hired-sword.priest-of-morr-miracle-workers) with the fixture facts (WS3 S3 T3 W2 I5 A1;
# the printed Ld8 stays), selecting the Augur Mark through special_rule_ids as the sibling
# psychology-immunity file does.  Printed Augur: the Priest "may re-roll any one dice roll he makes
# during a battle" - each of his own rolls carries the declaration until the single
# `one-roll-reroll` resource is spent, and the second result stands - "but suffers -1 Strength
# permanently" (the Mark's profile.characteristics sibling binding): his kit dagger therefore
# strikes at S2 and wounds T3 on 5+, while the unselected control wounds on 4+.  The printed kit's
# first close-combat weapon (the dagger) is the default and grants its target the printed 6+ save.
# The opponent is hand-built (WS3 S3 T3 W3 I2 A1 Ld7, mace) and its blows are declared natural
# misses, so the psychology-immunity sibling binding and Morr's Servant (reading an Undead
# opponent that never exists here) add no request.
