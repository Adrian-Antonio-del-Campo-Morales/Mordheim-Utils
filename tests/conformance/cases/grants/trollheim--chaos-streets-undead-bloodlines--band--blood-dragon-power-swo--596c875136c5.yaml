# --- Authored scenarios ---
# Family model (Blood Dragon power: Sword Master): the bearer is the printed recipient of this band
# record, built from its own collection, band and profile and selecting the band row named in the audit
# id, whose selected runtime binds the admitted skill identity and, beside it, mechanic.blood-dragon-sword-master
# (tag rule.blood-dragon-sword-master).  Physical characteristics are supplied as fixture facts
# (WS3 S3 T3 W2 I2 A1) so the dice thresholds and the strike order are fixed, while the printed
# Leadership stays in place; the bearer parries with a sword and its own attack pool is declared empty
# so the tape holds only the parry under test.  Every expectation is read from the printed rule (only
# needs to equal the opponent's roll and may therefore parry a roll of 6; may re-roll one failed parry
# but not the re-roll; may not parry more than one attack) and the recorded parameters, never from
# engine output; the roll tape is derived statically and stays unexecuted.  The control cases remove
# the band selection and keep the same warrior and the same tape, so only the grant explains the
# difference.

# The printed equality: a parry die equal to the declared To Hit four blocks the blow.
- audit_id: rule/trollheim/chaos-streets-undead-bloodlines/band--blood-dragon-power-sword-master/skill.sword-master
  id: an-equal-parry-die-blocks-the-attack
  covers: [match-parry]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 7}
    second:
      collection: trollheim
      band_id: chaos-streets-undead-bloodlines
      profile_id: blood-dragon-vampire
      special_rule_ids: [band--blood-dragon-power-sword-master]
      main_weapon_id: weapon.sword
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 7}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.fear.charge.0, value: 1}
    - {key: round.0.first.fear.charge.1, value: 1}
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.parry, value: 4}
  expect_rounds:
    0: {attacks.0.parried: true, state.second.parries_remaining: 0, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

