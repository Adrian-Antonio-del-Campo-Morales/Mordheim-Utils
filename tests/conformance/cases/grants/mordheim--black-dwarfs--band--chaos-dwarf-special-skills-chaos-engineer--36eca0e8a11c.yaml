- audit_id: rule/mordheim/black-dwarfs/band--chaos-dwarf-special-skills-chaos-engineer/mechanic.chaos-engineer
  id: the-selected-chaos-engineer-skill-compiles-and-the-duel-runs
  covers:
  - whole--scope--armour-restriction
  fighters:
    first:
      collection: mordheim
      band_id: black-dwarfs
      profile_id: sorcerer
      special_rule_ids:
      - band--chaos-dwarf-special-skills-chaos-engineer
    second:
      collection: mordheim
      band_id: black-dwarfs
      profile_id: sorcerer
  duel_context:
    charging: []
    active_participant: first
  initial_state:
    first:
      condition: OUT
  expect_initial:
    first.condition: OUT
  expect_final:
    rounds_executed: 0
    termination_reason: first_out

# The printed ban "may never wear the Chaos Armours" (negative half, 2026-11-18).  The same Sorcerer
# that selects the skill above is given armour.chaos-armour, the catalogue's executable Chaos Armour
# id, and the construction is refused by the skill's own contract diagnostic.
- audit_id: rule/mordheim/black-dwarfs/band--chaos-dwarf-special-skills-chaos-engineer/mechanic.chaos-engineer
  id: a-chaos-engineer-may-never-wear-the-chaos-armours
  covers:
  - whole--scope--armour-restriction
  fighters:
    first:
      collection: mordheim
      band_id: black-dwarfs
      profile_id: sorcerer
      special_rule_ids:
      - band--chaos-dwarf-special-skills-chaos-engineer
      armour_id: armour.chaos-armour
  expect_error: "Chaos armour is forbidden for black-dwarfs/sorcerer"

# The contrast: without the skill the very same armour is refused by a different printed fact, the
# band's equipment list, which is why the diagnostic above is attributable to the ban and not to the
# list.
- audit_id: rule/mordheim/black-dwarfs/band--chaos-dwarf-special-skills-chaos-engineer/mechanic.chaos-engineer
