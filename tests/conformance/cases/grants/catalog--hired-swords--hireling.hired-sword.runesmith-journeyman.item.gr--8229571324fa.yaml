# --- Authored scenarios ---
# Hireling family model (P0, 2026-11-17; equipment batch 2026-11-18).  The recipient is
# the printed hireling profile compiled through the hireling route (band_id
# hirelings.hired-sword.1b, profile_id hireling.hired-sword.runesmith-journeyman); the
# printed item rule is granted by the profile itself, so the build selects nothing.
# The unique kit piece is wielded by its mechanic id (main_weapon_id:
# weapon.gromril-hammer); the kit heavy armour is owned, not worn.  Physical
# characteristics are the fixture facts (WS3 S3 T3 W2 I5 A1); the printed Ld9 stays.
# The opponent is hand-built (WS3 S3 T3 W3 I2 A1 Ld7, mace) and wears heavy armour
# where the save matters.  The control is the grade-1b Bard with his kit dagger.
#
# Printed rule (Nemesis Crown supplement): "A hammer with Gromril armour penetration,
# with the normal Concussion rule."  Gromril has "an extra -1 save modifier": heavy
# armour's 5+ becomes 6+ for a Strength 3 bearer, so the armour die 5 fails.  The
# Bard's dagger grants its target +1 instead (heavy armour 5+ to 4+), so his die 5
# saves.  Concussion: the injury die 2 is Stunned.
#
# Companion printed rules of the same profile request nothing here: Hard to Kill and
# Hard Head read only his own injuries, and the Runesmith rune use is pre-battle.

# The recipient charges a heavy-armoured opponent: the armour die 5 is below the
# worsened 6+ and the wound is taken; the compiled kit hammer shows the penetration
# and Concussion.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.runesmith-journeyman.item.gromril-hammer.rule.combat/weapon.gromril-hammer
  id: the-runesmiths-hammer-worsens-the-save-by-one
  fighters:
    first:
      &recipient
      collection: mordheim
      band_id: hirelings.hired-sword.1b
      profile_id: hireling.hired-sword.runesmith-journeyman
      main_weapon_id: weapon.gromril-hammer
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      &armoured-opponent
      main_weapon_id: weapon.mace
      armour_id: armour.heavy-armour
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: &recipient-charges {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.armour, value: 5}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.saved: false, attacks.0.damage: 1, state.second.wounds: 2}
  expect_fighters:
    first.main_weapon.armour_penetration: 1
    first.main_weapon.concussion: true
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The normal Concussion rule: against an unarmoured one-Wound opponent the injury
# die 2 is Stunned.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.runesmith-journeyman.item.gromril-hammer.rule.combat/weapon.gromril-hammer
  id: the-runesmiths-hammer-stuns-on-the-injury-die-2
  fighters:
    first: *recipient
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 2, attacks: 1, leadership: 7}
  duel_context: *recipient-charges
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.injury.0, value: 2}
  expect_rounds:
    0: {attacks.0.damage: 1, state.second.wounds: 0, state.second.condition: STUNNED}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

