  fighters:
    first:
      &control
      collection: mordheim
      band_id: hirelings.hired-sword.1b
      profile_id: hireling.hired-sword.bard
      main_weapon_id: weapon.dagger
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second: *armoured-opponent
  duel_context: *recipient-charges
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.armour, value: 5}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.saved: true, attacks.0.damage: 0, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The printed item rule belongs to the recipient's profile; selecting it on another
# hireling of the same package is refused by the eligibility gate.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.runesmith-journeyman.item.gromril-hammer.rule.combat/weapon.gromril-hammer
  id: the-rule-is-refused-on-a-hireling-outside-its-printed-profile
  fighters:
    first:
      <<: *control
      special_rule_ids: [hireling.hired-sword.runesmith-journeyman.item.gromril-hammer.rule.combat]
    second:
      &opponent
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  expect_error: "special rule is not available to hirelings.hired-sword.1b"

# The unique hammer itself is not part of any other printed kit: another hireling
# wielding it is refused by the kit resolver.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.runesmith-journeyman.item.gromril-hammer.rule.combat/weapon.gromril-hammer
  id: the-unique-hammer-is-refused-in-another-hirelings-hands
  fighters:
    first:
      <<: *control
      main_weapon_id: weapon.gromril-hammer
    second: *opponent
  expect_error: "do not form a complete legal printed kit"
