# Printed text (grade-2a.yaml, Lycanthrope): "While in man-form, the Hillman is armed with an Axe, a
# Dagger, and a Longbow.  He wears a heavy fur cloak which offers him an AS of 5+ versus ranged
# attacks, and 6+ in close combat."  This binding is the cloak (man-cloak: trait.natural-armour-save,
# parameters value 6); the wound transformation is the sibling mechanic.hillman-lycanthrope
# (...400c6da5967e, the tape model) and the wolf form's lost cloak the Wolf Form rule's
# wolf-form-no-cloak binding (...56adb0080775).  Compiler: the trait lands as natural_armour_save
# (compiler.py ~495) and is projected onto CompiledFighter.natural_armour_save (~1434, ~1490); the
# compiled armour_save stays the empty 7 (nothing worn, no stacking).  Engine: phases.py
# armour_target (~621-634) worsens an ordinary natural save by max(0, S-3) and asks the die
# round.<i>.<attacker>.attack.<n>.armour while the target is 6 or better.
# Hireling family model: the recipient is the printed Cursed Hillman compiled through the hireling
# route (hirelings.hired-sword.2a / hireling.hired-sword.cursed-hillman) with the fixture facts (WS3
# S3 T3 W2 I5 A1; the printed Ld8 stays); his kit axe is the omitted default and nothing is selected
# (man form).  Thin Flesh (-1 Toughness in hand-to-hand) makes the Strength 3 wound a 3+ (Strength 4
# a 2+); a four wounds either way.  The Hillman is the active charger (first) and contributes no
# swing (initial_state), so the opponent (hand-built, mace, WS3 S3 T3 W3 I2 A1 Ld7) strikes as the
# charged side and the transformation die round.<i>.<attacker>.attack.<n>.lycanthrope.<k> follows
# each lost Wound, declared a three (he stays a man).  The control is the grade-1b Bard (dagger,
# nothing worn); the refusal selects this rule on the Bard.

# The compiled Hillman carries the cloak's 6+ as his natural save; the six holds and no Wound is lost.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.cursed-hillman.rule.lycanthrope/man-cloak
  id: the-compiled-hillman-carries-the-cloaks-six-plus-and-the-six-holds
  fighters:
    first:
      &hillman
      collection: mordheim
      band_id: hirelings.hired-sword.2a
      profile_id: hireling.hired-sword.cursed-hillman
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      &opponent
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  initial_state: {first: {attacks: 0}}
  duel_context: &hillman-charges {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.attack.0.hit, value: 4}
    - {key: round.0.second.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.armour, value: 6}
  expect_fighters:
    first.natural_armour_save: 6
    first.armour_save: 7
  expect_rounds:
    0: {attacks.0.saved: true, attacks.0.damage: 0, state.first.wounds: 2, state.first.hillman_wolf: False}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# One face below the cloak's 6+ fails: the Wound is lost and the transformation die follows (a three
