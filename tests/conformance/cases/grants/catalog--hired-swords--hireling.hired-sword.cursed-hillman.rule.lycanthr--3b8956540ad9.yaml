  id: one-face-below-the-cloaks-six-plus-loses-the-wound
  fighters:
    first: *hillman
    second: *opponent
  initial_state: {first: {attacks: 0}}
  duel_context: *hillman-charges
  maximum_rounds: 1
  rolls:
