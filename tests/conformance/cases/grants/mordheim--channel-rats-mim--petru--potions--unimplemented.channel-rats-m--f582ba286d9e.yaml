- audit_id: rule/mordheim/channel-rats-mim/petru--potions/unimplemented.channel-rats-mim.petru.potions
  id: the-fortitude-draught-grants-the-affected-hero-one-extra-wound
  # "6 Fortitude (gains an extra wound for the whole battle ...)": the Hero declares its printed two
  # Wounds and the supplied draught starts it with three.  The printed rider - once lost the wound
  # cannot be restored - needs a recovery or healing step the duel does not carry, and is recorded in
  # the clause marker rather than guessed here.
  fighters:
    first:
      # The supplied draught is read on a Hero recipient, so the affected model is the
      # band's own hero profile carrying the fixture's characteristics.
      collection: mordheim
      band_id: channel-rats-mim
      profile_id: petru
      main_weapon_id: weapon.mace
      condition_ids: [condition.petru-fortitude]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 4, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 5, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  initial_state: {second: {condition: OUT}}
  maximum_rounds: 1
  expect_initial: {first.wounds: 3}
  expect_final: {rounds_executed: 0, termination_reason: second_out}

- audit_id: rule/mordheim/channel-rats-mim/petru--potions/unimplemented.channel-rats-mim.petru.potions
  id: without-a-supplied-draught-the-same-hero-keeps-its-base-characteristics
  # The control for all four grants: the identical fixture with no supplied result reads the base
  # characteristics unchanged, so the four grants above are attributable to the draught and not to the
  # build shape.
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 4, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 5, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  initial_state: {second: {condition: OUT}}
  maximum_rounds: 1
  expect_initial: {first.strength: 3, first.toughness: 3, first.wounds: 2}
  expect_final: {rounds_executed: 0, termination_reason: second_out}

- audit_id: rule/mordheim/channel-rats-mim/petru--potions/unimplemented.channel-rats-mim.petru.potions
  id: two-draughts-of-the-same-table-in-one-build-are-refused
  # The printed table is "a single Hero ... may chance upon the Petru before battle to risk one of these
  # vitalogist wares": one draught.  The supplied-result resolver raises its own sentence when two
  # results of this table are declared on one build, which is that printed restriction as a construction
  # fact.  The sentence is the resolver's own, not an invented diagnostic.
  fighters:
    first:
      # The supplied draught is read on a Hero recipient, so the affected model is the
      # band's own hero profile carrying the fixture's characteristics.
      collection: mordheim
      band_id: channel-rats-mim
      profile_id: petru
      main_weapon_id: weapon.mace
      condition_ids: [condition.petru-strength, condition.petru-resilience]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 4, attacks: 1}
  expect_error: "choose only one supplied result of the same potion table"
