# Conformance authoring scaffold; generated comments, manually authored scenarios.
# audit_id: rule/mordheim/channel-rats-mim/petru--potions/unimplemented.channel-rats-mim.petru.potions
# authoring_status: AUTHORED
# authoring_progress: the admitted draught table now carries six scenarios: each of the four printed
# results is supplied one at a time as the catalogue's own canonical condition (condition.petru-strength,
# -resilience, -debilitating, -fortitude, every one of them scope YES / implemented YES with a mechanic
# binding in catalog/rules/conditions.yaml, resolved by compiler.resolve_supplied_conditions), so the
# granted statistic is the rule's own supplied state and not the fixture's own override; a control tape
# reads the same base characteristics with no draught, and the printed restriction that a single Hero
# chances upon ONE draught is asserted as the table's own refusal of two supplied results.  What stays
# outside is the pre-battle D6 draw itself, the recovery-phase escape roll each entry prints and the
# warband-side choice and price: none of them is a duel consequence.  REVIEWED still requires manual
# semantic review and execution_status stays UNEXECUTED.
# execution_status: UNEXECUTED (this scaffold has no behavioral result)
#
# Derive inputs and expectations from rule text and accepted rulings.
# Do not derive them from the engine or execute combat during authoring.
# REVIEWED requires semantic review; covers labels alone are insufficient.
# Preserve audit_id when filling this file.
# Governing rulings: docs/decisions/design-rulings.md
#
# AUTHORED: the previous note called the operator missing and was wrong.
# The catalogue carries one canonical condition per printed draught - condition.petru-debilitating,
# -strength, -resilience and -fortitude in catalog/rules/conditions.yaml, every one of them runtime
# scope YES / implemented YES with its own mechanic binding - and compiler.resolve_supplied_conditions
# resolves them as the supplied result of this table, refusing two results of the same table in one
# build ("choose only one supplied result of the same potion table"), which is the printed "may chance
# upon the Petru ... to risk ONE of these wares" read as a construction fact.  The supplied state is
# declared through FighterBuild.condition_ids, the same channel the sibling band--brewers and
# shaman--fungus-brew files use for their own supplied drink outcomes, so no identity and no die is
# invented here: the printed +1 Strength, +1 Toughness, -1 Toughness and the extra Wound are read from
# the rule and asserted in the six scenarios below, and the one-draught restriction is asserted as the
# table's own refusal rather than described.  Recorded, not asserted, because the duel does not carry
# them: the pre-battle D6 draw that picks the draught (no die of the duel is drawn from the table), the
# recovery-phase escape roll each printed entry prints (the recovery phase is outside the duel), and the
# pre-battle choice among the warband's Heroes with its prices (campaign inputs).  REVIEWED still
# requires manual semantic review.

# --- Authored scenarios ---
# Derived from the printed draught table and the catalogue's own canonical conditions; no engine output
# was consulted.  Each tape supplies exactly one drawn result through FighterBuild.condition_ids - the
# channel compiler.resolve_supplied_conditions reads - and reads the printed statistic on the affected
# Hero; the opposing duelist is already out of the fight, so no combat die is consumed and the supplied
# grant itself is the observation.  The affected Hero's base characteristics are the fixture's own fact
# and are what the control tape reads unchanged.

- audit_id: rule/mordheim/channel-rats-mim/petru--potions/unimplemented.channel-rats-mim.petru.potions
  id: the-strength-draught-raises-the-affected-heroes-strength-by-one
  # "2-3 Strength (+1 Strength bonus ...)": the supplied result is the catalogue's canonical
  # condition.petru-strength and the printed grant is read on the affected Hero.
  fighters:
    first:
      # The supplied draught is read on a Hero recipient, so the affected model is the
      # band's own hero profile carrying the fixture's characteristics.
      collection: mordheim
      band_id: channel-rats-mim
      profile_id: petru
      main_weapon_id: weapon.mace
      condition_ids: [condition.petru-strength]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 4, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 5, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  initial_state: {second: {condition: OUT}}
  maximum_rounds: 1
  expect_initial: {first.strength: 4}
  expect_final: {rounds_executed: 0, termination_reason: second_out}

