# --- Authored scenarios ---
# Construction pair: the rule grants the band's Heroes the rulebook Skaven special skills (Black Hunger,
# Tail Fighting, Wall Runner, Infiltration).  The Hero selecting Black Hunger
# is compiled with the skill; a henchman of the same band selecting it is refused.

- audit_id: rule/mordheim/skaven-of-clan-mors-kaz/band--rulebook-inheritance/profile.skill-access
  id: a-skaven-hero-is-admitted-to-a-printed-rulebook-special-skill
  fighters:
    first:
      collection: mordheim
      band_id: skaven-of-clan-mors-kaz
      profile_id: claw-leader
      special_rule_ids: [band--skaven-special-skills-black-hunger]
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  initial_state: {first: {attacks: 0}, second: {attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    # The admitted Black Hunger prints +1 Attack for the turn it is invoked: the Hero's one blow
    # is declared as a natural 1.  Its own duel contract belongs to its own identity.
    - {key: round.0.first.attack.0.hit, value: 1}
    # At the end of the turn it prints D3 Strength 3 hits on the Hero with no armour save: one hit.
    - {key: round.0.first.black-hunger.hits, sides: 3, value: 1}
    # The Strength 3 hit's wound roll is a natural 1, so it wounds nothing.
    - {key: round.0.first.black-hunger.hit.0.wound, value: 1}
  # The compiled Hero carries its printed facts plus the admitted skill (mechanic.black-hunger); the
  # same Hero without the selection compiles the same list without it.
  expect_fighters:
    first.global_effects.tags: ['mechanic.leader-six', 'mechanic.black-hunger', 'armour.no-armour', 'fighter-kind.hero', 'band.skaven-of-clan-mors-kaz']

- audit_id: rule/mordheim/skaven-of-clan-mors-kaz/band--rulebook-inheritance/profile.skill-access
