  fighters:
    first:
      collection: mordheim
      band_id: skaven-of-clan-mors-kaz
      profile_id: clanrats
      special_rule_ids: [band--skaven-special-skills-black-hunger]
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  expect_error: "special rule is not available to skaven-of-clan-mors-kaz/clanrats: band--skaven-special-skills-black-hunger"
