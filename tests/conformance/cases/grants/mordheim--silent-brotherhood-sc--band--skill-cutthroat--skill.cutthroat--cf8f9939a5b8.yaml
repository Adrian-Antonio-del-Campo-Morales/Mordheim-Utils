#
# AUTHORED: 5 scenarios (3 fixture/Silent Master + 2 real Poisoner) cover the printed extra -1 on the enemy armour save for
# a wound inflicted with daggers wielded as a pair, with the printed dagger profile's own +1 still in
# place: the same armour face of four fails with the skill and holds without it, so the pair alone is
# what leaves the save one point better and the skill is what spends it.  In the two fixture cases both fighters are fixtures
# and the printed pair is the main weapon plus the off-hand dagger; the defender's heavy armour and
# its 5+ face are fixture facts.  The lone-dagger case (the skill requires the pair) is recorded, not
# asserted: the main-hand dagger without an off-hand weapon is already the printed single-dagger
# bonus this clause keeps, and it is the control's weapon set in the mechanic origin's own case.
# REVIEWED still requires manual semantic review.

# --- Authored scenarios ---
# The fixture scenarios use the same pair (a dagger in each hand), the same 5+ heavy armour on the
# defender and the same wound, and script the same armour face of four: the printed dagger
# profile already grants the target +1 armour save, so four holds against the pair alone and
# is one short of the save the skill worsens by one.
- audit_id: rule/mordheim/silent-brotherhood-sc/band--skill-cutthroat/skill.cutthroat
  id: cutthroat-dagger-pair-worsens-the-save
  fighters:
    first:
      main_weapon_id: weapon.dagger
      off_hand_id: weapon.dagger
      skill_ids: [skill.cutthroat]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      armour_id: armour.heavy-armour
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.1.hit, value: 1}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.armour, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.saved: False, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
