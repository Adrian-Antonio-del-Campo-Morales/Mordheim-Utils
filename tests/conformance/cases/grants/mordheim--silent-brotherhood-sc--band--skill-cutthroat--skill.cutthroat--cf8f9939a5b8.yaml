# Discriminating real recipient (2026-11-16): the Silent Master scenario above cannot tell the skill
# apart, because the Silent Master's own printed Perfect Killer (silent-master--perfect-killer, "an
# extra -1 modifier to any armour save") already turns the face of four into a failure without
# Cutthroat.  The printed Poisoner (mordheim/silent-brotherhood-sc/poisoner) has special-skill access
# and only campaign rules, so the same paired-dagger duel isolates the selected band skill: heavy
# armour 5+ with the dagger's +1 saves on 4+, Cutthroat's -1 makes it 5+, so the four fails with the
# skill and holds without it.  Wounds 1 is the Poisoner's printed maximum.
- audit_id: rule/mordheim/silent-brotherhood-sc/band--skill-cutthroat/skill.cutthroat
  id: cutthroat-dagger-pair-worsens-the-save-as-the-real-poisoner
  fighters:
    first:
      collection: mordheim
      band_id: silent-brotherhood-sc
      profile_id: poisoner
      main_weapon_id: weapon.dagger
      off_hand_id: weapon.dagger
      special_rule_ids: [band--skill-cutthroat]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      armour_id: armour.heavy-armour
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
  - {key: round.0.first.attack.0.hit, value: 4}
  - {key: round.0.first.attack.1.hit, value: 1}
  - {key: round.0.first.attack.0.wound, value: 4}
  - {key: round.0.first.attack.0.armour, value: 4}
  - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.saved: false, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
