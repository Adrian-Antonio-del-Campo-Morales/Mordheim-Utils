# Real-recipient addendum (2026-11-16): 1 further scenario(s) build the printed Silent Brotherhood
# profile itself (silent-master) and select band--skill-cutthroat through special_rule_ids, so the
# KB grant of this identity is exercised rather than only the shared operator injected into
