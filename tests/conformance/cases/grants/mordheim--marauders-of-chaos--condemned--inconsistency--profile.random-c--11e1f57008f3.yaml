# --- Authored scenarios ---
# Printed clause: "WS, S, T and A are variable. Whenever one of these characteristics is needed, roll
# its indicated die once for that turn."  The printed profile reads WS D6, S D6, T D6, A D3 (M 4, BS 3,
# W 1, I 4, Ld 7 fixed).  Recorded contract: `profile.random-characteristics` with
# `characteristics: [WS, S, T, A]`; the compiled row is `(characteristic, dice, sides, bonus)`, so a
# D6 is `[WS, 1, 6, 0]` and the D3 is `[A, 1, 3, 0]`, in the printed order.  The compiled row order
# follows the profile line (WS, S, T, W, I, A).
# Construction facts carried by the same profile: while any characteristic is variable the Condemned
# uses no equipment and fights unarmed without penalty (its own printed restriction), so no weapon is
# declared.  Dice follow the Inconsistency convention of the Belandysh hireling files: the variable
# Attacks are rolled (`characteristic.A.<n>`, sides 3) when the pool is formed, the variable Weapon
# Skill (`attack.<n>.attacker.characteristic.WS.<n>`) when the blow is resolved; a natural 1 misses so
# no Strength die follows.  The opponent is hand-built and contributes no attacks; the duel is
# uncharged so the Condemned's Fear asks nothing of it, and Initiative 4 against 2 orders the blow.

- audit_id: rule/mordheim/marauders-of-chaos/condemned--inconsistency/profile.random-characteristics
  id: the-condemned-compiles-its-four-printed-variable-characteristics
  fighters:
    first:
      collection: mordheim
      band_id: marauders-of-chaos
      profile_id: condemned
    second:
      &condemned-opponent
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    # Inconsistency: the variable Attacks (D3) give one blow.
    - {key: round.0.first.characteristic.A.0, sides: 3, value: 1}
    # Inconsistency: the blow needs the variable Weapon Skill first; the hit is a natural 1.
    - {key: round.0.first.attack.0.attacker.characteristic.WS.0, value: 3}
    - {key: round.0.first.attack.0.hit, value: 1}
  expect_fighters:
    first.random_characteristics: [['WS', 1, 6, 0], ['S', 1, 6, 0], ['T', 1, 6, 0], ['A', 1, 3, 0]]
    first.characteristics.wounds: 1
    first.characteristics.initiative: 4
  expect_rounds:
    0: {attacks.0.hit: False, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The contrast: the printed Fate lets a variable characteristic be permanently fixed; a Condemned whose
# Attacks were fixed (supplied as `condemned_fixed_characteristics` with the fixed value in its
# characteristics) compiles only the three rows that remain variable, and the pool asks for no
# Attacks die.  The remaining variability still forbids equipment.
- audit_id: rule/mordheim/marauders-of-chaos/condemned--inconsistency/profile.random-characteristics
  id: a-permanently-fixed-characteristic-leaves-the-random-profile
  fighters:
    first:
      collection: mordheim
      band_id: marauders-of-chaos
      profile_id: condemned
      trait_overrides: {condemned_fixed_characteristics: [A]}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 4, attacks: 1, leadership: 7}
    second: *condemned-opponent
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.attacker.characteristic.WS.0, value: 3}
    - {key: round.0.first.attack.0.hit, value: 1}
  expect_fighters:
    first.random_characteristics: [['WS', 1, 6, 0], ['S', 1, 6, 0], ['T', 1, 6, 0]]
    first.characteristics.attacks: 1
  expect_rounds:
    0: {attacks.0.hit: False, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
