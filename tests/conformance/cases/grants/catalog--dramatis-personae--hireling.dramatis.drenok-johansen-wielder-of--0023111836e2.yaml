- audit_id: rule/catalog/dramatis-personae/hireling.dramatis.drenok-johansen-wielder-of-the-great-axe.rule.axe-of-icefang/weapon.icefang-axe
  id: the-unique-axe-is-refused-in-another-hirelings-hands
