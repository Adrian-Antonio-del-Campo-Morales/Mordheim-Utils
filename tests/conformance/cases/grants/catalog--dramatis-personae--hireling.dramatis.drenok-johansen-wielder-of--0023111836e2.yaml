# --- Authored scenarios ---
# Hireling family model (P0, 2026-11-17; equipment batch 2026-11-18).  The recipient is
# the printed hireling profile compiled through the hireling route (band_id
# hirelings.dramatis-personae.1b, profile_id hireling.dramatis.drenok-johansen-wielder-
# of-the-great-axe); the printed item rule is granted by the profile itself, so the
# build selects nothing.  The unique kit piece is wielded by its mechanic id
# (main_weapon_id: weapon.icefang-axe).  Physical characteristics are the fixture facts
# (WS3 S3 T3 W2 I5 A1); the printed Ld8 stays.  The opponent is hand-built (WS3 S3 T3
# W3 I2 A1 Ld7, mace).  The control is the grade-1b Bard with his kit dagger, compiled
# through the same route with the same fixture.
#
# Printed rule (Town Cryer 15 p27): "Same as a double-handed weapon, plus Parry and +1
# to injury rolls."  Design ruling 2026-10-15: Icefang is the printed double-handed
# weapon plus Parry and +1 injury, not two stacked profiles.  S3 +2 = S5 wounds T3 on
# a 2+, so the wound die 2 is the boundary (the Bard's S3 dagger needs a 4).  The
# injury chart prints 1-2 Knocked Down, 3-4 Stunned: with +1 the die 2 is Stunned.
#
# Companion printed rules of the same profile, declared by name: Fearsome
# (skill.fearsome, causes fear) makes the opponent test for Fear when charged by or
# charging Drenok (3+3 passes Ld7); Strongman lifts the double-handed strike-last, so
# as the charger Drenok resolves first; Step Aside only rolls once a wound gets past
# his saves; Combat Master requests nothing in a duel.  The Berserker and the hide
# have their own identities.

# The recipient charges: the Fear test of the charged opponent passes, the hit lands
# and the wound die 2 reaches the +2 Strength target against T3.
- audit_id: rule/catalog/dramatis-personae/hireling.dramatis.drenok-johansen-wielder-of-the-great-axe.rule.axe-of-icefang/weapon.icefang-axe
  id: drenoks-axe-wounds-at-the-printed-plus-two-strength
  fighters:
    first:
      &recipient
      collection: mordheim
      band_id: hirelings.dramatis-personae.1b
      profile_id: hireling.dramatis.drenok-johansen-wielder-of-the-great-axe
      main_weapon_id: weapon.icefang-axe
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      &opponent
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: &recipient-charges {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    # Fearsome: the charged opponent's Fear test, passed.
    - {key: round.0.second.fear.charged.0, value: 3}
    - {key: round.0.second.fear.charged.1, value: 3}
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 2}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 1, state.second.wounds: 2}
  expect_fighters:
    first.main_weapon.strength_bonus: 2
    first.main_weapon.two_handed: true
    first.main_weapon.parry: true
    first.main_weapon.injury_modifier: 1
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The control (Bard, kit dagger) charges the same opponent: no Fear test is asked and
# the identical wound die 2 is below the unboosted S3 target against T3.
- audit_id: rule/catalog/dramatis-personae/hireling.dramatis.drenok-johansen-wielder-of-the-great-axe.rule.axe-of-icefang/weapon.icefang-axe
  id: the-same-wound-die-fails-for-a-hireling-without-the-axe
  fighters:
    first:
      &control
      collection: mordheim
      band_id: hirelings.hired-sword.1b
      profile_id: hireling.hired-sword.bard
      main_weapon_id: weapon.dagger
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second: *opponent
  duel_context: *recipient-charges
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 2}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 0, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The printed +1 to injury rolls: against a one-Wound opponent the injury die 2
# (Knocked Down on the ordinary chart) becomes 3 and the victim is Stunned.
- audit_id: rule/catalog/dramatis-personae/hireling.dramatis.drenok-johansen-wielder-of-the-great-axe.rule.axe-of-icefang/weapon.icefang-axe
  id: drenoks-axe-adds-one-to-the-injury-roll
  fighters:
    first: *recipient
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 2, attacks: 1, leadership: 7}
  duel_context: *recipient-charges
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.fear.charged.0, value: 3}
    - {key: round.0.second.fear.charged.1, value: 3}
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 2}
    - {key: round.0.first.attack.0.injury.0, value: 2}
  expect_rounds:
    0: {attacks.0.damage: 1, state.second.wounds: 0, state.second.condition: STUNNED}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The printed Parry: the opponent charges Drenok (its Fear test passes), hits on a 4
# and the axe's parry die 5 beats the hit, so no wound die is reached.
- audit_id: rule/catalog/dramatis-personae/hireling.dramatis.drenok-johansen-wielder-of-the-great-axe.rule.axe-of-icefang/weapon.icefang-axe
  id: drenoks-axe-parries-a-lower-hit
  fighters:
    first: *opponent
    second: *recipient
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    # Fearsome: the charger's Fear test, passed.
    - {key: round.0.first.fear.charge.0, value: 3}
    - {key: round.0.first.fear.charge.1, value: 3}
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.parry, value: 5}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.parried: true, attacks.0.wounded: false, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The printed item rule belongs to the recipient's profile; selecting it on another
# hireling is refused.
- audit_id: rule/catalog/dramatis-personae/hireling.dramatis.drenok-johansen-wielder-of-the-great-axe.rule.axe-of-icefang/weapon.icefang-axe
  id: the-rule-is-refused-on-a-hireling-outside-its-printed-profile
  fighters:
    first:
      <<: *control
      special_rule_ids: [hireling.dramatis.drenok-johansen-wielder-of-the-great-axe.rule.axe-of-icefang]
