# Clause: whole--scope--halfling-list-access (scope: YES)
# AUTHORED[whole--scope--halfling-list-access]: 2 scenarios evidence the printed access in both directions,
#   from this origin's own published lists.
#   RECIPIENT: the printed Moot Elder (bands/mordheim/mootlanders/profiles.yaml, id moot-elder), whose
#   equipment_lists declares mootlander-equipment-list - the list this origin publishes as the Halfling
#   Equipment List - and whose printed restriction records the same sentence this clause carries.
