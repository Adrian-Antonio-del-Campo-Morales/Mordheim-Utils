# --- Authored scenarios ---
# Derived from the printed sentence and this origin's own two published lists (profiles.yaml for the
# recipient's declared list, equipment-access.yaml for the rows each list offers); no engine output was
# consulted.  The channel is the fixture's carried-item field, which the shared stage validates against the
# recipient's offered set exactly as it validates a slotted weapon.

- audit_id: rule/mordheim/mootlanders/moot-elder--halfling-list/weapon.pistol
  id: the-printed-pistol-purchase-is-admitted-for-the-moot-elder
  covers: [whole--scope--halfling-list-access]
  # The catalogue weapon id is the channel: the closure below uses the same form.
  # pistol is on neither published list of this band (the Halfling Equipment List carries dagger, spear,
  # sword, mace, bow, short_bow, sling, light_armour, shield, cooking_pot_helmet; the Master Chef List carries
  # kitchen_knife, cleaver, ladle, tenderiser), so carrying it is exactly what the printed additional purchase
  # permits.  The expectation is that printed access, not the refusal an unprojected list would produce today.
  fighters:
    first:
      collection: mordheim
      band_id: mootlanders
      profile_id: moot-elder
      main_weapon_id: weapon.mace
      owned_item_ids: [weapon.pistol]
    second:
      collection: mordheim
      band_id: mootlanders
      profile_id: warriors
  duel_context:
    charging: []
    active_participant: first
  initial_state:
    second:
      condition: OUT
  expect_initial:
    second.condition: OUT
  expect_final:
    rounds_executed: 0
    termination_reason: second_out

- audit_id: rule/mordheim/mootlanders/moot-elder--halfling-list/weapon.pistol
  id: a-row-no-mootlander-list-offers-is-refused
  covers: [whole--scope--halfling-list-access]
  # crossbow is absent from both lists this band publishes, so the printed access does not reach it; the
  # declared fragment is the shared stage's own per-item access sentence, which no unrelated failure can
  # satisfy.  This is the closure of the same sentence: the extra pistol purchase is not a blanket waiver.
  fighters:
    first:
      collection: mordheim
      band_id: mootlanders
      profile_id: moot-elder
      owned_item_ids: [weapon.crossbow]
  expect_error: '"weapon.crossbow" is not on any equipment list of mootlanders/moot-elder.'
