#
# AUTHORED: the printed Dark Majesty power is a selectable von Carstein vampiric power
#   whose provider build selects it with special_rule_ids; its printed supplied-leader
#   contract carries 6 scenarios: a same-band borrower that adopts the supplied
#   Leadership for its own required test at the printed increased twelve inches and
#   passes with it; the same borrower declining the optional use; the supplied provider
#   one inch beyond the printed increased radius; a provider that is not standing; the
#   same provider supplied on the opposing side; and a profile of another bloodline
#   whose selection of the power is refused.  Twelve inches is the discriminating
#   distance: it is beyond the vampire's own printed six-inch Leader radius, so only
#   the selected power offers the borrow there (the 6-to-12 range increase itself is
#   the sibling identity .../band--von-carstein-power-dark-majesty/mechanic.leader-
#   twelve, authored in its own file).  The borrower's own Leadership test is the Fear
#   test of the charge it receives, whose printed consequence for a failure is
#   explicit in state.second.fear_hit_sixes.  The printed Rout re-roll clause of the
#   power is outside the admitted runtime scope.

# --- Authored scenarios ---
# The supplied provider is the band's printed von-carstein-vampire (printed Leadership
# 8) selecting the Dark Majesty power row; the borrower is the band's printed dreg
# profile, a living same-band warrior with no printed psychology rule of his own.
# Declared fixture facts: both the borrower and the supplied provider carry the fixture
# characteristics weapon_skill 3, strength 3, toughness 3, wounds 2, initiative 5,
# attacks 1; the borrower's Leadership is pinned at the fixture value 7 (printed 7) so
# the borrowed value stays separable, and the vampire keeps his printed Leadership 8.
# The borrower's dagger is from the band's own undead equipment list.  The dice
# 4+4 = 8 fail the borrower's pinned Leadership 7 and pass the vampire's printed
# Leadership 8.

# The charged borrower fails against its own pinned Leadership and passes with the
# supplied vampire's printed value at the printed increased twelve inches, so the
# charge it received leaves it unclamped.
- audit_id: rule/trollheim/chaos-streets-undead-bloodlines/band--von-carstein-power-dark-majesty/mechanic.leader-six
  id: a-supplied-leader-at-twelve-inches-lends-his-leadership
  fighters:
    first:
      trait_overrides: {causes_fear: true}
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 10, attacks: 1, leadership: 7}
    second:
      collection: trollheim
      band_id: chaos-streets-undead-bloodlines
      profile_id: dreg
      main_weapon_id: weapon.dagger
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 7}
  duel_context:
    charging: [first]
    active_participant: first
    nearby:
      - participant_id: leader
        side_id: second
        condition: standing
        fighter:
          collection: trollheim
          band_id: chaos-streets-undead-bloodlines
          profile_id: von-carstein-vampire
          special_rule_ids: [band--von-carstein-power-dark-majesty]
          characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 8}
    distances:
      - [second, leader, 12]
  decisions:
    - {key: round.0.second.fear.charged.leader.leader, value: true}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.fear.charged.0, value: 4}
    - {key: round.0.second.fear.charged.1, value: 4}
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.wounds: 3, state.first.condition: STANDING, state.second.wounds: 2, state.second.condition: STANDING, state.second.fear_hit_sixes: false}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

