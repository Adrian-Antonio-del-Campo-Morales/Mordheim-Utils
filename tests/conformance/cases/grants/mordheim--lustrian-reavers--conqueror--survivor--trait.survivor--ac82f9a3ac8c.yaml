# Conformance authoring scaffold; generated comments, manually authored scenarios.
# audit_id: rule/mordheim/lustrian-reavers/conqueror--survivor/trait.survivor
# authoring_status: AUTHORED
# authoring_progress: the admitted survivor clause carries three authored scenarios for the printed
#   "Treat Out of Action as Stunned if the Conqueror is standing when receiving the Wound": a
#   standing bearer whose injury roll takes it out of action is Stunned instead, the same dice against
#   a bearer without the trait are taken out, and a bearer that was already Knocked Down when it
#   received the wound is taken out as well, which is the printed "unless the model is already
#   Knocked Down or Stunned".  REVIEWED still requires manual semantic review and execution_status
#   stays UNEXECUTED.
# execution_status: UNEXECUTED (this scaffold has no behavioral result)
#
# Derive inputs and expectations from rule text and accepted rulings.
# Do not derive them from the engine or execute combat during authoring.
# REVIEWED requires semantic review; covers labels alone are insufficient.
# Preserve audit_id when filling this file.
# Governing rulings: docs/decisions/design-rulings.md
#
# Clause: cannot-be-out-while-standing (scope: YES)
# AUTHORED[cannot-be-out-while-standing]: 3 scenarios cover the recorded contract "an Out of Action
#   result while standing becomes Stunned; observable: a standing bearer is Stunned instead of
#   removed": the trauma die of six is the ordinary out-of-action face, so the standing bearer keeps
#   STUNNED, the identical tape without the trait takes the bearer out, and the third scenario starts
#   the bearer in KNOCKED_DOWN, where the printed exception leaves the out-of-action result standing.
#   The second sentence of the same printed rule (the post-battle Dead result) is the excluded
#   scope-NO clause.
#
# Clause: first-dead-to-multiple-injuries (scope: NO)
# Outside the admitted clause scope; retained for context, not a test TODO.

# --- Authored scenarios ---
# Derived from the printed rule and the recorded contract; no engine output was consulted.  The
# trauma die of six is the ordinary out-of-action face of the injury table, so the difference between
# the three scenarios is only the bearer's standing state and the trait itself.  The bearer declares
# no attack, so the tape holds only the attacker's hit, wound and injury dice.
- audit_id: rule/mordheim/lustrian-reavers/conqueror--survivor/trait.survivor
  id: a-standing-bearer-is-stunned-instead-of-taken-out
  covers: [cannot-be-out-while-standing]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      trait_overrides: {survivor: true}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.injury.0, value: 6}
  expect_rounds:
    0: {attacks.0.damage: 1, state.second.condition: STUNNED, state.second.wounds: 0}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# The control: the identical dice against a bearer without the printed trait are taken out of action.
- audit_id: rule/mordheim/lustrian-reavers/conqueror--survivor/trait.survivor
  id: without-the-trait-the-same-dice-take-the-bearer-out
  covers: [cannot-be-out-while-standing]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.injury.0, value: 6}
  expect_rounds:
    0: {attacks.0.damage: 1, state.second.condition: OUT}
  expect_final: {rounds_executed: 1, termination_reason: second_out}
# The printed exception: the bearer was already Knocked Down when it received the wound, so the trait
# does not reach the out-of-action result.
- audit_id: rule/mordheim/lustrian-reavers/conqueror--survivor/trait.survivor
  id: an-already-knocked-down-bearer-is-taken-out
  covers: [cannot-be-out-while-standing]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      trait_overrides: {survivor: true}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 2, attacks: 1}
  initial_state: {second: {condition: KNOCKED_DOWN, attacks: 1}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  # A Knocked Down opponent is hit automatically and a further wound takes it out of
  # action without an injury roll, so the tape holds only the wound die.
  rolls:
    - {key: round.0.first.attack.0.wound, value: 4}
  expect_rounds:
    0: {attacks.0.damage: 1, state.second.condition: OUT}
  expect_final: {rounds_executed: 1, termination_reason: second_out}
