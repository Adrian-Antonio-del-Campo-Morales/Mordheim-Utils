# --- Authored scenarios ---
# Derived from the printed rule, the recorded contract and the admitted berserker grants
# specification; no engine output was consulted.  The catalog origin binds no recipient, so the
# fixture carries the canonical tag itself on a hand-built attacker (Weapon Skill 4, Attacks 1),
# and the boundaries are the equal-Weapon-Skill hit target and the charging turn; the opponent's
# strike is a declared natural 1 so nothing else is in question.

- audit_id: rule/catalog/warband/skill.berserker/skill.berserker
  id: the-charging-turn-hits-on-three
  fighters:
    first:
      skill_ids: [skill.berserker]
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 4, strength: 3, toughness: 3, wounds: 3, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 4, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 3}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: true, attacks.0.damage: 1, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

