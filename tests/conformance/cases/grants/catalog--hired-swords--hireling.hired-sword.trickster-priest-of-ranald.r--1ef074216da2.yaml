# Hireling family model (P0, 2026-11-17).  The recipient is the printed Trickster-Priest of Ranald
# compiled through the hireling route (hirelings.hired-sword.2b /
# hireling.hired-sword.trickster-priest-of-ranald) with the fixture facts (WS3 S3 T3 W2 I5 A1; the
# printed Ld7 stays); the Mark of Ranald is a selectable printed rule, so the recipient selects it
# through special_rule_ids and the control is the same profile without the selection.  The printed
# kit's first close-combat weapon (the ceremonial dagger) is the default and the Priest is
# silenced (attacks 0), so his only roll is the duck itself.  The opponent is hand-built
# (WS3 S3 T3 W3 I2 A1 Ld7, mace) and charges; the Priest wears no armour (Strictures), so a
# let-through wound rolls no save.  The selected rule also grants Ranald's Luck (the sibling
# identity): the duck is the expressly unmodifiable 6+ named by the Djinn's Curse ruling
# (2026-10-15), so the tape declares no ranalds-luck pip decision on it - the strict absence is
# part of the assertion.  The refusal selects the printed rule on the grade-1b Bard.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.trickster-priest-of-ranald.rule.marks-of-ranald/mechanic.marks-of-ranald
  id: the-priest-ducks-a-hit-on-the-unmodifiable-six
  fighters:
    first:
      &duck-recipient
      collection: mordheim
      band_id: hirelings.hired-sword.2b
      profile_id: hireling.hired-sword.trickster-priest-of-ranald
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
      special_rule_ids: [hireling.hired-sword.trickster-priest-of-ranald.rule.marks-of-ranald]
    second:
      &duck-opponent
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  initial_state: {first: {attacks: 0}}
  duel_context: &duck-context {charging: [second], active_participant: second}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.attack.0.hit, value: 4}
    # The duck is rolled on the hit itself; the unspent Ranald's Luck pip is never offered on this
    # unmodifiable roll, so the tape declares no decision at all.
    - {key: round.0.second.attack.0.marks-of-ranald, value: 6}
  expect_rounds:
    0: {attacks.0.saved: true, attacks.0.damage: 0, state.first.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
