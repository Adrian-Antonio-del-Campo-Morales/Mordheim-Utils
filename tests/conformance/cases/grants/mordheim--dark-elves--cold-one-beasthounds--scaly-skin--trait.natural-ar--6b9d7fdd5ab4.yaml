# The second printed face of the same sentence: "any result of 'no save' on the Critical Hit chart
# will negate the unmodified 6+ save".  Strength 3 leaves the threshold untouched, so the negation is
# the only difference from the clause above: the declared critical result of three enters the
# armour-ignoring bracket, no armour face is requested for the natural save, and the critical's
# doubled damage is taken.  The bearer starts at three wounds so the wound taken leaves it standing
# and no Injury roll is needed.
