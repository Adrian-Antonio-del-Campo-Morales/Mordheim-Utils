# --- Authored scenarios ---
# The printed incompatibility, asserted through the shared eligibility stage's own literal refusal
# for this pair of rule ids.  Both printed skills are declared because the guard reads the build's
# declared `special_rule_ids`; Frustratingly Tiny is declared first, so the pair sentence is raised in
# that row's `prerequisites` stage before the sibling's own runtime gate is reached.
- audit_id: rule/mordheim/snotlings-web/bigsnotz--big-bully/profile.skill-access
  id: a-bigsnot-carrying-both-printed-skills-is-refused
  fighters:
    first:
      collection: mordheim
      band_id: snotlings-web
      profile_id: bigsnotz
      special_rule_ids: [bullied-goblin--frustratingly-tiny, bigsnotz--big-bully]
  expect_error: Frustratingly Tiny cannot be combined with Big Bully

# Accepted control: the same printed bearer declaring neither skill of the pair constructs and fights,
# so the refusal above belongs to the declared pairing and is not a blanket rejection of the profile or
# of the Frustratingly Tiny row.  The sibling id cannot serve as a lone control: its KB row records
# `grant: profile` with `implemented: NO`, so declaring it alone is refused as outside the executable
# duel runtime before any effect.  The scenario keeps its original collected id; the build it
# declares carries neither skill of the pair, which is what the comment above states.
- audit_id: rule/mordheim/snotlings-web/bigsnotz--big-bully/profile.skill-access
  id: the-bigsnot-with-big-bully-alone-constructs-and-fights
  fighters:
    first:
      collection: mordheim
      band_id: snotlings-web
      profile_id: bigsnotz
      main_weapon_id: weapon.sword
      characteristics: {weapon_skill: 2, strength: 2, toughness: 3, wounds: 1, initiative: 3, attacks: 1, leadership: 5}
    second:
      collection: mordheim
      band_id: snotlings-web
      profile_id: snotling-mobs
      main_weapon_id: weapon.club
      characteristics: {weapon_skill: 2, strength: 2, toughness: 3, wounds: 1, initiative: 3, attacks: 1, leadership: 5}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.priority-tie, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.0.first.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: false, attacks.1.hit: false}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The printed grant itself ("The BigSnot immediately learns ONE Strength Skill"), on the construction
# route.  The BigSnot's own printed skill tables (profiles.yaml: combat, speed, special) carry no
# Strength list, so the Strength skill is reachable only through Big Bully: with the rule selected the
# BigSnot is built carrying one Strength skill (Mighty Blow); the same BigSnot without Big Bully may
# not take it; and since the rule grants exactly ONE Strength skill, declaring Big Bully with two is
# refused.  The admitted build is put out of action at the outset so no die is requested.

- audit_id: rule/mordheim/snotlings-web/bigsnotz--big-bully/profile.skill-access
  id: big-bully-lets-the-bigsnot-learn-one-strength-skill
  fighters:
    first:
      collection: mordheim
      band_id: snotlings-web
      profile_id: bigsnotz
      special_rule_ids: [bigsnotz--big-bully]
      skill_ids: [skill.mighty-blow]
    second:
      collection: mordheim
      band_id: snotlings-web
      profile_id: bigsnotz
  duel_context: {charging: [], active_participant: first}
  initial_state: {first: {condition: OUT}}
  expect_initial: {first.condition: OUT}
  expect_final: {rounds_executed: 0, termination_reason: first_out}

- audit_id: rule/mordheim/snotlings-web/bigsnotz--big-bully/profile.skill-access
  id: without-big-bully-the-bigsnot-may-not-take-a-strength-skill
  fighters:
    first:
      collection: mordheim
      band_id: snotlings-web
      profile_id: bigsnotz
      skill_ids: [skill.mighty-blow]
  expect_error: "skills are not available to snotlings-web/bigsnotz: ['skill.mighty-blow']"

- audit_id: rule/mordheim/snotlings-web/bigsnotz--big-bully/profile.skill-access
  id: big-bully-grants-only-one-strength-skill
  fighters:
    first:
      collection: mordheim
      band_id: snotlings-web
      profile_id: bigsnotz
      special_rule_ids: [bigsnotz--big-bully]
      skill_ids: [skill.mighty-blow, skill.resilient]
  expect_error: Big Bully grants exactly one Strength skill to snotlings-web/bigsnotz

# "A BigSnot may only take this skill once each": declaring Big Bully a second time is refused by
# construction's own once-only check, so a second take can buy no second Strength skill.
- audit_id: rule/mordheim/snotlings-web/bigsnotz--big-bully/profile.skill-access
  id: big-bully-may-only-be-taken-once
  fighters:
    first:
      collection: mordheim
      band_id: snotlings-web
      profile_id: bigsnotz
      special_rule_ids: [bigsnotz--big-bully, bigsnotz--big-bully]
      skill_ids: [skill.mighty-blow]
  expect_error: Big Bully may only be taken once by snotlings-web/bigsnotz
