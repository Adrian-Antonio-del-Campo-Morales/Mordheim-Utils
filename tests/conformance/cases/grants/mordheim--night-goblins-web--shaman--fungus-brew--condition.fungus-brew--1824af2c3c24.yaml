# "1 Rowdy = affected by Animosity on 1 or 2", the admitted half of that compound result.  The previous note
# recorded the clause as excluded because the existing squabble branch tested == 1 only; the reviewed register
# row admits the individual consequence and the delivered consumer widens that same own-turn die, so the
# supplied condition is declared like the other brew results of this file.  A consumer still testing == 1
# fails here: the declared 2 is suppressed, which is the printed 1-or-2 band and not the ordinary threshold.
