  fighters:
    first: *opponent
    second: *recipient
  initial_state: *bearer-silent
  duel_context: *opponent-charges
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 2}
  expect_rounds:
    0: {attacks.0.hit: true, attacks.0.damage: 0, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The control (Bard): the same three against Toughness 3 fails to wound.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.cursed-hillman.rule.thin-flesh/thin-flesh
