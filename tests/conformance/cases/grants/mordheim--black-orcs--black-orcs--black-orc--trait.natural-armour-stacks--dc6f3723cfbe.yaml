    - {key: round.0.first.attack.0.wound, value: 5}
    - {key: round.0.first.attack.0.armour, value: 5}
  expect_rounds:
    0: {attacks.0.wounded: True, attacks.0.saved: True, state.second.wounds: 1, state.second.condition: STANDING}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

