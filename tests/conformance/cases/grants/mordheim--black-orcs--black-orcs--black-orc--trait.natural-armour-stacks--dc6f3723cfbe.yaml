# What stays pending below is one face and it is a normative conflict between two printed rows, not
# authoring work: the leather suit's own row refuses the composition this row permits.  The other
# equipment kind is already evidenced by the sibling clause of the same profile (worn light armour,
# trait.natural-armour-save), so it is not repeated here.  REVIEWED still requires manual semantic
# review and execution_status stays UNEXECUTED.
