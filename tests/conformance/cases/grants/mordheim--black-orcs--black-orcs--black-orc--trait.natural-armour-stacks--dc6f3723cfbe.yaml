# Preserve audit_id when filling this file.
# Governing rulings: docs/decisions/design-rulings.md
#
# PARTIAL: [D] 2 scenarios cover the printed "may be combined with other equipment to improve
# it" for this recipient: the Black Orc carrying a shield saves the unsaved wound on the improved
# five, and the four is not saved, so the natural save is improved by the carried equipment rather
# than left at six.  Bearer is the printed Black Orcs profile, which receives the natural save from
# its own profile rule.  The one open face is a NORMATIVE conflict between two printed rows, not a
# wiring gap: this row prints "This save may be combined with other equipment to improve it", while the
# leather suit's own row prints "Toughened leathers cannot be combined with the effects of any other
# armour except a helmet or buckler" (catalog/mechanics/close-combat.yaml armour.toughened-leathers;
# see its own origin cases/mechanics/armour.toughened-leathers.yaml, and the Shaggy Hide clarification
# that the register note of the sibling save clause applies to every bearer of this flag).  Until the
# rules owner settles which row governs the composition, both candidate expectations (hide improves to
# five, or the leather's own refusal keeps six) are guesses, so no leather-over-hide build is authored.
# The other equipment kind is authorable and already evidenced: the sibling clause
# trait.natural-armour-save of this same profile authors
# "worn-light-armour-raises-the-boss-hide-to-five" with armour_id: armour.light-armour, so a second
# armour suit under this clause would restate that observation under another covers label and evidence
# nothing new.  Separate from this blocker, the implementation defect these two tapes detect is the
# compiled binding that carries the natural_armour_stacks flag: without it the shield-improved five is
# never offered.  REVIEWED still requires manual semantic review.
# Derived from the printed sentence and the recorded contract; no engine output was consulted.

# The shield raises the printed natural 6+ to a combined 5+, so a wound that would otherwise save only on
# 6 is now saved on 5; the same improved face still fails on 4, which is the observable contrast the two
# scenarios share. The attacker carries a mace, which applies no armour-save modifier, so the declared
# armour die really measures the combined 5+ threshold; an axe (-1 armour save) would move it to 6+ and
# the five could not show the improvement. The boss wears the printed axe and shield, so its own kit is
# untouched and every declared die is consumed on the resolution path.

