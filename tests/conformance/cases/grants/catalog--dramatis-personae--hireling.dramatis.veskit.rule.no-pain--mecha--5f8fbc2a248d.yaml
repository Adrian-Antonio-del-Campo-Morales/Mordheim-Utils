#
# Hireling family model (P0, 2026-11-17) in the Cairn Wraith No Pain shape.  The recipient is the
# printed profile compiled through the hireling route (hirelings.dramatis-personae.core /
# hireling.dramatis.veskit) with the fixture characteristics (WS3 S3 T3 I5 A1) and wounds 1 so the first
# wound reaches the Injury table; it contributes no attack of its own (initial_state).  The attacker is
# the stronger hand-built fixture (WS10 S8 I10, mace): 3+ to hit, 2+ to wound with no critical face,
# and a Strength that makes Veskit's Fighting Claws parry ineligible (an attacker of twice the bearer's
# Strength cannot be parried) and lifts his printed 3+ Metallic Body save past 6 (Strength 8 is -5), so
# neither a parry nor an armour die is requested.  Veskit's other printed rules add no die here: he is
# immune to psychology, nobody charges, and his integrated claws only act when he strikes.  The control
# is the grade-1b Bard (dagger: no parry; kit armour is owned, not worn), compiled through the same
# route with the same fixture; the refusal selects the printed rule on the Bard.

