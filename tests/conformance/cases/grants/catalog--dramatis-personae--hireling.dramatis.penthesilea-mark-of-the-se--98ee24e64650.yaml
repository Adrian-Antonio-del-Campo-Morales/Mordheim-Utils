# Hireling family model (README, Hireling recipients): the recipient is the printed Penthesilea compiled
# through the hireling route (hirelings.dramatis-personae.1b / hireling.dramatis.penthesilea-mark-of-the-serpent),
# her printed rule granted by the profile itself; fixture characteristics WS3 S3 T3 W2 I5 A1 (printed Ld8
# stays); the omitted main weapon is her kit's Starsword.  The printed enemies are compiled band profiles
# (fixture WS3 S3 T3 W3 I2 A1, printed Leadership, the band's default hand); the plain opponent is
# hand-built (Ld7, mace).  Dice: the opponent's Dance test 1+1 passes any Leadership; a natural 2 misses
# WS3-vs-WS3 (4+), the Hatred re-roll of 4 hits, S4 wounds T3 on a 4 with no save; every opposing swing is a
# declared natural 1.  The control is the grade-1b Bard (no Dance, no Hatred); the refusal selects the
# printed rule on the Bard.

# Against a Norse opponent the first-round miss is re-rolled, hits and wounds (armour ignored by the Starsword).
- audit_id: rule/catalog/dramatis-personae/hireling.dramatis.penthesilea-mark-of-the-serpent.rule.amazon/mechanic.amazon-isolationists
  id: a-first-round-miss-by-penthesilea-is-rerolled-against-a-norse-opponent
  fighters:
    first:
      &recipient
      collection: mordheim
      band_id: hirelings.dramatis-personae.1b
      profile_id: hireling.dramatis.penthesilea-mark-of-the-serpent
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      &norse
      collection: mordheim
      band_id: norse-explorers-lustria
      profile_id: bondsmen
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    # Mesmerising Dance: the opponent's own Leadership test, passed (1+1).
    - {key: round.0.second.mesmerising-dance.0, value: 1}
    - {key: round.0.second.mesmerising-dance.1, value: 1}
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.first.attack.0.hit.reroll, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: true, attacks.0.damage: 1, state.second.wounds: 2, state.first.wounds: 2, state.second.charm_attack_blocked: false}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

