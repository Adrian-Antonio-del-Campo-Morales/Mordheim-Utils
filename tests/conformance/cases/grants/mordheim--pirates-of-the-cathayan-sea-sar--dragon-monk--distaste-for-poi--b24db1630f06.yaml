# AUTHORED: 3 scenarios.  Printed: 'Dragon Monks frown on this and may never use any kind of poison or venom.'
#   The profile binding (grant: profile, applies_to dragon-monk) carries categories [poison] only.  A Dragon Monk
#   with a poisoned sword (the Monk Equipment List offers the sword) is refused with
#   `poisons are forbidden for pirates-of-the-cathayan-sea-sar/dragon-monk`.  Two controls bound the clause: the
#   same Monk without poison constructs against a Deck Hand of the same band carrying the poison (the ban is the
#   Monk's, not the band's), and a Deck Hand constructs against a Monk taking Crimson Shade (the parameter names
#   poison, not drugs: the printed sentence frowns on 'various drugs' as colour but bans only poison and venom,
#   which the KB binding records).  The Monk's other printed rules (Unarmed Mastery, Art of Silent Death, no
#   armour suit) are construction grants that do not touch a poisoned sword.
# authoring_progress: 3 authored scenario(s) in this file; the undivided identity is represented. REVIEWED requires
#   manual semantic review and execution_status stays UNEXECUTED.
# Family model (construction-equipment, B11, category ban): compiler.forbid-item-categories carries the printed
#   categories as its parameter; the shared eligibility stage categoryProhibitions (index.ts, buildRestriction;
#   mordheim_construction/restrictions.py calls it before the list gate) refuses a coated weapon when the
#   categories include `poison` (`poisons are forbidden for <band>/<profile>`) and a drug preparation when they
#   include `drug` (drugsForbidden == "category": `drugs are forbidden for <band>/<profile>`).  The
#   lothern-sea-patrol-sar Honourable file is the authored precedent.  The control shows the same bearer without
#   the item constructs while an unaffiliated fighter carrying it constructs too, so the refusal belongs to the rule,
#   not to the item.  The opponent's Crimson Shade rolls its D3 at duel start (key `<side>.crimson-shade`, as in the
#   authored precedent); the face is irrelevant to the construction asserted.
