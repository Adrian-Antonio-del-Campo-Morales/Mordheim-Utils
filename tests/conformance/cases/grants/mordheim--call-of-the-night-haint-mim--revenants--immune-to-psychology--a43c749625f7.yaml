#
# AUTHORED: the printed immunity is read through the one Psychology request this
#   setup can make - the round-0 Fear test of the charged warrior.  In the immune scenario the
#   tape declares no Fear die at all, and the strict tape consumes exactly the declared dice and
#   rejects both an undeclared request and an unused entry, so a test the engine still asked for
#   fails the case instead of passing quietly - the absence is the assertion.
#   In the contrast scenario the non-immune band-mate corpse-master is charged the same way and its
#   two Leadership dice are declared and pass on 1+1, so the same setup does produce the request
#   when the immunity is absent.
#   The contract's remaining consequences are authored on a hand-built fixture that carries the
#   canonical grants alongside the immunity: the skipped Stupidity test (mechanic.stupidity), the
#   suppressed Frenzy flag (the frenzy flag supplied through initial_state) and the denied Hatred
#   reroll (mechanic.hatred-undead against a hand-built undead opponent, no reroll die declared).
#   REVIEWED still requires manual semantic review.
#   Dice derivation (sources): the warrior strikes with its printed Attacks value A1 and its rules
#   [revenants--causes-fear, revenants--may-not-run, revenants--immune-to-psychology, revenants--immune-to-poison, revenants--no-pain, revenants--spectral-ascension]
#   add no round-0 die request of their own - every strike is declared as a natural 1, so no
#   on-hit, wound, save or injury effect can trigger, and a charged model takes no charge bonus.
#   Contrast evidence (sources): the contrast profile corpse-master binds mechanic.magical-void - nothing in that list is a psychology
#   or fear immunity - and no immunity rule of this band names it in applies_to.
#   The Fear test itself is a 2D6 Leadership test, so the variant list above concerns the
#   clause's other consequences, not an unavailable tape.

# --- Authored scenarios ---
# Third variant: the same fixture carries the contract's remaining grants so that the skipped
# Stupidity test, the suppressed Frenzy flag and the denied Hatred reroll are all asserted - the
# absent Leadership, extra-attack and reroll dice are the assertion, and the strict tape rejects an
# undeclared request.
