      profile_id: champions
      special_rule_ids: [band--mark-of-arkhar]
      skill_ids: [skill.mighty-blow]
      main_weapon_id: weapon.sword
  expect_error: "special rule is not available to marauders-of-chaos/champions: band--mark-of-arkhar"
