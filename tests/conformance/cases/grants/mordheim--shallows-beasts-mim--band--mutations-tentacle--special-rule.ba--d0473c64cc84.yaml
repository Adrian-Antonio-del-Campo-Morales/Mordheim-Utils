# Family model (Aquatic Mutants, construction face; the Suckers file of this band is the model).  The
# record is a `mutation` with `grant: selectable`, `applies_to.profile_types: [hero]` ("Any Hero may
# start the campaign with a single mutation from the following ... tentacle ...") and the compiler
# binding `special-rule.band--mutations-tentacle`, whose contract is `incoming_attacks_modifier: -1`
# beside the tag `rule.tentacle-grapple` (the printed grapple: the opponent loses one attack).  A
# henchman is refused by the recipients gate.  Recipient: the printed Buccaneer with a club from its
# own list; the opponent is hand-built.  Neither side strikes, so the grapple nominates nothing and
# the compiled modifier is the whole evidence (the Suckers model shows the same Hero's unselected
