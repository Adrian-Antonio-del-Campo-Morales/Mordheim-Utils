# The retained control preserves its source-derived ordinary charge and legal equipment.
# The control: the identical charge on the same profile build without the band netter rule, where no
# net die is requested at all and the ordinary attack misses.
- audit_id: rule/mordheim/crooked-moon-kep/band--night-goblin-special-skills-netter/condition.netted
  id: without-the-band-netter-rule-the-charge-asks-for-no-net-die
  fighters:
    first:
      collection: mordheim
      band_id: crooked-moon-kep
      profile_id: night-goblins
      main_weapon_id: weapon.club
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  initial_state:
    second: {attacks: 0}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.animosity, value: 4}
    - {key: round.0.first.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: false, attacks.0.knocked_down_target: false, state.second.condition: STANDING,
        state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
  expect_events:
    - {kind: roll, key: round.0.first.animosity, sides: 6, value: 4}
    - {kind: roll, key: round.0.first.attack.0.hit, sides: 6, value: 1}

# The printed consequence of the net, read on the Crooked Moon's own Night Goblin: "a warrior caught in
# a net will be automatically hit in combat but the Goblin must still roll to wound as with a knocked
# down enemy".  The victim is supplied as caught (condition.netted), so it starts Knocked Down, the
# Goblin's blow asks for no hit die at all and only the wound die is declared; S3 against T3 wounds on
# 4+, and a knocked-down warrior that suffers a wound is taken out of action (core injury rule).  The
# victim is silenced (attacks: 0) so every die on the tape is the Goblin's, and the band's Animosity
# asks the active Night Goblin for its own-turn die first (a 4 passes), exactly as in the control.
- audit_id: rule/mordheim/crooked-moon-kep/band--night-goblin-special-skills-netter/condition.netted
  id: the-netted-victim-is-hit-automatically-and-the-goblin-still-rolls-to-wound
  fighters:
    first:
      collection: mordheim
      band_id: crooked-moon-kep
      profile_id: night-goblins
      main_weapon_id: weapon.club
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      condition_ids: [condition.netted]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  initial_state:
    second: {attacks: 0}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.animosity, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
  expect_initial: {second.condition: KNOCKED_DOWN, second.netted: true}
  expect_rounds:
    0: {attacks.0.hit: true, attacks.0.wounded: true, state.second.condition: OUT}
  expect_final: {rounds_executed: 1, termination_reason: second_out}
