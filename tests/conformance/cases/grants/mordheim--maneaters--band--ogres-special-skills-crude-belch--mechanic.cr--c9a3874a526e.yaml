#
# AUTHORED: 5 scenarios cover the printed Hero skill: the enemy's failed Leadership test raises
#   its To Hit target from 4 to 5 for that round; the passed test leaves the 4 alone; the
#   penalty expires at the next combat phase and the belch is not re-offered (the printed
#   new-enemy limit in a one-against-one duel); a control without the selection requests no
#   belch decision; and the selection is refused on a henchman (the band's Heroes carry special
#   skill access, its Bulls do not).  The recipient build copies the authored Maneaters model
#   (mordheim--maneaters--band--ogres-special-skills-bull-charge--mechanic.bu--397ae2b344e0.yaml):
#   the printed Youngbloods Hero with fixture characteristics, weapon.club (the band's lists do
#   not offer the fixture mace) and the band rule selected through special_rule_ids.

# --- Authored scenarios ---
# The Ogre declares the belch at the start of the combat phase
# (decision round.0.first.crude-belch-ogre), and the engaged enemy tests its own Leadership 7 on
# 2D6 (round.0.first.crude-belch-ogre.leadership.{0,1}).  Two sixes fail, so the enemy suffers
# the printed -1 to hit for the turn: its target against WS3 rises from 4 to 5 and its declared
# 4 misses.  The Ogre's own attack is a declared natural miss.
- audit_id: rule/mordheim/maneaters/band--ogres-special-skills-crude-belch/mechanic.crude-belch-ogre
  id: a-failed-leadership-test-gives-the-engaged-enemy-minus-one-to-hit
  fighters:
    first:
      collection: mordheim
      band_id: maneaters
      profile_id: youngbloods
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
      main_weapon_id: weapon.club
      special_rule_ids: [band--ogres-special-skills-crude-belch]
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.crude-belch-ogre, value: true}
  rolls:
    - {key: round.0.first.crude-belch-ogre.leadership.0, value: 6}
    - {key: round.0.first.crude-belch-ogre.leadership.1, value: 6}
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 4}
  expect_rounds:
    0: {attacks.1.hit_target: 5, attacks.1.hit: false, state.first.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

