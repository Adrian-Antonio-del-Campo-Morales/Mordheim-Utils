# The 2026-11-18 ruling fixes the printed "for the turn" as the duel round: the same declared 4
# that misses under the round-0 penalty hits again in round 1.  The resource is spent for the
# rest of the duel - the printed "must wait until a new enemy engages him" in a one-against-one
# duel - so no belch decision is requested in round 1 at all, which the strict tape's complete
# consumption makes assertive.
- audit_id: rule/mordheim/maneaters/band--ogres-special-skills-crude-belch/mechanic.crude-belch-ogre
