# Printed text (grade-1a.yaml, Poisoner): "The Assassin starts each game with his weapons poisoned with
# either Black Lotus or Dark Venom. The controlling player decides which poison the Assassin is armed
# with before the game starts".  The binding is compiler.assassin-poisoner; compiler.py refuses with
# "Poisoner requires one shared Black Lotus or Dark Venom choice before battle" when main_poison_id is
# not one of {poison.black-lotus, poison.black-venom} or the off-hand poison differs, and otherwise
# copies the choice to a carried off-hand weapon.  The recipient is the printed Imperial Assassin
# (hirelings.hired-sword.1a / hireling.hired-sword.imperial-assassin; kit sword, dagger, throwing knives,
# crossbow pistol) with the fixture facts (WS3 S3 T3 W2 I5 A1; the printed Ld8 stays); the kit sword is
# the main weapon and the kit dagger the off-hand weapon.  The admissions use the construction-only
# shape (no charge, the bearer out of action before the first phase) and read the compiled weapon
# effects: Dark Venom's +1 Strength (execution.yaml poison.black-venom: strength_bonus 1) appears on
# both hands; for Black Lotus (tag only) the off hand's poison-free shadow
# (`off_hand_without_poison`, compiled only when the off hand carries a poison) is the legible copy.

# No poison declared before battle: refused.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.imperial-assassin.rule.poisoner/poison-choice
  id: an-assassin-without-a-poison-choice-is-refused
  fighters:
    first:
      collection: mordheim
      band_id: hirelings.hired-sword.1a
      profile_id: hireling.hired-sword.imperial-assassin
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
      main_weapon_id: weapon.sword
  expect_error: "Poisoner requires one shared Black Lotus or Dark Venom choice before battle"

