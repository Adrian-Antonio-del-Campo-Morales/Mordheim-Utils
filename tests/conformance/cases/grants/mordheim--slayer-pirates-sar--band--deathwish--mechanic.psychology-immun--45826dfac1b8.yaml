# --- Authored scenarios ---
# Family model (psychology-immunity): the bearer is the printed Slayer Captain (fixture WS3 S3 T3
# W2 I5 A1; the printed Ld9 stays) with an axe from the band's Pirate equipment list; his Leader
# rule lends Leadership only to a supplied nearby comrade and requests nothing here, and the band's
# Slayer Rules act only on injury.  The non-recipient control is the printed Landlubber (same
# list, a dagger, printed Ld8; his Skittish rule is out of runtime scope).  The enemy is the
# hand-built mace fixture (WS3 S3 T3 W3 I2 A1 Ld7) declaring causes_fear: true, silenced
# (attacks 0) so the bearer's hit target is the observable.  The immune warrior's own 4 hits on
# its ordinary 4+ and S3 wounds T3 on 4+, the positive evidence for the skip; the Landlubber's
# 2D6 of 6+4 = 10 fails his Ld8 and clamps him to sixes.

# A fear-causer charges the Slayer Captain: no Fear die is asked and his 4 hits and wounds.
- audit_id: rule/mordheim/slayer-pirates-sar/band--deathwish/mechanic.psychology-immunity
  id: the-slayer-captain-charged-by-a-fear-causer-is-not-tested
  fighters:
    first:
      &recipient
      collection: mordheim
      band_id: slayer-pirates-sar
      profile_id: slayer-captain
      main_weapon_id: weapon.axe
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      trait_overrides: {causes_fear: true}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [second], active_participant: second}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
  expect_rounds:
    0: {state.first.fear_hit_sixes: False, attacks.0.hit_target: 4, attacks.0.damage: 1, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

