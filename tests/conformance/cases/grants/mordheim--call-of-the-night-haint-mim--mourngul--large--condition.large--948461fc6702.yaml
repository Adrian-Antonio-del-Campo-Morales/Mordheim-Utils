# --- Authored scenarios ---
# Uniform Large Target binding (design ruling recorded 2026-11-18): the printed Large grant binds
# condition.large-target, whose execution entry tags the bearer [size.large]; the printed shooting
# consequences (+1 to hit, targetable when not closest) stay excluded as out-of-scope.shooting and
# are not asserted here.  The observer is a hand-built charger carrying the printed Slay Large
# Creature bonus (+1 Strength when charging a Large creature, first round) through skill_ids.
# Arithmetic: S3 wounds T3 on 4+, the +1S of the charge against a Large target (S4 vs T3) on 3+, so
# the declared wound roll of 3 separates recipient and control.  The recipient is the band's
# printed Mourngul (fixture characteristics WS3 S3 T3 W2 I5 A1; the printed Leadership stays),
# silenced with attacks: 0 as its ethereal sibling shows (Ravening Onslaught only shapes its own
# silenced blows).  It causes Fear, so the charger (Ld7) declares the 2D6 charge test and 3+3
# passes; the hit requests the printed Ethereal interception die (its ethereal sibling shows the
# key; Haunter of the Dark improves the save to 3+ but that threshold belongs to its own origin),
# declared failing on a 1 with its threshold not asserted.  No Pain would only convert a Stunned
# injury result, and the fixture keeps the bearer at one remaining wound so no injury roll happens.
# The removal probe filters this rule's condition.large-target binding; the first scenario's wound
# then fails, which is the discriminating evidence.

# The Slay Large Creature charger wounds the Large Mourngul on a 3 (S4 vs T3 after the charge bonus).
- audit_id: rule/mordheim/call-of-the-night-haint-mim/mourngul--large/condition.large-target
  id: a-slay-large-creature-charger-wounds-the-large-mourngul-on-a-3
  fighters:
    first:
      &charger
      main_weapon_id: weapon.mace
      skill_ids: [rule.slay-large-creature]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
    second:
      collection: mordheim
      band_id: call-of-the-night-haint-mim
      profile_id: mourngul
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    # The Mourngul causes fear: the charger's 2D6 charge test of 3+3 passes Ld7.
    - {key: round.0.first.fear.charge.0, value: 3}
    - {key: round.0.first.fear.charge.1, value: 3}
    - {key: round.0.first.attack.0.hit, value: 4}
    # The hit requests the printed Ethereal interception die, declared failing; its threshold is not asserted.
    - {key: round.0.first.attack.0.ethereal, value: 1}
    - {key: round.0.first.attack.0.wound, value: 3}
  expect_rounds:
    0: {attacks.0.hit: True, attacks.0.wounded: True, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The control: a hand-built opponent without the Large rule carries no charge bonus for the same
# charger, so the same wound roll of 3 fails (S3 vs T3 needs 4+).  It causes no fear and is not
# ethereal, so no other die is requested.
- audit_id: rule/mordheim/call-of-the-night-haint-mim/mourngul--large/condition.large-target
  id: without-the-large-rule-the-same-three-fails
  fighters:
    first:
      <<: *charger
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 7}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 3}
  expect_rounds:
    0: {attacks.0.hit: True, attacks.0.wounded: False, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
