- audit_id: rule/mordheim/shallows-beasts-mim/band--mutations-electrical-touch/mechanic.electrical-touch
  id: a-hero-taking-electrical-touch-jolts-instead-of-striking-and-recharges-for-d3-rounds
  fighters:
    first:
      &recipient
      collection: mordheim
      band_id: shallows-beasts-mim
      profile_id: buccaneer
      special_rule_ids: [band--mutations-electrical-touch]
      main_weapon_id: weapon.club
    second:
      &touch-opponent
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 2
  decisions:
    - {key: round.0.first.electrical-touch.forfeit.0, value: true}
  rolls:
    # Automatic hit: no hit die.  4 wounds T3 at the fixed Strength 3 (the Hero's own S4 is not used).
    - {key: round.0.first.electrical-touch.attack.0.wound, value: 4}
    # Recharge D3 = 2: unavailable in round 1, so no forfeit decision is asked there.
    - {key: round.0.first.electrical-touch.recharge, sides: 3, value: 2}
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.1.first.attack.0.hit, value: 1}
    - {key: round.1.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.wounds: 2, state.first.wounds: 1}
    1: {state.second.wounds: 2}
  expect_final: {rounds_executed: 2, termination_reason: horizon}

