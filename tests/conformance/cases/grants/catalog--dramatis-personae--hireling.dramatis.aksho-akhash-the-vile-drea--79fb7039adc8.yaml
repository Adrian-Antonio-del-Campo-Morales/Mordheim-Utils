# Printed text (grade-2a.yaml, Coward King): "Not immune to psychology/fear despite causing fear."
# The binding is the shared mechanic.craven: a fear-causer ordinarily never tests Fear, Craven
# keeps the bearer subject to it.  Consumer: modular/psychology.py needs_test() (the
# `not causes_fear(self) or mechanic.craven` branch).  Aksho's own Fear is his sibling rule
# (mechanic.causes-fear, its own authored file).
# Hireling family model (P0, 2026-11-17).  Aksho is compiled through the hireling route
# (hirelings.dramatis-personae.2a / hireling.dramatis.aksho-akhash-the-vile-dreadwing-lord-of-the-carrion-throne)
# with the fixture facts (WS3 S3 T3 W2 I5 A1; his printed Ld10 stays); his kit is his innate
# natural attacks and the rule is a profile grant, so nothing is selected.  Aksho is silenced
# (attacks 0) in every scenario, so his Daemonic Flesh magical label is never reached, and the
# enemy's strike is a declared natural 1, so his unmodifiable 5+ save is never rolled.  The enemy
# is hand-built (mace, WS3 S3 T3 W3 I2 A1 Ld7) and declares the one fact the rule reads
# (causes_fear: true); being a fear-causer itself it never tests against Aksho, so the tape holds
# only Aksho's test.  Dice: a 2D6 Fear test of 6+5 = 11 fails his Ld10 and 5+5 = 10 passes it; a
# failed charge test cancels the charge.  The non-Craven control is the Ogre Bodyguard
# (hirelings.hired-sword.core, a fear-causing hireling with no Craven); the refusal selects the
# printed rule on the grade-1b Bard (the compiler's fragment, another package).

# A fear-causer charges Aksho; a fear-causer himself, Craven keeps him subject to the test, 11
# fails Ld10 and he is clamped to sixes for the round.
- audit_id: rule/catalog/dramatis-personae/hireling.dramatis.aksho-akhash-the-vile-dreadwing-lord-of-the-carrion-throne.rule.coward-king/mechanic.craven
