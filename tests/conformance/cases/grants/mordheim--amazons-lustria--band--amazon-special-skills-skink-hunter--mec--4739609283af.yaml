# The band origin grants the shared first-round Skink priority, which is set
# independently of the charge flag, so the printed "no matter who charged" is the
# observation: the dice are requested in the order the round resolves them.
- audit_id: rule/mordheim/amazons-lustria/band--amazon-special-skills-skink-hunter/mechanic.strike-first-vs-skinks-first-round
  id: the-amazon-acts-before-a-charging-skink
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.strike-first-vs-skinks-first-round]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
    second:
      collection: mordheim
      band_id: lizardmen
      profile_id: skink-braves
  duel_context: {charging: [second], active_participant: second}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.wounds: 2, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
