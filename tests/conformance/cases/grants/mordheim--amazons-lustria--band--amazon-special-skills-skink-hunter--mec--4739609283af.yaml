# Real recipient (2026-11-16): the band's printed Eagle Warrior is built from the band package with the
# Skink Hunter entry selected through special_rule_ids (characteristics overridden only to keep Initiative
# 2 below the Skink's), so the band's KB row supplies the first-round priority against the charging Skink;
# without it the Skink's die would come first.  The mace is not on this profile's equipment list, so the
# build keeps the default dagger, which changes nothing this tape decides.  The printed Amazon also
# carries the band-wide Isolationists reroll against Lizardmen, so her missed first-round hit takes one
# declared reroll (also a 1) before the Skink's die: the order of the dice is the evidence.
- audit_id: rule/mordheim/amazons-lustria/band--amazon-special-skills-skink-hunter/mechanic.strike-first-vs-skinks-first-round
  id: the-printed-eagle-warrior-with-skink-hunter-strikes-first
  fighters:
    first:
      collection: mordheim
      band_id: amazons-lustria
      profile_id: eagle-warriors
      special_rule_ids: [band--amazon-special-skills-skink-hunter]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
    second:
      collection: mordheim
      band_id: lizardmen
      profile_id: skink-braves
  duel_context: {charging: [second], active_participant: second}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.first.attack.0.hit.reroll, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.wounds: 2, state.second.wounds: 1}
  expect_events: [{kind: roll, key: round.0.first.attack.0.hit, sides: 6, value: 1}, {kind: roll, key: round.0.first.attack.0.hit.reroll, sides: 6, value: 1}, {kind: roll, key: round.0.second.attack.0.hit, sides: 6, value: 1}]
  expect_final: {rounds_executed: 1, termination_reason: horizon}

- audit_id: rule/mordheim/amazons-lustria/band--amazon-special-skills-skink-hunter/mechanic.strike-first-vs-skinks-first-round
  id: a-published-member-of-the-band-table-is-selectable
  # The printed permission: a Heroine may use this table, so the band's published member
  # must be a legal selection and the engagement must start. The declared identity is the
  # band's own rule id, not a fabricated catalogue skill id. Both fighters declare zero
  # attacks, so the observation is the selection itself; the member's mechanic keeps its own
  # origin.
  fighters:
    first:
      collection: mordheim
      band_id: amazons-lustria
      profile_id: eagle-warriors
      special_rule_ids: [band--amazon-special-skills-skink-hunter]
    second:
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  initial_state: {first: {attacks: 0}, second: {attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  expect_initial: {first.attacks: 0, second.attacks: 0}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

- audit_id: rule/mordheim/amazons-lustria/band--amazon-special-skills-skink-hunter/mechanic.strike-first-vs-skinks-first-round
  id: the-same-member-is-refused-for-a-henchman-the-print-excludes
  # The printed recipient is the Heroine, and this band's register note records the same
  # boundary ("Henchman controls receive no special access"), so the member must be refused
  # for the Henchman. The fragment is the shared availability sentence of the
  # special-rule route.
  fighters:
    first:
      collection: mordheim
      band_id: amazons-lustria
      profile_id: amazon-warriors
      special_rule_ids: [band--amazon-special-skills-skink-hunter]
  expect_error: "special rule is not available to amazons-lustria/amazon-warriors: band--amazon-special-skills-skink-hunter"

- audit_id: rule/mordheim/amazons-lustria/band--amazon-special-skills-skink-hunter/mechanic.strike-first-vs-skinks-first-round
  id: a-special-skill-outside-the-printed-table-is-refused
  # The closure of the same printed access through the list route (skill_ids): a special
  # skill that is not a member of this table is not available to the recipient. This tape is
  # restored deliberately: today its sentence is produced by the empty member list and it
  # would also refuse a real member, which is exactly why the admission tape above exists in
  # the same file - the pair distinguishes a correct implementation from one that refuses
  # everything. Its provenance is recorded, not hidden.
  fighters:
    first:
      collection: mordheim
      band_id: amazons-lustria
      profile_id: serpent-priestess
      skill_ids: [skill.monster-slayer]
      main_weapon_id: weapon.sword
  expect_error: "skills are not available to amazons-lustria/serpent-priestess: ['skill.monster-slayer']"

- audit_id: rule/mordheim/amazons-lustria/band--amazon-special-skills-skink-hunter/mechanic.strike-first-vs-skinks-first-round
  id: a-member-of-another-bands-table-is-refused
  # The other direction of the same table boundary: the printed permission opens THIS band's table,
  # so another band's published member is not selectable here. The declared-selection route resolves
  # the id against this band's own package rows and answers with the band-level availability sentence.
  fighters:
    first:
      collection: mordheim
      band_id: amazons-lustria
      profile_id: eagle-warriors
      special_rule_ids: [band--cursed-cavalcade-special-skills-torturer]
  expect_error: "special rule is not available to amazons-lustria: band--cursed-cavalcade-special-skills-torturer"
