# Printed text (grade-2b.yaml, Warrior-Priest of Sigmar / Symbol of Unity): "Enemy warriors from Witch
# Hunters, Sisters of Sigmar or mercenary warbands except Marienburg/Middenheim, within 3 inches of the
# Priest, suffer -1 on all rolls to hit when attacking a warrior within 3 inches of him."  The shooting
# half is excluded; in the duel the warrior within 3" is the Priest himself.  The grant is selectable
# (special_skill_rule_ids); the execution entry carries the tag mechanic.sigmar-symbol-of-unity, read
# by packages/python/combat-engine/mordheim_combat/modular/contexts.py (~588-598): a melee attacker
# tagged band.witch-hunters / band.sisters-of-sigmar, or warband-group.human-mercenary without
# mercenary-origin.marienburg / middenheim, takes -1 to hit the tagged defender.  A hand-built
# mercenary declares its origin with trait_overrides mercenary_origin (compiler.py ~1201-1209).  The
# model is the authored mechanics file cases/mechanics/mechanic.sigmar-symbol-of-unity.yaml.
#
# Hireling family model (P0, 2026-11-17).  The recipient is the printed Warrior-Priest compiled through
# the hireling route (hirelings.hired-sword.2b / hireling.hired-sword.warrior-priest-of-sigmar-miracle-workers)
# with the fixture facts (WS3 S3 T3 W2 I5 A1; the printed Ld8 stays); his omitted main weapon is the
# kit's ceremonial dagger and he contributes no swing (initial_state).  The attacker is hand-built
# (WS3 S3 T3 W3 I2 A1 Ld7, mace), charges and declares its mercenary origin.  The mark is selected
# with special_rule_ids; the unselected control is the same profile without it; the refusal selects
# the mark on the grade-1b Bard.  Dice: WS3 against WS3 hits on 4+ (5+ under the -1), S3 against T3
# wounds on 4+; the Priest wears no armour.
# Semantic note: the Witch Hunters / Sisters of Sigmar face reads a band build's tag and is not
#   evidenced here (the mechanics model does not either); the mercenary face is the one authored.

# A Reikland mercenary within reach of the Priest suffers the -1: the plain 4 becomes 5 and the four
# misses.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.warrior-priest-of-sigmar-miracle-workers.skill.symbol-of-unity/mechanic.sigmar-symbol-of-unity
  id: a-reikland-mercenary-needs-five-to-hit-the-priest
  fighters:
    first:
      &recipient
      collection: mordheim
      band_id: hirelings.hired-sword.2b
      profile_id: hireling.hired-sword.warrior-priest-of-sigmar-miracle-workers
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
      special_rule_ids: [hireling.hired-sword.warrior-priest-of-sigmar-miracle-workers.skill.symbol-of-unity]
    second:
      &reiklander
      main_weapon_id: weapon.mace
      trait_overrides: {mercenary_origin: reikland}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  initial_state: {first: {attacks: 0}}
  duel_context: &opponent-charges {charging: [second], active_participant: second}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.attack.0.hit, value: 4}
  expect_rounds:
    0: {attacks.0.hit_target: 5, attacks.0.hit: false, attacks.0.damage: 0, state.first.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

