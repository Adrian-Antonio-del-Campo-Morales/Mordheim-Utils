#
# AUTHORED: 7 scenarios cover the printed chart: an injury total of 5 leaves the bearer Stunned where
# the ordinary table takes the same total Out of Action, a total of 3 leaves it Knocked Down where the
# ordinary table merely Stuns, a total of 6 still takes the bearer out of action, and the control scenarios
# show the same totals on a bearer without the skill.  A total of 4 is Stunned on both tables, so it does
# not discriminate and is not used.

# --- Authored scenarios ---
# Derived from the printed sentence and the recorded chart (1-3 knocked down, 4-5 stunned, 6 out of action);
# no engine output was consulted.  The bearer starts the duel at one wound and the attacker's weapon adds
# no injury modifier, so the declared injury die is the injury total itself; the two total-three scenarios
# use a plain axe because the mace's Concussion would turn the knocked-down result into Stunned and hide the
# chart difference.  The attacker's higher Initiative and the uncharged context let it strike first, and the
# bearer declares no attack of its own because every scenario leaves it Stunned, Knocked Down or Out of
# Action in this round.
- audit_id: rule/trollheim/chaos-streets-dwarf-treasure-hunters/band--dwarf-special-skills-true-grit/skill.tough-as-steel
  id: an-injury-total-of-five-stuns-instead-of-removing-the-bearer
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: &tg-attacker {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      skill_ids: [skill.tough-as-steel]
      characteristics: &tg-bearer {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 2, attacks: 1}
  duel_context: &tg-context {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls: &tg-five
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 5}
    - {key: round.0.first.attack.0.injury.0, value: 5}
  expect_rounds:
    0: {attacks.0.wounded: True, attacks.0.damage: 1, state.second.wounds: 0, state.second.condition: STUNNED}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

