# The recorded user ruling reads the printed "may" as optional, so zero mutations are allowed;
# the acceptance control is the recipient built with no mutation at all, which must be admitted
# and must resolve its round.
- audit_id: rule/trollheim/trollheim-cult-of-the-possessed/the-possessed--mutations/compiler.possessed-optional-zero-to-two-mutations-at-recruitment
  id: a-possessed-with-no-mutation-is-admitted-at-recruitment
  fighters:
    first:
      collection: trollheim
      band_id: trollheim-cult-of-the-possessed
      profile_id: the-possessed
      main_weapon_id: weapon.natural-attacks
    second:
      main_weapon_id: weapon.natural-attacks
      characteristics: &plain-ws3-s3-t3-w2-i2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    # No charge is declared, so no charged-side Fear test is requested even though the
    # Possessed causes Fear; the round opens with its own attack pool.
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.first.attack.1.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_fighters:
    first.construction_tags: [compiler.mutation-purchase-at-recruitment, compiler.possessed-optional-zero-to-two-mutations-at-recruitment]
  expect_final: {rounds_executed: 1, termination_reason: horizon}

