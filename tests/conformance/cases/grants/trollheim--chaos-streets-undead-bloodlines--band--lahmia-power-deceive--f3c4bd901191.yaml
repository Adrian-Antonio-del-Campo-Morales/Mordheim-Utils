# --- Authored scenarios ---
# One enemy in base contact fails its own-value Leadership test (two sixes against its printed
# seven) after the use is declared: it may not attack this Vampire, and in a duel this Vampire is
# its only possible target, so the tape observes the bar itself.
- audit_id: rule/trollheim/chaos-streets-undead-bloodlines/band--lahmia-power-deceive/mechanic.lahmia-deceive
  id: a-declared-deceive-that-fails-bars-the-enemy-for-the-phase
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.lahmia-deceive]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [], active_participant: first}
  decisions:
    - {key: round.0.second.deceive, value: true}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.deceive.0, value: 6}
    - {key: round.0.second.deceive.1, value: 6}
    - {key: round.0.first.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: false, state.second.charm_attack_blocked: true, state.second.condition: STANDING}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The printed exemptions: "Models immune to Psychology, Undead and Daemons are unaffected", so an
# Undead enemy asks for no test die at all and its own attack is resolved normally.
