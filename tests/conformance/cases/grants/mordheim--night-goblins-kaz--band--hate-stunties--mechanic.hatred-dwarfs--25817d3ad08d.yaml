# The printed clause reaches only its named recipients; this band model is outside them.  The bearer
# is the printed Troll of this band (a stupid monster, not a Night Goblin): its own turn begins with
# the printed Stupidity pair, the charged Dwarf must then take the Fear test the Troll's own printed
# Fear rule forces, and only then do the two printed attack pools resolve, the charging Troll first.
- audit_id: rule/mordheim/night-goblins-kaz/band--hate-stunties/mechanic.hatred-dwarfs
  id: a-model-the-clause-does-not-cover-receives-no-reroll
  fighters:
    first:
      collection: mordheim
      band_id: night-goblins-kaz
      profile_id: troll
      main_weapon_id: weapon.natural-attacks
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 4}
    second:
      main_weapon_id: weapon.natural-attacks
      trait_overrides: {species: dwarf}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  # The Troll's printed optional Vomit Attack is declined; this case is about the absent Hatred.
  decisions:
    - {key: round.0.first.vomit-attack, value: false}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.stupidity.0, value: 1}
    - {key: round.0.first.stupidity.1, value: 1}
    - {key: round.0.second.fear.charged.0, value: 3}
    - {key: round.0.second.fear.charged.1, value: 3}
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 0, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

