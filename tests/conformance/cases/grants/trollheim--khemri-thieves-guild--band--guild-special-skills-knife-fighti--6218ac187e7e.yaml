# --- Authored scenarios ---
# The printed bonus in the hit context: the skill plus the printed knife raises the bearer's Weapon Skill
# against an equal-Weapon-Skill defender, so a declared hit die of three reaches the printed three instead of
# the unaided four.
- audit_id: rule/trollheim/khemri-thieves-guild/band--guild-special-skills-knife-fighting/skill.knife-fighting
  id: the-printed-bonus-lifts-a-declared-three-onto-the-hit-target
  fighters:
    first:
      main_weapon_id: weapon.dagger
      skill_ids: [skill.knife-fighting]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 3}
    - {key: round.0.first.attack.0.wound, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: true, attacks.1.hit: false, state.second.condition: STANDING, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The control: the very same knife in the very same hands without the skill, where the declared three misses
# the printed four - so the hit above is attributable to the printed bonus and to nothing else.
