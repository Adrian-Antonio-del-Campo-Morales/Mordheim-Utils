#   add no round-0 die request of their own - every strike is declared as a natural 1, so no
#   on-hit, wound, save or injury effect can trigger, and a charged model takes no charge bonus.
#   Contrast evidence (sources): the contrast profile dreg binds no rule at all - nothing in that list is a psychology
#   or fear immunity - and no immunity rule of this band names it in applies_to.
#   The Fear test itself is a 2D6 Leadership test, so the variant list above concerns the
