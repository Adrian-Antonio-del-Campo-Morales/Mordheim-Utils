# Clause: psychology-immunity (scope: YES)
# AUTHORED[psychology-immunity]: the printed immunity is read through the one Psychology request this
#   setup can make - the round-0 Fear test of the charged warrior.  In the immune scenario the
#   tape declares no Fear die at all, and the strict tape consumes exactly the declared dice and
#   rejects both an undeclared request and an unused entry, so a test the engine still asked for
#   fails the case instead of passing quietly - the absence is the assertion.
#   In the contrast scenario the non-immune band-mate dreg is charged the same way and its
#   two Leadership dice are declared and pass on 1+1, so the same setup does produce the request
#   when the immunity is absent.
#   The contract's remaining consequences are authored by hand-built fixtures that carry the
#   canonical grants alongside the immunity: the skipped Stupidity test (mechanic.stupidity), the
#   suppressed Frenzy flag (the frenzy flag supplied through initial_state) and the denied Hatred
#   reroll (mechanic.hatred-undead against a hand-built undead opponent, no reroll die declared).
#   REVIEWED still requires manual semantic review.
