# Clause: fanatical-advance--scope--automatic-leadership (scope: YES)
# AUTHORED[fanatical-advance--scope--automatic-leadership]: printed "Any Hero of the Watch with 30
#   experience points becomes a crusader of Law; Knights of Purity automatically pass all Leadership-based
#   tests they are required to take."  The 30-experience trigger is the scope-NO campaign clause; what this
#   clause admits is the promoted Hero's auto-pass, and the promotion is supplied as the contract's own trait
#   `crusader_of_law` (contracts.py TRAIT_TYPES).  3 scenarios: the promoted printed Watch Captain, charged by
#   a Fear-causer, takes no Fear test (no Leadership die declared); the same Captain without the promotion
#   is tested (both dice declared); and the promotion supplied to the henchman Officers - not a Hero of the
#   Watch - is refused with the compiler's own message "crusader_of_law requires a Hero of the Watch".
#
# Clause: fanatical-autopass--scope--automatic-leadership (scope: YES)
# AUTHORED[fanatical-autopass--scope--automatic-leadership]: 2 scenarios take the printed auto-pass onto the
#   Leadership tests a duel round forces on the bearer, in both directions: the charged Knight passes the
#   Fear test with no Leadership die requested at all, and the charging Knight keeps the charge under the
#   same dice.  The bearer is the hand-built fixture carrying the canonical operator directly, which is the
#   device the accepted twins of this mechanic use (carnival-of-chaos nurglings/plague-bearers, black-orcs
#   orc-nuttaz crazy, cult-of-the-possessed darksouls crazed).  The band's own grant is evidenced by the
#   band-route scenarios at the end of this file (the promoted Watch Captain against the unpromoted one),
#   which also cover this clause; the earlier note that the row carried no binding was stale - it binds
#   compiler.knight-of-purity, which the compiler turns into mechanic.automatic-leadership.
#
# Clause: fanatical-advance--scope--campaign-trigger (scope: NO)
# Outside the admitted clause scope; retained for context, not a test TODO.
#
