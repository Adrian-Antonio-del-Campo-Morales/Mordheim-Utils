# --- Authored scenarios ---
# Derived from the printed sentence, the recorded contract and the accepted twins of the same mechanic; no
# engine output was consulted.  The Fear causer opposite the bearer is a hand-built fixture declaring the
# printed trait, and every strike is declared as a natural 1, so a passing round reports nothing but the
# absence of the Fear request.
- audit_id: rule/mordheim/watchmen-mim/band--fanatical/compiler.knight-of-purity
  id: the-charged-knight-of-purity-passes-the-fear-test-without-a-die
  covers: [fanatical-autopass--scope--automatic-leadership]
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.automatic-leadership]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 5}
    second:
      main_weapon_id: weapon.mace
      trait_overrides: {causes_fear: true}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [second], active_participant: second}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.0.first.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.fear_hit_sixes: false, state.first.condition: STANDING, state.first.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

