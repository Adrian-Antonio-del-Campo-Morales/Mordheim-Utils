# The printed Belligerent result.  The canonical supplied condition (condition.fungus-brew-belligerent, which
# catalog/rules/conditions.yaml binds to skill.hatred) is declared on the affected duelist through
# FighterBuild.condition_ids, so the printed first-round Hatred is what the tape reads and no chart operator or
# enemy identity is invented: the declared miss 2 is rerolled, the accepted 4 lands, wounds and removes one
# wound.  A consumer that offers no reroll for the supplied condition fails here.
- audit_id: rule/mordheim/night-goblins-web/shaman--fungus-brew/condition.fungus-brew-belligerent
  id: a-supplied-belligerent-result-rerolls-the-first-round-miss
  fighters:
    first:
      main_weapon_id: weapon.mace
      condition_ids: [condition.fungus-brew-belligerent]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 4, attacks: 1, leadership: 6}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 4}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
  - {key: round.0.first.attack.0.hit, value: 2}
  - {key: round.0.first.attack.0.hit.reroll, value: 4}
  - {key: round.0.first.attack.0.wound, value: 4}
  - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: true, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

