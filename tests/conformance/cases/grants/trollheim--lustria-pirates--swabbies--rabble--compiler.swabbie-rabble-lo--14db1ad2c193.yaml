# Clause: whole--scope--equipment-list-access (scope: YES)
# AUTHORED[whole--scope--equipment-list-access]: 2 scenarios evidence the printed bound "only with items from
# the Swabbie Equipment List" in both directions, from this origin's own published lists.  RECIPIENT: the
# printed Swabbie profile (bands/trollheim/lustria-pirates/profiles.yaml, id swabbies), whose equipment_lists
# declares swabbie-equipment-list and nothing else.  INPUT: the fixture's carried-item channel
# (owned_item_ids), the same channel the sibling kit refusals use.  REFUSAL: a Swabbie carrying crossbow - a
# row the band's Pirate Equipment List offers to its heroes, crew, gunners and boatswains and its Swabbie
# Equipment List does not - is refused at construction with the shared stage's per-item offered-set sentence
# '"<item>" is not on any equipment list of <band>/<profile>.'.  ADMISSION: the same profile carrying bow,
# the row only the Swabbie Equipment List offers (no Pirate-shaped list under this band carries a bow),
# constructs and the engagement reaches its declared checkpoint.  The two rows are complementary, so the pair
# distinguishes the printed bound from an unrestricted band-wide list.  The scope-NO casting bar is excluded
