# The operator control: a fixture carrying the unrestricted Herb Lore is offered the request in the same
# engaged phase and a four restores the wound - the Ranger's withheld request is her carrier's in-combat gate.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.kislev-ranger.rule.herb-lore/mechanic.herb-lore-outside-combat
  id: the-unrestricted-herb-lore-is-offered-in-the-same-engaged-phase
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.herb-lore]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 7}
    second:
      <<: *opponent
  initial_state: {first: {wounds: 1}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.herb-lore, value: true}
  rolls:
    - {key: round.0.first.herb-lore, value: 4}
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.wounds: 2, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The printed skill is the Ranger's own; selecting it on another hireling is refused.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.kislev-ranger.rule.herb-lore/mechanic.herb-lore-outside-combat
  id: the-rule-is-refused-on-a-hireling-outside-its-printed-profile
  fighters:
    first:
      collection: mordheim
      band_id: hirelings.hired-sword.1b
      profile_id: hireling.hired-sword.bard
      main_weapon_id: weapon.dagger
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
      special_rule_ids: [hireling.hired-sword.kislev-ranger.rule.herb-lore]
    second:
      <<: *opponent
  expect_error: "special rule is not available to hirelings.hired-sword.1b"

# The healing face itself, authored 2026-11-18 on the printed Ranger.  An executed round CAN be
# unengaged: the Danse Macabre control branch (modular/rounds.py:418-428) cancels a round-0 charge on
# a failed Leadership test and sets `engaged=False` immediately BEFORE the recovery step at
# rounds.py:430, so the earlier note that resolve_fear is the only in-round producer of a cancelled
# charge was wrong.  The printed Ranger with Herb Lore selected charges while supplied as controlled,
# fails the Leadership test (6+6 against her printed Leadership 7) and is therefore no longer in close
# combat when her recovery comes round: the healing request IS offered and the declared four restores
# the lost Wound - "she may heal herself by one Wound on a 4+ in the Recovery phase", the half her
# carrier's "she cannot heal while in close combat" withholds in the three tapes above.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.kislev-ranger.rule.herb-lore/mechanic.herb-lore-outside-combat
  id: the-unengaged-kislev-ranger-heals-herself-by-one-wound-on-a-four
  fighters:
    first:
      <<: *recipient
      condition_ids: [condition.danse-macabre-controlled]
    second:
      <<: *opponent
  initial_state: {first: {wounds: 1}}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.herb-lore, value: true}
  rolls:
    - {key: round.0.first.danse-macabre.0, value: 6}
    - {key: round.0.first.danse-macabre.1, value: 6}
    - {key: round.0.first.herb-lore, value: 4}
  expect_rounds:
    0: {state.first.wounds: 2, state.engaged: false}
  # The round resolves in full and the harness then ends the duel because it is no longer engaged.
  expect_final: {rounds_executed: 1, termination_reason: disengaged}
