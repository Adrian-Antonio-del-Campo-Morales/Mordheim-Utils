# --- Authored scenarios ---
# Hireling family model (README, Hireling recipients): the recipient is the printed Kislev Ranger compiled
# through the hireling route (hirelings.hired-sword.1b / hireling.hired-sword.kislev-ranger); Herb Lore is
# her selectable special skill, selected with special_rule_ids; fixture characteristics WS3 S3 T3 W2 I5 A1
# (printed Ld7 stays); the kit's sword is named (its bow is out of scope).  She starts at one of her two
# wounds (initial_state) so a healing request would have a wound to restore.  The opponent is hand-built
# (WS3 S3 T3 W3 I2 A1 Ld7, mace); neither charges, so the duel is engaged and both swings are natural 1s.
# Her other printed rules (Heart Strike, Hunter's Cloak, Loner, Seeker, Animal Call) are excluded and add no
# request.

# Engaged at a lost wound, the Ranger with Herb Lore is offered no healing: the tape holds only the swings.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.kislev-ranger.rule.herb-lore/mechanic.herb-lore-outside-combat
  id: the-engaged-kislev-ranger-with-herb-lore-is-never-offered-the-healing-request
  fighters:
    first:
      &recipient
      collection: mordheim
      band_id: hirelings.hired-sword.1b
      profile_id: hireling.hired-sword.kislev-ranger
      main_weapon_id: weapon.sword
      special_rule_ids: [hireling.hired-sword.kislev-ranger.rule.herb-lore]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      &opponent
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  initial_state: {first: {wounds: 1}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.wounds: 1, state.second.wounds: 3, state.engaged: true}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

