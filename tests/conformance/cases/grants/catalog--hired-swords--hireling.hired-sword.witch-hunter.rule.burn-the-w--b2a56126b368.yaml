# Hireling family model (P0, 2026-11-17).  The recipient is the printed hireling profile, compiled
# through the hireling route (band_id hirelings.<kind>.<grade>, profile_id hireling.<kind>.<slug>); its
# printed rule is granted by the profile itself, so the build selects nothing.  Its physical
# characteristics are supplied as fixture facts (WS3 S3 T3 W2 I5 A1) so every die threshold is fixed,
# while its printed Leadership stays in place; an omitted main weapon is the printed kit's own.
# The opponent is hand-built (WS3 S3 T3 W3 I2 A1 Ld7, mace) and declares the one fact the rule reads
# (causes_fear, or the hated kind; here trait_overrides: {spellcaster: true|false}).  The control is a plain hireling without any psychology rule - the
# grade-1b Bard - compiled through the same route with the same fixture, so the request that the rule
# removes (or the reroll it grants) is shown present without it.  The refusal selects the printed rule
# on that control through special_rule_ids: a profile-granted rule is not available elsewhere.
# Dice: every attack is declared as a natural 1 unless the strike is the observable, so no wound, save
# or injury die is requested; a 2D6 Fear test of 5+4 fails Ld7 and 3+3 passes it.

# The recipient charges; a natural 2 misses WS3, the printed Hatred re-roll is requested, 4 hits and
# S3 wounds T3 on 4+.  The opponent is declared a spellcaster, the enemy the print hates (ruling B3).
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.witch-hunter.rule.burn-the-witch/mechanic.burn-the-witch
  id: a-first-round-miss-by-the-witch-hunter-is-rerolled-against-an-enemy-it-hates
  fighters:
    first:
      &recipient
      collection: mordheim
      band_id: hirelings.hired-sword.1b
      profile_id: hireling.hired-sword.witch-hunter
      main_weapon_id: weapon.sword
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      trait_overrides: {spellcaster: true}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.first.attack.0.hit.reroll, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.wounds: 2, state.first.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# Hatred re-rolls only in the first round of a combat: the second-round miss is not offered a re-roll.
# The opponent is declared a spellcaster, so the first-round re-roll is owed (ruling B3).
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.witch-hunter.rule.burn-the-witch/mechanic.burn-the-witch
  id: the-reroll-belongs-to-the-first-round-so-a-later-miss-stands
  fighters:
    first:
      <<: *recipient
    second:
      main_weapon_id: weapon.mace
      trait_overrides: {spellcaster: true}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 2
  rolls:
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.first.attack.0.hit.reroll, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.1.first.attack.0.hit, value: 2}
    - {key: round.1.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.wounds: 2}
    1: {state.second.wounds: 2}
  expect_final: {rounds_executed: 2, termination_reason: horizon}

# The printed boundary: the print hates enemy spellcasters only, so the same first-round miss against an
# opponent declared not to be a spellcaster is not offered a re-roll; the strict tape proves it by the
# absence of the re-roll die, and the miss leaves the opponent unwounded.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.witch-hunter.rule.burn-the-witch/mechanic.burn-the-witch
  id: the-same-first-round-miss-stands-against-a-non-spellcaster
  fighters:
    first:
      <<: *recipient
    second:
      main_weapon_id: weapon.mace
      trait_overrides: {spellcaster: false}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.wounds: 3, attacks.0.hit: false}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

