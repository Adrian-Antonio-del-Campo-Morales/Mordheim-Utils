#
# AUTHORED: 6 scenarios cover the printed 6+ Scaly Skin save on the real
#   attack route (saved on 6, wounded on 5), its per-profile value against another Lizardman of
#   the band that keeps its own save, the 6+ Strength floor, and the combination with light
#   armour, which the profile's own equipment list does offer.
# Boundary of this ID's admitted clause: the band's printed Scaly Skin rule also excepts
#   Hardened Leather ("Scaly Skin may be combined with other armour, except Hardened Leather
#   provides no additional bonus", bands/trollheim/lustria-lizardmen/special-rules.yaml,
#   Scaly Skin, p.53).  That term is not an admitted clause of this identity - the register
#   admits `stacks-with-armour-but-not-hardened-leather` under the kroxigor identities
#   rule/trollheim/lustria-lizardmen/kroxigor--scaly-skin-4plus/trait.natural-armour-save,
#   -stacks and -worst-save, and under the band-level identity - so no scenario is authored
#   or claimed for it here.  A skink-priest wearing armour.toughened-leathers is a build the
#   printed lists refuse (its equipment list offers no hardened or toughened leather, and the
#   Trading Post's common toughened_leathers entry is a post-battle acquisition, not a printed
#   access list the executor resolves), so that fixture is not declarable.  The kroxigor
#   identities author the checkable half of the term - the printed armour prohibition, as a
#   construction refusal - and record the leather's own save-cancellation as unrepresented
#   there.  The admitted clause of this ID is the printed 5+ Scaly Skin save, fully
#   authored below.
# --- Authored scenarios ---
# Derived from the printed rule, the recorded semantic contract of each clause
# and the band package; no engine output was consulted.  The duel is uncharged
# (`charging: []`) and the attacker holds the higher Initiative, so the only
# Strength modifier reaching the defender's save is the attacker's own Strength
# and the attacker's pool always resolves first.  A recipient that survives the
# incoming attack still strikes back, so its own attack is scripted as a miss.

