# Hireling family model (README, Hireling recipients): the recipient is the printed Grand Master Ippan Shu
# compiled through the hireling route (hirelings.dramatis-personae.1c / hireling.dramatis.grand-master-ippan-shu);
# Energy Focus is his selectable special skill (eligibility: the profile itself), selected with
# special_rule_ids and its sacrifice declared as energy_focus_attacks; fixture characteristics WS3 S3 T3 W2
# I5 with Attacks 2 so a sacrifice leaves a pool (printed Ld10 stays); he fights bare-handed (weapon.fist).
# Printed text: "If fighting unarmed, the Hero may choose to reduce his Attacks by -1 and thus gain +1
# Strength in close combat. The monk may sacrifice any number of attacks this way."  Mirrors
# cases/mechanics/mechanic.energy-focus.yaml: the pool is A2 + 1 (Bare-Handed) = 3; one sacrifice leaves two
# attacks at Strength 4, which wounds Toughness 3 on a 3+ where Strength 3 needs a 4+, so the declared wound
# face of three separates the exchange from its control while the tape length pins the pool size.  The
# opponent is hand-built (WS3 S3 T3 W3 I2 A1, mace, no armour) with its attacks silenced; every hit die is a
# six.

# One attack sacrificed: two hit dice, both threes wound at the exchanged Strength 4.
- audit_id: rule/catalog/dramatis-personae/hireling.dramatis.grand-master-ippan-shu.skill.energy-focus/mechanic.energy-focus
  id: ippan-shu-with-energy-focus-trades-an-attack-for-strength
  fighters:
    first:
      collection: mordheim
      band_id: hirelings.dramatis-personae.1c
      profile_id: hireling.dramatis.grand-master-ippan-shu
      special_rule_ids: [hireling.dramatis.grand-master-ippan-shu.skill.energy-focus]
      main_weapon_id: weapon.fist
      energy_focus_attacks: 1
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 2}
    second:
      &opponent
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 6}
    - {key: round.0.first.attack.1.hit, value: 6}
    - {key: round.0.first.attack.0.wound, value: 3}
    - {key: round.0.first.attack.1.wound, value: 3}
  expect_rounds:
    0: {attacks.0.damage: 1, attacks.1.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

