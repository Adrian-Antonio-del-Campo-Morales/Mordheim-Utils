# Rule (grade-2a.yaml, hireling.dramatis.the-dark-jester-in-mordheim.rule.confound-and-confuse, grant
# profile): "Chooses a source combat trick each combat turn" - binding mechanic.confound-and-confuse.
# Hireling family model (README, Hireling recipients): the real Jester through the hireling route
# (hirelings.dramatis-personae.2a) with the fixture facts (WS3 S3 T3 W2 I5 A1; printed Ld7 stays) and
# the printed kit's default club; nothing is selected.  The opponent is hand-built (WS3 S3 T3 W3 I2 A1
# Ld7, mace, no armour).  The control is the grade-1b Bard.  Protocol
# (tests/construction/test_dark_jester_contracts.py): each round the chooser offers
# round.<i>.<side>.jester-trick.dodge_trick_active, .banter_trick_active, .trip_trick_active in that
# order and stops at the first accepted; Babbling Banter gives the Jester +1 to hit and his opponent -1;
# the Trip is offered after a hit as round.<i>.<side>.attack.<n>.trip.hit with its die .trip-roll.
# Dice: WS3 against WS3 hits on 4+ (3+ and 5+ under Banter); S3 wounds T3 on 4+; the uncharged duel
# orders the blows by Initiative (5 before 2).

# Banter accepted (the trip slot is not offered once a trick is taken): the Jester's 3 hits the shifted
# 3+ and wounds; the opponent's 4 misses the shifted 5+.
- audit_id: rule/catalog/dramatis-personae/hireling.dramatis.the-dark-jester-in-mordheim.rule.confound-and-confuse/confound-and-confuse
  id: the-chosen-babbling-banter-shifts-both-hit-targets
  fighters:
    first:
      &jester-confound-recipient
      collection: mordheim
      band_id: hirelings.dramatis-personae.2a
      profile_id: hireling.dramatis.the-dark-jester-in-mordheim
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      &jester-confound-opponent
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 3}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 4}
  decisions:
    - {key: round.0.first.jester-trick.dodge_trick_active, value: false}
    - {key: round.0.first.jester-trick.banter_trick_active, value: true}
  expect_rounds:
    0: {attacks.0.hit_target: 3, attacks.0.hit: True, attacks.0.wounded: True, attacks.1.hit_target: 5, attacks.1.hit: False, state.second.wounds: 2, state.first.wounds: 2, state.first.banter_trick_active: True}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# Trip accepted: the targets stay ordinary and the trip offer follows the Jester's hit; the 5 knocks the
# opponent down and no wound die is rolled.
- audit_id: rule/catalog/dramatis-personae/hireling.dramatis.the-dark-jester-in-mordheim.rule.confound-and-confuse/confound-and-confuse
  id: the-chosen-trip-opens-the-trip-offer-after-the-hit
  fighters:
    first: *jester-confound-recipient
    second: *jester-confound-opponent
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.trip-roll, value: 5}
  decisions:
    - {key: round.0.first.jester-trick.dodge_trick_active, value: false}
    - {key: round.0.first.jester-trick.banter_trick_active, value: false}
    - {key: round.0.first.jester-trick.trip_trick_active, value: true}
    - {key: round.0.first.attack.0.trip.hit, value: true}
  expect_rounds:
    0: {attacks.0.hit_target: 4, attacks.0.wounded: False, state.second.condition: KNOCKED_DOWN, state.second.wounds: 3, state.first.trip_trick_active: True}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

