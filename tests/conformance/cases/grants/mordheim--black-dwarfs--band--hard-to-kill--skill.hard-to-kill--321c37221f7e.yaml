- audit_id: rule/mordheim/black-dwarfs/band--hard-to-kill/skill.hard-to-kill
  id: the-excluded-informer-keeps-the-ordinary-chart-on-a-five
  covers: [bearer-scope]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 10, strength: 8, toughness: 3, wounds: 3, initiative: 10, attacks: 1}
    # The excluded recipient: the printed scope ("excluded_profile_ids": ["informers"]) is the reason
    # the rule does not apply, so the control declares no rule at all - the informer keeps the ordinary
    # chart because Hard to Kill never reached it. Declaring the id here would both contradict the
    # clause's own exclusion and be refused as an unavailable recipient.
    second: {collection: mordheim, band_id: black-dwarfs, profile_id: informers}
  initial_state: {second: {wounds: 1, attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
