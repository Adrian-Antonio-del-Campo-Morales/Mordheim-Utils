# --- Authored scenarios ---
# The catalog warband skill list prints the canonical Sign of Sigmar wording: the
# defender's skill reduces an Undead or Possessed attacker's first-round pool, and
# Daemons are excluded.
# The Undead attacker has two Attacks and the defender carries the Sign, so the first
# round reduces its pool to one: an unreduced pool would have requested the second die.
- audit_id: rule/catalog/warband/skill.sigmar-s-sign/skill.sigmar-s-sign
  id: the-undead-attacker-loses-one-attack-in-the-first-round
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [skill.sigmar-s-sign]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      trait_overrides: {creature_kind: undead}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 2}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 4}
    - {key: round.0.second.attack.0.wound, value: 4}
  expect_rounds:
    0: {attacks.0.hit: False, attacks.1.wounded: True, state.first.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# The printed exception: a Daemon attacker keeps its whole pool, so both of its attacks
# are resolved and the tape carries both attack dice.
- audit_id: rule/catalog/warband/skill.sigmar-s-sign/skill.sigmar-s-sign
  id: a-daemon-attacker-keeps-its-attacks
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [skill.sigmar-s-sign]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      trait_overrides: {creature_kind: daemon}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 2}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.0.second.attack.1.hit, value: 1}
  expect_rounds:
    0: {attacks.1.hit: False, attacks.2.hit: False, state.first.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# The printed floor: an Undead attacker whose pool is a single attack keeps that attack
# ("down to a minimum of 1"), so its declared die is still requested and can wound; a
# reduction that removed the attack would leave the second fighter's die unrequested.
- audit_id: rule/catalog/warband/skill.sigmar-s-sign/skill.sigmar-s-sign
  id: the-printed-floor-keeps-the-attack-of-a-single-attack-undead-attacker
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [skill.sigmar-s-sign]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      trait_overrides: {creature_kind: undead}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 4}
    - {key: round.0.second.attack.0.wound, value: 4}
  expect_rounds:
    0: {attacks.0.hit: True, attacks.1.hit: True, state.first.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
