# --- Authored scenarios ---
# Family model (charge-turn missed-hit reroll, skill.infallible), taken from the printed rule, the
# recorded contract and the accepted model of cases/mechanics/skill.infallible.yaml.  The bearer is the
# band's printed Blood Dragon Vampire, built from its band profile so this record's own band power is
# what the scenario exercises; the source declares that power selectable and names blood-dragon-vampire
# as its only recipient, so the scenario states the chosen power explicitly.  Its physical
# characteristics are supplied as fixture facts (WS3 S3 T3 W2 I5 A1) so the dice thresholds and the
# strike order are fixed, and its printed Leadership stays in place.  The opponent is a hand-built
# fixture with one attack.  A miss (a natural 2 against WS3) is taken again on a 4+ and wounds on a 4+,
# so the reroll is what the tape shows; where the trigger is absent, or the power is not carried, the
# strict tape holds no reroll key and the miss stands.

