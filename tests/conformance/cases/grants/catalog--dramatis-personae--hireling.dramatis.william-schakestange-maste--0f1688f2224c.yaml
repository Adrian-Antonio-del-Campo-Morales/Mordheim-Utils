# --- Authored scenarios ---
# The printed Songster acts on others: "Nearby friendly models may reroll failed Leadership tests
# with source +1 modifier".  William is therefore supplied as a nearby participant of the
# recipient's own side, compiled through the hireling route (hirelings.dramatis-personae.2a /
# hireling.dramatis.william-schakestange-master-bard) with the fixture facts (WS3 S3 T3 W2 I5 A1;
# his printed Ld8 stays) and the kit dagger declared as his main weapon to leave the rapier's own
# behaviour out; as a nearby provider he is never charged and strikes no blow, so his printed
# starting skills (Jump-Up, Dodge, Lightning Reflexes) request nothing.  The recipient is hand-built
# (WS3 S3 T3 W2 I2 A1 Ld6, mace) and the enemy is a hand-built fear-causer that charges it, so the
# test under evidence is the recipient's charged Fear test: 6+6 fails Ld6, the declared choice takes
# the one offered reroll, and a reroll of 3+4 = 7 passes only at the printed +1 (Ld6+1).  Every
# declared attack is a natural 1, a miss.  The canonical radius of the shared mechanic.songster
# binding is the Sea Ghosts print's six inches; the beyond-radius scenario stands one inch past it.

# 6+6 fails Ld6; the declared reroll of 3+4 = 7 passes only at the printed +1, so the recipient's
# hits are not clamped to sixes.
- audit_id: rule/catalog/dramatis-personae/hireling.dramatis.william-schakestange-master-bard.rule.songster/mechanic.songster
  id: a-friendly-warrior-beside-william-rerolls-the-failed-fear-test-at-plus-one
  fighters:
    first:
      main_weapon_id: weapon.mace
      trait_overrides: {causes_fear: true}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 6}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 6}
  duel_context:
    charging: [first]
    active_participant: first
    nearby:
      - participant_id: william
        side_id: second
        condition: standing
        fighter:
          collection: mordheim
          band_id: hirelings.dramatis-personae.2a
          profile_id: hireling.dramatis.william-schakestange-master-bard
          main_weapon_id: weapon.dagger
          characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    distances:
      - [second, william, 4]
  maximum_rounds: 1
  decisions:
    - {key: round.0.second.fear.charged.reroll, value: true}
  rolls:
    - {key: round.0.second.fear.charged.0, value: 6}
    - {key: round.0.second.fear.charged.1, value: 6}
    - {key: round.0.second.fear.charged.reroll.0, value: 3}
    - {key: round.0.second.fear.charged.reroll.1, value: 4}
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.fear_hit_sixes: false}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

