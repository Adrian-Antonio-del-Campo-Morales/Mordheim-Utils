# Preserve audit_id when filling this file.
# Governing rulings: docs/decisions/design-rulings.md
#
# Clause: four-plus-unmodifiable-save (scope: YES)
# AUTHORED[four-plus-unmodifiable-save]: 2 scenarios evidence the bearer's printed 4+ unmodifiable
#   save against all attacks: it holds on a 4 with no damage taken and fails one face below, the
#   wound then landing.  The printed incompatibility with Dodge and Step Aside is a construction
#   restriction of the shared eligibility module ("Ethereal cannot be combined with Dodge or Step
#   Aside") and is not asserted here, because the duel runner consumes no such refusal.
#
# Clause: magical-attacks-bypass (scope: YES)
# AUTHORED[magical-attacks-bypass]: 2 scenarios evidence the printed exception: a declared magical
#   attack and a Gromril weapon each reach the bearer with no special save face requested at all,
#   which the strict dice tape itself proves.  Ithilmar and silver bullets are the remaining
#   printed members of the same list; they are read by the same consumer line as Gromril and are
#   recorded here as unasserted members rather than claimed.
#
# Clause: item-costs-and-ownership (scope: NO)
# Outside the admitted clause scope; retained for context, not a test TODO.
#
# Clause: terrain-and-leadership (scope: NO)
# Outside the admitted clause scope; retained for context, not a test TODO.

# --- Authored scenarios ---
# The bearer is the band's printed Screaming Ghosts profile, which carries the band's Ethereal
# grant; the fixture's characteristics are hand-built facts (the profile is never read for them
# here) and the bearer contributes no attacks, so the incoming mace swing is the only one.
#
# The save holds on the printed 4: the wound is prevented and the bearer keeps its wounds.
- audit_id: rule/mordheim/ghost-pirates-sar/band--ethereal/mechanic.ghost-pirate-ethereal
  id: the-ethereal-save-holds-on-four
  covers: [four-plus-unmodifiable-save]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 7}
    second:
      collection: mordheim
      band_id: ghost-pirates-sar
      profile_id: screaming-ghosts
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 7}
  initial_state:
    second: {attacks: 0}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.fear.charge.0, value: 1}
    - {key: round.0.first.fear.charge.1, value: 1}
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.special.ward, value: 4}
  expect_rounds:
    0: {attacks.0.saved: true, attacks.0.damage: 0, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
