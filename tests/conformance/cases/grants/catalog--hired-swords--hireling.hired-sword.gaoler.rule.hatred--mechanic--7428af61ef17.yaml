# Hireling family model (README, Hireling recipients): the recipient is the printed Gaoler compiled through
# the hireling route (hirelings.hired-sword.1b / hireling.hired-sword.gaoler); its printed Hatred is granted
# by the profile itself, so nothing is selected; fixture characteristics WS3 S3 T3 W2 I5 A1 (printed Ld7
# stays); the omitted main weapon is the printed kit's default.  Printed text: "Hates every member of
# Skaven, Possessed, Beastmen, Carnival of Chaos and Undead warbands, regardless of that member's own
# species."  The hated opponents are compiled band profiles with fixture characteristics (WS3 S3 T3 W3 I2
# A1, printed Ld) and a printed kit weapon; the controls are hand-built (Ld7, mace).  Dice: a natural 2
# misses WS3, the first-round Hatred re-roll (`round.0.first.attack.0.hit.reroll`) of 4 hits, the wound
# roll of 4 wounds T3, and the opponent's W3 keeps the tape off the injury table.  The control is the
# grade-1b Bard, a hireling without any psychology rule; the refusal selects the printed rule on it.

# A Dreg of the Undead warband is human, and hated all the same.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.gaoler.rule.hatred/mechanic.gaoler-hatred
  id: a-first-round-miss-by-the-gaoler-is-rerolled-against-a-member-of-an-undead-warband
  fighters:
    first:
      &recipient
      collection: mordheim
      band_id: hirelings.hired-sword.1b
      profile_id: hireling.hired-sword.gaoler
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      collection: mordheim
      band_id: undead
      profile_id: dregs
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  decisions:
    # The Gaoler's sibling Torturer's Grapple is offered each round; declined here.
    - {key: round.0.first.torturer-grapple, value: false}
  rolls:
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.first.attack.0.hit.reroll, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: True, attacks.0.damage: 1, state.second.wounds: 2, state.first.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

