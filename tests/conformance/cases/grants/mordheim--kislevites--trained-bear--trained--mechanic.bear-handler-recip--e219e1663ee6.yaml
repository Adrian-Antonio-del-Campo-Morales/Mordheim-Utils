#
# AUTHORED: this binding is the bear-side flag of the printed waiver; the Tamer-side flag is the
#   Bear Tamer's own Bear Handler rule and the Leadership lending of the same Trained sentence ("It
#   may use the Bear Tamer's leadership if within 6\" of him") is this rule's sibling
