#   Trained Bear (Leadership 6, two attacks, Fearsome, Large per the 2026-11-18 uniform binding -
#   inert here because the hand-built opponent reads no size fact); the Bear Tamer is a supplied
#   nearby participant with his declared distance.  An automatic pass rolls no stupidity die, so the
#   strict tape declares none.  Dice: 2d6 <= Leadership passes; 3+4=7 fails the bear's own 6.  The
#   charged opponent (Leadership 7) takes the Fear test the bear causes, declared 1+1.

# --- Authored scenarios ---
# The waiver at the printed range: the band's real Bear Tamer four inches away, no stupidity die,
# the charge stands and the bear's attacks resolve.
- audit_id: rule/mordheim/kislevites/trained-bear--trained/mechanic.bear-handler-recipient
  id: a-bear-tamer-within-six-inches-waives-the-trained-bears-stupidity
  fighters:
    first:
      collection: mordheim
      band_id: kislevites
      profile_id: trained-bear
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {first_id: first, second_id: second, charging: [first], active_participant: first,
    distances: [[first, bear-tamer, 4]],
    nearby: [{participant_id: bear-tamer, side_id: first, condition: standing,
              fighter: {collection: mordheim, band_id: kislevites, profile_id: bear-tamer}}]}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.fear.charged.0, value: 1}
    - {key: round.0.second.fear.charged.1, value: 1}
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.1.hit, value: 1}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.stupidity_failed: false, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

