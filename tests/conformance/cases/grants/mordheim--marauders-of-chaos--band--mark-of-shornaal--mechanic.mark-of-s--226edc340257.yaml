# AUTHORED: the printed mark's faces are authored.  (1) the failed 3D6-discard-lowest test, whose
#   declared sixes fail whatever the discard does with them, asserting the engine's own consequence pair
#   (state.second.charm_attack_blocked and state.second.charm_auto_hit); (2) the passed face of the same
