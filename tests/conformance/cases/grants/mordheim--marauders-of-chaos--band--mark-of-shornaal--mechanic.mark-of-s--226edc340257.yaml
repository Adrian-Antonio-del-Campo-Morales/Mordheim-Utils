#   asserts the flags this branch exposes, and the printed consequence - the blocked attacker is hit
#   automatically - only reaches a wound once those request keys are established.

# --- Authored scenarios ---
# Derived from the printed rule and the recorded contract; no engine output was consulted.  The
# marked leader is the owner of the effect and the unmarked enemy is the model that must pass the
# printed test before it may attack; the declared sixes make the test fail whatever the discard rule
# does with them, and the engine's own blocked/auto-hit pair is then read from the state.  Note for
# execution: the automatic hit declares no To-Hit die (the case fails if the engine asks for one); its
# wound die is declared, and the wound/injury continuation is asserted by the scenarios at the end of
# this file.
- audit_id: rule/mordheim/marauders-of-chaos/band--mark-of-shornaal/mechanic.mark-of-shornaal
  id: a-failed-test-blocks-the-attacker-of-the-marked-leader
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.mark-of-shornaal]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 7}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.shornaal.0, value: 6}
    - {key: round.0.second.shornaal.1, value: 6}
    - {key: round.0.second.shornaal.2, value: 6}
    - {key: round.0.first.attack.0.wound, value: 1}
  expect_rounds:
    0: {state.second.charm_attack_blocked: True, state.second.charm_auto_hit: True}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

