#   test - 1+2+3 discards the 1, totals 5 against the enemy's Leadership 7 - with the blocked flag cleared
#   and both sides attacking normally; and (3) the printed once-per-battle term, a two-round tape in which
#   round 1 declares no shornaal die at all, so an engine that asks for the test a second time fails the
#   strict tape.  The register's warning to reject the reversed dice draft is honoured: three dice are
#   declared and the lowest is the one discarded, so the failing total is the sum of the two highest, and
#   the declared sixes make the discard unobservable in that shape so the test cannot pass by accident.
#   Pending: the wound/injury continuation of the automatic hit on the blocked branch.  The record closes on
