# Conformance authoring scaffold; generated comments, manually authored scenarios.
# audit_id: rule/trollheim/chaos-streets-deathbringers/knives--dagger-master/trait.dagger-master
# authoring_status: AUTHORED
# authoring_progress: the admitted whole clause carries three authored scenarios derived from the printed
# sentence and the recorded contract that names the reroll branch (raised for a charging dagger or yambiya
# attack, the printed dagger scope).  The bearer is the band's printed Knives profile with the row
# selected, and the pair differs only in that row and in the declared charge, while the third scenario
# keeps the row and the charge and changes the weapon to a non-dagger one.  REVIEWED still requires manual
# semantic review and execution_status stays UNEXECUTED.
# execution_status: UNEXECUTED (this scaffold has no behavioral result)
#
# Derive inputs and expectations from rule text and accepted rulings.
# Do not derive them from the engine or execute combat during authoring.
# REVIEWED requires semantic review; covers labels alone are insufficient.
# Preserve audit_id when filling this file.
# Governing rulings: docs/decisions/design-rulings.md
#
# AUTHORED: 3 scenarios cover the printed charging-turn reroll and its two printed conditions:
# the same first-round miss lands through the reroll while the bearer charges with a dagger, no reroll die
# is requested at all when the bearer does not charge, and no reroll die is requested for the same charge
# made with a mace because the printed scope is daggers.

# --- Authored scenarios ---
# Derived from the printed sentence and the recorded contract, never from engine output.  The bearer is the
# band's printed Knives profile carrying the row the audit id names; an absence case supplies no qualifying
# grant, so the strict tape holds no reroll key and the same miss stands.

# The charging bearer's dagger miss is offered the granted reroll, which lands and wounds.
- audit_id: rule/trollheim/chaos-streets-deathbringers/knives--dagger-master/trait.dagger-master
  id: a-charging-dagger-miss-is-rerolled
  fighters:
    first:
      collection: trollheim
      band_id: chaos-streets-deathbringers
      profile_id: knives
      main_weapon_id: weapon.dagger
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 7}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.first.attack.0.hit.reroll, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.armour, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# Without the printed charging turn the same dagger miss stands: the strict tape requests no reroll.
