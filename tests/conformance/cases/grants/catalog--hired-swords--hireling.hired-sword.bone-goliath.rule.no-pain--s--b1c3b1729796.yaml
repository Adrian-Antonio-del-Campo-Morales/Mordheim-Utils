# The printed grant belongs to the Bone Goliath's profile; selecting it on another hireling is refused.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.bone-goliath.rule.no-pain/skill.ignore-pain
  id: the-rule-is-refused-on-a-hireling-outside-its-printed-profile
  fighters:
    first: *strong-attacker
    second:
      <<: *control
      special_rule_ids: [hireling.hired-sword.bone-goliath.rule.no-pain]
  expect_error: "special rule is not available to hirelings.hired-sword.1b"
