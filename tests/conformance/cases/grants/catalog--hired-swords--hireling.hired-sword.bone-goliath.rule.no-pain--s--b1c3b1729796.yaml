#
# AUTHORED: the printed rule ("Treats Stunned as Knocked Down") is a profile grant of skill.ignore-pain,
#   whose contract is the Injury-table conversion Stunned -> Knocked Down
#   (packages/python/combat-engine/mordheim_combat/phases.py injury_condition, ignore_pain).  The
#   Goliath's sibling Undead Construct (mechanic.undead-construct, modular/attacks.py) rolls a D6 for
#   each Injury result after the table and ignores the result on 4+, so No Pain only shows when that
#   die fails: the tape declares the construct die (round.0.first.attack.0.injury.0.undead-construct)
#   as a 2.  The profile carries no Incorporeal-style injury profile, so the Poltergeist
#   `covered.elsewhere` precedent does not apply: a real face exists.
#
# Hireling family model (P0, 2026-11-17) in the Cairn Wraith No Pain shape.  The recipient is the
# printed profile compiled through the hireling route (hirelings.hired-sword.1c /
# hireling.hired-sword.bone-goliath) with the fixture characteristics (WS3 S3 T3 I5 A1) and wounds 1 so
# the first wound reaches the Injury table; it contributes no attack of its own (initial_state).  Its
# innate natural attacks have no parry, it wears no armour, it is Large (grapple-relevant only), Undead,
# immune to psychology and poison, and its Fear tests only a charging attacker; nobody charges.  The
# attacker is the stronger hand-built fixture (WS10 S8 I10, mace): 3+ to hit, 2+ to wound with no
# critical face.  The control is the grade-1b Bard (dagger; kit armour owned, not worn) with the same
# fixture, which has no construct die; the refusal selects the printed rule on the Bard.

# --- Authored scenarios ---

- audit_id: rule/catalog/hired-swords/hireling.hired-sword.bone-goliath.rule.no-pain/skill.ignore-pain
  id: a-stunned-result-the-construct-roll-does-not-ignore-leaves-the-bone-goliath-knocked-down
  fighters:
    first:
      &strong-attacker
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 10, strength: 8, toughness: 3, wounds: 3, initiative: 10, attacks: 1}
    second:
      &recipient
      collection: mordheim
      band_id: hirelings.hired-sword.1c
      profile_id: hireling.hired-sword.bone-goliath
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 5, attacks: 1}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 5}
    # 3 is Stunned on the printed table.
    - {key: round.0.first.attack.0.injury.0, value: 3}
    # Undead Construct (printed sibling rule): the D6 of 2 does not ignore the result.
    - {key: round.0.first.attack.0.injury.0.undead-construct, value: 2}
  expect_rounds:
    0: {state.second.wounds: 0, state.second.condition: KNOCKED_DOWN}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# No Pain reads only the Stunned face: an Out of Action result the construct roll does not ignore removes it.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.bone-goliath.rule.no-pain/skill.ignore-pain
  id: an-out-of-action-result-the-construct-roll-does-not-ignore-removes-the-bone-goliath
  fighters:
    first: *strong-attacker
    second: *recipient
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 5}
    - {key: round.0.first.attack.0.injury.0, value: 5}
    - {key: round.0.first.attack.0.injury.0.undead-construct, value: 3}
  expect_rounds:
    0: {state.second.condition: OUT}
  expect_final: {rounds_executed: 1, termination_reason: second_out}

