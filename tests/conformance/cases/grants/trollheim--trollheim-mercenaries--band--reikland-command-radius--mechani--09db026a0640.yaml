# The printed widening itself: at 10" - beyond the normal 6", within the printed 12" - the Warrior
# (fixture Leadership 3) is offered the Captain's Leadership 8 and uses it.  Its Fear test of 4+4 = 8
# fails against its own 3 and passes against the Captain's 8, so the charge leaves it free to hit
# normally (no sixes required).  Both blows are natural ones, misses.
