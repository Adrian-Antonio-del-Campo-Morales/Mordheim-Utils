# Rule (grade-2a.yaml, hireling.hired-sword.estalian-diestro.rule.main-gauche, grant profile): "Each
# turn the Main Gauche either grants an additional dagger attack or parries as a sword, forfeiting
# its additional attack" - binding mechanic.main-gauche-modes (model
# tests/conformance/cases/mechanics/mechanic.main-gauche-modes.yaml; consumer modular/rounds.py,
# decision `round.<i>.<side>.main-gauche-parry` offered while a main gauche is held in the off hand).
# Hireling family model (README, Hireling recipients): the real Diestro through the hireling route
# (hirelings.hired-sword.2a / hireling.hired-sword.estalian-diestro) with the fixture facts (WS3 S3
# T3 W2 I5 A1; printed Ld8 stays), his kit rapier in the main hand and his kit main gauche in the
# off hand (his authored rapier file notes the choice only fires when the gauche is held).  The
# opponent is hand-built (WS3 S3 T3 W3 I2 A1 Ld7, mace, no armour).  Dice: WS3 against WS3 hits on
# 4+; S3 wounds T3 on 4+; a parry must beat the hit roll; both rapier and dagger-mode gauche grant
# the unarmoured opponent a 6+.  The Diestro strikes first (Initiative 5 against 2); his second
# swing, when he has one, is the gauche and resolves last.  The control is the grade-1b Bard.

# Parry mode: one swing only (the strict tape declares no second hit die) and the opponent's hit
# of 4 is beaten by the parry die 5.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.estalian-diestro.rule.main-gauche/mechanic.main-gauche-modes
  id: the-diestro-in-parry-mode-forfeits-the-dagger-swing-and-parries
  fighters:
    first:
      &diestro-pair
      collection: mordheim
      band_id: hirelings.hired-sword.2a
      profile_id: hireling.hired-sword.estalian-diestro
      main_weapon_id: weapon.rapier
      off_hand_id: weapon.main-gauche
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      &diestro-pair-opponent
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.main-gauche-parry, value: true}
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 4}
    - {key: round.0.second.attack.0.parry, value: 5}
  expect_rounds:
    0: {attacks.0.hit: false, attacks.1.parried: true, attacks.1.wounded: false, state.first.wounds: 2, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

