# The Chaos Armour is the Emissary's unique item: worn by a hireling of another kit it is refused.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.emissary-of-chaos.item.chaos-armour.rule.combat/armour.chaos-armour
  id: the-chaos-armour-is-refused-on-a-hireling-outside-the-emissarys-kit
  fighters:
    first: *emissary-armour-attacker
    second:
      <<: *emissary-armour-control
      armour_id: armour.chaos-armour
  expect_error: "hireling active equipment and supplied ownership do not form a complete legal printed kit"
