# Rule (grade-2a.yaml, hireling.hired-sword.emissary-of-chaos.item.chaos-armour.rule.combat, grant
# profile): "The printed Chaos Armour provides a 4+ armour save." - binding armour.chaos-armour (the
# armours family's base_save 4).  Hireling family model (README, Hireling recipients): the real
# Emissary through the hireling route (hirelings.hired-sword.2a) with the fixture facts (WS3 S3 T3
# W2 I5 A1; printed Ld9 stays), the printed kit's default sword, the unique suit worn through
# armour_id and exactly one patron selected; he is silenced (attacks 0) so the only dice are the
# attacker's.  The attacker is hand-built (WS3 S3 T3 W3 I2 A1 Ld7, mace) and charges; WS3 against
# WS3 hits on 4+, S3 against T3 wounds on 4+ with no save modifier.  The control is the grade-1b
# Bard wearing the light armour of his own printed kit (6+).

# The printed 4+ on its own face: the armour die 4 turns the wound and the compiled save is 4.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.emissary-of-chaos.item.chaos-armour.rule.combat/armour.chaos-armour
  id: the-real-emissarys-chaos-armour-saves-on-four
  fighters:
    first:
      &emissary-armour-attacker
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
    second:
      &emissary-armour-recipient
      collection: mordheim
      band_id: hirelings.hired-sword.2a
      profile_id: hireling.hired-sword.emissary-of-chaos
      armour_id: armour.chaos-armour
      special_rule_ids: [hireling.hired-sword.emissary-of-chaos.patron.tzeentch]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    # The Emissary's kit sword parries: the 1 does not beat the hit.
    - {key: round.0.first.attack.0.parry, value: 1}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.armour, value: 4}
  expect_rounds:
    0: {attacks.0.saved: true, attacks.0.damage: 0, state.second.wounds: 2}
  expect_fighters:
    second.armour_save: 4
  expect_final: {rounds_executed: 1, termination_reason: horizon}

