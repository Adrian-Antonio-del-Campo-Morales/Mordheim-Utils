- audit_id: rule/trollheim/lustria-clan-pestilens/plague-monks--equipment-restrictions/profile.equipment-restrictions
  id: the-pestilens-sorcerer-is-admitted-with-the-rat-familiar-scroll
  # The printed holder ('only a Pestilens Sorcerer can use its spell'): the Sorcerer's row carries no such
  # token, so the same carried scroll is admitted on him.
  fighters:
    first:
      collection: trollheim
      band_id: lustria-clan-pestilens
      profile_id: pestilens-sorcerer
      owned_item_ids: [rat_familiar_scroll]
