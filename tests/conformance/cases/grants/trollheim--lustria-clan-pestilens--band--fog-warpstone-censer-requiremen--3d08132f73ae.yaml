# Model (B12 2026-11-18): the KB binds this band grant as profile.equipment-restrictions with when_items
#   [fog_warpstone_fragments] and required_kinds [weapon.censer] (special-rules.yaml, p.77 'Fog Warpstone
#   Fragments').  profileFactsProjection turns it into a required_equipment row with its when_items;
#   equipmentSetIssues skips the row when no carried item is a fragment and otherwise demands an item whose
#   id, mechanic or kind is weapon.censer (the catalogue's `censer` row maps to that mechanic), answering
#   `The equipment of ${band}/${profile} includes no ${kinds}; the printed clause obliges acquiring one.`
#   Both items are rows of clan-pestilens-hero-equipment-list, so no offered-set refusal can stand in for
#   the obligation.  The check runs on the declared kit (owned_item_ids), which every scenario therefore
#   declares.

# Semantic note (2026-11-18): the fog-enhancing effect of the fragments themselves is outside the duel; only
#   the construction obligation is asserted.  The censer is owned, not wielded, in the admission so that no
#   Censer-bearing rule prerequisite (Black Hunger) is touched.

# Removal-probe expectation (2026-11-18): construction rule; construction-only is the expected verdict.

# --- Authored scenarios ---
# Derived from the KB record, the band's equipment list and the gate's message template; no engine output
#   was consulted.

- audit_id: rule/trollheim/lustria-clan-pestilens/band--fog-warpstone-censer-requirement/profile.equipment-restrictions
  id: fog-warpstone-fragments-without-a-censer-are-refused
  # The conditional obligation: the kit carries the fragments (when_items) and no censer, so the whole-set
  # check names the missing kind.
  fighters:
    first:
      collection: trollheim
      band_id: lustria-clan-pestilens
      profile_id: plague-priest
      owned_item_ids: [fog_warpstone_fragments]
  expect_error: 'The equipment of lustria-clan-pestilens/plague-priest includes no weapon.censer; the printed clause obliges acquiring one.'

