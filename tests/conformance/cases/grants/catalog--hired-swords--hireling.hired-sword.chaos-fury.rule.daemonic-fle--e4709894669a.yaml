# Hireling family model (README, Hireling recipients): the recipient is the printed Chaos Fury compiled
# through the hireling route (hirelings.hired-sword.2a / hireling.hired-sword.chaos-fury),
# its printed rule granted by the profile itself; fixture characteristics WS3 S3 T3 W2 I5 A1 (printed Ld10
# stays); its hands are its own (no kit weapon is named).  Readers: the Gaoler (hirelings.hired-sword.1b /
# hireling.hired-sword.gaoler, fixture, kit heavy chain) is offered `round.0.first.torturer-grapple` against
# a living target and never against a Daemon; a hand-built Foul Odour target (skill_ids
# mechanic.foul-odour, WS3 S3 T3 W3 I2 A1 Ld7, mace) imposes -1 to hit on living attackers only, so a
# declared 4 hits for the Daemon (4+) and misses for the Bard (5+).  The recipient causes Fear, so a charging
# Gaoler tests (1+1 passes) and a charged target tests (3+3 passes Ld7).  Every other swing is a declared
# natural 1, and the Daemon's hitting four is followed by a wound die of 1 so no save or injury joins.

# The Gaoler charges the Daemon: his Fear test passes, no grapple decision is offered, both swings miss.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.chaos-fury.rule.daemonic-flesh/trait.creature-kind
  id: the-gaolers-grapple-is-never-offered-against-the-daemon
  fighters:
    first:
      &gaoler
      collection: mordheim
      band_id: hirelings.hired-sword.1b
      profile_id: hireling.hired-sword.gaoler
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      &recipient
      collection: mordheim
      band_id: hirelings.hired-sword.2a
      profile_id: hireling.hired-sword.chaos-fury
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.fear.charge.0, value: 1}
    - {key: round.0.first.fear.charge.1, value: 1}
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.grappled: false, state.first.grappling: false, state.first.wounds: 2, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

