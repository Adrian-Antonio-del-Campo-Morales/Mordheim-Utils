  expect_rounds:
    0: {state.second.grappled: false, state.first.grappling: false, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The Daemon charges a Foul Odour target: the target's Fear test passes, the Daemon's 4 hits (no -1 for a
# non-living attacker); its wound die of 1 fails so nothing else is requested.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.chaos-fury.rule.daemonic-flesh/trait.creature-kind
  id: the-daemons-attack-ignores-a-foul-odour-targets-penalty
  fighters:
    first:
      <<: *recipient
    second:
      &foul
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.foul-odour]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.fear.charged.0, value: 3}
    - {key: round.0.second.fear.charged.1, value: 3}
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: true, attacks.0.damage: 0, state.second.wounds: 3, state.first.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

