# --- Authored scenarios ---
#
# Poison-immunity family model (the authored Clan Skryre Rat Ogre file of this directory, second
# triage batch 2026-11-18, and the call-of-the-night-haint-mim revenants file): Nightshade is the
# one admitted poison whose consequence is a state change on the warrior it wounds (one unsaved
# wound lowers Initiative by one, carried as the lasting initiative_penalty field;
# modular/attacks.py reads `poison.nightshade` on the attack and skips the rider when the defender's
# global effects carry `poison_immune` / poison_immunity, compiled from the trait by roster-
# construction compiler.py), so it is the rider the printed immunity must suppress: the coated mace
# wounds the bearer as any mace would, and the penalty never lands.
#
# Hireling family model (P0, 2026-11-17): the recipient is the printed hireling profile compiled
# through the hireling route (hirelings.dramatis-personae.2a / hireling.dramatis.sigmund-spindle-
# the-harvester-of-flesh) with the fixture facts (WS3 S3 T3 W2 I5 A1; the printed Leadership stays);
# its printed rule is granted by the profile itself, so nothing is selected.  The opponent is the
# hand-built standard (WS3 S3 T3 W3 I2 A1 Ld7) with a Nightshade-coated mace.  No charge is
# declared, so no Fear or psychology die is requested.  The control is the grade-1b Bard (dagger),
# the same wound with the rider landing.  The refusal selects the printed rule on that control
# through special_rule_ids.
# Profile facts read (grade-2a record): Maddened (Frenzy), Causes Fear, Immune to Poison and the
# Veskit-form No Pain, plus the starting skills Sprint, Scale Sheer Surfaces, Dodge, Lightning
# Reflexes, Step Aside and Unstoppable Charge.  His printed kit is the scythe alone (two-handed, no
# parry), taken by default.  Step Aside is the one skill that touches an incoming hit: a 5+ special
# save declared failing after the wound.  Frenzy doubles a supplied attack pool, so the silenced
# `attacks: 0` stays 0 and he strikes nothing; with `charging: []` his Fear requests no die.  No
# Pain acts only at the injury roll and the fixture W2 keeps him standing. Semantic wrinkle: the
# Frenzy clause "must charge" is a movement-phase obligation the explicit `charging: []` context
# does not model; the round is read as an uncharged exchange, as the authored Mad Cap Mushrooms
# controls of the clockworkers-sc drug files do.

# The coated mace wounds the recipient: WS3 v WS3 hits on 4+, S3 v the fixture T3 wounds on 4+ (a
# non-six, so no critical die).  The wound is taken as any wound would be (fixture wounds 2 -> 1, no
# injury roll) and the poisoned-wound Initiative penalty is suppressed: initiative_penalty stays 0.
