# --- Authored scenarios ---
# Derived from the printed rule and the recorded contract; no engine output was consulted.  The
# special save resolves after the wound and before the damage, so a saved attack leaves the bearer at
# its starting wound total and a failed one costs exactly one wound.  The control omits the ward so
# the strict tape proves no special-save die is asked for.
- audit_id: rule/mordheim/lustrian-reavers/barbary-monkey--nimble/trait.ward-save
  id: the-declared-five-negates-the-wound
  covers: [five-plus-ward-save]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      trait_overrides: {ward_save: 5}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
