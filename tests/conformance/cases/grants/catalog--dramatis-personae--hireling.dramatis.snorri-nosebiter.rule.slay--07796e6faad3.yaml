      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
      trait_overrides: {snorri_drunk_result: 3}
      main_weapon_id: weapon.pistol
      owned_item_ids: [dwarf_axe, hammer, pistol]
  expect_error: 'hireling active equipment and supplied ownership do not form a complete legal printed kit'

- audit_id: rule/catalog/dramatis-personae/hireling.dramatis.snorri-nosebiter.rule.slayer-rules/profile.equipment-restrictions
  id: the-rule-is-refused-on-a-hireling-outside-its-printed-profile
  # The printed grant belongs to Snorri's profile; selecting it on another hireling is refused.
  fighters:
    first:
      collection: mordheim
      band_id: hirelings.hired-sword.1b
