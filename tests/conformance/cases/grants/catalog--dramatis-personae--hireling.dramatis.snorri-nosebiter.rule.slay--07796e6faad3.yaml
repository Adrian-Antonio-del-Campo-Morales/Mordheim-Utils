# Model (hireling recipients, README; B12 2026-11-18): the KB binds Slayer Rules' profile.equipment-
#   restrictions with forbids [armour, constant-save-cloak, non-thrown-ranged] (the Slayer's no-armour, no-
#   cloak, thrown-weapons-only strictures).  Recipient: Snorri compiled through the hireling route
#   (hirelings.dramatis-personae.2b / hireling.dramatis.snorri-nosebiter) with the fixture facts, his
#   printed kit supplied as owned_item_ids [dwarf_axe, hammer] and the Drunk table fixed at 3
#   (trait_overrides snorri_drunk_result; tests/construction/test_hireling_admission.py).  The admission is
#   observed on the compiled build (first.main_weapon.tags.0: weapon.dwarf-axe, the kit's first close-combat
#   weapon per the 2026-11-18 ruling) in the construction-only shape.  The refusal outside the profile uses
#   the Bard control and the common prefix `special rule is not available to hirelings.hired-sword.1b`.

# Discrimination note (2026-11-18): the hireling kit resolver (resolveHirelingKit, `hireling active
#   equipment and supplied ownership do not form a complete legal printed kit`) runs at the start of the
#   boundEquipment stage, before the profile's armour check (`armour is forbidden for ...`) and the forbids
#   token loop (`"non-thrown-ranged" is forbidden for ...`, `"constant-save-cloak" ...`), and it refuses any
#   active or owned item outside the printed Dwarf Axe + Hammer kit.  The binding's own diagnostics are
#   therefore unreachable for this hireling and the refusals above are enforced by the kit resolver, per the
#   Priest of Morr Haunted Mien precedent (catalog--hired-swords--hireling.hired-sword.priest-of-morr-
#   miracle-worke--45c97d805c6e.yaml).  The removal probe will report the refusals as surviving the
#   binding's removal; that is the duplicate enforcement named here, not a missing scenario.

# --- Authored scenarios ---
# Derived from the hireling record, the printed kit, the README hireling conventions and the gate's message
#   templates; no engine output was consulted.

- audit_id: rule/catalog/dramatis-personae/hireling.dramatis.snorri-nosebiter.rule.slayer-rules/profile.equipment-restrictions
  id: snorri-with-his-printed-kit-is-admitted
  # The legal kit: the printed Dwarf Axe and Hammer, the Drunk table fixed at 'no effect' (3); an omitted
  # main weapon is the kit's first close-combat weapon, the axe.
  fighters:
    first:
      collection: mordheim
      band_id: hirelings.dramatis-personae.2b
      profile_id: hireling.dramatis.snorri-nosebiter
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
      trait_overrides: {snorri_drunk_result: 3}
      owned_item_ids: [dwarf_axe, hammer]
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [], active_participant: first}
  initial_state: {first: {condition: OUT}}
  expect_fighters:
    first.main_weapon.tags.0: weapon.dwarf-axe
  expect_initial: {first.condition: OUT}
  expect_final: {rounds_executed: 0, termination_reason: first_out}

- audit_id: rule/catalog/dramatis-personae/hireling.dramatis.snorri-nosebiter.rule.slayer-rules/profile.equipment-restrictions
  id: snorri-wearing-armour-is-refused
  # The 'armour' token: light armour worn and owned beside the printed kit.  The kit resolver refuses the
  # ownership first (see the Discrimination note).
  fighters:
    first:
      collection: mordheim
      band_id: hirelings.dramatis-personae.2b
      profile_id: hireling.dramatis.snorri-nosebiter
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
      trait_overrides: {snorri_drunk_result: 3}
      armour_id: armour.light-armour
      owned_item_ids: [dwarf_axe, hammer, light_armour]
  expect_error: 'hireling active equipment and supplied ownership do not form a complete legal printed kit'

- audit_id: rule/catalog/dramatis-personae/hireling.dramatis.snorri-nosebiter.rule.slayer-rules/profile.equipment-restrictions
  id: snorri-with-a-pistol-is-refused
  # The 'non-thrown-ranged' token: a pistol (blackpowder, not thrown) in the main hand.  The kit resolver
  # refuses the ownership first.
  fighters:
