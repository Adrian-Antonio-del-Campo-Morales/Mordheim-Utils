# --- Authored scenarios ---
# The bearer is the band's own Liche with a lost wound (its printed total is four).  Wraith
# Touch is a selectable band skill, not a printed profile rule, so the Liche build selects
# the band's own row; the compiled mechanic is what the round operator reads to replace the
# pool.  It declares the Wraith Touch, so its pool is one unarmed attack that wounds
# automatically: the tape carries the To Hit die and no To Wound die at all.  Because all rules
# that apply to unarmed attacks apply, the target keeps the unarmed attack's +1 armour save,
# so a save die follows the hit and is declared failing (five against the printed six); the
# printed +1 Strength penalty and this save come from the same unarmed profile.  A Liche that
# wounds chooses the printed regain, so that second choice is declared where it can be
# offered (the bearer is below its starting total).
- audit_id: rule/mordheim/restless-dead/band--restless-dead-special-skills-wraith-touch/mechanic.wraith-touch
  id: the-declared-wraith-touch-wounds-automatically-and-the-liche-regains-a-wound
  fighters:
    first:
      collection: mordheim
      band_id: restless-dead
      profile_id: liche
      special_rule_ids: [band--restless-dead-special-skills-wraith-touch]
    second:
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1}
  initial_state: {first: {wounds: 1}, second: {attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.wraith-touch, value: true}
    - {key: round.0.first.attack.0.wraith-heal, value: true}
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.armour, value: 5}
  expect_rounds:
    0: {attacks.0.wounded: True, attacks.0.damage: 1, state.second.wounds: 2,
        state.first.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# The printed cap: the same Liche at its full printed four wounds still wounds the
# defender, but the regain may not take it beyond its starting total.  At the starting
# total the engine does not even offer the regain, so no choice is declared here.
- audit_id: rule/mordheim/restless-dead/band--restless-dead-special-skills-wraith-touch/mechanic.wraith-touch
  id: the-liche-heal-may-not-take-it-beyond-its-starting-total
  fighters:
    first:
      collection: mordheim
      band_id: restless-dead
      profile_id: liche
      special_rule_ids: [band--restless-dead-special-skills-wraith-touch]
    second:
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.wraith-touch, value: true}
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.armour, value: 5}
  expect_rounds:
    0: {attacks.0.wounded: True, state.second.wounds: 2, state.first.wounds: 4}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# The printed prohibition: against an Undead defender the declared replacement is still
# offered and still replaces the pool, but the attack has no effect at all - no die is
# consumed by it and the defender keeps every wound.
- audit_id: rule/mordheim/restless-dead/band--restless-dead-special-skills-wraith-touch/mechanic.wraith-touch
  id: an-undead-defender-takes-no-wraith-touch-effect
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.wraith-touch]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 2}
    second:
      main_weapon_id: weapon.mace
      trait_overrides: {creature_kind: undead}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.wraith-touch, value: true}
  rolls:
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: False, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The printed unarmed-rule sentence, armour component: the declared wraith touch carries the unarmed
# attack's +1 to the target's save, so the heavy-armour defender's printed 5+ becomes a 4+ and the
# declared save die of four holds.  Without that unarmed rule the same die is below the printed 5 and
# the defender would take the automatic wound.
- audit_id: rule/mordheim/restless-dead/band--restless-dead-special-skills-wraith-touch/mechanic.wraith-touch
  id: the-unarmed-attacks-armour-rule-applies-to-the-wraith-touch
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.wraith-touch]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      armour_id: armour.heavy-armour
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.wraith-touch, value: true}
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.armour, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.saved: true, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

