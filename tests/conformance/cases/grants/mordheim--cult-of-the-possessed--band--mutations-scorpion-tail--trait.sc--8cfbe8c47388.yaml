# --- Authored scenarios ---
# Derived from the printed rule and the recorded contract; no engine output was consulted.  The
# bearer is a hand-built fixture carrying the printed trait, because the clause is about the tail
# attack rather than about one printed statline.  The victim is hand-built at Toughness 3 with three
# wounds, so a single tail wound leaves it standing, and it contributes no attack of its own in the
# first two scenarios.

- audit_id: rule/mordheim/cult-of-the-possessed/band--mutations-scorpion-tail/trait.scorpion-tail
  id: the-tail-strikes-with-its-printed-strength-five
  covers: [whole--scope--scorpion-tail]
  fighters:
    first:
      main_weapon_id: weapon.mace
      trait_overrides: {scorpion_tail: true}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.first.attack.1.hit, value: 4}
    - {key: round.0.first.attack.1.wound, value: 2}
  expect_rounds:
    0: {state.second.wounds: 2, state.second.condition: STANDING}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The printed exception: the same tail attack against a poison-immune defender is Strength 2, whose
