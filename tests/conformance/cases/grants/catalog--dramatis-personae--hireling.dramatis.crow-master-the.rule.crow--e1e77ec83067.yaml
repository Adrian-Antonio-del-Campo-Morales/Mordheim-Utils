# Hireling family model (README, Hireling recipients): the recipient is the printed Crow Master compiled
# through the hireling route (hirelings.dramatis-personae.1b / hireling.dramatis.crow-master-the), his
# printed rule granted by the profile itself; fixture characteristics WS3 S3 T3 W2 I5 A1 (printed Ld8
# stays); the omitted main weapon is the kit's staff.  The opponent is hand-built (WS3 S3 T3 W3 I2 A1 Ld7,
# mace, no armour).  Printed text: "Any enemy model in base-to-base contact with Simius at the start of the
# Hand-to-hand Combat phase suffers a single automatic Strength 2 hit before any blows are struck."  The
# consumer (modular/rounds.py:1207-1240) keys the hit on the target's side: `round.0.second.mantle-of-crows.wound`;
# Strength 2 wounds Toughness 3 on a 5+ (a six would be a critical candidate and is never declared).  Both
# swings are declared natural 1s.  The control is the grade-1b Bard.

# The Crow Master charges: the crows' automatic hit comes first and its five wounds before any blow.
- audit_id: rule/catalog/dramatis-personae/hireling.dramatis.crow-master-the.rule.crow-master/mantle-of-crows
  id: the-crow-masters-mantle-wounds-the-contacting-opponent-before-any-blow
  fighters:
    first:
      &recipient
      collection: mordheim
      band_id: hirelings.dramatis-personae.1b
      profile_id: hireling.dramatis.crow-master-the
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      &opponent
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.mantle-of-crows.wound, value: 5}
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: true, attacks.0.damage: 1, state.second.wounds: 2, state.first.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

