# --- Authored scenarios ---
# Family model (Infinite Hatred on its printed Strigoi recipient): the bearer is built from its
# printed band profile and the printed selectable power is declared on it, because only the
# strigoi-vampire profile is eligible for the Strigoi powers; its physical characteristics are
# supplied as fixture facts (the printed profile prints W2 A3) so the dice thresholds and the strike
# order are fixed, and its printed Leadership stays in place.  A natural 2 misses against Weapon
# Skill 3, the taken-again die on 4 hits, and Strength 3 wounds Toughness 3 on 4.  The printed
# Strigoi profile carries its own clauses (it causes Fear, it is subject to Hatred against everyone
# and it is Immune to Psychology), so round zero alone does not separate this power from the printed
# hatred; round one, which ordinary Hatred never reaches, is the clause's own boundary and the third
# scenario's bearer is a band-mate the printed eligibility excludes.

