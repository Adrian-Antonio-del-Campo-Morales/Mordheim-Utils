# Hireling family model (P0, 2026-11-17).  The recipient is the printed hireling profile, compiled
# through the hireling route (band_id hirelings.<kind>.<grade>, profile_id hireling.<kind>.<slug>); its
# printed rule is granted by the profile itself, so the build selects nothing.  Its physical
# characteristics are supplied as fixture facts (WS3 S3 T3 W2 I5 A1) so every die threshold is fixed,
# while its printed Leadership stays in place; an omitted main weapon is the printed kit's own.
# The opponent is hand-built (WS3 S3 T3 W3 I2 A1 Ld7, mace) and declares the one fact the rule reads
# (causes_fear, or the hated kind).  The control is a plain hireling without any psychology rule - the
# grade-1b Bard - compiled through the same route with the same fixture, so the request that the rule
# removes (or the reroll it grants) is shown present without it.  The refusal selects the printed rule
# on that control through special_rule_ids: a profile-granted rule is not available elsewhere.
# Dice: every attack is declared as a natural 1 unless the strike is the observable, so no wound, save
# or injury die is requested; a 2D6 Fear test of 5+4 fails Ld7 and 3+3 passes it.

# Charged by a Fear-causer, the fear-immune recipient is not tested: the tape declares no Fear die.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.albino-stormvermin.rule.hardened/mechanic.fear-immunity
  id: albino-stormvermin-takes-no-fear-test-when-charged-by-a-fear-causer
  fighters:
    first:
      &recipient
      collection: mordheim
      band_id: hirelings.hired-sword.2b
      profile_id: hireling.hired-sword.albino-stormvermin
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      trait_overrides: {causes_fear: true}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  initial_state: {first: {attacks: 0}}
  duel_context: {charging: [second], active_participant: second}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.fear_hit_sixes: False, state.first.condition: STANDING, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The print grants immunity to Fear, not to Psychology: a supplied frenzy flag is kept, unlike the
# psychology-immune warriors of the sibling family.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.albino-stormvermin.rule.hardened/mechanic.fear-immunity
  id: the-immunity-is-to-fear-only-so-a-frenzy-flag-stays-on-albino-stormvermin
  fighters:
    first:
      <<: *recipient
      trait_overrides: {frenzy: true}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  initial_state: {first: {attacks: 0}}
  duel_context: {charging: [], active_participant: second}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_initial: {first.frenzy: True}
  expect_rounds:
    0: {state.first.frenzy: True, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

