# --- Authored scenarios ---
# The gazer bars the target for the round and every attack against the barred target hits
# automatically, so the gazer's own attack asks for no To Hit die: the only attack die declared
# is its To Wound roll, which fails and leaves the target unharmed and Standing.
- audit_id: rule/trollheim/chaos-streets-undead-bloodlines/band--vampire-power-hypnotic-gaze/mechanic.hypnotic-gaze
  id: a-failed-gaze-test-bars-the-target-and-makes-attacks-hit-automatically
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.hypnotic-gaze]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.second.hypnotic-gaze, value: true}
  rolls:
    - {key: round.0.second.hypnotic-gaze.0, value: 6}
    - {key: round.0.second.hypnotic-gaze.1, value: 6}
    - {key: round.0.first.attack.0.wound, value: 1}
  expect_rounds:
    0: {attacks.0.hit: true, state.second.charm_attack_blocked: true, state.second.charm_auto_hit: true, state.second.condition: STANDING, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

