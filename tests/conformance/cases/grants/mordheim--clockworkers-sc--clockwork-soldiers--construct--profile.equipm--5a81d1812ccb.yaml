# --- Authored scenarios ---
# Derived from the printed capacity and slot costs; construction-only, no combat is resolved.
# The halberd takes the printed 2 slots (2/2) and the light armour the one armour slot (1/1).
- audit_id: rule/mordheim/clockworkers-sc/clockwork-soldiers--construct/profile.equipment-restrictions
  id: a-kit-filling-every-equipment-slot-is-accepted
  covers: [construct-equipment-slot-capacity]
  fighters:
    first:
      collection: mordheim
      band_id: clockworkers-sc
      profile_id: clockwork-soldiers
      main_weapon_id: weapon.halberd
      armour_id: armour.light-armour
      owned_item_ids: [halberd, light_armour]
    second: {}
  # Construction is the observation: no charge is declared and the bearer is put out of action before
  # the first phase (the corpus's control shape), so the duel requests no die at all.
  duel_context: {charging: [], active_participant: first}
  initial_state: {first: {condition: OUT}}
  expect_fighters:
    first.characteristics.wounds: 1

# Three one-slot hand weapons (sword and mace in hand, an axe owned) need 3 of the 2 slots.
- audit_id: rule/mordheim/clockworkers-sc/clockwork-soldiers--construct/profile.equipment-restrictions
  id: one-slot-over-the-equipment-capacity-is-refused
  covers: [construct-equipment-slot-capacity]
  fighters:
    first:
      collection: mordheim
      band_id: clockworkers-sc
      profile_id: clockwork-soldiers
      main_weapon_id: weapon.sword
      off_hand_id: weapon.mace
      owned_item_ids: [sword, mace, axe]
  expect_error: "Construct equipment requires 3/2 equipment slots"

# The single armour slot: light armour worn and heavy armour owned are two armour pieces, so the kit is
# refused on the armour count although its one sword is inside the equipment capacity.
- audit_id: rule/mordheim/clockworkers-sc/clockwork-soldiers--construct/profile.equipment-restrictions
  id: a-second-armour-piece-is-refused
  covers: [construct-equipment-slot-capacity]
  fighters:
    first:
      collection: mordheim
      band_id: clockworkers-sc
      profile_id: clockwork-soldiers
      main_weapon_id: weapon.sword
      armour_id: armour.light-armour
      owned_item_ids: [sword, light_armour, heavy_armour]
  expect_error: "Construct equipment requires 1/2 equipment slots and 2/1 armour slots."
