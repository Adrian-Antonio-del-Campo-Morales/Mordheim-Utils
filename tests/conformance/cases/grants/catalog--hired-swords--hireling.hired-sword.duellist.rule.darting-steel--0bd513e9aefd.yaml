# Printed text (grade-1b.yaml, Duellist / Darting Steel): "Uses the source Darting Steel rule."  The KB
# binds it as trait.counts-as-buckler (value true): the Duellist's blade-work counts as a buckler, which
# is a parry (Mordheim rulebook, Buckler: parry; the parry die must beat the To Hit roll, an equal die
# does not block).  The compiler reads the trait as the bearer's intrinsic parry flag
# (packages/python/roster-construction/mordheim_construction/compiler.py ~1231, parry=counts_as_buckler),
# which the engine counts as one parry (modular/state.py _parry_capacity ~188-194) and resolves under
# round.<i>.<attacker>.attack.<n>.parry with the strict-greater rule (phases.py resolve_parry ~480-500).
# The model is the AUTHORED Tileans file ...ea2a6a9b0556 (the same trait on the Duelists' cloak).
#
# Hireling family model (P0, 2026-11-17).  The recipient is the printed Duellist compiled through the
# hireling route (hirelings.hired-sword.1b / hireling.hired-sword.duellist) with the fixture facts
# (WS3 S3 T3 W2 I5 A1; the printed Ld7 stays).  His kit lists the duelling pistol first, so a kit
# weapon is named: the dagger (main_weapon_id weapon.dagger), which parries nothing of its own, so the
# parry die the tape shows is the trait's alone; his kit sword and Duelist's Cloak stay owned, not in
# hand.  He contributes no swing (initial_state).  The attacker is hand-built (WS3 S3 T3 W3 I2 A1 Ld7,
# mace): 4+ to hit, 4+ to wound, and his S3 is below twice the Duellist's S3 so the parry is eligible.
# The control is the grade-1b Bard with the same dagger (kit light armour owned, not worn).
# Semantic note (2026-11-18): the engine also carries an operator tagged mechanic.darting-steel
#   (contexts.py _darting_steel_parry: a sword-and-buckler parry that succeeds under the bearer's
#   Weapon Skill), but no KB record binds that tag to this rule; the printed binding is the plain
#   buckler trait, which is what these scenarios evidence.  With his sword in hand the trait adds a
#   second parry source but not the sword-and-buckler re-roll (the operator reads a defence.buckler
#   tag the trait does not carry); that face is noted, not asserted.

# The trait's parry: a five beats the four and the hit is blocked.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.duellist.rule.darting-steel/trait.counts-as-buckler
  id: the-duellist-parries-a-hit-with-a-die-above-the-to-hit-roll
  fighters:
    first:
      &attacker
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
    second:
      &duellist
      collection: mordheim
      band_id: hirelings.hired-sword.1b
      profile_id: hireling.hired-sword.duellist
      main_weapon_id: weapon.dagger
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
  initial_state: {second: {attacks: 0}}
  duel_context: &attacker-charges {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.parry, value: 5}
  expect_rounds:
    0: {attacks.0.hit: True, attacks.0.parried: True, attacks.0.damage: 0, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The strict boundary: an equal four does not block, and the wound resolves on the unarmoured Duellist.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.duellist.rule.darting-steel/trait.counts-as-buckler
  id: an-equal-parry-die-does-not-block-the-hit
  fighters:
    first: *attacker
    second: *duellist
  initial_state: {second: {attacks: 0}}
  duel_context: *attacker-charges
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.parry, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
  expect_rounds:
    0: {attacks.0.parried: False, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The control: the Bard with the same dagger has no buckler and no parrying weapon, so the strict tape
# requests no parry die and the same four wounds him.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.duellist.rule.darting-steel/trait.counts-as-buckler
