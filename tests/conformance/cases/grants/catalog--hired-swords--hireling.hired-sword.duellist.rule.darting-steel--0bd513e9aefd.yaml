  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The printed grant belongs to the Duellist's profile; selecting it on another hireling of the same
# package is refused by the eligibility gate.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.duellist.rule.darting-steel/trait.counts-as-buckler
  id: the-rule-is-refused-on-a-hireling-outside-its-printed-profile
  fighters:
    first: *attacker
    second:
      <<: *control
      special_rule_ids: [hireling.hired-sword.duellist.rule.darting-steel]
  expect_error: "special rule is not available to hirelings.hired-sword.1b"
