# Conformance authoring scaffold; generated comments, manually authored scenarios.
# audit_id: rule/mordheim/channel-rats-mim/domnu--prize-fighter/skill.unarmed-fighting
# authoring_status: AUTHORED
# authoring_progress: the admitted clause carries 3 authored scenarios derived from the printed band stanza
# and the recorded contract.  The printed sentence repeats the canonical clause of the shared
# unarmed-fighting operator without adding a term, so the bearer is a fixture declaring the skill and the
# control repeats the same fixture without it; a third builds the printed Domnu recipient
# itself.  REVIEWED still requires manual semantic review and execution_status
# stays UNEXECUTED.
# execution_status: UNEXECUTED (this scaffold has no behavioral result)
#
# Derive inputs and expectations from rule text and accepted rulings.
# Do not derive them from the engine or execute combat during authoring.
# REVIEWED requires semantic review; covers labels alone are insufficient.
# Preserve audit_id when filling this file.
# Governing rulings: docs/decisions/design-rulings.md
#
# AUTHORED: 3 scenarios show the unarmed pool keeping the printed extra attack - the strict tape
# consumes a second attack die for the bearer - against the control bearer whose pool stays clamped to the
# single declared die.  The unarmed Strength and armour penalty waiver is not asserted: the clause records
# no penalty magnitude of its own, so no discriminating wound die can be derived from it here.
# Real recipient (2026-11-16): one further scenario builds the band's own printed profile bare-handed, so
# the profile's KB grant itself (not an injected skill id) supplies the unclamped pool with the extra
# attack.

# --- Authored scenarios ---
# Derived from the printed stanza and the recorded contract; no engine output was consulted.  Both attacks
# of the skill bearer miss on a declared 1, so no wound die is needed and the evidence the case carries is
# the tape itself: the strict runner consumes attack.0 and attack.1 only if the unarmed pool really holds
# the printed extra attack, and the clamped control consuming attack.0 alone is the same evidence the other
# way round.
- audit_id: rule/mordheim/channel-rats-mim/domnu--prize-fighter/skill.unarmed-fighting
  id: the-unarmed-bearer-is-not-clamped-and-gains-one-attack
  fighters:
    first:
      skill_ids: [skill.unarmed-fighting]
      main_weapon_id: weapon.fist
      characteristics: &uf-bearer {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: &uf-opponent {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: &uf-context {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.first.attack.1.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: false, attacks.1.hit: false, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

- audit_id: rule/mordheim/channel-rats-mim/domnu--prize-fighter/skill.unarmed-fighting
  id: the-ordinary-fist-is-clamped-to-one-attack
  fighters:
    first:
      main_weapon_id: weapon.fist
      characteristics: *uf-bearer
    second:
      main_weapon_id: weapon.mace
      characteristics: *uf-opponent
  duel_context: *uf-context
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: false, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# Real recipient (2026-11-16): the band's own printed domnu profile is built from the band package,
# so the grant under test is the profile's own KB row rather than an injected skill id.  Bare-handed
# (weapon.fist), the printed attack pool plus the stanza's +1 Attack is consumed on declared misses;
# without the row the unarmed pool would be clamped and the strict tape would hold an unused die.
# The printed A2 plus one gives three hit dice; the evidence is those three consumed dice and the
# unwounded opponent (the ledger is not indexed per die here because the profile also carries Bear Hug).
- audit_id: rule/mordheim/channel-rats-mim/domnu--prize-fighter/skill.unarmed-fighting
  id: the-printed-domnu-fights-bare-handed-with-three-attacks
  fighters:
    first:
      collection: mordheim
      band_id: channel-rats-mim
      profile_id: domnu
      main_weapon_id: weapon.fist
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.first.attack.1.hit, value: 1}
    - {key: round.0.first.attack.2.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.wounds: 2, state.first.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
