# The sword's critical on a 5: the critical die 1 deals two wounds to the unarmoured opponent.
- audit_id: rule/catalog/dramatis-personae/hireling.dramatis.aenur.item.ienh-khain.rule.critical/weapon.ienh-khain
  id: the-real-aenurs-wound-roll-of-five-is-a-critical-with-ienh-khain
  fighters:
    first:
      &ienh-critical-recipient
      collection: mordheim
      band_id: hirelings.dramatis-personae.core
      profile_id: hireling.dramatis.aenur
      main_weapon_id: weapon.ienh-khain
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      &ienh-critical-opponent
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 5}
    - {key: round.0.first.attack.0.critical, value: 1}
  expect_rounds:
    0: {attacks.0.wounded: true, attacks.0.critical: true, attacks.0.damage: 2, state.second.wounds: 1}
  expect_fighters:
    first.main_weapon.critical_threshold: 5
  expect_final: {rounds_executed: 1, termination_reason: horizon}

