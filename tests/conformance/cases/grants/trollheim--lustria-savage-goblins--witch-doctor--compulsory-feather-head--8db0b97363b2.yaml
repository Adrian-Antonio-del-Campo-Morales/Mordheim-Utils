- audit_id: rule/trollheim/lustria-savage-goblins/witch-doctor--compulsory-feather-headdress/profile.equipment-restrictions
  id: the-witch-doctor-without-the-feather-headdress-is-refused
  # A declared kit without the Headdress: the whole-set obligation names the missing item.
  fighters:
    first:
      collection: trollheim
      band_id: lustria-savage-goblins
      profile_id: witch-doctor
      owned_item_ids: [dagger]
  expect_error: 'The equipment of lustria-savage-goblins/witch-doctor includes no feather_headdress; the printed clause obliges acquiring one.'

