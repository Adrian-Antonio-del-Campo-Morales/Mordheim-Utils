# Hireling family model (README, Hireling recipients): the recipient is the printed Fallen Sister compiled
# through the hireling route (hirelings.hired-sword.2a / hireling.hired-sword.the-fallen-sister); her
# printed rule is granted by the profile itself; fixture characteristics WS3 S3 T3 W2 I5 A1 (printed Ld8
# stays); the dagger of her kit is named.  The Sigmarite opponents are compiled band profiles with fixture
# characteristics (WS3 S3 T3 W3 I2 A1, printed Ld, mace); the plain opponent is hand-built (Ld7, mace).
# Dice: her 2D6 test (`round.0.first.ashamed-and-afraid.{0,1}`) of 3+3 passes Ld8 and 5+4 = 9 fails it;
# every strike is a declared natural 1; a failed charge test ends the duel `disengaged` with no blow struck.
# The control is the grade-1b Bard, a hireling without any psychology rule; the refusal selects the printed
# rule on it.

# Her charge against a Sister of Sigmar needs the test: 3+3 passes Ld8 and the charge goes in.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.the-fallen-sister.rule.ashamed-and-afraid/mechanic.ashamed-and-afraid
  id: the-fallen-sister-passing-her-test-charges-the-sister-of-sigmar
  fighters:
    first:
      &recipient
      collection: mordheim
      band_id: hirelings.hired-sword.2a
      profile_id: hireling.hired-sword.the-fallen-sister
      main_weapon_id: weapon.dagger
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      &sister
      collection: mordheim
      band_id: sisters-of-sigmar
      profile_id: sigmarite-matriarch
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.ashamed-and-afraid.0, value: 3}
    - {key: round.0.first.ashamed-and-afraid.1, value: 3}
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: False, state.first.condition: STANDING, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

