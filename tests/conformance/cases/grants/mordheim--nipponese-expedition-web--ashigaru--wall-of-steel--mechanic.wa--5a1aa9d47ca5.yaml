# AUTHORED: 4 scenarios cover the real Ashigaru's stance (compiled two-handed parrying spear and the
#   blocked hit), the parry-less spear without the stance, and the two printed-precondition refusals.

# --- Authored scenarios ---
# The bearer is the band's real Ashigaru (the rule is grant: profile on him, so nothing is selected)
# with his printed Weapon Skill 2 in the fixture characteristics; the attacker is a hand-built WS3
# mace fixture, so the attacker hits on 3+.  The granted parry is the ordinary printed parry: it
# blocks by beating the highest enemy hit roll (5 beats a 4).  The Ashigaru's own swing is a
# scripted miss; W2 keeps the landed blow short of an injury roll.

# The printed choice declared: with the stance the compiled spear is two-handed and parries, and a
# die of 5 blocks the hit of 4.  The compiled pair below is the printed grant itself.
- audit_id: rule/mordheim/nipponese-expedition-web/ashigaru--wall-of-steel/mechanic.wall-of-steel
  id: the-ashigarus-declared-stance-lets-his-spear-parry
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      collection: mordheim
      band_id: nipponese-expedition-web
      profile_id: ashigaru
      main_weapon_id: weapon.spear
      variant_ids: [stance.wall-of-steel]
      characteristics: {weapon_skill: 2, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.parry, value: 5}
  expect_fighters:
    second.main_weapon.parry: True
    second.main_weapon.two_handed: True
  expect_rounds:
    0: {attacks.1.parried: True, attacks.1.wounded: False, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The control: the same Ashigaru without the declared stance wields a one-handed spear that never
# gained the parry rule, so no parry die is offered at all - the tape that carries none resolves
# straight to the wound.
- audit_id: rule/mordheim/nipponese-expedition-web/ashigaru--wall-of-steel/mechanic.wall-of-steel
  id: without-the-stance-his-spear-offers-no-parry-die
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      collection: mordheim
      band_id: nipponese-expedition-web
      profile_id: ashigaru
      main_weapon_id: weapon.spear
      characteristics: {weapon_skill: 2, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
  expect_fighters:
    second.main_weapon.parry: False
    second.main_weapon.two_handed: False
  expect_rounds:
    0: {attacks.1.parried: False, attacks.1.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The printed choice is to wield the spear two-handed: an off-hand item alongside the declared
# stance is refused with the gate's own sentence.
- audit_id: rule/mordheim/nipponese-expedition-web/ashigaru--wall-of-steel/mechanic.wall-of-steel
  id: the-stance-with-an-occupied-off-hand-is-refused
  fighters:
    first:
      collection: mordheim
      band_id: nipponese-expedition-web
      profile_id: ashigaru
      main_weapon_id: weapon.spear
      off_hand_id: weapon.dagger
      variant_ids: [stance.wall-of-steel]
      characteristics: {weapon_skill: 2, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  expect_error: "the Wall of Steel spear occupies both hands"

# The printed condition is "if wielding a spear": the declared stance on any other main weapon is
# refused with the gate's own sentence.
- audit_id: rule/mordheim/nipponese-expedition-web/ashigaru--wall-of-steel/mechanic.wall-of-steel
  id: the-stance-without-his-spear-is-refused
