      variant_ids: [stance.wall-of-steel]
      characteristics: {weapon_skill: 2, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  expect_error: "Wall of Steel requires the Ashigaru's actual spear"
