# Closing review: the printed recipient owes a round-0 Fear test and the printed auto-pass means no
# Leadership die is requested for it - the absence of the die is the assertion, since the strict tape
# would fail if the engine asked for one.  The cart's printed characteristics are T8/W4 only, so the
