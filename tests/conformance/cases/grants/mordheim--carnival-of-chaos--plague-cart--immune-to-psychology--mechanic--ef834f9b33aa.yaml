# --- Authored scenarios ---
# Closing review: the printed recipient owes a round-0 Fear test and the printed auto-pass means no
# Leadership die is requested for it - the absence of the die is the assertion, since the strict tape
# would fail if the engine asked for one.  The cart's printed characteristics are T8/W4 only, so the
# other fields of the tape are fixture facts (WS3 S3 I3 A1 Ld7), which is the PENDING[C] datum above.
- audit_id: rule/mordheim/carnival-of-chaos/plague-cart--immune-to-psychology/mechanic.automatic-leadership
  id: the-plague-cart-owes-no-leadership-die-for-the-fear-test
  fighters:
    first:
      trait_overrides: {causes_fear: true}
      characteristics: {weapon_skill: 8, strength: 8, toughness: 3, wounds: 3, initiative: 7, attacks: 1, leadership: 7}
    second:
      collection: mordheim
      band_id: carnival-of-chaos
      profile_id: plague-cart
      characteristics: {weapon_skill: 3, strength: 3, toughness: 8, wounds: 4, initiative: 3, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.wounds: 3, state.first.condition: STANDING, state.second.wounds: 4, state.second.condition: STANDING, state.second.fear_hit_sixes: false}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# Corridor note (entregable 04): the family's named gap was one admitted non-Psychology Leadership
# request via which the wider face could be observed on this bearer. The corridor found it: the
# cursed Danse state is now an admitted supplied condition (catalog/rules/conditions.yaml,
# condition.danse-macabre-controlled, YES/YES), whose recovery re-test round.N.<side>.danse-macabre
# is a Leadership request the duel does NOT route as Psychology. The tape below supplies that state
# on the cart itself; the auto-pass answers it with no die at all and the state clears. The cart's
# non-printed characteristics remain the fixture facts declared above, which is still the PENDING[C]
# datum named in the clause note - no new reading is claimed here.
- audit_id: rule/mordheim/carnival-of-chaos/plague-cart--immune-to-psychology/mechanic.automatic-leadership
  id: the-supplied-danse-state-clears-through-the-non-psychology-route
  fighters:
    first:
      condition_ids: [condition.danse-macabre-controlled]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 8, wounds: 4, initiative: 3, attacks: 1, leadership: 7}
      collection: mordheim
      band_id: carnival-of-chaos
      profile_id: plague-cart
    second:
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 7}
  initial_state: {first: {attacks: 0}, second: {attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  expect_rounds:
    0: {state.first.danse_macabre_controlled: false}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# Correction (2026-11-18): the non-Psychology Leadership face named as missing above is reachable.
# modular/rounds.py:829-838 requests `round.<i>.<label>.crude-belch-ogre.leadership` through
# resolve_local_leadership WITHOUT psychology=True and without fear=, so on that request neither the
# psychology nor the fear short-circuit of leadership.py:141-151 can fire and
# `mechanic.automatic-leadership` is the only tag that suppresses the dice - which separates this
# clause from mechanic.psychology-immunity.  Printed source of the request: Maneaters/Ogres special
# skills, Crude Belch - "A Hero with this 'condition' may unleash his thunderous fumes on all enemies
# engaged in close combat.  Those that do not pass a Ld test suffer a -1 'to hit' modifier for the
# turn."  Worked dice keys: tests/conformance/cases/mechanics/mechanic.crude-belch-ogre.yaml.
# The cart's non-printed characteristics remain the fixture facts already declared above (WS3 S3 I3
# A1 Ld7), which is still the open [C] datum of the clause note - no new reading is claimed here.

# The printed Plague Cart is engaged by an Ogre who unleashes the belch.  The Leadership test the
# belch asks of it is auto-passed before any die is requested, so the strict tape declares NO
# `round.0.first.crude-belch-ogre.leadership` die at all - an implementation that asked for one
# would fail the case - and the cart keeps its unmodified 4+ to hit.
- audit_id: rule/mordheim/carnival-of-chaos/plague-cart--immune-to-psychology/mechanic.automatic-leadership
  id: the-belched-plague-cart-owes-no-leadership-die-and-keeps-its-to-hit
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.crude-belch-ogre]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 5, attacks: 1, leadership: 7}
    second:
      collection: mordheim
      band_id: carnival-of-chaos
      profile_id: plague-cart
      characteristics: {weapon_skill: 3, strength: 3, toughness: 8, wounds: 4, initiative: 3, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.crude-belch-ogre, value: true}
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 4}
    - {key: round.0.second.attack.0.wound, value: 1}
  expect_rounds:
    0: {attacks.1.hit_target: 4, attacks.1.hit: true, attacks.1.wounded: false}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The contrast: the same duel against a hand-built warrior carrying the same fixture characteristics
# but without the auto-pass.  Now the belch Leadership test is rolled - both dice are declared - and
# 6+6 fails it, so the printed -1 'to hit' applies and the same declared 4 misses against a 5+
# target.
- audit_id: rule/mordheim/carnival-of-chaos/plague-cart--immune-to-psychology/mechanic.automatic-leadership
  id: without-the-auto-pass-the-belch-leadership-dice-are-rolled-and-a-failure-costs-the-hit
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.crude-belch-ogre]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 5, attacks: 1, leadership: 7}
    second:
      characteristics: {weapon_skill: 3, strength: 3, toughness: 8, wounds: 4, initiative: 3, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.crude-belch-ogre, value: true}
  rolls:
    - {key: round.0.first.crude-belch-ogre.leadership.0, value: 6}
    - {key: round.0.first.crude-belch-ogre.leadership.1, value: 6}
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 4}
  expect_rounds:
    0: {attacks.1.hit_target: 5, attacks.1.hit: false}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
