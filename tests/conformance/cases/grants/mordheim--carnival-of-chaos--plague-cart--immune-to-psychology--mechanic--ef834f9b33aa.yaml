- audit_id: rule/mordheim/carnival-of-chaos/plague-cart--immune-to-psychology/mechanic.automatic-leadership
  id: the-plague-cart-owes-no-leadership-die-for-the-fear-test
  fighters:
    first:
      trait_overrides: {causes_fear: true}
      characteristics: {weapon_skill: 8, strength: 8, toughness: 3, wounds: 3, initiative: 7, attacks: 1, leadership: 7}
    second:
      collection: mordheim
      band_id: carnival-of-chaos
      profile_id: plague-cart
      characteristics: {weapon_skill: 3, strength: 3, toughness: 8, wounds: 4, initiative: 3, attacks: 1, leadership: 7}
