# --- Authored scenarios ---
# Derived from the printed sentence, this band's own profiles.yaml (fixed_equipment, equipment_lists, the
# Tenants prose), the shared possession channel and the shared equipment decision's sentence family; no
# engine output was consulted.  The second fighter is declared out so the observation is the construction
# decision itself and no duel consequence is claimed for either tape.

- audit_id: rule/mordheim/nipponese-expedition-web/vim-to-mage--tenants-of-the-order/profile.equipment-restrictions
  id: the-printed-staff-and-dagger-are-accepted
  # The printed exception, and nothing else: the Mage carries the walking staff (club) and the dagger his own
  # profile records as fixed equipment.  Declared through the possession channel, and the hand holds the
  # printed walking staff: weapon.club is the catalogue row for that printed club and the only close-combat
  # row this profile's own exception admits besides the dagger.  The engagement starts, which is the
  # printed permission.
  fighters:
    first:
      collection: mordheim
      band_id: nipponese-expedition-web
      profile_id: vim-to-mage
      main_weapon_id: weapon.club
      owned_item_ids: [club, dagger]
    # The checkpoint body is the printed Hatamoto; its Nippon Noble Equipment List carries the sword
    # (Wakizashi) and no mace, so the hand holds the printed sword.  It is declared out, so nothing of its
    # own kit affects the tape.
    second:
      collection: mordheim
      band_id: nipponese-expedition-web
      profile_id: hatamoto
      main_weapon_id: weapon.sword
  duel_context: {charging: [], active_participant: first}
  initial_state: {second: {condition: OUT}}
  expect_initial: {second.condition: OUT}
  expect_final: {rounds_executed: 0, termination_reason: second_out}

- audit_id: rule/mordheim/nipponese-expedition-web/vim-to-mage--tenants-of-the-order/profile.equipment-restrictions
  id: any-item-beyond-the-printed-staff-and-dagger-is-refused
  # The printed prohibition over the whole carried set rather than the active hands: the Mage owns the printed
  # staff and dagger plus a sword, so the item beyond the two the print allows must be refused.  The fragment
  # is the shared profile.equipment-restrictions decision's own sentence ("<item> may not be carried; the
  # printed clause admits only ..."), raised through the bound allowed_kinds (see the KB note in the marker
  # on the extra weapon.mace row).
  fighters:
    first:
      collection: mordheim
      band_id: nipponese-expedition-web
      profile_id: vim-to-mage
      main_weapon_id: weapon.club
      owned_item_ids: [club, dagger, sword]
  expect_error: sword may not be carried; the printed clause admits only weapon.mace, weapon.club, weapon.dagger.

