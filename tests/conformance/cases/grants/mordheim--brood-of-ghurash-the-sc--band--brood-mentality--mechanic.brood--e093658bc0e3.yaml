# --- Authored scenarios ---
# Derived from the printed rule and the recorded contract; no engine output was consulted.  Every
# Brood member suffers Stupidity, so the charging bearer owes its start-of-turn test; the printed
# Leadership bonus is supplied as the current condition the recorded consumer adds it from.
- audit_id: rule/mordheim/brood-of-ghurash-the-sc/band--brood-mentality/mechanic.brood-mentality
  id: the-supplied-bonus-carries-the-stupidity-test
  covers: [brood-mentality--scope--stupidity]
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.brood-mentality]
      trait_overrides: {stupidity: true, stupidity_leadership_bonus: 1}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 6}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 6}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.stupidity.0, value: 6}
    - {key: round.0.first.stupidity.1, value: 1}
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.stupidity_failed: False, state.first_charged: True, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
