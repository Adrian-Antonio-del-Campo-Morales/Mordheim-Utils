# --- Authored scenarios ---
# The printed rule: "If the Barbarian is the warband's leader then he has an effective Leadership
# of 7 for warband members within 6\" and Rout tests" (special-rules.yaml, barbarian--dim-witted,
# grant: profile; its sibling effect mechanic.leader-six is the supply itself and carries its own
# authored file).  This identity is the dim-witted cap the rule adds to that supply: the value
# lent is the printed effective 7 rather than the Barbarian's own printed Leadership 10
# (consumer: modular/leadership.py, where a supplied leader-six provider carrying
# mechanic.dim-witted-leader lends 7 and supplies the printed six-inch radius).  The builds
# mirror the authored leader-six sibling: the borrower is the band's printed elf (profiles.yaml:
# WS4 S3 T3 W1 I5 A1 Ld8) with its required Stupidity supplied as a trait, the provider is the
# printed Barbarian as a nearby same-band participant, and the test under evidence is the elf's
# Stupidity test on its charge.  4+4 = 8 fails the borrowed effective 7 and passes both the elf's
# own 8 and the Barbarian's 10, so the printed cap is the only thing the failure can show.  The
# elf fights with its neutral fist, which still grants the opponent the printed 6+ save.

# Inside the printed six inches the declared borrow tests the effective 7: the total of 8 fails
# and the charge is cancelled, though both the member's own 8 and the Barbarian's printed 10
# would have passed it.
- audit_id: rule/mordheim/adventurers-kaz/barbarian--dim-witted/mechanic.dim-witted-leader
  id: the-barbarian-lends-the-printed-effective-seven-not-his-own-ten
  fighters:
    first:
      collection: mordheim
      band_id: adventurers-kaz
      profile_id: elf
      trait_overrides: {stupidity: true}
    second:
      main_weapon_id: weapon.mace
      characteristics: &dimwit-rule-opponent {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context:
    first_id: first
    second_id: second
    charging: [first]
    active_participant: first
    distances: [[first, barbarian-leader, 6]]
    nearby:
      - participant_id: barbarian-leader
        side_id: first
        condition: standing
        fighter: &dimwit-rule-barbarian {collection: mordheim, band_id: adventurers-kaz, profile_id: barbarian}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.stupidity.leader.barbarian-leader, value: true}
  rolls:
    - {key: round.0.first.stupidity.0, value: 4}
    - {key: round.0.first.stupidity.1, value: 4}
  expect_rounds:
    0: {attacks: [], state.first.stupidity_failed: true, state.first_charged: false, state.engaged: false}
  expect_final: {rounds_executed: 1, termination_reason: disengaged}

# The borrow is optional, and the dim-witted 7 is below the member's own value: declining it
# tests the same total of 8 against the elf's own printed 8, which passes, and the charge strikes
# home.
- audit_id: rule/mordheim/adventurers-kaz/barbarian--dim-witted/mechanic.dim-witted-leader
