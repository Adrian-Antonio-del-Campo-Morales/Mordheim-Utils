# Rule (grade-2a.yaml, hireling.hired-sword.estalian-diestro.rule.rapier, grant profile): "The
# rapier parries and has Barrage: a landed hit that fails to wound grants another attack with a
# cumulative -1 To Hit, capped at needing 6, and each further attack benefits from Barrage" -
# binding weapon.rapier (the catalogue rapier: Strength as user, +1 enemy armour save, parry,
# Barrage; model mechanics/weapon.rapier.yaml).  Hireling family model (README, Hireling
# recipients): the real Diestro through the hireling route (hirelings.hired-sword.2a /
# hireling.hired-sword.estalian-diestro) with the fixture facts (WS3 S3 T3 W2 I5 A1; the printed Ld8
# stays) and his printed kit rapier named in hand (the kit's first close-combat weapon; the kit's
# main gauche and light armour stay owned, not held or worn, so the Main Gauche rule's per-turn
# choice is never requested and no save of his own is rolled).  The opponent is hand-built (WS3 S3
# T3 W3 I2 A1 Ld7, mace, no armour: the rapier's +1 is the only save he has).  The duel is
# uncharged, so the Diestro's Initiative 5 strikes before the opponent's 2.  The control is the
# grade-1b Bard with his kit dagger.  Dice: WS3 against WS3 hits on 4+ (5+ under one Barrage
# point), S3 wounds T3 on 4+.  Barrage is optional, so the continuation is a declared decision
# (round.0.first.attack.0.barrage) and its dice carry the .barrage.1 key.

# The rapier's printed +1 to the enemy save: the unarmoured opponent is granted a 6+ and the die
# 6 saves the wound.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.estalian-diestro.rule.rapier/weapon.rapier
  id: the-diestros-rapier-grants-the-wounded-enemy-a-six-plus-save
  fighters:
    first: &diestro
      collection: mordheim
      band_id: hirelings.hired-sword.2a
      profile_id: hireling.hired-sword.estalian-diestro
      main_weapon_id: weapon.rapier
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second: &opponent
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: &uncharged {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.armour, value: 6}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.saved: true, attacks.0.damage: 0, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# One face below the granted 6+: the 5 fails and the wound lands.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.estalian-diestro.rule.rapier/weapon.rapier
  id: the-granted-save-fails-on-five
  fighters:
    first: *diestro
    second: *opponent
  duel_context: *uncharged
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.armour, value: 5}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.saved: false, attacks.0.damage: 1, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The rapier parries: the Diestro's own strike misses first (Initiative 5), then the opponent's
# hit on a 4 is beaten by the parry die 5.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.estalian-diestro.rule.rapier/weapon.rapier
  id: the-diestro-parries-with-the-rapier
  fighters:
    first: *diestro
    second: *opponent
  duel_context: *uncharged
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 4}
    - {key: round.0.second.attack.0.parry, value: 5}
  expect_rounds:
    0: {attacks.1.parried: true, attacks.1.wounded: false, state.first.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# Barrage: the landed 4 fails to wound (1), the printed continuation is taken, and the next attack
# is one point harder to land: the identical 4 now misses the 5+ and the chain ends unwounded.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.estalian-diestro.rule.rapier/weapon.rapier
  id: barrage-continues-one-point-harder-after-a-hit-that-fails-to-wound
  fighters:
    first: *diestro
    second: *opponent
  duel_context: *uncharged
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.attack.0.barrage, value: true}
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 1}
    - {key: round.0.first.attack.0.barrage.1.hit, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.wounded: false, state.second.wounds: 3, state.first.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The control (Bard, kit dagger): the same landed 4 and failed wound offer no Barrage decision, and
