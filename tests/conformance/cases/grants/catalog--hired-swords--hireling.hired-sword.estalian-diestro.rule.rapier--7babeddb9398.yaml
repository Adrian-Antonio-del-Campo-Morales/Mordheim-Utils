  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The printed grant belongs to the Diestro's profile; selecting it on a hireling of another package
# is refused by the compiler (the band-only fragment).
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.estalian-diestro.rule.rapier/weapon.rapier
  id: the-rule-is-refused-on-a-hireling-outside-the-diestros-package
  fighters:
    first:
      <<: *control
      special_rule_ids: [hireling.hired-sword.estalian-diestro.rule.rapier]
    second: *opponent
  expect_error: "special rule is not available to hirelings.hired-sword.1b"
