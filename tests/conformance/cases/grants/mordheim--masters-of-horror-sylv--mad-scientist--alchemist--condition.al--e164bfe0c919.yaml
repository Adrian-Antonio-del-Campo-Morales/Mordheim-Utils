# Discrimination note (2026-11-16, reviewed): not a duplication, so the KB is kept and no
#   single-source change applies.  This is the documented supplied-condition pattern
#   (docs/reference/knowledge-base.md, Reason codes): the band rule mad-scientist--alchemist binds
#   condition.alchemist-resilience with `grant: none` only to name the printed rule that produces the
#   condition; it is never a compile route.  The condition's one operator is its row in
#   sources/knowledge/catalog/rules/conditions.yaml, reached only through the supplied condition_ids
#   entry these scenarios declare, so the scenarios test it through its condition id, as intended.
#   Removing the band binding cannot change a build; removing the catalogue row refuses the build.  The
#   only place the band rule could become observable is the recipient gate, which compiler.py hard-codes
#   (compile_fighter's supplied-condition checks on band/profile/kind) instead of reading this rule's
#   applies_to; that is a compiler choice, not a KB duplicate.
# Record: sources/knowledge/bands/mordheim/masters-of-horror-sylv/special-rules.yaml
# AUTHORED: Scenarios moved here on 2026-11-16 from the placeholder identity rule/mordheim/masters-of-
#   horror-sylv/mad-scientist--alchemist/unimplemented.masters-of-horror-sylv.special.alchemist, whose
#   KB effect is now unbound (a supplied-condition split: the start-of-game potion roll stays unbound,
#   each potion is a bound condition); the duel behaviour they exercise is this identity's.  Inputs,
#   dice and expectations are unchanged by the move; each scenario's own comments carry its derivation
#   and may still name the placeholder record they were authored against.  The Potion of Resilience
#   raises the printed Mad Scientist's Toughness by one; the same duelist without a supplied potion
#   keeps its base characteristics (the shared control of the potion identities), and two potions of the
#   same table in one build are refused.  REVIEWED still requires manual semantic review.

# --- Authored scenarios ---

- audit_id: rule/mordheim/masters-of-horror-sylv/mad-scientist--alchemist/condition.alchemist-resilience
  id: the-potion-of-resilience-raises-the-drinkers-toughness-by-one
  # "1: Potion of Resilience - Add +1 to Toughness for duration of game."
  fighters:
    first:
      collection: mordheim
      band_id: masters-of-horror-sylv
      profile_id: mad-scientist
      main_weapon_id: weapon.mace
      condition_ids: [condition.alchemist-resilience]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 4, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 5, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  initial_state: {second: {condition: OUT}}
  maximum_rounds: 1
  expect_initial: {first.toughness: 4}
  expect_final: {rounds_executed: 0, termination_reason: second_out}

- audit_id: rule/mordheim/masters-of-horror-sylv/mad-scientist--alchemist/condition.alchemist-resilience
  id: two-potions-of-the-same-table-in-one-build-are-refused
  # The printed table is a game-start D6 the Scientist consults once, so only one result is drawn.  The
  # supplied-result resolver raises its own sentence when two results of this table are declared in one
  # build; that sentence is the resolver's, not an invented diagnostic.
  fighters:
    first:
      collection: mordheim
      band_id: masters-of-horror-sylv
      profile_id: mad-scientist
      main_weapon_id: weapon.mace
      condition_ids: [condition.alchemist-resilience, condition.alchemist-strength]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 4, attacks: 1}
  expect_error: "choose only one supplied result of the same potion table"

- audit_id: rule/mordheim/masters-of-horror-sylv/mad-scientist--alchemist/condition.alchemist-resilience
  id: without-a-supplied-potion-the-same-duelist-keeps-its-base-characteristics
  # The control for the four grants: the identical duelist with no supplied result reads its base
  # characteristics, so the grants above are attributable to the drawn potion and not to the build shape.
  fighters:
    first:
      collection: mordheim
      band_id: masters-of-horror-sylv
      profile_id: mad-scientist
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 4, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 5, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  initial_state: {second: {condition: OUT}}
  maximum_rounds: 1
  expect_initial: {first.strength: 3, first.toughness: 3, first.wounds: 2, first.initiative: 4}
  expect_final: {rounds_executed: 0, termination_reason: second_out}
