#
# AUTHORED: 4 scenarios read both printed sentences on the band's Troll Slayer.  Against
# the Toughness-6 boundary the attacker's Strength 3 normally needs 5+, so a declared wound roll of
# 4 wounds with the grant and fails without it; against a Toughness-2 opponent a declared roll of 3
# still wounds, so the printed retention of a naturally easier target is asserted; and against the
# same Toughness-6 opponent wearing armour the effective Strength of 6 puts the armour target at 7,
# so no armour die is declared and the wound stands, which the strict tape enforces (a raw-Strength
# basis would ask for a 4+ save that is absent from the declaration).  That armour reading is the
# one recorded by editorial-monster-slayer-armour.yaml for this publication (result.target 7,
# result.eligible false, no roll).  REVIEWED still requires manual semantic review.

