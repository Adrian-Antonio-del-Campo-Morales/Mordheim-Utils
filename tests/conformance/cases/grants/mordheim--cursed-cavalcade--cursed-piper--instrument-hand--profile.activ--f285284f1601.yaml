# Printed text (special-rules.yaml, Instrument Hand): "The hand holding the instrument is not available
# for a weapon: the Piper may use at most one one-handed weapon and no double-handed weapon."  The
# recipient is the band's own Cursed Piper (cursed-cavalcade/cursed-piper, a Hero with the printed W1).
# The admission uses the corpus's construction-only shape (no charge, the bearer out of action before the
# first phase, so Danse Macabre and every die stay unreached).

# A double-handed weapon fills both hands; the instrument hand is never free for it.
- audit_id: rule/mordheim/cursed-cavalcade/cursed-piper--instrument-hand/profile.active-weapon-restrictions
  id: cursed-piper-with-a-double-handed-weapon-is-refused
  fighters:
    first:
      collection: mordheim
      band_id: cursed-cavalcade
      profile_id: cursed-piper
      main_weapon_id: weapon.double-handed-weapon
  expect_error: "weapon.double-handed-weapon may not be used by cursed-cavalcade/cursed-piper"

# The token is the hand count, not one named item: a halberd is refused the same way.
- audit_id: rule/mordheim/cursed-cavalcade/cursed-piper--instrument-hand/profile.active-weapon-restrictions
