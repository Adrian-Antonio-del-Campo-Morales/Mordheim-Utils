# Hireling family model (P0, 2026-11-17).  The recipient is the printed Dark Jester compiled through the
# hireling route (hirelings.dramatis-personae.2a / hireling.dramatis.the-dark-jester-in-mordheim) with
# the fixture facts (WS3 S3 T3 W2 I5 A1; the printed Ld7 stays) and his printed skeleton hobby horse,
# the canonical club (weapon.club, the kit's first close-combat weapon; the sack of spikes stays owned).
# His printed Babbling Banter is granted by the profile itself, so the build selects nothing.  His other
# printed abilities add no die here: Leap, Acrobat, Jump Up and Lightning Reflexes are movement or
# order rules (he charges, so he strikes first anyway), Sidestepper and Trip are the two tricks the
# chooser offers beside the banter and are declined, Loner is out of scope.  The chooser offers the
# dodge, the banter and the trip in that order (`round.0.first.jester-trick.<slot>`) and stops at the
# first acceptance.  The opponent is hand-built (WS3 S3 T3 W3 I2 A1 Ld7, mace): WS3 against WS3 hits on
# 4+, so a 3 and a 4 are the boundary faces; every wound roll is a natural 1 so no save or injury die
# follows.  The control is the grade-1b Bard, compiled through the same route, who is offered no trick.

# The Jester babbles: his 3 hits (target 3) and his bewildered opponent's 4 misses (target 5).
- audit_id: rule/catalog/dramatis-personae/hireling.dramatis.the-dark-jester-in-mordheim.rule.babbling-banter/babbling-banter
  id: the-babbling-jester-hits-on-three-and-is-hit-only-on-five
  fighters:
    first:
      &jester
      collection: mordheim
      band_id: hirelings.dramatis-personae.2a
      profile_id: hireling.dramatis.the-dark-jester-in-mordheim
      main_weapon_id: weapon.club
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      &jester-opponent
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.jester-trick.dodge_trick_active, value: false}
    - {key: round.0.first.jester-trick.banter_trick_active, value: true}
  rolls:
    - {key: round.0.first.attack.0.hit, value: 3}
    - {key: round.0.first.attack.0.wound, value: 1}
    - {key: round.0.second.attack.0.hit, value: 4}
  expect_rounds:
    0: {state.first.banter_trick_active: true, attacks.0.hit_target: 3, attacks.0.hit: true,
        attacks.1.hit_target: 5, attacks.1.hit: false, state.first.wounds: 2, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

