# Real recipient (2026-11-16): the same duel as the-toughness-test-stands-him-back-up, but the
# bearer is built as the printed Pit Fighters Pit King profile (mordheim/pit-fighters/pit-king),
# with the band rule selected through special_rule_ids [band--pit-fighter-skill-force-of-will]
# instead of injecting mechanic.force-of-will into a hand-built fighter; the explicit
# characteristics keep that scenario's dice model. The profile's equipment list does not offer the
# original weapon, so it carries weapon.axe; no die of the declared tape depends on that swap.
- audit_id: rule/mordheim/pit-fighters/band--pit-fighter-skill-force-of-will/mechanic.force-of-will
  id: the-toughness-test-stands-him-back-up-as-the-real-pit-king
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      collection: mordheim
      band_id: pit-fighters
      profile_id: pit-king
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 2, attacks: 1}
      main_weapon_id: weapon.axe
      special_rule_ids: [band--pit-fighter-skill-force-of-will]
  duel_context:
    charging: [first]
    active_participant: first
  maximum_rounds: 1
  rolls:
  - {key: round.0.first.attack.0.hit, value: 4}
  - {key: round.0.first.attack.0.wound, value: 4}
  - {key: round.0.first.attack.0.injury.0, value: 5}
  - {key: round.0.first.attack.0.force-of-will.rescue, value: 2}
  - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 1, state.second.condition: STANDING, state.second.wounds: 1, state.second.force_of_will_active: true}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
