# --- Authored scenarios ---
# Derived from the printed rule and the recorded contract; no engine output was consulted.  The rescue
# test is the printed D6 against Toughness, offered when the last Wound is lost.
- audit_id: rule/mordheim/pit-fighters/band--pit-fighter-skill-force-of-will/mechanic.force-of-will
  id: the-toughness-test-stands-him-back-up
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.force-of-will]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.injury.0, value: 5}
    - {key: round.0.first.attack.0.force-of-will.rescue, value: 2}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 1, state.second.condition: STANDING, state.second.wounds: 1,
        state.second.force_of_will_active: true}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

