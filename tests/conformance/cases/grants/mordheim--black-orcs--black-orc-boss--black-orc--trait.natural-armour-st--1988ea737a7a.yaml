      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 4, strength: 3, toughness: 4, wounds: 3, initiative: 4, attacks: 1}
    second:
      collection: mordheim
      band_id: black-orcs
      profile_id: black-orc-boss
      main_weapon_id: weapon.axe
      off_hand_id: defence.shield
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
