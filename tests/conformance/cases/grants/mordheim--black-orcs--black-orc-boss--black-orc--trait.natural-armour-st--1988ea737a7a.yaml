#
# PARTIAL: [D] 2 scenarios cover the printed "may be combined with other equipment to improve
# it": the Boss carrying a shield saves the unsaved wound on the improved five, and the four is not
# saved, so the natural save really is improved by the carried equipment rather than left at six.
# Bearer is the printed Black Orc Boss profile, which receives the natural save from its own profile
# rule.  The one open face is a NORMATIVE conflict between two printed rows, not a wiring gap: this row
# prints "This save may be combined with other equipment to improve it", while the leather suit's own
# row prints "Toughened leathers cannot be combined with the effects of any other armour except a
# helmet or buckler" (catalog/mechanics/close-combat.yaml armour.toughened-leathers; see its own origin
# cases/mechanics/armour.toughened-leathers.yaml, and the Shaggy Hide clarification that the register
# note of the sibling save clause applies to every bearer of this flag).  Until the rules owner settles
# which row governs the composition, both candidate expectations (hide improves to five, or the
# leather's own refusal keeps six) are guesses, so no leather-over-hide build is authored.  The other
# equipment kind is authorable and already evidenced: the sibling clause trait.natural-armour-save of
# this same profile authors "worn-light-armour-raises-the-boss-hide-to-five" with
# armour_id: armour.light-armour, so a second armour suit under this clause would restate that
# observation under another covers label and evidence nothing new.  Separate from this blocker, the
# implementation defect these two tapes detect is the compiled binding that carries the
# natural_armour_stacks flag: without it the shield-improved five is never offered.  REVIEWED still
# requires manual semantic review.

# --- Authored scenarios ---
# Derived from the printed sentence and the recorded contract; no engine output was consulted.
# The attacker's mace carries no armour-save modifier, so the shield's improvement is read as the
# printed 5+; its Concussion conversion stays outside this evidence because the failed save declares
# the injury die 1, below the printed 2-4 band.

