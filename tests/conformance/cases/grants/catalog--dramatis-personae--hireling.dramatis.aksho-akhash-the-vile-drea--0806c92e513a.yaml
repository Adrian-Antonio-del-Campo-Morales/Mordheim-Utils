# Printed text (dramatis-personae/grade-2a.yaml, Daemonic Flesh): "A 5+ base armour save is never
# modified and is entirely negated by magical or blessed weapons and spells."  This binding is the
# save value alone (trait.natural-armour-save, parameters value 5); its unmodifiable flag is the
# sibling trait.natural-armour-unmodified (...699721de2e6a) and the magical negation the sibling
# mechanic.daemonic-flesh binding.  Compiler: the trait binding lands in traits as natural_armour_save
# (compiler.py ~495) and is projected onto CompiledFighter.natural_armour_save (compiler.py ~1434,
# ~1490; Aksho has no natural_armour_stacks, so his compiled armour_save stays the empty 7);
# tests/construction/test_hireling_admission.py::test_daemonic_flesh_is_armour... asserts the same
# projection for this profile.  Engine: phases.py armour_target (~621-640) takes min(armour, natural)
# and resolve_armour asks the die round.<i>.<attacker>.attack.<n>.armour only when the target is 6 or
# better; modular/attacks.py ~470-480 rolls it.
# Hireling family model (README, Hireling recipients): the recipient is the printed Aksho'akhash the
