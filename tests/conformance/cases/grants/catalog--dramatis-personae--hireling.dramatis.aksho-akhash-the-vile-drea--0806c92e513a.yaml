# Strength 3 wounds Toughness 3 on 4+; wound dice are fours (never a six, so no critical die joins).
# Aksho contributes no swing (initial_state).  The control is the grade-1b Bard (dagger, no armour
# worn); the refusal selects this rule on the Bard.

