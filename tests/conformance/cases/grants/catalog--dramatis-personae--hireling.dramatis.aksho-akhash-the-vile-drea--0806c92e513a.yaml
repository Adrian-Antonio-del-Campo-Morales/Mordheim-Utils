# hireling.dramatis.aksho-akhash-the-vile-dreadwing-lord-of-the-carrion-throne) with the fixture
# facts (WS3 S3 T3 W2 I5 A1; the printed Ld10 stays); his kit is his innate natural attacks and the
# rule is granted by the profile, so nothing is selected.  The opponent is the hand-built fixture
