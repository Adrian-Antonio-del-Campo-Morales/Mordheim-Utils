# Printed text (grade-1b.yaml, Tomb Robber / Excellent Reflexes; Town Cryer 19 p.21): "The Tomb
# Robber has a special 5+ save against any attack, including close combat, traps and spells.  If he
# learns Dodge this improves to 4+."  The grant is profile; the binding is mechanic.excellent-reflexes
# (execution.yaml: effect-set ward_save 5, tag mechanic.excellent-reflexes; model file
# cases/mechanics/mechanic.excellent-reflexes.yaml).  Compiler: the mechanic's ward_save merges into
# global_effects.ward_save.  Engine: modular/attacks.py ~733-747 prepares the special save after a
# failed or absent armour save; contexts.py _supplied_ward (~618-627) reads the tag; phases.py
# resolve_special_save (~669-673) asks round.<i>.<attacker>.attack.<n>.special.ward while the ward
# is 6 or better.
# Hireling family model (README, Hireling recipients): the recipient is the printed Tomb Robber
# compiled through the hireling route (hirelings.hired-sword.1b / hireling.hired-sword.tomb-robber)
# with the fixture facts (WS3 S3 T3 W2 I5 A1; the printed Ld7 stays); his kit's first close-combat
# weapon, the sword, is named (the crossbow pistol and rope and hook stay owned), so every enemy hit
# is followed by his sword's parry die, declared a one; he wears no armour, so no armour die is asked
# and the special save is the next request after the wound.  He contributes no swing
# (initial_state).  The attacker is hand-built (mace, WS3 S3 T3 W3 I2 A1 Ld7): 4+ to hit, 4+ to
# wound (fours, never a six).  The duel is uncharged.  The control is the grade-1b Bard (dagger,
# nothing worn); the refusal selects this rule on the Bard.

# The compiled Tomb Robber carries the 5+ ward and the five turns the unsaved wound.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.tomb-robber.rule.excellent-reflexes/mechanic.excellent-reflexes
  id: the-tomb-robbers-five-plus-special-save-turns-the-wound-on-five
  fighters:
    first:
      &attacker
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
    second:
      &tomb-robber
      collection: mordheim
      band_id: hirelings.hired-sword.1b
      profile_id: hireling.hired-sword.tomb-robber
      main_weapon_id: weapon.sword
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
  initial_state: {second: {attacks: 0}}
  duel_context: &uncharged {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    # The kit sword parries; a one does not beat the four.
    - {key: round.0.first.attack.0.parry, value: 1}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.special.ward, value: 5}
  expect_fighters:
    second.global_effects.ward_save: 5
  expect_rounds:
    0: {attacks.0.parried: false, attacks.0.wounded: true, attacks.0.saved: true, attacks.0.damage: 0, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# One face below the 5+ fails and the wound lands.
