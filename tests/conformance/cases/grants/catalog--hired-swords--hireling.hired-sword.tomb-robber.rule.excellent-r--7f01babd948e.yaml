# The printed grant belongs to the Tomb Robber's profile; selecting it on another hireling of the same
# package is refused by the eligibility gate.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.tomb-robber.rule.excellent-reflexes/mechanic.excellent-reflexes
  id: the-rule-is-refused-on-a-hireling-outside-its-printed-profile
  fighters:
    first: *attacker
    second:
      <<: *control
      special_rule_ids: [hireling.hired-sword.tomb-robber.rule.excellent-reflexes]
  expect_error: "special rule is not available to hirelings.hired-sword.1b"
