# Real recipient (2026-11-16): the band's printed Dragon Monk is built from the band package bare-handed
# (characteristics overridden only to keep the dice math), so the profile's Art of Silent Death grant
# (this row and, redundantly, its combat_traits; see the header note) supplies the 5+ critical.  The
# profile's Unarmed Fighting adds a second attack, which misses on a declared 1.
# Unarmed Fighting also removes the bare-hand penalty, so the unarmoured target is offered no armour save.
- audit_id: rule/mordheim/battle-monks-of-cathay/dragon-monks--art-of-silent-death/skill.unarmed-critical-strikes
  id: the-printed-dragon-monk-criticals-on-an-unarmed-five
  fighters:
    first:
      collection: mordheim
      band_id: battle-monks-of-cathay
      profile_id: dragon-monks
      main_weapon_id: weapon.fist
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.1.hit, value: 1}
    - {key: round.0.first.attack.0.wound, value: 5}
    - {key: round.0.first.attack.0.critical, value: 2}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.critical: true, attacks.0.damage: 2, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
