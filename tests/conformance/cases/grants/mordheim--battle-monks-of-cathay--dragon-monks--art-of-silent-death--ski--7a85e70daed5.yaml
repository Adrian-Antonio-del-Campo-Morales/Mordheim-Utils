# --- Authored scenarios ---
# The origin binds skill.unarmed-critical-strikes, whose engine threshold branch
# additionally requires the fist, which is exactly the printed quarter-staff rider: with
# a staff only the unarmed attacks critical on 5+.
- audit_id: rule/mordheim/battle-monks-of-cathay/dragon-monks--art-of-silent-death/skill.unarmed-critical-strikes
  id: an-unarmed-five-is-a-critical
  fighters:
    first:
      main_weapon_id: weapon.fist
      skill_ids: [skill.unarmed-critical-strikes]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 5}
    - {key: round.0.first.attack.0.critical, value: 2}
    - {key: round.0.first.attack.0.armour, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.critical: True, attacks.0.damage: 2, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
