# The promoted Axe Hurler may take a Shooting skill.
- audit_id: rule/mordheim/dwarf-slayer-cult-web/axe-hurlers--born-marksmen/compiler.promoted-hero-skill-access
  id: the-promoted-axe-hurler-passes-the-access-gate-for-a-shooting-skill
  fighters:
    first:
      collection: mordheim
      band_id: dwarf-slayer-cult-web
      profile_id: axe-hurlers
      variant_ids: [promotion.hero]
      skill_ids: [skill.quick-shot]
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  # Every printed Shooting skill is a registry mechanic_exclusion, so no Shooting build compiles:
  # the promoted access is evidenced by diagnostic order — the access gate is passed and the build
  # stops only at the later runtime-exclusion sentence (recorded in TODO.md).
  expect_error: "mechanics are outside the one-against-one runtime: ['skill.quick-shot']"

# The same Axe Hurler without the promotion has no Shooting access.
- audit_id: rule/mordheim/dwarf-slayer-cult-web/axe-hurlers--born-marksmen/compiler.promoted-hero-skill-access
  id: the-unpromoted-axe-hurler-is-refused-a-shooting-skill
  fighters:
    first:
      collection: mordheim
      band_id: dwarf-slayer-cult-web
      profile_id: axe-hurlers
      skill_ids: [skill.quick-shot]
  expect_error: "skills are not available to dwarf-slayer-cult-web/axe-hurlers: ['skill.quick-shot']"

# The grant opens the Shooting list alone: a Combat skill is refused to the promoted Axe Hurler.
- audit_id: rule/mordheim/dwarf-slayer-cult-web/axe-hurlers--born-marksmen/compiler.promoted-hero-skill-access
