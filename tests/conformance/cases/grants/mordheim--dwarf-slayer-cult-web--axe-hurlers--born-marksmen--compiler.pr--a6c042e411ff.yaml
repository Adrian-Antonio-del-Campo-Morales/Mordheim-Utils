# Printed text (special-rules.yaml, Born Marksmen): "If an Axe Hurler rolls a 'That Lad's Got Talent'
# as an advancement, he may always choose Shooting skills as one of his two skill list choices."  The
# recipient is the band's own Axe Hurler (dwarf-slayer-cult-web/axe-hurlers, a Henchman with no printed
# skill list); the promotion is the supplied result `variant_ids: [promotion.hero]` the runner converts
