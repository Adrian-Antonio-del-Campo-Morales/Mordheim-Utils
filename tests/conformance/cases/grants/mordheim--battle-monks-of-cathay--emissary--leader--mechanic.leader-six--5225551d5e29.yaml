# Governing rulings: docs/decisions/design-rulings.md
#
# AUTHORED: the printed supplied-leader contract of this leader profile carries
#   5 scenarios: a same-band borrower that adopts the supplied Leadership for its own
#   required test and passes with it; the same borrower declining the optional use; a
#   supplied leader one inch beyond the printed radius; a supplied leader that is not
#   standing; and the same profile supplied on the opposing side.  The borrower's own
#   Leadership test is the Fear test of the charge it receives, whose printed consequence
#   for a failure is explicit in state.second.fear_hit_sixes.

# --- Authored scenarios ---
# The supplied leader is a nearby participant of the borrower's own side and band; the
# leader is the printed `emissary` profile (Leadership 8) and its printed borrow radius is
# 6 inches.  The borrower is the band's printed `soldiers` profile (Leadership 7): the
# band's `raging-peasants` profile carries its own printed denial of the leader rule
# (raging-peasants--mob, no-leader-benefit, asserted in the mob scaffold of this band), so
# the recipient has to be a warrior that the leader rule reaches.
#
# What each tape discriminates is the total the declared dice produce: 4 + 4 = 8 passes
# against the supplied leader's 8 and fails against the borrower's own 7, so a tape's
# expectation below follows from which value the test used.  The Fear test of the charge
# the borrower receives is that Leadership test, and its printed consequence for a failure
# is explicit in state.second.fear_hit_sixes.
- audit_id: rule/mordheim/battle-monks-of-cathay/emissary--leader/mechanic.leader-six
  id: a-supplied-leader-at-six-inches-lends-his-leadership
  fighters:
    first:
      trait_overrides: {causes_fear: true}
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 10, attacks: 1, leadership: 7}
    second: {collection: mordheim, band_id: battle-monks-of-cathay, profile_id: soldiers}
  duel_context:
    charging: [first]
    active_participant: first
    nearby:
      - participant_id: leader
        side_id: second
        condition: standing
        fighter:
          collection: mordheim
          band_id: battle-monks-of-cathay
          profile_id: emissary
    distances:
      - [second, leader, 6]
  decisions:
    - {key: round.0.second.fear.charged.leader.leader, value: true}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.fear.charged.0, value: 4}
    - {key: round.0.second.fear.charged.1, value: 4}
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.wounds: 3, state.first.condition: STANDING, state.second.wounds: 1, state.second.condition: STANDING, state.second.fear_hit_sixes: false}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

