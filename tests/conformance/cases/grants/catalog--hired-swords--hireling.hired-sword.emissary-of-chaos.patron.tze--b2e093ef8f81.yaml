# Rule (grade-2a.yaml, hireling.hired-sword.emissary-of-chaos.patron.tzeentch, grant selectable): "The
# Tzeentch Emissary also has Academic skill access; spell casting is excluded" - bindings
# mechanic.emissary-tzeentch (identity tags) and profile.skill-access {category: academic}.  The printed
# Emissary access is Combat and Strength (profile skill_access).  Hireling conventions (README, Hireling
# recipients): band hirelings.hired-sword.2a, the real profile, the fixture characteristics, the printed
# kit's default weapon (sword) taken by omission.  An Emissary needs exactly one patron
# (eligibility/index.ts, requiredInitial: "an Emissary of Chaos requires exactly one printed patron").

# Admission: the Tzeentch Emissary declares an Academic skill (skill.haggle).  The access gate admits it
# (Academic is in the Tzeentch access), and the build is then refused downstream by the runtime exclusion
# of every Academic skill - a different sentence from the access gate's, which is the evidence that the
# gate did not refuse.  See the wrinkle in the header.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.emissary-of-chaos.patron.tzeentch/profile.skill-access
  id: the-tzeentch-emissary-passes-the-access-gate-with-an-academic-skill
  fighters:
    first:
      collection: mordheim
      band_id: hirelings.hired-sword.2a
      profile_id: hireling.hired-sword.emissary-of-chaos
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
      special_rule_ids: [hireling.hired-sword.emissary-of-chaos.patron.tzeentch]
      skill_ids: [skill.haggle]
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  expect_error: "mechanics are outside the one-against-one runtime: ['skill.haggle']"

# Control: the same Emissary under another patron (Khorne) declaring the same Academic skill is refused
