# --- Authored scenarios ---
# Derived from the printed rule text, the band package and the recorded semantic contract; no engine
# output was consulted.  The Fear source is the printed Chainsaw Sword grant ("A model bearing a
# Chainsaw Sword causes Fear"); because that bearer also causes Fear, the charging side takes no
# charge test, so the only Psychology request this setup can make is the charged warrior's Fear
# test - the one the immunity removes.  Both warriors fight unarmed, each striking with the printed
# Attacks value of its own profile, and every strike is declared as a natural 1, so the round
# reports nothing but that request.

- audit_id: rule/mordheim/dwarf-slayer-cult-web/band--slayer-rules/mechanic.psychology-immunity
  id: the-immune-warrior-is-not-tested-for-fear
  covers: [psychology-immunity--scope--psychology-immunity]
  fighters:
    first:
      main_weapon_id: weapon.chainsaw-sword
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 7, attacks: 1, leadership: 7}
    second: {collection: mordheim, band_id: dwarf-slayer-cult-web, profile_id: troll-slayers}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.wounds: 3, state.second.wounds: 1, state.second.condition: STANDING}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

- audit_id: rule/mordheim/dwarf-slayer-cult-web/band--slayer-rules/mechanic.psychology-immunity
  id: a-band-mate-without-the-immunity-is-tested
  covers: [psychology-immunity--scope--psychology-immunity]
  fighters:
    first:
      main_weapon_id: weapon.chainsaw-sword
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 7, attacks: 1, leadership: 7}
    second: {collection: mordheim, band_id: dwarf-slayer-cult-web, profile_id: rememberer}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.fear.charged.0, value: 1}
    - {key: round.0.second.fear.charged.1, value: 1}
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.wounds: 3, state.second.wounds: 1, state.second.condition: STANDING}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# Psychology coverage: printed "completely immune to all psychology ... This includes Hatred, Frenzy &
# Stupidity."  Each covered psychology is supplied to the printed Troll Slayer, and the same supply
# to the non-immune band-mate Rememberer is the control showing the supply does act.  The opponent is a
# hand-built fixture without Fear, so no Fear request exists in these rounds.

# Stupidity: the supplied stupidity (the disability.6 state the sibling identity uses) owes a test on
# the bearer's own turn; the immune Troll Slayer takes none, so its tape holds only its own attack.
- audit_id: rule/mordheim/dwarf-slayer-cult-web/band--slayer-rules/mechanic.psychology-immunity
  id: the-immune-troll-slayer-takes-no-stupidity-test
  covers: [psychology-immunity--scope--psychology-coverage]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 10, attacks: 1, leadership: 7}
    second: {collection: mordheim, band_id: dwarf-slayer-cult-web, profile_id: troll-slayers}
  initial_state: {first: {attacks: 0}, second: {resources_spent: [disability.6]}}
  duel_context: {charging: [], active_participant: second}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.wounds: 3, state.second.wounds: 1, state.second.stupidity_failed: false, state.second.condition: STANDING}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# Control: the Rememberer under the same supply is tested; 5+6 = 11 fails against its printed Ld 8,
