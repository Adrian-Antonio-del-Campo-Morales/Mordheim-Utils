# Clause: psychology-immunity--scope--kit-restrictions (scope: NO)
# Outside the admitted clause scope since 2026-11-16 (KB set it to NO: it duplicates no-armour-no-toys on the profile.equipment-restrictions effect, which refuses the kit).
#   Earlier note: KB-FIX - the clause sits on the wrong effect and
#   duplicates another clause.  Printed "No Armour, No Toys! Slayers may never use armour of any kind, nor
#   cloaks that provide a constant save bonus (though they may use Lucky Charms). Also, they may not use any
#   missiles that aren't thrown, nor may they learn magic."  That prohibition is carried by the same rule's
#   other effect, profile.equipment-restrictions (forbids armour, constant-save-cloak, non-thrown-ranged),
#   whose clause no-armour-no-toys already owns it, with its refusals evidenced in
#   grants/mordheim--dwarf-slayer-cult-web--band--slayer-rules--profile.equipment-r--ef4897dc8244.yaml
#   ("armour is forbidden for ...", '"constant-save-cloak" is forbidden for ...', '"non-thrown-ranged" is
#   forbidden for ...').  mechanic.psychology-immunity grants no item check, so a refusal declared under
#   this identity would be produced by the sibling effect, not by this one.  Recommended KB change:
#   sources/knowledge/bands/mordheim/dwarf-slayer-cult-web/special-rules.yaml, band--slayer-rules, effect
#   mechanic.psychology-immunity: remove clause psychology-immunity--scope--kit-restrictions (merge it into
#   profile.equipment-restrictions/no-armour-no-toys) or set it to scope NO as a duplicate.  The mirror
#   placement looks swapped too: the psychology clause deathwish--scope--deathwish-psychology sits on
#   profile.equipment-restrictions (not this file's identity; recorded, not changed).
#
# Clause: psychology-immunity--scope--psychology-coverage (scope: YES)
# AUTHORED[psychology-immunity--scope--psychology-coverage]: printed "This includes Hatred, Frenzy &
#   Stupidity."  6 scenarios, one pair per named psychology: (Stupidity) the printed Troll Slayer under the
#   supplied disability.6 stupidity takes no test while the Rememberer under the same supply is tested and
#   fails; (Frenzy) the Troll Slayer with the supplied frenzy trait stays unfrenzied and strikes once while
#   the Rememberer with the same trait doubles its A1; (Hatred) a first-round miss is not re-rolled for a
#   warrior carrying mechanic.psychology-immunity with skill.hatred, and is re-rolled for the same warrior
#   without the immunity.  The Hatred pair is hand-built because no printed profile of this band carries
#   both (the band's Hatred names the Rememberer, Stubbles and Axe Hurlers; the immunity binding names
#   giant-slayer, doomseeker and troll-slayers, consistent with the Hatred rule's "ignored if the warrior
#   later becomes Immune to Psychology") and construction refuses skill.hatred on the Slayer ranks.
#   Implemented in packages/python/combat-engine/mordheim_combat/modular: state.py (frenzy is off under
#   mechanic.psychology-immunity), state.py/psychology.py (stupidity), contexts.py (Hatred needs
#   psychology_allowed).
#
# Clause: psychology-immunity--scope--psychology-immunity (scope: YES)
# AUTHORED[psychology-immunity--scope--psychology-immunity]: [C] 2 scenarios evidence the printed immunity
#   (2026-11-16: the Stupidity, Hatred and Frenzy variants named below are authored under the
#   psychology-coverage clause, so nothing is pending for this clause.)
#   through the one Psychology request this
#   setup can make - the round-0 Fear test of the charged warrior.  In the immune scenario the
#   tape declares no Fear die at all, and the strict tape consumes exactly the declared dice and
#   rejects both an undeclared request and an unused entry, so a test the engine still asked for
#   fails the case instead of passing quietly - the absence is the assertion.
#   In the contrast scenario the non-immune band-mate rememberer is charged the same way and its
#   two Leadership dice are declared and pass on 1+1, so the same setup does produce the request
#   when the immunity is absent.
#   NOT YET EVIDENCED under this clause: its recorded contract also covers the denial of a
#   Stupidity test, a Hatred reroll and a Frenzy bonus; those variants are now authored below under
#   the psychology-coverage clause (the earlier note that no fixture could supply them was wrong:
#   the disability.6 state, the frenzy trait and a hand-built skill.hatred supply them).
#   Dice derivation (sources): the warrior strikes with its printed Attacks value A1 and its rules
#   add no round-0 die request of their own - every strike is declared as a natural 1, so no
#   on-hit, wound, save or injury effect can trigger, and a charged model takes no charge bonus.
#   Immunity source (sources): the band rule band--slayer-rules binds mechanic.psychology-immunity with profile_ids ['giant-slayer', 'doomseeker', 'troll-slayers'] (the rule's applies_to also lists stubbles and axe-hurlers, which the immunity binding does not name), so it covers
#   the carrier troll-slayers and not the contrast rememberer.
#   The Fear test itself is a 2D6 Leadership test, so the variant list above concerns the
#   clause's other consequences, not an unavailable tape.
#
