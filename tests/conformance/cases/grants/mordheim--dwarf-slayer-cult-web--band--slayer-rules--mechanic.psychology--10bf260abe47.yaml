# Hatred: no printed profile of this band carries both this immunity and Hatred (the band's Hatred rule
# names only the Rememberer, Stubbles and Axe Hurlers, none of whom the immunity binding names), and
# construction refuses skill.hatred on the Slayer ranks, so the pair uses the hand-built device of the
# accepted twins: the canonical operator this binding grants (mechanic.psychology-immunity) together
# with skill.hatred.  A Hatred re-roll of a first-round miss is denied to the immune warrior: its miss
# (a 2) stands, with no re-roll die declared.
- audit_id: rule/mordheim/dwarf-slayer-cult-web/band--slayer-rules/mechanic.psychology-immunity
  id: the-immune-warrior-gets-no-hatred-reroll
  covers: [psychology-immunity--scope--psychology-coverage]
  fighters:
    first:
      skill_ids: [skill.hatred, mechanic.psychology-immunity]
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: False, attacks.0.damage: 0, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

