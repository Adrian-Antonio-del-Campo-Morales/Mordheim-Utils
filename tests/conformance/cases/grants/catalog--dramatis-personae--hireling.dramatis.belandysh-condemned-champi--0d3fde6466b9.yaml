# Rule (grade-1c.yaml, hireling.dramatis.belandysh-condemned-champion-of-chen.rule.inconsistency, grant
# profile): "His variable attributes are determined whenever needed, once every turn" - binding
# mechanic.inconsistency over the printed random line (WS D6, S D6, T D6, I D6, A D3).  Hireling family
# model (README, Hireling recipients): the real Belandysh through the hireling route
# (hirelings.dramatis-personae.1c) with the fixture facts and the printed kit's default Broadsword of
# Damnation; nothing is selected.  The opponent is hand-built (WS3 S3 T3 W3 I2 A1 Ld7, mace, no armour)
# and silenced (attacks 0) so every die is Belandysh's own.  The control is the grade-1b Bard.  Dice
# (the Belandysh convention of the authored survival/leadership files): the strike order needs the
# random Initiative first (round.<i>.first.characteristic.I.0), the pool needs the random Attacks
# (round.<i>.first.characteristic.A.0, a D3), the blow needs the random Weapon Skill
# (round.<i>.first.attack.<n>.attacker.characteristic.WS.0) and a hit needs the random Strength
# (round.<i>.first.attack.<n>.attacker.characteristic.S.0).  To-hit chart: WS1 against WS3 needs 5+
# (the defender's WS exceeds twice the attacker's), WS6 against WS3 needs 3+.  S6 (+2 broadsword)
# against T3 wounds on 2+; a wound die never shows a 6 so no critical die follows.

# A Weapon Skill of 1 rolled when the blow needs it: the 4 that would hit the fixture's 4+ misses the 5+.
- audit_id: rule/catalog/dramatis-personae/hireling.dramatis.belandysh-condemned-champion-of-chen.rule.inconsistency/mechanic.inconsistency
  id: a-weapon-skill-of-one-rolled-when-needed-sets-the-hit-target-to-five
  fighters:
    first:
      &inconsistency-recipient
      collection: mordheim
      band_id: hirelings.dramatis-personae.1c
      profile_id: hireling.dramatis.belandysh-condemned-champion-of-chen
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      &inconsistency-opponent
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.characteristic.I.0, value: 6}
    - {key: round.0.first.characteristic.A.0, sides: 3, value: 1}
    - {key: round.0.first.attack.0.attacker.characteristic.WS.0, value: 1}
    - {key: round.0.first.attack.0.hit, value: 4}
  expect_rounds:
    0: {attacks.0.hit_target: 5, attacks.0.hit: False, state.first.weapon_skill: 1, state.first.initiative: 6, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

