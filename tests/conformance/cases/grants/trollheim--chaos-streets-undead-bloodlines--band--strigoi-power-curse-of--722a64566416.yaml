# --- Authored scenarios ---
# Derived from the printed sentence, the recorded contract and the printed rule binding; no engine
# output was consulted.  The power is a selectable warband rule (special_rule_ids) whose declared
# effects are skill.regeneration and skill.regeneration-blocked-by-blessed, so the bearer is the
# bloodline's own profile with that rule selected; the fixture starts it at two Wounds with no
# attacks of its own, so round 0 carries only the attacker's dice.  The blow is an ordinary mace: at
# Weapon Skill 10 it needs a 3 against any printed Weapon Skill of this bearer, and Strength 8 needs
# a 2 against Toughness 4, so the declared 5 and 5 both pass.  Five is deliberately below a natural
# six, which would be a critical hit and demand a further critical die.
#
# The strict tape is part of the evidence: StrictDice rejects a roll the fixture never declared, so
# the fire scenario fails if a Regeneration die is requested against an attack.fire blow.

