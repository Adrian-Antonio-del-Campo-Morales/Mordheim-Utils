# Family model (Chaos "Mutant" special skills, construction face).  The record is a `warband_skill`
# with `grant: selectable`, `applies_to.band: true`, no eligibility list and the compiler binding
# `special-rule.band--beastmen-special-skills-mutant` (an empty contract).  The band's Heroes print the
# `special` skill access the warband-skill gate reads; the henchmen print none.  The purchase the skill
# permits is the printed Possessed mutation table ("See Mutants section on special rules"): a
# `band--mutations-*` selection on a Beastmen build is admitted only when the Mutant skill is selected
# with it, otherwise the construction gate refuses the purchase.  The Great Claw is the purchased
# mutation here because its compiled consequence is a stable field: one additional attack entry
# tagged `rule.great-claw` at Strength +1.  Fixture facts: the Chieftain's printed profile (WS 4, S 4,
# T 4, W 1, I 4, A 1, Ld 7) with an ordinary mace; the opponent is hand-built and contributes no
# attacks; both Hero blows are natural ones so no wound die is on the tape.

- audit_id: rule/mordheim/beastmen-raiders/band--beastmen-special-skills-mutant/special-rule.band--beastmen-special-skills-mutant
  id: a-hero-with-mutant-may-buy-a-mutation-and-compiles-with-it
  fighters:
    first:
      collection: mordheim
      band_id: beastmen-raiders
      profile_id: beastmen-chieftain
      special_rule_ids: [band--beastmen-special-skills-mutant, band--mutations-great-claw]
      main_weapon_id: weapon.mace
    second:
      &beastmen-mutant-opponent
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.first.attack.1.hit, value: 1}
  expect_fighters:
    first.extra_attacks.0.tags: ['rule.great-claw']
    first.extra_attacks.0.strength_bonus: 1
    first.characteristics.attacks: 1
  expect_rounds:
    0: {attacks.0.hit: False, attacks.1.hit: False, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

