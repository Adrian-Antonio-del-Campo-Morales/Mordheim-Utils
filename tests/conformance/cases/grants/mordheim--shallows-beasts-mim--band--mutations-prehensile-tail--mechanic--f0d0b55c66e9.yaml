# --- Authored scenarios ---
# Printed text (special-rules.yaml, Prehensile Tail; Mutiny in Marienburg p.160): "Unless it already
# possesses a tail, gains one tail attack; may equip one single-handed weapon or shield/buckler in that
# tail."  The record is a `mutation` with `grant: selectable`, `applies_to.profile_types: [hero]` and the
# binding `mechanic.prehensile-tail`; the Aquatic Mutants band rule lists it among the gifts "any Hero
# may start the campaign with".  The compiler appends one extra attack tagged `weapon.natural-attacks` +
# `rule.prehensile-tail` for a bare tail, or the declared extra-hand weapon's own effect for an equipped
# tail; the eligibility gate (additionalEquipmentRestriction) admits the extra hand only through this
# mutation, Extra Arm or Tail Fighting, and the recipients gate refuses the selection to the henchmen
# with `special rule is not available to <band>/<profile>: <rule>`.
# Fixture facts: the Buccaneer is supplied the corpus characteristics (WS3 S3 T3 W2 I5 A1) and carries a
# club from the Heroes' list (the dagger of the tail hand is on the same list); the opponent is the
# standard hand-built fixture and is silenced, so the tape holds exactly the Hero's attack dice, every one
# declared as a natural miss (1).  The Buccaneer's Swashbuckler rule is unimplemented and adds no die.

# A Hero selecting the mutation with an empty tail hand swings the bare tail as a natural attack.
- audit_id: rule/mordheim/shallows-beasts-mim/band--mutations-prehensile-tail/mechanic.prehensile-tail
  id: a-hero-selecting-the-mutation-swings-the-bare-tail-as-a-natural-attack
  fighters:
    first:
      collection: mordheim
      band_id: shallows-beasts-mim
      profile_id: buccaneer
      main_weapon_id: weapon.club
      special_rule_ids: [band--mutations-prehensile-tail]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second: &opponent
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  initial_state: &opponent-silent {second: {attacks: 0}}
  duel_context: &hero-charges {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.first.attack.1.hit, value: 1}
  expect_fighters:
    first.extra_attacks.0.tags: [weapon.natural-attacks, rule.prehensile-tail]
  expect_rounds:
    0: {attacks.0.hit: false, attacks.1.hit: false, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The same Hero equips a dagger in the tail: the compiled fighter carries the tail weapon as its own
