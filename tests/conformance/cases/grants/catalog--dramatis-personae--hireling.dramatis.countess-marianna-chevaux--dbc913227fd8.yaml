#
# AUTHORED: the printed rule ("Stunned Injury results become Knocked Down through No Pain; the source
#   expressly combines her Jump Up skill with No Pain so those Knocked Down Injury results do not leave
#   her prone. This exception does not prevent a separate Trip effect") binds skill.ignore-pain,
#   skill.jump-up and mechanic.marianna-no-pain-jump-up (this identity).  The combination's contract
#   (packages/python/combat-engine/mordheim_combat/modular/attacks.py) turns an aggregated Knocked Down
#   into Standing when the defender carries all three tags; without it the general Jump Up print
#   refuses No Pain's knock-down (phases.py injury_condition), so the Stunned face is the discriminating
#   observation (Standing with the rule, Knocked Down with this binding alone removed).  The hand-built
#   contrasts live in cases/mechanics/mechanic.marianna-no-pain-jump-up.yaml.  Semantic note: the
#   engine resolves Jump Up at the Injury roll, as the AUTHORED skill.jump-up model does, so a one-round
#   tape shows the standing Countess and no recovery phase is needed; the printed Trip reservation has
#   no duel operator and is not evidenced.
#
# Hireling family model (P0, 2026-11-17) in the Cairn Wraith No Pain shape.  The recipient is the
# printed profile compiled through the hireling route (hirelings.dramatis-personae.1a /
# hireling.dramatis.countess-marianna-chevaux-vampire-assassin) with the fixture characteristics
# (WS3 S3 T3 I5 A1) and wounds 1 so the first wound reaches the Injury table; she contributes no attack
# of her own (initial_state).  The attacker is the stronger hand-built fixture (WS10 S8 I10, mace): 3+
# to hit, 2+ to wound with no critical face, and twice her Strength makes the rapier's parry ineligible.
# Her Step Aside is a 5+ special save against every close combat wound, so one ward die
# (round.0.first.attack.0.special.ward) is declared and fails on 1 after the wound; she wears no
# armour, nobody charges her Fear, she is immune to psychology and the garlic coating acts only when
# she strikes a Vampire.  The control is the grade-1b Bard (dagger; kit armour owned, not worn).

