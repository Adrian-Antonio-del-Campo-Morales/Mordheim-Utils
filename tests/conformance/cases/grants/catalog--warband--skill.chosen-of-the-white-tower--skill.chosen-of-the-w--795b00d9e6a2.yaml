#
# AUTHORED: 4 scenarios evidence the parry granted without
#   a parrying weapon, the skill's own re-roll with a sword, the refusal of that
#   re-roll with another parrying weapon (a trident) and the unchosen control.

# --- Authored scenarios ---
# The printed clause and the accepted M3 delivery in this scaffold's register notes
# split into two halves: the parry granted even without a buckler or sword, and the
# skill's own re-roll restricted to a sword or buckler recipient.
# A mace cannot parry, so the declared parry die exists only because the printed
# training grants one: the five beats the attack roll of four.
- audit_id: rule/catalog/warband/skill.chosen-of-the-white-tower/skill.chosen-of-the-white-tower
  id: the-training-grants-a-parry-without-a-parrying-weapon
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      skill_ids: [skill.chosen-of-the-white-tower]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.parry, value: 5}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.parried: True, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# Armed with a sword the bearer may re-roll the failed parry: the three fails against
# the four and the re-rolled five blocks, which is the printed sword recipient.
- audit_id: rule/catalog/warband/skill.chosen-of-the-white-tower/skill.chosen-of-the-white-tower
  id: a-failed-parry-with-a-sword-is-rolled-again
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.sword
      skill_ids: [skill.chosen-of-the-white-tower]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.parry, value: 3}
    - {key: round.0.first.attack.0.parry.reroll, value: 5}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.parried: True, attacks.0.wounded: False, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# A trident is a parrying weapon as well, but it is neither the sword nor the buckler
# the printed clause names: the failed three stands and no second parry die is taken,
# so the attack proceeds into its wound roll.
- audit_id: rule/catalog/warband/skill.chosen-of-the-white-tower/skill.chosen-of-the-white-tower
  id: another-parrying-weapon-is-not-rolled-again
  fighters:
