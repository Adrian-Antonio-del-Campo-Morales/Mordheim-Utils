# AUTHORED: the printed condition of the grant.  The borrower is the band's own Trackers fixture
#   (printed Leadership 6) with a supplied Stupidity test as the individual Leadership-test vehicle;
#   the Witch Doctor (the band's Leader, printed Leadership 6) and the Big Boss are supplied standing
#   or knocked-down nearby participants with declared distances.  Dice: 2d6 <= Leadership passes, so
#   the declared 3+4=7 passes only the Big Boss's 7 and fails both printed sixes; a wrongly offered
#   borrow would request an undeclared leader decision and fail the strict tape.  The sibling
#   mechanic.leader-six and mechanic.leader-four bindings of this rule carry their own files.

# --- Authored scenarios ---
# The printed condition does not hold: the Witch Doctor stands five inches away, inside his own
# six-inch radius, so his Leadership can be used and the Big Boss four inches away is not offered at
# all.  The declined senior borrow leaves the borrower's own 6, which fails the seven and cancels
# the charge.
- audit_id: rule/trollheim/lustria-savage-goblins/big-boss--second-in-command/mechanic.leader-fallback
  id: a-usable-witch-doctor-withholds-the-big-boss
  fighters:
    first:
      collection: trollheim
      band_id: lustria-savage-goblins
      profile_id: trackers
      trait_overrides: {stupidity: true}
    second:
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 7}
  initial_state: {first: {attacks: 0}, second: {attacks: 0}}
  duel_context:
    first_id: first
    second_id: second
    charging: [first]
    active_participant: first
    distances: [[first, witch-doctor, 5], [first, big-boss, 4]]
    nearby:
      - participant_id: witch-doctor
        side_id: first
        condition: standing
        fighter: {collection: trollheim, band_id: lustria-savage-goblins, profile_id: witch-doctor}
      - participant_id: big-boss
        side_id: first
        condition: standing
        fighter: {collection: trollheim, band_id: lustria-savage-goblins, profile_id: big-boss}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.stupidity.leader.witch-doctor, value: false}
  rolls:
    - {key: round.0.first.stupidity.0, value: 3}
    - {key: round.0.first.stupidity.1, value: 4}
  expect_rounds:
    0: {attacks: [], state.first.stupidity_failed: true, state.first_charged: false, state.engaged: false}
  expect_final: {rounds_executed: 1, termination_reason: disengaged}

