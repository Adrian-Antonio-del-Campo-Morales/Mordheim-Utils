# Discrimination note (2026-11-18, reviewed): not a duplication, so the KB is kept and no
#   single-source change applies.  This is the documented supplied-condition pattern
#   (docs/reference/knowledge-base.md, Reason codes): the band rule band--power-grab binds
#   condition.power-grab-majority with `grant: none` only to name the printed rule that produces the
#   condition; it is never a compile route.  The condition's one operator is its row in
#   sources/knowledge/catalog/rules/conditions.yaml (binding profile.characteristics, bonuses
#   {leadership: 1}), reached only through the supplied condition_ids entry these scenarios declare, so
#   the scenarios test it through its condition id, as intended.  Removing the band binding cannot
#   change a build; removing the catalogue row refuses the build.  The only place the band rule could
#   become observable is the recipient gate, which compiler.py hard-codes (compile_fighter's
#   supplied-condition checks on band/profile/kind) instead of reading this rule's applies_to; that is a
#   compiler choice, not a KB duplicate.
# Record: sources/knowledge/bands/mordheim/underworld-alliance-mim/special-rules.yaml
# AUTHORED: 3 scenarios (supplied-conditions batch, 2026-11-18) read the printed "the race with more
#   warriors gains +1 Ld" on the band's own Goblin Bully (printed Leadership 7) carrying the fixture's
#   characteristics: the compiled Leadership 8 (expect_fighters) and the charged Fear test it passes on
#   4+4 = 8; the same Bully without the supplied result keeps the printed 7 and fails the same 8; a
#   hand-built fixture is refused by the band gate.  The counting of warriors at match start is the
#   printed producer, out-of-scope.group (unimplemented.underworld-alliance-mim.band.power-grab); the
#   caller supplies which race is the majority.  The mechanic identity
#   mechanics/condition.power-grab-majority.yaml carries the one-result-per-table refusal.  REVIEWED
#   still requires manual semantic review.

# --- Authored scenarios ---
# Fear 2D6 test: a total at or under Leadership passes.  The fear-causer charges and is silenced
# (attacks: 0), so the tape is the Bully's charged Fear pair and its single hit die (a natural 1, so no
# wound die exists); the Bully carries the band list's club.

- audit_id: rule/mordheim/underworld-alliance-mim/band--power-grab/condition.power-grab-majority
  id: the-majority-race-is-supplied-leadership-eight-and-passes-the-fear-test-on-an-8
  fighters:
    first:
      collection: mordheim
      band_id: underworld-alliance-mim
      profile_id: goblin-bully
      main_weapon_id: weapon.club
      condition_ids: [condition.power-grab-majority]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 4, attacks: 1}
    second:
      &band-power-grab-majority-fear-causer
      trait_overrides: {causes_fear: true}
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [second], active_participant: second}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.fear.charged.0, value: 4}
    - {key: round.0.first.fear.charged.1, value: 4}
    - {key: round.0.first.attack.0.hit, value: 1}
  expect_fighters: {first.characteristics.leadership: 8}
  expect_rounds:
    0: {state.first.fear_hit_sixes: false, attacks.0.hit: false, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

