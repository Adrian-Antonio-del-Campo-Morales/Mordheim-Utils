# --- Authored scenarios ---
# Family model (Chaos "Mutant" special skills, construction face).  The record is a `warband_skill`
# with `grant: selectable`, `applies_to.band: true`, no eligibility list and the compiler binding
# `special-rule.band--marauder-special-skills-mutant` (an empty contract).  Every Hero of the band
# prints the `special` skill access the warband-skill gate reads; the henchmen print none.  A
# `band--mutations-*` selection on a Marauder build is admitted only when at least as many Mutant
# selections accompany it ("each purchased mutation requires <skill>").  The Great Claw (one
# additional attack entry tagged `rule.great-claw` at Strength +1) and the Tentacle (the bearer's
# incoming-attacks modifier -1) are the purchased mutations because their compiled consequences are
# stable fields.  Recipient: the printed Champion (WS 4, S 4, T 3, W 1, I 4, A 1, no profile rules)
# with a sword; the opponent is hand-built and contributes no attacks; every Hero blow is a natural
# one so no wound die is on the tape.

- audit_id: rule/mordheim/marauders-of-chaos/band--marauder-special-skills-mutant/special-rule.band--marauder-special-skills-mutant
  id: a-hero-with-mutant-may-buy-a-mutation-and-compiles-with-it
  fighters:
    first:
      collection: mordheim
      band_id: marauders-of-chaos
      profile_id: champions
      special_rule_ids: [band--marauder-special-skills-mutant, band--mutations-great-claw]
      main_weapon_id: weapon.sword
    second:
      &marauder-mutant-opponent
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.first.attack.1.hit, value: 1}
  expect_fighters:
    first.extra_attacks.0.tags: ['rule.great-claw']
    first.extra_attacks.0.strength_bonus: 1
    first.characteristics.attacks: 1
  expect_rounds:
    0: {attacks.0.hit: False, attacks.1.hit: False, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

