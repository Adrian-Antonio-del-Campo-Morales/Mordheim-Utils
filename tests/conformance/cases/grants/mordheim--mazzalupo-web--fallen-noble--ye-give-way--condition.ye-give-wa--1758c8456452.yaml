# --- Authored scenarios ---
# Fixture arithmetic: WS3 against WS3 hits on 4+; the printed -1 makes the target a 5, so a 4 misses
# and a 5 still hits (the penalty is exactly one, which also carries the printed "non-cumulative"
# as far as a single supplied result can: the condition is a presence fact read once per attack, and
# no authored model declares the same condition twice).  "Until the end of the game" exceeds the
# one-round horizon and stays a lasting fact of the supplied condition.  The bearer is the band's
# real Fallen Noble (a Hero, as the printed recipient gate requires) carrying fixture
# characteristics; the opponent is a hand-built fixture whose own swing is a scripted miss, and W2
# on both sides keeps every blow short of an injury roll.

# The refusal boundary on the printed recipient: the Fallen Noble's 4, a hit under the normal
# rules, misses under the supplied -1.
- audit_id: rule/mordheim/mazzalupo-web/fallen-noble--ye-give-way/condition.ye-give-way-refused
  id: the-refused-fallen-nobles-four-misses-in-melee
  fighters:
    first:
      collection: mordheim
      band_id: mazzalupo-web
      profile_id: fallen-noble
      main_weapon_id: weapon.mace
      condition_ids: [condition.ye-give-way-refused]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: False, attacks.0.hit_target: 5, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

