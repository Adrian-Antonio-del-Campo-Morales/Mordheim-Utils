# Hireling family model (README, Hireling recipients): the recipient is the printed Priest of Verena compiled
# through the hireling route (hirelings.hired-sword.2b / hireling.hired-sword.priest-of-verena) as the
# War-Priest of Solkan (variant deity.solkan) with the selectable Witch-finder chosen through
# special_rule_ids and the compulsory charge supplied through condition_ids; fixture characteristics WS3 S3
# T3 W2 I5 A1 (printed Ld8 stays).  Printed text: "The chosen War-Priest must charge an eligible follower
# of Chaos, warlock, necromancer, sorcerer or warp-tainted character; only the supplied actual charge is
# resolved, without movement or visibility production."  Opponents are hand-built (WS3 S3 T3 W3 I2 A1 Ld7,
# mace) with the one identity the check reads; every strike is a declared natural 1, so an admitted duel
# requests only the two To Hit dice.  The unselected control is the same War-Priest without the Mark; the
# refusals are the unmarked Priest (sword in hand, since his Strictures bar the dagger) and the Bard.

# The supplied compulsory charge against a follower of Chaos is admitted and resolved as a charge.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.priest-of-verena.skill.witch-finder/mechanic.solkan-witch-finder
  id: the-witch-finders-supplied-compulsory-charge-against-a-chaos-follower-is-admitted
  fighters:
    first:
      &recipient
      collection: mordheim
      band_id: hirelings.hired-sword.2b
      profile_id: hireling.hired-sword.priest-of-verena
      variant_ids: [deity.solkan]
      special_rule_ids: [hireling.hired-sword.priest-of-verena.skill.witch-finder]
      condition_ids: [condition.witch-finder-charge]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      &chaos_follower
      main_weapon_id: weapon.mace
      trait_overrides: {chaos_follower: true}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: False, state.first.wounds: 2, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

