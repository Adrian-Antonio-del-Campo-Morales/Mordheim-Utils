# Clause: whole--scope--spines (scope: YES)
# AUTHORED[whole--scope--spines]: 3 scenarios evidence the printed automatic hit.  It is resolved
#   before the attack pools with no To Hit die at all, and its declared five is the Strength 1 face on
#   the printed table against the opposing Toughness 2, so the contacting opponent loses one wound; the
#   non-regression control repeats the identical phase on a fixture without the trait, where no spines
#   die is part of the tape at all.  The printed "never cause critical hits" is asserted on its own
#   boundary rather than left to the contract: the core critical rule makes a natural six on a wound
#   roll a critical wound whenever the required target is below six (cases/core/combat-critical-hits,
#   clause critical-trigger), and this Strength 1 hit against Toughness 2 needs a five, so the declared
#   six is exactly that candidate and the tape shows the denial - one wound taken, where a critical
#   chart's two would take two.  The hit is dealt once each close-combat phase, and one phase is what
#   the duel tape shows.  REVIEWED still requires manual semantic review.
