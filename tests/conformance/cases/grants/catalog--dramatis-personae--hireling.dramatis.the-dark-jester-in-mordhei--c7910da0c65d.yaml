# Rule (grade-2a.yaml, hireling.dramatis.the-dark-jester-in-mordheim.rule.sidestepper, grant
# profile): "May use the source 4+ special dodge" - binding skill.dodge-sidestepper (model
# tests/conformance/cases/mechanics/skill.dodge-sidestepper.yaml).  Hireling family model (README,
# Hireling recipients): the real Jester through the hireling route (hirelings.dramatis-personae.2a /
# hireling.dramatis.the-dark-jester-in-mordheim) with the fixture facts (WS3 S3 T3 W2 I5 A1; printed
# Ld7 stays) and his printed club; the chooser offers `round.<i>.<side>.jester-trick.dodge_trick_active`,
# `.banter_trick_active`, `.trip_trick_active` in that order and stops at the first acceptance; the
# dodge is the ward die `round.<i>.<attacking side>.attack.<n>.special.ward` at 4+ (the ruling "The
# Starsword printed Dodge save is the ward save" keeps the printed dodge on the ward face).  His
# Leap, Acrobat, Jump Up and Lightning Reflexes add no die in an uncharged duel; his Dodge skill is
# a shooting save.  The opponent is hand-built (WS3 S3 T3 W3 I2 A1 Ld7, mace, no armour): WS3
# against WS3 hits on 4+, S3 wounds T3 on 4+; the Jester's own blow is a declared natural 1.  The
# control is the grade-1b Bard; the refusal selects the printed rule on the Bard (the compiler's
# band-only fragment, another package).

# The chosen dodge trick saves the opponent's wound on the ward die 4 (the printed 4+).
- audit_id: rule/catalog/dramatis-personae/hireling.dramatis.the-dark-jester-in-mordheim.rule.sidestepper/sidestepper
  id: the-jesters-chosen-dodge-trick-saves-a-melee-wound-on-four
  fighters:
    first:
      &jester-sidestepper
      collection: mordheim
      band_id: hirelings.dramatis-personae.2a
      profile_id: hireling.dramatis.the-dark-jester-in-mordheim
      main_weapon_id: weapon.club
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      &jester-sidestepper-opponent
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.jester-trick.dodge_trick_active, value: true}
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 4}
    - {key: round.0.second.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.special.ward, value: 4}
  expect_rounds:
    0: {state.first.dodge_trick_active: true, attacks.1.wounded: true, attacks.1.saved: true, attacks.1.damage: 0, state.first.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

