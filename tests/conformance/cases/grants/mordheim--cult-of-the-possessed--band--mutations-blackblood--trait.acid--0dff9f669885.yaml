# The printed "(no critical hits)" face, on the boundary the core critical rule makes observable: a
# natural six on a wound roll is a critical wound whenever the required target is below six
# (cases/core/combat-critical-hits, clause critical-trigger), and the printed Strength 3 hit against
# this Toughness 3 attacker needs a four, so the reaction's declared six is the critical candidate.
# The attacker stands at four wounds, so the two damage a critical chart deals would leave it on two
# while the printed denial leaves it on three; the bearer's own loss is unchanged.
- audit_id: rule/mordheim/cult-of-the-possessed/band--mutations-blackblood/trait.acid-blood
  id: the-reactive-hit-is-no-critical-even-on-a-natural-six
  covers: [whole--scope--acid-blood]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 4, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      trait_overrides: {acid_blood: true}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.acid-blood.0.wound, value: 6}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 1, state.first.wounds: 3, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

