# --- Authored scenarios ---
# The print (Karak Azgal, Snorri Nosebiter / Lucky): "Although he has no armour Snorri has a knack
# of avoiding harm.  He has a 5+ ward save against shooting and combat."  The grant is profile and
# its execution entry carries ward_save 5, an ordinary ward resolved after the wound under the
# attacker's special.ward key (the model is the authored mechanics file
# tests/conformance/cases/mechanics/mechanic.snorri-lucky.yaml and the authored Triskele/Spiral
# hireling files of this directory).  Snorri is compiled through the hireling route
# (hirelings.dramatis-personae.2b / hireling.dramatis.snorri-nosebiter) with his printed kit
# supplied (owned_item_ids dwarf_axe + hammer, the hammer declared as his canonical mace main
# weapon) and the fixture facts (WS3 S3 T3 W2 I5 A1; his printed Ld8 stays).  His printed Drunk
# rule demands the pre-battle table result as a supplied fact, so trait_overrides declares
# snorri_drunk_result 3 ("no effect"); his Slayer Rules grant Psychology immunity and forbid
# armour, neither of which requests anything here.  His attacks are silenced
# (initial_state attacks: 0) so the hand-built attacker's tape is the only one: the charged mace
# hit of 4 hits WS3 on 4+ and the wound of 4 wounds T3 (a fixture fact) on 4+.

# The printed save on its own face: the ward die 5 saves the wound.
- audit_id: rule/catalog/dramatis-personae/hireling.dramatis.snorri-nosebiter.rule.lucky/mechanic.snorri-lucky
  id: snorris-five-plus-ward-holds-at-the-threshold
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: &snorri-attacker {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
    second:
      &snorri-build
      collection: mordheim
      band_id: hirelings.dramatis-personae.2b
      profile_id: hireling.dramatis.snorri-nosebiter
      owned_item_ids: [dwarf_axe, hammer]
      main_weapon_id: weapon.mace
      trait_overrides: {snorri_drunk_result: 3}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
  initial_state: {second: {attacks: 0}}
  duel_context: &snorri-charging-first {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.special.ward, value: 5}
  expect_rounds:
    0: {attacks.0.saved: true, attacks.0.damage: 0, state.second.wounds: 2}
  expect_fighters:
    second.global_effects.ward_save: 5
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# One face below the printed target: the 4 is not a 5+ and the wound is taken.
