# "4 Numbed = +1 armour save, which may not be reduced below 6+".  The affected duelist wears no armour, so
# the printed +1 is the only save it has; the attacker's Strength 6 would take that save past 6+, and the
# printed limit is what keeps a six saving.  A consumer that granted the bonus without the floor asks for no
# armour die at all and leaves the declared one unconsumed, which the strict tape fails; the printed bonus
# and its printed limit are therefore both read in this one blow.
- audit_id: rule/mordheim/night-goblins-web/shaman--fungus-brew/condition.fungus-brew-numbed
  id: the-supplied-numbed-result-gives-the-printed-six-plus-save-against-a-strength-six-blow
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 6, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      condition_ids: [condition.fungus-brew-numbed]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
  - {key: round.0.first.attack.0.hit, value: 4}
  - {key: round.0.first.attack.0.wound, value: 4}
  - {key: round.0.first.attack.0.armour, value: 6}
  - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.saved: true, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

