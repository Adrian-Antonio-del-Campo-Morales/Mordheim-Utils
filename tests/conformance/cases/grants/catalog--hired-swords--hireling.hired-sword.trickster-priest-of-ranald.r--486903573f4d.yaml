# Printed text (grade-2b.yaml, Strictures): "They may only be armed with a dagger, throwing knives and a
# stiletto (counts as a sword). Priests of Ranald may never wear armour."  The binding forbids the
# `armour` token; the Haggle and Streetwise grant of the same sentence is campaign-only (scope NO).  The
# recipient is the printed Trickster-Priest compiled through the hireling route
# (hirelings.hired-sword.2b / hireling.hired-sword.trickster-priest-of-ranald) with the fixture facts
# (WS3 S3 T3 W2 I5 A1; the printed Ld7 stays); the kit's stiletto is the catalogue `sword` row by the
# chapter's own equivalence (weapon.sword).  The admission uses the corpus's construction-only shape (no
# charge, the bearer out of action before the first phase, so the duel requests no die) and observes
# the compiled build alone: armour_save 7 is the no-armour face.  The refusals use the kit-resolver
# fragment already asserted in cases/mechanics/defence.wolf-pelt-cloak.yaml.

# The printed stiletto in hand: no armour, so the compiled save is the 7 of a bare warrior.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.trickster-priest-of-ranald.rule.strictures/profile.equipment-restrictions
  id: the-printed-stiletto-compiles-with-no-armour
  fighters:
    first:
      collection: mordheim
      band_id: hirelings.hired-sword.2b
      profile_id: hireling.hired-sword.trickster-priest-of-ranald
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
      main_weapon_id: weapon.sword
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [], active_participant: first}
  initial_state: {first: {condition: OUT}}
  expect_fighters:
    first.armour_save: 7

# "Priests of Ranald may never wear armour": a suit of light armour is refused.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.trickster-priest-of-ranald.rule.strictures/profile.equipment-restrictions
  id: armour-is-refused
  fighters:
    first:
      collection: mordheim
      band_id: hirelings.hired-sword.2b
      profile_id: hireling.hired-sword.trickster-priest-of-ranald
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
      main_weapon_id: weapon.sword
      armour_id: armour.light-armour
  expect_error: "hireling active equipment and supplied ownership do not form a complete legal printed kit"

