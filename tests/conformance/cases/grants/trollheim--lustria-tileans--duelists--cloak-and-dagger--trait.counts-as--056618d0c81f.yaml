# --- Authored scenarios ---
# Derived from the printed rule ("A Duelist counts as using a shield in close combat because of
# the defensive use of the cloak") and the recorded contract: the rule is consumed as the
# compiled armour-save point a shield contributes, and the register records it among the shields
# rather than as a hand-occupying item.  The bearer is the printed profile, which carries the rule
# itself, and the control repeats the same light armour and the same declared dice on a
# hand-built fighter without it, so the pair isolates the one-point save.  The bearer's own
# attacks are suppressed so the tape is the attacker's chain alone; the natural save of light
# armour is a six, which is why the declared five is the discriminating face.

