# --- Authored scenarios ---
# Family model (Blood Dragon power: Sword Master): the bearer is the printed recipient of this band
# record, built from its own collection, band and profile and selecting the band row named in the audit
# id, whose runtime binds skill.sword-master (equality) and mechanic.blood-dragon-sword-master (the
# natural six).  Physical characteristics are supplied as fixture facts (WS3 S3 T3 W2 I2 A1) so the
# dice thresholds and the strike order are fixed, while the printed Leadership stays in place; the
# bearer parries with a sword and its own attack pool is declared empty so the tape holds only the
# parry under test.  Every expectation is read from the printed rule ("only needs to equal the
# opponent's roll and may therefore parry a roll of 6"), never from engine output.  The control case
# removes the band selection and keeps the same warrior and the same natural six.

# The printed conclusion "and may therefore parry a roll of 6": the natural six is met by the parry die
# of six and the attack is blocked.
