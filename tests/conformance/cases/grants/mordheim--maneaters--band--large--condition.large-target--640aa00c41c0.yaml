# --- Authored scenarios ---
# Uniform Large Target binding (design ruling recorded 2026-11-18): the printed band rule "All Ogre
# warriors except Youngbloods and Half-growns are Large targets" binds condition.large-target with
# profile_ids [captain, mountain-guide, bulls], whose execution entry tags the bearer [size.large];
# the printed shooting consequences stay excluded as out-of-scope.shooting
# (unimplemented.maneaters.band.large).  The duel reader is the printed Slay Large Creature bonus
# ("+1 Strength when charging a Large creature in the first round"), injected into a hand-built
# charger through skill_ids - the same evidence route as the hireling Large model file.
# Arithmetic: S3 wounds T3 on 4+, the +1S of the charge against a Large bearer (S4 vs T3) on 3+, so
# the declared wound roll of 3 separates the Bulls recipient from the excepted Youngblood and the
# hand-built control.
# Profile dice (from the band's fear, bull-charge and crude-belch siblings): the band's own Fear rule
# covers every Ogre warrior except Youngbloods, so against the Bull the charger (Ld7) declares the
# 2D6 charge test - 3+3 passes - while the Youngblood asks for no fear die; the Bull's own Bull
# Charge decision is offered only on the Bull's own charge, so the passive Bull requests none; the
# Ogre profiles compile unarmed (they never fight with daggers), so the supplied zero attack count
# does not remove their single fist attack - that residual attack is declared as a natural miss,
# exactly as the band fear sibling records.  Being wounded requests no armour or regeneration die.

# The Slay Large Creature charger wounds the Large Bull on a 3 (S4 vs T3 after the charge bonus):
# the Bulls are inside the binding's printed recipient set.
- audit_id: rule/mordheim/maneaters/band--large/condition.large-target
  id: a-slay-large-creature-charger-wounds-the-large-bull-on-a-3
  fighters:
    first:
      &charger
      main_weapon_id: weapon.mace
      skill_ids: [rule.slay-large-creature]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
    second:
      collection: mordheim
      band_id: maneaters
      profile_id: bulls
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    # The band's Fear rule covers the Bull: the charger's 2D6 charge test of 3+3 passes Ld7.
    - {key: round.0.first.fear.charge.0, value: 3}
    - {key: round.0.first.fear.charge.1, value: 3}
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 3}
    # The unarmed Bull keeps one fist attack despite the supplied zero attack count
    # (the band fear sibling records the same convention); a face of one is a natural miss.
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: True, attacks.0.wounded: True, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The printed exception boundary: the Youngblood is an Ogre warrior of the same band but outside
# the binding's recipient set ("except Youngbloods and Half-growns"), so the same charge carries no
# bonus and the same 3 does not wound (S3 vs T3 needs 4+).  The Youngblood is also excepted from the
# band's Fear rule, so no fear die is requested.
- audit_id: rule/mordheim/maneaters/band--large/condition.large-target
  id: the-same-three-fails-against-the-excepted-youngblood
  fighters:
    first:
      <<: *charger
    second:
      collection: mordheim
      band_id: maneaters
      profile_id: youngbloods
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 3}
    # The unarmed Youngblood keeps one fist attack despite the supplied zero attack count;
    # a face of one is a natural miss.
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: True, attacks.0.wounded: False, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The control: a hand-built opponent without the band rule carries no size.large, so the same
# charge carries no bonus and the same 3 does not wound (S3 vs T3 needs 4+).
- audit_id: rule/mordheim/maneaters/band--large/condition.large-target
  id: without-the-large-rule-the-same-three-fails
  fighters:
    first:
      <<: *charger
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 7}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 3}
  expect_rounds:
    0: {attacks.0.hit: True, attacks.0.wounded: False, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
