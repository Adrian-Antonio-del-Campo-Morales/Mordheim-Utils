# Printed clause (Mousillon Necrarchs p.6): "Any attack made with a steel/iron weapon (ie. anything but
# clubs, fists etc.) can harm it, but is at -1 to hit. Blessed and magic weapons ... hit normally."
# Recorded contract: `grant: profile`, `applies_to.profile_ids: [banshee]`, compiler binding
# `special-rule.banshee--cold-steel`; the compiled Banshee carries the tag `defence.cold-steel`, read
# on the incoming attack's own weapon identity: `weapon.club`, `weapon.fist` and `weapon.natural-attacks`
# cannot harm her (no wound die, no wound, no critical), every other weapon identity is metal and at -1
# to hit, and `attack.magical` / `attack.blessed` lift the penalty.
# Fixture facts: the attacker is hand-built with WS 4, S 3, T 3, W 3, I 5, A 1 (WS 4 against the
# Banshee's printed WS 4 hits on 4+, so a declared 4 hits only without the penalty and a 5 hits with
# it); S 3 against the Banshee's printed T 4 wounds on 5+, the Hellblade's S 4 on 4+.  The Banshee
# (printed WS 4, S 3, T 4, W 1, A 1, no Initiative) carries no equipment and contributes no attacks;
# the duel is uncharged so her Fear asks nothing of the attacker, and the attacker's Initiative orders
# the blow.  Her Ethereal and Wailing rules are outside the admitted runtime and add no request.

# A club is not steel: the hit lands but the attack cannot harm her, so no wound die is consumed and
# she keeps her wound.
- audit_id: rule/mordheim/necrarchs-mou/banshee--cold-steel/special-rule.banshee--cold-steel
  id: a-club-hits-but-cannot-harm-the-banshee
  fighters:
    first:
      main_weapon_id: weapon.club
      characteristics: &cold-steel-attacker {weapon_skill: 4, strength: 3, toughness: 3, wounds: 3, initiative: 5, attacks: 1, leadership: 7}
    second:
      &cold-steel-banshee {collection: mordheim, band_id: necrarchs-mou, profile_id: banshee}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
  expect_rounds:
    0: {attacks.0.hit: True, attacks.0.wounded: False, state.second.wounds: 1, state.second.condition: STANDING}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

