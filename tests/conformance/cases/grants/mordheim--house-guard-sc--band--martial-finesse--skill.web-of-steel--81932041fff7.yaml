# Printed carrier: House Guard, House Fierezza, Martial Finesse (band--martial-finesse, grant profile,
# applies_to the commander): "The Commander starts with the 'Web of Steel' skill."  Web of Steel
# (catalog/skills/general.yaml): "+1 on close-combat Critical Hit tables."  Consumer: modular/attacks.py
# ~639-640 - `phases.resolve_critical(..., modifier=effect.critical_injury_bonus + int(has_tag(effect,
# "skill.web-of-steel")))`; the basic chart (phases.py ~606-610) ignores armour on 3+ and adds +2 to the
# Injury roll on 5+.  Build conventions follow the House Guard files (mechanic.relay-orders,
# mechanic.dueling-pride): the house is the supplied fact trait_overrides: {house_guard_house: fierezza}.
# The recipient is the printed Commander (fixture WS3 S3 T3 W2 I5 A1, the printed Ld8 stays; his Leader
# lends only to a supplied comrade) with a mace from the Heroes list; the control is the printed Sergeant
# of the same house with the same fixture.  The opponent is the mace fixture (WS3 S3 T3 I2 A1 Ld7),
# silenced with attacks 0 (it carries a mace); a To Wound six against Toughness 3 is the critical.
# Semantic wrinkle (2026-11-18): the KB row is gated on the commander profile, not on the house; a
# Commander of another house would also compile with the skill.  Only the Fierezza build is declared.

# The injury face: the Commander's critical chart die of four reads five with the +1, so the Injury roll
# of one is taken at +2 (= 3) and the two-Wound fixture is Stunned instead of Knocked Down.
- audit_id: rule/mordheim/house-guard-sc/band--martial-finesse/skill.web-of-steel
  id: the-commanders-critical-chart-die-reads-one-higher-and-stuns
  fighters:
    first:
      &commander
      collection: mordheim
      band_id: house-guard-sc
      profile_id: commander
      main_weapon_id: weapon.mace
      trait_overrides: {house_guard_house: fierezza}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      &opponent
      main_weapon_id: weapon.mace
      # The Commander's Dueling Pride reads the opponent's explicit role.
      trait_overrides: {fighter_kind: henchman}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 7}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 6}
    - {key: round.0.first.attack.0.critical, value: 4}
    - {key: round.0.first.attack.0.injury.0, value: 1}
  expect_rounds:
    0: {attacks.0.critical: true, attacks.0.damage: 2, state.second.wounds: 0, state.second.condition: STUNNED}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

