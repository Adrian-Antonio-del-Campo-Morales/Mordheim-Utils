# A promoted Henchman may take special skills (user ruling 2026-11-19), and Powerful Build's print
# excludes only the Shadow Weaver. A promoted Shadow Warrior has no Strength list of his own, so the
# printed "may choose skills from the Strength skill list" is observable on him: with the skill he may
# take a Strength skill, without it he may not.
- audit_id: rule/trollheim/chaos-streets-sons-of-nagarythe/band--shadow-warrior-special-skills-powerful-build/profile.skill-access
  id: a-promoted-shadow-warrior-with-powerful-build-may-take-a-strength-skill
  fighters:
    first:
      collection: trollheim
      band_id: chaos-streets-sons-of-nagarythe
      profile_id: shadow-warrior
      variant_ids: [promotion.hero]
      special_rule_ids: [band--shadow-warrior-special-skills-powerful-build]
      skill_ids: [skill.mighty-blow]
    second: {main_weapon_id: weapon.mace}
  duel_context: {charging: [], active_participant: first}
  initial_state: {first: {condition: OUT}}
  expect_initial: {first.condition: OUT}
  expect_final: {rounds_executed: 0, termination_reason: first_out}

