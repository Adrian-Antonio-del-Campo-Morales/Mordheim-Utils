# Hireling family model (README, Hireling recipients): the recipient is the printed Halfling Pimp compiled
# through the hireling route (hirelings.hired-sword.2b / hireling.hired-sword.halfling-pimp), his printed rule
# granted by the profile itself; fixture characteristics WS3 S3 T3 W2 I5 A1 (printed Ld8 stays); the kit
# dagger is named.  The mark is hand-built (WS3 S3 T3 W3 I2 A1 Ld7, mace, no armour) declaring sex female,
# its attacks silenced.  Printed text: "The Pimp gets +1 to hit his mark".  Arithmetic: WS3 vs WS3 needs a
# 4+ normally and a 3+ with the bonus, so a declared three separates the two readings; S3 wounds T3 on a 4;
# the dagger's 6+ is rolled and a 1 fails it.  Mirrors cases/mechanics/mechanic.flesh-peddler.yaml.

# The nominated mark is hit on a three, wounded, and the dagger's 6+ save fails on a one.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.halfling-pimp.rule.flesh-peddler/mechanic.flesh-peddler
  id: the-pimp-hits-his-nominated-mark-on-one-lower-face
  fighters:
    first:
      collection: mordheim
      band_id: hirelings.hired-sword.2b
      profile_id: hireling.hired-sword.halfling-pimp
      main_weapon_id: weapon.dagger
