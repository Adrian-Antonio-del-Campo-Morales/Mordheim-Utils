# --- Authored scenarios ---
# Derived from the printed rule, the recorded semantic contract and this band's own Chaos Dwarf
# special-skill bindings; no engine output was consulted.  Both fighters are given zero attacks so
# the round resolves without attack dice and the observation is about admission, not about the
# member's mechanics; the one declared die is the initiative tie their equal Initiative forces.

- audit_id: rule/mordheim/black-dwarfs/band--chaos-dwarf-special-skills/profile.skill-access
  id: a-printed-table-member-is-admitted-to-the-recipient
  fighters:
    first:
      collection: mordheim
      band_id: black-dwarfs
      profile_id: sorcerer
      special_rule_ids: [band--chaos-dwarf-special-skills-thick-skull]
      main_weapon_id: weapon.mace
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  initial_state: {first: {attacks: 0}, second: {attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.priority-tie, value: 1}
  expect_final: {rounds_executed: 1}

- audit_id: rule/mordheim/black-dwarfs/band--chaos-dwarf-special-skills/profile.skill-access
  id: a-special-skill-outside-the-printed-table-is-refused
  fighters:
    first:
      collection: mordheim
      band_id: black-dwarfs
      profile_id: sorcerer
      skill_ids: [skill.monster-slayer]
      main_weapon_id: weapon.mace
  expect_error: "skills are not available to black-dwarfs/sorcerer: ['skill.monster-slayer']"
