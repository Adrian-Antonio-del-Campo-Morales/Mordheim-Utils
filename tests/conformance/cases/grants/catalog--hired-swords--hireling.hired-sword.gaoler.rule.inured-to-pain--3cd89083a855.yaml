# Hireling family model (README, Hireling recipients): the recipient is the printed Gaoler compiled through
# the hireling route (hirelings.hired-sword.1b / hireling.hired-sword.gaoler); its printed rule is granted
# by the profile itself; fixture characteristics WS3 S3 T3 W2 I5 A1 (printed Ld7 stays); the omitted main
# weapon is the kit's heavy chain, which never reaches a die because the Gaoler is silenced (attacks: 0).
# Printed text: "All Injury rolls against the Gaoler have -1. An Injury result of zero ignores the damage
# entirely."  The attacker is hand-built (WS3 S3 T3 W3 I2 A1 Ld7, axe) and charges: 4 hits (WS3 vs WS3),
# 4 wounds (S3 vs T3; a 6 would add a critical die), no save is owned; the Injury die is
# `round.0.second.attack.0.injury.0`.  Ordinary table: 1-2 knocked down, 3-4 stunned, 5-6 out of action.
# The control is the grade-1b Bard under the same fixture and tape; the refusal selects the printed rule.

# A roll of 1 totals zero: the damage is ignored entirely, the Wound is kept and the Gaoler stays standing.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.gaoler.rule.inured-to-pain/mechanic.inured-to-pain
  id: an-injury-roll-against-the-gaoler-reduced-to-zero-ignores-the-damage-entirely
  fighters:
    first:
      &recipient
      collection: mordheim
      band_id: hirelings.hired-sword.1b
      profile_id: hireling.hired-sword.gaoler
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      &attacker
      main_weapon_id: weapon.axe
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  initial_state: {first: {attacks: 0, wounds: 1}}
  duel_context: {charging: [second], active_participant: second}
  maximum_rounds: 1
  decisions:
    # The Gaoler's sibling Torturer's Grapple is offered each round; declined here.
    - {key: round.0.first.torturer-grapple, value: false}
  rolls:
    - {key: round.0.second.attack.0.hit, value: 4}
    - {key: round.0.second.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.injury.0, value: 1}
  expect_rounds:
    0: {attacks.0.hit: True, attacks.0.damage: 0, state.first.wounds: 1, state.first.condition: STANDING}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

