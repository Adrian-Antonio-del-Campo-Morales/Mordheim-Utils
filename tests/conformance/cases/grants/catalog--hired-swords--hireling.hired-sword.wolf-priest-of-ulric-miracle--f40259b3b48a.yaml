# Printed clause: "can fight unarmed without the usual penalties" (Liber Malefic, Priests for Every
# Occasion / Wolf-Priest of Ulric).  Recorded contract: a selectable `profile.fist` binding with
# `ignore_penalties: true`; the compiler projects it as the bearer's `rule.unarmed-without-penalties`
# tag, read by the unarmed-penalty waiver (fist Strength -1 and the target's +1 armour save are both
# lifted).  The selection does not replace the carried kit weapon, so the bearer declares the empty
# hand itself (`main_weapon_id: weapon.fist`, a neutral item for the printed-kit resolver).
# Hireling conventions (README, Hireling recipients): `band_id: hirelings.hired-sword.2b`, the real
# profile, fixture characteristics WS 3, S 3, T 3, W 2, I 5, A 1; the opponent is hand-built with a
# mace, T 3, W 3, I 2 and contributes no attacks.  Dice: WS 3 against WS 3 hits on 4+; a fist at S 2
# wounds T 3 on 5+, the penalty-free fist at S 3 on 4+, so the declared 4 discriminates the mark.
# With the mark the fist grants no save, so no armour die is on the tape; the control's wound die
# fails, so none is on its tape either.

- audit_id: rule/catalog/hired-swords/hireling.hired-sword.wolf-priest-of-ulric-miracle-workers.skill.son-of-ulric/profile.fist
