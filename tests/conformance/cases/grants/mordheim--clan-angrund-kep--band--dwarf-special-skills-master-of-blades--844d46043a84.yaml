# --- Authored scenarios ---
# Family model (Master of Blades, clan Angrund printing): the bearer is the printed recipient of this band record,
# built from its own band and profile and selecting the band row named in the audit id, which projects
# skill.unbeatable-warrior (equality, two parries) and mechanic.master-of-blades-axe-reroll.  Physical
# characteristics are supplied as fixture facts (WS3 S3 T3 W2 I2 A1) so the dice thresholds and the
# strike order are fixed; the bearer's own attack pool is declared empty so the tape holds only the
# parry under test.  Every expectation is read from the printed rule (two Dwarf axes reroll failed
# parries; he parries when he beats or matches the highest To Hit roll), never from engine output.

# The printed Dwarf Axe sentence: with two Dwarf Axes the failed parry is rolled again and the reroll
# matches, so the hit is blocked.
- audit_id: rule/mordheim/clan-angrund-kep/band--dwarf-special-skills-master-of-blades/mechanic.master-of-blades-axe-reroll
  id: two-dwarf-axes-reroll-a-failed-parry
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      collection: mordheim
      band_id: clan-angrund-kep
      profile_id: dwarf-noble
      special_rule_ids: [band--dwarf-special-skills-master-of-blades]
      main_weapon_id: weapon.dwarf-axe
      off_hand_id: weapon.dwarf-axe
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 5}
    - {key: round.0.first.attack.0.parry, value: 4}
    - {key: round.0.first.attack.0.parry.reroll, value: 5}
    # Two weapons in the bearer's hands leave it one attack of its own even with the
    # declared empty profile, so that die is taped as a miss against Weapon Skill 3.
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.parried: true, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

