# Hireling family model (P0, 2026-11-17).  The recipient is the printed Grand Master Ippan Shu
# compiled through the hireling route (hirelings.dramatis-personae.1c /
# hireling.dramatis.grand-master-ippan-shu) with the fixture facts (WS3 S3 T3 W2 I5 A1; the
# printed Ld10 stays); his printed rule is granted by the profile itself, so the build selects
# nothing.  His other printed duel rules (the Iron Fan's parry, Bare-Handed's extra attack) add no
# request while he is silenced (attacks 0) and the opponent's blows are declared natural misses.
# The opponent is hand-built (WS3 S3 T3 W3 I2 A1 Ld7, mace) and declares the one fact the rule
# reads (causes_fear).  The control is the grade-1b Bard compiled through the same route, so the
# requests the rule removes are shown present without it.  The refusal selects the printed rule on
# that control.  A 2D6 Leadership test of 5+4 fails Ld7.

# Charged by a Fear-causer, the bearer passes the required test before any die: the tape declares
# no Leadership request at all.
- audit_id: rule/catalog/dramatis-personae/hireling.dramatis.grand-master-ippan-shu.rule.immune-to-psychology/mechanic.automatic-leadership
  id: ippan-shu-passes-the-charged-fear-test-without-a-die
  fighters:
    first:
      &auto-recipient
      collection: mordheim
      band_id: hirelings.dramatis-personae.1c
      profile_id: hireling.dramatis.grand-master-ippan-shu
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      trait_overrides: {causes_fear: true}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  initial_state: {first: {attacks: 0}}
  duel_context: {charging: [second], active_participant: second}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.fear_hit_sixes: False, state.first.condition: STANDING, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# "Automatically passes all Leadership-based tests" reaches beyond Psychology: a supplied Danse
# Macabre control state demands a plain Leadership test at the start of his turn, and it too
# passes with no die - the bearer is freed.
- audit_id: rule/catalog/dramatis-personae/hireling.dramatis.grand-master-ippan-shu.rule.immune-to-psychology/mechanic.automatic-leadership
  id: a-non-psychology-leadership-test-also-passes-without-a-die
  fighters:
    first:
      <<: *auto-recipient
      condition_ids: [condition.danse-macabre-controlled]
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  initial_state: {first: {attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.danse_macabre_controlled: False, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# The control (Bard, Ld7) is charged the same way: its two Leadership dice are requested and 9 fails.
