# Rule (grade-2a.yaml, hireling.hired-sword.dwarf-slayer-pirate.rule.slayer-pirate, grant profile):
# the source Slayer/Pirate rules, whose Festooned with Pistols clause keeps a fired pistol in hand as
# a club in the rounds after the opening shot - binding mechanic.festooned-with-pistols (model
# mechanics/mechanic.festooned-with-pistols.yaml).  Hireling family model (README, Hireling
# recipients): the real Slayer Pirate through the hireling route (hirelings.hired-sword.2a /
# hireling.hired-sword.dwarf-slayer-pirate) with the fixture facts (WS3 S3 T3 W2 I5 A1; the printed
# Ld9 stays) and his kit pistol named in hand (the kit lists the sword first, so the firearm must be
# named; pistols fire in close combat; the sword and superior blackpowder stay owned, not held, so
# no parry die is offered and no Strength bonus reaches the shot).  The Pirate charges, so his
# opening-round shot is the first die (a declared miss), and his Initiative 5 strikes first in the
# second round.  The opponent is hand-built (WS3 S3 T3 I2 A1 Ld7, mace; W3, or W1 where the Injury
# roll is the observable); its declared hits are misses, so the Pirate's sibling bindings (Hard to
# Kill, concussion immunity, psychology immunity) request nothing.  Dice: WS3 against WS3 hits on
# 4+; the club's Strength 3 wounds Toughness 3 on 4+ where a fist's Strength 2 needs 5+; the club's
# Concussion turns an Injury roll of 2 into Stunned.

# The Pirate fires in the opening round and keeps the spent pistol as a club: his second-round 4
# wounds at his own Strength.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.dwarf-slayer-pirate.rule.slayer-pirate/mechanic.festooned-with-pistols
  id: the-slayer-pirate-keeps-his-spent-pistol-as-a-club
  fighters:
    first: &pirate
      collection: mordheim
      band_id: hirelings.hired-sword.2a
      profile_id: hireling.hired-sword.dwarf-slayer-pirate
      main_weapon_id: weapon.pistol
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second: &opponent
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: &pirate-charges {charging: [first], active_participant: first}
  maximum_rounds: 2
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.1.first.attack.0.hit, value: 4}
    - {key: round.1.first.attack.0.wound, value: 4}
    - {key: round.1.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.wounds: 3}
    1: {attacks.0.hit: true, attacks.0.damage: 1, state.second.wounds: 2}
  expect_final: {rounds_executed: 2, termination_reason: horizon}

