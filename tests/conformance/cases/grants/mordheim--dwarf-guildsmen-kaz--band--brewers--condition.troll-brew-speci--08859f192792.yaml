# "Never greater than 10": the brew on a drinker already at Weapon Skill 10 and Strength 10 leaves
# both at 10 (the racial maximum is exceeded by design; only the printed 10 binds).
- audit_id: rule/mordheim/dwarf-guildsmen-kaz/band--brewers/condition.troll-brew-special-brew
  id: the-special-brew-never-takes-a-characteristic-above-ten
  fighters:
    first:
      collection: mordheim
      band_id: dwarf-guildsmen-kaz
      profile_id: apprentices
      condition_ids: [condition.troll-brew-special-brew]
      characteristics: {weapon_skill: 10, strength: 10, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 7}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  # Construction is the observation: no charge is declared and the bearer is out of
  # action before the first phase, so no die (not even duel.charge) is requested.
  duel_context: {charging: [], active_participant: first}
  initial_state: {first: {condition: OUT}}
  expect_fighters:
    first.characteristics.weapon_skill: 10
    first.characteristics.strength: 10

