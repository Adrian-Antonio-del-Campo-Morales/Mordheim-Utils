# --- Authored scenarios ---
# Printed text (grade-2b.yaml, Priestess of Shallya / Tranquil Aura): "All models within 2" of the
# Priestess suffer -1 Weapon Skill and -1 Ballistic Skill; the aura has no effect on Daemons or
# Undead."  The Ballistic Skill half is excluded (shooting).  The grant is selectable
# (special_skill_rule_ids); the execution entry carries the tag mechanic.shallya-tranquil-aura, read by
# packages/python/combat-engine/mordheim_combat/modular/contexts.py (~602-609): while a standing
# duelist carries the tag, every duelist in contact who is not nature.daemon / nature.undead has his
# Weapon Skill lowered by one before the To Hit comparison - the bearer included, since the executor
# reads the 2" range as the contact of the duel.  The model is the authored mechanics file
# cases/mechanics/mechanic.shallya-tranquil-aura.yaml, whose header records the open reading ("all
# models within 2 inches" versus "every model but the bearer"); the Weapon Skills below are chosen so
# that every asserted To Hit target is the same under both readings.
#
# Hireling family model (P0, 2026-11-17).  The recipient is the printed Priestess compiled through the
# hireling route (hirelings.hired-sword.2b / hireling.hired-sword.priestess-of-shallya) with the
# fixture facts S3 T3 W2 I5 A1 (the printed Ld8 stays) and her printed walking staff named explicitly
# (main_weapon_id weapon.quarter-staff: two-handed, parry, +1 Initiative) because her Strictures forbid
# the kit dagger in hand.  Fixture deviation: her Weapon Skill is supplied as 4 (not 3) so that the
# weaker opponent's lowered Weapon Skill crosses the "less than half the defender's" threshold under
# either reading of the range (4-vs-2 or 3-vs-1: 5+; 2-vs-4 or 1-vs-3: 3+), as the mechanics model
# does.  Her Strictures forbid her own charge against these opponents, so the hand-built opponent
# (WS2 S3 T3 W3 I2 A1 Ld7, mace) is the charger and strikes first; his hit is followed by her staff's
# parry die, declared as a 1 (fails) so the wound resolves (S3 against T3 on 4+, fours).  The mark is
# selected with special_rule_ids on the real profile; the unselected control is the same profile
# without it; the refusal selects the mark on the grade-1b Bard.

# With the aura the Weapon Skill 2 charger faces a reduced Priestess (WS 3 under the executor's
# reading, 4 under the narrow one) with his own reduced 1: either way less than half, so his To Hit
# target rises from 4 to 5 and the five hits; her own staff keeps its 3+.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.priestess-of-shallya.skill.tranquil-aura/mechanic.shallya-tranquil-aura
  id: the-aura-raises-the-weaker-enemy-s-to-hit-target-against-the-priestess
  fighters:
    first:
      &recipient
      collection: mordheim
      band_id: hirelings.hired-sword.2b
      profile_id: hireling.hired-sword.priestess-of-shallya
      main_weapon_id: weapon.quarter-staff
      characteristics: {weapon_skill: 4, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
      special_rule_ids: [hireling.hired-sword.priestess-of-shallya.skill.tranquil-aura]
    second:
      &weak-charger
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 2, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: &opponent-charges {charging: [second], active_participant: second}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.attack.0.hit, value: 5}
    # Her walking staff parries: the die must beat the five, so the 1 fails.
    - {key: round.0.second.attack.0.parry, value: 1}
    - {key: round.0.second.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
  expect_rounds:
    0: {attacks.0.hit_target: 5, attacks.0.hit: True, attacks.0.parried: False, attacks.1.hit_target: 3,
        state.first.wounds: 1, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# "The aura has no effect on Daemons": the Daemon charger keeps his own Weapon Skill 2, so his To Hit
# target stays 4 and the four hits.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.priestess-of-shallya.skill.tranquil-aura/mechanic.shallya-tranquil-aura
  id: a-daemon-enemy-keeps-its-own-weapon-skill-against-the-aura
  fighters:
    first: *recipient
    second:
      main_weapon_id: weapon.mace
      trait_overrides: {creature_kind: daemon}
      characteristics: {weapon_skill: 2, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: *opponent-charges
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.attack.0.hit, value: 4}
    - {key: round.0.second.attack.0.parry, value: 1}
    - {key: round.0.second.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
  expect_rounds:
    0: {attacks.0.hit_target: 4, attacks.0.hit: True, attacks.1.hit_target: 3,
        state.first.wounds: 1, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

