# --- Authored scenarios ---
# The bearer is charged by a fear-causing opponent and therefore owes a Fear test.  With the
# canonical operator the test passes before any die is requested, so the tape carries no
# Leadership die at all and the declared To Hit roll of four lands.
- audit_id: rule/mordheim/marauders-of-chaos/spawn-of-chaos--psychology/mechanic.automatic-leadership
  id: the-bearer-passes-the-fear-test-without-rolling
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.automatic-leadership]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 3, attacks: 1, leadership: 7}
    second:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.causes-fear]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [second], active_participant: second}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 1}
  expect_rounds:
    0: {attacks.0.hit: false, attacks.1.hit: true, state.first.condition: STANDING}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# Negative control: without the operator the identical bearer rolls the Fear test - the strict
# tape declares those two dice - fails it, and then strikes only on a natural six, so the same
# declared four misses.
- audit_id: rule/mordheim/marauders-of-chaos/spawn-of-chaos--psychology/mechanic.automatic-leadership
  id: without-the-operator-the-charged-bearer-fails-fear-and-strikes-on-sixes
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 3, attacks: 1, leadership: 7}
    second:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.causes-fear]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [second], active_participant: second}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.fear.charged.0, value: 6}
    - {key: round.0.first.fear.charged.1, value: 6}
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.0.first.attack.0.hit, value: 4}
  expect_rounds:
    0: {attacks.0.hit: false, attacks.1.hit: false, state.first.condition: STANDING}
