# The printed Ogre-Hunter Fear on the band's own profile: the ogre-hunter charges, so the opponent it
#   charged is the warrior that takes the printed Leadership test, and 5+4=9 fails against that
#   opponent's printed Leadership 7.  The causer contributes no attack of its own (initial_state), so
#   the only attack die is the charged opponent's, and its declared 4 - a roll that beats its ordinary
#   target - may then only wound on a six.
- audit_id: rule/mordheim/ogre-hunting-party-web/band--huuuuge/profile.equipment-restrictions
  id: the-ogre-hunters-fear-failure-leaves-the-charged-opponent-hitting-only-with-sixes
  covers: [cause-fear]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 10, strength: 8, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
    second: {collection: mordheim, band_id: ogre-hunting-party-web, profile_id: ogre-hunter}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [second], active_participant: second}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.fear.charged.0, value: 5}
    - {key: round.0.first.fear.charged.1, value: 4}
    - {key: round.0.first.attack.0.hit, value: 4}
  expect_rounds:
    0: {state.first.wounds: 3, state.first.condition: STANDING, state.second.wounds: 3, state.second.condition: STANDING}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

