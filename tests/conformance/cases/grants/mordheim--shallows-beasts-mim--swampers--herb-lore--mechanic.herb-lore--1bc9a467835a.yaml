# Conformance authoring scaffold; generated comments, manually authored scenarios.
# audit_id: rule/mordheim/shallows-beasts-mim/swampers--herb-lore/mechanic.herb-lore
# authoring_status: AUTHORED
# authoring_progress: the admitted self-heal clause carries three authored scenarios on the band's own
#   printed Swamper (profile row swampers--herb-lore, scope YES / implemented YES / grant profile,
#   mechanic.herb-lore binding).  The printed restoration face is reached through the duel itself, not
#   an invented starting state: the opponent takes the Swamper's single printed wound in round 0 and the
#   injury die leaves it Knocked Down at zero wounds; in the Swamper's own following turn the healing is
#   offered, and the printed "on a roll of 4+ the model has 1 wound restored" restores the wound on a
#   four and does not on a three.  The full-health face (no healing request when no wound is missing) is
#   kept.  The request keys round.N.first.herb-lore (decision and die) were read from the engine's step
#   names only.  REVIEWED still requires manual semantic review and execution_status stays UNEXECUTED.
# execution_status: UNEXECUTED (this scaffold has no behavioral result)
#
# Derive inputs and expectations from rule text and accepted rulings.
# Do not derive them from the engine or execute combat during authoring.
# REVIEWED requires semantic review; covers labels alone are insufficient.
# Preserve audit_id when filling this file.
# Governing rulings: docs/decisions/design-rulings.md
#
# Clause: heal-in-recovery-phase--scope--self-heal (scope: YES)
# AUTHORED[heal-in-recovery-phase--scope--self-heal]: 3 scenarios.  A Swamper that lost its wound in the
# opponent's turn is offered the self-heal at the start of its own turn and a four restores one wound; a
# three (one face below the printed 4+) restores nothing; at full health no healing is requested at all.
# The duel has no separate recovery-phase step; the start of the bearer's own turn is the step that
# carries the printed healing.  (Superseded 2026-11-16: the earlier note that the binding was the null
# placeholder and that no lost-wound state is reachable is false - the row binds mechanic.herb-lore and
# the opponent's blow supplies the lost wound.)
#
# Clause: heal-in-recovery-phase--scope--ally-heal (scope: NO)
# Outside the admitted clause scope; retained for context, not a test TODO.

# --- Authored scenarios ---
# Derived from the printed rule row (implemented YES, mechanic.herb-lore binding) and the printed
# Swamper profile (wounds 1); no engine output was consulted.  In the first scenario no wound is ever
# missing, so the healing decision/die must not be requested; only the two missed attacks are declared.

- audit_id: rule/mordheim/shallows-beasts-mim/swampers--herb-lore/mechanic.herb-lore
  id: the-full-health-bearer-never-requests-the-healing-die
  covers: [heal-in-recovery-phase--scope--self-heal]
  # The bearer stays at the printed maximum of one wound for the whole duel, so the healing
  # branch is never entered: no round.N.first.herb-lore decision and die is requested.  An
  # implementation that asked for a healing roll at full health would fail this tape.
  fighters:
    first: {collection: mordheim, band_id: shallows-beasts-mim, profile_id: swampers}
    second:
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  # Neither warrior charges, but the round still resolves both attack pools; natural
  # ones are misses, so no combat consequence distracts from the absent healing request.
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The printed restoration face.  Round 0 is the opponent's turn: its higher Initiative (5 against the
# printed 3) lets it strike first, its four hits the printed Weapon Skill 2, its four wounds the printed
# Toughness 3 with Strength 3, and the injury die of one is Knocked Down, so the single printed wound is
# gone and the Swamper makes no attack that round.  Round 1 is the Swamper's turn: it uses the skill on
# itself and the four restores one wound ("on a roll of 4+ the model has 1 wound restored").  The two
# natural ones of round 1 are misses, so nothing else changes the wound count.
- audit_id: rule/mordheim/shallows-beasts-mim/swampers--herb-lore/mechanic.herb-lore
  id: a-four-restores-the-swampers-lost-wound
  covers: [heal-in-recovery-phase--scope--self-heal]
  fighters:
    first: {collection: mordheim, band_id: shallows-beasts-mim, profile_id: swampers}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 7}
  duel_context: {charging: [], active_participant: second}
  maximum_rounds: 2
  decisions:
    - {key: round.1.first.herb-lore, value: true}
  rolls:
    - {key: round.0.second.attack.0.hit, value: 4}
    - {key: round.0.second.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.injury.0, value: 1}
    - {key: round.1.first.herb-lore, value: 4}
    - {key: round.1.second.attack.0.hit, value: 1}
    - {key: round.1.first.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.wounds: 0, state.first.condition: KNOCKED_DOWN}
    1: {state.first.wounds: 1, state.first.condition: STANDING}
  expect_final: {rounds_executed: 2, termination_reason: horizon}

# The printed threshold from below: the same duel with a three on the healing die restores nothing.
- audit_id: rule/mordheim/shallows-beasts-mim/swampers--herb-lore/mechanic.herb-lore
