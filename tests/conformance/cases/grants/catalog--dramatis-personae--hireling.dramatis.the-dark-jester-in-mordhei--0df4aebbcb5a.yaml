# One trip per combat turn: with two Attacks supplied, the first hit spends the trip (the 1 fails) and
# the second hit is not offered it - its wound die is rolled instead (1 fails).
- audit_id: rule/catalog/dramatis-personae/hireling.dramatis.the-dark-jester-in-mordheim.rule.trip/trip
  id: one-trip-per-round-the-second-attack-rolls-to-wound
  fighters:
    first: *jester-trip-recipient
    second: *jester-trip-opponent
  initial_state: {first: {attacks: 2}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    # Both hits of the side are rolled before their resolution (README tape order).
    - {key: round.0.first.attack.1.hit, value: 4}
    - {key: round.0.first.attack.0.trip-roll, value: 1}
    - {key: round.0.first.attack.1.wound, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  decisions:
    - {key: round.0.first.jester-trick.dodge_trick_active, value: false}
    - {key: round.0.first.jester-trick.banter_trick_active, value: false}
    - {key: round.0.first.jester-trick.trip_trick_active, value: true}
    - {key: round.0.first.attack.0.trip.hit, value: true}
  expect_rounds:
    0: {attacks.0.hit: True, attacks.0.wounded: False, attacks.1.hit: True, attacks.1.wounded: False, state.second.condition: STANDING, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

