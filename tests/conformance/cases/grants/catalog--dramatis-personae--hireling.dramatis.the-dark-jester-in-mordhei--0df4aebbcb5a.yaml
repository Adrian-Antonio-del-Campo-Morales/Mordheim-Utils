# Rule (grade-2a.yaml, hireling.dramatis.the-dark-jester-in-mordheim.rule.trip, grant profile): "May
# replace a wound attempt with a source 2+ trip" - binding mechanic.confound-and-confuse (the Trip is one
# of the three tricks Confound and Confuse chooses each combat turn).  Hireling family model (README,
# Hireling recipients): the real Jester through the hireling route (hirelings.dramatis-personae.2a) with
# the fixture facts (WS3 S3 T3 W2 I5 A1; printed Ld7 stays) and the printed kit's default club; his
# printed rules are granted by the profile, so nothing is selected.  The opponent is hand-built (WS3 S3
# T3 W3 I2 A1 Ld7, mace, no armour).  The control is the grade-1b Bard.  Protocol
# (tests/construction/test_dark_jester_contracts.py): each round the chooser offers the three slots in
# order - round.<i>.<side>.jester-trick.dodge_trick_active, .banter_trick_active, .trip_trick_active -
# and stops at the first accepted; after a successful hit the trip is offered as
# round.<i>.<side>.attack.<n>.trip.hit and its die is round.<i>.<side>.attack.<n>.trip-roll (2+ knocks
# the opponent down).  Dice: WS3 against WS3 hits on 4+; S3 wounds T3 on 4+; the uncharged duel orders
# the blows by Initiative (5 before 2); a knocked-down warrior makes no attack.

# The trip is chosen and accepted after the hit; the 2 knocks the opponent down, no wound die is rolled,
# and the knocked-down opponent makes no reply.
- audit_id: rule/catalog/dramatis-personae/hireling.dramatis.the-dark-jester-in-mordheim.rule.trip/trip
  id: the-chosen-trip-replaces-the-wound-roll-and-knocks-the-opponent-down
  fighters:
    first:
      &jester-trip-recipient
      collection: mordheim
      band_id: hirelings.dramatis-personae.2a
      profile_id: hireling.dramatis.the-dark-jester-in-mordheim
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      &jester-trip-opponent
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.trip-roll, value: 2}
  decisions:
    - {key: round.0.first.jester-trick.dodge_trick_active, value: false}
    - {key: round.0.first.jester-trick.banter_trick_active, value: false}
    - {key: round.0.first.jester-trick.trip_trick_active, value: true}
    - {key: round.0.first.attack.0.trip.hit, value: true}
  expect_rounds:
    0: {attacks.0.hit: True, attacks.0.wounded: False, state.second.condition: KNOCKED_DOWN, state.second.wounds: 3, state.first.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

