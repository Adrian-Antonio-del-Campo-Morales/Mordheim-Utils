# Family model (Hatred of Orcs and Goblins, band grant).  The record band--town-crier-6-inheritance
# (Karak Azgal p.26: "All of the special rules ... from Town Crier 6 (or Best of Town Crier) apply
# apart from Incomparable Miners") is a `grant: band` rule whose hatred effect binds
# mechanic.hatred-orcs-goblins, the Town Crier 6 Dwarf rule "Hate Orcs and Goblins: all Dwarfs are
# subject to Hatred of Orcs and Goblins" - the Rulebook's Hatred re-rolls the bearer's missed hits in
# the first round of a combat only.  The consumer reads the opponent's species fact (species.orc or
# species.goblin) or a greenskin identity.  A band grant selects nothing, so there is no refusal to
# evidence; the control is the same bearer against an opponent that declares no hated kind.
# Fixture facts: the bearer is the band's printed Master Craftsman with the corpus characteristics (WS3 S3 T3 W2
# I5 A1; the printed Leadership stays) and the mace of the band's own list; it charges.  The opponent
# is hand-built (WS3 S3 T3 W3 I2 A1 Ld7, mace) and its own hits are natural 1s.  A natural 2 misses WS3
# on 4+; the re-roll of 4 hits and S3 wounds T3 on 4+ (no critical die below a 6).

# Against an Orc the first-round miss is re-rolled, hits and wounds.
- audit_id: rule/mordheim/dwarf-guildsmen-kaz/band--town-crier-6-inheritance/inherited.dwarf-guildsmen-kaz.band.town-crier-6-inheritance.hatred-orcs-goblins
  id: a-first-round-miss-is-rerolled-against-an-orc
  fighters:
    first: &dwarf-bearer
      collection: mordheim
      band_id: dwarf-guildsmen-kaz
      profile_id: master-craftsman
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      trait_overrides: {species: orc}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: &dwarf-charges {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 2}
