# Printed text (grade-1b.yaml, Animal Handler): "a Mule Skinner starts with one Animal Handling skill
# (the player chooses which animal)."  The binding is compiler.animal-handler-skill-choice with the two
# published options as its parameter; the shared requiredInitial stage
# (packages/typescript/domain/eligibility/index.ts) refuses when the count of selected options is not
# one: "Animal Handler requires exactly one Animal Handling skill: <band>/<profile>".  The recipient is
# the printed Mule Skinner compiled through the hireling route (hirelings.hired-sword.1b /
# hireling.hired-sword.mule-skinner) with the fixture facts (WS3 S3 T3 W2 I5 A1; the printed Ld7 stays);
# the kit's whip (weapon.whip-tc14) is the default weapon.  The control for absence is the grade-1b
# Bard, a hireling of the same package without the rule.

# No Animal Handling skill chosen: the printed single choice is a floor.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.mule-skinner.rule.animal-handler/compiler.animal-handler-skill-choice
  id: a-mule-skinner-without-an-animal-handling-skill-is-refused
  fighters:
    first:
      collection: mordheim
      band_id: hirelings.hired-sword.1b
      profile_id: hireling.hired-sword.mule-skinner
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
  expect_error: "Animal Handler requires exactly one Animal Handling skill: hirelings.hired-sword.1b/hireling.hired-sword.mule-skinner"

