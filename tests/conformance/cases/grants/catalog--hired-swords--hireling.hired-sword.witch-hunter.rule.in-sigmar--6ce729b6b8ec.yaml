  initial_state: {first: {attacks: 0}}
  duel_context: {charging: [second], active_participant: second}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.fear.charged.reroll, value: true}
  rolls:
    - {key: round.0.first.fear.charged.0, value: 6}
    - {key: round.0.first.fear.charged.1, value: 6}
    - {key: round.0.first.fear.charged.reroll.0, value: 6}
    - {key: round.0.first.fear.charged.reroll.1, value: 6}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.fear_hit_sixes: True, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

