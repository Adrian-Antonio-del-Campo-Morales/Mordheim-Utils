# Printed clause (special-rules.yaml, condemned--inconsistency): "WS, S, T and A are variable. Whenever
# one of these characteristics is needed, roll its indicated die once for that turn."  Printed profile:
# WS D6, S D6, T D6, A D3 (M4 BS3 W1 I4 Ld7 fixed).  The Condemned compiles through its band route
# (marauders-of-chaos / condemned) with no supplied line, so the printed dice rows are the profile; the
# opponent is hand-built (WS3 S3 T3 W3 I2 A1 Ld7, mace, no armour) and silenced (attacks 0) so every
# die is the Condemned's own; Initiative 4 against 2 orders his blow first.  Dice (the Inconsistency
# convention): the pool needs the variable Attacks (round.<i>.first.characteristic.A.0, a D3), the blow
# needs the variable Weapon Skill (round.<i>.first.attack.<n>.attacker.characteristic.WS.0) and a hit
# needs the variable Strength (round.<i>.first.attack.<n>.attacker.characteristic.S.0).  To-hit chart:
# WS1 against WS3 needs 5+, WS6 against WS3 needs 3+.  S6 against T3 wounds on 2+; a wound die never
# shows a 6 so no critical die follows.

- audit_id: rule/mordheim/marauders-of-chaos/condemned--inconsistency/mechanic.inconsistency
  id: a-weapon-skill-of-one-rolled-when-needed-sets-the-hit-target-to-five
  fighters:
    first:
      &condemned-recipient
      collection: mordheim
      band_id: marauders-of-chaos
      profile_id: condemned
    second:
      &condemned-inconsistency-opponent
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.characteristic.A.0, sides: 3, value: 1}
    - {key: round.0.first.attack.0.attacker.characteristic.WS.0, value: 1}
    - {key: round.0.first.attack.0.hit, value: 4}
  expect_rounds:
    0: {attacks.0.hit_target: 5, attacks.0.hit: False, state.first.weapon_skill: 1, state.first.initiative: 4, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

