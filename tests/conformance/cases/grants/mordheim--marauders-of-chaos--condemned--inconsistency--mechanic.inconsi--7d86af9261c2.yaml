- audit_id: rule/mordheim/marauders-of-chaos/condemned--inconsistency/mechanic.inconsistency
  id: another-profile-of-the-band-is-refused
  fighters:
    first:
      collection: mordheim
      band_id: marauders-of-chaos
      profile_id: champions
      special_rule_ids: [condemned--inconsistency]
    second: *condemned-inconsistency-opponent
  expect_error: "special rule is not available to marauders-of-chaos"
