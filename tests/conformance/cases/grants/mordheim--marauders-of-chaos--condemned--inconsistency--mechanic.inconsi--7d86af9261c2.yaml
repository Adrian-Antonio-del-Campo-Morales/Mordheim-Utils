# Nothing variable remains: a Condemned whose four characteristics were permanently fixed by Fate
# (supplied as condemned_fixed_characteristics with the fixed line) rolls no characteristic die and
# hits on the fixed WS3's ordinary 4+ (the wound die then fails on a 1).
- audit_id: rule/mordheim/marauders-of-chaos/condemned--inconsistency/mechanic.inconsistency
  id: a-condemned-with-every-characteristic-fixed-rolls-no-characteristic-die
  fighters:
    first:
      collection: mordheim
      band_id: marauders-of-chaos
      profile_id: condemned
      trait_overrides: {condemned_fixed_characteristics: [WS, S, T, A]}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 4, attacks: 1, leadership: 7}
    second: *condemned-inconsistency-opponent
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 1}
  expect_fighters:
    first.random_characteristics: []
  expect_rounds:
    0: {attacks.0.hit_target: 4, attacks.0.hit: True, attacks.0.wounded: False, state.first.weapon_skill: 3, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

