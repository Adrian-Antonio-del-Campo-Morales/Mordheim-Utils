#
# AUTHORED: 4 scenarios carry the printed per-ally bonus onto the real route, the
#   Fear test a charged warrior takes, and the discriminating boundary is the declared total 3+4=7: the Raging
#   Peasant's printed Leadership is 6 (profiles.yaml, id raging-peasants), so a seven fails on its own value
#   and passes only once the printed +1 per allied Peasant within 3 inches is supplied.  In the bonus tape two
#   allied Peasants are supplied as admitted nearby participants of the same band at 1 and 2 inches, and the
#   declared seven passes, so the round resolves with both attack dice.  In its control the same declared
#   seven fails with no ally supplied, so the received charge clamps its hits to sixes.  The allies
#   are supplied facts, never simulated: they appear only through duel_context.nearby and distances and
#   contribute no attack of their own; the count itself travels as the admitted mob_allies fact the printed
#   rule names, which leadership.resolve_local_leadership adds to every test of the carrier.
#   REVIEWED still requires manual semantic review.
#
# AUTHORED: 2 scenarios deny the leader borrow this warrior may not take, and the runner
#   fixture supplies the aura the old note called missing: the band's own Emissary (printed Leadership 8, the
#   profile whose rule_ids carry emissary--leader) stands four inches from the recipient as an admitted nearby
#   participant with its declared distance.  The charged Raging Peasant still tests on its own printed
#   Leadership 6, so the declared seven fails and the received charge clamps its hits; the control is a Soldiers band-mate
#   (printed Leadership 7) with the same supplied Emissary, which does borrow, and its declared eight passes.
#   The peasant-level denial travels as the profile's own mechanic.own-leadership tag, which
#   leadership.resolve_local_leadership honours by never offering the supplied leader; the pair of tapes
#   detects exactly that.  REVIEWED still requires manual semantic review.
#

# --- Authored scenarios ---
# Derived from the printed rules, the printed profiles of this band and the supplied-participant vocabulary;
# no engine output was consulted.  The vehicle is the round-0 Fear test of the charged warrior, the individual
# Leadership test this setup can force; the charger is a hand-built fixture that declares its own facts, and the
# nearby allies and leader are supplied participants, never simulated fighters with turns of their own.

# The printed bonus: two allied Peasants within 3 inches supply +1 Ld each, so the carrier's printed
# Leadership 6 becomes 8 and the declared 3+4 passes.  The count travels as the admitted mob_allies fact the
# printed rule names, supplied here together with the two allies the caller counted.
- audit_id: rule/mordheim/battle-monks-of-cathay/raging-peasants--mob/mechanic.mob-leadership
  id: two-supplied-allied-peasants-raise-the-test-that-passes
  fighters:
    first:
      trait_overrides: {causes_fear: true}
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 10, attacks: 1, leadership: 7}
    second:
      collection: mordheim
      band_id: battle-monks-of-cathay
      profile_id: raging-peasants
      trait_overrides: {mob_allies: 2}
  duel_context:
    first_id: first
    second_id: second
    charging: [first]
    active_participant: first
    distances: [[second, ally-one, 1], [second, ally-two, 2]]
    nearby:
    - participant_id: ally-one
      side_id: second
      condition: standing
      fighter: {collection: mordheim, band_id: battle-monks-of-cathay, profile_id: raging-peasants}
    - participant_id: ally-two
      side_id: second
      condition: standing
      fighter: {collection: mordheim, band_id: battle-monks-of-cathay, profile_id: raging-peasants}
  maximum_rounds: 1
  rolls:
  - {key: round.0.second.fear.charged.0, value: 3}
  - {key: round.0.second.fear.charged.1, value: 4}
  - {key: round.0.first.attack.0.hit, value: 1}
  - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.wounds: 3, state.first.condition: STANDING, state.second.wounds: 1, state.second.condition: STANDING, state.second.fear_hit_sixes: false}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

