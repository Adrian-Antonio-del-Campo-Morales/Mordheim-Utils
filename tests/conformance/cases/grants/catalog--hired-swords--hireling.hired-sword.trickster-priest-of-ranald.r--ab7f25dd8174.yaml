# Hireling family model (P0, 2026-11-17).  The recipient is the printed Trickster-Priest of Ranald
# compiled through the hireling route (hirelings.hired-sword.2b /
# hireling.hired-sword.trickster-priest-of-ranald) with the fixture facts (WS3 S3 T3 W2 I5 A1; the
# printed Ld7 stays); the Mark of Ranald is selectable, so the recipient selects it through
# special_rule_ids and the control is the same profile without the selection.  The printed kit's
# first close-combat weapon (the ceremonial dagger) is the default, and a dagger grants its target
# the printed 6+ save.  The opponent is hand-built (WS3 S3 T3 W3 I2 A1 Ld7, mace; the Fear
# scenario adds causes_fear).  Printed Ranald's Luck: "once during each battle the Priest may
# influence the result of any dice roll he makes by +1 or -1" - every one of his own modifiable
# rolls carries the +1 and then the -1 declaration until the `ranalds-luck` resource is spent.
# The selected rule also grants the unmodifiable 6+ duck (the sibling identity); the opponent's
# blows are declared natural misses so the duck is never requested here.  The refusal selects the
# printed rule on the grade-1b Bard.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.trickster-priest-of-ranald.rule.marks-of-ranald/mechanic.ranalds-luck
  id: plus-one-turns-the-priests-near-miss-into-a-hit
  fighters:
    first:
      &luck-recipient
      collection: mordheim
      band_id: hirelings.hired-sword.2b
      profile_id: hireling.hired-sword.trickster-priest-of-ranald
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
      special_rule_ids: [hireling.hired-sword.trickster-priest-of-ranald.rule.marks-of-ranald]
    second:
      &luck-opponent
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.attack.0.hit.ranalds-luck.plus, value: true}
  rolls:
    # The declared 3 misses the 4+ face; the accepted +1 makes it a hit.
    - {key: round.0.first.attack.0.hit, value: 3}
    # The wound die carries no declaration: the once-per-battle pip is already spent.
    - {key: round.0.first.attack.0.wound, value: 4}
    # The printed dagger grants its target a 6+ save; the declared 1 fails it.
    - {key: round.0.first.attack.0.armour, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: True, attacks.0.damage: 1, state.second.wounds: 2, state.first.resources_spent: [ranalds-luck]}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# The printed influence is "+1 or -1": lowering his own second Fear die by one passes 4+4 against
# the printed Leadership 7.  The Fear dice are rolls he makes, so each carries the declaration.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.trickster-priest-of-ranald.rule.marks-of-ranald/mechanic.ranalds-luck
  id: minus-one-on-his-own-fear-die-passes-the-test
  fighters:
    first: *luck-recipient
    second:
      main_weapon_id: weapon.mace
      trait_overrides: {causes_fear: true}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  initial_state: {first: {attacks: 0}}
  duel_context: {charging: [second], active_participant: second}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.fear.charged.0.ranalds-luck.plus, value: false}
    - {key: round.0.first.fear.charged.0.ranalds-luck.minus, value: false}
    - {key: round.0.first.fear.charged.1.ranalds-luck.plus, value: false}
    - {key: round.0.first.fear.charged.1.ranalds-luck.minus, value: true}
  rolls:
    # 4+4 would fail Leadership 7; the accepted -1 on the second die makes it 4+3=7, a pass.
    - {key: round.0.first.fear.charged.0, value: 4}
    - {key: round.0.first.fear.charged.1, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.fear_hit_sixes: False, state.first.resources_spent: [ranalds-luck]}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
