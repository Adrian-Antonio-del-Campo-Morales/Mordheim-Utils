# --- Authored scenarios ---
# Derived from the printed table sentence, the reviewed EQ-P-SKILL-ACCESS row, this band's own profiles.yaml
# and the established skill-availability family; no engine output was consulted.  Neither tape declares an
# attack of its own, so the observation is the access decision itself.

- audit_id: rule/mordheim/channel-rats-mim/band--strigany-special-skills-list/profile.skill-access
  id: a-special-skill-outside-the-printed-tables-is-refused-for-a-strigany-hero
  # The closure of the printed access: the Strigany heroes may use the named table *instead of* the standard
  # tables, so a special skill no printed Strigany table contains is not available to one of them.  The
  # recipient is this band's own printed Strigany hero (profiles.yaml id domnu, whose skill_access carries
  # the special category) and the declared identity is a registered catalogue warband skill that is not a
  # member of any printed Strigany table.  The sentence is the shared skill-availability family; today it is
  # produced by the absent member projection, which is why it stands beside the henchman control below and
  # the marker records that limit rather than claiming a printed member boundary.
  fighters:
    first:
      collection: mordheim
      band_id: channel-rats-mim
      profile_id: domnu
      skill_ids: [skill.monster-slayer]
  expect_error: "skills are not available to channel-rats-mim/domnu: ['skill.monster-slayer']"

- audit_id: rule/mordheim/channel-rats-mim/band--strigany-special-skills-list/profile.skill-access
  id: the-same-skill-is-refused-for-a-band-henchman
  # The printed permission names the Strigany HEROES; this band's henchmen print no skill access at all
  # (profiles.yaml, fugitives), so the same special skill is refused for them too.  The pair is the
  # recipient gate of the same printed sentence.
  fighters:
    first:
      collection: mordheim
      band_id: channel-rats-mim
      profile_id: fugitives
      skill_ids: [skill.monster-slayer]
  expect_error: "skills are not available to channel-rats-mim/fugitives: ['skill.monster-slayer']"

