# --- Authored scenarios ---
# Printed text (grade-2b.yaml, Warrior-Priest of Sigmar / Enlightened): "Divine purpose washes over the
# Priest; he automatically passes all Leadership based tests taken while fighting against Orcs &
# Goblins or the followers of Chaos."  The grant is selectable (special_skill_rule_ids); the execution
# entry carries the tag mechanic.sigmar-enlightened, read by
# packages/python/combat-engine/mordheim_combat/modular/leadership.py (~157-165): any Leadership test
# of the tagged fighter passes before a die when the duel opponent is tagged species.orc,
# species.goblin, warband-group.chaotic, nature.daemon, nature.possessed or identity.chaos-follower.
# The model is the authored mechanics file cases/mechanics/mechanic.sigmar-enlightened.yaml (which
# records that the printed names map to those opponent tags only through the caller-supplied facts).
# The Leadership test available to this Priest in a duel is Fear: he has no Stupidity, so the opponent
# declares causes_fear together with its kind and charges him.
#
# Hireling family model (P0, 2026-11-17).  The recipient is the printed Warrior-Priest compiled through
# the hireling route (hirelings.hired-sword.2b / hireling.hired-sword.warrior-priest-of-sigmar-miracle-workers)
# with the fixture facts (WS3 S3 T3 W2 I5 A1; the printed Ld8 stays); his omitted main weapon is the
# kit's ceremonial dagger and he contributes no swing (initial_state), so its 6+ save never comes up.
# His Prayers are outside the duel and no other mark is selected.  The opponent is hand-built
# (WS3 S3 T3 W3 I2 A1 Ld7, mace), charges, declares causes_fear and the one kind fact the rule reads;
# his blow is a natural 1.  The mark is selected with special_rule_ids; the unselected control is the
# same profile without it; the refusal selects the mark on the grade-1b Bard.  A 2D6 Fear test of 5+4
# fails Ld8; a warrior who failed it hits only on sixes (fear_hit_sixes).

# Charged by a fear-causing Orc, the enlightened Priest passes before any die: the tape declares no
# Fear request.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.warrior-priest-of-sigmar-miracle-workers.skill.enlightened/mechanic.sigmar-enlightened
  id: the-priest-passes-the-fear-test-of-a-charging-orc-without-a-die
  fighters:
    first:
      &recipient
      collection: mordheim
      band_id: hirelings.hired-sword.2b
      profile_id: hireling.hired-sword.warrior-priest-of-sigmar-miracle-workers
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
      special_rule_ids: [hireling.hired-sword.warrior-priest-of-sigmar-miracle-workers.skill.enlightened]
    second:
      &fearsome-orc
      main_weapon_id: weapon.mace
      trait_overrides: {species: orc, causes_fear: true}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  initial_state: {first: {attacks: 0}}
  duel_context: &opponent-charges {charging: [second], active_participant: second}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.fear_hit_sixes: False, state.first.condition: STANDING, state.first.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

