# A fear-causing Dwarf qualifies for nothing: the same Priest rolls his test, 5+4 fails Ld8, and he is
# left hitting only on sixes.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.warrior-priest-of-sigmar-miracle-workers.skill.enlightened/mechanic.sigmar-enlightened
  id: an-opponent-that-qualifies-for-nothing-forces-the-rolled-test
  fighters:
    first: *recipient
    second:
      main_weapon_id: weapon.mace
      trait_overrides: {species: dwarf, causes_fear: true}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  initial_state: {first: {attacks: 0}}
  duel_context: *opponent-charges
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.fear.charged.0, value: 5}
    - {key: round.0.first.fear.charged.1, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.fear_hit_sixes: True, state.first.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

