#   the printed exception "except Hardened Leather provides no additional bonus" is unobservable in this revision and is recorded rather than dropped: a Lizardman wearing hardened or toughened leathers is a build the printed lists forbid (skinks-, saurus- and kroxigor-equipment-list offer no such item, and no band package pairs it with a Scaly Skin profile), so the compiler's cancellation of the leather contribution has no legal recipient to observe.  The representable half - the prohibition itself - is authored below as a construction refusal with the corpus's established armour-prohibition diagnostic `armour is forbidden for <band>/<profile>`, the same contract the kroxigor identities use, so an illegally armoured Lizardman is refused instead of silently keeping the natural save.  The remaining terms of this printed rule (the two natural saves, the 6+ floor, the ordinary-armour combination and the ignore-armour negation) are authored above.
