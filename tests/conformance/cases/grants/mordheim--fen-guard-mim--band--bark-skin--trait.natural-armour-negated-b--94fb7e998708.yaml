# Fire ignores the hide, not armour: a fixture in ordinary heavy armour (5+, read 6+ under the
# brazier's Strength 4) is still offered its die and the six holds.
- audit_id: rule/mordheim/fen-guard-mim/band--bark-skin/trait.natural-armour-negated-by-fire
  id: a-fire-attack-still-offers-ordinary-armour-its-die
  fighters:
    first: *fire-attacker
    second:
      main_weapon_id: weapon.mace
      armour_id: armour.heavy-armour
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 3, attacks: 1}
  initial_state: {second: {attacks: 0}}
  duel_context: *uncharged
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.ignition, value: 1}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.armour, value: 6}
  expect_fighters:
    second.global_effects.natural_armour_negated_by_fire: False
  expect_rounds:
    0: {attacks.0.saved: true, state.second.wounds: 2, state.second.condition: STANDING}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The whole rule is ignored by fire, its stacking included: a shielded Spiteborn keeps only the
# shield (6+), which the brazier's Strength 4 worsens to 7, so no die is asked.  See the semantic
# wrinkle in the header.
- audit_id: rule/mordheim/fen-guard-mim/band--bark-skin/trait.natural-armour-negated-by-fire
