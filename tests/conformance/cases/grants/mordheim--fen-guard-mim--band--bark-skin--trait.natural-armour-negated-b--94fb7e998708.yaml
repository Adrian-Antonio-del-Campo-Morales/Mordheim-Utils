# Printed text (fen-guard-mim/special-rules.yaml, Bark Skin): "... and fire attacks ignore this
# rule."  This binding is the fire half (trait.natural-armour-negated-by-fire, parameters value
# true); the 6+ itself, with its own no-save-and-fire-negation clause, is the sibling
# trait.natural-armour-save (...c715ffc7df28), the stacking ...75fb537b4c34 and the cap
# ...a5c3a6ff4699.  Ruling: design-rulings.md "Fire and other synthetic hits are hits" - a fire hit
# is a hit against which the victim keeps its real defences; the brazier iron is the catalogue's fire
# producer in a duel (execution.yaml weapon.brazier-iron: tags attack.fire, strength_bonus 1,
# two_handed, ignition_threshold 5).  Compiler: the trait lands as natural_armour_negated_by_fire
# (compiler.py ~495) and is projected onto global_effects.natural_armour_negated_by_fire (~1237).
# Engine: modular/contexts.py ~839 sets flaming_attack from the attack's attack.fire tag; phases.py
# armour_target (~631-634) sets the natural save to 7 when both hold, so resolve_armour asks no die;
# the brazier's ignition die round.<i>.<attacker>.attack.<n>.ignition (modular/attacks.py ~491-496)
# is asked after the hit and declared a one (no ignition).
# Family model (the sibling file): the Spiteborn (T2, W2) with a sword (a parry die follows every
# hit and is declared a one); a hand-built attacker (Weapon Skill 10 and Initiative 10 are fixture
# facts) with the brazier iron at base Strength 3 strikes at Strength 4 (wounds Toughness 2 on 2+,
# Toughness 3 on 3+; -1 to an ordinary save), so the non-fire control is a mace at Strength 4.  The
# duel is uncharged, the bearer contributes no attacks and the wound face stays below a natural six.

# A fire attack is offered no hide die at all: the strict tape ends at the wound.
- audit_id: rule/mordheim/fen-guard-mim/band--bark-skin/trait.natural-armour-negated-by-fire
  id: a-fire-attack-is-offered-no-hide-die
  fighters:
    first:
      &fire-attacker
      main_weapon_id: weapon.brazier-iron
      characteristics: {weapon_skill: 10, strength: 3, toughness: 3, wounds: 3, initiative: 10, attacks: 1}
    second:
      &spiteborn
      collection: mordheim
      band_id: fen-guard-mim
      profile_id: spiteborn
      main_weapon_id: weapon.sword
  initial_state: {second: {wounds: 2, attacks: 0}}
  duel_context: &uncharged {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.parry, value: 1}
    - {key: round.0.first.attack.0.ignition, value: 1}
    - {key: round.0.first.attack.0.wound, value: 5}
  expect_fighters:
    second.global_effects.natural_armour_negated_by_fire: True
  expect_rounds:
    0: {attacks.0.saved: false, attacks.0.damage: 1, state.second.wounds: 1, state.second.condition: STANDING}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

