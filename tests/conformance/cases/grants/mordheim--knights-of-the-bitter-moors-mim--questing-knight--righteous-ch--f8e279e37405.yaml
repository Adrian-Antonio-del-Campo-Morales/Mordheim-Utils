# --- Authored scenarios ---
# The recipient is the band's printed Questing Knight (knights-of-the-bitter-moors-mim /
# questing-knight; his Righteous Charge is a profile grant, so nothing is selected) with the corpus
# characteristics (WS3 S3 T3 W2 I5 A1; the printed Ld8 stays) and the sword of the Knights equipment
# list; his fixed warhorse stays owned (the duel is fought on foot).  His Leader rule lends Leadership
# to nobody here and Knight's Virtue adds no die.  The opponent is hand-built (WS3 S3 T3 W3 I2 A1 Ld7,
# mace).  WS3 against WS3 hits on 4+; the opponent, charged by a warrior that does not cause Fear,
# takes no Fear test.

# The printed Knight with the Righteous Charge activation supplied, but not mounted: refused by name.
- audit_id: rule/mordheim/knights-of-the-bitter-moors-mim/questing-knight--righteous-charge/mechanic.righteous-charge
  id: the-unmounted-questing-knight-with-a-supplied-righteous-charge-is-refused
  fighters:
    first:
      collection: mordheim
      band_id: knights-of-the-bitter-moors-mim
      profile_id: questing-knight
      main_weapon_id: weapon.sword
      trait_overrides: {righteous_charge_active: true}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  expect_error: "Righteous Charge requires a mounted recipient"

