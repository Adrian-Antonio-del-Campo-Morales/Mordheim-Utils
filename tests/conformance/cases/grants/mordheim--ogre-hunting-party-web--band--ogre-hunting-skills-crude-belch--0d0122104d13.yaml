# --- Authored scenarios ---

# The printed Ogre stanza on the real build: "Those that do not pass a Ld test suffer a -1 'to hit'
# modifier for the turn". 6+6 fails the enemy's Leadership 7, so its 4+ becomes 5+ and the declared 4 misses.
- audit_id: rule/mordheim/ogre-hunting-party-web/band--ogre-hunting-skills-crude-belch/mechanic.crude-belch-ogre
  id: the-ogre-hunters-belch-gives-a-failing-enemy-minus-one-to-hit
  fighters:
    first:
      collection: mordheim
      band_id: ogre-hunting-party-web
      profile_id: ogre-hunter
      special_rule_ids: [band--ogre-hunting-skills-crude-belch]
      main_weapon_id: weapon.club
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 7}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.crude-belch-ogre, value: true}
  rolls:
    # The printed Ogre causes Fear: the charged enemy passes its test (1+1 against Ld 7).
    - {key: round.0.second.fear.charged.0, value: 1}
    - {key: round.0.second.fear.charged.1, value: 1}
    - {key: round.0.first.crude-belch-ogre.leadership.0, value: 6}
    - {key: round.0.first.crude-belch-ogre.leadership.1, value: 6}
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 4}
  expect_rounds:
    0: {attacks.1.hit_target: 5, attacks.1.hit: false, state.first.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# Control on the same build: 1+1 passes Leadership 7, so the enemy keeps its 4+ and its 4 hits (the
