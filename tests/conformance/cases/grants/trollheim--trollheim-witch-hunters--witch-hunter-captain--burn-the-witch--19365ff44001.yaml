# AUTHORED: 2 scenarios cover the first-round missed-hit reroll the printed Hatred against casters grants and the same miss standing against an opponent that is not a caster.

# --- Authored scenarios ---
# "The Witch Hunter Captain is subject to Hatred against all models that can cast spells":
# the qualifying enemy is a caster because its own canonical fact says so, and the first-round
# missed To Hit roll is rerolled.  The ordinary warrior is the control the printed identity
# requires, since the rule is offered only against the matching enemy.
- audit_id: rule/trollheim/trollheim-witch-hunters/witch-hunter-captain--burn-the-witch/mechanic.burn-the-witch
  id: a-first-round-miss-is-rerolled-against-a-caster
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.burn-the-witch]
      characteristics: &hunter-ws3-s3-t3-w2-i5 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      trait_overrides: {spellcaster: true}
      characteristics: &plain-ws3-s3-t3-w2-i2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: &charging-first {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.first.attack.0.hit.reroll, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: true, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The same miss against an opponent that is not a caster: no reroll is offered, so the printed
# hated identity stands as the condition of the benefit.
- audit_id: rule/trollheim/trollheim-witch-hunters/witch-hunter-captain--burn-the-witch/mechanic.burn-the-witch
  id: the-same-miss-stands-against-a-non-caster
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.burn-the-witch]
      characteristics: *hunter-ws3-s3-t3-w2-i5
    second:
      main_weapon_id: weapon.mace
      characteristics: *plain-ws3-s3-t3-w2-i2
  duel_context: *charging-first
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: false, attacks.0.damage: 0, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
