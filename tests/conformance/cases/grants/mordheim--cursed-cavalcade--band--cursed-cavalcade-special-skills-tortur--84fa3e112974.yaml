# --- Authored scenarios ---
# Derived from the printed rule and the recorded contract; no engine output was consulted.  The
# bearer declares the printed operator of the shared mechanic and the opponent is a hand-built fixture
# standing at three wounds, so no injury roll joins the tape and the Strength state the rule moves is
# the only thing the wound changes.

- audit_id: rule/mordheim/cursed-cavalcade/band--cursed-cavalcade-special-skills-torturer/mechanic.torturer
  id: an-unsaved-wound-costs-the-living-defender-one-strength
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.torturer]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.wounded: true, attacks.0.damage: 1, state.second.strength: 2,
        state.second.torture_strength_loss: 1, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The printed exception: the same attack and the same declared faces against an Undead defender.  The
# wound still lands, but the Undead are immune, so its Strength and its loss counter are untouched.
- audit_id: rule/mordheim/cursed-cavalcade/band--cursed-cavalcade-special-skills-torturer/mechanic.torturer
  id: the-printed-undead-are-immune-to-the-agony
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.torturer]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      trait_overrides: {creature_kind: undead}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.wounded: true, attacks.0.damage: 1, state.second.strength: 3,
        state.second.torture_strength_loss: 0, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The printed floor: the defender is supplied already reduced to Strength 1 with two recorded
# applications, so the next unsaved wound still counts as an application but cannot take its Strength
# below one.
- audit_id: rule/mordheim/cursed-cavalcade/band--cursed-cavalcade-special-skills-torturer/mechanic.torturer
  id: the-cumulative-agony-cannot-go-below-one-strength
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.torturer]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1}
  initial_state:
    second: {strength: 1, torture_strength_loss: 2}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.wounded: true, state.second.strength: 1,
        state.second.torture_strength_loss: 3, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# Real recipient (2026-11-16): the bearer is the band's printed Aristocrat built from the band package
# with the Torturer entry selected through special_rule_ids (characteristics overridden only to keep the
# fixture's dice math), so the band's KB row supplies the Strength loss; without it the defender keeps
# Strength 3.
- audit_id: rule/mordheim/cursed-cavalcade/band--cursed-cavalcade-special-skills-torturer/mechanic.torturer
  id: the-printed-aristocrat-with-torturer-costs-the-defender-one-strength
  fighters:
    first:
      collection: mordheim
      band_id: cursed-cavalcade
      profile_id: aristocrat
      special_rule_ids: [band--cursed-cavalcade-special-skills-torturer]
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.wounded: true, attacks.0.damage: 1, state.second.strength: 2, state.second.torture_strength_loss: 1, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

- audit_id: rule/mordheim/cursed-cavalcade/band--cursed-cavalcade-special-skills-torturer/mechanic.torturer
  id: a-published-member-of-the-band-table-is-selectable
  # The printed permission: one of these Heroes may use this list, so the band's published
  # member must be a legal selection and the engagement must start. The declared identity is
  # the band's own rule id. Both fighters declare zero attacks, so the observation is the
  # selection itself; the member's mechanic keeps its own origin.
  fighters:
    first:
      collection: mordheim
      band_id: cursed-cavalcade
      profile_id: companions
      special_rule_ids: [band--cursed-cavalcade-special-skills-torturer]
    second:
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  initial_state: {first: {attacks: 0}, second: {attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  expect_initial: {first.attacks: 0, second.attacks: 0}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

- audit_id: rule/mordheim/cursed-cavalcade/band--cursed-cavalcade-special-skills-torturer/mechanic.torturer
  id: the-same-member-is-refused-for-a-thrall-the-print-excludes
  # The printed recipient is the Hero; a Thrall carries no "special" category, so the
  # member must be refused for it. The fragment is the shared availability sentence of the
  # special-rule route.
  fighters:
    first:
      collection: mordheim
      band_id: cursed-cavalcade
      profile_id: thrall
      special_rule_ids: [band--cursed-cavalcade-special-skills-torturer]
  expect_error: "special rule is not available to cursed-cavalcade/thrall: band--cursed-cavalcade-special-skills-torturer"

- audit_id: rule/mordheim/cursed-cavalcade/band--cursed-cavalcade-special-skills-torturer/mechanic.torturer
  id: a-special-skill-outside-the-printed-table-is-refused
  # The closure of the same printed access through the list route (skill_ids). Restored
  # deliberately: its sentence is produced today by the empty member list, which is why the
  # admission tape above stands beside it as the discriminating control.
  fighters:
    first:
      collection: mordheim
      band_id: cursed-cavalcade
      profile_id: companions
      skill_ids: [skill.monster-slayer]
      main_weapon_id: weapon.mace
  expect_error: "skills are not available to cursed-cavalcade/companions: ['skill.monster-slayer']"

- audit_id: rule/mordheim/cursed-cavalcade/band--cursed-cavalcade-special-skills-torturer/mechanic.torturer
  id: a-member-of-another-bands-table-is-refused
  # The other direction of the same table boundary: the printed permission opens THIS band's table,
  # so another band's published member is not selectable here. The declared-selection route resolves
  # the id against this band's own package rows and answers with the band-level availability sentence.
  fighters:
    first:
      collection: mordheim
      band_id: cursed-cavalcade
      profile_id: companions
      special_rule_ids: [band--amazon-special-skills-skink-hunter]
  expect_error: "special rule is not available to cursed-cavalcade: band--amazon-special-skills-skink-hunter"
