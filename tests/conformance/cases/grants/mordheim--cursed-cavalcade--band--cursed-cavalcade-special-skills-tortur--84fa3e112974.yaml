# --- Authored scenarios ---
# Derived from the printed rule and the recorded contract; no engine output was consulted.  The
# bearer declares the printed operator of the shared mechanic and the opponent is a hand-built fixture
# standing at three wounds, so no injury roll joins the tape and the Strength state the rule moves is
# the only thing the wound changes.

- audit_id: rule/mordheim/cursed-cavalcade/band--cursed-cavalcade-special-skills-torturer/mechanic.torturer
  id: an-unsaved-wound-costs-the-living-defender-one-strength
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.torturer]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.wounded: true, attacks.0.damage: 1, state.second.strength: 2,
        state.second.torture_strength_loss: 1, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The printed exception: the same attack and the same declared faces against an Undead defender.  The
# wound still lands, but the Undead are immune, so its Strength and its loss counter are untouched.
- audit_id: rule/mordheim/cursed-cavalcade/band--cursed-cavalcade-special-skills-torturer/mechanic.torturer
  id: the-printed-undead-are-immune-to-the-agony
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.torturer]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      trait_overrides: {creature_kind: undead}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.wounded: true, attacks.0.damage: 1, state.second.strength: 3,
        state.second.torture_strength_loss: 0, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The printed floor: the defender is supplied already reduced to Strength 1 with two recorded
# applications, so the next unsaved wound still counts as an application but cannot take its Strength
# below one.
