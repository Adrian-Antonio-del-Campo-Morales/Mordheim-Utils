# Real recipient (2026-11-16): the wounded warrior is the band's printed Bloated built from the band
# package (characteristics overridden only to keep the fixture's dice math), so Squishy comes from the
# profile's own row and the printed Stunned result stands.  This scenario does not discriminate the row:
# the Bloated's printed No Pain row (the-bloated--no-pain) is recorded as unimplemented in the KB and
# construction refuses supplying its operator ('skills are not available to ghost-pirates-sar/the-bloated:
# [skill.ignore-pain]'), so on the printed profile there is no No Pain for Squishy to override.  The
# Bloated causes Fear, so the charger is given the causes-fear fact, which exempts it from the Fear test.
- audit_id: rule/mordheim/ghost-pirates-sar/the-bloated--squishy/rule.squishy
  id: the-printed-bloated-stays-stunned-under-squishy
  fighters:
    first:
      main_weapon_id: weapon.mace
