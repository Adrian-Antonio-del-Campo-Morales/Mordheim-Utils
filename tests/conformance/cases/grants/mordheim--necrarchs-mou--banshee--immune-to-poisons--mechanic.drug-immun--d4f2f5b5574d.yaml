# Drug-immunity family model (the authored clockworkers-sc construct files of this directory): the
# printed bearer would be supplied with a drug through `preparation_ids` and the drug's change read
# as the unchanged state, against a hand-built control with the bearer's printed line and the
# identical drug.  For the Banshee the first half is unreachable (see the blocker above); the
# declared refusal asserts that the drugged Banshee cannot be built, so the immunity is never
# silently gained or silently bypassed.  Head-Splitter Mushrooms are the drug chosen for the Banshee
# because she prints no Psychology immunity, so their Frenzy would be the change the immunity
# suppresses; the control shows that change on an ordinary bearer with her printed line (Initiative
# 1 as a fixture fact, since the hand-built form needs a number for her blank Initiative).
# Consumer read (never executed): roster-construction compiler.py, `drug_ids` / "mechanic.drug-
# immunity" (lines 859-866): when the compiled fighter's global ids carry mechanic.drug-immunity,
# every drug id (preparation.crimson-shade, preparation.mandrake-root, preparation.mad-cap-
# mushrooms, preparation.head-splitter-mushrooms and the six Fungus Brew conditions) is removed from
# the global and innate id lists BEFORE the execution effects are applied, so the drug's EffectSet
# never reaches the fighter: no duel-start tag, bonus or flag, and no drug die is requested (Crimson
# Shade's +D3 Initiative, modular/state.py `<side>.crimson-shade` with sides 3, is rolled only when
# the tag is present).  The bearer carries the drug in `preparation_ids` (the channel the authored
# clockworkers-sc construct files use), and the construction gate only refuses a drug where a band
# rule forbids the category or the profile's own restriction forbids the item.
# Undead bearers and the drug choice (2026-11-18): every Necrarch bearer of this grant is
# creature_kind undead, and compiler.py (lines 867-873) already makes preparation.crimson-shade and
# preparation.mad-cap-mushrooms inert on undead and possessed bearers whether or not this mechanic
# is bound, so those two drugs cannot discriminate the grant here (the authored clockworkers-sc
# files use them on living constructs).  The remaining drugs the compiler strips only through this
# mechanic are Mandrake Root (+1 Toughness, Stunned becomes Knocked Down) and Head-Splitter
# Mushrooms (Frenzy). Semantic wrinkle to record for KB review: Mandrake Root's own printed text
# ("Mandrake Root has no effect on Undead, such as Vampires and Zombies, or on the Possessed",
# catalog/items/miscellaneous.yaml) is not in the compiler's undead-inert set, so a scenario that
# reads Mandrake on an undead bearer discriminates this grant only through that gap; and more
# generally the printed drug clauses already pre-empt a drug immunity on an undead bearer, which may
# make these bindings candidates for a `covered.elsewhere` ruling (the Poltergeists' No Pain
# precedent).  Head-Splitter Mushrooms print no undead exclusion ("Frenzy; also allows the use of a
# Ball and Chain", combat-equipment.yaml), so they are the clean reading wherever the bearer has no
# Psychology immunity.

# The Banshee supplied with a drug is refused at construction by her own equipment restriction: the
# drug never reaches the immunity.
- audit_id: rule/mordheim/necrarchs-mou/banshee--immune-to-poisons/mechanic.drug-immunity
  id: a-banshee-supplied-with-a-drug-is-refused-by-her-own-equipment-restriction
  fighters:
    first:
      collection: mordheim
      band_id: necrarchs-mou
      profile_id: banshee
      preparation_ids: [preparation.head-splitter-mushrooms]
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  expect_error: '"equipment" is forbidden for necrarchs-mou/banshee.'

# The control: a hand-built fighter with the Banshee's printed line (WS4 S3 T4 W1 A1 Ld5; Initiative 1
# as a fixture fact) and the same drug is frenzied from initialisation; the attacker declares a miss
# and the frenzied doubled pool of 0 stays 0.
- audit_id: rule/mordheim/necrarchs-mou/banshee--immune-to-poisons/mechanic.drug-immunity
  id: the-same-head-splitter-mushrooms-frenzy-an-ordinary-bearer
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 10, strength: 8, toughness: 3, wounds: 3, initiative: 10, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      preparation_ids: [preparation.head-splitter-mushrooms]
      characteristics: {weapon_skill: 4, strength: 3, toughness: 4, wounds: 1, initiative: 1, attacks: 1, leadership: 5}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
  expect_initial: {second.frenzy: True}
  expect_rounds:
    0: {attacks.0.damage: 0, state.second.frenzy: True}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

