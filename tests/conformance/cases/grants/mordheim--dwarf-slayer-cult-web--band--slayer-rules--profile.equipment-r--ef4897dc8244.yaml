# Status corrected 2026-11-18: the two items the held clause still records are dispositions, not
#   applicable requirements.  (1) "nor learn magic" is a between-battles decision outside this
#   corpus's duel-and-construction scope, the declared binding carries no token for it and the band's
#   Slayer ranks bind no arcane contract, so there is nothing for a scenario to observe.  (2) whether
#   a band-wide token set may also refuse the Rememberer is an open KB data question, not a missing
#   scenario; it is left recorded below for the rules owner.  All three representable parts of the
#   printed prohibition, and the admitted psychology clause, carry scenarios, so the file is AUTHORED.
#   The PARTIAL[no-armour-no-toys] marker is kept as that record (the weapon.starsword precedent).
# Correction 2026-11-18 (Ruling A1, the Rememberer may wear armour; print governs): item (2) above is
#   resolved, not open.  The rule's `applies_to.profile_ids` already names the five Slayer ranks
#   (giant-slayer, doomseeker, troll-slayers, stubbles, axe-hurlers) and the Rememberer's own rule
#   prints "A Rememberer is not a Slayer, and the slayer rules don't apply." The shared band-forbid
#   collection now honours that recipient set, so the token set no longer reaches him; one scenario
#   below authors his admission (the armour of his own list), and every Slayer refusal is unchanged.
# authoring_progress: the admitted deathwish--scope--deathwish-psychology clause carries 3 authored scenario(s) derived
# (the file holds 13 under this audit_id; the other 10 are no-armour-no-toys refusals; checked 2026-11-16) from the printed rule, the recorded semantic contract and the printed profile; any remaining
# face of the file stays recorded as pending below.  REVIEWED still requires manual semantic
# review and execution_status stays UNEXECUTED.
# execution_status: UNEXECUTED (this scaffold has no behavioral result)
#
# Derive inputs and expectations from rule text and accepted rulings.
# Do not derive them from the engine or execute combat during authoring.
# REVIEWED requires semantic review; covers labels alone are insufficient.
# Preserve audit_id when filling this file.
# Governing rulings: docs/decisions/design-rulings.md
#
# Clause: deathwish--scope--deathwish-psychology (scope: YES)
# AUTHORED[deathwish--scope--deathwish-psychology]: the bearer giant-slayer is the declared recipient, built from its printed profile (W1 A1); the opponent is a hand-built fixture that declares its own facts.
#   3 scenario(s) cover the clause: the Stupid bearer resolves no Stupidity test at all: its declared Lead test never happens, so the tape holds only its own attack; the same Stupid state does request the two-dice test for rememberer, which does not carry the rule, and the failed test takes its attack away; the fear-causing charger reaches the bearer, which would be tested and is not, so the tape holds only the two attack pools.
#   Every strike is declared as a natural 1, so each round reports the Fear or Stupidity request under test and nothing else.
#   REVIEWED still requires manual semantic review.
#
# Clause: no-armour-no-toys (scope: YES)
# PARTIAL[no-armour-no-toys]: three of the printed prohibition's four parts are authored below as
#   construction refusals on the printed Slayer ranks the same rule names in its psychology-immunity
#   binding (giant-slayer, doomseeker, troll-slayers): armour (armour.heavy-armour), a constant-save
#   cloak (defence.wolf-pelt-cloak, the implemented item that carries that tag; the sea-dragon-cloak
#   of the same tag vocabulary is refused by the shared stage's armour branch first, which is why it
#   is not the cloak this file declares) and a non-thrown missile weapon (weapon.duelling-pistol).
#   Each refusal is paired with the acceptance control for the same recipient built without the item.
#   The 2026-10-10 closing note that claimed no diagnostic existed is superseded: those three tokens
#   are exactly what the shared eligibility stage interprets for a bound profile
#   (packages/python/roster-construction/mordheim_construction/_eligibility.js, boundEquipment).
#   The printed sentence's fourth part - "nor learn magic" - stays pending: the declared binding
#   carries no token for it, the band's Slayer ranks bind no arcane contract, and learning magic is a
#   between-battles decision, so no scenario is authored for that half.
#   Open question, recorded and not authored: the binding carries no `profile_ids`, so its token set
#   is band-wide, while the printed band text excludes the Rememberer from the Slayer ranks - whether
#   a band-wide set may refuse him is a data decision this file does not take.
#   Correction 2026-11-18 (Ruling A1): the premise above was mistaken - the binding has no
#   `profile_ids` parameter, but the rule's own `applies_to.profile_ids` names the five Slayer ranks
#   and excludes the Rememberer, as the print does ("A Rememberer is not a Slayer, and the slayer
#   rules don't apply"). The question is closed: the band-wide token set does not refuse him, and the
#   scenario the-rememberer-carries-the-armour-of-his-own-list authors that admission.

#
# Clause: deathwish--scope--deathwish-all-alone (scope: NO)
