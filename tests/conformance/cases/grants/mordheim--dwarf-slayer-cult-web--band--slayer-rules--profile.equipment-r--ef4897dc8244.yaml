    0: {state.first.wounds: 3, state.first.condition: STANDING, state.second.wounds: 1, state.second.condition: STANDING}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# No Armour, No Toys! - the declared prohibition as a construction refusal, one refusal per printed
# Slayer rank of the same band rule and one acceptance control. The fragment is the one the shared
# eligibility stage reports for a bound profile ("<thing> is forbidden for <band>/<profile>"), and
# the control build is the same recipient without the item, which must construct.

- audit_id: rule/mordheim/dwarf-slayer-cult-web/band--slayer-rules/profile.equipment-restrictions
  id: giant-slayer-with-armour-is-refused
  covers: [no-armour-no-toys]
  fighters:
    first:
      collection: mordheim
      band_id: dwarf-slayer-cult-web
      profile_id: giant-slayer
      armour_id: armour.heavy-armour
  expect_error: armour is forbidden for dwarf-slayer-cult-web/giant-slayer

