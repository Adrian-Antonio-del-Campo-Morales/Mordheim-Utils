- audit_id: rule/mordheim/dwarf-slayer-cult-web/band--slayer-rules/profile.equipment-restrictions
  id: the-immune-warrior-takes-no-stupidity-test
  covers: [deathwish--scope--deathwish-psychology]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 10, attacks: 1, leadership: 7}
    second: {collection: mordheim, band_id: dwarf-slayer-cult-web, profile_id: giant-slayer}
  initial_state: {first: {attacks: 0}, second: {resources_spent: [disability.6]}}
  duel_context: {charging: [], active_participant: second}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.wounds: 3, state.second.wounds: 1, state.second.stupidity_failed: false, state.second.condition: STANDING}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

- audit_id: rule/mordheim/dwarf-slayer-cult-web/band--slayer-rules/profile.equipment-restrictions
  id: a-band-mate-without-the-immunity-is-tested-for-stupidity
  covers: [deathwish--scope--deathwish-psychology]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 10, attacks: 1, leadership: 7}
    second: {collection: mordheim, band_id: dwarf-slayer-cult-web, profile_id: rememberer}
  initial_state: {first: {attacks: 0}, second: {resources_spent: [disability.6]}}
  duel_context: {charging: [], active_participant: second}
  maximum_rounds: 1
  # The printed Leadership test fails on a total of eleven against the Rememberer's 8.
  rolls:
    - {key: round.0.second.stupidity.0, value: 5}
    - {key: round.0.second.stupidity.1, value: 6}
  expect_rounds:
    0: {state.first.wounds: 3, state.second.wounds: 1, state.second.stupidity_failed: true, state.second.condition: STANDING}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

