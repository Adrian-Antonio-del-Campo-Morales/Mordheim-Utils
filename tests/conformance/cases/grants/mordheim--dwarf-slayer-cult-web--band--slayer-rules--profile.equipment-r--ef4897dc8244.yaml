- audit_id: rule/mordheim/dwarf-slayer-cult-web/band--slayer-rules/profile.equipment-restrictions
  id: the-rememberer-carries-the-armour-of-his-own-list
  covers: [no-armour-no-toys]
  # Ruling A1 (2026-11-18): "A Rememberer is not a Slayer, and the slayer rules don't apply." The
  # printed prohibition ("Slayers may never use armour of any kind") names the Slayers, and the
  # Rememberer's own rememberer-equipment-list offers light_armour, helmet and shield. Declared
  # through the carried-item channel, the kit constructs; the giant-slayer opponent starts out of
  # action so no die is needed.
  fighters:
    first:
      collection: mordheim
      band_id: dwarf-slayer-cult-web
      profile_id: rememberer
      main_weapon_id: weapon.mace
      owned_item_ids: [light_armour, helmet, shield]
    second:
      collection: mordheim
      band_id: dwarf-slayer-cult-web
      profile_id: giant-slayer
  duel_context: {charging: [], active_participant: first}
  initial_state: {second: {condition: OUT}}
  expect_initial: {second.condition: OUT}
  expect_final: {rounds_executed: 0, termination_reason: second_out}
