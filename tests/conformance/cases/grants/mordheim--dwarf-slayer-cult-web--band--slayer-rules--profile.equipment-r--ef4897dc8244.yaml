#
# Clause: deathwish--scope--deathwish-psychology (scope: YES)
# AUTHORED[deathwish--scope--deathwish-psychology]: the bearer giant-slayer is the declared recipient, built from its printed profile (W1 A1); the opponent is a hand-built fixture that declares its own facts.
#   3 scenario(s) cover the clause: the Stupid bearer resolves no Stupidity test at all: its declared Lead test never happens, so the tape holds only its own attack; the same Stupid state does request the two-dice test for rememberer, which does not carry the rule, and the failed test takes its attack away; the fear-causing charger reaches the bearer, which would be tested and is not, so the tape holds only the two attack pools.
#   Every strike is declared as a natural 1, so each round reports the Fear or Stupidity request under test and nothing else.
#   REVIEWED still requires manual semantic review.
#
# Clause: no-armour-no-toys (scope: YES)
# PARTIAL[no-armour-no-toys]: three of the printed prohibition's four parts are authored below as
#   construction refusals on the printed Slayer ranks the same rule names in its psychology-immunity
#   binding (giant-slayer, doomseeker, troll-slayers): armour (armour.heavy-armour), a constant-save
#   cloak (defence.wolf-pelt-cloak, the implemented item that carries that tag; the sea-dragon-cloak
#   of the same tag vocabulary is refused by the shared stage's armour branch first, which is why it
#   is not the cloak this file declares) and a non-thrown missile weapon (weapon.duelling-pistol).
#   Each refusal is paired with the acceptance control for the same recipient built without the item.
#   The 2026-10-10 closing note that claimed no diagnostic existed is superseded: those three tokens
#   are exactly what the shared eligibility stage interprets for a bound profile
#   (packages/python/roster-construction/mordheim_construction/_eligibility.js, boundEquipment).
#   The printed sentence's fourth part - "nor learn magic" - stays pending: the declared binding
#   carries no token for it, the band's Slayer ranks bind no arcane contract, and learning magic is a
#   between-battles decision, so no scenario is authored for that half.
#   Open question, recorded and not authored: the binding carries no `profile_ids`, so its token set
#   is band-wide, while the printed band text excludes the Rememberer from the Slayer ranks - whether
#   a band-wide set may refuse him is a data decision this file does not take.

#
# Clause: deathwish--scope--deathwish-all-alone (scope: NO)
