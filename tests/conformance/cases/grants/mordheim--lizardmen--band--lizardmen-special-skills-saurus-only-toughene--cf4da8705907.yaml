# Family model (Hard to Kill, selectable band skill).  The record is a `warband_skill` with
# `grant: selectable`, `eligibility: [saurus-totem-warrior]` and the binding `skill.hard-to-kill` (shared
# rule Toughened Hide, mordheimer.net, Lizardmen special skills / Saurus Only / Toughened Hide): the Saurus "is treated as having the Dwarf Hard to Kill rule", whose
# chart is 1-2 Knocked Down, 3-5 Stunned, 6 Out of Action against the ordinary 5-6 Out of Action.  The
# eligibility list names the band's Saurus Hero only, so the recipients gate refuses every other profile
# with `special rule is not available to <band>/<profile>`.
# Fixture facts: the Saurus is supplied the corpus characteristics (WS3 S3 T3 I2 A1, printed Ld8) with
# wounds: 1 so the first wound reaches the Injury roll; its equipment list has no mace, so it carries an
# axe (no declared die depends on it).  The opponent is hand-built (WS3 S3 T3 W2 I5 A1, mace) and charges,
# declaring the hit (4), the wound (4, below the critical six) and the Injury die under test.  The band's
# Scaly Skin gives the Saurus a natural 5+ save (compiler.lizardmen-scaly-skin, unmodified by S3), so the
# armour die is requested and declared as a failing four before the Injury die.  A Saurus at zero wounds
# is Stunned or Out and never swings back, so its printed bite adds no die.

