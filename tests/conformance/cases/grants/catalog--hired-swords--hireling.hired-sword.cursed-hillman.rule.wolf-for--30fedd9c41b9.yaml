# Printed text (grade-2a.yaml, Wolf Form): "Wolf profile M7 WS4 BS0 S4 T4 W2 I5 A2(3) Ld6" against the
# man line "M4 WS3 BS4 S3 T3 W1 I3 A1 Ld8".  The form is a selectable special-skill option of the Cursed
# Hillman (hirelings.hired-sword.2a / hireling.hired-sword.cursed-hillman), chosen with special_rule_ids;
# its profile.characteristics binding (profile_ids restricted to the Hillman) is applied by the selected
# branch of packages/python/roster-construction/mordheim_construction/compiler.py.  The compiled
# characteristics are observed through expect_fighters; the shape is construction-only (no charge, the
# bearer out of action before the first phase), so Lycanthrope's wound trigger and every die stay
# unreached.  The man-form default weapon is the kit's axe; it is left omitted.

# Wolf Form selected: every bonus of the printed wolf line lands on the compiled characteristics.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.cursed-hillman.rule.wolf-form/wolf-form-stats
  id: the-hillman-in-wolf-form-carries-the-wolf-line-over-the-fixture
  fighters:
    first:
      collection: mordheim
      band_id: hirelings.hired-sword.2a
      profile_id: hireling.hired-sword.cursed-hillman
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
      special_rule_ids: [hireling.hired-sword.cursed-hillman.rule.wolf-form]
    second: &opponent
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: &construction-only {charging: [], active_participant: first}
  initial_state: &bearer-out {first: {condition: OUT}}
  expect_fighters:
    first.characteristics.movement: 7
    first.characteristics.weapon_skill: 4
    first.characteristics.strength: 4
    first.characteristics.toughness: 4
    first.characteristics.wounds: 3
    first.characteristics.initiative: 7
    first.characteristics.attacks: 2
    first.characteristics.leadership: 6

