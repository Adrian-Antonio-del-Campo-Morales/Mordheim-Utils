- audit_id: rule/mordheim/hochland-bandits/duelist--weapon-knowledge/compiler.weapon-knowledge
  id: duelist-fielding-a-weapon-outside-its-list-is-accepted-at-construction
  fighters:
    first:
      collection: mordheim
      band_id: hochland-bandits
      profile_id: duelist
      main_weapon_id: weapon.mace
    second:
      collection: mordheim
      band_id: hochland-bandits
      profile_id: duelist
      main_weapon_id: weapon.sword
  duel_context: {charging: [], active_participant: first}
  initial_state: {first: {condition: OUT}}
  expect_initial: {first.condition: OUT}
  expect_final: {rounds_executed: 0, termination_reason: first_out}

- audit_id: rule/mordheim/hochland-bandits/duelist--weapon-knowledge/compiler.weapon-knowledge
  id: poacher-fielding-the-same-weapon-is-refused
  fighters:
    first:
      collection: mordheim
      band_id: hochland-bandits
      profile_id: poachers
      main_weapon_id: weapon.mace
  expect_error: equipment is not available to hochland-bandits/poachers

# Boundary 1: another creature's innate attack is no weapon the warband can get hold of (a Troll's
# vomit has no catalogue item).
- audit_id: rule/mordheim/hochland-bandits/duelist--weapon-knowledge/compiler.weapon-knowledge
  id: the-duelist-cannot-take-another-creatures-innate-attack
  fighters:
    first:
      collection: mordheim
      band_id: hochland-bandits
      profile_id: duelist
      main_weapon_id: weapon.vomit-attack
  expect_error: "equipment is not available to hochland-bandits/duelist: ['weapon.vomit-attack']"

