# Disposition (the former PARTIAL marker, retired 2026-11-19; kept as provenance): [C] the recipient identity and the access operation are established (_eligibility.js buildAccess, compiler.weapon-knowledge row) and two scenarios declare them.  The remaining requirement is the supplied band-obtained weapon set the register names, which the corpus does not carry as a fact; without it the printed condition on the grant cannot be asserted, only recorded.  The register's boundary is kept: ownership versus use, the no-free-dagger proviso, acquisition and casting stay separate clauses and are not folded into this one.

