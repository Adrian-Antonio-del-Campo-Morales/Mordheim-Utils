#   including another creature's innate attack and other characters' unique gear. Both boundaries are
#   authored below. What a particular warband has actually bought or stashed is campaign state, out of
#   the duel (a disposition, not a gap).
# authoring_progress: the access operation the earlier note asked for is established, so the granted
# admission is authored: the shared stage's buildAccess adds every `weapon.*` mechanic to the
# recipient's access when this contract is active (packages/python/roster-construction/
# mordheim_construction/_eligibility.js, compiler.weapon-knowledge row), so a Duelist fielding a mace -
# an item on no Hochland list - constructs and resolves, while the same weapon on a Poacher of the same
# band (a profile without the contract) is refused with "equipment is not available to
# hochland-bandits/poachers".  Still pending: the supplied band-obtained set the register names for the
# dynamic half of the sentence (the corpus declares no obtained-item fact), so the printed
# "that the warband members can get hold of" condition is recorded rather than asserted.  REVIEWED
# still requires manual semantic review and execution_status stays UNEXECUTED.
