# --- Authored scenarios ---
# Fixture arithmetic: WS3 against WS3 hits on 4+, so the printed +1 makes a 3 hit; the fixture's
# Strength 3 reads back as 4 through the row's sibling characteristics effect, and that Strength
# reaches the wound roll (S4 against T3 wounds on 3+, where S3 would have needed a 4).  The printed
# "non-cumulative" is carried as far as a single supplied result can be: the condition is a presence
# fact read once per attack and once per compile, and no authored model declares the same condition
# twice.  "Until the end of the game" exceeds the one-round horizon and stays a lasting fact of the
# supplied condition.  The opponent is a hand-built fixture whose own swing is a scripted miss, and
# W2 on both sides keeps every blow short of an injury roll.

# The victory boundary on the printed recipient: the supplied condition turns the Fallen Noble's 4+
# into a 3+ and his compiled Strength is the fixture's 3 plus the printed 1.
- audit_id: rule/mordheim/mazzalupo-web/fallen-noble--ye-give-way/condition.ye-give-way-victorious
  id: the-victorious-fallen-noble-hits-on-a-three-and-reads-strength-four
  fighters:
    first:
      collection: mordheim
      band_id: mazzalupo-web
      profile_id: fallen-noble
      main_weapon_id: weapon.mace
      condition_ids: [condition.ye-give-way-victorious]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 3}
    - {key: round.0.first.attack.0.wound, value: 3}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_initial: {first.strength: 4}
  expect_rounds:
    0: {attacks.0.hit: True, attacks.0.hit_target: 3, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

