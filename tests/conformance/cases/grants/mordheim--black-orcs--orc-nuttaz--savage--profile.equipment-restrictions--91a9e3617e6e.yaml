# The printed obligation: a Nuttaz making its required charge may not decline it.  The supplied
# compulsion is declared and the duel declares that nobody charges, so the duel must refuse to start.
- audit_id: rule/mordheim/black-orcs/orc-nuttaz--savage/profile.equipment-restrictions
  id: a-nuttaz-under-its-required-charge-cannot-decline-it
  covers: [mandatory-charge]
  fighters:
    first:
      collection: mordheim
      band_id: black-orcs
      profile_id: orc-nuttaz
      main_weapon_id: weapon.axe
      condition_ids: [condition.nuttaz-charge]
    second:
      characteristics: {weapon_skill: 3, strength: 3, toughness: 4, wounds: 3, initiative: 1, attacks: 1}
  duel_context:
    charging: []
    active_participant: first
  expect_error: A supplied compulsory charge requires its initial in-range charging attempt

# Control: the same Nuttaz under the same compulsion, declared charging, is accepted and fights its
# printed Attacks 1 plus the printed extra attack; both entries miss on a natural 1 and the opponent's
# attacks are set to 0, so the round shows only that the required charge was made.
- audit_id: rule/mordheim/black-orcs/orc-nuttaz--savage/profile.equipment-restrictions
  id: the-nuttaz-making-its-required-charge-fights
  covers: [mandatory-charge]
  fighters:
    first:
      collection: mordheim
      band_id: black-orcs
      profile_id: orc-nuttaz
      main_weapon_id: weapon.axe
      condition_ids: [condition.nuttaz-charge]
    second:
      characteristics: {weapon_skill: 3, strength: 3, toughness: 4, wounds: 3, initiative: 1, attacks: 1}
  initial_state:
    second:
      attacks: 0
  duel_context:
    charging: [first]
    active_participant: first
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.first.attack.1.hit, value: 1}
  expect_rounds:
    0: {state.first_charged: true, attacks.0.hit: False, attacks.1.hit: False, state.second.wounds: 3}
  expect_final:
    rounds_executed: 1
    termination_reason: horizon

