- audit_id: rule/mordheim/black-orcs/orc-nuttaz--savage/profile.equipment-restrictions
  id: the-printed-nuttaz-fights-with-an-extra-attack
  covers:
  - extra-attack
  # The printed stanza: "Additionally they fight with an extra attack whilst in combat."  The bearer is
  # the printed Orc Nuttaz, whose own profile prints Attacks 1 and which receives the term from its own
  # profile rule rather than from a separate selection; the declared strict tape consumes two close-combat
  # attack entries from that single pool, which a bearer without the printed rule could not do.  Both
  # entries miss on their declared die, so the attack pool itself carries the evidence and no wound or
  # injury step follows.
  fighters:
    first:
      collection: mordheim
      band_id: black-orcs
      profile_id: orc-nuttaz
      main_weapon_id: weapon.axe
    second:
      characteristics: {weapon_skill: 3, strength: 3, toughness: 4, wounds: 3, initiative: 1, attacks: 1}
  initial_state:
    second:
      attacks: 0
  duel_context:
    charging: [first]
    active_participant: first
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.first.attack.1.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: False, attacks.1.hit: False, state.second.wounds: 3, state.second.condition: STANDING}
  expect_final:
