- audit_id: rule/trollheim/chaos-streets-dwarf-treasure-hunters/dwarf-troll-slayers--slayer-skills/profile.skill-access
  id: a-printed-slayer-skill-is-admitted-to-the-recipient
  fighters:
    first:
      collection: trollheim
      band_id: chaos-streets-dwarf-treasure-hunters
      profile_id: dwarf-troll-slayers
      special_rule_ids: [band--slayer-special-skills-ferocious-charge]
      main_weapon_id: weapon.mace
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  initial_state: {first: {attacks: 0}, second: {attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    # With both pools suppressed the two Initiatives still tie, so the engine
    # asks for its priority-tie die; the declared face lets the first act.
    - {key: round.0.priority-tie, value: 1}
  expect_final: {rounds_executed: 1}

