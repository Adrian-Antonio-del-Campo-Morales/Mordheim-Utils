# --- Authored scenarios ---
# The declared replacement pool is one attack on its own key, so the ordered tape shows one attack
# where the profile has two, and the automatic knock-down needs no To Wound roll.
- audit_id: rule/mordheim/maneaters/bulls--bull-charge/mechanic.bull-charge
  id: a-declared-bull-charge-knocks-the-enemy-down
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.bull-charge]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 2}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.bull-charge, value: true}
  rolls:
    - {key: round.0.first.bull-charge.hit, value: 3}
  expect_rounds:
    0: {attacks.0.hit: True, state.second.condition: KNOCKED_DOWN, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
  expect_events:
    - {kind: decision, key: round.0.first.bull-charge, value: true}
    - {kind: roll, key: round.0.first.bull-charge.hit, sides: 6, value: 3}

# The recorded reading of the printed "if successful": an armour save stops the knock-down, so the
# defender stays standing and the round continues.
- audit_id: rule/mordheim/maneaters/bulls--bull-charge/mechanic.bull-charge
  id: an-unsaved-hit-knocks-down-while-a-save-leaves-the-defender-standing
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.bull-charge]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 2}
    second:
      main_weapon_id: weapon.mace
      armour_id: armour.light-armour
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.bull-charge, value: true}
  rolls:
    - {key: round.0.first.bull-charge.hit, value: 3}
    - {key: round.0.first.bull-charge.armour, value: 6}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.saved: True, state.second.condition: STANDING, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The printed "rather than making their normal attacks": declining the declaration resolves the
# profile's two attacks on their own keys instead of the single charge attack.
- audit_id: rule/mordheim/maneaters/bulls--bull-charge/mechanic.bull-charge
  id: declining-the-declaration-resolves-the-normal-attacks
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.bull-charge]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 2}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.bull-charge, value: false}
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.first.attack.1.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.condition: STANDING, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
  expect_events:
    - {kind: decision, key: round.0.first.bull-charge, value: false}
    - {kind: roll, key: round.0.first.attack.0.hit, sides: 6, value: 1}
    - {kind: roll, key: round.0.first.attack.1.hit, sides: 6, value: 1}
    - {kind: roll, key: round.0.second.attack.0.hit, sides: 6, value: 1}
# Real recipient (2026-11-16): the same charge as a-declared-bull-charge-knocks-the-enemy-down, but
# the charger is the printed Maneaters Bull profile, whose own rule bulls--bull-charge grants the
# operator. The explicit characteristics keep the original dice model; the Bull's equipment list has
# no mace, so it carries a club (the Bull Charge replaces its normal attacks, so the weapon asks for
# no die). The band's printed Fear (band--fear) makes the charged enemy, now given Leadership 7,
# test Fear first: 1+1 passes.
- audit_id: rule/mordheim/maneaters/bulls--bull-charge/mechanic.bull-charge
  id: a-declared-bull-charge-knocks-the-enemy-down-as-the-real-bull
  fighters:
    first:
      collection: mordheim
      band_id: maneaters
      profile_id: bulls
      main_weapon_id: weapon.club
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 2}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 7}
  duel_context:
    charging: [first]
    active_participant: first
  maximum_rounds: 1
  decisions:
  - {key: round.0.first.bull-charge, value: true}
  rolls:
  - {key: round.0.second.fear.charged.0, value: 1}
  - {key: round.0.second.fear.charged.1, value: 1}
  - {key: round.0.first.bull-charge.hit, value: 3}
  expect_rounds:
    0: {attacks.0.hit: true, state.second.condition: KNOCKED_DOWN, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
  expect_events:
  - {kind: roll, key: round.0.second.fear.charged.0, sides: 6, value: 1}
  - {kind: roll, key: round.0.second.fear.charged.1, sides: 6, value: 1}
  - {kind: decision, key: round.0.first.bull-charge, value: true}
  - {kind: roll, key: round.0.first.bull-charge.hit, sides: 6, value: 3}
