# The Undead enemy fails its Leadership (9 against Ld7): its blows are blocked and Abdul is untouched.
- audit_id: rule/catalog/dramatis-personae/hireling.dramatis.abdul-alhazred-the-mad-sorcerer.rule.eye-pendant/defence.eye-pendant
  id: an-undead-enemy-that-fails-leadership-cannot-attack-the-real-abdul
  fighters:
    first:
      &eye-undead-enemy
      main_weapon_id: weapon.mace
      trait_overrides: {creature_kind: undead}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
    second:
      &eye-recipient
      collection: mordheim
      band_id: hirelings.dramatis-personae.1b
      profile_id: hireling.dramatis.abdul-alhazred-the-mad-sorcerer
      defence_ids: [defence.eye-pendant]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.eye-pendant.0, value: 5}
    - {key: round.0.first.eye-pendant.1, value: 4}
  expect_rounds:
    0: {state.first.charm_attack_blocked: true, state.second.wounds: 2, state.second.condition: STANDING}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

