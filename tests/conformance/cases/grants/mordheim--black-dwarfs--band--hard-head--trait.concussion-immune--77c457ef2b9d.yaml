#
# Clause: bearer-scope (scope: YES)
# AUTHORED[bearer-scope]: 1 scenario exercises the printed exclusion: the Informer profile named in the
#   printed sentence keeps the ordinary club/mace conversion, so the same mace that leaves the Chaos Dwarf
#   Knocked Down still turns the Informer's two into a Stunned result.  The exclusion is evidenced by the
#   absence of the immunity on a printed excluded recipient rather than by re-stating the applicability
#   sentence.
#
# Clause: concussion-immunity (scope: YES)
# AUTHORED[concussion-immunity]: 2 scenarios evidence the discrimination the immunity makes (a mace
#   injury total of two leaves the bearer Knocked Down where an unmarked bearer is Stunned) and its
#   boundary (a total of three still Stuns), so the immunity suppresses the club/mace conversion only and
#   is not immunity to being Stunned.  The recipient is the printed Chaos Dwarf profile of the band and
#   the band rule is supplied by its printed rule key.

# --- Authored scenarios ---
# Derived from the printed rule and the printed band record; no engine output was consulted.
# The mace is the printed club/mace weapon whose concussion rule the bearer ignores; the fixture's
