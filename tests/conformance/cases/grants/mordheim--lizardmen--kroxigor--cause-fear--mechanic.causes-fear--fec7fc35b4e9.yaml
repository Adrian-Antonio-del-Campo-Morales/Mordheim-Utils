# --- Authored scenarios ---
# Derived from the printed rule and the recorded semantic contract; no engine
# output was consulted.  The Kroxigor charges, so the charging warrior is the
# Kroxigor and the charged opponent is the one the Fear clause tests: its two
# Leadership dice are declared first, summed against the Leadership 7 the
# hand-built opponent declares.  The opponent's Weapon Skill equals the
# Kroxigor's, so its ordinary hit target is 4+ and its Strength 3 needs 5+ against
# the Kroxigor's Toughness 4, with the printed 4+ Scaly Skin save declaring its own
# die.  The Kroxigor's three attacks are scripted as natural 1s so the round shows
# only what the Fear clause does to the opponent.

