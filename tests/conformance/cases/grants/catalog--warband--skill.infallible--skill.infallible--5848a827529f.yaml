# --- Authored scenarios ---
# Family model (charge-turn missed-hit reroll, skill.infallible), taken from the printed rule, the
# recorded contract and the accepted model of cases/mechanics/skill.infallible.yaml.  The catalog
# record carries no band scope, so the bearer is the printed Vampire recipient as a fixture that
# declares the canonical warband skill itself; its physical characteristics are supplied as fixture
# facts (WS3 S3 T3 W2 I5 A1) so the dice thresholds and the strike order are fixed.  The opponent is a
# hand-built fixture with one attack.  A miss (a natural 2 against WS3) is taken again on a 4+ and
# wounds on a 4+, so the reroll is what the tape shows; where the trigger is absent, or the skill is
# not carried, the strict tape holds no reroll key and the miss stands.

- audit_id: rule/catalog/warband/skill.infallible/skill.infallible
  id: the-charging-turn-rerolls-a-missed-hit
  fighters:
    first:
      skill_ids: [skill.infallible]
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.first.attack.0.hit.reroll, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: true, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The printed trigger is the turn in which the bearer charges: with nobody charging there is no reroll,
# and the bearer still strikes first on its higher Initiative.
- audit_id: rule/catalog/warband/skill.infallible/skill.infallible
  id: a-turn-without-a-charge-carries-no-reroll
  fighters:
    first:
      skill_ids: [skill.infallible]
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 0, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# Without the canonical skill the very same charge and roll reroll nothing.
- audit_id: rule/catalog/warband/skill.infallible/skill.infallible
  id: the-same-roll-stands-without-the-skill
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 0, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
