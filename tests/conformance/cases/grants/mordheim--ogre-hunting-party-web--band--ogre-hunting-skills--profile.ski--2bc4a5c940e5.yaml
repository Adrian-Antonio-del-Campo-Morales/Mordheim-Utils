#
# Clause: bull-charge (scope: YES)
# AUTHORED[bull-charge]: 3 scenarios read the printed single attack on the charge: the accepted
# declaration resolves exactly one attack on its own key at +1 to hit, whose unparried unsaved hit leaves
# the defender Knocked Down with no To Wound roll, while the printed "if successful" is read as the
# recorded project reading, so the armour save that keeps the defender standing is the border case; the
# declined declaration resolves the profile's normal attacks instead.  The Ogre Hunting Party record has
# no binding of its own but shares the canonical mechanic.bull-charge, so the scenarios read the operator
# through the fighter's grant list exactly as the mechanic origin's own case does.  REVIEWED still
# requires manual semantic review.
#
# Clause: crude-belch (scope: YES)
# PARTIAL[crude-belch]: [C] the printed stanza's accepted reading is asserted at the end of this file, and
#   the branch it waits on is named here.
#   ACCEPTED READING: the reviewed equivalence row for this origin's clause records effect_id
#   skill.crude-belch-halfling with relation equivalent and parameters {"first_round": true,
#   "leadership_gated": true, "lose_attacks": 1}, consumer packages/python/combat-engine/mordheim_combat/
#   modular/pools.py::allocate_attack_weapons, and the boundary sentence "Losing the first attack even when it
#   is the only attack is the printed consequence and is preserved".  The tape therefore supplies that shared
#   operator through the fighter's grant list, exactly as the bull-charge and netter tapes above supply
#   theirs.
#   NOT ASSERTED, and why: the printed sentence also says the failing enemies suffer "-1 to hit for the
#   turn".  No admitted term, request key or diagnostic carries that consequence anywhere - the recorded
#   consumer serves only the skill.crude-belch-halfling tag and produces an ordered attack loss - so
#   asserting it would state a consequence the accepted contract does not define.  It is recorded here as the
#   printed text this origin still owes, not silently dropped.
#   PENDING IMPLEMENTATION DEFECT (recorded, not a reason to withhold): this origin's row binds no operator
#   (null binding, the placeholder unimplemented.ogre-hunting-party-web.special.ogre-hunting-skills), so the
#   Ogre/Gnoblar face needs its own behaviour or a parameterised branch; the printed extras (the all-engaged
#   recipients and the wait-for-a-new-enemy reuse) have no counterpart either.  REVIEWED still requires
#   manual semantic review.
#
# Clause: netter (scope: YES)
# AUTHORED[netter]: 2 scenarios evidence the clause through its only duel-visible projection, the canonical
#   net-charge operator.  The printed sentence is the kit/resupply provision (three Nets each game, which may
#   not be sold or traded and are restored), and the record's own contract fixes the observable as "the
#   net-charge behaviour is available to this profile"; the sale, trade and resupply halves are rostering and
#   campaign data outside the duel, so the operator is what a tape can show.  RECIPIENT: the band's printed
#   Gnoblar hero (profiles.yaml id trappers), whose own Veteran Tracker rule names Netter among the four
#   special skills the hero may begin with, and the printed skill list restricts Netter to Gnoblars.
#   INPUT AND GRANT: the operator is supplied on the fighter through the same grant channel this file's
#   bull-charge scenarios use.  This origin declares no binding of its own (the register records "No binding
#   on this record; the canonical effect exists, so the missing step is the KB connection"), which is the
#   defect the scenarios detect rather than a reason to withhold them: the vocabulary that states the printed
#   expectation exists and is already established at cases/mechanics/mechanic.netter.yaml and at the band that
#   binds it.  SUCCESS BRANCH: the net's own Ballistic Skill die hits - the printed Gnoblar profile supplies
#   BS 4, so the net's target is 3+, which the declared four meets - the target then fails the printed
#   Strength escape test on a four against its Strength 3, so it counts as Knocked Down and is hit
#   automatically in the combat that follows (no To Hit die is requested for the charge) while the wound is
#   still rolled, which is the printed "must still roll to wound just as with a knocked down enemy".
#   CONTROL: the identical charge on the same build without the rule asks for no net die at all, so the net
#   step is the rule's own.  The printed recovery phase in which the netted warrior cuts itself free and goes
#   last is the ordinary knocked-down/stood-up handling the clause cites, and the scope-NO failed-charge
#   movement stays outside the duel.  REVIEWED still requires manual semantic review.
#
# Clause: ogre-skill-list-rest (scope: YES)
# PARTIAL[ogre-skill-list-rest]: [C] the closure of the printed access is asserted at the end of this file
#   in both directions of the recipient gate; the admission direction stays withheld with its cause named.
#   ACCEPTED EQUIVALENCE: the reviewed row EQ-P-SKILL-ACCESS (relation parameterized_variant, consumer
#   packages/typescript/domain/eligibility/index.ts::entryReachesProfile) reads the clause as "the profile may
#   choose skills from the named skill tables" with this origin supplying its printed table set, so the access
#   requirement is in scope even though the five named skills keep their own origins (detection,
#   promotion/Rout, board placement and deployment content, as the register records).  RECIPIENT: this band's
#   own profiles.yaml publishes the printed Ogre hero (ogre-hunter, whose skill_access carries the special
#   category) and band henchmen that print none (gnoblar-fighters).
#   STILL WITHHELD - THE ADMISSION'S MEMBER IDENTITY: this origin publishes no member rows (no kind:
#   warband_skill rows for Scent Hound, Maneater, Bellowing Roar, Set Traps or Infiltration) and no skill.*
#   catalogue row carries any of those names for this band: the one catalogue row that shares a name,
#   skill.bellowing-battle-roar, is a Lizardmen "Saurus Only" row whose effect is that origin's own roar, so
#   declaring it here would assert a member identity no artefact carries for this origin.  The missing
#   projection is the one the four band skill tables name - this origin's resolved member set has to be
#   projected into the profile's special skill list - after which the admission tape is written from it.
#   REVIEWED still requires manual semantic review.

# --- Authored scenarios ---
# Derived from the printed sentence and the recorded contract; no engine output was consulted.  The
# declared replacement pool is one attack on its own key, so the tape shows one attack where the fixture
# has two, and the automatic knock-down needs no To Wound roll.
- audit_id: rule/mordheim/ogre-hunting-party-web/band--ogre-hunting-skills/profile.skill-access
  id: a-declared-bull-charge-knocks-the-enemy-down
  covers: [bull-charge]
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.bull-charge]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 2}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.bull-charge, value: true}
  rolls:
    - {key: round.0.first.bull-charge.hit, value: 3}
  expect_rounds:
    0: {attacks.0.hit: true, state.second.condition: KNOCKED_DOWN, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
  expect_events:
    - {kind: decision, key: round.0.first.bull-charge, value: true}
    - {kind: roll, key: round.0.first.bull-charge.hit, sides: 6, value: 3}

# The recorded reading of the printed "if successful": an armour save stops the knock-down, so the
# defender stays standing.
- audit_id: rule/mordheim/ogre-hunting-party-web/band--ogre-hunting-skills/profile.skill-access
  id: an-unsaved-hit-knocks-down-while-a-save-leaves-the-defender-standing
  covers: [bull-charge]
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.bull-charge]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 2}
    second:
      main_weapon_id: weapon.mace
      armour_id: armour.light-armour
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.bull-charge, value: true}
  rolls:
    - {key: round.0.first.bull-charge.hit, value: 3}
    - {key: round.0.first.bull-charge.armour, value: 6}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.saved: true, state.second.condition: STANDING, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The printed "rather than making his normal attacks": declining the declaration resolves the profile's
# two attacks on their own keys instead of the single charge attack.
- audit_id: rule/mordheim/ogre-hunting-party-web/band--ogre-hunting-skills/profile.skill-access
  id: declining-the-declaration-resolves-the-normal-attacks
  covers: [bull-charge]
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.bull-charge]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 2}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.bull-charge, value: false}
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.first.attack.1.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.condition: STANDING, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
  expect_events:
    - {kind: decision, key: round.0.first.bull-charge, value: false}
    - {kind: roll, key: round.0.first.attack.0.hit, sides: 6, value: 1}
    - {kind: roll, key: round.0.first.attack.1.hit, sides: 6, value: 1}
    - {kind: roll, key: round.0.second.attack.0.hit, sides: 6, value: 1}

# The printed Netter is a Gnoblar hero's kit provision whose only duel-visible projection is the canonical
# net-charge operator.  The fixture is the band's printed Gnoblar hero (trappers), whose profile supplies the
# printed Ballistic Skill the net's target comes from; the operator is supplied through the same grant channel
# the bull-charge scenarios use.  The defence is hand-built so the escape test's own Strength is known.
- audit_id: rule/mordheim/ogre-hunting-party-web/band--ogre-hunting-skills/profile.skill-access
  id: a-failed-belch-test-costs-the-enemy-its-first-attack
  covers: [crude-belch]
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [skill.crude-belch-halfling]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 7}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 2, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.crude-belch, value: true}
  rolls:
    - {key: round.0.first.crude-belch.leadership.0, value: 6}
    - {key: round.0.first.crude-belch.leadership.1, value: 6}
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.1.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: false, attacks.1.hit: false, attacks.2.hit: false, state.first.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The control of the same contract: without the belch operator the identical enemy keeps its whole attack
# pool, so the lost first attack above belongs to the rule rather than to the fixture.  Neither Leadership die
# is requested, which is the printed test not happening at all.
- audit_id: rule/mordheim/ogre-hunting-party-web/band--ogre-hunting-skills/profile.skill-access
  id: without-the-belch-operator-the-enemy-keeps-its-first-attack
  covers: [crude-belch]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 7}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 2, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 4}
    - {key: round.0.second.attack.1.hit, value: 1}
    - {key: round.0.second.attack.0.wound, value: 4}
  expect_rounds:
    0: {attacks.1.hit: true, attacks.2.hit: false, attacks.1.damage: 1, state.first.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The printed access closure for the five named skills.  The named members keep their own origins and no
# catalogue identity exists for them at this band (see the clause note), so what is authored is the gate
# around the list: a special skill the printed list does not name is refused for the printed recipient and for
# a band henchman.  Both tapes use a neutral weapon so the skills decision is the one the fragment names.
- audit_id: rule/mordheim/ogre-hunting-party-web/band--ogre-hunting-skills/profile.skill-access
  id: a-special-skill-outside-the-printed-list-is-refused-for-the-ogre-hero
  covers: [ogre-skill-list-rest]
  fighters:
    first:
      collection: mordheim
      band_id: ogre-hunting-party-web
      profile_id: ogre-hunter
      skill_ids: [skill.monster-slayer]
      main_weapon_id: weapon.natural-attacks
  expect_error: "skills are not available to ogre-hunting-party-web/ogre-hunter: ['skill.monster-slayer']"

- audit_id: rule/mordheim/ogre-hunting-party-web/band--ogre-hunting-skills/profile.skill-access
  id: the-same-skill-is-refused-for-a-band-henchman
  covers: [ogre-skill-list-rest]
  # The printed list is access for these heroes; this band's henchmen print no skill access at all
  # (profiles.yaml, gnoblar-fighters), so the same special skill is refused for them too.
  fighters:
    first:
      collection: mordheim
      band_id: ogre-hunting-party-web
      profile_id: gnoblar-fighters
      skill_ids: [skill.monster-slayer]
      main_weapon_id: weapon.natural-attacks
  expect_error: "skills are not available to ogre-hunting-party-web/gnoblar-fighters: ['skill.monster-slayer']"

