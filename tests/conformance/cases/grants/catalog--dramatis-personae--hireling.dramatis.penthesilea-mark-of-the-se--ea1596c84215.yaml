# Hireling family model (P0, 2026-11-17).  The recipient is the printed hireling profile, compiled
# through the hireling route (band_id hirelings.<kind>.<grade>, profile_id hireling.<kind>.<slug>); its
# printed rule is granted by the profile itself, so the build selects nothing.  Its physical
# characteristics are supplied as fixture facts (WS3 S3 T3 W2 I5 A1) so every die threshold is fixed,
# while its printed Leadership (8) stays in place; the omitted main weapon is the printed kit's first
# close-combat weapon, the Starsword (parry, +1 Strength, ignores armour saves), so the fixture strikes at
# S4 and no save die exists.  The opponent is hand-built (WS3 S3 T3 W3 I2 A1 Ld7, mace) and declares the
# facts the rule reads: a human male (trait_overrides species: human, sex: male); the female boundary
# keeps the species and changes only the sex.  The control is the grade-1b Bard, compiled through the
# same route with the same fixture.  The refusal selects the printed rule on that control through
# special_rule_ids.
# Penthesilea's other printed duel rules: Mesmerising Dance adds the opponent's own Leadership test at
# round.0.second.mesmerising-dance.{0,1} each round (1+1 passes Ld7, declared with that comment); Savage
# Fury adds an attack only on her charge, so no charge is declared - Hatred reads the first round of
# combat, not the charge, so the re-roll is still the first round's; her Amazon rule hates Lizardmen and
# Norse warbands, which the human opponent is not.
# Dice: a natural 2 misses WS3; the printed Hatred re-roll of the first round is requested, 4 hits and S4
# wounds T3 on 3+ (a 4 is declared).

# The recipient fights a human male: the first-round miss is re-rolled, hits and wounds.
- audit_id: rule/catalog/dramatis-personae/hireling.dramatis.penthesilea-mark-of-the-serpent.rule.man-hater/mechanic.man-hater
  id: a-first-round-miss-by-penthesilea-is-rerolled-against-a-human-male
  fighters:
    first:
      &recipient
      collection: mordheim
      band_id: hirelings.dramatis-personae.1b
      profile_id: hireling.dramatis.penthesilea-mark-of-the-serpent
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      &human_male
      main_weapon_id: weapon.mace
      trait_overrides: {species: human, sex: male}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    # Mesmerising Dance: the opponent's own Leadership test, passed (1+1 against Ld7).
    - {key: round.0.second.mesmerising-dance.0, value: 1}
    - {key: round.0.second.mesmerising-dance.1, value: 1}
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.first.attack.0.hit.reroll, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.wounds: 2, state.first.wounds: 2, state.second.charm_attack_blocked: false}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

