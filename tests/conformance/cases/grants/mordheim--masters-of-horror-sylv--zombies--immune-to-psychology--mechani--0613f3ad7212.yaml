# Discriminating repair (2026-11-16): the Fear scenario above cannot tell the immunity apart, because
#   the bearer's own printed Fear rule already exempts it from Fear tests, so it stays as evidence
#   of the printed outcome but not of this grant.  The printed immunity ("not affected by
#   psychology" - Stupidity is a Psychology test) is read instead through Stupidity: the bearer,
#   built from its own printed profile (zombies: W1 A1 Ld5), carries a supplied Head Injury
#   (permanent disability result 6: the warrior is subject to Stupidity, design-rulings
#   "Disability consumes a permanent supplied result - 2026-10-15") and is the active duelist with
#   no friendly Hero nearby, so a non-immune warrior must take the 2D6 Stupidity test at the start
#   of its turn.  The immune bearer declares no Stupidity die and keeps fighting: the strict tape
#   holds only its 1 printed strike(s), each a natural 1, so nothing else is resolved.  The
#   hand-built opponent fights with attacks 0.  Contrast: the band-mate the-bitten
#   (W1 Ld6), which binds no psychology
#   immunity, is asked for the same test; 6+6 fails it against any Leadership, so it is Stupid and
#   makes no attack.  The Bitten's own printed Transform roll comes first each turn and is
#   declared as a 3 ("2 to 5: Act as normal"), so it neither adds nor cures Stupidity.

- audit_id: rule/mordheim/masters-of-horror-sylv/zombies--immune-to-psychology/mechanic.psychology-immunity
  id: the-immune-warrior-takes-no-stupidity-test
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 10, attacks: 1, leadership: 7}
    second: {collection: mordheim, band_id: masters-of-horror-sylv, profile_id: zombies}
  initial_state: {first: {attacks: 0}, second: {resources_spent: [disability.6]}}
  duel_context: {charging: [], active_participant: second}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.wounds: 3, state.second.wounds: 1, state.second.stupidity_failed: false, state.second.condition: STANDING}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

- audit_id: rule/mordheim/masters-of-horror-sylv/zombies--immune-to-psychology/mechanic.psychology-immunity
