# Closing review (combined facet): the same warrior carries the printed immunity together with
#   the Stupidity and Hatred grants on itself and holds the frenzy flag, so the recorded
#   contract's remaining variants are all observable in one duel.
- audit_id: rule/mordheim/masters-of-horror-sylv/zombies--immune-to-psychology/mechanic.psychology-immunity
  id: the-immunity-skips-stupidity-suppresses-frenzy-and-denies-the-hatred-reroll
