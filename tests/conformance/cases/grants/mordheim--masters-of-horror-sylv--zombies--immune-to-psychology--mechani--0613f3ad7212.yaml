# AUTHORED: the printed immunity is read through the one Psychology request this
#   setup can make - the round-0 Fear test of the charged warrior.  In the immune scenario the
#   tape declares no Fear die at all, and the strict tape consumes exactly the declared dice and
#   rejects both an undeclared request and an unused entry, so a test the engine still asked for
#   fails the case instead of passing quietly - the absence is the assertion.
#   In the contrast scenario the non-immune band-mate the-bitten is charged the same way and its
#   two Leadership dice are declared and pass on 1+1, so the same setup does produce the request
#   when the immunity is absent.
# AUTHORED: the contract's remaining variants are now written below as one
#   combined fixture - the corpus's own devices supply every missing grant: 'skill_ids' carries
#   mechanic.stupidity, mechanic.hatred-undead and mechanic.psychology-immunity on the same
#   hand-built warrior and trait_overrides supplies Frenzy before initialization, exactly as the canonical
#   mechanic.* cases and the already-authored immune-to-psychology siblings of this family do.
#   The absent stupidity, frenzy and reroll dice ARE the assertion: the corpus devices supply
#   every missing grant (skill_ids carries mechanic.stupidity, mechanic.hatred-undead and
#   mechanic.psychology-immunity and trait_overrides supplies Frenzy before initialization exactly as the
#   canonical mechanic.* cases do), and the strict tape rejects any undeclared request, so the
#   paired operator reading - initialize_fighter's suppression of frenzy/stupidity and the
#   hatred-reroll denial - is authored as its negation (no die is declared for it).  Its recorded contract covers any
#   individual Psychology test and the denial of a Hatred reroll and of a Frenzy bonus, so these
#   variants stay unobserved: (a) a Stupidity test skipped for the same warrior - no corpus
#   profile pairs this immunity with a Stupidity grant, so the variant needs that grant (or an
#   accepted equivalent fixture); (b) the denial of a Hatred reroll and of a Frenzy bonus - the
#   same missing second grant.
#   Dice derivation (sources): the warrior strikes with its printed Attacks value A1 and its rules
#   [zombies--cause-fear, zombies--may-not-run, zombies--immune-to-psychology, zombies--immune-to-poison, zombies--no-pain, zombies--no-brain]
#   add no round-0 die request of their own - every strike is declared as a natural 1, so no
#   on-hit, wound, save or injury effect can trigger, and a charged model takes no charge bonus.
#   Contrast evidence (sources): the contrast profile the-bitten binds no psychology or fear immunity, and no
#   immunity rule of this band names it in applies_to.  hunchbacks was rejected as the control: the Lunatic row
#   is compiled onto every profile its applies_to lists, so the Hunchback itself causes Fear and no charged-side
#   Fear test is requested against it.
#   The Fear test itself is a 2D6 Leadership test, so the variant list above concerns the
#   clause's other consequences, not an unavailable tape.

# --- Authored scenarios ---
# Derived from the printed rule text, the band package and the recorded semantic contract; no engine
# output was consulted.  The Fear source is the printed Chainsaw Sword grant ("A model bearing a
# Chainsaw Sword causes Fear"); because that bearer also causes Fear, the charging side takes no
# charge test, so the only Psychology request this setup can make is the charged warrior's Fear
# test - the one the immunity removes.  Both warriors fight unarmed, each striking with the printed
# Attacks value of its own profile, and every strike is declared as a natural 1, so the round
# reports nothing but that request.

- audit_id: rule/mordheim/masters-of-horror-sylv/zombies--immune-to-psychology/mechanic.psychology-immunity
  id: the-immune-warrior-is-not-tested-for-fear
  fighters:
    first:
      main_weapon_id: weapon.chainsaw-sword
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 7, attacks: 1, leadership: 7}
    second: {collection: mordheim, band_id: masters-of-horror-sylv, profile_id: zombies}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.wounds: 3, state.second.wounds: 1, state.second.condition: STANDING}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

