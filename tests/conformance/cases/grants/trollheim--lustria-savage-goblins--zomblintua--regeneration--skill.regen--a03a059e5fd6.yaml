# --- Authored scenarios ---
# Derived from the printed rule ("Whenever Zomblintua suffers a Wound, roll D6; on 5+ that Wound
# is ignored.  Wounds caused by fire or fire-based magic cannot be regenerated") and the
# recorded contract (regeneration_save 5, blocked_by fire, trigger: attack-time unsaved wound).
# The bearer is the printed profile, which never uses weapons or armour, so its own armour step
# is absent and the special save is the only save after the wound; the attacker is hand-built
# so its Strength fixes the wound target independently of the profile (Strength 5 against the
# printed Toughness 5 wounds on a four).  The bearer's attacks are suppressed in the fixture so
# the tape carries only the attacker's chain, and the wound count is supplied below the
# profile's three so no injury roll intervenes.  The fire scenario uses the brazier iron, the
# canonical fire carrier, whose own +1 Strength moves the wound target to three; its ignition
# die is declared below the printed threshold, which still leaves the attack a fire wound, and
# no Regeneration die follows it.

