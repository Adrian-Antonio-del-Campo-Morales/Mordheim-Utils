# --- Authored scenarios ---
# Printed text (grade-1a.yaml, Skull Rack): "The bearer causes fear in all Beastmen."  The binding
# is the shared mechanic.fear-beastmen: Fear scoped to an enemy that is a Beastman
# (species.beastman).  Consumer: modular/psychology.py causes_fear() and resolve_fear()/needs_test().
# Hireling family model (P0, 2026-11-17).  The recipient is the printed Beast Hunter compiled
# through the hireling route (hirelings.hired-sword.1a / hireling.hired-sword.beast-hunter) with
# the fixture facts (WS3 S3 T3 W2 I5 A1; his printed Ld7 stays); his kit's first close-combat
# weapon is an axe, so the main weapon is omitted; the rule is a profile grant, so nothing is
# selected.  The Beast Hunter is silenced (attacks 0) in every scenario: his sibling Beastmen
# Vengeance (Hatred against Beastmen) would otherwise offer him a hit reroll against the Beastman,
# and the observable here is the Beastman's own test and hit target.  The enemy is hand-built
# (mace, WS3 S3 T3 W3 I2 A1 Ld7) and declares the one fact the rule reads (species: beastman, or
# human).  Dice: a 2D6 Fear test of 5+4 fails Ld7 and 3+3 passes; the failed charged test raises
# the enemy's hit target to 6, so its 4 misses where it hit before.  The control is the grade-1b
# Bard, compiled through the same route; the refusal selects the printed rule on the Bard.

# The Beast Hunter charges a Beastman; the Beastman's 9 fails Ld7 and its 4 now needs a 6.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.beast-hunter.rule.skull-rack/mechanic.fear-beastmen
  id: a-beastman-charged-by-the-beast-hunter-that-fails-its-fear-test-hits-only-on-sixes
  fighters:
    first:
      &recipient
      collection: mordheim
      band_id: hirelings.hired-sword.1a
      profile_id: hireling.hired-sword.beast-hunter
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      trait_overrides: {species: beastman}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  initial_state: {first: {attacks: 0}}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.fear.charged.0, value: 5}
    - {key: round.0.second.fear.charged.1, value: 4}
    - {key: round.0.second.attack.0.hit, value: 4}
  expect_rounds:
    0: {state.second.fear_hit_sixes: True, attacks.0.hit_target: 6, attacks.0.hit: False, state.first.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

