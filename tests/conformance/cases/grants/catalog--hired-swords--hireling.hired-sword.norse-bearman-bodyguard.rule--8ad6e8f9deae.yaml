# The printed grant belongs to the Bearman's profile; selecting it on another hireling is refused.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.norse-bearman-bodyguard.rule.shieldmaster/mechanic.norse-shieldmaster
  id: the-rule-is-refused-on-a-hireling-outside-its-printed-profile
  fighters:
    first: *attacker
    second:
      <<: *control
      special_rule_ids: [hireling.hired-sword.norse-bearman-bodyguard.rule.shieldmaster]
  expect_error: "special rule is not available to hirelings.hired-sword.1b"
