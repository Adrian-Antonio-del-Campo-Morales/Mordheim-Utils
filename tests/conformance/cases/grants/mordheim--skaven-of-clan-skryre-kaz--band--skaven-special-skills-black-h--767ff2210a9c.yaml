# Rule (special-rules.yaml, band--skaven-special-skills-black-hunger, warband_skill, grant selectable,
# applies_to profile_types [hero], Karak Azgal p.41 Skaven Special Skills, rule_ref
# shared-rule.black-hunger): the rulebook Black Hunger - the Skaven may invoke it in his own turn for
# +1 Attack that turn and at the end of the turn suffers 1D3 Strength 3 hits with no armour save.  The
# row binds mechanic.black-hunger (consumers: modular/rounds.py ~463-468, the documented automatic
# activation convention on the bearer's own turn - design-rulings.md "One combat-phase iteration per
# player turn" - adding attacks_bonus 1 and the active tag; modular/aftermath.py _black_hunger ~245-275,
# the end-of-turn 1D3 Strength 3 automatic unparryable armour-ignoring non-critical hits on the bearer,
# a synthetic hit per the "Fire and other synthetic hits are hits" ruling).  Recipient: the band's
# printed Master Engineer (skaven-of-clan-skryre-kaz / master-engineer) with the fixture facts (WS3 S3 T3 W2 I5 A1), a
# list sword and the selection through special_rule_ids; the record applies to Heroes only, so the
# band's Clanrats are refused with the band/profile fragment (the shape of the band's AUTHORED
# tail-fighting sibling).  Opponent: hand-built (WS3 S3 T3 W3 I2 A1 Ld7, mace) whose blow is a natural
# 1 (so the sword offers no parry).  WS3 against WS3 hits on 4+; S3 wounds T3 on 4+ on both sides of
# the backlash; the Hero charges so his turn is the first player turn and the whole pool's hit dice
# precede its wound dice.

# The invoked Hero strikes twice and takes the backlash (one Strength 3 hit, no armour die).
- audit_id: rule/mordheim/skaven-of-clan-skryre-kaz/band--skaven-special-skills-black-hunger/mechanic.black-hunger
