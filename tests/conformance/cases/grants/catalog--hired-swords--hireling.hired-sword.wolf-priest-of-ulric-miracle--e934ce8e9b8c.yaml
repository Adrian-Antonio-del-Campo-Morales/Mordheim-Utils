# --- Authored scenarios ---
# Printed text (grade-2b.yaml, Strictures): "Wolf-Priests of Ulric may never wear armour ... The only
# exception is that every Wolf-Priest is garbed in a cloak made from the pelt of a white wolf; the pelt
# allows a 6+ saving throw. ... Wolf-Priests of Ulric may never be equipped with blackpowder weapons."
# The binding forbids the `armour` and `blackpowder` tokens; helmets and crossbows are printed as "not
# favoured", not forbidden, but a helmet is armour under the KB's `armour` token and is outside the kit.
# The recipient is the printed Wolf-Priest compiled through the hireling route
# (hirelings.hired-sword.2b / hireling.hired-sword.wolf-priest-of-ulric-miracle-workers) with the
# fixture facts (WS3 S3 T3 W2 I5 A1; the printed Ld8 stays).  The admission uses the corpus's
# construction-only shape (no charge, the bearer out of action before the first phase, so the duel
# requests no die) and observes the compiled build alone: the pelt's printed 6+ is the compiled
# armour_save (execution.yaml defence.wolf-pelt-cloak: armour_save_bonus 1 on the bare 7), the same
# save cases/mechanics/defence.wolf-pelt-cloak.yaml observes on the armour die.  The refusals use the
# kit-resolver fragment already asserted there.

# The printed kit: the dagger in hand and the pelt worn, so the compiled save is the pelt's 6+.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.wolf-priest-of-ulric-miracle-workers.rule.strictures/profile.equipment-restrictions
  id: the-printed-dagger-and-pelt-compile-with-the-pelt-save-alone
  fighters:
    first:
      collection: mordheim
      band_id: hirelings.hired-sword.2b
      profile_id: hireling.hired-sword.wolf-priest-of-ulric-miracle-workers
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
      main_weapon_id: weapon.dagger
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [], active_participant: first}
  initial_state: {first: {condition: OUT}}
  expect_fighters:
    first.armour_save: 6

# "Wolf-Priests of Ulric may never wear armour": a suit of light armour beside the pelt is refused.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.wolf-priest-of-ulric-miracle-workers.rule.strictures/profile.equipment-restrictions
  id: armour-is-refused
  fighters:
    first:
      collection: mordheim
      band_id: hirelings.hired-sword.2b
      profile_id: hireling.hired-sword.wolf-priest-of-ulric-miracle-workers
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
      main_weapon_id: weapon.dagger
      armour_id: armour.light-armour
  expect_error: "hireling active equipment and supplied ownership do not form a complete legal printed kit"

