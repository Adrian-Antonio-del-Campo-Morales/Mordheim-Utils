  duel_context: *miniath-context
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.parries_remaining: 0, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

- audit_id: rule/catalog/warband/skill.miniath/skill.miniath
  id: the-mace-parry-attempt-blocks-the-hit
  covers: [parry-with-any-weapon]
  fighters:
    first: *miniath-attacker
    second:
      main_weapon_id: weapon.mace
