# available to <band>/<profile>: [...]" builds its neutral profile as skill_access = access.skills from that
# same access set, so the supplied skill_ids DO distinguish the two builds.  The KB row is the
# profile-granted compiler.promoted-hero-skill-access of bands/mordheim/pit-fighters/special-rules.yaml
# (ogre-pit-fighter--skills, allowed_skill_lists combat/strength/special, runtime implemented YES), pinned
# by tests/python/knowledge/test_catalog.py.  The paragraphs below are retained as SUPERSEDED HISTORY for
# provenance only; the correction governs.
# The Lad's Got Talent, and the shared eligibility module realises it only for a promoted build:
