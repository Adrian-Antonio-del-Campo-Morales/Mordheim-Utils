- audit_id: rule/catalog/hired-swords/hireling.hired-sword.priestess-of-shallya.rule.strictures/mechanic.shallya-strictures
  id: a-hireling-without-the-rule-charges-the-same-opponent-freely
  fighters:
    first:
      &control
      collection: mordheim
      band_id: hirelings.hired-sword.1b
      profile_id: hireling.hired-sword.bard
      main_weapon_id: weapon.dagger
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second: *unqualified
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first_charged: True, attacks.0.hit: false, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The printed grant belongs to the Priestess's profile; selecting it on another hireling is refused.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.priestess-of-shallya.rule.strictures/mechanic.shallya-strictures
  id: the-rule-is-refused-on-a-hireling-outside-its-printed-profile
  fighters:
    first:
      <<: *control
      special_rule_ids: [hireling.hired-sword.priestess-of-shallya.rule.strictures]
    second: *unqualified
  expect_error: "special rule is not available to hirelings.hired-sword.1b"
