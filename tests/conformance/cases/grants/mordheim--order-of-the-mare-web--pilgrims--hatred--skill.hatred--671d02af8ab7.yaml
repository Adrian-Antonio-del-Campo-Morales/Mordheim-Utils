# --- Authored scenarios ---
# Family model (Hatred against every enemy): the bearer is the printed Pilgrim built from its band
# profile, so the granted skill is what the scenario exercises; its physical characteristics are
# supplied as fixture facts (WS3 S3 T3 W2 I5 A1) so the dice thresholds and the strike order are fixed,
# and its printed Leadership stays in place.  The opponent fixture declares no identity fact at all,
# because the recorded contract qualifies every enemy and the identity gate is therefore open.  A
# natural 2 misses against WS3, the reroll is taken on a 4+ and the wound rolls a 4+, so the reroll is
# exactly what the tape shows.  The contrast bearer is a band profile the printed record does not
# reach, and its tape holds no reroll key at all.

- audit_id: rule/mordheim/order-of-the-mare-web/pilgrims--hatred/skill.hatred
  id: the-pilgrims-first-round-miss-is-rerolled-against-any-enemy
  fighters:
    first:
      collection: mordheim
      band_id: order-of-the-mare-web
      profile_id: pilgrims
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.first.attack.0.hit.reroll, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: true, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

