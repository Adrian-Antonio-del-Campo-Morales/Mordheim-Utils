# Hireling family model (P0, 2026-11-17; equipment batch 2026-11-18).  The recipient is
# the printed hireling profile compiled through the hireling route (band_id
# hirelings.hired-sword.2b, profile_id hireling.hired-sword.sister-of-sigmar); the
# printed rule is granted by the profile itself, so nothing is selected for it.  Her
# build is the admitted one (tests/construction/test_hireling_admission.py): the
# printed kit is owned (sigmarite_hammer, light_armour, blessed_water,
# arcane_candelabrum), the Sigmarite hammer is in hand, and Blessing of Sigmar's two
# distinct Sisters special skills are selected (Sign of Sigmar, Absolute Faith) so the
# profile constructs; neither requests a die here (Sign of Sigmar reads an Undead or
# Possessed opponent, Absolute Faith's Fear re-roll has no failed test to re-roll).
# Physical characteristics are the fixture facts (WS3 S3 T3 W2 I5 A1); the printed Ld8
# stays.  The opponent is hand-built (WS3 S3 T3 W3 I2 A1 Ld7, mace) and declares the
# one fact the relic reads, trait_overrides: {causes_fear: true}.  The control is the
# grade-1b Bard with his kit dagger.
#
# Printed rule (Mutiny in Marienburg Specialists p4): "Arcane Candelabrum counts as a
# holy relic, brazier iron and lantern that is used one-handed."  The admitted duel
# binding is defence.holy-relic: "automatically pass the first Leadership test he is
# required to make in the game" (mechanic/defence.holy-relic model).  The auto-pass
# consumes no die, so the strict tape would fail if a Fear die were requested; the
# spent-resource set `leadership.holy-relic` is the observable that the single use
# happened.  A charger's failed Fear test cancels the charge (termination disengaged).

# The Sister charges a fear-causer: her first required Leadership test is the Fear
# test at the charge, auto-passed with no die; the relic's single use is spent and
# the duel proceeds to the (missed) attacks.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.sister-of-sigmar.rule.candle-tree/hireling.hired-sword.sister-of-sigmar.rule.candle-tree.relic
  id: the-sisters-candelabrum-passes-her-first-leadership-test-without-a-die
  fighters:
    first:
      &recipient
      collection: mordheim
      band_id: hirelings.hired-sword.2b
      profile_id: hireling.hired-sword.sister-of-sigmar
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
      owned_item_ids: [sigmarite_hammer, light_armour, blessed_water, arcane_candelabrum]
      main_weapon_id: weapon.sigmarite-hammer
      special_rule_ids: [band--special-skills-sign-of-sigmar, band--special-skills-absolute-faith]
    second:
      &fear-causer
      main_weapon_id: weapon.mace
      trait_overrides: {causes_fear: true}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: &recipient-charges {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.resources_spent: [leadership.holy-relic], state.first.condition: STANDING, attacks.0.hit: false, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

