# Rule (special-rules.yaml, troll-slayers--equipment-restrictions, grant profile, applies_to
# troll-slayers, Karak Azgal p.33 "0-3 Troll Slayer"): beside the equipment restriction (its own
# identity) the row binds mechanic.slayer-identity, the Slayer identity the Slayer Rules print for the
# Troll Slayer.  Readers: roster-construction compiler.py ~1152-1159 (a supplied
# condition.rememberer-kaz-support requires a dwarf-slayers-kaz Hero whose loadout carries
# identity.slayer, else "Rememberer support requires a Slayer Hero of the printed source variant") and
# modular/attacks.py ~270-278 (the re-roll, needing a large or tough opponent, never reached here).  The
# compiled-tag scenario follows the band's accepted TC6 shape (mace, supplied WS4 S3 T3 W2 I3 A1,
