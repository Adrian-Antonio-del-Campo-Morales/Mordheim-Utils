# ordinary hand-built opponent so no re-roll is offered; both blows are natural 1s.

# The compiled Troll Slayer carries identity.slayer (no leader rule: the list is the Giant Slayer's
# accepted projection without mechanic.leader-six).
- audit_id: rule/mordheim/dwarf-slayers-kaz/troll-slayers--equipment-restrictions/mechanic.slayer-identity
  id: the-compiled-troll-slayer-carries-the-slayer-identity
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      collection: mordheim
      band_id: dwarf-slayers-kaz
      profile_id: troll-slayers
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 4, strength: 3, toughness: 3, wounds: 2, initiative: 3, attacks: 1}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
  expect_fighters:
    second.global_effects.tags: [identity.slayer, skill.hard-to-kill, mechanic.hatred-orcs-goblins, armour.no-armour, concussion_immune, fighter-kind.hero, band.dwarf-slayers-kaz]
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The identity admits the Troll Slayer to the supplied Rememberer support.
- audit_id: rule/mordheim/dwarf-slayers-kaz/troll-slayers--equipment-restrictions/mechanic.slayer-identity
  id: the-troll-slayer-is-admitted-the-supplied-rememberer-support
  fighters:
    first:
      collection: mordheim
      band_id: dwarf-slayers-kaz
      profile_id: troll-slayers
      condition_ids: [condition.rememberer-kaz-support]
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second: &opponent
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.wounds: 2, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# A Hero of the band outside this rule's recipients (the Rememberer) carries no Slayer identity and is
# refused the same support.
- audit_id: rule/mordheim/dwarf-slayers-kaz/troll-slayers--equipment-restrictions/mechanic.slayer-identity
  id: the-rememberer-without-the-identity-is-refused-the-support
  fighters:
    first:
      collection: mordheim
      band_id: dwarf-slayers-kaz
      profile_id: rememberer
      condition_ids: [condition.rememberer-kaz-support]
      main_weapon_id: weapon.mace
    second: *opponent
  expect_error: "Rememberer support requires a Slayer Hero of the printed source variant"
