# --- Authored scenarios ---
# Hireling family model.  The printed rule (Town Cryer 25): "The part-mechanical
# body of the Rat Ogre is very hardy and confers a 4+ armour save."  The save is
# the body itself, not removable gear, so the profile grants it innately
# (grant: profile, design ruling 2026-11-18) and the build selects nothing.
# The recipient is compiled through the hireling route with fixture
# characteristics (WS3 S3 T3 W2 I5 A1; the printed Ld10 stays) and its attacks
# silenced.  The charging attacker declares a passing 3+3 Fear test against its
# Ld7 (the Rat Ogre causes Fear); the charged Rat Ogre is psychology-immune
# (Bio Machinery) and tests nothing.  The control is the grade-1b Bard: the same
# hit and wound reach him with no armour die requested.

# The printed save on its own face.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.clan-skryre-rat-ogre.rule.bio-armour/defence.bio-armour
  id: the-rat-ogres-bio-armour-saves-on-four
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: &gba-attacker {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
    second:
      &gba-rat-ogre
      collection: mordheim
      band_id: hirelings.hired-sword.1b
      profile_id: hireling.hired-sword.clan-skryre-rat-ogre
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
  initial_state: {second: {attacks: 0}}
  duel_context: &gba-charging-first {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.fear.charge.0, value: 3}
    - {key: round.0.first.fear.charge.1, value: 3}
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.armour, value: 4}
  expect_rounds:
    0: {attacks.0.saved: true, attacks.0.damage: 0, state.second.wounds: 2}
  expect_fighters:
    second.armour_save: 4
  expect_final: {rounds_executed: 1, termination_reason: horizon}

