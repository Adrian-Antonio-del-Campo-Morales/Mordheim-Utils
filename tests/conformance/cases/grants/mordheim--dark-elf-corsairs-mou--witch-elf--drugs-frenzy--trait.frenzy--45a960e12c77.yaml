# Printed source (Dark Elf Corsairs, Mousillon supplement p.5, Specialist / Witch Elf / Drugs): "Uses
# drugs and is therefore subject to frenzy."  The record witch-elf--drugs-frenzy binds trait.frenzy
# (value true) to the witch-elf profile.  Rulebook Frenzy: the warrior fights with double her Attacks,
# is immune to Psychology (no Fear test), and loses Frenzy for the rest of the battle once knocked
# down.  Family model (band-profile frenzy): the recipient is the band's printed Witch Elf
# (dark-elf-corsairs-mou / witch-elf) with the corpus characteristics (WS3 S3 T3 W2 I5 A1; the printed
# Ld8 stays) and her printed blades (main_weapon_id weapon.sword, the compound fills the second); her
# strikes are natural 1s so neither the blades' venom nor their upgrade adds a die.  The comrade control
# is the band's printed Corsair (corsairs, a sword of the Reavers list, the same fixture, printed Ld7)
# who carries no frenzy rule.  The opponent is hand-built (WS3 S3 T3 W3 I2 A1 Ld7, mace), charges, and
# declares causes_fear where the Fear face is read.  A 2D6 Fear test of 5+4 fails Ld7.

# Frenzied: the charge of a Fear-causer prompts no Fear dice and her one supplied Attack is doubled
# (two from Frenzy plus the second blade's one: three strikes, the fourth recorded attack of the round).
- audit_id: rule/mordheim/dark-elf-corsairs-mou/witch-elf--drugs-frenzy/trait.frenzy
  id: the-frenzied-witch-elf-doubles-her-attacks-and-takes-no-fear-test
  fighters:
    first: &fear-charger
      main_weapon_id: weapon.mace
      trait_overrides: {causes_fear: true}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
    second: &witch-elf
      collection: mordheim
      band_id: dark-elf-corsairs-mou
      profile_id: witch-elf
      main_weapon_id: weapon.sword
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
  initial_state:
    second: {attacks: 1}
  duel_context: &opponent-charges {charging: [first], active_participant: first}
  maximum_rounds: 1
  expect_initial: {second.frenzy: true}
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.0.second.attack.1.hit, value: 1}
    - {key: round.0.second.attack.2.hit, value: 1}
  expect_rounds:
    0: {state.second.frenzy: true, state.second.fear_hit_sixes: false, attacks.3.wounded: false, state.first.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

