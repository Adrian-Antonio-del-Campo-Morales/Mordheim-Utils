# Hireling family model (P0, 2026-11-17).  The recipient is the printed Maximilian the Mad compiled
# through the hireling route (hirelings.dramatis-personae.1b / hireling.dramatis.maximilian-the-mad)
# with the fixture facts (WS3 S3 T3 W2 I5 A1; the printed Ld10 stays) and his printed Double-Handed
# Holy Weapon (the canonical double-handed weapon: Strength +2, so S5 wounds T3 on 2+).  His printed
# Fanatical rule is granted by the profile itself, so the build selects nothing; the printed hated list
# names Middenheimers, read on the opponent's supplied Mercenary origin (trait_overrides
# mercenary_origin -> mercenary-origin.<origin>); a Reikland origin is a human warband the print never
# names.  His other printed rules: he causes Fear, so the charging opponent tests Fear for its charge
# (`round.0.second.fear.charge.{0,1}`, 3+3 passes Ld7); his automatic Leadership never rolls; his
# Frenzy is supplied as ended (see the Discrimination note) except where it is the scenario's subject.
# The opponent charges so that it strikes first whatever Strongman does to the holy weapon's order.
# The opponent is hand-built (WS3 S3 T3 W3 I2 A1 Ld7, mace) and its own hit is a natural 1.  The
# control is the grade-1b Bard compiled through the same route; the refusal selects the printed rule on
# that control.

# Frenzy ended: the first-round miss (2) against the Middenheimer is re-rolled, 4 hits and the S5 blow
# wounds on the declared 2.
- audit_id: rule/catalog/dramatis-personae/hireling.dramatis.maximilian-the-mad.rule.fanatical/mechanic.fanatical-hatred
  id: a-first-round-miss-by-maximilian-is-rerolled-against-a-middenheimer-after-frenzy-ends
  fighters:
    first:
      &fanatical-recipient
      collection: mordheim
      band_id: hirelings.dramatis-personae.1b
      profile_id: hireling.dramatis.maximilian-the-mad
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      &middenheimer
      main_weapon_id: weapon.mace
      trait_overrides: {mercenary_origin: middenheim}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  initial_state: {first: {attacks: 1, frenzy: false}}
  duel_context: {charging: [second], active_participant: second}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.fear.charge.0, value: 3}
    - {key: round.0.second.fear.charge.1, value: 3}
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.first.attack.0.hit.reroll, value: 4}
    - {key: round.0.first.attack.0.wound, value: 2}
  expect_rounds:
    0: {state.first.frenzy: False, attacks.1.hit: true, state.second.wounds: 2, state.first.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

