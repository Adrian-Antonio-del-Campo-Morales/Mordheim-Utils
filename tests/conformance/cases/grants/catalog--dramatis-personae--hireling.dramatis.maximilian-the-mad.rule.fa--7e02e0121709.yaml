  id: the-frenzied-maximilian-receives-no-hatred-reroll
  fighters:
    first:
      <<: *fanatical-recipient
    second:
      <<: *middenheimer
  initial_state: {first: {attacks: 1}}
  duel_context: {charging: [second], active_participant: second}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.fear.charge.0, value: 3}
    - {key: round.0.second.fear.charge.1, value: 3}
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.first.attack.1.hit, value: 2}
  expect_rounds:
    0: {state.first.frenzy: True, attacks.1.hit: false, attacks.2.hit: false, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

