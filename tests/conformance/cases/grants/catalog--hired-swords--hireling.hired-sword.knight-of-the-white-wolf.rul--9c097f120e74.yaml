# --- Authored scenarios ---
# The KB prints Pride as "Uses source pride rule" bound to mechanic.leader-six, the canonical Local
# Leader (6 Inches) supplied-leader contract (sources/knowledge/catalog/mechanics/close-combat.yaml):
# a friendly warrior within the printed radius may use the bearer's Leadership for its own required
# Leadership test, mirroring the authored leader files of this directory (mercenaries
# mercenary-captain--leader, lizardmen skink-priest--leader).  The Knight is the printed hireling
# profile compiled through the hireling route (hirelings.hired-sword.2a /
# hireling.hired-sword.knight-of-the-white-wolf) and supplied as a nearby participant of the
# borrower's own side; his printed Leadership 9 is the borrowed value and the fixture facts
# (WS3 S3 T3 W2 I5 A1) pin his other characteristics.  His omitted main weapon is the kit's own huge
# hammer, which by its printed text counts as the implemented Horseman's Hammer (second triage
# batch, 2026-11-18); as a nearby provider he strikes no blow, so it adds no dice.  The borrower is
# a same-package comrade (the Imperial Tactician, Ld pinned 7, dagger) and the enemy is a
# hand-built fear-causer that charges
# it, so the test under evidence is the borrower's charged Fear test: 4+4 = 8 fails its own Ld7 and
# passes the Knight's Ld9, and the printed consequence of a standing failure is explicit in
# state.second.fear_hit_sixes.  Every declared attack is a natural 1, a miss.

# The charged borrower fails against its own Leadership and passes with the Knight's supplied
# value, so the charge it received leaves its hits unclamped.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.knight-of-the-white-wolf.rule.pride/mechanic.leader-six
  id: a-friendly-warrior-within-six-inches-borrows-the-knights-leadership
  fighters:
    first:
      main_weapon_id: weapon.mace
      trait_overrides: {causes_fear: true}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 10, attacks: 1, leadership: 7}
    second:
      # The borrower is a comrade of the Knight's own hireling package
      # (band.hirelings.hired-sword.2a), the supplied-leader same-warband fact
      # the engine reads; his Leadership is pinned at 7 as a fixture fact so
      # the borrowed 9 is separable from his own.
      collection: mordheim
      band_id: hirelings.hired-sword.2a
      profile_id: hireling.hired-sword.imperial-tactician
      main_weapon_id: weapon.dagger
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 7}
  duel_context:
    charging: [first]
    active_participant: first
    nearby:
      - participant_id: leader
        side_id: second
        condition: standing
        fighter:
          collection: mordheim
          band_id: hirelings.hired-sword.2a
          profile_id: hireling.hired-sword.knight-of-the-white-wolf
          characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    distances:
      - [second, leader, 6]
  maximum_rounds: 1
  decisions:
    - {key: round.0.second.fear.charged.leader.leader, value: true}
  rolls:
    - {key: round.0.second.fear.charged.0, value: 4}
    - {key: round.0.second.fear.charged.1, value: 4}
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.wounds: 3, state.second.wounds: 2, state.second.fear_hit_sixes: false}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

