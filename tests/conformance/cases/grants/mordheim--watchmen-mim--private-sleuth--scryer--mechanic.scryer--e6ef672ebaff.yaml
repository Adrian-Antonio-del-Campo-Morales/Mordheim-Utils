# audit_id: rule/mordheim/watchmen-mim/private-sleuth--scryer/mechanic.scryer
# authoring_status: AUTHORED
# authoring_progress: 4 authored scenarios derived from the printed sentence and the adopted
#   2026-11-18 ruling (docs/decisions/design-rulings.md, Conformance triage decisions, second
#   batch: "Scryer rerolls only the Sleuth's own close-combat dice").  The earlier PARTIAL note
#   cited a retired register record and the then-open T13-Q104 boundary; that ruling resolves
#   the boundary, adopting the narrow reading: each of the Sleuth's own close-combat rolls may
#   be re-rolled at most once, the second result stands, no resource is spent, the opponent's
#   dice are never touched, and the exploration re-roll is outside the duel.  REVIEWED still
#   requires manual semantic review and execution_status stays UNEXECUTED.
# execution_status: UNEXECUTED (this scaffold has no behavioral result)
#
# Derive inputs and expectations from rule text and accepted rulings.
# Do not derive them from the engine or execute combat during authoring.
# REVIEWED requires semantic review; covers labels alone are insufficient.
# Preserve audit_id when filling this file.
# Governing rulings: docs/decisions/design-rulings.md
#
# AUTHORED: 4 scenarios cover the printed "A Sleuth can re-roll any rolls in close combat (the
#   second result must be accepted)": a missed To Hit die re-rolled into a hit, a re-roll whose
#   worse second result stands (and is offered no second re-roll), a declined re-roll that keeps
#   the miss, and the opponent's dice receiving no scryer decision at all.  The bearer is the
#   printed Private Sleuth profile of this band (grant: profile, so nothing is selected); the
#   build and the request-key grammar copy the authored Hypnotist sibling
#   (mordheim--watchmen-mim--private-sleuth--hypnotist--mechanic.hypnotist--0e3418d17278.yaml),
#   whose scenarios already decline scryer decisions on the Sleuth's own dice.  The profile also
#   prints Hypnotist, so every scenario declines that sibling declaration
#   (round.0.second.hypnotist: false), with the rule named here as the README prescribes.

# --- Authored scenarios ---
# The Sleuth (WS3, like her hand-built opponent) misses on a 2 against the 4+ target; the
# printed re-roll is taken (decision round.0.second.attack.0.hit.scryer) and the second die of 4
# hits, so her To Wound die is then requested.  That wound die receives its own scryer offer -
# the rule is a per-roll choice, not a spent resource - which is declined, and the 1 wounds
# nothing under any Strength.
- audit_id: rule/mordheim/watchmen-mim/private-sleuth--scryer/mechanic.scryer
  id: a-missed-hit-is-rerolled-and-the-second-result-hits
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 6}
    second:
      collection: mordheim
      band_id: watchmen-mim
      profile_id: private-sleuth
  initial_state: {second: {attacks: 1}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.second.hypnotist, value: false}            # the profile's sibling rule, declined
    - {key: round.0.second.attack.0.hit.scryer, value: true}
    - {key: round.0.second.attack.0.wound.scryer, value: false}
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 2}
    - {key: round.0.second.attack.0.hit.scryer.reroll, value: 4}
    - {key: round.0.second.attack.0.wound, value: 1}
  expect_rounds:
    0: {attacks.0.hit: false, attacks.1.hit: true, attacks.1.wounded: false, state.first.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The printed "the second result must be accepted": a 5 that already hits is re-rolled into a 2
# and the miss stands.  A roll already re-rolled is never offered scryer again (its key carries
# .scryer.reroll), so the strict tape's complete consumption also proves no second re-roll was
# requested, and no To Wound die follows the standing miss.
- audit_id: rule/mordheim/watchmen-mim/private-sleuth--scryer/mechanic.scryer
  id: a-worse-second-result-stands
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 6}
    second:
      collection: mordheim
      band_id: watchmen-mim
      profile_id: private-sleuth
  initial_state: {second: {attacks: 1}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.second.hypnotist, value: false}
    - {key: round.0.second.attack.0.hit.scryer, value: true}
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 5}
    - {key: round.0.second.attack.0.hit.scryer.reroll, value: 2}
  expect_rounds:
    0: {attacks.0.hit: false, attacks.1.hit: false, state.first.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The printed "can re-roll" is the Sleuth's option: declining it keeps the missed 2 and requests
# no re-roll die.
- audit_id: rule/mordheim/watchmen-mim/private-sleuth--scryer/mechanic.scryer
  id: a-declined-reroll-keeps-the-miss
  fighters:
