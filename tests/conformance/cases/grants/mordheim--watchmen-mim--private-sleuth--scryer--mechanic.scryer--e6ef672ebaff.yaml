  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The adopted boundary: only the Sleuth's OWN dice are eligible (modular/contexts.py reads the
# roller's effects).  The Sleuth is silenced and the opponent rolls its hit and its failed
# wound; the tape declares no .scryer decision anywhere, and the runner's complete consumption
# of strict scripts makes that absence assertive - had the engine offered the Sleuth a re-roll
# of an enemy die, the undeclared decision request would fail the scenario.
- audit_id: rule/mordheim/watchmen-mim/private-sleuth--scryer/mechanic.scryer
  id: the-opponents-dice-offer-no-scryer-decision
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 6}
    second:
      collection: mordheim
      band_id: watchmen-mim
      profile_id: private-sleuth
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.second.hypnotist, value: false}
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 1}
  expect_rounds:
    0: {attacks.0.hit: true, attacks.0.wounded: false}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
