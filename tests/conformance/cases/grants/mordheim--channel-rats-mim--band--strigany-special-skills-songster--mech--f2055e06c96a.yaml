# AUTHORED[songster]: 4 scenarios read the printed "Any friendly model within 6" of the Hero may re-roll
#   any failed Leadership test with a +1 to Leadership" (Strigany Special Skills / Songster; the same
#   sentence as the sea-ghosts Minstrels Songster, but that sibling supplies the reroll through
#   mechanic.leadership-reroll on the beneficiary and asserts neither the +1 nor the radius, so its shape
#   is not reused).  Here the Songster is the band's own Tinker credited with this row through
#   special_rule_ids and supplied as a nearby same-side participant at a declared distance; the
#   beneficiary is a printed Gypsy (Ld 7) charged by a fear-causer, so the tested Leadership is its Fear
