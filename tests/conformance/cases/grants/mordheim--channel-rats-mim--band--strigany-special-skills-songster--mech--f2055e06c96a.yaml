# --- Authored scenarios ---
# Derived from the printed sentence; no engine output was consulted.  Both fighters attack once (a mace
# and the Gypsy's axe) and every declared attack die is a natural one, a miss, so the Fear test and its reroll are the
# whole of the evidence.

- audit_id: rule/mordheim/channel-rats-mim/band--strigany-special-skills-songster/mechanic.songster
  id: the-reroll-at-plus-one-leadership-passes
  covers: [songster]
  fighters:
    first: &songster-fear-charger
      main_weapon_id: weapon.mace
      trait_overrides: {causes_fear: true}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 7}
    second: &songster-gypsy
      collection: mordheim
      band_id: channel-rats-mim
      profile_id: gypsies
      main_weapon_id: weapon.axe
  duel_context: &songster-near
    first_id: first
    second_id: second
    charging: [first]
    active_participant: first
    distances: [[second, songster, 4]]
    nearby:
      - participant_id: songster
        side_id: second
        condition: standing
        fighter: &songster-tinker
          collection: mordheim
          band_id: channel-rats-mim
          profile_id: tinker
          special_rule_ids: [band--strigany-special-skills-songster]
  maximum_rounds: 1
  decisions:
    - {key: round.0.second.fear.charged.reroll, value: true}
  rolls:
    - {key: round.0.second.fear.charged.0, value: 4}
    - {key: round.0.second.fear.charged.1, value: 4}
    - {key: round.0.second.fear.charged.reroll.0, value: 4}
    - {key: round.0.second.fear.charged.reroll.1, value: 4}
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.fear_hit_sixes: false}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

