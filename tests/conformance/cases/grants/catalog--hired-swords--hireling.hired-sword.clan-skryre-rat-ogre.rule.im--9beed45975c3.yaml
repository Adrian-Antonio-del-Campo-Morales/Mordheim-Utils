# --- Authored scenarios ---
# Poison-immunity family model (the authored call-of-the-night-haint-mim revenants file of this
# directory): Nightshade is the one admitted poison whose consequence is a state change on the
# warrior it wounds (one unsaved wound lowers Initiative by one, carried as the lasting
# initiative_penalty field), so it is the rider the printed immunity must suppress: the coated mace
# wounds the bearer as any mace would, and the penalty never lands.  The recipient is the printed
# Rat Ogre profile compiled through the hireling route (hirelings.hired-sword.1b /
# hireling.hired-sword.clan-skryre-rat-ogre) with the fixture facts (WS3 S3 T3 W2 I5 A1); its
# printed Leadership 10 stays and its innate natural attacks are silenced (attacks: 0).  The
# opponent is the hand-built standard (WS3 S3 T3 W3 I2 A1 Ld7) with a Nightshade-coated mace.  No
# charge is declared, so neither the Rat Ogre's own Fear nor its psychology immunity requests a die.
# The control is the grade-1b Bard, the same wound with the rider landing.  The refusal selects the
# printed rule on that control through special_rule_ids.

# The coated mace wounds the Rat Ogre: WS3 v WS3 hits on 4+, S3 v the fixture T3 wounds on 4+ (a
# non-six, so no critical), and the innate 4+ bio-armour save (defence.bio-armour, unmodified by
# S3) is declared failing on a 2.  The wound is taken as any wound would be (fixture wounds
# 2 -> 1, no injury roll) and the poisoned-wound Initiative penalty is suppressed:
# initiative_penalty stays 0.
