# Printed text (shared-rule.mutations-blackblood through special-rules.yaml, Blackblood): "If the
# model loses a wound in close combat, anyone in base contact with the model suffers a Strength 3
# hit (no critical hits)."  The binding is trait.acid-blood (value true), read by
# modular/aftermath.py ~64-80: each close-combat wound the bearer loses answers with an automatic,
# unparriable Strength 3 hit on the attacker, tagged effect.no-critical, resolved as a hit (ruling
# "Fire and other synthetic hits are hits": the attacker keeps its real defences; the attacker here
# is unarmoured, so the reaction asks only its wound die round.<i>.<attacker>.attack.<n>.acid-blood.<k>.wound).
# The model follows the Cult of the Possessed twin (...0dff9f669885): the bearer is the band's
# Buccaneer (a printed Hero) selecting the mutation through special_rule_ids (one mutation per Hero
# under Aquatic Mutants), carrying a club from the heroes' list and the fixture facts (WS3 S3 T3 W3
# I2 A1) so the dice math is fixed; the attacker is hand-built (mace, WS3 S3 T3 I5 A1) at three
# Wounds, or four where the critical boundary is pinned.  The bearer's own swing is a natural one.
# The control is the same Buccaneer without the mutation; the refusal is a Wrecker (Henchman).

# An unsaved close-combat wound on the bearer answers with the printed Strength 3 hit: its four
# wounds the Toughness 3 attacker and costs it one Wound.
- audit_id: rule/mordheim/shallows-beasts-mim/band--mutations-blackblood/trait.acid-blood
  id: an-unsaved-wound-on-the-mutated-hero-answers-with-the-printed-strength-three-hit
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 5, attacks: 1}
    second:
      collection: mordheim
      band_id: shallows-beasts-mim
      profile_id: buccaneer
      special_rule_ids: [band--mutations-blackblood]
      main_weapon_id: weapon.club
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.acid-blood.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 1, state.first.wounds: 2, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

