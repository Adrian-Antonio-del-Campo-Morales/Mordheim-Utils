# The printed "(no critical hits)": the core critical rule makes a natural six on a wound roll a
# critical wound when the required target is below six; this Strength 3 hit against Toughness 3
# needs a four, so the reaction's six is the candidate.  The attacker stands at four Wounds: a
# critical's two damage would leave it on two, the printed denial leaves it on three.
- audit_id: rule/mordheim/shallows-beasts-mim/band--mutations-blackblood/trait.acid-blood
  id: the-reactive-hit-is-no-critical-even-on-a-natural-six
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 4, initiative: 5, attacks: 1}
    second:
      collection: mordheim
      band_id: shallows-beasts-mim
      profile_id: buccaneer
      special_rule_ids: [band--mutations-blackblood]
      main_weapon_id: weapon.club
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.acid-blood.0.wound, value: 6}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 1, state.first.wounds: 3, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

