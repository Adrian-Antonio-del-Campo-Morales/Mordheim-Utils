# --- Authored scenarios ---

# The declared token 'crossbow' is enforced over the build loadout, not over a carried kit: the shared stage
# keeps the interpreted token and runs equipmentIssue over the build's own weapon/armour/defence slots, whose
# forbids loop prints `"crossbow" is forbidden for <band>/<profile>.`  No carried-item input is needed, which
# is why the earlier 'no build can carry it' note was wrong.

- audit_id: rule/mordheim/outlaws-of-stirwood-forest/band--bow-discipline/profile.equipment-restrictions
  id: a-crossbow-is-refused-for-an-outlaw
  fighters:
    first:
      collection: mordheim
      band_id: outlaws-of-stirwood-forest
      profile_id: outlaws
      owned_item_ids: [crossbow]
  expect_error: '"crossbow" is not on any equipment list of outlaws-of-stirwood-forest/outlaws.'

- audit_id: rule/mordheim/outlaws-of-stirwood-forest/band--bow-discipline/profile.equipment-restrictions
  id: a-crossbow-is-refused-for-a-bandit-leader
  fighters:
    first:
      collection: mordheim
      band_id: outlaws-of-stirwood-forest
      profile_id: bandit-leader
      owned_item_ids: [crossbow]
  expect_error: '"crossbow" is not on any equipment list of outlaws-of-stirwood-forest/bandit-leader.'

