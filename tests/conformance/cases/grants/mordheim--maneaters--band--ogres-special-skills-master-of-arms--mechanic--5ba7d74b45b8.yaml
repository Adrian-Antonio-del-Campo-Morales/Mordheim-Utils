# --- Authored scenarios ---
# Derived from the printed rule and the shared construction diagnostic; no engine output was
# consulted.  The refusal is the restriction the printed rule relaxes: without the contract a main
# weapon that occupies both hands is rejected, which is what the authored half witnesses here.
- audit_id: rule/mordheim/maneaters/band--ogres-special-skills-master-of-arms/mechanic.master-of-arms
  id: a-two-handed-main-weapon-is-refused-without-the-contract
  fighters:
    first:
      main_weapon_id: weapon.double-handed-weapon
      off_hand_id: weapon.dagger
      off_hand_id: weapon.dagger
      off_hand_id: weapon.dagger
      characteristics: {weapon_skill: 3, strength: 4, toughness: 4, wounds: 2, initiative: 3, attacks: 2}
  expect_error: main weapon occupies both hands

# Real recipient: the printed admission half. The Maneaters Captain selects Master of Arms and carries
# a Morning Star (on his equipment list; Difficult to Use by the 2026-11-19 ruling) with a club in the
# other hand - "a Difficult to Use weapon and a hand weapon at the same time". The build must construct;
# the bearer starts out of action so no die is needed. Restored 2026-11-19 unchanged from its 2026-11-16
# authoring (it was briefly retired under the 2026-11-18 reading that the Morning Star is only Heavy).
- audit_id: rule/mordheim/maneaters/band--ogres-special-skills-master-of-arms/mechanic.master-of-arms
  id: a-master-of-arms-captain-wields-a-morning-star-and-a-hand-weapon
  fighters:
    first:
      collection: mordheim
      band_id: maneaters
      profile_id: captain
      special_rule_ids: [band--ogres-special-skills-master-of-arms]
      main_weapon_id: weapon.morning-star
      off_hand_id: weapon.club
    second: {main_weapon_id: weapon.mace}
  duel_context:
    charging: []
    active_participant: first
  initial_state:
    first: {condition: OUT}
  expect_fighters: {first.main_weapon.tags.0: weapon.morning-star, first.off_hand.tags.0: weapon.club}
  expect_final: {rounds_executed: 0, termination_reason: first_out}

# Contrast: without the skill the same Captain may not pair the Morning Star with a second weapon.
- audit_id: rule/mordheim/maneaters/band--ogres-special-skills-master-of-arms/mechanic.master-of-arms
  id: without-master-of-arms-the-morning-star-takes-no-second-weapon
  fighters:
    first:
      collection: mordheim
      band_id: maneaters
      profile_id: captain
      main_weapon_id: weapon.morning-star
      off_hand_id: weapon.club
  expect_error: "weapon.morning-star cannot be combined with weapon.club"

# Ruling 2026-11-19: the relaxation applies only to a Difficult to Use weapon. A great weapon is not one,
# so the skill does not free its second hand.
- audit_id: rule/mordheim/maneaters/band--ogres-special-skills-master-of-arms/mechanic.master-of-arms
  id: master-of-arms-does-not-free-a-great-weapons-second-hand
  fighters:
    first:
      collection: mordheim
      band_id: maneaters
      profile_id: captain
      special_rule_ids: [band--ogres-special-skills-master-of-arms]
      main_weapon_id: weapon.double-handed-weapon
      off_hand_id: weapon.sword
  expect_error: main weapon occupies both hands
