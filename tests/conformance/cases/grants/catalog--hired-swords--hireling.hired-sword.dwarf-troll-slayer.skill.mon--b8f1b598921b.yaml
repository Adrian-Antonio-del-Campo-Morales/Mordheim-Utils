    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 2, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: *slayer-charges
  maximum_rounds: 1
  rolls:
