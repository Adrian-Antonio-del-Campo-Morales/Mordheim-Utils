# Hireling family model (README, Hireling recipients): the recipient is the printed Gaoler compiled through
# the hireling route (hirelings.hired-sword.1b / hireling.hired-sword.gaoler), its printed rule granted by
# the profile itself; fixture characteristics WS3 S3 T3 W2 I5 A1 (printed Ld7 stays); the omitted main
# weapon is the printed kit's default (the heavy chain, a flail).  The victim is hand-built (WS3 S3 T3 W3
# I2 A1 Ld7, mace) plus the one fact a clause reads.  Printed text: "May replace all normal attacks with
# one grapple hit dealing no damage. Target must roll strictly under Strength with -1 penalty; failure
# prevents all actions. Repeat the escape test at the beginning of the next melee phase; on success the
# target acts while still engaged. Holder can only hold. Dead, pain-immune, Undead, Daemon and Large
# targets are immune."  Arithmetic: the grapple hit needs 4+ (WS3 vs WS3); an S3 victim escapes only on a
# 1 (strictly under 2).  The control is the grade-1b Bard, which is never offered the grapple decision.

# The Gaoler charges, declares the grapple, hits on a 4; the victim's 2 fails the escape test and it is held
# with no damage and no action of its own.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.gaoler.rule.torturer-s-grapple/mechanic.gaoler-grapple
  id: the-gaolers-declared-grapple-holds-a-victim-that-fails-its-escape-test
  fighters:
    first:
      &recipient
      collection: mordheim
      band_id: hirelings.hired-sword.1b
      profile_id: hireling.hired-sword.gaoler
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      &victim
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.torturer-grapple, value: true}
  rolls:
    - {key: round.0.first.grapple.hit, value: 4}
    - {key: round.0.first.grapple.strength, value: 2}
  expect_rounds:
    0: {attacks.0.hit: True, attacks.0.damage: 0, state.second.wounds: 3,
        state.second.grappled: True, state.first.grappling: True, state.second.condition: STANDING}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# A 1 is strictly under S-1: the victim escapes at once and strikes back in the same phase.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.gaoler.rule.torturer-s-grapple/mechanic.gaoler-grapple
  id: the-victim-escapes-the-gaolers-grapple-on-a-roll-strictly-under-strength-minus-one
  fighters:
    first:
      <<: *recipient
    second:
      <<: *victim
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.torturer-grapple, value: true}
  rolls:
    - {key: round.0.first.grapple.hit, value: 4}
    - {key: round.0.first.grapple.strength, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: True, attacks.0.damage: 0, state.second.grappled: False, state.first.grappling: False,
        attacks.1.hit: False}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The escape test is repeated at the beginning of the next phase; freed, the victim acts while still
# engaged and the Gaoler (offered the grapple again, declining) swings his chain.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.gaoler.rule.torturer-s-grapple/mechanic.gaoler-grapple
  id: the-held-victim-escapes-at-the-start-of-the-next-phase-and-acts
  fighters:
    first:
      <<: *recipient
    second:
      <<: *victim
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 2
  decisions:
    - {key: round.0.first.torturer-grapple, value: true}
    - {key: round.1.first.torturer-grapple, value: false}
  rolls:
    - {key: round.0.first.grapple.hit, value: 4}
    - {key: round.0.first.grapple.strength, value: 2}
    - {key: round.1.second.grapple-escape, value: 1}
    - {key: round.1.first.attack.0.hit, value: 1}
    - {key: round.1.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.grappled: True, state.first.grappling: True}
    1: {state.second.grappled: False, state.first.grappling: False, state.first.wounds: 2, state.second.wounds: 3}
  expect_final: {rounds_executed: 2, termination_reason: horizon}

# Failing the repeated test keeps the victim held; the holder can only hold, so nothing else is requested.
