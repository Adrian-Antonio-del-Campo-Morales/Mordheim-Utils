  id: the-victim-failing-the-repeated-test-stays-held-while-the-gaoler-only-holds
  fighters:
    first:
      <<: *recipient
    second:
      <<: *victim
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 2
  decisions:
    - {key: round.0.first.torturer-grapple, value: true}
  rolls:
    - {key: round.0.first.grapple.hit, value: 4}
    - {key: round.0.first.grapple.strength, value: 2}
    - {key: round.1.second.grapple-escape, value: 2}
  expect_rounds:
    0: {state.second.grappled: True, state.first.grappling: True}
    1: {state.second.grappled: True, state.first.grappling: True, state.first.wounds: 2, state.second.wounds: 3}
  expect_final: {rounds_executed: 2, termination_reason: horizon}

