# authoring_progress: the admitted whole clause carries 7 authored scenarios (4 added 2026-11-16 for the Possessed branch, see AUTHORED) derived from the printed
#   rule and the recorded contract: a single-handed weapon in the extra arm adds one attack die, a
#   shield in the extra arm adds none for the Mutant (adopted ruling 2026-11-10: only a Possessed gains
#   the extra natural attack), and the control - the same shield on a recipient of the same
#   mutation row WITHOUT Extra Arm, which also adds none.  REPAIR (closing pass): the control previously put
#   the shield in extra_hand_id on the-possessed, a build the shared stage must refuse twice over (an
#   extra hand requires Extra Arm or Tail Fighting, and that profile is offered no equipment at all), so
#   the control never demonstrated anything.  It now wears the shield the ordinary way (off_hand_id) on
#   a Mutant that carries a different mutation, which is what the mandatory-mutation clause requires, so
#   the Extra Arm row is the only difference; a hand-held defence may not be declared in defence_ids.  REVIEWED still requires manual
#   semantic review and execution_status stays UNEXECUTED.
