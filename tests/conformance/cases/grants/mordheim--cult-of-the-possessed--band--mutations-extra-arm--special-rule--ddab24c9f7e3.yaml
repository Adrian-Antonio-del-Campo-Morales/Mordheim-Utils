#
# Derive inputs and expectations from rule text and accepted rulings.
# Do not derive them from the engine or execute combat during authoring.
# REVIEWED requires semantic review; covers labels alone are insufficient.
# Preserve audit_id when filling this file.
# Governing rulings: docs/decisions/design-rulings.md
#
# AUTHORED: 7 scenarios evidence the printed alternative - the weapon arm and the shield arm -
#   and their non-regression control (a control by design: it passes with or without the rule),
#   plus (added 2026-11-16) the Possessed branch of the 2026-11-10 ruling: an empty extra arm and a
#   shield each give the Possessed exactly one extra natural attack, a weapon in its extra arm is
#   refused, and the same Possessed without the mutation keeps two attacks.  The weapon case puts one extra attack die in the bearer's own
#   pool; the shield case, under the adopted ruling (2026-11-10), adds none for the Mutant, and the
#   control shows the same shield worn the ordinary way, with a different mutation, also resolves
#   exactly one attack.
#   Reviewer note on the control's recipient: the printed clause names "the mutant", and the band's
#   mandate is that a Mutant carries at least one mutation, so the control keeps a mutation that cannot
#   fire in this scenario (Blackblood fires only when the bearer loses a wound, and the opponent declares
#   no attacks) instead of removing the row and producing a build the mandate must refuse.  REVIEWED
#   still requires manual semantic review.

# --- Authored scenarios ---
# Derived from the printed rule and the recorded contract; no engine output was consulted.  The
# recipient is the band's printed Mutant (whose mandatory-mutation clause the same row satisfies) and
# the victim is hand-built at Toughness 2 with three wounds and no attacks of its own, so each
# declared attack die is isolated.  The Strength 3 wound faces are the printed table's three.

- audit_id: rule/mordheim/cult-of-the-possessed/band--mutations-extra-arm/special-rule.band--mutations-extra-arm
  id: a-single-handed-weapon-in-the-extra-arm-adds-one-attack
  fighters:
    first:
      collection: mordheim
      band_id: cult-of-the-possessed
      profile_id: mutants
      special_rule_ids: [band--mutations-extra-arm]
      main_weapon_id: weapon.mace
      extra_hand_id: weapon.sword
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 2, wounds: 3, initiative: 2, attacks: 1}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.first.attack.1.hit, value: 4}
    - {key: round.0.first.attack.1.wound, value: 3}
  expect_rounds:
    0: {state.second.wounds: 2, state.second.condition: STANDING}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

