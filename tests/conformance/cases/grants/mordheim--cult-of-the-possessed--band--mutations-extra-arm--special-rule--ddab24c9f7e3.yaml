# Added 2026-11-16: the Possessed branch of the adopted ruling "A Possessed with Extra Arm always
# gains one additional natural attack. It applies with an empty extra hand, shield or buckler,
# without double counting; the Possessed cannot carry a weapon" (docs/decisions/design-rulings.md,
# 2026-11-10).  The recipient is the band's printed Possessed (WS4 S4 T4 W2 I4 A2, which "never use
# weapons or armour") at its printed profile; nobody charges, so no Fear test arises from its printed
# Fear, and the hand-built victim makes no attacks.  Every hit die is a natural 1, so the number of
# declared hit dice is the observable: two printed Attacks plus the one natural attack the mutation
# grants.

# With the extra arm empty the Possessed makes three attacks, one more than its printed two.
- audit_id: rule/mordheim/cult-of-the-possessed/band--mutations-extra-arm/special-rule.band--mutations-extra-arm
  id: the-possessed-with-an-empty-extra-arm-gains-one-natural-attack
  fighters:
    first:
      collection: mordheim
      band_id: cult-of-the-possessed
      profile_id: the-possessed
      special_rule_ids: [band--mutations-extra-arm]
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 2, wounds: 3, initiative: 2, attacks: 1}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.first.attack.1.hit, value: 1}
    - {key: round.0.first.attack.2.hit, value: 1}
  expect_rounds:
    0: {attacks.2.hit: false, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

