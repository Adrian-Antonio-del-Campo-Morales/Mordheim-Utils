# --- Authored scenarios ---
# Fixture arithmetic: the attacker is a hand-built WS3 mace fixture; the Andanti keeps his printed
# Weapon Skill 4 in the fixture characteristics, so the attacker hits on 4+ and the parry succeeds
# on a die of 1-3 (under 4).  The Andanti's own swings (two with the paired blades, one with the
# sword) are scripted misses; W2 keeps the landed blows short of an injury roll.

# The printed inversion on the real bearer: a natural 6, which the ordinary rules could never parry
# at all, is blocked by a die of 3 rolled under his Weapon Skill 4.
- audit_id: rule/mordheim/dreamwalkers-cult-of-morr-fbg/andanti--estalian-tecnique/mechanic.estalian-technique
  id: the-andanti-parries-a-natural-six-by-rolling-under-his-weapon-skill
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      collection: mordheim
      band_id: dreamwalkers-cult-of-morr-fbg
      profile_id: andanti
      main_weapon_id: weapon.rapier
      off_hand_id: weapon.main-gauche
      characteristics: {weapon_skill: 4, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 6}
    - {key: round.0.first.attack.0.parry, value: 3}
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.0.second.attack.1.hit, value: 1}
  expect_rounds:
    0: {attacks.0.parried: True, attacks.0.wounded: False, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

