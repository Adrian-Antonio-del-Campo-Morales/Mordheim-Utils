# --- Authored scenarios ---
# Hireling family model (P0, 2026-11-17), mirroring the authored Ogre Bodyguard fear file of this
# directory.  The recipient is the printed Rat Ogre profile compiled through the hireling route
# (hirelings.hired-sword.1b / hireling.hired-sword.clan-skryre-rat-ogre); its printed Fear is a
# profile grant, so the build selects nothing.  Its physical characteristics are supplied as fixture
# facts (WS3 S3 T3 W2 I5 A1) so every die threshold is fixed, while its printed Leadership 10 stays;
# its innate natural attacks are silenced (attacks: 0) in every scenario, and no declared opponent
# blow ever lands, so its innate 4+ bio-armour save (defence.bio-armour) requests no die.
# The opponent is hand-built (WS3 S3 T3 W3 I2 A1 Ld7, mace).  The control is a plain hireling
# without any psychology rule - the grade-1b Bard - compiled through the same route with the same
# fixture, so the request the rule adds is shown absent without it.  The refusal selects the printed
# rule on that control through special_rule_ids: a profile-granted rule is not available elsewhere.
# Dice: a 2D6 Fear test of 5+4 fails Ld7 and 3+3 passes it.

# The recipient charges; the charged opponent takes the Fear test (2D6 vs Ld7).  9 fails: its roll
# of 4, which would hit WS3 on 4+, now needs a 6 and misses.  The recipient contributes no strike.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.clan-skryre-rat-ogre.rule.fear/mechanic.causes-fear
  id: an-opponent-charged-by-the-rat-ogre-that-fails-its-fear-test-hits-only-on-sixes
  fighters:
    first:
      &recipient
      collection: mordheim
      band_id: hirelings.hired-sword.1b
      profile_id: hireling.hired-sword.clan-skryre-rat-ogre
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  initial_state: {first: {attacks: 0}}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.fear.charged.0, value: 5}
    - {key: round.0.second.fear.charged.1, value: 4}
    - {key: round.0.second.attack.0.hit, value: 4}
  expect_rounds:
    0: {state.second.fear_hit_sixes: True, attacks.0.hit_target: 6, attacks.0.hit: false, state.first.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# 6 passes Ld7: the opponent keeps its ordinary 4+ to hit (its natural 1 misses on its own).
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.clan-skryre-rat-ogre.rule.fear/mechanic.causes-fear
  id: an-opponent-charged-by-the-rat-ogre-that-passes-its-fear-test-fights-normally
  fighters:
    first:
      <<: *recipient
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  initial_state: {first: {attacks: 0}}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.fear.charged.0, value: 3}
    - {key: round.0.second.fear.charged.1, value: 3}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.fear_hit_sixes: False, attacks.0.hit_target: 4, state.first.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# Charging a Fear-causer also needs the test: a failed charge test cancels the charge and no blow
# is struck.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.clan-skryre-rat-ogre.rule.fear/mechanic.causes-fear
  id: an-opponent-charging-the-rat-ogre-that-fails-its-fear-test-is-halted
  fighters:
    first:
      <<: *recipient
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  initial_state: {first: {attacks: 0}}
  duel_context: {charging: [second], active_participant: second}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.fear.charge.0, value: 5}
    - {key: round.0.second.fear.charge.1, value: 4}
  expect_rounds:
    0: {state.first.condition: STANDING, state.second.condition: STANDING}
  expect_final: {rounds_executed: 1, termination_reason: disengaged}

