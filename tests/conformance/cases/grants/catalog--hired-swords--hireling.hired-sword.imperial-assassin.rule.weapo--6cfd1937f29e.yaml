# Semantic wrinkle (2026-11-18): the Assassin's binding is the unscoped compiler.weapon-knowledge, which
#   the resolver reads on its ordinary kit-matching path: an active weapon the training allows is
#   skipped by the matcher while *supplied* ownership must still equal the printed kit, so a build that
