# Printed text (grade-1b.yaml, Djinn's Curse): "At own Recovery may choose one power until next own
# Recovery, never the same power on consecutive turns. Curse imposes -1 to all enemy hit rolls and
# saves within 4 inches."  Both of Khar-Mel's powers bind the one mechanic mechanic.djinns-curse:
# it is the power choice itself (a Djinn declares at most one power per own turn), consumed by
# modular/rounds.py ~613-626 (decision round.<i>.<side>.djinn-power.curse, then .luck only when
# the curse was declined; a power equal to the previous own-turn choice is not offered; the chosen
# power projects condition.djinns-<power>-active on the Djinn until its next own Recovery).  The
# Curse condition is read by modular/contexts.py ~523 (-1 to hit for melee attacks against the
# Djinn), ~841 (incoming_save_modifier +1 on the enemy's armour target, phases.py armour_target,
# which an expressly unmodifiable natural save ignores) and ~698-699 (+1 on the enemy's ward and
# regeneration thresholds).  Governing ruling: "Djinn's Curse respects expressly unmodifiable saves"
# (2026-10-15): ordinary armour, wards and regeneration are worsened; Daemonic Flesh's unmodified
# 5+, Marks of Ranald's 6+, Ethereal's interception and the Djinn's intrinsic 5+ keep their faces.
# Hireling family model: the recipient is the printed Khar-Mel compiled through the hireling route
# (hirelings.dramatis-personae.1b / hireling.dramatis.khar-mel-the-djinn) with the fixture facts
# (WS3 S3 T3 W2 I5 A1; the printed Ld8 stays); his kit sword is the omitted default.  The power is
# chosen at the Djinn's own Recovery, so the Djinn is the active charger (first) and the charged
# opponent tests Fear (3+3 passes Ld7).  The opponent is hand-built (mace, WS3 S3 T3 W3 I2 A1 Ld7)
# wearing heavy armour (an ordinary 5+) where a save is at stake.  Every opponent swing at the
# Djinn is declared to miss (a 4 under the curse's 5+, a 1 otherwise) so the sword's parry window
# never opens; attacks.<n>.hit_target records the target even on a miss.  Wound dice are fours.
# Semantic wrinkle (2026-11-18): the ruling's "Curse still worsens Djinn's Luck" composition needs a
#   second Djinn cursing the first and is unreachable in a two-fighter duel; the printed 4-inch
#   radius and shooting producers are excluded by the record.  The Ethereal interception (4+) is
#   read from the defender's own threshold with no incoming modifier, so it is unaffected; that face
#   is not separately asserted here.

# Curse chosen: the opponent's ordinary 5+ needs a six, so its five fails; its own swing at the
# Djinn needs a five, so its four misses.
