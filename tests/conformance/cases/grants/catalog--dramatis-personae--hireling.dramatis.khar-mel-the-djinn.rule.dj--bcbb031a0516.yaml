# The ruling's exception: the Chaos Fury's Daemonic Flesh is an expressly unmodifiable 5+, so the
# curse leaves it at 5+ and its five holds.  The Fury causes Fear (the charging Djinn tests, 3+3
# passes Ld8) and is itself immune to psychology, so it is asked nothing; it contributes no swing.
