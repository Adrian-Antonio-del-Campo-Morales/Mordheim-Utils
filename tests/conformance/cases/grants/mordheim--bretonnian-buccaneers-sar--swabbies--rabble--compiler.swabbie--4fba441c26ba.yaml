# --- Authored scenarios ---
# Source: Human Pirates (broheim.net), p.5, Henchmen / 0-5 Swabbies / Rabble.  The Rabble rule binds the Swabbies to the Swabbie Equipment List and nothing
# else; the KB declares it on the profile (profiles.yaml, id swabbies: equipment_lists
# [swabbie-equipment-list]) and publishes both lists' rows in equipment-access.yaml.  INPUT: the fixture's
# carried-item channel (owned_item_ids), the channel the Lustria model and the hireling kit refusals use.
# REFUSAL: a Swabbie carrying crossbow - a row the band's Pirate Equipment List offers and its
# Swabbie Equipment List does not - is refused at construction with the shared stage's per-item offered-set
# sentence.  ADMISSION: the same profile carrying bow, a row only the Swabbie Equipment List offers,
# compiles with the band's compiler contracts visible as construction_tags (the sorted list of every
# compiler binding the profile receives: the band-wide General Pirate Rules access and the Rabble contract).  The admission uses the corpus's construction-only
# shape (no charge, the bearer out of action before the first phase, so the duel requests no die) with
# the README's hand-built opponent.  No engine output was consulted.

- audit_id: rule/mordheim/bretonnian-buccaneers-sar/swabbies--rabble/compiler.swabbie-rabble-loadout
  id: a-pirate-list-row-is-refused-for-a-swabbie
  # crossbow sits on this band's Pirate Equipment List and is absent from the Swabbie Equipment List, the recipient's
  # only list.  The declared fragment is the stage's own per-item access sentence.
  fighters:
    first:
      collection: mordheim
      band_id: bretonnian-buccaneers-sar
      profile_id: swabbies
      owned_item_ids: [crossbow]
  expect_error: '"crossbow" is not on any equipment list of bretonnian-buccaneers-sar/swabbies.'

- audit_id: rule/mordheim/bretonnian-buccaneers-sar/swabbies--rabble/compiler.swabbie-rabble-loadout
  id: the-swabbie-list-row-is-admitted-at-construction
  # bow is the row only the Swabbie Equipment List offers, so carrying it is what the printed sentence
  # permits; the profile compiles and the Rabble contract is visible on the compiled build.
  fighters:
    first:
      collection: mordheim
      band_id: bretonnian-buccaneers-sar
      profile_id: swabbies
      owned_item_ids: [bow]
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [], active_participant: first}
  initial_state: {first: {condition: OUT}}
  expect_fighters:
    first.construction_tags: [compiler.pirate-human-mercenary-equipment-access, compiler.swabbie-rabble-loadout]
