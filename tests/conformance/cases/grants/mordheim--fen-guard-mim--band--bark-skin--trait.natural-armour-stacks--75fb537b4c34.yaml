# The non-stacking control: a natural 6+ without the stacking trait and the same shield keep the
# better of two 6+ layers, so the five is a wound where the Spiteborn's held.
- audit_id: rule/mordheim/fen-guard-mim/band--bark-skin/trait.natural-armour-stacks
  id: a-non-stacking-natural-six-plus-and-a-shield-do-not-add
  fighters:
    first: *attacker
    second:
      main_weapon_id: weapon.mace
      off_hand_id: defence.shield
      trait_overrides: {natural_armour_save: 6}
