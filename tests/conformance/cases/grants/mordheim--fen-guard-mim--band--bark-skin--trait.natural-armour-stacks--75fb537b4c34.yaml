# --- Authored scenarios ---
# Printed text (fen-guard-mim/special-rules.yaml, Bark Skin): "Fen Guard have a 6+ armour save which
# can be stacked with regular armour; it cannot be modified beyond 6 by Strength (except by weapons
# with the Cutting Edge rule), a 'no save' result on the Critical Hit Charts negates it, and fire
# attacks ignore this rule."  This binding is the "stacked with regular armour" half
# (trait.natural-armour-stacks, parameters value true); the 6+ itself is the sibling
# trait.natural-armour-save (...c715ffc7df28, whose a-shield-stacks-with-the-bark-hide scenario is the
# same observable from the save's side), the cap the sibling trait.natural-armour-worst-save
# (...a5c3a6ff4699) and the fire negation trait.natural-armour-negated-by-fire (...94fb7e998708).
# Compiler: with natural_armour_stacks and a natural save of 6 or better the compiled armour_save
# loses 7-natural steps (compiler.py ~1442-1443: shield 6+ becomes 5+, nothing worn becomes 6+) and
# natural_armour_stacks is projected onto the CompiledFighter (~1490).  Engine: phases.py
# armour_target (~621-634) resolves min(armour, natural) and the die round.<i>.<attacker>.attack
# .<n>.armour is asked while the target is 6 or better.
# Family model (the sibling file): Bark Skin is the band's own grant, witnessed through the Spiteborn
# (printed entry without a rule of its own; T2, W2), sword in hand (a parry die follows every hit
# and is declared a one) and a shield from the dryad equipment list where the stacking is at stake.
# The attacker is a hand-built fixture (mace; Weapon Skill 10 and Initiative 10 are fixture facts) at
# Strength 3, which modifies no save; Strength 3 wounds Toughness 2 on 3+.  The duel is uncharged,
# the bearer contributes no attacks and the wound face stays below a natural six.  The non-stacking
# control is a hand-built fixture given a natural 6+ through trait_overrides without the stacking
# trait, carrying the same shield: two 6+ layers that do not add.

# Hide and shield: the compiled combined save is 5+ and the five holds.
- audit_id: rule/mordheim/fen-guard-mim/band--bark-skin/trait.natural-armour-stacks
  id: the-hide-and-a-shield-combine-into-a-five-plus-and-the-five-holds
  fighters:
    first:
      &attacker
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 10, strength: 3, toughness: 3, wounds: 3, initiative: 10, attacks: 1}
    second:
      &shielded-spiteborn
      collection: mordheim
      band_id: fen-guard-mim
      profile_id: spiteborn
      main_weapon_id: weapon.sword
      off_hand_id: defence.shield
  initial_state: {second: {wounds: 2, attacks: 0}}
  duel_context: &uncharged {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.parry, value: 1}
    - {key: round.0.first.attack.0.wound, value: 5}
    - {key: round.0.first.attack.0.armour, value: 5}
  expect_fighters:
    second.natural_armour_stacks: True
    second.natural_armour_save: 6
    second.armour_save: 5
  expect_rounds:
    0: {attacks.0.saved: true, state.second.wounds: 2, state.second.condition: STANDING}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

