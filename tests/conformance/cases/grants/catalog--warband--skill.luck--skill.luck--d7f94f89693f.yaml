# --- Authored scenarios ---
# The warband skill list prints the canonical luck wording; per the Luck ruling the
# resource re-rolls one failed roll of the bearer's own and is spent for the duel.
# The spent resource is the `luck` entry of the bearer's resources_spent set.
- audit_id: rule/catalog/warband/skill.luck/skill.luck
  id: a-missed-hit-is-rolled-again-and-the-resource-is-spent
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [skill.luck]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.first.attack.0.hit.reroll, value: 4}
    - {key: round.0.first.attack.0.wound, value: 5}
    - {key: round.0.second.attack.0.hit, value: 1}
  decisions:
    - {key: round.0.first.attack.0.hit.luck, value: true}
  expect_rounds:
    0: {attacks.0.hit: True, attacks.0.wounded: True, attacks.0.damage: 1, state.second.wounds: 1, state.first.resources_spent: [luck]}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
