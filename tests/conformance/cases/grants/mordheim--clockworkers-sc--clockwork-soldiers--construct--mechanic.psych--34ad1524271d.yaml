# Closing review (combined facet, mirrors of the canonical mechanic.* tapes): the construct mirror
#   carries the immunity beside Stupidity and Hatred and the frenzy flag, and the undeclared
#   psychology dice are the assertion.
- audit_id: rule/mordheim/clockworkers-sc/clockwork-soldiers--construct/mechanic.psychology-immunity
  id: the-immunity-skips-stupidity-suppresses-frenzy-and-denies-the-hatred-reroll
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.stupidity, mechanic.hatred-undead, mechanic.psychology-immunity, mechanic.mark-of-arkhar]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 6}
    second: {collection: mordheim, band_id: undead, profile_id: zombies}
  # The Frenzy is not supplied as a lasting override: the immunity is a printed suppression of
  # the ordinary Frenzy benefit, so the frenzy has to come from a real compiled producer
  # (mechanic.mark-of-arkhar, a passive effect-set carrying `frenzy: true`) and the immunity gate
  # is observed where it applies.  An override applied after initialization would bypass that
  # gate and test a state the printed immunity does not admit.
  expect_initial: {first.frenzy: False}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  # The immunity owes two observations: no Stupidity or Fear die is offered at all, and the
  # suppressed frenzy grants no second attack.  Only the one attack the Frenzy would double is
  # scripted; the strict script is consumed completely, so a doubled pool is a mismatch.
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 0, state.first.stupidity_failed: False}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The contrast: the same charger against the band's non-construct handymen, which carries no psychology immunity,
# does ask for the two-dice Fear test, declared here as a passing 1+1.
- audit_id: rule/mordheim/clockworkers-sc/clockwork-soldiers--construct/mechanic.psychology-immunity
  id: a-band-mate-without-the-immunity-is-tested
  fighters:
    first:
      trait_overrides: {causes_fear: true}
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 7, attacks: 1, leadership: 7}
    second: {collection: mordheim, band_id: clockworkers-sc, profile_id: handymen}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.fear.charged.0, value: 1}
    - {key: round.0.second.fear.charged.1, value: 1}
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.wounds: 1, state.second.condition: STANDING}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The printed immunity to Psychology, read through the round-0 Fear test of the charged warrior: the charger
# declares causes_fear, and the immune construct declares no Fear die at all, so the round holds only the
# charger's strike.  The bearer's own attack dice are suppressed, as the sibling poison tapes do for this profile.
- audit_id: rule/mordheim/clockworkers-sc/clockwork-soldiers--construct/mechanic.psychology-immunity
  id: the-charged-construct-is-not-tested-for-fear
  fighters:
    first:
      trait_overrides: {causes_fear: true}
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 7, attacks: 1, leadership: 7}
    second: {collection: mordheim, band_id: clockworkers-sc, profile_id: clockwork-soldiers}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  # No Fear die is offered to the immune construct. Its emptied pool still resolves one printed
  # unarmed attack, declared here as a miss so the observation stays the immunity.
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 0, state.second.wounds: 1, state.second.condition: STANDING}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
