#
# AUTHORED: 5 scenarios cover the charging reroll of a failed To Hit roll with a normal sword,
#   the refusal for a great sword (which carries no sword tag) and the refusal for any other weapon,
#   where the failed charged hit stands and no second die is requested.  REVIEWED still requires manual
#   semantic review.

# --- Authored scenarios ---
# Derived from the printed rule and the recorded contract; no engine output was consulted.  The
# bearer carries the band grant in its skill list, so the canonical operator is what the tape reads.
# The charging swordsman's roll of two fails the To Hit target of four and the reroll converts it into
# a hit.
- audit_id: rule/trollheim/trollheim-mercenaries/swordsmen--expert-swordsmen/skill.expert-swordsman
  id: a-charging-sword-rerolls-its-failed-hit
  fighters:
    first:
      main_weapon_id: weapon.sword
      skill_ids: [skill.expert-swordsman]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.first.attack.0.hit.reroll, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: True, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# A great sword is outside the printed scope, so the charged miss stands and no second die is taken
# for it.  The two-handed weapon also strikes last, so the mace opponent resolves first and the
# refused reroll is the second attack.
- audit_id: rule/trollheim/trollheim-mercenaries/swordsmen--expert-swordsmen/skill.expert-swordsman
  id: a-great-sword-rerolls-nothing
  fighters:
    first:
      main_weapon_id: weapon.double-handed-weapon
      skill_ids: [skill.expert-swordsman]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.0.first.attack.0.hit, value: 2}
  expect_rounds:
    0: {attacks.0.hit: False, attacks.1.hit: False, state.first.wounds: 2, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# The same charging turn with any other weapon: the printed rule refuses the reroll, so the failed
# hit stands.
- audit_id: rule/trollheim/trollheim-mercenaries/swordsmen--expert-swordsmen/skill.expert-swordsman
  id: an-ordinary-weapon-rerolls-nothing
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [skill.expert-swordsman]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: False, attacks.0.damage: 0, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

