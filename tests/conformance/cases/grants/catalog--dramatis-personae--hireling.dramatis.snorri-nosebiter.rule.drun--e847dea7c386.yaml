# Printed text (grade-2b.yaml, Snorri Nosebiter / Drunk): "Roll a D6 on the following table [...]:
# 1 - [...] he has forgotten to turn up.  2 - His WS and S are both reduced by -1.  3 - No effect.
# 4 - Any model friend or foe, fighting within 2" of Snorri is at -1 to hit.  5 - Snorri gains +1
# strength.  6 - Snorri is subject to frenzy."  The grant is profile; the execution entry carries the
# tag mechanic.snorri-drunk, consumed at compile time by
# packages/python/roster-construction/mordheim_construction/compiler.py (~1259-1276): the pre-battle
# result is a supplied fact (trait_overrides snorri_drunk_result, 2-6; a 1 is refused by name), 2
# lowers the compiled WS and S, 4 tags condition.snorri-stench (contexts.py ~542-546: -1 to hit for
# both fighters in contact), 5 raises the compiled S, 6 tags condition.snorri-frenzy with frenzy.  The
# model is the authored mechanics file cases/mechanics/mechanic.snorri-drunk.yaml.
#
# Hireling family model (P0, 2026-11-17).  The recipient is the printed Snorri compiled through the
# hireling route (hirelings.dramatis-personae.2b / hireling.dramatis.snorri-nosebiter) with his printed
# kit supplied (owned_item_ids dwarf_axe + hammer, the hammer declared as his canonical mace main
# weapon) and the fixture facts (WS3 S3 T3 W2 I5 A1; the printed Ld8 stays).  His Slayer Rules are
# Psychology immunity and an armour ban; his Lucky 5+ ward is requested only when he is wounded, and
# every enemy blow below misses, so no ward die appears.  He charges a hand-built opponent (WS3 S3 T3
# W3 I2 A1 Ld7, mace).  The compiled consequences are read on the fighter snapshot (expect_fighters)
# and in the duel.  Dice: WS3 against WS3 hits on 4+ (WS2 against WS2 too), S3 against T3 wounds on
# 4+, S4 on 3+; no sixes.  The refusal selects the printed rule on the grade-1b Bard.

# Result 2: the compiled Weapon Skill and Strength are one lower, and a three that WS3 would hit with
# against WS2 misses at WS2 against WS2.
- audit_id: rule/catalog/dramatis-personae/hireling.dramatis.snorri-nosebiter.rule.drunk/mechanic.snorri-drunk
  id: a-supplied-two-lowers-snorri-s-weapon-skill-and-strength
  fighters:
    first:
      &snorri
      collection: mordheim
      band_id: hirelings.dramatis-personae.2b
      profile_id: hireling.dramatis.snorri-nosebiter
      owned_item_ids: [dwarf_axe, hammer]
      main_weapon_id: weapon.mace
      trait_overrides: {snorri_drunk_result: 2}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 2, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: &snorri-charges {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 3}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_fighters:
    first.characteristics.weapon_skill: 2
    first.characteristics.strength: 2
  expect_rounds:
    0: {attacks.0.hit_target: 4, attacks.0.hit: False, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

