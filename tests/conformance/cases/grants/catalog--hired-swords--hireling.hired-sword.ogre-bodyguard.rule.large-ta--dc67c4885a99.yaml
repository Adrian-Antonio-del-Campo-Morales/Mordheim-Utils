# --- Authored scenarios ---
# Hireling family model (P0, 2026-11-17), Large variant.  The recipient is the printed Ogre Bodyguard
# (band_id hirelings.hired-sword.core), fixture characteristics WS3 S3 T3 W2 I5 A1 with the printed Ld7;
# the omitted main weapon is the kit's own (the first listed choice) and the kit's light armour is owned,
# not worn (worn armour is a build's armour_id, compiler.py; the printed kit itself grants no innate
# save), so being wounded requests no armour die - exactly the dice his fear sibling file shows.  The
# printed grant ("Counts as a large target.") binds condition.large-target, whose execution entry tags
# the bearer [size.large].  The observer is a hand-built charger carrying the printed Slay Large Creature
# bonus through skill_ids ("+1S when charging a Large sized creature", grade-2a Halfling Knight) - the
# same kind:profile route as cases/mechanics/mechanic.shallya-strictures.yaml.  Arithmetic: S3 wounds T3
# on 4+, the +1S of the charge against a Large target (S4 vs T3) on 3+, so the declared wound roll of 3
# separates recipient and control.  The Ogre causes fear, so the charger (Ld7) declares the 2D6 charge
# test; 3+3 passes.  The recipient's own blows are silenced (attacks: 0); the Bard control (grade-1b,
# no Large rule, dagger kit) causes no fear and is simply not wounded by the same 3.

# The Slay Large Creature charger wounds the Large Ogre Bodyguard on a 3 (S4 vs T3 after the charge bonus).
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.ogre-bodyguard.rule.large-target/condition.large-target
  id: a-slay-large-creature-charger-wounds-the-large-ogre-bodyguard-on-a-3
  fighters:
    first:
      &charger
      main_weapon_id: weapon.mace
      skill_ids: [rule.slay-large-creature]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
    second:
      collection: mordheim
      band_id: hirelings.hired-sword.core
      profile_id: hireling.hired-sword.ogre-bodyguard
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    # The Ogre Bodyguard causes fear: the charger's 2D6 charge test of 3+3 passes Ld7.
    - {key: round.0.first.fear.charge.0, value: 3}
    - {key: round.0.first.fear.charge.1, value: 3}
    - {key: round.0.first.attack.0.hit, value: 4}
    # His default printed kit pair is two swords, so the hit offers a parry;
    # the 2 does not beat the 4 and the blow carries on.
    - {key: round.0.first.attack.0.parry, value: 2}
    - {key: round.0.first.attack.0.wound, value: 3}
  expect_rounds:
    0: {attacks.0.hit: True, attacks.0.wounded: True, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The control: the Bard is not Large, so the same charge carries no bonus and the same 3 does not wound
# (S3 vs T3 needs 4+).  He causes no fear, so no other die is requested.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.ogre-bodyguard.rule.large-target/condition.large-target
  id: a-hireling-without-the-large-target-grant-is-not-wounded-by-the-same-3
  fighters:
    first:
      <<: *charger
    second:
      collection: mordheim
      band_id: hirelings.hired-sword.1b
      profile_id: hireling.hired-sword.bard
      main_weapon_id: weapon.dagger
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 3}
  expect_rounds:
    0: {attacks.0.hit: True, attacks.0.wounded: False, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The printed grant belongs to the recipient's profile; selecting it on another hireling is refused.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.ogre-bodyguard.rule.large-target/condition.large-target
  id: the-rule-is-refused-on-a-hireling-outside-its-printed-profile
  fighters:
    first:
      collection: mordheim
      band_id: hirelings.hired-sword.1b
      profile_id: hireling.hired-sword.bard
      main_weapon_id: weapon.dagger
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
      special_rule_ids: [hireling.hired-sword.ogre-bodyguard.rule.large-target]
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  expect_error: "special rule is not available to hirelings.hired-sword.1b"
