# --- Authored scenarios ---
# Family model (goblin squabble): the bearer is the printed band profile with its own species
# fact (species: goblin), supplied with the fixture characteristics (WS3 S3 T3 W2 I5 A1; the
# printed Leadership stays) and a club from the band's own equipment list.  The opponent is the
# hand-built mace fixture (WS3 S3 T3 W3 I2 A1 Ld7).  WS3 against WS3 hits on 4+, S3 against T3
# wounds on 4+, an unarmoured mace fixture rolls no save; the band's Hate Stunties grant reaches
# only a Dwarf (or Skaven) enemy, so this human fixture is offered no Hatred reroll.

# A 1 at the start of the Night Goblin's turn: he squabbles, his attack die is never requested and
# the enemy's own natural 1 is still rolled.
- audit_id: rule/mordheim/night-goblins-kaz/band--animosity/mechanic.goblin-squabble
  id: a-night-goblin-rolling-a-one-squabbles-and-strikes-no-blow
  fighters:
    first:
      collection: mordheim
      band_id: night-goblins-kaz
      profile_id: night-goblins
      main_weapon_id: weapon.club
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.animosity, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.animosity_failed: True, state.first.wounds: 2, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

