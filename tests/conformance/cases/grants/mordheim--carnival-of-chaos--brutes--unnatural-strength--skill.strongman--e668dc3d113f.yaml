# --- Authored scenarios ---
# Derived from the printed rule and the printed profile; no engine output was consulted.  The
# bearer's Weapon Skill 3, Initiative 5 and single attack are hand-built fixture facts, and both
# attacks miss so the tape holds exactly two hit dice.  expect_events fixes the sequence, which is
# the observable: StrictDice rejects an undeclared roll, so a bearer that struck last would consume
# the dice in the opposite order and fail.
- audit_id: rule/mordheim/carnival-of-chaos/brutes--unnatural-strength/skill.strongman
  id: the-strongman-brute-stands-in-the-ordinary-order-with-a-two-handed-weapon
  fighters:
    first:
      collection: mordheim
      band_id: carnival-of-chaos
      profile_id: brutes
      main_weapon_id: weapon.double-handed-weapon
      characteristics: {weapon_skill: 3, strength: 4, toughness: 3, wounds: 3, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.wounds: 3, state.first.condition: STANDING, state.second.wounds: 3,
        state.second.condition: STANDING}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
  expect_events:
    - {kind: roll, key: round.0.first.attack.0.hit, sides: 6, value: 1}
    - {kind: roll, key: round.0.second.attack.0.hit, sides: 6, value: 1}

