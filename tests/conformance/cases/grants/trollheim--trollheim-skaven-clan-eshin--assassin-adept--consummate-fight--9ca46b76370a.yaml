# AUTHORED: 2 scenarios pin the printed additional -1 armour modifier at the target it moves and one face below it, with the identical attack without the trait as the contrast.

# --- Authored scenarios ---
# "Any armour save caused by a Wound inflicted by the Assassin suffers an additional -1
# modifier": the defending heavy-armour profile saves on a five against an equal-Strength
# attack, so the printed extra point moves that printed target to six and the five no longer
# saves.  Both scenarios declare the same hit and wound faces, so the modifier is the only
# difference between them.
- audit_id: rule/trollheim/trollheim-skaven-clan-eshin/assassin-adept--consummate-fighter/trait.perfect-killer
  id: the-extra-modifier-moves-the-printed-armour-target-by-one
  fighters:
    first:
      main_weapon_id: weapon.mace
      trait_overrides: {perfect_killer: true}
      characteristics: &assassin-ws3-s3-t3-w2-i5 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      armour_id: armour.heavy-armour
      characteristics: &armoured-ws3-s3-t3-w2-i2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: &charging-first {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.armour, value: 5}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.saved: false, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The same attack without the printed modifier: the identical five saves, so the extra point
