# Hireling family model (P0, 2026-11-17; equipment batch 2026-11-18).  The recipient is
# the printed hireling profile compiled through the hireling route (band_id
# hirelings.dramatis-personae.1a, profile_id hireling.dramatis.countess-marianna-
# chevaux-vampire-assassin); the printed rule is granted by the profile itself, so
# the build selects nothing, and the coating is carried by her kit weapon (the
# profile grant tags the compiled main weapon poison.black-lotus +
# poison.vampires-only; no main_poison_id is declared).  The kit dagger is named so
# the printed rapier's own parry and save bonus stay out of the tape.  Physical
# characteristics are the fixture facts (WS3 S3 T3 W2 I5 A1); the printed Ld9 stays.
# The opponent is hand-built (WS3 S3 T3 W3 I2 A1 Ld7, mace) and declares the one fact
# the rule reads, trait_overrides: {vampire: true}.  The control is the grade-1b Bard
# with his kit dagger.
#
# Printed rule (Town Cryer 22): "Her weapons carry a garlic coating. Against Vampires
# only, the coating acts as Black Lotus: a natural 6 to hit guarantees the wound,
# keeping the ordinary critical attempt and saves."  The declaration
# `round.0.first.attack.0.lotus-critical` is asked only against the Vampire and is
# declined here, so no wound die follows; the dagger grants its target a 6+ armour
# save, which is the kept ordinary save and fails on a 1.
#
# Companion printed rules of the same profile request nothing here: Lightning
# Reflexes only matters when she is charged, Step Aside and Dodge only when she is
# hit, No Pain / Jump Up only when she is injured, and her Immunities remove tests
# rather than adding dice.

# The recipient charges a Vampire: the natural 6 guarantees the wound (declaration
# declined, no wound die), the kept dagger save is asked and fails on a 1.
- audit_id: rule/catalog/dramatis-personae/hireling.dramatis.countess-marianna-chevaux-vampire-assassin.rule.garlic-coated-weapons/poison.garlic-black-lotus
  id: the-countess-natural-six-wounds-a-vampire-automatically
  fighters:
    first:
      &recipient
      collection: mordheim
      band_id: hirelings.dramatis-personae.1a
      profile_id: hireling.dramatis.countess-marianna-chevaux-vampire-assassin
      main_weapon_id: weapon.dagger
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      &vampire
      main_weapon_id: weapon.mace
      trait_overrides: {vampire: true}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: &recipient-charges {charging: [first], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.attack.0.lotus-critical, value: false}
  rolls:
    # The Countess is a vampire and causes fear: the charged opponent tests (1+1 passes Ld7).
    - {key: round.0.second.fear.charged.0, value: 1}
    - {key: round.0.second.fear.charged.1, value: 1}
    - {key: round.0.first.attack.0.hit, value: 6}
    # The dagger's printed 6+ save for its target: the ordinary save is kept.
    - {key: round.0.first.attack.0.armour, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
    # Her printed Fighting Undead grants a Vampire attacker Hatred: the miss is rerolled (1 misses again).
    - {key: round.0.second.attack.0.hit.reroll, value: 1}
  expect_rounds:
    0: {attacks.0.critical: false, attacks.0.saved: false, attacks.0.damage: 1, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

