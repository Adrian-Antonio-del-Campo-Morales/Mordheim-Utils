# Clause: regardless-of-strength (scope: YES)
# AUTHORED[regardless-of-strength]: 3 scenarios hold the printed no-modifier half - a Strength 6
#   attacker still saves on the unchanged six and beats it only on five - and the same Strength 6
#   against a fixture whose 6+ comes from worn armour is offered no die at all, which is what the
#   printed words exclude here.
#
# Clause: six-plus-basic-save (scope: YES)
# AUTHORED[six-plus-basic-save]: 5 scenarios take the printed basic 6+ on the real attack route -
#   a six saves and a five is a wound - and worn light armour leaves the same six as the better of
#   the two layers instead of adding a second step, while a fixture without the row is offered no
#   save at all.


# --- Authored scenarios ---
# Runtime review: keep the printed W1 maximum. The current source explicitly
