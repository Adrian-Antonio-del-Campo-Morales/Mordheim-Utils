# Hireling family model (README, Hireling recipients): the recipient is the printed Grand Master Ippan Shu
# compiled through the hireling route (hirelings.dramatis-personae.1c / hireling.dramatis.grand-master-ippan-shu),
# his printed rule granted by the profile itself; fixture characteristics WS3 S3 T3 W2 I5 A1 (printed Ld10
# stays); he fights bare-handed (weapon.fist).  Printed text: "Ippan Shu can fight without weapons and
# suffers no penalties when doing so. In fact, he then counts as having a second close combat weapon and
# gets +1 attack."  The operator (skill.unarmed-fighting): the fist's Strength -1 and the target's +1 save
# are waived (phases.py `ignores_unarmed_penalties`, contexts.py ~830) and the one-attack unarmed cap is
# lifted with one attack added (phases.py:348-366).  The opponent is hand-built (WS3 S3 T3 W3 I2 A1 Ld7,
# mace, no armour).  Arithmetic: WS3 vs WS3 hits on 4+; S3 wounds T3 on 4+ with no save (a bare 7 is no
# die); the clamped fist is S2 (5+ to wound) and gives the target a 6+ save.

# Ippan Shu's fists: two attack dice are consumed (A1 + the printed extra attack), the first wounds at full
# Strength and no armour die follows; the second misses.
- audit_id: rule/catalog/dramatis-personae/hireling.dramatis.grand-master-ippan-shu.rule.bare-handed/skill.unarmed-fighting
  id: ippan-shu-fights-bare-handed-with-an-extra-attack-at-full-strength-and-no-fist-save
  fighters:
    first:
      collection: mordheim
      band_id: hirelings.dramatis-personae.1c
