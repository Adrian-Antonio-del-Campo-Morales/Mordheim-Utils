# Conformance authoring scaffold; generated comments, manually authored scenarios.
# audit_id: rule/trollheim/trollheim-cult-of-the-possessed/band--mutations-extra-arm/special-rule.band--mutations-extra-arm
# authoring_status: AUTHORED
# authoring_progress: the admitted whole clause carries authored scenarios derived from the printed sentence and the recorded contract (the mutation accepts a one-handed weapon, Shield or Buckler; the weapon grants a separate attack and the Possessed's shield keeps its natural attack).  The recipient is built from the band package with the rule selected through `special_rule_ids`, as the band's other mutation grants are.  Added 2026-11-16: the Possessed branch (adopted ruling 2026-11-10): the Possessed gains one extra natural attack with an empty extra arm or a shield, without double counting, a weapon in its extra arm is refused (by its empty printed equipment list, "The Possessed never use weapons or armour"), and the same Possessed without the mutation keeps two attacks.  REVIEWED still requires manual semantic review and execution_status stays UNEXECUTED.
# execution_status: UNEXECUTED (this scaffold has no behavioral result)
