# Preserve audit_id when filling this file.
# Governing rulings: docs/decisions/design-rulings.md
#
# AUTHORED: 6 scenarios evidence the printed extra attack on the Mutant recipient through the size of the attack pool, with the same recipient without the mutation as the contrast, and the Possessed branch (empty arm, shield without double counting, weapon refused, control without the mutation).

# --- Authored scenarios ---
# "A Mutant may use a one-handed weapon in the extra arm and gains +1 Attack": the extra arm
# carries its own one-handed weapon, so the pool carries one attack die more than the same
# recipient without this mutation, with every attack scripted as a miss so the pool is the only
# difference.
- audit_id: rule/trollheim/trollheim-cult-of-the-possessed/band--mutations-extra-arm/special-rule.band--mutations-extra-arm
  id: the-mutant-carries-an-extra-attack-with-the-mutation
  fighters:
    first:
      collection: trollheim
      band_id: trollheim-cult-of-the-possessed
      profile_id: mutants
      special_rule_ids: [band--mutations-extra-arm]
      main_weapon_id: weapon.mace
      extra_hand_id: weapon.mace
    second:
      main_weapon_id: weapon.mace
      characteristics: &plain-ws3-s3-t3-w2-i2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: &charging-first {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.first.attack.1.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: false, attacks.1.hit: false, attacks.2.hit: false, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The same recipient keeps its printed single attack when a different mutation is selected, so
# the extra die is this mutation's own contribution.  The Mutant may not be recruited with no
# mutation at all (`requiredInitial`), so the control carries the neutral Acid Blood instead.
- audit_id: rule/trollheim/trollheim-cult-of-the-possessed/band--mutations-extra-arm/special-rule.band--mutations-extra-arm
  id: the-same-mutant-without-the-mutation-keeps-one-attack
  fighters:
    first:
      collection: trollheim
      band_id: trollheim-cult-of-the-possessed
      profile_id: mutants
      special_rule_ids: [band--mutations-acid-blood]
      main_weapon_id: weapon.mace
    second:
      main_weapon_id: weapon.mace
      characteristics: *plain-ws3-s3-t3-w2-i2
  duel_context: *charging-first
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: false, attacks.1.hit: false, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# Added 2026-11-16: the Possessed branch of the adopted ruling "A Possessed with Extra Arm always
# gains one additional natural attack. It applies with an empty extra hand, shield or buckler,
# without double counting; the Possessed cannot carry a weapon" (docs/decisions/design-rulings.md,
# 2026-11-10).  The recipient is the band's printed Possessed (WS4 S4 T4 W2 I4 A2, which "never use
# weapons or armour") at its printed profile; nobody charges, so no Fear test arises from its printed
# Fear, and the hand-built victim makes no attacks.  Every hit die is a natural 1, so the number of
# declared hit dice is the observable: two printed Attacks plus the one natural attack the mutation
# grants.

# With the extra arm empty the Possessed makes three attacks, one more than its printed two.
- audit_id: rule/trollheim/trollheim-cult-of-the-possessed/band--mutations-extra-arm/special-rule.band--mutations-extra-arm
  id: the-possessed-with-an-empty-extra-arm-gains-one-natural-attack
  fighters:
    first:
      collection: trollheim
      band_id: trollheim-cult-of-the-possessed
      profile_id: the-possessed
      special_rule_ids: [band--mutations-extra-arm]
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 2, wounds: 3, initiative: 2, attacks: 1}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.first.attack.1.hit, value: 1}
    - {key: round.0.first.attack.2.hit, value: 1}
  expect_rounds:
    0: {attacks.2.hit: false, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

