# "But still cannot carry a weapon": a weapon in the Possessed's extra arm is refused.  The refusal
# comes from the Possessed's empty equipment list (printed "The Possessed never use weapons"), the
# same construction stage that must hold for the extra arm.
- audit_id: rule/trollheim/trollheim-cult-of-the-possessed/band--mutations-extra-arm/special-rule.band--mutations-extra-arm
