# --- Authored scenarios ---
# Uniform Large Target binding (design ruling recorded 2026-11-18): the printed Large Target grant
# binds condition.large-target, whose execution entry tags the bearer [size.large]; the printed
# shooting consequences (+1 to hit, targetable when not closest) stay excluded as
# out-of-scope.shooting and are not asserted here.  The observer is a hand-built charger carrying
# the printed Slay Large Creature bonus (+1 Strength when charging a Large creature, first round)
# through skill_ids.  Arithmetic: S3 wounds T3 on 4+, the +1S of the charge against a Large target
# (S4 vs T3) on 3+, so the declared wound roll of 3 separates recipient and control.  The recipient
# is the band's printed Great Bear (fixture characteristics WS3 S3 T3 W2 I5 A1; the printed
# Leadership stays): it causes no fear, so no charge test is requested, and it never uses weapons,
# so the silenced (attacks: 0) natural-attacks profile stays silent (the same convention as the
# Kislevite Trained Bear's authored fearsome sibling).  Maddened with Pain only adds an attack in
# the round after a wound, outside this one-round horizon.  The removal probe filters this rule's
# condition.large-target binding; the first scenario's wound then fails, which is the
# discriminating evidence.

# The Slay Large Creature charger wounds the Large Great Bear on a 3 (S4 vs T3 after the charge bonus).
- audit_id: rule/mordheim/cursed-cavalcade/great-bear--large-target/condition.large-target
  id: a-slay-large-creature-charger-wounds-the-large-great-bear-on-a-3
  fighters:
    first:
      &charger
      main_weapon_id: weapon.mace
      skill_ids: [rule.slay-large-creature]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
    second:
      collection: mordheim
      band_id: cursed-cavalcade
      profile_id: great-bear
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 3}
  expect_rounds:
    0: {attacks.0.hit: True, attacks.0.wounded: True, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The control: a hand-built opponent without the Large rule carries no charge bonus for the same
# charger, so the same wound roll of 3 fails (S3 vs T3 needs 4+).
- audit_id: rule/mordheim/cursed-cavalcade/great-bear--large-target/condition.large-target
  id: without-the-large-rule-the-same-three-fails
  fighters:
    first:
      <<: *charger
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 7}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 3}
  expect_rounds:
    0: {attacks.0.hit: True, attacks.0.wounded: False, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
