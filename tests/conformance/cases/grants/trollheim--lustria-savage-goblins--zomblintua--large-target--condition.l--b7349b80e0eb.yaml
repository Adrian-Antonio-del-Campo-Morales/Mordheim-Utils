# Uniform Large Target binding (design ruling 2026-11-18): the printed Large Target rule binds
# condition.large-target, whose execution entry tags the bearer [size.large]; the printed shooting
# consequences (eligible target beyond the closest, +1 To Hit for missiles) stay excluded as
# out-of-scope.shooting and are not asserted here.  The recipient is the printed Zomblintua, built
# from its band profile with fixture characteristics (WS3 S3 T3 W2 I5 A1; the printed Toughness 5
# is overridden by the fixture fact so the family arithmetic holds, and the printed Leadership
# stays); it never uses weapons, so its regeneration sibling's weapon.fist is declared and the
# build is silenced (attacks: 0).  The observer is a hand-built charger carrying the printed Slay
# Large Creature bonus through skill_ids ("+1S when charging a Large sized creature") - the duel
# reader of the family model.  Arithmetic: S3 wounds T3 on 4+, the +1S of the charge against a
# Large target (S4 vs T3) on 3+, so the declared wound roll of 3 separates recipient and control.
# Profile-specific dice (per the zomblintua fear/regeneration siblings): Zomblintua causes Fear,
# so the charger (Ld7) declares the 2D6 charge test and 3+3 passes; its printed Regeneration
# requests a die after the unsaved wound and the declared 1 fails the printed 5+ threshold, which
# the scenario does not assert; its No Pain and Psychology/Poison immunities add no attack-time
# die here and the fixture keeps the victim at one remaining wound, so no injury roll intervenes.

# The Slay Large Creature charger wounds the Large Zomblintua on a 3 (S4 vs T3 after the charge bonus).
- audit_id: rule/trollheim/lustria-savage-goblins/zomblintua--large-target/condition.large-target
  id: a-slay-large-creature-charger-wounds-the-large-zomblintua-on-a-3
  fighters:
    first:
      &charger
      main_weapon_id: weapon.mace
      skill_ids: [rule.slay-large-creature]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
    second:
      collection: trollheim
      band_id: lustria-savage-goblins
      profile_id: zomblintua
      main_weapon_id: weapon.fist
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    # Zomblintua causes fear: the charger's 2D6 charge test of 3+3 passes Ld7.
    - {key: round.0.first.fear.charge.0, value: 3}
    - {key: round.0.first.fear.charge.1, value: 3}
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 3}
    # Zomblintua's Regeneration requests its die after the unsaved wound; the declared 1 fails
    # the printed threshold, so the wound stands and no regeneration target is asserted.
    - {key: round.0.first.attack.0.special.regeneration, value: 1}
  expect_rounds:
    0: {attacks.0.hit: True, attacks.0.wounded: True, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The control: a hand-built opponent without the Large rule, so the same charge carries no bonus
# and the same 3 does not wound (S3 vs T3 needs 4+).  It causes no fear and regenerates nothing,
# so no other die is requested.
- audit_id: rule/trollheim/lustria-savage-goblins/zomblintua--large-target/condition.large-target
  id: without-the-large-rule-the-same-three-fails
  fighters:
    first:
      <<: *charger
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 7}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 3}
  expect_rounds:
    0: {attacks.0.hit: True, attacks.0.wounded: False, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
