# The contrast: the same printed face from worn heavy armour (5+, not unmodifiable) is worsened to 6+
# by a mere Strength 4 hit, so the five fails.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.chaos-fury.rule.daemonic-flesh/trait.natural-armour-unmodified
  id: an-ordinary-five-plus-from-worn-armour-becomes-six-plus-under-a-strength-four-hit
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 4, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
    second:
      main_weapon_id: weapon.mace
      armour_id: armour.heavy-armour
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 7}
  initial_state: {second: {attacks: 0}}
  duel_context: *attacker-charges
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.armour, value: 5}
  expect_fighters:
    second.natural_armour_unmodified: False
    second.armour_save: 5
  expect_rounds:
    0: {attacks.0.saved: false, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

