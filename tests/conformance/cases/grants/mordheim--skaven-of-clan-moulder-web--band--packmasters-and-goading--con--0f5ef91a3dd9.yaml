# --- Authored scenarios ---
# Both builds compile to fists (the Giant Rats never use weapons); every strike is a natural 1 so no
# wound die exists.  Leadership 2D6: a total at or under Leadership passes.

# The goaded Giant Rats charge the Musk bearer without a Leadership die and the combat resolves.
- audit_id: rule/mordheim/skaven-of-clan-moulder-web/band--packmasters-and-goading/condition.goading-charge
  id: the-goaded-moulder-beast-charges-the-musk-bearer-without-a-leadership-die
  fighters:
    first:
      &goading-band-musk-bearer
      skill_ids: [mechanic.hypnotic-musk]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 4, attacks: 1, leadership: 6}
    second:
      collection: mordheim
      band_id: skaven-of-clan-moulder-web
      profile_id: giant-rats
      condition_ids: [condition.goading-charge]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
  duel_context: {charging: [second], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.0.first.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.engaged: true, state.second_charged: true, state.first.wounds: 2, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The control: the same Giant Rats without the supplied Goading fact owe the Musk gate; 4+3 = 7 fails
# their printed Leadership 4 and the charge is cancelled, so the round holds no combat dice.
- audit_id: rule/mordheim/skaven-of-clan-moulder-web/band--packmasters-and-goading/condition.goading-charge
  id: without-the-goading-the-same-beast-owes-the-musk-test-and-its-charge-is-cancelled
  fighters:
    first: *goading-band-musk-bearer
    second:
      collection: mordheim
      band_id: skaven-of-clan-moulder-web
      profile_id: giant-rats
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
  duel_context: {charging: [second], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.hypnotic-musk-charge.0, value: 4}
    - {key: round.0.second.hypnotic-musk-charge.1, value: 3}
  expect_rounds:
    0: {state.engaged: false, state.second_charged: false, state.failed_charges: ['second']}
  expect_final: {rounds_executed: 1, termination_reason: disengaged}
