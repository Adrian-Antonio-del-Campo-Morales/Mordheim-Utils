# --- Authored scenarios ---
# Source: Orc Pirates & Savage Orcs (broheim.net), p.3, Henchmen / 0+ Goblin Swabbies / Rabble.  The Rabble rule binds the Goblin Swabbies to the Goblin Swabbie Equipment List and nothing
# else; the KB declares it on the profile (profiles.yaml, id goblin-swabbies: equipment_lists
# [goblin-swabbie-equipment-list]) and publishes both lists' rows in equipment-access.yaml.  INPUT: the fixture's
# carried-item channel (owned_item_ids), the channel the Lustria model and the hireling kit refusals use.
# REFUSAL: a Goblin Swabbie carrying axe - a row the band's Orc Equipment List offers and its
# Goblin Swabbie Equipment List does not - is refused at construction with the shared stage's per-item offered-set
# sentence.  ADMISSION: the same profile carrying short_bow, a row only the Goblin Swabbie Equipment List offers,
# compiles with the band's compiler contracts visible as construction_tags (the sorted list of every
# compiler binding the profile receives: the Rabble contract alone; the Orc Pirates declare no band-wide compiler binding).  The admission uses the corpus's construction-only
# shape (no charge, the bearer out of action before the first phase, so the duel requests no die) with
# the README's hand-built opponent.  No engine output was consulted.

- audit_id: rule/mordheim/orc-pirates-sar/goblin-swabbies--rabble/compiler.swabbie-rabble-loadout
  id: an-orc-list-row-is-refused-for-a-goblin-swabbie
  # axe sits on this band's Orc Equipment List and is absent from the Goblin Swabbie Equipment List, the recipient's
  # only list.  The declared fragment is the stage's own per-item access sentence.
  fighters:
    first:
      collection: mordheim
      band_id: orc-pirates-sar
      profile_id: goblin-swabbies
      owned_item_ids: [axe]
  expect_error: '"axe" is not on any equipment list of orc-pirates-sar/goblin-swabbies.'

- audit_id: rule/mordheim/orc-pirates-sar/goblin-swabbies--rabble/compiler.swabbie-rabble-loadout
  id: the-goblin-swabbie-list-row-is-admitted-at-construction
  # short_bow is the row only the Goblin Swabbie Equipment List offers, so carrying it is what the printed sentence
  # permits; the profile compiles and the Rabble contract is visible on the compiled build.
  fighters:
    first:
      collection: mordheim
      band_id: orc-pirates-sar
      profile_id: goblin-swabbies
      owned_item_ids: [short_bow]
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [], active_participant: first}
  initial_state: {first: {condition: OUT}}
  expect_fighters:
    first.construction_tags: [compiler.swabbie-rabble-loadout]
