# --- Authored scenarios ---
# Derived from the printed sentence and the recorded contract, never from engine output.  The bearer is the
# band's printed Shadow Blade profile carrying the row the audit id names and the defender wears printed
# heavy armour; the pair differs only in that row, so the declared armour face of five isolates the
# additional modifier.

- audit_id: rule/trollheim/chaos-streets-deathbringers/shadow-blade--consummate-fighter/trait.perfect-killer
  id: the-additional-penalty-drops-the-armour-save
  fighters:
    first:
      collection: trollheim
      band_id: chaos-streets-deathbringers
      profile_id: shadow-blade
      main_weapon_id: weapon.sword
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 7}
    second:
      main_weapon_id: weapon.sword
      armour_id: armour.heavy-armour
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.fear.charged.0, value: 1}
    - {key: round.0.second.fear.charged.1, value: 1}
    - {key: round.0.first.attack.0.hit, value: 4}
    # The defender's sword is a parrying weapon, so the offered parry is declared
    # and fails before the wound is resolved.
    - {key: round.0.first.attack.0.parry, value: 1}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.armour, value: 5}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.saved: False, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

