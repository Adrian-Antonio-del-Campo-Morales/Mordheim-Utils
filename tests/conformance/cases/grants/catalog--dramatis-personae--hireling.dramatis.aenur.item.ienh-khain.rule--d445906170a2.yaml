# Ienh-Khain is Aenur's unique item: wielded by a hireling of another printed kit it is refused.
- audit_id: rule/catalog/dramatis-personae/hireling.dramatis.aenur.item.ienh-khain.rule.parry/weapon.ienh-khain
  id: the-sword-is-refused-in-the-hand-of-another-hireling
  fighters:
    first: *ienh-parry-attacker
    second:
      <<: *ienh-parry-control
      main_weapon_id: weapon.ienh-khain
  expect_error: "hireling active equipment and supplied ownership do not form a complete legal printed kit"
