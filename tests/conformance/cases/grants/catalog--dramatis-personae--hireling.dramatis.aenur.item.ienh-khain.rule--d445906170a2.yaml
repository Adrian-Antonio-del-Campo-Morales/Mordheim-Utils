# The printed parry: Aenur, struck on a 4, is offered the parry and the 5 turns the blow.
- audit_id: rule/catalog/dramatis-personae/hireling.dramatis.aenur.item.ienh-khain.rule.parry/weapon.ienh-khain
  id: the-real-aenur-parries-a-hit-with-ienh-khain
  fighters:
    first:
      &ienh-parry-attacker
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
    second:
      &ienh-parry-recipient
      collection: mordheim
      band_id: hirelings.dramatis-personae.core
      profile_id: hireling.dramatis.aenur
      main_weapon_id: weapon.ienh-khain
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.parry, value: 5}
  expect_rounds:
    0: {attacks.0.hit: true, attacks.0.parried: true, attacks.0.wounded: false, state.second.wounds: 2}
  expect_fighters:
    second.main_weapon.parry: true
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# An equal parry die does not beat the hit: the 4 fails, the wound lands, Step Aside's 5+ is
# rolled and declared failing (1), and the wound is taken.
- audit_id: rule/catalog/dramatis-personae/hireling.dramatis.aenur.item.ienh-khain.rule.parry/weapon.ienh-khain
  id: an-equal-parry-die-does-not-block-and-the-wound-lands
  fighters:
    first: *ienh-parry-attacker
    second: *ienh-parry-recipient
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.parry, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.special.ward, value: 1}
  expect_rounds:
    0: {attacks.0.parried: false, attacks.0.wounded: true, attacks.0.saved: false, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

