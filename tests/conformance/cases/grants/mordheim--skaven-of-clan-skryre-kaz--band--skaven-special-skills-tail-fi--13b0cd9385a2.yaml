# Family model (Karak Azgal Skaven special skills, construction face).  The record is a `warband_skill`
# with `grant: selectable`, `applies_to.profile_types: [hero]` and a compiler binding
# `special-rule.band--skaven-special-skills-tail-fighting` whose contract carries no flat effect: the
# compiled consequence is the extra hand the eligibility layer admits only for Tail Fighting, Extra
# Arm or Prehensile Tail ("The Skaven may wield a shield, knife or sword with his tail. A weapon grants
# one additional attack with that weapon").  Every Hero of the band prints the `special` skill access;
# the henchmen (clanrats, skavenslaves) print none and are not Heroes, so the recipients
# gate refuses them with `special rule is not available to <band>/<profile>: <rule>`.
# Fixture facts: the Hero's characteristics are supplied (WS 3, S 3, T 3, W 2, I 5, A 1); the opponent
# is hand-built and contributes no attacks.  Both Hero blows are declared as natural ones so the tape
# holds exactly the sword attack and the tail attack and no wound die.

- audit_id: rule/mordheim/skaven-of-clan-skryre-kaz/band--skaven-special-skills-tail-fighting/special-rule.band--skaven-special-skills-tail-fighting
  id: a-hero-selecting-tail-fighting-compiles-the-tail-dagger-as-an-additional-attack
  fighters:
    first:
      collection: mordheim
      band_id: skaven-of-clan-skryre-kaz
      profile_id: master-engineer
      special_rule_ids: [band--skaven-special-skills-tail-fighting]
      main_weapon_id: weapon.sword
      extra_hand_id: weapon.dagger
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.first.attack.1.hit, value: 1}
  # The compiled Hero carries the tail weapon as its own attack entry with the dagger's identity and
  # the dagger's printed +1 to the target's armour save; the same Hero without the selection carries
  # no extra attack at all (and cannot even declare the tail hand, see the last scenario).
  expect_fighters:
    first.extra_attacks.0.tags: ['weapon.dagger']
    first.extra_attacks.0.target_armour_bonus: 1
  expect_rounds:
    0: {attacks.0.hit: false, attacks.1.hit: false, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The printed recipients are the band's Heroes: a henchman of the same band is refused the selection
