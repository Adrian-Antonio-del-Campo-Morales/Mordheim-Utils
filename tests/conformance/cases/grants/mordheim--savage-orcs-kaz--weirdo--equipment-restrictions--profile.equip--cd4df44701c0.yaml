# AUTHORED: 3 scenarios.  The binding forbids [armour] on the Weirdo (rule_ref shared-rule.no-armour, 'may never
#   wear armour').  The Savage Orc Equipment List (equipment-access.yaml) offers the Weirdo light_armour, shield and
#   helmet, so a light armour suit and a shield are items his own list admits: the equipment-list gate cannot be
#   what refuses them and the refusal `armour is forbidden for savage-orcs-kaz/weirdo` is this clause's own
#   (stage boundEquipment reads the `armour` token against armour_id and the shield/buckler/helmet defences).  The
#   control is the same Weirdo without armour, accepted at construction.  The band's Kumfy Gear binding is a
#   `when_items` conditional clause and is not read by this stage, so it does not share the refusal.
# authoring_progress: 3 authored scenario(s) in this file; the undivided identity is represented. REVIEWED requires
#   manual semantic review and execution_status stays UNEXECUTED.
# Family model (construction-equipment, B11): a printed prohibition bound as profile.equipment-restrictions is
#   evidenced as a construction refusal on the printed recipient plus the same recipient accepted without the
#   item.  Consumer: the shared eligibility stage (packages/typescript/domain/eligibility/index.ts,
#   buildRestriction stage boundEquipment, called by mordheim_construction/restrictions.py before the
#   equipment-list gate), so a slot selection meets the clause's own sentence first: the `armour` token raises
#   `armour is forbidden for <band>/<profile>`, every interpreted token (`weapons`, `equipment`) raises
#   `"<token>" is forbidden for <band>/<profile>.` (equipmentIssue), and a printed permit list raises
#   `<item> may not be carried; the printed clause admits only <permits>.`.  Only the stable fragment is quoted.
