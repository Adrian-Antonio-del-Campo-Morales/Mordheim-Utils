# --- Authored scenarios ---
# Printed text (grade-1b.yaml, Ethereal): "Has a 5+ unmodifiable save except against magical
# weapons."  The mechanic's execution entry carries ward_save 5 with ward_save_mundane_only, so the
# save is a ward taken after the armour step (phases.py resolve_special_save, die
# round.<i>.<attacker>.attack.<n>.special.ward) and is blocked outright by an attack tagged
# attack.magical (modular/contexts.py ~660-662); modular/contexts.py ~694-701 marks the intrinsic
# 5+ unmodifiable, so it is rolled through the unmodifiable dice (modular/attacks.py ~742-745) and
# ignores a general save penalty (ruling "Djinn's Curse respects expressly unmodifiable saves",
# 2026-10-15).
# Hireling family model: the recipient is the printed Khar-Mel compiled through the hireling route
# (hirelings.dramatis-personae.1b / hireling.dramatis.khar-mel-the-djinn) with the fixture facts
# (WS3 S3 T3 W2 I5 A1; the printed Ld8 stays); his kit sword is the omitted default.  The Djinn is
# the active charger (first) so his two powers are asked and declined (djinn-power.curse|luck:
# false), he contributes no swing, and the charged opponent tests Fear (3+3 passes Ld7).  The
# opponent is hand-built (mace, WS3 S3 T3 W3 I2 A1 Ld7), magical where the printed exception is at
# stake.  Its hit (a four) opens the Djinn's sword parry window: the parry die
# round.0.second.attack.0.parry is declared as a one (it must beat the hit roll) so the wound
# resolves; the Djinn wears no armour, so the ward die is the only save.  Wound dice are fours.
# The control is the grade-1b Bard: the same mundane wound on a hireling without the rule asks
# for no ward die.
# Semantic wrinkle (2026-11-18): the "unmodifiable" face needs an incoming save penalty, whose only
#   general producer is another Djinn's Curse - unreachable in a two-fighter duel; the face is
#   asserted by the ruling and the consumer's unmodifiable dice, not by a scenario here.

