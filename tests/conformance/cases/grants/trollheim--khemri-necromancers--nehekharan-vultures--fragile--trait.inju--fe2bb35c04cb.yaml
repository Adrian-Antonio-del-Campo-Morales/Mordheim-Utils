# --- Authored scenarios ---
# Derived from the printed sentence and the recorded contract; no engine output was consulted.  The
# bearer prints the rule, starts the duel at one Wound and contributes no attacks of its own, so round
# 0 carries only the attacker's dice and the wound that lands is the one that reaches the injury
# table.  The blow is an ordinary mace: at Weapon Skill 10 against this bearer's printed Weapon Skill
# it needs a 3, and Strength 8 against Toughness 3 needs a 2, so the declared 5 and 5 both pass.  Five
# is deliberately below a natural six, which would be a critical hit and add a further critical die
# and an injury modifier.  The printed 1-3 half of the ladder resolves to Knocked Down, which the
# bearer's No Pain would keep in any case, so both scenarios hold the ladder itself.

