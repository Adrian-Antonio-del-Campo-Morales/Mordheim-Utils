# Printed text (grade-1b.yaml, Strictures, Town Cryer 8): "A Wolf Priest may only use blunt weapons,
# except for a dagger, and may never wear armour; the white wolf cloak is the only garb the stricture
# allows."  The binding forbids the `armour` token and permits the blunt kinds plus the dagger.  The
# recipient is the printed grade-1b Wolf Priest compiled through the hireling route
# (hirelings.hired-sword.1b / hireling.hired-sword.wolf-priest-of-ulric) with the fixture facts (WS3 S3
# T3 W2 I5 A1; the printed Ld8 stays); its Hatred of Sigmarites is a duel effect that never fires in a
# construction-only engagement.  The admission uses the corpus's construction-only shape (no charge,
# the bearer out of action before the first phase, so the duel requests no die) and observes the
# compiled build alone: armour_save 7 is the no-armour face.  The refusals use the kit-resolver
# fragment already asserted in cases/mechanics/defence.wolf-pelt-cloak.yaml.

# The printed kit, the dagger in hand and the white wolf cloak carried: no armour, so the compiled save
# is the 7 of a bare warrior.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.wolf-priest-of-ulric.rule.strictures/profile.equipment-restrictions
  id: the-printed-dagger-and-cloak-compile-with-no-armour
  fighters:
    first:
      collection: mordheim
      band_id: hirelings.hired-sword.1b
      profile_id: hireling.hired-sword.wolf-priest-of-ulric
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
      main_weapon_id: weapon.dagger
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [], active_participant: first}
  initial_state: {first: {condition: OUT}}
  expect_fighters:
    first.armour_save: 7

# "may never wear armour": a suit of light armour beside the cloak is refused.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.wolf-priest-of-ulric.rule.strictures/profile.equipment-restrictions
  id: armour-is-refused
  fighters:
    first:
      collection: mordheim
      band_id: hirelings.hired-sword.1b
      profile_id: hireling.hired-sword.wolf-priest-of-ulric
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
      main_weapon_id: weapon.dagger
      armour_id: armour.light-armour
  expect_error: "hireling active equipment and supplied ownership do not form a complete legal printed kit"

