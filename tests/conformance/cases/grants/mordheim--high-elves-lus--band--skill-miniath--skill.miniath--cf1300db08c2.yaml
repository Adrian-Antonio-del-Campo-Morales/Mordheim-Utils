# The printed additional attempt, read as the re-roll the Lustria rulebook prints for the same skill
# (ruling "Miniath: the additional parry attempt is the failed-parry re-roll", docs/decisions/design-rulings.md):
# the bearer carries a sword, a weapon he can parry with, so his failed parry die of 3 against the hit of 4 is
# rolled again and the 5 blocks; the successful block consumes the sword's single parry.
- audit_id: rule/mordheim/high-elves-lus/band--skill-miniath/skill.miniath
  id: a-failed-parry-is-rolled-again-with-a-parrying-weapon
  covers: [reroll-with-a-parrying-weapon]
  fighters:
    first: *miniath-attacker
    second:
      main_weapon_id: weapon.sword
      skill_ids: [skill.miniath]
      characteristics: *miniath-bearer
  duel_context: *miniath-context
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.parry, value: 3}
    - {key: round.0.first.attack.0.parry.reroll, value: 5}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.parried: true, attacks.0.wounded: false, state.second.wounds: 2, state.second.parries_remaining: 0}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The control: the same sword bearer without the skill has no re-roll (a sword alone grants none; only a sword
# with a buckler does), so the failed parry die of 3 stands and the wound die of 4 wounds Toughness 3.
- audit_id: rule/mordheim/high-elves-lus/band--skill-miniath/skill.miniath
  id: without-the-skill-a-failed-sword-parry-stands
  covers: [reroll-with-a-parrying-weapon]
  fighters:
    first: *miniath-attacker
    second:
      main_weapon_id: weapon.sword
      characteristics: *miniath-bearer
  duel_context: *miniath-context
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.parry, value: 3}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.parried: false, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
