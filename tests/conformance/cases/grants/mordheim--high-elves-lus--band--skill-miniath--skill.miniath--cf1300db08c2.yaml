# --- Authored scenarios ---
# Derived from the printed sentence and the recorded parry-with-any-weapon contract; no engine output was
# consulted.  A mace cannot parry on its own, so the only difference between the two capacity scenarios is
# the skill; the third resolves a real mace parry, keyed on the attack being parried, of which the
# attacker's hit of 4 is beaten by the parry die of 5, so the wound never lands and the single allowance the
# clause grants is consumed.  The additional-attempt clause of this origin is deliberately not tested here
# (see the PARTIAL note in the header).
