# --- Authored scenarios ---
# Derived from the printed rule text, the Desolate Soul profile and the recorded semantic contract;
# no engine output was consulted.  The Fear source is a hand-built opposing warrior that declares the
# printed causes_fear trait, and the fixture's Initiative is chosen so the strike order is the same
# under either reading (the higher Initiative strikes first, and the duel resolves the first
# fighter's attack before the second's).  Every strike is declared as a natural 1, so a round
# reports nothing but the Leadership request under test.

- audit_id: rule/trollheim/chaos-streets-mordheim-inhabitants/desolate-soul--fanatic/mechanic.automatic-leadership
  id: the-charged-desolate-soul-never-rolls-a-fear-die
  fighters:
    first:
      trait_overrides: {causes_fear: true}
      characteristics: {weapon_skill: 8, strength: 8, toughness: 3, wounds: 3, initiative: 7, attacks: 1, leadership: 7}
    second: {collection: trollheim, band_id: chaos-streets-mordheim-inhabitants, profile_id: desolate-soul}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit.reroll, value: 1}
  expect_rounds:
    0: {state.first.wounds: 3, state.first.condition: STANDING, state.second.wounds: 1, state.second.condition: STANDING, state.second.fear_hit_sixes: false}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

