# Corridor note (entregable 04): the family's named gap was one admitted non-Psychology Leadership
# request via which the wider face could be observed on this bearer. The corridor found it: the
# cursed Danse state is now an admitted supplied condition (catalog/rules/conditions.yaml,
# condition.danse-macabre-controlled, YES/YES) whose recovery re-test is named
# round.N.<side>.danse-macabre, a Leadership request the duel does NOT route as Psychology. The
# tape below supplies that state on the bearer itself: the auto-pass answers the request with no
# die at all (an implementation that asked for one would fail the strict tape) and the state
# clears - the absence of the die is the assertion, as in the Fear tapes above. No charge is
# declared, so the round resolves without combat and nothing else is requested.
- audit_id: rule/trollheim/chaos-streets-mordheim-inhabitants/desolate-soul--fanatic/mechanic.automatic-leadership
  id: the-supplied-danse-state-clears-through-the-non-psychology-route
  fighters:
    first:
      condition_ids: [condition.danse-macabre-controlled]
      collection: trollheim
      band_id: chaos-streets-mordheim-inhabitants
      profile_id: desolate-soul
    second:
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 7}
  initial_state:
    first: {attacks: 0}
    second: {attacks: 0}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  expect_rounds:
    0: {state.first.danse_macabre_controlled: false}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# Non-Psychology Leadership route (2026-11-18): the Ogres' Crude Belch asks its engaged enemy for a
# Leadership test that modular/rounds.py:829-838 requests WITHOUT psychology=True and without a Fear
# flag, so on this request mechanic.psychology-immunity cannot answer and only the printed auto-pass
# can.  The belcher is a hand-built opponent carrying the operator through skill_ids; the Desolate Soul is
# the printed profile.  The auto-pass answers the request with no die at all - the strict tape would
# fail on a request the engine still made - and the Desolate Soul keeps its ordinary 3+ (its printed
# Weapon Skill 4 against the belcher's Weapon Skill 3), so its declared 3 hits (the wound of 1 then
# fails).
- audit_id: rule/trollheim/chaos-streets-mordheim-inhabitants/desolate-soul--fanatic/mechanic.automatic-leadership
  id: the-crude-belch-leadership-test-is-auto-passed-without-a-die
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.crude-belch-ogre]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 7}
    second: {collection: trollheim, band_id: chaos-streets-mordheim-inhabitants, profile_id: desolate-soul}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.crude-belch-ogre, value: true}
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 3}
    - {key: round.0.second.attack.0.wound, value: 1}
  expect_rounds:
    0: {attacks.1.hit_target: 3, attacks.1.hit: true, attacks.1.wounded: false}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The contrast on the same non-Psychology route: a warrior without the printed auto-pass has to roll
# the belch Leadership test, and 6+6 against the printed Leadership 9 fails it, so its target
# against the belcher's Weapon Skill 3 rises from 3 to 4 and the same declared 3 misses.
- audit_id: rule/trollheim/chaos-streets-mordheim-inhabitants/desolate-soul--fanatic/mechanic.automatic-leadership
  id: without-the-auto-pass-the-crude-belch-leadership-dice-are-rolled
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.crude-belch-ogre]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 7}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 4, strength: 3, toughness: 3, wounds: 2, initiative: 3, attacks: 1, leadership: 9}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.crude-belch-ogre, value: true}
  rolls:
    - {key: round.0.first.crude-belch-ogre.leadership.0, value: 6}
    - {key: round.0.first.crude-belch-ogre.leadership.1, value: 6}
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 3}
  expect_rounds:
    0: {attacks.1.hit_target: 4, attacks.1.hit: false}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
