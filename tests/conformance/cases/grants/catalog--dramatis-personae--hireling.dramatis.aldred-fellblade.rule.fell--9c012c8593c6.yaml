# Aldred's Fellblade: a double-handed weapon that parries.
- audit_id: rule/catalog/dramatis-personae/hireling.dramatis.aldred-fellblade.rule.fellblade/compiler.aldred-fellblade
  id: aldreds-two-handed-sword-compiles-with-parry
  fighters:
    first:
      collection: mordheim
      band_id: hirelings.dramatis-personae.2b
      profile_id: hireling.dramatis.aldred-fellblade
      main_weapon_id: weapon.double-handed-weapon
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second: &opponent
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: &construction-only {charging: [], active_participant: first}
  initial_state: &bearer-out {first: {condition: OUT}}
  expect_fighters:
    first.main_weapon.parry: True
    first.main_weapon.two_handed: True

# The control: the same double-handed weapon in another fighter's hands has no parry.
- audit_id: rule/catalog/dramatis-personae/hireling.dramatis.aldred-fellblade.rule.fellblade/compiler.aldred-fellblade
  id: the-same-double-handed-weapon-does-not-parry-for-a-fighter-without-the-rule
  fighters:
    first:
      main_weapon_id: weapon.double-handed-weapon
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 7}
    second: *opponent
  duel_context: *construction-only
  initial_state: *bearer-out
  expect_fighters:
    first.main_weapon.parry: False
    first.main_weapon.two_handed: True

# "no parry is granted to an empty hand": Aldred unarmed gains nothing from the rule.
- audit_id: rule/catalog/dramatis-personae/hireling.dramatis.aldred-fellblade.rule.fellblade/compiler.aldred-fellblade
