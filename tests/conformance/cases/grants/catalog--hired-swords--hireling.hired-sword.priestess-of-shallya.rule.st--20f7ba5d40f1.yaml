# Printed text (grade-2b.yaml, Strictures): "Priestesses of Shallya always begin equipped with a walking
# staff (counts as a staff). They may only be armed with a walking staff. Priestesses of Shallya may
# never wear armour."  The binding forbids the `armour` token.  The recipient is the printed Priestess
# compiled through the hireling route (hirelings.hired-sword.2b /
# hireling.hired-sword.priestess-of-shallya) with the fixture facts (WS3 S3 T3 W2 I5 A1; the printed Ld8
# stays); the staff item resolves to weapon.quarter-staff (catalog/items/weapons-close-combat.yaml).
# The admission uses the corpus's construction-only shape (no charge, the bearer out of action before
# the first phase, so the duel requests no die) and observes the compiled build alone: armour_save 7
# is the no-armour face.  The refusals use the kit-resolver fragment already asserted in
# cases/mechanics/defence.wolf-pelt-cloak.yaml.

# The printed walking staff in hand: no armour, so the compiled save is the 7 of a bare warrior.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.priestess-of-shallya.rule.strictures/profile.equipment-restrictions
  id: the-printed-walking-staff-compiles-with-no-armour
  fighters:
    first:
      collection: mordheim
      band_id: hirelings.hired-sword.2b
      profile_id: hireling.hired-sword.priestess-of-shallya
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
      main_weapon_id: weapon.quarter-staff
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [], active_participant: first}
  initial_state: {first: {condition: OUT}}
  expect_fighters:
    first.armour_save: 7

# "Priestesses of Shallya may never wear armour": a suit of light armour over the staff is refused.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.priestess-of-shallya.rule.strictures/profile.equipment-restrictions
  id: armour-is-refused
  fighters:
    first:
      collection: mordheim
      band_id: hirelings.hired-sword.2b
      profile_id: hireling.hired-sword.priestess-of-shallya
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
      main_weapon_id: weapon.quarter-staff
      armour_id: armour.light-armour
  expect_error: "hireling active equipment and supplied ownership do not form a complete legal printed kit"

