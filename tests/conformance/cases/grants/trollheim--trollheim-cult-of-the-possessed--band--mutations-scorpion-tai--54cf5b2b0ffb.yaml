# --- Authored scenarios ---
# "The model gains one additional Strength 5 attack in each close-combat phase": the printed
# extra attack is evidenced by the pool carrying one attack die more than the same recipient
# without the mutation; every attack is a miss so the pool is the only difference.
- audit_id: rule/trollheim/trollheim-cult-of-the-possessed/band--mutations-scorpion-tail/trait.scorpion-tail
  id: the-tail-adds-an-attack-to-every-close-combat-phase
  covers: [whole--scope--scorpion-tail]
  fighters:
    first:
      collection: trollheim
      band_id: trollheim-cult-of-the-possessed
      profile_id: mutants
      special_rule_ids: [band--mutations-scorpion-tail]
      main_weapon_id: weapon.mace
    second:
      main_weapon_id: weapon.mace
      characteristics: &plain-ws3-s3-t3-w2-i2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: &charging-first {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.first.attack.1.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: false, attacks.1.hit: false, attacks.2.hit: false, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The same recipient keeps its printed single attack when a different mutation is selected.  The
# Mutant may not be recruited with no mutation at all (`requiredInitial`), so the control carries
# the neutral Acid Blood instead.
- audit_id: rule/trollheim/trollheim-cult-of-the-possessed/band--mutations-scorpion-tail/trait.scorpion-tail
  id: without-the-mutation-the-bearer-keeps-one-attack
  covers: [whole--scope--scorpion-tail]
  fighters:
    first:
      collection: trollheim
      band_id: trollheim-cult-of-the-possessed
      profile_id: mutants
      special_rule_ids: [band--mutations-acid-blood]
      main_weapon_id: weapon.mace
    second:
      main_weapon_id: weapon.mace
      characteristics: *plain-ws3-s3-t3-w2-i2
  duel_context: *charging-first
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: false, attacks.1.hit: false, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# "Against a model immune to poison, this attack is Strength 2 instead."  The tail is the pool's
# second attack (attack.1).  Against the Vampire Bat (printed T3, W2 and Immune to Poison) the tail
# strikes at S2, so a wound roll of 3 fails (S2 v T3 wounds on 5+).  Charging a Fear-causing model asks
# the Mutant for a charge Fear test; the double one passes it.  Every other attack misses.
- audit_id: rule/trollheim/trollheim-cult-of-the-possessed/band--mutations-scorpion-tail/trait.scorpion-tail
  id: against-a-poison-immune-model-the-tail-strikes-at-strength-two
  covers: [whole--scope--scorpion-tail]
  fighters:
    first:
      collection: trollheim
      band_id: trollheim-cult-of-the-possessed
      profile_id: mutants
      special_rule_ids: [band--mutations-scorpion-tail]
      main_weapon_id: weapon.mace
    second: {collection: trollheim, band_id: chaos-streets-undead-bloodlines, profile_id: vampire-bat}
  duel_context: *charging-first
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.fear.charge.0, value: 1}
    - {key: round.0.first.fear.charge.1, value: 1}
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.first.attack.1.hit, value: 4}
    - {key: round.0.first.attack.1.wound, value: 3}
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.0.second.attack.1.hit, value: 1}
  expect_rounds:
    0: {attacks.1.hit: true, attacks.1.wounded: false, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# Contrast: the same tail against a T3 defender that is not immune to poison strikes at the printed
# S5, so the identical wound roll of 3 wounds (S5 v T3 wounds on 3+).  A 3 is the discriminating face:
# it separates S5 from S2, and the Mutant's own S3 mace would not wound with it either.
- audit_id: rule/trollheim/trollheim-cult-of-the-possessed/band--mutations-scorpion-tail/trait.scorpion-tail
  id: against-a-model-not-immune-to-poison-the-tail-strikes-at-strength-five
  covers: [whole--scope--scorpion-tail]
  fighters:
    first:
      collection: trollheim
      band_id: trollheim-cult-of-the-possessed
      profile_id: mutants
      special_rule_ids: [band--mutations-scorpion-tail]
      main_weapon_id: weapon.mace
    second:
      main_weapon_id: weapon.mace
      characteristics: *plain-ws3-s3-t3-w2-i2
  duel_context: *charging-first
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.first.attack.1.hit, value: 4}
    - {key: round.0.first.attack.1.wound, value: 3}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.1.hit: true, attacks.1.wounded: true, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
