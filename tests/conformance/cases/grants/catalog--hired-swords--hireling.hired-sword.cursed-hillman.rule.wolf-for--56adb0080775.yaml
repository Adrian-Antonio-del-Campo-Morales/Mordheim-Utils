# Wolf Form selected: the compiled werewolf has no cloak save and is offered no armour die.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.cursed-hillman.rule.wolf-form/wolf-form-no-cloak
  id: the-werewolf-has-no-cloak-save-and-is-offered-no-armour-die
  fighters:
    first:
      collection: mordheim
      band_id: hirelings.hired-sword.2a
      profile_id: hireling.hired-sword.cursed-hillman
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
      special_rule_ids: [hireling.hired-sword.cursed-hillman.rule.wolf-form]
    second:
      &opponent
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  initial_state: {first: {attacks: 0}}
  duel_context: &hillman-charges {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.attack.0.hit, value: 4}
    - {key: round.0.second.attack.0.wound, value: 5}
  expect_fighters:
    first.natural_armour_save: 7
    first.armour_save: 7
  expect_initial: {first.hillman_wolf: True}
  expect_rounds:
    0: {attacks.0.hit: true, attacks.0.saved: false, attacks.0.damage: 1, state.first.wounds: 2, state.first.hillman_wolf: True}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

