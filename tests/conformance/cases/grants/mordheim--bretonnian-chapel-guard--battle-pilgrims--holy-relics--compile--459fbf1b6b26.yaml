#   otherwise apply.  Frenzied, he is immune to it, so both of his missed first-turn blows stand and
#   the strict tape declares no reroll die; an engine that offered the Hatred reroll fails the case.
#   The opponent carries no Fear so that no separate psychology test enters the tape.
