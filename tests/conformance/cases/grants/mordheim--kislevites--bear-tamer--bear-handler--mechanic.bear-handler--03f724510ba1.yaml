# AUTHORED[handler-leadership--scope--stupidity-waiver]: 2 scenarios read the printed waiver through the canonical handler-only Leadership source the record's own inherited contract assigns to mechanic.handler-leadership; the band binding is the pending connection the register names.  The bearer is the printed Trained Bear (Leadership 6) and the supplied handler value is the printed Bear Tamer's Leadership 7: a declared stupidity total of seven passes because the handler's value is the one tested, and the same seven fails against the bear's own 6 when no value is supplied, which cancels the charge.  The 2026-11-16 additions place the band's real Bear Tamer as a nearby participant, so the printed 6-inch range and the printed "even if the Tamer has been Knocked Down" parenthesis are now asserted (Stunned is not supplied).  REVIEWED still requires manual semantic review.
