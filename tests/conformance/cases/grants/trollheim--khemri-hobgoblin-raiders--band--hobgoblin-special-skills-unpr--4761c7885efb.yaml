- audit_id: rule/trollheim/khemri-hobgoblin-raiders/band--hobgoblin-special-skills-unpredictable/mechanic.unpredictable-attack
  id: a-declared-unpredictable-attack-cannot-be-parried
  fighters:
    first:
      collection: trollheim
      band_id: khemri-hobgoblin-raiders
      profile_id: khann
      special_rule_ids: [band--hobgoblin-special-skills-unpredictable]
      main_weapon_id: weapon.mace
    second:
      main_weapon_id: weapon.sword
      characteristics: &ws3-s3-t3-w2-i2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.unpredictable-attack.0, value: true}
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.parried: false, state.second.wounds: 1, state.second.parries_remaining: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# "one of its attacks": the Khann carries a mace and an off-hand dagger, so it makes two attacks.  It
# declares its first attack Unpredictable; only one attack may be declared, so the second is not offered
# the declaration.  The sword-armed defender has one parry.  Both attacks hit; the declared first
# attack cannot be parried and goes on to wound, while the undeclared second attack is parried with the
# defender's single parry.  The first attack is the one declared because, were the second declared, the
# single parry would already be spent on the first and the observation would be confounded.
- audit_id: rule/trollheim/khemri-hobgoblin-raiders/band--hobgoblin-special-skills-unpredictable/mechanic.unpredictable-attack
  id: only-the-declared-one-of-its-attacks-escapes-the-parry
  fighters:
    first:
      collection: trollheim
      band_id: khemri-hobgoblin-raiders
      profile_id: khann
      special_rule_ids: [band--hobgoblin-special-skills-unpredictable]
      main_weapon_id: weapon.mace
      off_hand_id: weapon.dagger
    second:
      main_weapon_id: weapon.sword
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.unpredictable-attack.0, value: true}
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.1.hit, value: 4}
    - {key: round.0.first.attack.1.parry, value: 5}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.parried: false, attacks.1.parried: true, state.second.wounds: 2,
        state.second.parries_remaining: 0}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

