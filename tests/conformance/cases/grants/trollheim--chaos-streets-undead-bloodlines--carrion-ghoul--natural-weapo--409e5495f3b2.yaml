# Natural Weapons family model (B12, 2026-11-18).  The KB binds profile.equipment-restrictions with forbids
#   [weapons, armour] (the Strigoi adds 'equipment'); the sibling effect profile.natural-attacks is
#   covered.elsewhere because the compiler resolves a weaponless profile whose binding forbids 'weapons' to
#   weapon.natural-attacks (compiler.py: `weaponless`, a profile with no equipment lists and the default
#   dagger).  ADMISSION: the recipient built with no equipment compiles and its main weapon is the natural
#   attack, asserted on the compiled snapshot (expect_fighters first.main_weapon.tags.0: weapon.natural-
#   attacks) in the corpus's construction-only shape (no charge, bearer out before the first phase, no die
#   requested).  REFUSALS: a held weapon is refused by the shared eligibility stage's boundEquipment token
#   loop (equipmentIssue, `"${token}" is forbidden for ${band}/${profile}.`) and armour by the same stage's
#   armour check (`armour is forbidden for ${who}`), which runs before the token loop
#   (packages/typescript/domain/eligibility/index.ts).  The weapon is weapon.sword, not weapon.dagger: an
#   explicit dagger is indistinguishable from the build's default and is resolved to natural attacks instead
#   of refused (implicitWeapon stage), so a dagger could not evidence the ban.

# Removal-probe expectation (2026-11-18): this is a construction rule, so the refusals are its own effect
#   and a construction-only verdict is expected (README, Rule-removal probe).  The admission is also
#   sensitive: without the binding the compiler no longer reads `weaponless`, so the default dagger would
#   stand and first.main_weapon.tags.0 would not be weapon.natural-attacks.

# --- Authored scenarios ---
# Derived from the KB record, the profile row and the eligibility gate's message templates; no engine output
#   was consulted.

- audit_id: rule/trollheim/chaos-streets-undead-bloodlines/carrion-ghoul--natural-weapons/profile.equipment-restrictions
  id: carrion-ghoul-with-a-weapon-is-refused
  # A held weapon: the Carrion Ghoul never uses weapons, so the sword in the main hand is refused by the
  # 'weapons' token.
  fighters:
    first:
      collection: trollheim
      band_id: chaos-streets-undead-bloodlines
      profile_id: carrion-ghoul
      main_weapon_id: weapon.sword
  expect_error: '"weapons" is forbidden for chaos-streets-undead-bloodlines/carrion-ghoul.'

- audit_id: rule/trollheim/chaos-streets-undead-bloodlines/carrion-ghoul--natural-weapons/profile.equipment-restrictions
  id: carrion-ghoul-with-armour-is-refused
