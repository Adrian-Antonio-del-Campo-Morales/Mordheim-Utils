#
# AUTHORED: the printed rule ("Stunned Injury results become Knocked Down through No Pain; the source
#   expressly combines her Jump Up skill with No Pain so those Knocked Down Injury results do not leave
#   her prone") binds three mechanics: skill.ignore-pain (this identity), skill.jump-up and
#   mechanic.marianna-no-pain-jump-up.  This binding's own contract is the Injury-table conversion
#   Stunned -> Knocked Down (packages/python/combat-engine/mordheim_combat/phases.py injury_condition,
#   ignore_pain); on this profile the sibling combination mechanic then turns that Knocked Down into
#   Standing (modular/attacks.py, which requires all three tags).  The observable face of this binding
#   is therefore "not Stunned": with it removed the Stunned face stands (neither sibling reads a Stunned
#   result), so the scenario discriminates; the Knocked Down -> Standing step is evidenced by the
#   sibling identity's file (…rule.no-pain/mechanic.marianna-no-pain-jump-up).
#
# Hireling family model (P0, 2026-11-17) in the Cairn Wraith No Pain shape.  The recipient is the
# printed profile compiled through the hireling route (hirelings.dramatis-personae.1a /
# hireling.dramatis.countess-marianna-chevaux-vampire-assassin) with the fixture characteristics
# (WS3 S3 T3 I5 A1) and wounds 1 so the first wound reaches the Injury table; she contributes no attack
# of her own (initial_state).  The attacker is the stronger hand-built fixture (WS10 S8 I10, mace): 3+
# to hit, 2+ to wound with no critical face, and a Strength of twice hers makes her rapier's parry
# ineligible, so no parry die is requested.  Her other printed abilities on this tape: Step Aside is a
# 5+ special save against every close combat wound, so one ward die
# (round.0.first.attack.0.special.ward) is declared and fails on 1 after the wound; she wears no
# armour; Causes Fear only tests a charging attacker and nobody charges; she is immune to psychology;
# the garlic coating acts only when she strikes a Vampire.  The control is the grade-1b Bard (dagger;
# kit armour owned, not worn) with the same fixture; the refusal selects the printed rule on the Bard.

