# Rule (grade-1c.yaml, hireling.dramatis.belandysh-condemned-champion-of-chen.rule.regeneration,
# grant profile): "Regenerates wounds on source 4+ except fire/fire magic" - binding
# trait.regeneration-blocked-by-fire, parameters value true (the 4+ is the sibling
# trait.regeneration-save).  Ruling: design-rulings.md "Fire and other synthetic hits are hits" (a
# fire hit is an ordinary hit against which the victim keeps its real defences; the Curse of the
# Revenant ruling expressly refuses to reuse ordinary regeneration's fire prohibition, which is what
# this binding is).  Compiler: the trait lands as regeneration_blocked_by_fire (compiler.py ~495) and
# is projected onto global_effects.regeneration_blocked_by_fire (~1238).  Engine: contexts.py
# prepare_special_save_context (~686-689) sets regeneration_blocked when the defender's flag meets an
# incoming attack tagged attack.fire, and phases.py resolve_special_save (~676-681) then asks no
# round.<i>.<attacker>.attack.<n>.special.regeneration die.  The brazier iron is the catalogue's fire
# producer (execution.yaml weapon.brazier-iron: attack.fire, strength_bonus 1, two_handed,
# ignition_threshold 5; its ignition die modular/attacks.py ~491-496 follows the hit).
# Hireling family model (README, Hireling recipients): the real Belandysh through the hireling route
# (hirelings.dramatis-personae.1c) with the fixture facts (WS3 S3 T3 W2 I5 A1; printed Ld10 stays)
# and his complete printed kit active (broadsword, Chaos Armour, helmet).  The attacker is hand-built
# (WS3 S3 T3 W3 I2 A1 Ld7) with the brazier iron (strikes at Strength 4: Toughness 3 wounded on 3+,
# the Chaos Armour's 4+ read 5+) or, for the non-fire control, a mace at Strength 4.  Dice:
# Belandysh's I (6), his A (D3: 1), his WS (3) before his hit (1, a miss), then the enemy's hit (4),
# the ignition die (1) where the weapon burns, Belandysh's T (3) when the wound is rolled, the wound
# (4), the Chaos Armour die (1, a failure under either weapon) and then the regeneration die where
# one is owed.  The unblocked control is a hand-built fixture given regeneration 4+ through
# trait_overrides without the fire block, silenced.

# A fire attack beats the armour and no regeneration die is asked: the strict tape ends at the
# armour die and the wound is taken.
- audit_id: rule/catalog/dramatis-personae/hireling.dramatis.belandysh-condemned-champion-of-chen.rule.regeneration/trait.regeneration-blocked-by-fire
  id: a-fire-attack-is-followed-by-no-regeneration-die
  fighters:
    first:
      &fire-attacker
      main_weapon_id: weapon.brazier-iron
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
    second:
      &belandysh-fire-recipient
      collection: mordheim
      band_id: hirelings.dramatis-personae.1c
      profile_id: hireling.dramatis.belandysh-condemned-champion-of-chen
      main_weapon_id: weapon.broadsword-of-damnation
      armour_id: armour.chaos-armour
      defence_ids: [defence.helmet]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
  duel_context: &uncharged {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.characteristic.I.0, value: 6}
    - {key: round.0.second.characteristic.A.0, sides: 3, value: 1}
    - {key: round.0.second.attack.0.attacker.characteristic.WS.0, value: 3}
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.ignition, value: 1}
    - {key: round.0.first.attack.0.defender.characteristic.T.0, value: 3}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.armour, value: 1}
  expect_fighters:
    second.global_effects.regeneration_blocked_by_fire: True
    second.global_effects.regeneration_save: 4
  expect_rounds:
    0: {attacks.0.hit: false, attacks.1.wounded: true, attacks.1.saved: false, attacks.1.damage: 1, state.second.wounds: 1, state.second.on_fire: false}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

