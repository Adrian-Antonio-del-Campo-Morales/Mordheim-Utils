# The unblocked control: a fixture regenerating on 4+ without the fire block is still asked its die
# under the same fire attack, and the four turns the wound.
- audit_id: rule/catalog/dramatis-personae/hireling.dramatis.belandysh-condemned-champion-of-chen.rule.regeneration/trait.regeneration-blocked-by-fire
  id: a-regenerator-without-the-fire-block-is-still-asked-its-die-under-fire
  fighters:
    first: *fire-attacker
    second:
      main_weapon_id: weapon.mace
      trait_overrides: {regeneration_save: 4}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 7}
  initial_state: {second: {attacks: 0}}
  duel_context: *uncharged
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.ignition, value: 1}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.special.regeneration, value: 4}
  expect_fighters:
    second.global_effects.regeneration_blocked_by_fire: False
  expect_rounds:
    0: {attacks.0.wounded: true, attacks.0.saved: true, attacks.0.damage: 0, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

