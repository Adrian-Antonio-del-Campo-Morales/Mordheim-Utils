# Printed text (grade-2b.yaml, Strictures): "Priests of Morr always begin equipped with a scythe and a
# dagger. They may only be armed with a scythe and dagger. Priests of Morr may never wear armour."  The
# binding forbids the `armour` token.  The recipient is the printed Priest compiled through the hireling
# route (hirelings.hired-sword.2b / hireling.hired-sword.priest-of-morr-miracle-workers) with the
# fixture facts (WS3 S3 T3 W2 I5 A1; the printed Ld8 stays).  Admissions use the corpus's
# construction-only shape (no charge, the bearer out of action before the first phase, so the duel
# requests no die) and observe the compiled build alone: armour_save 7 is the no-armour face.  The
# refusals use the kit-resolver fragment already asserted in cases/mechanics/defence.wolf-pelt-cloak.yaml.
# The Haunted Mien route that lifts these strictures (ruling "Haunted Mien lifts the Priest kit
# restriction - 2026-10-15") is evidenced in the B00 file of that Mark and is not duplicated here; the
# same ruling keeps the strictures on an unmarked Priest and on an Augur, which the last scenario shows.

# The printed kit, the ceremonial dagger in hand: no armour, so the compiled save is the 7 of a bare
# warrior.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.priest-of-morr-miracle-workers.rule.strictures/profile.equipment-restrictions
  id: the-printed-dagger-compiles-with-no-armour
  fighters:
    first:
      collection: mordheim
      band_id: hirelings.hired-sword.2b
      profile_id: hireling.hired-sword.priest-of-morr-miracle-workers
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
      main_weapon_id: weapon.dagger
    second: &opponent
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: &construction-only {charging: [], active_participant: first}
  initial_state: &bearer-out {first: {condition: OUT}}
  expect_fighters:
    first.armour_save: 7

# The printed kit, the ceremonial scythe in hand (the source-qualified Strength +1, two-handed,
