#
# AUTHORED: the printed rule ("Ignores Knocked Down and Stunned Injury results. He must lose his last
#   Wound AND receive an Out of Action Injury result to be removed; losing that Wound alone is not
#   automatic removal") is a profile grant of mechanic.veskit-no-pain, whose contract replaces any
#   aggregated Injury condition other than Out of Action with Standing
#   (packages/python/combat-engine/mordheim_combat/modular/attacks.py).
#
# Hireling family model (P0, 2026-11-17) in the Cairn Wraith No Pain shape.  The recipient is the
# printed profile compiled through the hireling route (hirelings.dramatis-personae.2a /
# hireling.dramatis.sigmund-spindle-the-harvester-of-flesh) with the fixture characteristics
# (WS3 S3 T3 I5 A1) and wounds 1 so the first wound reaches the Injury table; it contributes no attack
# of its own (initial_state attacks 0, which his printed Frenzy doubles to nothing).  The attacker is
# the stronger hand-built fixture (WS10 S8 I10, mace): 3+ to hit, 2+ to wound with no critical face.
# Sigmund's other printed abilities on this tape: Step Aside is a 5+ special save against every close
# combat wound, so one ward die (round.0.first.attack.0.special.ward) is declared and fails on 1 after
# the wound; his scythe has no parry; Causes Fear only tests a charging attacker and nobody charges;
# Lightning Reflexes and Dodge need his own strike or a missile.  The control is the grade-1b Bard
# (dagger; kit armour owned, not worn) with the same fixture; the refusal selects the rule on the Bard.

