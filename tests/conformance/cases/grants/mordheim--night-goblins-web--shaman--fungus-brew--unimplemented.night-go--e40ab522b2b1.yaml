# "4 Numbed = +1 armour save, which may not be reduced below 6+".  The affected duelist wears no armour, so
# the printed +1 is the only save it has; the attacker's Strength 6 would take that save past 6+, and the
# printed limit is what keeps a six saving.  A consumer that granted the bonus without the floor asks for no
# armour die at all and leaves the declared one unconsumed, which the strict tape fails; the printed bonus
# and its printed limit are therefore both read in this one blow.
