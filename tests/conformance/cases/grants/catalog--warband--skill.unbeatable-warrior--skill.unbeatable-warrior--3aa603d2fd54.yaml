# --- Authored scenarios ---
# Family model (Unbeatable Warrior, catalogue row): the catalogue skill row is not bound to a band, so
# the bearer is a hand-built fighter carrying the admitted skill identity, as the accepted
# mechanic-level scaffold does.  Physical characteristics are supplied as fixture facts
# (WS3 S3 T3 W2 I2 A1) so the dice thresholds and the strike order are fixed; the bearer holds two
# parrying swords, which is the printed condition for the second attempt, and its base Attack pool is
# zeroed, with the off-hand's extra attack scripted as a natural 1, so the tape holds the parry under
# test.  Every expectation is read from the
# printed rule (improves parries and allows two parries with two Parry weapons) and the recorded
# register note that the same flag also enables the match-roll parry, never from engine output; the
# roll tape is derived statically and stays unexecuted.  The pool's two To-Hit rolls are declared
# before the two parry attempts, following the family's authored tape convention.

# The printed allowance: two parrying weapons and the skill grant two attempts, so both attacks of
# the pool are blocked.
- audit_id: rule/catalog/warband/skill.unbeatable-warrior/skill.unbeatable-warrior
  id: two-parrying-weapons-give-two-parry-attempts
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 2}
    second:
      main_weapon_id: weapon.sword
      off_hand_id: weapon.sword
      skill_ids: [skill.unbeatable-warrior]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.1.hit, value: 4}
    - {key: round.0.first.attack.0.parry, value: 5}
    - {key: round.0.first.attack.1.parry, value: 5}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.parried: true, attacks.1.parried: true, state.second.parries_remaining: 0, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

