# Printed carrier: Pirates of the Cathayan Sea, Dragon Monk, Art of Silent Death (grant profile, rule_ref
# shared-rule.dragon-monk-art-of-silent-death) binding skill.unarmed-critical-strikes: the monk's unarmed
# attacks cause critical hits on a To Wound roll of 5+.  Consumer: modular/contexts.py ~744-745 -
# `critical_threshold = 5 if (... has_tag(effect, "skill.unarmed-critical-strikes") and weapon in
# (weapon.fist, weapon.natural-attacks) ...) else 6`.  Model: the AUTHORED Battle Monks file
# (...7a85e70daed5).  The recipient is the printed Dragon Monk (fixture WS3 S3 T3 W2 I5 A1, the printed
# Ld8 stays) with main_weapon_id weapon.fist; his profile also prints Unarmed Mastery (skill.unarmed-fighting:
