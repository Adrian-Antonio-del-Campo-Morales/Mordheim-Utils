# swing is a declared 1.

# The printed Dragon Monk: two fist attacks (Unarmed Mastery's +1), the first hits and its To Wound five is
# a critical (chart die 2: damage 2); no armour die is asked because his unarmed penalties are removed.
- audit_id: rule/mordheim/pirates-of-the-cathayan-sea-sar/dragon-monk--art-of-silent-death/skill.unarmed-critical-strikes
  id: the-printed-dragon-monk-criticals-on-an-unarmed-five
  fighters:
    first:
      collection: mordheim
      band_id: pirates-of-the-cathayan-sea-sar
      profile_id: dragon-monk
      main_weapon_id: weapon.fist
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      &opponent
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.1.hit, value: 1}
    - {key: round.0.first.attack.0.wound, value: 5}
    - {key: round.0.first.attack.0.critical, value: 2}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.critical: true, attacks.0.damage: 2, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

