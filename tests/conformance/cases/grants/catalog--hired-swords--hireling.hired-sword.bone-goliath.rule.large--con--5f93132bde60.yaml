# --- Authored scenarios ---
# Hireling family model (P0, 2026-11-17), Large variant.  The recipient is the printed Bone
# Goliath (band_id hirelings.hired-sword.1c), fixture characteristics WS3 S3 T3 W2 I5 A1 with the
# printed Ld6; the kit's innate weapon.natural-attacks is declared as the main weapon and the kit
# holds no armour, so being wounded requests no armour die.  The printed grant ("Counts as a
# large target.") binds condition.large-target, whose execution entry tags the bearer
# [size.large] (uniform Large Target binding, design ruling 2026-11-18); the printed shooting
# consequences stay excluded as out-of-scope.shooting and are not asserted here.  The observer is
# a hand-built charger carrying the printed Slay Large Creature bonus through skill_ids ("+1S
# when charging a Large sized creature").  Arithmetic: S3 wounds T3 on 4+, the +1S of the charge
# against a Large target (S4 vs T3) on 3+, so the declared wound roll of 3 separates recipient
# and control.  Profile-specific dice (per the Bone Goliath's cause-fear sibling): the Undead
# construct causes fear, so the charger (Ld7) declares the 2D6 charge test and 3+3 passes; its
# Undead Construct and No Pain conversions act on Injury results only and the fixture keeps the
# victim at one remaining wound, so no injury die is requested; its Psychology and Poison
# immunities read its own tests, none of which this tape requests.  The recipient's own blows are
# silenced (attacks: 0).  The refusal picks the plain grade-1c Pyromaniac (verified compiling in
# its authored crazed-firestarter file): a profile-granted rule is not available elsewhere.

# The Slay Large Creature charger wounds the Large Bone Goliath on a 3 (S4 vs T3 after the charge bonus).
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.bone-goliath.rule.large/condition.large-target
  id: a-slay-large-creature-charger-wounds-the-large-bone-goliath-on-a-3
  fighters:
    first:
      &charger
      main_weapon_id: weapon.mace
      skill_ids: [rule.slay-large-creature]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
    second:
      collection: mordheim
      band_id: hirelings.hired-sword.1c
      profile_id: hireling.hired-sword.bone-goliath
      main_weapon_id: weapon.natural-attacks
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    # The Bone Goliath causes fear: the charger's 2D6 charge test of 3+3 passes Ld7.
    - {key: round.0.first.fear.charge.0, value: 3}
    - {key: round.0.first.fear.charge.1, value: 3}
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 3}
  expect_rounds:
    0: {attacks.0.hit: True, attacks.0.wounded: True, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The control: a hand-built opponent without the Large rule, so the same charge carries no bonus
# and the same 3 does not wound (S3 vs T3 needs 4+).  It causes no fear and wears no armour, so
# no other die is requested.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.bone-goliath.rule.large/condition.large-target
  id: without-the-large-rule-the-same-three-fails
  fighters:
    first:
      <<: *charger
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 7}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 3}
  expect_rounds:
    0: {attacks.0.hit: True, attacks.0.wounded: False, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The printed grant belongs to the recipient's profile; selecting it on another hireling of the
# same grade-1c package (the Pyromaniac, whose printed kit holds no close-combat weapon, so no
# main weapon is declared) is refused.
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.bone-goliath.rule.large/condition.large-target
  id: the-rule-is-refused-on-a-hireling-outside-its-printed-profile
  fighters:
    first:
      collection: mordheim
      band_id: hirelings.hired-sword.1c
      profile_id: hireling.hired-sword.pyromaniac
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
      special_rule_ids: [hireling.hired-sword.bone-goliath.rule.large]
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 7}
  expect_error: "special rule is not available to hirelings.hired-sword.1c"
