# The printed grant belongs to the Centaur's profile; selecting it on a hireling of another package
# is refused by the compiler (the band-only fragment).
- audit_id: rule/catalog/hired-swords/hireling.hired-sword.chaos-centaur.rule.drunken/mechanic.centigor-drunken
  id: the-rule-is-refused-on-a-hireling-outside-the-centaurs-package
  fighters:
    first:
      <<: *control
      special_rule_ids: [hireling.hired-sword.chaos-centaur.rule.drunken]
    second: *opponent
  expect_error: "special rule is not available to hirelings.hired-sword.1b"
