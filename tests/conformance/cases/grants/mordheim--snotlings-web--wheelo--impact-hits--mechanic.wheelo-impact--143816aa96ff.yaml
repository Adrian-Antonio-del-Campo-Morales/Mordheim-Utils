# --- Authored scenarios ---
# Derived from the printed rule, the recorded contract and the band package; no engine output was
# consulted.  The impact block runs before the strike sequence, asks no To Hit die, and its count is
# the printed D3; the crew's own two printed attacks follow on the knocked-down target.
- audit_id: rule/mordheim/snotlings-web/wheelo--impact-hits/mechanic.wheelo-impact
  id: a-charging-wheelo-deals-its-impact-hits-before-any-blow
  fighters:
    first:
      collection: mordheim
      band_id: snotlings-web
      profile_id: wheelo
      main_weapon_id: weapon.dagger
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 2, attacks: 1}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.impact-count, value: 1}
    - {key: round.0.first.impact.0.wound, value: 4}
    - {key: round.0.first.impact.0.injury.0, value: 2}
    - {key: round.0.first.attack.0.wound, value: 1}
    - {key: round.0.first.attack.1.wound, value: 1}
  expect_rounds:
    0: {attacks.0.hit: true, attacks.0.wounded: true, attacks.0.damage: 1,
        state.second.condition: KNOCKED_DOWN, state.first.resources_spent: ['wheelo.first-impact']}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

