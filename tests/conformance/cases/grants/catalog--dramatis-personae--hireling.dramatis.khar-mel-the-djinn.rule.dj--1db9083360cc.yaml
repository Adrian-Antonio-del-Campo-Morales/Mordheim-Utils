# Printed text (grade-1b.yaml, Djinn's Luck): "At own Recovery may choose one power until next own
# Recovery, never the same power on consecutive turns. Luck grants a 4+ Ward when an ordinary save
# applies, otherwise 6+ (including magical weapons)."  Both powers bind the one mechanic
# mechanic.djinns-curse, which is the power choice itself (modular/rounds.py ~613-626: decision
# round.<i>.<side>.djinn-power.curse first, then .luck when the curse was declined; the chosen power
# projects condition.djinns-luck-active on the Djinn until its next own Recovery).  The Luck
# condition is read by modular/contexts.py ~681-685: the ward threshold becomes 4 where the Djinn's
# intrinsic 5+ applies, and 6 where that ward is blocked (a magical attack, since the intrinsic 5+
# is mundane-only); under Luck the ward is an ordinary modifiable save, not the intrinsic
# unmodifiable one (ruling "Djinn's Curse respects expressly unmodifiable saves", 2026-10-15).
# Hireling family model: the recipient is the printed Khar-Mel compiled through the hireling route
# (hirelings.dramatis-personae.1b / hireling.dramatis.khar-mel-the-djinn) with the fixture facts
# (WS3 S3 T3 W2 I5 A1; the printed Ld8 stays); his kit sword is the omitted default.  The power is
# chosen at the Djinn's own Recovery, so the Djinn is the active charger (first), contributes no
# swing, and the charged opponent tests Fear (3+3 passes Ld7).  The opponent is hand-built (mace,
# WS3 S3 T3 W3 I2 A1 Ld7), magical where the printed "including magical weapons" face is at stake.
# Its hit (a four) opens the Djinn's sword parry window: the parry die round.0.second.attack.0.parry
# is declared as a one (it must beat the hit roll) so the wound resolves; the Djinn wears no armour
# so the ward die round.0.second.attack.0.special.ward is the only save.  Wound dice are fours.
# Semantic wrinkle (2026-11-18): the "never the same power on consecutive turns" clause is evidenced
#   on the Curse sibling (...bcbb031a0516) through the same mechanic; Luck's own consecutive-turn
#   face is not duplicated here.

# Luck chosen: the mundane hit meets a 4+ ward and the four saves (the intrinsic 5+ would not).
