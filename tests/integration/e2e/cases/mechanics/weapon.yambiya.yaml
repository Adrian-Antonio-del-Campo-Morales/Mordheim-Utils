# --- Authored scenarios ---
# mechanic/weapon.yambiya - the dagger-like target save and the blade family.
#
# Expectations come from the printed rule and the admitted clause, never from
# engine output.  The save scenarios reuse the shared dagger facet the register
# verifies; the membership scenarios assert only the printed consequence, the
# point of Weapon Skill that Knife Fighting limits to its blade family.
# The printed +1 turns the worn 5+ into a 4+, and that face now saves.
- audit_id: mechanic/weapon.yambiya
  id: yambiya-improves-a-worn-save-by-one
  covers: [whole]
  fighters:
    first:
      main_weapon_id: weapon.yambiya
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      armour_id: armour.heavy-armour
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 5}
    - {key: round.0.first.attack.0.wound, value: 5}
    - {key: round.0.first.attack.0.armour, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.saved: True, attacks.0.damage: 0, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
