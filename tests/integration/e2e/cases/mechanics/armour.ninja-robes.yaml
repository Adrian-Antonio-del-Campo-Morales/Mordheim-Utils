# --- Authored scenarios ---
# mechanic/armour.ninja-robes — the 6+ save and its threshold boundary.
#
# Expectations come from the printed rule and the accepted clause
# `six-plus-no-shield` of docs/knowledge/2a2b/tasks/T13-semantic-analysis.csv,
# never from engine output: ninja robes count as toughened leathers and save
# an incoming close-combat wound on a 6 before Strength modifiers.  An
# unmodified Strength 3 attacker applies no save modifier, so the boundary is
# exactly 6: the six holds, the five fails.  The shield prohibition is not
# asserted here (see the clause marker).
#
# The first scenario declares the shared profiles as YAML anchors; the sibling
# aliases them and keeps its own armour face and expectation.

- audit_id: mechanic/armour.ninja-robes
  id: ninja-robes-save-holds-on-six
  covers: [six-plus-no-shield]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: &attacker-ws3-s3-t3-w2-i5 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      armour_id: armour.ninja-robes
      characteristics: &defender-ws3-s3-t3-w2-i2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: &charging-first {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.armour, value: 6}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.saved: true, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# One face below the printed target: the five is not a 6+, so the wound is
# taken and the defender drops a wound.  No other armour face is scripted.

- audit_id: mechanic/armour.ninja-robes
  id: ninja-robes-save-fails-on-five
  covers: [six-plus-no-shield]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: *attacker-ws3-s3-t3-w2-i5
    second:
      main_weapon_id: weapon.mace
      armour_id: armour.ninja-robes
      characteristics: *defender-ws3-s3-t3-w2-i2
  duel_context: *charging-first
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.armour, value: 5}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.saved: false, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The clause's second half is a loadout prohibition, not an in-duel effect: a
# robe-and-shield build must be refused at construction, and the declared
# expect_error contract requires that the refusal name the authored reason.
# The eligibility layer answers for both ninja robes and toughened leathers.

- audit_id: mechanic/armour.ninja-robes
  id: ninja-robes-refuse-a-shield-loadout
  covers: [six-plus-no-shield]
  fighters:
    first:
      main_weapon_id: weapon.mace
      armour_id: armour.ninja-robes
      off_hand_id: defence.shield
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
  expect_error: "toughened leathers cannot be combined with a shield"
