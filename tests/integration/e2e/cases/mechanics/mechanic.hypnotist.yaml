# --- Authored scenarios ---
# The Sleuth is the second fighter and hypnotises the opposing warrior before any blow
# is struck.  The two declared sixes total twelve against the target's Leadership 6 and
# fail it, so the target is entranced: its pool is suppressed entirely (the strict tape
# carries no die for it) while the Sleuth's own attack finds the printed "treated as
# knocked down for the purpose of being attacked" target, which is an automatic hit
# whose To Wound die still has to be rolled.  The trance is consumed by that attack, as
# the printed end condition says.
- audit_id: mechanic/mechanic.hypnotist
  id: a-failed-leadership-test-entrances-the-target
  covers: [hypnotist]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 6}
    second:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.hypnotist]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 6}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.second.hypnotist, value: true}
  rolls:
    - {key: round.0.second.hypnotist.0, value: 6}
    - {key: round.0.second.hypnotist.1, value: 6}
    - {key: round.0.second.attack.0.wound, value: 1}
  expect_rounds:
    0: {attacks.0.hit: true, attacks.0.knocked_down_target: true, attacks.0.wounded: false, state.first.wounds: 2, state.first.condition: STANDING, state.first.entranced: false}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

