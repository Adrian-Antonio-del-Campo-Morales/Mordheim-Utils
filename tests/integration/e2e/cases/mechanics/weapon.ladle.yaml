# --- Authored scenarios ---
# mechanic/weapon.ladle - mace profile that denies the target's worn armour while
# shields and skills keep their saving throws.
#
# Expectations come from the printed rule and the admitted clause `whole`, never
# from engine output.  The pair of save scenarios isolates the printed exception:
# the suit alone offers nothing and the shield alone offers its own save.
# The mace profile's Concussion band is carried by the ladle: the face of 2 is Stunned.

- audit_id: mechanic/weapon.ladle
  id: ladle-injury-2-is-stunned
  covers: [whole]
  fighters:
    first:
      main_weapon_id: weapon.ladle
      characteristics: &a-ws3-s3-t3-w2-i5 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: &d-ws3-s3-t3-w1-i2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.injury.0, value: 2}
  expect_rounds:
    0: {attacks.0.damage: 1, state.second.wounds: 0, state.second.condition: STUNNED}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
