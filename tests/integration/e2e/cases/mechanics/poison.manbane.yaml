# mechanic/poison.manbane - authored from the printed rule and the
# admitted `whole` clause, never from engine output.
# The poison adds one to the To Wound roll; the printed natural 1 always fails.
# The improved target is already the last reachable one, so the natural 1 is read
# against the same target the bonus produced.
- audit_id: mechanic/poison.manbane
  id: manbane-adds-one-to-the-wound-roll
  fighters:
    first:
      main_weapon_id: weapon.mace
      main_poison_id: poison.manbane
      characteristics: &mb-attacker {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: &mb-defender {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: &mb-context {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 3}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

