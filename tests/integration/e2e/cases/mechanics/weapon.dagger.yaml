# A worn 5+ suit saves on 4+ with this weapon.

- audit_id: mechanic/weapon.dagger
  id: dagger-improves-a-worn-save-by-one
  fighters:
    first:
      main_weapon_id: weapon.dagger
      characteristics: *atk-ws3-s3-t3-w2-i5
    second:
      main_weapon_id: weapon.mace
      armour_id: armour.heavy-armour
      characteristics: *dfn-ws3-s3-t3-w2-i2
  duel_context: *charging-first
  maximum_rounds: 1
  rolls:
