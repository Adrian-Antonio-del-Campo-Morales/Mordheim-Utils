#
# AUTHORED: 2 scenarios cover the charged warrior
#   acting before the charger by Initiative and the same duel without the
#   skill.

# --- Authored scenarios ---
# The warrior is charged and the rule gives him strike first against the model
# that charged, so both fighters stand in the strike-first tier and the printed
# tie-break is Initiative: the charged warrior's 5 beats the charger's 2 and he
# attacks first.
- audit_id: mechanic/skill.lightning-reflexes
  id: the-charged-warrior-acts-before-the-charger
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      skill_ids: [skill.lightning-reflexes]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.attack.0.hit, value: 4}
    - {key: round.0.second.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: True, attacks.0.damage: 1, state.first.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# The identical duel without the skill: the charge alone holds the strike-first
# tier, so the charger resolves before the higher Initiative, which isolates the
# reversal to the skill.
- audit_id: mechanic/skill.lightning-reflexes
  id: without-the-skill-the-charger-acts-first
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 4}
    - {key: round.0.second.attack.0.wound, value: 4}
  expect_rounds:
    0: {attacks.0.hit: False, attacks.1.damage: 1, state.first.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

