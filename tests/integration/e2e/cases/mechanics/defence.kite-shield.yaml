# The printed floor at its printed quantity: Att'la's plate mail (a printed 4+
# gromril suit), Cathayan quilted silk (printed +1, combines with any body armour)
# and the kite shield's printed +2 on foot compose exactly 1+, and the compiler
# carries that as the compiled armour_save 1.  The E01 composition channel
# (expect_fighters) observes the compiled quantity directly; the scripted armour
# die 2 only shows that the save still resolves - it holds under the compiled 1
# and under the executor's own max(2, target) floor alike.
- audit_id: mechanic/defence.kite-shield
  id: the-composed-floor-is-carried-as-the-compiled-armour-save
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: *attacker-ws3-s3-t3-w2-i5
    second:
      main_weapon_id: weapon.mace
      armour_id: armour.attlas-plate-mail
      defence_ids: [armour.cathayan-quilted-silk]
      off_hand_id: defence.kite-shield
      characteristics: *defender-ws3-s3-t3-w2-i2
  duel_context: *charging-first
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.armour, value: 2}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.saved: true, attacks.0.damage: 0}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
  expect_fighters:
    second.armour_save: 1
