# --- Authored scenarios ---
# The flail carries a first-round Strength bonus of two, which the printed rule
# keeps in later rounds for this bearer.  Round 0 is spent on misses, and the
# second round's wound die of three only wounds if the bonus is still there:
# Strength 2 + 2 against Toughness 3 needs a three, while the bare Strength 2
# would need a five.
- audit_id: mechanic/mechanic.retain-flail-morning-star-strength-bonus
  id: the-flail-strength-bonus-is-retained-in-the-second-round
  covers: [whole]
  fighters:
    first:
      main_weapon_id: weapon.flail
      skill_ids: [mechanic.retain-flail-morning-star-strength-bonus]
      characteristics: {weapon_skill: 3, strength: 2, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [second], active_participant: second}
  maximum_rounds: 2
  rolls:
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.1.first.attack.0.hit, value: 4}
    - {key: round.1.first.attack.0.wound, value: 3}
    - {key: round.1.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.wounds: 2}
    1: {attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 2, termination_reason: horizon}
