# --- Authored scenarios ---
# mechanic/material.obsidian — +1 Strength for attacks with the weapon.
#
# Expectations come from the printed rule and the accepted clause `whole` of
# docs/knowledge/2a2b/tasks/T13-semantic-analysis.csv, never from engine output:
# obsidian adds strength_bonus 1, so a Strength 3 bearer attacks at Strength 4
# and wounds Toughness 3 on a 3.  The two scenarios respect the wound chart
# boundary: a 3 wounds only with the bonus, and a 2 does not, excluding a +2
# reading.  The material is supplied on `main_material_id`.
#
# The first scenario declares the shared profiles as YAML anchors; the sibling
# aliases them and keeps its own wound face and expectation.

- audit_id: mechanic/material.obsidian
  id: obsidian-adds-one-strength
  covers: [whole]
  fighters:
    first:
      main_weapon_id: weapon.mace
      main_material_id: material.obsidian
      characteristics: &attacker-ws3-s3-t3-w2-i5 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: &defender-ws3-s3-t3-w2-i2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: &charging-first {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 3}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

- audit_id: mechanic/material.obsidian
  id: obsidian-does-not-add-two-strength
  covers: [whole]
  fighters:
    first:
      main_weapon_id: weapon.mace
      main_material_id: material.obsidian
      characteristics: *attacker-ws3-s3-t3-w2-i5
    second:
      main_weapon_id: weapon.mace
      characteristics: *defender-ws3-s3-t3-w2-i2
  duel_context: *charging-first
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 2}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 0, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
