# # The morning star prints its +1 Strength for the first round only, so in the later round
# # the same three no longer wounds Toughness 3.
- audit_id: mechanic/skill.tireless
  id: the-heavy-weapon-bonus-lapses-without-the-skill
  fighters:
    first:
      main_weapon_id: weapon.morning-star
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 2
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.1.first.attack.0.hit, value: 4}
    - {key: round.1.first.attack.0.wound, value: 3}
    - {key: round.1.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.wounds: 2}
    1: {attacks.0.damage: 0, state.second.wounds: 2}
  expect_final: {rounds_executed: 2, termination_reason: horizon}
