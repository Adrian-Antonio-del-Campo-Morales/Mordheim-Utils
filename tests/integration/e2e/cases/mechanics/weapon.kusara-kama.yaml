# Recovery between phases: the hamper lasts exactly one close-combat phase of the
# wielder.  In round 0 the declared five hampers the off hand and the defender's
# pool keeps one attack, so only one defender hit die is offered; the strict tape
# would reject a second one.  At the start of round 1 the printed reset fires, so
# the defender's pool is restored to both attack dice - the tape carries the two
# round-1 defender attacks and the penalty field reads 0.
