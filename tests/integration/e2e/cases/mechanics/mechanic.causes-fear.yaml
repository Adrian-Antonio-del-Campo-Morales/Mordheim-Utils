#
# AUTHORED: 3 scenarios cover the cancelled voluntary charge, the
#   sixes-to-hit consequence for the charged warrior and the exemption of a
#   fear-causing opponent.

# --- Authored scenarios ---
# The warrior who volunteers the charge must pass before contact exists; the two
# declared sixes fail his Leadership 6 and the charge is cancelled, so the round
# carries no attack.
- audit_id: mechanic/mechanic.causes-fear
  id: a-failed-charge-test-cancels-the-voluntary-charge
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 6}
    second:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.causes-fear]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 6}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.fear.charge.0, value: 6}
    - {key: round.0.first.fear.charge.1, value: 6}
  expect_rounds:
    0: {attacks: [], state.first_charged: False, state.failed_charges: ['first'], state.engaged: False, state.round_index: 1}
  expect_final: {rounds_executed: 1, termination_reason: disengaged}
# Here the charge succeeds, so the warrior who was charged tests instead; his failed
# test raises his own To Hit target to six for that combat round, and his declared
# five then misses where it would have hit a target of four.
- audit_id: mechanic/mechanic.causes-fear
  id: a-failed-charged-test-leaves-only-sixes-to-hit
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.causes-fear]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 6}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 6}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.fear.charged.0, value: 6}
    - {key: round.0.second.fear.charged.1, value: 6}
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 5}
  expect_rounds:
    0: {attacks.0.damage: 1, attacks.1.hit_target: 6, attacks.1.hit: False, state.second.fear_hit_sixes: True, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# The printed exception that fear-causing warriors ignore these tests: both fighters
# cause Fear, so neither Leadership test is requested and the tape opens with the
# attack.
- audit_id: mechanic/mechanic.causes-fear
  id: two-fear-causing-warriors-test-nothing
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.causes-fear]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 6}
    second:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.causes-fear]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 6}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 1, state.second.fear_hit_sixes: False, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

