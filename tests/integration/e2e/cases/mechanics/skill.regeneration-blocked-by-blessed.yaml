# --- Authored scenarios ---
# The boundary of the printed rule, from the blocker's own flag: the defender carries the
# regeneration trait together with the blocked-by-blessed flag, and the ordinary mace blow
# is not a blessed attack.  The Regeneration die is therefore requested as usual and the
# declared four on a 4+ special save takes the wound back.  The save is reached after the
# armour step (none is carried) and before any damage is applied, so the defender keeps
# both Wounds, and its own declared To Hit one misses.
- audit_id: mechanic/skill.regeneration-blocked-by-blessed
  id: the-blocked-flag-leaves-an-unblessed-attack-s-regeneration-intact
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      trait_overrides: {regeneration_save: 4, regeneration_blocked_by_blessed: true}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.special.regeneration, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.wounded: True, attacks.0.saved: True, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# The same flag and the same unblessed attack with a failing Regeneration die: the die is
