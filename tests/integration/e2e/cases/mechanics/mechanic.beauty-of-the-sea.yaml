# --- Authored scenarios ---
# The male, non-animal enemy charging the Sea Singer passes the printed Leadership gate
# on a total of two; the successful test is recorded on his own resource ledger and
# the charge proceeds.
- audit_id: mechanic/mechanic.beauty-of-the-sea
  id: a-male-charger-passes-the-leadership-gate
  fighters:
    first:
      main_weapon_id: weapon.mace
      trait_overrides: {sex: male}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 10}
    second:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.beauty-of-the-sea]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 6}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.beauty-charge.0, value: 1}
    - {key: round.0.first.beauty-charge.1, value: 1}
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 1, state.first_charged: True, state.first.resources_spent: ['beauty.passed'], state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
