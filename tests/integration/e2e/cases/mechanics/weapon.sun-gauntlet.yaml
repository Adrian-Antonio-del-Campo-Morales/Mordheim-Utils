# --- Authored scenarios ---
# mechanic/weapon.sun-gauntlet - the off-hand-only melee reading.
#
# Expectations come from the printed mechanic clause, never from engine output.
# The canonical item entry prints a Range 12" Accurate missile profile instead;
# that contradiction is preserved and the excluded ranged clause is not asserted.
# The off-hand profile resolves last in the pool, so it owns the final index: the
# printed Strength 4 wounds Toughness 3 on 3+, where the mace's own Strength needs 4.
- audit_id: mechanic/weapon.sun-gauntlet
  id: sun-gauntlet-off-hand-attack-strikes-at-strength-four
  covers: [whole]
  fighters:
    first:
      main_weapon_id: weapon.mace
      off_hand_id: weapon.sun-gauntlet
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.first.attack.1.hit, value: 5}
    - {key: round.0.first.attack.1.wound, value: 3}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.1.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# No armour die follows the gauntlet's wound roll even though the target wears a
# 5+ suit, so the printed armour denial is the reason the wound is taken.
- audit_id: mechanic/weapon.sun-gauntlet
  id: sun-gauntlet-denies-a-worn-suit-its-save
  covers: [whole]
  fighters:
    first:
      main_weapon_id: weapon.mace
      off_hand_id: weapon.sun-gauntlet
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      armour_id: armour.heavy-armour
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.first.attack.1.hit, value: 5}
    - {key: round.0.first.attack.1.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.1.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

