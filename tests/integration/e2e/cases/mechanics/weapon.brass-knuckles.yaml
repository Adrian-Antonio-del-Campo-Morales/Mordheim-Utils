# Brass knuckles impose -2 Initiative on the bearer. Cumbersome is only an Initiative
# penalty, so no charge may be declared here: a charger takes the first-round charge tier
# and would strike first whatever the Initiative is. Uncharged, the penalty is what decides
# priority - the bearer's Initiative 5 falls to 3, the defender's 4 therefore resolves first,
# and the bearer answers afterwards with the pair's two attack dice (both miss on a 1).

- audit_id: mechanic/weapon.brass-knuckles
  id: brass-knuckles-reduces-the-bearers-initiative-for-priority
  covers: [whole]
  fighters:
    first:
      main_weapon_id: weapon.brass-knuckles
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 4, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.first.attack.1.hit, value: 1}
  expect_rounds:
    0: {state.second.wounds: 2, state.first.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
  expect_events:
    - {kind: roll, key: round.0.second.attack.0.hit, sides: 6, value: 1}
    - {kind: roll, key: round.0.first.attack.0.hit, sides: 6, value: 1}
