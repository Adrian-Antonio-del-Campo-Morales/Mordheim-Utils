# Brass knuckles grant +1 Strength. Against Toughness 3 the bonus moves the wound target to 3+.

- audit_id: mechanic/weapon.brass-knuckles
  id: brass-knuckles-wounds-at-the-boosted-strength
  covers: [whole]
  fighters:
    first:
      main_weapon_id: weapon.brass-knuckles
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    # The pair grants two attack dice, so both hits are declared before either wound roll; the second attack misses on a 1.
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.1.hit, value: 1}
    - {key: round.0.first.attack.0.wound, value: 3}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
