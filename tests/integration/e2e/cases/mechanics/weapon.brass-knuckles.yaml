# weapon.brass-knuckles - +1 Strength, -2 Initiative and an extra Attack for the pair.
# Brass knuckles are used in pairs and grant an extra Attack. The ordered tape carries two attack dice for the bearer.

- audit_id: mechanic/weapon.brass-knuckles
  id: brass-knuckles-grants-one-additional-attack
  fighters:
    first:
      main_weapon_id: weapon.brass-knuckles
      characteristics: &atk-ws3-s3-t3-w2-i5 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: &dfn-ws3-s3-t3-w2-i2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: &charging-first {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.first.attack.1.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.wounds: 2, state.first.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
  expect_events:
    - {kind: roll, key: round.0.first.attack.0.hit, sides: 6, value: 1}
    - {kind: roll, key: round.0.first.attack.1.hit, sides: 6, value: 1}
    - {kind: roll, key: round.0.second.attack.0.hit, sides: 6, value: 1}
# Brass knuckles grant +1 Strength. Against Toughness 3 the bonus moves the wound target to 3+.

- audit_id: mechanic/weapon.brass-knuckles
  id: brass-knuckles-wounds-at-the-boosted-strength
  fighters:
    first:
      main_weapon_id: weapon.brass-knuckles
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    # The pair grants two attack dice, so both hits are declared before either wound roll; the second attack misses on a 1.
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.1.hit, value: 1}
    - {key: round.0.first.attack.0.wound, value: 3}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# One face below the boosted wound target.

- audit_id: mechanic/weapon.brass-knuckles
  id: brass-knuckles-does-not-wound-one-face-below
  fighters:
    first:
      main_weapon_id: weapon.brass-knuckles
      characteristics: *atk-ws3-s3-t3-w2-i5
    second:
      main_weapon_id: weapon.mace
      characteristics: *dfn-ws3-s3-t3-w2-i2
  duel_context: *charging-first
  maximum_rounds: 1
  rolls:
    # The pair's second attack misses on a 1, so only the first attack reaches the wound roll and it fails one face below the target.
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.1.hit, value: 1}
    - {key: round.0.first.attack.0.wound, value: 2}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 0, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# Brass knuckles impose -2 Initiative on the bearer. Cumbersome is only an Initiative
# penalty, so no charge may be declared here: a charger takes the first-round charge tier
# and would strike first whatever the Initiative is. Uncharged, the penalty is what decides
# priority - the bearer's Initiative 5 falls to 3, the defender's 4 therefore resolves first,
# and the bearer answers afterwards with the pair's two attack dice (both miss on a 1).

- audit_id: mechanic/weapon.brass-knuckles
  id: brass-knuckles-reduces-the-bearers-initiative-for-priority
  fighters:
    first:
      main_weapon_id: weapon.brass-knuckles
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 4, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.first.attack.1.hit, value: 1}
  expect_rounds:
    0: {state.second.wounds: 2, state.first.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
  expect_events:
    - {kind: roll, key: round.0.second.attack.0.hit, sides: 6, value: 1}
    - {kind: roll, key: round.0.first.attack.0.hit, sides: 6, value: 1}
    - {kind: roll, key: round.0.first.attack.1.hit, sides: 6, value: 1}

