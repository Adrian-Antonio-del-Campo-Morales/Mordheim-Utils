# AUTHORED: 2 scenarios read the same declared injury face of four against the same one-wound defender: with the chart it is out of action, and without it the ordinary chart only stuns him.

# --- Authored scenarios ---
# The printed chart replaces the injury bands with 1-2 Knocked Down, 3 Stunned, 4-6 Out of
# Action, and the defender is the model that carries it.  The ordinary chart puts four in the
# Stunned band, so the same declared four separates the two readings: the control below keeps
# every other input identical and only omits the chart trait.  Both warriors fight with the
# plain sword: the mace's own Concussion rule converts a 2-4 on the ordinary chart into
# Stunned, which is a second printed rule and would confound the band this clause declares.
- audit_id: mechanic/mechanic.bat-injury-chart
  id: an-injury-total-of-four-takes-the-bat-out-of-action
  fighters:
    first:
      main_weapon_id: weapon.sword
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.sword
      skill_ids: [mechanic.bat-injury-chart]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 2, attacks: 1}
  initial_state:
    second: {wounds: 1, attacks: 0}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 6}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.injury.0, value: 4}
  expect_rounds:
    0: {attacks.0.damage: 1, state.second.condition: OUT, state.second.wounds: 0}
  expect_final: {rounds_executed: 1, termination_reason: second_out}
# The control for the clause: without the chart the same declared injury total of four only
# reaches the stunned band of the ordinary chart, and the duel continues to the horizon.
- audit_id: mechanic/mechanic.bat-injury-chart
  id: without-the-chart-the-same-four-only-stuns
  fighters:
    first:
      main_weapon_id: weapon.sword
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.sword
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 2, attacks: 1}
  initial_state:
    second: {wounds: 1, attacks: 0}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 6}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.injury.0, value: 4}
  expect_rounds:
    0: {attacks.0.damage: 1, state.second.condition: STUNNED, state.second.wounds: 0}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
