# AUTHORED: 2 scenarios evidence the printed +1 To Hit against a Vampire opponent
#   and the unmodified target against any other opponent.

# --- Authored scenarios ---
# The 3 that misses a WS3 opponent hits with the printed +1.
- audit_id: mechanic/mechanic.andanti-knowledge
  id: a-vampire-opponent-is-hit-on-three
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
      skill_ids: [mechanic.andanti-knowledge]
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
      trait_overrides: {vampire: true, vampire_bloodline: von-carstein}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 3}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: true, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# Without the printed opponent the same 3 fails.
