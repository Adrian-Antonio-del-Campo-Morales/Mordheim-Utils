# --- Authored scenarios ---
# The backlash is an S3 hit with no armour save: the bearer wears a 6+ light armour
# and the round still resolves no armour roll at all, so the single declared wound is
# taken on the fighter himself.
- audit_id: mechanic/mechanic.black-hunger
  id: the-backlash-ignores-armour
  covers: [backlash]
  fighters:
    first:
      main_weapon_id: weapon.mace
      armour_id: armour.light-armour
      skill_ids: [mechanic.black-hunger]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.first.attack.1.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.0.first.black-hunger.hits, sides: 3, value: 1}
    - {key: round.0.first.black-hunger.hit.0.wound, value: 4}
  expect_rounds:
    0: {state.first.wounds: 1, attacks.3.damage: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# The invoked turn adds one attack to the printed profile: the A1 bearer strikes twice
# with the mace, and the same tape already carries the end-of-turn backlash.
- audit_id: mechanic/mechanic.black-hunger
  id: the-invocation-grants-one-extra-attack
  covers: [invocation, attack-bonus]
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.black-hunger]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    # The whole pool of the active fighter resolves its hit rolls before any wound
    # die, so both mace attacks are declared first and then resolved in index order.
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.1.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.1.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.0.first.black-hunger.hits, sides: 3, value: 1}
    - {key: round.0.first.black-hunger.hit.0.wound, value: 4}
  expect_rounds:
    0: {attacks.0.damage: 1, attacks.1.damage: 1, state.second.wounds: 1, state.first.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

