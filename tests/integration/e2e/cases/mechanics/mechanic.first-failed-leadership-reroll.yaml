# The first failure of the duel opens the once-per-duel opportunity and spends the
# resource, which the snapshot shows; the accepted reroll then passes.
- audit_id: mechanic/mechanic.first-failed-leadership-reroll
  id: the-first-failure-spends-the-resource-and-the-reroll-passes
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.first-failed-leadership-reroll]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 6}
    second:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.causes-fear]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 6}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.fear.charge.reroll, value: true}
  rolls:
    - {key: round.0.first.fear.charge.0, value: 6}
    - {key: round.0.first.fear.charge.1, value: 6}
    - {key: round.0.first.fear.charge.reroll.0, value: 1}
    - {key: round.0.first.fear.charge.reroll.1, value: 1}
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 1, state.first_charged: True, state.first.resources_spent: ['leadership.first-failed'], state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# Declining the printed opportunity still consumes it, which is the forfeit: the
# failure stands and no later test in the duel can reopen it.
- audit_id: mechanic/mechanic.first-failed-leadership-reroll
  id: declining-forfeits-the-opportunity
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.first-failed-leadership-reroll]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 6}
    second:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.causes-fear]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 6}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.fear.charge.reroll, value: false}
  rolls:
