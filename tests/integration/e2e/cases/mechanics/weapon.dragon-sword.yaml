# --- Authored scenarios ---
# mechanic/weapon.dragon-sword - the printed prohibition of any second item in
# close combat.
#
# Expectations come from the printed rule and the admitted clause only, never from
# engine output.  Every refusal shares the same loadout message because the
# restriction is the two-handed occupancy of the main hand, and the control
# scenario shows the bare profile is legal.
# The printed prohibition on an additional weapon is declared as a refusal.

- audit_id: mechanic/weapon.dragon-sword
  id: dragon-sword-is-refused-with-an-additional-weapon
  covers: [whole--scope--two-handed-loadout]
  fighters:
    first:
      main_weapon_id: weapon.dragon-sword
      off_hand_id: weapon.dagger
    second:
      main_weapon_id: weapon.mace
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  expect_error: "main weapon occupies both hands"
# The printed prohibition on a shield is declared as a refusal.

- audit_id: mechanic/weapon.dragon-sword
  id: dragon-sword-is-refused-with-a-shield
  covers: [whole--scope--two-handed-loadout]
  fighters:
    first:
      main_weapon_id: weapon.dragon-sword
      off_hand_id: defence.shield
    second:
      main_weapon_id: weapon.mace
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  expect_error: "main weapon occupies both hands"
# The printed prohibition on a buckler is declared as a refusal.

- audit_id: mechanic/weapon.dragon-sword
  id: dragon-sword-is-refused-with-a-buckler
  covers: [whole--scope--two-handed-loadout]
  fighters:
    first:
      main_weapon_id: weapon.dragon-sword
      off_hand_id: defence.buckler
    second:
      main_weapon_id: weapon.mace
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  expect_error: "main weapon occupies both hands"
# Control: the same warrior with no off hand at all compiles and resolves, so the refusals above are the printed loadout restriction rather than a broken profile.

- audit_id: mechanic/weapon.dragon-sword
  id: dragon-sword-alone-compiles-and-resolves-a-round
  covers: [whole--scope--two-handed-loadout]
  fighters:
    first:
      main_weapon_id: weapon.dragon-sword
      characteristics: &a-ws3-s3-t3-w2-i5 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: &d-ws3-s3-t3-w2-i2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.wounds: 2, state.first.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

