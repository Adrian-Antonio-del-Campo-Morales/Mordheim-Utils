# --- Authored scenarios ---
# mechanic/weapon.choppa - +1 Strength in the first round, an extra -1 armour
# save, and a shield remains legal in the other hand.
#
# Expectations come from the printed rule and the admitted clause `whole`, never
# from engine output.  The two-round scenario carries the Strength expiry in the
# same duel, and the shield loadout is the control that the penalty did not also
# forbid the printed off hand.
# Strength 4 against Toughness 3 wounds on a 3 in the first round; in the second round the same weapon is the bearer's Strength 3, so the 3 no longer wounds on the printed 4+.

- audit_id: mechanic/weapon.choppa
  id: choppa-adds-one-strength-in-the-first-round-only
  fighters:
    first:
      main_weapon_id: weapon.choppa
      characteristics: &a-ws3-s3-t3-w2-i5 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: &d-ws3-s3-t3-w2-i2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 2
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 3}
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.1.first.attack.0.hit, value: 4}
    - {key: round.1.first.attack.0.wound, value: 3}
    - {key: round.1.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 1, state.second.wounds: 1}
    1: {attacks.0.damage: 0, state.second.wounds: 1}
  expect_final: {rounds_executed: 2, termination_reason: horizon}
# The extra point of armour penetration moves a worn 5+ save to 6+, so the 6 still saves.

