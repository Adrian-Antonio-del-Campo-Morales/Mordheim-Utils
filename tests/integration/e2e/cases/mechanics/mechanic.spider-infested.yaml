# PARTIAL: 4 scenarios evidence the enemy penalty after a missed To Hit roll, after the bearer parries, its cumulation over two own turns and its absence without the rule, all on the attacker's own recorded initiative_penalty. The printed end condition ("until it is no longer engaged with the Hero or the Hero is taken Out of Action") is NOT represented, and the earlier reason is corrected here: the round snapshot does carry state.<side>.initiative_penalty - the scenarios above assert exactly that field - so the vocabulary is not the obstacle. What the clause lacks is a consumer that clears it: no assignment to initiative_penalty exists in modular/ (attacks.py only increments it at the miss, the parry and the damage branches, and rounds.py/state.py only read it), and once the duel disengages or the bearer is out of action the runner records that termination reason and resolves no further round, so no snapshot of a cleared value can exist. The remaining dependency is structured so it does not silently decide the unrecorded question.
#   Normative text: the printed duration sentence quoted above. Input: the two rounds
#   this file's own maximum_rounds: 2 persistence scenario already observes (the penalty
#   is carried across the round boundary while engaged). Assertion that is blocked: a
#   cleared state.<side>.initiative_penalty in the round snapshot that follows the
#   `disengaged` termination or the bearer's removal - the runner resolves no further
#   round after either reason, so no snapshot can show the cleared value. Missing
#   capability: an engine operator that resets initiative_penalty on disengage/bearer
#   out (or a documented runner route that keeps resolving rounds afterwards). The
#   choice between the two belongs to the coordinator; neither is asserted here.

# --- Authored scenarios ---
# Every failed To Hit roll against the bearer adds one point of Initiative
# penalty to the attacker who missed, floored at zero.  The bearer starts
# standing and both hit rolls are declared misses, so the only state change the
# rule text predicts is the attacker's own penalty.
- audit_id: mechanic/mechanic.spider-infested
  id: a-missed-attack-against-the-bearer-penalises-the-attacker
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.spider-infested]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: false, state.first.initiative_penalty: 1, state.first.initiative_floor: 0, state.second.initiative_penalty: 0}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# The same configuration without the rule on the defender: the identical miss
# leaves the attacker's penalty untouched, so the scenario contrasts the printed
# trigger rather than certifying an unconditional modifier.
- audit_id: mechanic/mechanic.spider-infested
  id: without-the-rule-the-miss-costs-nothing
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: false, state.first.initiative_penalty: 0, state.first.initiative_floor: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# The second printed trigger: a successful parry by the bearer penalises the
# attacker who was parried.  A Strength 3 mace against a Strength 3 swordsman is
# below the printed double-Strength limit, so the parry die is requested, the
# five beats the hit roll of four, and the attack stops there with no wound die.
- audit_id: mechanic/mechanic.spider-infested
  id: a-successful-parry-also-penalises-the-attacker
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.sword
      skill_ids: [mechanic.spider-infested]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.parry, value: 5}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.parried: true, state.first.initiative_penalty: 1, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# Cumulative and persistent: a second miss in the bearer's next turn adds a
# second point, so the attacker's recorded penalty is two after two own turns of
# the bearer.  The printed "until it is no longer engaged" duration is what
# keeps the point across the round boundary.
- audit_id: mechanic/mechanic.spider-infested
  id: the-penalty-cumulates-while-the-two-stay-engaged
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.spider-infested]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 2
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.1.first.attack.0.hit, value: 1}
    - {key: round.1.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: false, state.first.initiative_penalty: 1}
    1: {attacks.0.hit: false, state.first.initiative_penalty: 2, state.engaged: true}
  expect_final: {rounds_executed: 2, termination_reason: horizon}

