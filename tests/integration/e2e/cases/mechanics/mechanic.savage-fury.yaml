# The charged bearer is fear-immune, so no fear.charged die is requested at all.
- audit_id: mechanic/mechanic.savage-fury
  id: the-fear-immune-bearer-takes-no-fear-test
  covers: [whole]
  fighters:
    first:
      main_weapon_id: weapon.mace
      trait_overrides: {causes_fear: true}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 5, attacks: 1, leadership: 10}
    second:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.savage-fury]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1, leadership: 10}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  # Both declared faces are below the 4+ the two equal Weapon Skills require, so the
  # charged bearer's immunity is observed on an unwounded round: only the absence of
  # the fear die distinguishes it, and the strict tape requests no such die at all.
  expect_rounds:
    0: {attacks.0.hit: false, attacks.1.hit: false,
        state.first.wounds: 3, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

