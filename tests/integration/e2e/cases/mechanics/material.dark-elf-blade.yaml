# --- Authored scenarios ---
# mechanic/material.dark-elf-blade — +1 critical table and Concussion.
#
# Expectations come from the printed rule and the accepted clause `whole` of
# the knowledge-base clause contracts (sources/knowledge), never from engine output:
# the material adds critical_injury_bonus 1 and concussion while keeping the
# underlying weapon properties.  The critical die is rolled plus that modifier,
# so a face of 2 reaches 3 and denies armour (a face of 2 alone would not).  The
# attacker wields a sword, which carries no Concussion of its own, so the second
# scenario isolates the material's Concussion on a plain injury total of 2.
#
# The first scenario declares the shared attacker as YAML anchors; the sibling
# aliases it and keeps its own defender build and expectation.

- audit_id: mechanic/material.dark-elf-blade
  id: dark-elf-blade-raises-the-critical-table
  fighters:
    first:
      main_weapon_id: weapon.sword
      main_material_id: material.dark-elf-blade
      characteristics: &attacker-ws3-s3-t3-w2-i5 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      armour_id: armour.light-armour
      characteristics: &defender-ws3-s3-t3-w2-i2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: &charging-first {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 6}
    - {key: round.0.first.attack.0.critical, value: 2}
    - {key: round.0.first.attack.0.injury.0, value: 1}
  expect_rounds:
    0: {attacks.0.critical: true, attacks.0.saved: false,
        state.second.condition: KNOCKED_DOWN, state.second.wounds: 0}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The material's Concussion treats an Injury total of 2 as Stunned.  The sword
# carries no Concussion, so a plain 2 is Stunned only because of the blade.

- audit_id: mechanic/material.dark-elf-blade
  id: dark-elf-blade-stuns-a-low-injury
  fighters:
    first:
      main_weapon_id: weapon.sword
      main_material_id: material.dark-elf-blade
      characteristics: *attacker-ws3-s3-t3-w2-i5
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 2, attacks: 1}
  duel_context: *charging-first
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.injury.0, value: 2}
  expect_rounds:
    0: {attacks.0.critical: false, state.second.condition: STUNNED, state.second.wounds: 0}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
