# --- Authored scenarios ---
# weapon.cutlass - may parry; a successful parry can trigger its counterattack mechanic.
# A cutlass may parry. A parry must beat the to-hit roll, so a 5 blocks a hit landed on a 4.
# The printed counterattack follows the blocked blow as an attack of its own, so its
# to-hit die is scripted as a miss: the counterattack neither wounds nor changes state
# and the parry boundary stays the only outcome under test. A parry that does not block
# opens no counterattack, which is why the equal-roll scenario carries no such die.

- audit_id: mechanic/weapon.cutlass
  id: cutlass-parry-blocks-a-higher-roll
  covers: [whole]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: &atk-ws3-s3-t3-w2-i5 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.cutlass
      characteristics: &dfn-ws3-s3-t3-w2-i2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: &charging-first {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.parry, value: 5}
    - {key: round.0.first.attack.0.cutlass-counter.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.parried: true, attacks.0.wounded: false, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# An equal roll does not parry: the wound is taken.

- audit_id: mechanic/weapon.cutlass
