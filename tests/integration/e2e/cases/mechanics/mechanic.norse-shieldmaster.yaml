#   with the printed kit (axe in hand, shield in the off hand).

# --- Authored scenarios ---
# The printed clause is a shield that parries *in addition to* its save.  The defender is the
# admitted Norse Bearman Bodyguard profile, whose own Shieldmaster rule is the only consumer that
# sets the shield's parry flag.  The attacker hits on an equal Weapon Skill (4+) and the parry die
# of five beats the hit roll, so the attack is stopped before any wound or save is resolved.
- audit_id: mechanic/mechanic.norse-shieldmaster
  id: the-shield-parries-the-blow
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      collection: mordheim
      band_id: hirelings.hired-sword.2b
      profile_id: hireling.hired-sword.norse-bearman-bodyguard
      main_weapon_id: weapon.axe
      off_hand_id: defence.shield
      armour_id: armour.light-armour
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.parry, value: 5}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.parried: true, attacks.0.wounded: false, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The same shield keeps the save throw the clause grants "in addition": the failed parry leaves the
# wound to resolve, and the shield's own +1 lifts light armour from its printed 6+ to 5+, which the
# declared five satisfies while an unaided 6+ would not.
- audit_id: mechanic/mechanic.norse-shieldmaster
  id: the-same-shield-still-contributes-its-save-throw
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      collection: mordheim
      band_id: hirelings.hired-sword.2b
      profile_id: hireling.hired-sword.norse-bearman-bodyguard
      main_weapon_id: weapon.axe
      off_hand_id: defence.shield
      armour_id: armour.light-armour
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.parry, value: 1}
    - {key: round.0.first.attack.0.wound, value: 5}
    - {key: round.0.first.attack.0.armour, value: 5}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.parried: false, attacks.0.saved: true, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
