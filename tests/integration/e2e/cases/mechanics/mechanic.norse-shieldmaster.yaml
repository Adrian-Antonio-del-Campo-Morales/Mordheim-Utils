# AUTHORED: 2 scenarios evidence the printed shield
#   parry and the save throw it keeps, both on the admitted Norse Bearman Bodyguard profile:
#   the shield requests its own parry die and stops the blow, and when the parry fails the same
#   shield's +1 save still turns the wound aside.
#   The route is the printed profile itself: the mechanic arrives only from
#   `hireling.hired-sword.norse-bearman-bodyguard.rule.shieldmaster` (grant: profile,
#   implemented: YES) in catalog/hirelings/hired-swords/grade-2b.yaml, which the compiler
#   carries into `loadout_mechanics` through `_profile_rule_mechanics`, so the shield's
#   off-hand effect gains the parry flag. `special_rule_ids` still refuses that id (grant:
