# --- Authored scenarios ---
# mechanic/weapon.double-handed-weapon - two-handed, Strength +2, strikes last
# unless Strongman applies.
#
# Expectations come from the printed rule and the admitted clause `whole`, never
# from engine output.  The Strongman scenario is the same duel as the strike-last
# one with a single declared trait, so the pair isolates that exception.
# Strength 5 against Toughness 3 wounds on a 2+; the defender strikes first because the printed weapon also strikes last.

- audit_id: mechanic/weapon.double-handed-weapon
  id: double-handed-weapon-wounds-at-the-boosted-strength
  fighters:
    first:
      main_weapon_id: weapon.double-handed-weapon
      characteristics: &a-ws3-s3-t3-w2-i5 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: &d-ws3-s3-t3-w1-i2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 2}
    - {key: round.0.first.attack.0.injury.0, value: 1}
  expect_rounds:
    0: {attacks.1.damage: 1, state.second.wounds: 0, state.second.condition: KNOCKED_DOWN}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
