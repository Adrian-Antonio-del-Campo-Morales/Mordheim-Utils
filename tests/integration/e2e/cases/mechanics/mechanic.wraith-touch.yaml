# --- Authored scenarios ---
# The bearer has two Attacks and declares the Wraith Touch, so the pool is replaced by a
# single unarmed attack: the declared tape carries no second attack die, and the hit
# needs no To Wound die because the wound is automatic against this defender.
- audit_id: mechanic/mechanic.wraith-touch
  id: the-declared-wraith-touch-replaces-the-attack-pool
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.wraith-touch]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 2}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.wraith-touch, value: true}
  # The replacement is an unarmed attack, so the printed unarmed rules apply: an
  # unarmoured defender still keeps the six-plus save the unarmed attack grants.
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.armour, value: 5}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.wounded: true, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# Declining the declaration keeps the ordinary pool: both profile attacks are resolved,
# and the tape carries the second attack die the replacement never requests.
- audit_id: mechanic/mechanic.wraith-touch
  id: declining-the-declaration-keeps-the-normal-attacks
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.wraith-touch]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 2}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.wraith-touch, value: false}
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.first.attack.1.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: false, attacks.1.hit: false}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# The printed prohibition: against an Undead defender the declaration is still offered
# and still replaces the pool, but the attack has no effect at all.  No die is consumed
# by it, and the defender keeps every wound.
- audit_id: mechanic/mechanic.wraith-touch
  id: an-undead-defender-takes-no-wraith-touch-effect
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.wraith-touch]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 2}
    second:
      main_weapon_id: weapon.mace
      trait_overrides: {creature_kind: undead}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.wraith-touch, value: true}
  rolls:
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: false, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

