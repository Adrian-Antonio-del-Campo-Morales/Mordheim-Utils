# Contrast: the same build, the same defender, the same four, with the ordinary
# charge attack (declaration declined): the armour save keeps its printed five and
# the declared four fails, which isolates the unarmed half of the substitution.
- audit_id: mechanic/mechanic.wraith-touch
  id: the-ordinary-charge-keeps-the-printed-save-against-the-silent-face
  fighters:
    first:
      main_weapon_id: weapon.mace
