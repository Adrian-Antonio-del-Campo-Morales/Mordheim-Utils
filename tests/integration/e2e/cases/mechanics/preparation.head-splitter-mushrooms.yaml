# --- Authored scenarios ---
# mechanic/preparation.head-splitter-mushrooms - authored from the printed rule and the
# admitted clauses, never from engine output.  The preparation is supplied
# on `preparation_ids`.
# The preparation grants Frenzy for the duel at its start, so the ordinary
# attack pool is doubled before the attacks resolve.
- audit_id: mechanic/preparation.head-splitter-mushrooms
  id: the-preparation-doubles-the-attack-pool
  covers: [frenzy]
  fighters:
    first:
      main_weapon_id: weapon.mace
      preparation_ids: [preparation.head-splitter-mushrooms]
      characteristics: &prep-attacker {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: &prep-defender {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: &prep-context {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.first.attack.1.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: false, attacks.1.hit: false, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# Control: the same fighter without the preparation keeps its one profile attack.
- audit_id: mechanic/preparation.head-splitter-mushrooms
  id: the-unprepared-fighter-keeps-one-attack
  covers: [frenzy]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: *prep-attacker
    second:
      main_weapon_id: weapon.mace
      characteristics: *prep-defender
  duel_context: *prep-context
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: false, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

