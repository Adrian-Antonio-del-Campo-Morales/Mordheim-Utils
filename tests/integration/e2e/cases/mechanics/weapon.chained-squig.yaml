# --- Authored scenarios ---
# mechanic/weapon.chained-squig - fixed Strength 3, strikes first, cannot be
# parried and entangles an opponent it hits.
#
# Expectations come from the printed rule and the admitted clause `whole`, never
# from engine output.  The fixed Strength is pinned from both sides: a low-Strength
# bearer still wounds as Strength 3 and a high-Strength bearer does not wound
# better.
# The bearer's own Strength 1 would wound Toughness 3 on a 5+, so the 4 that wounds proves the printed fixed Strength 3.

- audit_id: mechanic/weapon.chained-squig
  id: chained-squig-uses-strength-three-whatever-the-bearer-strength
  fighters:
    first:
      main_weapon_id: weapon.chained-squig
      characteristics: &a-ws3-s1-t3-w2-i5 {weapon_skill: 3, strength: 1, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: &d-ws3-s3-t3-w2-i2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
