# The printed equality: the declared To Hit four lands on the defender's Weapon Skill 3,
# and the defender's parry die of the same four blocks it because the skill allows a parry
# on a roll equal to or over the To Hit roll.  The blow is therefore parried, the defender
# keeps both Wounds, and its own declared To Hit one misses.
- audit_id: mechanic/skill.swordmaster
  id: the-equal-parry-roll-blocks-the-blow
  covers: [match-the-to-hit-roll]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.sword
      skill_ids: [skill.swordmaster]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.parry, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.parried: True, attacks.0.wounded: False, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
