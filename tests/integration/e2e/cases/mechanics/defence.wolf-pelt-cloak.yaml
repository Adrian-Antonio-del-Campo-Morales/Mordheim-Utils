# --- Authored scenarios ---
# mechanic/defence.wolf-pelt-cloak — the 6+ pelt save and the Strictures.
#
# Expectations come from the printed clause text and the admitted clauses
# `six-plus-saving-throw`, `may-not-wear-armour` and
# `may-not-carry-blackpowder-weapons` of
# the knowledge-base clause contracts (sources/knowledge), never from engine output.
# The registered recipient is the canonical Wolf-Priest of Ulric
# (hirelings.hired-sword.2b / hireling.hired-sword.wolf-priest-of-ulric-miracle-workers),
# whose printed strictures give the pelt as the one armour exception: "Wolf-Priests
# of Ulric may never wear armour ... the pelt allows a 6+ saving throw ... may
# never be equipped with blackpowder weapons".  The pelt is part of the
# recipient's own kit, so the scenarios declare the profile rather than
# hand-building a bearer, and the printed save is observed on the armour die:
# an unmodified Strength 3 attack is saved on a 6 and not on a 5.
#
# The refusals use the corpus `expect_error` contract: the ineligible build must
# be refused, so the refusal is a real assertion and a case that runs fails.  A
# loadout refusal is raised while the build is compiled, before any round, so no
# observation can be combined with it.
#
# RECORDED LIMITATION - the stricture's own diagnostic is unreachable for this
# recipient.  The printed kit of the Wolf-Priest is the ceremonial dagger and the
# pelt, and nothing else; construction enforces that printed kit *before* it
# evaluates the profile's `profile.equipment-restrictions` binding, so a suit of
# armour or a blackpowder weapon is refused as an incomplete printed kit and never
# as "armour is forbidden for <band>/<profile>".  These two scenarios therefore
# evidence that the roster refuses the forbidden kit, which is what the printed
# strictures demand, and do not claim a stricture-specific diagnostic that no
# existing path produces.  A recipient whose printed kit is open (or a kit check
# that reports the restriction it enforces) would allow the stronger claim.
#
# The first scenario declares the shared attacker profile and the duel context
# as YAML anchors; the sibling aliases the attacker and keeps its own armour and
# injury dice.

- audit_id: mechanic/defence.wolf-pelt-cloak
  id: wolf-pelt-saves-on-six
  covers: [six-plus-saving-throw]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: &attacker-ws3-s3-t3-w2-i5 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      band_id: hirelings.hired-sword.2b
      profile_id: hireling.hired-sword.wolf-priest-of-ulric-miracle-workers
      main_weapon_id: weapon.dagger
  duel_context: &charging-first {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.armour, value: 6}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.saved: true, attacks.0.damage: 0, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# One face below the printed target: the five is not a 6+, so the single wound
# of the recipient is taken and the injury table is reached.  The injury face of
# one is the first band, so the bearer is Knocked Down and no helmet reaction is
# offered for a non-Stunned result.

- audit_id: mechanic/defence.wolf-pelt-cloak
  id: wolf-pelt-does-not-save-on-five
  covers: [six-plus-saving-throw]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: *attacker-ws3-s3-t3-w2-i5
    second:
      band_id: hirelings.hired-sword.2b
      profile_id: hireling.hired-sword.wolf-priest-of-ulric-miracle-workers
      main_weapon_id: weapon.dagger
  duel_context: *charging-first
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.armour, value: 5}
    - {key: round.0.first.attack.0.injury.0, value: 1}
  expect_rounds:
    0: {attacks.0.saved: false, attacks.0.damage: 1, state.second.wounds: 0, state.second.condition: KNOCKED_DOWN}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The strictures forbid every other armour: a suit worn with the pelt is refused
# before any round runs.

- audit_id: mechanic/defence.wolf-pelt-cloak
  id: wolf-priest-may-not-wear-another-armour
  covers: [may-not-wear-armour]
  fighters:
    first:
      band_id: hirelings.hired-sword.2b
      profile_id: hireling.hired-sword.wolf-priest-of-ulric-miracle-workers
      main_weapon_id: weapon.dagger
      armour_id: armour.light-armour
  expect_error: "hireling active equipment and supplied ownership do not form a complete legal printed kit"

# The strictures forbid blackpowder weapons for the same recipient.

- audit_id: mechanic/defence.wolf-pelt-cloak
  id: wolf-priest-may-not-carry-a-blackpowder-weapon
