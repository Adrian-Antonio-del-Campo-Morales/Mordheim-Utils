# AUTHORED: 2 scenarios cover the Undead that must test despite Immunity
#   to Psychology and the same warrior exempt against an ordinary fear-causer.

# --- Authored scenarios ---
# The charged warrior is explicitly Undead and carries Immunity to Psychology, yet the
# printed source overrides that exemption: he tests, fails and can only hit with
# sixes, so his declared five misses.
- audit_id: mechanic/mechanic.morrs-servant
  id: an-undead-still-tests-against-the-priest
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.morrs-servant]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 6}
    second:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.psychology-immunity]
      trait_overrides: {creature_kind: undead}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 6}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.fear.charged.0, value: 6}
    - {key: round.0.second.fear.charged.1, value: 6}
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 5}
  expect_rounds:
    0: {attacks.0.damage: 1, attacks.1.hit_target: 6, state.second.fear_hit_sixes: True}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# The same Undead warrior against an ordinary fear-causer keeps his exemption and no
# Leadership die appears, which pins the override to the Priest's clause rather than
# to Fear in general.
