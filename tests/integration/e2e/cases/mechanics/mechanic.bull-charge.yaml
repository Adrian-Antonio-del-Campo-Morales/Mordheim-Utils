# AUTHORED: 3 scenarios cover the declared charge resolving exactly one attack at +1 to hit instead of the profile's two, the automatic knock-down of an unparried unsaved hit, the armour save that leaves the defender standing, and the declined declaration that resolves the normal attacks. The printed "if successful" is read here as the recorded project reading (an unparried, unsaved hit), and the save scenario is the border case of that reading.

# --- Authored scenarios ---
# mechanic/mechanic.bull-charge — every expectation below comes from the printed
# rule (when charging, an Ogre with this skill may attempt a single attack at +1
# to hit rather than his normal attacks; if successful the enemy is automatically
# knocked down) and the recorded contract, never from engine output.  The declared
# replacement pool is one attack on its own key, so the ordered tape shows one
# attack where the profile has two, and the automatic knock-down needs no To
# Wound roll.
- audit_id: mechanic/mechanic.bull-charge
  id: a-declared-bull-charge-knocks-the-enemy-down
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.bull-charge]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 2}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.bull-charge, value: true}
  rolls:
    - {key: round.0.first.bull-charge.hit, value: 3}
  expect_rounds:
    0: {attacks.0.hit: True, state.second.condition: KNOCKED_DOWN, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
  expect_events:
    - {kind: decision, key: round.0.first.bull-charge, value: true}
    - {kind: roll, key: round.0.first.bull-charge.hit, sides: 6, value: 3}

# The recorded reading of the printed "if successful": an armour save stops the
# knock-down, so the defender stays standing and the round continues.  The +1
# that turned the three into a hit is still visible in the first scenario.
- audit_id: mechanic/mechanic.bull-charge
  id: an-unsaved-hit-knocks-down-while-a-save-leaves-the-defender-standing
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.bull-charge]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 2}
    second:
      main_weapon_id: weapon.mace
      armour_id: armour.light-armour
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.bull-charge, value: true}
  rolls:
    - {key: round.0.first.bull-charge.hit, value: 3}
    - {key: round.0.first.bull-charge.armour, value: 6}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.saved: True, state.second.condition: STANDING, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The printed "rather than making his normal attacks": declining the declaration
# resolves the profile's two attacks on their own keys instead of the single
# charge attack.
- audit_id: mechanic/mechanic.bull-charge
  id: declining-the-declaration-resolves-the-normal-attacks
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.bull-charge]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 2}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.bull-charge, value: false}
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.first.attack.1.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.condition: STANDING, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
  expect_events:
    - {kind: decision, key: round.0.first.bull-charge, value: false}
    - {kind: roll, key: round.0.first.attack.0.hit, sides: 6, value: 1}
    - {kind: roll, key: round.0.first.attack.1.hit, sides: 6, value: 1}
    - {kind: roll, key: round.0.second.attack.0.hit, sides: 6, value: 1}
