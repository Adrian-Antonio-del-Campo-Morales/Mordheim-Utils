# --- Authored scenarios ---
# mechanic/weapon.yari-two-handed - strike first, parry, two hands.
#
# Expectations come from the printed rule and the admitted clause, never from
# engine output.  The admitted contract prints no turn scope for the priority, so
# the scenarios assert the first-round consequence only; the printed turn limit
# of sibling weapons is not inherited by their labels.
# Neither fighter charges, so only the printed strike-first priority can lift the
# lower-Initiative bearer above the defender in the ordered tape.
- audit_id: mechanic/weapon.yari-two-handed
  id: yari-two-handed-strikes-first-with-a-lower-initiative
  fighters:
    first:
      main_weapon_id: weapon.yari-two-handed
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.wounds: 2, state.first.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
  expect_events:
    - {kind: roll, key: round.0.first.attack.0.hit, sides: 6, value: 1}
    - {kind: roll, key: round.0.second.attack.0.hit, sides: 6, value: 1}
# The bearer's own parry attempt blocks the hit that landed on a 4.
- audit_id: mechanic/weapon.yari-two-handed
  id: yari-two-handed-parries-a-higher-roll
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.yari-two-handed
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.parry, value: 5}
  expect_rounds:
    0: {attacks.1.parried: True, attacks.1.wounded: False, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
