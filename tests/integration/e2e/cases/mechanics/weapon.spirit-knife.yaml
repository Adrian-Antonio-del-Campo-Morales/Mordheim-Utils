# mechanic/weapon.spirit-knife - dagger profile whose natural hit six stills the
# victim for one immediate additional wound.
#
# Expectations come from the printed rule and the admitted clause `whole`, never
# from engine output.  The still is resolved before the ordinary wound roll, so
# its armour step is the first die after the hit in the tape.
# A natural hit six stills the victim first: the printed extra wound is resolved immediately (its own armour die first, before the ordinary wound roll), and then the ordinary attack follows with its own save.

- audit_id: mechanic/weapon.spirit-knife
  id: spirit-knife-stills-on-a-natural-six-before-the-wound-roll
  fighters:
    first:
      main_weapon_id: weapon.spirit-knife
      characteristics: &a-ws3-s3-t3-w2-i5 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      armour_id: armour.heavy-armour
      characteristics: &d-ws3-s3-t3-w3-i2-heavy {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 6}
    - {key: round.0.first.attack.0.spectral-touch.armour, value: 3}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.armour, value: 3}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.saved: False, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
