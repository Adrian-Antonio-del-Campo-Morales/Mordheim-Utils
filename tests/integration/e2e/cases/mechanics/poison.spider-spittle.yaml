# --- Authored scenarios ---
# mechanic/poison.spider-spittle - authored from the printed rule and the
# admitted `whole` clause, never from engine output.
# An undefended hit immediately forces a Toughness test.  The struck fighter acts
# first in this round, so the paralysis is read after its own attack and the round
# carries no further attacker ambiguity.
- audit_id: mechanic/poison.spider-spittle
  id: a-failed-toughness-test-paralyses-the-struck-target
  fighters:
    first:
      main_weapon_id: weapon.mace
      main_poison_id: poison.spider-spittle
      characteristics: &ss-attacker {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: &ss-defender {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
  duel_context: &ss-context {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.spider-spittle, value: 4}
    - {key: round.0.first.attack.0.wound, value: 1}
  expect_rounds:
    0: {state.second.condition: PARALYZED, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

