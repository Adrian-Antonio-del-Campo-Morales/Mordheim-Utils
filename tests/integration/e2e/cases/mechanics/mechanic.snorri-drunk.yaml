  id: a-supplied-six-grants-the-printed-frenzy
  covers: [snorri-drunk]
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.snorri-drunk]
      trait_overrides: {snorri_drunk_result: 6}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  # The pool resolves every To Hit die before any To Wound die: the frenzy-doubled
  # pair of mace attacks rolls its two hits first, then the two wounds in the same
  # allocation order, and only then the defender's reply.
