# --- Authored scenarios ---
# mechanic/weapon.pistol - close-combat use only: one Strength 4 shot in the
# first round with a steep armour-save penalty.
#
# Expectations come from the printed rule and the admitted clause `whole`, never
# from engine output.  The header prints an additional -2 save modifier while the
# contract declares one penetration point; both readings leave a worn 5+ suit
# with no save at all, so that observation is authored without taking a side.
# A Strength 1 bearer would need a 6+ to wound Toughness 3, so the 3 that wounds proves the printed fixed Strength 4 shot.

- audit_id: mechanic/weapon.pistol
  id: pistol-shot-wounds-at-strength-four
  covers: [whole]
  fighters:
    first:
      main_weapon_id: weapon.pistol
      characteristics: &a-ws3-s1-t3-w2-i5 {weapon_skill: 3, strength: 1, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: &d-ws3-s3-t3-w2-i2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 3}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
