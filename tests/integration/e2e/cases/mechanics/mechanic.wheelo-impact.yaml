#
# Clause: charger-immunity--scope--charger-immunity (scope: YES)
# AUTHORED[charger-immunity--scope--charger-immunity]: 1 scenario covers the printed immunity: a model that charges the Wheelo resolves its own declared miss and the Wheelo's two ordinary misses, with no impact die requested at all and no automatic hit outcome in the round (a declared impact die would be an unexpected roll). The spear-fitted retaliatory single hit, the one case the executor's counter branch adds, belongs to the fittings clause of mechanic.wheelo-skill-modifications.
#
# Clause: whole (scope: YES)
# AUTHORED[whole]: 1 scenario covers the printed collision: the charging Wheelo's declared count die yields one Impact Hit, worked out before any blow. It hits automatically (no To Hit die is requested), resolves at the printed fixed Strength 4 (the declared To Wound four wounds Toughness 3 on the 3+ that Strength 4 needs) through the target's armour save (declared one against a 6+ that fails) and then the injury roll, which leaves the target Knocked Down; only then do the crew's printed two attacks follow, hit automatically against a Knocked Down target. The consumed wheelo.first-impact resource records the first-round, once-per-game nature the contract supplies. Not authored: the facet 'remains S4 even if the crew gains a Strength Upgrade' has no authorable crew Strength upgrade in this file's scope; the executor delivers it by resolving the impact from a copy of the owner whose global effects are empty and by carrying a fixed Strength (rounds.py:479-483).
#
# Clause: charger-immunity--scope--friendly-model-hits (scope: NO)
# Outside the admitted clause scope; retained for context, not a test TODO.

# --- Authored scenarios ---
# The Wheelo prints Attacks 2 and is built from its own band and profile, so the impact
# block is reached through the identity that owns the printed rule.  Its declared count
# die yields one Impact Hit; the impact asks for no To Hit die, wounds Toughness 3 on the
# 3+ that its fixed Strength 4 needs, meets a heavy armour save whose target the Strength
# penalty lifts to 6 (the declared one fails) and takes the target to zero Wounds, where
# the injury die leaves it Knocked Down.  The crew's own two attacks then hit automatically
# against a Knocked Down target and take only wound dice, which both miss, so the round
# closes with the Wheelo untouched and the spent wheelo.first-impact resource recorded.
- audit_id: mechanic/mechanic.wheelo-impact
  id: a-charging-wheelo-resolves-its-impact-hits-before-any-blow
  covers: [whole]
  fighters:
    first:
      collection: mordheim
      band_id: snotlings-web
      profile_id: wheelo
      main_weapon_id: weapon.dagger
    second:
      main_weapon_id: weapon.mace
      armour_id: armour.heavy-armour
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.impact-count, value: 1}
    - {key: round.0.first.impact.0.wound, value: 4}
    - {key: round.0.first.impact.0.armour, value: 1}
    - {key: round.0.first.impact.0.injury.0, value: 2}
    - {key: round.0.first.attack.0.wound, value: 1}
    - {key: round.0.first.attack.1.wound, value: 1}
  expect_rounds:
    0: {attacks.0.hit: True, attacks.0.wounded: True, attacks.0.saved: False,
        attacks.0.damage: 1, state.second.condition: KNOCKED_DOWN,
        state.second.wounds: 0, state.first.resources_spent: ['wheelo.first-impact']}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# The printed immunity, read from the same identity: the charger is the attacker, the
# Wheelo is charged, and the round asks for no impact die at all.  The first outcome is
# the charger's own declared miss, not the automatic hit a collision would be, and the
# Wheelo's two printed attacks miss as well, so no Impact Hit was dealt to the charger.
- audit_id: mechanic/mechanic.wheelo-impact
  id: a-model-that-charges-the-wheelo-takes-no-impact-hits
  covers: [charger-immunity--scope--charger-immunity]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
    second:
      collection: mordheim
      band_id: snotlings-web
      profile_id: wheelo
      main_weapon_id: weapon.dagger
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.0.second.attack.1.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: False, attacks.0.hit_roll: 1, attacks.1.hit: False,
        attacks.2.hit: False, attacks.2.hit_roll: 1, state.first.wounds: 2, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
