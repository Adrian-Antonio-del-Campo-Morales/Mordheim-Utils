# --- Authored scenarios ---
# mechanic/weapon.boar-spear - shield-only, strikes first, and a charging enemy
# loses one base Attack (minimum 1).
#
# Expectations come from the printed rule and the admitted clause register, never
# from engine output.  Only the charging side loses an attack, so the reduced
# enemy is the second fighter in both attack-count scenarios.
# The printed shield-only restriction is declared as a refusal by the shared loadout validation.

- audit_id: mechanic/weapon.boar-spear
  id: boar-spear-is-refused-with-an-off-hand-weapon
  covers: [shield-only]
  fighters:
    first:
      main_weapon_id: weapon.boar-spear
      off_hand_id: weapon.dagger
    second:
      main_weapon_id: weapon.mace
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  expect_error: "weapon.boar-spear cannot be combined with weapon.dagger"
# Control: the same loadout with the permitted shield compiles and resolves a round.

- audit_id: mechanic/weapon.boar-spear
  id: boar-spear-is-accepted-with-a-shield
  covers: [shield-only]
  fighters:
    first:
      main_weapon_id: weapon.boar-spear
      off_hand_id: defence.shield
      characteristics: &a-ws3-s3-t3-w2-i5 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: &d-ws3-s3-t3-w2-i2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.wounds: 2, state.first.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
