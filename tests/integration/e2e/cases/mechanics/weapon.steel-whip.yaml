# --- Authored scenarios ---
# mechanic/weapon.steel-whip - the refused parry and the whipcrack family.
#
# Expectations come from the printed rule and the admitted clause, never from
# engine output.  The whipcrack bonus is a shared family behaviour keyed by the
# whip tags, so these scenarios assert only the printed consequence for this
# bearer: the extra attack, its single-point cap and its timing.
# The defender wields a parrying sword and has parries left, yet the landed hit
# draws no parry die from the tape: the printed refusal is denied before the roll.
- audit_id: mechanic/weapon.steel-whip
  id: steel-whip-cannot-be-parried-by-a-parrying-weapon
  fighters:
    first:
      main_weapon_id: weapon.steel-whip
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.sword
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.parried: False, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# Charging adds exactly one die to the pool, so the ordered tape carries two
# attacks for the bearer instead of one.
- audit_id: mechanic/weapon.steel-whip
  id: steel-whip-grants-one-bonus-attack-when-charging
  fighters:
    first:
      main_weapon_id: weapon.steel-whip
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.first.attack.1.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.wounds: 2, state.first.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
  expect_events:
    - {kind: roll, key: round.0.first.attack.0.hit, sides: 6, value: 1}
    - {kind: roll, key: round.0.first.attack.1.hit, sides: 6, value: 1}
    - {kind: roll, key: round.0.second.attack.0.hit, sides: 6, value: 1}
