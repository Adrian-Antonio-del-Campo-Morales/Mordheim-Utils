# Charged, the bearer gains the bonus attack and that bonus alone strikes first: it
# resolves before the charging enemy and before the bearer's ordinary attack, whose
# own Initiative tier is unchanged.
- audit_id: mechanic/weapon.steel-whip
  id: whipcrack-bonus-strikes-first-when-its-bearer-is-charged
  fighters:
