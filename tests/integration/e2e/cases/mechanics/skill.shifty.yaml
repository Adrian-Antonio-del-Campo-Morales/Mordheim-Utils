# --- Authored scenarios ---
# The admitted clause grants the halfling one bonus attack when he is charged,
# and it strikes first.  In both scenarios the halfling is charged (the second
# participant is the charger) and every attack is scripted as a miss, so the two
# observable consequences are the pool size and the resolution order: the bonus
# joins the pool as its own strike at the strike-first tier, which the declared
# roll order records before the charger's attack and before the halfling's own
# ordinary attacks.  Removing the skill leaves the same warrior with his
# ordinary single attack, which the charging opponent strikes first against.
- audit_id: mechanic/skill.shifty
  id: shifty-charged-halfling-earns-a-strike-first-attack
  covers: [whole]
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [skill.shifty]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [second], active_participant: second}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.shifty.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.0.first.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: False, attacks.1.hit: False, attacks.2.hit: False, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
