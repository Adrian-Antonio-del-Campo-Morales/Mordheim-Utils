# --- Authored scenarios ---
# The Warrior Priest declares the sermon at the start of his own turn: his attack
# count becomes two, and both the aggregate resource and the round-scoped key are
# recorded as spent, which is what makes the declaration once per duel.
- audit_id: mechanic/mechanic.rousing-sermon
  id: the-declared-sermon-adds-one-attack-and-spends-the-once-per-duel-resource
  covers: [self-attack-bonus]
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.rousing-sermon]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.rousing-sermon, value: true}
  # The whole pool's hit rolls are resolved before any wound step: the sermon's
  # second attack is rolled first, then the first attack's To Wound die, then the
  # enemy's own blow.
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.1.hit, value: 1}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.resources_spent: ['round.0.rousing-sermon', 'rousing-sermon'],
        attacks.0.damage: 1, attacks.1.hit: False, attacks.2.hit: False,
        state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# The declaration is optional: declining it leaves the printed single attack, scopes
# no resource, and the enemy's blow is the second outcome of the round.
