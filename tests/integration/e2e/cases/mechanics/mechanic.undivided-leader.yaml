# --- Authored scenarios ---
# The printed clause belongs to the Marauders of Chaos mark, and the source list its
# `applies_to.profile_ids` names is the Marauder Chieftain, so the supplied provider is
# that leader carrying `band--mark-of-chaos-undivided`; the tested warrior is another
# model of the same band, which is the "warband members" the clause names.  The marked
# leader stands four inches away in the same band, so the failed individual Leadership
# test is rerolled under his aura: the leader's own value is declined and the aura
# reroll is taken instead.
- audit_id: mechanic/mechanic.undivided-leader
  id: the-marked-leader-s-aura-rerolls-the-failed-test
  covers: [undivided-leader--scope--leadership-reroll-aura]
  fighters:
    first:
      main_weapon_id: weapon.mace
      trait_overrides: {stupidity: true}
      collection: mordheim
      band_id: marauders-of-chaos
      profile_id: chaos-marauders
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 3}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  initial_state:
    first: {attacks: 0}
  duel_context: {first_id: first, second_id: second, charging: [first], active_participant: first,
    distances: [[first, marked-leader, 4]],
    nearby: [{participant_id: marked-leader, side_id: first, condition: standing,
              fighter: {collection: mordheim, band_id: marauders-of-chaos, profile_id: marauder-chieftain,
                        special_rule_ids: [band--mark-of-chaos-undivided],
                        characteristics: {weapon_skill: 4, strength: 4, toughness: 3, wounds: 1, initiative: 4, attacks: 1, leadership: 8}}}]}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.stupidity.leader.marked-leader, value: false}
    - {key: round.0.first.stupidity.reroll, value: true}
  rolls:
    - {key: round.0.first.stupidity.0, value: 4}
    - {key: round.0.first.stupidity.1, value: 4}
    - {key: round.0.first.stupidity.reroll.0, value: 1}
    - {key: round.0.first.stupidity.reroll.1, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.stupidity_failed: False, state.first_charged: True, state.engaged: True, attacks.0.damage: 0}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
