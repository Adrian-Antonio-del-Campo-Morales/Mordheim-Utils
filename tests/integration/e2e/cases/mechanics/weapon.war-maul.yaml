# Every strike-last weapon shares the lower tier, so the printed -1 Initiative is
# read where the tier cannot decide: within the tier the effective Initiatives are
# compared, and the maul's own is one lower.  The broadsword also strikes last and
# carries no Initiative penalty, so equal printed Initiative must resolve to the
# maul acting second, with no priority-tie die at all.
- audit_id: mechanic/weapon.war-maul
  id: war-maul-lowered-initiative-loses-the-strikes-last-tie-break
  fighters:
    first:
      main_weapon_id: weapon.war-maul
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 4, attacks: 1}
    second:
      main_weapon_id: weapon.broadsword
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 4, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.0.first.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.wounds: 2, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
  expect_events:
    - {kind: roll, key: round.0.second.attack.0.hit, sides: 6, value: 1}
    - {kind: roll, key: round.0.first.attack.0.hit, sides: 6, value: 1}

# The other face: the same penalty turns a win into an exact tie, so the priority
# die is required where the unpenalised print would have no die.  Both initials are
# one apart and the maul's -1 makes them equal.
- audit_id: mechanic/weapon.war-maul
  id: war-maul-lowered-initiative-turns-a-win-into-an-exact-tie
  fighters:
    first:
      main_weapon_id: weapon.war-maul
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 4, attacks: 1}
    second:
      main_weapon_id: weapon.broadsword
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 3, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.priority-tie, value: 4}
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.wounds: 2, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
  expect_events:
    - {kind: roll, key: round.0.priority-tie, sides: 6, value: 4}
    - {kind: roll, key: round.0.first.attack.0.hit, sides: 6, value: 1}
    - {kind: roll, key: round.0.second.attack.0.hit, sides: 6, value: 1}
