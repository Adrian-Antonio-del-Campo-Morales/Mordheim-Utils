# E2E authoring scaffold; generated comments, manually authored scenarios.
# audit_id: mechanic/weapon.war-maul
# authoring_status: AUTHORED
# authoring_progress: 7 authored scenarios cover all five printed modifiers: the +2 Strength, the -1 armour save on both faces, the strike-last priority, the refused parry, the two-handed occupancy and, via a second strike-last weapon at equal priority, the printed -1 Initiative in the priority tie-break
# execution_status: UNEXECUTED (this scaffold has no behavioral result)
#
# Derive inputs and expectations from rule text and accepted rulings.
# Do not derive them from the engine or execute combat during authoring.
# REVIEWED requires semantic review; covers labels alone are insufficient.
# Preserve audit_id when filling this file.
# Governing rulings: docs/decisions/design-rulings.md
#
# AUTHORED: 7 scenarios evidence the printed +2 Strength, the -1 armour
#   save on both faces, the strike-last priority, the refused parry, the two-handed
#   occupancy and the -1 Initiative. The Initiative penalty acts through the
#   tie-break of the priority comparison, which needs a second strike-last weapon
#   at the same tier: against a broadsword (Strike Last, no Initiative penalty) the
#   maul's lowered Initiative loses a tie-break it would otherwise win and turns a
#   win into an exact tie that needs the priority die.

# --- Authored scenarios ---
# mechanic/weapon.war-maul - four of the five printed modifiers.
#
# Expectations come from the printed rule and the admitted clause, never from
# engine output.  Because the maul strikes last, the defender resolves first and
# the maul's own attack is the second entry of the round's attack list.
# The printed -1 Initiative has no observation here; see the PARTIAL note.
# Strength 5 wounds Toughness 3 on 2+, so the 3 lands: the wielder's own Strength
# would have needed 4 and the next scenario shows that boundary.
- audit_id: mechanic/weapon.war-maul
  id: war-maul-adds-two-strength
  fighters:
    first:
      main_weapon_id: weapon.war-maul
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.0.first.attack.0.hit, value: 5}
    - {key: round.0.first.attack.0.wound, value: 3}
  expect_rounds:
    0: {attacks.1.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# A Strength 1 bearer has no lower target to reach, so the same 3 that the +2
# variant wounds on is here compared against the unboosted target and misses.
- audit_id: mechanic/weapon.war-maul
  id: war-maul-wounds-one-face-below-at-strength-three
  fighters:
    first:
      main_weapon_id: weapon.war-maul
      characteristics: {weapon_skill: 3, strength: 1, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.0.first.attack.0.hit, value: 5}
    - {key: round.0.first.attack.0.wound, value: 3}
  expect_rounds:
    0: {attacks.1.damage: 0, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
