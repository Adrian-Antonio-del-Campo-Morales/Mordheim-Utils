# mechanic/weapon.ankus - strikes first; Injury rolls of 2-4 are Stunned.
#
# Expectations come from the printed rule and the admitted clause `whole`, never
# from engine output.  The armed attacker has one attack, so the round carries
# the bearer's single attack index 0 and then the defender's.
# A roll of 1 stays outside the printed Concussion band, so it is an ordinary knocked-down result.

- audit_id: mechanic/weapon.ankus
  id: ankus-injury-1-is-knocked-down
  fighters:
    first:
      main_weapon_id: weapon.ankus
      characteristics: &a-ws3-s3-t3-w2-i5 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: &d-ws3-s3-t3-w1-i2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 2, attacks: 1}
  duel_context: &charging-first {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.injury.0, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 1, state.second.wounds: 0, state.second.condition: KNOCKED_DOWN}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
