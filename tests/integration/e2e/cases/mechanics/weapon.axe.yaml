# --- Authored scenarios ---
# weapon.axe - an axe uses normal Strength and applies an additional -1 armour-save modifier.
# an axe uses normal Strength and applies an additional -1 armour-save modifier.
# A heavy-armour target is saved on a 5; the printed extra -1 moves the
# printed target to 6+, so the 5 no longer saves.

- audit_id: mechanic/weapon.axe
  id: axe-save-fails-one-below-the-penalised-target
  fighters:
    first:
      main_weapon_id: weapon.axe
      characteristics: &atk-ws3-s3-t3-w2-i5 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      armour_id: armour.heavy-armour
      characteristics: &dfn-ws3-s3-t3-w2-i2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: &charging-first {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.armour, value: 5}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.saved: false, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

- audit_id: mechanic/weapon.axe
  id: axe-save-holds-on-the-penalised-target
  fighters:
    first:
      main_weapon_id: weapon.axe
      characteristics: *atk-ws3-s3-t3-w2-i5
    second:
      main_weapon_id: weapon.mace
      armour_id: armour.heavy-armour
      characteristics: *dfn-ws3-s3-t3-w2-i2
  duel_context: *charging-first
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.armour, value: 6}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.saved: true, attacks.0.damage: 0, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

