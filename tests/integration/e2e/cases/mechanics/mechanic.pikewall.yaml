#
# AUTHORED: 3 scenarios cover the reroll for
#   the charged bearer of a first-strike weapon, the refusal when he charges,
#   and the refusal with an ordinary weapon.

# --- Authored scenarios ---
# The pikeman is charged while wielding the first-strike spear, so his failed hit
# in that round is taken again.  Spear and charger share the strike-first tier and
# his higher Initiative resolves the tie in his favour.
- audit_id: mechanic/mechanic.pikewall
  id: the-charged-pikeman-rerolls-a-failed-hit
  fighters:
    first:
      main_weapon_id: weapon.spear
      skill_ids: [mechanic.pikewall]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [second], active_participant: second}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.first.attack.0.hit.reroll, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: True, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# The printed trigger is being charged, so the same first-strike weapon and the same
# failed hit on the turn he charges receive no second die.
- audit_id: mechanic/mechanic.pikewall
  id: a-pikeman-who-charges-is-not-granted-the-reroll
  fighters:
    first:
      main_weapon_id: weapon.spear
      skill_ids: [mechanic.pikewall]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: False, attacks.0.damage: 0, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# The printed rule also requires a first-strike weapon, so the charged bearer of an
# ordinary mace keeps his failed hit.  Without the spear the charge tier also puts
# the charging opponent first.
- audit_id: mechanic/mechanic.pikewall
  id: the-charged-bearer-of-an-ordinary-weapon-rerolls-nothing
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.pikewall]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [second], active_participant: second}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.0.first.attack.0.hit, value: 2}
  expect_rounds:
    0: {attacks.0.hit: False, attacks.1.hit: False, state.first.wounds: 2, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

