#
# AUTHORED: 6 scenarios cover the reduced Strength on both faces, the one-attack clamp, and the target's improved save both without armour and on a worn suit.

# --- Authored scenarios ---
# mechanic/weapon.fist - unarmed: Strength -1, at most one Attack, and the
# target gains +1 to its armour save (a 6+ save when it has none).
#
# Expectations come from the printed rule and the admitted clause `whole`, never
# from engine output.  The attack-count clamp is proved by the strict tape: a
# three-Attack fighter still requests exactly one attack die.
# Strength 2 against Toughness 3 wounds on a 5+, so the 4 that would wound at the bearer's own Strength 3 fails.

- audit_id: mechanic/weapon.fist
  id: fist-attacks-at-one-less-strength
  fighters:
    first:
      main_weapon_id: weapon.fist
      characteristics: &a-ws3-s3-t3-w2-i5 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: &d-ws3-s3-t3-w2-i2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 0, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
