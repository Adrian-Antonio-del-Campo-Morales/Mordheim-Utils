# PARTIAL: 6 scenarios evidence the shared dagger profile (the granted 6+ save against an unarmoured target and the +1 to a worn suit, each on both faces of its boundary) and the printed infection itself: a natural hit 6 with a failed Toughness test adds the extra automatic wound while the dagger's own To Wound roll still fails, and the same six against an immune Undead/Possessed target produces no infection test at all. The executable sequence is the recorded one: modular/attacks.py fires on a natural hit 6 when the defender is not poison-immune and does not carry undead_or_possessed, requests the single-die Toughness test at {attack_key}.infection (phases._characteristic_test reads one D6 that must be <= Toughness and not a 6) and on failure resolves a nested attack under the key {attack_key}.infection-wound whose effect is automatic_hit with effect.automatic-wound, fixed_strength 3 and effect.no-critical - that nested attack takes no hit, parry or wound die and cannot open a second infection, and on a two-wound unarmoured target it needs neither an armour die nor an injury die, so the tape is derivable and is authored below. DECIDED (D13-otra, 2026-10-14): the infection's extra wound is automatic and the victim makes no armour rolls at all - not even an unbonified one - so the dagger's own +1 armour-save bonus question is moot: no save die is requested for that wound. The executor's nested attack requests an ordinary (unbonified) armour die today, so the automatic no-save resolution is remitted to the engine as dec-d13-infection-automatic; the infection tape on an armoured victim stays undeclared until that engine change. the immunity tag name is on record as undead_or_possessed and is supplied through the recorded combat trait.

# --- Authored scenarios ---
# mechanic/weapon.disease-dagger - dagger profile with +1 to the enemy armour
# save, plus infection on a natural hit six.
#
# Expectations come from the printed rule and the admitted clause `whole`, never
# from engine output.  The authored scenarios pin only the save modifiers; the
# infection facet is recorded as a remaining gap in the clause note and is not
# replaced by a weaker expectation.
# An unarmoured target is given the printed 6+ save, and the 6 holds it.

- audit_id: mechanic/weapon.disease-dagger
  id: disease-dagger-grants-an-unarmoured-target-a-six-plus-save
  fighters:
    first:
      main_weapon_id: weapon.disease-dagger
      characteristics: &a-ws3-s3-t3-w2-i5 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: &d-ws3-s3-t3-w2-i2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.armour, value: 6}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.saved: True, attacks.0.damage: 0, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
