# The printed infection facet, now authored: the natural hit six forces the Toughness test, the
# declared four exceeds the target's Toughness of three, and the nested automatic wound lands even
# though the dagger's own To Wound roll then fails.  The extra wound takes no To Hit die, no parry
# die and no armour die on this unarmoured target, so the tape is the hit, the test and the two
# wound steps in that order.
- audit_id: mechanic/weapon.disease-dagger
  id: a-natural-six-infects-and-the-extra-wound-lands
  fighters:
    first:
      main_weapon_id: weapon.disease-dagger
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 6}
    - {key: round.0.first.attack.0.infection, value: 4}
    # The failed Toughness test resolves the infection as its own automatic wound
    # before the dagger's own wound roll, and a two-wound defender keeps the
    # remaining wound, so no injury die follows it.
    - {key: round.0.first.attack.0.wound, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    # The attack as a whole reports the wound the infection dealt, so the observable
    # left for the base wound roll is the wound count itself.
    0: {state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The printed immunity, on the same declared six: an Undead/Possessed target is not offered the
# Toughness test at all (the tape carries no infection die) and the failed To Wound roll leaves the
# target at full wounds, so the pair isolates the infection from the ordinary dagger attack.
- audit_id: mechanic/weapon.disease-dagger
  id: an-immune-target-is-not-infected
  fighters:
    first:
      main_weapon_id: weapon.disease-dagger
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      trait_overrides: {undead_or_possessed: true}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 6}
    - {key: round.0.first.attack.0.wound, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.wounded: false, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
