#
# AUTHORED: 4 scenarios cover the failed Leadership test that blocks the target's attacks while leaving it standing and defending, the passed test that leaves both pools intact, the recorded immunity that skips the test for an Undead target (the printed Lizardman half of the same gate term is not supplied by this vocabulary), and the absence of the gate without the dance.

# --- Authored scenarios ---
# The dancer forces the opposing warrior's Leadership test at the round start.  The two
# declared sixes total twelve against Leadership 6 and fail it, so the target cannot
# attack: its pool contributes no die at all, while the dancer's own attack resolves
# normally and the target stays Standing (its defence is never removed).
- audit_id: mechanic/mechanic.mesmerising-dance
  id: a-failed-leadership-test-blocks-the-target-s-attacks
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.mesmerising-dance]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 6}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.mesmerising-dance.0, value: 6}
    - {key: round.0.second.mesmerising-dance.1, value: 6}
    - {key: round.0.first.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: false, state.second.charm_attack_blocked: true, state.second.condition: STANDING, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The same test passed on a total of two: nothing is blocked, both pools are resolved
# and each warrior asks for its own To Hit die.
- audit_id: mechanic/mechanic.mesmerising-dance
  id: a-passed-leadership-test-leaves-both-pools-intact
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.mesmerising-dance]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 6}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.mesmerising-dance.0, value: 1}
    - {key: round.0.second.mesmerising-dance.1, value: 1}
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: false, attacks.1.hit: false, state.second.charm_attack_blocked: false}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# "Useless against ... undead": an Undead target skips the test entirely, which the
# strict tape records by carrying no mesmerising-dance die at all, and keeps its own
# attack.  The identity is supplied the way the corpus already supplies it elsewhere
# (`trait_overrides: {creature_kind: undead}`).
- audit_id: mechanic/mechanic.mesmerising-dance
  id: an-undead-target-skips-the-dance-test
  fighters:
    first:
      main_weapon_id: weapon.mace
