#
# AUTHORED: 3 scenarios cover the declared attack losing its parry window, the same attack parryable when the declaration is declined, and a two-attack bearer whose declaration names only its second attack.

# --- Authored scenarios ---
# mechanic/mechanic.unpredictable-attack — every expectation below comes from
# the printed rule (the Hero may declare one of its attacks Unpredictable and
# that attack cannot be parried by the opponent) and the recorded semantic
# contract, never from engine output.  The defender carries a buckler, so the
# parry would otherwise be offered: a refused parry is observed as the absent
# parry die, an unspent parry attempt and an unparried attack.
- audit_id: mechanic/mechanic.unpredictable-attack
  id: a-declared-attack-cannot-be-parried
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.unpredictable-attack]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      off_hand_id: defence.buckler
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.unpredictable-attack.0, value: true}
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.parried: false, state.second.parries_remaining: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The contrast: the same profiles and dice with the declaration declined, so the
# parry window exists, is attempted, fails against the hit and is spent.
- audit_id: mechanic/mechanic.unpredictable-attack
  id: the-same-attack-is-parryable-when-nothing-is-declared
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.unpredictable-attack]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      off_hand_id: defence.buckler
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.unpredictable-attack.0, value: false}
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.parry, value: 3}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.parried: false, state.second.parries_remaining: 0, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The declaration names one attack: with two attacks the bearer keeps the parry
# window on the first and removes it from the second, which is the documented
# per-attack offer order of the declaration input.
- audit_id: mechanic/mechanic.unpredictable-attack
  id: the-declaration-names-which-attack-the-parry-cannot-stop
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.unpredictable-attack]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 2}
    second:
      main_weapon_id: weapon.mace
      off_hand_id: defence.buckler
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.unpredictable-attack.0, value: false}
    - {key: round.0.first.unpredictable-attack.1, value: true}
  # The pool rolls every To Hit die before any defence is offered, so the parry
  # attempt for the highest hit roll follows both declared hits.
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.1.hit, value: 4}
    - {key: round.0.first.attack.0.parry, value: 5}
    - {key: round.0.first.attack.1.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.parried: true, attacks.1.parried: false, state.second.parries_remaining: 0, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
