#
# AUTHORED: 4 scenarios cover the conversion of a failed To Hit roll, of a
#   failed To Wound roll and of the holder's own failed armour save into a success, and
#   the single use that makes the next failure in the same duel stand.

# --- Authored scenarios ---
# A failed To Hit roll is turned into a valid success: the declared one would miss the
# printed 4+, and the pool then resolves the ordinary wound against the converted hit.
# The conversion is recorded as the spent once-per-duel resource.
- audit_id: mechanic/mechanic.mark-of-the-old-ones
  id: a-failed-hit-roll-becomes-a-success
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.mark-of-the-old-ones]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: true, attacks.0.wounded: true, state.first.resources_spent: [mark-of-the-old-ones], state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
