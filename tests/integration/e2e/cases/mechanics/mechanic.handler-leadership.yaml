#
# AUTHORED: 2 scenarios cover the supplied handler value
#   replacing the animal's own and its absence.  Documented gap: the engine
#   reads the handler's value as a supplied trait and models neither the
#   printed 6-inch eligibility of the handler nor the prohibition on ordinary
#   leader borrowing, so both stay caller-supplied facts (leadership.py:45).

# --- Authored scenarios ---
# The animal's own printed Leadership 3 fails a total of eight, but the supplied
# handler value 8 is the one tested, so the charge and the attacks stand.
- audit_id: mechanic/mechanic.handler-leadership
  id: the-supplied-handler-value-is-the-one-tested
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.handler-leadership]
      trait_overrides: {stupidity: true, stupidity_leadership: 8}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 3}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.stupidity.0, value: 4}
    - {key: round.0.first.stupidity.1, value: 4}
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.stupidity_failed: False, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# With no handler value supplied the same eight is tested against the animal's own
# Leadership 3 and fails, so the charge is cancelled and no attack is resolved.
- audit_id: mechanic/mechanic.handler-leadership
  id: without-a-handler-value-the-own-leadership-is-tested
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.handler-leadership]
      trait_overrides: {stupidity: true}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 3}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.stupidity.0, value: 4}
    - {key: round.0.first.stupidity.1, value: 4}
  expect_rounds:
    0: {attacks: [], state.first.stupidity_failed: True, state.first_charged: False, state.engaged: False}
  expect_final: {rounds_executed: 1, termination_reason: disengaged}

