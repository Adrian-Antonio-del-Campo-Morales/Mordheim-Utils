# --- Authored scenarios ---
# The Gaoler's Fear is printed against Humans only, and the opposing warrior carries
# the supplied species fact, so the voluntary charge needs the Leadership test that
# his sixes fail.
- audit_id: mechanic/mechanic.fear-human
  id: a-human-opponent-must-test-his-leadership
  covers: [fear-human]
  fighters:
    first:
      main_weapon_id: weapon.mace
      trait_overrides: {species: human}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 6}
    second:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.fear-human]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 6}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.fear.charge.0, value: 6}
    - {key: round.0.first.fear.charge.1, value: 6}
  expect_rounds:
    0: {attacks: [], state.first_charged: False, state.failed_charges: ['first'], state.engaged: False}
  expect_final: {rounds_executed: 1, termination_reason: disengaged}
