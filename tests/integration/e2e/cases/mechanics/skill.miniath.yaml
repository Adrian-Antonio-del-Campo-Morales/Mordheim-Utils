# clause: parry-with-any-weapon
# A mace cannot parry, so the only difference in the two capacity scenarios is
# the skill: the allowance is read from state.parries_remaining, and no parry
# attempt is made (both attacks miss), so the allowance is untouched by the round.
- audit_id: mechanic/skill.miniath
  id: the-skill-allows-a-parry-with-a-weapon-that-cannot-parry
  covers: [parry-with-any-weapon]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      skill_ids: [skill.miniath]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.parries_remaining: 1, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

