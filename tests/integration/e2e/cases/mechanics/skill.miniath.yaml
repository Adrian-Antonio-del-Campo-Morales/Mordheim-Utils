# clause: reroll-with-a-parrying-weapon
# The defender carries a starsword, whose own parry the printed clause requires;
# a parry must beat the to-hit roll, so a 3 fails against a 4 and the re-rolled 5
# blocks.  The starsword grants one parry, which the successful block consumes.
- audit_id: mechanic/skill.miniath
  id: a-failed-parry-is-rolled-again-with-a-parrying-weapon
  covers: [reroll-with-a-parrying-weapon]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.starsword
      skill_ids: [skill.miniath]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.parry, value: 3}
    - {key: round.0.first.attack.0.parry.reroll, value: 5}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.parried: True, attacks.0.wounded: False, state.second.wounds: 2, state.second.parries_remaining: 0}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

