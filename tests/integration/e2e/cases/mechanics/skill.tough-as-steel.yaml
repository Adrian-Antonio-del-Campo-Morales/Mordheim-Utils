# AUTHORED: 3 scenarios cover the same injury total of five leaving the bearer Stunned instead of Out of Action, the same total taking an unskilled bearer out, and a total of six still taking the bearer out.
# source-vs-port conflict (preserved, not resolved): the register warns that the vectorized port consumes this skill as Hard to Kill (which would leave the bearer Stunned on a three as well) while the reference modular path consumes it as True Grit with its own band. These scenarios follow the reference path named by the recorded contract (out_of_action_threshold 6, stunned_from 4); the two ports disagree and the choice of governing port is a coordinator decision.

# --- Authored scenarios ---
# mechanic/skill.tough-as-steel - authored from the printed "only goes Out of
# Action on a 6 on the Injury table" clause and the recorded contract, never from
# engine output.  The opponent is given one wound and no protection, so a single
# ordinary wound of one takes him to zero and the round resolves exactly one
# injury die; the injury total is that die because a plain mace wound adds no
# injury modifier and only a critical adds the table's bonus, which these
# scenarios do not use.  The bearer is left Stunned or Out of Action by all three
# injuries, so the bearer strikes back in none of them and no scenario declares
# his own attack roll.
- audit_id: mechanic/skill.tough-as-steel
  id: an-injury-total-of-five-stuns-instead-of-removing-the-bearer
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: &tas-attacker {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      skill_ids: [skill.tough-as-steel]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 2, attacks: 1}
  duel_context: &tas-context {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 5}
    - {key: round.0.first.attack.0.injury.0, value: 5}
  expect_rounds:
    0: {attacks.0.wounded: True, attacks.0.damage: 1, state.second.wounds: 0, state.second.condition: STUNNED}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

