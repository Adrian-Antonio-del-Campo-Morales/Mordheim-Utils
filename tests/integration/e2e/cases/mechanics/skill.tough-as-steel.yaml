# --- Authored scenarios ---
# mechanic/skill.tough-as-steel - authored from the printed "only goes Out of
# Action on a 6 on the Injury table" clause and the recorded contract, never from
# engine output.  The opponent is given one wound and no protection, so a single
# ordinary wound of one takes him to zero and the round resolves exactly one
# injury die; the injury total is that die because a plain mace wound adds no
# injury modifier and only a critical adds the table's bonus, which these
# scenarios do not use.  The bearer is left Stunned or Out of Action by all three
# injuries, so the bearer strikes back in none of them and no scenario declares
# his own attack roll.
