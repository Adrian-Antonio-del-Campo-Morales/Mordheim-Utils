# AUTHORED: 2 scenarios cover the flail's printed first-round Strength bonus being retained for this bearer in the second round, and the same declaration failing once the skill is removed.

# --- Authored scenarios ---
# The bearer uses a flail, whose printed first-round Strength bonus is two.  With
# the skill the bonus survives into the second round, so a wound die of three
# wounds a Toughness 3 opponent from Strength 2 + 2; round 0 is spent on misses so
# the second round is the only round that can show the difference.
- audit_id: mechanic/skill.mighty-biceps
  id: the-heavy-weapon-bonus-is-retained-in-the-second-round
  fighters:
    first:
      main_weapon_id: weapon.flail
      skill_ids: [skill.mighty-biceps]
      characteristics: {weapon_skill: 3, strength: 2, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [second], active_participant: second}
  maximum_rounds: 2
  rolls:
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.1.first.attack.0.hit, value: 4}
    - {key: round.1.first.attack.0.wound, value: 3}
    - {key: round.1.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.wounds: 2}
    1: {attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 2, termination_reason: horizon}
# Without the skill the identical second-round wound die of three fails against
# Toughness 3 from Strength 2, so the same attack deals no damage: the printed
# retention is what the pair isolates.
- audit_id: mechanic/skill.mighty-biceps
  id: without-the-skill-the-bonus-is-not-retained
  fighters:
    first:
      main_weapon_id: weapon.flail
      characteristics: {weapon_skill: 3, strength: 2, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [second], active_participant: second}
  maximum_rounds: 2
  rolls:
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.1.first.attack.0.hit, value: 4}
    - {key: round.1.first.attack.0.wound, value: 3}
    - {key: round.1.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.wounds: 2}
    1: {attacks.0.damage: 0, state.second.wounds: 2}
  expect_final: {rounds_executed: 2, termination_reason: horizon}

