# AUTHORED: 6 scenarios and 2 refusals cover the first-round +1 Strength and its expiry, the Concussion band, the Basha helmet clamp with its control, the shield permission and the two printed prohibitions.

# --- Authored scenarios ---
# mechanic/weapon.skull-busta - Basha: +1 Strength in the first combat turn,
# Concussion, ordinary helmet reactions clamped to 6, shields allowed and no other
# weapon or mounted use.
#
# Expectations come from the printed rule and the admitted clause `whole`, never
# from engine output.  The helmet clamp is evidenced against a control on the same
# reaction face with an ordinary weapon.
# Strength 4 against Toughness 3 wounds on a 3 in the first round; in the second round the same weapon is the bearer's Strength 3, so the 3 no longer wounds on the printed 4+.

- audit_id: mechanic/weapon.skull-busta
  id: skull-busta-adds-one-strength-in-the-first-round-only
  fighters:
    first:
      main_weapon_id: weapon.skull-busta
      characteristics: &a-ws3-s3-t3-w2-i5 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: &d-ws3-s3-t3-w2-i2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 2
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 3}
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.1.first.attack.0.hit, value: 4}
    - {key: round.1.first.attack.0.wound, value: 3}
    - {key: round.1.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 1, state.second.wounds: 1}
    1: {attacks.0.damage: 0, state.second.wounds: 1}
  expect_final: {rounds_executed: 2, termination_reason: horizon}
# Concussion on Injury rolls of 2-4 is the printed band.

- audit_id: mechanic/weapon.skull-busta
  id: skull-busta-injury-two-is-stunned
  fighters:
    first:
      main_weapon_id: weapon.skull-busta
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: &d-ws3-s3-t3-w1-i2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 3}
    - {key: round.0.first.attack.0.injury.0, value: 2}
  expect_rounds:
    0: {attacks.0.damage: 1, state.second.wounds: 0, state.second.condition: STUNNED}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# Against Basha the ordinary helmet reaction is clamped to a 6, so the 5 that would convert a stun against any other weapon leaves the target Stunned.

- audit_id: mechanic/weapon.skull-busta
  id: basha-limits-the-helmet-reaction-to-a-six
  fighters:
    first:
      main_weapon_id: weapon.skull-busta
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      defence_ids: [defence.helmet]
      characteristics: &d-ws3-s3-t3-w1-i2-helmet {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 3}
    - {key: round.0.first.attack.0.injury.0, value: 3}
    - {key: round.0.first.attack.0.helmet, value: 5}
  expect_rounds:
    0: {state.second.wounds: 0, state.second.condition: STUNNED}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# Control on the same face: an ordinary weapon leaves the helmet reaction at its printed 4+, so the same 5 converts the stun to a knock-down.

- audit_id: mechanic/weapon.skull-busta
  id: an-ordinary-weapon-lets-the-same-helmet-reaction-convert
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      defence_ids: [defence.helmet]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.injury.0, value: 3}
    - {key: round.0.first.attack.0.helmet, value: 5}
  expect_rounds:
    0: {state.second.condition: KNOCKED_DOWN}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# The printed prohibition on any other weapon is declared as a refusal.

