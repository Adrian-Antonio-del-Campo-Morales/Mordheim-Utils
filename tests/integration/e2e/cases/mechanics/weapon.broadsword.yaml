    - {kind: roll, key: round.0.first.attack.0.hit, sides: 6, value: 1}
# The printed restriction on a second weapon in the other hand is declared as a refusal.

- audit_id: mechanic/weapon.broadsword
  id: broadsword-is-refused-with-an-off-hand-weapon
  fighters:
    first:
      main_weapon_id: weapon.broadsword
      off_hand_id: weapon.dagger
    second:
      main_weapon_id: weapon.mace
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  expect_error: "weapon.broadsword cannot be combined with weapon.dagger"
# The printed permission to carry a shield is the control on the refusal: this loadout compiles and resolves a round.

- audit_id: mechanic/weapon.broadsword
  id: broadsword-is-accepted-with-a-shield
  fighters:
    first:
      main_weapon_id: weapon.broadsword
      off_hand_id: defence.shield
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
