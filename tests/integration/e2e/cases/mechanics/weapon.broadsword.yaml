# --- Authored scenarios ---
# mechanic/weapon.broadsword - Strength +1, strikes after ordinary weapons, and
# only a shield may fill the other hand.
#
# Expectations come from the printed rule and the admitted clause `whole`, never
# from engine output.  The strike-last scenario confirms the order through the
# strict tape rather than through a tie roll.
# +1 Strength moves the wound target against Toughness 3 to 3+.

- audit_id: mechanic/weapon.broadsword
  id: broadsword-wounds-at-the-boosted-strength
  fighters:
    first:
      main_weapon_id: weapon.broadsword
      characteristics: &a-ws3-s3-t3-w2-i5 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: &d-ws3-s3-t3-w2-i2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  # The broadsword is a two-handed weapon, so its bearer strikes last however the
  # printed Initiatives read; the defender opens the round and the tape follows the
  # pool's real order.
  rolls:
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 3}
  # The defender strikes first, so its own attack is the first entry of the round: the
  # broadsword's wound is the second one, and it is the one the boosted Strength lands.
  expect_rounds:
    0: {attacks.0.damage: 0, attacks.1.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# One face below the boosted wound target.

- audit_id: mechanic/weapon.broadsword
  id: broadsword-does-not-wound-one-face-below
  fighters:
    first:
      main_weapon_id: weapon.broadsword
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  # The broadsword is a two-handed weapon, so its bearer strikes last however the
  # printed Initiatives read; the defender opens the round and the tape follows the
  # pool's real order.
  rolls:
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 2}
  expect_rounds:
    0: {attacks.0.damage: 0, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# Neither fighter charges, so only the printed strike-last tier can send the ordinary weapon first; the bearer's higher Initiative cannot lift it.

- audit_id: mechanic/weapon.broadsword
  id: broadsword-strikes-after-an-ordinary-weapon
  fighters:
    first:
      main_weapon_id: weapon.broadsword
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: &a-ws3-s3-t3-w2-i2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.0.first.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.wounds: 2, state.first.wounds: 2}
