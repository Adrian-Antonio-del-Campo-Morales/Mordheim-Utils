# --- Authored scenarios ---
# # The charge is against a Fear-causing opponent, so the failed individual Leadership
# # test is offered exactly one reroll and the accepted second result stands.
- audit_id: mechanic/mechanic.questing-vow
  id: the-failed-test-against-a-fear-causer-is-taken-again
  covers: [whole]
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.questing-vow]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 6}
    second:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.causes-fear]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.fear.charge.reroll, value: true}
  rolls:
    - {key: round.0.first.fear.charge.0, value: 6}
    - {key: round.0.first.fear.charge.1, value: 6}
    - {key: round.0.first.fear.charge.reroll.0, value: 1}
    - {key: round.0.first.fear.charge.reroll.1, value: 1}
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first_charged: True, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# # The printed reroll is optional and single: refusing it leaves the failed test standing,
# # so the voluntary charge is cancelled and no attack is resolved.
