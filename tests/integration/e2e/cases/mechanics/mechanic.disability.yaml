# The printed result-2 prohibition, first face: a Parkinson's group cannot use two
# weapons. The loadout declares the supplied main and off hand and the rolled result
# 2; the refusal fragment is the printed wording, held while the construction
# consumer is still to be connected.
- audit_id: mechanic/mechanic.disability
  id: a-parkinson-s-roll-refuses-two-weapons
  covers: [no-two-weapons-or-weapon-and-shield]
  fighters:
    first:
      main_weapon_id: weapon.mace
      off_hand_id: weapon.dagger
      skill_ids: [mechanic.disability]
      condition_ids: [condition.disability-2]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
