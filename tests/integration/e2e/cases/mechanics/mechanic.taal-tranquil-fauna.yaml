# AUTHORED: 5 scenarios cover the ordinary animal that never attacks, the handled animal that attacks only when its supplied handler's Leadership is the one tested and passes on exactly eight, the failed test that blocks it, and two refusals. Documented gap: the printed clause names Animals, Animal Handler and large predatory beasts, while the executor demands an explicit qualification key (fauna_animal_kind in ordinary/handled/large-predator or normal_animal) plus animal_handler_leadership, and refuses any species.animal without one; nothing in this clause maps the printed names to those keys, so the two refusal scenarios assert the executor's own demand instead of a printed outcome (rounds.py:368-392, compiler.py:468-503).

# --- Authored scenarios ---
# An ordinary animal never attacks the Priest: the animal's own mace blow is not
# made at all, without any Leadership test being requested for it.
- audit_id: mechanic/mechanic.taal-tranquil-fauna
  id: an-ordinary-animal-never-attacks-the-priest
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.taal-tranquil-fauna]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      trait_overrides: {fauna_animal_kind: ordinary}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
  expect_rounds:
    0: {state.second.charm_attack_blocked: True, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# A handled animal must pass a Leadership test on its handler's value: the animal's
# own Leadership 3 would fail a total of eight, but the supplied handler's 8 is the
# value actually tested, the total of exactly eight passes, and the animal attacks.
- audit_id: mechanic/mechanic.taal-tranquil-fauna
  id: a-handled-animal-attacks-only-on-its-handlers-passed-test
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.taal-tranquil-fauna]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      trait_overrides: {fauna_animal_kind: handled, animal_handler_leadership: 8}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.tranquil-fauna.0, value: 4}
    - {key: round.0.second.tranquil-fauna.1, value: 4}
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.charm_attack_blocked: False, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
