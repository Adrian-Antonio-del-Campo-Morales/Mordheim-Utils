# The coating is supplied on `main_poison_id`; the same wound face of 3 wounds at
# Strength 4 (printed 3 + 1) and misses at the uncoated Strength 3.
- audit_id: mechanic/poison.black-venom
  id: black-venom-raises-the-wound-strength-by-one
  fighters:
    first:
      main_weapon_id: weapon.mace
      main_poison_id: poison.black-venom
      characteristics: &bv-attacker {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: &bv-defender {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: &bv-context {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 3}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

