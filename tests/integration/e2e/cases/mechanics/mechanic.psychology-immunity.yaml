#
# AUTHORED: 3 scenarios cover the skipped Fear test, the
#   skipped Stupidity test and a fire-fear Leadership test that still rolls.

# --- Authored scenarios ---
# The opponent causes Fear, so the charging warrior would test; the immunity removes
# the test entirely and the round's first event is the hit itself, which shows no
# Leadership die was taken.
- audit_id: mechanic/mechanic.psychology-immunity
  id: fear-is-not-tested-at-all
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.psychology-immunity]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 6}
    second:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.causes-fear]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 6}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 1, state.first_charged: True, state.second.fear_hit_sixes: False, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# The same exemption covers the start-of-turn Stupidity test, which would otherwise
# open the tape with a Leadership pair.
- audit_id: mechanic/mechanic.psychology-immunity
  id: stupidity-is-not-tested-either
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.stupidity, mechanic.psychology-immunity]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 6}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 6}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 1, state.first.stupidity_failed: False}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# The opposing brazier iron carries the printed fire attack, so this is not ordinary
# Fear: the charged-against warrior must still test his Leadership even though he
# ignores individual Psychology, and the failed test cancels his charge.  This is
# the clause's 'other Leadership requirements still roll normally'.
- audit_id: mechanic/mechanic.psychology-immunity
  id: a-fire-fear-test-is-still-taken
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.fears-fire, mechanic.psychology-immunity]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 6}
    second:
      main_weapon_id: weapon.brazier-iron
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 6}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.fear.charge.0, value: 6}
    - {key: round.0.first.fear.charge.1, value: 6}
  expect_rounds:
    0: {attacks: [], state.first_charged: False, state.failed_charges: ['first'], state.engaged: False}
  expect_final: {rounds_executed: 1, termination_reason: disengaged}

