# The base profile prints Strength as user -1, so a Strength 3 bearer attacks at
# Strength 2 and needs a 5 to wound Toughness 3 where a Strength 3 mace needs a 4.

- audit_id: mechanic/weapon.beastlash
  id: beastlash-base-profile-strikes-at-user-strength-minus-one
  covers: [whole]
  fighters:
    first:
      main_weapon_id: weapon.beastlash
      characteristics: &whole-ws3-s3-t3-w2-i5 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: &whole-ws3-s3-t3-w2-i2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: &whole-still {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 0, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

