# --- Authored scenarios ---
# mechanic/weapon.beastlash - Beastbane Fear against animals, an attack that
# cannot be parried, and Whipcrack.
#
# Expectations come from the printed rule and the admitted clauses
# `beastbane-fear`, `cannot-be-parried` and `whipcrack`, never from engine output.
# The Fear test is a two-dice Leadership test, so both faces are scripted.  The
# lash is a whip, so its bearer's pool gains one attack in the round it charges or
# is charged; when it is charged that bonus alone resolves at the strike-first
# tier and is recorded as its own attack label.
# The Beastlash bearer causes Fear in an animal, so the charged animal must first take its two-dice Fear test; the 3 it rolls is under its Leadership 8, so the test passes and the round continues.

- audit_id: mechanic/weapon.beastlash
  id: beastlash-fear-test-is-required-of-an-animal-that-is-charged
  covers: [beastbane-fear]
  fighters:
    first:
      main_weapon_id: weapon.beastlash
      characteristics: &a-ws3-s3-t3-w2-i5 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      trait_overrides: {normal_animal: True}
      characteristics: &d-animal-ld8 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 8}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.fear.charged.0, value: 2}
    - {key: round.0.second.fear.charged.1, value: 1}
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.first.attack.1.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.fear_hit_sixes: False, state.second.wounds: 2, state.first.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
  expect_events:
    - {kind: roll, key: round.0.second.fear.charged.0, sides: 6, value: 2}
    - {kind: roll, key: round.0.second.fear.charged.1, sides: 6, value: 1}
    - {kind: roll, key: round.0.first.attack.0.hit, sides: 6, value: 1}
    - {kind: roll, key: round.0.first.attack.1.hit, sides: 6, value: 1}
    - {kind: roll, key: round.0.second.attack.0.hit, sides: 6, value: 1}
