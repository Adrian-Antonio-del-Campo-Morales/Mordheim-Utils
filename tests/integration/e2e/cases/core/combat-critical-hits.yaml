      armour_id: armour.light-armour
      characteristics: {<<: *ws3-s3-t3-w3-i2, wounds: 2}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 6}
    - {key: round.0.first.attack.0.critical, value: 4}
    - {key: round.0.first.attack.0.injury.0, value: 4}
  expect_rounds:
    0: {state.second.condition: STUNNED, attacks.0.saved: false}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The allowance is per warrior, not per phase: two fighters can each score one
# critical in the same phase, so both critical dice are offered.  Each defender
# survives with wounds left, so the fight continues past the phase.
- audit_id: core/combat-critical-hits
  id: both-fighters-may-score-one-critical-in-the-same-phase
  covers: [one-per-phase]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 4, toughness: 3, wounds: 3, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 4, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 6}
    - {key: round.0.first.attack.0.critical, value: 1}
    - {key: round.0.second.attack.0.hit, value: 4}
    - {key: round.0.second.attack.0.wound, value: 6}
    - {key: round.0.second.attack.0.critical, value: 1}
  expect_rounds:
    0: {attacks.0.critical: true, attacks.0.damage: 2, state.second.wounds: 2, state.first.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# A critical-table modifier shifts which band the D6 lands in.  material.dark-elf-
# blade adds +1 ("Adds +1 to the critical hit table", catalog/mechanics/
# close-combat.yaml), so a raw critical die of 4 resolves as 5: it reaches the 5+
# band and adds +2 to Injury.  A roll of 1 on the Injury table then becomes 3, a
# Stunned result; without the modifier the same raw 4 would be the 3-4 band with
# no Injury bonus and the 1 would be Knocked Down.
- audit_id: core/combat-critical-hits
  id: a-critical-table-modifier-shifts-the-applied-band
  covers: [basic-table]
  fighters:
    first:
      main_weapon_id: weapon.mace
      main_material_id: material.dark-elf-blade
      characteristics: *s4-attacker
    second:
      main_weapon_id: weapon.mace
      characteristics: {<<: *ws3-s3-t3-w3-i2, wounds: 2}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 6}
    - {key: round.0.first.attack.0.critical, value: 4}
    - {key: round.0.first.attack.0.injury.0, value: 1}
  expect_rounds:
    0: {attacks.0.critical: true, attacks.0.damage: 2, state.second.condition: STUNNED}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# A successful rerolled wound is not a critical.  poison.devil-s-toxin rerolls a
# failed wound and "the re-roll cannot cause a critical hit" (catalog/mechanics/
# close-combat.yaml).  The first wound roll fails; the reroll succeeds on a 6 but
# offers no critical die, so the hit deals one wound instead of the critical's two.
- audit_id: core/combat-critical-hits
  id: a-rerolled-wound-is-not-critical
  covers: [critical-trigger]
  fighters:
    first:
      main_weapon_id: weapon.sword
      main_poison_id: poison.devil-s-toxin
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: *ws3-s3-t3-w3-i2
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 3}
    - {key: round.0.first.attack.0.wound.reroll, value: 6}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.wounded: true, attacks.0.critical: false, attacks.0.damage: 1,
        state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# When another multiple-wound source is larger than the critical's two wounds the
# higher value prevails instead of multiplying.  weapon.ball-and-chain inflicts D3
# damage ("Successful wounds inflict D3 damage", catalog/mechanics/close-combat.
# yaml) and adds +2 Strength, so the S5 attacker wounds on 2+; the natural six is
# critical for two wounds, the D3 shows 3, and max(1, 3, 2) is 3: three wounds,
# not four and not six.  The defender survives on one Wound and keeps fighting.
- audit_id: core/combat-critical-hits
  id: a-higher-multiple-damage-source-prevails
  covers: [damage-stacking]
  fighters:
    first:
      main_weapon_id: weapon.ball-and-chain
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 4, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 6}
    - {key: round.0.first.attack.0.critical, value: 1}
    - {key: round.0.first.attack.0.damage, sides: 3, value: 3}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.critical: true, attacks.0.damage: 3, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
