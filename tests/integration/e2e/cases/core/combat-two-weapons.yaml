# core/combat-two-weapons — the extra attack and the off-hand allocation.
#
# Expectations come from the accepted clauses of
# docs/knowledge/2a2b/tasks/T13-semantic-analysis.csv (identity
# core/combat-two-weapons, clauses extra-attack / mixed-weapons), never from
# engine output.
#
# The clauses require exactly one additional attack from a second one-handed
# weapon, added after every other attack modifier including doubling; and, with
# two different weapons, exactly one attack resolved with the off-hand profile
# while all remaining attacks use the nominated main weapon.
#
# The attack count is observed through the strict dice tape: the number of hit
# rolls the pipeline requests is the number of attacks it resolved, and an extra
# or missing attack fails the scenario.  Each attack's weapon is observed through
# its own profile: a dagger grants the target +1 armour save, so the same rolled
# five is a save against the dagger and a wound against the mace.
#

- audit_id: core/combat-two-weapons
  id: two-weapons-add-one-attack
  covers: [extra-attack]
  fighters:
    first:
      main_weapon_id: weapon.mace
      off_hand_id: weapon.axe
      characteristics: &ws3-s3-t3-w2-i5-a2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 2}
    second:
      main_weapon_id: weapon.mace
      characteristics: &ws3-s3-t3-w2-i2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.main-weapon-majority, value: true}
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.first.attack.1.hit, value: 1}
    - {key: round.0.first.attack.2.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.wounds: 2, state.round_index: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
  expect_events:
    - {kind: decision, key: round.0.first.main-weapon-majority, value: true}
    - {kind: roll, key: round.0.first.attack.0.hit, sides: 6, value: 1}
    - {kind: roll, key: round.0.first.attack.1.hit, sides: 6, value: 1}
    - {kind: roll, key: round.0.first.attack.2.hit, sides: 6, value: 1}
    - {kind: roll, key: round.0.second.attack.0.hit, sides: 6, value: 1}

