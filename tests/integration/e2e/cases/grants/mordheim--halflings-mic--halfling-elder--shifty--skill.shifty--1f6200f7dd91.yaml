# --- Authored scenarios ---
# The admitted clause grants the halfling one bonus attack when he is charged, and it strikes first.
# In both scenarios the halfling is charged (the second participant is the charger) and every attack is
# scripted as a miss, so the two observable consequences are the pool size and the resolution order:
# the bonus joins the pool as its own strike at the strike-first tier, which the declared roll order
# records before the charger's attack and before the halfling's own ordinary attacks.
