# --- Authored scenarios ---
# Derived from the printed rule for this bearer and the admitted clause; no engine
# output was consulted.  Nightshade is the one admitted poison whose consequence is a
# state change on the warrior it wounds, so it is the rider the immunity must suppress:
# the coated mace wounds the bearer as any mace would, and the poisoned-wound
# Initiative penalty never lands.  The attacker's Weapon Skill 10, Strength 8 and
# Initiative 10 are hand-built fixture facts, not profile values, and its higher
# Initiative with no charge declared lets it strike first, so the bearer declares no
# attack of its own and the tape holds only the attacker's hit and wound dice.
- audit_id: rule/mordheim/clockworkers-sc/band--constructs/unimplemented.clockworkers-sc.band.constructs
  id: the-poisoned-wound-keeps-its-wound-and-loses-its-rider
  covers: [constructs-poison-immunity]
  fighters:
    first:
      main_weapon_id: weapon.mace
      main_poison_id: poison.nightshade
      characteristics: {weapon_skill: 10, strength: 8, toughness: 3, wounds: 3, initiative: 10, attacks: 1}
    second: {collection: mordheim, band_id: clockworkers-sc, profile_id: clockwork-soldiers}
  # Clockwork Soldiers hold a single Wound, so the fixture starts at that one.
  initial_state: {second: {wounds: 1, attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    # A five wounds an S8 attack against T3 without being the critical six, so the
    # scenario reads the poisoned wound itself.
    - {key: round.0.first.attack.0.wound, value: 5}
    - {key: round.0.first.attack.0.injury.0, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 1, state.second.wounds: 0,
        state.second.condition: KNOCKED_DOWN, state.second.initiative_penalty: 0}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The control uses the same attacker and the same declared dice against an ordinary hand-built neighbour
# instead of the construct, so the immunity is the only difference between the two scenarios: the poisoned
# wound lands as before and this time the printed Nightshade penalty does take effect - one unsaved wound
# lowers the target's Initiative by one, from 5 to 4 (cases/mechanics/poison.nightshade.yaml).
- audit_id: rule/mordheim/clockworkers-sc/band--constructs/unimplemented.clockworkers-sc.band.constructs
  id: the-same-poisoned-wound-lowers-an-ordinary-targets-initiative
  covers: [constructs-poison-immunity]
  fighters:
    first:
      main_weapon_id: weapon.mace
      main_poison_id: poison.nightshade
      characteristics: {weapon_skill: 10, strength: 8, toughness: 3, wounds: 3, initiative: 10, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
  initial_state: {second: {wounds: 2, attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    # A five wounds an S8 attack against T3 without being the critical six, so the
    # scenario reads the poisoned wound itself.
    - {key: round.0.first.attack.0.wound, value: 5}
  expect_rounds:
    # The wound records its Initiative penalty; the base characteristic is not rewritten.
    0: {attacks.0.damage: 1, state.second.wounds: 1, state.second.initiative_penalty: 1, state.second.initiative: 5}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# Closing review (combined facet, mirrors of the canonical mechanic.* tapes): the construct mirror
#   carries the immunity beside Stupidity and Hatred and the frenzy flag, and the undeclared
#   psychology dice are the assertion.
- audit_id: rule/mordheim/clockworkers-sc/band--constructs/unimplemented.clockworkers-sc.band.constructs
  id: the-immunity-skips-stupidity-suppresses-frenzy-and-denies-the-hatred-reroll
  covers: [constructs-psychology-immunity]
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.stupidity, mechanic.hatred-undead, mechanic.psychology-immunity, mechanic.mark-of-arkhar]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 6}
    second: {collection: mordheim, band_id: undead, profile_id: zombies}
  # The Frenzy is not supplied as a lasting override: the immunity is a printed suppression of
  # the ordinary Frenzy benefit, so the frenzy has to come from a real compiled producer
  # (mechanic.mark-of-arkhar, a passive effect-set carrying `frenzy: true`) and the immunity gate
  # is observed where it applies.  An override applied after initialization would bypass that
  # gate and test a state the printed immunity does not admit.
  expect_initial: {first.frenzy: False}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  # The immunity owes two observations: no Stupidity or Fear die is offered at all, and the
  # suppressed frenzy grants no second attack.  Only the one attack the Frenzy would double is
  # scripted; the strict script is consumed completely, so a doubled pool is a mismatch.
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 0, state.first.stupidity_failed: False}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The printed No Pain of the construct: a single unsaved wound reaching the injury table lands a
#   stunned result that the transformation downgrades to knocked down.  The control uses the
#   resilient skill bearer (the canonical tape's second face) without ignore-pain, so the same
#   declared injury die stays stunned there.
- audit_id: rule/mordheim/clockworkers-sc/band--constructs/unimplemented.clockworkers-sc.band.constructs
  id: a-stunned-injury-result-becomes-knocked-down-on-the-construct
  covers: [constructs-ignore-pain]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
    second: {collection: mordheim, band_id: clockworkers-sc, profile_id: clockwork-soldiers}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  # Both print Initiative 2, so the order is decided by the tie die; a three sends the
  # clockwork soldier in first, the order the rest of this script declares.
  rolls:
    - {key: round.0.priority-tie, value: 3}
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 5}
    - {key: round.0.first.attack.0.injury.0, value: 3}
  expect_rounds:
    0: {state.second.condition: KNOCKED_DOWN}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

