#
# AUTHORED: 3 scenarios read the canonical clause on a hand-built single-Attack attacker.
# The charge consumes two declared hit rolls at the penalised target of 5 (the first holding on 5,
# the second failing on a 4 that would hit without the penalty), so both the doubled pool and the
# penalty are asserted together; without a charge the same attacker strikes once at the ordinary
# target of 4, and without the tag the charging turn is a single ordinary attack whose 4 hits,
# which fixes both consequences to the shared operator rather than to the charge.  The printed
# note that the doubling happens before any extra-weapon attack is added is a count-order term
# that needs a second weapon this clause does not print, so it is not asserted here.
# REVIEWED still requires manual semantic review.

# --- Authored scenarios ---
# Derived from the printed rule, the recorded contract and the admitted ferocious-charge grants
# specification; no engine output was consulted.  The catalog origin binds no recipient, so the
# fixture carries the canonical tag itself on a hand-built attacker (Weapon Skill 4, Attacks 1)
# whose printed single Attack is what the charge doubles, and the opponent is an equal
# Weapon-Skill boundary whose own strike is a declared natural 1.

