      skill_ids: [skill.ferocious-charge]
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 4, strength: 3, toughness: 3, wounds: 3, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 4, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  decisions:
