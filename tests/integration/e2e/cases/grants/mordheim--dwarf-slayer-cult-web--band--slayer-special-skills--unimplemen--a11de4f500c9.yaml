# --- Authored scenarios ---
# Derived from the printed row, this band's own profiles.yaml (the Slayer hero ranks and their declared
# skill categories) and the admitted catalogue rows the row's effect field names; no engine output was
# consulted.  Both fighters are given zero attacks so the round resolves without dice and the observation is
# access, not a member mechanic.

- audit_id: rule/mordheim/dwarf-slayer-cult-web/band--slayer-special-skills/unimplemented.dwarf-slayer-cult-web.special.slayer-special-skills
  id: the-printed-slayer-skill-is-admitted-to-a-slayer-hero
  covers: [slayer-skills]
  # The printed permission is the required behaviour: a Slayer hero may take a skill from the Slayer list, so
  # the build must compile and the engagement must start.  skill.monster-slayer is one of the members this
  # origin's own row enumerates.  The build is refused today because the row binds no member list, a KB
  # connection gap; the expectation is deliberately NOT that refusal.
  fighters:
    first:
      collection: mordheim
      band_id: dwarf-slayer-cult-web
      profile_id: giant-slayer
      skill_ids: [skill.monster-slayer]
    second:
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  initial_state: {first: {attacks: 0}, second: {attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  expect_initial: {first.attacks: 0, second.attacks: 0}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

- audit_id: rule/mordheim/dwarf-slayer-cult-web/band--slayer-special-skills/unimplemented.dwarf-slayer-cult-web.special.slayer-special-skills
  id: a-special-skill-outside-the-printed-list-is-refused
  covers: [slayer-skills]
  # The closure of the same printed access: a special skill that is not a member of the Slayer list is not
  # available to the recipient.  The fragment is the shared skill-availability sentence of this family.
  fighters:
    first:
      collection: mordheim
      band_id: dwarf-slayer-cult-web
      profile_id: giant-slayer
      skill_ids: [skill.miniath]
      main_weapon_id: weapon.mace
  expect_error: "skills are not available to dwarf-slayer-cult-web/giant-slayer: ['skill.miniath']"
