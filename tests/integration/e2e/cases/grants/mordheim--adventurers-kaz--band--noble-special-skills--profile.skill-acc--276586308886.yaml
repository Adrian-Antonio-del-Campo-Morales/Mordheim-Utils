#
# AUTHORED: 2 scenarios cover the printed permission (the Imperial Noble may use the Noble
#   table {Trading Flair, Taunt} instead of any of the standard tables).  The admission scenario
#   asserts the printed admission: the recipient build that selects the declared member
#   skill.trading-flair is accepted and the engagement starts (zero attacks declared on both sides,
