# --- Authored scenarios ---
# Derived from the printed sentence, the recorded contract and the accepted editorial specification for
# this origin; no engine output was consulted.  The joined access is a construction fact, so the
# observable is that the build compiles and its round runs instead of being refused.
- audit_id: rule/trollheim/chaos-streets-pit-fighters/dwarf-troll-slayer--slayer-skill-options/compiler.slayer-skill-options
  id: the-three-named-lists-are-accepted-together
  fighters:
    first:
      collection: trollheim
      band_id: chaos-streets-pit-fighters
      profile_id: dwarf-troll-slayer
      special_rule_ids:
      - band--dwarf-special-skills-thick-skull
      - band--pit-fighter-skill-force-of-will
      - band--slayer-special-skills-berserker
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  initial_state: {first: {attacks: 0}, second: {attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.priority-tie, value: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The dwarf list is one of the three joined lists, so the same recipient carries its row alone without
# being refused: the join adds lists, it does not require all of them.
- audit_id: rule/trollheim/chaos-streets-pit-fighters/dwarf-troll-slayer--slayer-skill-options/compiler.slayer-skill-options
