# --- Authored scenarios ---
# Derived from the printed draught table and the catalogue's own canonical conditions; no engine output
# was consulted.  Each tape supplies exactly one drawn result through FighterBuild.condition_ids - the
# channel compiler.resolve_supplied_conditions reads - and reads the printed statistic on the affected
# Hero; the opposing duelist is already out of the fight, so no combat die is consumed and the supplied
# grant itself is the observation.  The affected Hero's base characteristics are the fixture's own fact
# and are what the control tape reads unchanged.

- audit_id: rule/mordheim/channel-rats-mim/petru--potions/unimplemented.channel-rats-mim.petru.potions
  id: the-strength-draught-raises-the-affected-heroes-strength-by-one
  covers: [random-pre-battle-potion]
  # "2-3 Strength (+1 Strength bonus ...)": the supplied result is the catalogue's canonical
  # condition.petru-strength and the printed grant is read on the affected Hero.
  fighters:
    first:
      # The supplied draught is read on a Hero recipient, so the affected model is the
      # band's own hero profile carrying the fixture's characteristics.
      collection: mordheim
      band_id: channel-rats-mim
      profile_id: petru
      main_weapon_id: weapon.mace
      condition_ids: [condition.petru-strength]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 4, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 5, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  initial_state: {second: {condition: OUT}}
  maximum_rounds: 1
  expect_initial: {first.strength: 4}
  expect_final: {rounds_executed: 0, termination_reason: second_out}

