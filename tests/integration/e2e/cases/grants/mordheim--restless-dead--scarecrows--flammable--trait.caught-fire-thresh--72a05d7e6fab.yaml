# --- Authored scenarios ---
# Derived from the printed sentence, the recorded contract and the accepted specification; no engine
# output was consulted.  The bearer is the band's printed scarecrow, whose own profile row supplies the
# threshold; the ignition face is declared below the printed three in the boundary case.  Both fighters
# have Initiative 3, so the round opens with the priority-tie die and a four gives the striker the
# first action.  Flammable doubles the damage, so the injury step takes one die per damage point and
# both declared five faces take the one-wound bearer out.

- audit_id: rule/mordheim/restless-dead/scarecrows--flammable/trait.caught-fire-threshold
  id: the-scarecrow-catches-fire-on-a-declared-three
  covers: [caught-fire-three-plus]
  fighters:
    first:
      main_weapon_id: weapon.brazier-iron
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 3, attacks: 1}
    second:
      collection: mordheim
      band_id: restless-dead
      profile_id: scarecrows
  initial_state:
    second: {attacks: 0}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.priority-tie, value: 4}
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.ignition, value: 3}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.injury.0, value: 5}
    - {key: round.0.first.attack.0.injury.1, value: 5}
  expect_rounds:
    0: {state.second.on_fire: True, state.second.condition: OUT}
  expect_final: {rounds_executed: 1, termination_reason: second_out}

