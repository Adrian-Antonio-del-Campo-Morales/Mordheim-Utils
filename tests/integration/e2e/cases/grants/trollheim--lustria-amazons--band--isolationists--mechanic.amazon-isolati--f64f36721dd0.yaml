  id: the-first-round-miss-against-lizardmen-is-taken-again
  fighters:
    first:
      collection: trollheim
      band_id: lustria-amazons
      profile_id: amazon-champions
      main_weapon_id: weapon.stone-axe
    second:
      collection: trollheim
      band_id: lustria-lizardmen
      profile_id: skink-braves
  initial_state: {second: {wounds: 3, attacks: 0}}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.first.attack.0.hit.reroll, value: 6}
    - {key: round.0.first.attack.0.wound, value: 5}
    # The wound takes the printed last Wound of the qualifying opponent, so the recorded armour
