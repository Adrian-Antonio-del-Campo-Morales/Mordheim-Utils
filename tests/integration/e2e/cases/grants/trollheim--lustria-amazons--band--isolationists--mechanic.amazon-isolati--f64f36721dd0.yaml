# --- Authored scenarios ---
# Derived from the printed rule ("All Amazons are subject to Hatred against Norse and
# Lizardmen") and the recorded contract (mechanic.amazon-isolationists: a qualifying enemy rerolls
# a failed first-round attack).  The bearer is a printed Amazon warrior of the band; the two
# qualifying opponents are members of the two printed target bands, and the control is hand-built
# with the same Weapon Skill so the declared natural one always misses.  Wounds are supplied above
# one and the opponent's attacks suppressed, so each tape holds the reroll question alone; a
# build without the band rule asks for no reroll die and fails on the undeclared roll.

