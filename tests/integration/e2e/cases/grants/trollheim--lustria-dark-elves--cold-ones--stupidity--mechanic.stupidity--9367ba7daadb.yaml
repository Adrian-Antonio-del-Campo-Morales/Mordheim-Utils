# --- Authored scenarios ---
# Family model (Stupidity for a handler-led animal): the bearer is the printed recipient, built from
# its printed band profile, so the granted effect is what the scenario exercises.  Its physical
# characteristics are supplied as fixture facts (WS3 S3 T3 W3 I2 A1) so the dice thresholds and the
# strike order are fixed, while its printed Leadership 4 stays in place.  Following the accepted
# handler-parent case, the stupidity state and the Beastmaster's printed Leadership 8 are supplied
# as the two handler traits, which is what stands in for a Beastmaster within six inches; the test
# is taken at the start of the bearer's own turn, which is why the bearer is the charging active
# participant.  The bearer declares no weapon of its own, exactly as the accepted parent case does.

- audit_id: rule/trollheim/lustria-dark-elves/cold-ones--stupidity/mechanic.stupidity
  id: the-supplied-beastmaster-value-is-the-one-tested
  fighters:
    first:
      collection: trollheim
      band_id: lustria-dark-elves
      profile_id: cold-ones
      trait_overrides: {stupidity: true, stupidity_leadership: 8}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 1, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.stupidity.0, value: 4}
    - {key: round.0.first.stupidity.1, value: 4}
    - {key: round.0.second.fear.charged.0, value: 2}
    - {key: round.0.second.fear.charged.1, value: 2}
    - {key: round.0.first.attack.0.hit, value: 5}
    - {key: round.0.first.attack.0.wound, value: 5}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.stupidity_failed: false, attacks.0.damage: 1, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

