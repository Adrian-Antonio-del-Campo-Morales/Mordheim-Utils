# uncharged (`charging: []`) and the attacker holds the higher Initiative, so
# the attacker's pool always resolves first and the only Strength modifier
# reaching the defender's save is the attacker's own Strength.  A recipient that
# survives the incoming attack still strikes back, so each of its own attacks is
# scripted as a miss; the count is the profile's Attacks plus the extra attacks
# its own rules grant (the Saurus bite, the Fimir and Young Noble spiked tail).

