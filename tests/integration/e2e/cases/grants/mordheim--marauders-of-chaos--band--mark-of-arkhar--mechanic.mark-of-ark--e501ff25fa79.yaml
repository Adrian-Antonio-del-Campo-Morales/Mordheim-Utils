# --- Authored scenarios ---
# Derived from the printed rule, the recorded contract and the accepted test; no engine output was
# consulted.  The mark is a selected leader grant, so the printed Chieftain is the bearer.

- audit_id: rule/mordheim/marauders-of-chaos/band--mark-of-arkhar/mechanic.mark-of-arkhar
  id: the-marked-chieftain-is-frenzied-and-doubles-his-printed-attack
  covers:
  - whole--scope--frenzy
  fighters:
    first:
      collection: mordheim
      band_id: marauders-of-chaos
      profile_id: marauder-chieftain
      special_rule_ids: [band--mark-of-arkhar]
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 5, strength: 4, toughness: 4, wounds: 1, initiative: 5, attacks: 1, leadership: 8}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.1.hit, value: 1}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.frenzy: True, attacks.0.damage: 1, attacks.1.hit: False,
        attacks.2.hit: False, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

