#
# AUTHORED: 5 scenarios evidence the printed clause end to end.  Four of them carry its accumulation on
# the attacker: the penalty after a missed To Hit roll, the same point after a successful parry by the bearer, its
# cumulation across two of the bearer's turns while the two stay engaged, and its absence without the rule.  The
# fifth carries the printed end condition at the arm a snapshot can reach - the Hero being taken Out of Action:
# round 0 declares the accumulated point (state.first.initiative_penalty: 1) and round 1 declares the field back
# at zero in the same round the bearer's last wound is dealt (state.second.condition: OUT), so the reset is an
# observable difference between two round snapshots rather than an internal modifier.  The other arm of the same
# sentence - the penalty ending when the enemy is no longer engaged with the Hero - stays unrepresented because
# the fixture supplies contacts and distances as setup facts and the round loop ends when the duel disengages, so
# no post-disengagement round snapshot exists; that is recorded here as the remaining limit of this clause.
# THE DEFECT THESE TAPES DETECT (recorded, not hidden): the round snapshot carries
# state.<side>.initiative_penalty but no assignment in the modular round resets it, so the printed end condition
# has no implementation today - which is exactly what the fifth scenario fails on.

# --- Authored scenarios ---
# Every failed To Hit roll against the bearer adds one point of Initiative penalty to the
# attacker who missed, floored at zero, and a successful parry by the bearer adds one too.
# The tape shapes mirror the canonical operator of the same effect_id, which this band origin
# repeats without adding a term.
- audit_id: rule/trollheim/lustria-savage-goblins/band--savage-goblin-special-skills-spider-infested/mechanic.spider-infested
  id: a-missed-attack-against-the-bearer-penalises-the-attacker
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: &goblin-ws3-s3-t3-w2-i5 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.spider-infested]
      characteristics: &crawler-ws3-s3-t3-w2-i2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: &charging-first {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: false, state.first.initiative_penalty: 1, state.first.initiative_floor: 0, state.second.initiative_penalty: 0}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

