# The second printed trigger: the bearer parries an attack and the parried attacker is
# penalised.  The bearer carries a sword, so the parry die is requested and the five beats
# the declared hit roll of four.
- audit_id: rule/trollheim/lustria-savage-goblins/band--savage-goblin-special-skills-spider-infested/mechanic.spider-infested
  id: a-successful-parry-also-penalises-the-attacker
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: *goblin-ws3-s3-t3-w2-i5
    second:
      main_weapon_id: weapon.sword
      skill_ids: [mechanic.spider-infested]
      characteristics: *crawler-ws3-s3-t3-w2-i2
  duel_context: *charging-first
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.parry, value: 5}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.parried: true, state.first.initiative_penalty: 1, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# Cumulative and persistent while the two stay engaged: a second miss in the next round adds
# a second point, which is the printed duration the rule states.
- audit_id: rule/trollheim/lustria-savage-goblins/band--savage-goblin-special-skills-spider-infested/mechanic.spider-infested
  id: the-penalty-cumulates-while-the-two-stay-engaged
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: *goblin-ws3-s3-t3-w2-i5
    second:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.spider-infested]
      characteristics: *crawler-ws3-s3-t3-w2-i2
  duel_context: *charging-first
  maximum_rounds: 2
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.1.first.attack.0.hit, value: 1}
    - {key: round.1.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: false, state.first.initiative_penalty: 1}
    1: {attacks.0.hit: false, state.first.initiative_penalty: 2, state.engaged: true}
  expect_final: {rounds_executed: 2, termination_reason: horizon}

# The printed end condition, second arm: the penalty ends when the Hero is taken Out of Action.  Round 0
# accumulates one point (the enemy misses), and in round 1 the same enemy takes the bearer's last wound, so the
# cleared field is the difference between the two snapshots.  The bearer has one wound, so the declared injury
# result takes it out of action and it resolves no attack of its own in that round - a removed model does not
# strike back, which is why round 1 declares no second-attack die.
- audit_id: rule/trollheim/lustria-savage-goblins/band--savage-goblin-special-skills-spider-infested/mechanic.spider-infested
  id: the-accumulated-penalty-is-cleared-when-the-bearer-is-taken-out-of-action
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.spider-infested]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 2
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.1.first.attack.0.hit, value: 4}
    - {key: round.1.first.attack.0.wound, value: 4}
    - {key: round.1.first.attack.0.injury.0, value: 5}
  expect_rounds:
    0: {state.first.initiative_penalty: 1, state.engaged: true}
    1: {state.second.condition: OUT, state.first.initiative_penalty: 0}
  expect_final: {rounds_executed: 2, termination_reason: second_out}
