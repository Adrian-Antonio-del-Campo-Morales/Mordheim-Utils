# --- Authored scenarios ---
# Derived from the printed sentence, the recorded contract and the printed profile; no engine output was
# consulted.  The bearer is the band's own profile with its single-attack fixture base, the opponent is
# hand-built, and the charging scenarios declare the Fear test the printed Undead bearer forces on the
# charged fixture (Leadership 7 against two threes passes).

- audit_id: rule/mordheim/undead/dire-wolves--charge/trait.charge-attack-bonus
  id: the-charging-bearer-strikes-twice
  fighters:
    first:
      collection: mordheim
      band_id: undead
      profile_id: dire-wolves
      characteristics: {weapon_skill: 3, strength: 4, toughness: 3, wounds: 1, initiative: 2, attacks: 1, leadership: 4}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 1, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.fear.charged.0, value: 3}
    - {key: round.0.second.fear.charged.1, value: 3}
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.first.attack.1.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.wounds: 1, state.second.wounds: 3, state.second.condition: STANDING}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

