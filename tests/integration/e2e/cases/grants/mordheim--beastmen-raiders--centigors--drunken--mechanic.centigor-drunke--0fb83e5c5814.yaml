# psychology source this file does not declare.  REVIEWED still requires manual semantic review.

# --- Authored scenarios ---
# Derived from the printed rule and the printed profile; no engine output was consulted.
# The start-of-turn D6 is a supplied fact.  A result of 1 makes the warrior stupid for the
# turn, so the own-turn Stupidity test follows and the two sixes fail it.

- audit_id: rule/mordheim/beastmen-raiders/centigors--drunken/mechanic.centigor-drunken
  id: a-roll-of-one-forces-the-stupidity-test
  fighters:
    first:
      collection: mordheim
      band_id: beastmen-raiders
      profile_id: centigors
      main_weapon_id: weapon.mace
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 4, wounds: 3, initiative: 1, attacks: 1}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.drunken, value: 1}
    - {key: round.0.first.stupidity.0, value: 6}
    - {key: round.0.first.stupidity.1, value: 6}
  expect_rounds:
    0: {attacks: [], state.first.stupidity_failed: True, state.engaged: False}
  expect_final: {rounds_executed: 1, termination_reason: disengaged}

