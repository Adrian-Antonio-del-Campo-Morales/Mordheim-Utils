# --- Authored scenarios ---
# Derived from the printed rule ("Costs 40 gc.  Saurus Heroes only.  The Hero's Bite Attack
# gains +1 Strength") and the recorded contract (attack: bite, recipient: Saurus Hero,
# bite_strength_bonus 1; consumers compiler.compile_fighter and contexts._attack_strength).
# The bearer is the printed recipient carrying the band's own bite attack: the compiled extra
# bite uses the bearer's own Strength 4, so the printed gain reaches Strength 5 and a
# Toughness 3 opponent is wounded on a two instead of a three.  The paired tape without the
# mark is the control that shows the marked wound is the mark's contribution.  The mace of
# the bearer is a plain weapon with no modifier of its own and misses on a natural one.
# Note for execution: the compiled extra bite of the Saurus Totem Warrior is tagged
# rule.bite-attack while the engine's separate last-strike pool is keyed off
# rule.strikes-last-bite; these tapes follow the printed "the bite always strikes last"
# clause, which is also how the sibling authored bite file keys it.  If the engine instead
# queues the bite as an ordinary extra attack, these scenarios fail on the pool label, and
# that failure is the finding: the pool a printed striking-last bite belongs to.

