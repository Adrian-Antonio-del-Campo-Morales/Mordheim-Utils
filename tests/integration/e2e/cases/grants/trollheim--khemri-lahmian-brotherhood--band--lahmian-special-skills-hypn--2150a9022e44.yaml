  id: a-failed-hypnotize-test-bars-the-target-and-gives-the-printed-plus-one
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.lahmian-hypnotize]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 8}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.second.hypnotize, value: true}
  rolls:
    - {key: round.0.second.hypnotize.0, value: 6}
    - {key: round.0.second.hypnotize.1, value: 6}
    - {key: round.0.first.attack.0.hit, value: 3}
    - {key: round.0.first.attack.0.wound, value: 1}
  expect_rounds:
    0: {state.second.charm_attack_blocked: true, attacks.0.hit: true, state.second.condition: STANDING, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

