# --- Authored scenarios ---
# Family model (filtered Hatred of enemies armed with shooting weapons, mechanic.noble-disdain), taken
# from the printed rule, the recorded contract and the accepted model of
# cases/mechanics/mechanic.noble-disdain.yaml.  The bearer is the band's printed Questing Knight, built
# from its band profile so the record's own Virtue is what the scenario exercises; the source declares
# that Virtue selectable over the whole band, so the scenario names the chosen Virtue explicitly.  Its
# physical characteristics are supplied as fixture facts (WS3 S3 T3 W2 I5 A1) so the dice thresholds
# and the strike order are fixed, and its printed Leadership stays in place.  The opponent is a
# hand-built fixture whose carried bow supplies the printed shooting-weapon identity, with one attack.
# A miss (a natural 2 against WS3) is taken again on a 4+ and wounds on a 4+, so the reroll is what the
# tape shows; the absence cases carry no bow and no Virtue, so the strict tape holds no reroll key and
# the miss stands.

