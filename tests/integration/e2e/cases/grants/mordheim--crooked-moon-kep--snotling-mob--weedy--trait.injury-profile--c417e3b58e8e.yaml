# --- Authored scenarios ---
# Derived from the printed sentence, the recorded contract and the printed profile; no engine output
# was consulted.  The bearer prints the rule, starts the duel at one Wound and contributes no attacks
# of its own (initial_state), so round 0 carries only the attacker's dice and the wound that lands is
# the one that reaches the injury table.  The blow is an ordinary mace: at Weapon Skill 10 against
# Weapon Skill 2 it needs a 3, and Strength 8 against Toughness 2 needs a 2, so the declared 5 and 5
# both pass.  Five is deliberately below a natural six, which would be a critical hit and add a
# further critical die and an injury modifier.  An unarmoured bearer keeps the armour step and, with
# no ward, the wound goes straight to damage; a single point of damage at one Wound leaves the
# injury die as the only undeclared input, so the strict tape also proves no further die is consumed.

- audit_id: rule/mordheim/crooked-moon-kep/snotling-mob--weedy/trait.injury-profile
  id: a-two-on-the-printed-ladder-stuns-the-bearer
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 10, strength: 8, toughness: 3, wounds: 3, initiative: 10, attacks: 1}
    second: {collection: mordheim, band_id: crooked-moon-kep, profile_id: snotling-mob}
  initial_state: {second: {wounds: 1, attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 5}
    - {key: round.0.first.attack.0.wound, value: 5}
    - {key: round.0.first.attack.0.injury.0, value: 2}
  expect_rounds:
    0: {attacks.0.wounded: True, state.second.wounds: 0, state.second.condition: STUNNED}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

