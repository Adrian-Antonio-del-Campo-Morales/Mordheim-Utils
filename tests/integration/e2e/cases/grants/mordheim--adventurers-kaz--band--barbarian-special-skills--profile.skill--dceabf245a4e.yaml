#
# AUTHORED: 2 scenarios cover the printed permission (Barbarian Heroes may use the
#   Barbarian table instead of the standard skill lists).  The admission scenario builds the
#   recipient with the binding's own member skill.hard-to-kill and records that the duel ran
#   unrefused; the closure scenario shows a special skill outside the printed table refused by the
