# --- Authored scenarios ---
# Derived from the printed rule, the recorded semantic contract and the band binding's own member
# list; no engine output was consulted.  Both fighters are given zero attacks so the round resolves
# without dice and the observation is about admission, not about the member's mechanics.

- audit_id: rule/mordheim/adventurers-kaz/band--barbarian-special-skills/profile.skill-access
  id: the-declared-table-member-is-admitted-to-the-recipient
  fighters:
    first:
      collection: mordheim
      band_id: adventurers-kaz
      profile_id: barbarian
      skill_ids: [skill.hard-to-kill]
      main_weapon_id: weapon.natural-attacks
    second:
      main_weapon_id: weapon.natural-attacks
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  initial_state: {first: {attacks: 0}, second: {attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  expect_final: {rounds_executed: 1}

- audit_id: rule/mordheim/adventurers-kaz/band--barbarian-special-skills/profile.skill-access
  id: a-special-skill-outside-the-printed-table-is-refused
  fighters:
    first:
      collection: mordheim
      band_id: adventurers-kaz
      profile_id: barbarian
      skill_ids: [skill.monster-slayer]
  expect_error: "skills are not available to adventurers-kaz/barbarian: ['skill.monster-slayer']"
