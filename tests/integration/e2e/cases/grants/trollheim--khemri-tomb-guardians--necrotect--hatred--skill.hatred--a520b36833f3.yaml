#
# AUTHORED: 3 scenarios carry the printed unconditional first-round reroll onto the
#   real route.  The bearer is the band's printed `necrotect` profile (profiles.yaml: WS 3, S 3, T 4, W 1,
#   I 3, A 1, rule_ids [necrotect--undead, necrotect--hatred, necrotect--stone-forger], starting skills
#   [skill.hatred, skill.ignore-pain]), so the warrior carries the printed row through its own profile and
#   no tape invents an identity.  The tested boundary is the first-round To-Hit reroll of the declared miss
#   2: the declared reroll 4 lands with the printed second result accepted, the wound lands and the enemy
#   loses one wound, so a consumer that offers no reroll - or offers one only for an identity-tagged enemy -
#   fails the tape.  Two faces declare that this print needs no enemy identity: one enemy carries no
#   identity tag at all, and one explicitly carries {creature_kind: daemon}, the non-Undead identity this
#   corpus uses elsewhere.  The third tape is the printed first-round-only term: maximum_rounds 2, with the
#   same declared reroll in round 0 and none in round 1, so a second-round reroll request fails the strict
#   tape.  The register's own note records the defect these tapes detect: the printed clause is an
#   unconditional first-round To-Hit reroll rather than identity-filtered Hatred, the engine exposes
#   effect.reroll_hits, and the dedicated binding for this band row is still only proposed, so the shared
#   skill.hatred operator keeps filtering on a supplied enemy identity and the reroll is never offered.

# --- Authored scenarios ---
# The dedicated printed first-round reroll is selected through its declared grant channel;
# the profile's starting Hatred alone remains subject to ordinary Psychology immunity.
# Derived from the printed rule, the printed Necrotect profile of this band and the recorded contract; no
# engine output was consulted.  The vehicle is the first close-combat round's To-Hit roll of the bearer,
# whose printed reroll accepts its second result; the enemy is a hand-built fixture that declares its own
# facts and, in tapes 1 and 3, carries no enemy identity at all.  The declared miss 2 is below the WS 3
# against WS 3 to-hit target of 4, and the rerolled 4 is the printed second result the rule says must be
# accepted.

# The printed unconditional offer, with no enemy identity supplied: the reroll lands, wounds and removes a
# wound.  A consumer that requires a hated identity tag offers no reroll at all and fails here.
- audit_id: rule/trollheim/khemri-tomb-guardians/necrotect--hatred/skill.hatred
  id: a-first-round-miss-is-rerolled-against-an-enemy-without-a-hated-identity
  fighters:
    first: {collection: trollheim, band_id: khemri-tomb-guardians, profile_id: necrotect, main_weapon_id: weapon.mace, special_rule_ids: [necrotect--hatred]}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.fear.charged.0, value: 3}
    - {key: round.0.second.fear.charged.1, value: 3}
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.first.attack.0.hit.reroll, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: true, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The second face of the same print: the rule says "during the first round of each close combat", so the
