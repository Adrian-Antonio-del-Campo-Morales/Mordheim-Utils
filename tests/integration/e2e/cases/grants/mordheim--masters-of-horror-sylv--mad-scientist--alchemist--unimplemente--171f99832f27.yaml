- audit_id: rule/mordheim/masters-of-horror-sylv/mad-scientist--alchemist/unimplemented.masters-of-horror-sylv.special.alchemist
  id: two-potions-of-the-same-table-in-one-build-are-refused
  covers: [start-of-game-potion--scope--potion-characteristic-bonuses]
  # The printed table is a game-start D6 the Scientist consults once, so only one result is drawn.  The
  # supplied-result resolver raises its own sentence when two results of this table are declared in one
  # build; that sentence is the resolver's, not an invented diagnostic.
  fighters:
    first:
      collection: mordheim
      band_id: masters-of-horror-sylv
      profile_id: mad-scientist
      main_weapon_id: weapon.mace
      condition_ids: [condition.alchemist-resilience, condition.alchemist-strength]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 4, attacks: 1}
  expect_error: "choose only one supplied result of the same potion table"

- audit_id: rule/mordheim/masters-of-horror-sylv/mad-scientist--alchemist/unimplemented.masters-of-horror-sylv.special.alchemist
  id: the-supplied-addicted-scientist-takes-no-action-of-its-own
  covers: [start-of-game-potion--scope--addiction-state]
  # "[he] will not engage in any other activity during a game until he has had his Aberrantius Vigortia
  # potion.  He will stand and brew potions until a 6 is rolled."  The catalogue's
  # condition.alchemist-addicted supplies the admitted cannot-act state, so the affected duelist resolves
  # no attack of its own: no attack die is declared for it, which the strict tape enforces, while the
  # opponent's declared blow still lands.
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 7}
    second:
      collection: mordheim
      band_id: masters-of-horror-sylv
      profile_id: mad-scientist
      main_weapon_id: weapon.mace
      condition_ids: [condition.alchemist-addicted]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  # The canonical Scientist causes Fear; the charger explicitly passes that unrelated test.
  rolls:
    - {key: round.0.first.fear.charge.0, value: 1}
    - {key: round.0.first.fear.charge.1, value: 1}
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
  expect_rounds:
    0: {state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

- audit_id: rule/mordheim/masters-of-horror-sylv/mad-scientist--alchemist/unimplemented.masters-of-horror-sylv.special.alchemist
  id: without-the-supplied-addiction-the-same-duelist-strikes-back
  covers: [start-of-game-potion--scope--addiction-state]
  # The control: the identical duelist without the supplied condition takes its own attack, so its declared
  # miss is consumed.  A consumer that barred this duelist wrongly leaves that declared die unconsumed and
  # the strict tape fails, which is what makes the pair discriminate.
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 7}
    second:
      collection: mordheim
      band_id: masters-of-horror-sylv
      profile_id: mad-scientist
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  # The canonical Scientist causes Fear; the charger explicitly passes that unrelated test.
  rolls:
    - {key: round.0.first.fear.charge.0, value: 1}
    - {key: round.0.first.fear.charge.1, value: 1}
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}


