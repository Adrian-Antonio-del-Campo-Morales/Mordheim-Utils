# authoring_progress: both admitted clauses carry scenarios, and the earlier "no operator" blocker is
#   corrected rather than kept.  catalog/rules/conditions.yaml carries one canonical condition per printed
#   potion result (condition.alchemist-resilience, -strength, -aberrantius-vigortia, -backleys-brew) plus
#   condition.alchemist-addicted, every one of them runtime scope YES / implemented YES with its own
#   mechanic binding, and compiler.resolve_supplied_conditions resolves them as the supplied result of
#   this table, refusing two results of the same table in one build.  The supplied result is declared
#   through FighterBuild.condition_ids - the channel the sibling shaman--fungus-brew and band--brewers
#   files use for their own supplied drink outcomes - so the drinker state is supplied rather than guessed:
#   four tapes read the printed characteristic grants, one control reads the base values, the one-result
#   restriction is asserted as this table's own refusal, and a pair asserts the printed cannot-act state.
#   What stays outside the duel is recorded in the two clause markers: the game-start D6 draw, the +1
#   Movement entry (the duel has no movement), Backley's Brew's printed Toughness-test expiry (the source
#   gives no test timing) and the brewing clock.  REVIEWED still requires manual semantic review and
#   execution_status stays UNEXECUTED.
# execution_status: UNEXECUTED (this scaffold has no behavioral result)
#
# Derive inputs and expectations from rule text and accepted rulings.
# Do not derive them from the engine or execute combat during authoring.
# REVIEWED requires semantic review; covers labels alone are insufficient.
# Preserve audit_id when filling this file.
# Governing rulings: docs/decisions/design-rulings.md
#
# Clause: start-of-game-potion--scope--addiction-state (scope: YES)
# AUTHORED[start-of-game-potion--scope--addiction-state]: the previous note called the consumer empty
#   and was wrong.  The catalogue's condition.alchemist-addicted is runtime scope YES / implemented YES
#   with a mechanic binding whose recorded consumer is the supplied Scientist cannot-fight state, and
#   compiler.resolve_supplied_conditions admits it as a drawn result of this table, so the admitted "will
#   not engage in any other activity during a game ... will stand and brew potions" is declarable through
#   FighterBuild.condition_ids.  The pair of scenarios below asserts the printed state: supplied, the
#   affected duelist resolves no attack of its own - no attack die is declared for it, so a consumer that
#   asks for one fails the strict tape - while the opponent's declared blow still lands; without the
#   supplied condition the identical duelist strikes and consumes its own declared die.  Still outside the
#   duel, recorded rather than asserted: the post-battle D6 that creates the addiction, and the brewing
#   clock ("until a 6 is rolled"), which the catalogue itself marks as having no source timing.
#
# Clause: start-of-game-potion--scope--potion-characteristic-bonuses (scope: YES)
# AUTHORED[start-of-game-potion--scope--potion-characteristic-bonuses]: the earlier closing review called
#   the operator missing and was wrong.  The catalogue supplies one canonical condition per printed entry
#   - condition.alchemist-resilience (+1 Toughness), condition.alchemist-strength (+1 Strength),
#   condition.alchemist-aberrantius-vigortia (+1 Strength and +1 Toughness) and
#   condition.alchemist-backleys-brew (-1 Strength and -1 Initiative) - each runtime scope YES /
#   implemented YES, and resolve_supplied_conditions admits one of them as this table's drawn result.  The
#   four tapes below read the printed grants on the affected duelist against a control that reads the same
#   base values, and the printed one-potion restriction is asserted as this table's own refusal of two
#   supplied results.  The 3-4 Quicksilver entry is not asserted: +1 Movement has no duel application,
#   which the register itself records as the reason that entry is not admitted as a movement rule, and
#   Backley's Brew is asserted for its printed -1 Strength and -1 Initiative only, because the printed
#   expiry (a Toughness test whose timing the source does not give) is a separate unresolved step.

# --- Authored scenarios ---
# Derived from the printed potion table and the catalogue's own canonical conditions; no engine output was
# consulted.  Each tape supplies exactly one drawn result through FighterBuild.condition_ids - the channel
# compiler.resolve_supplied_conditions reads - and reads the printed consequence on the affected duelist,
# who is supplied as the printed drinker of the table (the duel's own duelist standing for him) because the
# condition is a globally supplied fact, exactly as the sibling shaman--fungus-brew file supplies its brew
# results.  Where the consequence is a characteristic, the opposing duelist is already out so no combat die
# is consumed and the grant itself is the observation.

- audit_id: rule/mordheim/masters-of-horror-sylv/mad-scientist--alchemist/unimplemented.masters-of-horror-sylv.special.alchemist
  id: the-potion-of-resilience-raises-the-drinkers-toughness-by-one
  covers: [start-of-game-potion--scope--potion-characteristic-bonuses]
  # "1: Potion of Resilience - Add +1 to Toughness for duration of game."
  fighters:
    first:
      collection: mordheim
      band_id: masters-of-horror-sylv
      profile_id: mad-scientist
      main_weapon_id: weapon.mace
      condition_ids: [condition.alchemist-resilience]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 4, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 5, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  initial_state: {second: {condition: OUT}}
  maximum_rounds: 1
  expect_initial: {first.toughness: 4}
  expect_final: {rounds_executed: 0, termination_reason: second_out}

