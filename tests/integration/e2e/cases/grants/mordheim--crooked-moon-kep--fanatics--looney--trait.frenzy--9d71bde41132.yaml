  id: a-frenzied-looney-strikes-twice-with-its-single-profile-attack
  fighters:
    first:
      trait_overrides: {causes_fear: true}
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 1, attacks: 1, leadership: 7}
    second:
      collection: mordheim
      band_id: crooked-moon-kep
      profile_id: fanatics
      main_weapon_id: weapon.double-handed-weapon
  initial_state:
    second: {attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.0.second.attack.1.hit, value: 1}
    - {key: round.0.first.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.frenzy: true, attacks.2.wounded: false}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

