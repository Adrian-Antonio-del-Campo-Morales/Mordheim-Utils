# --- Authored scenarios ---
# Family model (Frenzy granted by the Looney's mushrooms): the bearer is Frenzied from
# duel start (doubled attacks, psychology exemption), takes no Fear test for the charge
# it receives, and loses Frenzy when an injury knocks it down; standing up does not
# regrant it.  The Looney's own printed Frantic rule (mechanic.frantic) makes it strike
# before ordinary combatants regardless of weapon penalties or Initiative, so the Looney
# resolves first even when it is the one charged, and its Frantic tier also outranks the
# ordinary strike-last of a warrior that stood up.  The doubled-attack scenarios arm the bearer with the printed
# two-handed weapon of its Fanatic Equipment List: an unarmed fighter is capped at one
# attack, which would hide the doubling.  The band's printed Animosity rule is
# implemented, so the bearer tests on its own turn and a 3 passes the printed 1-fails band.

