#
# AUTHORED: the printed clause is conditioned on the Ogre having become a Hero through The Lad's Got
# Talent, and the shared eligibility module realises it only for a promoted build:
# _eligibility.js::buildAccess adds the binding's allowed_skill_lists to the skill access
# "if (binding.id === \"compiler.promoted-hero-skill-access\" && promoted)", where promoted is
# profile.type === "hero" || build.variant_ids.includes("promotion.hero").  The recipient profile of this
# origin is a henchman and the corpus fixture vocabulary declares no variant ids (no grants case sets
# variant_ids), so the promoted recipient cannot be built; without it neither the admission of a Combat or
# Strength skill nor the refusal of a skill outside the lists can be declared, and a tape written against
# the unpromoted Ogre would assert the opposite of the clause.  The missing datum is the promoted-
# recipient construct (the promotion variant id on a hero-typed profile); the contract emits no refusal
# message of its own, so the evidence is the admission plus the shared "skills are not available to
# <band>/<profile>: [...]" refusal for a skill outside both lists.
# CORRECTION (challenge pass): the note above is superseded on its factual half.  The corpus fixture
# vocabulary DOES declare variant ids (runner.py::_build converts `variant_ids` and FighterBuild carries
# the field; the authored averlanders halflings-scouts promotion origin declares it), so the promoted
# recipient is buildable as `variant_ids: [promotion.hero]` on the printed recipient - the band's own
# henchman profile ostlanders/ogre (sources/knowledge/bands/mordheim/ostlanders/profiles.yaml, id: ogre,
# type: henchman, skill_access: []).  With the promoted flag set, the binding's printed
# `allowed_skill_lists` [combat, strength] are admitted, so a Combat or a Strength skill constructs and
# runs, while a skill outside both lists is refused by the shared construction stage with the verbatim
# "skills are not available to ostlanders/ogre: ['<id>']"; without the promotion variant the same skill
# is refused, which is the accepted evidence that the printed restriction is what admits it.  The
# four scenarios below are that pair (two admissions, the outside-list refusal, the unpromoted control).

