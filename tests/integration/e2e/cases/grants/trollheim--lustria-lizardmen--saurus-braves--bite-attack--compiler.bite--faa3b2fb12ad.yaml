#
# AUTHORED: 4 scenarios cover the printed contract term by term - the bite is a
#   second attack beyond the bearer's weapon, it wounds on the bearer's own Strength
#   rather than the weapon's bonus, it carries none of the unarmed penalties that a
#   bare fist would (no reduced Strength and no improved target save), and a Skink of
#   the same band, which is not an admitted recipient, gains no such attack.  The
#   printed "always strikes last, after attacks made with Great Weapons" is not
#   separately asserted: it is an attack-priority consequence rather than an
#   independently observable outcome of this identity, so it stays unclaimed.

# --- Authored scenarios ---
# Derived from the printed rule and the recorded semantic contract; no engine
# output was consulted.  The Saurus is the active participant and the target is a
# hand-built opponent with Toughness 3 and Weapon Skill 2, so the bite's own
# Strength 4 wounds on 3+ while the reduced unarmed Strength 3 would need 4+, and
# a weapon bonus would lower that target further.  Every scripted miss uses a
# natural 1, and the target still strikes back, so its own attack is declared too.
# The strict tape consumes exactly the declared dice: a die the build requests
# without a declaration fails, which is what evidences the absent fourth attack
# in the Skink scenario and the absent improved save in the unarmed one.

