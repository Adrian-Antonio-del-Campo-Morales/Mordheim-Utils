#   EVIDENCED: 5 scenarios read the printed band contract: the Kroxigor 4+ and the
#   Skink Priest 6+ on the real attack route, the 6+ floor that Strength may not reduce a
#   Scaly Skin save beyond, the light-armour combination the Skink list does offer, and
#   the printed negation by a result that denies armour saves.
# PARTIAL: the printed exception "except Hardened Leather provides no additional bonus" is unobservable in this revision and is recorded rather than dropped: a Lizardman wearing hardened or toughened leathers is a build the printed lists forbid (skinks-, saurus- and kroxigor-equipment-list offer no such item, and no band package pairs it with a Scaly Skin profile), so the compiler's cancellation of the leather contribution has no legal recipient to observe.  The representable half - the prohibition itself - is authored below as a construction refusal with the corpus's established armour-prohibition diagnostic `armour is forbidden for <band>/<profile>`, the same contract the kroxigor identities use, so an illegally armoured Lizardman is refused instead of silently keeping the natural save.  The remaining terms of this printed rule (the two natural saves, the 6+ floor, the ordinary-armour combination and the ignore-armour negation) are authored above.
# Missing datum: a legal Scaly Skin bearer that may wear Hardened Leather, which this revision does not contain.
# --- Authored scenarios ---
# Derived from the printed rule text, the recorded parameters of this register
# row and the band package; no engine output was consulted.  The duel is
# uncharged (`charging: []`) and the attacker holds the higher Initiative, so
# the attacker's pool always resolves first and the only Strength modifier
# reaching the defender's save is the attacker's own Strength.  A recipient that
# survives the incoming attack still strikes back, so each of its own attacks is
# scripted as a miss; the count is the profile's Attacks plus the extra attacks
# its own rules grant (the Saurus bite, the Fimir and Young Noble spiked tail).

