#
# AUTHORED: 6 scenarios cover the three printed consequences of the clause: the critical
# threshold of five with a bare attack and the same five staying ordinary without the skill, the
# extra attack the unarmed pool gains and the single attack the same fists carry without it, and the
# paired fighting-claw pool carrying one further attack than the fist pool (three against two
# attacks).  The bearer is a hand-built fixture that carries the band's printed rule as the canonical
# skill the shared operator consumes.

# --- Authored scenarios ---
# Derived from the printed sentence and the recorded contract, never from engine output.  Each
# consequence is paired with the same configuration without the skill, because the printed claim is
# an improvement over the ordinary rule and only that pair isolates it.  Every attack is scripted as
# a miss except where the clause under test needs the wound or critical face.
# Critical threshold: with the skill a To Wound five is a critical wound.
- audit_id: rule/trollheim/chaos-streets-deathbringers/band--deathbringer-special-skills-art-of-unarmed-combat/skill.art-of-silent-death
  id: a-five-is-a-critical-with-the-deathbringer-rule
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [skill.art-of-silent-death]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 5}
    - {key: round.0.first.attack.0.critical, value: 2}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.critical: True, attacks.0.damage: 2, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
