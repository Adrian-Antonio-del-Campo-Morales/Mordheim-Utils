# --- Authored scenarios ---
# Family model (first-round Hatred): the bearer is the printed recipient of this record, built
#   from its band profile, so the granted effect is what the scenario exercises. Its physical
#   characteristics are supplied as fixture facts (WS3 S3 T3 W2 I5 A1) so the dice thresholds
#   and the strike order are fixed -- the engine reads a band build's supplied characteristics
#   as the fighter's own values -- while its printed Leadership stays in place. The opposing
#   duellist declares the hated identity and one attack of its own. A natural 2 misses against
#   WS3, the granted reroll is taken on 4+ and S3 wounds T3 on 4+, so the first-round reroll is
#   exactly what the tape shows; an absence case supplies no qualifying identity, so the strict
#   tape holds no reroll key and the same miss stands.

# The bearer charges and its first-round miss is offered the granted reroll, which lands and wounds.
- audit_id: rule/trollheim/chaos-streets-sons-of-nagarythe/band--hate-dark-elves/mechanic.hatred-dark-elves
  id: a-first-round-miss-is-rerolled-against-a-qualifying-dark-elf
  fighters:
    first:
      collection: trollheim
      band_id: chaos-streets-sons-of-nagarythe
      profile_id: shadow-warrior
      main_weapon_id: weapon.natural-attacks
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.natural-attacks
      trait_overrides: {elf_kind: dark}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.first.attack.0.hit.reroll, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: true, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

