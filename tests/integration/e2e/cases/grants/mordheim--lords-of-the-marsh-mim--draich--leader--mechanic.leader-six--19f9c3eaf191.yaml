      - participant_id: leader
        side_id: second
        condition: standing
        fighter:
          collection: mordheim
          band_id: lords-of-the-marsh-mim
          profile_id: draich
          characteristics: {weapon_skill: 4, strength: 4, toughness: 4, wounds: 3, initiative: 4, attacks: 2, leadership: 8}
