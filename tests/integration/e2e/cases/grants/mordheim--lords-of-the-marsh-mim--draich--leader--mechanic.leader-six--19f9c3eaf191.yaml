# --- Authored scenarios ---
# The supplied leader is a nearby participant of the borrower's own side and band: the Draich, whose
# rule grant binds the canonical six-inch supplied-Leadership contract.  The charged borrower fails
# against its own supplied Leadership 3 and passes with the supplied leader's 8, so the charge it
# received leaves it unclamped.
