#
# Clause: fire-exception (scope: YES)
# AUTHORED[fire-exception]: 2 scenarios show the fire face.  The brazier-iron blow consumes no
#   Regeneration die and leaves the wound standing one Wound down; the same attacker with a plain
#   mace does request the die and the 4+ takes the wound back, so the difference is the attack.fire
#   tag and not the attack itself.
#
# Clause: regenerate-wound (scope: YES)
# AUTHORED[regenerate-wound]: 2 scenarios show the 4+ special save after armour: a 4 ignores the
#   wound and the bearer keeps both Wounds, one face below lets it through and the bearer drops to
#   one Wound.
