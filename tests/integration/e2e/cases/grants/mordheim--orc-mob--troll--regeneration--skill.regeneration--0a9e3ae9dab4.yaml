# --- Authored scenarios ---
# Derived from the printed sentence, the recorded contract and the printed profile; no engine
# output was consulted.  The bearer prints the rule, starts the duel at two Wounds and contributes
# no attacks of its own, so round 0 carries only the attacker's dice.  The blow is an ordinary
# mace: at Weapon Skill 10 against Weapon Skill 3 it needs a 3, and Strength 8 against Toughness 4
# needs a 2, so the declared 5 and 5 both pass.  Five is deliberately below a natural six, which
# would be a critical hit and demand a further critical die.  An unarmoured bearer keeps the armour
# step and, with no ward, the special save is reached directly.
#
# The strict tape is part of the evidence rather than decoration: StrictDice rejects a roll the
# fixture never declared, so the fire scenario below fails if the engine requests a Regeneration
# die it should not request, and the two 4+ scenarios fail if it requests none.

- audit_id: rule/mordheim/orc-mob/troll--regeneration/skill.regeneration
  id: the-four-plus-regeneration-save-ignores-the-wound
  covers: [regenerate-wound, fire-exception]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 10, strength: 8, toughness: 3, wounds: 3, initiative: 10, attacks: 1}
    second: {collection: mordheim, band_id: orc-mob, profile_id: troll}
  initial_state: {second: {wounds: 2, attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 5}
    - {key: round.0.first.attack.0.wound, value: 5}
    - {key: round.0.first.attack.0.special.regeneration, value: 4}
  expect_rounds:
    0: {attacks.0.wounded: True, attacks.0.saved: True, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

