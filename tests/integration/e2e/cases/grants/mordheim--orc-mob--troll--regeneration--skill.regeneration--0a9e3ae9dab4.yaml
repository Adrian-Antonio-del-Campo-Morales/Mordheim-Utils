# The printed fire exception.  The brazier iron is the only admitted fire producer (its attack
# carries attack.fire with ignition 5), so the blow is declared with its ignition die, one face
# below the ignition threshold, and no Regeneration die follows it: the wound stands.

- audit_id: rule/mordheim/orc-mob/troll--regeneration/skill.regeneration
  id: a-fire-attack-takes-the-wound-without-a-regeneration-roll
  covers: [fire-exception]
  fighters:
    first:
      main_weapon_id: weapon.brazier-iron
      characteristics: {weapon_skill: 10, strength: 8, toughness: 3, wounds: 3, initiative: 10, attacks: 1}
