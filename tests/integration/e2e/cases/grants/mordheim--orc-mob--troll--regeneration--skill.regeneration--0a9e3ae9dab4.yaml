# authoring_status: AUTHORED
# authoring_progress: both admitted clauses carry authored scenarios derived from the printed
# sentence, the recorded contract and the printed profile.  The bearer is the profile build
# mordheim/orc-mob/troll, whose printed regeneration compiles to the 4+ special save resolved
