# --- Authored scenarios ---
# Derived from the printed rule and the recorded contract; no engine output was consulted.  The
# bearer is the printed Sabretusk profile, the Leadership test it takes is supplied as the fixture
# condition the rule speaks about, and the Mountain Guide is supplied as a value, never simulated.

- audit_id: rule/mordheim/maneaters/sabretusks--trained/mechanic.handler-leadership
  id: the-supplied-mountain-guides-leadership-carries-the-sabretusks-test
  covers: [trained--scope--handler-leadership]
  fighters:
    first:
      collection: mordheim
      band_id: maneaters
      profile_id: sabretusks
      trait_overrides: {stupidity: true, stupidity_leadership: 8}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  # The printed Feral Instinct Leadership test comes first, then the Stupidity test;
  # both use the supplied handler value of eight and pass on seven.  The charging
  # Fearsome beast then makes the charged opponent take its own Fear test.
  rolls:
    - {key: round.0.first.feral-instinct.0, value: 3}
    - {key: round.0.first.feral-instinct.1, value: 4}
    - {key: round.0.first.stupidity.0, value: 3}
    - {key: round.0.first.stupidity.1, value: 4}
    - {key: round.0.second.fear.charged.0, value: 1}
    - {key: round.0.second.fear.charged.1, value: 1}
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.1.hit, value: 1}
    - {key: round.0.first.attack.2.hit, value: 1}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.stupidity_failed: false, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# Without a supplied value the same total of seven is tested against the printed Sabretusk
# Leadership 4 and fails, so the printed consequence cancels the charge.
- audit_id: rule/mordheim/maneaters/sabretusks--trained/mechanic.handler-leadership
  id: without-the-supplied-value-the-sabretusks-own-leadership-fails-the-test
  covers: [trained--scope--handler-leadership]
  fighters:
    first:
      collection: mordheim
      band_id: maneaters
      profile_id: sabretusks
      trait_overrides: {stupidity: true}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  # With no handler value both tests read the printed Leadership 4: the Feral Instinct
  # test and then the Stupidity test fail on the same total of seven.
  rolls:
    - {key: round.0.first.feral-instinct.0, value: 3}
    - {key: round.0.first.feral-instinct.1, value: 4}
    - {key: round.0.first.stupidity.0, value: 3}
    - {key: round.0.first.stupidity.1, value: 4}
  expect_rounds:
    0: {attacks: [], state.first.stupidity_failed: true, state.first_charged: false, state.engaged: false}
  expect_final: {rounds_executed: 1, termination_reason: disengaged}
