- audit_id: rule/mordheim/amazons-lustria/band--amazon-special-skills/profile.skill-access
  id: a-published-member-of-the-band-table-is-selectable
  covers: [whole]
  # The printed permission: a Heroine may use this table, so the band's published member
  # must be a legal selection and the engagement must start. The declared identity is the
  # band's own rule id, not a fabricated catalogue skill id. Both fighters declare zero
  # attacks, so the observation is the selection itself; the member's mechanic keeps its own
  # origin.
  fighters:
    first:
      collection: mordheim
      band_id: amazons-lustria
      profile_id: eagle-warriors
      special_rule_ids: [band--amazon-special-skills-skink-hunter]
    second:
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  initial_state: {first: {attacks: 0}, second: {attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  expect_initial: {first.attacks: 0, second.attacks: 0}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

