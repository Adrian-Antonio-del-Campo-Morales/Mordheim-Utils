# --- Authored scenarios ---
# Derived from the printed sentence, the printed profiles and the recorded contract; no engine output was
# consulted.  The opponent is the identity the print itself names for the gate ("a large creature (such as a
# troll or ogre)"), declared as a fixture fact; its mandatory per-round requests are declared with it on the
