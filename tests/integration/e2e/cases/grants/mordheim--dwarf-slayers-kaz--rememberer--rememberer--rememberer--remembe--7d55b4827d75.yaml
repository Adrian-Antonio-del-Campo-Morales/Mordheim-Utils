- audit_id: rule/mordheim/dwarf-slayers-kaz/rememberer--rememberer/rememberer--rememberer.provider
  id: the-supplied-rememberer-rerolls-a-failed-to-hit-roll-against-a-large-creature
  # The printed benefit: once per game a Slayer Hero fighting a large creature and within six inches of the
  # allied Rememberer may re-roll any failed To Hit rolls once only.  The declared miss of two is taken again
  # on a four, which lands the hit; the declared wound face of two does not wound the Troll (Strength 3
  # against its own Toughness), so the tape reads the re-roll and nothing else and the Troll's Regeneration is
  # never reached.  The supplied Rememberer is a nearby same-side participant at the printed six inches.  The
  # `.hit.reroll` die is the corpus's own hit-re-roll route, so the tape fails on an unrequested die until the
  # row's unimplemented binding projects the granted re-roll - the PENDING implementation defect.  The printed
  # "once only" limit is recorded in the clause marker above.
  fighters:
    first:
      collection: mordheim
      band_id: dwarf-slayers-kaz
      profile_id: troll-slayers
      condition_ids: [condition.rememberer-kaz-support]
      main_weapon_id: weapon.mace
    second:
      collection: mordheim
      band_id: black-orcs
      profile_id: troll
      condition_ids: [condition.large-target]
  duel_context:
    charging: []
    active_participant: first
    nearby:
      - participant_id: rememberer
        side_id: first
        condition: standing
        fighter: {collection: mordheim, band_id: dwarf-slayers-kaz, profile_id: rememberer}
    distances:
      - [first, rememberer, 6]
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.attack.0.rememberer, value: true}
  rolls:
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.first.attack.0.hit.reroll, value: 4}
    - {key: round.0.first.attack.0.wound, value: 2}
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.0.second.attack.1.hit, value: 1}
    - {key: round.0.second.attack.2.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: True, attacks.0.wounded: False, attacks.0.damage: 0, state.first.wounds: 1, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
