# --- Authored scenarios ---
# Derived from the printed rule ("The Silent Walker has a 5+ special save against mundane
# attacks.  This save is negated by magical attacks") and the recorded contracts (trait.ward-save
# save 5, trait.ward-save-mundane-only blocked by the magic tag).  The bearer is the printed
# profile, which carries the rule as its own, so no rule is selected in the fixture; the
# attacker is hand-built with a Strength that fixes the wound target against the printed
# Toughness 2, and the bearer wears no armour, so the special save is the only save after the
# wound.  The bearer's own attacks are suppressed so the tape is the attacker's chain alone; a
# build whose ward or mundane-only flag is missing fails on the declared or undeclared die.

- audit_id: rule/trollheim/lustria-pygmies/silent-walker--ethereal/trait.ward-save
  id: the-mundane-attack-is-saved-on-five
  covers: [five-plus-ward-against-mundane]
  fighters:
    first:
      # A carried sword carries no armour modifier, so the bearer's special save is the only one.
      main_weapon_id: weapon.sword
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 7}
    second:
      collection: trollheim
      band_id: lustria-pygmies
      profile_id: silent-walker
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    # The charging attacker must first pass the Fear test the bearer's printed rule forces; 1 passes.
    - {key: round.0.first.fear.charge.0, value: 1}
    - {key: round.0.first.fear.charge.1, value: 1}
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 3}
    - {key: round.0.first.attack.0.special.ward, value: 5}
  expect_rounds:
    0: {attacks.0.saved: true, attacks.0.damage: 0, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

- audit_id: rule/trollheim/lustria-pygmies/silent-walker--ethereal/trait.ward-save
  id: a-magical-attack-rolls-no-special-save
  covers: [negated-by-magic]
  fighters:
    first:
      # A carried sword carries no armour modifier, so the bearer's special save is the only one.
      main_weapon_id: weapon.sword
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 7}
      trait_overrides: {magical_attacks: true}
    second:
      collection: trollheim
      band_id: lustria-pygmies
      profile_id: silent-walker
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    # The charging attacker must first pass the Fear test the bearer's printed rule forces; 1 passes.
    - {key: round.0.first.fear.charge.0, value: 1}
    - {key: round.0.first.fear.charge.1, value: 1}
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 3}
    # The unsaved wound is the last of the bearer's single printed Wound, so the printed
    # Injury table is rolled: 1 leaves it Knocked Down.
    - {key: round.0.first.attack.0.injury.0, value: 1}
  expect_rounds:
    0: {attacks.0.saved: false, attacks.0.damage: 1, state.second.wounds: 0,
        state.second.condition: KNOCKED_DOWN}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

