# --- Authored scenarios ---
# Family model (Righteous Fury): the bearer declares the printed warband skill itself (the catalog
# record carries runtime grant none), strikes first with Initiative 5 and carries the same supplied
# physical characteristics as the opponent fixture, so the dice thresholds and the strike order are
# fixed.  A natural 2 misses against Weapon Skill 3, the taken-again die on 4 hits, and Strength 3
# wounds Toughness 3 on 4.  The identity facts are the accepted ones: species.skaven for the printed
# Skaven and creature_kind.undead for the printed Undead; the excluded opponent is a merely human
# warband member, which the printed sentence removes from the clause.

- audit_id: rule/catalog/warband/skill.righteous-fury/skill.righteous-fury
  id: a-listed-species-receives-the-first-round-reroll
  fighters:
    first:
      skill_ids: [skill.righteous-fury]
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      trait_overrides: {species: skaven}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 2}
    - {key: round.0.first.attack.0.hit.reroll, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: true, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

