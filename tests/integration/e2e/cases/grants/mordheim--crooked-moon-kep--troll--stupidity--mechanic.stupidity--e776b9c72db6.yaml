# --- Authored scenarios ---
# Derived from the printed rule and the recorded semantic contract; no engine output was
# consulted.  The bearer is built from its printed profile with only the physical
# characteristics supplied as fixture facts and its printed Leadership left in place, so the
# tested value comes from the profile: a total of twelve is a certain failure (no catalogue
# Leadership reaches twelve) and a total of two a certain pass.  The opponent is supplied with
# the printed on-fire condition in the two scenarios whose point is the bearer's own
# consequence, because a burning model makes no close-combat attack and the strict tape then
# speaks about the test alone.  The bearer's strike is its ordinary attack pool: the
# printed Vomit Attack replaces the model's normal attacks only when it is declared
# (cases/mechanics/weapon.vomit-attack.yaml carries the declared and the declined
# clauses), and this scenario declares no replacement.  Pending datum: no accepted
# source fixes the default when troll--vomit-attack is undeclared, nor which weapon
# that ordinary attack uses for a profile with fixed_equipment: [].

- audit_id: rule/mordheim/crooked-moon-kep/troll--stupidity/mechanic.stupidity
  id: a-failed-stupidity-test-cancels-its-charge-and-bars-its-attacks
  fighters:
    first:
      collection: mordheim
      band_id: crooked-moon-kep
      profile_id: troll
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 1, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.stupidity.0, value: 6}
    - {key: round.0.first.stupidity.1, value: 6}
  expect_rounds:
    0: {state.first.stupidity_failed: true, state.first.condition: STANDING, state.first.wounds: 3, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: disengaged}

# The printed Troll causes Fear, so the charging opponent is the model the Fear clause tests:
# its own charge-test dice are declared before the bearer's strike.
- audit_id: rule/mordheim/crooked-moon-kep/troll--stupidity/mechanic.stupidity
  id: a-passed-stupidity-test-keeps-contact-and-lets-it-strike
  fighters:
    first:
      collection: mordheim
      band_id: crooked-moon-kep
      profile_id: troll
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 1, attacks: 1, leadership: 7}
  initial_state:
    second: {on_fire: true}
  duel_context: {charging: [second], active_participant: first}
  maximum_rounds: 1
  # The Troll's printed optional Vomit Attack is declined so its ordinary pool strikes.
  decisions:
    - {key: round.0.first.vomit-attack, value: false}
  rolls:
    - {key: round.0.first.stupidity.0, value: 1}
    - {key: round.0.first.stupidity.1, value: 1}
    - {key: round.0.second.fear.charge.0, value: 1}
    - {key: round.0.second.fear.charge.1, value: 1}
    - {key: round.0.first.attack.0.hit, value: 5}
    - {key: round.0.first.attack.0.wound, value: 5}
  expect_rounds:
    0: {state.first.stupidity_failed: false, state.first.condition: STANDING, state.first.wounds: 3, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# Being Frenzied removes the Stupidity die; the charging opponent's Fear test against this
# fear-causing bearer is the only test the round still asks for.
- audit_id: rule/mordheim/crooked-moon-kep/troll--stupidity/mechanic.stupidity
  id: an-already-frenzied-bearer-rolls-no-stupidity-die
  fighters:
    first:
      collection: mordheim
      band_id: crooked-moon-kep
      profile_id: troll
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 1, attacks: 1, leadership: 7}
  initial_state:
    first: {frenzy: true, on_fire: true}
    second: {on_fire: true}
  duel_context: {charging: [second], active_participant: first}
  maximum_rounds: 1
  # The Troll's printed optional Vomit Attack is declined, so no replacement pool is declared.
  decisions:
    - {key: round.0.first.vomit-attack, value: false}
  rolls:
    - {key: round.0.second.fear.charge.0, value: 1}
    - {key: round.0.second.fear.charge.1, value: 1}
  expect_rounds:
    0: {state.first.stupidity_failed: false, state.first.frenzy: true}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
