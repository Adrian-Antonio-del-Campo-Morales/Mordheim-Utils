#
# AUTHORED: 3 scenarios cover the start-of-own-turn individual Leadership test of
#   the bearer built from its printed profile: a total of twelve fails and bars the bearer's own
#   charge and attacks, a total of two passes and it strikes normally, and an already-frenzied
#   bearer is exempt from the test with no die requested.  The random board movement the clause
