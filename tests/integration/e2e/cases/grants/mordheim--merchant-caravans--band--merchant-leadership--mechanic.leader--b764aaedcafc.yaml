# --- Authored scenarios ---
# Derived from the printed sentence, the recorded contract and the printed profiles of this band; no
# engine output was consulted.  The provider is supplied as an admitted nearby participant of the
# borrower's own side, exactly as the canonical leader-six provider is modelled, rather than by
# simulating a warband.

- audit_id: rule/mordheim/merchant-caravans/band--merchant-leadership/mechanic.leader-six
  id: a-supplied-merchant-at-six-inches-lends-his-leadership
  covers: [merchant-leadership--scope--leader-leadership-supply]
  fighters:
    first:
      trait_overrides: {causes_fear: true}
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 10, attacks: 1, leadership: 7}
    second: {collection: mordheim, band_id: merchant-caravans, profile_id: sell-swords}
  duel_context:
    charging: [first]
    active_participant: first
    nearby:
      - participant_id: merchant
        side_id: second
        condition: standing
        fighter: {collection: mordheim, band_id: merchant-caravans, profile_id: merchant}
    distances:
      - [second, merchant, 6]
  decisions:
    - {key: round.0.second.fear.charged.leader.merchant, value: true}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.fear.charged.0, value: 4}
    - {key: round.0.second.fear.charged.1, value: 4}
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.wounds: 3, state.first.condition: STANDING, state.second.wounds: 1, state.second.condition: STANDING, state.second.fear_hit_sixes: false}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

