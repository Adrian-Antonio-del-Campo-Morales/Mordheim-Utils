# --- Authored scenarios ---
# Derived from the printed rule, the recorded contract of each clause and the printed profile; no
# engine output was consulted.  The attacker is a hand-built fixture (Weapon Skill 10 and Initiative
# 10 are fixture facts, not profile values) and the bearer is the boss profile that prints the same
# rule as the rank-and-file entry.  The duel is uncharged and the bearer contributes no attacks of
# its own, so the single incoming mace swing is the whole tape; the wound face is kept below a natural
# six so no critical die is part of this evidence.  The Boss prints a single Wound, so a wound its save
# fails is resolved through the injury table and that die is declared.

