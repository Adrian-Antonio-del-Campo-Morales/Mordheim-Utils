#
# AUTHORED: 3 scenarios cover both printed directions and their contrast: taking the
# opponent out of action sets the bearer's Frenzy flag, a reply that leaves the bearer Knocked Down
# clears it again (the printed "remains until he is Knocked Down, Stunned, or taken Out of Action"),
# and the same out-of-action result on a bearer that does not print the rule grants nothing.  The
# bearer is the printed Strigoi Vampire profile of this band; the opposing fixture's Weapon Skill,
# Strength, Toughness and Initiative are hand-built facts, not profile values, and the bearer's own
# attacks are fixed at one so the tape holds exactly the dice the printed exchange needs.  The
# printed Stunned and Out-of-Action expiry faces are the same general injury transition as the
# Knocked Down one asserted here, so they are named and not repeated.  REVIEWED still requires
# manual semantic review.

# --- Authored scenarios ---
# Derived from the printed rule, the recorded contract and the printed profile; no engine output was
# consulted.  The attacker's declared fours hit and wound an equal-Weapon-Skill, equal-Strength
# opponent, and the injury face of five is the Out-of-Action band.
- audit_id: rule/mordheim/survivors-of-strigos-sylv/strigoi-vampire--great-thirster/mechanic.great-thirster
  id: taking-the-opponent-out-of-action-grants-frenzy
  fighters:
    first:
      collection: mordheim
      band_id: survivors-of-strigos-sylv
      profile_id: strigoi-vampire
      special_rule_ids: [strigoi-vampire--great-thirster]
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 2, attacks: 1, leadership: 7}
  initial_state: {first: {attacks: 1}}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.fear.charged.0, value: 1}
    - {key: round.0.second.fear.charged.1, value: 1}
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.injury.0, value: 5}
  expect_rounds:
    0: {attacks.0.damage: 1, state.second.condition: OUT, state.first.frenzy: true}
  expect_final: {rounds_executed: 1, termination_reason: second_out}

