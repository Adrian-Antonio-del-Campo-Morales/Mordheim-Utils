# --- Authored scenarios ---
# Derived from the printed sentence, the recorded contract and the printed profile; no engine output was
# consulted.  The Wulfen profile has no equipment lists, so it fights with its innate attacks, and its
# printed Strength 4 is supplied as the fixture base of the two-attack bearer.

- audit_id: rule/mordheim/norse-explorers-btb/wulfen--natural-weapons/profile.natural-attacks
  id: the-wulfen-fights-with-two-natural-attacks-at-its-own-strength
  covers: [whole]
  fighters:
    first:
      collection: mordheim
      band_id: norse-explorers-btb
      profile_id: wulfen
      characteristics: {weapon_skill: 3, strength: 4, toughness: 4, wounds: 2, initiative: 5, attacks: 2}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 7}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  # The printed Wulfen also causes Fear (wulfen--fear), and it is the charger, so the charged
  # warrior takes the compulsory round-0 Fear test first; its Leadership is therefore supplied.
  # The two faces total its Leadership exactly, which is a passed test: a failed one would
  # force the warrior to hit on sixes, so the pair is not a double and the flag stays false.
  rolls:
    - {key: round.0.second.fear.charged.0, value: 4}
    - {key: round.0.second.fear.charged.1, value: 3}
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.1.hit, value: 1}
    - {key: round.0.first.attack.0.wound, value: 3}
  expect_rounds:
    0: {attacks.0.damage: 1, state.second.wounds: 1, state.second.fear_hit_sixes: false}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

