# The printed -1 on the contacting living enemy: its own two dice total seven, which passes against its
# printed seven unaided, so the failure recorded here is the penalty itself.
- audit_id: rule/trollheim/chaos-streets-undead-bloodlines/lahmia-vampire--enchanting-beauty/mechanic.enchanting-beauty
  id: the-printed-penalty-turns-a-passing-total-into-a-failure
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.enchanting-beauty]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 8}
    second:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.stupidity]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [], active_participant: second}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.stupidity.0, value: 3}
    - {key: round.0.second.stupidity.1, value: 4}
    - {key: round.0.first.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.stupidity_failed: true}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

