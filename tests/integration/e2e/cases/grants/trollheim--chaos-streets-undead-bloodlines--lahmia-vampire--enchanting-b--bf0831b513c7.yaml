#
# AUTHORED: 3 scenarios cover the printed passive penalty on the contacting enemy's own
#   Leadership tests.  The register's "no consumer applies a Leadership modifier" was not correct: the
#   modifier is applied in two consumed steps (rounds.py adds condition.enchanting-beauty to a contacting
#   enemy that is neither nature.undead nor nature.daemon; leadership.py subtracts the one point, floored at
#   zero, from the value that model tests with).  Scenario 1 declares a contacting enemy with Stupidity whose
#   two dice total seven against its printed seven: that total passes unaided, so the failure recorded at
#   state.second.stupidity_failed is the printed -1 at work.  Scenario 2 removes the rule and the identical
#   total passes, which isolates it.  Scenario 3 tags the tested enemy nature.undead, the printed exemption,
#   and the identical total passes again.  The register's own warning is respected: nothing here copies the
#   Tomb Banshee Ghostly Howl (-D6 for Fear within six inches).  The charge test is deliberately not used,
#   because the printed clause demands base contact and the charge is resolved before contact exists; the
#   test exercised is one taken once contact is established.  REVIEWED still requires manual semantic review.

