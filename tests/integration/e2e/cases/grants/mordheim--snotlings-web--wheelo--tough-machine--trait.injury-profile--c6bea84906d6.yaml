# --- Authored scenarios ---
# Derived from the printed sentence and the recorded contract; no engine output was consulted.  The
# bearer prints the exemption, starts the duel at one Wound and contributes no attacks of its own, so
# round 0 carries only the attacker's dice and the wound that lands is the one that reaches the
# injury table.  The blow is an ordinary mace: at Weapon Skill 10 against this bearer's printed
# Weapon Skill it needs a 3, and Strength 8 against its Toughness needs a 2, so the declared 5 and 5
# both pass.  Five is deliberately below a natural six, which would be a critical hit and add a
# further critical die and an injury modifier.  The normal table takes a fighter out of action on a
# 5, so both declared faces leave the bearer in the duel and no further die is consumed beyond the
# injury die itself.

- audit_id: rule/mordheim/snotlings-web/wheelo--tough-machine/trait.injury-profile
  id: the-wheelo-is-knocked-down-on-a-two
  covers: [normal-table]
  fighters:
    first:
      main_weapon_id: weapon.sword
      characteristics: {weapon_skill: 10, strength: 8, toughness: 3, wounds: 3, initiative: 10, attacks: 1}
    second: {collection: mordheim, band_id: snotlings-web, profile_id: wheelo}
  initial_state: {second: {wounds: 1, attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
