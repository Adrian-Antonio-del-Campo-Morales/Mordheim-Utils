# Clause: minus-one-to-hit (scope: YES)
# AUTHORED[minus-one-to-hit]: 2 scenarios separate the printed incoming melee modifier from the
# ordinary to-hit table by one face: an attacker whose Weapon Skill is far higher needs a three, so
# a declared three misses against the bearer that prints the -1 and hits a band-mate that does not.
# The printed text is (Snotlings Only), and the band's own record of the skill names its recipients as
# the BigSnotz, Scouts and Shaman profiles - the Bullied Goblin is explicitly NOT a Snotling (its own
# record says so), so the bearer is the BigSnotz with the selectable skill chosen; the attacker's
# Weapon Skill, Strength, Toughness and Initiative are hand-built fixture facts, not profile values,
# and the control defender is the band's printed Snotling Mob profile, which carries no such modifier.
# The Snotlings' printed Dodgy save is a 6+ ward, so the control tape declares the ward die one face
# short of it and the declared hit alone decides the modifier under test.  The bearer and the control
# both declare no attack of their own, so each tape holds only the attacker's dice.  The printed
# Hidden/Initiative sentence is the out-of-scope clause of this same record and is retained as
# context, not asserted.  REVIEWED still requires manual semantic review.
