# --- Authored scenarios ---
# The catalog warband skill list prints the canonical head-crusher wording: the
# upgrade transforms injuries inflicted by the bearer, so it is evidenced on the
# printed one-two band of the injury chart. The mace's Concussion already turns
# injury faces 2-4 into Stunned, so the plain Knocked Down face is 1; rolling 2
# would leave the control Stunned without the skill and make the pair vacuous.
