# --- Authored scenarios ---
# Derived from the printed stanza, the recorded contract and the admitted ferocious-charge grants
# specification; no engine output was consulted.  The bearer is the printed Slayer profile of
# this band (WS4, BS3, S3, T4, W1, I2, A1) credited with this band's Ferocious Charge rule through
# special_rule_ids, so the case reads the band grant rather than a bare tag; its printed single
# Attack is what the charge doubles.  The hand-built opponent (WS4, S3, T3, W3, I1) is the
# equal-Weapon-Skill boundary the specification names, and its own strike is a declared natural 1.

- audit_id: rule/trollheim/chaos-streets-dwarf-treasure-hunters/band--slayer-special-skills-ferocious-charge/skill.ferocious-charge
  id: the-charging-turn-doubles-the-pool-and-penalises-the-hit
  fighters:
    first:
      collection: trollheim
      band_id: chaos-streets-dwarf-treasure-hunters
      profile_id: dwarf-troll-slayers
      special_rule_ids: [band--slayer-special-skills-ferocious-charge]
      main_weapon_id: weapon.dagger
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 4, strength: 3, toughness: 3, wounds: 3, initiative: 1, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  # The printed "may" is declared: the charge doubles the pool and suffers the
  # printed -1 To Hit that turn.
  decisions:
    - {key: round.0.first.ferocious-charge, value: true}
  rolls:
    - {key: round.0.first.attack.0.hit, value: 5}
    - {key: round.0.first.attack.1.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    # A dagger grants an unarmoured enemy a 6+ save; the declared face fails it.
    - {key: round.0.first.attack.0.armour, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
