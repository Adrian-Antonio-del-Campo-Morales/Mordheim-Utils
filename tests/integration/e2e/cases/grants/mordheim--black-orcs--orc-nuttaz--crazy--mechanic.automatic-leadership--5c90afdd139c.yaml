# --- Authored scenarios ---
# Derived from the printed rule text, the Orc Nuttaz profile and the recorded semantic contract;
# no engine output was consulted.  The Fear source is a hand-built opposing warrior that declares
# the printed causes_fear trait, and the fixture's Initiative is chosen so the strike order is the
