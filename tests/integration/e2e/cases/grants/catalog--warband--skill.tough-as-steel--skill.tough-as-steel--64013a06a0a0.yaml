#
# AUTHORED: 5 scenarios cover the printed chart: an injury total of 5 leaves the
# skill bearer Stunned where the ordinary table takes the same total Out of Action, a total of 3 leaves it
# Knocked Down where the ordinary table merely Stuns, a total of 6 still takes the bearer out of action, and
# the control scenarios show the same totals on a bearer without the skill.  A total of 4 is Stunned on both
# tables, so it does not discriminate and is not used.

# --- Authored scenarios ---
# Derived from the printed sentence and the recorded contract; no engine output was consulted.  The bearer
# starts the duel at one wound and the attacker's weapon adds no injury modifier, so the declared injury
# die is the injury total itself; the attacker's higher Initiative and the uncharged context let it strike
# first, and the bearer declares no attack of its own because every scenario leaves it Stunned, Knocked Down
# or Out of Action in this round.  The total-of-three pair uses a sword: a mace's Concussion treats faces 2-4
# as Stunned and would override the very Tough as Steel band under test (contract: stunned_from 4).
- audit_id: rule/catalog/warband/skill.tough-as-steel/skill.tough-as-steel
  id: an-injury-total-of-five-stuns-instead-of-removing-the-bearer
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: &tas-attacker {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      skill_ids: [skill.tough-as-steel]
      characteristics: &tas-bearer {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 2, attacks: 1}
  duel_context: &tas-context {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls: &tas-five
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 5}
    - {key: round.0.first.attack.0.injury.0, value: 5}
  expect_rounds:
    0: {attacks.0.wounded: True, attacks.0.damage: 1, state.second.wounds: 0, state.second.condition: STUNNED}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

