# --- Authored scenarios ---
# Runtime review: use the printed W1 maximum and resolve intrinsic ward saves
# before injury. Initiative is stored as base plus initiative_penalty; the
# penalty of one expresses effective I4 without overwriting the base I5.
# Derived from the printed rule for this bearer and the admitted clause; no engine
# output was consulted.  Nightshade is the one admitted poison whose consequence is a
# state change on the warrior it wounds, so it is the rider the immunity must suppress:
# the coated mace wounds the bearer as any mace would, and the poisoned-wound
# Initiative penalty never lands.  The attacker's Weapon Skill 10, Strength 8 and
# Initiative 10 are hand-built fixture facts, not profile values, and its higher
# Initiative with no charge declared lets it strike first, so the bearer declares no
# attack of its own and the tape holds only the attacker's hit and wound dice.
- audit_id: rule/mordheim/ghost-pirates-sar/ghost-captain--undead/trait.poison-immune
  id: the-poisoned-wound-keeps-its-wound-and-loses-its-rider
  fighters:
    first:
      main_weapon_id: weapon.mace
      main_poison_id: poison.nightshade
      characteristics: {weapon_skill: 10, strength: 8, toughness: 3, wounds: 3, initiative: 10, attacks: 1}
    second: {collection: mordheim, band_id: ghost-pirates-sar, profile_id: ghost-captain}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 5}
    - {key: round.0.first.attack.0.special.ward, value: 1}
    - {key: round.0.first.attack.0.injury.0, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 1, state.second.wounds: 0, state.second.initiative_penalty: 0}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The control uses the same attacker and the same declared dice against an ordinary hand-built neighbour
# instead of the ghost captain, so the immunity is the only difference between the two scenarios: the
# poisoned wound lands as before and this time the printed Nightshade penalty does take effect - one unsaved
# wound lowers the target's Initiative by one, from 5 to 4 (cases/mechanics/poison.nightshade.yaml).
- audit_id: rule/mordheim/ghost-pirates-sar/ghost-captain--undead/trait.poison-immune
  id: the-same-poisoned-wound-lowers-an-ordinary-targets-initiative
  fighters:
    first:
      main_weapon_id: weapon.mace
      main_poison_id: poison.nightshade
      characteristics: {weapon_skill: 10, strength: 8, toughness: 3, wounds: 3, initiative: 10, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
  initial_state: {second: {wounds: 2, attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 5}
  expect_rounds:
    0: {attacks.0.damage: 1, state.second.wounds: 1, state.second.initiative_penalty: 1, state.second.initiative: 5}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# Closing review (combined facet): no Ghost Captain carries the second psychology-related grants
#   the operator's suppression faces consume, so the mirror is the hand-built warrior every
#   canonical mechanic.* tape uses, and the undeclared psychology dice are the assertion.
- audit_id: rule/mordheim/ghost-pirates-sar/ghost-captain--undead/mechanic.psychology-immunity
  id: the-immunity-skips-stupidity-suppresses-frenzy-and-denies-the-hatred-reroll
  fighters:
    first:
      trait_overrides: {frenzy: true}
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.stupidity, mechanic.hatred-undead, mechanic.psychology-immunity]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 6}
    second: {collection: mordheim, band_id: undead, profile_id: zombies}
  expect_initial: {first.frenzy: false}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 0, state.first.stupidity_failed: False, state.first.frenzy: False}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
