# --- Authored scenarios ---
# Derived from the printed rule, the printed band profiles and the recorded contract; no engine output was
# consulted.  The Barbarian leader is supplied as an admitted nearby participant within the printed six inches and
# the Stupidity test borrows his Dim-Witted effective Leadership 7 through the engine's leader supply, so the tape
# states the printed condition instead of simulating the warband.  The elf fights with its neutral fist, which
# still grants the opponent the printed 6+ save, taped before the injury roll.

