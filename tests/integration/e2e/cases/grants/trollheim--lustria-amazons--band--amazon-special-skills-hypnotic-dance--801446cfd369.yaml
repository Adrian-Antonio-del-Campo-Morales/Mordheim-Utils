# The printed charm: the enemy must pass a Leadership test (two sixes against its printed seven fail),
# so it may not attack this phase while it may still defend itself normally.
- audit_id: rule/trollheim/lustria-amazons/band--amazon-special-skills-hypnotic-dance/mechanic.mesmerising-dance
  id: a-failed-dance-test-bars-the-target-for-the-round
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.mesmerising-dance]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.mesmerising-dance.0, value: 6}
    - {key: round.0.second.mesmerising-dance.1, value: 6}
    - {key: round.0.first.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.charm_attack_blocked: true, state.second.condition: STANDING, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

