# E2E authoring scaffold; generated comments, manually authored scenarios.
# audit_id: rule/catalog/warband/skill.sword-master/skill.sword-master
# authoring_status: PARTIAL
# authoring_progress: the one-reroll-only clause carries four authored scenarios (the single reroll
# recovering a failed parry, the failure that is not rerolled again, the plain parry that is offered
# no reroll at all, and the single attempt the skill leaves in place even with two parrying weapons).
# The equality half of match-parry-and-parry-a-six carries two scenarios, with and without the skill.
# The printed second half of that clause, "may therefore parry a roll of 6", is NOT represented here:
# the parry eligibility reads can_parry_six from the tag rule.blood-dragon-sword-master alone
# (contexts.py `_parry_context`, mirrored in pools.py and in the native port), while this catalogue
# row's own recorded parameters declare can_parry_six=true for skill.sword-master.  A scenario
# asserting either reading would silently adopt one, and the missing datum is the decision (or the
# consumer change) that fixes which identity carries the six-parry; the same clause is fully
# representable for the Blood Dragon row, whose audit id owns that tag.  REVIEWED still requires
# manual semantic review and execution_status stays UNEXECUTED.
# execution_status: UNEXECUTED (this scaffold has no behavioral result)
#
# Derive inputs and expectations from rule text and accepted rulings.
# Do not derive them from the engine or execute combat during authoring.
# REVIEWED requires semantic review; covers labels alone are insufficient.
# Preserve audit_id when filling this file.
# Governing rulings: docs/decisions/design-rulings.md
#
# Clause: match-parry-and-parry-a-six (scope: YES)
# PARTIAL[match-parry-and-parry-a-six]: [CLOSING-REVIEW [D]] 2 scenarios evidence the equality half (an equal parry die
# blocks an attack that a plain parry would let through, and the same equal die fails without the
# skill); the printed six-parry half is not represented.  The blocker is an identity assignment, not
# the vocabulary: can_parry_six is read only from the tag rule.blood-dragon-sword-master, which this
# catalogue row does not carry, while the row's recorded parameters declare can_parry_six=true.
# Missing datum: the decision that fixes which identity carries the six-parry.
#
# Clause: one-reroll-only (scope: YES)
# AUTHORED[one-reroll-only]: 4 scenario(s) cover the clause: the single reroll recovers a failed
# parry, a failed reroll is not rolled again, a plain parry without the skill is offered no reroll at
# all, and two parrying weapons still leave one attempt, so the printed "may not parry more than one
# attack" is visible against the two-attempt allowance the unbeatable-warrior record prints.

# --- Authored scenarios ---
# Family model (Sword Master, catalogue row): the catalogue skill row is not bound to a band, so the
# bearer is a hand-built fighter carrying the admitted skill identity, as the accepted mechanic-level
# scaffold does.  Physical characteristics are supplied as fixture facts (WS3 S3 T3 W2 I2 A1) so the
# dice thresholds and the strike order are fixed; the bearer parries with a sword (its printed "may
# parry one eligible close-combat hit", read by the executor's parry capacity) and its own attack pool
# is declared empty so the tape holds only the parry under test.  Every expectation is read from the
# printed rule and the recorded parameters, never from engine output; the roll tape is derived
# statically and stays unexecuted.  The equality half of the match clause is evidenced below and its
# printed six-parry half stays pending in the clause note above.

# The printed equality: a parry die equal to the declared To Hit four blocks the blow.
- audit_id: rule/catalog/warband/skill.sword-master/skill.sword-master
  id: an-equal-parry-die-blocks-the-attack
  covers: [match-parry-and-parry-a-six]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.sword
      skill_ids: [skill.sword-master]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.parry, value: 4}
  expect_rounds:
    0: {attacks.0.parried: true, state.second.parries_remaining: 0, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The boundary of the printed equality: the same die against the same parry window without the skill
# does not block, so the blow is resolved and wounds.
- audit_id: rule/catalog/warband/skill.sword-master/skill.sword-master
  id: without-the-skill-an-equal-parry-die-does-not-block
  covers: [match-parry-and-parry-a-six]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.sword
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.parry, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
  expect_rounds:
    0: {attacks.0.parried: false, attacks.0.damage: 1, state.second.parries_remaining: 0, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The printed single reroll recovers a failed attempt: the first parry die is below the hit and the
# reroll meets the printed equality, so the hit is blocked.
- audit_id: rule/catalog/warband/skill.sword-master/skill.sword-master
  id: the-single-reroll-recovers-a-failed-parry
  covers: [one-reroll-only]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.sword
      skill_ids: [skill.sword-master]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 5}
    - {key: round.0.first.attack.0.parry, value: 4}
    - {key: round.0.first.attack.0.parry.reroll, value: 5}
  expect_rounds:
    0: {attacks.0.parried: true, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The printed refusal to re-roll the re-roll: the recovery die also fails and no further parry die
# appears in the tape, so the wound is resolved.
