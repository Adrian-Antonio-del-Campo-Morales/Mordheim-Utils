# The single-attempt half: the bearer holds two parrying weapons, and the skill still leaves the parry
# capacity at one, so the second attack of the pool is resolved while the first is blocked.  The
# contrasting two-attempt pair belongs to the unbeatable-warrior record, whose printed flag raises the
# capacity; this skill does not.
- audit_id: rule/catalog/warband/skill.sword-master/skill.sword-master
  id: two-parrying-weapons-still-give-one-attempt
  covers: [one-reroll-only]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 2}
    second:
      main_weapon_id: weapon.sword
      off_hand_id: weapon.sword
      skill_ids: [skill.sword-master]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.1.hit, value: 4}
    - {key: round.0.first.attack.0.parry, value: 5}
    - {key: round.0.first.attack.1.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.parried: true, attacks.1.parried: false, attacks.1.damage: 1, state.second.parries_remaining: 0, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
