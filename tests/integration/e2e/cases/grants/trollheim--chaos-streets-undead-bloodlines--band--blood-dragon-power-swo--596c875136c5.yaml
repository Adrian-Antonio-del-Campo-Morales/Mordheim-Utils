# --- Authored scenarios ---
# Family model (Blood Dragon power: Sword Master): the bearer is the printed recipient of this band
# record, built from its own collection, band and profile and selecting the band row named in the audit
# id, whose selected runtime binds the admitted skill identity and whose row the compiler maps onto the
# dedicated tag rule.blood-dragon-sword-master.  Physical characteristics are supplied as fixture facts
# (WS3 S3 T3 W2 I2 A1) so the dice thresholds and the strike order are fixed, while the printed
# Leadership stays in place; the bearer parries with a sword and its own attack pool is declared empty
# so the tape holds only the parry under test.  Every expectation is read from the printed rule (only
# needs to equal the opponent's roll and may therefore parry a roll of 6; may re-roll one failed parry
# but not the re-roll; may not parry more than one attack) and the recorded parameters, never from
# engine output; the roll tape is derived statically and stays unexecuted.  The control cases remove
# the band selection and keep the same warrior and the same tape, so only the grant explains the
# difference.

