# --- Additional authored scenarios ---
# The printed row is "The model causes Fear and may reroll any Leadership Test" (Lunatic). The Mad
# Scientist cannot evidence the reroll half: its profile carries mad-scientist--immune-to-psychology
# (profiles.yaml), which suppresses every psychology test, and the Lunatic half makes the bearer cause
# Fear, so no Fear test can arise for it either (needs_test excludes immune warriors and mutual
# fear-causers). The Wolfman is also in the row's applies_to list, carries no psychology immunity and
# can therefore take an individual Leadership test. The corpus supplies the Stupidity state as a
# fixture fact (trait_overrides: {stupidity: true}), the same device the mechanic.* cases use; the test
# is the Wolfman's own Leadership 7, so the declared 6+6 fails and the declared 1+1 reroll passes
# regardless of later profile changes. The clause audited is still the printed optional reroll; only
# the Leadership test that triggers it changes from an impossible Fear test to an individual one.
- audit_id: rule/mordheim/masters-of-horror-sylv/mad-scientist--lunatic/mechanic.leadership-reroll
  id: the-lunatic-rerolls-its-failed-stupidity-test
  covers: [leadership-reroll]
  fighters:
    first:
      collection: mordheim
      band_id: masters-of-horror-sylv
      profile_id: wolfman
      trait_overrides: {stupidity: true}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 1, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.first.stupidity.reroll, value: true}
  rolls:
    - {key: round.0.first.stupidity.0, value: 6}
    - {key: round.0.first.stupidity.1, value: 6}
    - {key: round.0.first.stupidity.reroll.0, value: 1}
    - {key: round.0.first.stupidity.reroll.1, value: 1}
    - {key: round.0.second.fear.charged.0, value: 1}
    - {key: round.0.second.fear.charged.1, value: 1}
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.first.attack.1.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.stupidity_failed: false, state.first_charged: true}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

