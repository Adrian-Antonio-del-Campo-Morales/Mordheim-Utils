#
# Clause: cause-fear (scope: YES)
# AUTHORED[cause-fear]: 2 scenarios cover the printed Fear consequence for the warrior charged by this
# causer: on a failed Leadership test its hit roll of 4 - a roll that beats its ordinary target -
# wounds nothing, and on a passed test the same roll wounds it.  The warrior charged by this
# causer is the Fear-tested side; the fixture's Leadership 7, Weapon Skill 10 and Strength 8
# are hand-built facts, not profile values, and the causer contributes no attacks of its own so
# the only rolls are the Fear test and the charged warrior's.  The cancelled voluntary charge,
# the one-test-per-pairing rule and the exemptions (an opponent that causes Fear, is immune to
# Psychology or Fear, or is Frenzied) are not asserted here: the cancelled charge is a
# charge-flag consequence rather than a wound outcome and the exemptions need a second bearer
# this file does not declare.  REVIEWED still requires manual semantic review.
#
# Clause: leadership-reroll (scope: YES)
# AUTHORED[leadership-reroll]: 3 scenarios carry the printed reroll onto the real route: the bearer fails
#   its own Stupidity Leadership test, the declared offer is taken and the second pair passes, so its charge
#   survives; the accepted second failure with no third attempt (the fixture refuses a second request); and
#   the declined offer, where the first failure stands.  The bearer is the Wolfman, a profile the row's own
#   `applies_to.profile_ids` admits and which carries no psychology immunity, so the printed optional reroll
#   is observable on an individual Leadership test.  The Mad Scientist is not used: its printed
#   `mad-scientist--immune-to-psychology` suppresses every psychology test and the row's Fear-causing half
#   blocks the charged-side Fear test by reciprocity, so no Leadership test could ever fail for it.  Both
#   halves of the row are bound to mechanics in the band's special-rules.yaml, so the offer comes from the
#   printed record and not from an injected mechanic.

