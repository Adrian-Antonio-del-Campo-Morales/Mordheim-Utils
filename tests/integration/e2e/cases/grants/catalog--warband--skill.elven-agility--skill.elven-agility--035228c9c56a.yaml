# UNEXECUTED.
# execution_status: UNEXECUTED (this scaffold has no behavioral result)
#
# Derive inputs and expectations from rule text and accepted rulings.
# Do not derive them from the engine or execute combat during authoring.
# REVIEWED requires semantic review; covers labels alone are insufficient.
# Preserve audit_id when filling this file.
# Governing rulings: docs/decisions/design-rulings.md
#
# AUTHORED: 5 scenarios read the accepted observable of the rule: an
# incoming close-combat attack that cannot fail its hit and wound steps is discarded on a
# special save of 6, is not discarded on 5, is discarded on 4 when the bearer also carries
# Step Aside (the accepted combination is one 4+ save, not two rolls), is not discarded on 3
# even then, and reaches the bearer without any save request when the tag is absent.  The
# strike is declared after the armour step by the engine contract (special save after
# armour), so no armour die is declared in any scenario.  The catalog origin prints the
# shared rule and binds no recipient list, so the fixture carries the canonical tag itself.
# REVIEWED still requires manual semantic review.

# --- Authored scenarios ---
# Derived from the printed rule text, the recorded contract and the admitted semantic
# specifications; no engine output was consulted.  The assailant is a hand-built fixture
# (Weapon Skill 10, Strength 8) whose close-combat hit of 4 and wound of 2 cannot fail
# against the Toughness-3 bearer, so the only undecided step of the attack is the special
# save itself.  Both warriors strike with their printed single Attack and the bearer's own
# strike is declared as a natural 1, so the round reports nothing else; the strict tape
# consumes exactly the declared dice, so a save the engine still asked for without the rule
# (or an extra sequential save roll for the Step Aside combination) fails the case instead
# of passing quietly.

- audit_id: rule/catalog/warband/skill.elven-agility/skill.elven-agility
  id: the-avoidance-holds-on-six
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 10, strength: 8, toughness: 3, wounds: 3, initiative: 10, attacks: 1}
    second:
      skill_ids: [skill.elven-agility]
      main_weapon_id: weapon.dagger
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 2}
    - {key: round.0.first.attack.0.special.ward, value: 6}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.saved: true, attacks.0.damage: 0, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

