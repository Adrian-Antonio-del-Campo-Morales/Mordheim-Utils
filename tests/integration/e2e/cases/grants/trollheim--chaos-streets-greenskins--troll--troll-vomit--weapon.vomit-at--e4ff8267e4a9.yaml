#
# AUTHORED: 2 scenarios cover the printed "instead of attacking normally" replacement: the
# declared attack is one automatic Strength 5 hit with no To Hit die, no armour die even against plate
# armour and no parry die, and the declined declaration leaves the profile's three ordinary natural
# attacks each with its own To Hit die.  Bearer is the printed Troll of this band (WS3 S5 T4 W3 I1 A3 Ld4,
# printed page 135), whose automatic profile rules make the round begin with the mandatory two-dice
# Stupidity test (keys round.0.first.stupidity.0/1, passing on a sum no greater than Leadership 4); its
# regeneration, Fear, stupid-monster and always-hungry rows stay idle because the Troll is neither wounded
# nor charged and the upkeep row is campaign scope.  The declaration is the decision
# round.0.first.vomit-attack.  REVIEWED still requires manual semantic review.

# --- Authored scenarios ---
# Derived from the printed rule and the printed profile; no engine output was consulted.
