# --- Authored scenarios ---
# Both scenarios use the same pair (a dagger in each hand), the same 5+ heavy armour on the
# defender and the same wound, and script the same armour face of four: the printed dagger
# profile already grants the target +1 armour save, so four holds against the pair alone and
# is one short of the save the skill worsens by one.
- audit_id: rule/mordheim/silent-brotherhood-sc/band--skill-cutthroat/skill.cutthroat
  id: cutthroat-dagger-pair-worsens-the-save
  fighters:
    first:
      main_weapon_id: weapon.dagger
      off_hand_id: weapon.dagger
      skill_ids: [skill.cutthroat]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      armour_id: armour.heavy-armour
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.1.hit, value: 1}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.armour, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.saved: False, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
