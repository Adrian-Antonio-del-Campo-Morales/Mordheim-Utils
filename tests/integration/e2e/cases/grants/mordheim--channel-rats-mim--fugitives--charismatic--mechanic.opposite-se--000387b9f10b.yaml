#
# PARTIAL: [C] the printed sentence gates an opposing charge on the opponent's sex ("any
# model from the opposite sex (Sisters of Sigmar, Amazons, Kislev Ranger etc), must make a Leadership
# test if they wish to charge a Fugitive").  The recorded effect is the proposed
# proposed.sex-qualified-charge-gate, and the register states plainly that the complete resolve_fear
# path has no opposite-sex qualification and that these are "existing seams, not an already
# implemented Charismatic operator".  The missing representation is therefore twofold: a supplied
# sex/identity fact on the opposing participant (the engine models neither sex nor the printed
# recipient list) and the gate itself on the charge seam the record names, which would turn a failed
# test into a cancelled voluntary charge.  Writing the scenario first would assert a gate the engine
# does not carry; the closest admitted device, the Fear charge test with its declared dice, is what
# the accepted fear grants already evidence, and it is not this clause.  REVIEWED still requires
