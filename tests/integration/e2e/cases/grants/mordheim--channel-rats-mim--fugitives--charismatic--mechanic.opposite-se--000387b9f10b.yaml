# --- Authored scenarios ---
# Derived from the printed clause and the band's own implemented rule row; no engine output was
# consulted.  The Fugitive is read from its printed profile (Ld 7, A 1) and states the printed
# sex fact; the charging enemy is a hand-built warrior (Leadership 5 declared) with the opposite
# sex declared for the gate.  The gate is a 2d6 Leadership test keyed round.0.first.charismatic-charge.

- audit_id: rule/mordheim/channel-rats-mim/fugitives--charismatic/mechanic.opposite-sex-charge-test
  id: the-opposite-sex-charger-takes-the-gate-and-fails-it
  # The printed gate: a woman of the opposite sex wishing to charge the Fugitive takes a
  # Leadership test.  4+3 = 7 is above the declared Leadership 5, so the charge fails and the
  # round resolves without combat (the strict tape holds no combat dice).
  fighters:
    first:
      trait_overrides: {sex: female}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 3, attacks: 1, leadership: 5}
    second:
      collection: mordheim
      band_id: channel-rats-mim
      profile_id: fugitives
      trait_overrides: {sex: male}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.charismatic-charge.0, value: 4}
    - {key: round.0.first.charismatic-charge.1, value: 3}
  expect_rounds:
    0: {state.engaged: false}
  expect_final: {rounds_executed: 1, termination_reason: disengaged}

# The control charges with the same sex as the Fugitive: the clause qualifies the opposite sex
# only, so no gate die exists and the charge resolves as ordinary close combat (natural-1 strikes
# miss for everyone).
- audit_id: rule/mordheim/channel-rats-mim/fugitives--charismatic/mechanic.opposite-sex-charge-test
  id: the-same-sex-charger-is-ungated
  fighters:
    first:
      trait_overrides: {sex: male}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 3, attacks: 1, leadership: 5}
    second:
      collection: mordheim
      band_id: channel-rats-mim
      profile_id: fugitives
      trait_overrides: {sex: male}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.wounds: 2, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
