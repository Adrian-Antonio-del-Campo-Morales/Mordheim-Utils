#
# Clause: whole--scope--equipment-list-access (scope: YES)
# AUTHORED[whole--scope--equipment-list-access]: 2 scenarios evidence the printed bound "only from the Swabbie
# Equipment List" in both directions, from this origin's own published lists rather than from the engine.
# RECIPIENT: the printed Swabbie profile (bands/mordheim/pirates/profiles.yaml, id swabbies), whose
# equipment_lists declares swabbie-equipment-list and nothing else, so its offered set is exactly that list.
# INPUT: the fixture's carried-item channel (owned_item_ids), the same channel the sibling kit refusals use.
# REFUSAL: a Swabbie carrying crossbow - a registered catalogue row (catalog/items/weapons-ranged.yaml) that
# the band's Pirate Equipment List offers to every other Pirate profile and the Swabbie Equipment List does not
# - is refused at construction with the shared stage's per-item offered-set sentence
# '"<item>" is not on any equipment list of <band>/<profile>.', the form this revision's authored kit refusals
# already exhibit for a single item outside the offered set.  ADMISSION: the same profile carrying bow, the row
# only the Swabbie Equipment List offers (the Pirate Equipment List has no bow), constructs and the engagement
# reaches its declared checkpoint.  The two rows are complementary - one list offers each and the other does
# not - so the pair distinguishes the printed bound from an unrestricted band-wide list instead of resting on
# an item no list offers.  The scope-NO casting bar
# (compiler.swabbie-rabble-loadout's "magic is forbidden for Swabbies") concerns the excluded casting
# subsystem and is recorded, not asserted.
#
# Clause: whole--scope--casting-bar (scope: NO)
# Outside the admitted clause scope; retained for context, not a test TODO.

# --- Authored scenarios ---
# Derived from the printed sentence and this origin's two published equipment lists (profiles.yaml for the
# recipient's own list, equipment-access.yaml for the rows each list offers); no engine output was consulted.
# The channel is the fixture's carried-item field, which the shared stage validates against the recipient's
# offered set exactly as it validates a slotted weapon.

- audit_id: rule/mordheim/pirates/swabbies--rabble/compiler.swabbie-rabble-loadout
  id: a-pirate-list-row-is-refused-for-a-swabbie
  covers: [whole--scope--equipment-list-access]
  # crossbow is on the band's Pirate Equipment List (available to crew, gunners, ship's mates and every other
  # Pirate profile) and is absent from the Swabbie Equipment List, which is this recipient's only list.  The
  # declared fragment is the stage's own per-item access sentence, so an unrelated failure cannot satisfy it.
  fighters:
    first:
      collection: mordheim
      band_id: pirates
      profile_id: swabbies
      owned_item_ids: [crossbow]
  expect_error: '"crossbow" is not on any equipment list of pirates/swabbies.'

- audit_id: rule/mordheim/pirates/swabbies--rabble/compiler.swabbie-rabble-loadout
  id: the-swabbie-list-row-is-admitted-at-construction
  covers: [whole--scope--equipment-list-access]
  # bow is the row only the Swabbie Equipment List offers, so carrying it is what the printed sentence
  # permits; the profile constructs and the engagement terminates at its declared checkpoint.
  fighters:
    first:
      collection: mordheim
      band_id: pirates
      profile_id: swabbies
      main_weapon_id: weapon.mace
      owned_item_ids: [bow]
    second:
      collection: mordheim
      band_id: pirates
      profile_id: crew
  duel_context:
    charging: []
    active_participant: first
  initial_state:
    second:
      condition: OUT
  expect_initial:
    second.condition: OUT
  expect_final:
    rounds_executed: 0
    termination_reason: second_out
