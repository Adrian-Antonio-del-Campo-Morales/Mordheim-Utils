# --- Authored scenarios ---
# Derived from the printed sentence, the recorded contract and the printed profiles of this band; no
# engine output was consulted.  The bearer is the band's own hero profile with the printed row
# selected, and the fighters' physical characteristics are fixture facts so the tape is fixed.
# The printed Beserkers profile also carries Frenzy as a profile rule, so the charge resolves two
# attacks; the second is declared as a hit whose wound roll fails, which keeps the damage
# expectation isolating the reroll of the first, failed hit.

- audit_id: rule/mordheim/norse-explorers-btb/band--norse-special-skills-berserk-charge/special-rule.band--norse-special-skills-berserk-charge
  id: a-charging-hero-with-an-axe-rerolls-his-failed-hit
  fighters:
    first:
      collection: mordheim
      band_id: norse-explorers-btb
      profile_id: beserkers
      special_rule_ids: [band--norse-special-skills-berserk-charge]
      main_weapon_id: weapon.axe
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
