# --- Authored scenarios ---
# The printed sentence is "The Necromantic Abomination gains +1 Leadership" (Paladin of Horror row of the
# Necromantic Modification table), and the row's own `eligibility` names the Abomination as its recipient.
# The recipient is built from the band package with the row selected through special_rule_ids; the supplied
# Leadership is read as the duel's own initial characteristic, and the same build without the selection
# supplies the printed base value.  Both duels are uncharged, so the only thing under test is the compiled
# characteristic and the only dice are declared misses (the Abomination has two attacks, so two hit dice).
- audit_id: rule/trollheim/khemri-necromancers/band--necromantic-modification-paladin-of-horror/profile.characteristics
  id: the-necromantic-abomination-is-supplied-leadership-seven
  fighters:
    first:
      collection: trollheim
      band_id: khemri-necromancers
      profile_id: necromantic-abomination
      special_rule_ids: [band--necromantic-modification-paladin-of-horror]
    second:
      characteristics: &khemri-fixture {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: &khemri-uncharged {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.priority-tie, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.first.attack.1.hit, value: 1}
  expect_fighters: {first.characteristics.leadership: 7}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The same recipient without the printed row: the printed Leadership 6 stands, so the seventh point is what
# the selected row supplies rather than an unconditional profile value.
- audit_id: rule/trollheim/khemri-necromancers/band--necromantic-modification-paladin-of-horror/profile.characteristics
  id: the-unselected-abomination-keeps-leadership-six
  fighters:
    first:
      collection: trollheim
      band_id: khemri-necromancers
      profile_id: necromantic-abomination
    second:
      characteristics: *khemri-fixture
  duel_context: *khemri-uncharged
  maximum_rounds: 1
  rolls:
    - {key: round.0.priority-tie, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.first.attack.1.hit, value: 1}
  expect_fighters: {first.characteristics.leadership: 6}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# A profile the row's eligibility does not name keeps no bonus and is refused the row itself, which is the
# closure of the recipient set; the fragment is the shared diagnostic of specialRuleRestriction.
- audit_id: rule/trollheim/khemri-necromancers/band--necromantic-modification-paladin-of-horror/profile.characteristics
  id: a-profile-outside-the-recipient-list-is-refused
  fighters:
    first:
      collection: trollheim
      band_id: khemri-necromancers
      profile_id: skeleton-warriors
      special_rule_ids: [band--necromantic-modification-paladin-of-horror]
  expect_error: "special rule is not available to khemri-necromancers/skeleton-warriors"

