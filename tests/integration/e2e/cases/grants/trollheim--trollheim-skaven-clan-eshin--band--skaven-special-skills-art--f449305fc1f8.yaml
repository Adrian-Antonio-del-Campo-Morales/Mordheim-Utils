# AUTHORED: 5 scenarios cover the unarmed extra attack, the critical hit on a To Wound roll of five, and the paired fighting-claw pool ending one attack higher, each with the same configuration without the skill where the printed improvement is the only difference.

# --- Authored scenarios ---
# The printed sentence claims three independently observable consequences: fighting with bare
# claws without penalty carries an extra attack, a To Wound roll of 5-6 is a critical, and the
# same skill combined with Eshin Fighting Claws grants +2 Attacks instead of +1 (the paired claw
# profile supplies the further attack).  Every expectation comes from the printed text and the
# recorded contract, never from engine output.
- audit_id: rule/trollheim/trollheim-skaven-clan-eshin/band--skaven-special-skills-art-of-silent-death/skill.art-of-silent-death
  id: a-five-is-a-critical-wound-with-the-skill
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [skill.art-of-silent-death]
      characteristics: &skaven-ws3-s3-t3-w2-i5 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: &plain-ws3-s3-t3-w2-i2 {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1}
  duel_context: &charging-first {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 5}
    - {key: round.0.first.attack.0.critical, value: 2}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.critical: true, attacks.0.damage: 2, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

