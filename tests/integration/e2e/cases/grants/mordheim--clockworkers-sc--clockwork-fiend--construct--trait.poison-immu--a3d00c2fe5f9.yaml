#   (packages/python/core/mordheim_core/models.py) supplies main-hand, off-hand, armour and material slots plus
#   an item list (`owned_item_ids`) and no slot count, no per-item slot cost and no over-capacity diagnostic.
#   So neither boundary is declarable: an over-capacity kit has no field to declare and no refusal sentence to
#   assert as its expectation, and a kit inside the capacity is accepted both by a correct implementation and by
#   one that never counts slots, so that tape would not discriminate (the criterion this corpus applies to
