# --- Authored scenarios ---
# Derived from the printed rule for this bearer and the admitted clause; no engine
# output was consulted.  Nightshade is the one admitted poison whose consequence is a
# state change on the warrior it wounds, so it is the rider the immunity must suppress:
# the coated mace wounds the bearer as any mace would, and the poisoned-wound
# Initiative penalty never lands.  The attacker's Weapon Skill 10, Strength 8 and
# Initiative 10 are hand-built fixture facts, not profile values, and its higher
# Initiative with no charge declared lets it strike first, so the bearer declares no
# attack of its own and the tape holds only the attacker's hit and wound dice.
- audit_id: rule/mordheim/clockworkers-sc/clockwork-fiend--construct/trait.poison-immune
  id: the-poisoned-wound-keeps-its-wound-and-loses-its-rider
  fighters:
    first:
      main_weapon_id: weapon.mace
      main_poison_id: poison.nightshade
      characteristics: {weapon_skill: 10, strength: 8, toughness: 3, wounds: 3, initiative: 10, attacks: 1}
    second: {collection: mordheim, band_id: clockworkers-sc, profile_id: clockwork-fiend}
  initial_state: {second: {wounds: 2, attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    # A five wounds an S8 attack against T3 without being the critical six, so the
    # scenario reads the poisoned wound itself.
    - {key: round.0.first.attack.0.wound, value: 5}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 1, state.second.wounds: 1, state.second.initiative_penalty: 0}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The control uses the same attacker and the same declared dice against an ordinary hand-built neighbour
# instead of the construct, so the immunity is the only difference between the two scenarios: the poisoned
# wound lands as before and this time the printed Nightshade penalty does take effect - one unsaved wound
# lowers the target's Initiative by one, from 5 to 4 (cases/mechanics/poison.nightshade.yaml).
- audit_id: rule/mordheim/clockworkers-sc/clockwork-fiend--construct/trait.poison-immune
  id: the-same-poisoned-wound-lowers-an-ordinary-targets-initiative
  fighters:
    first:
      main_weapon_id: weapon.mace
      main_poison_id: poison.nightshade
      characteristics: {weapon_skill: 10, strength: 8, toughness: 3, wounds: 3, initiative: 10, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
  initial_state: {second: {wounds: 2, attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    # A five wounds an S8 attack against T3 without being the critical six, so the
    # scenario reads the poisoned wound itself.
    - {key: round.0.first.attack.0.wound, value: 5}
  expect_rounds:
    # The wound records its Initiative penalty; the base characteristic is not rewritten.
    0: {attacks.0.damage: 1, state.second.wounds: 1, state.second.initiative_penalty: 1, state.second.initiative: 5}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The printed No Pain, read at the injury boundary: the bearer is the printed profile this clause names and it
# stands on its last wound, so the declared hit-wound-injury sequence reaches the chart, whose declared three is
# the printed Stunned result - and the clause converts it to Knocked Down.
- audit_id: rule/mordheim/clockworkers-sc/clockwork-fiend--construct/skill.ignore-pain
  id: a-stunned-result-leaves-the-construct-knocked-down
  fighters:
    first:
      main_weapon_id: weapon.mace
      # The Fiend prints T5, so the attacker needs S8 for the declared five to wound at all
      # without being the critical six.
      characteristics: {weapon_skill: 3, strength: 8, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
    second: {collection: mordheim, band_id: clockworkers-sc, profile_id: clockwork-fiend}
  initial_state: {second: {wounds: 1, attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    # A five wounds an S8 attack against T3 without being the critical six, so the
    # scenario reads the poisoned wound itself.
    - {key: round.0.first.attack.0.wound, value: 5}
    - {key: round.0.first.attack.0.injury.0, value: 3}
  expect_rounds:
    0: {state.second.condition: KNOCKED_DOWN}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The control for the same declared dice against an ordinary hand-built neighbour instead of the construct: the
# chart result is identical and this time it stands as the printed Stunned, so the conversion is the construct's.
- audit_id: rule/mordheim/clockworkers-sc/clockwork-fiend--construct/skill.ignore-pain
  id: without-the-construct-rule-the-same-result-stuns
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 2, attacks: 1}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    # Both print Initiative 2, so the tie die decides the order; a four sends the attacker first.
    - {key: round.0.priority-tie, value: 4}
    - {key: round.0.first.attack.0.hit, value: 4}
    # A five wounds an S8 attack against T3 without being the critical six, so the
    # scenario reads the poisoned wound itself.
    - {key: round.0.first.attack.0.wound, value: 5}
    - {key: round.0.first.attack.0.injury.0, value: 3}
  expect_rounds:
    0: {state.second.condition: STUNNED}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The printed immunity to Psychology, read through the round-0 Fear test of the charged warrior: the charger
# declares causes_fear, and the immune construct declares no Fear die at all, so the round holds only the
# charger's strike.  The bearer's own attack dice are suppressed, as the sibling poison tapes do for this profile.
- audit_id: rule/mordheim/clockworkers-sc/clockwork-fiend--construct/mechanic.psychology-immunity
  id: the-charged-construct-is-not-tested-for-fear
  fighters:
    first:
      trait_overrides: {causes_fear: true}
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 7, attacks: 1, leadership: 7}
    second: {collection: mordheim, band_id: clockworkers-sc, profile_id: clockwork-fiend}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  # No Fear die is offered to the immune construct. Its emptied pool still resolves one printed
  # unarmed attack, declared here as a miss so the observation stays the immunity.
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 0, state.second.wounds: 3, state.second.condition: STANDING}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The contrast: the same charger against the band's non-construct handymen, which carries no psychology immunity,
# does ask for the two-dice Fear test, declared here as a passing 1+1.
- audit_id: rule/mordheim/clockworkers-sc/clockwork-fiend--construct/mechanic.psychology-immunity
  id: a-band-mate-without-the-immunity-is-tested
  fighters:
    first:
      trait_overrides: {causes_fear: true}
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 7, attacks: 1, leadership: 7}
    second: {collection: mordheim, band_id: clockworkers-sc, profile_id: handymen}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.fear.charged.0, value: 1}
    - {key: round.0.second.fear.charged.1, value: 1}
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.second.wounds: 1, state.second.condition: STANDING}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The printed "Constructs are unaffected by drugs", read on the one drug whose whole contribution is a
# duel-start state: Mad Cap Mushrooms grants Frenzy.  The drug identity comes from the drug class the shared
# construction stage itself carries (DRUG_PREPARATIONS in _eligibility.js / domain/eligibility), and the build
# channel is `preparation_ids`.  The bearer is the printed clockwork-fiend profile this clause names and
# declares no attack of its own (the poison scenarios above do the same), while the hand-built attacker
# declares a miss, so the round resolves on the single declared die and the suppressed drug change is read as
# the unchanged state.  PENDING implementation: proposed.drug-immunity is unpromoted, so this scenario is
# written to fail until a consumer suppresses a drug-derived change to the construct itself.
- audit_id: rule/mordheim/clockworkers-sc/clockwork-fiend--construct/mechanic.drug-immunity
  id: the-supplied-drug-does-not-frenzy-the-construct
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 10, strength: 8, toughness: 3, wounds: 3, initiative: 10, attacks: 1}
    second:
      collection: mordheim
      band_id: clockworkers-sc
      profile_id: clockwork-fiend
      preparation_ids: [preparation.mad-cap-mushrooms]
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_initial: {second.frenzy: False}
  expect_rounds:
    0: {attacks.0.damage: 0, state.second.frenzy: False}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

