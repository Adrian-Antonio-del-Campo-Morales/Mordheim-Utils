# AUTHORED: 2 scenarios show the printed poison immunity against the one duel-time
# poison rider: a Nightshade-coated mace wounds the bearer, the wound is taken as any
# wound would be, and the poisoned-wound Initiative penalty is suppressed, so the
# bearer's recorded initiative_penalty stays 0.  The bearer is the clockworkers-sc/clockwork-fiend profile
# that prints the rule, which declares no armour, ward or regeneration save and no
# Ethereal-class hit gate, so the mace lands its wound without a declared defence die.
# The bearer starts the duel at two wounds and declares no attack, so a single unsaved
# wound leaves it standing and no injury roll is needed; the clause is single-faceted,
# so the second scenario is the ordinary-neighbour control, which shows that the same poisoned wound really does lower a non-immune target's Initiative by one.
# The printed profile lists this rule without the compiled poison_immune trait, which
# is an implementation observation recorded for execution, not a clause decision.
# REVIEWED still requires manual semantic review and execution_status stays
# UNEXECUTED.
#
# AUTHORED: 2 scenarios evidence the printed immunity through the one Psychology
#   request this setup can make - the round-0 Fear test of the charged warrior.  The bearer is the printed
#   clockwork-fiend profile with the canonical mechanic.psychology-immunity supplied on it (this record's
#   binding is again the pending connection the register names); the opposing fixture declares causes_fear and
#   charges.  In the immune scenario the tape declares no Fear die at all, and the strict tape consumes exactly
#   the declared dice and rejects both an undeclared request and an unused entry, so a test the engine still
#   asked for fails the case instead of passing quietly - the absence is the assertion.  In the contrast
#   scenario the same charger meets the band's non-construct handymen, which carries no psychology immunity, and
