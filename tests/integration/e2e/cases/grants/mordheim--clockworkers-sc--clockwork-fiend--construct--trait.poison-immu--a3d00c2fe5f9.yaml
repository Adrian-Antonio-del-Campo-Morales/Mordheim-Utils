# PARTIAL: [C] the printed capacity is a loadout-construction fact of this
#   supplied construct, and the KB does print it: sources/knowledge/bands/mordheim/clockworkers-sc/profiles.yaml
#   carries it in prose on this profile's `equipment_restrictions` ("Four equipment slots and one armour slot;
