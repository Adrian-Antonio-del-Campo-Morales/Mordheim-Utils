# --- Authored scenarios ---
# Derived from the printed rule ("The Hero always strikes first in close combat when fighting any
# type of Skink, regardless of the weapon used or which model charged") and the recorded
# contract (opponent species.skink, priority 20).  The bearer is a printed Amazon Hero with the
# band skill selected; the qualifying opponent is a Skink of the Lizardmen band package, whose
# own Initiative is higher than the bearer's (four against three), so nothing but the rule can
# put the bearer's die first.  The control opponent is hand-built with the same higher Initiative
# and no printed species, and there the opponent's die is the first one declared.  Both fighters
# keep a single attack and the defender's wounds are supplied above one, so the tape holds the
# ordering question alone.

