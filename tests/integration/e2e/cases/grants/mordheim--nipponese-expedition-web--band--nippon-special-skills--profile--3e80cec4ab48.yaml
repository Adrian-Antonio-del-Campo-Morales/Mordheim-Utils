# --- Authored scenarios ---
# Derived from the printed list sentence, the reviewed EQ-P-SKILL-ACCESS row, this band's own profiles.yaml
# and the established skill-availability family; no engine output was consulted.  Neither tape declares an
# attack of its own, so the observation is the access decision itself.

- audit_id: rule/mordheim/nipponese-expedition-web/band--nippon-special-skills/profile.skill-access
  id: a-special-skill-outside-the-printed-list-is-refused-for-a-nippon-hero
  # The closure of the printed access: the Nippon heroes may use the named list *instead of* the standard
  # tables, so a special skill the printed list does not contain is not available to one of them.  The
  # recipient is this band's own printed hero (profiles.yaml id hatamoto, whose skill_access carries the
  # special category) and the declared identity is a registered catalogue warband skill the printed Nippon
  # list does not name.  The sentence is the shared skill-availability family; today it is produced by the
  # absent member projection, which the marker records rather than hiding.
  fighters:
    first:
      collection: mordheim
      band_id: nipponese-expedition-web
      profile_id: hatamoto
      skill_ids: [skill.monster-slayer]
      main_weapon_id: weapon.sword
  expect_error: "skills are not available to nipponese-expedition-web/hatamoto: ['skill.monster-slayer']"

- audit_id: rule/mordheim/nipponese-expedition-web/band--nippon-special-skills/profile.skill-access
  id: the-same-skill-is-refused-for-a-band-henchman
  # The printed list is access for the heroes; this band's henchmen print no skill access at all
  # (profiles.yaml, ashigaru), so the same special skill is refused for them too.  The pair is the
  # recipient gate of the same printed sentence.
  fighters:
    first:
      collection: mordheim
      band_id: nipponese-expedition-web
      profile_id: ashigaru
      skill_ids: [skill.monster-slayer]
      main_weapon_id: weapon.sword
  expect_error: "skills are not available to nipponese-expedition-web/ashigaru: ['skill.monster-slayer']"

