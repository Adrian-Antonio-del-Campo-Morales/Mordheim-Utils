- audit_id: rule/mordheim/house-guard-sc/adjutant--relay-orders/mechanic.relay-orders
  id: the-supplied-adjutant-relays-the-commanders-leadership
  fighters:
    first: {collection: mordheim, band_id: house-guard-sc, profile_id: guards, main_weapon_id: weapon.mace, trait_overrides: {stupidity: true, house_guard_house: halcon}}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  initial_state:
    second: {attacks: 0}
  duel_context:
    first_id: first
    second_id: second
    charging: [first]
    active_participant: first
    distances: [[first, commander, 10], [first, adjutant, 4], [commander, adjutant, 5]]
    nearby:
      - participant_id: commander
        side_id: first
        condition: standing
        fighter: {collection: mordheim, band_id: house-guard-sc, profile_id: commander}
      - participant_id: adjutant
        side_id: first
        condition: standing
        fighter: {collection: mordheim, band_id: house-guard-sc, profile_id: adjutant}
  decisions:
    - {key: round.0.first.stupidity.leader.adjutant, value: true}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.stupidity.0, value: 4}
    - {key: round.0.first.stupidity.1, value: 4}
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
  expect_rounds:
    0: {state.first.stupidity_failed: false, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

