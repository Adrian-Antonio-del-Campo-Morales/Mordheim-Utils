# AUTHORED: 5 scenarios carry the printed two-hop relay onto the real route.  The recipient is the printed `guards` profile (Leadership 7); the supplied providers are the printed `commander` (its own rule commander--leader binds mechanic.leader-six, Leadership 8) and the printed `adjutant` (its own rule adjutant--relay-orders binds mechanic.relay-orders, Leadership 6), declared as same-side nearby participants with their own distance rows.  What separates the relay from a direct leader radius is those distances: the recipient stands 10 inches from the Commander - outside the six inches of the Commander's own Leader radius - and 4 inches from the supplied Adjutant, inside the printed six inches of the relay.  The visible consequence is the recipient's own Leadership test, a supplied stupidity test whose two declared dice are 4 and 4: the total of 8 passes with the borrowed Leadership 8 and fails with the recipient's own 7, so the anchor tape charges, passes and lands its attack while the identical total cancels the charge when (b) no Adjutant is supplied and the Commander alone sits beyond his radius, when (c) the supplied Adjutant stands 8 inches from the Commander, so the Adjutant cannot use his leader's Leadership and the relay offers nothing, and when (d) the recipient stands 10 inches from the supplied Adjutant, beyond the unwidened six.  Scenario (e) is the printed Battle Tongue upgrade: the supplied Adjutant carries the canonical academic skill `skill.battle-tongue` (catalog/skills/general.yaml, which the profile's own academic skill access admits) and the same recipient at 10 inches then passes with the leader's value.  Both printed halves are therefore represented.  The register's note records that the consumer performed only a single hop; the two-hop branch and the skill-widened radius are the wiring these tapes detect, and the Battle Tongue row itself is still scope NO / unimplemented in the catalogue, which is the second defect the widened tape detects.  The Adjutant's own value is never the tested one, which the distance rows keep visible.

