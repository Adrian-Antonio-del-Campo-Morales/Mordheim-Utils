#
# AUTHORED: 3 scenarios cover the printed "powerful bite attack ... uses the Priest's own strength
# to wound and receives no penalty for not using a weapon.  The bite attack always strikes last, regardless
# of who charged or which weapon is used.  The bite even attacks after double-handed weapons."  The bearer
# is the printed mutant-priest (Weapon Skill 4, Strength 3, Toughness 4, Wounds 1, Initiative 4, Attacks 1,
# Leadership 8), whose own profile rule binds compiler.strikes-last-bite.  The bite is keyed as the separate
# final pool round.<r>.<owner>.last-bite.attack.0.*, the label the authored sibling bite files and the
# engine's own unit tape use; a wrong label would fail on the pool name and that failure is the finding.
# REVIEWED still requires manual semantic review.

# --- Authored scenarios ---
# Derived from the printed rule, the recorded contract and the printed profile; no engine output was
# consulted.  The bearer attacks with the printed wooden club, so the printed Strength is the only modifier on both
# its own attack and the bite; the defender is hand-built and its single declared die is a natural one, a
# miss.  Every wound face stays below a natural six, so no critical die is part of this evidence.

- audit_id: rule/mordheim/shallows-beasts-mim/mutant-priest--bite-attack/compiler.strikes-last-bite
  id: the-bite-is-an-extra-attack-that-strikes-after-the-weapon-attacks
  fighters:
    first:
      collection: mordheim
      band_id: shallows-beasts-mim
      profile_id: mutant-priest
      # The band list prints Club/Mace/Staff as the club item; the mace catalogue id is
      # not on the printed list, so the same printed weapon is selected as weapon.club.
      main_weapon_id: weapon.club
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 2, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.0.first.last-bite.attack.0.hit, value: 4}
    - {key: round.0.first.last-bite.attack.0.wound, value: 4}
  expect_rounds:
    0: {state.second.wounds: 2, state.second.condition: STANDING}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

- audit_id: rule/mordheim/shallows-beasts-mim/mutant-priest--bite-attack/compiler.strikes-last-bite
  id: the-bite-uses-the-priests-own-strength-not-the-weapons-bonus
  fighters:
    first:
      collection: mordheim
      band_id: shallows-beasts-mim
      profile_id: mutant-priest
      main_weapon_id: weapon.double-handed-weapon
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 2, strength: 3, toughness: 4, wounds: 3, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.second.attack.0.hit, value: 1}
    - {key: round.0.first.attack.0.hit, value: 4}
    # The same face of three wounds with the double-handed weapon (S5 against T4, 3+)
    # and fails for the bite, which uses the priest's own S3 (5+): that contrast is the
    # printed "uses the Priest's own strength to wound".
    - {key: round.0.first.attack.0.wound, value: 3}
    - {key: round.0.first.last-bite.attack.0.hit, value: 4}
    - {key: round.0.first.last-bite.attack.0.wound, value: 3}
  expect_rounds:
    0: {state.second.wounds: 2, state.second.condition: STANDING}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

- audit_id: rule/mordheim/shallows-beasts-mim/mutant-priest--bite-attack/compiler.strikes-last-bite
  id: a-fighter-without-the-printed-rule-gains-no-bite
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 4, strength: 3, toughness: 4, wounds: 2, initiative: 4, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 2, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.wounds: 2, state.second.wounds: 3, state.second.condition: STANDING}
