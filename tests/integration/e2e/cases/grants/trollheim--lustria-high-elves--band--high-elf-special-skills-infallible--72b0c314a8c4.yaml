# Hardy Constitution: the recipient may ignore a critical hit on a 5 or more, and
# the wound then resolves normally.  The ignition roll is the grant's own die, so
# the unselected duel never requests it.
# Note: the comment block immediately above is the migration tail that describes
# the following per-ID file; it does not describe the scenarios below.
# --- Additional scenarios ---

# The reuse boundary: the second roll is accepted and never rerolled again, so
# a failed reroll ends the wound instead of asking for a third die.

