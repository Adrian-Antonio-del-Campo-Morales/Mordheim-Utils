# AUTHORED: 3 scenarios take both printed halves onto the real attack route:
# the declared five ignores the inflicted wound and leaves the bearer unhurt, the declared four does
# not and costs the wound, and a declared fire attack (the printed brazier-iron weapon, whose ignition
# die is declared below its threshold so the attack stays a fire hit) asks for no regeneration die at
# all - the printed "Boglars may not regenerate wounds caused by fire".  The bearer is the printed
# Boglars profile of this band, starts at two wounds and declares no attack of its own, so each tape
# holds only the attacker's dice.  The printed "whenever an enemy successfully inflicts a wound"
# trigger is the armour-then-special-save stage the contract names, so the die is declared after the
# wound and before the damage.  REVIEWED still requires manual semantic review.

