# --- Authored scenarios ---
# Derived from the printed sentence and this band's printed rule binding; no engine output was
# consulted.  The fanatic fixture carries no declared weapon, so its attack pool is pinned to one die
# by the initial state and the tape is one To Hit die per side.  Both dice miss, which keeps the round
# about the resolution order rather than about damage, and the strict tape makes the order itself the
# evidence: StrictDice rejects a roll the fixture never declared, and expect_events fixes the sequence.
#
# The trigger: the opponent charges and has the higher Initiative, so the ordinary order would give
# it the opening attack.
- audit_id: rule/mordheim/crooked-moon-kep/fanatics--frantic/mechanic.frantic
  id: the-frantic-fanatic-opens-the-round-against-a-charger-with-the-higher-initiative
  fighters:
    first: {collection: mordheim, band_id: crooked-moon-kep, profile_id: fanatics}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 5, attacks: 1}
  initial_state: {first: {attacks: 1}}
  duel_context: {charging: [second], active_participant: second}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: false, state.second.wounds: 3, state.second.condition: STANDING}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
  expect_events:
    - {kind: roll, key: round.0.first.attack.0.hit, sides: 6, value: 1}
    - {kind: roll, key: round.0.second.attack.0.hit, sides: 6, value: 1}

