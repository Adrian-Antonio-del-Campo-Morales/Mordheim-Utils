# A profile the printed sentence does not name keeps no bonus and is refused the rule itself, which
# is the closure of the recipient set; the diagnostic is the binding's own.
- audit_id: rule/mordheim/tileans/band--remasen-officer-leadership/profile.characteristics
  id: a-profile-outside-the-recipient-list-is-refused
  fighters:
    first:
      collection: mordheim
      band_id: tileans
      profile_id: warriors
      special_rule_ids: [band--remasen-officer-leadership]
  expect_error: "special rule is not available to tileans/warriors"

