#
# AUTHORED: 5 scenarios cover the three printed recipient sets (the Captain,
#   the Champions and the Youngbloods), the same Captain built without the rule as the contrast, and the refusal
#   of a profile the printed sentence does not name.  Each admission reads the recipient's compiled Leadership as
#   the duel's own initial characteristic: printed 8 becomes 9, printed 7 becomes 8 and printed 6 becomes 7, so
#   the raised point is supplied by the selected rule row and not by an unconditional profile value.  The closure
#   scenario uses the binding's own diagnostic ("special rule is not available to <band>/<profile>"), the same
#   shape the reviewed Middenheim and Lustria-Tileans grants use.

# --- Authored scenarios ---
# The printed sentence is "The Captain, Champions and Youngbloods in a Remasen warband have +1
# Leadership at all times", and the band attaches the row to its `remasens` variant
# (band.yaml: variants[remasens].rule_ids).  Each recipient is built from the band package with
# the printed row selected through special_rule_ids, and the supplied Leadership is read as the
# duel's own initial characteristic; the same build without the selection supplies the printed
# base value, which is the contrast.  Both duels are uncharged, so the only thing under test is
# the compiled characteristic; every declared die is a miss (the Captain has two attacks, so its
# tapes declare two hit dice).
- audit_id: rule/mordheim/tileans/band--remasen-officer-leadership/profile.characteristics
  id: the-remas-captain-is-supplied-leadership-nine
  fighters:
    first:
      collection: mordheim
      band_id: tileans
      profile_id: captain
      special_rule_ids: [band--remasen-officer-leadership]
    second:
      characteristics: &tilean-fixture {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: &tilean-uncharged {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.first.attack.1.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_fighters: {first.characteristics.leadership: 9}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# The same recipient without the printed rule: the printed Leadership 8 stands, so the ninth point
# is what the selected row supplies rather than an unconditional profile value.
- audit_id: rule/mordheim/tileans/band--remasen-officer-leadership/profile.characteristics
  id: the-unselected-captain-keeps-leadership-eight
  fighters:
    first:
      collection: mordheim
      band_id: tileans
      profile_id: captain
    second:
      characteristics: *tilean-fixture
  duel_context: *tilean-uncharged
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.first.attack.1.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_fighters: {first.characteristics.leadership: 8}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

