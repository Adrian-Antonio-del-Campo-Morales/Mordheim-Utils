# AUTHORED: 2 scenarios cover the printed consequence for the warrior charged by
#   Skeletons, which causes Fear: after a failed Leadership test its hit roll of 4 - a roll that
#   beats its ordinary target - wounds nothing, and after a passed test the same roll wounds it
#   on its ordinary target.  Toughness 3 and 1 wound(s) are read from the printed
#   profile, so the wound reaches the injury table and the printed band-1 result leaves the causer
#   knocked down; the corpus's established shape for a warrior knocked down by the attack it
#   takes declares no die for its own strike back, and this file follows it.
#   The opponent's Leadership 7, Weapon Skill 8 and Strength 8 are hand-built fixture facts, not
#   profile values.  The cancelled voluntary charge, the one-test-per-pairing rule and the listed
#   exceptions (an opponent that causes Fear, is immune to Psychology or Fear, or is Frenzied) are
#   not asserted here: the first is a charge-flag consequence rather than a wound outcome, and the
#   exceptions need a second Fear-causer or an immunity build this file does not declare.
#   REVIEWED still requires manual semantic review and execution_status stays UNEXECUTED; no
#   behavioral result is claimed.

# --- Authored scenarios ---
# Derived from the printed rule and the recorded semantic contract; no engine output was
# consulted.  The causer charges, so the opponent is the warrior the Fear clause tests and
# its two Leadership dice are declared first, summed against the Leadership 7 the fixture
# opponent declares.  The strict tape consumes exactly the declared dice, so a Fear test
# that never happens or a sixes-only clamp that never lifts both fail the case rather than
# passing quietly.

