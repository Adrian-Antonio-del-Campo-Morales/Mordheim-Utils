# The printed 5+ save at its threshold: an unmodified Strength 3 attacker applies no save modifier, so the
# scripted armour face is the printed target and the boundary is exactly 5.  The bearer is the band's own
# Gibbets (whose row binds mechanic.iron-cage) with supplied fixture characteristics so a single wound is
# not fatal; the attacker is a hand-built fixture.  Expectations come from the printed rule, never from
# engine output.

- audit_id: rule/mordheim/ghost-pirates-sar/gibbets--iron-cage/profile.equipment-restrictions
  id: the-intrinsic-cage-save-holds-on-five
  covers: [intrinsic-save]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 7}
    second:
      collection: mordheim
      band_id: ghost-pirates-sar
      profile_id: gibbets
      main_weapon_id: weapon.sword
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.fear.charge.0, value: 1}
    - {key: round.0.first.fear.charge.1, value: 1}
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.parry, value: 1}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.armour, value: 5}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.saved: true, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

