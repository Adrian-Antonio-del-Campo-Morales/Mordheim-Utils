# it.  Incorporeal takes a wounded Poltergeist out of action before Nightshade's wound
# rider resolves, so a suppressed Initiative penalty on that branch would not distinguish
# immunity.  The witness instead uses Black Lotus, whose automatic wound is resolved in
# the wound step before that branch: a natural six to hit with a wound die of one never
# wounds the immune bearer, while the same tape wounds a non-immune defender.  The bearer
# is the call-of-the-night-haint-mim/poltergeists profile that prints the rule, and the
# tape declares the bearer's own printed defence failing, so the hit reaches that step.
# The bearer keeps its printed single Wound and declares no attack; the clause is
# single-faceted, so no second scenario is required.

# The bearer also prints the band Ethereal rule, whose accepted per-profile grant is the
# 4+ unmodifiable save taken after the To Hit roll, so the tape declares that save failing
# immediately after the hit; the band-wide Ethereal entry itself is scope NO.
