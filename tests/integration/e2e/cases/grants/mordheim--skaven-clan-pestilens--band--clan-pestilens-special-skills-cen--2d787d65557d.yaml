# --- Authored scenarios ---
# Derived from the printed rule and the recorded contract; no engine output was consulted.  The Censer
# is the printed weapon the construction layer names for this hero and Black Hunger is the printed
# prerequisite, supplied as the canonical mechanic the band row binds.  Both fighters' attacks are
# pinned to zero so the tape carries no attack dice at all: the admission turns on the initial Frenzy
# state and on the unbeatable Black Hunger backlash, and the wound face stays below a natural six.

- audit_id: rule/mordheim/skaven-clan-pestilens/band--clan-pestilens-special-skills-censer-bearer/compiler.censer-bearer-loadout
  id: the-censer-bearer-with-black-hunger-starts-frenzied
  fighters:
    first:
      main_weapon_id: weapon.censer
      # Black Hunger is the printed prerequisite, selected as its own band rule: the
      # eligibility contract reads the loadout mechanics, not a bare skill id.
      special_rule_ids: [band--clan-pestilens-special-skills-black-hunger, band--clan-pestilens-special-skills-censer-bearer]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  initial_state: {first: {attacks: 0}, second: {attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    # Black Hunger's +1 Attack is doubled by the loadout's Frenzy, so the pinned pool
    # still carries two attacks; both are declared as misses.
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.first.attack.1.hit, value: 1}
    - {key: round.0.first.black-hunger.hits, sides: 3, value: 1}
    - {key: round.0.first.black-hunger.hit.0.wound, value: 4}
  expect_initial: {first.frenzy: true}
  expect_rounds:
    0: {state.first.wounds: 1, state.first.condition: STANDING, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

