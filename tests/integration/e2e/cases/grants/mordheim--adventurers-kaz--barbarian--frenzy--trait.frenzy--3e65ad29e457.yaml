  id: a-frenzied-barbarian-strikes-twice-with-its-single-profile-attack
  fighters:
    first:
      trait_overrides: {causes_fear: true}
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 1, attacks: 1, leadership: 7}
    second: {collection: mordheim, band_id: adventurers-kaz, profile_id: barbarian, main_weapon_id: weapon.morning-star}
  initial_state:
    second: {attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
