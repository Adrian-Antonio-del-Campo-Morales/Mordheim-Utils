# authoring_status: AUTHORED
# authoring_progress: the admitted frenzy clause carries 4 authored scenarios for the family model read
#   from the printed rule and the recorded semantic contract: the doubled attack count while the bearer
#   is frenzied, the skipped ordinary Fear test of a charge it receives, the auto-passed Stupidity test,
#   and the loss of Frenzy to the injury that knocks the bearer down.  The bearer is built from its
#   printed profile; its attack count and any supplied condition are declared as explicit state facts.
#   REVIEWED still requires manual semantic review and execution_status stays UNEXECUTED; no behavioral
#   result is claimed.
# execution_status: UNEXECUTED (this scaffold has no behavioral result)
#
# Derive inputs and expectations from rule text and accepted rulings.
# Do not derive them from the engine or execute combat during authoring.
# REVIEWED requires semantic review; covers labels alone are insufficient.
# Preserve audit_id when filling this file.
# Governing rulings: docs/decisions/design-rulings.md
#
# AUTHORED: 4 scenario(s) cover the clause.  The doubled count is declared by the dice the
#   round consumes: a first-round bearer whose supplied attack count is 1 strikes twice, and the third
#   recorded attack outcome exists only while that doubling holds.  The Fear face asserts the absence of
#   the round.0 fear dice a charge would otherwise demand against this charging opponent, together with
#   the unclamped state.second.fear_hit_sixes the skipped test leaves.  The Stupidity face asserts that
#   the printed Head Injury result that forces the test is auto-passed while frenzied, so no stupidity
#   die is consumed and stupidity_failed stays false.  The termination face wounds the bearer and reads
#   the cleared frenzy flag beside the KNOCKED_DOWN condition, then reads the second round: the bearer
#   stands up again and its frenzy is not regranted.  The compulsory spatial charge, the parry
#   prohibition the alias does not print and the Animosity subsystem are deliberately not asserted.

# --- Authored scenarios ---
# The barbarian carries a morning star in the doubling scenarios: a fighter with no weapon
# resolves as unarmed, and the printed unarmed cap of one attack would mask the
# profile's single Attack that Frenzy doubles. Equipping the profile's own weapon
# keeps the doubling observable without changing the profile or the rule. The morning
# star is on the profile's own Barbarian Equipment List.

