#
# AUTHORED: 2 scenarios cover the closure the recorded contract states - a natural six to hit
# always produces a wound and a failed To Wound roll cannot cancel it.  In the trigger the bearer's
# declared six to hit stands against a declared To Wound roll of two, which is below the printed
# Toughness 3 target, and the defender still loses a wound; in the control the same declared To Wound
# roll of two follows an ordinary hit of four and wounds nothing, so the wound in the trigger can
# only come from the printed six.  The defender is supplied three wounds, so the wound in the trigger
# leaves it standing and the case reads the lost wound rather than an Injury result.  The bearer is a hand-built Grave Guard fixture supplied the printed
# trait through the declared-facts channel (trait_overrides.wight_blades, which compiles the effect
# tag the wound step reads), and the defender's Toughness 3 and wounds are fixture facts.  The
# printed sentence allowing the To Wound roll to determine a critical hit is recorded, not asserted:
# a critical hit asks for the critical-table die whose outcome belongs to the core critical-hits
# cases, and the automatic-wound half is what this clause's closure names.  REVIEWED still requires
# manual semantic review.

# --- Authored scenarios ---
