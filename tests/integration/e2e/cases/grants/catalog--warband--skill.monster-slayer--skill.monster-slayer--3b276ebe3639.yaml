# fixture carries the canonical tag itself on a hand-built attacker (Weapon Skill 4, Strength 3,
# Attacks 1) whose opponent is the Toughness-6 boundary the specification names; the easier-target
# scenario lowers the opponent to Toughness 2, and the opponent's own strike is a declared natural 1.

