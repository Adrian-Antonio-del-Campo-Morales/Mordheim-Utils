# AUTHORED: 3 scenarios read the canonical clause on a hand-built attacker with the tag.
# Against the Toughness-6 boundary its Strength 3 normally needs 5+, so a declared wound roll of 4
# wounds with the tag and fails without it, which fixes the cap to the shared operator; against a
# Toughness-2 opponent a declared roll of 3 still wounds, so the printed retention of a naturally
# easier target is asserted too.  The register note records that the effective-Strength basis for
# the armour save is a separate printed variant, not a consequence of this clause, so no armour
# face is asserted here.  REVIEWED still requires manual semantic review.

# --- Authored scenarios ---
