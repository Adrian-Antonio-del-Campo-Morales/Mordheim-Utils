# --- Authored scenarios ---
# Family model (Thick Skull stun save, catalogue row): the catalogue skill row is not bound to a
# band, so the bearer is a hand-built fighter carrying the admitted skill identity, as the accepted
# mechanic-level scaffold does; its physical characteristics are supplied as fixture facts
# (WS3 S3 T3 W1 I2 A1) so the dice thresholds and the strike order are fixed, and its own attack pool
# is declared empty because a Stunned or Knocked Down bearer contributes no attack of its own.  Every
# expectation is read from the printed rule (3+ save, Stunned becomes Knocked Down, helmet improves
# the save to 2+ instead of the helmet's own rule) and the recorded parameters, never from engine
# output; the roll tape is derived statically and stays unexecuted.

# The printed 3+ save is taken on the injury chart's Stunned result and the three is the threshold
# face itself, so the Stunned outcome is converted to Knocked Down.
- audit_id: rule/catalog/warband/skill.thick-skull/skill.thick-skull
  id: the-printed-three-converts-the-stun
  covers: [stun-to-knocked-down-on-three]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      skill_ids: [skill.thick-skull]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 2, attacks: 1}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.injury.0, value: 4}
    - {key: round.0.first.attack.0.thick-skull, value: 3}
  expect_rounds:
    0: {state.second.wounds: 0, state.second.condition: KNOCKED_DOWN}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

