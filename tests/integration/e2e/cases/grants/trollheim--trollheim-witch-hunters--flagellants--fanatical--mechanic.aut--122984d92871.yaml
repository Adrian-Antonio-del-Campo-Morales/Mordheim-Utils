- audit_id: rule/trollheim/trollheim-witch-hunters/flagellants--fanatical/mechanic.automatic-leadership
  id: the-charged-flagellants-never-roll-a-fear-die
  covers: [automatic-leadership--scope--automatic-leadership]
  fighters:
    first:
      trait_overrides: {causes_fear: true}
      characteristics: {weapon_skill: 8, strength: 8, toughness: 3, wounds: 3, initiative: 7, attacks: 1, leadership: 7}
    second: {collection: trollheim, band_id: trollheim-witch-hunters, profile_id: flagellants}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.wounds: 3, state.first.condition: STANDING, state.second.wounds: 1, state.second.condition: STANDING, state.second.fear_hit_sixes: false}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

