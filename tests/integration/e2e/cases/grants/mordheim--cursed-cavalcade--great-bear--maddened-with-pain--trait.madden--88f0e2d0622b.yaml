# --- Authored scenarios ---
# Derived from the printed rule and the recorded contract; no engine output was consulted.  The
# bearer is a hand-built fixture carrying the printed trait, because the clause is about the wound the
# bearer suffers rather than about one printed statline.  Every strike is declared as a natural one, so
# only the pool sizes speak, and the bearer's two wounds mean one wound taken leaves it active.

- audit_id: rule/mordheim/cursed-cavalcade/great-bear--maddened-with-pain/trait.maddened-with-pain
  id: after-the-first-wound-the-bear-strikes-with-one-more-attack
  fighters:
    first:
      main_weapon_id: weapon.mace
      trait_overrides: {maddened_with_pain: true}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 2
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 4}
    - {key: round.0.second.attack.0.wound, value: 4}
    - {key: round.1.first.attack.0.hit, value: 1}
    - {key: round.1.first.attack.1.hit, value: 1}
    - {key: round.1.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.wounds: 1, state.second.wounds: 3}
    1: {state.first.wounds: 1, state.second.wounds: 3, state.second.condition: STANDING}
  expect_final: {rounds_executed: 2, termination_reason: horizon}

