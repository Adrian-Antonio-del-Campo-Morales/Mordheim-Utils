#
# AUTHORED: 3 scenarios cover the printed declaration and its two outcomes: a failed
# Leadership test (two declared sixes against the target's Leadership 6) entrances the target, which
# then may not attack and is struck by the Sleuth as a knocked-down target (the printed "treated as
# knocked down for the purpose of being attacked", so the To Hit die is not requested and only the To
# Wound die is), a passed test (two declared ones) leaves the target free and it attacks normally, and
# a declined declaration requests no Leadership test at all (neither die appears in the tape).  The
# bearer is the printed Private Sleuth profile that prints the rule and declares exactly one attack,
# and the opposing warrior's Weapon Skill, Strength, Toughness, Initiative and Leadership are
# hand-built fixture facts, not profile values.  Not asserted here: the printed "trance ends when the
# entranced warrior or the Sleuth has been attacked" when the trance ends because the SLEUTH was
# attacked (the Setup makes the Sleuth's own attack the one that consumes the trance), and the printed
# exclusion of Psychology-immune targets, which needs a second band profile this file does not
# declare.  REVIEWED still requires manual semantic review.

# --- Authored scenarios ---
# Derived from the printed rule, the recorded contract and the printed profile; no engine output was
# consulted.  The declaration is the printed option, and the trance state is the observable.
- audit_id: rule/mordheim/watchmen-mim/private-sleuth--hypnotist/mechanic.hypnotist
  id: a-failed-leadership-test-entrances-the-target
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 6}
    second:
      collection: mordheim
      band_id: watchmen-mim
      profile_id: private-sleuth
  initial_state: {second: {attacks: 1}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  decisions:
    - {key: round.0.second.hypnotist, value: true}
    - {key: round.0.second.attack.0.wound.scryer, value: false}
  rolls:
    - {key: round.0.second.hypnotist.0, value: 6}
    - {key: round.0.second.hypnotist.1, value: 6}
    - {key: round.0.second.attack.0.wound, value: 1}
  expect_rounds:
    0: {attacks.0.hit: true, attacks.0.knocked_down_target: true, attacks.0.wounded: false,
        state.first.wounds: 2, state.first.condition: STANDING, state.first.entranced: false}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

