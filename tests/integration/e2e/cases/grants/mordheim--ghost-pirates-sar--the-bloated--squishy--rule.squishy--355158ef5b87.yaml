# AUTHORED: 2 scenarios roll the same Stunned injury result against a bearer of No Pain, with and without Squishy, and observe the standing Stun against the downgrade.  The register records this band origin as carrying the shared operator (the applied ruling Q037 makes Squishy a suppression of the ignore-pain flag, which is why the same profile's No Pain row is deliberately not projected); the tapes therefore read the canonical operator through the fighter's grant list exactly as the mechanic origin's own case does.

# --- Authored scenarios ---
# The bearer carries No Pain, which would otherwise turn a Stunned injury result
# into Knocked Down.  Squishy suppresses that flag, so the printed Stunned result
# stands; the Stunned bearer is struck before its Initiative step, so the tape holds
# no attack of its own.
- audit_id: rule/mordheim/ghost-pirates-sar/the-bloated--squishy/rule.squishy
  id: no-pain-cannot-quiet-the-stun-under-squishy
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      skill_ids: [skill.ignore-pain, rule.squishy]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.injury.0, value: 3}
  expect_rounds:
    0: {state.second.condition: STUNNED, state.second.wounds: 0}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# The identical duel and tape without Squishy: No Pain acts on the same Stunned
# result and downgrades it, which isolates the printed override to Squishy.
