# --- Authored scenarios ---
# The printed incompatibility, asserted through the shared eligibility stage's own literal refusal
# for this pair of rule ids.  Both printed skills are declared because the guard reads the build's
# declared `special_rule_ids`; Frustratingly Tiny is declared first, so the pair sentence is raised in
# that row's `prerequisites` stage before the sibling's own runtime gate is reached.
- audit_id: rule/mordheim/snotlings-web/bigsnotz--big-bully/profile.skill-access
  id: a-bigsnot-carrying-both-printed-skills-is-refused
  fighters:
    first:
      collection: mordheim
      band_id: snotlings-web
      profile_id: bigsnotz
      special_rule_ids: [bullied-goblin--frustratingly-tiny, bigsnotz--big-bully]
  expect_error: Frustratingly Tiny cannot be combined with Big Bully

# Accepted control: the same printed bearer declaring neither skill of the pair constructs and fights,
# so the refusal above belongs to the declared pairing and is not a blanket rejection of the profile or
# of the Frustratingly Tiny row.  The sibling id cannot serve as a lone control: its KB row records
# `grant: profile` with `implemented: NO`, so declaring it alone is refused as outside the executable
# duel runtime before any effect.  The scenario keeps its original collected id; the build it
# declares carries neither skill of the pair, which is what the comment above states.
- audit_id: rule/mordheim/snotlings-web/bigsnotz--big-bully/profile.skill-access
  id: the-bigsnot-with-big-bully-alone-constructs-and-fights
  fighters:
    first:
      collection: mordheim
      band_id: snotlings-web
      profile_id: bigsnotz
      main_weapon_id: weapon.sword
