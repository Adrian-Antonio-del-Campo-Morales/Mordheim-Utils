# --- Authored scenarios ---
# The bearer is the band's Mourngul profile, which prints the Ethereal rule through its own rule
# grant; the fixture's characteristics are hand-built facts (the profile is never read for them
# here) and the bearer contributes no attacks, so the incoming mace swing is the only one.
#
# The Mourngul's Haunter of the Dark improves the Ethereal save to 3+, so the save holds on the
# printed 3 and no wound die follows: the save intercepts the hit.
