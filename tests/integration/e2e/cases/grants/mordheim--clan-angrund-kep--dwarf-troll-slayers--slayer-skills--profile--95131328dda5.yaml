# --- Authored scenarios ---
# Derived from the printed rule, the recorded semantic contract and this band's own Slayer Skills
# binding; no engine output was consulted.  Both fighters are given zero attacks so the round
# resolves without dice and the observation is about admission, not about the skill's mechanics.

- audit_id: rule/mordheim/clan-angrund-kep/dwarf-troll-slayers--slayer-skills/profile.skill-access
  id: a-printed-slayer-skill-is-admitted-to-the-recipient
  fighters:
    first:
      collection: mordheim
      band_id: clan-angrund-kep
      profile_id: dwarf-troll-slayers
      skill_ids: [skill.ferocious-charge]
      main_weapon_id: weapon.mace
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  initial_state: {first: {attacks: 0}, second: {attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  # Both fighters print the same Initiative, so the order is decided by the tie die before the
  # (empty) attack pools; the observation stays the admitted skill selection.
  rolls:
    - {key: round.0.priority-tie, value: 3}
  expect_final: {rounds_executed: 1}

- audit_id: rule/mordheim/clan-angrund-kep/dwarf-troll-slayers--slayer-skills/profile.skill-access
  id: a-special-skill-outside-the-bands-tables-is-refused
  fighters:
    first:
      collection: mordheim
      band_id: clan-angrund-kep
      profile_id: dwarf-troll-slayers
      skill_ids: [skill.miniath]
      main_weapon_id: weapon.mace
  expect_error: "skills are not available to clan-angrund-kep/dwarf-troll-slayers: ['skill.miniath']"
