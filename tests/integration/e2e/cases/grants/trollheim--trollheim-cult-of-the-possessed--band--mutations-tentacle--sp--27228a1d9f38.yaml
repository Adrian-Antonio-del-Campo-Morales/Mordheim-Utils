# --- Authored scenarios ---
# "In close combat, the model may reduce one opponent's Attacks by 1, to a minimum of 1":
# the opponent is built with two attacks, so the declared tape separates a reduced pool (one
# attack die) from the unreduced one (two attack dice).  The bearer is the printed recipient.
- audit_id: rule/trollheim/trollheim-cult-of-the-possessed/band--mutations-tentacle/special-rule.band--mutations-tentacle
  id: the-opponent-loses-one-attack-against-the-bearer
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 2}
    second:
      collection: trollheim
      band_id: trollheim-cult-of-the-possessed
      profile_id: mutants
      special_rule_ids: [band--mutations-tentacle]
      main_weapon_id: weapon.mace
  duel_context: &uncharged {charging: [], active_participant: first}
  maximum_rounds: 1
  # The bearer nominates which of the attacker's allocated attacks is lost.
  decisions:
    - {key: round.0.first.grapple-lost-attack.0, value: true}
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: false, attacks.1.hit: false, state.first.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

# Without the mutation the same attacker keeps both printed attacks, so the missing die is the
# mutation's own contribution and not a property of the attacker's profile.
