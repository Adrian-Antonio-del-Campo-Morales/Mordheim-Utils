# --- Authored scenarios ---
# The Undead attacker has two Attacks and the defender carries the Sign, so the first round
# reduces its pool to one: the tape declares that single attack die, and an unreduced pool
# would have requested the second one.
- audit_id: rule/mordheim/sisters-of-sigmar/band--special-skills-sign-of-sigmar/skill.sigmar-s-sign
  id: the-undead-attacker-loses-one-attack-in-the-first-round
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [skill.sigmar-s-sign]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 3, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      trait_overrides: {creature_kind: undead}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 2}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 1}
    - {key: round.0.second.attack.0.hit, value: 4}
    - {key: round.0.second.attack.0.wound, value: 4}
  expect_rounds:
    0: {attacks.0.hit: False, attacks.1.wounded: True, state.first.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
