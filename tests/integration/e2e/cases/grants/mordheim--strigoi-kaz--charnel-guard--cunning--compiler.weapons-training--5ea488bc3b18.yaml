- audit_id: rule/mordheim/strigoi-kaz/charnel-guard--cunning/compiler.weapons-training-exception
  id: the-trained-charnel-guard-may-use-a-weapon-outside-its-ordinary-allowance
  # The printed permission is the required behaviour: a Charnel Guard that has taken Weapons Training may
  # use weapons outside its ordinary allowance, so the build must compile and the engagement must start.
  # Its recorded ordinary allowance is the bones it fights with, and the profile's unconditional
  # equipment ban is what the printed sentence carves the exception into; the expectation is deliberately
  # NOT that ban's refusal.
  fighters:
    first:
      collection: mordheim
      band_id: strigoi-kaz
      profile_id: charnel-guard
      skill_ids: [skill.weapons-training]
      main_weapon_id: weapon.mace
    second:
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  initial_state: {first: {attacks: 0}, second: {attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  expect_initial: {first.attacks: 0, second.attacks: 0}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
