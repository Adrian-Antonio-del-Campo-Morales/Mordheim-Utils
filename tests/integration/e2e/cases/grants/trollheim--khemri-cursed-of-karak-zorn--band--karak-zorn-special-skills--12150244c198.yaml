# AUTHORED: 5 scenarios cover the printed chart (1-3 Knocked Down, 4-5 Stunned, 6 Out of Action): an
# injury total of 5 leaves the bearer Stunned where the ordinary table takes the same total Out of Action, a
# total of 3 leaves it Knocked Down where the ordinary table merely Stuns, a total of 6 still takes the
