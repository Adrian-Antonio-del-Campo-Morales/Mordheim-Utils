# total of 4 is Stunned on both tables, so it does not discriminate and is not used.

# --- Authored scenarios ---
# Derived from the printed sentence and the recorded chart parameters (1-3 knocked down, 4-5 stunned, 6 out
# of action); no engine output was consulted.  The bearer starts the duel at one wound and the attacker's
# plain mace adds no injury modifier, so the declared injury die is the injury total itself; the attacker's
# higher Initiative and the uncharged context let it strike first, and the bearer declares no attack of its
# own because every scenario leaves it Stunned, Knocked Down or Out of Action in this round.
