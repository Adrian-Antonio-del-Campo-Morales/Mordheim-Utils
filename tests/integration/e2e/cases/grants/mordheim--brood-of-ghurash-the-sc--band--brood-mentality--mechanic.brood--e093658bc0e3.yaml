- audit_id: rule/mordheim/brood-of-ghurash-the-sc/band--brood-mentality/mechanic.brood-mentality
  id: the-supplied-bonus-carries-the-stupidity-test
  covers: [brood-mentality--scope--stupidity]
  fighters:
    first:
      main_weapon_id: weapon.mace
      skill_ids: [mechanic.brood-mentality]
      trait_overrides: {stupidity: true, stupidity_leadership_bonus: 1}
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1, leadership: 6}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 6}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.stupidity.0, value: 6}
