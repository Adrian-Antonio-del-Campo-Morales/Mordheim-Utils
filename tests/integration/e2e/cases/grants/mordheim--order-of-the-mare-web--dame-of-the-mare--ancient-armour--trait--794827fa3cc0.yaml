# Clause: five-plus-unmodifiable-save (scope: YES)
# AUTHORED[five-plus-unmodifiable-save]: 3 scenarios show the printed save in the armour phase: the mace's
#   Strength 3 face leaves the printed threshold unmodified, so a die at the threshold is saved
#   and a die one face below it is not.  The clauses the file also admits are evidenced by their own scenario.  REVIEWED still requires manual semantic review and
#   execution_status stays UNEXECUTED.
# The negation clause is evidenced by a magical attacker: no save face is
# requested and the wound is taken.
#
# Clause: negated-by-magical-attacks (scope: YES)
# AUTHORED[negated-by-magical-attacks]: the printed exception is authored below on the real route:
#   the attacker declares the canonical magical device `trait_overrides: {magical_attacks: true}` -
#   the same device the canonical ethereal, gypsy-ward and magical-void tapes use - so no armour die
#   is requested for the bearer's unmodifiable 5+ save and the unsaved wound is taken.  The ordinary
#   contrast is the clause above, where the same declared dice do request the armour face.  The
#   2026-10-10 closing note that claimed no scenario was authorable is superseded: the device already
#   existed and only the declaration was missing.
#
