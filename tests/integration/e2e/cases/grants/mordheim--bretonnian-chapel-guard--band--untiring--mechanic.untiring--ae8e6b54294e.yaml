  id: the-strength-five-attacker-cannot-worsen-the-floor
  covers: [save-floor]
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 5, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      armour_id: armour.heavy-armour
      skill_ids: [mechanic.untiring]
