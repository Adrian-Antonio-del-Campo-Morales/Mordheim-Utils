# Hardened Skin: for the Saurus recipient the Injury chart takes the warrior Out
# of Action only on a 6 or more, so a five is a Stunned result where an
# unmodified five would end the fight.  The Saurus carries a 5+ save and the
# attacker's dagger grants its target a further +1, so the scripted armour roll
# of one is the one that fails.
# Note: the comment block immediately above is the migration tail that describes
# the following per-ID file; it does not describe the scenarios below.
# --- Additional scenarios ---

# The printed exception names a spear or a similar weapon.  The same
# strike-first bearer is compared against an unmodified faster spearman, whose
# own first-round weapon priority is 1: the bearer's tier still resolves first,
# and the unselected twin below loses the same duel.

