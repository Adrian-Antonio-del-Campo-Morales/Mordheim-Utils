# --- Authored scenarios ---
# The canonical general skill list defines the shared mighty-blow operator, so
# the Strength bonus and the printed pistol carve-out are evidenced here.
- audit_id: rule/catalog/general/skill.mighty-blow/skill.mighty-blow
  id: the-skill-raises-the-wound-roll
  fighters:
    first:
      skill_ids: [skill.mighty-blow]
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 3}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# The same dice without the skill: Strength 3 against Toughness 3 needs a four.
- audit_id: rule/catalog/general/skill.mighty-blow/skill.mighty-blow
  id: the-unskilled-bearer-misses-the-same-wound-face
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 3}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.damage: 0, state.second.wounds: 2}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# The printed exclusion: a pistol attack resolves at its own fixed Strength 4, so
# the global +1 never reaches it.  Against Toughness 6 that fixed Strength needs a
# six, so the roll of five leaves the wound unrolled even though this bearer is
# Strength 5 and carries the skill.
- audit_id: rule/catalog/general/skill.mighty-blow/skill.mighty-blow
  id: a-pistol-attack-receives-no-bonus
  fighters:
    first:
      skill_ids: [skill.mighty-blow]
      main_weapon_id: weapon.pistol
      characteristics: {weapon_skill: 3, strength: 5, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 6, wounds: 3, initiative: 2, attacks: 1}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 5}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {attacks.0.hit: True, attacks.0.wounded: False, attacks.0.damage: 0, state.second.wounds: 3}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
# The same Strength 5 bearer with a close-combat weapon: the skill's +1 raises the
# mace attack to Strength 6, and the identical roll of five now wounds Toughness 6,
# which isolates the pistol exclusion to the printed carve-out rather than to the
# defender.
- audit_id: rule/catalog/general/skill.mighty-blow/skill.mighty-blow
  id: the-same-bearer-s-close-combat-attack-takes-the-bonus
  fighters:
