# Derived from the printed rule ("The Hero may make attacks with its teeth instead of its
# weapons; resolve them as Saurus Bite Attacks.  These attacks give the target +1 to its
# armour save regardless of the Skink's Strength and gain +1 on the Injury roll") and the
# recorded contract (recipient: skink heroes, replaces weapon attacks, target save +1,
# injury +1).  The bearer is the printed recipient - a Skink Priest, which carries no extra
# bite attack of its own - and the mark is selected through the band rule.  Each trigger is
# paired with the same build without the mark, so the paired tape shows the mark is what
# moves the term.  The printed cost and the recruitment-only timing are acquisition data
# outside the duel and are not asserted.

