# --- Authored scenarios ---
# The warband skill list prints the canonical knife-fighting wording: while using a
# Dagger or Yambiya the bearer gains +1 WS and +1 on the Injury roll, with the
# weapon's normal armour-save modifier untouched. The dagger therefore offers the
# unarmoured target its 6+ save, which must be taped (a 1 fails it) before the
# injury roll.
- audit_id: rule/catalog/warband/skill.knife-fighting/skill.knife-fighting
  id: the-dagger-adds-one-to-the-injury-roll
  fighters:
    first:
      main_weapon_id: weapon.dagger
      skill_ids: [skill.knife-fighting]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 2, attacks: 1}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.armour, value: 1}
    - {key: round.0.first.attack.0.injury.0, value: 2}
  expect_rounds:
    0: {attacks.0.damage: 1, state.second.condition: STUNNED}
  expect_final: {rounds_executed: 1, termination_reason: horizon}
