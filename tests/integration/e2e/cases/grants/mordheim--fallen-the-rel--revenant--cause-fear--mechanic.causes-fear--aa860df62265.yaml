# --- Authored scenarios ---
# Derived from the printed rule and the recorded semantic contract; no engine output was
# consulted.  The causer is the active participant and charges, so the opponent is the
# warrior the Fear clause tests, and its two Leadership dice are declared first, summed
# against the Leadership 7 the fixture opponent declares.  The opponent's Weapon Skill 8
# and Strength 8 are fixture facts chosen so its hit roll of 4 beats its ordinary target and
# its Strength wounds every Toughness in this band; the strict tape consumes exactly the
# declared dice, so a Fear test that never happens or a sixes-only clamp that never lifts
# both fail the case rather than passing quietly.

