# AUTHORED: 2 scenarios cover the printed consequence for the warrior charged by
#   Revenant, which causes Fear: after a failed Leadership test its hit roll of 4 - a roll that
#   beats its ordinary target - wounds nothing, and after a passed test the same roll wounds it
#   on its ordinary target, against Toughness 4 and 2 wounds taken from the
#   profile as printed.  The unarmed causer's own single attack is scripted as a natural 1, and
#   the opponent's Leadership, Weapon Skill 8 and Strength 8 are hand-built fixture facts, not
#   profile values.  The cancelled voluntary charge, the one-test-per-pairing rule and the
#   listed exceptions (an opponent that causes Fear, is immune to Psychology or Fear, or is
#   Frenzied) are not asserted here: the first is a charge-flag consequence rather than a wound
#   outcome, and the exceptions need a second Fear-causer or an immunity build this file does
