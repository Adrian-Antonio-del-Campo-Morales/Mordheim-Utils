# AUTHORED: 3 scenarios read the printed "Morr Worshippers may borrow the Dreamer's Leadership within 12 inches instead of the normal 6": the provider is the printed Dreamer profile (Leadership 8) supplied as an admitted nearby participant of the borrower's own side, the borrower is the printed Morr Worshwishpers profile (Leadership 7), and the test it takes is the Fear test of the charge it receives.  At a supplied twelve inches the borrow is offered and, taken, carries a declared total of eight, so the charge's hits are not clamped; declined, or offered at twelve and a half inches, the same eight fails against the borrower's own 7 and the hits are clamped to sixes.  The printed bearer restriction (only the Dreamer may take this skill) and the canonical six-inch case are recorded here, not asserted.  The recorded implementation gap is the source-qualified range: resolve_local_leadership rejects a distance greater than six before offering the borrow, so the twelve-inch acceptance is the printed expectation this file states, not an implemented behaviour.  REVIEWED still requires manual semantic review.

