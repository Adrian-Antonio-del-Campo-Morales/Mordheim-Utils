# --- Authored scenarios ---
# Derived from the printed sentence and the recorded contract; no engine output was consulted.  The
# bearer prints the rule and contributes no attacks of its own, so round 0 carries only the
# attacker's dice.  The bearer's Ethereal intercepts a non-magical blow on a 4+, so the tape declares
# that die first, one face below its threshold, and only then the wound roll.  The blow is an
# ordinary mace: at Weapon Skill 10 against this bearer's printed Weapon Skill it needs a 3, and
# Strength 8 against Toughness 3 needs a 2, so the declared 5 and 5 both pass.  Five is deliberately
# below a natural six, which would be a critical hit and add a further critical die.  After the wound
# roll the tape declares nothing: an injury die requested here would fail the fixture, so the two
# scenarios prove the printed 'do not roll for injury' rather than assume it.

- audit_id: rule/mordheim/call-of-the-night-haint-mim/poltergeists--incorporeal/trait.injury-profile
  id: the-first-wound-takes-the-poltergeist-out-without-an-injury-roll
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 10, strength: 8, toughness: 3, wounds: 3, initiative: 10, attacks: 1}
    second: {collection: mordheim, band_id: call-of-the-night-haint-mim, profile_id: poltergeists}
  initial_state: {second: {wounds: 1, attacks: 0}}
  duel_context: {charging: [], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 5}
    - {key: round.0.first.attack.0.ethereal, value: 3}
    - {key: round.0.first.attack.0.wound, value: 5}
  expect_rounds:
    0: {attacks.0.wounded: True, state.second.condition: OUT}
  expect_final: {rounds_executed: 1, termination_reason: second_out}

