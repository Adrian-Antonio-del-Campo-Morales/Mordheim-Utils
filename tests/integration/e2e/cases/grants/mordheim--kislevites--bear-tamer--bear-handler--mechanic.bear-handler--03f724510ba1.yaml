# --- Authored scenarios ---
# Derived from the printed rule and the recorded contract; no engine output was consulted.  The
# bearer is the printed Trained Bear profile, the stupidity it is subject to is supplied as the
# fixture condition the rule speaks about, and the handler is supplied as a value, never simulated.

- audit_id: rule/mordheim/kislevites/bear-tamer--bear-handler/mechanic.bear-handler
  id: the-supplied-bear-tamers-leadership-carries-the-bears-stupidity-test
  covers: [handler-leadership--scope--stupidity-waiver]
  fighters:
    first:
      collection: mordheim
      band_id: kislevites
      profile_id: trained-bear
      trait_overrides: {stupidity: true, stupidity_leadership: 7}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 2, attacks: 1, leadership: 7}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.stupidity.0, value: 3}
    - {key: round.0.first.stupidity.1, value: 4}
    # The printed Fearsome bear makes the charged opponent take its own Fear test.
    - {key: round.0.second.fear.charged.0, value: 1}
    - {key: round.0.second.fear.charged.1, value: 1}
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.1.hit, value: 1}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.second.attack.0.hit, value: 1}
  expect_rounds:
    0: {state.first.stupidity_failed: false, attacks.0.damage: 1, state.second.wounds: 1}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

