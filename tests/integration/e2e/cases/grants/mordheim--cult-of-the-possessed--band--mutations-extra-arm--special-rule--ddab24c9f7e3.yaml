  fighters:
    first:
      collection: mordheim
      band_id: cult-of-the-possessed
      profile_id: mutants
      special_rule_ids: [band--mutations-extra-arm]
      main_weapon_id: weapon.mace
      extra_hand_id: weapon.sword
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 2, wounds: 3, initiative: 2, attacks: 1}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
