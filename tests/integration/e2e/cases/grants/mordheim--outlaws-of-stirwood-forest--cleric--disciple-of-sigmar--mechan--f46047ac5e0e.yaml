# --- Authored scenarios ---
# Derived from the printed sentence and the recorded contract; no engine output was consulted.  The
# prohibition is a construction fact, so the trigger is the Cleric's own magic-skill selection; the
# message quoted below is the one _eligibility.js emits for compiler.disciple-of-sigmar over the
# unfiltered list of the bearer's arcane/sorcery skills.
- audit_id: rule/mordheim/outlaws-of-stirwood-forest/cleric--disciple-of-sigmar/mechanic.disciple-of-sigmar
  id: the-cleric-may-not-learn-sorcery
  fighters:
    first:
      collection: mordheim
      band_id: outlaws-of-stirwood-forest
      profile_id: cleric
      skill_ids: [skill.sorcery]
  expect_error: "sorcery and Arcane Lore are forbidden for outlaws-of-stirwood-forest/cleric: ['skill.sorcery']"

