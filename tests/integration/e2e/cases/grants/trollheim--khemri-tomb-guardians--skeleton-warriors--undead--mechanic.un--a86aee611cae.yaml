#   no charge test at all, and the identical setup with a hand-built non-immune warrior does request
#   it and is halted by it.  Ignore pain: an Injury-chart Stunned result leaves the bearer Knocked
#   Down.  Poison immunity: a Nightshade-coated wound keeps its wound and loses its Initiative
