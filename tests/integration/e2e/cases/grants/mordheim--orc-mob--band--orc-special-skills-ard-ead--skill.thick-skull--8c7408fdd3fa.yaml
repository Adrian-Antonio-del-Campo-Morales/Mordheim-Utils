#
# AUTHORED: 4 scenario(s) cover the clause: the printed 3+ save converts a Stunned result
# on 3 and leaves it on 2; the helmet raises the same save to 2, and a failure on 1 leaves the
# bearer Stunned with the helmet's own reaction absent from the tape.  The printed greenskin Word
# 'Ard Ead binds the same operator as the dwarf Thick Skull records.

# --- Authored scenarios ---
# Family model ('Ard Ead / Thick Skull stun save): the bearer is the printed recipient of this band
# record, built from its own band and profile and selecting the band rule row named in the audit id,
# so the granted effect is what the scenario exercises.  Its physical characteristics are supplied
# as fixture facts (WS3 S3 T3 W1 I2 A1) so the dice thresholds and the strike order are fixed, while
# its printed Leadership stays in place; the bearer's own attack pool is declared empty because a
# Stunned or Knocked Down bearer contributes no attack of its own.  Every expectation is read from
# the printed rule (3+ save, Stunned becomes Knocked Down, helmet improves the save to 2+ instead of
# the helmet's own rule) and the recorded parameters, never from engine output; the roll tape is
# derived statically and stays unexecuted.

# The bearer's printed 3+ save is taken on the injury chart's Stunned result and the three is the
# threshold face itself, so the Stunned outcome is converted to Knocked Down.
- audit_id: rule/mordheim/orc-mob/band--orc-special-skills-ard-ead/skill.thick-skull
  id: the-printed-three-converts-the-stun
  fighters:
    first:
      main_weapon_id: weapon.mace
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 2, initiative: 5, attacks: 1}
    second:
      collection: mordheim
      band_id: orc-mob
      profile_id: orc-boss
      special_rule_ids: [band--orc-special-skills-ard-ead]
      characteristics: {weapon_skill: 3, strength: 3, toughness: 3, wounds: 1, initiative: 2, attacks: 1}
  initial_state: {second: {attacks: 0}}
  duel_context: {charging: [first], active_participant: first}
  maximum_rounds: 1
  rolls:
    - {key: round.0.first.attack.0.hit, value: 4}
    - {key: round.0.first.attack.0.wound, value: 4}
    - {key: round.0.first.attack.0.injury.0, value: 4}
    # The stun reaction is a sub-roll of the attack, not of the injury die: the
    # shared contract keys it as `<attack>.thick-skull` (as the black-orc and
    # catalogue Thick Skull tapes do), so it follows the injury result directly.
    - {key: round.0.first.attack.0.thick-skull, value: 3}
  expect_rounds:
    0: {state.second.wounds: 0, state.second.condition: KNOCKED_DOWN}
  expect_final: {rounds_executed: 1, termination_reason: horizon}

