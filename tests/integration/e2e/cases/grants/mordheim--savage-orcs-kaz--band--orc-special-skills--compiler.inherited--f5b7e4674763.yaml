# authoring_progress: both halves of the admitted clause carry an authored scenario: the Savage Orc
#   Boss that selects an inherited Orc special skill is built and the duel runs, and a special skill
#   outside the inherited table is refused with the shared access diagnostic.  The member used for
#   the admission is Thick Skull, the identity the referenced Orc rule Ard Ead binds.  REVIEWED still
