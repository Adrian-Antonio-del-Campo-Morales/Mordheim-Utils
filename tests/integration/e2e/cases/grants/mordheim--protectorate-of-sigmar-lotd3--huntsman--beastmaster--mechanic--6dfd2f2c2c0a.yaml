#
# AUTHORED: 2 scenarios cover the printed substitution: with the Huntsman's own
# value supplied the animal tests 8 against it and the charge and its attack stand, while without a
# supplied value the same 8 is tested against the animal's own Leadership 3 and fails, so the charge
# is cancelled and no attack is resolved.  The animal's own Leadership 3 is a fixture fact and the
# supplied handler value 8 is the supplied projection the effect's record names
# (leadership.resolve_local_leadership reads `stupidity_leadership` and blocks leader borrowing for
# handler-only warriors).  The printed 6-inch range of the Huntsman and the second printed sentence
# (a hostile beast must pass a Leadership test to charge the Huntsman) are not asserted: the range is
# a caller-supplied fact the executor does not model, and the charge-denial sentence is a separate
# consequence with no consumer in this vocabulary.  REVIEWED still requires manual semantic review.

