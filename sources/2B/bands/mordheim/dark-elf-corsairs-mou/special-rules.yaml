  name: Leader (Captain)
  effect: >-
    Any warrior within 6" of the Captain may use his Leadership value when taking Leadership tests.
  source:
    manual: broheim.net
    printed_page: 3
    section: Heroes / 1 Captain / Special Rules
    url: https://broheim.net/downloads/warbands/supplement/mousillon/Dark%20Elf%20Corsairs.pdf
  name_i18n:
    es: Líder (Capitán)
  effect_i18n:
    es: >-
      Cualquier guerrero a 6" o menos del Capitán puede usar su valor de Liderazgo cuando realice
      tiradas de Liderazgo.
  applies_to:
    profile_ids:
    - captain
