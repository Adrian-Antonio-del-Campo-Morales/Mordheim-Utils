schema_version: 2
band_id: dark-elf-corsairs-mou
rules:
- id: band--corsair-special-skills
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.dark-elf-corsairs-mou.band.corsair-special-skills
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Corsair Special Skills
  effect: >-
    Dark Elf Corsairs with the Special Skills available to them may choose to use the following
    Skill list instead of any of the standard Skill tables available to them. Fey Quickness: the
    Dark Elf has inhuman agility and as such can avoid melee or missile attacks on a roll of 6; this
    save can be combined with Dodge or Step aside for a 4+ save in the relevant area. Furious
    charge: the Dark Elf feels invincible; he adds one attack when he charges. Excellent Sight: by
    training his eyesight for years the Dark Elf can spot hidden enemy models up to twice as far
    away as normal warriors. Looting: once per battle you may try to loot a KD/ST character;
    determine at random which item he takes (daggers do not count). Infiltration: the Dark Elf is an
    expert in infiltrating behind enemy lines; therefore he is always deployed last, anywhere out of
    sight of the enemy; if both players have infiltrate, roll 1d6 - lowest roll deploys first.
  source:
    manual: broheim.net
    printed_page: 2
    section: Corsair Special Skills
    url: https://broheim.net/downloads/warbands/supplement/mousillon/Dark%20Elf%20Corsairs.pdf
  name_i18n:
    es: Habilidades Especiales de Corsario
  effect_i18n:
    es: >-
      Los Corsarios Elfos Oscuros con acceso a Habilidades Especiales pueden elegir usar la
      siguiente lista en lugar de cualquiera de las tablas de habilidades estándar disponibles.
      Celeridad Feérica: el Elfo Oscuro tiene una agilidad inhumana y puede evitar ataques cuerpo a
      cuerpo o de proyectiles con una tirada de 6; esta salvación puede combinarse con Esquiva o
      Apartar el golpe para una salvación de 4+ en el ámbito correspondiente. Carga Furiosa: el Elfo
      Oscuro se siente invencible; añade un ataque cuando carga. Vista Excelente: tras años de
      entrenar su vista, el Elfo Oscuro puede descubrir modelos enemigos ocultos hasta al doble de
      distancia que los guerreros normales. Saqueo: una vez por batalla puedes intentar saquear a un
      personaje derribado/aturdido; determina al azar qué objeto toma (las dagas no cuentan).
      Infiltración: el Elfo Oscuro es un experto en infiltrarse tras las líneas enemigas; por eso
      siempre se despliega el último, en cualquier punto fuera de la vista del enemigo; si ambos
      jugadores tienen infiltración, tira 1D6: el resultado más bajo despliega primero.
  applies_to:
    band: true
- id: captain--leader
  runtime:
    scope: 'NO'
    implemented: 'NO'
