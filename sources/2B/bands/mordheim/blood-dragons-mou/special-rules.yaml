  name: Summoner
  effect: >-
    All the undead in the Warband were summoned by the arcane powers of the vampire. When the
    Vampire goes out of action, roll each round a Ld test for every undead model in the warband. If
    the roll is missed, the model also goes out of action.
  source:
    manual: Broheim
    printed_page: 4
    section: Heroes / 1 Vampire / Special Rules
    url: https://broheim.net/downloads/warbands/supplement/mousillon/Blood%20Dragons.pdf
  name_i18n:
    es: Invocador
  effect_i18n:
    es: >-
      Todos los no muertos de la banda fueron invocados por los poderes arcanos del vampiro. Cuando
      el Vampiro queda fuera de combate, tira cada ronda una prueba de Ld por cada modelo no muerto
      de la banda. Si la tirada falla, el modelo también queda fuera de combate.
  applies_to:
