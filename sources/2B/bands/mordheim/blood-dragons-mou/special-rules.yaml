      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Balance Warning (Blood Dragons)
  effect: >-
    As they are, the Blood Dragons are far too powerful and end up dominating any campaign. The
    authors suggest either not using the Blood Dragon Warband or limiting the bloodline abilities to
    1 per vampire.
  source:
    manual: Broheim
    printed_page: 1
    section: Warning
    url: https://broheim.net/downloads/warbands/supplement/mousillon/Blood%20Dragons.pdf
  name_i18n:
    es: Aviso de balance (Dragones de Sangre)
  effect_i18n:
    es: >-
      Tal como están, los Dragones de Sangre son demasiado poderosos y acaban dominando cualquier
      campaña. Los autores sugieren o no usar la banda de Dragones de Sangre o limitar las
      habilidades de linaje a 1 por vampiro.
  applies_to:
    band: true
- id: band--bloodline-abilities
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.blood-dragons-mou.band.bloodline-abilities
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Bloodline Abilities
  effect: >-
    A vampire may choose one or more of the following bloodline abilities at the beginning of the
    game (when he is created). The first ability is at normal cost, every subsequent costs twice
    (i.e. 80 gc instead of 40). Every time he gains a new skill, he may choose a bloodline ability
    instead of a skill at double cost. Red Fury (30 gc): the vampire falls in a horrible blood-rage;
    he gains one additional Attack to his profile. Killing Blow (30 gc): every time he rolls a
    natural 6 on the to hit roll, he automatically wounds his opponent; no parries are allowed,
    although the opponent may make an armour or saving throw. Blood Lust (50 gc): he is subject to
    frenzy. Master Strike (40 gc): he may cause a critical hit on a 5 or 6. Curse of the Undead (50
    gc): if the vampire goes OOA then after the battle he may regenerate all of his wounds on a D6
    roll of 5+; if he is successful then he needn't roll on the serious injury table. Strength of
    the Dragon (40 gc): he gains a +1 Strength bonus. Gift of Abhorash (30 gc): he permanently
    raises the maximum number of Members in the warband by one.
  source:
    manual: Broheim
    printed_page: 7
    section: Bloodline Abilities
    url: https://broheim.net/downloads/warbands/supplement/mousillon/Blood%20Dragons.pdf
  name_i18n:
    es: Habilidades de Linaje
  effect_i18n:
    es: >-
      Un vampiro puede elegir una o más de las siguientes habilidades de linaje al comienzo del
      juego (cuando se crea). La primera habilidad cuesta lo normal, cada una posterior cuesta el
      doble (p. ej. 80 en vez de 40 coronas). Cada vez que gana una nueva habilidad, puede elegir
      una habilidad de linaje en lugar de una habilidad, al doble de coste. Furia Roja (30 coronas):
      el vampiro cae en una horrible furia de sangre; gana un Ataque adicional a su perfil. Golpe
      Asesino (30 coronas): cada vez que saca un 6 natural para golpear, hiere automáticamente a su
      oponente; no se permiten paradas, aunque el oponente puede hacer tirada de armadura o
      salvación. Sed de Sangre (50 coronas): está sujeto a frenesí. Golpe Maestro (40 coronas):
      puede causar un impacto crítico con un 5 o 6. Maldición de los No Muertos (50 coronas): si el
      vampiro queda fuera de combate, tras la batalla puede regenerar todas sus heridas con una
      tirada de 5+ en 1D6; si lo consigue, no tira en la tabla de heridas graves. Fuerza del Dragón
      (40 coronas): gana +1 de Fuerza. Don de Abhorash (30 coronas): eleva permanentemente en uno el
      número máximo de miembros de la banda.
  applies_to:
    band: true
