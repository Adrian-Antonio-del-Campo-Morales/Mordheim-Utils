  name: Leader (Prophet)
  effect: >-
    Any warrior within 6" of the Prophet may use his Leadership value when taking Leadership tests.
  source:
    manual: Broheim
    printed_page: 4
    section: Heroes / 1 Prophet of the False Grail / Special Rules
    url: https://broheim.net/downloads/warbands/supplement/mousillon/Disciples%20of%20Maldred.pdf
  name_i18n:
    es: Líder (Profeta)
  effect_i18n:
    es: >-
      Cualquier guerrero a 6" o menos del Profeta puede usar su valor de Liderazgo cuando realice
      tiradas de Liderazgo.
  applies_to:
    profile_ids:
    - prophet
