  name: Make Explosives
  effect: >-
    A Sapper may spend the post-game phase making explosives instead of searching for Rare items.
    Roll a Ld test: if the Sapper succeeds you can craft up to two Blast Charges for 9 GC each, up
    to two doses of Flash Powder for 11 GC each, a Fire Bomb for 21 GC or a Cinderblast bomb for 27
    GC (pick one and spend GC before rolling).
  source:
    manual: Broheim
    printed_page: 2
    section: Heroes / 0-1 Sapper / Special Rules / Make Explosives
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Guild Of Disgraced Engineers.pdf
  name_i18n:
    es: Fabricar Explosivos
  effect_i18n:
    es: >-
      Un Zapador puede emplear la fase posterior a la partida fabricando explosivos en lugar de
      buscar objetos raros. Tira un chequeo de L: si el Zapador tiene éxito, puedes fabricar hasta
      dos Cargas de Explosión a 9 coronas cada una, hasta dos dosis de Polvo de Destello a 11
      coronas cada una, una Bomba de Fuego por 21 coronas o una bomba de Cinderita por 27 coronas
      (elige una y gasta las coronas antes de tirar).
  applies_to:
