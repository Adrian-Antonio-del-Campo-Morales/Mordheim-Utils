schema_version: 2
band_id: guild-of-disgraced-engineers-mim
rules:
- id: band--hard-to-kill
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.guild-of-disgraced-engineers-mim.band.hard-to-kill
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Hard to Kill
  effect: >-
    Dwarfs are tough, resilient individuals who can only be taken out of action on a roll of 6
    instead of 5-6 when rolling on the Injury chart. Treat a roll of 1-2 as knocked down, 3-5 as
    stunned, and 6 as out of action.
  source:
    manual: Broheim
    printed_page: 1
    section: Special Rules / Hard to Kill
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Guild Of Disgraced Engineers.pdf
  name_i18n:
    es: Difícil de Matar
  effect_i18n:
    es: >-
      Los enanos son individuos duros y resistentes que solo pueden ser dejados fuera de combate con
      un resultado de 6 en lugar de 5-6 al tirar en la tabla de Heridas. Trata un resultado de 1-2
      como derribado, 3-5 como aturdido y 6 como fuera de combate.
  applies_to:
    band: true
- id: band--hard-head
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.guild-of-disgraced-engineers-mim.band.hard-head
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Hard Head
  effect: Dwarfs ignore the special rules for clubs, maces, etc. They too are not easy to knock out!
  source:
    manual: Broheim
    printed_page: 1
    section: Special Rules / Hard Head
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Guild Of Disgraced Engineers.pdf
  name_i18n:
    es: Cabeza Dura
  effect_i18n:
    es: >-
      Los enanos ignoran las reglas especiales de garrotes, mazas, etc. ¡Ellos tampoco son fáciles
      de dejar K.O.!
  applies_to:
    band: true
