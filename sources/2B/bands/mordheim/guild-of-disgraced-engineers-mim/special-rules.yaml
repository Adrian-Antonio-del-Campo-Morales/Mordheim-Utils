  name: Space
  effect: The gyrocopter starts with 1 seat available. This may be improved via Tinker.
  source:
    manual: Broheim
    printed_page: 3
    section: Henchmen / 0-1 Gyrocopter / Special Rules / Space
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Guild Of Disgraced Engineers.pdf
  name_i18n:
    es: Espacio
  effect_i18n:
    es: El autogiro comienza con 1 asiento disponible. Puede mejorarse mediante Trasteo.
  applies_to:
    profile_ids:
    - gyrocopter
- id: gyrocopter--full-steam-ahead
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.guild-of-disgraced-engineers-mim.gyrocopter.full-steam-ahead
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Full Steam Ahead!
  effect: >-
    The Gyrocopter can achieve a burst of speed, moving only in a straight line, but at a risk. Roll
    a D6: if the result is 6 you must roll on the Engine malfunction chart, otherwise add the result
    of the dice to the Copter's total speed. A warrior with the Driver skill can re-roll results on
    the Engine Malfunction chart (the new result must be accepted). When a Gyrocopter equipped with
    a Steam Engine is hit with a result of Draft Creature, it has hit the engine; the engine has a
    toughness of 6 and if wounded, roll on the Engine Malfunction chart.
  source:
    manual: Broheim
    printed_page: 3
    section: Henchmen / 0-1 Gyrocopter / Special Rules / Full Steam Ahead
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Guild Of Disgraced Engineers.pdf
  name_i18n:
    es: ¡A Todo Vapor!
  effect_i18n:
    es: >-
      El Autogiro puede lograr una ráfaga de velocidad, moviéndose solo en línea recta, pero con
      riesgo. Tira 1D6: si el resultado es 6 debes tirar en la tabla de Avería de Motor; en caso
      contrario, suma el resultado del dado a la velocidad total del Autogiro. Un guerrero con la
      habilidad Conductor puede repetir los resultados en la tabla de Averías de Motor (el nuevo
      resultado debe aceptarse). Cuando un Autogiro equipado con un Motor de Vapor recibe un impacto
      con resultado de Criatura de Corriente, ha golpeado el motor; el motor tiene una Resistencia
      de 6 y, si es herido, tira en la tabla de Averías de Motor.
  applies_to:
    profile_ids:
    - gyrocopter
- id: gyrocopter--engine-malfunction
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.guild-of-disgraced-engineers-mim.gyrocopter.engine-malfunction
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Engine Malfunction
  effect: >-
    1 - Kaboom! The engine explodes spectacularly, dealing D6 wounds to the Copter hull; any model
    within 4" of the bow takes a S5 flaming hit and the copter is now on fire and immediately
    swerves 45 degrees in a random direction and crash-lands straight down (suffering a further D3
    S5 hits to the hull, and causing D3 S5 hits to anyone underneath!); 2 - Dangerous Overpressure!
    The Gyrocopter suffers 1 wound and plunges 6" forwards and lands (taking damage if it collides
    with anything); 3-4 - Emergency Vent: any models within 4" of the bow take D3 S2 flaming hits
    and the Gyrocopter immediately lands in the nearest available free space beneath it; the
    Gyrocopter cannot move next turn; 5 - Minor Leak: the Gyrocopter immediately lands in the
    nearest available free space beneath it and cannot move next turn; 6 - Valve Locked: the
    Gyrocopter can only move 2D3" this turn, but cannot turn.
  source:
    manual: Broheim
    printed_page: 3
    section: Henchmen / 0-1 Gyrocopter / Engine Malfunction
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Guild Of Disgraced Engineers.pdf
  name_i18n:
    es: Avería de Motor
  effect_i18n:
    es: >-
      1 - ¡Kaboom! El motor explota de forma espectacular, causando 1D6 heridas al casco del
      Autogiro; cualquier modelo a 4" de la proa sufre un impacto de F5 ígneo, el autogiro arde e
      inmediatamente se desvía 45 grados en una dirección aleatoria y se estrella contra el suelo
      (sufriendo 1D3 impactos de F5 adicionales al casco, ¡y causando 1D3 impactos de F5 a
      cualquiera que esté debajo!); 2 - ¡Sobrepresión Peligrosa! El Autogiro sufre 1 herida y se
      precipita 6" hacia delante y aterriza (sufriendo daños si choca con algo); 3-4 - Venteo de
      Emergencia: los modelos a 4" de la proa sufren 1D3 impactos ígneos de F2 y el Autogiro
      aterriza inmediatamente en el espacio libre más cercano debajo de él; el Autogiro no puede
      moverse el siguiente turno; 5 - Fuga Menor: el Autogiro aterriza inmediatamente en el espacio
      libre más cercano debajo de él y no puede moverse el siguiente turno; 6 - Válvula Atascada: el
      Autogiro solo puede moverse 2D3" este turno, pero no puede girar.
  applies_to:
    profile_ids:
    - gyrocopter
