  name: Properly Used
  effect: >-
    Any Thunderer worth their beard knows their weapon inside and out. When using the optional
    Misfire rules, if a one is rolled, roll a second dice. On a 3+ the misfire is ignored (the shot
    still misses, but the weapon does NOT explode).
  source:
