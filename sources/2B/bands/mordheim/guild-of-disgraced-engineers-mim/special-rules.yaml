        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Assistant
  effect: >-
    An Apprentice will assist the Expelled Engineer with his inventions; for each apprentice
    dedicated to the project post game the Expelled Engineer adds +1 to his roll to create.
    Alternatively an apprentice may search for rare items in place of the Engineer, gaining any
    bonuses to rarity rolls the Engineer may benefit from.
  source:
    manual: Broheim
    printed_page: 2
    section: Heroes / 0-2 Apprentice Engineers / Special Rules / Assistant
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Guild Of Disgraced Engineers.pdf
  name_i18n:
    es: Ayudante
  effect_i18n:
    es: >-
      Un Aprendiz asistirá al Ingeniero Expulsado con sus inventos; por cada aprendiz dedicado al
      proyecto tras la partida, el Ingeniero Expulsado suma +1 a su tirada de creación.
      Alternativamente, un aprendiz puede buscar objetos raros en lugar del Ingeniero, obteniendo
      cualquier bonificación a las tiradas de rareza de la que se beneficie el Ingeniero.
  applies_to:
    profile_ids:
    - apprentice-engineers
- id: sapper--make-explosives
  runtime:
    scope: LATER
    implemented: 'NO'
