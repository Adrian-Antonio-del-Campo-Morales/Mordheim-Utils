    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Guild Of Disgraced Engineers.pdf
  name_i18n:
    es: Uso Adecuado
  effect_i18n:
    es: >-
      Todo Tronador que se precie conoce su arma de dentro hacia fuera. Al usar las reglas
      opcionales de Encasquillamiento, si se saca un 1, tira un segundo dado. Con un 3+ el
      encasquillamiento se ignora (el disparo sigue fallando, pero el arma NO explota).
  applies_to:
    profile_ids:
    - thunderers
