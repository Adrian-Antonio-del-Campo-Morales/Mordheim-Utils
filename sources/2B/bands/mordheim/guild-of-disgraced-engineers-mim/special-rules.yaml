  name: Inventor
  effect: >-
    In the Trading phase, instead of searching for rare items or visiting a location, the Engineer
    may instead attempt to create a new invention from the book of bad ideas. The Engineer needs the
    book and the listed ingredients to do this, and must pass the difficulty test stated on the
    invention.
  source:
    manual: Broheim
    printed_page: 2
    section: Heroes / 1 Expelled Engineer / Special Rules / Inventor
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Guild Of Disgraced Engineers.pdf
  name_i18n:
    es: Inventor
  effect_i18n:
    es: >-
      En la fase de comercio, en lugar de buscar objetos raros o visitar un lugar, el Ingeniero
      puede intentar crear un nuevo invento del libro de malas ideas. El Ingeniero necesita el libro
      y los ingredientes listados para hacerlo, y debe superar la prueba de dificultad indicada en
      el invento.
  applies_to:
    profile_ids:
    - expelled-engineer
- id: apprentice-engineers--assistant
  runtime:
    scope: LATER
    implemented: 'NO'
