  name: Rabble (Floordogs)
  effect: >-
    Floordogs do not need to be armed all the same. Each may be given different equipment, but only
    items listed in the Floordog equipment list. Floordogs can never use magic, or cast spells of
    any sort, no matter their original background or abilities.
  source:
