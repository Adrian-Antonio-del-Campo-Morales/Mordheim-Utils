        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Wo kao, they got away!
  effect: >-
    If the Pirate Warband itself Routs, any Floordogs who have already left the table in previous
    turns are presumed to have made a successful escape, and are never seen from again. Remove them
    from your warband roster as if they had been killed.
  source:
    manual: Broheim
    printed_page: 4
