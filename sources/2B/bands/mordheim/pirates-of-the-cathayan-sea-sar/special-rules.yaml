    es: >-
      Los Perros de Cubierta no necesitan ir armados por igual. Cada uno puede llevar equipo
      distinto, pero solo objetos de la lista de equipo de Perros de Cubierta. Los Perros de
      Cubierta nunca pueden usar magia ni lanzar hechizos de ningún tipo, sin importar su origen o
      habilidades previas.
  applies_to:
