schema_version: 2
band_id: pirates-of-the-cathayan-sea-sar
rules:
- id: band--swabbies-cathay
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.pirates-of-the-cathayan-sea-sar.band.swabbies-cathay
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Swabbies/Swivel Guns (Cathayan Pirates)
  effect: >-
    Cathayan Pirates can take human Swabbies, the stats of which are included later. See the rules
    for capturing Swabbies, in the Sartosa campaign rules. Willing recruits join the 'DeckHands';
    unwilling troops become 'Floordogs'.
  source:
    manual: Broheim
    printed_page: 1
    section: Swabbies/Swivel Guns
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Pirates%20of%20the%20Cathayan%20Sea.pdf
  name_i18n:
    es: Fregones/Cañones giratorios (Piratas de Cathay)
  effect_i18n:
    es: >-
      Los Piratas de Cathay pueden llevar Fregones humanos, cuyas estadísticas se incluyen más
      adelante. Ver las reglas para capturar Fregones en las reglas de campaña de Sartosa. Los
      reclutas voluntarios se unen a los Marinadas; los reacios se convierten en Perros de Cubierta.
  applies_to:
    band: true
- id: band--swivel-guns-rare-lao-xiong
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.pirates-of-the-cathayan-sea-sar.band.swivel-guns-rare-lao-xiong
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Swivel Guns are Rare, Lao Xiong!
  effect: >-
    Cathay Pirate Warbands may not start with a Swivel Gun on their roster in campaign games. If
    playing a one-off game, they may purchase a Swivel Gun for an additional price of 2D6 gc.
  source:
    manual: Broheim
    printed_page: 1
    section: Swivel Guns are Rare, Lao Xiong!
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Pirates%20of%20the%20Cathayan%20Sea.pdf
  name_i18n:
    es: Los cañones giratorios son raros, Lao Xiong
  effect_i18n:
    es: >-
      Las bandas de Piratas de Cathay no pueden empezar con un cañón giratorio en su lista en
      partidas de campaña. En partidas sueltas, pueden comprar uno por 2D6 coronas adicionales.
  applies_to:
    band: true
- id: band--foreign-but-human
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.pirates-of-the-cathayan-sea-sar.band.foreign-but-human
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Foreign, but Human
  effect: >-
    While not included in the above 'Human Pirates' Warband list, Cathayan Pirates still count as a
    'Human Pirate' Warbands list. The composition of their warband is slightly different, but like
    Ostlanders and Averlanders still count as Mercenaries, they still are part under the umbrella of
    'Human Pirates.'
  source:
    manual: Broheim
    printed_page: 1
    section: Foreign, but Human
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Pirates%20of%20the%20Cathayan%20Sea.pdf
  name_i18n:
    es: Extranjeros, pero Humanos
  effect_i18n:
    es: >-
      Aunque no están incluidos en la lista de banda 'Piratas Humanos' anterior, los Piratas de
      Cathay siguen contando como una lista de banda 'Pirata Humano'. La composición de su banda es
      algo distinta, pero igual que los Ostlanders y los Averlanders cuentan como Mercenarios,
      siguen bajo el paraguas de los 'Piratas Humanos'.
  applies_to:
    band: true
- id: band--stranger-in-a-strange-land
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.pirates-of-the-cathayan-sea-sar.band.stranger-in-a-strange-land
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Stranger in a Strange Land
  effect: >-
    When playing in any campaign based in the Old World (including Mordheim, Albion, Sylvannia,
    Sartosa), always roll two dice for order of deployment, and choose whichever dice was lower.
    Owning a Compass will negate this penalty but provides no further bonus. They do not suffer this
    penalty in the Border Town Burning Campaign (home turf!) or in the Lustria, Khemri, or the
    Crusades (they are just as lost as everyone else!).
  source:
    manual: Broheim
    printed_page: 1
    section: Stranger in a Strange Land
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Pirates%20of%20the%20Cathayan%20Sea.pdf
  name_i18n:
    es: Forasteros en Tierra Extraña
  effect_i18n:
    es: >-
      Al jugar en cualquier campaña ambientada en el Viejo Mundo (incluidos Mordheim, Albion,
      Sylvania, Sartosa), tira siempre dos dados para el orden de despliegue y elige el dado más
      bajo. Poseer una Brújula anula esta penalización pero no otorga ninguna otra bonificación. No
      sufren esta penalización en la campaña de Border Town Burning (¡territorio propio!) ni en
      Lustria, Khemri o las Cruzadas (¡están igual de perdidos que los demás!).
  applies_to:
    band: true
- id: band--succession
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.pirates-of-the-cathayan-sea-sar.band.succession
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Succession (Cathayan Pirates)
  effect: >-
    If the Disgraced Warlord is killed, one of the Shanghai'ers will take over in the same manner as
    a Champion taking over for a Mercenary warband.
  source:
    manual: Broheim
    printed_page: 1
    section: Succession
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Pirates%20of%20the%20Cathayan%20Sea.pdf
  name_i18n:
    es: Sucesión (Piratas de Cathay)
  effect_i18n:
    es: >-
      Si el Señor de la Guerra Degradado muere, uno de los Shanghaiers tomará el mando de la misma
      forma que un Campeón en una banda mercenaria.
  applies_to:
    band: true
- id: band--katana
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.pirates-of-the-cathayan-sea-sar.item.katana
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Katana
  effect: >-
    20 gold crowns - Availability: Rare 10. Katanas are great-swords that are usually used by
    Cathayan Soldiers and Ronins. Range: Close Combat; Strength: As user +1; Special rules:
    Two-handed, Parry. Two-handed: a model armed with a katana may not use a shield, buckler or
    additional weapon in close combat; however it gets an additional +1 armour save bonus against
    ranged attacks if it carries a shield. Parry: katanas, despite their great size, can be used for
    parrying like a sword; when his opponent rolls to hit, the model armed with a katana may roll a
    D6; if the score is greater than the highest to hit score of his opponent, the model has parried
    the blow, and that attack is discarded; a model may not parry attacks made with double or more
    its own Strength - they are simply too powerful to be stopped.
  source:
    manual: Broheim
    printed_page: 5
    section: New Equipment / Katana
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Pirates%20of%20the%20Cathayan%20Sea.pdf
  name_i18n:
    es: Katana
  effect_i18n:
    es: >-
      20 coronas de oro - Disponibilidad: Rara 10. Las katanas son espadas grandes que suelen usar
      los soldados y ronin de Cathay. Alcance: cuerpo a cuerpo; Fuerza: la del usuario +1; Reglas
      especiales: a dos manos, Parada. A dos manos: un modelo con katana no puede usar escudo,
      broquel ni arma adicional en combate; sin embargo, obtiene un +1 adicional a la salvación por
      armadura contra ataques a distancia si lleva escudo. Parada: las katanas, a pesar de su gran
      tamaño, pueden usarse para detener golpes como una espada; cuando su oponente tira para
      golpear, el modelo con katana puede tirar 1D6; si el resultado es mayor que el más alto para
      golpear de su oponente, el modelo ha detenido el golpe y ese ataque se descarta; un modelo no
      puede detener ataques hechos con el doble o más de su propia Fuerza: son simplemente demasiado
      poderosos para detenerlos.
  applies_to:
    band: true
- id: band--cathayan-candles
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.pirates-of-the-cathayan-sea-sar.item.cathayan-candles
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Cathayan Candles
  effect: >-
    25+D6 gold crowns - Availability: Rare 9. Cathayan Candles are explosive sticks, made with black
    powder and other foreign ingredients. They detonate on impact, igniting objects and bodies with
    which they make contact. Range: 6"; Strength: 3; Special Rules: Thrown weapon, Set on fire.
    Thrown weapon: a model using Cathayan candles does not suffer penalties for range or moving. Set
    on fire: if you hit with the Cathayan candles roll a D6; if you score a 5+ your opponent has
    been set on fire; they must roll a D6 in the Recovery phase and score a 4+ to put themselves out
    or they will suffer a Strength 4 hit and will be unable to do anything other than move for each
    turn they are on fire; allies may also attempt to put the warrior out; they must be in base
    contact and need a 4+ to be successful.
  source:
    manual: Broheim
    printed_page: 5
    section: New Equipment / Cathayan Candles
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Pirates%20of%20the%20Cathayan%20Sea.pdf
  name_i18n:
    es: Velas de Cathay
  effect_i18n:
    es: >-
      25+D6 coronas de oro - Disponibilidad: Rara 9. Las Velas de Cathay son barras explosivas
      hechas con pólvora negra y otros ingredientes exóticos. Detonan al impactar, incendiando los
      objetos y cuerpos con los que entran en contacto. Alcance: 6"; Fuerza: 3; Reglas especiales:
      arma arrojadiza, Prender fuego. Arma arrojadiza: un modelo que use Velas de Cathay no sufre
      penalizaciones por alcance ni por moverse. Prender fuego: si golpeas con las Velas de Cathay,
      tira 1D6; con un 5+ tu oponente ha prendido fuego; debe tirar 1D6 en la fase de recuperación y
      sacar 4+ para apagarse, o sufrirá un impacto de Fuerza 4 y no podrá hacer nada más que moverse
      durante cada turno que esté ardiendo; los aliados también pueden intentar apagar al guerrero:
      deben estar en contacto y sacar un 4+ para conseguirlo.
  applies_to:
    band: true
- id: band--cathayan-plate-armour
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.pirates-of-the-cathayan-sea-sar.item.cathayan-plate-armour
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Cathayan Plate Armour
  effect: >-
    120 gold crowns - Availability: Rare 11. The Cathayan blacksmiths forge these heavy armours for
    the noble knights that protect the farmsteads; especially among the Palace Guard of the Cathayan
    Emperor the plate armour is very common. The armour covers not only its wearer's torso but also
    his upper arm and parts of his legs. Save: a warrior that is wearing Cathayan plate armour has a
    basic D6 saving throw of 4+. Movement: a warrior that is equipped with both plate armour and a
    shield suffers a -1 Movement penalty.
  source:
    manual: Broheim
    printed_page: 5
    section: New Equipment / Cathayan Plate Armour
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Pirates%20of%20the%20Cathayan%20Sea.pdf
  name_i18n:
    es: Armadura de Placas de Cathay
  effect_i18n:
    es: >-
      120 coronas de oro - Disponibilidad: Rara 11. Los herreros de Cathay forjan estas pesadas
      armaduras para los nobles caballeros que protegen las granjas; en especial entre la Guardia
      Palatina del Emperador de Cathay la armadura de placas es muy común. La armadura cubre no solo
      el torso del portador, sino también la parte superior de los brazos y partes de las piernas.
      Salvación: un guerrero que lleve armadura de placas de Cathay tiene una tirada básica de
      salvación de 4+. Movimiento: un guerrero equipado con armadura de placas y escudo sufre una
      penalización de -1 al Movimiento.
  applies_to:
    band: true
- id: band--quarterstaff
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.pirates-of-the-cathayan-sea-sar.item.quarterstaff
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Quarter Staff
  effect: >-
    15 gold crowns - Availability: Common. Fighting staffs are traditional weapons among the warrior
    monk brotherhoods. Range: Close Combat; Strength: As user; Special Rules: Balanced, Parry,
    Freestyle. Balanced: a quarter staff is especially light and easy to wield; a model armed with a
    fighting staff gets +1 Initiative in close combat. Freestyle: although a staff does not always
    require two hands to use it cannot be combined with another weapon, shield, buckler, etc.;
    however it can be combined with the Monk's bare hand attacks - this means that the Monk is still
    getting +1 Attack.
  source:
    manual: Broheim
    printed_page: 5
    section: New Equipment / Quarter Staff
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Pirates%20of%20the%20Cathayan%20Sea.pdf
  name_i18n:
    es: Bastón
  effect_i18n:
    es: >-
      15 coronas de oro - Disponibilidad: Común. Los bastones de combate son armas tradicionales
      entre las hermandades de monjes guerreros. Alcance: cuerpo a cuerpo; Fuerza: la del usuario;
      Reglas especiales: Equilibrado, Parada, Estilo libre. Equilibrado: un bastón es especialmente
      ligero y fácil de manejar; un modelo con bastón gana +1 de Iniciativa en combate. Estilo
      libre: aunque un bastón no siempre requiere dos manos para usarlo, no puede combinarse con
      otra arma, escudo, broquel, etc.; sin embargo, puede combinarse con los ataques con las manos
      desnudas del Monje, lo que significa que el Monje sigue obteniendo +1 Ataque.
  applies_to:
    band: true
- id: band--chain-sticks
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.pirates-of-the-cathayan-sea-sar.item.chain-sticks
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Chain Sticks
  effect: >-
    20 gold crowns - Availability: Rare 7. Consisting of wooden bars tied together, chain sticks are
    enhanced with iron or steel to gain more striking power. Compared to a flail it is light,
    providing the bearer more flexibility in combat. Range: Close Combat; Strength: As user; Special
    Rules: Flurry, Two-handed. Flurry: a set of chain sticks allows its wielder to unleash a furious
    bludgeoning; a warrior armed with chain sticks gets +2 Attacks; this bonus only applies in the
    first turn of each hand-to-hand combat; using chain sticks otherwise counts as having two hand
    weapons.
  source:
    manual: Broheim
    printed_page: 5
    section: New Equipment / Chain Sticks
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Pirates%20of%20the%20Cathayan%20Sea.pdf
  name_i18n:
    es: Nunchakus
  effect_i18n:
    es: >-
      20 coronas de oro - Disponibilidad: Rara 7. Formados por barras de madera atadas, los
      nunchakus están reforzados con hierro o acero para ganar potencia de golpeo. Comparado con un
      mayal es ligero, lo que otorga al portador más flexibilidad en combate. Alcance: cuerpo a
      cuerpo; Fuerza: la del usuario; Reglas especiales: Ráfaga, a dos manos. Ráfaga: unos nunchakus
      permiten a su portador desatar una brutal golpiza; un guerrero armado con nunchakus gana +2
      Ataques; esta bonificación solo se aplica en el primer turno de cada combate cuerpo a cuerpo;
      usar los nunchakus en otros momentos cuenta como llevar dos armas de una mano.
  applies_to:
    band: true
- id: band--fish-hook-shot
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.pirates-of-the-cathayan-sea-sar.item.fish-hook-shot
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Fish-Hook Shot
  effect: >-
    10 gold crowns - Availability: Rare 7. A hook shot is a fine rope or chain with a weighted
    fishing hook or scythe tied to its end. Monks use the range of this curious barbed weapon with
    deadly precision to cause sword-wielding enemies to fall. Range: 3"; Strength: 3; Special Rules:
    Thrown weapon, Precise, Caused fall. Thrown weapon: models using a fish-hook shot do not suffer
    penalties for range or moving as it is designed for short range use anyway. Precise: a model
    using a fish-hook shot is so well trained in the use of this weapon that he may attack enemy
    models that are engaged in close combat; however the hook shot is useless when the monk is
    engaged in close combat. Caused fall: before making his 'to hit' roll, a warrior may declare to
    try and cause an enemy model to fall instead of causing damage as normal; the warrior must roll
    'to hit' as normal and then pass a Strength test; if the test is successful the enemy model
    counts as knocked down.
  source:
    manual: Broheim
    printed_page: 5
    section: New Equipment / Fish-Hook Shot
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Pirates%20of%20the%20Cathayan%20Sea.pdf
  name_i18n:
    es: Disparo de anzuelo
  effect_i18n:
    es: >-
      10 coronas de oro - Disponibilidad: Rara 7. El disparo de anzuelo es una fina cuerda o cadena
      con un anzuelo de pesca lastrado o una guadaña atada al extremo. Los monjes usan el alcance de
      esta curiosa arma con púas con precisión letal para derribar a los enemigos que empuñan
      espadas. Alcance: 3"; Fuerza: 3; Reglas especiales: arma arrojadiza, Preciso, Provoca caída.
      Arma arrojadiza: los modelos que usen un disparo de anzuelo no sufren penalizaciones por
      alcance ni por moverse, ya que está diseñado para uso a corta distancia. Preciso: un modelo
      que use un disparo de anzuelo está tan bien entrenado en el uso de esta arma que puede atacar
      a modelos enemigos que estén en combate cuerpo a cuerpo; sin embargo, el disparo de anzuelo es
      inútil cuando el monje está trabado en combate. Provoca caída: antes de hacer su tirada para
      golpear, un guerrero puede declarar que intenta derribar a un modelo enemigo en lugar de
      causar daño con normalidad; el guerrero debe tirar para golpear como siempre y superar después
      una prueba de Fuerza; si la prueba tiene éxito, el modelo enemigo cuenta como derribado.
  applies_to:
    band: true
- id: disgraced-warlord--leader
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.pirates-of-the-cathayan-sea-sar.captain.leader
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Leader
  effect: >-
    Any pirate within 6" of the Disgraced Warlord may use his Leadership characteristic when taking
    any Leadership tests.
  source:
    manual: Broheim
    printed_page: 3
    section: Heroes / 1 Disgraced Warlord / Special Rules
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Pirates%20of%20the%20Cathayan%20Sea.pdf
  name_i18n:
    es: Líder
  effect_i18n:
    es: >-
      Cualquier pirata a 6" o menos del Señor de la Guerra Degradado puede usar su característica de
      Liderazgo cuando realice cualquier tirada de Liderazgo.
  applies_to:
    profile_ids:
    - disgraced-warlord
- id: dragon-monk--art-of-silent-death
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.pirates-of-the-cathayan-sea-sar.dragon-monk.art-of-silent-death
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Art of Silent Death (Dragon Monk)
  effect: >-
    Dragon Monks have become masters of the Cathayan art of open-hand fighting. In hand-to-hand
    combat, if fighting unarmed, they will cause a critical hit on a roll 'to wound' of 5-6 instead
    of a 6. If the Dragon Monk wields a quarterstaff, only the unarmed attacks will cause a critical
    hit on 5+.
  source:
    manual: Broheim
    printed_page: 3
    section: Heroes / 0-1 Dragon Monk / Special Rules
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Pirates%20of%20the%20Cathayan%20Sea.pdf
  name_i18n:
    es: Arte de la Muerte Silenciosa (Monje Dragón)
  effect_i18n:
    es: >-
      Los Monjes Dragón se han convertido en maestros del arte cathayano de la lucha a mano abierta.
      En combate cuerpo a cuerpo, si luchan desarmados, causan un impacto crítico con una tirada
      para herir de 5-6 en lugar de un 6. Si el Monje Dragón empuña un bastón, solo los ataques
      desarmados causarán un impacto crítico con 5+.
  applies_to:
    profile_ids:
    - dragon-monk
- id: dragon-monk--distaste-for-poison
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.pirates-of-the-cathayan-sea-sar.dragon-monk.distaste-for-poison
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Distaste for Poison (Dragon Monk)
  effect: >-
    The use of poisons and various drugs is a specialty for dishonourable warriors who would stoop
    to such ends. Dragon Monks frown on this and may never use any kind of poison or venom.
  source:
    manual: Broheim
    printed_page: 3
    section: Heroes / 0-1 Dragon Monk / Special Rules
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Pirates%20of%20the%20Cathayan%20Sea.pdf
  name_i18n:
    es: Aversión al Veneno (Monje Dragón)
  effect_i18n:
    es: >-
      El uso de venenos y diversas drogas es la especialidad de guerreros deshonrosos que estarían
      dispuestos a tales bajezas. Los Monjes Dragón lo miran con desaprobación y nunca pueden usar
      ningún tipo de veneno.
  applies_to:
    profile_ids:
    - dragon-monk
- id: gunners--swivel-guns-dangerous-lao-xiong
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.pirates-of-the-cathayan-sea-sar.gunners.swivel-guns-dangerous-lao-xiong
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Swivel Guns are Dangerous, Lao Xiong!
  effect: >-
    If a Pirate Warband includes a Swivel Gun, the Gunner wielding it will always be considered an
    individual and can never have anyone else with him. Since a Pirate Warband may only have one
    Swivel Gun, if a Gunner is equipped with one then he must either be a new Gunner, or split from
    an existing unit. If the latter, he retains all Experience and Skills he had previously.
  source:
    manual: Broheim
    printed_page: 3
    section: Henchmen / 0-7 Gunners / Special Rules
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Pirates%20of%20the%20Cathayan%20Sea.pdf
  name_i18n:
    es: Los cañones giratorios son peligrosos, ¡Lao Xiong!
  effect_i18n:
    es: >-
      Si una Banda Pirata incluye un Cañón Giratorio, el Artillero que lo porte siempre será
      considerado un individuo y nunca podrá llevar a nadie más con él. Como una Banda Pirata solo
      puede tener un Cañón Giratorio, si un Artillero lleva uno, debe ser un Artillero nuevo o
      separarse de una unidad existente. En este último caso, conserva toda la Experiencia y
      Habilidades que tuviera previamente.
  applies_to:
    profile_ids:
    - gunners
