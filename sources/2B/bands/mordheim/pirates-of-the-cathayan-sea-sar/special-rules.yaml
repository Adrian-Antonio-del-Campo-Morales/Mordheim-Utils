  name_i18n:
    es: Wo kao, ¡se han escapado!
  effect_i18n:
    es: >-
      Si la banda pirata huye de la partida, se asume que los Perros de Cubierta que ya hayan salido
      de la mesa en turnos anteriores han escapado con éxito y no volverán a verse jamás. Retíralos
      de la lista de la banda como si hubieran muerto.
  applies_to:
    profile_ids:
    - floordogs
- id: floordogs--dont-mind-them-lao-xiong
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.pirates-of-the-cathayan-sea-sar.floordogs.dont-mind-them-lao-xiong
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Don't mind them Lao Xiong, they ain't true pirates!
  effect: >-
    The rest of the Deck Hands barely notice if any Floordogs run away or go Out of Action - they
    know they'll find them later on and give them 30 lashes if they're lucky! Any Floordogs who are
    running away or have been taken out of action do not count towards the need to take a Rout test
    for the warband.
  source:
    manual: Broheim
    printed_page: 4
    section: Henchmen / 0-5 Floordogs / Special Rules
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Pirates%20of%20the%20Cathayan%20Sea.pdf
  name_i18n:
    es: No les hagas caso Lao Xiong, ¡no son piratas de verdad!
  effect_i18n:
    es: >-
      Al resto de Marinadas apenas le importa si los Perros de Cubierta huyen o quedan fuera de
      combate: ¡saben que los encontrarán más tarde y les darán 30 latigazos si tienen suerte! Los
      Perros de Cubierta que estén huyendo o fuera de combate no cuentan a la hora de hacer la
      tirada de Huida de la banda.
  applies_to:
    profile_ids:
    - floordogs
- id: band--special-pirates-of-the-cathayan-sea-skills
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.pirates-of-the-cathayan-sea-sar.skills.special-pirates-of-the-cathayan-sea-skills
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Special Pirates of the Cathayan Sea Skills
  effect: >-
    Angel of the Sword: when wielding a Katana, a model may choose each round of combat; to gain an
    extra attack, or to reroll their parry roll; this must be declared at the start of the Combat
    Phase, before warriors roll for Initiative. Knowledge of Shadows: whenever a warrior with this
    skill charges another warrior who could not see him from the beginning of this turn (either
    because he was hidden, or he charged by virtue of an Initiative test), this warrior will receive
    a +1 to hit, and a +1 to Injury Rolls. Art of the Silent Death: a warrior with this skill may
    use his bare hands as weapons with no penalties; when doing so he causes Critical Hits on a
    natural roll of 5 or 6, and he gains an attack as if wielding 2 weapons; at the start of any
    round, the hero may decide to wield a weapon in any of his hands, though it no longer gains the
    5+ Critical hit. Energy Focus (Dragon Monks Only): if fighting unarmed the Hero may choose to
    reduce his Attacks by -1 and thus gain +1 Strength in close combat; the monk may sacrifice any
    number of attacks this way. Monk Weaponry: through the tutelage of a Dragon Monk or his own
    personal studies, the Hero has taught himself the art of Dragon Monk weapons; he may use any
    hand-to-hand or missile weapon from the Monk Equipment List, and may learn the skill 'Energy
    Focus.'
  source:
    manual: Broheim
    printed_page: 4
    section: Special Pirates of the Cathayan Sea Skills
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Pirates%20of%20the%20Cathayan%20Sea.pdf
  name_i18n:
    es: Habilidades Especiales de los Piratas del Mar de Cathay
  effect_i18n:
    es: >-
      Ángel de la Espada: al empuñar una Katana, un modelo puede elegir en cada ronda de combate
      entre ganar un ataque adicional o repetir su tirada de parada; debe declararse al comienzo de
      la Fase de Combate, antes de que los guerreros tiren de Iniciativa. Conocimiento de las
      Sombras: siempre que un guerrero con esta habilidad cargue contra otro guerrero que no pudiera
      verlo desde el principio del turno (ya fuera porque estaba oculto o porque cargó gracias a una
      prueba de Iniciativa), este guerrero recibe +1 para golpear y +1 en las tiradas de herida.
      Arte de la Muerte Silenciosa: un guerrero con esta habilidad puede usar sus manos desnudas
      como armas sin penalizaciones; al hacerlo causa Impactos Críticos con un 5 o 6 natural, y gana
      un ataque como si empuñara 2 armas; al comienzo de cualquier ronda, el héroe puede decidir
      empuñar un arma en cualquiera de sus manos, aunque ya no obtendrá el crítico con 5+.
      Concentración de Energía (solo Monjes Dragón): si lucha desarmado, el Héroe puede optar por
      reducir sus Ataques en -1 y así ganar +1 de Fuerza en combate; el monje puede sacrificar
      cualquier número de ataques de esta forma. Armamento de Monje: mediante el tutelaje de un
      Monje Dragón o sus propios estudios, el Héroe se ha enseñado a sí mismo el arte de las armas
      de los Monjes Dragón; puede usar cualquier arma de cuerpo a cuerpo o proyectil de la Lista de
      Equipo de Monje, y puede aprender la habilidad 'Concentración de Energía'.
  applies_to:
    band: true
