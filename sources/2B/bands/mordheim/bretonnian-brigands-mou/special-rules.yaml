    - id: unimplemented.bretonnian-brigands-mou.fallen-noble.old-connections
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Old Connections
  effect: >-
    Due to his former life, he still is well connected. This gives him an edge in acquiring all
    kinds of exotic items. The character gains a +1 on rarity rolls.
  source:
    manual: Broheim
    printed_page: 5
    section: Heroes / 0-1 Fallen Noble / Special Rules
    url: https://broheim.net/downloads/warbands/supplement/mousillon/Bretonnian%20Brigands.pdf
  name_i18n:
    es: Viejas Conexiones
  effect_i18n:
    es: >-
      Gracias a su vida anterior, sigue bien relacionado. Esto le da ventaja para conseguir todo
      tipo de objetos exóticos. El personaje gana +1 en las tiradas de rareza.
  applies_to:
    profile_ids:
    - fallen-noble
