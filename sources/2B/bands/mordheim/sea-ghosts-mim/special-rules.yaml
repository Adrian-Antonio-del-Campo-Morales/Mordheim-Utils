schema_version: 2
band_id: sea-ghosts-mim
rules:
- id: band--sundering
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.sea-ghosts-mim.band.sundering
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Sundering
  effect: >-
    All elf warriors in a Sea Elf Rangers warband have an unyielding hatred for Dark Elves. Sea Elf
    Rangers hate Dark Elves.
  source:
    manual: Broheim
    printed_page: 2
    section: Special rules / Sundering
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Sea%20Ghosts.pdf
  name_i18n:
    es: Cisma
  effect_i18n:
    es: >-
      Todos los guerreros élficos de una banda de Batidores del Mar sienten un odio implacable por
      los Elfos Oscuros. Los Batidores del Mar odian a los Elfos Oscuros.
  applies_to:
    band: true
- id: band--excellent-sight
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.sea-ghosts-mim.band.excellent-sight
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Excellent Sight
  effect: >-
    Elves have eyesight unmatched by mere humans. All the Elves can spot Hidden enemies from twice
    as far away as other warriors (i.e. twice their Initiative in inches).
  source:
    manual: Broheim
    printed_page: 2
    section: Special rules / Excellent Sight
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Sea%20Ghosts.pdf
  name_i18n:
    es: Vista Excelente
  effect_i18n:
    es: >-
      Los elfos tienen una vista sin igual entre los humanos. Todos los elfos pueden detectar
      enemigos Ocultos al doble de distancia que otros guerreros (es decir, el doble de su
      Iniciativa en pulgadas).
  applies_to:
    band: true
- id: band--distaste-for-poison
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.sea-ghosts-mim.band.distaste-for-poison
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Distaste for Poison
  effect: >-
    The use of poisons and various drugs is a Dark Elf specialty. As such, it is frowned upon by
    other Elves. Warriors in a Sea Elf Rangers warband may not use poisons of any type.
  source:
    manual: Broheim
    printed_page: 2
    section: Special rules / Distaste for Poison
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Sea%20Ghosts.pdf
  name_i18n:
    es: Repulsa por el Veneno
  effect_i18n:
    es: >-
      El uso de venenos y diversas drogas es una especialidad de los Elfos Oscuros, por lo que el
      resto de elfos lo ve con malos ojos. Los guerreros de una banda de Batidores del Mar no pueden
      usar venenos de ningún tipo.
  applies_to:
    band: true
- id: band--tolerant
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.sea-ghosts-mim.band.tolerant
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Tolerant
  effect: >-
    Due to their outsider status with the Asur, Sea Elves have learned to stifle their distaste for
    younger races. Unless specified otherwise a Sea Elf Rangers warband may hire any Hired Sword
    that is not a Dark Elf, Skaven or a follower of Chaos. In addition they shun the company of
    anyone specializing in the use of poison so may never hire Assassins.
  source:
    manual: Broheim
    printed_page: 2
    section: Special rules / Tolerant
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Sea%20Ghosts.pdf
  name_i18n:
    es: Tolerantes
  effect_i18n:
    es: >-
      Debido a su condición de marginados ante los Asur, los Elfos del Mar han aprendido a reprimir
      su desprecio por las razas más jóvenes. Salvo indicación contraria, una banda de Batidores del
      Mar puede contratar cualquier Espada a Sueldo que no sea un Elfo Oscuro, Skaven o seguidor del
      Caos. Además, rehúyen de quienes se especializan en el uso del veneno, por lo que nunca pueden
      contratar Asesinos.
  applies_to:
    band: true
- id: band--magicians
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.sea-ghosts-mim.band.magicians
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Magicians
  effect: >-
    If a Sea Elf Rangers warband hires the Elf Mage Hired Sword then the magician can be retained
    after each battle by paying 25 gold crowns upkeep.
  source:
    manual: Broheim
    printed_page: 2
    section: Special rules / Magicians
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Sea%20Ghosts.pdf
  name_i18n:
    es: Magos
  effect_i18n:
    es: >-
      Si una banda de Batidores del Mar contrata al Mago Elfo como Espada a Sueldo, el mago puede
      ser retenido tras cada batalla pagando 25 coronas de oro de mantenimiento.
  applies_to:
    band: true
- id: band--unforgiving
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.sea-ghosts-mim.band.unforgiving
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Unforgiving
  effect: >-
    In addition to their hatred of their corrupt kin, elf folk have a long history of struggle
    against the forces of Chaos. In multiplayer games, a Sea Elf Ranger warband may never forge an
    alliance with Dark Elves, followers of Chaos or Skaven warbands.
  source:
    manual: Broheim
    printed_page: 2
    section: Special rules / Unforgiving
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Sea%20Ghosts.pdf
  name_i18n:
    es: Implacables
  effect_i18n:
    es: >-
      Además del odio hacia sus parientes corruptos, los elfos tienen una larga historia de lucha
      contra las fuerzas del Caos. En partidas multijugador, una banda de Batidores del Mar nunca
      puede forjar una alianza con bandas de Elfos Oscuros, seguidores del Caos o Skaven.
  applies_to:
    band: true
- id: band--sea-elf-special-skills
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.sea-ghosts-mim.band.sea-elf-special-skills
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Sea Elf Special Skills
  effect: >-
    Sea Elf Rangers may choose to use the following skill list instead of the standard skill lists:
    Infiltration (deployed after the opposing warband, anywhere out of sight and more than 12" from
    any enemy model; if both players infiltrate, roll a D6 for each, lowest sets up first); Luck
    (blessed by Lileath, once per game may re-roll any dice roll he makes); See in Shadows (may
    always roll to charge opponents he cannot see, instead of the normal 4"); Hide in Shadows (an
    enemy attempting to detect this Hidden warrior must halve his Initiative before measuring
    distance); Powerful Build (may choose skills from the Strength table from now on; never more
    than two Elves with this skill in the warband); Fey (hostile magic spells will not affect the
    Elf on a D6 roll of 4+).
  source:
    manual: Broheim
    printed_page: 6
    section: Sea Elf special skills
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Sea%20Ghosts.pdf
  name_i18n:
    es: Habilidades Especiales de los Elfos del Mar
  effect_i18n:
    es: >-
      Los Batidores del Mar pueden usar la siguiente lista de habilidades en lugar de las listas
      estándar: Infiltración (se despliega tras la banda rival, en cualquier punto sin línea de
      visión y a más de 12" de cualquier modelo enemigo; si ambos jugadores infiltran, cada uno tira
      1D6 y el más bajo despliega primero); Suerte (bendecido por Lileath, una vez por partida puede
      repetir cualquier tirada de dado que realice); Ver en las Sombras (siempre puede tirar por
      cargar contra enemigos que no vea, en lugar de las 4" normales); Ocultarse en las Sombras (un
      enemigo que intente detectarlo estando Oculto debe reducir a la mitad su Iniciativa antes de
      medir la distancia); Complexión Poderosa (puede elegir habilidades de la tabla de Fuerza a
      partir de ahora; nunca puede haber más de dos elfos con esta habilidad en la banda); Feérico
      (los hechizos hostiles no le afectan con un resultado de 4+ en 1D6).
  applies_to:
    band: true
- id: band--lyre
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.sea-ghosts-mim.item.lyre
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Lyre
  effect: >-
    15 gold crowns, Rare 8, Minstrels only. Handcrafted enchanted instruments from Ulthuan; the
    maximum number of warriors allowed in the warband is increased by +1 if the Minstrels group is
    equipped with enchanted instruments. During the shooting phase the Minstrel or group of
    Minstrels can sing and play (not while running, charging or in close combat): roll a D6 on the
    Song chart, lowering the Difficulty by 1 for each additional Minstrel playing. 1-2: Lay of
    Bravery (Difficulty 7) - all friendly models within 6" automatically pass all Leadership tests
    until a new song is played; 3: Marching Medley (Difficulty 8) - friendly models within 6"
    immediately move an additional D3" (models moved into base contact count as charging; this extra
    move is not running and models may still shoot); 4: Litany of Deeds (Difficulty 9) - friendly
    models within 6" re-roll failed rolls to wound in the next round of combat; 5: Hymn of Glory
    (Difficulty 9) - friendly models within 6" may re-roll failed rolls to hit in the next round of
    combat; 6: Call to Arms (Difficulty 9) - friendly models within 6" gain +1 Attack in the next
    round of combat; Ballad of Woe (Difficulty 10) - all enemy models within 6" must pass a
    Leadership test or lose -1 Attack down to a minimum of 1 total attack; models Immune to
    Psychology ignore this song.
  source:
    manual: Broheim
    printed_page: 4
    section: Sea Elf special equipment / Lyre
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Sea%20Ghosts.pdf
  name_i18n:
    es: Lira
  effect_i18n:
    es: >-
      15 coronas de oro, Rarezza 8, solo Juglares. Instrumentos encantados hechos a mano en Ulthuan;
      el número máximo de guerreros de la banda aumenta en +1 si el grupo de Juglares lleva
      instrumentos encantados. Durante la fase de disparo, el Juglar o grupo de Juglares puede
      cantar y tocar (no corriendo, cargando ni en combate cuerpo a cuerpo): tira 1D6 en la tabla de
      Canciones, reduciendo la Dificultad en 1 por cada Juglar adicional que toque. 1-2: Cantar de
      Valentía (Dificultad 7): todos los modelos amigos a 6" superan automáticamente todos los
      chequeos de Liderazgo hasta que suene una nueva canción; 3: Compás de Marcha (Dificultad 8):
      los modelos amigos a 6" se mueven de inmediato 1D3" adicionales (los modelos que alcancen
      contacto cuentan como carga; este movimiento extra no cuenta como correr y pueden disparar);
      4: Letanía de Hazañas (Dificultad 9): los modelos amigos a 6" repiten las tiradas fallidas
      para herir en la siguiente ronda de combate; 5: Himno de Gloria (Dificultad 9): los modelos
      amigos a 6" repiten las tiradas fallidas para impactar en la siguiente ronda de combate; 6:
      Llamada a las Armas (Dificultad 9): los modelos amigos a 6" obtienen +1 Ataque en la siguiente
      ronda de combate; Balada de Pena (Dificultad 10): todos los modelos enemigos a 6" deben
      superar un chequeo de Liderazgo o perder -1 Ataque hasta un mínimo de 1 ataque en total; los
      modelos Inmunes a la Psicología ignoran esta canción.
  applies_to:
    band: true
- id: wayfinder--leader
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.sea-ghosts-mim.wayfinder.leader
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Leader
  effect: >-
    Any warrior within 6 inches of the Wayfinder may use his Leadership value instead of his own
    when taking Leadership tests.
  source:
    manual: Broheim
    printed_page: 5
    section: Heroes / Wayfinder / Special Rules / Leader
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Sea%20Ghosts.pdf
  name_i18n:
    es: Líder
  effect_i18n:
    es: >-
      Cualquier guerrero a 6 pulgadas del Buscador de Rutas puede usar su valor de Liderazgo en los
      chequeos de Liderazgo.
  applies_to:
    profile_ids:
    - wayfinder
- id: wayfinder--navigator
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.sea-ghosts-mim.wayfinder.navigator
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Navigator
  effect: >-
    Once the Wayfinder earns a captaincy aboard his own vessel he becomes Shipmaster. The Shipmaster
    can turn the tide when battles are being fought at sea. The Hero allows you to re-roll a single
    dice result per battle when within 6" of the warband's boat.
  source:
    manual: Broheim
    printed_page: 5
    section: Heroes / Wayfinder / Special Rules / Navigator
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Sea%20Ghosts.pdf
  name_i18n:
    es: Navegante
  effect_i18n:
    es: >-
      Cuando el Buscador de Rutas obtiene el mando de su propia nave se convierte en Maestro del
      Barco. El Maestro del Barco puede cambiar la marea cuando se lucha en el mar. El héroe permite
      repetir un único resultado de dado por batalla cuando esté a 6" del barco de la banda.
  applies_to:
    profile_ids:
    - wayfinder
- id: feast-master--bestial
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.sea-ghosts-mim.feast-master.bestial
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Bestial
  effect: >-
    Feast-Masters are immune to psychology. Instinctual fury overcomes them in a fight as they dance
    and strike with savage abandon. They are too feral to become the leader of the warband.
  source:
    manual: Broheim
    printed_page: 5
    section: Heroes / 0-1 Feast Master / Special Rules / Bestial
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Sea%20Ghosts.pdf
  name_i18n:
    es: Bestial
  effect_i18n:
    es: >-
      Los Maestros de Festines son inmunes a la psicología. En el combate los embarga una furia
      instintiva mientras bailan y golpean con abandonos salvajes. Son demasiado ferales para
      convertirse en el líder de la banda.
  applies_to:
    profile_ids:
    - feast-master
- id: feast-master--talismanic-tattoos
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: trait.natural-armour-save
      scope: 'YES'
      binding:
        kind: trait
        id: trait.natural-armour-save
        parameters:
          value: 6
  name: Talismanic Tattoos
  effect: >-
    Feast-Masters are adorned with all manner of tattoos and warpaint that grant them the blessing
    of their gods. A warrior with Talismanic Tattoos gains a special 6+ save that cannot be modified
    by Strength, or magic spells and abilities.
  source:
    manual: Broheim
    printed_page: 5
    section: Heroes / 0-1 Feast Master / Special Rules / Talismanic Tattoos
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Sea%20Ghosts.pdf
  name_i18n:
    es: Tatuajes Talismánicos
  effect_i18n:
    es: >-
      Los Maestros de Festines están adornados con todo tipo de tatuajes y pinturas de guerra que
      les otorgan la bendición de sus dioses. Un guerrero con Tatuajes Talismánicos gana una
      salvación especial de 6+ que no puede ser modificada por Fuerza, ni por hechizos y habilidades
      mágicas.
  applies_to:
    profile_ids:
    - feast-master
- id: feast-master--shadow-dances-of-loec
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.sea-ghosts-mim.feast-master.shadow-dances-of-loec
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Shadow Dances of Loec
  effect: >-
    Enactors of the Shadow Dances of Loec, Feast-Masters may choose a new Dance to learn from the
    Wardancer special skills list instead of learning a new skill. In each round of close combat
    that they fight Feast-Masters must choose one of the Shadow Dances to perform if able. They
    cannot choose the same dance in two consecutive turns of the same combat engagement.
  source:
    manual: Broheim
    printed_page: 5
    section: Heroes / 0-1 Feast Master / Special Rules / Shadow Dances of Loec
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Sea%20Ghosts.pdf
  name_i18n:
    es: Danzas Sombrías de Loec
  effect_i18n:
    es: >-
      Interpretes de las Danzas Sombrías de Loec, los Maestros de Festines pueden elegir aprender
      una nueva Danza de la lista de habilidades especiales de Bailarines de la Guerra en lugar de
      aprender una nueva habilidad. En cada ronda de combate cuerpo a cuerpo que luchen, los
      Maestros de Festines deben elegir una de las Danzas Sombrías para interpretar, si pueden. No
      pueden elegir la misma danza en dos turnos consecutivos del mismo enfrentamiento.
  applies_to:
    profile_ids:
    - feast-master
- id: lookouts--seeker
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.sea-ghosts-mim.lookouts.seeker
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Seeker
  effect: >-
    When rolling on the Exploration chart, the Lookout allows you modify one dice roll by -1/+1.
  source:
    manual: Broheim
    printed_page: 5
    section: Heroes / 0-2 Lookouts / Special Rules / Seeker
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Sea%20Ghosts.pdf
  name_i18n:
    es: Buscador
  effect_i18n:
    es: Al tirar en la tabla de Exploración, el Vigía permite modificar una tirada de dado en -1/+1.
  applies_to:
    profile_ids:
    - lookouts
- id: minstrels--songster
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.sea-ghosts-mim.minstrels.songster
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Songster
  effect: >-
    Invigorating deep-sea shanties and reflective Elven lays boost the morale of all those around.
    Any friendly model within 6" of the warrior may re-roll any failed Leadership test with a +1 to
    Leadership. This includes rout tests.
  source:
    manual: Broheim
    printed_page: 6
    section: Henchmen / 0-3 Minstrels / Special Rules / Songster
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Sea%20Ghosts.pdf
  name_i18n:
    es: Cantor
  effect_i18n:
    es: >-
      Las salomas del alta mar y los laúdes élficos melancólicos aumentan la moral de todos los que
      están cerca. Cualquier modelo amigo a 6" del guerrero puede repetir cualquier chequeo de
      Liderazgo fallido con +1 al Liderazgo. Esto incluye los chequeos de huida.
  applies_to:
    profile_ids:
    - minstrels
- id: minstrels--deathdancer
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.sea-ghosts-mim.minstrels.deathdancer
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Deathdancer
  effect: >-
    Occasionally a Minstrel aspires to become a Deathdancer. A Minstrel promoted to Hero may choose
    a new Dance to learn from the Wardancer special skills list instead of learning a new skill. In
    each round of close combat that they fight Deathdancers must choose one of the Shadow Dances to
    perform if able. They cannot choose the same dance in two consecutive turns of the same combat
    engagement.
  source:
    manual: Broheim
    printed_page: 6
    section: Henchmen / 0-3 Minstrels / Special Rules / Deathdancer
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Sea%20Ghosts.pdf
  name_i18n:
    es: Danzarín de la Muerte
  effect_i18n:
    es: >-
      En ocasiones un Juglar aspira a convertirse en Danzarín de la Muerte. Un Juglar ascendido a
      Héroe puede elegir aprender una nueva Danza de la lista de habilidades especiales de
      Bailarines de la Guerra en lugar de aprender una nueva habilidad. En cada ronda de combate
      cuerpo a cuerpo que luchen, los Danzarines de la Muerte deben elegir una de las Danzas
      Sombrías para interpretar, si pueden. No pueden elegir la misma danza en dos turnos
      consecutivos del mismo enfrentamiento.
  applies_to:
    profile_ids:
    - minstrels
- id: wildkin--loner
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.sea-ghosts-mim.wildkin.loner
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Loner
  effect: >-
    Wildkin never truly escape from the primal call of isolation. They are immune to All Alone tests
    and may never become the warband leader.
  source:
    manual: Broheim
    printed_page: 6
    section: Henchmen / 0-2 Wildkin / Special Rules / Loner
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Sea%20Ghosts.pdf
  name_i18n:
    es: Solitario
  effect_i18n:
    es: >-
      Los Salvajes nunca escapan verdaderamente de la llamada primigenia del aislamiento. Son
      inmunes a los chequeos de Totalmente Solo y jamás pueden convertirse en el líder de la banda.
  applies_to:
    profile_ids:
    - wildkin
- id: wildkin--animal-charmer
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.sea-ghosts-mim.wildkin.animal-charmer
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Animal Charmer (Eg. Falcon Charmer)
  effect: >-
    Wildkin can control up to five animals provided that they remain within 6" of him. If an animal
    is not within 6" of the Animal Charmer in the Movement phase, they will move D6" in a random
    direction. If that takes them into contact with a model, either friend or foe, it will attack as
    if charging.
  source:
    manual: Broheim
    printed_page: 6
    section: Henchmen / 0-2 Wildkin / Special Rules / Animal Charmer
