schema_version: 2
band_id: clockworkers-sc
rules:
- id: band--constructs
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.clockworkers-sc.band.constructs
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Constructs
  effect: >-
    Clockwork constructs differ massively from living beings and follow a number of special rules:
    Need Orders (roll a D6 at the start of your turn for each construct without a friendly hero
    within 6 inches unless it is in close combat; on 1-2 the model may neither move nor shoot this
    turn); Immune to Psychology (immune to psychology and never leaves combat); No Pain (treats
    stunned results as knocked down); May Not Run (no running, but may charge as normal); Immune to
    Poison (unaffected by poison or drugs); Brainless (gain no experience, only physical
    enhancement); In-built Equipment (once given, a weapon or armour may not be removed; constructs
    use slots instead of the normal weapon maximums, and enough equipment must be abandoned to free
    the required slots).
  source:
    manual: Broheim
    printed_page: 1
    section: Special skills / Constructs
    url: https://broheim.net/downloads/warbands/supplement/sealedcity/Clockworkers.pdf
  name_i18n:
    es: Constructos
  effect_i18n:
    es: >-
      Los constructos de cuerda difieren enormemente de los seres vivos y siguen una serie de reglas
      especiales: Necesitan Órdenes (tira 1D6 al inicio de tu turno por cada constructo sin un héroe
      amigo a 6 pulgadas, salvo que esté en combate cuerpo a cuerpo; con 1-2 el modelo no puede
      moverse ni disparar ese turno); Inmunes a la Psicología (inmunes a la psicología y nunca
      abandonan el combate); Sin Dolor (tratan los resultados aturdido como derribado); No Pueden
      Correr (no pueden correr, pero pueden cargar con normalidad); Inmunes al Veneno (no les
      afectan venenos ni drogas); Carentes de Mente (no ganan experiencia, solo pueden mejorarse
      físicamente); Equipo Integrado (una vez dado, un arma o armadura no puede retirarse; los
      constructos usan ranuras en lugar del máximo normal de armas, y debe abandonarse equipo
      suficiente para liberar las ranuras necesarias).
  applies_to:
    band: true
- id: master-of-clocks--leader
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.clockworkers-sc.master-of-clocks.leader
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Leader
  effect: >-
    Any warrior within 6 inches of the Master of Clocks may use his Leadership instead of his own.
  source:
    manual: Broheim
    printed_page: 3
    section: 1 Master of Clocks / Special Rules / Leader
    url: https://broheim.net/downloads/warbands/supplement/sealedcity/Clockworkers.pdf
  name_i18n:
    es: Líder
  effect_i18n:
    es: >-
      Cualquier guerrero a 6 pulgadas del Maestro de los Relojes puede usar su Liderazgo en lugar
      del propio.
  applies_to:
    profile_ids:
    - master-of-clocks
- id: master-of-clocks--laws-of-construction
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.clockworkers-sc.master-of-clocks.laws-of-construction
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: no effect applies to the current engine scope.
  name: Laws of Construction
  effect: >-
    The Master of Clocks is able to overwrite the basic functions of his constructs and thus starts
    with one Law of Construction. Laws are not spells: protection against spells does not affect
    them and they may be used like prayers even while wearing armour. The six Laws are Offense
    (difficulty 7), Motion (6), Defense (7), Sacrifice (9), Protection (7) and Rampage (10).
  source:
    manual: Broheim
    printed_page: 6
    section: Laws of Construction
    url: https://broheim.net/downloads/warbands/supplement/sealedcity/Clockworkers.pdf
  name_i18n:
    es: Leyes de la Construcción
  effect_i18n:
    es: >-
      El Maestro de los Relojes puede sobrescribir las funciones básicas de sus constructos y por
      ello comienza con una Ley de la Construcción. Las Leyes no son hechizos: la protección contra
      hechizos no las afecta y pueden usarse como plegarias incluso llevando armadura. Las seis
      Leyes son Ofensiva (dificultad 7), Movimiento (6), Defensa (7), Sacrificio (9), Protección (7)
      y Devastación (10).
  applies_to:
    profile_ids:
    - master-of-clocks
- id: master-of-clocks--promotion
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.clockworkers-sc.master-of-clocks.promotion
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Promotion
  effect: >-
    If the Master of Clocks dies or otherwise leaves the expedition, the new leader may learn Laws
    of Construction on subsequent skill advances.
  source:
    manual: Broheim
    printed_page: 3
    section: 1 Master of Clocks / Special Rules / Promotion
    url: https://broheim.net/downloads/warbands/supplement/sealedcity/Clockworkers.pdf
  name_i18n:
    es: Ascenso
  effect_i18n:
    es: >-
      Si el Maestro de los Relojes muere o abandona la expedición por otro motivo, el nuevo líder
      puede aprender Leyes de la Construcción en mejoras de habilidad posteriores.
  applies_to:
    profile_ids:
    - master-of-clocks
