  applies_to:
    profile_ids:
    - clockwork-soldiers
- id: clockwork-fiend--construct
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.clockworkers-sc.clockwork-fiend.construct
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Construct
  effect: Clockwork fiends are constructs as described in the band special rules.
  source:
    manual: broheim.net
    printed_page: 5
    section: 0-1 Clockwork fiend / Special Rules / Construct
    url: https://broheim.net/downloads/warbands/supplement/sealedcity/Clockworkers.pdf
  name_i18n:
    es: Constructo
  effect_i18n:
    es: >-
      Los demonios de cuerda son constructos, tal como se describe en las reglas especiales de la
      banda.
  applies_to:
    profile_ids:
    - clockwork-fiend
- id: clockwork-fiend--cause-fear
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.clockworkers-sc.clockwork-fiend.cause-fear
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Cause Fear
  effect: Clockwork fiends are terrifying giants made of weapons and brass and therefore cause fear.
  source:
    manual: broheim.net
    printed_page: 5
    section: 0-1 Clockwork fiend / Special Rules / Cause fear
    url: https://broheim.net/downloads/warbands/supplement/sealedcity/Clockworkers.pdf
  name_i18n:
    es: Causar Miedo
  effect_i18n:
    es: >-
      Los demonios de cuerda son gigantes terroríficos hechos de armas y latón, y por tanto causan
      miedo.
  applies_to:
    profile_ids:
    - clockwork-fiend
- id: clockwork-fiend--large-target
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.clockworkers-sc.clockwork-fiend.large-target
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: no effect applies to the current engine scope.
  name: Large Target
  effect: Due to its huge size, the Clockwork fiend counts as a large target.
  source:
    manual: broheim.net
    printed_page: 5
    section: 0-1 Clockwork fiend / Special Rules / Large target
    url: https://broheim.net/downloads/warbands/supplement/sealedcity/Clockworkers.pdf
  name_i18n:
    es: Objetivo Grande
  effect_i18n:
    es: Debido a su enorme tamaño, el Demonio de Cuerda cuenta como objetivo grande.
  applies_to:
    profile_ids:
    - clockwork-fiend
- id: clockwork-fiend--lumbering-behemoth
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.clockworkers-sc.clockwork-fiend.lumbering-behemoth
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Lumbering Behemoth
  effect: >-
    Moonstone infusions need the doubled amount of orichalcum tokens per characteristic increase.
  source:
    manual: broheim.net
    printed_page: 5
    section: 0-1 Clockwork fiend / Special Rules / Lumbering behemoth
    url: https://broheim.net/downloads/warbands/supplement/sealedcity/Clockworkers.pdf
  name_i18n:
    es: Coloso Torpe
  effect_i18n:
    es: >-
      Las infusiones de piedra lunar necesitan el doble de fichas de oricalco por cada aumento de
      característica.
  applies_to:
    profile_ids:
    - clockwork-fiend
- id: band--skill-puppeteer
  kind: warband_skill
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.clockworkers-sc.band.puppeteer
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: ignoring the Need Orders special rule is a construct-control interaction of the
        engine's clockwork subsystem.
  name: Puppeteer
  effect: >-
    The Hero has improved control on the dependent constructs far above the basic level of his
    colleagues. Any construct within 12" of the hero may ignore the Need Orders special rule.
  source:
    manual: broheim.net
    printed_page: 2
    section: Special skills / Puppeteer
    url: https://broheim.net/downloads/warbands/supplement/sealedcity/Clockworkers.pdf
  name_i18n:
    es: Titiritero
  effect_i18n:
    es: >-
      El Héroe tiene un control de los constructos dependientes muy superior al nivel básico de sus
      colegas. Cualquier constructo a 12" o menos del héroe puede ignorar la regla especial Necesita
      Órdenes.
  applies_to:
    band: true
- id: band--skill-rogue-control
  kind: warband_skill
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.clockworkers-sc.band.rogue-control
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: disabling an enemy construct substitutes a shooting attack, a shooting-phase mechanic.
  name: Rogue Control
  effect: >-
    Subtle and cunning counter-orders allow the Clockworker to dazzle enemy constructs and clockwork
    mechanisms. Instead of shooting a missile weapon the hero can choose a single construct or clockwork
    weapon within 12" and line of sight. Roll 2D6 and compare the result with the construct's or weapon
    bearer's Leadership: if the result is higher, the target ceases function until the Clockworkers'
    next Movement phase.
  source:
    manual: broheim.net
    printed_page: 2
    section: Special skills / Rogue control
    url: https://broheim.net/downloads/warbands/supplement/sealedcity/Clockworkers.pdf
  name_i18n:
    es: Control Rebelde
  effect_i18n:
    es: >-
      Contraórdenes sutiles y astutas permiten al Relojero deslumbrar a los constructos y mecanismos de
      relojería enemigos. En lugar de disparar un arma a distancia, el héroe puede elegir un único
      constructo o arma de relojería a 12" o menos y con línea de visión. Tira 2D6 y compara el resultado
      con el Liderazgo del constructo o del portador del arma: si el resultado es superior, el objetivo
      deja de funcionar hasta la siguiente fase de Movimiento de los Relojeros.
  applies_to:
    band: true
- id: band--skill-gift-of-sentience
  kind: warband_skill
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.clockworkers-sc.band.gift-of-sentience
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: spending moonstones and swapping a search for an experiment is a post-battle sequence
        mechanic.
  name: Gift of Sentience
  effect: >-
    Instead of searching for rare items the Clockworker may attempt Bramstetter's most dangerous
    experiment - crafting a mind for a construct's empty shell. The experiment consumes D3 Moonstones
    and evokes a single Clockwork soldier to the slow process of getting sentient. The construct loses
    the following special rules: Need Orders, Immune to Psychology and Brainless. Re-roll any result of
    'That Lad's got talent' when rolling for advances.
  source:
    manual: broheim.net
    printed_page: 2
    section: Special skills / Gift of Sentience
    url: https://broheim.net/downloads/warbands/supplement/sealedcity/Clockworkers.pdf
  name_i18n:
    es: Don de la Sensibilidad
  effect_i18n:
    es: >-
      En lugar de buscar objetos raros, el Relojero puede intentar el experimento más peligroso de
      Bramstetter: crear una mente para el cascarón vacío de un constructo. El experimento consume D3
      Piedras Lunares y lleva a un único soldado de relojería por el lento proceso de volverse sintiente.
      El constructo pierde las siguientes reglas especiales: Necesita Órdenes, Inmune a la Psicología y
      Sin Cerebro. Repite cualquier resultado de 'Ese chaval tiene talento' al tirar las mejoras.
  applies_to:
    band: true
- id: band--skill-experimental-enhancements
  kind: warband_skill
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.clockworkers-sc.band.experimental-enhancements
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: spending gold for materials and rolling on the Stygian Mutation Chart is a post-battle
        sequence mechanic. Apprentice only.
  name: Experimental Enhancements
  effect: >-
    Apprentice only. During their learning process, apprentices craft the oddest devices and
    enhancements. They don't even know by themselves, what the result will look like, until it stands in
    front of them. Instead of searching for rare items, the apprentice may work on one construct. He
    needs 3D6 gc for materials to roll on the Stygian Mutation chart and apply the result to one of your
    constructs.
  source:
    manual: broheim.net
    printed_page: 2
    section: Special skills / Experimental enhancements
    url: https://broheim.net/downloads/warbands/supplement/sealedcity/Clockworkers.pdf
  name_i18n:
    es: Mejoras Experimentales
  effect_i18n:
    es: >-
      Solo Aprendiz. Durante su proceso de aprendizaje, los aprendices fabrican los artilugios y mejoras
      más extraños. Ni ellos mismos saben qué aspecto tendrá el resultado hasta que lo tienen delante. En
      lugar de buscar objetos raros, el aprendiz puede trabajar en un constructo. Necesita 3D6 gc en
      materiales para tirar en la tabla de Mutaciones Estigias y aplicar el resultado a uno de tus
      constructos.
  applies_to:
    band: true
