    url: https://broheim.net/downloads/warbands/supplement/sealedcity/Clockworkers.pdf
  name_i18n:
    es: Constructo
  effect_i18n:
    es: >-
      Los soldados de cuerda son constructos, tal como se describe en las reglas especiales de la
      banda.
  applies_to:
    profile_ids:
    - clockwork-soldiers
- id: clockwork-soldiers--solitary-maintenance
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.clockworkers-sc.clockwork-soldiers.solitary-maintenance
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Solitary Maintenance
  effect: Each clockwork soldier forms its own henchmen group.
  source:
    manual: broheim.net
    printed_page: 5
    section: 0-5 Clockwork soldiers / Special Rules / Solitary maintenance
    url: https://broheim.net/downloads/warbands/supplement/sealedcity/Clockworkers.pdf
  name_i18n:
