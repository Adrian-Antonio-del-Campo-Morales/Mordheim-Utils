  name: Hellish Tincture
  effect: >-
    Once per game this tincture may be thrown in the same way as blessed water and sets its target
    on fire. However, if you roll a 1 to hit, the clumsy hero is set on fire instead.
  source:
    manual: Broheim
    printed_page: 4
    section: 0-1 Metallurgist / Special Rules / Hellish tincture
    url: https://broheim.net/downloads/warbands/supplement/sealedcity/Clockworkers.pdf
  name_i18n:
    es: Tintura Infernal
  effect_i18n:
    es: >-
      Una vez por partida esta tintura puede lanzarse del mismo modo que el agua bendita y prende
      fuego a su objetivo. Sin embargo, si sacas un 1 para impactar, el héroe torpe acaba ardiendo
      en su lugar.
  applies_to:
    profile_ids:
    - metallurgist
