- id: dwarf-engineer--smithery
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.clockworkers-sc.dwarf-engineer.smithery
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Smithery
  effect: >-
    Instead of searching for rare items, the engineer may equip a single construct with any weapon
    he can lay his hands on. Two-handed and missile weapons take up 2 slots, other weapons need 1
    slot.
  source:
    manual: broheim.net
    printed_page: 3
    section: 0-1 Dwarf engineer / Special Rules / Smithery
    url: https://broheim.net/downloads/warbands/supplement/sealedcity/Clockworkers.pdf
  name_i18n:
    es: Herrería
  effect_i18n:
    es: >-
      En lugar de buscar objetos raros, el ingeniero puede equipar un único constructo con cualquier
      arma que pueda conseguir. Las armas a dos manos y las de misil ocupan 2 ranuras; las demás
      armas necesitan 1 ranura.
  applies_to:
    profile_ids:
    - dwarf-engineer
- id: metallurgist--moonstone-refinery
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.clockworkers-sc.metallurgist.moonstone-refinery
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Moonstone Refinery
  effect: >-
    Instead of searching for rare items, the Metallurgist may split one moonstone into D6 orichalcum
    tokens.
  source:
    manual: broheim.net
    printed_page: 4
    section: 0-1 Metallurgist / Special Rules / Moonstone refinery
    url: https://broheim.net/downloads/warbands/supplement/sealedcity/Clockworkers.pdf
  name_i18n:
    es: Refinería de Piedra Lunar
  effect_i18n:
    es: >-
      En lugar de buscar objetos raros, el Metalúrgico puede dividir una piedra lunar en D6 fichas
      de oricalco.
  applies_to:
    profile_ids:
    - metallurgist
- id: metallurgist--hellish-tincture
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.clockworkers-sc.metallurgist.hellish-tincture
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: no effect applies to the current engine scope.
  name: Hellish Tincture
  effect: >-
    Once per game this tincture may be thrown in the same way as blessed water and sets its target
    on fire. However, if you roll a 1 to hit, the clumsy hero is set on fire instead.
  source:
    manual: broheim.net
    printed_page: 4
    section: 0-1 Metallurgist / Special Rules / Hellish tincture
    url: https://broheim.net/downloads/warbands/supplement/sealedcity/Clockworkers.pdf
  name_i18n:
    es: Tintura Infernal
  effect_i18n:
    es: >-
      Una vez por partida esta tintura puede lanzarse del mismo modo que el agua bendita y prende
      fuego a su objetivo. Sin embargo, si sacas un 1 para impactar, el héroe torpe acaba ardiendo
      en su lugar.
  applies_to:
    profile_ids:
    - metallurgist
- id: handymen--crude
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.clockworkers-sc.handymen.crude
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Crude
  effect: >-
    When rolling 'That Lad's got talent', the new hero must choose combat and strength skills as his
    two skill lists.
  source:
    manual: broheim.net
    printed_page: 5
    section: Handymen / Special Rules / Crude
    url: https://broheim.net/downloads/warbands/supplement/sealedcity/Clockworkers.pdf
  name_i18n:
    es: Tosco
  effect_i18n:
    es: >-
      Al sacar 'el chaval tiene talento', el nuevo héroe debe elegir combate y fuerza como sus dos
      listas de habilidades.
  applies_to:
    profile_ids:
    - handymen
- id: clockwork-soldiers--construct
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.clockworkers-sc.clockwork-soldiers.construct
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Construct
  effect: Clockwork soldiers are constructs as described in the band special rules.
  source:
    manual: broheim.net
    printed_page: 5
