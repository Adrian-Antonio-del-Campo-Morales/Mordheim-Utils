      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Slow Witted
  effect: >-
    Although Ogres are capable of earning experience and bettering themselves they are not the
    smartest of creatures. Ogres only gain advances at half the rate of everyone else.
  source:
    manual: Broheim
    printed_page: 11
    section: Henchmen / 0-1 Ogre Bodyguard / Special Rules / Slow Witted
    url: https://broheim.net/downloads/fo/97RelicsoftheCrusadesPt2.pdf
  name_i18n:
    es: Cortos de Mente
  effect_i18n:
    es: >-
      Aunque los ogros son capaces de ganar experiencia y superarse, no son las criaturas más
      inteligentes. Los ogros solo ganan avances a la mitad de velocidad que el resto.
  applies_to:
    profile_ids:
    - ogre-bodyguard
