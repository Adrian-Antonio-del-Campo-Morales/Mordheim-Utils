  name: Large
  effect: >-
    Ogres are huge, lumbering creatures and therefore make tempting targets for archers. Any model
    may shoot at an Ogre, even if it is not the closest target.
  source:
    manual: Broheim
    printed_page: 11
    section: Henchmen / 0-1 Ogre Bodyguard / Special Rules / Large
    url: https://broheim.net/downloads/fo/97RelicsoftheCrusadesPt2.pdf
  name_i18n:
    es: Grande
  effect_i18n:
    es: >-
      Los ogros son criaturas enormes y torpes que por tanto constituyen blancos tentadores para los
      arqueros. Cualquier modelo puede disparar a un Ogro, aunque no sea el objetivo más cercano.
  applies_to:
    profile_ids:
    - ogre-bodyguard
- id: ogre-bodyguard--slow-witted
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
