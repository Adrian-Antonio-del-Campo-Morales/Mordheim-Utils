schema_version: 2
band_id: slavers-rel
rules:
- id: band--extra-treasure
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.slavers-rel.band.extra-treasure
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Extra Treasure
  effect: >-
    There are a lot of dinars to be made in the slave trade. As such a slaver warband will always
    count as gaining an extra piece of Treasure (as he sells non-fighting slaves) after every
    battle.
  source:
    manual: Broheim
    printed_page: 9
    section: Slavers / Special rules
    url: https://broheim.net/downloads/fo/97RelicsoftheCrusadesPt2.pdf
  name_i18n:
    es: Tesoro Adicional
  effect_i18n:
    es: >-
      Hay muchos dinares que ganar en el comercio de esclavos. Por ello, una banda esclavista
      siempre contará como si obtuviera una pieza adicional de Tesoro (al vender esclavos no
      combatientes) después de cada batalla.
  applies_to:
    band: true
- id: band--slaves-talent-advance
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.slavers-rel.band.slaves-talent-advance
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Lad's Got the Talent (Slaves)
  effect: >-
    Slaves will generally be ill-treated by a slave merchant. If any slave achieves the 'Lad's got
    the Talent' advance, then the slave must make a leadership test. If it is passed then the slave
    merchant sees some potential and loyalty in the slave and frees him. The slave retains his
    statistic line though his type is changed to caravan guard. This means that he now may become a
    warband leader and loses all the special rules associated with being a slave, such as stupidity
    etc. However, if the slave fails his leadership test then the slave merchant is displeased with
    his outspoken property. The slave obviously needs to learn his place and the overseer sets to it
    with relish. After the screams and begging ends, the slave is nigh immune to pain and obeys his
    master without question. The slave is removed from your warband list and becomes a new eunuch in
    his own henchman group. Roll advances for any slave left in the henchman group as normal.
  source:
    manual: Broheim
    printed_page: 9
    section: Slavers / Special rules
    url: https://broheim.net/downloads/fo/97RelicsoftheCrusadesPt2.pdf
  name_i18n:
    es: Chico con Talento (esclavos)
  effect_i18n:
    es: >-
      Los esclavos suelen ser maltratados por el mercader de esclavos. Si algún esclavo logra el
      avance 'Chico con Talento', debe hacer un chequeo de liderazgo. Si lo supera, el mercader ve
      potencial y lealtad en el esclavo y lo libera. El esclavo conserva su línea de estadísticas
      aunque su tipo cambia a guardián de caravana; esto significa que ahora puede convertirse en
      líder de banda y pierde todas las reglas especiales asociadas a ser esclavo, como estupidez,
      etc. Si el esclavo falla su chequeo de liderazgo, el mercader está descontento con su
      propiedad tan habladora. Obviamente el esclavo necesita aprender su lugar y el capataz se
      encarga con entusiasmo. Cuando terminan los gritos y las súplicas, el esclavo es casi inmune
      al dolor y obedece a su amo sin preguntas. El esclavo se retira de la lista de la banda y se
      convierte en un nuevo eunuco en su propio grupo de secuaces. Tira avances para cualquier
      esclavo que quede en el grupo de secuaces con normalidad.
  applies_to:
    band: true
- id: band--hiring-restrictions
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.slavers-rel.band.hiring-restrictions
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Hiring Restrictions (Slaves)
  effect: >-
    It is not a mistake that a slaver warband may have up to 20 warriors, yet the restrictions on
    hiring warband members will give you a maximum of 12. This is because a slave merchant isn't
    much of a slave merchant if he doesn't have any slaves, so he'll need to buy some if he wants to
    make up the numbers.
  source:
    manual: Broheim
    printed_page: 9
    section: Slavers / Special rules
    url: https://broheim.net/downloads/fo/97RelicsoftheCrusadesPt2.pdf
  name_i18n:
    es: Restricciones de contratación (esclavos)
  effect_i18n:
    es: >-
      No es un error que una banda esclavista pueda tener hasta 20 guerreros, aunque las
      restricciones de contratación de miembros te dan un máximo de 12. Esto se debe a que un
      mercader de esclavos no es mucho mercader sin esclavos, así que tendrá que comprar algunos si
      quiere completar los números.
  applies_to:
    band: true
- id: band--slaver-special-equipment
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.slavers-rel.band.slaver-special-equipment
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Slaver Special Equipment
  effect: >-
    This equipment is only available to Slavers, and no other warbands may purchase it. Trapper's
    pole (15 dinars, Rare 6): used for capturing beasts at arms length, a trapper's pole makes use
    of a noose attached to a long pole; it works exactly like a spear with the following special
    rule - Trapper: keep track of a living, non-experience-gaining animal (which includes horses,
    dogs, giant rats and boars) that a warrior armed with a trapper's pole takes out of action; if a
    1 or 2 is rolled for the animal when working out injuries it will be added to the trapper's
    warband. Manacles (20+D6 dinars, Rare 8): a handy device for slavers made of metal, often
    rusted, and always uncomfortable; You're mine - keep track of any living henchmen that a warrior
    equipped with manacles takes out of action; if a 1 is rolled for the henchmen when working out
    injuries he will be added to the slaver warband if he is human; as the warrior will need to have
    his spirit broken he will lose all his possessions and will have all the statistics as a new
    slave; if the henchman is a non-human then he may be sold for 2D6 dinars.
  source:
    manual: Broheim
    printed_page: 10
    section: Slaver special equipment
    url: https://broheim.net/downloads/fo/97RelicsoftheCrusadesPt2.pdf
  name_i18n:
    es: Equipo Especial de los Esclavistas
  effect_i18n:
    es: >-
      Este equipo solo está disponible para los Esclavistas; ninguna otra banda puede comprarlo.
      Palo de trampero (15 coronas, Rareza 6): usado para capturar bestias a distancia de brazos,
      emplea un lazo sujeto a un palo largo; funciona exactamente como una lanza con la siguiente
      regla especial - Trampero: registra cualquier animal vivo que no gane experiencia (incluye
      caballos, perros, ratas gigantes y jabalíes) que un guerrero armado con palo de trampero deje
      fuera de combate; si al resolver sus heridas se saca un 1 o 2 para el animal, se añade a la
      banda del trampero. Grilletes (20+1D6 coronas, Rareza 8): un útil artilugio de metal para
      esclavistas, a menudo oxidado y siempre incómodo; Es mío - registra cualquier secuaz vivo que
      un guerrero equipado con grilletes deje fuera de combate; si al resolver sus heridas sale un
      1, el secuaz se añade a la banda esclavista si es humano; como necesitará que le quiebren el
      espíritu, perderá todas sus posesiones y tendrá todas las estadísticas de un esclavo nuevo; si
      el secuaz no es humano, puede venderse por 2D6 dinares.
  applies_to:
    band: true
