  name: Fear
  effect: Ogres are large, threatening creatures that cause fear.
  source:
    manual: Broheim
    printed_page: 11
    section: Henchmen / 0-1 Ogre Bodyguard / Special Rules / Fear
    url: https://broheim.net/downloads/fo/97RelicsoftheCrusadesPt2.pdf
  name_i18n:
    es: Miedo
  effect_i18n:
    es: Los ogros son criaturas grandes y amenazantes que causan miedo.
  applies_to:
    profile_ids:
    - ogre-bodyguard
