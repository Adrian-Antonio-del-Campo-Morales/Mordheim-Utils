  effect: Hounds are animals and do not gain experience.
  source:
    manual: Broheim
    printed_page: 11
    section: Henchmen / 0-5 Hounds / Special Rules / Experience
    url: https://broheim.net/downloads/fo/97RelicsoftheCrusadesPt2.pdf
  name_i18n:
    es: Experiencia
  effect_i18n:
    es: Los sabuesos son animales y no ganan experiencia.
  applies_to:
    profile_ids:
    - hounds
- id: hounds--keen-scent
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.slavers-rel.hounds.keen-scent
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Keen Scent
  effect: >-
    Hounds will be able to locate the scent of an escaped slave over vast distances. If the warband
    includes a Hound, slaves will ignore the I'm outta here special rule.
  source:
    manual: Broheim
    printed_page: 11
    section: Henchmen / 0-5 Hounds / Special Rules / Keen Scent
    url: https://broheim.net/downloads/fo/97RelicsoftheCrusadesPt2.pdf
  name_i18n:
    es: Olfato Fino
  effect_i18n:
    es: >-
      Los sabuesos pueden rastrear el olor de un esclavo fugado a grandes distancias. Si la banda
      incluye un Sabueso, los esclavos ignorarán la regla especial de Me largo de aquí.
  applies_to:
    profile_ids:
    - hounds
