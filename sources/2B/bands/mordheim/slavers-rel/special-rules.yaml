        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Leader
  effect: Any warrior within 6" of the Slave Merchant may use his Leadership instead of his own.
  source:
    manual: Broheim
    printed_page: 11
    section: Heroes / 1 Slave merchant / Special Rules / Leader
    url: https://broheim.net/downloads/fo/97RelicsoftheCrusadesPt2.pdf
  name_i18n:
    es: Líder
  effect_i18n:
    es: >-
      Cualquier guerrero a 6" del Mercader de Esclavos puede usar su Liderazgo en lugar del propio.
  applies_to:
    profile_ids:
    - slave-merchant
- id: overseer--slave-driver
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.slavers-rel.overseer.slave-driver
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Slave Driver
  effect: >-
    An Overseer strikes fear into his slaves. Any slave within 3" may use his leadership. If he is
    armed with a scourge, this increases to 6".
  source:
    manual: Broheim
    printed_page: 11
    section: Heroes / 0-1 Overseer / Special Rules / Slave Driver
    url: https://broheim.net/downloads/fo/97RelicsoftheCrusadesPt2.pdf
  name_i18n:
    es: Latigador de Esclavos
  effect_i18n:
    es: >-
      Un Capataz infunde miedo a sus esclavos. Cualquier esclavo a 3" puede usar su liderazgo. Si va
      armado con un azote, el alcance aumenta a 6".
  applies_to:
    profile_ids:
    - overseer
- id: eunuchs--broken-spirit
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.slavers-rel.eunuchs.broken-spirit
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Broken Spirit
  effect: >-
    A Eunuch will automatically pass any Leadership test he is required to make, as long as the
    Slave Merchant is not out of action. A Eunuch may never become a warband leader.
  source:
    manual: Broheim
    printed_page: 11
    section: Henchmen / 0-5 Eunuchs / Special Rules / Broken Spirit
    url: https://broheim.net/downloads/fo/97RelicsoftheCrusadesPt2.pdf
  name_i18n:
    es: Espíritu Quebrado
  effect_i18n:
    es: >-
      Un Eunuco superará automáticamente cualquier chequeo de Liderazgo que deba hacer, mientras el
      Mercader de Esclavos no esté fuera de combate. Un Eunuco jamás puede convertirse en líder de
      la banda.
  applies_to:
    profile_ids:
    - eunuchs
