schema_version: 2
band_id: clan-angrund-kep
equipment_lists:
- id: dwarf-warrior-equipment-list
  name: Dwarf Warrior Equipment List
  items:
  - item_id: dagger
    cost: 2
    notes: 1st free/2 gc
    notes_i18n:
      es: Primera daga gratis; las siguientes cuestan 2 co.
  - item_id: mace
    cost: 3
  - item_id: hammer
    cost: 3
  - item_id: axe
    cost: 5
  - item_id: dwarf_axe
    cost: 15
    notes: Special weapon, see Special Weapons / Dwarf Axe. Rare (Dwarfs only).
    notes_i18n:
      es: Arma especial, ver Armas Especiales / Hacha Enana. Raro (solo enanos).
  - item_id: sword
    cost: 10
  - item_id: two_handed_weapon
    cost: 15
  - item_id: spear
    cost: 10
  - item_id: halberd
    cost: 10
  - item_id: gromril_weapon
    cost: 3
    notes: 3 times the cost. Any weapon a Dwarf may normally purchase may be bought as a Gromril weapon instead; the price shown is just used for creating the warband, later purchases use the price chart
      in the rules.
    notes_i18n:
      es: 3 veces el coste. Cualquier arma que un enano pueda comprar normalmente puede comprarse en su versión de Gromril; el precio mostrado solo se usa al crear la banda, las compras posteriores usan
        la tabla de precios de las reglas.
  - item_id: pistol
    cost: 15
  - item_id: light_armour
    cost: 20
  - item_id: heavy_armour
    cost: 50
  - item_id: gromril_armour
    cost: 75
    notes: The price of a suit of Gromril armour is cheaper for a starting warband to represent the relative ease with which Dwarfs can find such items in their own stronghold; later purchases must be done
      using the normal price chart in the Mordheim rules.
    notes_i18n:
      es: El precio de una armadura de Gromril es más barato para una banda inicial para representar la relativa facilidad con que los enanos encuentran tales objetos en su propia fortaleza; las compras
        posteriores deben hacerse usando la tabla de precios normal de las reglas de Mordheim.
  - item_id: shield
    cost: 5
  - item_id: helmet
    cost: 10
  source:
    manual: broheim.net
    printed_page: 17
    section: Dwarf Equipment Lists / Dwarf Warrior Equipment List
    url: https://broheim.net/downloads/campaigns/karakazgal/Karak Azgal.pdf
  name_i18n:
    es: Lista de Equipo de los Guerreros Enanos
