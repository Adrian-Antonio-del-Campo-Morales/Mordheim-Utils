- id: band--hate-skavens-orcs-and-goblins
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.clan-angrund-kep.band.hate-skavens-orcs-and-goblins
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: psychology. This variant adds Skavens to the standard Dwarf hatred (Orcs
        and Goblins); resolves against shared-rule.hate-orcs-and-goblins at the equivalence review.
  name: Hate Skavens, Orcs and Goblins
  effect: >-
    All Dwarfs hate Skavens, Orcs and Goblins. See the Psychology section of the Mordheim rules for
    details on the effects of hatred.
  source:
    manual: broheim.net
    printed_page: 16
    section: Special Rules / Hate Skavens, Orcs and Goblins
    url: https://broheim.net/downloads/campaigns/karakazgal/Karak Azgal.pdf
  name_i18n:
    es: Odian a los Skaven, Orcos y Goblins
  effect_i18n:
    es: >-
      Todos los Enanos odian a los Skaven, Orcos y Goblins. Consulta la sección de Psicología de las
      reglas de Mordheim para más detalles sobre los efectos del odio.
  applies_to:
    band: true
