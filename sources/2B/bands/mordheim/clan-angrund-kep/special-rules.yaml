- id: dwarf-troll-slayers--slayer-skills
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: profile.skill-access
      scope: 'YES'
      binding:
        kind: profile
        id: profile.skill-access
        parameters:
          category: special
  name: Slayer Skills
  effect: >-
    Troll Slayers may choose a kill from the Troll Slayer skill table instead of the normal skill
    table when they gain a new skill.
  source:
    manual: broheim.net
    printed_page: 20
    section: Heroes / 0-1 Dwarf Troll Slayer / Special Rules / Slayer Kills
    url: https://broheim.net/downloads/campaigns/karakazgal/Karak Azgal.pdf
  name_i18n:
    es: Habilidades de Matatrolles
  effect_i18n:
    es: >-
      Los Matatrolles pueden escoger una habilidad de la Tabla de Habilidades de Matatrolles en
      lugar de la tabla de habilidades normal cuando ganan una habilidad nueva.
  applies_to:
    profile_ids:
    - dwarf-troll-slayers
- id: ironbreaker--watch-out
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.clan-angrund-kep.ironbreaker.watch-out
      scope: LATER
      binding: null
      reason: >-
        Exploration/encounter-table mechanic of the Karak Eight Peaks campaign; outside the current
        engine scope.
  name: Watch Out!
  effect: >-
    An Ironbreaker knows all about the Underdeep and its perils and so he or any Dwarf 6" away may
    decide to reroll the result on the Encounter table that affects them.
  source:
    manual: broheim.net
    printed_page: 20
    section: Heroes / 0-1 Ironbreaker / Special Rules / Watch Out!
    url: https://broheim.net/downloads/campaigns/karakazgal/Karak Azgal.pdf
  name_i18n:
    es: ¡Cuidado!
  effect_i18n:
    es: >-
      Un Rompehierros conoce todas las profundidades y sus peligros, de modo que él o cualquier
      Enano a 6" puede decidir repetir el resultado en la tabla de Encuentros que les afecta.
  applies_to:
    profile_ids:
    - ironbreaker
- id: band--dwarf-special-skills-master-of-blades
  kind: warband_skill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: skill.unbeatable-warrior
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.unbeatable-warrior
    - id: skill.sword-master
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.sword-master
  name: Master of Blades
  effect: >-
    This Dwarf's martial skills surpass those of a normal warrior; he has fought unscathed against
    hordes of Orcs and Goblins. When using a weapon that has a Parry special rule, this hero parries
    successfully if he beats or matches his opponent's highest 'to hit' roll, not just if he beats
    the roll. In addition, if this warrior is using two weapons that have the Parry special rule, he
    is allowed to parry two attacks (if his two dice match or beat the two highest Attack dice
    against him) instead of the normal maximum of one. Note that if this Dwarf has two Dwarf axes
    (as detailed above) he can reroll any failed parries.
  source:
    manual: broheim.net
    printed_page: 22
    section: Dwarf Special Skills / Master of Blades
    url: https://broheim.net/downloads/campaigns/karakazgal/Karak Azgal.pdf
  name_i18n:
    es: Maestro de las Hojas
  effect_i18n:
    es: >-
      Las habilidades marciales de este Enano superan a las de un guerrero normal; ha luchado sin un
      rasguño contra hordas de Orcos y Goblins. Al usar un arma que tenga la regla especial Parada,
      este héroe para con éxito si iguala o supera la tirada más alta «por impactar» de su oponente,
      no solo si la supera. Además, si este guerrero usa dos armas que tienen la regla especial
      Parada, puede parar dos ataques (si sus dos dados igualan o superan los dos dados de Ataque
      más altos contra él) en lugar del máximo normal de uno. Ten en cuenta que si este Enano lleva
      dos hachas Enanas (como se detalla arriba) puede repetir cualquier parada fallida.
  applies_to:
    band: true
