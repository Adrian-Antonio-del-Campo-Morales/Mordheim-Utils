schema_version: 2
band_id: bretonnian-buccaneers-sar
rules:
- id: band--pirate-rules
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.bretonnian-buccaneers-sar.band.pirate-rules
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: General Pirate Rules
  effect: >-
    Swabbies: Human Pirates take human Swabbies (see the rules for capturing Swabbies in the Sartosa
    campaign rules). Hired Swords: unless noted otherwise, Pirate Warbands have the same access to
    Hired Swords & any other items as for a regular human Mercenary Warband; they must however pay
    an additional +20 gc in upkeep if they have both Dwarfs and Elves together in the same warband
    (the ship is only so big!). Swivel Guns are Rare, Matey!: except for Sartosan Pirates, no Pirate
    Warband may start with a Swivel Gun on their roster in campaign games; if playing a one-off
    game, non-Sartosans may purchase a Swivel Gun for an additional price of 2D6 gc. Succession: if
    the Captain is killed, one of the Mates will take over in the same manner as a Champion taking
    over for a Mercenary warband.
  source:
    manual: broheim.net
    printed_page: 1
    section: Pirate special rules
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Human%20Pirates.pdf
  name_i18n:
    es: Reglas Generales de Piratas
  effect_i18n:
    es: >-
      Fregones: los Piratas Humanos llevan Fregones humanos (ver las reglas para capturar Fregones
      en las reglas de campaña de Sartosa). Espadas a Sueldo: salvo indicación contraria, las bandas
      de Piratas tienen el mismo acceso a Espadas a Sueldo y objetos que una banda mercenaria humana
      normal; sin embargo, deben pagar +20 coronas adicionales de mantenimiento si tienen enanos y
      elfos juntos en la misma banda (¡el barco es solo tan grande!). Los cañones giratorios son
      raros, ¡amigo!: salvo los Piratas Sartosanos, ninguna banda pirata puede empezar con un cañón
      giratorio en su lista en partidas de campaña; en partidas sueltas, los no Sartosanos pueden
      comprar uno por 2D6 coronas adicionales. Sucesión: si el Capitán muere, uno de los
      Contramaestres tomará el mando de la misma forma que un Campeón en una banda mercenaria.
  applies_to:
    band: true
- id: band--bretonnian-special-rules
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.bretonnian-buccaneers-sar.band.bretonnian-special-rules
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Bretonnian Special Rules
  effect: >-
    When shooting with Pistols and Dueling Pistols, a Bretonnian hero treats the initial 6"/10"
    respectively as Short range. If combined with Eagle Eye, the additional 6" counts as Long range.
    Also, at warband creation, you may purchase dueling pistols for 25gc each.
  source:
    manual: broheim.net
    printed_page: 2
    section: Bretonnian Special Rules
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Human%20Pirates.pdf
  name_i18n:
    es: Reglas Especiales Bretonianas
  effect_i18n:
    es: >-
      Al disparar con Pistolas y Pistolas de Duelo, un héroe bretoniano considera los primeros
      6"/10" respectivamente como alcance Corto. Si se combina con Ojo de Águila, los 6" adicionales
      cuentan como alcance Largo. Además, al crear la banda, puedes comprar pistolas de duelo a 25
      coronas cada una.
  applies_to:
    band: true
- id: captain--leader
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.bretonnian-buccaneers-sar.captain.leader
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Leader
  effect: >-
    Any pirate within 6" of the Captain may use his Leadership characteristic when taking any
    Leadership tests.
  source:
    manual: broheim.net
    printed_page: 4
    section: Heroes / 1 Pirate Captain / Special Rules / Leader
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Human%20Pirates.pdf
  name_i18n:
    es: Líder
  effect_i18n:
    es: >-
      Cualquier pirata a 6" del Capitán puede usar su característica de Liderazgo en cualquier
      chequeo de Liderazgo.
  applies_to:
    profile_ids:
    - captain
- id: gunners--swivel-guns-are-dangerous
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.bretonnian-buccaneers-sar.gunners.swivel-guns-are-dangerous
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Swivel Guns Is Dangerous, Matey!
  effect: >-
    If a Pirate Warband includes a Swivel Gun, the Gunner wielding it will always be considered an
    individual and can never have anyone else with him. Since a Pirate Warband may only have one
    Swivel Gun, if a Gunner is equipped with one then he must either be a new Gunner, or split from
    an existing unit. If the latter, he retains all Experience and Skills he had previously.
  source:
    manual: broheim.net
    printed_page: 4
    section: Henchmen / 0-7 Gunners / Special Rules / Swivel Guns is Dangerous Matey
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Human%20Pirates.pdf
  name_i18n:
    es: Los Cañones Giratorios Son Peligrosos, ¡Amigo!
  effect_i18n:
    es: >-
      Si una Banda Pirata incluye un Cañón Giratorio, el Artillero que lo porte siempre será
      considerado un individuo y nunca podrá llevar a nadie más con él. Como una Banda Pirata solo
      puede tener un Cañón Giratorio, si un Artillero lleva uno, debe ser un Artillero nuevo o
      separarse de una unidad existente. En este último caso, conserva toda la Experiencia y
      Habilidades que tuviera previamente.
  applies_to:
    profile_ids:
    - gunners
- id: boatswains--expert-riggers
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.bretonnian-buccaneers-sar.boatswains.expert-riggers
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Expert Riggers
  effect: >-
    Boatswains are highly trained in using their ropes, as they are the ones who maintain the
    complex network of rigging throughout the ship. They may re-roll failed Initiative tests Leaping
    over Gaps, Jumping Down, and performing a Diving Charge, as well as the normal test for Climbing
    Up or Down that a Rope allows.
  source:
    manual: broheim.net
    printed_page: 5
    section: Henchmen / 0-5 Boatswains / Special Rules / Expert Riggers
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Human%20Pirates.pdf
  name_i18n:
    es: Marineros Experto
  effect_i18n:
    es: >-
      Los Contramaestres de Jarcia están muy entrenados en el uso de sus cuerdas, ya que son quienes
      mantienen la compleja red de aparejos del barco. Pueden repetir los chequeos fallidos de
      Iniciativa al Saltar Vanos, Saltar hacia Abajo y realizar una Carga en Picado, así como el
      chequeo normal de Trepar Arriba o Abajo que permite una Cuerda.
  applies_to:
    profile_ids:
    - boatswains
