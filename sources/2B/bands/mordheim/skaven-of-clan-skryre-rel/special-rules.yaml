- id: overseer--slave-driver
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.skaven-of-clan-skryre-rel.overseer.slave-driver
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Slave Driver
  effect: >-
    A Skaven Overseer strikes fear into his slaves. They may use his leadership if they are within
    3". If he is armed with a scourge, this increases to 6".
  source:
    manual: Broheim
    printed_page: 7
    section: Heroes / 0-1 Skaven Overseer / Special Rules / Slave Driver
    url: https://broheim.net/downloads/fo/97RelicsoftheCrusadesPt2.pdf
  name_i18n:
    es: Latigador de Esclavos
  effect_i18n:
    es: >-
      Un Capataz Skaven infunde miedo a sus esclavos. Pueden usar su liderazgo si están a 3". Si va
      armado con un azote, el alcance aumenta a 6".
  applies_to:
    profile_ids:
    - overseer
- id: overseer--slave-master
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.skaven-of-clan-skryre-rel.overseer.slave-master
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Slave Master
  effect: >-
    Though he works the slaves to their limits, a Skaven Overseer knows that it is in the warband's
    best interests to keep them alive. Skaven Slaves ignore the easy come, easy go rule if the
    Skaven Overseer wasn't taken Out of Action in the battle.
  source:
    manual: Broheim
    printed_page: 7
    section: Heroes / 0-1 Skaven Overseer / Special Rules / Slave Master
    url: https://broheim.net/downloads/fo/97RelicsoftheCrusadesPt2.pdf
  name_i18n:
    es: Amo de Esclavos
  effect_i18n:
    es: >-
      Aunque explota a los esclavos al límite, un Capataz Skaven sabe que mantenerlos con vida está
      en el interés de la banda. Los Esclavos Skaven ignoran la regla de fácil venen, fácil se van
      si el Capataz Skaven no quedó Fuera de Combate en la batalla.
  applies_to:
    profile_ids:
    - overseer
- id: skaven-slaves--life-is-cheap
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.skaven-of-clan-skryre-rel.skaven-slaves.life-is-cheap
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Life Is Cheap
  effect: >-
    Skaven slaves are worthless to the Warlock Engineers. Members of a Clan Skryre warband may shoot
    into a close combat that only contains enemies and skaven slaves. Randomise hits.
  source:
    manual: Broheim
    printed_page: 7
    section: Henchmen / Skaven slaves / Special Rules / Life is cheap
    url: https://broheim.net/downloads/fo/97RelicsoftheCrusadesPt2.pdf
  name_i18n:
    es: La Vida es Barata
  effect_i18n:
    es: >-
      Los esclavos skaven no valen nada para los Ingenieros Hechiceros. Los miembros de una banda
      del Clan Skryre pueden disparar a un combate cuerpo a cuerpo que solo contenga enemigos y
      esclavos skaven. Reparte los impactos al azar.
  applies_to:
    profile_ids:
    - skaven-slaves
- id: skaven-slaves--easy-come-easy-go
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.skaven-of-clan-skryre-rel.skaven-slaves.easy-come-easy-go
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Easy Come, Easy Go
  effect: >-
    Skaven Slaves are often used as living experiments and their lifespans are mercifully short.
    After rolling for Injuries, roll a D3 and remove that amount of Skaven Slaves from your warband.
    They haven't survived their ordeal in Araby.
  source:
    manual: Broheim
    printed_page: 7
    section: Henchmen / Skaven slaves / Special Rules / Easy come, easy go
    url: https://broheim.net/downloads/fo/97RelicsoftheCrusadesPt2.pdf
  name_i18n:
    es: Fácil Venir, Fácil Irse
  effect_i18n:
    es: >-
      Los Esclavos Skaven suelen usarse como experimentos vivientes y su esperanza de vida es
      misericordiosamente corta. Tras tirar por las Heridas, tira 1D3 y retira esa cantidad de
      Esclavos Skaven de tu banda. No sobrevivieron a su calvario en Araby.
  applies_to:
    profile_ids:
    - skaven-slaves
- id: skaven-slaves--numerous
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.skaven-of-clan-skryre-rel.skaven-slaves.numerous
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Numerous
  effect: >-
    Skaven Slaves may be used to increase the Clan Skryre's warband numbers up to 20. For example if
    there are 15 Skaven in your warband, you may add up to 5 skaven slaves.
  source:
    manual: Broheim
    printed_page: 7
    section: Henchmen / Skaven slaves / Special Rules / Numerous
    url: https://broheim.net/downloads/fo/97RelicsoftheCrusadesPt2.pdf
  name_i18n:
    es: Numerosos
  effect_i18n:
    es: >-
      Los Esclavos Skaven pueden usarse para aumentar el número de la banda del Clan Skryre hasta
      20. Por ejemplo, si hay 15 skaven en tu banda, puedes añadir hasta 5 esclavos skaven.
  applies_to:
    profile_ids:
    - skaven-slaves
- id: skaven-slaves--experience
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.skaven-of-clan-skryre-rel.skaven-slaves.experience
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Experience
  effect: Skaven Slaves don't survive long enough to gain experience.
  source:
    manual: Broheim
    printed_page: 7
    section: Henchmen / Skaven slaves / Special Rules / Experience
    url: https://broheim.net/downloads/fo/97RelicsoftheCrusadesPt2.pdf
  name_i18n:
    es: Experiencia
  effect_i18n:
    es: Los Esclavos Skaven no sobreviven lo suficiente para ganar experiencia.
  applies_to:
    profile_ids:
    - skaven-slaves
- id: skaven-slaves--worthless
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.skaven-of-clan-skryre-rel.skaven-slaves.worthless
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Worthless
  effect: >-
    A Warlock Engineer doesn't expect much from slaves, and is therefore not unsettled if skaven
    slaves break or get cut down in battle. In fact, that's what they're there for! When testing to
    see if a Clan Skryre warband needs to take a Rout test, each skaven slave taken out of action
    only counts as half a model. Therefore, a band of 5 Skaven and 10 skaven slaves (15 models)
    would only have to take a test if 4 models fell (4 Skaven or 8 skaven slaves, or some
    combination thereof).
  source:
    manual: Broheim
    printed_page: 7
    section: Henchmen / Skaven slaves / Special Rules / Worthless
    url: https://broheim.net/downloads/fo/97RelicsoftheCrusadesPt2.pdf
  name_i18n:
    es: No Vales Nada
  effect_i18n:
    es: >-
      Un Ingeniero Hechicero no espera mucho de los esclavos y, por tanto, no le inquieta que los
      esclavos skaven huyan o caigan en combate. ¡De hecho, para eso están! Al comprobar si una
      banda del Clan Skryre debe hacer un chequeo de Huida, cada esclavo skaven fuera de combate
      solo cuenta como medio modelo. Por tanto, una banda de 5 skaven y 10 esclavos skaven (15
      modelos) solo tendría que hacer la prueba si cayeran 4 modelos (4 skaven u 8 esclavos skaven,
      o cualquier combinación).
  applies_to:
    profile_ids:
    - skaven-slaves
