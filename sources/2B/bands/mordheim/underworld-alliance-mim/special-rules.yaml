    implemented: 'YES'
    grant: profile
    effects:
    - id: skill.regeneration
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.regeneration
  name: Regeneration
  effect: >-
    Whenever an enemy successfully inflicts a wound on a Warpstone Troll, roll a D6; on a result of
    4 or more the wound is ignored and the troll is unhurt. Warpstone Trolls may not regenerate
    wounds caused by fire or fire-based magic.
  source:
    manual: Broheim
    printed_page: 5
    section: 1 Warpstone Troll / Special Rules / Regeneration
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Underworld Alliance.pdf
  name_i18n:
    es: Regeneración
  effect_i18n:
    es: >-
      Siempre que un enemigo inflija con éxito una herida a un Troll de Piedra Bruja, tira 1D6; con
      un resultado de 4 o más la herida se ignora y el troll sale ileso. Los Trolls de Piedra Bruja
      no pueden regenerar heridas causadas por fuego o magia de fuego.
  applies_to:
    profile_ids:
    - warpstone-troll
