    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.underworld-alliance-mim.giant-rats.experience
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Experience
  effect: Giant Rats are animals and do not gain experience.
  source:
    manual: Broheim
    printed_page: 4
    section: Giant Rats / Special Rules / Experience
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Underworld Alliance.pdf
  name_i18n:
    es: Experiencia
  effect_i18n:
    es: Las Ratas Gigantes son animales y no ganan experiencia.
  applies_to:
    profile_ids:
    - giant-rats
