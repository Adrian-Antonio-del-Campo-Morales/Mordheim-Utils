schema_version: 2
band_id: underworld-alliance-mim
rules:
- id: band--who-iz-da-boss
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.underworld-alliance-mim.band.who-iz-da-boss
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Who'z da Boss!
  effect: >-
    At the end of a victorious game, instead of giving the leader +1 experience, roll a D6: 1 =
    Neither! (too busy fighting amongst yourselves to learn anything); 2-3 = Cunning but Brutal!
    (the Goblin Bully gains the xp); 4-5 = Sneaky but Stabby! (the Slum Lord gains the xp); 6 = a
    rare moment of comradery (both gain +1 xp).
  source:
    manual: Broheim
    printed_page: 1
    section: Who'z da Boss!
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Underworld Alliance.pdf
  name_i18n:
    es: ¿Quién es el Jefe!
  effect_i18n:
    es: >-
      Al final de una partida victoriosa, en lugar de dar +1 de experiencia al líder, tira 1D6: 1 =
      ¡Ninguno! (demasiado ocupados peleando entre vosotros para aprender nada); 2-3 = ¡Astuto pero
      Brutal! (el Matón Goblin gana la experiencia); 4-5 = ¡Sneaky pero Puñalador! (el Señor del
      Barrio Bajo gana la experiencia); 6 = un raro momento de camaradería (ambos ganan +1 de
      experiencia).
  applies_to:
    band: true
- id: band--warpstone-for-breakfast
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.underworld-alliance-mim.band.warpstone-for-breakfast
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Warpstone for Breakfast
  effect: >-
    Any Hero may start the campaign with a single mutation (leaders may start with two) from the
    following gifts in the Corrupted Characters chapter if they pay the appropriate cost: Poisonous
    Bite, Extra Arm, Hulking Brute, Regeneration, Suckers, Elastic Arms, Vestigial Twin, Cloud of
    Flies. On any doubles when rolling for level-ups, the warrior may instead purchase one of the
    above mutations.
  source:
    manual: Broheim
    printed_page: 1
    section: Warpstone for Breakfast
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Underworld Alliance.pdf
  name_i18n:
    es: Piedra Bruja para Desayunar
  effect_i18n:
    es: >-
      Cualquier héroe puede comenzar la campaña con una única mutación (los líderes pueden comenzar
      con dos) de los siguientes dones del capítulo de Personajes Corruptos si paga el coste
      adecuado: Mordisco Venenoso, Brazo Extra, Bruto Colosal, Regeneración, Ventosas, Brazos
      Elásticos, Gemelo Vestigial, Nube de Moscas. Al sacar dobles en las tiradas de subida de
      nivel, el guerrero puede comprar en su lugar una de las mutaciones anteriores.
  applies_to:
    band: true
- id: band--alliance-of-inconvenience
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.underworld-alliance-mim.band.alliance-of-inconvenience
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: An Alliance of Inconvenience
  effect: >-
    The Underworld has two leaders: only skaven can use the Slave King's Leadership bonus and only
    goblins the Bully's. When taking rout tests (25% of the warband out of action as normal) the
    warband takes two rout tests, one for each leader; if one leader fails, all warband members of
    his type rout with him. The Warpstone Troll counts as a member of both factions and will only
    rout when both sides do.
  source:
    manual: Broheim
    printed_page: 1
    section: Special Rules / An Alliance of Inconvenience
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Underworld Alliance.pdf
  name_i18n:
    es: Una Alianza de Comodidad
  effect_i18n:
    es: >-
      El Submundo tiene dos líderes: solo los skaven pueden usar el bono de Liderazgo del Rey
      Esclavo y solo los goblins el del Matón. Al realizar las tiradas de huida (25% de la banda
      Fuera de combate como de costumbre), la banda hace dos tiradas de huida, una por cada líder;
      si un líder falla, todos los miembros de su tipo huyen con él. El Troll de Piedra Bruja cuenta
      como miembro de ambas facciones y solo huirá cuando ambas lo hagan.
  applies_to:
    band: true
- id: band--factional-jealousy
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.underworld-alliance-mim.band.factional-jealousy
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Factional Jealousy
  effect: >-
    A warrior of one type may never intercept the charge meant for a warrior of the other type.
  source:
    manual: Broheim
    printed_page: 1
    section: Special Rules / Factional Jealousy
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Underworld Alliance.pdf
  name_i18n:
    es: Celos Faccionales
  effect_i18n:
    es: >-
      Un guerrero de un tipo nunca puede interceptar la carga dirigida a un guerrero del otro tipo.
  applies_to:
    band: true
- id: band--glory-hogz
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.underworld-alliance-mim.band.glory-hogz
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Glory Hogz
  effect: >-
    If one of the factions has routed, at the start of your turn you may roll 2D6; on a double, the
    routed faction re-joins the battle at a random table edge! Units taken out of action before the
    initial rout do not re-join (they re-enter the game already taking rout tests). This may only
    happen once per battle.
  source:
    manual: Broheim
    printed_page: 1
    section: Special Rules / Glory Hogz
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Underworld Alliance.pdf
  name_i18n:
    es: Acaparadores de Gloria
  effect_i18n:
    es: >-
      Si una de las facciones ha huido, al inicio de tu turno puedes tirar 2D6; con un doble, la
      facción huidora se reincorpora a la batalla por un borde de mesa aleatorio. Las unidades
      puestas Fuera de combate antes de la huida inicial no se reincorporan (reentran ya realizando
      tiradas de huida). Esto solo puede ocurrir una vez por batalla.
  applies_to:
    band: true
- id: band--power-grab
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.underworld-alliance-mim.band.power-grab
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Power Grab
  effect: >-
    If there is more of one type of race than the other at the start of a match, the race with more
    warriors gains +1 Ld and the race with less gains -1 Ld.
  source:
    manual: Broheim
    printed_page: 1
    section: Special Rules / Power Grab
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Underworld Alliance.pdf
  name_i18n:
    es: Golpe de Poder
  effect_i18n:
    es: >-
      Si hay más de una raza que de la otra al inicio de la partida, la raza con más guerreros gana
      +1 Ld y la raza con menos pierde -1 Ld.
  applies_to:
    band: true
- id: band--plenty-more-where-that-came-from
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.underworld-alliance-mim.band.plenty-more-where-that-came-from
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Plenty More Where That Came From
  effect: >-
    If one of the two leaders dies, another hero of the same race takes command, earning the title
    and special rules of the dead leader (Bully/Slum Lord), meaning you can purchase a new hero of
    the former type of the new leader.
  source:
    manual: Broheim
    printed_page: 1
    section: Special Rules / Plenty More Where That Came From
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Underworld Alliance.pdf
  name_i18n:
    es: Hay Más de Donde Vino
  effect_i18n:
    es: >-
      Si uno de los dos líderes muere, otro héroe de la misma raza toma el mando, ganando el título
      y las reglas especiales del líder muerto (Matón/Señor del Barrio Bajo), lo que significa que
      puedes comprar un nuevo héroe del tipo anterior del nuevo líder.
  applies_to:
    band: true
