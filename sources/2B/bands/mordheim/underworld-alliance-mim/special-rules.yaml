  rule_ref: shared-rule.leader
- id: goblin-bully--one-upmanship
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: trait.re-roll-melee
      scope: LATER
      binding: null
      reason: >-
        Deferred: re-roll of to-hit rolls needs a generic conditional re-roll binding not yet
        exposed.
  name: One upmanship
  effect: >-
    The Goblin Bully may re-roll all to hit rolls when fighting in the same combat as the Skaven
    Slave King.
  source:
    manual: Broheim
    printed_page: 3
    section: 1 Goblin Bully / Special Rules / One upmanship
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Underworld Alliance.pdf
  name_i18n:
    es: Superar al Vecino
  effect_i18n:
    es: >-
      El Matón Goblin puede repetir todas las tiradas para impactar cuando lucha en el mismo combate
      que el Rey Esclavo skaven.
  applies_to:
    profile_ids:
    - goblin-bully
- id: skaven-slum-lord--leader
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.underworld-alliance-mim.skaven-slum-lord.leader
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: psychology.
  name: Leader
  source:
    manual: Broheim
    printed_page: 3
    section: 1 Skaven Slum Lord / Special Rules / Leader
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Underworld Alliance.pdf
  name_i18n:
    es: Líder
  applies_to:
    profile_ids:
    - skaven-slum-lord
  rule_ref: shared-rule.leader
- id: skaven-slum-lord--sneaky-snark
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.underworld-alliance-mim.skaven-slum-lord.sneaky-snark
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Sneaky Snark
  effect: >-
    When fighting in the same combat as the Goblin Bully, if the Bully takes someone out of action
    roll a D6: on a 4+ the Slum Lord actually jumped in at the last second and stole the kill; any
    XP for the out-of-action warrior goes to the Slum Lord.
  source:
    manual: Broheim
    printed_page: 3
    section: 1 Skaven Slum Lord / Special Rules / Sneaky Snark
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Underworld Alliance.pdf
  name_i18n:
    es: Zasca Furtivo
  effect_i18n:
    es: >-
      Cuando lucha en el mismo combate que el Matón Goblin, si el Matón deja a alguien Fuera de
      combate, tira 1D6: con 4+ el Señor del Barrio Bajo se coló en el último segundo y robó la
      muerte; la experiencia por el guerrero Fuera de combate va al Señor del Barrio Bajo.
  applies_to:
    profile_ids:
    - skaven-slum-lord
- id: skaven-slave-champions--tunnel-rat
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.underworld-alliance-mim.skaven-slave-champions.tunnel-rat
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Tunnel Rat
  effect: >-
    Any characteristic-based tests being taken for scenarios set in sewers or elsewhere underground
    can be re-rolled.
  source:
    manual: Broheim
    printed_page: 3
    section: 0-2 Skaven Slave Champion / Special Rules / Tunnel Rat
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Underworld Alliance.pdf
  name_i18n:
    es: Rata de Túnel
  effect_i18n:
    es: >-
      Cualquier chequeo basado en características realizado en escenarios situados en cloacas u
      otros lugares subterráneos puede repetirse.
  applies_to:
    profile_ids:
    - skaven-slave-champions
- id: goblin-stinky-gits--disgusting
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: trait.poison-immune
      scope: 'YES'
      binding:
        kind: trait
        id: trait.poison-immune
        parameters:
          value: true
  name: Disgusting
  effect: >-
    A life of wyrdstone abuse and eating whatever floats to the bottom of the city has made Stinky
    Gits immune to pretty much all disease and poison: this warrior is not affected by poison
    attacks and can shrug off any disease on a 4+ (only test when first contracted).
  source:
    manual: Broheim
    printed_page: 3
    section: 0-2 Goblin Stinky Git / Special Rules / Disgusting
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Underworld Alliance.pdf
  name_i18n:
    es: Repugnante
  effect_i18n:
    es: >-
      Una vida de abuso de piedra bruja y de comer lo que flota hasta el fondo de la ciudad ha
      vuelto a los Apestosos inmunes a casi todas las enfermedades y venenos: este guerrero no se ve
      afectado por ataques de veneno y puede superar cualquier enfermedad con un 4+ (solo se tira al
      contraerla por primera vez).
  applies_to:
    profile_ids:
    - goblin-stinky-gits
- id: boglars--largely-insignificant
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.underworld-alliance-mim.boglars.largely-insignificant
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Largely Insignificant
  effect: >-
    Boglars count towards the number of warriors in a warband but are not considered for Rout tests
    - neither for determining the initial warband size nor as lost models.
  source:
    manual: Broheim
    printed_page: 4
    section: 0-5 Boglars / Special Rules / Largely Insignificant
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Underworld Alliance.pdf
  name_i18n:
    es: Largamente Insignificantes
  effect_i18n:
    es: >-
      Los Boglars cuentan para el número de guerreros de la banda pero no se consideran para las
      tiradas de huida: ni para determinar el tamaño inicial de la banda ni como modelos perdidos.
  applies_to:
    profile_ids:
    - boglars
- id: boglars--bicker
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.underworld-alliance-mim.boglars.bicker
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Bicker
  effect: >-
    Roll a D6 at the beginning of the turn for each Boglar within 2 inches of another Boglar and not
    engaged in close combat; on a result of 1 the Boglar starts to bicker, insult and/or bully the
    other Boglar and may do nothing else this turn.
  source:
    manual: Broheim
    printed_page: 4
    section: 0-5 Boglars / Special Rules / Bicker
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Underworld Alliance.pdf
  name_i18n:
    es: Reñir
  effect_i18n:
    es: >-
      Tira 1D6 al inicio del turno por cada Boglar a 2 pulgadas de otro Boglar que no esté en
      combate cuerpo a cuerpo; con un resultado de 1, el Boglar empieza a reñir, insultar y/o acosar
      al otro Boglar y no puede hacer nada más este turno.
  applies_to:
    profile_ids:
    - boglars
- id: boglars--regeneration
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: skill.regeneration
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.regeneration
  name: Regeneration
  effect: >-
    Whenever an enemy successfully inflicts a wound on a Boglar, roll a D6; on a result of 5 or more
    the wound is ignored and the Boglar is unhurt. Boglars may not regenerate wounds caused by fire
    or fire-based magic.
  source:
    manual: Broheim
    printed_page: 4
    section: 0-5 Boglars / Special Rules / Regeneration
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Underworld Alliance.pdf
  name_i18n:
    es: Regeneración
  effect_i18n:
    es: >-
      Siempre que un enemigo inflija con éxito una herida a un Boglar, tira 1D6; con un resultado de
      5 o más la herida se ignora y el Boglar sale ileso. Los Boglars no pueden regenerar heridas
      causadas por fuego o magia de fuego.
  applies_to:
    profile_ids:
    - boglars
- id: sewer-squigs--movement
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.underworld-alliance-mim.sewer-squigs.movement
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: no effect applies to the current engine scope.
  name: Movement
  effect: >-
    Sewer Squigs move 2D6-1 inches each turn on land; when in water, they can swim 2D6 inches each
    movement phase, not reduced by penalties for water. They do NOT count as Aquatic.
  source:
    manual: Broheim
    printed_page: 4
    section: 0-5 Sewer Squigs / Special Rules / Movement
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Underworld Alliance.pdf
  name_i18n:
    es: Movimiento
  effect_i18n:
    es: >-
      Los Squigs de Cloaca se mueven 2D6-1 pulgadas cada turno en tierra; en el agua pueden nadar
      2D6 pulgadas cada fase de movimiento, sin reducción por penalizaciones de agua. NO cuentan
      como Acuáticos.
  applies_to:
    profile_ids:
    - sewer-squigs
- id: giant-rats--pack-size
