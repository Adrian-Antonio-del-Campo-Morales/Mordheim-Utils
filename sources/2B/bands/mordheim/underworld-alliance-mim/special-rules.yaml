  effect: You can recruit as many Giant Rats as you wish.
  source:
    manual: Broheim
    printed_page: 4
    section: Giant Rats / Special Rules / Pack size
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Underworld Alliance.pdf
  name_i18n:
    es: Tamaño de la Manada
  effect_i18n:
    es: Puedes reclutar tantas Ratas Gigantes como desees.
  applies_to:
    profile_ids:
    - giant-rats
- id: giant-rats--experience
  runtime:
