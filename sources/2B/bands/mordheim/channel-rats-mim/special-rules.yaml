- id: band--strigany-special-skills-list
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.channel-rats-mim.band.strigany-special-skills-list
      scope: LATER
      binding: null
      reason: >-
        River Strigany may choose this list instead of the standard skill lists. The six special
        skills have no matching engine mechanics; preserved verbatim for the skills equivalence
        review at promotion time.
  name: Strigany Special Skills
  effect: >-
    River Strigany may choose to use the following skill list instead of the standard skill lists.
    Knowledge of Myths and Legends: during the Exploration phase, if the Hero was not taken out of
    action, you may re-roll one dice, keeping the second result even if it is worse. Bull Rush: when
    he charges, the Hero may attempt to knock down his opponent rather than making his normal
    attacks; roll to hit once with a +1 to hit modifier, though no roll to wound is necessary; if
    the warrior hits with this attack, the opposing model is knocked down. Songster: any friendly
    model within 6" of the Hero may re-roll any failed Leadership test with a +1 to Leadership; this
    includes rout tests. Prize-fighter: the Hero suffers no penalties whatsoever for fighting
    unarmed and receives +1 Attack when doing so. Animal Charmer: the Hero can control up to five
    animals using Strigany charms provided that they remain within 6" of him; if an animal is not
    within 6" of the Animal Charmer in the Movement phase, they will move D6" in a random direction.
    Infiltration: a Strigany with this skill is always placed on the battlefield after the opposing
    warband and can be placed anywhere on the table as long as it is out of sight of the opposing
    warband and more than 12" away from any enemy model; if both players have models which
    infiltrate, roll a D6 for each, and the lowest roll sets up first.
  source:
    manual: broheim.net
    printed_page: 181
    section: Strigany Special Skills
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Channel Rats.pdf
  name_i18n:
    es: Habilidades Especiales Strigany
  effect_i18n:
    es: >-
      Los Strigany del Río pueden elegir usar la siguiente lista de habilidades en lugar de las
      listas de habilidades estándar. Conocimiento de Mitos y Leyendas: durante la fase de
      Exploración, si el Héroe no quedó Fuera de Combate, puedes repetir un dado, quedándote con el
      segundo resultado aunque sea peor. Embestida: cuando carga, el Héroe puede intentar derribar a
      su oponente en lugar de hacer sus ataques normales; tira por impactar una vez con un
      modificador de +1 por impactar, aunque no es necesaria tirada para herir; si el guerrero
      impacta con este ataque, el modelo oponente queda derribado. Cantor: cualquier modelo amistoso
      a 6" del Héroe puede repetir cualquier chequeo de Liderazgo fallido con un +1 al Liderazgo;
      esto incluye las tiradas de Huida. Luchador: el Héroe no sufre ninguna penalización por pelear
      desarmado y recibe +1 Ataque al hacerlo. Encantador de Animales: el Héroe puede controlar
      hasta cinco animales usando encantos Strigany, siempre que permanezcan a 6" de él; si un
      animal no está a 6" del Encantador de Animales en la fase de Movimiento, se moverá 1D6" en una
      dirección aleatoria. Infiltración: un Strigany con esta habilidad siempre se coloca en el
      campo de batalla después de la banda oponente y puede colocarse en cualquier parte de la mesa,
      siempre que esté fuera de la línea de visión de la banda oponente y a más de 12" de cualquier
      modelo enemigo; si ambos jugadores tienen modelos que infiltran, tira 1D6 por cada uno, y el
      que saque el resultado más bajo despliega primero.
  applies_to:
    band: true
