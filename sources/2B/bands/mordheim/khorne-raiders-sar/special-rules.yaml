    - id: unimplemented.khorne-raiders-sar.madbrains.reckless
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Reckless (Madbrains)
  effect: >-
    Madbrains add +1 to all Injury rolls they make in hand-to-hand combat. However, all opponents in
    hand-to-hand may add +1 to Injuries made against Madbrains.
  source:
    manual: broheim.net
    printed_page: 3
    section: Henchmen / 0-5 Madbrains / Special Rules
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Khorne%20Raiders.pdf
  name_i18n:
    es: Temerarios (Cebos Locos)
  effect_i18n:
    es: >-
      Los Cebos Locos suman +1 a todas las tiradas de herida que hagan en combate cuerpo a cuerpo.
      Sin embargo, todos los oponentes en combate pueden sumar +1 a las heridas que les causen.
  applies_to:
    profile_ids:
    - madbrains
- id: flayerkin--hooks
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.khorne-raiders-sar.flayerkin.hooks
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Hooks
  effect: >-
    The Flayerkins have extra sharp steel hooks at the end of each wrist. They gain an additional
    hand attack, like they had a second weapon. Attacks made with the hooks receive neither penalty
    nor bonus. They may not use any other weapons.
  source:
    manual: broheim.net
    printed_page: 3
    section: Henchmen / 0-3 Flayerkin / Special Rules
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Khorne%20Raiders.pdf
  name_i18n:
    es: Garfios
  effect_i18n:
    es: >-
      Los Despelladores tienen garfios de acero extrapunzantes al final de cada muñeca. Ganan un
      ataque de mano adicional, como si llevaran una segunda arma. Los ataques con los garfios no
      reciben penalización ni bonificación. No pueden usar ninguna otra arma.
  applies_to:
    profile_ids:
    - flayerkin
- id: flayerkin--climbing
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.khorne-raiders-sar.flayerkin.climbing
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Climbing (Flayerkin)
  effect: The Flayerkin always counts as having Rope and Hook.
  source:
    manual: broheim.net
    printed_page: 3
    section: Henchmen / 0-3 Flayerkin / Special Rules
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Khorne%20Raiders.pdf
  name_i18n:
    es: Escalada (Despelladores)
  effect_i18n:
    es: El Despellador siempre cuenta como si llevara Cuerda y Gancho.
  applies_to:
    profile_ids:
    - flayerkin
- id: flayerkin--chain-spine
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.khorne-raiders-sar.flayerkin.chain-spine
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Chain Spine
  effect: >-
    Long chains have been grafted to the spine of the Flayerkin, aiding allies in laying siege. If a
    Flayerkin at the top of an elevation and within 1" of the edge, all friendly models directly
    beneath the Flayer at the bottom count as having Rope and Hook when climbing up. Likewise, any
    friendly model within 1" at the top of any elevation may use the Rope and Hook when climbing
    down. The Flayerkin still grants this bonus if he is knocked down, stunned, or taken Out of
    Action (in the case of the latter, remove the model and leave a marker where he was.)
  source:
    manual: broheim.net
    printed_page: 3
    section: Henchmen / 0-3 Flayerkin / Special Rules
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Khorne%20Raiders.pdf
  name_i18n:
    es: Columna de Cadenas
  effect_i18n:
    es: >-
      Cadenas largas han sido injertadas en la columna del Despellador, ayudando a sus aliados en
      los asedios. Si un Despellador está en lo alto de una elevación y a 1" o menos del borde,
      todos los modelos amigos directamente debajo, en la base, cuentan como si tuvieran Cuerda y
      Gancho para trepar. Igualmente, cualquier modelo amigo a 1" o menos en lo alto de cualquier
      elevación puede usar la Cuerda y Gancho para descender. El Despellador sigue otorgando esta
      bonificación si está derribado, aturdido o fuera de combate (en este último caso, retira el
      modelo y deja una marca donde estaba).
  applies_to:
    profile_ids:
    - flayerkin
- id: flayerkin--mindless
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.khorne-raiders-sar.flayerkin.mindless
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Mindless (Flayerkin)
  effect: >-
    After so much experimentation, the mental state of a Flayerkin is simple at best. Flayerkin
    cannot learn experience.
  source:
    manual: broheim.net
    printed_page: 3
    section: Henchmen / 0-3 Flayerkin / Special Rules
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Khorne%20Raiders.pdf
  name_i18n:
    es: Carentes de Mente (Despelladores)
  effect_i18n:
    es: >-
      Tras tanto experimentación, el estado mental de un Despellador es, en el mejor de los casos,
      simple. Los Despelladores no pueden ganar experiencia.
  applies_to:
    profile_ids:
    - flayerkin
