  name: Massive Swing
  effect: >-
    A Quartermaster may carry ONE two-handed weapon (ex. Halberd, double-handed weapon) in one hand.
    In his other hand, you may choose to give him an additional single-handed weapon.
  source:
    manual: broheim.net
    printed_page: 3
    section: Heroes / 0-2 Quartermasters / Special Rules
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Khorne%20Raiders.pdf
  name_i18n:
    es: Mandoble Enorme
  effect_i18n:
    es: >-
      Un Intendente puede llevar UNA arma a dos manos (p. ej. alabarda, arma a dos manos) en una
      mano. En la otra mano, puedes darle un arma adicional de una mano.
  applies_to:
