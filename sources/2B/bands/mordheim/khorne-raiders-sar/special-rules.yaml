  name_i18n:
    es: Líder
  effect_i18n:
    es: >-
      Cualquier guerrero a 6" o menos del Capitán Pavoroso puede usar su característica de Liderazgo
      cuando realice cualquier tirada de Liderazgo.
  applies_to:
