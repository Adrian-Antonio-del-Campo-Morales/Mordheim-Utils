  name: Immune to Psychology (Madbrains)
  effect: >-
    Madbrains pass any Leadership test they are required to take. They cannot be promoted to Leader.
  source:
    manual: broheim.net
    printed_page: 3
    section: Henchmen / 0-5 Madbrains / Special Rules
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Khorne%20Raiders.pdf
  name_i18n:
    es: Inmunes a la Psicología (Cebos Locos)
  effect_i18n:
