band_id: khorne-raiders-sar
rules:
- id: band--khorne-raider-rules
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.khorne-raiders-sar.band.khorne-raider-rules
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Khorne Raider Rules
  effect: >-
    Swabbies/Skinners: Khorne Raiders may attempt to enlist Crew members as normal. If the captain
    succeeds in convincing them to join, they become a member of the Plunderers. If he cannot
    convince them, instead of becoming Swabbies, their fate is a little darker: the Khorne player
    immediately gains 1D3 free Toughened Leathers. Magic? Bah!: Khorne forbids his disciples from
    learning magic. Likewise, they may not hire any magic-using Hired Sword or Dramatic Persona.
    They are allowed to keep and use any magical artifacts and items they might find (provided they
    would be able to use them normally). Aside from spellcasters, a Khorne Raider Warband may hire
    any Hired Swords or Dramatic Persona that a Possessed warband could normally hire.
  source:
    manual: broheim.net
    printed_page: 1
    section: Khorne Raider Rules
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Khorne%20Raiders.pdf
  name_i18n:
    es: Reglas de los Asaltantes de Khorne
  effect_i18n:
    es: >-
      Fregones/Desolladores: los Asaltantes de Khorne pueden intentar reclutar miembros de
      Tripulación con normalidad. Si el capitán consigue convencerlos, se convierten en miembros de
      los Saqueadores. Si no logra convencerlos, en lugar de convertirse en Fregones su destino es
      algo más oscuro: el jugador de Khorne gana inmediatamente 1D3 Cueros Endurecidos gratis.
      ¿Magia? ¡Bah!: Khorne prohíbe a sus discípulos aprender magia. Igualmente, no pueden contratar
      ningún Espada a Sueldo o Persona Dramática que use magia. Se les permite conservar y usar
      cualquier artefacto u objeto mágico que encuentren (siempre que puedan usarlos con
      normalidad). Aparte de los lanzadores de hechizos, una banda de Asaltantes de Khorne puede
      contratar cualquier Espada a Sueldo o Persona Dramática que una banda de los Poseídos pudiera
      contratar normalmente.
  applies_to:
    band: true
- id: band--hellblade
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.khorne-raiders-sar.item.hellblade
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Hellblade
  effect: >-
    Cost 35 gc, Availability Rare 8. A rare blade charged with the power of Khorne himself. Range:
    Close Combat; Strength: As user +1; Special Rules: Soulseeking, Two-handed, Deadly, Magical.
    Soulseeking: all attacks made with a Hellblade are at +1 To Hit; this does not work on Undead or
    Demon models. Two-handed: a model armed with a Hellblade may not use a shield, buckler or
    additional weapon in close combat; if the model has a shield he still gets a +1 bonus to his
    armour save against shooting. Deadly: a Hellblade causes critical hits on rolls of 5 or 6; this
    rule does not apply if the warrior requires 5s or higher to wound. Magical: all attacks from a
    Hellblade count as Magical; a Hellblade cannot be made of Gromril, Ithilmar or similar mortal
    metals.
  source:
    manual: broheim.net
    printed_page: 2
    section: Special Equipment / Hellblade
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Khorne%20Raiders.pdf
  name_i18n:
    es: Hoja Infernal
  effect_i18n:
    es: >-
      Coste: 35 coronas, Disponibilidad Rara 8. Una hoja rara cargada con el poder del propio
      Khorne. Alcance: cuerpo a cuerpo; Fuerza: la del usuario +1; Reglas especiales: Buscadora de
      Almas, a dos manos, Mortífera, Mágica. Buscadora de Almas: todos los ataques con una Hoja
      Infernal golpean con +1; no funciona contra modelos No Muertos ni Demonios. A dos manos: un
      modelo con una Hoja Infernal no puede usar escudo, broquel ni arma adicional en combate; si el
      modelo lleva escudo, conserva el +1 a su salvación por armadura contra disparos. Mortífera:
      una Hoja Infernal causa impactos críticos con tiradas de 5 o 6; esta regla no se aplica si el
      guerrero necesita 5 o más para herir. Mágica: todos los ataques de una Hoja Infernal cuentan
      como Mágicos; no puede estar forjada en gromril, ithilmar ni metales mortales similares.
  applies_to:
    band: true
- id: band--special-skills
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.khorne-raiders-sar.skills.special-skills
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Special Skills (Khorne Raiders)
  effect: >-
    Mutant: the Hero may buy one Mutation from the Possessed Mutation list; this skill may only be
    taken once. Blood of Khorne: the hero may now ignore the effects of Spells or Prayers on a D6
    roll of 4+. Berserker: whenever charging, the model doubles his base number of attacks for the
    first round of combat; in addition, whenever he is within charge range of an enemy model, he
    must charge; while charging, being charged, or in hand-to-hand combat, the model is Immune to
    Psychology; this skill cannot be used while Frenzied. Massive Muscles: Quartermaster only; he
    may now carry a Double-handed Weapon in both hands; also, if the Quartermaster loses a hand, he
    may, instead of a Hook Hand, have it replaced with a Double-Handed Weapon hand (costs 25 gc).
    Stromfel's Boon: the model now counts as being aquatic, and suffers no penalties or drowning
    damage from water. Master Tanner: whenever sacrificing a Swabbie, gain 1D3+1 Toughened Leathers
    OR 1 Leather Cape; this provides a +1 Save, and may be worn with Toughened Leathers, Light
    Armor, or other armors (may not be worn with other capes and cloaks); just like Toughened
    Leathers, it cannot be resold or traded to another warrior. Rite of Combat: anytime the hero
    takes an enemy model out of action in hand-to-hand combat who was not knocked down or stunned,
    your hero receives +1 Experience; after all of your charges are declared, move the hero with
    this skill first; if the charge against the target model is successful, no other member of your
    warband may charge that target; all other models who were declared to charging the target move
    half distance or stand still (your choice); likewise, an enemy warrior engaged in combat with
    this hero may not be charged by your warband members unless your hero is outnumbered, knocked
    down, or stunned; the exception is charging Berserkers and frenzied Cannibal Boys, who must
    charge the closest enemy model whenever able.
  source:
    manual: broheim.net
    printed_page: 2
    section: Special Skills
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Khorne%20Raiders.pdf
  name_i18n:
    es: Habilidades Especiales (Asaltantes de Khorne)
  effect_i18n:
    es: >-
      Mutante: el Héroe puede comprar una Mutación de la lista de Mutaciones de los Poseídos; esta
      habilidad solo puede elegirse una vez. Sangre de Khorne: el héroe puede ignorar los efectos de
      hechizos o plegarias con una tirada de 4+ en 1D6. Berserker: siempre que cargue, el modelo
      dobla su número base de ataques en la primera ronda de combate; además, siempre que esté a
      distancia de carga de un modelo enemigo, debe cargar; mientras carga, es cargado o está en
      combate cuerpo a cuerpo, el modelo es inmune a la psicología; esta habilidad no puede usarse
      estando en Frenesí. Músculos Enormes: solo Intendentes; puede llevar un arma a dos manos en
      ambas manos; además, si el Intendente pierde una mano, puede sustituir el Gancho por una mano
      con arma a dos manos (cuesta 25 coronas). Favor de Stromfel: el modelo cuenta como acuático y
      no sufre penalizaciones ni daño por ahogamiento en el agua. Curtidor Maestro: cada vez que
      sacrifique un Fregón, gana 1D3+1 Cueros Endurecidos O 1 Capa de Cuero; esta otorga +1 a la
      salvación y puede llevarse con Cueros Endurecidos, Armadura Ligera u otras armaduras (no puede
      llevarse con otras capas o cloaks); igual que los Cueros Endurecidos, no puede revenderse ni
      cambiarse a otro guerrero. Rito de Combate: cada vez que el héroe deje fuera de combate en
      combate cuerpo a cuerpo a un modelo enemigo que no estuviera derribado o aturdido, recibe +1
      de Experiencia; tras declarar todas tus cargas, mueve primero al héroe con esta habilidad; si
      la carga contra el modelo objetivo tiene éxito, ningún otro miembro de tu banda puede cargar
      contra ese objetivo; todos los demás modelos que hubieran declarado carga contra él se mueven
      la mitad de la distancia o se quedan quietos (a tu elección); igualmente, un guerrero enemigo
      en combate con este héroe no puede ser cargado por miembros de tu banda salvo que tu héroe
      esté superado en número, derribado o aturdido; la excepción son los Berserkers y los Chicos
      Caníbales en frenesí, que deben cargar contra el modelo enemigo más cercano siempre que
      puedan.
  applies_to:
    band: true
