        equivalence review before promotion.
  name: No Skin, No Service
  effect: Ethereal models may not enter settlements unless otherwise specified.
  source:
    manual: broheim.net
    printed_page: 1
    section: No Skin, No Service
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Call Of The Night Haint.pdf
  name_i18n:
    es: Sin Piel, sin Servicio
  effect_i18n:
    es: Los modelos etéreos no pueden entrar en asentamientos salvo que se especifique lo contrario.
  applies_to:
    band: true
- id: band--requilary
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.call-of-the-night-haint-mim.band.requilary
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Requilary
  effect: >-
    All Ethereal members start the battle inside the Requilary. At the beginning of each turn make a
    Ld test using the highest Leadership available; for each point you pass by you may deploy that
    many members within 6 inches of the Mortis Engine. In missions where the Mortis Engine cannot be
    brought, the Corpse Master may carry it on his back, impeding his movement (he may not run). If
    the Requilary is destroyed, the spiritual energy explodes violently: the warband immediately
    routs and any model within D6+6 inches suffers a S5 hit (magic users suffer D3 hits instead).
    The Cairn Wraith will create another one and misses D3 games resting after this process.
  source:
    manual: broheim.net
    printed_page: 1
    section: Special rules / Requilary
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Call Of The Night Haint.pdf
  name_i18n:
    es: Relicario
  effect_i18n:
    es: >-
      Todos los miembros etéreos comienzan la batalla dentro del Relicario. Al inicio de cada turno,
      haz un chequeo de Ld usando el Liderazgo más alto disponible; por cada punto que lo superes
      puedes desplegar tantos miembros a 6 pulgadas del Motor Mortis. En misiones donde no se pueda
      llevar el Motor Mortis, el Maestro de Cadáveres puede cargarlo a la espalda, lo que impide su
      movimiento (no puede correr). Si el Relicario es destruido, la energía espiritual estalla
      violentamente: la banda huye inmediatamente y cualquier modelo a D6+6 pulgadas sufre un
      impacto de F5 (los magos sufren D3 impactos en su lugar). El Espectro de Cairn creará otro y
      pierde D3 partidas descansando tras este proceso.
  applies_to:
    band: true
- id: band--ethereal
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.call-of-the-night-haint-mim.band.ethereal
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Ethereal
  effect: >-
    Spirits have a 4+ unmodifiable save against all attacks, taken after the To Hit roll. It may not
    be used with Dodge or Step Aside and has no effect against magical attacks. Missile attacks that
    fail to hit an ethereal model because of the save pass through, hitting the next closest target
    directly behind. The model is unaffected by terrain and may take a Leadership test in the
    movement phase to pass through any terrain piece and/or over water; if it starts its next turn
    inside a terrain piece it must take another Leadership test or be instantly taken out of action.
    After warband formation all items cost double for Ethereal models; items found are usable by
    both Ethereal and non-Ethereal models on a D6 roll of 5+, otherwise only by non-Ethereal models.
  source:
    manual: broheim.net
    printed_page: 1
    section: Special rules / Ethereal
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Call Of The Night Haint.pdf
  name_i18n:
    es: Etéreo
  effect_i18n:
    es: >-
      Los espíritus tienen una salvación de 4+ no modificable contra todos los ataques, que se
      realiza tras la tirada para impactar. No puede usarse con Esquiva ni Apartarse y no tiene
      efecto contra ataques mágicos. Los ataques de misil que no impacten a un modelo etéreo por la
      salvación pasan a través, impactando al siguiente objetivo más cercano detrás. El modelo no se
      ve afectado por el terreno y puede hacer un chequeo de Liderazgo en la fase de movimiento para
      atravesar cualquier pieza de terreno y/o el agua; si comienza su siguiente turno dentro de una
      pieza de terreno debe hacer otro chequeo de Liderazgo o quedar Fuera de combate
      instantáneamente. Tras la formación de la banda, todos los objetos cuestan el doble para los
      modelos etéreos; los objetos encontrados pueden usarlos etéreos y no etéreos con un 5+ en 1D6;
      si no, solo los no etéreos.
  applies_to:
    band: true
