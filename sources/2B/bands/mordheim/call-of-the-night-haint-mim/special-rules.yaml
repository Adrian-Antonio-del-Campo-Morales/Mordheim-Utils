- id: cairn-wraith--death-was-merely-the-beginning
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.call-of-the-night-haint-mim.cairn-wraith.death-was-merely-the-beginning
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Death Was Merely the Beginning
  effect: >-
    Cairn Wraiths cannot die, as they are already dead. Any time the Cairn Wraith rolls 11-15 Dead
    on the serious injury table, he may be returned to the warband by paying his hiring cost plus
    two times his experience points, provided an existing Requilary is present. If both the
    Requilary and the Cairn Wraith are destroyed in one round, the warband is disbanded.
  source:
    manual: broheim.net
    printed_page: 4
    section: 1 Cairn Wraith / Special Rules / Death Was Merely The Beginning
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Call Of The Night Haint.pdf
  name_i18n:
    es: La Muerte Fue Solo el Comienzo
  effect_i18n:
    es: >-
      Los Espectros de Cairn no pueden morir, pues ya están muertos. Siempre que el Espectro de
      Cairn saque 11-15 Muerto en la tabla de heridas graves, puede volver a la banda pagando su
      coste de contratación más dos veces sus puntos de experiencia, siempre que exista un
      Relicario. Si tanto el Relicario como el Espectro de Cairn son destruidos en una misma ronda,
      la banda se disuelve.
  applies_to:
    profile_ids:
    - cairn-wraith
