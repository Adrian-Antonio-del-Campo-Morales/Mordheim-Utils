- id: band--characteristic-increase
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.call-of-the-night-haint-mim.band.characteristic-increase
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: characteristic-increase caps on advancement.
  name: Characteristic Increase (Wraith and Spirit Maximums)
  effect: >-
    Wraith maximums: M 5, WS 6, BS 4, S 4, T 3, W 5, I 5, A 3, Ld 10. Spirit maximums: M 5,
    WS 5, BS 0, S 4, T 3, W 4, I 5, A 3, Ld 9. Banshees and Malignant Spirits both use the Spirit
    Maximum; the Corpse Master is mostly human and uses the maximum characteristics of one.
  source:
    manual: broheim.net
    printed_page: 1
    section: Characteristic Increase
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Call Of The Night Haint.pdf
  name_i18n:
    es: Aumento de Características (Máximos de Espectro y Espíritu)
  effect_i18n:
    es: >-
      Máximos de Espectro: M 5, HA 6, HP 4, F 4, R 3, H 5, I 5, A 3, L 10. Máximos de
      Espíritu: M 5, HA 5, HP 0, F 4, R 3, H 4, I 5, A 3, L 9. Tanto las Banshees como los Espíritus
      Malignos usan el Máximo de Espíritu; el Maestro de Cadáveres es básicamente humano y usa los
      máximos del humano.
  applies_to:
    band: true
- id: tomb-banshee--siren-song
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.call-of-the-night-haint-mim.tomb-banshee.siren-song
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: charming an enemy in close combat is a combat-phase mechanic. Tomb Banshee only.
  name: Siren Song
  effect: >-
    The terrifying howl of the Banshee takes on a sweet harmonic value in the ears of some men, in
    combat the Banshee may choose to charm the enemy, the enemy model must pass a Ld on 3d6, discarding
    the lowest D6 result. If failed the model can not attack the banshee and is automatically hit in
    close combat, once they pass they do not have to test again for the duration of the game. The
    Banshee can only charm 1 enemy at a time, and cannot charm models immune to psychology. Tomb Banshee
    only.
  source:
    manual: broheim.net
    printed_page: 2
    section: Heroes / 0-1 Tomb Banshee / Special Rules / Siren Song
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Call Of The Night Haint.pdf
  name_i18n:
    es: Canto de Sirena
  effect_i18n:
    es: >-
      El aterrador aullido de la Banshee adopta un dulce valor armónico en los oídos de algunos hombres:
      en combate, la Banshee puede optar por encantar al enemigo, y el modelo enemigo debe superar un Ld
      con 3D6, descartando el resultado más bajo. Si falla, el modelo no puede atacar a la banshee y es
      impactado automáticamente en combate cuerpo a cuerpo; una vez lo supera, no vuelve a hacer el
      chequeo durante el resto de la partida. La Banshee solo puede encantar a 1 enemigo a la vez y no
      puede encantar a modelos inmunes a la psicología. Solo Banshee de Tumba.
  applies_to:
    profile_ids:
    - tomb-banshee
- id: corpse-master--conduit-of-death
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.call-of-the-night-haint-mim.corpse-master.conduit-of-death
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: spending sacrificed corpses to perform a Ritual of the Requilary is a magic-subsystem
        interaction.
  name: Conduit of Death
  effect: >-
    Part of the Corpse Master's Duties is feeding the Requilary and releasing the stored energies of
    Shyish at time and ways beneficial to his Spectral masters. By feeding corpses into the Requilary
    the Corpsemaster may release powerful Death spells from within. Once per battle the Corpse Master
    may sacrifice as many corpses as needed to Perform 1 Ritual of the Requilary. Rituals of the
    Requilary.
  source:
    manual: broheim.net
    printed_page: 3
    section: Henchmen / Corpse Master / Special Rules / Conduit of Death
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Call Of The Night Haint.pdf
  name_i18n:
    es: Canal de la Muerte
  effect_i18n:
    es: >-
      Parte de las tareas del Maestro de Cadáveres es alimentar el Relicario y liberar las energías de
      Shyish almacenadas en el momento y la forma que beneficien a sus amos espectrales. Al introducir
      cadáveres en el Relicario, el Maestro de Cadáveres puede liberar poderosos hechizos de Muerte desde
      su interior. Una vez por batalla, el Maestro de Cadáveres puede sacrificar tantos cadáveres como sea
      necesario para realizar 1 Ritual del Relicario. Rituales del Relicario.
  applies_to:
    profile_ids:
    - corpse-master
- id: poltergeists--cause-ruckus
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.call-of-the-night-haint-mim.poltergeists.cause-ruckus
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: a shooting attack with a fixed profile is a shooting-phase mechanic.
  name: Cause Ruckus
  effect: >-
    Poltergeists may make a shooting attack with a Range of 6" with no penalties whatsoever, as they
    throw whatever isn't bolted down at their victim. The attack fires twice and has a Strength of 1.
  source:
    manual: broheim.net
    printed_page: 5
    section: Henchmen / 0-2 Poltergeists / Special Rules / Cause Ruckus
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Call Of The Night Haint.pdf
  name_i18n:
    es: Armar Alboroto
  effect_i18n:
    es: >-
      Los Poltergeist pueden realizar un ataque de disparo con un Alcance de 6" sin penalizador alguno, ya
      que arrojan contra su víctima todo lo que no esté atornillado. El ataque dispara dos veces y tiene
      una Fuerza de 1.
  applies_to:
    profile_ids:
    - poltergeists
- id: band--skill-wight-walk
  kind: warband_skill
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.call-of-the-night-haint-mim.band.wight-walk
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: charging through walls is a movement-phase mechanic. Ethereal models only.
  name: Wight Walk
  effect: >-
    The Ghost has mastered control of their spectral form. They are now able to use their ethereal
    ability to charge through walls, and cannot be intercepted as they phase through any warrior
    blocking their path. Ethereal models only.
  source:
    manual: broheim.net
    printed_page: 2
    section: Special skills / Wight Walk
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Call Of The Night Haint.pdf
  name_i18n:
    es: Paso Espectral
  effect_i18n:
    es: >-
      El Espíritu ha dominado el control de su forma espectral. Ahora puede usar su capacidad etérea para
      cargar a través de los muros y no puede ser interceptado mientras atraviesa a cualquier guerrero que
      le cierre el paso. Solo modelos etéreos.
  applies_to:
    band: true
