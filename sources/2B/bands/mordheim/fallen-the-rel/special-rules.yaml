schema_version: 2
band_id: fallen-the-rel
rules:
- id: band--eaters-of-flesh
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.fallen-the-rel.band.eaters-of-flesh
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Eaters of Flesh
  effect: >-
    Make a note of any enemy model that is taken out of action by a warrior with the Eaters of Flesh
    special rule. If it is a hero he must deduct 1 from his serious injury roll. If it is a henchman
    he is removed from the warband on D6 roll of 1-3 instead of 1-2.
  source:
    manual: Broheim
    printed_page: 12
    section: The Fallen / Special Rules / Eaters of Flesh
    url: https://broheim.net/downloads/fo/97RelicsoftheCrusadesPt2.pdf
  name_i18n:
    es: Comedores de Carne
  effect_i18n:
    es: >-
      Anota cualquier modelo enemigo que sea dejado fuera de combate por un guerrero con la regla
      especial Comedores de Carne. Si es un héroe, debe restar 1 a su tirada de herida grave. Si es
      un secuaz, es retirado de la banda con un resultado de 1D6 de 1-3 en lugar de 1-2.
  applies_to:
    band: true
- id: revenant--leader
