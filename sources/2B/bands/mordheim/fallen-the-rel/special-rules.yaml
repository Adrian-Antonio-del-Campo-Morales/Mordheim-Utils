- id: revenant--eaters-of-flesh
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.fallen-the-rel.revenant.eaters-of-flesh
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Eaters of Flesh
  effect: >-
    If the Revenant takes a living enemy out of action and is not in base contact with an enemy
    model, he will be stricken with a hunger for blood and flesh. He must make a Leadership test and
    if he fails he will start eating the body. He may do nothing during these turns. When D3 turns
    are up or he is hit by an attack he may take his turns as normal.
  source:
    manual: Broheim
    printed_page: 13
    section: Heroes / 1 Revenant / Special Rules / Eaters of Flesh
    url: https://broheim.net/downloads/fo/97RelicsoftheCrusadesPt2.pdf
  name_i18n:
    es: Comedores de Carne
  effect_i18n:
    es: >-
      Si el Espectro deja fuera de combate a un enemigo vivo y no está en contacto base con un
      modelo enemigo, le asaltará un hambre de sangre y carne. Debe hacer un chequeo de Liderazgo y,
      si falla, empezará a comerse el cuerpo. No puede hacer nada durante esos turnos. Cuando pasen
      1D3 turnos o sea golpeado por un ataque, podrá actuar con normalidad.
  applies_to:
    profile_ids:
    - revenant
