  name: Leader
  effect: Any friendly warrior within 6" of the Revenant may use his Leadership instead of his own.
  source:
    manual: Broheim
    printed_page: 13
    section: Heroes / 1 Revenant / Special Rules / Leader
    url: https://broheim.net/downloads/fo/97RelicsoftheCrusadesPt2.pdf
  name_i18n:
    es: Líder
  effect_i18n:
    es: Cualquier guerrero amistoso a 6" del Espectro puede usar su Liderazgo en lugar del propio.
  applies_to:
    profile_ids:
    - revenant
