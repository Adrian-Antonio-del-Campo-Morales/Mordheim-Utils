  name: Cause Fear
  effect: Skeletons are terrifying Undead creatures and therefore cause fear.
  source:
    manual: broheim.net
    printed_page: 53
    section: henchmen / Skeletons / Special Rules / Cause Fear
    url: https://broheim.net/downloads/campaigns/karakazgal/Karak Azgal.pdf
