    The Bats ignore terrain when they move and can freely charge any model that they can see,
    regardless of height and interceptors.
  source:
    manual: broheim.net
    printed_page: 53
    section: henchmen / 0-5 Bats / Special Rules / Flyers
    url: https://broheim.net/downloads/campaigns/karakazgal/Karak Azgal.pdf
  name_i18n:
    es: Voladores
  effect_i18n:
