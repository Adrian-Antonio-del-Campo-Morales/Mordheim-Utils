    es: Causan Miedo
  effect_i18n:
    es: Los Esqueletos son criaturas No-Muertas aterradoras y por tanto causan miedo.
  applies_to:
    profile_ids:
    - skeletons
- id: skeletons--may-not-run
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.strigoi-kaz.skeletons.may-not-run
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: campaign, shooting, movement, terrain, deployment, or non-duel context.
  name: May Not Run
  effect: Skeletons are slow Undead creatures and may not run (but may charge normally).
  source:
    manual: broheim.net
    printed_page: 53
    section: henchmen / Skeletons / Special Rules / May not Run
    url: https://broheim.net/downloads/campaigns/karakazgal/Karak Azgal.pdf
  name_i18n:
    es: No Pueden Correr
  effect_i18n:
    es: >-
      Los Esqueletos son criaturas No-Muertas lentas y no pueden correr (pero pueden cargar con
      normalidad).
  applies_to:
    profile_ids:
    - skeletons
- id: skeletons--immune-to-psychology
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.strigoi-kaz.skeletons.immune-to-psychology
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: psychology.
  name: Immune to Psychology
  effect: Skeletons are not affected by psychology and never leave combat.
  source:
    manual: broheim.net
    printed_page: 53
    section: henchmen / Skeletons / Special Rules / Immune to Psychology
    url: https://broheim.net/downloads/campaigns/karakazgal/Karak Azgal.pdf
  name_i18n:
    es: Inmunes a la Psicología
  effect_i18n:
    es: Los Esqueletos no se ven afectados por la psicología y nunca abandonan el combate.
  applies_to:
    profile_ids:
    - skeletons
- id: skeletons--immune-to-poison
  runtime:
