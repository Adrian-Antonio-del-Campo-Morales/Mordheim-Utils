      scope: 'YES'
      binding:
        kind: trait
        id: trait.poison-immune
  name: Immune to Poison
  effect: Skeletons are not affected by any drug or poison.
  source:
    manual: broheim.net
    printed_page: 53
    section: henchmen / Skeletons / Special Rules / Immune to Poison
