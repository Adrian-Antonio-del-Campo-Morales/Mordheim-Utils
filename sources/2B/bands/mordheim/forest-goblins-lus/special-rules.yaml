schema_version: 2
band_id: forest-goblins-lus
rules:
- id: band--camouflage
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.forest-goblins-lus.band.camouflage
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Camouflage
  effect: >-
    Instead of spotting Forest Goblins automatically when hidden within an enemy's Initiative
    distance, the enemy must first roll equal to or under their Initiative to detect the Goblin.
  source:
    manual: broheim.net
    printed_page: 1
    section: Special Rules / Camoflague
    url: https://broheim.net/downloads/warbands/supplement/lustria/Forest Goblins.pdf
  name_i18n:
    es: Camuflaje
  effect_i18n:
    es: >-
      En lugar de detectar automáticamente a los Goblins del Bosque ocultos dentro de la distancia
      de Iniciativa de un enemigo, este debe primero sacar igual o menos que su Iniciativa para
      detectar al Goblin.
  applies_to:
    band: true
- id: band--natives
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.forest-goblins-lus.band.natives
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Natives
  effect: Forest Goblins suffer no movement penalties from moving through jungle terrain.
  source:
    manual: broheim.net
    printed_page: 1
    section: Special Rules / Natives
    url: https://broheim.net/downloads/warbands/supplement/lustria/Forest Goblins.pdf
  name_i18n:
    es: Nativos
  effect_i18n:
    es: >-
      Los Goblins del Bosque no sufren penalizaciones de movimiento al desplazarse por terreno de
      selva.
  applies_to:
    band: true
- id: band--animosity
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.forest-goblins-lus.band.animosity
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Animosity
  effect: >-
    At the start of the Goblin player's turn, roll a D6 for each hero or henchman who suffers from
    animosity and is not engaged in hand-to-hand combat. On a 1, roll another D6: 1 = "I 'Erd Dat!"
    the warrior immediately charges the nearest friendly Goblin henchman or Hired Sword within
    charge reach and fights a round of close combat (afterwards the models move 1 inch apart); if no
    target is within reach and the warrior has a missile weapon, he shoots the nearest Goblin
    henchman or hired sword; otherwise treat as 2-5. 2-5 = "Wud Yoo Say?" the warrior spends the
    turn hurling insults and may do nothing else, though he may defend himself. 6 = "I'll Show Yer!"
    the warrior must move as quickly as possible towards the nearest enemy, charging if possible; if
    no enemy is visible he makes an immediate normal move in addition to his regular move; if the
    extra move brings an enemy within charge reach, he must charge during his regular movement.
  source:
    manual: broheim.net
    printed_page: 1
    section: Special Rules / Animosity
    url: https://broheim.net/downloads/warbands/supplement/lustria/Forest Goblins.pdf
  name_i18n:
    es: Rencor
  effect_i18n:
    es: >-
      Al inicio del turno del jugador goblin, tira 1D6 por cada héroe o secuaz afectado por Rencor
      que no esté en combate cuerpo a cuerpo. Con un 1, tira otro 1D6: 1 = "¡Yo lo oí!" el guerrero
      carga inmediatamente contra el secuaz goblin amigo o Espada a Sueldo más cercano dentro de
      alcance de carga y lucha un asalto (después los modelos se separan 1 pulgada); si no hay
      objetivo al alcance y tiene arma de misil, dispara al secuaz goblin o Espada a Sueldo más
      cercano; en otro caso, trata el resultado como 2-5. 2-5 = "¿Qué dijiste?" el guerrero pasa el
      turno insultando y no puede hacer nada más, aunque puede defenderse. 6 = "¡Ya te enseñaré!" el
      guerrero debe moverse lo más rápido posible hacia el enemigo más cercano, cargando si es
      posible; si no hay enemigo visible, realiza un movimiento normal inmediato adicional a su
      movimiento regular; si ese movimiento extra acerca a un enemigo a alcance de carga, debe
      cargar durante su movimiento regular.
  applies_to:
    band: true
- id: chieftain--leader
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.forest-goblins-lus.chieftain.leader
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Leader
  effect: >-
    Any models in the warband within 6 inches may use the Chieftain's Leadership instead of their
    own.
  source:
    manual: broheim.net
    printed_page: 4
    section: 1 Chieftan / Special Rules / Leader
    url: https://broheim.net/downloads/warbands/supplement/lustria/Forest Goblins.pdf
  name_i18n:
    es: Líder
  effect_i18n:
    es: >-
      Cualquier modelo de la banda a 6 pulgadas puede usar el Liderazgo del Jefe Tribal en lugar del
      suyo.
  applies_to:
    profile_ids:
    - chieftain
- id: bosses--animosity
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.forest-goblins-lus.bosses.animosity
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Animosity
  effect: >-
    Bosses are subject to the rules for Animosity. A Forest Goblin Boss may choose to remove his
    Animosity instead of choosing a skill, should he earn one.
  source:
    manual: broheim.net
    printed_page: 4
    section: 0-4 Bosses / Special Rules / Animosity
    url: https://broheim.net/downloads/warbands/supplement/lustria/Forest Goblins.pdf
  name_i18n:
    es: Rencor
  effect_i18n:
    es: >-
      Los Capataces están sujetos a las reglas de Rencor. Un Capataz goblin puede elegir eliminar su
      Rencor en lugar de elegir una habilidad, si gana una.
  applies_to:
    profile_ids:
    - bosses
- id: shaman--wizard
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.forest-goblins-lus.shaman.wizard
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: no effect applies to the current engine scope.
  name: Wizard
  effect: >-
    A Forest Goblin Shaman begins with one spell randomly chosen from the Forest Goblin Spell list.
  source:
    manual: broheim.net
    printed_page: 4
    section: 0-1 Forest Goblin Shaman / Special Rules / Wizard
    url: https://broheim.net/downloads/warbands/supplement/lustria/Forest Goblins.pdf
  name_i18n:
    es: Mago
  effect_i18n:
    es: >-
      Un Chamán goblin comienza con un hechizo elegido aleatoriamente de la lista de hechizos de los
      Goblins del Bosque.
  applies_to:
    profile_ids:
    - shaman
- id: forest-goblins--animosity
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.forest-goblins-lus.forest-goblins.animosity
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Animosity
  effect: Forest Goblins are subject to the rules for Animosity.
  source:
