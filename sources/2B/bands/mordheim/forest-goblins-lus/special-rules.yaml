    printed_page: 5
    section: Forest Goblins / Special Rules / Animosity
    url: https://broheim.net/downloads/warbands/supplement/lustria/Forest Goblins.pdf
  name_i18n:
    es: Rencor
  effect_i18n:
    es: Los Goblins del Bosque están sujetos a las reglas de Rencor.
  applies_to:
    profile_ids:
    - forest-goblins
- id: red-toof-clan-goblins--animosity
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.forest-goblins-lus.red-toof-clan-goblins.animosity
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Animosity
  effect: Red Toof Clan Goblins are subject to the rules for Animosity.
  source:
    manual: broheim.net
    printed_page: 5
    section: 1-5 Red Toof Clan Goblins / Special Rules / Animosity
    url: https://broheim.net/downloads/warbands/supplement/lustria/Forest Goblins.pdf
  name_i18n:
    es: Rencor
  effect_i18n:
    es: Los Goblins del Clan Colaroja están sujetos a las reglas de Rencor.
  applies_to:
    profile_ids:
    - red-toof-clan-goblins
- id: red-toof-clan-goblins--berserkers
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.forest-goblins-lus.red-toof-clan-goblins.berserkers
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Berserkers
  effect: >-
    Red Toof Clan Goblins allow themselves to be bitten by poisonous wildlife before battle; the
    venom makes them extremely ferocious. They are affected by the rules for Frenzy. In addition, if
    they begin their turn within charge range of an enemy, they are immune to animosity for that
    turn.
  source:
    manual: broheim.net
    printed_page: 5
    section: 1-5 Red Toof Clan Goblins / Special Rules / Berserkers
    url: https://broheim.net/downloads/warbands/supplement/lustria/Forest Goblins.pdf
  name_i18n:
    es: Berserkers
  effect_i18n:
    es: >-
      Los Goblins del Clan Colaroja se dejan morder por fauna venenosa antes de la batalla; el
      veneno los vuelve extremadamente feroces. Se ven afectados por las reglas de Frenesí. Además,
      si comienzan su turno dentro del alcance de carga de un enemigo, son inmunes al Rencor durante
      ese turno.
  applies_to:
    profile_ids:
    - red-toof-clan-goblins
- id: sluggas--animosity
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.forest-goblins-lus.sluggas.animosity
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Animosity
  effect: Forest Goblin Sluggas are subject to the rules for Animosity.
  source:
    manual: broheim.net
    printed_page: 5
    section: 0-5 Forest Goblin Sluggas / Special Rules / Animosity
    url: https://broheim.net/downloads/warbands/supplement/lustria/Forest Goblins.pdf
  name_i18n:
    es: Rencor
  effect_i18n:
    es: Los Apedreadores goblins están sujetos a las reglas de Rencor.
  applies_to:
    profile_ids:
    - sluggas
- id: sluggas--sluggas
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.forest-goblins-lus.sluggas.sluggas
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: no effect applies to the current engine scope.
  name: Sluggas
  effect: >-
    In the shooting phase, Sluggas may throw thrown weapons up to three times. This may not be
    combined with Quick Shot if they are promoted to hero status.
  source:
    manual: broheim.net
    printed_page: 5
    section: 0-5 Forest Goblin Sluggas / Special Rules / Sluggas
    url: https://broheim.net/downloads/warbands/supplement/lustria/Forest Goblins.pdf
  name_i18n:
    es: Apedreadores
  effect_i18n:
    es: >-
      En la fase de disparo, los Apedreadores pueden lanzar armas arrojadizas hasta tres veces. Esto
      no puede combinarse con Disparo Rápido si son ascendidos a estatus de héroe.
  applies_to:
    profile_ids:
    - sluggas
- id: gigantic-spider--fear
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.forest-goblins-lus.gigantic-spider.fear
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Fear
  effect: Gigantic Spiders cause fear as described in the Mordheim Rulebook.
  source:
    manual: broheim.net
    printed_page: 5
    section: 0-1 Gigantic Spider / Special Rules / Fear
    url: https://broheim.net/downloads/warbands/supplement/lustria/Forest Goblins.pdf
  name_i18n:
    es: Miedo
  effect_i18n:
    es: Las Arañas Gigantescas causan miedo tal como se describe en el reglamento de Mordheim.
  applies_to:
    profile_ids:
    - gigantic-spider
- id: gigantic-spider--large-monster
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.forest-goblins-lus.gigantic-spider.large-monster
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: no effect applies to the current engine scope.
  name: Large Monster
  effect: >-
    Gigantic Spiders are large targets and may always be shot at, regardless of whether they are the
    closest.
  source:
    manual: broheim.net
    printed_page: 5
    section: 0-1 Gigantic Spider / Special Rules / Large Monster
    url: https://broheim.net/downloads/warbands/supplement/lustria/Forest Goblins.pdf
  name_i18n:
    es: Monstruo Grande
  effect_i18n:
    es: >-
      Las Arañas Gigantescas son objetivos grandes y siempre pueden ser disparadas, sean o no las
      más cercanas.
  applies_to:
    profile_ids:
    - gigantic-spider
- id: gigantic-spider--poisonous
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: trait.poisonous-injury
      scope: 'YES'
      binding:
        kind: trait
        id: trait.poisonous-injury
        parameters:
          value: true
  name: Poisonous
  effect: >-
    The Gigantic Spider's maw drips with vile poisons. When it wounds an enemy and a roll is made on
    the injury table: 1 = knocked down, 2-4 = stunned, 5-6 = out of action.
  source:
    manual: broheim.net
    printed_page: 5
    section: 0-1 Gigantic Spider / Special Rules / Poisonous
    url: https://broheim.net/downloads/warbands/supplement/lustria/Forest Goblins.pdf
  name_i18n:
    es: Venenoso
  effect_i18n:
    es: >-
      El hocico de la Araña Gigantesca gotea venenos repugnantes. Cuando hiere a un enemigo y se
      tira en la tabla de heridas: 1 = derribado, 2-4 = aturdido, 5-6 = Fuera de combate.
  applies_to:
    profile_ids:
    - gigantic-spider
- id: gigantic-spider--native
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.forest-goblins-lus.gigantic-spider.native
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: no effect applies to the current engine scope.
  name: Native
  effect: >-
    Negotiating jungle terrain is no trouble for spiders; they move through jungle without penalty.
  source:
    manual: broheim.net
    printed_page: 5
    section: 0-1 Gigantic Spider / Special Rules / Native
    url: https://broheim.net/downloads/warbands/supplement/lustria/Forest Goblins.pdf
  name_i18n:
    es: Nativo
  effect_i18n:
    es: El terreno de selva no es problema para las arañas; se mueven por la selva sin penalización.
  applies_to:
    profile_ids:
    - gigantic-spider
- id: gigantic-spider--may-ride
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.forest-goblins-lus.gigantic-spider.may-ride
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: May Ride
  effect: >-
    The Forest Goblin Chieftain may ride the Gigantic Spider using the optional mounts rules. He
    gains +1 armour save and moves at the spider's rate of 6. Shooting attacks hit the Chieftain on
    a roll of 1-2 and the spider on 3-6; in close combat the opponent may choose which to hit. The
    spider no longer checks for Stupidity while ridden.
  source:
    manual: broheim.net
    printed_page: 6
    section: 0-1 Gigantic Spider / Special Rules / May Ride
    url: https://broheim.net/downloads/warbands/supplement/lustria/Forest Goblins.pdf
  name_i18n:
    es: Montable
  effect_i18n:
    es: >-
      El Jefe Tribal goblin puede montar la Araña Gigantesca usando las reglas opcionales de
      monturas. Gana +1 a su salvación por armadura y se mueve al ritmo de la araña (6). Los ataques
      de disparo impactan al Jefe Tribal con un 1-2 y a la araña con un 3-6; en cuerpo a cuerpo el
      oponente elige a quién golpear. La araña no hace chequeos de Estupidez mientras sea montada.
  applies_to:
    profile_ids:
    - gigantic-spider
- id: gigantic-spider--nonsentient
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.forest-goblins-lus.gigantic-spider.nonsentient
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Nonsentient
  effect: >-
    Spiders are affected by the Stupidity rules. They never gain experience, as they are animals,
    but they may climb as normal.
  source:
    manual: broheim.net
    printed_page: 6
    section: 0-1 Gigantic Spider / Special Rules / Nonsentient
    url: https://broheim.net/downloads/warbands/supplement/lustria/Forest Goblins.pdf
  name_i18n:
    es: No Sintiente
  effect_i18n:
    es: >-
      Las arañas se ven afectadas por las reglas de Estupidez. Nunca ganan experiencia, pues son
      animales, pero pueden trepar con normalidad.
  applies_to:
    profile_ids:
    - gigantic-spider
- id: band--maximum-characteristics
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.forest-goblins-lus.band.maximum-characteristics
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: characteristic-increase caps on advancement.
  name: Forest Goblin Maximum Characteristics
  effect: >-
    Characteristics for Forest Goblin warriors may not be increased beyond the maximum limits: M 5,
    WS 3, BS 5, S 4, T 4, W 2, I 6, A 3, Ld 7. If a characteristic is at its maximum, take the other
    option or roll again if you can only increase one characteristic. If both are already at their
    maximum, you may increase any other by +1 instead. Remember that Henchman can only add +1 to any
    characteristic.
  source:
    manual: broheim.net
    printed_page: 2
    section: Maximum Characteristics
    url: https://broheim.net/downloads/warbands/supplement/lustria/Forest Goblins.pdf
  name_i18n:
    es: Características Máximas de los Goblins del Bosque
  effect_i18n:
    es: >-
      Las características de los guerreros Goblins del Bosque no pueden aumentarse más allá de
      los límites máximos: M 5, HA 3, HP 5, F 4, R 4, H 2, I 6, A 3, L 7. Si una característica está
      en su máximo, toma la otra opción o vuelve a tirar si solo puedes aumentar una característica.
      Si ambas están ya en su máximo, puedes aumentar cualquier otra en +1 en su lugar. Recuerda que
      los secuaces solo pueden añadir +1 a cualquier característica.
  applies_to:
    band: true
