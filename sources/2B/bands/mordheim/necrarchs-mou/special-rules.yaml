    A Banshee is a spirit, rather than a creature of bone and dead flesh. It is not affected in its
    movement by models or small obstacles. Only solid walls (no windows!) can stop its movement.
  source:
    manual: broheim.net
    printed_page: 6
    section: 0-2 Banshees / Special Rules
    url: https://broheim.net/downloads/warbands/supplement/mousillon/Necrarchs%20(2).pdf
  name_i18n:
    es: Etérea
  effect_i18n:
    es: >-
      Una Aulladora es un espíritu, más que una criatura de hueso y carne muerta. No se ve afectada
      en su movimiento por modelos u obstáculos pequeños. Solo los muros sólidos (¡no ventanas!)
      pueden detener su movimiento.
