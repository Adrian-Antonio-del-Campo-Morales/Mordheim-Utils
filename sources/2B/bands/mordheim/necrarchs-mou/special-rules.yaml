    es: >-
      El toque gélido de un Espectro puede congelar a su oponente cuando todo el calor drena de su
      cuerpo. Cada vez que un Espectro golpea, su oponente tiene -1 HA. Varios golpes tienen un
      efecto acumulativo, que dura hasta que uno de los modelos abandona el combate. Si un modelo se
      reduce a HA 0, se desmayará automáticamente y cuenta como derribado.
  applies_to:
