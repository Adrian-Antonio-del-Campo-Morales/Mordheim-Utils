    - nosferatu
- id: nosferatu--necrolore
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.necrarchs-mou.nosferatu.necrolore
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: no effect applies to the current engine scope.
  name: Necrolore
  effect: >-
    The Nosferatu are dark scholars, and enhance their abilities with knowledge gleaned from ancient
    tomes. Instead of searching for rare equipment, a Nosferatu may purchase one permanent Necrolore
    ability (see Necrolore Abilities).
  source:
    manual: broheim.net
    printed_page: 4
    section: Nosferatu / Special Rules
    url: https://broheim.net/downloads/warbands/supplement/mousillon/Necrarchs%20(2).pdf
  name_i18n:
    es: Necroconocimiento
  effect_i18n:
    es: >-
      Los Nosferatu son estudiosos oscuros que potencian sus habilidades con conocimiento extraído
      de tomos antiguos. En lugar de buscar equipo raro, un Nosferatu puede comprar una habilidad
      permanente de Necroconocimiento (ver Habilidades de Necroconocimiento).
  applies_to:
    profile_ids:
    - nosferatu
- id: nosferatu--tattered-mind
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.necrarchs-mou.nosferatu.tattered-mind
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: no effect applies to the current engine scope.
  name: Tattered Mind
  effect: >-
    Years of studying unholy tomes and dark rituals have taken their toll on the Nosferatu. The
    vampire is prone to bouts of insanity, especially under great pressure. If the Necrarch vampire
    is officially alone (All Alone rule) or loses a wound without an Injury result, he loses his
    grip on reality and immediately moves 2D6" in a random direction. Roll on the Madness serious
    injury result (0-3 Stupidity, 4-6 Frenzied). This lasts until the end of the next combat phase.
    As long as he is mad he cannot cast spells. Note that this move may take him into combat, in
    which case he counts as charging in the next combat phase. This move may also take him out of
    combat.
  source:
    manual: broheim.net
    printed_page: 4
    section: Nosferatu / Special Rules
    url: https://broheim.net/downloads/warbands/supplement/mousillon/Necrarchs%20(2).pdf
  name_i18n:
    es: Mente Hecha Trizas
  effect_i18n:
    es: >-
      Años de estudiar tomes impíos y rituales oscuros han pasado factura al Nosferatu. El vampiro
      es propenso a ataques de locura, especialmente bajo gran presión. Si el vampiro Necrarca está
      oficialmente solo (regla Todo Solo) o pierde una herida sin resultado de Herida, pierde el
      contacto con la realidad y se mueve inmediatamente 2D6 pulgadas en una dirección aleatoria.
      Tira en el resultado de herida grave Locura (0-3 Estupidez, 4-6 Frenético). Dura hasta el
      final de la siguiente fase de combate. Mientras esté loco no puede lanzar hechizos. Ten en
      cuenta que este movimiento puede llevarlo a combate, en cuyo caso cuenta como carga en la
      siguiente fase de combate. Este movimiento también puede sacarlo del combate.
  applies_to:
    profile_ids:
    - nosferatu
