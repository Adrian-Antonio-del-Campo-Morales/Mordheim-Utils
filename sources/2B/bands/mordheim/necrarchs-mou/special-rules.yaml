schema_version: 2
band_id: necrarchs-mou
rules:
- id: band--necrolore-abilities
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.necrarchs-mou.band.necrolore-abilities
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: no effect applies to the current engine scope.
  name: Necrolore Abilities
  effect: >-
    Instead of searching for rare equipment, a Nosferatu may purchase one permanent Necrolore
    ability. The costs shown are for the first ability only; subsequent abilities cost double. Each
    Necrolore may be purchased once only unless specified otherwise. Kin Hatred (25 gc): the
    Nosferatu hates other vampires, and will score a critical hit on a 5 or 6 when fighting other
    vampires in hand-to-hand combat. Eternal Study (25 gc): he gains a 4+ save against the Tattered
    Mind rule. Necromantic Flood (20 gc): once per battle he may reroll a failed difficulty test to
    cast a spell. Corpus Paella (20 gc): one knocked down Skeleton, Wight, Defiled or Abomination
    within 6" may stand up and act as normal this round. Bone Wizard (30 gc): the Nosferatu may add
    D3-1 skeletons to the warband for the next battle, which count towards routing. Imbuing the
    Undead (30 gc): once per battle he may cast Vanhel's Dance Macabre during his magic phase; one
    type of undead warrior in the warband (including the Defiled) may make a charge or march move
    (double M); all warriors of that type are affected, and if this move brings a model into close
    combat it counts as charging.
  source:
    manual: broheim.net
    printed_page: 3
    section: Necrolore
    url: https://broheim.net/downloads/warbands/supplement/mousillon/Necrarchs%20(2).pdf
  name_i18n:
    es: Habilidades de Necroconocimiento
  effect_i18n:
    es: >-
      En lugar de buscar equipo raro, un Nosferatu puede comprar una habilidad permanente de
      Necroconocimiento. Los costes indicados son solo para la primera habilidad; las siguientes
      cuestan el doble. Cada Necroconocimiento solo puede comprarse una vez salvo que se indique lo
      contrario. Odio de Estirpe (25 coronas): el Nosferatu odia a otros vampiros y obtiene un golpe
      crítico con un 5 o 6 al luchar contra otros vampiros en combate cuerpo a cuerpo. Estudio
      Eterno (25 coronas): obtiene una salvación de 4+ contra la regla Mente Hecha Trizas.
      Inundación Necromántica (20 coronas): una vez por batalla puede repetir una prueba de
      dificultad fallida para lanzar un hechizo. Corpus Paella (20 coronas): un Esqueleto, Espectro,
      Profanado o Abominación derribado dentro de 6 pulgadas puede levantarse y actuar con
      normalidad esta ronda. Mago de Huesos (30 coronas): el Nosferatu puede añadir D3-1 esqueletos
      a la banda para la próxima batalla, que cuentan para la huida. Imbuyendo a los Muertos (30
      coronas): una vez por batalla puede lanzar la Danza Macabra de Vanhel durante su fase de
      magia; un tipo de guerrero no muerto de la banda (incluidos los Profanados) puede realizar una
      carga o marcha (doble M); todos los guerreros de ese tipo se ven afectados, y si ese
      movimiento lleva a un modelo a combate cuerpo a cuerpo cuenta como carga.
  applies_to:
    band: true
