  name: Wailing
  effect: >-
    Instead of a physical attack, the banshee emits a piercing wail. This attack has a 4" reach and
    counts as a S3. Roll to hit as normal with the Banshee's WS. The wail attack always occurs
    before any combat takes place. If the banshee gains a strength advance, its wailing strength
    increases. A wail ignores all armour saves, and cannot be parried.
  source:
    manual: broheim.net
    printed_page: 6
    section: 0-2 Banshees / Special Rules
    url: https://broheim.net/downloads/warbands/supplement/mousillon/Necrarchs%20(2).pdf
  name_i18n:
    es: Aullido
  effect_i18n:
    es: >-
      En lugar de un ataque físico, la aulladora emite un aullido penetrante. Este ataque tiene un
      alcance de 4 pulgadas y cuenta como F3. Tira para golpear con normalidad usando la HA de la
      Aulladora. El aullido siempre ocurre antes de que tenga lugar cualquier combate. Si la
      aulladora gana un avance de Fuerza, la fuerza de su aullido aumenta. Un aullido ignora todas
      las tiradas de salvación por armadura y no puede ser parado.
  applies_to:
    profile_ids:
    - banshee
