- id: banshee--cold-steel
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.necrarchs-mou.banshee.cold-steel
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: no effect applies to the current engine scope.
  name: Cold Steel
  effect: >-
    While a Banshee cannot be killed by mundane weapons, it can still feel the cold bite of steel
    and other metals. If concentrated, these attacks can drive off the spirit. Any attack made with
    a steel/iron weapon (ie. anything but clubs, fists etc.) can harm it, but is at -1 to hit.
    Blessed and magic weapons (weeping blades, warplock pistols etc.) hit normally.
    Arrows/bolts/bullets are considered being iron tipped. Treat injuries normally (ie. knocked
    down, stunned) as the banshee loses its grip on the physical plane. An OOA will send the beast
    back to the spirit realm.
  source:
    manual: broheim.net
    printed_page: 6
    section: 0-2 Banshees / Special Rules
    url: https://broheim.net/downloads/warbands/supplement/mousillon/Necrarchs%20(2).pdf
  name_i18n:
    es: Acero Frío
  effect_i18n:
    es: >-
      Aunque una Aulladora no puede ser muerta por armas mundanas, todavía puede sentir el frío
      mordisco del acero y otros metales. Si se concentran, estos ataques pueden expulsar al
      espíritu. Cualquier ataque con un arma de acero/hierro (es decir, cualquier cosa excepto
      mazas, puños, etc.) puede dañarla, pero con -1 para golpear. Las armas bendecidas y mágicas
      (hojas llorosas, pistolas warplock, etc.) golpean con normalidad. Flechas/saetas/balas se
      consideran con punta de hierro. Trata las heridas con normalidad (es decir, derribada,
      aturdida) cuando la aulladora pierde su asidero del plano físico. Un Fuera de Combate la
      devolverá al reino espiritual.
  applies_to:
