  name: Chill Touch
  effect: >-
    A Wight's chill touch can freeze its opponent as all heat drains from their body. Each time a
    Wight hits, their opponent is at -1 WS. Several hits have a cumulative effect, which lasts until
    one of the models leaves combat. Should a model be reduced to WS 0, he will automatically pass
    out and counts as knocked down.
  source:
    manual: broheim.net
