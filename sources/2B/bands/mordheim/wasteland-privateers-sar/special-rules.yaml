    Swabbies are not hired, they follow the special 'recruitment' rules (see the Sartosa campaign
    rules for capturing Swabbies).
  source:
    manual: broheim.net
    printed_page: 5
    section: Henchmen / 0-5 Swabbies / Special Rules
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Human%20Pirates.pdf
  name_i18n:
    es: No Contratados
  effect_i18n:
    es: >-
      Los Fregones no son contratados, siguen las reglas especiales de 'reclutamiento' (ver las
      reglas de campaña de Sartosa para capturar Fregones).
  applies_to:
