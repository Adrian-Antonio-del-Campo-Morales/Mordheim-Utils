      binding: null
      reason: >-
        Out of scope: no effect applies to the current engine scope.
  name: Large
  effect: Any model may shoot at a Draich, even if it is not the closest model.
  source:
    manual: Broheim
    printed_page: 3
    section: 1 Draich / Special Rules / Large
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Lords Of The Marsh.pdf
  name_i18n:
    es: Grande
  effect_i18n:
    es: Cualquier modelo puede disparar a un Draich, aunque no sea el modelo más cercano.
  applies_to:
    profile_ids:
    - draich
- id: draich--craven
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.lords-of-the-marsh-mim.draich.craven
