  name: Monstrous
  effect: >-
    When rolling for injury on the henchman chart only a roll of 1 kills; on a roll of 2-6 no
    injuries are sustained. The warrior also counts as 2 models when determining the maximum number
    allowed in the warband.
  source:
    manual: Broheim
    printed_page: 4
    section: 0-2 Fimir Warriors / Special Rules / Monstrous
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Lords Of The Marsh.pdf
  name_i18n:
    es: Monstruoso
  effect_i18n:
    es: >-
      Al tirar por heridas en la tabla de secuaces, solo un resultado de 1 mata; con 2-6 no se
      sufren heridas. Además, el guerrero cuenta como 2 modelos al determinar el máximo permitido en
      la banda.
  applies_to:
    profile_ids:
    - fimir-warriors
