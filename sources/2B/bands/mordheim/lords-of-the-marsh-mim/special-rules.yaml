  name: Fear
  effect: The horrifying embodiment of a swamp daemon means that the Daemon-Fimm causes fear.
  source:
    manual: Broheim
    printed_page: 3
    section: 0-2 Daemon-fimm / Special Rules / Fear
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Lords Of The Marsh.pdf
  name_i18n:
    es: Miedo
  effect_i18n:
    es: La horripilante encarnación de un demonio del pantano hace que el Daemon-Fimm cause miedo.
  applies_to:
    profile_ids:
    - daemon-fimm
- id: daemon-fimm--daemon-soul
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
