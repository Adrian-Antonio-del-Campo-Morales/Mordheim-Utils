schema_version: 2
band_id: lords-of-the-marsh-mim
rules:
- id: band--mutations
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.lords-of-the-marsh-mim.band.mutations
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Mutations
  effect: >-
    Any Fimir Hero may start the campaign with a single mutation from the Corrupted Characters
    chapter if they pay the appropriate cost (see page 76 of the Mordheim rulebook).
  source:
    manual: Broheim
    printed_page: 1
    section: Special rules / Mutations
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Lords Of The Marsh.pdf
  name_i18n:
    es: Mutaciones
  effect_i18n:
    es: >-
      Cualquier héroe Fimir puede comenzar la campaña con una única mutación del capítulo de
      Personajes Corruptos si paga el coste correspondiente (ver página 76 del reglamento).
  applies_to:
    band: true
- id: band--from-the-mist
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.lords-of-the-marsh-mim.band.from-the-mist
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: From the Mist
  effect: >-
    Fimir can see and move normally through all fogs, including magically created mist. The warband
    begins the battle wreathed in mist.
  source:
    manual: Broheim
    printed_page: 1
    section: Special rules / From the Mist
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Lords Of The Marsh.pdf
  name_i18n:
    es: Desde la Niebla
  effect_i18n:
    es: >-
      Los Fimir pueden ver y moverse con normalidad a través de cualquier niebla, incluida la creada
      por magia. La banda comienza la batalla envuelta en niebla.
  applies_to:
    band: true
- id: band--cold-blooded
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.lords-of-the-marsh-mim.band.cold-blooded
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Cold-blooded
  effect: Fimir roll 3D6 for Leadership tests, discarding the highest result.
  source:
    manual: Broheim
    printed_page: 2
    section: Special rules / Cold-blooded
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Lords Of The Marsh.pdf
  name_i18n:
    es: Sangre Fría
  effect_i18n:
    es: Los Fimir tiran 3D6 en los chequeos de Liderazgo, descartando el resultado más alto.
  applies_to:
    band: true
- id: band--aquatic
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.lords-of-the-marsh-mim.band.aquatic
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: no effect applies to the current engine scope.
  name: Aquatic
  effect: >-
    Fimir are amphibious and may move through water terrain with no penalty, counting as being in
    cover whilst in the water.
  source:
    manual: Broheim
    printed_page: 1
    section: Special rules / Aquatic
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Lords Of The Marsh.pdf
  name_i18n:
    es: Acuáticos
  effect_i18n:
    es: >-
      Los Fimir son anfibios y pueden moverse por terreno de agua sin penalización, contando como en
      cobertura mientras estén en el agua.
  applies_to:
    band: true
- id: band--swamp-striders
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.lords-of-the-marsh-mim.band.swamp-striders
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: no effect applies to the current engine scope.
  name: Swamp Striders
  effect: Fimir can move through any swamp and marshland terrain without penalty.
  source:
    manual: Broheim
    printed_page: 1
    section: Special rules / Swamp Striders
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Lords Of The Marsh.pdf
  name_i18n:
    es: Zancudos del Pantano
  effect_i18n:
    es: Los Fimir pueden moverse por cualquier terreno de ciénaga y pantano sin penalización.
  applies_to:
    band: true
- id: band--scaly-skin
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: band
    effects:
    - id: compiler.lizardmen-scaly-skin
      scope: 'YES'
      binding:
        kind: compiler
        id: compiler.lizardmen-scaly-skin
  name: Scaly Skin
  effect: >-
    Fimir have a 6+ armour save that cannot be modified beyond 6 by Strength; a 'no save' result on
    the Critical Hit Charts negates it. Light armour adds +1. Fimir Warriors have a 5+ armour save.
  source:
    manual: Broheim
    printed_page: 2
    section: Special rules / Scaly Skin
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Lords Of The Marsh.pdf
  name_i18n:
    es: Piel Escamosa
  effect_i18n:
    es: >-
      Los Fimir tienen una salvación por armadura de 6+ que no puede modificarse más allá de 6 por
      Fuerza; un resultado de 'sin salvación' en las tablas de impacto crítico la anula. La armadura
      ligera suma +1. Los Guerreros Fimir tienen una salvación de 5+.
  applies_to:
    band: true
- id: band--cyclopean-fiends
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.lords-of-the-marsh-mim.band.cyclopean-fiends
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Cyclopean Fiends
  effect: >-
    Heroes re-roll on the Serious Injury Chart when the result is 'Blinded in One Eye'. If the same
    result is rolled again, the warrior is permanently blinded!
  source:
    manual: Broheim
    printed_page: 2
    section: Special rules / Cyclopean Fiends
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Lords Of The Marsh.pdf
  name_i18n:
    es: Demonios Ciclópeos
  effect_i18n:
    es: >-
      Los héroes repiten en la Tabla de Heridas Graves cuando el resultado sea 'Cegado en un Ojo'.
      Si se repite el mismo resultado, ¡el guerrero queda ciego permanentemente!
  applies_to:
    band: true
- id: band--hired-swords
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.lords-of-the-marsh-mim.band.hired-swords
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Hired Swords
  effect: >-
    Fimir warbands may hire the following Hired Swords: Slaver, Highwayman, Swashbuckler, Bog
    Hunter, Whaler.
  source:
    manual: Broheim
    printed_page: 2
    section: Hired Swords
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Lords Of The Marsh.pdf
  name_i18n:
    es: Espadas a Sueldo
  effect_i18n:
    es: >-
      Las bandas Fimir pueden contratar las siguientes Espadas a Sueldo: Esclavista, Salteador,
      Esgrimidor, Cazador de Ciénagas, Arponero.
  applies_to:
    band: true
- id: draich--leader
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.lords-of-the-marsh-mim.draich.leader
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Leader
  effect: >-
    Any warrior within 6 inches of the Draich may use his Leadership value instead of his own when
    taking Leadership tests.
  source:
    manual: Broheim
    printed_page: 3
    section: 1 Draich / Special Rules / Leader
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Lords Of The Marsh.pdf
  name_i18n:
    es: Líder
  effect_i18n:
    es: >-
      Cualquier guerrero a 6 pulgadas del Draich puede usar su valor de Liderazgo en los chequeos de
      Liderazgo.
  applies_to:
    profile_ids:
    - draich
- id: draich--wizard
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.lords-of-the-marsh-mim.draich.wizard
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: no effect applies to the current engine scope.
  name: Wizard
  effect: >-
    Draichs are sorcerers and have two spells. One is generated using the Chaos Rituals; the other
    is from the Rituals of Dhar list from the 'Bazaar of Books' section in the chapter 'Infamous
    Haunts'.
  source:
    manual: Broheim
    printed_page: 3
    section: 1 Draich / Special Rules / Wizard
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Lords Of The Marsh.pdf
  name_i18n:
    es: Mago
  effect_i18n:
    es: >-
      Los Draich son hechiceros y tienen dos hechizos. Uno se genera con los Rituales del Caos; el
      otro procede de la lista Rituales de Dhar, de la sección 'Bazar de los Libros' del capítulo
      'Guaridas Infames'.
  applies_to:
    profile_ids:
    - draich
- id: draich--mind-focus
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.lords-of-the-marsh-mim.draich.mind-focus
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: no effect applies to the current engine scope.
  name: Mind Focus
  effect: >-
    When using a spell or prayer the Draich may re-roll one dice roll used in the difficulty roll.
  source:
    manual: Broheim
    printed_page: 3
    section: 1 Draich / Special Rules / Mind Focus
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Lords Of The Marsh.pdf
  name_i18n:
    es: Enfoque Mental
  effect_i18n:
    es: >-
      Al usar un hechizo o plegaria, el Draich puede repetir una tirada de dado usada en la tirada
      de dificultad.
  applies_to:
    profile_ids:
    - draich
- id: draich--fear
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.lords-of-the-marsh-mim.draich.fear
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Fear
  effect: The Draich is so revolting that it causes fear.
  source:
    manual: Broheim
    printed_page: 3
    section: 1 Draich / Special Rules / Fear
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Lords Of The Marsh.pdf
  name_i18n:
    es: Miedo
  effect_i18n:
    es: El Draich es tan repulsivo que causa miedo.
  applies_to:
    profile_ids:
    - draich
- id: draich--large
  runtime:
