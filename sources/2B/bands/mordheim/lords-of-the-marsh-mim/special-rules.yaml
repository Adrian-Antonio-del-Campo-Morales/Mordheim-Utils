      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: no effect applies to the current engine scope.
  name: Daemon Soul
  effect: >-
    A Daemon lives within the warrior's soul, giving demonomaniacs a 4+ save against the effects of
    spells or prayers.
  source:
    manual: Broheim
    printed_page: 3
    section: 0-2 Daemon-fimm / Special Rules / Daemon Soul
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Lords Of The Marsh.pdf
  name_i18n:
    es: Alma Demoníaca
  effect_i18n:
    es: >-
      Un demonio vive dentro del alma del guerrero, otorgando a los demonómanos una salvación de 4+
      contra los efectos de hechizos o plegarias.
  applies_to:
    profile_ids:
    - daemon-fimm
- id: young-nobles--spiked-tail
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: trait.extra-attack-tail
      scope: LATER
      binding: null
      reason: >-
        Deferred: tail attack at Strength+1 needs a secondary-natural-attack binding not yet exposed
        by the engine.
  name: Spiked Tail
  effect: >-
    Fimir Nobles have a flexible tail with a mace-like bony tip; the Young Noble gains an extra tail
    attack in each hand-to-hand combat phase at the Fimir's Strength +1.
  source:
    manual: Broheim
    printed_page: 4
    section: 0-2 Young Nobles / Special Rules / Spiked Tail
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Lords Of The Marsh.pdf
  name_i18n:
    es: Cola con Púas
  effect_i18n:
    es: >-
      Los nobles Fimir tienen una cola flexible con punta ósea de maza; el Joven Noble obtiene un
      ataque de cola extra en cada fase de combate cuerpo a cuerpo a la Fuerza del Fimir +1.
  applies_to:
    profile_ids:
    - young-nobles
