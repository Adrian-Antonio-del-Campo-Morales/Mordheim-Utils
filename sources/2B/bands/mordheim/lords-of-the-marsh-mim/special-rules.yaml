        corresponding engine milestone.
  name: Craven
  effect: A Draich is subject to the effects of fear unless they are protected by Mystic Mist.
  source:
    manual: Broheim
    printed_page: 3
    section: 1 Draich / Special Rules / Craven
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Lords Of The Marsh.pdf
  name_i18n:
    es: Cobarde
  effect_i18n:
    es: Un Draich está sujeto a los efectos del miedo salvo que esté protegido por Niebla Mística.
  applies_to:
    profile_ids:
    - draich
- id: daemon-fimm--fear
  runtime:
    scope: LATER
