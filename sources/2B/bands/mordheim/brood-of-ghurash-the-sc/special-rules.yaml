  applies_to:
    band: true
- id: band--slow-witted
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.brood-of-ghurash-the-sc.band.slow-witted
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Slow Witted
  effect: Brood members only gain half the experience normal models would get.
  source:
    manual: broheim.net
    printed_page: 1
    section: Special rules / Slow witted
    url: https://broheim.net/downloads/warbands/supplement/sealedcity/Brood Of Ghurash.pdf
  name_i18n:
    es: Torpes
  effect_i18n:
    es: >-
      Los miembros de la Cría solo ganan la mitad de la experiencia que obtendrían los modelos
      normales.
  applies_to:
    band: true
- id: band--always-hungry
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.brood-of-ghurash-the-sc.band.always-hungry
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Always Hungry
  effect: Every Hero counts as two models when selling moonstones.
  source:
    manual: broheim.net
    printed_page: 1
    section: Special rules / Always hungry
    url: https://broheim.net/downloads/warbands/supplement/sealedcity/Brood Of Ghurash.pdf
  name_i18n:
    es: Siempre Hambrientos
  effect_i18n:
    es: Cada héroe cuenta como dos modelos al vender piedras lunares.
  applies_to:
    band: true
- id: band--brood-mentality
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.brood-of-ghurash-the-sc.band.brood-mentality
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Brood Mentality
  effect: >-
    All Brood members suffer from stupidity, but trolls taking stupidity tests add 1 point to their
    Leadership for every warband member within 6 inches. The family never uses any Hired Swords.
  source:
    manual: broheim.net
    printed_page: 1
    section: Special rules / Brood Mentality
    url: https://broheim.net/downloads/warbands/supplement/sealedcity/Brood Of Ghurash.pdf
  name_i18n:
    es: Mentalidad de Cría
  effect_i18n:
    es: >-
      Todos los miembros de la Cría sufren estupidez, pero los trolls que hagan chequeos de
      estupidez suman 1 punto a su Liderazgo por cada miembro de la banda a 6 pulgadas. La familia
      nunca contrata Espadas a Sueldo.
  applies_to:
    band: true
- id: band--hoard
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.brood-of-ghurash-the-sc.band.hoard
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Hoard
  effect: >-
    These greedy fellows never sell any rare items, even if no Brood member is able to use them.
    They may nonetheless exchange stored items for captured brood members, and they suffer -2 on any
    rarity rolls due to their poor bargaining skills.
  source:
    manual: broheim.net
    printed_page: 1
    section: Special rules / Hoard
    url: https://broheim.net/downloads/warbands/supplement/sealedcity/Brood Of Ghurash.pdf
  name_i18n:
    es: Tesoro
  effect_i18n:
    es: >-
      Estos avaros nunca venden objetos raros, aunque ningún miembro de la Cría pueda usarlos. Sin
      embargo, pueden intercambiar objetos almacenados por miembros de cría capturados, y sufren -2
      en las tiradas de rareza debido a sus pobres habilidades de regateo.
  applies_to:
    band: true
- id: band--regenerate
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.brood-of-ghurash-the-sc.band.regenerate
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Regenerate
  effect: >-
    When rolling for serious injuries after being taken out of action, treat any results of 16-35 as
    full recovery; Henchmen survive on a 2+ if taken out of action during a game. If the last wound
    was caused by fire, the Brood member cannot regenerate after the game.
  source:
    manual: broheim.net
    printed_page: 1
    section: Special rules / Regenerate
    url: https://broheim.net/downloads/warbands/supplement/sealedcity/Brood Of Ghurash.pdf
  name_i18n:
    es: Regeneración
  effect_i18n:
    es: >-
      Al tirar en la tabla de heridas graves tras quedar Fuera de combate, trata cualquier resultado
      de 16-35 como recuperación total; los secuaces sobreviven con un 2+ si quedan Fuera de combate
      durante la partida. Si la última herida fue causada por fuego, el miembro de la Cría no puede
      regenerarse después de la partida.
  applies_to:
    band: true
- id: band--aquatic
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.brood-of-ghurash-the-sc.band.aquatic
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: no effect applies to the current engine scope.
  name: Aquatic
  effect: >-
    Brood members may move through water terrain without penalty and count as being in cover whilst
    they are in the water.
  source:
    manual: broheim.net
    printed_page: 1
    section: Special rules / Aquatic
    url: https://broheim.net/downloads/warbands/supplement/sealedcity/Brood Of Ghurash.pdf
  name_i18n:
    es: Acuáticos
  effect_i18n:
    es: >-
      Los miembros de la Cría pueden moverse por terreno de agua sin penalización y cuentan como en
      cobertura mientras estén en el agua.
  applies_to:
    band: true
- id: broodmother--leader
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.brood-of-ghurash-the-sc.broodmother.leader
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Leader
  effect: Any warrior within 6 inches of the Broodmother may use her Leadership instead of his own.
  source:
    manual: broheim.net
    printed_page: 3
    section: 1 Broodmother / Special Rules / Leader
    url: https://broheim.net/downloads/warbands/supplement/sealedcity/Brood Of Ghurash.pdf
  name_i18n:
    es: Líder
  effect_i18n:
    es: >-
      Cualquier guerrero a 6 pulgadas de la Madre de Cría puede usar su Liderazgo en lugar del
      propio.
  applies_to:
    profile_ids:
    - broodmother
- id: broodmother--mother-knows-best
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.brood-of-ghurash-the-sc.broodmother.mother-knows-best
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Mother Knows Best
  effect: When taking rout tests, this model may use the bonus of Brood Mentality.
  source:
    manual: broheim.net
    printed_page: 2
    section: Special skills / Mother knows best
    url: https://broheim.net/downloads/warbands/supplement/sealedcity/Brood Of Ghurash.pdf
  name_i18n:
    es: La Madre Sabe Mejor
  effect_i18n:
    es: Al realizar chequeos de huida, este modelo puede usar el bono de Mentalidad de Cría.
  applies_to:
    profile_ids:
    - broodmother
- id: newborns--nestlings
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.brood-of-ghurash-the-sc.newborns.nestlings
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Nestlings
  effect: >-
    If a Newborn is taken out of action by an enemy warrior in close combat, every Brood hero with
    line of sight to the poor Newborn hates the causing model until the end of the game. Heroes must
    always try to intercept charges at Newborns.
  source:
    manual: broheim.net
    printed_page: 4
    section: 0-2 Newborns / Special Rules / Nestlings
    url: https://broheim.net/downloads/warbands/supplement/sealedcity/Brood Of Ghurash.pdf
  name_i18n:
    es: Polluelos
  effect_i18n:
    es: >-
      Si un Recién Nacido queda Fuera de combate por un guerrero enemigo en combate cuerpo a cuerpo,
      todos los héroes de la Cría con línea de visión al pobre Recién Nacido odian al modelo
      causante hasta el final de la partida. Los héroes siempre deben intentar interceptar cargas
      contra los Recién Nacidos.
  applies_to:
    profile_ids:
    - newborns
- id: newborns--too-little
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.brood-of-ghurash-the-sc.newborns.too-little
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Too Little
  effect: Newborns never become heroes; re-roll all results of 'that lad's got talent'.
  source:
    manual: broheim.net
    printed_page: 4
    section: 0-2 Newborns / Special Rules / Too little
    url: https://broheim.net/downloads/warbands/supplement/sealedcity/Brood Of Ghurash.pdf
  name_i18n:
    es: Demasiado Pequeños
  effect_i18n:
    es: >-
      Los Recién Nacidos nunca se convierten en héroes; repite todos los resultados de 'el chaval
      tiene talento'.
  applies_to:
    profile_ids:
    - newborns
- id: baneworms--mer-creature
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.brood-of-ghurash-the-sc.baneworms.mer-creature
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: no effect applies to the current engine scope.
  name: Mer-Creature
  effect: >-
    Baneworms live underwater but are able to wriggle on solid ground. See the Stygian Mutations for
    further information.
  source:
    manual: broheim.net
    printed_page: 4
    section: 0-5 Baneworms / Special Rules / Mer-creature
    url: https://broheim.net/downloads/warbands/supplement/sealedcity/Brood Of Ghurash.pdf
  name_i18n:
    es: Criatura Marina
  effect_i18n:
    es: >-
      Los Gusanos de Ruina viven bajo el agua, pero pueden serpear en tierra firme. Consulta las
      Mutaciones Estigias para más información.
  applies_to:
    profile_ids:
    - baneworms
- id: baneworms--lurker
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.brood-of-ghurash-the-sc.baneworms.lurker
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Lurker
  effect: >-
    When charging while hidden in the previous turn, Baneworms may perform a "diving charge" even if
    they don't charge from above.
  source:
    manual: broheim.net
    printed_page: 4
    section: 0-5 Baneworms / Special Rules / Lurker
    url: https://broheim.net/downloads/warbands/supplement/sealedcity/Brood Of Ghurash.pdf
  name_i18n:
    es: Acechador
  effect_i18n:
    es: >-
      Al cargar habiendo estado oculto el turno anterior, los Gusanos de Ruina pueden realizar una
      "carga en inmersión" aunque no carguen desde arriba.
  applies_to:
    profile_ids:
    - baneworms
- id: baneworms--animal
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.brood-of-ghurash-the-sc.baneworms.animal
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Animal
  effect: >-
    Baneworms gain no experience and may not climb. They do not benefit or suffer from any of the
    Brood's special rules like Regenerate or Brood Mentality.
  source:
    manual: broheim.net
    printed_page: 4
    section: 0-5 Baneworms / Special Rules / Animal
    url: https://broheim.net/downloads/warbands/supplement/sealedcity/Brood Of Ghurash.pdf
  name_i18n:
    es: Animal
  effect_i18n:
    es: >-
      Los Gusanos de Ruina no ganan experiencia y no pueden trepar. No se benefician ni sufren
      ninguna de las reglas especiales de la Cría, como Regeneración o Mentalidad de Cría.
  applies_to:
    profile_ids:
    - baneworms
- id: band--characteristic-increase
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.brood-of-ghurash-the-sc.band.characteristic-increase
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: characteristic-increase caps on advancement.
  name: Characteristic Increase (Troll Maximums)
  effect: >-
    Troll characteristics may not be increased beyond the maximum profile limits: M 6, WS 6,
    BS 3, S 6, T 5, W 5, I 4, A 6, Ld 6.
  source:
    manual: broheim.net
    printed_page: 1
    section: Characteristic Increase
    url: https://broheim.net/downloads/warbands/supplement/sealedcity/Brood Of Ghurash.pdf
  name_i18n:
    es: Aumento de Características (Máximos de Troll)
  effect_i18n:
    es: >-
      Las características de los Troll no pueden aumentarse más allá de los límites máximos de
      perfil: M 6, HA 6, HP 3, F 6, R 5, H 5, I 4, A 6, L 6.
  applies_to:
    band: true
- id: band--skill-the-terror
  kind: warband_skill
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.brood-of-ghurash-the-sc.band.the-terror
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: the All Alone test is a psychology-subsystem interaction.
  name: The Terror
  effect: >-
    The Troll is an abominable blasphemy of nature itself, nightmarish beyond any lunatic's imagination.
    All enemy warriors in close combat with the Troll must test for "All Alone" at the end of each turn,
    even if there are friendly warriors within 6". May only be taken if the Troll already possesses at
    least four mutations.
  source:
    manual: broheim.net
    printed_page: 2
    section: Special rules / The Terror
    url: https://broheim.net/downloads/warbands/supplement/sealedcity/Brood Of Ghurash.pdf
  name_i18n:
    es: El Terror
  effect_i18n:
    es: >-
      El Trol es una abominable blasfemia contra la propia naturaleza, una pesadilla más allá de la
      imaginación de cualquier lunático. Todos los guerreros enemigos en combate cuerpo a cuerpo con el
      Trol deben hacer un chequeo de "Solo ante el peligro" al final de cada turno, incluso si hay
      guerreros amigos a 6" o menos. Solo puede tomarse si el Trol ya posee al menos cuatro mutaciones.
  applies_to:
    band: true
- id: band--skill-ground-pounder
  kind: warband_skill
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.brood-of-ghurash-the-sc.band.ground-pounder
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: the shooting-phase quake and the Initiative test are phase-specific mechanics.
  name: Ground Pounder
  effect: >-
    The Brood member is capable of slamming both fists into the ground with such force that the entire
    surrounding area will quake. This is done in the shooting phase. All non-large models within D6"
    must pass an initiative check or get immediately knocked down.
  source:
    manual: broheim.net
    printed_page: 2
    section: Special rules / Ground Pounder
    url: https://broheim.net/downloads/warbands/supplement/sealedcity/Brood Of Ghurash.pdf
  name_i18n:
    es: Golpeador de Suelo
  effect_i18n:
    es: >-
      El miembro de la Camada es capaz de golpear el suelo con ambos puños con tal fuerza que toda el área
      circundante tiembla. Esto se hace en la fase de disparo. Todos los modelos que no sean grandes a D6"
      o menos deben superar un chequeo de Iniciativa o quedan derribados de inmediato.
  applies_to:
    band: true
- id: band--skill-titanic-strength
  kind: warband_skill
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.brood-of-ghurash-the-sc.band.titanic-strength
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: forcing a Strength test on a failed wound roll is a combat-resolution mechanic.
  name: Titanic Strength
  effect: >-
    The hero is titanic in size and muscle mass. Whenever this Brood member hits an enemy warrior, but
    fails to wound, the hit model must pass a Strength test to avoid getting knocked down.
  source:
    manual: broheim.net
    printed_page: 2
    section: Special rules / Titanic Strength
    url: https://broheim.net/downloads/warbands/supplement/sealedcity/Brood Of Ghurash.pdf
  name_i18n:
    es: Fuerza Titánica
  effect_i18n:
    es: >-
      El héroe es titánico en tamaño y masa muscular. Siempre que este miembro de la Camada impacte a un
      guerrero enemigo pero no consiga herirlo, el modelo impactado debe superar un chequeo de Fuerza para
      evitar quedar derribado.
  applies_to:
    band: true
- id: band--skill-hurl
  kind: warband_skill
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.brood-of-ghurash-the-sc.band.hurl
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: substituting the shooting attack for a throw is a shooting-phase mechanic.
  name: Hurl
  effect: >-
    Instead of shooting, the Brood member may grab a normal-sized model in base-to-base contact and hurl
    it forward. The model must be either knocked down, stunned or voluntary. It is then hurled up to
    BS+D6" in a direction chosen by the Brood member. If the hurled model hits another warrior, both
    take one automatic hit with a strength equal to the other model's toughness. This counts as a
    charge, if the models aren't allied or from the same warband.
  source:
    manual: broheim.net
    printed_page: 2
    section: Special rules / Hurl
    url: https://broheim.net/downloads/warbands/supplement/sealedcity/Brood Of Ghurash.pdf
  name_i18n:
    es: Lanzamiento
  effect_i18n:
    es: >-
      En lugar de disparar, el miembro de la Camada puede agarrar a un modelo de tamaño normal en contacto
      de peanas y lanzarlo hacia delante. El modelo debe estar derribado, aturdido o ser voluntario. Se
      lanza hasta BS+D6" en la dirección que elija el miembro de la Camada. Si el modelo lanzado impacta
      contra otro guerrero, ambos sufren un impacto automático con una Fuerza igual a la Resistencia del
      otro modelo. Esto cuenta como una carga si los modelos no son aliados ni de la misma banda.
  applies_to:
    band: true
- id: band--accelerated-evolution
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.brood-of-ghurash-the-sc.band.accelerated-evolution
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: consuming moonstones during an advance is an advancement-time mechanic; the mutation
        groups it can grant are listed here.
  name: Accelerated Evolution
  effect: >-
    Usually it takes years for Trolls to adapt to a certain environment or feeding behaviour. Due to
    their heritage and massive amounts of consumed moonstone, some Trolls develop new abilities way
    faster without waiting for nature to change them. Each time a Brood hero rolls for an advance, he
    may also consume any number of moonstones and roll a D6 on the following chart and add the spent
    amount of moonstones to the result: 1-4 Nothing happens; 5-6 the hero may choose a single lesser
    Mutation; 7-8 the hero may choose a single lesser or greater Mutation; 9+ the hero may choose any
    single Mutation. Lesser Mutations: Blackblood, Daemon Soul, Mer-creature, Suckers, Tentacle. Greater
    Mutations: Great Claw, Leech maw, Poisonous fangs, Spines, Spit venom. Sublime Mutations: Acidic
    stream, Extra Arm, Regeneration, Scaly skin, Shark bite.
  source:
    manual: broheim.net
    printed_page: 4
    section: Henchmen / Accelerated evolution
    url: https://broheim.net/downloads/warbands/supplement/sealedcity/Brood Of Ghurash.pdf
  name_i18n:
    es: Evolución Acelerada
  effect_i18n:
    es: >-
      Normalmente los Trols tardan años en adaptarse a un entorno o a un comportamiento alimentario
      concreto. Debido a su herencia y a la enorme cantidad de piedra lunar consumida, algunos Trols
      desarrollan nuevas capacidades mucho más rápido, sin esperar a que la naturaleza los cambie. Cada
      vez que un héroe de la Camada tire por una mejora, también puede consumir cualquier número de
      piedras lunares, tirar 1D6 en la siguiente tabla y sumar la cantidad gastada al resultado: 1-4 no
      ocurre nada; 5-6 el héroe puede elegir una única Mutación menor; 7-8 el héroe puede elegir una única
      Mutación menor o mayor; 9+ el héroe puede elegir cualquier Mutación. Mutaciones menores: Sangre
      Negra, Alma de Demonio, Criatura marina, Ventosas, Tentáculo. Mutaciones mayores: Garra Enorme,
      Fauces Sanguijuela, Colmillos Venenosos, Espinas, Escupir veneno. Mutaciones sublimes: Chorro Ácido,
      Brazo Extra, Regeneración, Piel Escamosa, Mordisco de Tiburón.
  applies_to:
    band: true
