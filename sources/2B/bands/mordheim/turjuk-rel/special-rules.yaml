rules:
- id: band--turjuk-riders
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.turjuk-rel.band.turjuk-riders
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Turjuk Riders
  effect: >-
    Virtually born on horses, Turjuk males have learned to fight from mounts with ease. Every Turjuk
    Emir and Askar has the following skills: Ride Horse, Ride Arabian Steed and Horse Archer.
  source:
    manual: broheim.net
    printed_page: 2
    section: Arabian Tribes / Turjuk / Special Rules
    url: https://broheim.net/downloads/fo/97RelicsoftheCrusadesPt2.pdf
  name_i18n:
    es: Jinetes Turjuk
  effect_i18n:
    es: >-
      Prácticamente nacidos a caballo, los varones Turjuk han aprendido a luchar desde sus monturas
      con facilidad. Todo Emir y Askar Turjuk tiene las siguientes habilidades: Montar Caballo,
      Montar Corcel Árabe y Arquero a Caballo.
  applies_to:
    band: true
- id: band--turjuk-leader-mount
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.turjuk-rel.band.turjuk-leader-mount
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Leader Must Own a Mount
  effect: >-
    As horses are viewed with such pride by the Turjuks, any leader of a Turjuk warband that does
    not own a Riding Horse or Arabian Steed will have his leadership reduced by 1.
  source:
    manual: broheim.net
    printed_page: 2
    section: Arabian Tribes / Turjuk / Special Rules
    url: https://broheim.net/downloads/fo/97RelicsoftheCrusadesPt2.pdf
  name_i18n:
    es: El Líder Debe Poseer Montura
  effect_i18n:
    es: >-
      Dado que los caballos son vistos con tanto orgullo por los Turjuk, cualquier líder de una
      banda Turjuk que no posea un Caballo de Montar o un Corcel Árabe verá su liderazgo reducido en
      1.
  applies_to:
    band: true
- id: band--slaves-can-lead
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.turjuk-rel.band.slaves-can-lead
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Slaves May Become Warband Leader
  effect: >-
    It is a regular occurrence for slaves, or the sons of slaves, to gain high positions, especially
    if they can prove themselves on the battlefield. Therefore, it is possible for a slave in an
    Arabian warband to become a warband leader.
  source:
    manual: broheim.net
    printed_page: 2
    section: Arabian Tribes / Turjuk / Special Rules
    url: https://broheim.net/downloads/fo/97RelicsoftheCrusadesPt2.pdf
  name_i18n:
    es: Los Esclavos Pueden Llegar a Líderes de Banda
  effect_i18n:
    es: >-
      Es habitual que los esclavos, o los hijos de esclavos, alcancen posiciones elevadas, sobre
      todo si demuestran su valía en el campo de batalla. Por tanto, es posible que un esclavo de
      una banda árabe se convierta en el líder de la banda.
  applies_to:
    band: true
