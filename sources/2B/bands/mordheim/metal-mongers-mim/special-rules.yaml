  name: Warptooth
  effect: >-
    The Machine-Ogre is designed to obey all commands given to it by its master and creator, the
    Engineer Adept using a 'warptooth'. This precaution dissuades any ambitious apprentices seeking
    advancement, knowing that a Machine-Ogre can easily be used as a fast track to the top! Should
    the Machine-Ogre ever find itself more than 18" from the Engineer Adept at the start of the
    Movement phase, it 'powers down' reducing its Movement and Weapon Skill characteristic to 0. If
    the Engineer Adept is taken out of action the same thing happens.
  source:
    manual: Broheim
    printed_page: 5
    section: 0-1 Machine Ogre / Special Rules / Warptooth
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Metal%20Mongers.pdf
  name_i18n:
    es: Dientewarp
  effect_i18n:
    es: >-
      El Ogro Mecánico está diseñado para obedecer todas las órdenes que le dé su maestro y creador,
      el Adepto Ingeniero, mediante un 'dientewarp'. Esta precaución disuade a los aprendices
      ambiciosos que buscan ascender, sabiendo que un Ogro Mecánico ¡puede usarse fácilmente como
      una vía rápida a la cima! Si el Ogro Mecánico llegara a encontrarse a más de 18" del Adepto
      Ingeniero al inicio de la fase de movimiento, se 'apaga', reduciendo sus características de
      Movimiento y Habilidad de Armas a 0. Si el Adepto Ingeniero queda fuera de combate, ocurre lo
      mismo.
  applies_to:
    profile_ids:
    - machine-ogre
