- id: machine-ogre--unreliable
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.metal-mongers-mim.machine-ogre.unreliable
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Unreliable
  effect: >-
    The technology of biomechanics is still in its infancy and as with most Clan Skyre experiments
    is neither safe nor entirely reliable! At the beginning of each turn, the Skaven player may roll
    a D6 to activate and work the Machine-Ogre. On a roll of 2-6 everything is fine and the Rat Ogre
    may be moved normally. On a roll of 1, something has gone drastically wrong - roll again on the
    Malfunction Chart: 1 - Explodes! All models within 6" of the Machine-Ogre receive a single
    Strength 5 hit; the Machine-Ogre is completely destroyed, do not roll for injuries after the
    game; 2 - Malfunctions! From now until the end of the game the Machine-Ogre is out of control;
    at the start of each Skaven turn it moves randomly (use the Artillery Scatter dice); if there
    are any warriors within charge range (of either side) it counts as charging them; 3 - Shuts
    Down! It comes to a halt for the rest of the battle and is hit automatically if engaged in close
    combat; 4 - Temporary Loss of Control! It moves in a random direction and if it comes into
    contact with any warriors (of either side) it attacks and counts as charging; if it does not
    move into contact but there are warriors within range of its warpfire projector (if it has
    one!), it fires at them instead; 5-6 - Freezes! It freezes up for this turn and is hit
    automatically if engaged in close combat.
  source:
    manual: Broheim
    printed_page: 5
    section: 0-1 Machine Ogre / Special Rules / Unreliable
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Metal%20Mongers.pdf
  name_i18n:
    es: Poco Fiable
  effect_i18n:
    es: >-
      ¡La tecnología de la biomecánica aún está en pañales y, como en la mayoría de los experimentos
      del Clan Skryre, no es segura ni del todo fiable! Al principio de cada turno, el jugador
      skaven puede tirar 1D6 para activar y manejar al Ogro Mecánico. Con un resultado de 2-6 todo
      va bien y el Ogro Rata puede moverse con normalidad. Con un 1, algo ha ido drásticamente mal -
      tira de nuevo en la Tabla de Averías: 1 - ¡Explota! Todos los modelos a 6" del Ogro Mecánico
      reciben un único impacto de Fuerza 5; el Ogro Mecánico queda completamente destruido, no se
      tiran heridas tras la partida; 2 - ¡Averiado! Desde ahora hasta el final de la partida el Ogro
      Mecánico está fuera de control; al inicio de cada turno skaven se mueve aleatoriamente (usa el
      dado de dispersión de artillería); si hay guerreros al alcance de carga (de cualquiera de los
      bandos) cuenta como cargándolos; 3 - ¡Se Apaga! Se detiene durante el resto de la batalla y
      recibe impactos automáticamente si se le combate en cuerpo a cuerpo; 4 - ¡Pérdida Temporal de
      Control! Se mueve en una dirección aleatoria y si entra en contacto con guerreros (de
      cualquier bando) ataca y cuenta como carga; si no llega al contacto pero hay guerreros al
      alcance de su proyector de fuego warp (¡si lo tiene!), dispara contra ellos; 5-6 - ¡Se
      Congela! Se queda congelado este turno y recibe impactos automáticamente si se le combate en
      cuerpo a cuerpo.
  applies_to:
    profile_ids:
    - machine-ogre
