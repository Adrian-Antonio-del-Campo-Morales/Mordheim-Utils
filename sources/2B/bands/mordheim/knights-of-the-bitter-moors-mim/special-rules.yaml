- id: mounted-yeomen--mounted-or-nothin
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.knights-of-the-bitter-moors-mim.mounted-yeomen.mounted-or-nothin
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Mounted or Nothin'
  effect: >-
    Yeomen come with riding Horses included in their buying price and as such come with the skill
    Ride Horse. If a Yeoman's horse is killed it must be rebought before the unit can be fielded
    again.
  source:
    manual: Broheim
    printed_page: 5
    section: 0-3 Mounted Yeomen / Special Rules / Mounted or Nothin'
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Knights Of The Bitter%20Moors.pdf
  name_i18n:
    es: A Caballo o Nada
  effect_i18n:
    es: >-
      Los Vassalos montados vienen con Caballo de montar incluido en su precio de compra, y por
      tanto tienen la habilidad Montar Caballo. Si el caballo de un Vassalo muere, debe volver a
      comprarse antes de poder desplegar la unidad de nuevo.
  applies_to:
    profile_ids:
    - mounted-yeomen
- id: mounted-yeomen--smarts
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.knights-of-the-bitter-moors-mim.mounted-yeomen.smarts
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: no effect applies to the current engine scope.
  name: Smarts
  effect: >-
    Even with their supreme lack of caring for the peasantry, knights know having too much cavalry
    with a Catapult around is unwise: you may not field the Trebuchet and the Mounted Yeomen in the
    same match.
  source:
    manual: Broheim
    printed_page: 5
    section: 0-3 Mounted Yeomen / Special Rules / Smarts
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Knights Of The Bitter%20Moors.pdf
  name_i18n:
    es: Astucia
  effect_i18n:
    es: >-
      Incluso con su suprema indiferencia hacia el campesinado, los caballeros saben que tener
      demasiada caballería con una Catapulta cerca no es prudente: no puedes desplegar el Trebuchet
      y los Vassalos Montados en la misma partida.
  applies_to:
    profile_ids:
    - mounted-yeomen
- id: band--field-trebuchet
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.knights-of-the-bitter-moors-mim.band.field-trebuchet
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: no effect applies to the current engine scope.
  name: Field Trebuchet (special equipment)
  effect: >-
    A siege weapon costing 175 gold crowns (special availability, takes D3+1 games to build if not
    bought at the start of the campaign). Profile T7, W3. Range 12-48 inches; fires once every other
    turn with two crewmen and each turn with four (only Men-at-Arms may operate it). It is a Large
    Target, is Constructed (starts as 4 crates carried by 4 non-Knight models and takes D3 turns to
    set up; once set up it cannot move but may swivel; deconstructing takes 1 turn), uses the
    Scatter and Artillery dice instead of Ballistic Skill (Artillery; direct hits only count as such
    with shared line of sight), may use Indirect Fire against targets without line of sight, and
    creates an Explosive Radius using the small blast template. Each game it carries 2 shots of each
    ammo type: Boulders (S5 at centre, S4 elsewhere, 2-4 stunned, Bludgeoning Critical Hits),
    Flaming Shot (S3, targets catch fire on 4+) and Boiling Oil Canister (S4, no armour save). On a
    Misfire, roll a D6: 1 = Destroyed (crew must pass an Initiative test or be taken out of action);
    2-3 = Disabled (suffers a wound and cannot fire this turn or next); 4-6 = May Not Shoot this
    turn.
  source:
    manual: Broheim
    printed_page: 6
    section: Bretonnian Special Equipment / Field Trebuchet
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Knights Of The Bitter%20Moors.pdf
  name_i18n:
    es: Trebuchet de Campo (equipo especial)
  effect_i18n:
    es: >-
      Arma de asedio que cuesta 175 coronas de oro (disponibilidad especial, tarda D3+1 partidas en
      construirse si no se compra al inicio de la campaña). Perfil T7, H3. Alcance 12-48 pulgadas;
      dispara un turno sí y otro no con dos servidores, y cada turno con cuatro (solo los Hombres de
      Armas pueden operarla). Es un Objetivo Grande y se Construye (empieza como 4 cajas
      transportadas por 4 modelos no caballeros y tarda D3 turnos en montarse; una vez montada no
      puede moverse pero puede girar; desmontarla lleva 1 turno), usa los dados de Dispersión y
      Artillería en lugar de la Habilidad de Disparo (Artillería; los impactos directos solo cuentan
      como tales con línea de visión compartida), puede usar Tiro Indirecto contra objetivos sin
      línea de visión y genera un Radio Explosivo con la plantilla pequeña de explosión. Cada
      partida lleva 2 disparos de cada munición: Rocas (F5 en el centro, F4 en el resto, 2-4
      aturdido, Impactos Críticos de Contusión), Disparo Llameante (F3, los objetivos arden con un
      4+) y Bote de Aceite Hirviendo (F4, sin salvación por armadura). Con un Fallo de disparo, tira
      1D6: 1 = Destruida (la tripulación debe superar un chequeo de Iniciativa o quedar Fuera de
      combate); 2-3 = Inutilizada (sufre una herida y no puede disparar este turno ni el siguiente);
      4-6 = No Puede Disparar este turno.
  applies_to:
    band: true
