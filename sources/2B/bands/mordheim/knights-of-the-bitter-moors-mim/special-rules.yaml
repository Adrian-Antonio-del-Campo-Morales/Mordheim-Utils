  name: Knighted
  effect: >-
    Once a squire has reached 20 experience points he is considered to have finished his
    apprenticeship and becomes a full Knight Errant, gaining the skill lists, equipment list,
    Knights Virtue and the Ride Warhorse skill.
  source:
    manual: Broheim
    printed_page: 4
    section: 0-3 Squires / Special Rules / Knighted
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Knights Of The Bitter%20Moors.pdf
  name_i18n:
    es: Armatado Caballero
  effect_i18n:
    es: >-
      Una vez que un escudero alcanza 20 puntos de experiencia se considera que ha terminado su
      aprendizaje y se convierte en Caballero Novicio pleno, obteniendo las listas de habilidades,
      la lista de equipo, la Virtud del Caballero y la habilidad Montar Caballo de Guerra.
  applies_to:
    profile_ids:
    - squires
