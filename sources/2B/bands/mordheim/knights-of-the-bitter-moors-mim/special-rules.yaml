- id: band--peasant-labour
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.knights-of-the-bitter-moors-mim.band.peasant-labour
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Peasant Labour
  effect: >-
    Bretonnian Knights always use the starting warband prices for Horses and Armour; the peasantry
    and squires must pay the full price. Armour and Horses bought for Knights may never be swapped
    over to their lessers in the reallocate phase.
  source:
    manual: Broheim
    printed_page: 1
    section: Special Rules / Peasant Labour
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Knights Of The Bitter%20Moors.pdf
  name_i18n:
    es: Trabajo de Siervos
  effect_i18n:
    es: >-
      Los Caballeros bretonianos siempre usan los precios de banda inicial para Caballos y
      Armaduras; el campesinado y los escuderos deben pagar el precio completo. Las Armaduras y
      Caballos comprados para Caballeros nunca pueden traspasarse a sus inferiores en la fase de
      reasignación.
  applies_to:
    band: true
- id: band--hired-swords
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.knights-of-the-bitter-moors-mim.band.hired-swords
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Hired Swords
  effect: >-
    Bretonnians are counted as Humans and can hire any Hired Sword applicable to Humans, except
    those that use Black Powder, Magic or Poison. Runes are allowed.
  source:
    manual: Broheim
    printed_page: 1
    section: Hired Swords
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Knights Of The Bitter%20Moors.pdf
  name_i18n:
    es: Espadas a Sueldo
  effect_i18n:
    es: >-
      Los bretonianos cuentan como Humanos y pueden contratar cualquier Espada a Sueldo aplicable a
      Humanos, excepto las que usan pólvora negra, magia o veneno. Se permiten las runas.
  applies_to:
    band: true
- id: band--ladys-blessing
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.knights-of-the-bitter-moors-mim.band.ladys-blessing
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Lady's Blessing
  effect: >-
    Before the game, make a Leadership test against the warband leader's Leadership. If successful,
    the Lady of the Lake bestows her blessing: any model in the opposing warband who wishes to fire
    a black powder weapon must roll 4+ on a D6 to overcome the curse, and any enemy model wishing to
    shoot at a Bretonnian Knight (Questing Knights and Errants only) must first roll 4+ on a D6.
  source:
    manual: Broheim
    printed_page: 1
    section: Special Rules / Lady's Blessing
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Knights Of The Bitter%20Moors.pdf
  name_i18n:
    es: Bendición de la Dama
  effect_i18n:
    es: >-
      Antes de la partida, haz un chequeo de Liderazgo contra el Liderazgo del líder de la banda. Si
      es exitoso, la Dama del Lago otorga su bendición: cualquier modelo de la banda enemiga que
      quiera disparar un arma de pólvora negra debe sacar 4+ en 1D6 para superar la maldición, y
      cualquier modelo enemigo que quiera disparar a un Caballero bretoniano (solo Buscadores y
      Novicios) debe sacar primero 4+ en 1D6.
  applies_to:
    band: true
- id: questing-knight--leader
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.knights-of-the-bitter-moors-mim.questing-knight.leader
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Leader
  effect: >-
    Any warrior within 6 inches of the Questing Knight may use his Leadership when taking Leadership
    tests.
  source:
    manual: Broheim
    printed_page: 4
    section: 1 Questing Knight / Special Rules / Leader
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Knights Of The Bitter%20Moors.pdf
  name_i18n:
    es: Líder
  effect_i18n:
    es: >-
      Cualquier guerrero a 6 pulgadas del Caballero Buscador puede usar su Liderazgo en los chequeos
      de Liderazgo.
  applies_to:
    profile_ids:
    - questing-knight
- id: questing-knight--knights-virtue
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.knights-of-the-bitter-moors-mim.questing-knight.knights-virtue
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Knights Virtue
  effect: >-
    A Questing Knight is a chivalrous warrior superior to ordinary warriors. He will never panic and
    break from combat and does not have to pass a Leadership test for being all alone.
  source:
    manual: Broheim
    printed_page: 4
    section: 1 Questing Knight / Special Rules / Knights Virtue
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Knights Of The Bitter%20Moors.pdf
  name_i18n:
    es: Virtud del Caballero
  effect_i18n:
    es: >-
      Un Caballero Buscador es un guerrero caballeroso superior a los guerreros comunes. Nunca entra
      en pánico ni rompe el combate, y no tiene que superar un chequeo de Liderazgo por estar solo.
  applies_to:
    profile_ids:
    - questing-knight
