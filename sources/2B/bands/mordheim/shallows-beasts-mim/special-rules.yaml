schema_version: 2
band_id: shallows-beasts-mim
rules:
- id: band--aquatic-mutants
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.shallows-beasts-mim.band.aquatic-mutants
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Aquatic Mutants
  effect: >-
    Stromfels Reavers devotions to the Shark God can bring rewards from their patron. Any Hero may
    start the campaign with a single mutation from the following gifts and mutations in the
    'Corrupted Characters' chapter if they pay the appropriate cost; blackblood, great claw,
    tentacle, prehensile tail, beak, electrical touch, mer-creature, suckers, or eye stalks (counts
    as hideous).
  source:
    manual: broheim.net
    printed_page: 1
    section: Special rules / Aquatic Mutants
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Shallows%20Beasts.pdf
  name_i18n:
    es: Mutantes Acuáticos
  effect_i18n:
    es: >-
      Las devociones de los Reavers de Stromfels al Dios Tiburón pueden traer recompensas de su
      patrono. Cualquier Héroe puede comenzar la campaña con una única mutación de los siguientes
      dones y mutaciones del capítulo 'Personajes Corruptos' si paga el coste apropiado; sangre
      negra, gran garra, tentáculo, cola prensil, pico, toque eléctrico, criatura marina, ventosas u
      ojos tallo (cuenta como horripilante).
  applies_to:
    band: true
- id: band--seafaring
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.shallows-beasts-mim.band.seafaring
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Seafaring
  effect: >-
    Stromfels Reavers are seafarers and spend much of their time rowing boats. To represent this,
    Stromfels Reavers get +2 to Strength when they row a boat.
  source:
    manual: broheim.net
    printed_page: 1
    section: Special rules / Seafaring
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Shallows%20Beasts.pdf
  name_i18n:
    es: Navegantes
  effect_i18n:
    es: >-
      Los Reavers de Stromfels son navegantes y pasan mucho tiempo bogando en barcas. Para
      representarlo, los Reavers de Stromfels obtienen +2 a Fuerza cuando bogan en una barca.
  applies_to:
    band: true
- id: band--stromfels-special-equipment
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.shallows-beasts-mim.band.stromfels-special-equipment
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Stromfels Reavers Special Equipment
  effect: >-
    This equipment is only available to the Cult of Stromfels, and no other warband may purchase it.
    Stromfels heart (40 gc, Rare 10): a Hero becomes Stromfels Harbinger by visiting an Altar to
    Stromfels if three or more captives were sacrificed when rolling on the Ceremony of Sacrifice
    Chart. The Harbinger is immune to psychology, cannot carry weapons and has the mutations
    blackblood, prehensile tail, tentacle, mer-creature, eye stalks (counts as hideous) and suckers,
    plus a Massive Beak (Mordheim Annual page 35); if the Harbinger is taken out of action the heart
    is lost and the transformation reverses (profile M6 WS5 BS0 S5 T6 W4 I4 A4 Ld8). Scrimshaw
    bauble (40 gc, Rare 11): a Hero wearing it receives a special 4+ save against attacks made by
    aquatic models; never modified by armour or negated by critical hit results. Shark-tooth
    necklace (25 gc, Rare 8, Mutant-Priest only): instead of searching for a rare item the Priest
    may visit the city to recruit sailors into the cult (2D6: 2 arrested - roll on the Conviction
    Chart; 3-6 nothing; 7-9 recruit one Wrecker; 10-11 recruit D3 Wreckers; 12 recruit three
    Wreckers, forming a new henchman group at no cost, equipment paid as normal); Stromfels Guest:
    if the Priest wears the necklace, a warrior ensnared via the Chaos ritual 'Lure of Chaos'
    becomes Stromfels' guest - if the guest is under the Priest's control when the game ends and the
    cult does not rout, the model is captured.
  source:
    manual: broheim.net
    printed_page: 5
    section: Stromfels Reavers special equipment
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Shallows%20Beasts.pdf
  name_i18n:
    es: Equipo Especial de los Reavers de Stromfels
  effect_i18n:
    es: >-
      Este equipo solo está disponible para el Culto de Stromfels; ninguna otra banda puede
      comprarlo. Corazón de Stromfels (40 coronas, Rareza 10): un Héroe se convierte en el Presagio
      de Stromfels visitando un Altar de Stromfels si se sacrificaron tres o más cautivos al tirar
      en la Tabla de Ceremonia de Sacrificio. El Presagio es inmune a la psicología, no puede llevar
      armas y tiene las mutaciones sangre negra, cola prensil, tentáculo, criatura marina, ojos
      tallo (cuenta como horripilante) y ventosas, además de un Pico Masivo (Mordheim Annual página
      35); si el Presagio queda fuera de combate, el corazón se pierde y la transformación se
      revierte (perfil M6 WS5 BS0 S5 T6 W4 I4 A4 Ld8). Baratija de Escrimshaw (40 coronas, Rareza
      11): el Héroe que la lleva obtiene una salvación especial de 4+ contra ataques de modelos
      acuáticos; nunca modificada por armadura ni anulada por impactos críticos. Collar de dientes
      de tiburón (25 coronas, Rareza 8, solo Sacerdote Mutante): en lugar de buscar un objeto raro,
      el Sacerdote puede visitar la ciudad para reclutar marineros para el culto (2D6: 2 arrestado -
      tirar en la Tabla de Condena; 3-6 nada; 7-9 recluta un Naufragador; 10-11 recluta 1D3
      Naufragadores; 12 recluta tres Naufragadores, formando un nuevo grupo de secuaces sin coste,
      pagando el equipo con normalidad); Huésped de Stromfels: si el Sacerdote lleva el collar, un
      guerrero atrapado mediante el ritual del Caos 'Llamado del Caos' se convierte en huésped de
      Stromfels - si el huésped está bajo el control del Sacerdote al terminar la partida y el culto
      no huye, el modelo es capturado.
  applies_to:
    band: true
- id: buccaneer--leader
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.shallows-beasts-mim.buccaneer.leader
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Leader
  effect: >-
    Any warrior within 6" of the Buccaneer may use his Leadership value instead of his own when
    taking Leadership tests.
  source:
    manual: broheim.net
    printed_page: 3
    section: Heroes / Buccaneer / Special Rules / Leader
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Shallows%20Beasts.pdf
  name_i18n:
    es: Líder
  effect_i18n:
    es: >-
      Cualquier guerrero a 6" del Bucanero puede usar su valor de Liderazgo en los chequeos de
      Liderazgo.
  applies_to:
    profile_ids:
    - buccaneer
- id: buccaneer--swashbuckler
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.shallows-beasts-mim.buccaneer.swashbuckler
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Swashbuckler
  effect: >-
    The Buccaneer cuts a dashing figure in combat, mixing dazzling swordplay and daring feats with
    charm and witty comments. Enemies praise and curse his ability to always seem to effortlessly
    slip from their grasp! The Buccaneer may make a Leadership test at the end of any close combat
    phase if he is still in base contact with any enemy models. If he passes he may make a normal
    movement away from the enemy (not run or charge), without the enemy striking any blows on him.
    If the test is failed he remains in combat and must fight as normal in the following turn.
  source:
    manual: broheim.net
    printed_page: 3
    section: Heroes / Buccaneer / Special Rules / Swashbuckler
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Shallows%20Beasts.pdf
  name_i18n:
    es: Esgrimidor
  effect_i18n:
    es: >-
      El Bucanero luce una figura gallarda en combate, mezclando una esgrima deslumbrante y hazañas
      osadas con encanto y comentarios ingeniosos. ¡Los enemigos alaban y maldicen su habilidad para
      escapar siempre de sus garras sin esfuerzo! El Bucanero puede hacer un chequeo de Liderazgo al
      final de cualquier fase de combate cuerpo a cuerpo si sigue en contacto con algún modelo
      enemigo. Si lo supera, puede hacer un movimiento normal alejándose del enemigo (ni correr ni
      cargar), sin que el enemigo le propine ningún golpe. Si falla, permanece en combate y debe
      luchar con normalidad en el turno siguiente.
  applies_to:
    profile_ids:
    - buccaneer
- id: mutant-priest--wizard
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.shallows-beasts-mim.mutant-priest.wizard
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Wizard
  effect: >-
    The Mutant-Priest is a wizard and uses the Chaos Rituals on page 59 of the Mordheim rulebook.
  source:
    manual: broheim.net
    printed_page: 3
    section: Heroes / 0-1 Mutant-Priest / Special Rules / Wizard
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Shallows%20Beasts.pdf
  name_i18n:
    es: Mago
  effect_i18n:
    es: >-
      El Sacerdote Mutante es un mago y usa los Rituales del Caos de la página 59 del reglamento de
      Mordheim.
  applies_to:
    profile_ids:
    - mutant-priest
- id: mutant-priest--prayers
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.shallows-beasts-mim.mutant-priest.prayers
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Prayers
  effect: >-
    Mutant-Priests are servants of Manann's dark opposite Stromfels and may use the Prayers of
    Manann as detailed in the 'Miracle Workers' chapter. In addition, Stromfels Priests can receive
    a Mark of Manann instead of choosing a new skill if a double was rolled on the advance roll.
  source:
    manual: broheim.net
    printed_page: 3
    section: Heroes / 0-1 Mutant-Priest / Special Rules / Prayers
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Shallows%20Beasts.pdf
  name_i18n:
    es: Plegarias
  effect_i18n:
    es: >-
      Los Sacerdotes Mutas son sirvientes de Stromfels, el oscuro opuesto de Manann, y pueden usar
      las Plegarias de Manann como se detalla en el capítulo 'Trabajadores de Milagros'. Además, los
      Sacerdotes de Stromfels pueden recibir una Marca de Manann en lugar de elegir una nueva
      habilidad si se sacó un doble en la tirada de avance.
  applies_to:
    profile_ids:
    - mutant-priest
- id: mutant-priest--bite-attack
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.shallows-beasts-mim.mutant-priest.bite-attack
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Bite Attack
  effect: >-
    The Mutant-Priest has a powerful bite attack. This bite attack uses the Priest's own strength to
    wound and receives no penalty for not using a weapon. The bite attack always strikes last,
    regardless of who charged or which weapon is used. The bite even attacks after double-handed
    weapons.
  source:
    manual: broheim.net
    printed_page: 3
    section: Heroes / 0-1 Mutant-Priest / Special Rules / Bite Attack
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Shallows%20Beasts.pdf
  name_i18n:
    es: Ataque de Mordisco
  effect_i18n:
    es: >-
      El Sacerdote Mutante tiene un poderoso ataque de mordisco. Este ataque usa la propia Fuerza
      del Sacerdote para herir y no sufre penalización por no usar arma. El mordisco siempre golpea
      el último, sin importar quién cargó o qué arma se use. El mordisco ataca incluso tras las
      armas a dos manos.
  applies_to:
    profile_ids:
    - mutant-priest
- id: foundlings--blessed-child
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.shallows-beasts-mim.foundlings.blessed-child
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Blessed Child
  effect: Foundlings can re-roll the result of any Advance rolls. Re-roll results must be accepted.
  source:
    manual: broheim.net
    printed_page: 3
    section: Heroes / 0-2 Foundlings / Special Rules / Blessed Child
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Shallows%20Beasts.pdf
  name_i18n:
    es: Niño Bendecido
  effect_i18n:
    es: >-
      Los Expósitos pueden repetir el resultado de cualquier tirada de Avance. Los resultados
      repetidos deben aceptarse.
  applies_to:
    profile_ids:
    - foundlings
- id: fishmen--mer-creatures
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.shallows-beasts-mim.fishmen.mer-creatures
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Mer-Creatures
  effect: >-
    Stromfels cultists whose legs and arms warp in such a way that fish-scaled webbed limbs
    eventually replace them and gills develop allowing them to become aquatic. Fishmen can be
    submerged in water and suffer no injury. Impassable obstacles such as deep rivers, lakes or open
    sea are treated as difficult terrain, and they ignore the penalties for slow moving rivers and
    ponds.
  source:
    manual: broheim.net
    printed_page: 4
    section: Henchmen / Fishmen / Special Rules / Mer-creatures
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Shallows%20Beasts.pdf
  name_i18n:
    es: Criaturas Marinas
  effect_i18n:
    es: >-
      Los cultistas de Stromfels cuyas piernas y brazos se deforman hasta ser reemplazados por
      extremidades palmeadas de escamas de pez y desarrollar branquias, lo que les permite volverse
      acuáticos. Los Hombres Pez pueden sumergirse en el agua sin sufrir daño. Los obstáculos
      infranqueables como ríos profundos, lagos o mar abierto se tratan como terreno difícil, e
      ignoran las penalizaciones de ríos y estanques de corriente lenta.
  applies_to:
    profile_ids:
    - fishmen
- id: swampers--swamp-striders
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.shallows-beasts-mim.swampers.swamp-striders
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Swamp Striders
  effect: Swampers can move through any swamp and marshland terrain without penalty.
  source:
    manual: broheim.net
    printed_page: 4
    section: Henchmen / 0-2 Swampers / Special Rules / Swamp Striders
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Shallows%20Beasts.pdf
  name_i18n:
    es: Zancudos del Pantano
  effect_i18n:
    es: Los Ciénagueros pueden moverse por cualquier terreno de ciénaga y pantano sin penalización.
  applies_to:
    profile_ids:
    - swampers
- id: swampers--marsh-born
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.shallows-beasts-mim.swampers.marsh-born
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Marsh Born
  effect: >-
    Dense areas of watery fenland and log causeways are called home by Swampers. Swampers re-roll
    any failed Initiative tests when traversing marshland or fighting on slippery jetties.
  source:
    manual: broheim.net
    printed_page: 4
    section: Henchmen / 0-2 Swampers / Special Rules / Marsh Born
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Shallows%20Beasts.pdf
  name_i18n:
    es: Nacidos del Pantano
  effect_i18n:
    es: >-
      Las zonas densas de tierras anegadas y los pasos de troncos son el hogar de los Ciénagueros.
      Los Ciénagueros repiten cualquier chequeo de Iniciativa fallido al atravesar marismas o luchar
      en muelles resbaladizos.
  applies_to:
    profile_ids:
    - swampers
- id: swampers--herb-lore
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.shallows-beasts-mim.swampers.herb-lore
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Herb Lore
  effect: >-
    Out in the Cursed Marsh, Swamp-folk learn basic herb lore to cure simple injuries. Any model in
    base contact with the Swamper may be healed at the start of the recovery phase. On a roll of 4+
    the model has 1 wound restored. The Swamper may not move in the same turn as he uses this skill,
    but may use it to heal himself.
  source:
    manual: broheim.net
    printed_page: 4
    section: Henchmen / 0-2 Swampers / Special Rules / Herb Lore
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Shallows%20Beasts.pdf
  name_i18n:
    es: Conocimiento de Hierbas
  effect_i18n:
    es: >-
      En la Marisma Maldita, la gente del pantano aprende conocimientos básicos de hierbas para
      curar heridas simples. Cualquier modelo en contacto con el Cienaguero puede ser curado al
      comienzo de la fase de recuperación. Con un resultado de 4+ el modelo recupera 1 herida. El
      Cienaguero no puede moverse en el mismo turno en que usa esta habilidad, pero puede usarla
      para curarse a sí mismo.
  applies_to:
    profile_ids:
    - swampers
