rules:
- id: band--chain-of-command
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.house-guard-sc.band.chain-of-command
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Chain of Command
  effect: >-
    If the warband's leader is taken out of action, immediately determine a new temporary leader as
    if the leader had been killed permanently. The new leader temporarily gains the "Leader" ability
    until the end of the game or until he is taken out of action, in which case the process repeats.
  source:
    manual: broheim.net
    printed_page: 1
    section: Special rules / Chain of Command
    url: https://broheim.net/downloads/warbands/supplement/sealedcity/House Guard.pdf
  name_i18n:
    es: Cadena de Mando
  effect_i18n:
    es: >-
      Si el líder de la banda queda Fuera de combate, determina inmediatamente un nuevo líder
      temporal como si el líder hubiera muerto permanentemente. El nuevo líder asume el mando y gana
      temporalmente la habilidad "Líder" hasta el final de la partida o hasta que él también quede
      Fuera de combate, en cuyo caso se repite el proceso.
  applies_to:
    band: true
- id: band--personal-guard
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.house-guard-sc.band.personal-guard
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Personal Guard
  effect: >-
    Every hero and henchman in a House Guard has a range of 3 inches instead of the normal 2 inches
    for intercepting charges at friendly heroes. In the 'Assassination' scenario they may ignore the
    attacker's 'evasive' rule if their protégé is the target.
  source:
    manual: broheim.net
    printed_page: 1
    section: Special rules / Personal Guard
    url: https://broheim.net/downloads/warbands/supplement/sealedcity/House Guard.pdf
  name_i18n:
    es: Guardia Personal
  effect_i18n:
    es: >-
      Cada héroe y secuaz de una Guardia de Casa tiene un alcance de 3 pulgadas en lugar de las 2
      habituales para interceptar cargas contra héroes amigos. En el escenario de 'Asesinato' pueden
      ignorar la regla 'evasiva' del atacante si su protegido es el objetivo.
  applies_to:
    band: true
- id: band--houses
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.house-guard-sc.band.houses
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Houses
  effect: >-
    As a House Guard warband you must decide which of the expedition's financiers you fight for.
    Warbands from different houses vary in many respects, offering different benefits as well as a
    unique appearance and character.
  source:
    manual: broheim.net
    printed_page: 1
    section: Special rules / Houses
    url: https://broheim.net/downloads/warbands/supplement/sealedcity/House Guard.pdf
  name_i18n:
    es: Casas
  effect_i18n:
    es: >-
      Como banda de Guardia de Casa debes decidir por cuál de los financiadores de la expedición
      luchas. Las bandas de distintas casas varían en muchos aspectos, ofreciendo beneficios
      diferentes además de una apariencia y carácter únicos.
  applies_to:
    band: true
- id: band--dueling-pride
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: band
    effects:
    - id: trait.re-roll-hits-vs-heroes
      scope: LATER
      binding: null
      reason: >-
        Deferred: hero-vs-hero re-roll needs a target-type filter not yet exposed by the trait
        bindings.
  name: Dueling Pride (House Fierezza)
  effect: >-
    Fierezza Heroes may re-roll failed hits during the first round of combat when fighting enemy
    heroes.
  source:
    manual: broheim.net
    printed_page: 1
    section: House Fierezza / Additional special rules / Dueling Pride
    url: https://broheim.net/downloads/warbands/supplement/sealedcity/House Guard.pdf
  name_i18n:
    es: Orgullo de Duelo (Casa Fierezza)
  effect_i18n:
    es: >-
      Los héroes de Fierezza pueden repetir los impactos fallidos durante el primer asalto de
      combate cuando luchan contra héroes enemigos.
  applies_to:
    band: true
