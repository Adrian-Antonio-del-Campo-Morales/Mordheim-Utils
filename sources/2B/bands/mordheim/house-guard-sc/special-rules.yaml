  name: Leader
  effect: Any warrior within 6 inches of the Commander may use his Leadership instead of his own.
  source:
    manual: broheim.net
    printed_page: 3
    section: 1 Commander / Special Rules / Leader
    url: https://broheim.net/downloads/warbands/supplement/sealedcity/House Guard.pdf
  name_i18n:
    es: Líder
  effect_i18n:
    es: Cualquier guerrero a 6 pulgadas del Comandante puede usar su Liderazgo en lugar del propio.
  applies_to:
    profile_ids:
    - commander
- id: adjutant--relay-orders
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.house-guard-sc.adjutant.relay-orders
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Relay Orders
  effect: >-
    As long as the Adjutant is able to use his leader's Leadership, any warrior within 6 inches of
    the Adjutant may use the leader's Leadership instead of his own. The Adjutant may take the
    Battle Tongue skill to increase his range to 12 inches.
  source:
    manual: broheim.net
    printed_page: 4
    section: 0-1 Adjutant / Special Rules / Relay orders
    url: https://broheim.net/downloads/warbands/supplement/sealedcity/House Guard.pdf
  name_i18n:
    es: Transmitir Órdenes
  effect_i18n:
    es: >-
      Mientras el Ayudante pueda usar el Liderazgo de su líder, cualquier guerrero a 6 pulgadas del
      Ayudante puede usar el Liderazgo del líder en lugar del propio. El Ayudante puede adquirir la
      habilidad Lengua de Guerra para ampliar su alcance a 12 pulgadas.
  applies_to:
    profile_ids:
    - adjutant
- id: pikemen--pikewall
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: trait.re-roll-hits-when-charged
      scope: LATER
      binding: null
      reason: >-
        Deferred: requires a conditional re-roll tied to being charged and a first-strike weapon,
        not yet expressible with current trait bindings.
  name: Pikewall
  effect: >-
    Charging a skilled Pikeman is always dangerous, as they may re-roll any failed hits when getting
    charged while wielding a weapon with first strike.
  source:
    manual: broheim.net
    printed_page: 4
    section: 0-4 Pikemen / Special Rules / Pikewall
    url: https://broheim.net/downloads/warbands/supplement/sealedcity/House Guard.pdf
  name_i18n:
    es: Muro de Picas
  effect_i18n:
    es: >-
      Cargar contra un Piquero experto siempre es peligroso, pues puede repetir los impactos
      fallidos cuando le cargan mientras empuña un arma con golpe primero.
  applies_to:
    profile_ids:
    - pikemen
