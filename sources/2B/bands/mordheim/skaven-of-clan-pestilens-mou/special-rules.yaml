rules:
- id: band--pestilens-special-skills
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.skaven-of-clan-pestilens-mou.band.pestilens-special-skills
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: no effect applies to the current engine scope.
  name: Clan Pestilence Special Skills
  effect: >-
    Skaven Heroes with the Special skill available to them may choose to use the following Skill
    list instead of any of the standard Skill tables available to them. Cloud of Flies: the Skaven
    is surrounded by a cloud of buzzing flies; any model in base contact with the character suffers
    a -1 penalty to all to hit rolls; Clan Pestilens Heroes and Plague Monks, Undeads and followers
    of Nurgle are immune to this effect. Numb: the Hero treats a Stunned result as Knocked down.
    Frenzy: the Skaven is subject to Frenzy. Resilient: same as the Strength skill. Rotten Body: the
    Hero causes Fear.
  source:
    manual: broheim.net
    printed_page: 2
    section: Clan Pestilence Special Skills
    url: https://broheim.net/downloads/warbands/supplement/mousillon/Skaven%20of%20Clan%20Pestilens.pdf
  name_i18n:
    es: Habilidades Especiales del Clan Pestilente
  effect_i18n:
    es: >-
      Los héroes skaven con la habilidad Especial disponible pueden elegir usar la siguiente lista
      en lugar de cualquiera de las tablas de habilidades estándar. Nube de Moscas: el skaven está
      rodeado de una nube de moscas zumbantes; cualquier modelo en contacto base con el personaje
      sufre una penalización de -1 a todas las tiradas para golpear; los héroes del Clan Pestilente
      y los Monjes de la Peste, los Muertos Vivientes y los seguidores de Nurgle son inmunes a este
      efecto. Entumecido: el héroe trata un resultado Aturdido como Derribado. Frenesí: el skaven
      está sujeto a Frenesí. Resistente: igual que la habilidad de Fuerza. Cuerpo Podrido: el héroe
      causa Miedo.
  applies_to:
    band: true
- id: band--plague-censer
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.skaven-of-clan-pestilens-mou.band.plague-censer
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: no effect applies to the current engine scope.
  name: Plague Censer
  effect: >-
    Cost 75+5D6 wt, Rare 12. A Plague Censer is a hollow spiked metal ball attached to a long chain
    and is swung as a flail; a plague-infested shard of warpstone is burning inside the ball so that
    it emits a foul bubonic vapour as the censer is swung. Profile: Close Combat, Strength As User
    +2, Special Rules Heavy, Two Handed, Fog of Death. Heavy: the Plague Censer is wielded as a
    flail, and confers +2 Strength only on the first round of combat. Two-handed: a flail requires
    two hands to use and a model using a flail may not use a shield, buckler or additional hand
    weapon in close combat; if the model has a shield he still gets a +1 bonus to his armour save
    against shooting. Fog of Death: the billowing clouds of vapour created by the swinging Censer
    makes the wielder a difficult target to shoot at; there is an extra penalty of -1 to hit for
    shooting at the wielder of a Plague Censer. In addition, at the end of each close-combat phase
    roll a D6 for each model in base contact with the Plague Censer wielder; on the roll of 6 the
    model suffers a wound from the poisonous gas, with no armour save allowed as the vapours
    penetrate any defenses. Note that Plague Censer wielders are immune to the Fog of Death, even if
    they are in base contact with another Plague Censer wielder.
  source:
    manual: broheim.net
    printed_page: 3
    section: Clan Pestilence Special Equipment / Plague Censer
    url: https://broheim.net/downloads/warbands/supplement/mousillon/Skaven%20of%20Clan%20Pestilens.pdf
  name_i18n:
    es: Incensario de la Peste
  effect_i18n:
    es: >-
      Coste 75+5D6 wt, Rareza 12. Un Incensario de la Peste es una bola metálica hueca con pinchos
      unida a una larga cadena que se blanden como un mayal; dentro de la bola arde un fragmento de
      piedra warp infestado de plagas que emite un vapor bubónico fétido al blandir el incensario.
      Perfil: Combate Cuerpo a Cuerpo, Fuerza Igual al Usuario +2, Reglas Especiales Pesado, A Dos
      Manos, Niebla de Muerte. Pesado: el Incensario de la Peste se blande como un mayal y otorga +2
      de Fuerza solo en la primera ronda de combate. A Dos Manos: un mayal requiere dos manos y un
      modelo que use un mayal no puede usar escudo, broquel o arma adicional en combate cuerpo a
      cuerpo; si el modelo tiene escudo aún obtiene un +1 a su salvación por armadura contra
      disparos. Niebla de Muerte: las nubes de vapor creadas por el incensario hacen difícil
      disparar al portador; hay una penalización adicional de -1 para disparar al portador de un
      Incensario de la Peste. Además, al final de cada fase de combate cuerpo a cuerpo tira un D6
      por cada modelo en contacto base con el portador; con un 6 el modelo sufre una herida por el
      gas venenoso, sin tirada de salvación por armadura ya que los vapores penetran cualquier
      defensa. Los portadores de Incensarios de la Peste son inmunes a la Niebla de Muerte, incluso
      si están en contacto base con otro portador.
  applies_to:
    band: true
