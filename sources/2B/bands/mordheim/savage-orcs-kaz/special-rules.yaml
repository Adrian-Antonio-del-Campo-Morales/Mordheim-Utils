- id: band--pet
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.savage-orcs-kaz.band.pet
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: purchases and animals.
  name: Pet
  effect: >-
    One Savage Orc hero may have a single pet. This can be a War Boar, Giant Wolf or Giant
    Spider. The pet is the personal property of the hero: only he may ride the War Boar, and no
    one may ride a Wolf or Spider, even if there are goblins in the warband. Note: the hero may
    ride his pet War Boar, or he may buy a second War Boar to ride. The hero's pet does not count
    as part of the warband as far as the distribution of treasure or maximum number of warriors
    is concerned; the pet is treated exactly like a piece of equipment and is lost immediately
    (it runs off) if the hero dies. Note the reduction in cost of the Giant Wolf and Giant Spider
    to take into account that they cannot be ridden.
  source:
    manual: broheim.net
    printed_page: 60
    section: Pet
    url: https://broheim.net/downloads/campaigns/karakazgal/Karak Azgal.pdf
  name_i18n:
    es: Mascota
  effect_i18n:
    es: >-
      Un héroe Orco Salvaje puede tener una sola mascota. Puede ser un Jabalí de Guerra, un Lobo
      Gigante o una Araña Gigante. La mascota es propiedad personal del héroe: solo él puede montar
      el Jabalí de Guerra, y nadie puede montar al Lobo ni a la Araña, aunque haya goblins en la
      banda. Nota: el héroe puede montar su Jabalí de Guerra como mascota, o comprar un segundo
      Jabalí de Guerra para montarlo. La mascota no cuenta como parte de la banda a efectos del
      reparto del tesoro ni del número máximo de guerreros; se trata exactamente como una pieza de
      equipo y se pierde de inmediato (huye) si el héroe muere. Nótese la reducción de coste del
      Lobo Gigante y de la Araña Gigante para reflejar que no pueden montarse.
  applies_to:
    band: true
