  name: Hired Swords
  effect: >-
    A Savage Orc warband may hire the following Hired Swords and Dramatis Personae: Black Orc
    Bodyguard and Snerik.
  source:
    manual: broheim.net
    printed_page: 56
    section: Hired Swords
