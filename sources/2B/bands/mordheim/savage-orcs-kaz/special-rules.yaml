schema_version: 2
band_id: savage-orcs-kaz
rules:
- id: band--animosity
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.savage-orcs-kaz.band.animosity
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: animosity rules live in TC6/WD243 and operate on the turn structure
        outside the duel resolution. Individual profiles reference this band rule.
  name: Animosity
  effect: >-
    Just like their more sophisticated (?) cousins, Savage Orcs suffer from animosity. See TC6
    in WD243 for Animosity Rules.
  source:
    manual: broheim.net
    printed_page: 56
    section: Special Rules / Animosity
    url: https://broheim.net/downloads/campaigns/karakazgal/Karak Azgal.pdf
  name_i18n:
    es: Animadversión
  effect_i18n:
    es: >-
      Igual que sus primos más sofisticados (?), los Orcos Salvajes sufren animosidad. Ver las
      reglas de Animosidad en TC6 del WD243.
  applies_to:
    band: true
- id: band--orc-special-skills
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.savage-orcs-kaz.band.orc-special-skills
      scope: LATER
      binding: null
      reason: >-
        Deferred cross-reference: Orc special skills live in TC6 (White Dwarf 243), not in this
        document.
  name: Orc Special Skills
  effect: >-
    Savage Orc heroes may use the Orc special skills from TC6 (White Dwarf 243) instead of any
    of the standard skill lists available to them.
  source:
    manual: broheim.net
    printed_page: 56
    section: Orc Special Skills
    url: https://broheim.net/downloads/campaigns/karakazgal/Karak Azgal.pdf
  name_i18n:
    es: Habilidades Especiales de Orcos
  effect_i18n:
    es: >-
      Los héroes Orcos Salvajes pueden usar las habilidades especiales Orcas de TC6 (White Dwarf
      243) en lugar de cualquiera de las listas de habilidades estándar disponibles para ellos.
  applies_to:
    band: true
- id: band--gobbo-rout-counting
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.savage-orcs-kaz.band.gobbo-rout-counting
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: rout tests are a post-battle/campaign mechanic.
  name: Ain't Orcz (Rout Counting)
  effect: >-
    Orcs don't expect much from their lesser cousins and are not bothered if they break or get
    slain in battle. Therefore when testing to see if an Orc warband needs to take a rout test,
    each Gobbo boy taken out of action counts as half a model.
  source:
    manual: broheim.net
    printed_page: 59
    section: Gobbo Boyz / Special Rules / Ain't Orcz
    url: https://broheim.net/downloads/campaigns/karakazgal/Karak Azgal.pdf
  name_i18n:
    es: No Son Orcos (Recuento de Retirada)
  effect_i18n:
    es: >-
      Los Orcos no esperan mucho de sus primos menores y no les importa que rompan o caigan en
      batalla. Por tanto, al hacer el chequeo para ver si una banda Orca necesita una tirada de
      Huida, cada Chico Gobbo Fuera de Combate cuenta como medio modelo.
  applies_to:
    band: true
- id: boss--leader
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.savage-orcs-kaz.boss.leader
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: psychology.
  name: Leader
  effect: >-
    Any member of the Savage Orc warband within 6\" can use Da Boss's Leadership characteristic
    when making Leadership tests.
  source:
    manual: broheim.net
    printed_page: 57
    section: heroes / 1 Boss / Special Rules / Leader
    url: https://broheim.net/downloads/campaigns/karakazgal/Karak Azgal.pdf
  name_i18n:
    es: Líder
  effect_i18n:
    es: >-
      Cualquier miembro de la banda de Orcos Salvajes a 6" puede usar la característica de Liderazgo
      de Da Jefe al realizar chequeos de Liderazgo.
  applies_to:
    profile_ids:
    - boss
- id: weirdo--wizard
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.savage-orcs-kaz.weirdo.wizard
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: magic subsystem (Waaagh! Magic, TC6/WD243).
  name: Wizard
  effect: >-
    A Savage Orc Wierdo is a wizard and uses Waagh! Magic. See Waaagh magic in TC6 (WD243).
  source:
    manual: broheim.net
    printed_page: 57
    section: heroes / 0-1 Wierdo / Special Rules / Wizard
    url: https://broheim.net/downloads/campaigns/karakazgal/Karak Azgal.pdf
  name_i18n:
    es: Hechicero
  effect_i18n:
    es: >-
      Un Rarito Orco Salvaje es un Hechicero y usa magia Waaagh!. Ver la magia Waaagh en TC6
      (WD243).
  applies_to:
    profile_ids:
    - weirdo
- id: spottaz--get-out-dere
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.savage-orcs-kaz.spottaz.get-out-dere
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: deployment/infiltration rolls happen outside the duel resolution.
  name: Get Out Dere!
  effect: >-
    The boss sometimes tells his Spottaz to scout out enemy positions. If the player wants his
    Spottaz to infiltrate, roll a D6 for each Spotta at the beginning of the game but after all
    models on both sides (including the Spottaz) have been deployed. If the Boss is within 6\"
    of the Spotta, subtract -1 from the dice roll. 1-2: Sure thing Boss — the Spotta sneaks
    forward and may be re-deployed anywhere on the table, but at least 12\" from any enemy
    model. 3-4: Err…if you're sure boss — the Spotta is worried about going too far away from
    the rest of the ladz and may be moved up to D6+6\" from his current position. 5-6: No way! —
    no matter how much da Boss pummels the Spotta he refuses to leave his mates. If the boss is
    within 6\", the Spotta starts the game knocked down.
  source:
    manual: broheim.net
    printed_page: 57
    section: heroes / 0-2 Spottaz / Special Rules / Get out dere!
    url: https://broheim.net/downloads/campaigns/karakazgal/Karak Azgal.pdf
  name_i18n:
    es: ¡Fuera de Ahí!
  effect_i18n:
    es: >-
      A veces el jefe ordena a sus Ojeadores explorar las posiciones enemigas. Si el jugador quiere
      que sus Ojeadores se infiltren, tira 1D6 por cada Ojeador al inicio de la partida, pero
      después de que todos los modelos de ambos bandos (incluidos los Ojeadores) hayan sido
      desplegados. Si el Jefe está a 6" del Ojeador, resta -1 a la tirada de dado. 1-2: Lo que
      digas, Jefe — el Ojeador se escabulle hacia adelante y puede redeployarse en cualquier parte
      de la mesa, pero al menos a 12" de cualquier modelo enemigo. 3-4: Eh… si tú lo dices, jefe —
      el Ojeador está preocupado por alejarse demasiado del resto de los chicos y puede moverse
      hasta 1D6+6" desde su posición actual. 5-6: ¡Ni hablar! — por mucho que Da Jefe le patee al
      Ojeador, se niega a dejar a sus compañeros. Si el jefe está a 6", el Ojeador comienza la
      partida derribado.
  applies_to:
    profile_ids:
    - spottaz
