  name: Up Close
  effect: >-
    Normal Slayers may only use thrown missile weapons and different types of pistols. Only Gunners
    and the Master gunners may only learn Shooting Skills, and may any thrown weapons and gunpowder
    weapons (no other types.)
  source:
    manual: Broheim
    printed_page: 1
    section: Special Rules / Up Close
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Slayer%20Pirates.pdf
  name_i18n:
    es: A Quemarropa
  effect_i18n:
    es: >-
      Los Matagigantes normales solo pueden usar armas arrojadizas y distintos tipos de pistolas.
      Los Artilleros y el Maestro Artillero son los únicos que pueden aprender Habilidades de
      Disparo, y pueden usar armas arrojadizas y armas de pólvora (ningún otro tipo).
  applies_to:
    band: true
