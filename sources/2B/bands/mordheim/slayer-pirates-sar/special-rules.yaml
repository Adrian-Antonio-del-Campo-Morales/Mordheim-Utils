- id: band--skittish-promotion
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.slayer-pirates-sar.band.skittish-promotion
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Skittish (promotion rule)
  effect: >-
    As newly crowned Slayers, Gunners and Landlubbers do not have the skill 'Death Wish', and suffer
    psychology like normal. When a Gunner or Landlubber gains 'That Lad's Got Talent', instead of
    making an immediate roll on the Hero Advance Table, he MUST learn 'Death Wish.' Death Wish may
    be learned even if the model does not choose Special skills as one of his two skill lists.
  source:
    manual: Broheim
    printed_page: 4
    section: Henchmen / 0-5 Gunners / Skittish
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Slayer%20Pirates.pdf
  name_i18n:
    es: Asustadizos (regla de ascenso)
  effect_i18n:
    es: >-
      Como Matagigantes recién coronados, los Artilleros y Grumetes de Tierra no tienen la habilidad
      'Deseo de Muerte' y sufren psicología con normalidad. Cuando un Artillero o Grumete de Tierra
      gana 'Ese Chico Tiene Talento', en lugar de hacer una tirada inmediata en la Tabla de Progreso
      de Héroes, DEBE aprender 'Deseo de Muerte'. Deseo de Muerte puede aprenderse aunque el modelo
      no elija Habilidades Especiales como una de sus dos listas de habilidades.
  applies_to:
    band: true
