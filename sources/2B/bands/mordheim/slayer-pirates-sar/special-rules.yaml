    section: Special Rules / Swabbies
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Slayer%20Pirates.pdf
  name_i18n:
    es: Fregones (Piratas Matagigantes)
  effect_i18n:
    es: >-
      Los Piratas Matagigantes capturan Fregones, como se describe en Sartosa 01.pdf. Los cautivos
      voluntarios se unen a los Grumetes de Tierra; los reacios se convierten en Thaggi.
  applies_to:
