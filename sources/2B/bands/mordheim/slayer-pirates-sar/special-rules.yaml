schema_version: 2
band_id: slayer-pirates-sar
rules:
- id: band--slayer-rules
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.slayer-pirates-sar.band.slayer-rules
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Slayer Special Rules
  effect: >-
    All Slayers are subject to the following special rules. Hard to Kill: Dwarfs are tough,
    resilient individuals who can only be taken out of action on a roll of 6 instead of 5-6 when
    rolling on the Injury chart; treat a roll of 1-2 as knocked down, 3-5 as stunned, and 6 as out
    of action. Hard Head: Dwarfs ignore the special rules for maces, clubs, etc.; they are not easy
    to knock out! Grudgebearers: Dwarfs hold an ancient grudge against Elves from the days when the
    two races fought for supremacy in the Old World; a Dwarf warband may never include any kind of
    Elven Hired Sword or Dramatis Personae.
  source:
    manual: Broheim
    printed_page: 1
    section: Special Rules
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Slayer%20Pirates.pdf
  name_i18n:
    es: Reglas Especiales de Matagigantes
  effect_i18n:
    es: >-
      Todos los Matagigantes están sujetos a las siguientes reglas especiales. Difícil de Matar: los
      enanos son individuos duros y resistentes que solo pueden quedar fuera de combate con una
      tirada de 6 en lugar de 5-6 en la tabla de heridas; trata un 1-2 como derribado, 3-5 como
      aturdido y 6 como fuera de combate. Cabeza Dura: los enanos ignoran las reglas especiales de
      mazas, garrotes, etc.; ¡no es fácil dejarlos ko! Guardianes del Agravio: los enanos guardan un
      rencor ancestral contra los elfos desde los días en que ambas razas lucharon por la supremacía
      en el Viejo Mundo; una banda de enanos nunca puede incluir ningún tipo de Espada a Sueldo
      élfica ni Dramatis Personae.
  applies_to:
    band: true
- id: band--see-you-in-davie-jones
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.slayer-pirates-sar.band.see-you-in-davie-jones
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: See You in Davie Jones!
  effect: >-
    Slayer Pirates seek their death. If you voluntarily Rout, the number of Exploration dice you
    receive is halved, rounded up.
  source:
    manual: Broheim
    printed_page: 1
    section: Special Rules / See You in Davie Jones!
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Slayer%20Pirates.pdf
  name_i18n:
    es: Nos Vemos con Davie Jones
  effect_i18n:
    es: >-
      Los Piratas Matagigantes buscan su muerte. Si huyes voluntariamente, el número de dados de
      exploración que recibes se reduce a la mitad, redondeando hacia arriba.
  applies_to:
    band: true
- id: band--deathwish
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.slayer-pirates-sar.band.deathwish
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Deathwish
  effect: >-
    Slayers seek an honorable death in combat. Unless stated otherwise, all members of this warband
    are completely immune to all psychology and never need to test if fighting alone. This includes
    Frenzy & Stupidity.
  source:
    manual: Broheim
    printed_page: 1
    section: Special Rules / Deathwish
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Slayer%20Pirates.pdf
  name_i18n:
    es: Deseo de Muerte
  effect_i18n:
    es: >-
      Los Matagigantes buscan una muerte honorable en combate. Salvo indicación contraria, todos los
      miembros de esta banda son completamente inmunes a toda psicología y nunca necesitan hacer
      tiradas si luchan solos. Esto incluye Frenesí y Estupidez.
  applies_to:
    band: true
- id: band--not-just-any-ol-toy
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.slayer-pirates-sar.band.not-just-any-ol-toy
