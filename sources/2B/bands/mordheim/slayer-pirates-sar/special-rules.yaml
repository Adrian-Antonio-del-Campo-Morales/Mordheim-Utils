  effect: Slayers may never use armour of any kind, nor use any magic (except Magic Weapons).
  source:
    manual: Broheim
    printed_page: 1
    section: Special Rules / Not just any ol' Toy!
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Slayer%20Pirates.pdf
  name_i18n:
