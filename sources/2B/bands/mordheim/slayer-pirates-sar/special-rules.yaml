  name: Expert Weaponsmith
  effect: >-
    A Master Gunner is a master of mechanical devices. By using stronger construction materials and
    time-tested secrets of Dwarf Engineering, a Master Gunner can increase the distance the
    warband's missile weapons can shoot. All of your warband's Pistols (any type) have their range
    increased by 3", and all Blunderbusses (any type) are increased by 6". Any range increases are
    only maintained as long as the Master Gunner remains with the warband and was deployed this
    game.
  source:
    manual: Broheim
    printed_page: 3
    section: Heroes / 0-1 Master Gunner / Special Rules
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Slayer%20Pirates.pdf
  name_i18n:
    es: Armero Experto
  effect_i18n:
    es: >-
      Un Maestro Artillero es un maestro de los mecanismos. Usando materiales de construcción más
      resistentes y los secretos probados por el tiempo de la Ingeniería Enana, un Maestro Artillero
      puede aumentar la distancia a la que disparan las armas de proyectil de la banda. Todas las
      Pistolas (de cualquier tipo) de tu banda ven su alcance aumentado en 3", y todos los Trabucos
      (de cualquier tipo) en 6". Los aumentos de alcance solo se mantienen mientras el Maestro
      Artillero permanezca en la banda y haya sido desplegado en esta partida.
  applies_to:
    profile_ids:
    - master-gunner
