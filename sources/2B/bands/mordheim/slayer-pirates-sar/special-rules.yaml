- id: master-gunner--expert-weaponsmith
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.slayer-pirates-sar.master-gunner.expert-weaponsmith
      scope: 'NO'
