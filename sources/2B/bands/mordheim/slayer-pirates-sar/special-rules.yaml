  applies_to:
    profile_ids:
    - thaggi
- id: thaggi--never-gain-experience
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.slayer-pirates-sar.thaggi.never-gain-experience
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Never Gain Experience (Thaggi)
  effect: >-
    Thaggi generally aren't interested in proving their worth to the crew, they are interested in
    survival and hopefully escape! Thaggi never gain experience in games.
  source:
    manual: Broheim
    printed_page: 4
    section: Henchmen / 0-5 Thaggi / Special Rules
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Slayer%20Pirates.pdf
  name_i18n:
    es: Nunca Ganarán Experiencia (Thaggi)
  effect_i18n:
    es: >-
      Los Thaggi no están interesados en demostrar su valor a la tripulación, ¡les interesa
      sobrevivir y escapar si pueden! Los Thaggi nunca ganan experiencia en las partidas.
  applies_to:
    profile_ids:
    - thaggi
- id: thaggi--rabble
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.slayer-pirates-sar.thaggi.rabble
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Rabble (Thaggi)
  effect: >-
    Thaggi do not need to be armed all the same. Each may be given different equipment, but only
    items listed in the Thaggi equipment list. Thaggi can never use magic, or cast spells of any
    sort, no matter their original background or abilities.
  source:
    manual: Broheim
    printed_page: 4
    section: Henchmen / 0-5 Thaggi / Special Rules
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Slayer%20Pirates.pdf
  name_i18n:
    es: Chusma (Thaggi)
  effect_i18n:
    es: >-
      Los Thaggi no necesitan ir armados por igual. Cada uno puede llevar equipo distinto, pero solo
      objetos de la lista de equipo de los Thaggi. Los Thaggi nunca pueden usar magia ni lanzar
      hechizos de ningún tipo, sin importar su origen o habilidades previas.
  applies_to:
    profile_ids:
    - thaggi
- id: thaggi--kruk-they-got-away
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.slayer-pirates-sar.thaggi.kruk-they-got-away
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Kruk, they got away!
  effect: >-
    If the Slayer Pirate Warband itself Routs, any Thaggi who have already left the table in
    previous turns are presumed to have made a successful escape, and are never seen from again.
    Remove them from your warband roster as if they had been killed.
  source:
    manual: Broheim
    printed_page: 4
    section: Henchmen / 0-5 Thaggi / Special Rules
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Slayer%20Pirates.pdf
  name_i18n:
    es: Kruk, ¡se han escapado!
  effect_i18n:
    es: >-
      Si la banda de Piratas Matagigantes huye de la partida, se asume que los Thaggi que ya hayan
      salido de la mesa en turnos anteriores han escapado con éxito y no volverán a verse jamás.
      Retíralos de la lista de la banda como si hubieran muerto.
  applies_to:
    profile_ids:
    - thaggi
- id: thaggi--dont-mind-them-mates
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.slayer-pirates-sar.thaggi.dont-mind-them-mates
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Don't mind them mates, they ain't true dwarves!
  effect: >-
    The rest of the crew barely notice if any Thaggi run away or go Out of Action - they know
    they'll find them later on and give them 30 lashes if they're lucky! Any Thaggi who are running
    away or have been taken out of action do not count towards the need to take a Rout test for the
    warband.
  source:
    manual: Broheim
    printed_page: 4
    section: Henchmen / 0-5 Thaggi / Special Rules
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Slayer%20Pirates.pdf
  name_i18n:
    es: No les hagas caso, ¡no son enanos de verdad!
  effect_i18n:
    es: >-
      Al resto de la tripulación apenas le importa si los Thaggi huyen o quedan fuera de combate:
      ¡saben que los encontrarán más tarde y les darán 30 latigazos si tienen suerte! Los Thaggi que
      estén huyendo o fuera de combate no cuentan a la hora de hacer la tirada de Huida de la banda.
  applies_to:
    profile_ids:
    - thaggi
- id: band--slayer-special-skills
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.slayer-pirates-sar.skills.slayer-special-skills
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Slayer Special Skills
  effect: >-
    Death Wish: the hero is completely immune to all psychology and never need to test if fighting
    alone (Landlubbers & Gunners Only; see 'Landlubbers' or 'Gunners' for special rules).
    Gloryseeker: as long as the Pirate is engaged in combat with a Fear causing model, he gains +1
    Attack in each round of combat; he only gains one attack from this skill, even if facing more
    than one fear causing opponents. Ferocious Charge: the Slayer may double his attacks on the turn
    in which he charges; he will suffer a -1 'to hit' penalty on that turn. Leviathan Slayer: the
    Slayer will always wound on a 5+, after applying bonuses and penalties; if he would normally
    need a 4+ or lower to wound, the Slayer causes a critical hit on a natural 5+; hand-to-hand
    combat only. True Grit: Dwarfs are hardy individuals and this Hero is hardy even for a Dwarf!
    When rolling on the Injury table for this Hero, a roll of 1-3 is treated as knocked down, 4-5 as
    stunned, and 6 as out of action. Thick Skull: the Hero has a thick skull, even for a Dwarf; he
    has a 3+ save on a D6 to avoid being stunned; if the save is made, treat a stunned result as
    knocked down instead.
  source:
    manual: Broheim
    printed_page: 2
    section: Slayer Skills / Special Skills
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Slayer%20Pirates.pdf
  name_i18n:
    es: Habilidades Especiales de Matagigantes
  effect_i18n:
    es: >-
      Deseo de Muerte: el héroe es completamente inmune a toda psicología y nunca necesita hacer
      tiradas si lucha solo (solo Grumetes de Tierra y Artilleros; ver reglas especiales). Buscador
      de Gloria: mientras el Pirata esté en combate con un modelo que cause Miedo, gana +1 Ataque en
      cada ronda de combate; solo gana un ataque de esta habilidad, incluso si se enfrenta a más de
      un oponente que cause miedo. Carga Feroz: el Matagigantes puede doblar sus ataques en el turno
      en que carga; sufrirá una penalización de -1 para golpear ese turno. Matador de Leviatanes: el
      Matagigantes siempre hiere con un 5+, tras aplicar bonificaciones y penalizaciones; si
      normalmente necesitara un 4+ o menos para herir, causa un impacto crítico con un 5 natural;
      solo en combate cuerpo a cuerpo. Entereza: los enanos son individuos duros, ¡y este Héroe es
      duro incluso para ser un enano! Al hacer tiradas en la tabla de heridas para este Héroe, un
      1-3 se trata como derribado, 4-5 como aturdido y 6 como fuera de combate. Cráneo Robusto: el
      Héroe tiene un cráneo grueso, incluso para un enano; tiene una salvación de 3+ en 1D6 para
      evitar quedar aturdido; si supera la salvación, trata un resultado de aturdido como derribado
      en su lugar.
  applies_to:
    band: true
