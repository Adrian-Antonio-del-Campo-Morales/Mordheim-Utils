band_id: lothern-sea-patrol-sar
rules:
- id: band--excellent-eyes
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.lothern-sea-patrol-sar.band.excellent-eyes
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Excellent Eyes
  effect: >-
    Elves have excellent eyesight, unmatched by mere humans; when spotting hidden enemy units they
    add +2 to the distance they can spot them.
  source:
    manual: broheim.net
    printed_page: 1
    section: Special Rules / Excellent Eyes
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Lothern%20Sea%20Patrol.pdf
  name_i18n:
    es: Vista Excelente
  effect_i18n:
    es: >-
      Los elfos tienen una vista excelente, sin igual entre los simples humanos; al detectar
      unidades enemigas ocultas suman +2 a la distancia a la que pueden descubrirlas.
  applies_to:
    band: true
- id: band--look-rich
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.lothern-sea-patrol-sar.band.look-rich
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Look Rich
  effect: >-
    High elves pay double upkeep for any hired swords that are not Elven, because humans tend to
    think that elves are rich. They may not hire any hired swords that are not elven or human, and
    they may not hire any Dark Elves. Neither may they hire a witch.
  source:
    manual: broheim.net
    printed_page: 1
    section: Special Rules / Look Rich
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Lothern%20Sea%20Patrol.pdf
  name_i18n:
    es: Parecer Ricos
  effect_i18n:
    es: >-
      Los altos elfos pagan el doble de mantenimiento por cualquier espada a sueldo que no sea
      élfica, porque los humanos tienden a pensar que los elfos son ricos. No pueden contratar
      espadas a sueldo que no sean élficas o humanas, no pueden contratar Elfos Oscuros ni brujas.
  applies_to:
    band: true
- id: band--fine-craftwork
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.lothern-sea-patrol-sar.band.fine-craftwork
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Fine Craftwork
  effect: >-
    High elves may not use any heavy armours except for Ithilmar armour. However, should they get
    their hands on a magical armour, they may use it nevertheless as the craftwork is so great.
  source:
    manual: broheim.net
    printed_page: 1
    section: Special Rules / Fine Craftwork
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Lothern%20Sea%20Patrol.pdf
  name_i18n:
    es: Excelente Manufactura
  effect_i18n:
    es: >-
      Los altos elfos no pueden usar ninguna armadura pesada salvo la armadura de ithilmar. Sin
      embargo, si consiguen una armadura mágica, pueden usarla igualmente, pues su manufactura es
      magnífica.
  applies_to:
    band: true
- id: band--honours
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.lothern-sea-patrol-sar.band.honours
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Honours
  effect: >-
    Each High Elf Hero may have one honour upon purchase. They may only be given one honour and
    cannot attain new ones during the campaign (see the honour chapter for details): Pure of Heart
    (5 gc), Spearmaster (10 gc), Swordmaster (10 gc), Sea Guard (10 gc), White Lion (20 gc), Phoenix
    Guard (15 gc), Ranger (10 gc), Loremaster (10/15 gc).
  source:
    manual: broheim.net
    printed_page: 3
    section: High Elf Honours
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Lothern%20Sea%20Patrol.pdf
  name_i18n:
    es: Honores
  effect_i18n:
    es: >-
      Cada Héroe de Alto Elfo puede tener un honor al ser reclutado. Solo pueden recibir un honor y
      no pueden conseguir otros durante la campaña (ver el capítulo de honores): Corazón Puro (5
      coronas), Maestro de la Lanza (10), Maestro de la Espada (10), Guardia del Mar (10), León
      Blanco (20), Guardia del Fénix (15), Guardabosques (10), Erudito (10/15).
  applies_to:
    band: true
- id: band--honourable
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.lothern-sea-patrol-sar.band.honourable
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Honourable
  effect: >-
    Lothern Sea Patrol members may never use poisons or drugs, nor hire any Hired Swords who use
    them.
  source:
    manual: broheim.net
    printed_page: 1
    section: Special Rules / Honourable
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Lothern%20Sea%20Patrol.pdf
  name_i18n:
    es: Honorable
  effect_i18n:
    es: >-
      Los miembros de la Patrulla Marítima de Lothern nunca pueden usar venenos ni drogas, ni
      contratar Espadas a Sueldo que las usen.
  applies_to:
    band: true
- id: band--teetotalers
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.lothern-sea-patrol-sar.band.teetotalers
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Teetotalers
  effect: Lothern Sea Patrol members may never drink any alcohol, with the exception of Elf Wine.
  source:
    manual: broheim.net
    printed_page: 1
    section: Special Rules / Teetotalers
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Lothern%20Sea%20Patrol.pdf
  name_i18n:
    es: Abstemios
  effect_i18n:
    es: >-
      Los miembros de la Patrulla Marítima de Lothern nunca pueden beber alcohol, con la excepción
      del Vino Elfo.
  applies_to:
    band: true
- id: band--swabbies-lothern
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.lothern-sea-patrol-sar.band.swabbies-lothern
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Swabbies (Lothern Sea Patrol)
  effect: >-
    Lothern Sea Patrol may capture Swabbies. Willing members join the Ship's Company, unwilling
    members join the Raw Recruits.
  source:
    manual: broheim.net
    printed_page: 1
    section: Special Rules / Swabbies
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Lothern%20Sea%20Patrol.pdf
  name_i18n:
    es: Fregones (Patrulla de Lothern)
  effect_i18n:
    es: >-
      La Patrulla Marítima de Lothern puede capturar Fregones. Los voluntarios se unen a la Dotación
      del Barco; los que no, a los Reclutas Novatos.
  applies_to:
    band: true
- id: band--note-on-blackpowder
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.lothern-sea-patrol-sar.band.note-on-blackpowder
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: A Note on Blackpowder
  effect: >-
    Lothern Commodores have spent years watching the kingdoms of Man use Blackpowder weapons, and
    the feelings towards it vary from captain to captain. They do not start with access to
    Blackpowder of any kind, but there is no rule forbidding it. If you have an inquisitive hero
    with the Weapons Expert skill, he's allowed to use any powder weapon he finds.
  source:
    manual: broheim.net
    printed_page: 1
    section: Special Rules / A Note on Blackpowder
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Lothern%20Sea%20Patrol.pdf
  name_i18n:
    es: Nota sobre la Pólvora
  effect_i18n:
    es: >-
      Los Comodoros de Lothern llevan años viendo usar armas de pólvora a los reinos de los hombres,
      y los sentimientos al respecto varían de capitán a capitán. No empiezan con acceso a pólvora
      de ningún tipo, pero no hay regla que lo prohíba. Si tienes un héroe curioso con la habilidad
      Experto en Armas, puede usar cualquier arma de pólvora que encuentre.
  applies_to:
    band: true
- id: band--sea-patrol-skills
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.lothern-sea-patrol-sar.band.sea-patrol-skills
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Sea Patrol Skills
  effect: >-
    Graceful Strength: the Elf may use Double-Handed weapons without the usual penalty of striking
    last; work out order of battle as you would other weapons. Fey Quickness: an Elf with fey
    quickness can avoid close combat or missile attacks on a roll of 6; if the Elf also has Dodge or
    Step Aside, this increases to 4+ in the respective area. Swordmaster's Protégé: only available
    to Swordmasters; when armed with a double-handed weapon, the Swordmaster may parry as if armed
    with a sword and a buckler. Swift Fighter: the elf may make a Leadership Test at the end of any
    hand-to-hand combat phase (elf players or enemy's turn) if he is still in base contact with any
    enemy models; if he passes he may make a normal movement away from the enemy (he may not run or
    charge), without the enemy striking any blows at him; if he fails he remains in combat and must
    fight as normal in the following turn; if the Elf knows this skill AND the Pirate Skill
    'Swashbuckler', he may make one attempt to escape combat, rerolling once if he fails. Defending
    Guard: this warrior may parry blows made against any warrior within 1" of him, however he may
    only parry once per turn as normal; may not be used if he is stunned or knocked down.
    Infiltration: this skill is the exact same as the Skaven skill of the same name; may only be
    taken by Heroes with the Ranger Honour and promoted Sea Rangers.
  source:
    manual: broheim.net
    printed_page: 3
    section: Sea Patrol Skills
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Lothern%20Sea%20Patrol.pdf
  name_i18n:
    es: Habilidades de la Patrulla del Mar
  effect_i18n:
    es: >-
      Fuerza Grácil: el elfo puede usar armas a dos manos sin la penalización habitual de golpear en
      último lugar; resuelve el orden de combate como con otras armas. Celeridad Feérica: un elfo
      con celeridad feérica puede evitar el combate cuerpo a cuerpo o ataques de proyectiles con una
      tirada de 6; si además tiene Esquiva o Apartar el golpe, sube a 4+ en el ámbito respectivo.
      Protegido del Maestro de la Espada: solo para Maestros de la Espada; con arma a dos manos,
      puede detener golpes como si llevara espada y broquel. Luchador Veloz: el elfo puede hacer una
      tirada de Liderazgo al final de cualquier fase de combate cuerpo a cuerpo (turno del jugador
      elfo o del enemigo) si sigue en contacto con modelos enemigos; si la supera, puede alejarse
      con un movimiento normal (no puede correr ni cargar) sin que el enemigo le golpee; si falla,
      permanece en combate y debe pelear con normalidad en el siguiente turno; si el elfo conoce
      esta habilidad Y la habilidad pirata 'Bribón', puede intentar escapar una vez, repitiendo la
      tirada si falla. Guardia Defensiva: este guerrero puede detener los golpes dirigidos a
      cualquier guerrero a 1" o menos de él, pero solo puede detener una vez por turno como es
      normal; no puede usarse si está aturdido o derribado. Infiltración: esta habilidad es idéntica
      a la habilidad skaven del mismo nombre; solo puede elegirla héroes con el honor Guardabosques
      y Guardabosques del Mar promovidos.
  applies_to:
    band: true
- id: commodore--leader
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.lothern-sea-patrol-sar.commodore.leader
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Leader
  effect: >-
    Any elf within 6" of the Commodore may use his Leadership characteristic when taking any
    Leadership tests.
  source:
    manual: broheim.net
    printed_page: 3
    section: Heroes / 1 Commodore / Special Rules
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Lothern%20Sea%20Patrol.pdf
  name_i18n:
    es: Líder
  effect_i18n:
    es: >-
      Cualquier elfo a 6" o menos del Comodoro puede usar su característica de Liderazgo cuando
      realice cualquier tirada de Liderazgo.
  applies_to:
    profile_ids:
    - commodore
- id: mist-mage--wizard
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.lothern-sea-patrol-sar.mist-mage.wizard
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Wizard (Mist Mage)
  effect: >-
    The Mist Mage is a Wizard. He learns spells from the Spells of the Lothern Sea list: 1
    Divination of Shirath (Difficulty 6), 2 Shimmering Shield (Difficulty 7), 3 Statue of Light
    (Difficulty 7), 4 Mistress of the Deep (Difficulty 8), 5 Hunter's Fury (Difficulty 9), 6 Silent
    Guardian (Difficulty 9).
  source:
    manual: broheim.net
    printed_page: 3
    section: Heroes / 0-1 Mist Mage / Special Rules
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Lothern%20Sea%20Patrol.pdf
  name_i18n:
    es: Mago (Mago de la Niebla)
  effect_i18n:
    es: >-
      El Mago de la Niebla es un Mago. Aprende hechizos de la lista Hechizos del Mar de Lothern: 1
      Adivinación de Shirath (dificultad 6), 2 Escudo Reluciente (dificultad 7), 3 Estatua de Luz
      (dificultad 7), 4 Señora de las Profundidades (dificultad 8), 5 Furia del Cazador (dificultad
      9), 6 Guardián Silencioso (dificultad 9).
  applies_to:
    profile_ids:
    - mist-mage
- id: bossuns--disciplined
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.lothern-sea-patrol-sar.bossuns.disciplined
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Disciplined
  effect: Any warrior within 3" of a Bossun may use his/her leadership instead of their own.
  source:
    manual: broheim.net
    printed_page: 3
    section: Heroes / 0-2 Bossuns / Special Rules
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Lothern%20Sea%20Patrol.pdf
  name_i18n:
    es: Disciplinados
  effect_i18n:
    es: >-
      Cualquier guerrero a 3" o menos de un Contramaestre puede usar su Liderazgo en lugar del
      propio.
  applies_to:
    profile_ids:
    - bossuns
- id: seaguards--spear-master
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.lothern-sea-patrol-sar.seaguards.spear-master
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Spear Master (Seaguards)
  effect: >-
    In the first round of combat, when using a spear, a Seaguard adds +1 to his Strength and may
    reroll one failed roll to hit.
  source:
    manual: broheim.net
    printed_page: 4
    section: Henchmen / Seaguards / Special Rules
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Lothern%20Sea%20Patrol.pdf
  name_i18n:
    es: Maestro de la Lanza (Guardias del Mar)
  effect_i18n:
    es: >-
      En la primera ronda de combate, cuando usa una lanza, un Guardia del Mar suma +1 a su Fuerza y
      puede repetir una tirada para golpear fallida.
  applies_to:
    profile_ids:
    - seaguards
- id: sea-rangers--hide-in-shadows
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.lothern-sea-patrol-sar.sea-rangers.hide-in-shadows
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Hide in Shadows (Sea Rangers)
  effect: When trying to spot a Sea Ranger an opponent must halve his Initiative.
  source:
    manual: broheim.net
    printed_page: 4
    section: Henchmen / 0-5 Sea Rangers / Special Rules
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Lothern%20Sea%20Patrol.pdf
  name_i18n:
    es: Ocultarse en las Sombras (Guardabosques del Mar)
  effect_i18n:
    es: >-
      Cuando intenta descubrir a un Guardabosques del Mar, un oponente debe dividir a la mitad su
      Iniciativa.
  applies_to:
    profile_ids:
    - sea-rangers
- id: sea-rangers--hate-dark-elves
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.lothern-sea-patrol-sar.sea-rangers.hate-dark-elves
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Hate Dark Elves (Sea Rangers)
  effect: Sea Rangers hate Dark Elves.
  source:
    manual: broheim.net
    printed_page: 4
    section: Henchmen / 0-5 Sea Rangers / Special Rules
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Lothern%20Sea%20Patrol.pdf
  name_i18n:
    es: Odio a los Elfos Oscuros (Guardabosques del Mar)
  effect_i18n:
    es: Los Guardabosques del Mar odian a los Elfos Oscuros.
  applies_to:
    profile_ids:
    - sea-rangers
- id: raw-recruits--specially-hired
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.lothern-sea-patrol-sar.raw-recruits.specially-hired
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Specially Hired
  effect: >-
    You may hire Raw Recruits like normal, but you may also acquire them in the same manner as
    Swabbies.
  source:
    manual: broheim.net
    printed_page: 4
    section: Henchmen / 0-5 Raw Recruits / Special Rules
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Lothern%20Sea%20Patrol.pdf
  name_i18n:
    es: Contratación Especial
  effect_i18n:
    es: >-
      Puedes contratar Reclutas Novatos con normalidad, pero también adquirirlos de la misma manera
      que los Fregones.
  applies_to:
    profile_ids:
    - raw-recruits
- id: raw-recruits--never-gain-experience
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.lothern-sea-patrol-sar.raw-recruits.never-gain-experience
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Never Gain Experience (Raw Recruits)
  effect: >-
    Raw Recruits generally aren't interested in proving their worth to the crew, they are interested
    in survival and hopefully escape! Raw Recruits never gain experience in games.
  source:
    manual: broheim.net
    printed_page: 4
    section: Henchmen / 0-5 Raw Recruits / Special Rules
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Lothern%20Sea%20Patrol.pdf
  name_i18n:
    es: Nunca Ganarán Experiencia (Reclutas Novatos)
  effect_i18n:
    es: >-
      Los Reclutas Novatos no están interesados en demostrar su valor a la tripulación, ¡les
      interesa sobrevivir y escapar si pueden! Los Reclutas Novatos nunca ganan experiencia en las
      partidas.
  applies_to:
    profile_ids:
    - raw-recruits
- id: raw-recruits--rabble
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.lothern-sea-patrol-sar.raw-recruits.rabble
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Rabble (Raw Recruits)
  effect: >-
    Raw Recruits do not need to be armed all the same. Each may be given different equipment, but
    only items listed in the Raw Recruit equipment list. Raw Recruits can never use magic, or cast
    spells of any sort, no matter their original background or abilities.
  source:
    manual: broheim.net
    printed_page: 4
    section: Henchmen / 0-5 Raw Recruits / Special Rules
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Lothern%20Sea%20Patrol.pdf
  name_i18n:
    es: Chusma (Reclutas Novatos)
  effect_i18n:
    es: >-
      Los Reclutas Novatos no necesitan ir armados por igual. Cada uno puede llevar equipo distinto,
      pero solo objetos de la lista de equipo de Reclutas. Los Reclutas Novatos nunca pueden usar
      magia ni lanzar hechizos de ningún tipo, sin importar su origen o habilidades previas.
  applies_to:
    profile_ids:
    - raw-recruits
- id: raw-recruits--oh-dear-they-got-away
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.lothern-sea-patrol-sar.raw-recruits.oh-dear-they-got-away
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Oh Dear, They Got Away!
  effect: >-
    If the Sea Guard Warband itself Routs, any Raw Recruits who have already left the table in
    previous turns are presumed to have made a successful escape, and are never seen from again.
    Remove them from your warband roster as if they had been killed.
  source:
    manual: broheim.net
    printed_page: 4
    section: Henchmen / 0-5 Raw Recruits / Special Rules
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Lothern%20Sea%20Patrol.pdf
  name_i18n:
    es: ¡Vaya, Se Han Escapado!
  effect_i18n:
    es: >-
      Si la banda huye de la partida, se asume que los Reclutas Novatos que ya hayan salido de la
      mesa en turnos anteriores han escapado con éxito y no volverán a verse jamás. Retíralos de la
      lista de la banda como si hubieran muerto.
  applies_to:
    profile_ids:
    - raw-recruits
- id: raw-recruits--dont-mind-them
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.lothern-sea-patrol-sar.raw-recruits.dont-mind-them
      scope: 'NO'
