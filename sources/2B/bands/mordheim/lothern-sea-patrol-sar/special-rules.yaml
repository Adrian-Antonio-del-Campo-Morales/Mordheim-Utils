  name: Don't Mind Them, They Aren't True Elves!
  effect: >-
    The rest of the crew barely notice if any Raw Recruits run away or go Out of Action - they know
    they'll find them later on and give them 30 lashes if they're lucky! Any Raw Recruits who are
    running away or have been taken out of action do not count towards the need to take a Rout test
    for the warband.
