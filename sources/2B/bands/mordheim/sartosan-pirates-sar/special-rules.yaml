  name: Not Hired
  effect: Swabbies are not hired, they follow the special 'recruitment' rules above.
  source:
    manual: broheim.net
    printed_page: 5
    section: Henchmen / 0-5 Swabbies / Special Rules / Not Hired
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Human%20Pirates.pdf
  name_i18n:
    es: No Contratados
  effect_i18n:
    es: Los Fregones no se contratan; siguen las reglas especiales de 'reclutamiento' anteriores.
  applies_to:
    profile_ids:
    - swabbies
- id: swabbies--never-gain-experience
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.sartosan-pirates-sar.swabbies.never-gain-experience
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Never Gain Experience
  source:
    manual: broheim.net
    printed_page: 5
    section: Henchmen / 0-5 Swabbies / Special Rules / Never Gain Experience
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Human%20Pirates.pdf
  name_i18n:
    es: Nunca Ganan Experiencia
  applies_to:
    profile_ids:
    - swabbies
  rule_ref: shared-rule.never-gain-experience
- id: swabbies--rabble
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.sartosan-pirates-sar.swabbies.rabble
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Rabble
  effect: >-
    Swabbies do not need to be armed all the same. Each may be given different equipment, but only
    items listed in the Swabbie equipment list. Swabbies can never use magic, or cast spells of any
    sort, no matter their original background or abilities.
  source:
    manual: broheim.net
    printed_page: 5
    section: Henchmen / 0-5 Swabbies / Special Rules / Rabble
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Human%20Pirates.pdf
  name_i18n:
    es: Chusma
  effect_i18n:
    es: >-
      Los Fregones no necesitan ir armados todos igual. Cada uno puede recibir equipo distinto, pero
      solo objetos de la lista de equipo de Fregones. Los Fregones nunca pueden usar magia ni lanzar
      hechizos de ningún tipo, sin importar su origen o habilidades previas.
  applies_to:
    profile_ids:
    - swabbies
- id: swabbies--blimey-they-got-away
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.sartosan-pirates-sar.swabbies.blimey-they-got-away
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Blimey, They Got Away!
  effect: >-
    If the Pirate Warband itself Routs, any Swabbies who have already left the table in previous
    turns are presumed to have made a successful escape, and are never seen from again. Remove them
    from your warband roster as if they had been killed.
  source:
    manual: broheim.net
    printed_page: 5
    section: Henchmen / 0-5 Swabbies / Special Rules / Blimey they got away
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Human%20Pirates.pdf
  name_i18n:
    es: ¡Carajo, Se Han Escapado!
  effect_i18n:
    es: >-
      Si la Banda Pirata Huye, cualquier Fregón que ya haya abandonado la mesa en turnos anteriores
      se da por escapado con éxito, y nunca más se le verá. Retíralos de la lista de la banda como
      si hubieran muerto.
  applies_to:
    profile_ids:
    - swabbies
- id: swabbies--dont-mind-them-mates
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.sartosan-pirates-sar.swabbies.dont-mind-them-mates
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Don't Mind Them Mates, They Ain't True Pirates!
  effect: >-
    The rest of the crew barely notice if any Swabbies run away or go Out of Action - they know
    they'll find them later on and give them 30 lashes if they're lucky! Any Swabbies who are
    running away or have been taken out of action do not count towards the need to take a Rout test
    for the warband.
  source:
    manual: broheim.net
    printed_page: 5
    section: Henchmen / 0-5 Swabbies / Special Rules / Don't mind them mates
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Human%20Pirates.pdf
  name_i18n:
    es: No Les Hagas Caso, ¡No Son Verdaderos Piratas!
  effect_i18n:
    es: >-
      El resto de la tripulación apenas nota si algún Fregón huye o queda Fuera de Combate: ¡saben
      que los encontrarán más tarde y les darán 30 latigazos si tienen suerte! Cualquier Fregón que
      esté huyendo o haya sido dejado fuera de combate no cuenta para la necesidad de hacer un
      chequeo de Huida de la banda.
  applies_to:
    profile_ids:
    - swabbies
