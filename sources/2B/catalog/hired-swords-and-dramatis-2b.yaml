      note above about replacing a starting Hero).
    note_i18n:
      es: >-
        Cualquier banda humana, elfa o enana puede contratar a un Sacerdote Marinero de Manann
        (o Olovald). Los seguidores del Caos, los orcos y goblins, los elfos oscuros, los skaven
        y los no muertos no pueden contratar sacerdotes salvo que se indique lo contrario en
        otro lugar; solo un sacerdote por banda; el sacerdote cuenta como héroe (véase la nota
        de errata del capítulo sobre sustituir a un héroe inicial).
