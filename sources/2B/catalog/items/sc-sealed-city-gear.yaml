schema_version: 2
ruleset: mordheim
items:
- id: black_marketeer
  kind: out-of-scope
  name: Black Marketeer
  name_i18n:
    es: Mercader Negro
  effect: >-
    Underground contact of the Silent Brotherhood. Availability: Rare 6, Silent Brotherhood only.
    Bribery: D6 gold crowns. Benefit: you may roll on the Merchant hired sword's Black Market table
    and buy the found goods. 20+D6 gold crowns.
  effect_i18n:
    es: >-
      Contacto del Bajo Mundo de la Hermandad Silenciosa. Disponibilidad: Rara 6, solo Hermandad
      Silenciosa. Soborno: 1D6 coronas de oro. Beneficio: puedes tirar en la tabla del Mercado Negro
      de la espada a sueldo Mercader y comprar los objetos encontrados. 20+1D6 coronas de oro.
  source_refs:
  - manual: broheim.net
    printed_page: 6
    section: Underground Contacts / Black-marketeer
    url: https://broheim.net/downloads/warbands/supplement/sealedcity/Silent%20Brotherhood.pdf
  combat_status: out_of_scope
- id: fence
  kind: out-of-scope
  name: Fence
  name_i18n:
    es: Receptor
  effect: >-
    Underground contact of the Silent Brotherhood. Availability: Rare 6, Silent Brotherhood only.
    Bribery: none. Benefit: the fence may sell a rare item that has been stored during the preceding
    battle; this must be done before Heroes of either warband search for rare items. Roll a D6 to
    determine how many gold coins the fence would get for the item: 1-3 half the item's basic price;
    4-5 the item's full basic price; 6 full price plus half the item's basic price. 30+D6 gold
    crowns.
  effect_i18n:
    es: >-
      Contacto del Bajo Mundo de la Hermandad Silenciosa. Disponibilidad: Rara 6, solo Hermandad
      Silenciosa. Soborno: ninguno. Beneficio: el Receptor puede vender un objeto raro que se haya
      guardado durante la batalla anterior; esto debe hacerse antes de que los Héroes de cualquiera de
      las dos bandas busquen objetos raros. Tira 1D6 para determinar cuántas monedas de oro obtendría
      el Receptor por el objeto: 1-3 la mitad del precio básico del objeto; 4-5 el precio básico
      completo del objeto; 6 el precio completo más la mitad del precio básico del objeto. 30+1D6
      coronas de oro.
  source_refs:
  - manual: broheim.net
    printed_page: 6
    section: Underground Contacts / Fence
    url: https://broheim.net/downloads/warbands/supplement/sealedcity/Silent%20Brotherhood.pdf
  combat_status: out_of_scope
- id: rumour_monger
  kind: out-of-scope
  name: Rumour-Monger
  name_i18n:
    es: Correo de Rumores
  effect: >-
    Underground contact of the Silent Brotherhood. Availability: Rare 6, Silent Brotherhood only.
    Bribery: 2D6 gold crowns. Benefit: with some whispers in the right ears, the rumour-monger may
    either praise or denounce a single warband in the campaign; the next time that warband's heroes
    search for rare items they get +1 or -1 on all rarity rolls according to the rumour-monger's
    wishes. 30+2D6 gold crowns.
  effect_i18n:
    es: >-
      Contacto del Bajo Mundo de la Hermandad Silenciosa. Disponibilidad: Rara 6, solo Hermandad
      Silenciosa. Soborno: 2D6 coronas de oro. Beneficio: con unos cuantos susurros en los oídos
      adecuados, el Correo de Rumores puede alabar o denunciar a una única banda de la campaña; la
      próxima vez que los héroes de esa banda busquen objetos raros, obtendrán +1 o -1 en todas las
      tiradas de rareza, según los deseos del Correo de Rumores. 30+2D6 coronas de oro.
  source_refs:
  - manual: broheim.net
    printed_page: 6
    section: Underground Contacts / Rumour-monger
    url: https://broheim.net/downloads/warbands/supplement/sealedcity/Silent%20Brotherhood.pdf
  combat_status: out_of_scope
- id: spy
  kind: out-of-scope
  name: Spy
  name_i18n:
    es: Espía
  effect: >-
    Underground contact of the Silent Brotherhood. Availability: Rare 7, Silent Brotherhood only.
    Bribery: 3D6 gold crowns. Benefit: the spy provides vital information on the Brotherhood's
    enemies, which allows them to outmanoeuvre the foes; after all models from both sides are
    deployed in your next game you may re-position up to D3 warriors (friend or foe) according to
    the scenario's normal deployment restrictions. 30+D6 gold crowns.
  effect_i18n:
    es: >-
      Contacto del Bajo Mundo de la Hermandad Silenciosa. Disponibilidad: Rara 7, solo Hermandad
      Silenciosa. Soborno: 3D6 coronas de oro. Beneficio: el Espía aporta información vital sobre los
      enemigos de la Hermandad, lo que les permite superar en maniobra a sus adversarios; después de
      que todos los modelos de ambos bandos se desplieguen en tu siguiente partida, puedes recolocar
      hasta 1D3 guerreros (amigos o enemigos) según las restricciones normales de despliegue del
      escenario. 30+1D6 coronas de oro.
  source_refs:
  - manual: broheim.net
    printed_page: 6
    section: Underground Contacts / Spy
    url: https://broheim.net/downloads/warbands/supplement/sealedcity/Silent%20Brotherhood.pdf
  combat_status: out_of_scope
- id: thief
  kind: out-of-scope
  name: Thief
  name_i18n:
    es: Ladrón
  effect: >-
    Underground contact of the Silent Brotherhood. Availability: Rare 5, Silent Brotherhood only.
    Bribery: half the stolen item's basic price. Benefit: a Thief may attempt to steal one item.
    Choose any item; if it is a common item the Thief successfully steals it on a 2+ on a D6; rare
    items are successfully stolen by rolling higher than the availability number on 2D6. Any items
    stolen may be used in exactly the same way as one that was bought. If the Thief fails, roll a
    D6: on 1-5 the thief is chased out of the trading post and escapes. 25+D6 gold crowns.
  effect_i18n:
    es: >-
      Contacto del Bajo Mundo de la Hermandad Silenciosa. Disponibilidad: Rara 5, solo Hermandad
      Silenciosa. Soborno: la mitad del precio básico del objeto robado. Beneficio: un Ladrón puede
      intentar robar un objeto. Elige cualquier objeto; si es un objeto común, el Ladrón lo roba con
      éxito con un 2+ en 1D6; los objetos raros se roban con éxito sacando en 2D6 un resultado mayor
      que el número de disponibilidad. Cualquier objeto robado puede usarse exactamente igual que uno
      comprado. Si el Ladrón falla, tira 1D6: con 1-5 el ladrón es expulsado del mercado y escapa.
      25+1D6 coronas de oro.
  source_refs:
  - manual: broheim.net
    printed_page: 6
    section: Underground Contacts / Thief
    url: https://broheim.net/downloads/warbands/supplement/sealedcity/Silent%20Brotherhood.pdf
  combat_status: out_of_scope
- id: long_daggers
  kind: close-combat-weapon
  name: Long Daggers
  name_i18n:
    es: Dagas Largas
  effect: >-
    These daggers are stuck somewhere between dagger and sword, combining concealment with
    flexibility. They are even sturdy enough to parry enemy blows with a cross block. Range: Close
    Combat; Strength: as user; special rules: pair, parry. Pair: long daggers are traditionally used
    in pairs, one in each hand; a warrior armed with long daggers gets an additional attack for
    using two weapons. Parry: a warrior armed with long daggers may parry blows in the same way as a
    model armed with a sword. 10 gc, Rare 6, Silent Brotherhood only.
  effect_i18n:
    es: >-
      Estas dagas están a medio camino entre la daga y la espada, y combinan el ocultamiento con la
      versatilidad. Son incluso lo bastante robustas para detener golpes enemigos con un cruce.
      Alcance: cuerpo a cuerpo; Fuerza: la del usuario; reglas especiales: pareja, parada. Pareja: las
      dagas largas se usan tradicionalmente por parejas, una en cada mano; un guerrero armado con
      dagas largas obtiene un ataque adicional por usar dos armas. Parada: un guerrero armado con
      dagas largas puede detener golpes igual que un modelo armado con una espada. 10 gc, Rara 6, solo
      Hermandad Silenciosa.
  source_refs:
  - manual: broheim.net
    printed_page: 3
    section: Special equipment / Long daggers
    url: https://broheim.net/downloads/warbands/supplement/sealedcity/Silent%20Brotherhood.pdf
  mechanic_id: weapon.long-daggers
  combat_status: implemented
- id: clockwork_pistol
  kind: ranged-weapon
  name: Clockwork Pistol
  name_i18n:
    es: Pistola de Cuerda
  effect: >-
    Spring-and-mainspring driven pistol built in Bramstetter's workshops; listed under Missile
    Weapons in both the Heroes and Handymen equipment lists (Handymen list identical). 25 gc.
  effect_i18n:
    es: >-
      Pistola accionada por resorte y muelle real, fabricada en los talleres de Bramstetter; aparece
      en la sección Armas de Misil tanto de la lista de equipo de Héroes como de la de Braceros (la lista
      de Braceros es idéntica). 25 gc.
  source_refs:
  - manual: broheim.net
    printed_page: 2
    section: Clockworkers Heroes equipment list / Clockwork pistol
    url: https://broheim.net/downloads/warbands/supplement/sealedcity/Clockworkers.pdf
  combat_status: out_of_scope
- id: clockwork_rifle
  kind: ranged-weapon
  name: Clockwork Rifle
  name_i18n:
    es: Rifle de Cuerda
  effect: >-
    Two-slot equipment (occupies both equipment slots of a construct or counts as two-handed for
    heroes); Master of Clocks and Dwarf engineer only in the Heroes list. 40 gc.
  effect_i18n:
    es: >-
      Equipo de dos ranuras (ocupa ambas ranuras de equipo de una construcción o cuenta como a dos
      manos para los héroes); solo Maestro de los Relojes e ingeniero enano en la lista de Héroes. 40
      gc.
  source_refs:
  - manual: broheim.net
    printed_page: 2
    section: Clockworkers Heroes equipment list / Clockwork rifle
    url: https://broheim.net/downloads/warbands/supplement/sealedcity/Clockworkers.pdf
  combat_status: out_of_scope
- id: orichalcum_token
  kind: combat-equipment
  name: Orichalcum Token
  name_i18n:
    es: Ficha de Oricalco
  effect: >-
    Moonstone infusion: the hero may temporarily enhance the power supply of a clockwork construct
    with some orichalcum tokens; before the game you may increase any characteristic besides
    Toughness and Wounds of a single construct by 1 per used token. Each characteristic may be
    increased only once and lasts for a single game. 10 gc.
  effect_i18n:
    es: >-
      Infusión de piedra lunar: el héroe puede mejorar temporalmente la fuente de energía de una
      construcción de relojería con algunas fichas de oricalco; antes de la partida puedes aumentar en
      1, por cada ficha usada, cualquier característica excepto Resistencia y Heridas de una única
      construcción. Cada característica solo puede aumentarse una vez y el aumento dura una única
      partida. 10 gc.
  source_refs:
  - manual: broheim.net
    printed_page: 2
    section: Clockworkers Miscellaneous Equipment / Orichalcum token
    url: https://broheim.net/downloads/warbands/supplement/sealedcity/Clockworkers.pdf
  combat_status: out_of_scope
- id: bramstetters_advanced_construct_thesis
  kind: combat-equipment
  name: Bramstetter's Advanced Construct Thesis
  name_i18n:
    es: Tesis de Construcciones Avanzadas de Bramstetter
  effect: >-
    This heavy manuscript contains all of Bramstetter's theoretical thoughts about clockwork
    constructs. Reference work: a Clockworker with one of these transcripts can add +1 to the score
    when determining whether he can activate a Law of Construction successfully or not. 100 + D6x10
    gold crowns, Rare 8, Clockworkers only.
  effect_i18n:
    es: >-
      Este pesado manuscrito contiene todos los pensamientos teóricos de Bramstetter sobre las
      construcciones de relojería. Obra de referencia: un Relojero que posea una de estas
      transcripciones puede sumar +1 a la puntuación al determinar si activa con éxito una Ley de
      Construcción. 100 + 1D6x10 coronas de oro, Rara 8, solo Relojeros.
  source_refs:
  - manual: broheim.net
    printed_page: 5
    section: Special equipment / Bramstetter's advanced construct thesis
    url: https://broheim.net/downloads/warbands/supplement/sealedcity/Clockworkers.pdf
  combat_status: out_of_scope
- id: house_guard_plate_armour
  kind: armour
  name: Plate Armour
  name_i18n:
    es: Armadura de Placas
  effect: >-
    Full plate harness as listed in the House Guard armour section (Heroes list B; also offered in
    the second equipment list on printed page 5). Provides a 3+ basic armour save per the standard
    Mordheim plate armour profile. 55 gc. NOTE: generic plate armour already exists in the core
    trading post of the source rulebook; this entry preserves the House Guard list price — at
    promotion consider re-pointing to the KB's existing plate armour if present.
  effect_i18n:
    es: >-
      Arnés de placas completo, tal y como aparece en la sección de armadura de la Guardia de la Casa
      (lista de Héroes B; también se ofrece en la segunda lista de equipo de la página impresa 5).
      Otorga una salvación de armadura básica de 3+ según el perfil estándar de armadura de placas de
      Mordheim. 55 gc. NOTA: la armadura de placas genérica ya existe en el mercado central del libro
      de reglas de la fuente; esta entrada conserva el precio de la lista de la Guardia de la Casa; al
      promover, considera reorientarla a la armadura de placas ya existente en la KB si está presente.
  source_refs:
  - manual: broheim.net
    printed_page: 3
    section: House Guard Armour / Plate armour
    url: https://broheim.net/downloads/warbands/supplement/sealedcity/House%20Guard.pdf
  - manual: broheim.net
    printed_page: 5
    section: House Guard second equipment list / Plate armour
    url: https://broheim.net/downloads/warbands/supplement/sealedcity/House%20Guard.pdf
  combat_status: out_of_scope
- id: shock_rod
  kind: close-combat-weapon
  name: Shock Rod
  name_i18n:
    es: Vara de Descargas
  effect: >-
    Another tool of the trade to contain mutated and captured things, with its unnerving electric
    crackling. Range: Close Combat; Strength: as user; special rules: first strike, shock,
    two-handed. Shock: the rod's top crackles with electricity able to overload the victim's nerve
    system, sending them unconscious or flinching in the dirt; when using a shock rod, a roll of 1-4
    is treated as stunned when rolling to see the extent of a model's injuries. 15 gc (description)
    vs 10 gc (Clan Pristekk equipment list) — preserving the source discrepancy. Rare 6, Clan
    Pristekk only.
  effect_i18n:
    es: >-
      Otra útil herramienta del oficio para contener criaturas mutadas y capturadas, con su
      inquietante crepitar eléctrico. Alcance: cuerpo a cuerpo; Fuerza: la del usuario; reglas
      especiales: Golpe primero, Descarga, a dos manos. Descarga: la punta de la vara crepita con
      electricidad capaz de sobrecargar el sistema nervioso de la víctima, dejándola inconsciente o
      arrastrándose por el suelo; al usar una vara de descargas, un resultado de 1-4 se trata como
      aturdido al tirar para ver el alcance de las heridas de un modelo. 15 gc (descripción) frente a
      10 gc (lista de equipo del Clan Pristekk) — se conserva la discrepancia de la fuente. Rara 6,
      solo Clan Pristekk.
  source_refs:
  - manual: broheim.net
    printed_page: 4
    section: Special equipment / Shock rod
    url: https://broheim.net/downloads/warbands/supplement/sealedcity/Clan%20Pristekk.pdf
  - manual: broheim.net
    printed_page: 2
    section: Clan Pristekk equipment list / Shock rod
    url: https://broheim.net/downloads/warbands/supplement/sealedcity/Clan%20Pristekk.pdf
  mechanic_id: weapon.shock-rod
  combat_status: implemented
- id: thing_catcher
  kind: close-combat-weapon
  name: Thing Catcher
  name_i18n:
    es: Cazacosas
  effect: >-
    Used to put down their precious prey; thingcatchers often resemble oversized mancatchers and
    sometimes just a long stick with a wire snare on one end. Range: Close Combat; Strength: as
    user; special rules: two-handed, capture. Capture: a model taken out of action by a
    Thing-catcher becomes captured; do not roll for Serious Injuries. Only animals and large models,
    such as Ogres and Duskcats, may be captured this way. 25 gc, Rare 9, Clan Pristekk only.
  effect_i18n:
    es: >-
      Se usa para abatir a su preciada presa; los cazacosas suelen parecerse a capturadores
      sobredimensionados y, a veces, a un simple palo largo con un lazo de alambre en un extremo.
      Alcance: cuerpo a cuerpo; Fuerza: la del usuario; reglas especiales: a dos manos, Captura.
      Captura: un modelo dejado fuera de combate por un Cazacosas queda capturado; no tires por
      Heridas Graves. Solo pueden capturarse así animales y modelos grandes, como Ogros y Gatos del
      Crepúsculo. 25 gc, Rara 9, solo Clan Pristekk.
  source_refs:
  - manual: broheim.net
    printed_page: 4
    section: Special equipment / Thing-catcher
    url: https://broheim.net/downloads/warbands/supplement/sealedcity/Clan%20Pristekk.pdf
  combat_status: out_of_scope
- id: thinglash
  kind: close-combat-weapon
  name: Thinglash
  name_i18n:
    es: Latigocosas
  effect: >-
    Every Packmaster uses the whip to ensure that his protégés go after the enemy and not
    accidentally after him. Range: Close Combat; Strength: as user +1; special rules: +1 enemy
    armour save, whipcrack, cannot be parried, infuriate. +1 Enemy armour save: an enemy wounded by
    a thinglash gains a +1 bonus to his armour save, and a 6+ armour save if he has none normally.
    Cannot be parried: the thinglash is a flexible weapon and the Packmasters use it with great
    expertise; attempts to parry its strikes are futile. Whipcrack: when the wielder charges they
    gain +1A for that turn; when the wielder is charged they gain +1A that they may only use against
    the charger, striking first. Infuriate: Giant Rats, Rat Ogres and Things within 4" hate all
    enemy warriors. 10 gc, common, Clan Pristekk only.
  effect_i18n:
    es: >-
      Todos los Packmasters usan el látigo para asegurarse de que sus pupilos van tras el enemigo y
      no, por accidente, tras él. Alcance: cuerpo a cuerpo; Fuerza: la del usuario +1; reglas
      especiales: +1 a la salvación de armadura del enemigo, Whipcrack, no puede detenerse, Enfurecer.
      +1 a la salvación de armadura del enemigo: un enemigo herido por un latigocosas obtiene un
      bonificador de +1 a su salvación de armadura, y una salvación de armadura de 6+ si normalmente
      no tiene ninguna. No puede detenerse: el latigocosas es un arma flexible y los Packmasters la
      usan con gran maestría; los intentos de detener sus golpes son inútiles. Whipcrack: cuando el
      portador carga, gana +1 A ese turno; cuando el portador es cargado, gana +1 A que solo puede
      usar contra quien le carga, golpeando primero. Enfurecer: las Ratas Gigantes, los Ogros Rata y
      las Cosas a 4" odian a todos los guerreros enemigos. 10 gc, común, solo Clan Pristekk.
  source_refs:
  - manual: broheim.net
    printed_page: 4
    section: Special equipment / Thinglash
    url: https://broheim.net/downloads/warbands/supplement/sealedcity/Clan%20Pristekk.pdf
  combat_status: out_of_scope
