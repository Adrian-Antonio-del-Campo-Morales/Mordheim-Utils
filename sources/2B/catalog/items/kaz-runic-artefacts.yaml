schema_version: 2
ruleset: mordheim
# Karak Azgal Runic Artefacts Table (Broheim anthology, p. 70-71).
#
# Uniques: in a campaign none of these items can appear more than once; if a runic
# item that is already in someone else's possession is found, roll again — even if
# the warrior carrying it has been killed. Modeled with "unique: true".
#
# These are found only via the KAZ exploration chart (roll a D6 when an exploration
# result indicates a runic artefact); they are never bought, so they carry no price
# and are marked combat_status: out_of_scope until the magic-item runtime lands.
items:
- id: runic_builders_boots
  kind: out-of-scope
  name: Builder's Boots
  name_i18n:
    es: Botas del Constructor
  effect: >-
    Whilst runes are commonly inscribed on weapons or armour they are much less common on other
    items. These boots are therefore a very rare item. They are said to have been made for one of
    the engineers who built part of the stronghold in forgotten times. A model wearing these boots
    may move normally (including running, charging, etc) on any kind of terrain, including vertical
    surfaces. When moving the model simply adds the distances moved horizontally to that moved
    vertically, with no initiative test needed (except to jump across gaps).
  effect_i18n:
    es: >-
      Aunque las runas suelen grabarse en armas o armaduras, son mucho menos comunes en otros
      objetos, por lo que estas botas son un objeto muy raro. Se dice que fueron fabricadas para uno
      de los ingenieros que construyó parte del bastión en tiempos olvidados. Una miniatura que las
      lleve puede moverse con normalidad (incluyendo correr, cargar, etc.) sobre cualquier tipo de
      terreno, incluidas superficies verticales: simplemente suma las distancias recorridas en
      horizontal a las recorridas en vertical, sin necesitar tirada de Iniciativa (salvo para saltar
      huecos).
  source_refs:
  - manual: broheim.net
    printed_page: 70
    section: Runic Artefacts Table / Builder's Boots
    url: https://broheim.net/downloads/campaigns/karakazgal/Karak Azgal.pdf
  combat_status: out_of_scope
- id: runic_sword_of_snorri_elfbane
  kind: close-combat-weapon
  name: Sword of Snorri Elfbane
  name_i18n:
    es: Espada de Snorri Azote de Elfos
  effect: >-
    The Rune of Slaying is a potent rune, which adds to the killing power of a blade. It has
    obviously been worn by generations of Dwarf thanes. Opponents wounded by the sword are stunned
    on a result of 1-3 (Undead are knocked down as normal) and put out of action on a 4-6.
  effect_i18n:
    es: >-
      La Runa de Matanza es una runa poderosa que aumenta el poder letal de una hoja; obviamente ha
      sido portada por generaciones de thanes enanos. Los rivales heridos por la espada quedan
      aturdidos con un resultado de 1-3 (los No Muertos caen derribados como de costumbre) y Fuera
      de combate con un 4-6.
  source_refs:
  - manual: broheim.net
    printed_page: 70
    section: Runic Artefacts Table / Sword of Snorri Elfbane
    url: https://broheim.net/downloads/campaigns/karakazgal/Karak Azgal.pdf
  combat_status: out_of_scope
- id: runic_attlas_plate_mail
  kind: armour
  name: Att'la's Plate Mail
  name_i18n:
    es: Coraza de Placas de Att'la
  effect: >-
    This armour was given as a present by the Dwarf Lord Kurgan to the warlord Att'la in the time of
    Sigmar Heldenhammer. A magnificent suit of gromril armour with the following three runes
    inscribed on it: Rune of spell eating: The Hero wearing this armour is immune to all spells.
    Rune of passage: The Hero wearing this armour can move through solid objects like walls, but not
    tunnel walls (this does not mean that he can see through them). Rune of Fortitude: The Hero has
    an extra wound. Note that this can take his total wounds above his race's maximum.
  effect_i18n:
    es: >-
      Esta armadura fue un regalo del Señor enano Kurgan al señor de la guerra Att'la en tiempos de
      Sigmar Heldenhammer. Una magnífica armadura de gromril con las siguientes tres runas grabadas:
      Runa devorahechizos: el héroe que la lleva es inmune a todos los hechizos. Runa del paso: el
      héroe que la lleva puede atravesar objetos sólidos como muros, pero no paredes de túneles
      (esto no significa que pueda ver a través de ellos). Runa de Fortaleza: el héroe tiene una
      herida extra; nótese que esto puede llevar sus heridas totales por encima del máximo de su
      raza.
  source_refs:
  - manual: broheim.net
    printed_page: 70
    section: Runic Artefacts Table / Att'la's Plate Mail
    url: https://broheim.net/downloads/campaigns/karakazgal/Karak Azgal.pdf
  combat_status: out_of_scope
- id: runic_ulthars_bow_of_seeking
  kind: ranged-weapon
  name: Ulthar's Bow of Seeking
  name_i18n:
    es: Balsa Buscadora de Ulthar
  effect: >-
    The crossbow was made for Ulthar Grudgbringer, a noble of Karak Haskal. It is not known how it
    got here. A bolt shot from this bow will seek its target. It will always hit on a 2+
    irrespective of ballistic skill, cover or any other modifiers. The shooter may choose any target
    within sight and not just the nearest one.
  effect_i18n:
    es: >-
      La ballesta fue fabricada para Ulthar Portadordegravamen, un noble de Karak Haskal; no se sabe
      cómo llegó hasta aquí. Un virote disparado desde esta ballesta busca a su objetivo: siempre
      impacta con un 2+ independientemente de la Habilidad de Combate a Distancia, la cobertura o
      cualquier otro modificador. El disparador puede elegir cualquier objetivo a la vista, no solo
      el más cercano.
  source_refs:
  - manual: broheim.net
    printed_page: 70
    section: Runic Artefacts Table / Ulthar's Bow of Seeking
    url: https://broheim.net/downloads/campaigns/karakazgal/Karak Azgal.pdf
  combat_status: out_of_scope
- id: runic_redbeards_belt_of_rage
  kind: combat-equipment
  name: Redbeard's Belt of Rage
  name_i18n:
    es: Cinturón de Ira de Barbarroja
  effect: >-
    Made in the days of the War of the Beard, this talisman turns the wearer into a cruel and
    frightening warrior. It was only worn at times of great need. A warrior wearing this amulet
    becomes subject to and always will be frenzied even if he is knocked down or stunned. He also
    adds +1 to his strength in close combat, such is the power of his fury. The wearer never leaves
    close combat under any circumstances, and will attack opponents in base contact until they are
    taken out of action. If there are any stunned or knocked down models within the wearer's charge
    range at the beginning of his turn, he will charge and attack the closest one, even if they are
    members of his own warband! Fight the hand-to-hand combat until one of the warriors is taken out
    of action.
  effect_i18n:
    es: >-
      Fabricado en los días de la Guerra de la Barba, este talismán convierte a quien lo lleva en un
      guerrero cruel y temible; solo se portaba en tiempos de gran necesidad. El guerrero que lo
      lleva sufre frenesí y siempre lo sufrirá, aunque esté derribado o aturdido. También suma +1 a
      su Fuerza en el combate cuerpo a cuerpo, tal es el poder de su furia. El portador nunca
      abandona el combate cuerpo a cuerpo bajo ninguna circunstancia, y atacará a los rivales en
      contacto hasta que queden Fuera de combate. Si al comienzo de su turno hay miniaturas
      aturdidas o derribadas dentro de su distancia de carga, cargará contra la más cercana y la
      atacará, ¡aunque sea de su propia banda! Se pelea ese combate cuerpo a cuerpo hasta que uno de
      los dos guerreros quede Fuera de combate.
  source_refs:
  - manual: broheim.net
    printed_page: 70
    section: Runic Artefacts Table / Redbeard's Belt of Rage
    url: https://broheim.net/downloads/campaigns/karakazgal/Karak Azgal.pdf
  combat_status: out_of_scope
- id: runic_eye_of_izril
  kind: combat-equipment
  name: The Eye of Izril
  name_i18n:
    es: El Ojo de Izril
  effect: >-
    In the closed tunnels of a Dwarf stronghold it is a great advantage to be able to see what is
    happening elsewhere. A lord with this amulet could hold his power against the most secretive of
    enemies. The bearer of this amulet can see all models on the table top, even if they are hidden
    or out of sight. He can guide his fellow warband members through the ruins (this allows you to
    roll two dice for the bearer after battle when rolling on the exploration chart). The bearer
    also has a 6+ ward save against all shooting attacks and strikes in close combat, as he can
    sense the attacks before they are made. All animals (such as wardogs, horses, etc) will be
    affected by frenzy when fighting against the bearer of the amulet.
  effect_i18n:
    es: >-
      En los túneles cerrados de un bastión enano es una gran ventaja poder ver lo que ocurre en
      otros lugares; un señor con este amuleto podría mantener su poder frente a los enemigos más
      sigilosos. El portador de este amuleto puede ver todas las miniaturas de la mesa, aunque estén
      ocultas o fuera de la vista, y puede guiar a sus compañeros de banda a través de las ruinas
      (esto permite lanzar dos dados por el portador tras la batalla al tirar en la tabla de
      exploración). El portador también tiene una tirada de salvación especial de 6+ contra todos
      los ataques de disparo y golpea en el combate cuerpo a cuerpo, ya que percibe los ataques
      antes de que se produzcan. Todos los animales (como perros de guerra, caballos, etc.) sufrirán
      frenesí al luchar contra el portador del amuleto.
  source_refs:
  - manual: broheim.net
    printed_page: 71
    section: Runic Artefacts Table / The Eye of Izril
    url: https://broheim.net/downloads/campaigns/karakazgal/Karak Azgal.pdf
  combat_status: out_of_scope
