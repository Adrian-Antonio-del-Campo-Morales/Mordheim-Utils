items:
- id: rope_and_hook
  kind: combat-equipment
  name: Rope & Hook
  name_i18n:
    es: Cuerda y Gancho
  effect: >-
    Standard climbing gear of river folk: a coil of rope with a stout iron hook, used for boarding,
    salvage and getting in and out of portholes.
  rules: Standard equipment for climbing as detailed in the Mordheim rulebook.
  source_refs:
  - manual: broheim.net
    printed_page: 177
    section: Strigany Equipment List / Miscellaneous Equipment
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Channel
      Rats.pdf
  rarity: Common
  combat_status: out_of_scope
- id: wicker_man
  kind: out-of-scope
  name: Wicker Man
  name_i18n:
    es: Hombre de Mimbre
  effect: >-
    Golems follow the commands of a Petru. They can be fashioned using witchcraft from mud with
    wicker, driftwood, or (when available) flesh parts. They are lifeless constructs in the shape of
    a man. Retainers that never make excuses or ask for a fix. Profile: M4 WS2 BS0 S4 T4 W1 I1 A1
    Ld5.
  rules: 'Zombified: Golems use all of the special rules for a zombie; Cause fear,
    May Not Run, No Brain etc. Construct: A Wicker Man ignores any injury rolled on
    the Injury chart on the roll of a 4+ and continues fighting; not an armour save
    and so not modified by the Strength of the attack. This rule is ignored for wounds
    caused by magic or magic weapons.'
  source_refs:
  - manual: broheim.net
    printed_page: 178
    section: Strigany Special Equipment / Wicker Man
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Channel
      Rats.pdf
  rarity: Rare 12
  availability_note: 50 gc, Petru only.
  combat_status: out_of_scope
- id: scuttling_hand
  kind: out-of-scope
  name: Scuttling Hand
  name_i18n:
    es: Mano Reptante
  effect: >-
    A hand cut from a corpse of a murderer, called a 'Hand of Glory', is well known by warlocks for
    its magical properties. Vampires have perfected a way of reanimating these hands for use as
    assistants, attendants, and even familiars. They are only able of causing a paltry amount of
    damage in a fight but can be used as a distraction at a vital moment. Profile: M3 WS1 BS0 S1 T1
    W1 I4 A1 Ld7.
  rules: 'Immune to Psychology, Dodge, Scale Sheer Surfaces. Silent Move: Scuttling
    Hands always remain hidden unless they attack an enemy warrior.'
  source_refs:
  - manual: broheim.net
    printed_page: 178
    section: Strigany Special Equipment / Scuttling Hand
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Channel
      Rats.pdf
  rarity: Rare 11
  combat_status: out_of_scope
