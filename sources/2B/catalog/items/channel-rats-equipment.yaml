schema_version: 2
ruleset: mordheim
items:
- id: rope_and_hook
  kind: combat-equipment
  name: Rope & Hook
  name_i18n:
    es: Cuerda y Gancho
  effect: >-
    Standard climbing gear of river folk: a coil of rope with a stout iron hook, used for boarding,
    salvage and getting in and out of portholes. Standard equipment for climbing as detailed in the
    Mordheim rulebook.
  source_refs:
  - manual: broheim.net
    printed_page: 177
    section: Strigany Equipment List / Miscellaneous Equipment
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Channel
      Rats.pdf
  combat_status: out_of_scope
- id: wicker_man
  kind: out-of-scope
  name: Wicker Man
  name_i18n:
    es: Hombre de Mimbre
  effect: >-
    Golems follow the commands of a Petru. They can be fashioned using witchcraft from mud with
    wicker, driftwood, or (when available) flesh parts. They are lifeless constructs in the shape of
    a man. Retainers that never make excuses or ask for a fix. Profile: M4 WS2 BS0 S4 T4 W1 I1 A1
    Ld5. Zombified: Golems use all of the special rules for a zombie; Cause fear, May Not Run, No
    Brain etc. Construct: A Wicker Man ignores any injury rolled on the Injury chart on the roll of
    a 4+ and continues fighting; not an armour save and so not modified by the Strength of the
    attack. This rule is ignored for wounds caused by magic or magic weapons.
  effect_i18n:
    es: >-
      Los gólems obedecen las órdenes de un Petru. Pueden fabricarse con brujería a partir de barro
      con mimbre, madera a la deriva o (cuando hay disponible) partes de carne. Son construcciones sin
      vida con forma de hombre. Sirvientes que nunca ponen excusas ni piden una reparación. Perfil: M4
      WS2 BS0 S4 T4 W1 I1 A1 Ld5. Zombificado: los gólems usan todas las reglas especiales de un
      zombi; Causa miedo, No puede correr, Sin cerebro, etc. Construcción: un Hombre de Mimbre ignora
      cualquier herida obtenida en la tabla de Heridas con una tirada de 4+ y sigue luchando; no es
      una salvación de armadura, por lo que no la modifica la Fuerza del ataque. Esta regla se ignora
      para las heridas causadas por magia o por armas mágicas.
  source_refs:
  - manual: broheim.net
    printed_page: 178
    section: Strigany Special Equipment / Wicker Man
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Channel
      Rats.pdf
  combat_status: out_of_scope
- id: scuttling_hand
  kind: out-of-scope
  name: Scuttling Hand
  name_i18n:
    es: Mano Reptante
  effect: >-
    A hand cut from a corpse of a murderer, called a 'Hand of Glory', is well known by warlocks for
    its magical properties. Vampires have perfected a way of reanimating these hands for use as
    assistants, attendants, and even familiars. They are only able of causing a paltry amount of
    damage in a fight but can be used as a distraction at a vital moment. Profile: M3 WS1 BS0 S1 T1
    W1 I4 A1 Ld7. Immune to Psychology, Dodge, Scale Sheer Surfaces. Silent Move: Scuttling Hands
    always remain hidden unless they attack an enemy warrior.
  effect_i18n:
    es: >-
      Una mano cortada del cadáver de un asesino, llamada 'Mano de Gloria', es bien conocida por los
      brujos por sus propiedades mágicas. Los vampiros han perfeccionado una forma de reanimar estas
      manos para usarlas como ayudantes, sirvientes e incluso familiares. Solo son capaces de causar
      una mísera cantidad de daño en una pelea, pero pueden usarse como distracción en un momento
      vital. Perfil: M3 WS1 BS0 S1 T1 W1 I4 A1 Ld7. Inmune a la Psicología, Esquiva, Escalar
      Superficies. Movimiento Sigiloso: las Manos Reptantes permanecen siempre ocultas a menos que
      ataquen a un guerrero enemigo.
  source_refs:
  - manual: broheim.net
    printed_page: 178
    section: Strigany Special Equipment / Scuttling Hand
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Channel
      Rats.pdf
  combat_status: out_of_scope
