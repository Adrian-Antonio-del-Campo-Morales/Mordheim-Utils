schema_version: 2
ruleset: mordheim
items:
- id: warplock_pistol
  kind: ranged-weapon
  tags:
  - blackpowder
  name: Warplock Pistol
  name_i18n:
    es: Pistola Warplock
  effect: >-
    Skaven pistol fired with warpstone-charged powder. Range 6", Strength 4, save modifier -2.
    Prepare shot: a pistol takes a whole turn to reload, so you may only fire every other turn (a
    brace may fire every turn). Hand-to-hand: may be used in close combat; a model armed with a
    pistol and another close combat weapon gains +1 Attack resolved at Strength 4 with a -2 save
    modifier, usable once per combat. 35 gc (70 for a brace).
  effect_i18n:
    es: >-
      Pistola skaven disparada con pólvora cargada de piedra bruja. Alcance 6", Fuerza 4, modificador
      de salvación -2. Prepara el disparo: una pistola tarda un turno entero en recargarse, así que
      solo puedes disparar en turnos alternos (una pareja puede disparar cada turno). Cuerpo a cuerpo:
      puede usarse en combate cuerpo a cuerpo; un modelo armado con una pistola y otra arma de combate
      gana +1 Ataque resuelto a Fuerza 4 con un modificador de salvación de -2, utilizable una vez por
      combate. 35 gc (70 por una pareja).
  source_refs:
  - manual: broheim.net
    printed_page: 2
    section: Metal Mongers Equipment List / Warplock pistol
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Metal%20Mongers.pdf
  - manual: broheim.net
    printed_page: 10
    section: Clan Skryre Heroes equipment list (97RelicsoftheCrusadesPt2)
    url: https://broheim.net/downloads/fo/97RelicsoftheCrusadesPt2.pdf
  combat_status: out_of_scope
- id: warplock_rifle
  kind: ranged-weapon
  tags:
  - blackpowder
  name: Warplock Rifle
  name_i18n:
    es: Rifle Warplock
  effect: >-
    Counts as a Handgun. Range 24", Strength 4, save modifier -1, move or fire, unwieldy. Warp-lock
    rifles use the same unholy powder as the warplock pistol, but with longer barrels and greater
    accuracy. 35 gc.
  effect_i18n:
    es: >-
      Cuenta como un Arcabuz. Alcance 24", Fuerza 4, modificador de salvación -1, mover o disparar,
      poco manejable. Los rifles warplock usan la misma pólvora impía que la pistola warplock, pero
      con cañones más largos y mayor precisión. 35 gc.
  source_refs:
  - manual: broheim.net
    printed_page: 2
    section: Metal Mongers Equipment List / Warplock rifle (counts as Handgun)
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Metal%20Mongers.pdf
  combat_status: out_of_scope
- id: ratling_gun
  kind: ranged-weapon
  tags:
  - blackpowder
  name: Ratling Gun
  name_i18n:
    es: Ametralladora Ratling
  effect: >-
    X gc (Forge-Rats and Technicians only). Availability: Rare 14. Range 6"-16", Strength 3, save
    modifier -1, move or fire, unwieldy, jeopardous. Metal storm!: the ratling gun fires a great
    hail of bullets in a single devastating salvo; nominate the target then roll 2D6 — that is the
    number of shots, spread evenly between the target and another model within 6" (friend or foe),
    then roll to hit and wound as normal for each shot. Once fired it cannot be used for the rest of
    the game. Unwieldy: takes two models to carry; may not be fired with enemy models within 6" and
    you may never move and fire. Jeopardous: if a double is rolled for the number of shots the gun
    misfires (roll on the misfire chart). The list price in the Metal Mongers equipment list is 275
    gc — preserving the source discrepancy. 275 gc (list).
  effect_i18n:
    es: >-
      X gc (solo Ratas de Forja y Técnicos). Disponibilidad: Rara 14. Alcance 6"-16", Fuerza 3,
      modificador de salvación -1, mover o disparar, poco manejable, peligrosa. ¡Tormenta metálica!:
      la ametralladora ratling dispara un gran granizo de balas en una única salva devastadora;
      designa el objetivo y tira 2D6; ese es el número de disparos, repartidos a partes iguales entre
      el objetivo y otro modelo a 6" (amigo o enemigo); después tira para impactar y herir con
      normalidad por cada disparo. Una vez disparada, no puede volver a usarse en el resto de la
      partida. Poco manejable: se necesitan dos modelos para portarla; no puede dispararse si hay
      modelos enemigos a 6" y nunca puedes moverte y disparar. Peligrosa: si sale un doble en el
      número de disparos, el arma se encasquilla (tira en la tabla de encasquillamiento). El precio de
      lista en la lista de equipo de los Mercaderes de Metal es 275 gc — se conserva la discrepancia
      de la fuente. 275 gc (lista).
  source_refs:
  - manual: broheim.net
    printed_page: 2
    section: Metal Mongers Equipment List / Ratling gun
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Metal%20Mongers.pdf
  - manual: broheim.net
    printed_page: 6
    section: Ratling gun (description)
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Metal%20Mongers.pdf
  combat_status: out_of_scope
- id: gas_mask
  kind: armour
  name: Gas Mask
  name_i18n:
    es: Máscara de Gas
  effect: >-
    Protectively-coated visors crafted from leathery human skin, worn almost exclusively by the
    artificers of Clan Skryre. A skaven wearing the grisly mask receives a 3+ save against any gas
    or soporific-based attacks. Any non-skaven Hero wearing the stinky facial apparel receives a -1
    modifier to hit in close combat, shooting missiles or casting spells. (Turjuk/Clan Skryre REL
    text: a warrior wearing a gas mask is only affected by poison wind on a D6 roll of 6+; 5 dinars
    there.) 15 gc (Metal Mongers list).
  effect_i18n:
    es: >-
      Viseras con revestimiento protector confeccionadas con piel humana correosa, que llevan casi
      exclusivamente los artífices del Clan Skryre. Un skaven que lleve la máscara macabra recibe una
      salvación de 3+ contra cualquier ataque de gas o soporífero. Cualquier Héroe que no sea skaven y
      lleve tan apestoso ornamento facial recibe un modificador de -1 para impactar en combate cuerpo
      a cuerpo, al disparar proyectiles o al lanzar hechizos. (Texto REL de Turjuk/Clan Skryre: un
      guerrero que lleve una máscara de gas solo resulta afectado por viento envenenado con un
      resultado de 6+ en 1D6; 5 dinares allí.) 15 gc (lista de los Mercaderes de Metal).
  source_refs:
  - manual: broheim.net
    printed_page: 2
    section: Metal Mongers Miscellaneous / Gas mask
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Metal%20Mongers.pdf
  - manual: broheim.net
    printed_page: 5
    section: Clan Skryre special equipment / Gas mask (Relics of the Crusades Pt 2)
    url: https://broheim.net/downloads/fo/97RelicsoftheCrusadesPt2.pdf
  combat_status: out_of_scope
- id: pneumatic_arm
  kind: combat-equipment
  name: Pneumatic Arm
  name_i18n:
    es: Brazo Neumático
  effect: >-
    Pneumatic arms fastened to harnesses allow an Engineer Adept to wield weapons well beyond his
    strength; the wearer counts as having two extra arms. The harness may hold missile weapons with
    the Unwieldy trait (Ratling Gun, Warpfire Thrower etc.), the power of the arms ignoring the
    two-model requirement. Experimental Technology: weapons manufactured by Skryre Warp Engineers
    are prone to malfunction — on a roll of 1 to hit with any missile weapon, roll on the
    Experimental Weapon Chart; if the weapon malfunctions the hit is resolved against the firer on a
    4+. 140 gc (Engineer Adept only), Rare 13.
  effect_i18n:
    es: >-
      Los brazos neumáticos fijados a arneses permiten a un Adepto Ingeniero empuñar armas muy por
      encima de su fuerza; el portador cuenta como si tuviera dos brazos extra. El arnés puede portar
      armas de misil con el rasgo Poco manejable (Ametralladora Ratling, Lanzallamas warp, etc.), y la
      potencia de los brazos ignora el requisito de dos modelos. Tecnología Experimental: las armas
      fabricadas por los Ingenieros Warp de Skryre son propensas a funcionar mal; si sacas un 1 al
      impactar con cualquier arma de misil, tira en la tabla de Armas Experimentales; si el arma
      funciona mal, el impacto se resuelve contra el tirador con un 4+. 140 gc (solo Adepto
      Ingeniero), Rara 13.
  source_refs:
  - manual: broheim.net
    printed_page: 2
    section: Metal Mongers Miscellaneous / Pneumatic arm
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Metal%20Mongers.pdf
  combat_status: out_of_scope
- id: poison_wind_globe
  kind: ranged-weapon
  tags:
  - poison
  name: Poison Wind Globe
  name_i18n:
    es: Esfera de Viento Envenenado
  effect: >-
    Fragile spheres of glass filled with toxic warpstone-derived fumes produced by the insane
    Warlock Engineers. Range 6", Strength special, thrown weapon, poison wind, drop. Thrown weapon:
    models using poison wind globes do not suffer penalties for range or moving. Poison wind:
    obstacles do not affect the deadly gas; ignore cover penalties to hit; the globes ignore armour
    saves; a globe deals D3 wounds to the target on a 3+ and a single wound to anyone else within 2"
    on a 4+; the warpstone poison is magical so it also affects undead. Drop: on a roll of 1 to hit
    the globe is dropped — resolve a hit against the dropper; a model may voluntarily drop a globe
    on a model in base contact instead of using a weapon in close combat. 20 gc (Metal Mongers
    list); 15+D6 dinars each, Rare 6, Clan Skryre only (REL text).
  effect_i18n:
    es: >-
      Frágiles esferas de cristal rellenas de humos tóxicos derivados de la piedra bruja, producidas
      por los dementes Ingenieros Hechiceros. Alcance 6", Fuerza especial, arma arrojadiza, Viento
      envenenado, Caída. Arma arrojadiza: los modelos que usan esferas de viento envenenado no sufren
      penalizaciones por alcance ni por moverse. Viento envenenado: los obstáculos no afectan al gas
      letal; ignora las penalizaciones por cobertura al tirar para impactar; las esferas ignoran las
      salvaciones de armadura; una esfera causa 1D3 heridas al objetivo con un 3+ y una única herida a
      cualquier otro modelo a 2" con un 4+; el veneno de piedra bruja es mágico, por lo que también
      afecta a los no muertos. Caída: si sacas un 1 para impactar, la esfera se cae; resuelve un
      impacto contra quien la soltó; un modelo puede soltar voluntariamente una esfera sobre un modelo
      en contacto base en lugar de usar un arma en combate cuerpo a cuerpo. 20 gc (lista de los
      Mercaderes de Metal); 15+1D6 dinares cada una, Rara 6, solo Clan Skryre (texto REL).
  source_refs:
  - manual: broheim.net
    printed_page: 2
    section: Metal Mongers Missile Weapons / Poison wind globe
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Metal%20Mongers.pdf
  - manual: broheim.net
    printed_page: 6
    section: Clan Skryre special equipment / Poison wind globe (Relics of the Crusades Pt 2)
    url: https://broheim.net/downloads/fo/97RelicsoftheCrusadesPt2.pdf
  combat_status: out_of_scope
- id: spike_jawed_snatcher
  kind: close-combat-weapon
  name: Spike-Jawed Snatcher
  name_i18n:
    es: Capturador de Mandíbulas con Púas
  effect: >-
    Skaven-snatchers: semi-circular prongs mounted on pole-arms, ready to catch an enemy between the
    spike-jawed snapping steel claw. Popular among the Chaos Dwarfs, this non-lethal spring loaded
    mancatcher can ensnare the most violent of prisoners. Range: Close Combat; Strength: as user;
    special rules: capture, two-handed. Capture: a model taken out of action by a spike-jawed
    snatcher becomes captured unless the warband is routed; do not roll for Serious Injuries. Large
    models such as Ogres or Trolls cannot be captured this way, and neither can animals — roll for
    Serious Injuries as normal. 25 gc (Skaven only), Rare 10.
  effect_i18n:
    es: >-
      Capturadores skaven: púas semicirculares montadas sobre armas de asta, listas para atrapar a un
      enemigo entre la garra de acero dentada de mandíbulas con púas. Popular entre los Enanos del
      Caos, este capturador de resortes no letal puede atrapar al más violento de los prisioneros.
      Alcance: cuerpo a cuerpo; Fuerza: la del usuario; reglas especiales: Captura, a dos manos.
      Captura: un modelo dejado fuera de combate por un capturador de mandíbulas con púas queda
      capturado, a menos que la banda huya; no tires por Heridas Graves. Los modelos grandes, como
      Ogros o Trolls, no pueden capturarse así, y tampoco los animales; en esos casos, tira por
      Heridas Graves con normalidad. 25 gc (solo skaven), Rara 10.
  source_refs:
  - manual: broheim.net
    printed_page: 2
    section: Metal Mongers Hand-to-hand / Spike-jawed snatcher
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Metal%20Mongers.pdf
  combat_status: out_of_scope
- id: marienburg_map
  kind: combat-equipment
  name: Marienburg Map
  name_i18n:
    es: Mapa de Marienburgo
  effect: >-
    A detailed chart of the canals, wards and alleyways of Marienburg carried by the City Watch.
    Watchmen listed equipment; no separate special-rules paragraph is printed beyond the list entry.
    20 gc.
  effect_i18n:
    es: >-
      Una carta detallada de los canales, los distritos y los callejones de Marienburgo que lleva la
      Guardia Urbana. Equipo listado de los Guardias; no se imprime ningún párrafo de reglas
      especiales aparte de la entrada de la lista. 20 gc.
  source_refs:
  - manual: broheim.net
    printed_page: 3
    section: Watchmen Miscellaneous Equipment / Marienburg Map
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Watchmen.pdf
  combat_status: out_of_scope
- id: hunting_bird
  kind: out-of-scope
  name: Hunting Bird
  name_i18n:
    es: Ave de Cetrería
  effect: >-
    Special rules: Falconer. A good bird, trained almost from the egg, is a lethal pet: huge
    she-hawks and warhawks require jesses and a hood, but a well-trained bird does not take to the
    air until signalled. Hunting birds may only be used by a Hero with the animal handling skill
    'Falconer'. A well trained fighting falcon is fully capable of blinding an opponent. Hunting
    birds can be used as missile weapons and as weapons in hand-to-hand combat: range of the falcon
    24", roll to hit using the warrior's Ballistic Skill; in close combat falcons strike first with
    a single attack using the warrior's Weapon Skill, each successful attack inflicts a Strength 3
    hit. If the Hero is taken out of action the falcon flies away, returning after the battle.
    Falcons cannot be attacked or slain, but if the Hero is slain the falcons are lost. A warrior
    must wear a falconry glove, otherwise roll on the Serious Injury chart in the post battle
    sequence; a falconer may supervise only a single hunting bird. 25 gc, Rare 12 (Sergeants only).
  effect_i18n:
    es: >-
      Reglas especiales: Cetrero. Un pájaro bien adiestrado, casi desde el huevo, es una mascota
      letal: las enormes halconas y los halcones de guerra requieren correas y caperuza, pero un
      pájaro bien adiestrado no levanta el vuelo hasta que se le da la señal. Las aves de cetrería
      solo pueden ser usadas por un Héroe con la habilidad de trato con animales 'Cetrero'. Un halcón
      de caza bien adiestrado es perfectamente capaz de cegar a un oponente. Las aves de cetrería
      pueden usarse como armas de misil y como armas en combate cuerpo a cuerpo: alcance del halcón
      24", tira para impactar usando la Habilidad de Disparo del guerrero; en combate cuerpo a cuerpo
      los halcones golpean primero con un único ataque que usa la Habilidad de Armas del guerrero, y
      cada ataque exitoso inflige un impacto de Fuerza 3. Si el Héroe queda fuera de combate, el
      halcón se marcha volando y regresa tras la batalla. Los halcones no pueden ser atacados ni
      muertos, pero si el Héroe muere los halcones se pierden. Un guerrero debe llevar un guante de
      cetrería; de lo contrario tira en la tabla de Heridas Graves en la secuencia posterior a la
      batalla; un cetrero solo puede supervisar una única ave de cetrería. 25 gc, Rara 12 (solo
      Sargentos).
  source_refs:
  - manual: broheim.net
    printed_page: 3
    section: Watchmen Miscellaneous Equipment / Hunting bird
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Watchmen.pdf
  combat_status: out_of_scope
- id: falconry_glove
  kind: combat-equipment
  name: Falconry Glove
  name_i18n:
    es: Guante de Cetrería
  effect: >-
    A leather or mesh glove worn to protect the falconer's arm. A warrior using a hunting bird
    without a falconry glove must roll on the Serious Injury chart in the post battle sequence.
    (Sergeants only). 10 gc.
  effect_i18n:
    es: >-
      Guante de cuero o de malla que se lleva para proteger el brazo del cetrero. Un guerrero que use
      un ave de cetrería sin un guante de cetrería debe tirar en la tabla de Heridas Graves en la
      secuencia posterior a la batalla. (Solo Sargentos). 10 gc.
  source_refs:
  - manual: broheim.net
    printed_page: 3
    section: Watchmen Miscellaneous Equipment / Falconry glove
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Watchmen.pdf
  combat_status: out_of_scope
- id: watch_carriage
  kind: out-of-scope
  name: Watch Carriage / Stage Coach
  name_i18n:
    es: Carruaje de la Guardia / Coche de Línea
  effect: >-
    Black Caps: City Watch patrols may requisition one Watch Carriage with two horses before every
    battle. Listed as watch carriage/stage coach in the Watchmen miscellaneous equipment. 100 gc.
  effect_i18n:
    es: >-
      Gorras Negras: las patrullas de la Guardia Urbana pueden requisar un Carruaje de la Guardia con
      dos caballos antes de cada batalla. Aparece como carruaje de la guardia / coche de línea en el
      equipo misceláneo de los Guardias. 100 gc.
  source_refs:
  - manual: broheim.net
    printed_page: 3
    section: Watchmen Miscellaneous Equipment / Watch carriage/Stage coach
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Watchmen.pdf
  combat_status: out_of_scope
- id: wrench
  kind: close-combat-weapon
  name: Wrench
  name_i18n:
    es: Llave Inglesa
  effect: >-
    Heavy workshop wrench of the Metal Mongers' artificers. Counts as a club in close combat. 3 gc.
  effect_i18n:
    es: >-
      Llave inglesa pesada de taller, de los artífices de los Mercaderes de Metal. Cuenta como un
      garrote en combate cuerpo a cuerpo. 3 gc.
  source_refs:
  - manual: broheim.net
    printed_page: 2
    section: Metal Mongers Hand-to-hand Combat Weapons / Wrench (counts as club)
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Metal%20Mongers.pdf
  combat_status: out_of_scope
- id: wardog
  kind: out-of-scope
  name: Wardog
  name_i18n:
    es: Sabueso de Guerra
  effect: >-
    Watchmen equipment list entry (Sergeants may also use hunting birds with the Falconer skill).
    Fights exactly like a member of the warband but is treated as equipment of the Hero who bought
    it, counting towards rout tests in battle and as equipment for upkeep. 25 gc. NOTE: the active
    KB already contains this concept as `warhound` (out-of-scope.yaml) — at promotion, merge this
    entry into the KB warhound's source_refs instead of creating a duplicate row.
  source_refs:
  - manual: broheim.net
    printed_page: 3
    section: Watchmen Miscellaneous Equipment / Wardog
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Watchmen.pdf
  combat_status: out_of_scope
