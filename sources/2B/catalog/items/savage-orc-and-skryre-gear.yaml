- id: skull_busta
  kind: close-combat-weapon
  name: Skull Busta
  name_i18n:
    es: Reventacraneos
  effect: >-
    Huge hammers that can cause horrific wounds. On the first turn of any combat, the wielder gains
    +1 Strength and causes concussion as a normal hammer. In subsequent rounds of combat, a Skull
    Busta counts as a normal hammer. Skull Bustas are so huge that they may not be used while
    mounted, they may not be used by goblins and cannot be used in conjunction with any other
    weapons (but shields are allowed). Feelin' wobbly: when using a Skull Busta a roll of 2-4 is
    treated as stunned when rolling to see the extent of the model's injuries. Basha: warriors
    wearing a helmet only save vs stunning on a roll of a 6 when hit by a Skull Busta; Knight's
    helms (Crusading Knights warbands) only save on a 4+. 15 gc, Rare 6.
  effect_i18n:
    es: >-
      Enormes martillos capaces de causar heridas horribles. En el primer turno de cualquier combate,
      su portador gana +1 de Fuerza y causa conmoción como un martillo normal. En las rondas de
      combate siguientes, un Reventacraneos cuenta como un martillo normal. Los Reventacraneos son tan
      enormes que no pueden usarse montado, no pueden usarlos los goblins y no pueden usarse junto con
      ninguna otra arma (aunque se permiten escudos). Sentirse flojo: al usar un Reventacraneos, un
      resultado de 2-4 se trata como aturdido al tirar para ver el alcance de las heridas del modelo.
      Basha: los guerreros que lleven yelmo solo salvan contra el aturdimiento con un 6 cuando les
      golpea un Reventacraneos; los yelmos de caballero (bandas de Caballeros Cruzados) solo salvan
      con un 4+. 15 gc, Rara 6.
  source_refs:
  - manual: broheim.net
    printed_page: 59
    section: Special Equipment / Skull Busta
    url: https://broheim.net/downloads/campaigns/karakazgal/Karak Azgal.pdf
  combat_status: out_of_scope
- id: warpaint
  kind: combat-equipment
  name: Warpaint
  name_i18n:
    es: Pintura de Guerra
  effect: >-
    Some Savage Orcs decorate themselves with warpaint (either blue, red or white). While wearing
    the warpaint, the Orc believes that Mork protects him and he gains a 6+ invulnerable save. One
    use only. Also useable by Savage Goblin Boyz. 5 gc, Rare 6.
  effect_i18n:
    es: >-
      Algunos Orkos Salvajes se decoran con pintura de guerra (azul, roja o blanca). Mientras lleva la
      pintura de guerra, el Orko cree que Mork lo protege y obtiene una salvación invulnerable de 6+.
      Un solo uso. También pueden usarla los Goblins Salvajes Boyz. 5 gc, Rara 6.
  source_refs:
  - manual: broheim.net
    printed_page: 59
    section: Special Equipment / Warpaint
    url: https://broheim.net/downloads/campaigns/karakazgal/Karak Azgal.pdf
  combat_status: out_of_scope
- id: kumfy_gear
  kind: armour
  name: Kumfy Gear
  name_i18n:
    es: Ropa Acojinada
  effect: >-
    The Savage Orc name for clothing made from particularly thick, treated, animal skins. These
    skins bestow a 5+ armour save as well as a 5+ save against all fire-based and cold-based
    attacks. These skins are occasionally traded with other Orcs and so may be worn by any Orc
    warband. Kumfy Gear cannot be combined with Warpaint or light armour. 75 gc.
  effect_i18n:
    es: >-
      El nombre orko salvaje de la ropa hecha con pieles de animal especialmente gruesas y tratadas.
      Estas pieles otorgan una salvación de armadura de 5+, así como una salvación de 5+ contra todos
      los ataques basados en fuego y en frío. Estas pieles se comercian ocasionalmente con otros
      Orkos, por lo que puede llevarlas cualquier banda Orka. La Ropa Acojinada no puede combinarse
      con Pintura de Guerra ni con armadura ligera. 75 gc.
  source_refs:
  - manual: broheim.net
    printed_page: 59
    section: Special Equipment / Kumfy Gear
    url: https://broheim.net/downloads/campaigns/karakazgal/Karak Azgal.pdf
  combat_status: out_of_scope
- id: effigy_of_mork
  kind: combat-equipment
  name: Effigy of Mork
  name_i18n:
    es: Efigie de Mork
  effect: >-
    The Effigy of Mork allows the bearer to ignore the first hit against him in battle. In addition
    its presence allows a re-roll for the first Leadership test anyone in the warband has to make.
    If carried by Da Boss, the Effigy allows the first Rout test to be re-rolled, providing its
    powers had not already been used during the battle. A Savage Orc who carries an Effigy of Mork
    believes he is divinely protected and would never carry a Lucky Charm or Holy Relic. 30 gc, Rare
    7.
  effect_i18n:
    es: >-
      La Efigie de Mork permite a su portador ignorar el primer impacto que reciba en la batalla.
      Además, su presencia permite repetir la primera tirada de Liderazgo que tenga que hacer
      cualquier miembro de la banda. Si la lleva Da Boss, la Efigie permite repetir el primer chequeo
      de Huida, siempre que sus poderes no se hayan usado ya durante la batalla. Un Orko Salvaje que
      porte una Efigie de Mork cree estar protegido por los dioses y jamás llevaría un Amuleto de la
      Suerte ni una Reliquia Sagrada. 30 gc, Rara 7.
  source_refs:
  - manual: broheim.net
    printed_page: 59
    section: Special Equipment / Effigy of Mork
    url: https://broheim.net/downloads/campaigns/karakazgal/Karak Azgal.pdf
  combat_status: out_of_scope
- id: jezzail
  kind: ranged-weapon
  tags:
  - blackpowder
  name: Warplock Jezzail
  name_i18n:
    es: Jezzail Warplock
  effect: >-
    The warplock jezzail is a fiendish invention of the Skaven Clan Skryre. It is a huge and long
    ranged firearm, more like a small cannon than an ordinary gun. It fires a special missile made
    of warpstone. Range 36\", Strength 5, armour save modifier -3. Move or fire: you may not move
    and fire a jezzail in the same turn, other than to pivot on the spot to face your target or to
    stand up from knocked down. Prepare shot: a jezzail takes a complete turn to reload, so you may
    only fire it every other turn. Pick target: a model armed with a jezzail can target any enemy
    model in sight, not just the closest one. Save modifier: a warrior wounded by a jezzail must
    make his armour save with a -3 modifier. Assistant: a jezzail normally requires a crew of 2 to
    operate; in the absence of an assistant the remaining model can only carry the jezzail at half
    speed and suffers a -1 penalty to hit, and if the pair is shot at the assistant will always be
    hit first. Pavise: if the jezzail team has an assistant they may purchase a pavise as described
    in Town Crier 7. 175 gc, Rare 11, Skaven Clan Skryre heroes only.
  effect_i18n:
    es: >-
      El jezzail warplock es un diabólico invento de los Skaven del Clan Skryre. Es un arma de fuego
      enorme y de gran alcance, más parecida a un pequeño cañón que a un arma ordinaria. Dispara un
      proyectil especial hecho de piedra bruja. Alcance 36", Fuerza 5, modificador de salvación de
      armadura -3. Mover o disparar: no puedes moverte y disparar un jezzail en el mismo turno, salvo
      para girar sobre el sitio y encarar tu objetivo o para levantarte tras haber sido derribado.
      Prepara el disparo: un jezzail tarda un turno completo en recargarse, así que solo puedes
      dispararlo en turnos alternos. Elegir objetivo: un modelo armado con un jezzail puede apuntar a
      cualquier modelo enemigo a la vista, no solo al más cercano. Modificador de salvación: un
      guerrero herido por un jezzail debe realizar su salvación de armadura con un modificador de -3.
      Asistente: un jezzail necesita normalmente una tripulación de 2 para funcionar; si falta el
      asistente, el modelo restante solo puede transportar el jezzail a media velocidad y sufre una
      penalización de -1 para impactar, y si disparan a la pareja, el asistente será siempre el
      alcanzado primero. Pavés: si el equipo del jezzail tiene un asistente, pueden comprar un pavés
      como se describe en Town Crier 7. 175 gc, Rara 11, solo héroes Skaven del Clan Skryre.
  source_refs:
  - manual: broheim.net
    printed_page: 40
    section: Skaven Clan Skryre Special Equipment / Jezzail
    url: https://broheim.net/downloads/campaigns/karakazgal/Karak Azgal.pdf
  combat_status: out_of_scope
