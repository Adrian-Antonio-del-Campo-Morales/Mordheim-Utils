schema_version: 2
ruleset: mordheim
items:
- id: plague_censer
  kind: close-combat-weapon
  name: Plague Censer
  name_i18n:
    es: Incensario de la Peste
  effect: >-
    A Plague Censer is a hollow spiked metal ball attached to a long chain and is swung as a flail.
    A plague-infested shard of warpstone is burning inside the ball so that it emits a foul bubonic
    vapour as the censer is swung. Flesh exposed to the vapour quickly erupts into sores and
    fluid-filled blisters and lungs liquefy as the poisonous gas is inhaled. Only members of Clan
    Pestilens that have proven their skill in combat and knowledge of the Liturgus Infecticus are
    given the honour of wielding a Plague Censer. Range: Close Combat; Strength: as user +2; special
    rules: heavy, two-handed, fog of death. Heavy: the Plague Censer is wielded as a flail, and
    confers +2 Strength only on the first round of combat. Two-handed: may not use a shield, buckler
    or additional hand weapon in close combat (a shield still gives +1 armour save against
    shooting). Fog of Death: the billowing clouds of vapour make the wielder hard to shoot at (an
    extra -1 to hit when shooting at the wielder); at the end of each close-combat phase roll a D6
    for each model in base contact with the wielder — on a 6 the model suffers a wound from the
    poisonous gas with no armour save allowed (the vapours penetrate any defenses); Plague Censer
    wielders are immune to the Fog of Death. Cost: 75+5D6 (wt or gc per source), Rare 12, Clan
    Pestilens Champions only. The LUS and MOU texts are verbatim identical; both source refs are
    kept.
  effect_i18n:
    es: >-
      Un Incensario de la Peste es una bola metálica hueca con pinchos unida a una larga cadena y se
      blande como un mayal. En su interior arde un fragmento de piedra bruja infestado de plagas, de
      modo que emite un vapor bubónico fétido al blandir el incensario. La carne expuesta al vapor
      pronto revienta en llagas y ampollas llenas de líquido, y los pulmones se licúan al inhalar el
      gas venenoso. Solo los miembros del Clan Pestilens que han demostrado su habilidad en combate y
      su conocimiento del Liturgus Infecticus reciben el honor de empuñar un Incensario de la Peste.
      Alcance: cuerpo a cuerpo; Fuerza: la del usuario +2; reglas especiales: Pesado, a dos manos,
      Niebla de Muerte. Pesado: el Incensario de la Peste se blande como un mayal y otorga +2 de
      Fuerza solo en la primera ronda de combate. A dos manos: no puede usarse escudo, broquel ni arma
      de mano adicional en combate cuerpo a cuerpo (un escudo sigue dando +1 a la salvación de
      armadura contra disparos). Niebla de Muerte: las nubes de vapor hacen difícil disparar al
      portador (una penalización adicional de -1 al dispararle); al final de cada fase de combate
      cuerpo a cuerpo, tira 1D6 por cada modelo en contacto base con el portador: con un 6, el modelo
      sufre una herida por el gas venenoso sin permitirse salvación de armadura (los vapores penetran
      cualquier defensa); los portadores de Incensarios de la Peste son inmunes a la Niebla de Muerte.
      Coste: 75+5D6 (wt o gc según la fuente), Rara 12, solo Campeones del Clan Pestilens. Los textos
      LUS y MOU son idénticos palabra por palabra; se conservan ambas referencias de fuente.
  source_refs:
  - manual: broheim.net
    printed_page: 2
    section: Special Clan Pestilens Equipment / Plague Censer (Lustria)
    url: https://broheim.net/downloads/warbands/supplement/lustria/Clan%20Pestilens.pdf
  - manual: broheim.net
    printed_page: 2
    section: Clan Pestilence special equipment / Plague Censer (Mousillon)
    url: https://broheim.net/downloads/warbands/supplement/mousillon/Skaven%20of%20Clan%20Pestilens.pdf
  combat_status: out_of_scope
- id: warp_blades
  kind: close-combat-weapon
  name: Warp Blades
  name_i18n:
    es: Hojas de Warp
  effect: >-
    These arcane tools come in the shape of large blades and are attached to any pole the skaven has
    handy. Tap into the winds: warp blades may be attached to any spear, staff or halberd; they give
    their bearer +1 Strength and the knowledge of the Chain Lightening spell. 40+D6 dinars, Rare 8,
    Clan Skryre only (Relics of the Crusades Pt 2).
  effect_i18n:
    es: >-
      Estas herramientas arcanas tienen forma de grandes hojas y se fijan a cualquier asta que el
      skaven tenga a mano. Canalizar los vientos: las hojas de warp pueden fijarse a cualquier
      lanza, bastón o alabarda; otorgan a su portador +1 de Fuerza y el conocimiento del conjuro
      Rayo Eléctrico. 40+1D6 dinares, Rara 8, solo Clan Skryre (Relics of the Crusades Pt 2).
  source_refs:
  - manual: broheim.net
    printed_page: 6
    section: Clan Skryre special equipment / Warp blades
    url: https://broheim.net/downloads/fo/97RelicsoftheCrusadesPt2.pdf
  combat_status: out_of_scope
- id: manacles
  kind: combat-equipment
  name: Manacles
  name_i18n:
    es: Grilletes
  effect: >-
    A handy device for slavers made of metal, often rusted, and always uncomfortable. A new slave
    that sees the manufacturer's name or the country of origin proudly displayed on a pair of
    manacles will have a focus for his hatred for many years to come. You're mine: keep track of any
    living henchmen that a warrior equipped with manacles takes out of action; if a 1 is rolled for
    the henchmen when working out injuries he will be added to the slaver warband if he is human;
    the warrior will need to have his spirit broken and loses all experience. 20+D6 dinars, Rare 8,
    Slavers only (equipment list shows a flat 20 dinars — preserving both figures).
  effect_i18n:
    es: >-
      Un práctico artilugio para esclavistas, hecho de metal, a menudo oxidado y siempre incómodo. Un
      esclavo nuevo que vea el nombre del fabricante o el país de origen orgullosamente grabados en
      unos grilletes tendrá un foco para su odio durante muchos años. Es mío: registra cualquier
      secuaz vivo que un guerrero equipado con grilletes deje fuera de combate; si al resolver las
      heridas del secuaz sale un 1, se añadirá a la banda esclavista si es humano; el guerrero
      necesitará que le quiebren el espíritu y pierde toda su experiencia. 20+1D6 dinares, Rara 8,
      solo Esclavistas (la lista de equipo muestra 20 dinares fijos; se conservan ambas cifras).
  source_refs:
  - manual: broheim.net
    printed_page: 10
    section: Slavers special equipment / Manacles
    url: https://broheim.net/downloads/fo/97RelicsoftheCrusadesPt2.pdf
  combat_status: out_of_scope
- id: trappers_pole
  kind: close-combat-weapon
  name: Trapper's Pole
  name_i18n:
    es: Percha de Trampero
  effect: >-
    Used for capturing beasts at arm's length; a trapper's pole makes use of a noose attached to a
    long pole. The trapper's pole works exactly like a spear with the following special rule.
    Trapper: keep track of a living, non-experience-gaining animal (which includes horses, dogs,
    giant rats and boars) that a warrior armed with a trapper's pole takes out of action; if a 1 or
    2 is rolled for the animal when working out injuries it will be added to the trapper's warband.
    15 dinars, Rare 6, Slavers only.
  effect_i18n:
    es: >-
      Se usa para capturar bestias a distancia de un brazo; la percha de trampero emplea un lazo
      sujeto a un palo largo. La percha de trampero funciona exactamente igual que una lanza con la
      siguiente regla especial. Trampero: registra cualquier animal vivo que no gane experiencia (lo
      que incluye caballos, perros, ratas gigantes y jabalíes) que un guerrero armado con una percha
      de trampero deje fuera de combate; si al resolver sus heridas se saca un 1 o un 2 para el
      animal, se añadirá a la banda del trampero. 15 dinares, Rara 6, solo Esclavistas.
  source_refs:
  - manual: broheim.net
    printed_page: 10
    section: Slavers special equipment / Trapper's pole
    url: https://broheim.net/downloads/fo/97RelicsoftheCrusadesPt2.pdf
  combat_status: out_of_scope
- id: slave
  kind: out-of-scope
  name: Slave
  name_i18n:
    es: Esclavo
  effect: >-
    Miscellaneous equipment (Heroes only) of the Slavers warband: a purchased slave. A slaver
    warband may have up to 20 warriors even though hiring restrictions allow a maximum of 12,
    because a slave merchant isn't much of a slave merchant without slaves — slaves bought this way
    make up the numbers. Slaves are generally ill-treated: if any slave achieves the 'Lad's got the
    Talent' advance, the slave must make a Leadership test; if passed the merchant frees him (he
    retains his statistic line but his type changes to caravan guard and may become a warband
    leader); if failed the slave is removed from the warband list and becomes a new eunuch in his
    own henchman group. 8 dinars.
  effect_i18n:
    es: >-
      Equipo misceláneo (solo Héroes) de la banda de los Esclavistas: un esclavo comprado. Una banda
      esclavista puede tener hasta 20 guerreros aunque las restricciones de contratación permitan un
      máximo de 12, porque un mercader de esclavos no es gran cosa sin esclavos; los esclavos
      comprados así completan el número. Los esclavos suelen ser maltratados: si algún esclavo logra
      el avance 'El chaval tiene talento', el esclavo debe hacer un chequeo de Liderazgo; si lo
      supera, el mercader lo libera (conserva su línea de características, pero su tipo cambia a
      guardián de caravana y puede convertirse en líder de banda); si lo falla, el esclavo se retira
      de la lista de la banda y se convierte en un nuevo eunuco en su propio grupo de secuaces. 8
      dinares.
  source_refs:
  - manual: broheim.net
    printed_page: 10
    section: Slavers Miscellaneous Equipment (Heroes only) / Slave
    url: https://broheim.net/downloads/fo/97RelicsoftheCrusadesPt2.pdf
  combat_status: out_of_scope
- id: rel_riding_horse
  kind: out-of-scope
  name: Riding Horse
  name_i18n:
    es: Caballo de Montar
  effect: >-
    Riding horse listed in the Arabian warband miscellaneous/equipment lists (Turjuk heroes, 40
    dinars; Disciples of Maldred, 30 gc). Mounted models follow the optional rules for mounts. NOTE:
    the active KB has no generic Riding Horse item; at promotion consider merging with the KB's
    mount handling or keep as source-scoped entry. 30 gc / 40 dinars depending on list.
  effect_i18n:
    es: >-
      Caballo de montar listado en las listas de equipo/misceláneo de las bandas arábigas (héroes
      Turjuk, 40 dinares; Discípulos de Maldred, 30 gc). Los modelos montados siguen las reglas
      opcionales de monturas. NOTA: la KB activa no tiene un objeto Caballo de Montar genérico; al
      promover, considera fusionarlo con el tratamiento de monturas de la KB o mantenerlo como entrada
      acotada a la fuente. 30 gc / 40 dinares según la lista.
  source_refs:
  - manual: broheim.net
    printed_page: 3
    section: Disciples of Maldred / Riding Horse
    url: https://broheim.net/downloads/warbands/supplement/mousillon/Disciples%20of%20Maldred.pdf
  - manual: broheim.net
    printed_page: 3
    section: Turjuk Heroes equipment list / Riding Horse
    url: https://broheim.net/downloads/fo/97RelicsoftheCrusadesPt2.pdf
  combat_status: out_of_scope
- id: red_toof_clan_membership
  kind: combat-equipment
  name: Red Toof Clan Membership
  name_i18n:
    es: Membresía del Clan Diente Rojo
  effect: >-
    Only proving one's prowess in battle can attract the attention of this cadre of warriors. Once
    inducted, the membership can never be removed; the owner is too proud! The model will now be
    subject to the rules for Frenzy as described in the Mordheim rulebook. 40 gold crowns, Rare 9.
  effect_i18n:
    es: >-
      Solo demostrar la propia valía en combate puede atraer la atención de este grupo de guerreros.
      Una vez admitido, la membresía nunca puede retirarse; ¡su dueño es demasiado orgulloso! El
      modelo quedará ahora sujeto a las reglas de Frenesí descritas en el libro de reglas de Mordheim.
      40 coronas de oro, Rara 9.
  source_refs:
  - manual: broheim.net
    printed_page: 2
    section: Forest Goblins special equipment / Red Toof Clan Membership
    url: https://broheim.net/downloads/warbands/supplement/lustria/Forest%20Goblins.pdf
  combat_status: out_of_scope
- id: arachnid_mount
  kind: out-of-scope
  name: Arachnid Mount
  name_i18n:
    es: Montura de Arácnido
  effect: >-
    If you are using the optional rules for mounts, then your warband's heroes may ride giant
    spiders. The rider's Movement is increased to 6, and armour save increased by +1, exactly as if
    mounted on an ordinary horse. The rider need not dismount to climb terrain (including building
    exteriors) and the spider's natural climbing abilities allow the rider to re-roll any failed
    climbing attempts. 45 gold crowns, Rare 5.
  effect_i18n:
    es: >-
      Si usas las reglas opcionales de monturas, los héroes de tu banda pueden montar arañas gigantes.
      El Movimiento del jinete aumenta a 6 y su salvación de armadura en +1, exactamente como si
      montara un caballo corriente. El jinete no necesita desmontar para trepar por el terreno
      (incluidas las fachadas de los edificios) y las habilidades trepadoras naturales de la araña le
      permiten repetir cualquier intento fallido de trepar. 45 coronas de oro, Rara 5.
  source_refs:
  - manual: broheim.net
    printed_page: 2
    section: Forest Goblins special equipment / Arachnid Mount
    url: https://broheim.net/downloads/warbands/supplement/lustria/Forest%20Goblins.pdf
  combat_status: out_of_scope
- id: mark_of_the_old_ones
  kind: combat-equipment
  name: Mark of the Old Ones
  name_i18n:
    es: Marca de los Antiguos
  effect: >-
    This is the greatest mark a Lizardman can be born with, for these Albinos are destined for
    greatness in the eyes of their gods and other Lizardmen. The Hero may change one of his failed
    dice rolls into a successful one; this mark may only be used once per battle and only on actions
    that the Hero is making himself. You may use this mark on a failed Rout test if you wish. Sacred
    Marking: a Hero may only have a single Sacred Marking and these may only be bought when you
    recruit the Hero, not in the middle of a campaign. 50 gold crowns.
  effect_i18n:
    es: >-
      Esta es la mayor marca con la que puede nacer un hombre lagarto, pues estos Albino están
      destinados a la grandeza a los ojos de sus dioses y de los demás hombres lagarto. El Héroe puede
      convertir una de sus tiradas de dado fallidas en un éxito; esta marca solo puede usarse una vez
      por batalla y solo en acciones que el propio Héroe esté realizando. Puedes usar esta marca en un
      chequeo de Huida fallido si lo deseas. Marca Sagrada: un Héroe solo puede tener una única Marca
      Sagrada y estas solo pueden comprarse cuando reclutas al Héroe, no a mitad de campaña. 50
      coronas de oro.
  source_refs:
  - manual: broheim.net
    printed_page: 2
    section: Lizardmen Sacred Markings / Mark of the Old Ones
    url: https://broheim.net/downloads/warbands/supplement/lustria/Lizardmen.pdf
  combat_status: out_of_scope
- id: oversized_jaws
  kind: combat-equipment
  name: Oversized Jaws
  name_i18n:
    es: Mandíbulas Cremallera
  effect: >-
    The Saurus has been granted the addition of powerful neck muscles and oversized jaws, even
    greater than those of a normal Saurus. The Hero may make his bite attack at +1 Strength. Sacred
    Marking: a Hero may only have a single Sacred Marking and these may only be bought when you
    recruit the Hero, not in the middle of a campaign. (Saurus only.) 40 gold crowns.
  effect_i18n:
    es: >-
      Al Saurus se le han concedido unos poderosos músculos del cuello y unas mandíbulas descomunales,
      aún mayores que las de un Saurus normal. El Héroe puede hacer su ataque de mordisco con +1 de
      Fuerza. Marca Sagrada: un Héroe solo puede tener una única Marca Sagrada y estas solo pueden
      comprarse cuando reclutas al Héroe, no a mitad de campaña. (Solo Saurus). 40 coronas de oro.
  source_refs:
  - manual: broheim.net
    printed_page: 2
    section: Lizardmen Sacred Markings / Oversized Jaws
    url: https://broheim.net/downloads/warbands/supplement/lustria/Lizardmen.pdf
  combat_status: out_of_scope
- id: poison_glands
  kind: combat-equipment
  name: Poison Glands
  name_i18n:
    es: Glándulas Venenosas
  effect: >-
    The Skink has been gifted with glands that produce a deadly poison. The Skink may choose to
    attack with his teeth instead of his weapons. These attacks are treated just like a Saurus bite
    attack but are resolved at a +1 save modifier regardless of the Skink's Strength. In addition,
    when rolling on the injury table add +1 to the result. Sacred Marking: a Hero may only have a
    single Sacred Marking and these may only be bought when you recruit the Hero, not in the middle
    of a campaign. (Skinks only.) 40 gold crowns.
  effect_i18n:
    es: >-
      Al Skink se le han otorgado glándulas que producen un veneno letal. El Skink puede optar por
      atacar con sus dientes en lugar de con sus armas. Estos ataques se tratan igual que un ataque de
      mordisco de Saurus, pero se resuelven con un modificador de salvación de +1 independientemente
      de la Fuerza del Skink. Además, al tirar en la tabla de heridas, suma +1 al resultado. Marca
      Sagrada: un Héroe solo puede tener una única Marca Sagrada y estas solo pueden comprarse cuando
      reclutas al Héroe, no a mitad de campaña. (Solo Skinks). 40 coronas de oro.
  source_refs:
  - manual: broheim.net
    printed_page: 3
    section: Lizardmen Sacred Markings / Poison Glands
    url: https://broheim.net/downloads/warbands/supplement/lustria/Lizardmen.pdf
  combat_status: out_of_scope
