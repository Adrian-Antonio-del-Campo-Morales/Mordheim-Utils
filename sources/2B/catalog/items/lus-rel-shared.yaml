schema_version: 2
ruleset: mordheim
items:
- id: plague_censer
  kind: close-combat-weapon
  name: Plague Censer
  name_i18n:
    es: Incensario de la Peste
  effect: >-
    A Plague Censer is a hollow spiked metal ball attached to a long chain and is swung as a flail.
    A plague-infested shard of warpstone is burning inside the ball so that it emits a foul bubonic
    vapour as the censer is swung. Flesh exposed to the vapour quickly erupts into sores and
    fluid-filled blisters and lungs liquefy as the poisonous gas is inhaled. Only members of Clan
    Pestilens that have proven their skill in combat and knowledge of the Liturgus Infecticus are
    given the honour of wielding a Plague Censer. Range: Close Combat; Strength: as user +2;
    special rules: heavy, two-handed, fog of death. Heavy: the Plague Censer is wielded as a flail,
    and confers +2 Strength only on the first round of combat. Two-handed: may not use a shield,
    buckler or additional hand weapon in close combat (a shield still gives +1 armour save against
    shooting). Fog of Death: the billowing clouds of vapour make the wielder hard to shoot at (an
    extra -1 to hit when shooting at the wielder); at the end of each close-combat phase roll a D6
    for each model in base contact with the wielder — on a 6 the model suffers a wound from the
    poisonous gas with no armour save allowed (the vapours penetrate any defenses); Plague Censer
    wielders are immune to the Fog of Death. Cost: 75+5D6 (wt or gc per source), Rare 12, Clan
    Pestilens Champions only. The LUS and MOU texts are verbatim identical; both source refs are
    kept.
  source_refs:
  - manual: broheim.net
    printed_page: 2
    section: Special Clan Pestilens Equipment / Plague Censer (Lustria)
    url: https://broheim.net/downloads/warbands/supplement/lustria/Clan%20Pestilens.pdf
  - manual: broheim.net
    printed_page: 2
    section: Clan Pestilence special equipment / Plague Censer (Mousillon)
    url: https://broheim.net/downloads/warbands/supplement/mousillon/Skaven%20of%20Clan%20Pestilens.pdf
  rarity: Rare 12
  combat_status: out_of_scope
- id: warp_blades
  kind: close-combat-weapon
  name: Warp Blades
  name_i18n:
    es: Hojas de Warp
  effect: >-
    These arcane tools come in the shape of large blades and are attached to any pole the skaven
    has handy. Tap into the winds: warp blades may be attached to any spear, staff or halberd; they
    give their bearer +1 Strength and the knowledge of the Chain Lightening spell. 40+D6 dinars,
    Rare 8, Clan Skryre only (Relics of the Crusades Pt 2).
  source_refs:
  - manual: broheim.net
    printed_page: 6
    section: Clan Skryre special equipment / Warp blades
    url: https://broheim.net/downloads/fo/97RelicsoftheCrusadesPt2.pdf
  rarity: Rare 8
  combat_status: out_of_scope
- id: manacles
  kind: combat-equipment
  name: Manacles
  name_i18n:
    es: Grilletes
  effect: >-
    A handy device for slavers made of metal, often rusted, and always uncomfortable. A new slave
    that sees the manufacturer's name or the country of origin proudly displayed on a pair of
    manacles will have a focus for his hatred for many years to come. You're mine: keep track of
    any living henchmen that a warrior equipped with manacles takes out of action; if a 1 is rolled
    for the henchmen when working out injuries he will be added to the slaver warband if he is
    human; the warrior will need to have his spirit broken and loses all experience. 20+D6 dinars,
    Rare 8, Slavers only (equipment list shows a flat 20 dinars — preserving both figures).
  source_refs:
  - manual: broheim.net
    printed_page: 10
    section: Slavers special equipment / Manacles
    url: https://broheim.net/downloads/fo/97RelicsoftheCrusadesPt2.pdf
  rarity: Rare 8
  combat_status: out_of_scope
- id: trappers_pole
  kind: close-combat-weapon
  name: Trapper's Pole
  name_i18n:
    es: Percha de Trampero
  effect: >-
    Used for capturing beasts at arm's length; a trapper's pole makes use of a noose attached to a
    long pole. The trapper's pole works exactly like a spear with the following special rule.
    Trapper: keep track of a living, non-experience-gaining animal (which includes horses, dogs,
    giant rats and boars) that a warrior armed with a trapper's pole takes out of action; if a 1 or
    2 is rolled for the animal when working out injuries it will be added to the trapper's warband.
    15 dinars, Rare 6, Slavers only.
  source_refs:
  - manual: broheim.net
    printed_page: 10
    section: Slavers special equipment / Trapper's pole
    url: https://broheim.net/downloads/fo/97RelicsoftheCrusadesPt2.pdf
  rarity: Rare 6
  combat_status: out_of_scope
- id: slave
  kind: out-of-scope
  name: Slave
  name_i18n:
    es: Esclavo
  effect: >-
    Miscellaneous equipment (Heroes only) of the Slavers warband: a purchased slave. A slaver
    warband may have up to 20 warriors even though hiring restrictions allow a maximum of 12,
    because a slave merchant isn't much of a slave merchant without slaves — slaves bought this way
    make up the numbers. Slaves are generally ill-treated: if any slave achieves the 'Lad's got the
    Talent' advance, the slave must make a Leadership test; if passed the merchant frees him (he
    retains his statistic line but his type changes to caravan guard and may become a warband
    leader); if failed the slave is removed from the warband list and becomes a new eunuch in his
    own henchman group. 8 dinars.
  source_refs:
  - manual: broheim.net
    printed_page: 10
    section: Slavers Miscellaneous Equipment (Heroes only) / Slave
    url: https://broheim.net/downloads/fo/97RelicsoftheCrusadesPt2.pdf
  combat_status: out_of_scope
- id: rel_riding_horse
  kind: out-of-scope
  name: Riding Horse
  name_i18n:
    es: Caballo de Montar
  effect: >-
    Riding horse listed in the Arabian warband miscellaneous/equipment lists (Turjuk heroes,
    40 dinars; Disciples of Maldred, 30 gc). Mounted models follow the optional rules for mounts.
    NOTE: the active KB has no generic Riding Horse item; at promotion consider merging with the
    KB's mount handling or keep as source-scoped entry. 30 gc / 40 dinars depending on list.
  source_refs:
  - manual: broheim.net
    printed_page: 3
    section: Disciples of Maldred / Riding Horse
    url: https://broheim.net/downloads/warbands/supplement/mousillon/Disciples%20of%20Maldred.pdf
  - manual: broheim.net
    printed_page: 3
    section: Turjuk Heroes equipment list / Riding Horse
    url: https://broheim.net/downloads/fo/97RelicsoftheCrusadesPt2.pdf
  combat_status: out_of_scope
- id: red_toof_clan_membership
  kind: combat-equipment
  name: Red Toof Clan Membership
  name_i18n:
    es: Membresía del Clan Diente Rojo
  effect: >-
    Only proving one's prowess in battle can attract the attention of this cadre of warriors. Once
    inducted, the membership can never be removed; the owner is too proud! The model will now be
    subject to the rules for Frenzy as described in the Mordheim rulebook. 40 gold crowns, Rare 9.
  source_refs:
  - manual: broheim.net
    printed_page: 2
    section: Forest Goblins special equipment / Red Toof Clan Membership
    url: https://broheim.net/downloads/warbands/supplement/lustria/Forest%20Goblins.pdf
  rarity: Rare 9
  combat_status: out_of_scope
- id: arachnid_mount
  kind: out-of-scope
  name: Arachnid Mount
  name_i18n:
    es: Montura de Arácnido
  effect: >-
    If you are using the optional rules for mounts, then your warband's heroes may ride giant
    spiders. The rider's Movement is increased to 6, and armour save increased by +1, exactly as if
    mounted on an ordinary horse. The rider need not dismount to climb terrain (including building
    exteriors) and the spider's natural climbing abilities allow the rider to re-roll any failed
    climbing attempts. 45 gold crowns, Rare 5.
  source_refs:
  - manual: broheim.net
    printed_page: 2
    section: Forest Goblins special equipment / Arachnid Mount
    url: https://broheim.net/downloads/warbands/supplement/lustria/Forest%20Goblins.pdf
  rarity: Rare 5
  combat_status: out_of_scope
- id: mark_of_the_old_ones
  kind: combat-equipment
  name: Mark of the Old Ones
  name_i18n:
    es: Marca de los Primigenios
  effect: >-
    This is the greatest mark a Lizardman can be born with, for these Albinos are destined for
    greatness in the eyes of their gods and other Lizardmen. The Hero may change one of his failed
    dice rolls into a successful one; this mark may only be used once per battle and only on
    actions that the Hero is making himself. You may use this mark on a failed Rout test if you
    wish. Sacred Marking: a Hero may only have a single Sacred Marking and these may only be bought
    when you recruit the Hero, not in the middle of a campaign. 50 gold crowns.
  source_refs:
  - manual: broheim.net
    printed_page: 2
    section: Lizardmen Sacred Markings / Mark of the Old Ones
    url: https://broheim.net/downloads/warbands/supplement/lustria/Lizardmen.pdf
  combat_status: out_of_scope
- id: oversized_jaws
  kind: combat-equipment
  name: Oversized Jaws
  name_i18n:
    es: Mandíbulas Cremallera
  effect: >-
    The Saurus has been granted the addition of powerful neck muscles and oversized jaws, even
    greater than those of a normal Saurus. The Hero may make his bite attack at +1 Strength.
    Sacred Marking: a Hero may only have a single Sacred Marking and these may only be bought when
    you recruit the Hero, not in the middle of a campaign. (Saurus only.) 40 gold crowns.
  source_refs:
  - manual: broheim.net
    printed_page: 2
    section: Lizardmen Sacred Markings / Oversized Jaws
    url: https://broheim.net/downloads/warbands/supplement/lustria/Lizardmen.pdf
  combat_status: out_of_scope
- id: poison_glands
  kind: combat-equipment
  name: Poison Glands
  name_i18n:
    es: Glándulas Venenosas
  effect: >-
    The Skink has been gifted with glands that produce a deadly poison. The Skink may choose to
    attack with his teeth instead of his weapons. These attacks are treated just like a Saurus bite
    attack but are resolved at a +1 save modifier regardless of the Skink's Strength. In addition,
    when rolling on the injury table add +1 to the result. Sacred Marking: a Hero may only have a
    single Sacred Marking and these may only be bought when you recruit the Hero, not in the middle
    of a campaign. (Skinks only.) 40 gold crowns.
  source_refs:
  - manual: broheim.net
    printed_page: 3
    section: Lizardmen Sacred Markings / Poison Glands
    url: https://broheim.net/downloads/warbands/supplement/lustria/Lizardmen.pdf
  combat_status: out_of_scope
