- id: greenwood_scythe
  kind: close-combat-weapon
  name: Greenwood Scythe
  name_i18n:
    es: Guadaña del Bosque
  effect: >-
    Both deal and life is dealt with the Greenwood Scythe. After slaying their enemies the
    Branchwyches use their scythes to harvest the Lamentari or souls of their brethren to prepare
    them for rebirth. Range: Close Combat; Strength: as user +1; special rules: two-handed,
    Treescuttle Venom. Treescuttle Venom: +1 to injury rolls. 60 gold crowns, Rare 10 (Branchwych
    only).
  source_refs:
  - manual: broheim.net
    printed_page: 2
    section: Special equipment / Greenwood scythe
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Fen%20Guard.pdf
  rarity: Rare 10
  combat_status: out_of_scope
- id: iron_bark
  kind: armour
  name: Iron Bark
  name_i18n:
    es: Corteza de Hierro
  effect: >-
    Blessed bark from the Sacred Oak. Gives the owner +2 to their armour save, but is broken the
    first time the user fails their save. 10 gold crowns, Rare 5 (Fen Guard only).
  source_refs:
  - manual: broheim.net
    printed_page: 2
    section: Special equipment / Iron bark
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Fen%20Guard.pdf
  rarity: Rare 5
  combat_status: out_of_scope
- id: horn_of_the_wild_hunt
  kind: combat-equipment
  name: Horn of the Wild Hunt
  name_i18n:
    es: Cuerno de la Cacería Salvaje
  effect: >-
    Before each battle the Branch Nymph may take a Leadership test to blow the horn. If they are
    successful, roll on the table below; these animals will fight for the warband and leave once
    the battle has finished; they do not count towards your rout test or warband max. D6: 1 nothing
    answers the call; 2 D3+1 Hunting Hounds appear; 3 a Tiger joins the battle; 4 a Bear joins the
    battle; 5 a Great Stag joins the battle; 6 a Great Eagle joins. 120 gold crowns (description,
    printed page 2) vs 110 gc (equipment list) — preserving the source discrepancy. Rare 12
    (Branch Nymph only).
  source_refs:
  - manual: broheim.net
    printed_page: 2
    section: Special equipment / Horn of the hunt
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Fen%20Guard.pdf
  - manual: broheim.net
    printed_page: 2
    section: Fen Guard Miscellaneous Equipment / Horn of the Wild Hunt
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Fen%20Guard.pdf
  rarity: Rare 12
  combat_status: out_of_scope
- id: magic_acorn
  kind: combat-equipment
  name: Magic Acorn
  name_i18n:
    es: Bellota Mágica
  effect: >-
    An arcane enchantment of premonition has been woven into this golden acorn by the Spellsingers
    of Laurelorn Forest. With the sparkling acorn tucked snugly in his breast pocket the carrier is
    imbued with great fortune in a fight: in the first round of every close combat the Hero
    automatically hits with a single attack that was rolled as a miss. 250 gold crowns, Rare 15
    (Militiant Mootlanders text) vs 100 gc (Fen Guard equipment list) — preserving the source
    discrepancy; review owner should reconcile.
  source_refs:
  - manual: broheim.net
    printed_page: 2
    section: Militiant Mootlanders special equipment / Magic Acorn
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Militiant%20Mootlanders.pdf
  - manual: broheim.net
    printed_page: 2
    section: Fen Guard Miscellaneous Equipment / Magic Acorn
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Fen%20Guard.pdf
  rarity: Rare 15
  combat_status: out_of_scope
- id: steel_cloth
  kind: armour
  name: Steel Cloth
  name_i18n:
    es: Tela de Acero
  effect: >-
    Woven cloth reinforced with steel thread, listed in the Militiant Mootlanders armour section
    between light armour and shield. No separate special-rules paragraph is printed beyond the list
    entry. 35 gc.
  source_refs:
  - manual: broheim.net
    printed_page: 2
    section: Militiant Mootlanders Armour / Steel cloth
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Militiant%20Mootlanders.pdf
  combat_status: out_of_scope
- id: thiefs_cloak
  kind: combat-equipment
  name: Thief's Cloak
  name_i18n:
    es: Capa del Ladrón
  effect: >-
    Thieves wear cloaks that help them blend in with their surroundings and can disguise them very
    well in both the desert and the towns. The distance required to spot a warrior wearing a
    Thief's cloak when hidden is doubled. 15 gold crowns, Rare 9.
  source_refs:
  - manual: broheim.net
    printed_page: 2
    section: Low Kings special equipment / Thief's cloak
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Low%20Kings.pdf
  rarity: Rare 9
  combat_status: out_of_scope
- id: fences_iron_strongbox
  kind: combat-equipment
  name: Fence's Iron Strongbox
  name_i18n:
    es: Caja Fuerte de Hierro del Receptor
  effect: >-
    The strongbox has a hidden compartment providing storage space for a fence to smuggle goods
    past watch patrols and excise men. One item can be concealed inside the iron strongbox; a
    wyrdstone item can be sealed in this way, meaning its hazardous side-effects may be ignored by
    the bearer. The strongbox never leaves the possession of the warband but it cannot be used
    unless the warband includes a Fence. Two models are required to move the strongbox. 30 gold
    crowns, Rare 10 (Fence only).
  source_refs:
  - manual: broheim.net
    printed_page: 2
    section: Low Kings special equipment / Fence's iron strongbox
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Low%20Kings.pdf
  rarity: Rare 10
  combat_status: out_of_scope
- id: knuckledusters
  kind: close-combat-weapon
  name: Knuckledusters
  name_i18n:
    es: Pies de Cerdo
  effect: >-
    Thugs and robbers infest mighty cities of the Empire. Marienburg has more than its share of
    hoodlums who would not hesitate to strike their enemies with a low blow! Easily secreted,
    knuckledusters used in pairs. Range: Close Combat; Strength: as user; special rules: pair,
    concealable. Pair: knuckledusters are used in pairs, one in each hand; a warrior armed with
    knuckledusters gets an additional attack. Concealable: small enough to stow away in any pocket;
    they do not count towards the two close combat weapons a model may carry and may be used in any
    scenario which prohibits use of weapons, such as 'Last Orders!' or 'Pit of Blood'. 5 gold
    crowns, Rare 6.
  source_refs:
  - manual: broheim.net
    printed_page: 2
    section: Low Kings special equipment / Knuckledusters
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Low%20Kings.pdf
  rarity: Rare 6
  combat_status: out_of_scope
- id: wild_mountain_goat
  kind: out-of-scope
  name: Wild Mountain Goat
  name_i18n:
    es: Cabra Montesa Salvaje
  effect: >-
    Mount for Halfling heroes. Profile M7 WS2 BS0 S2 T3 W1 I4 A1 Ld5. Ride Mountain Goat: any
    Halfling hero who learns the appropriate Animal Handling skill can use the Speed skill 'Scale
    Sheer Surfaces' if he has it, to climb while riding, equal to twice the normal Movement of his
    mount. 85 gc.
  source_refs:
  - manual: broheim.net
    printed_page: 2
    section: Militiant Mootlanders / Wild mountain goat
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Militiant%20Mootlanders.pdf
  combat_status: out_of_scope
