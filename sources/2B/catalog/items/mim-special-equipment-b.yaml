- id: great_stag
  kind: out-of-scope
  name: Great Stag
  name_i18n:
    es: Gran Ciervo
  effect: >-
    Profile M 8, WS 4, BS 0, S 4, T 4, W 2, I 6, A 2, Ld 10. Special rules: Fear, Animal, Forest
    Walk, Thunderous Charge. Called by the Horn of the Wild Hunt: on a result of 5 on the Horn's
    table a Great Stag joins the battle. Thunderous Charge: A charging Great Stag is a terrifying
    sight, the ground itself trembling as the Forest Lord thunders into the ranks of their foe. On
    any turn when a Great Stag charges more than 8", he causes D3 impact hits at the basic strength
    of the Stag.
  effect_i18n:
    es: >-
      Perfil M 8, HA 4, HP 0, F 4, R 4, H 2, I 6, A 2, L 10. Reglas especiales: Miedo, Animal, Paso
      del Bosque, Carga Atronadora. Llamado por el Cuerno de la Cacería Salvaje: con un resultado de
      5 en la tabla del Cuerno un Gran Ciervo se une a la batalla. Carga Atronadora: Un Gran Ciervo
      que carga es una visión aterradora, el propio suelo tiembla cuando el Señor del Bosque irrumpe
      entre las filas de su enemigo. En cualquier turno en el que un Gran Ciervo cargue más de 8",
      causa 1D3 impactos a la Fuerza básica del Ciervo.
  source_refs:
  - manual: broheim.net
    printed_page: 6
    section: Animals of the Hunt / Great Stag
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Fen%20Guard.pdf
  combat_status: out_of_scope
- id: great_eagle
  kind: out-of-scope
  name: Great Eagle
  name_i18n:
    es: Gran Águila
  effect: >-
    Profile M 4, WS 4, BS 0, S 4, T 4, W 3, I 2, A 2, Ld 6. Called by the Horn of the Wild Hunt: on
    a result of 6 on the Horn's table a Great Eagle joins the battle. Flying Charge: A Great Eagle
    may fly up to 16". Any model a Great Eagle comes into contact with while flying is considered
    charged. Models that are stunned or knocked down cannot be charged as it is too difficult for
    the Great Eagle to fly that close to the ground. Aerial Escape: Great Eagles circle their prey
    before swooping in and remain in the air while harrying a foe. This makes them harder to hit.
    Only a warrior with sharp enough reflexes or a long pointy weapon stands a chance of pinning a
    Great Eagle down! If the charged model strikes first then resolve combat as normal. Otherwise
    after the Great Eagle attacks it retreats immediately to a lofty position within 2D6" before the
    charged model reacts. Similarly to escaping from combat, the Great Eagle receives an automatic
    hit from its opponent (see page 161 of the Mordheim rulebook) unless it passes a Leadership
    test. Drop Attack: If a Great Eagle is successful with both attacks in the first round of combat
    then the Great Eagle has successfully grabbed on to her enemy and swoops back up in the air to
    drop the model, allowing gravity to do the work instead! The attacks themselves do not wound but
    instead roll a D6 and a scatter dice. That is the distance and direction from the place where
    the attack took place that the model was dropped. Roll another D6 to determine a height from
    which the model falls. Falling models take D3 hits at a Strength equal to the height. If a model
    falls into a building then count the fall to where they land and then determine if the model
    falls again if it is within 1" of the platform edge. Any model that is struck by the dropped
    model suffers a Strength 3 hit. Large targets may only be dropped D3" due to weight. After
    dropping a model the Great Eagle retreats 2D6" to the nest or nearby rooftop. Talons: Creatures
    with talons are accustomed to fighting unarmed. Grounded: After the combat phase if a Great
    Eagle has been unable to flee for any reason the model is assumed to have landed and may be
    charged. While on the ground, a Great Eagle uses its movement characteristic and may only fly
    again when able to.
  effect_i18n:
    es: >-
      Perfil M 4, HA 4, HP 0, F 4, R 4, H 3, I 2, A 2, L 6. Llamada por el Cuerno de la Cacería
      Salvaje: con un resultado de 6 en la tabla del Cuerno una Gran Águila se une a la batalla.
      Carga en Vuelo: Una Gran Águila puede volar hasta 16". Cualquier miniatura con la que entre en
      contacto mientras vuela se considera cargada. Las miniaturas aturdidas o derribadas no pueden
      ser cargadas, pues es demasiado difícil para la Gran Águila volar tan cerca del suelo. Escape
      Aéreo: Las Grandes Águilas circulan sobre su presa antes de abatirse sobre ella y permanecen
      en el aire mientras hostigan al enemigo. Esto las hace más difíciles de impactar. ¡Solo un
      guerrero con reflejos lo bastante rápidos o con un arma larga y puntiaguda tiene alguna
      posibilidad de inmovilizar a una Gran Águila! Si la miniatura cargada golpea primero, resuelve
      el combate con normalidad. En caso contrario, tras atacar la Gran Águila se retira de
      inmediato a una posición elevada a 2D6" antes de que reaccione la miniatura cargada. De forma
      similar a escapar de un combate, la Gran Águila recibe un impacto automático de su oponente
      (ver página 161 del reglamento de Mordheim) a menos que supere un chequeo de Liderazgo. Ataque
      en Picado: Si una Gran Águila tiene éxito con ambos ataques en la primera ronda de combate, ha
      agarrado a su enemigo y remonta el vuelo para dejarlo caer, ¡dejando que la gravedad haga el
      trabajo! Los ataques en sí no hieren; en su lugar tira 1D6 y un dado de dispersión. Esa es la
      distancia y dirección, desde el lugar donde se produjo el ataque, a la que se dejó caer a la
      miniatura. Tira otro 1D6 para determinar la altura desde la que cae. Las miniaturas que caen
      reciben 1D3 impactos a una Fuerza igual a la altura. Si una miniatura cae dentro de un
      edificio, cuenta la caída hasta donde aterriza y luego determina si vuelve a caer si está a 1"
      del borde de la plataforma. Cualquier miniatura golpeada por la miniatura que cae sufre un
      impacto de Fuerza 3. Las miniaturas grandes solo pueden dejarse caer 1D3" debido a su peso.
      Tras dejar caer a una miniatura, la Gran Águila se retira 2D6" al nido o a un tejado cercano.
      Garras: Las criaturas con garras están acostumbradas a luchar sin armas. En Tierra: Después de
      la fase de combate, si una Gran Águila no ha podido huir por cualquier motivo, se considera
      que ha aterrizado y puede ser cargada. Mientras está en tierra, una Gran Águila usa su
      característica de movimiento y solo puede volver a volar cuando le sea posible.
  source_refs:
  - manual: broheim.net
    printed_page: 6
    section: Animals of the Hunt / Great Eagle
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Fen%20Guard.pdf
  combat_status: out_of_scope
- id: magic_acorn
  kind: combat-equipment
  name: Magic Acorn
  name_i18n:
    es: Bellota Mágica
  effect: >-
    An arcane enchantment of premonition has been woven into this golden acorn by the Spellsingers
    of Laurelorn Forest. With the sparkling acorn tucked snugly in his breast pocket the carrier is
    imbued with great fortune in a fight: in the first round of every close combat the Hero
    automatically hits with a single attack that was rolled as a miss. 250 gold crowns, Rare 15
    (Militiant Mootlanders text) vs 100 gc (Fen Guard equipment list) — preserving the source
    discrepancy; review owner should reconcile.
  source_refs:
  - manual: broheim.net
    printed_page: 2
    section: Militiant Mootlanders special equipment / Magic Acorn
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Militiant%20Mootlanders.pdf
  - manual: broheim.net
