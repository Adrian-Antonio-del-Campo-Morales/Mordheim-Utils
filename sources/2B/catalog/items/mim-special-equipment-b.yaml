- id: fences_iron_strongbox
  kind: combat-equipment
  name: Fence's Iron Strongbox
  name_i18n:
    es: Caja Fuerte de Hierro del Receptor
  effect: >-
    The strongbox has a hidden compartment providing storage space for a fence to smuggle goods past
    watch patrols and excise men. One item can be concealed inside the iron strongbox; a wyrdstone
    item can be sealed in this way, meaning its hazardous side-effects may be ignored by the bearer.
    The strongbox never leaves the possession of the warband but it cannot be used unless the
    warband includes a Fence. Two models are required to move the strongbox. 30 gold crowns, Rare 10
    (Fence only).
  source_refs:
  - manual: broheim.net
    printed_page: 2
    section: Low Kings special equipment / Fence's iron strongbox
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Low%20Kings.pdf
  combat_status: out_of_scope
- id: knuckledusters
  kind: close-combat-weapon
  name: Knuckledusters
  name_i18n:
    es: Pies de Cerdo
  effect: >-
    Thugs and robbers infest mighty cities of the Empire. Marienburg has more than its share of
    hoodlums who would not hesitate to strike their enemies with a low blow! Easily secreted,
    knuckledusters used in pairs. Range: Close Combat; Strength: as user; special rules: pair,
    concealable. Pair: knuckledusters are used in pairs, one in each hand; a warrior armed with
    knuckledusters gets an additional attack. Concealable: small enough to stow away in any pocket;
    they do not count towards the two close combat weapons a model may carry and may be used in any
    scenario which prohibits use of weapons, such as 'Last Orders!' or 'Pit of Blood'. 5 gold
    crowns, Rare 6.
  source_refs:
  - manual: broheim.net
    printed_page: 2
    section: Low Kings special equipment / Knuckledusters
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Low%20Kings.pdf
  combat_status: out_of_scope
