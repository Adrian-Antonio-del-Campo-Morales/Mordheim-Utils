- id: cursed_pistol
  kind: ranged-weapon
  tags:
  - blackpowder
  name: Cursed Pistol
  name_i18n:
    es: Pistola Maldita
  effect: >-
    A pistol that has been dragged into the depths of the ocean, clasped tight in the death grip of
    its former master. It's not very reliable, but never seems to run out of shot or powder; the
    black metal is always chilly to the touch, even on the hottest of days. Range 6", Strength 4,
    special rules: prepare shot, save modifier, hand-to-hand, cursed aim, inhuman. Save modifier: a
    model wounded must take its armour save with a -2 modifier. Hand-to-hand: a model armed with a
    cursed pistol and another close combat weapon gains +1 Attack resolved at Strength 4 with a -2
    save modifier, once per combat; a brace fights with 2 Attacks in the first turn, requiring
    natural 6s to hit but may be parried by a warrior with Cutlass Master or Master of Blades.
    Cursed aim: the gun will only hit targets on a natural roll of 6 to hit, but receives no
    positive or negative modifiers from any source, including cover, range, moving or ballistic
    skill; it will never misfire, and water and rain has no penalty on the gunpowder; it may only
    fire at non-Hiding models that it can see. Inhuman: the inner workings of the gun are
    supernatural — it may not use Fine Powder, Superior Gunpowder, Silver Bullets or any other type
    of enhancer, and no living model may ever fire it. 5 gc (10 for a brace), common (Ghosts only in
    the Ghost equipment list).
  effect_i18n:
    es: >-
      Una pistola arrastrada a las profundidades del océano, aferrada en el puño de la muerte de su
      antiguo dueño. No es muy fiable, pero nunca parece quedarse sin balas ni pólvora; el metal negro
      siempre está frío al tacto, incluso en los días más calurosos. Alcance 6", Fuerza 4, reglas
      especiales: Prepara el disparo, Modificador de salvación, Cuerpo a cuerpo, Punta Maldita,
      Inhumana. Modificador de salvación: un modelo herido debe realizar su salvación de armadura con
      un modificador de -2. Cuerpo a cuerpo: un modelo armado con una pistola maldita y otra arma de
      combate gana +1 Ataque resuelto a Fuerza 4 con un modificador de salvación de -2, una vez por
      combate; una pareja pelea con 2 Ataques en el primer turno, golpeando solo con 6 naturales, pero
      puede ser detenida por un guerrero con Maestro del Sable o Maestro de las Hojas. Punta Maldita:
      el arma solo golpea a los objetivos con un 6 natural para impactar, pero no recibe modificadores
      positivos ni negativos de ninguna fuente, incluidas cobertura, alcance, movimiento o Habilidad
      de Disparo; nunca falla el disparo, y el agua y la lluvia no penalizan la pólvora; solo puede
      disparar a modelos visibles que no estén Ocultos. Inhumana: el mecanismo interno del arma es
      sobrenatural; no puede usar Pólvora Fina, Pólvora Superior, Balas de Plata ni cualquier otro
      tipo de potenciador, y ningún modelo vivo puede dispararla. 5 gc (10 por una pareja), común
      (solo Fantasmas en la lista de equipo de Fantasmas).
  source_refs:
  - manual: broheim.net
    printed_page: 2
    section: Ghost Pirates special equipment / Cursed Pistol
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Ghost%20Pirates.pdf
  combat_status: out_of_scope
