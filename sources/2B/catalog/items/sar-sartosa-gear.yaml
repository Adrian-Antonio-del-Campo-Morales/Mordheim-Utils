schema_version: 2
ruleset: mordheim
items:
- id: booma_pistol
  kind: ranged-weapon
  tags:
  - blackpowder
  name: Booma Pistol
  name_i18n:
    es: Pistola Booma
  effect: >-
    Maximum range: special; Strength: 5; special rules: volatile, prepare shot, hand-to-hand,
    varying range, never superior. Volatile: when firing the Booma Pistol in hand to hand combat it
    suffers a Blackpowder Misfire on a natural roll of 1; when firing in the shooting phase it
    misfires on a roll of "Misfire" on the Artillery Dice; if a Booma Pistol explodes it deals a S5
    attack to the firer instead of Strength 4. Prepare shot: a pistol takes a whole turn to reload
    so you may only fire every other turn (a brace may fire every turn). Hand-to-hand: a model armed
    with a pistol and another close combat weapon gains +1 Attack resolved at Strength 5, usable
    once per combat. Varying range: the range of the weapon is randomly determined each shot by an
    artillery dice roll. Never superior: Booma Pistols are barely able to handle the crudest
    gunpowder; it may never use Superior Gunpowder (Refined Gunpowder is allowed). Booma Tweaker:
    during any game that includes your Enjuneer, any time you roll for the range of a Booma Pistol
    and do NOT roll a Misfire result you may re-roll the result once. 20 gc (40 for a brace),
    common, greenskins only (Enjuneer only in the Enjuneer list).
  effect_i18n:
    es: >-
      Alcance máximo: especial; Fuerza: 5; reglas especiales: Volátil, Prepara el disparo, Cuerpo a
      cuerpo, Alcance variable, Nunca superior. Volátil: al disparar la Pistola Booma en combate
      cuerpo a cuerpo sufre un Fallo de Pólvora con un 1 natural; al disparar en la fase de disparo
      falla con un resultado de 'Fallo' en el Dado de Artillería; si una Pistola Booma explota, causa
      un ataque de F5 al tirador en lugar de Fuerza 4. Prepara el disparo: una pistola tarda un turno
      entero en recargarse, así que solo puedes disparar en turnos alternos (una pareja puede disparar
      cada turno). Cuerpo a cuerpo: un modelo armado con una pistola y otra arma de combate gana +1
      Ataque resuelto a Fuerza 5, utilizable una vez por combate. Alcance variable: el alcance del
      arma se determina aleatoriamente en cada disparo con una tirada de dado de artillería. Nunca
      superior: las Pistolas Booma apenas soportan la pólvora más cruda; nunca pueden usar Pólvora
      Superior (sí se permite Pólvora Refinada). Booma Tweaker: durante cualquier partida en la que
      participe tu Enjuneer, cada vez que tires para determinar el alcance de una Pistola Booma y NO
      obtengas un resultado de Fallo, puedes repetir ese resultado una vez. 20 gc (40 por una pareja),
      común, solo Pieles Verdes (solo Enjuneer en la lista del Enjuneer).
  source_refs:
  - manual: broheim.net
    printed_page: 2
    section: Orc Pirates & Savage Orcs special equipment / Booma Pistol
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Orc%20Pirates%20%26%20Savage%20Orcs.pdf
  - manual: broheim.net
    printed_page: 2
    section: Orc Pirates equipment list / Booma Pistol
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Orc%20Pirates%20%26%20Savage%20Orcs.pdf
  combat_status: out_of_scope
- id: cathayan_plate_armour
  kind: armour
  name: Cathayan Plate Armour
  name_i18n:
    es: Armadura de Placas de Cathay
  effect: >-
    The Cathayan blacksmiths forge these heavy armours for the noble knights that protect the
    farmsteads; especially among the Palace Guard of the Cathayan Emperor the plate armour is very
    common. The armour covers not only its wearer's torso but also his upper arms and parts of his
    legs. Save: a warrior wearing Cathayan plate armour has a basic D6 saving throw of 4+. Movement:
    a warrior equipped with both plate armour and a shield suffers a -1 Movement penalty. 120 gold
    crowns, Rare 11.
  effect_i18n:
    es: >-
      Los herreros de Cathay forjan estas pesadas armaduras para los nobles caballeros que protegen
      las granjas; en especial entre la Guardia Palatina del Emperador de Cathay la armadura de placas
      es muy común. La armadura cubre no solo el torso del portador, sino también la parte superior de
      los brazos y partes de las piernas. Salvación: un guerrero que lleve armadura de placas de
      Cathay tiene una tirada básica de salvación de 4+. Movimiento: un guerrero equipado con armadura
      de placas y escudo sufre una penalización de -1 al Movimiento. 120 coronas de oro, Rara 11.
  source_refs:
  - manual: broheim.net
    printed_page: 2
    section: Pirates of the Cathayan Sea special equipment / Cathayan Plate Armor
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Pirates%20of%20the%20Cathayan%20Sea.pdf
  combat_status: out_of_scope
- id: katana
  kind: close-combat-weapon
  name: Katana
  name_i18n:
    es: Katana
  effect: >-
    Katanas are great-swords that are usually used by Cathayan Soldiers and Ronins. Range: Close
    Combat; Strength: as user +1; special rules: two-handed, parry. Two-handed: a model armed with a
    katana may not use a shield, buckler or additional weapon in close combat; however it gets an
    additional +1 armour save bonus against ranged attacks if it carries a shield. Parry: katanas,
    despite their great size, can be used for parrying like a sword — when his opponent rolls to
    hit, the model armed with a katana may roll a D6; if the score is greater than the highest to
    hit score of his opponent the blow is parried and discarded; a model may not parry attacks made
    with double or more its own Strength. 20 gold crowns, Rare 10 (Heroes only).
  effect_i18n:
    es: >-
      Las katanas son espadas grandes que suelen usar los soldados y los ronin de Cathay. Alcance:
      cuerpo a cuerpo; Fuerza: la del usuario +1; reglas especiales: a dos manos, Parada. A dos manos:
      un modelo armado con una katana no puede usar escudo, broquel ni arma adicional en combate
      cuerpo a cuerpo; sin embargo, obtiene un +1 adicional a la salvación de armadura contra ataques
      a distancia si lleva escudo. Parada: las katanas, a pesar de su gran tamaño, pueden usarse para
      detener golpes como una espada; cuando su oponente tira para golpear, el modelo armado con una
      katana puede tirar 1D6; si el resultado es mayor que la tirada más alta para golpear de su
      oponente, el golpe queda detenido y se descarta; un modelo no puede detener ataques hechos con
      el doble o más de su propia Fuerza. 20 coronas de oro, Rara 10 (solo Héroes).
  source_refs:
  - manual: broheim.net
    printed_page: 2
    section: Pirates of the Cathayan Sea special equipment / Katana
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Pirates%20of%20the%20Cathayan%20Sea.pdf
  mechanic_id: weapon.katana
  combat_status: implemented
- id: dueling_pistol
  kind: ranged-weapon
  name: Dueling Pistol
  name_i18n:
    es: Pistola de Duelo
  effect: >-
    Range 10", Strength 4, accuracy: built for accuracy as a skilled duellist is able to hit a coin
    from twenty paces; prepare shot; hand-to-hand. Bretonnian special rule: when shooting with
    Pistols and Dueling Pistols a Bretonnian hero treats the initial 6"/10" respectively as Short
    range (with Eagle Eye the additional 6" counts as Long range); at warband creation Bretonnians
    may purchase dueling pistols for 25 gc each (50 for a brace). NOTE: the active KB already
    contains the identical core-rulebook weapon as `duelling_pistol` — at promotion, re-point band
    lists to the KB id and keep this entry's source refs there instead of creating a duplicate. 30
    gc (60 for a brace); 25 gc for Bretonnians.
  source_refs:
