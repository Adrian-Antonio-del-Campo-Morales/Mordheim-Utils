- id: hellblade
  kind: close-combat-weapon
  name: Hellblade
  name_i18n:
    es: Hoja Infernal
  effect: >-
    A rare blade charged with the power of Khorne himself. On land it is rare to see them out of the
    hands of a Bloodletter, but on the high seas the stability of Demons ebbs and flows with the
    tide; Khorne instead sends his signature weapons in the hands of worthy pirates, so they may
    paint the seas red. Range: Close Combat; Strength: as user +1; special rules: soulseeking,
    two-handed, deadly, magical. Soulseeking: all attacks made with a Hellblade are at +1 to hit —
    this does not work on Undead or Demon models. Two-handed: a model armed with a Hellblade may not
    use a shield, buckler or additional weapon in close combat (a shield still gives +1 armour save
    against shooting). Deadly: a Hellblade causes critical hits on rolls of 5 or 6 — this rule does
    not apply if the warrior requires 5s or higher to wound. Magical: all attacks count as magical;
    a Hellblade cannot be made of Gromril, Ithilmar or similar mortal metals. 35 gc, Rare 8, Khorne
    warbands only (Captain only in the Pirate equipment list).
  effect_i18n:
    es: >-
      Una hoja rara cargada con el poder del propio Khorne. En tierra es raro verlas fuera de las
      manos de un Bloodletter, pero en alta mar la estabilidad de los Demonios fluctúa con la marea;
      Khorne envía en cambio sus armas características a manos de piratas dignos, para que puedan
      teñir los mares de rojo. Alcance: cuerpo a cuerpo; Fuerza: la del usuario +1; reglas especiales:
      Buscadora de Almas, a dos manos, Mortífera, Mágica. Buscadora de Almas: todos los ataques hechos
      con una Hoja Infernal golpean con +1; no funciona contra modelos No Muertos ni Demonios. A dos
      manos: un modelo armado con una Hoja Infernal no puede usar escudo, broquel ni arma adicional en
      combate cuerpo a cuerpo (un escudo sigue dando +1 a la salvación de armadura contra disparos).
      Mortífera: una Hoja Infernal causa impactos críticos con tiradas de 5 o 6; esta regla no se
      aplica si el guerrero necesita 5 o más para herir. Mágica: todos los ataques cuentan como
      mágicos; una Hoja Infernal no puede estar forjada en Gromril, Ithilmar ni metales mortales
      similares. 35 gc, Rara 8, solo bandas de Khorne (solo Capitán en la lista de equipo de Piratas).
  source_refs:
  - manual: broheim.net
    printed_page: 2
    section: Khorne Raiders special equipment / Hellblade
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Khorne%20Raiders.pdf
  combat_status: implemented
  mechanic_id: weapon.hellblade
