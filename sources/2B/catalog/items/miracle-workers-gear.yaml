schema_version: 2
ruleset: mordheim
# White wolf pelt cloak of the Wolf-Priests of Ulric (Miracle Workers chapter,
# Werekin — Liber Malefic; the priest article of the Mutiny in Marienburg
# project). Resolves the `wolf_pelt_cloak` reference from the chapter's
# hireling profiles (previously a deliberately dangling ref).
#
# Distinct from the KB's existing cloak-class items — do NOT merge at
# promotion without an equivalence review:
# - `wolfcloak` (KB catalog/items/out-of-scope.yaml): Middenheim hunt cloak,
#   acquired via a Strength test hunt, +1 armour saves vs shooting only.
# - `lion_cloak`-class Lustria hides: different item entirely.
# The pelt's effect is a plain 6+ saving throw usable in place of armour.
items:
- id: wolf_pelt_cloak
  kind: combat-equipment
  name: White Wolf Pelt Cloak
  name_i18n:
    es: Capa de Piel de Lobo Blanco
  effect: >-
    Wolf-Priests of Ulric may never wear armour, trusting in Ulric's protection. The only exception
    is that every Wolf-Priest is garbed in a cloak made from the pelt of a white wolf; the pelt
    allows a 6+ saving throw.
  effect_i18n:
    es: >-
      Los Sacerdotes Lobo de Ulric nunca pueden llevar armadura, confiando en la protección de
      Ulric. La única excepción es que cada Sacerdote Lobo viste una capa hecha con la piel de un
      lobo blanco; la piel concede una tirada de salvación de 6+.
  source_refs:
  - manual: liber-malefic
    printed_page: 9
    section: Wolf-Priest of Ulric / Strictures
    url: https://www.scribd.com/document/241727651/Miracle-workers-in-Mordheim
  combat_status: implemented
  mechanic_id: defence.wolf-pelt-cloak
  tags:
  - constant-save-cloak

- id: ceremonial_scythe
  kind: close-combat-weapon
  name: Ceremonial Scythe
  name_i18n:
    es: Guadaña Ceremonial
  effect: 'Range: Close combat. Strength: As user +1. Difficult to use, Two-handed: cannot use a second weapon, shield or buckler while wielding it.'
  effect_i18n:
    es: 'Alcance: Combate cuerpo a cuerpo. Fuerza: como el usuario +1. Difícil de usar, A dos manos: no puede usar una segunda arma, escudo o rodela mientras la empuña.'
  source_refs:
  - manual: liber-malefic
    printed_page: 5
    section: Priests for Every Occasion / Priest of Morr / Ceremonial Scythe
  combat_status: implemented
  mechanic_id: weapon.ceremonial-scythe
