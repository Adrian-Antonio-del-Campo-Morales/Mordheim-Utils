schema_version: 2
ruleset: mordheim
items:
- id: elven_bow
  kind: ranged-weapon
  name: Elven Bow
  name_i18n:
    es: Arco Élfico
  effect: >-
    Masterwork elven bow of the High Elves (Ranger only in the Ranger equipment list). No separate
    special-rules paragraph is printed beyond the list entries (treat as a long bow unless the
    review pass finds otherwise). 35 gc.
  source_refs:
  - manual: broheim.net
    printed_page: 3
    section: High Elves Ranger equipment list / Elven Bow
    url: https://broheim.net/downloads/warbands/supplement/lustria/High%20Elves.pdf
  combat_status: out_of_scope
- id: mage_staff_of_hoeth
  kind: close-combat-weapon
  name: Mage Staff of Hoeth
  name_i18n:
    es: Bastón Mágico de Hoeth
  effect: >-
    Mage Staves of Hoeth are forged from the finest Ithilmar, and are works of art that are truly
    beautiful to behold. They are usually decorated with gems and other precious materials. Only a
    Loremaster may use a Mage Staff. Range: Close Combat; Strength: as user, as user +1; special
    rules: one or two-handed, concussion. One or Two-handed: a Mage Staff of Hoeth can be used
    either one or two-handed; when used one-handed a Mage Staff counts as a club; when using a Mage
    Staff in two hands it counts as a club and gives the Loremaster +1 Strength. 20 gold crowns,
    Rare 10, High Elf Loremaster only.
  source_refs:
  - manual: broheim.net
    printed_page: 3
    section: Special High Elven Equipment / Mage Staff of Hoeth
    url: https://broheim.net/downloads/warbands/supplement/lustria/High%20Elves.pdf
  combat_status: out_of_scope
- id: throwing_knife
  kind: ranged-weapon
  name: Throwing Knife
  name_i18n:
    es: Cuchillo de Lanzamiento
  effect: >-
    Balanced throwing knife as listed in the Woodsmen de Artois missile weapons. NOTE: the active
    KB already contains `throwing_knives` (plural id) — at promotion re-point band lists to the KB
    id rather than keeping this variant. 15 gc.
  source_refs:
  - manual: broheim.net
    printed_page: 3
    section: Woodsmen de Artois Missile Weapons / Throwing Knife
    url: https://broheim.net/downloads/warbands/supplement/mousillon/Woodsmen%20de%20Artois.pdf
  combat_status: out_of_scope
- id: horsemans_hammer
  kind: close-combat-weapon
  name: Horseman's Hammer
  name_i18n:
    es: Martillo de Jinete
  effect: >-
    Range: Close Combat; Strength: as user +1. Two-handed: a model armed with a Horseman's Hammer
    may not use a shield, buckler or additional weapon in close combat; if the model is equipped
    with a shield he will still get a +1 bonus to his armour save against shooting. 30 GC
    (Knights of the Bitter Moors cavalry list). NOTE: the active KB already contains
    `horsemans_hammer` with identical rules — at promotion merge this entry's source ref into the
    KB item and re-point band lists to the KB id.
  source_refs:
  - manual: broheim.net
    printed_page: 2
    section: Knights of the Bitter Moors equipment list / Horsemens Hammer
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Knights%20Of%20The%20Bitter%20Moors.pdf
  combat_status: out_of_scope
- id: field_trebuchet
  kind: out-of-scope
  name: Field Trebuchet
  name_i18n:
    es: Trébuchet de Campaña
  effect: >-
    Profile: M* WS- BS- S- T7 W3 I- A- Ld-. Range 12"-48"; strength: special; special rules: hard
    to fire, large target, constructed, ammo for all occasions, explosive radius, artillery. Hard
    to fire: the Trebuchet can fire once every other turn with two crew. Constructed: the Field
    Trebuchet is a large contraption which cannot be moved when set up; at the start of a match the
    Trebuchet starts as 4 small crates carried by the operating crew (4 non-Knight models, at least
    until it is set up; only Men-at-Arms may operate it); finding a suitable spot takes D3 turns to
    set up; once set up it cannot move but may swivel on the spot; deconstructing takes 1 turn;
    only Bretonnian Henchmen and Squires know anything about the siege weapon and no one else may
    deconstruct it. Artillery: the Trebuchet is a siege weapon. Availability: special — takes
    D3+1 games to build if not bought at the start of the campaign. Mounted Yeomen may not be
    fielded with the Trebuchet (one or the other). 175 gold crowns.
  source_refs:
  - manual: broheim.net
    printed_page: 2
    section: Knights of the Bitter Moors Bretonnian Special Equipment / Field Trebuchet
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Knights%20Of%20The%20Bitter%20Moors.pdf
  combat_status: out_of_scope
- id: dragon_cloak
  kind: armour
  name: Dragon Cloak
  name_i18n:
    es: Capa de Dragón
  effect: >-
    Cloak of dragonhide listed in the Dark Elf Corsairs miscellaneous equipment. NOTE: the active
    KB already contains the Sea Dragon Cloak (`sea_dragon_cloak`) covering the Dark Elf cloak
    concept — at promotion, merge this source ref into the KB entry and re-point band lists rather
    than creating a duplicate. 50 gc.
  source_refs:
  - manual: broheim.net
    printed_page: 2
    section: Dark Elf Corsairs Miscellaneous Equipment / Dragon Cloak
    url: https://broheim.net/downloads/warbands/supplement/mousillon/Dark%20Elf%20Corsairs.pdf
  combat_status: out_of_scope
- id: repeating_crossbow
  kind: ranged-weapon
  name: Repeating Crossbow
  name_i18n:
    es: Ballesta de Repetición
  effect: >-
    Rapid-fire crossbow of the Dark Elf Corsairs (Heroes list). Fires multiple bolts per turn per
    the Dark Elf repeating crossbow rules. 35 gc.
  source_refs:
  - manual: broheim.net
    printed_page: 2
    section: Dark Elf Corsairs Missile Weapons / Repeating Crossbow
    url: https://broheim.net/downloads/warbands/supplement/mousillon/Dark%20Elf%20Corsairs.pdf
  combat_status: out_of_scope
- id: book_of_bad_ideas
  kind: combat-equipment
  name: Book of Bad Ideas
  name_i18n:
    es: Libro de las Malas Ideas
  effect: >-
    Ancestor-weapon of the Guild of Disgraced Engineers. Leader: in the event the Expelled Engineer
    dies, he will pass the Book of Bad Ideas onto an Apprentice Engineer, who will take over the
    title of Engineer, allowing him to take the inventor special rule and hire a new apprentice.
    Dwarfs who take the book argue that if their newest idea is a great idea, then many of their
    forefathers may have also been sound — hence they take the book of bad ideas, to prove these
    inventions worthy of going down in the annals of dwarf history. 50 gc (warband equipment;
    carried, not bought separately).
  source_refs:
  - manual: broheim.net
    printed_page: 3
    section: Guild of Disgraced Engineers / Book of Bad Ideas
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Guild%20Of%20Disgraced%20Engineers.pdf
  combat_status: out_of_scope
