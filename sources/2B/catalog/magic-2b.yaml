lores:
- id: lore.songs-of-sorrow
  name: Songs of Sorrow
  name_i18n:
    es: Cantos del Pesar
  note: A simple form of Necromancy, fueled not by scrolls and ancient prayers, but by a Sea Singer's
    fevered mind and pure willpower. (Ghost Pirates of Sartosa, p. 5.)
  spells:
  - id: spell.songs-of-sorrow.sirens-call
    roll: '1'
    name: Siren's Call
    name_i18n:
      es: Llamada de la Sirena
    difficulty: 10
    effect: >-
      The maiden sings the hymn of the sea, luring unwary warriors to follow her every whim. The
      spell has a range of 6" and must be cast on the closest enemy model. Roll a D6 and add the Sea
      Singer's Leadership to the score. Then roll a D6 and add the target's Leadership to the score,
      with a -1 modifier to the model's Leadership. If the Singer beats his opponent's score, she
      gains control of the model until the model passes a Leadership test in his own recovery phase,
      also with a -1 modifier. The model may not commit suicide, but can attack models on his own
      side, and will not fight warriors from the Chaos Mage's warband. If he was engaged in
      hand-to-hand combat with any warriors from your warband, they will immediately move 1" apart.
    effect_i18n:
      es: >-
        La doncella canta el himno del mar, tentando a los guerreros desprevenidos a seguir sus
        caprichos. El hechizo tiene un alcance de 6" y debe lanzarse contra la miniatura enemiga más
        cercana. Lanza un D6 y suma al resultado la Liderazgo de la Cantora del Mar. Después lanza
        un D6 y suma al resultado el Liderazgo del objetivo, con un modificador de -1 al Liderazgo
        de la miniatura. Si la Cantora supera la puntuación de su oponente, toma el control de la
        miniatura hasta que esta supere una tirada de Liderazgo en su propia fase de recuperación,
        también con un modificador de -1. La miniatura no puede suicidarse, pero puede atacar a
        miniaturas de su propio bando, y no luchará contra los guerreros de la banda del Mago del
        Caos. Si estaba empeñada en combate cuerpo a cuerpo con guerreros de tu banda, estos se
        separarán inmediatamente 1".
  - id: spell.songs-of-sorrow.march-of-sorrow
    roll: '2'
    name: March of Sorrow
    name_i18n:
      es: Marcha del Pesar
    difficulty: 7
    effect: >-
      Like the ebb and flow of the sea, a surge of power rushes over the graveborn. The Sea Singer
      and all friendly Zombies and Skeletons within 6" of her may immediately move up to 1D3+1
      inches in any direction. If this brings them in contact with an opposing model, it counts as a
      charge.
    effect_i18n:
      es: >-
        Como el flujo y reflujo del mar, una oleada de poder recorre a los nacidos de la tumba. La
        Cantora del Mar y todos los Zombis y Esqueletos amigos dentro de 6" de ella pueden moverse
        inmediatamente hasta 1D3+1 pulgadas en cualquier dirección. Si esto los pone en contacto con
        una miniatura enemiga, cuenta como una carga.
  - id: spell.songs-of-sorrow.wraiths-dirge
    roll: '3'
    name: Wraith's Dirge
    name_i18n:
      es: Endecha del Espectro
    difficulty: 9
    effect: >-
      The Sea Singer chants a dark song and points her pale fingers at one of her adversaries, who
      feels the very air sucked from their lungs. Must target the closest opponent within 6". That
      model must immediately roll on the injury chart. If this spell is successful, the Sea Singer
      may not attack in the close combat phase. Roll for injury even if the model has more than 1
      wound. A successful roll of 'Out of Action' causes 1 wound.
    effect_i18n:
      es: >-
        La Cantora del Mar entona una canción oscura y apunta con sus dedos pálidos a uno de sus
        adversarios, que siente cómo el aire le es arrancado de los pulmones. Debe seleccionar al
        oponente más cercano dentro de 6". Esa miniatura debe tirar inmediatamente en la tabla de
        heridas. Si el hechizo tiene éxito, la Cantora del Mar no puede atacar en la fase de combate
        cuerpo a cuerpo. Tira por la herida aunque la miniatura tenga más de 1 herida. Un resultado
        de 'Fuera de combate' causa 1 herida.
  - id: spell.songs-of-sorrow.lovers-lament
    roll: '4'
    name: Lover's Lament
    name_i18n:
      es: Lamento de la Amante
    difficulty: 6
    effect: >-
      The Sea Singer sings her favorite hymn, the one that reminds her of her love, and reanimates
      the fallen with a shadow of hope. This spell brings back into play any Bloated taken out of
      action last turn. It may also be used to resurrect a Gibbet, but the difficulty is 2 higher (8
      instead of 6). If successful, place the resurrected model within 6" of the Sea Singer. It may
      not be placed into hand-to-hand combat with an enemy model.
    effect_i18n:
      es: >-
        La Cantora del Mar canta su himno favorito, el que le recuerda a su amor, y reanima a los
        caídos con una sombra de esperanza. Este hechizo devuelve al juego a cualquier Hinchado que
        quedara Fuera de combate el turno anterior. También puede usarse para resucitar a un
        Ahusado, pero la dificultad es 2 puntos mayor (8 en lugar de 6). Si tiene éxito, coloca la
        miniatura resucitada dentro de 6" de la Cantora del Mar. No puede colocarse en combate
        cuerpo a cuerpo con una miniatura enemiga.
  - id: spell.songs-of-sorrow.song-of-discord
    roll: '5'
    name: Song of Discord
    name_i18n:
      es: Canción de la Discordia
    difficulty: 9
    effect: >-
      The Sea Singer's voice raises to notes piercing and eerie, until the nerves of her enemies are
      weak and frayed. Any opposing warriors within 6" of the Sea Singer must reroll all successful
      Leadership Tests, unless they are immune to psychology.
    effect_i18n:
      es: >-
        La voz de la Cantora del Mar se eleva hasta notas penetrantes y escalofriantes, hasta que
        los nervios de sus enemigos quedan débiles y deshilachados. Todos los guerreros enemigos
        dentro de 6" de la Cantora del Mar deben repetir todas las tiradas de Liderazgo exitosas, a
        menos que sean inmunes a la psicología.
  - id: spell.songs-of-sorrow.hymn-of-rebirth
    roll: '6'
    name: Hymn of Rebirth
    name_i18n:
      es: Himno del Renacimiento
    difficulty: 5
    effect: >-
      In the hopes of bringing back her own true love, the Sea Singer has mastered the song of
      rebirth, to call the dead alive, albeit without mind or soul. This spell may be cast once each
      time an enemy Hero dies (i.e. a roll of 11-15 on the serious injury table). If successfully
      cast, the hero is raised as a Skeleton (see the rules for Skeleton Mates) and forms a brand
      new Henchmen group. He retains all weapons and armour, but may not use any other items. He
      loses any ability to use spells and cannot gain experience, but he retains his characteristics
      and any non-spell skills he had. If the spell is unsuccessful, the hero becomes a Bloated
      instead, and has the same rules and stats as any normal Bloated model (you may still keep his
      equipment).
    effect_i18n:
      es: >-
        Con la esperanza de recuperar a su verdadero amor, la Cantora del Mar ha dominado la canción
        del renacimiento, para llamar a los muertos a la vida, aunque sea sin mente ni alma. Este
        hechizo puede lanzarse una vez cada vez que muere un Héroe enemigo (es decir, con un
        resultado de 11-15 en la tabla de heridas graves). Si se lanza con éxito, el héroe se alza
        como un Esqueleto (ver las reglas de los Compañeros Esqueleto) y forma un grupo nuevo de
        Peones. Conserva todas las armas y la armadura, pero no puede usar otros objetos. Pierde
        toda capacidad de lanzar hechizos y no puede ganar experiencia, pero conserva sus
        características y sus habilidades no mágicas. Si el hechizo falla, el héroe se convierte en
        un Hinchado, con las mismas reglas y características que cualquier Hinchado normal (aun así
        puedes quedarte con su equipo).
  source_refs:
  - manual: broheim.net
    printed_page: 5
    section: Songs of Sorrow
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Ghost%20Pirates.pdf
- id: lore.wood-elven-spells
  name: Wood Elven Spell List
  name_i18n:
    es: Lista de Hechizos Silvanos
  note: Spell list of the Wood Elves of Arden (Mousillon supplement). The Forest Mage randomly chooses
    one spell from this list.
  spells:
  - id: spell.wood-elven-spells.song-of-thorns
    roll: '1'
    name: Song of Thorns
    name_i18n:
      es: Canción de Espinas
    difficulty: 8
    effect: >-
      Branches strike out to the foe under influence of the singer cadence; if no plants are present
      wooden chips fly at the victim, as if they want to be thorns; the victim suffers 2D6 S1 hits,
      range 8".
    effect_i18n:
      es: >-
        Las ramas golpean al enemigo al compás del canto; si no hay plantas, virutas de madera
        vuelan hacia la víctima como queriendo ser espinas; la víctima sufre 2D6 impactos de F1,
        alcance 8".
  - id: spell.wood-elven-spells.murmuring-of-the-wind
    roll: '2'
    name: Murmuring of the Wind
    name_i18n:
      es: Murmullo del Viento
    difficulty: 7
    effect: >-
      Very softly the wind increases around the caster and takes him wherever he wants; the caster
      may move anywhere within 12", if he gets into HtH it counts as a charge.
    effect_i18n:
      es: >-
        Muy suavemente, el viento se intensifica alrededor del lanzador y lo lleva donde quiera; el
        lanzador puede moverse a cualquier punto dentro de 12"; si entra en combate cuerpo a cuerpo,
        cuenta como carga.
  - id: spell.wood-elven-spells.the-rain-song
    roll: '3'
    name: The Rain Song
    name_i18n:
      es: La Canción de la Lluvia
    difficulty: 9
    effect: >-
      The air around the caster becomes moist and it starts to rain, until it looks like a major
      downpour; everything, except Wood Elves, within 6" of the caster suffers -1 to hit and suffers
      -1 Initiative; lasts until the beginning of the caster's next magic phase.
    effect_i18n:
      es: >-
        El aire alrededor del lanzador se humedece y empieza a llover, hasta parecer un auténtico
        diluvio; todo lo que esté dentro de 6" del lanzador, salvo los Elfos Silvanos, sufre -1 por
        impactar y -1 de Iniciativa; dura hasta el principio de la próxima fase de magia del
        lanzador.
  - id: spell.wood-elven-spells.lyrics-of-feral-infatuation
    roll: '4'
    name: Lyrics of Feral Infatuation
    name_i18n:
      es: Letras de Enamoramiento Feral
    difficulty: 8
    effect: >-
      This soothing song seems to calm even the most ferocious monsters and sends them into a sort
      of lethargic state; any animal or monster has to pass a Ld-test, on his own Ld, in order to
      attack an opponent; if it fails it will do nothing else that turn, not even fighting back if
      attacked.
    effect_i18n:
      es: >-
        Esta canción relajante parece calmar incluso a los monstruos más feroces y los sume en una
        especie de estado letárgico; cualquier animal o monstruo debe superar una tirada de Ld, con
        su propia Ld, para atacar a un oponente; si la falla, no hará nada más ese turno, ni
        siquiera defenderse si es atacado.
  - id: spell.wood-elven-spells.song-of-the-sun
    roll: '5'
    name: Song of the Sun
    name_i18n:
      es: Canción del Sol
    difficulty: 6
    effect: >-
      While the caster sings his victim thinks he is in a scorching desert; his movement slows and
      he might suffer from heat stroke; the target within 18" is -1 M until the caster's next magic
      phase, and he also must make a T-test; if he fails, he suffers a S4 hit.
    effect_i18n:
      es: >-
        Mientras el lanzador canta, su víctima cree estar en un desierto abrasador; su movimiento se
        ralentiza y puede sufrir una insolación; el objetivo dentro de 18" sufre -1 M hasta la
        próxima fase de magia del lanzador, y además debe superar una tirada de T; si la falla,
        sufre un impacto de F4.
  - id: spell.wood-elven-spells.eagles-cry
    roll: '6'
    name: Eagle's Cry
    name_i18n:
      es: Grito del Águila
    difficulty: 8
    effect: >-
      The caster utters a melodious cry, which sounds like a great eagle; this inspires the elves so
      much they gain the legendary sight of Thuarindir; all Wood Elves within 6" gain +1 on to hit
      and +1 on the critical hittable; lasts until the beginning of the caster's next magic phase.
    effect_i18n:
      es: >-
        El lanzador profiere un grito melodioso que suena como un gran águila; esto inspira tanto a
        los elfos que obtienen la legendaria vista de Thuarindir; todos los Elfos Silvanos dentro de
        6" ganan +1 por impactar y +1 para recibir golpes críticos; dura hasta el principio de la
        próxima fase de magia del lanzador.
  source_refs:
  - manual: broheim.net
    printed_page: 2
    section: Special Rules / Woodland Incantations
    url: https://broheim.net/downloads/warbands/supplement/mousillon/Wood%20Elves%20of%20Arden.pdf
- id: lore.lothern-sea-spells
  name: Spells of the Lothern Sea
  name_i18n:
    es: Hechizos del Mar de Lothern
  note: 'VARIANT of the KB Djedhi lore (lore.spells-of-the-djedhi), stated in full the way the KB keeps
    its own reprints (lore.necromancy-restless-dead, lore.onogal-rituals): the source reprints five of
    the Djedhi spells and the fourth spell, Mistress of the Deep (D8), replaces Fleeting Shadows. Source
    note: "Most of the following spells are taken from the ''Djed-Hi Spell List'' from the ''Elven Mage
    Hired Sword'' by Jake Thornton. The exception is the 4th spell, ''Mistress of the Deep'', which replaces
    the spell ''Fleeting Shadows''."'
  spells:
  - id: spell.lothern-sea-spells.divination-of-shirath
    roll: '1'
    name: Divination of Shirath
    difficulty: 6
    effect: >-
      The Mage may reroll all his failed dice rolls, though the second result stands. The effect
      lasts until the beginning of the Mage's next turn.
    effect_i18n:
      es: >-
        El Mago puede repetir todas sus tiradas de dado fallidas, aunque el segundo resultado es
        definitivo. El efecto dura hasta el principio del siguiente turno del Mago.
    name_i18n:
      es: Adivinación de Shirath
  - id: spell.lothern-sea-spells.shimmering-shield
    roll: '2'
    name: Shimmering Shield
    difficulty: 7
    effect: >-
      This spell gives the Mage an additional unmodified 5+ save against all attacks. The effect
      lasts until the beginning of the Mage's next turn.
    effect_i18n:
      es: >-
        Este conjuro da al Mago una salvación adicional no modificable de 5+ contra todos los
        ataques. El efecto dura hasta el principio del siguiente turno del Mago.
    name_i18n:
      es: Escudo Refulgente
  - id: spell.lothern-sea-spells.statue-of-light
    roll: '3'
    name: Statue of Light
    difficulty: 7
    effect: >-
      The Mage chooses a single enemy model he can see. That model may not move as long as the Mage
      remains both static and alive. The Mage and the target may cast spells normally, but fight in
      close combat at -2 WS, minimum of 1.
    effect_i18n:
      es: >-
        El Mago elige una sola miniatura enemiga que pueda ver. Esa miniatura no puede moverse
        mientras el Mago permanezca estático y vivo. El Mago y el objetivo pueden lanzar conjuros
        con normalidad, pero luchan en combate cuerpo a cuerpo con -2 HA, mínimo 1.
    name_i18n:
      es: Estatua de Luz
  - id: spell.lothern-sea-spells.mistress-of-the-deep
    roll: '4'
    name: Mistress of the Deep
    name_i18n:
      es: Señora de las Profundidades
    difficulty: 8
    effect: >-
      The mage summons a spirit from water, more beauteous than imagined and bewitching to hear.
      Place a man-sized Oceanid model within 6" of the Mist Mage. This model may not move or make
      any actions (it is, for all intents and purposes, scenery rather than a living model). Any
      time an enemy model wants to shoot or declare a charge on your Mist Mage, it must first
      measure the distance between itself and the Oceanid. If the Oceanid is closer than the mage,
      the attacker must first take a Leadership test or be distracted by the Oceanid's singing. If
      the test is failed, the attacker cannot shoot/charge this turn. Once a model has passed a
      test, it does not have to test again for the rest of the game. The spell has no effect against
      models Immune to Psychology. The spell ends when the Mist Mage wants it to, the Mage attempts
      to recast the spell, or the Mage casts another spell. If successfully recast, the Oceanid
      model is moved to any new location within 6" of the Mage.
    effect_i18n:
      es: >-
        El mago invoca un espíritu del agua, más bello de lo imaginable y embrujador de oír. Coloca
        una miniatura de Oceanida de tamaño hombre dentro de 6" del Mago de la Niebla. Esta
        miniatura no puede moverse ni realizar ninguna acción (es, a todos los efectos, escenografía
        en lugar de una miniatura viva). Cada vez que una miniatura enemiga quiera disparar o
        declarar una carga contra tu Mago de la Niebla, primero debe medir la distancia entre ella y
        la Oceanida. Si la Oceanida está más cerca que el mago, el atacante debe superar primero una
        tirada de Liderazgo o quedar distruido por el canto de la Oceanida. Si la tirada falla, el
        atacante no puede disparar ni cargar este turno. Una vez que una miniatura ha superado la
        tirada, no necesita repetirla durante el resto de la partida. El hechizo no afecta a las
        miniaturas Inmunes a la Psicología. El hechizo termina cuando el Mago de la Niebla lo desea,
        cuando el Mago intenta volver a lanzarlo o cuando lanza otro hechizo. Si se relanza con
        éxito, la miniatura de Oceanida se traslada a cualquier nueva posición dentro de 6" del
        Mago.
  - id: spell.lothern-sea-spells.hunters-fury
    roll: '5'
    name: Hunter's Fury
    difficulty: 9
    effect: >-
      The spell summons D3 +1 arrows which the Mage can use to shoot against one enemy model
      following the rules for normal shooting. The arrows have a range of 36". Use the Mage's own
      Ballistic Skill to determine hits, but ignore movement, range and cover penalties. Each arrow
      causes one S3 hit.
    effect_i18n:
      es: >-
        El conjuro invoca D3 +1 flechas que el Mago puede usar para disparar contra una miniatura
        enemiga siguiendo las reglas de disparo normales. Las flechas tienen un alcance de 36". Usa
        la propia Habilidad de Disparo del Mago para determinar los impactos, pero ignora las
        penalizaciones por movimiento, alcance y cobertura. Cada flecha causa un impacto de F3.
    name_i18n:
      es: Furia del Cazador
  - id: spell.lothern-sea-spells.silent-guardian
    roll: '6'
    name: Silent Guardian
    difficulty: 9
    effect: >-
      If the Mage is attacked in close combat, the guardian fights first with WS5, S3, making one
      attack per turn against each enemy that attacks the Mage. The guardian will not leave the
      Mage's side and can only be dispelled if the Mage casts another spell or dies. The guardian
      cannot be attacked in return.
    effect_i18n:
      es: >-
        Si el Mago es atacado en combate cuerpo a cuerpo, el guardián golpea primero con HA5 y F3,
        haciendo un ataque por turno contra cada enemigo que ataque al Mago. El guardián no se
        separará del lado del Mago y solo puede ser disipado si el Mago lanza otro conjuro o muere.
        El guardián no puede ser atacado en respuesta.
    name_i18n:
      es: Guardián Silencioso
  source_refs:
  - manual: broheim.net
    printed_page: 5
    section: Spells of the Lothen Sea
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Lothern%20Sea%20Patrol.pdf
- id: lore.prayers-of-manann
  name: Prayers of Manann
  name_i18n:
    es: Plegarias de Manann
  note: 'SOURCE COMPLETED 2026-09-14: the prayers come from the ''Miracle Workers'' chapter (Werekin/Stuart
    Cresswell, Liber Malefic — the priest article of the Mutiny in Marienburg supplement project; accessible
    copy: scribd document 241727651, ''Miracle Workers in Mordheim'', 18 pages). The shallows-beasts-mim
    Mutant-Priest (servant of Stromfels, Manann''s dark opposite) uses this list, and may receive a Mark
    of Manann on a double advance roll instead of a new skill. The chapter also defines the Mariner-Priest
    of Manann (40 gc, profile 4/3/3/3/3/1/3/1/8, Combat/ Academic/Speed skills, Seafaring +2 S rowing,
    Navigator +/-1 on Nautical Exploration, Marks: One with the Sea, Webbed) and the trident (Close combat,
    Strike first, Parry; rarity 7 per Unknowable Cargo). Casting follows the chapter''s priest rules:
    prayers are cast like spells in the shooting phase, priests may wear armour, prayers cause no critical
    hits. A Priest starts with 12 experience and counts as a Hero.'
  spells:
  - id: spell.prayers-of-manann.blessed-voyage
    roll: '1'
    name: Blessed Voyage
    name_i18n:
      es: Viaje Bendecido
    difficulty: 5
    effect: >-
      Mariner-Priests commune with the fickle God of the Seas at the beginning of every voyage. The
      strength of his divine influence is enough to turn any tide. As long as the Priest began the
      battle upon water, then so long as he remains upon water for the entire duration of the
      battle, any single dice result can be re-rolled during the post battle sequence. Being upon
      water can be defined as standing on a jetty or watercraft, or being submerged in water.
    effect_i18n:
      es: >-
        Los Sacerdotes Marineros comulgan con el caprichoso Dios de los Mares al comienzo de cada
        viaje. La fuerza de su influencia divina basta para cambiar cualquier marea. Mientras el
        Sacerdote comenzara la batalla sobre el agua, y mientras permanezca sobre el agua durante
        toda la batalla, cualquier resultado de dado puede repetirse durante la secuencia posterior
        a la batalla. Estar sobre el agua puede definirse como estar de pie en un embarcadero o
        embarcación, o sumergido en el agua.
  - id: spell.prayers-of-manann.curse-of-the-albatross
    roll: '2'
    name: Curse of the Albatross
    name_i18n:
      es: Maldición del Albatros
    difficulty: 10
    effect: >-
      The wrath of Manann is not to be trifled with. Landlubbers quail as the Priest invokes their
      ultimate doom. Enemy warriors within 24" of the Priest will suffer a critical hit on a roll of
      a 5 or 6 instead of a 6 for the next round of close combat.
    effect_i18n:
      es: >-
        No debe burlarse la ira de Manann. Los grumos se acobardan cuando el Sacerdote invoca su
        perdición definitiva. Los guerreros enemigos dentro de 24" del Sacerdote sufren un golpe
        crítico con un resultado de 5 o 6 en lugar de 6 durante la siguiente ronda de combate cuerpo
        a cuerpo.
  - id: spell.prayers-of-manann.drowned-mans-face
    roll: '3'
    name: Drowned Man's Face
    name_i18n:
      es: Rostro del Ahogado
    difficulty: 7
    effect: >-
      A seasoned Mariner-Priest chants prayer to beseech Manann to impede the unfaithful. The
      enemies lungs instantaneously become pumped full of salt water. An enemy warrior within 18" of
      the Priest receives a +1 modifier to all characteristic based tests. During each of his
      recovery phases, the player controlling the drowning man may have the warrior attempt to break
      the spell by passing a toughness test with no modifier applied. The affected warrior suffers a
      Strength 2 hit when the spell expires.
    effect_i18n:
      es: >-
        Un Sacerdote Marinero curtido entona una plegaria para implorar a Manann que impida a los
        infieles. Los pulmones del enemigo se llenan instantáneamente de agua salada. Un guerrero
        enemigo dentro de 18" del Sacerdote recibe un modificador de +1 a todas las tiradas basadas
        en características. Durante cada una de sus fases de recuperación, el jugador que controla
        al ahogado puede intentar romper el hechizo superando una tirada de Resistencia sin
        modificadores. El guerrero afectado sufre un impacto de Fuerza 2 cuando el hechizo expira.
  - id: spell.prayers-of-manann.sea-legs
    roll: '4'
    name: Sea Legs
    name_i18n:
      es: Piernas de Mar
    difficulty: 8
    effect: >-
      Prayer can be used to bind individuals to the will of Manann. Priests can curse their foe to
      stand upon the deck of a ship caught in stormy weather. An enemy warrior within 18" of the
      Priest must pass an Initiative test to remain standing. If the warrior fails the test he is
      knocked down and may only stand with a successfully passed Initiative test with a +1 modifier
      applied.
    effect_i18n:
      es: >-
        La plegaria puede usarse para atar a los individuos a la voluntad de Manann. Los Sacerdotes
        pueden maldecir a su enemigo para que se mantenga en pie sobre la cubierta de un barco
        azotado por la tormenta. Un guerrero enemigo dentro de 18" del Sacerdote debe superar una
        tirada de Iniciativa para permanecer en pie. Si falla la tirada, cae derribado y solo puede
        levantarse superando una tirada de Iniciativa con un modificador de +1.
  - id: spell.prayers-of-manann.water-blast
    roll: '5'
    name: Water Blast
    name_i18n:
      es: Explosión de Agua
    difficulty: 8
    effect: >-
      Hands outstretched reverently, the old Mariner unleashes a sweeping torrent of brine water by
      the grace of the Lord of Tides. Any model within 18" of the Priest is struck with a magical
      blast of water. The blast has Strength 4 and the target must pass a Strength test or be
      knocked down. A water blast extinguishes flames, affecting anything set on fire within 2" of
      its target.
    effect_i18n:
      es: >-
        Con las manos extendidas con reverencia, el viejo Marino desata un torrente de agua salada
        por la gracia del Señor de las Mareas. Cualquier miniatura dentro de 18" del Sacerdote es
        golpeada por una explosión mágica de agua. La explosión tiene Fuerza 4 y el objetivo debe
        superar una tirada de Fuerza o caer derribado. Una explosión de agua extingue las llamas,
        afectando a todo lo que esté ardiendo dentro de 2" de su objetivo.
  - id: spell.prayers-of-manann.waterwalk
    roll: '6'
    name: Waterwalk
    name_i18n:
      es: Paseo sobre las Aguas
    difficulty: 9
    effect: >-
      Floating on a raft of true belief, the Priest solicits the power of faith in a majestic
      display that defies all logic. In the next movement phase the Priest is able to walk on water,
      marsh and swampland as if it were firm ground. The effects of this prayer last until the
      Priest returns to any solid platform.
    effect_i18n:
      es: >-
        Flotando sobre una balsa de fe verdadera, el Sacerdote solicita el poder de la fe en una
        exhibición majestuosa que desafía toda lógica. En la siguiente fase de movimiento el
        Sacerdote puede caminar sobre el agua, la marisma y el terreno pantanoso como si fuera
        tierra firme. Los efectos de esta plegaria duran hasta que el Sacerdote regresa a cualquier
        plataforma sólida.
  source_refs:
  - manual: liber-malefic
    printed_page: 17
    section: Prayers of Manann
    url: https://www.scribd.com/document/241727651/Miracle-workers-in-Mordheim
  - manual: broheim.net
    printed_page: 3
    section: Heroes / 0-1 Mutant-Priest / Special Rules / Prayers
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Shallows%20Beasts.pdf
- id: lore.prayers-of-morr
  name: Prayers of Morr
  name_i18n:
    es: Plegarias de Morr
  note: El Sacerdote de Morr elige al azar una plegaria de esta lista.
  spells:
  - id: spell.prayers-of-morr.destroy-undead
    roll: '1'
    name: Destroy Undead
    name_i18n:
      es: Destruir No Muertos
    difficulty: 8
    effect: >-
      Through a devout supplicant, by the hand of Morr, the Undead shall become as dust and ashes.
      The Priest of Morr must be touching an enemy Undead or Daemon model to use this prayer. If
      successful the foe immediately goes out of action (this only affects Zombies, Dire Wolves,
      Vampires etc). Ghouls, Possessed and Daemons affected by this prayer will immediately flee
      their full Movement away from the Priest of Morr.
    effect_i18n:
      es: >-
        Por medio de un devoto suplicante, de la mano de Morr, los No Muertos se convertirán en
        polvo y cenizas. El Sacerdote de Morr debe estar en contacto con una miniatura No Muerta o
        Demoníaca enemiga para usar esta plegaria. Si tiene éxito, el enemigo queda inmediatamente
        Fuera de combate (solo afecta a Zombis, Lobos Dire, Vampiros, etc.). Los Ghouls, Poseídos y
        Demonios afectados por esta plegaria huirán inmediatamente todo su Movimiento alejándose del
        Sacerdote de Morr.
  - id: spell.prayers-of-morr.glimpse-ahead
    roll: '2'
    name: Glimpse Ahead
    name_i18n:
      es: Vislumbre del Porvenir
    difficulty: 9
    effect: >-
      Amongst the church of Morr there are augurs who are said to be possessed of witch sight. It is
      said this trait can lead only to madness and as such the augurs are given a wider berth by
      fellow clergymen than their Morrian counterparts. The Priest is entitled to modify the result
      of a roll he makes by +1 or -1. Successful casting of this rite cannot be repeated during a
      battle or else the Priest would succumb to insanity! If the modifier has not been applied to
      the result of a roll during the battle, then it can be applied to a roll the Priest makes
      during the post battle sequence when either searching for a Rare item or visiting another
      location.
    effect_i18n:
      es: >-
        Entre la iglesia de Morr hay augures de los que se dice que poseen vista de brujo. Se cuenta
        que este rasgo solo puede conducir a la locura y, por ello, los clérigos les dan un margen
        mayor que a sus homólogos morrianos. El Sacerdote tiene derecho a modificar el resultado de
        una tirada que realice en +1 o -1. El lanzamiento con éxito de este rito no puede repetirse
        durante una batalla, o el Sacerdote sucumbiría a la locura. Si el modificador no se ha
        aplicado al resultado de una tirada durante la batalla, puede aplicarse a una tirada que el
        Sacerdote realice durante la secuencia posterior a la batalla, ya sea al buscar un objeto
        Raro o al visitar otra localización.
  - id: spell.prayers-of-morr.preserve-corpse
    roll: '3'
    name: Preserve Corpse
    name_i18n:
      es: Preservar el Cadáver
    difficulty: 5
    effect: >-
      Those who fall become sanctified through funerary rites carried out the Priest and their soul
      freed, in the name of Morr, God of Death. The Priest of Morr may attempt to perform the prayer
      of sanctity on a model (friend or foe) who has been taken out of action. The Priest of Morr
      must be within 6" of the model in question. If successful, the model may not be raised by a
      Necromancer.
    effect_i18n:
      es: >-
        Los que caen son santificados mediante los ritos funerarios llevados a cabo por el Sacerdote
        y su alma es liberada, en nombre de Morr, Dios de la Muerte. El Sacerdote de Morr puede
        intentar realizar la plegaria de santidad sobre una miniatura (amiga o enemiga) que haya
        quedado Fuera de combate. El Sacerdote de Morr debe estar a 6" o menos de la miniatura en
        cuestión. Si tiene éxito, la miniatura no podrá ser alzada por un Nigromante.
  - id: spell.prayers-of-morr.sign-of-the-raven
    roll: '4'
    name: Sign of the Raven
    name_i18n:
      es: Signo del Cuervo
    difficulty: 7
    effect: >-
      Priests of Morr must be steadfast in their resolution and as such must, above all else, have
      no fear of death. Dire circumstances are when the actions of a Morrian Priest can inspire
      warriors to perform heroic deeds, despite of certain doom. During the next close combat phase
      all friendly models with 6" including the Priest, receive +1 on all rolls to wound.
    effect_i18n:
      es: >-
        Los Sacerdotes de Morr deben ser firmes en su resolución y, como tales, deben tener, ante
        todo, ningún miedo a la muerte. Las circunstancias adversas son cuando las acciones de un
        Sacerdote morriano pueden inspirar a los guerreros a realizar gestas heroicas, a pesar de la
        perdición segura. Durante la siguiente fase de combate cuerpo a cuerpo, todas las miniaturas
        amigas a 6" o menos, incluido el Sacerdote, reciben +1 en todas las tiradas para herir.
  - id: spell.prayers-of-morr.sleep-of-death
    roll: '5'
    name: Sleep of Death
    name_i18n:
      es: Sueño de la Muerte
    difficulty: 10
    effect: >-
      Servants of Morr are taught to divine and invoke the will of the God of Dreams, allowing them
      to interfere with the conscious minds of the living. The most learned of the church are
      capable of manipulating individuals in a dreamstate. Draw a 12" line from the Priest. Any
      enemy models falling under the line fall asleep for D6 turns, unless a successful Leadership
      test is passed by each model. Roll a D6 for each model affected. Sleeping models are treated
      as being knocked down. Undead creatures are immune to the effects of this prayer.
    effect_i18n:
      es: >-
        A los siervos de Morr se les enseña a adivinar e invocar la voluntad del Dios de los Sueños,
        lo que les permite interferir en las mentes conscientes de los vivos. Los más doctos de la
        iglesia son capaces de manipular a los individuos en estado de ensueño. Traza una línea de
        12" desde el Sacerdote. Las miniaturas enemigas que caigan bajo la línea se quedan dormidas
        durante D6 turnos, a menos que cada miniatura supere con éxito una tirada de Liderazgo. Tira
        un D6 por cada miniatura afectada. Las miniaturas dormidas se consideran derribadas. Las
        criaturas No Muertas son inmunes a los efectos de esta plegaria.
  - id: spell.prayers-of-morr.threshold-line
    roll: '6'
    name: Threshold Line
    name_i18n:
      es: Línea Umbral
    difficulty: 8
    effect: >-
      Charcoal is used after reciting an arcane phrase when the Priest is confronted by an
      apparition of Old Night to block its path. Mark a 4" long line. This mark can be applied to a
      walkway, doorway, stair or other entry point to prevent an Undead creature from passing it.
      Any Undead creature must pass a Leadership test with a +1 modifier to the roll before it can
      pass the threshold marker, which lasts for the duration of the battle.
    effect_i18n:
      es: >-
        Se usa carbón, tras recitar una frase arcana, cuando el Sacerdote se enfrenta a una
        aparición de la Vieja Noche, para bloquear su paso. Marca una línea de 4" de largo. Esta
        marca puede aplicarse a un paso, una puerta, una escalera u otro punto de entrada para
        impedir que la cruce una criatura No Muerta. Cualquier criatura No Muerta debe superar una
        tirada de Liderazgo con un modificador de +1 a la tirada antes de poder cruzar el marcador
        umbral, que dura el resto de la batalla.
  source_refs:
  - manual: liber-malefic
    url: https://www.scribd.com/document/241727651/Miracle-workers-in-Mordheim
    printed_page: 12
    section: Prayers of Prayers of Morr
- id: lore.prayers-of-myrmidia
  name: Prayers of Myrmidia
  name_i18n:
    es: Plegarias de Myrmidia
  note: La Sacerdotisa de Guerra de Myrmidia elige al azar una plegaria de esta lista.
  spells:
  - id: spell.prayers-of-myrmidia.blazing-sun
    roll: '1'
    name: Blazing Sun
    name_i18n:
      es: Sol Abrasador
    difficulty: 10
    effect: >-
      For some Priestesses there is a unique view where the world can be brought into order with
      blinding flames of retribution. Myrmidia answers prayer with fury. Any models within 4" of the
      Priestess suffer a Strength 3 hit with no armour saves allowed, and must pass a Leadership
      test or be knocked down (to extinguish their attire and half-blind by the blinding flames). A
      War-Priestess of Myrmidia is unaffected by the prayer.
    effect_i18n:
      es: >-
        Para algunas Sacerdotisas existe una visión única en la que el mundo puede ser puesto en
        orden con llamas cegadoras de retribución. Myrmidia responde a la plegaria con furia. Las
        miniaturas a 4" o menos de la Sacerdotisa sufren un impacto de Fuerza 3 sin tiradas de
        salvación por armadura permitidas, y deben superar una tirada de Liderazgo o quedar
        derribadas (para apagar su vestimenta y quedarse medio cegadas por las llamas
        deslumbrantes). Una Sacerdotisa de Guerra de Myrmidia no resulta afectada por la plegaria.
  - id: spell.prayers-of-myrmidia.command-the-legion
    roll: '2'
    name: Command the Legion
    name_i18n:
      es: Comandar la Legión
    difficulty: 6
    effect: >-
      Myrmidia lends her strength to the snarling words of the War-Priestess. As the vassal dictates
      solid tactics through prayer, the legionnaires become righteous. Any target warrior within the
      Priestess's line of sight receives +1 Leadership until the start of the players next turn.
    effect_i18n:
      es: >-
        Myrmidia presta su fuerza a las palabras atronadoras de la Sacerdotisa de Guerra. Mientras
        la vasalla dicta tácticas sólidas mediante la plegaria, los legionarios se vuelven justos.
        Cualquier guerrero objetivo dentro de la línea de visión de la Sacerdotisa recibe +1 de
        Liderazgo hasta el comienzo del siguiente turno de los jugadores.
  - id: spell.prayers-of-myrmidia.dismay-foe
    roll: '3'
    name: Dismay Foe
    name_i18n:
      es: Consternar al Enemigo
    difficulty: 9
    effect: >-
      In her wrathful aspect the War Goddess can be invoked by a Priestess. All those heretics who
      gaze upon her just form in melee become utterly terrified. Any model attacking the Priestess
      in close combat this turn must pass a Leadership test or is unable to make any attacks. Undead
      are immune to the effects of this prayer.
    effect_i18n:
      es: >-
        En su aspecto iracundo, la Diosa de la Guerra puede ser invocada por una Sacerdotisa. Todos
        aquellos herejes que contemplan su forma justa en la melé quedan completamente aterrados.
        Cualquier miniatura que ataque a la Sacerdotisa en combate cuerpo a cuerpo este turno debe
        superar una tirada de Liderazgo o no podrá realizar ningún ataque. Los No Muertos son
        inmunes a los efectos de esta plegaria.
  - id: spell.prayers-of-myrmidia.eagle-s-vision
    roll: '4'
    name: Eagle's Vision
    name_i18n:
      es: Visión del Águila
    difficulty: 8
    effect: >-
      Entering a trance-like state the Priestess receives lucid visions from the Goddess.
      Interpreting answers to her prayers enables sly enemies in hiding to be detected. The
      War-Priestess can use this prayer to reveal any hidden warrior. A Priestess who has moved this
      turn is unable to use this prayer, and the prayer cannot be used if the Priestess is in close
      combat.
    effect_i18n:
      es: >-
        Entrando en un estado de trance, la Sacerdotisa recibe visiones lúcidas de la Diosa. La
        interpretación de las respuestas a sus plegarias permite detectar a los enemigos astutos que
        estén ocultos. La Sacerdotisa de Guerra puede usar esta plegaria para revelar a cualquier
        guerrero oculto. Una Sacerdotisa que se haya movido este turno no puede usar esta plegaria,
        y la plegaria no puede usarse si la Sacerdotisa está en combate cuerpo a cuerpo.
  - id: spell.prayers-of-myrmidia.fury-s-call
    roll: '5'
    name: Fury's Call
    name_i18n:
      es: Llamada de la Ira
    difficulty: 9
    effect: >-
      Passion can be found in prayer. The Priestess recants fervent sermons deposing hated despots
      in opposition of the War Goddess. All friendly models within 12" not including the Priestess
      may re-roll their first missed attack during the next close combat phase.
    effect_i18n:
      es: >-
        La pasión puede hallarse en la plegaria. La Sacerdotisa recita fervientes sermones depuestos
        contra los déspotas odiados en oposición a la Diosa de la Guerra. Todas las miniaturas
        amigas a 12" o menos, sin incluir a la Sacerdotisa, pueden repetir su primer ataque fallido
        durante la siguiente fase de combate cuerpo a cuerpo.
  - id: spell.prayers-of-myrmidia.vengeful-wrath
    roll: '6'
    name: Vengeful Wrath
    name_i18n:
      es: Ira Vengativa
    difficulty: 6
    effect: >-
      Lifeblood of the wronged fuels a divine command of unbridled fury. The Priestess dictates
      vengeance upon all hated foes in a rite of retaliation. The War-Priestess may re-roll each
      failed roll to hit the next time that a round of hand-to-hand combat is being fought. Until
      her next close combat has started the Priestess must always charge if there are enemy models
      within charge range. The player has no choice in the matter – the Priestess will automatically
      declare a charge.
    effect_i18n:
      es: >-
        La sangre de los agraviados alimenta un mandato divino de ira desbocada. La Sacerdotisa
        decreta la venganza sobre todos los enemigos odiados en un rito de represalia. La
        Sacerdotisa de Guerra puede repetir cada tirada para impactar fallida la próxima vez que se
        luche una ronda de combate cuerpo a cuerpo. Hasta que comience su próximo combate cuerpo a
        cuerpo, la Sacerdotisa siempre debe cargar si hay miniaturas enemigas dentro de alcance de
        carga. El jugador no tiene elección en el asunto: la Sacerdotisa declarará automáticamente
        una carga.
  source_refs:
  - manual: liber-malefic
    url: https://www.scribd.com/document/241727651/Miracle-workers-in-Mordheim
    printed_page: 13
    section: Prayers of Prayers of Myrmidia
- id: lore.prayers-of-ranald-and-handrich
  name: Prayers of Ranald & Handrich
  name_i18n:
    es: Plegarias de Ranald y Handrich
  note: El Sacerdote Tramposo de Ranald elige al azar una plegaria de esta lista; en Marienburg, los sacerdotes
    de Handrich (Dios del Comercio) pueden usar la misma lista.
  spells:
  - id: spell.prayers-of-ranald-and-handrich.bamboozle
    roll: '1'
    name: Bamboozle
    name_i18n:
      es: Engañifa
    difficulty: 9
    effect: >-
      Creating confusion is a talent the Priest has mastered! By craving the blessing of his fickle
      patron the Priest cajoles a creature short on wit to do his bidding. An enemy warrior within
      12" of the Priest must pass a Leadership test or during the next turn the warrior is
      controlled by the player who controls the Priest. The bamboozled warrior may do something
      which results in its harm, but may not attack itself. Large models, Daemons and Undead are
      immune to the effects of this prayer.
    effect_i18n:
      es: >-
        ¡Crear confusión es un talento que el Sacerdote ha dominado! Suplicando la bendición de su
        caprichoso patrón, el Sacerdote engatusa a una criatura corta de ingenio para que haga su
        voluntad. Un guerrero enemigo a 12" o menos del Sacerdote debe superar una tirada de
        Liderazgo o, durante el siguiente turno, el guerrero será controlado por el jugador que
        controle al Sacerdote. El guerrero embaucado puede hacer algo que le resulte dañino, pero no
        puede atacarse a sí mismo. Las miniaturas Grandes, los Demonios y los No Muertos son inmunes
        a los efectos de esta plegaria.
  - id: spell.prayers-of-ranald-and-handrich.bargain-hunter
    roll: '2'
    name: Bargain Hunter
    name_i18n:
      es: Cazador de Chollos
    difficulty: 8
    effect: >-
      Intoning this litany, the Priest divines a geographical area pinpointing a hotbed of quality
      merchandise. Opulent goods being quickly shifted in a price slash. If successfully cast then
      Common items must be reduced in price by one third of their cost during the next post battle
      sequence. Any fractions should be rounded down. Additionally, one Hero from the Priest's
      warband is guided to a Rare item of his choice which is charged at the normal cost. The
      maximum price for Common items purchased during the post battle sequence is altered to match
      the price slash, which consequently affects all players. The prayer cannot be used again once
      it has been successfully cast.
    effect_i18n:
      es: >-
        Entonando esta letanía, el Sacerdote adivina un área geográfica señalando un hervidero de
        mercancía de calidad. Artículos opulentos que se despachan rápidamente en una rebaja de
        precios. Si se lanza con éxito, los artículos Comunes deben rebajarse un tercio de su coste
        durante la siguiente secuencia posterior a la batalla. Las fracciones se redondean hacia
        abajo. Además, un Héroe de la banda del Sacerdote es guiado hacia un objeto Raro de su
        elección, que se cobra a su coste normal. El precio máximo de los artículos Comunes
        comprados durante la secuencia posterior a la batalla se altera para ajustarse a la rebaja,
        lo que consecuentemente afecta a todos los jugadores. La plegaria no puede usarse de nuevo
        una vez se haya lanzado con éxito.
  - id: spell.prayers-of-ranald-and-handrich.bountiful-fortune
    roll: '3'
    name: Bountiful Fortune
    name_i18n:
      es: Fortuna Espléndida
    difficulty: 10
    effect: >-
      Comrades are gifted with uncanny luck when the Priest implores his deity for an upturn in the
      gang's fortunes. The Priest and any warriors from his warband within 12" may each reverse the
      chances of success on a single dice roll or characteristic test. For example, if a warrior
      with a missile weapon requires a 6 to hit, then reversing the odds will mean that the warrior
      will hit his target on a roll of 1-5 instead. The prayer is effective until the start of the
      players next turn.
    effect_i18n:
      es: >-
        Los camaradas son agraciados con una suerte insólita cuando el Sacerdote implora a su deidad
        un cambio de fortuna para la banda. El Sacerdote y cualquier guerrero de su banda a 12" o
        menos pueden invertir cada uno las probabilidades de éxito de una única tirada de dado o
        tirada de característica. Por ejemplo, si un guerrero con un arma de proyectil necesita un 6
        para impactar, invertir las probabilidades significará que el guerrero impactará a su
        objetivo con un resultado de 1-5. La plegaria es efectiva hasta el comienzo del siguiente
        turno de los jugadores.
  - id: spell.prayers-of-ranald-and-handrich.open
    roll: '4'
    name: Open
    name_i18n:
      es: Abrir
    difficulty: 7
    effect: >-
      Few doors are considered closed to clergymen. It is joked that this Priest can walk through
      walls! The Priest petitions for safe passage to override any barrier. A lock, bolt or latch
      becomes unlocked by the Priest. This includes magical locks. The Priest model must be touching
      the lock to use this prayer.
    effect_i18n:
      es: >-
        Pocas puertas se consideran cerradas para los clérigos. Se bromea diciendo que este
        Sacerdote puede atravesar paredes. El Sacerdote pide paso seguro para superar cualquier
        barrera. Una cerradura, cerrojo o pestillo queda abierto por el Sacerdote. Esto incluye las
        cerraduras mágicas. La miniatura del Sacerdote debe estar en contacto con la cerradura para
        usar esta plegaria.
  - id: spell.prayers-of-ranald-and-handrich.rumour-of-bounty-rumour-of-dearth
    roll: '5'
    name: Rumour of Bounty, Rumour of Dearth
    name_i18n:
      es: Rumor de Abundancia, Rumor de Escasez
    difficulty: 9
    effect: >-
      The Priest requisitions his lord to assist in manipulating priced commodities. If successfully
      cast then all equipment of one type may be halved in price (ie, bows cost 5 gold crowns) or a
      Rare item becomes Common during the next post battle phase. Alternatively, all equipment of
      one type may be doubled in price (ie, bows cost 20 gold crowns) or a Common item becomes Rare
      10. All warbands are affected by the rumour during the post battle sequence. The prayer cannot
      be used again once it has been successfully cast.
    effect_i18n:
      es: >-
        El Sacerdote solicita a su señor que le asista en la manipulación de las mercancías con
        precio. Si se lanza con éxito, todo el equipo de un tipo puede ver su precio reducido a la
        mitad (es decir, los arcos cuestan 5 coronas de oro) o un objeto Raro se convierte en Común
        durante la siguiente fase posterior a la batalla. Alternativamente, todo el equipo de un
        tipo puede ver su precio duplicado (es decir, los arcos cuestan 20 coronas de oro) o un
        artículo Común se convierte en Raro 10. Todas las bandas se ven afectadas por el rumor
        durante la secuencia posterior a la batalla. La plegaria no puede usarse de nuevo una vez se
        haya lanzado con éxito.
  - id: spell.prayers-of-ranald-and-handrich.stealth
    roll: '6'
    name: Stealth
    name_i18n:
      es: Sigilo
    difficulty: 5
    effect: >-
      Calling upon divine favour, bountiful servants quickly develop a knack of going unnoticed and
      evading conflict whenever it suits them. The Priest becomes hidden until the start of the
      players next turn. Any attempts made to detect or spot the Priest will automatically fail
      unless they are achievable through magical means.
    effect_i18n:
      es: >-
        Invocando el favor divino, los pródigos siervos desarrollan rápidamente una habilidad para
        pasar desapercibidos y evitar el conflicto cuando les conviene. El Sacerdote se oculta hasta
        el comienzo del siguiente turno de los jugadores. Cualquier intento de detectar o avistar al
        Sacerdote fallará automáticamente a menos que pueda lograrse por medios mágicos.
  source_refs:
  - manual: liber-malefic
    url: https://www.scribd.com/document/241727651/Miracle-workers-in-Mordheim
    printed_page: 14
    section: Prayers of Prayers of Ranald & Handrich
- id: lore.prayers-of-shallya
  name: Prayers of Shallya
  name_i18n:
    es: Plegarias de Shallya
  note: La Sacerdotisa de Shallya elige al azar una plegaria de esta lista.
  spells:
  - id: spell.prayers-of-shallya.cure-disease
    roll: '1'
    name: Cure Disease
    name_i18n:
      es: Curar Enfermedad
    difficulty: 8
    effect: >-
      The Priestess petitions Shallya to remedy those unfortunate enough to have been struck low by
      the sickness of plague. The Priestess or any model in contact with the Priestess is healed
      from the effects of a disease. The disease is removed from the subject model and all
      ill-effects are ignored.
    effect_i18n:
      es: >-
        La Sacerdotisa implora a Shallya que remedie a aquellos desafortunados que hayan sido
        abatidos por la enfermedad de la plaga. La Sacerdotisa o cualquier miniatura en contacto con
        la Sacerdotisa queda sanada de los efectos de una enfermedad. La enfermedad se elimina de la
        miniatura afectada y todos sus efectos nocivos se ignoran.
  - id: spell.prayers-of-shallya.cure-wounds
    roll: '2'
    name: Cure Wounds
    name_i18n:
      es: Curar Heridas
    difficulty: 6
    effect: >-
      Beseeching the Mercy Goddess to restore health of a fallen warrior is the widely done duty of
      the Priestess. The Priestess or any model in contact with the Priestess immediately recovers 1
      Wound.
    effect_i18n:
      es: >-
        Implorar a la Diosa de la Misericordia que restaure la salud de un guerrero caído es el
        deber ampliamente realizado de la Sacerdotisa. La Sacerdotisa o cualquier miniatura en
        contacto con la Sacerdotisa recupera inmediatamente 1 Herida.
  - id: spell.prayers-of-shallya.golden-tears
    roll: '3'
    name: Golden Tears
    name_i18n:
      es: Lágrimas Doradas
    difficulty: 10
    effect: >-
      Tears of purity shower upon the dying as the Priestess entreats Shallya for a merciful pardon.
      This prayer can only be used if the Priestess is able to reach the spot where a warrior was
      taken out of action in the previous turn. If successfully cast, the Priestess has healed the
      warrior. Return the model to play with 1 Wound, in the knocked down position.
    effect_i18n:
      es: >-
        Lágrimas de pureza llueven sobre los moribundos mientras la Sacerdotisa implora a Shallya un
        indulto misericordioso. Esta plegaria solo puede usarse si la Sacerdotisa es capaz de
        alcanzar el punto donde un guerrero quedó Fuera de combate en el turno anterior. Si se lanza
        con éxito, la Sacerdotisa ha sanado al guerrero. Devuelve la miniatura al juego con 1
        Herida, en la posición derribada.
  - id: spell.prayers-of-shallya.purify
    roll: '4'
    name: Purify
    name_i18n:
      es: Purificar
    difficulty: 9
    effect: >-
      The Cleric displays her abhorrence of the Plague God with an anathema to his polluting
      servants. The Priestess shrivels vile followers of Onogal with the purifying power of Shallya.
      Any warriors from a Carnival of Chaos warband or other servants of Onogal the Fly Lord within
      24" of the Priestess lose D6 Wounds, regardless of Toughness or armour. All affected warriors
      reduced to 0 Wounds must also pass a Leadership test or be treated as being stunned.
    effect_i18n:
      es: >-
        La Clériga muestra su aborrecimiento del Dios de la Plaga con un anatema contra sus siervos
        contaminantes. La Sacerdotisa marchita a los viles seguidores de Onogal con el poder
        purificador de Shallya. Los guerreros de una banda de la Carnival of Chaos u otros siervos
        de Onogal el Señor de las Moscas a 24" o menos de la Sacerdotisa pierden D6 Heridas, sin
        importar Resistencia ni armadura. Todos los guerreros afectados reducidos a 0 Heridas deben
        superar además una tirada de Liderazgo o se los considera aturdidos.
  - id: spell.prayers-of-shallya.shallya-s-endurance
    roll: '5'
    name: Shallya's Endurance
    name_i18n:
      es: Aguante de Shallya
    difficulty: 7
    effect: >-
      In chanting a rite of resilience the Sister delivers the power of Shallya, boosting the
      vitality of a worthy defender. At her decree the champion endures the pain. The Priestess or
      any model in contact with the Priestess receives +1 Toughness during the next round of close
      combat.
    effect_i18n:
      es: >-
        Al entonar un rito de resiliencia, la Hermana canaliza el poder de Shallya, impulsando la
        vitalidad de un defensor digno. Por su decreto, el campeón aguanta el dolor. La Sacerdotisa
        o cualquier miniatura en contacto con la Sacerdotisa recibe +1 de Resistencia durante la
        siguiente ronda de combate cuerpo a cuerpo.
  - id: spell.prayers-of-shallya.vestment-of-purity
    roll: '6'
    name: Vestment of Purity
    name_i18n:
      es: Vestidura de Pureza
    difficulty: 10
    effect: >-
      A miracle of faith as the Priestess weathers the stream of corruption. Heretic lieutenants of
      the Plague Lord yield before the overwhelming purity of Shallya. The Priestess becomes immune
      to all poisons and diseases. In addition, Daemons, warriors from a Carnival of Chaos warband
      or any other servants of Onogal the Fly Lord must pass a Leadership test taken at -2
      Leadership to charge, shoot missiles at or use magic attacks against the Priestess. The
      effects of this prayer last until the Priestess attacks an enemy model in close combat.
    effect_i18n:
      es: >-
        Un milagro de fe mientras la Sacerdotisa resiste la corriente de corrupción. Los tenientes
        herejes del Señor de la Plaga ceden ante la abrumadora pureza de Shallya. La Sacerdotisa se
        vuelve inmune a todos los venenos y enfermedades. Además, los Demonios, los guerreros de una
        banda de la Carnival of Chaos o cualquier otro siervo de Onogal el Señor de las Moscas deben
        superar una tirada de Liderazgo con -2 de Liderazgo para cargar, disparar proyectiles o usar
        ataques mágicos contra la Sacerdotisa. Los efectos de esta plegaria duran hasta que la
        Sacerdotisa ataque a una miniatura enemiga en combate cuerpo a cuerpo.
  source_refs:
  - manual: liber-malefic
    url: https://www.scribd.com/document/241727651/Miracle-workers-in-Mordheim
    printed_page: 15
    section: Prayers of Prayers of Shallya
- id: lore.prayers-of-ulric-miracle-workers
  name: Prayers of Ulric (Miracle Workers)
  name_i18n:
    es: Plegarias de Ulric (Miracle Workers)
  note: 'El Sacerdote Lobo de Ulric elige al azar una plegaria de esta lista. VARIANT of the KB lore.prayers-of-ulric
    (Snow Squall D6, Hammerschlag D10, Bloodlust D7, Wolf''s Hunger D7, Ulric''s Howl D10, Call of Ulric
    D10): the Miracle Workers chapter rewrites the Wolf-Priest prayers completely (Frost''s Bite D7, Heart
    of the Wolf D8, Hoarfrost Thews D8, Ice Storm D10, The Snow King''s Decree D10, Wild Pack D8). No
    spell overlaps; the MW list replaces the Town Cryer list for this profile only. At promotion: keep
    both lores and route lore_assignments of the MW Wolf-Priest to this variant.'
  spells:
  - id: spell.prayers-of-ulric.frost-s-bite
    roll: '1'
    name: Frost's Bite
    name_i18n:
      es: Mordisco de Escarcha
    difficulty: 7
    effect: >-
      The snarling Wolf-Priest prays to Ulric to freeze the blood in the body of his enemy. An enemy
      model within 9" must pass a Toughness test or loses 1 Wound ignoring armour saves.
      Furthermore, the target is unable to take any actions during the opponents next turn. If the
      test is failed, the target may still make defensive actions such as Dodge, and defend itself
      in combat.
    effect_i18n:
      es: >-
        El rugiente Sacerdote Lobo reza a Ulric para congelar la sangre en el cuerpo de su enemigo.
        Una miniatura enemiga a 9" o menos debe superar una tirada de Resistencia o pierde 1 Herida,
        ignorando las tiradas de salvación por armadura. Además, el objetivo no puede realizar
        ninguna acción durante el siguiente turno del oponente. Si falla la tirada, el objetivo
        puede seguir realizando acciones defensivas como Esquiva y defenderse en combate.
  - id: spell.prayers-of-ulric.heart-of-the-wolf
    roll: '2'
    name: Heart of the Wolf
    name_i18n:
      es: Corazón del Lobo
    difficulty: 8
    effect: >-
      The Wolf-Priest's prayer is answered as an ear-shattering inhuman howl roars from his throat.
      For the duration of the battle, all members of the Priest's warband are immune to fear and All
      Alone tests as they feel the presence of their god. Additionally, the leader of the warband
      receives +1 Leadership on all Rout Tests.
    effect_i18n:
      es: >-
        La plegaria del Sacerdote Lobo es respondida mientras un aullido inhumano que ensordece
        resuena desde su garganta. Durante el resto de la batalla, todos los miembros de la banda
        del Sacerdote son inmunes a las tiradas de Miedo y de Todo Solo, ya que sienten la presencia
        de su dios. Además, el líder de la banda recibe +1 de Liderazgo en todas las tiradas de
        Desbandada.
  - id: spell.prayers-of-ulric.hoarfrost-thews
    roll: '3'
    name: Hoarfrost Thews
    name_i18n:
      es: Músculos de Escarcha
    difficulty: 8
    effect: >-
      An unnatural chill ripples through the musculature of the Priest as a frost forms upon the
      flesh across his entire body. A chilling cold aura surrounds him. The Priest is immune to
      exposure caused by freezing conditions for the remainder of the battle. This includes the ill
      effects of all types of cold weather and the Priest is immune to the effects of any magical
      attacks or spells which refer to the cold such as snow, frost, ice and hail. All models within
      2" of the Priest without a cloak or winter furs suffers -1 Leadership and -1 Initiative.
      However, Initiative cannot fall below 1. Undead models are immune to the chilling aura's
      effects.
    effect_i18n:
      es: >-
        Un escalofrío antinatural recorre la musculatura del Sacerdote mientras una escarcha se
        forma sobre la carne de todo su cuerpo. Un aura gélida lo rodea. El Sacerdote es inmune a la
        exposición causada por condiciones heladoras durante el resto de la batalla. Esto incluye
        los efectos nocivos de todo tipo de clima frío, y el Sacerdote es inmune a los efectos de
        cualquier ataque mágico o hechizo que se refiera al frío, como nieve, escarcha, hielo y
        granizo. Todas las miniaturas a 2" o menos del Sacerdote sin capa ni pieles de invierno
        sufren -1 de Liderazgo y -1 de Iniciativa. No obstante, la Iniciativa no puede quedar por
        debajo de 1. Las miniaturas No Muertas son inmunes a los efectos del aura gélida.
  - id: spell.prayers-of-ulric.ice-storm
    roll: '4'
    name: Ice Storm
    name_i18n:
      es: Tormenta de Hielo
    difficulty: 10
    effect: >-
      The Priest snarls an invocation that releases a fierce storm of lashing ice to cripple Ulric's
      enemies. An enemy model within 24" of the Priest is lashed by ice, receiving a Strength 5 hit.
      The target, along with any models (friend or foe) within 2" of the target, must take a
      Toughness test. Any model which fails the test is treated as being stunned.
    effect_i18n:
      es: >-
        El Sacerdote profiere una invocación que desata una feroz tormenta de hielo azotador para
        lisiar a los enemigos de Ulric. Una miniatura enemiga a 24" o menos del Sacerdote es azotada
        por el hielo, sufriendo un impacto de Fuerza 5. El objetivo, junto con cualquier miniatura
        (amiga o enemiga) a 2" o menos del objetivo, debe superar una tirada de Resistencia.
        Cualquier miniatura que falle la tirada se considera aturdida.
  - id: spell.prayers-of-ulric.the-snow-king-s-decree
    roll: '5'
    name: The Snow King's Decree
    name_i18n:
      es: El Decreto del Rey de las Nieves
    difficulty: 10
    effect: >-
      Scornful words are bellowed by the Wolf-Priest in tribute to Ulric's hatred for cowardice,
      weakness and dishonour. The decree of Ulric punishes the craven. Silvery, freezing fire erupts
      from one target within 6", and causes one Strength 8 hit. Any devout Ulrican warriors
      including brave Middenheimers are assumed to be immune to the spell. If the chosen target is a
      warrior then he may avoid the effects of the prayer by successfully passing a Leadership test.
      Armour offers no protection against the Snow King's decree.
    effect_i18n:
      es: >-
        Palabras desdeniosas son proclamadas por el Sacerdote Lobo en tributo al odio de Ulric por
        la cobardía, la debilidad y la deshonra. El decreto de Ulric castiga a los cobardes. Un
        fuego plateado y congelante irrumpe desde un objetivo a 6" o menos, y causa un impacto de
        Fuerza 8. Se asume que cualquier guerrero ulricano devoto, incluidos los valientes
        Middenheimers, es inmune al hechizo. Si el objetivo elegido es un guerrero, puede evitar los
        efectos de la plegaria superando con éxito una tirada de Liderazgo. La armadura no ofrece
        protección contra el decreto del Rey de las Nieves.
  - id: spell.prayers-of-ulric.wild-pack
    roll: '6'
    name: Wild Pack
    name_i18n:
      es: Manada Salvaje
    difficulty: 8
    effect: >-
      The Wolf-Priest howls angry prayers to Ulric, leading allies to bristle with menace. All of
      this unrestrained violence unsettles all except the steeliest of foes. All enemy models within
      12" suffer a -1 penalty to their Weapon Skill in the next close combat phase if they are
      attacking warriors from the Priest's warband. This prayer does not affect Undead.
    effect_i18n:
      es: >-
        El Sacerdote Lobo aúlla plegarias furiosas a Ulric, llevando a los aliados a erizarse de
        amenaza. Toda esta violencia desatada inquieta a todos salvo a los enemigos más templados.
        Todas las miniaturas enemigas a 12" o menos sufren una penalización de -1 a su Habilidad de
        Armas en la siguiente fase de combate cuerpo a cuerpo si atacan a guerreros de la banda del
        Sacerdote. Esta plegaria no afecta a los No Muertos.
  source_refs:
  - manual: liber-malefic
    url: https://www.scribd.com/document/241727651/Miracle-workers-in-Mordheim
    printed_page: 17
    section: Prayers of Prayers of Ulric (Miracle Workers)
- id: lore.prayers-of-verena-and-solkan
  name: Prayers of Verena & Solkan
  name_i18n:
    es: Plegarias de Verena y Solkan
  note: El Sacerdote de Verena elige al azar una plegaria de esta lista; los guías de promoción describen
    a los bélicos sacerdotes de Solkan, que usan la misma lista. The chapter notes the Warrior-Priests
    of Solkan chant from the same list; a Solkan-only variant is not printed.
  spells:
  - id: spell.prayers-of-verena-and-solkan.preserve-the-balance
    roll: '1'
    name: Preserve the Balance
    name_i18n:
      es: Preservar el Equilibrio
    difficulty: 8
    effect: >-
      The Priest's prayers beg to mete out justice to all those who dare to defy a sanctified
      servant of justice. Until the following turn, any vicious act committed against the Priest is
      also inflicted upon the perpetrator of the offence. For example, if the Priest suffered a
      Strength 4 hit from an assailant then the same Strength hit would apply to the attacker, or if
      the Priest lost 1 Wound then the warrior who inflicted the wound would lose 1 Wound also. The
      same conditions apply in reverse when another model is being attacked by the Priest, aside
      from through the use of this prayer.
    effect_i18n:
      es: >-
        Las plegarias del Sacerdote imploran impartir justicia a todos aquellos que se atrevan a
        desafiar a un siervo santificado de la justicia. Hasta el siguiente turno, cualquier acto
        cruel cometido contra el Sacerdote se inflige también al perpetrador de la ofensa. Por
        ejemplo, si el Sacerdote sufrió un impacto de Fuerza 4 de un agresor, el mismo impacto de
        Fuerza se aplicaría al atacante, o si el Sacerdote perdió 1 Herida, el guerrero que la
        infligió también perdería 1 Herida. Las mismas condiciones se aplican a la inversa cuando
        otra miniatura es atacada por el Sacerdote, salvo mediante el uso de esta plegaria.
  - id: spell.prayers-of-verena-and-solkan.retribution
    roll: '2'
    name: Retribution
    name_i18n:
      es: Retribución
    difficulty: 9
    effect: >-
      The Priest delivers a recital to punish guilty scum using the total power of Law. An enemy
      warrior within 12" of the Priest must take a Leadership test with a +2 modifier. If the test
      is failed then during the next close combat phase the warrior loses half of his Attacks. In
      addition, the warrior's Movement is halved. Any fractions are rounded up.
    effect_i18n:
      es: >-
        El Sacerdote pronuncia un recital para castigar a la chusma culpable usando el poder total
        de la Ley. Un guerrero enemigo a 12" o menos del Sacerdote debe superar una tirada de
        Liderazgo con un modificador de +2. Si falla la tirada, durante la siguiente fase de combate
        cuerpo a cuerpo el guerrero pierde la mitad de sus Ataques. Además, el Movimiento del
        guerrero se reduce a la mitad. Las fracciones se redondean hacia arriba.
  - id: spell.prayers-of-verena-and-solkan.shackles-of-law
    roll: '3'
    name: Shackles of Law
    name_i18n:
      es: Grilletes de la Ley
    difficulty: 6
    effect: >-
      Invisible shackles immobilise a character with flagrant disregard for regulations as the
      Priest works magical power into the binding invocation. An enemy warrior within 6" of the
      Priest becomes immobile this turn unless he successfully passes a Leadership test. If the test
      is failed the warrior cannot move, attack or cast spells during the players next turn.
    effect_i18n:
      es: >-
        Grilletes invisibles inmovilizan a un personaje con un desprecio flagrante por las normas
        mientras el Sacerdote infunde poder mágico en la invocación de sujeción. Un guerrero enemigo
        a 6" o menos del Sacerdote queda inmóvil este turno a menos que supere con éxito una tirada
        de Liderazgo. Si falla la tirada, el guerrero no puede moverse, atacar ni lanzar hechizos
        durante el siguiente turno de los jugadores.
  - id: spell.prayers-of-verena-and-solkan.sword-of-justice
    roll: '4'
    name: Sword of Justice
    name_i18n:
      es: Espada de la Justicia
    difficulty: 8
    effect: >-
      The weapon of every Priest of Law is the sword. When all other options fail a prayer can
      empower the weapon turning it into a divine instrument of justice. The Priest receives +1
      Weapon Skill on attacks he makes in the next close combat phase. In addition, the Priest will
      cause a critical hit on a roll to wound of 5-6 instead of just 6.
    effect_i18n:
      es: >-
        El arma de todo Sacerdote de la Ley es la espada. Cuando todas las demás opciones fallan,
        una plegaria puede potenciar el arma convirtiéndola en un instrumento divino de la justicia.
        El Sacerdote recibe +1 de Habilidad de Armas en los ataques que realice en la siguiente fase
        de combate cuerpo a cuerpo. Además, el Sacerdote causará un golpe crítico con una tirada
        para herir de 5-6 en lugar de solo 6.
  - id: spell.prayers-of-verena-and-solkan.the-blind-maiden
    roll: '5'
    name: The Blind Maiden
    name_i18n:
      es: La Doncella Ciega
    difficulty: 9
    effect: >-
      Truth can be divined in a prayer that allows the Priest to find it when blinded. The Priest
      spots any hidden warriors within line of sight and ignores any penalty for effects like
      weather, darkness including any tunnel fighting in underground scenarios, or any blinding
      magical effects. In addition, the Priest ignores psychology tests for being All Alone. The
      effects of the prayer last until the players next shooting phase.
    effect_i18n:
      es: >-
        La verdad puede adivinarse en una plegaria que permite al Sacerdote hallarla incluso ciego.
        El Sacerdote avista a cualquier guerrero oculto dentro de su línea de visión e ignora
        cualquier penalización por efectos como el clima, la oscuridad —incluida cualquier lucha en
        túneles en escenarios subterráneos— o cualquier efecto mágico deslumbrante. Además, el
        Sacerdote ignora las tiradas de psicología por estar Todo Solo. Los efectos de la plegaria
        duran hasta la siguiente fase de disparo de los jugadores.
  - id: spell.prayers-of-verena-and-solkan.trial-by-fire
    roll: '6'
    name: Trial by Fire
    name_i18n:
      es: Juicio por el Fuego
    difficulty: 10
    effect: >-
      In an ultimate test of innocence a party found guilty by the Priest of grave injustice will be
      engulfed in divine flames. An enemy warrior within 6" of the Priest suffers a Strength 6 hit.
      The warrior is treated as being set on fire from the flaming attack.
    effect_i18n:
      es: >-
        En una prueba suprema de inocencia, el accused hallado culpable por el Sacerdote de una
        grave injusticia será envuelto en llamas divinas. Un guerrero enemigo a 6" o menos del
        Sacerdote sufre un impacto de Fuerza 6. El guerrero se considera incendiado por el ataque de
        fuego.
  source_refs:
  - manual: liber-malefic
    url: https://www.scribd.com/document/241727651/Miracle-workers-in-Mordheim
    printed_page: 18
    section: Prayers of Prayers of Verena & Solkan
