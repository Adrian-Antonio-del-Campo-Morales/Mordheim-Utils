    note: Marienburgers, Tileans, Watchmen and Merchants Caravans may hire a War-Priestess of Myrmidia.
  rules:
  - id: hireling.priest.war-priestess-of-myrmidia.rule.prayers
    name: Prayers
    effect: >-
      A War-Priestess of Myrmidia is a servant of Myrmidia and may use the Prayers of Myrmidia as
      detailed elsewhere in the Miracle Workers chapter. In addition, Myrmidian Priestesses can
      receive a Mark of Myrmidia instead of choosing a new skill if a double was rolled on the
      advance roll.
    effect_i18n:
      es: >-
        Una Sacerdotisa de Guerra de Myrmidia es una sirviente de Myrmidia y puede usar las
        Plegarias de Myrmidia como se detalla en el capítulo Trabajadores de Milagros. Además, las
        Sacerdotisas de Myrmidia pueden recibir una Marca de Myrmidia en lugar de elegir una nueva
        habilidad si se saca un doble en la tirada de avance.
    name_i18n:
      es: Plegarias
  - id: hireling.priest.war-priestess-of-myrmidia.rule.war-honed
    name: War-honed
    effect: >-
      The Priestess is a warrior of stout heart and ignores the effects of fear. In addition, the
      War-Priestess may re-roll her first failed Leadership test of every battle.
    effect_i18n:
      es: >-
        La Sacerdotisa es una guerrera de corazón templado e ignora los efectos del miedo. Además,
        la Sacerdotisa de Guerra puede repetir su primera tirada de Liderazgo fallida de cada
        batalla.
    name_i18n:
      es: Templada en la Guerra
  - id: hireling.priest.war-priestess-of-myrmidia.rule.marks-of-myrmidia
    name: Marks of Myrmidia
    effect: >-
      Oracle: the Priestess may re-roll any one dice roll she makes during a battle. Eagle Friend:
      the Priestess attracts an eagle companion; the mark can be gained multiple times. The eagle
      has a range of 24"; when shooting, roll to hit using the Priestess's Ballistic Skill; in close
      combat eagles strike first and use her Weapon Skill, each successful eagle attack inflicts a
      Strength 3 hit. If the Priestess is taken out of action the eagle flies away, returning after
      the battle; eagles cannot be attacked or slain, but if the Priestess is slain the eagles are
      lost like any other equipment.
    effect_i18n:
      es: >-
        Oráculo: la Sacerdotisa puede repetir una tirada de dado que realice durante una batalla.
        Amiga de las Águilas: la Sacerdotisa atrae a un compañero águila; la marca puede obtenerse
        varias veces. El águila tiene un alcance de 24"; al disparar, tira por impactar usando la
        Habilidad de Combate a Distancia de la Sacerdotisa; en cuerpo a cuerpo las águilas golpean
        primero y usan su Habilidad de Combate, cada impacto exitoso del águila inflige un golpe de
        Fuerza 3. Si la Sacerdotisa queda Fuera de combate, el águila vuela y regresa tras la
        batalla; las águilas no pueden ser atacadas ni abatidas, pero si la Sacerdotisa muere, las
        águilas se pierden como cualquier otro equipo.
    name_i18n:
      es: Marcas de Myrmidia
  source_refs:
  - manual: Liber Malefic (Miracle Workers, Werekin)
    printed_page: 6
    section: Priests for Every Occasion / War-Priestess of Myrmidia
    url: https://www.scribd.com/document/241727651/Miracle-workers-in-Mordheim
