    W: 1
    I: 3
    A: 1
    Ld: 7
  starting_experience: 12
  warband_rating:
    kind: base_plus_experience
    base: 0
    per_experience_point: 1
  hire_fee:
    kind: base_plus_upkeep
    hire: 55
    upkeep: 0
  equipment:
    fixed_items:
    - item_id: dagger
      quantity:
        kind: fixed
        value: 1
      notes: Ceremonial dagger — all priests of the chapter start with one.
    - item_id: throwing_knives
      quantity:
        kind: fixed
        value: 1
      notes: Stricture armament — see rules. Resolves to KB item throwing_knives (catalog/items/weapons-ranged.yaml).
    - item_id: sword
      quantity:
        kind: fixed
        value: 1
