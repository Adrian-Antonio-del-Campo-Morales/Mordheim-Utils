  warband_rating:
    kind: base_plus_experience
    base: 0
    per_experience_point: 1
  hire_fee:
    kind: base_plus_upkeep
    hire: 45
    upkeep: 0
  equipment:
    fixed_items:
    - item_id: dagger
      quantity:
        kind: fixed
        value: 1
      notes: Ceremonial dagger — all priests of the chapter start with one.
    - item_id: sword
      quantity:
        kind: fixed
        value: 1
      notes: Stricture — Priests of Verena may only be armed with a sword.
  skill_access:
  - academic
  starting_skill_ids: []
  lore_assignments:
  - lore.prayers-of-verena-and-solkan
  available_to:
  - source: miracle-workers
    note: Any human warband may hire a Priest of Verena (or War-Priest of Solkan) except Witch Hunters,
      Sisters of Sigmar, Pit Fighters, Pirates, Norse, Kislevites, Arabyans and Middenheim mercenaries.
  rules:
  - id: hireling.priest.priest-of-verena.rule.prayers
    name: Prayers
    effect: >-
      A Priest of Verena is a servant of Verena and may use the Prayers of Verena as detailed
      elsewhere in the Miracle Workers chapter. War-Priests of Solkan can invoke the divine power of
      Law using the same prayers. In addition, Verenan Priests can receive a Mark of Verena instead
      of choosing a new skill if a double was rolled on the advance roll.
    effect_i18n:
      es: >-
        Un Sacerdote de Verena es un sirviente de Verena y puede usar las Plegarias de Verena como
        se detalla en el capítulo Trabajadores de Milagros. Los Sacerdotes de Guerra de Solkan
        pueden invocar el poder divino de la Ley usando las mismas plegarias. Además, los Sacerdotes
        de Verena pueden recibir una Marca de Verena en lugar de elegir una nueva habilidad si se
        saca un doble en la tirada de avance.
    name_i18n:
      es: Plegarias
  - id: hireling.priest.priest-of-verena.rule.strictures
    name: Strictures
    effect: Priests of Verena may only be armed with a sword.
    effect_i18n:
      es: Los Sacerdotes de Verena solo pueden ir armados con una espada.
    name_i18n:
      es: Preceptos
  - id: hireling.priest.priest-of-verena.rule.marks-of-verena
    name: Marks of Verena
    effect: >-
      Librarian: the Priest has studied forbidden tomes of the Unseen Library; whenever a prayer is
      successfully cast on an individual model, select another target within 3" of the original
      target to share in the Priest's wisdom — roll again for the casting of the same prayer,
      applying +1 to the Difficulty (a further +1 each repeat, never exceeding 12). Owl Friend: the
      Priest attracts an owl companion; the controlling player may declare a warrior at the start of
      the shooting phase who may then re-roll any failed dice rolls to hit with missiles; the owl
      never settles on the same warrior twice in succession; if the Priest is taken out of action
      the owl flies away, returning after the battle; owls cannot be attacked or slain, but if the
      Priest is slain the owl is lost like any other equipment.
    effect_i18n:
      es: >-
        Bibliotecario: el Sacerdote ha estudiado tomos prohibidos de la Biblioteca Invisible; cada
        vez que una plegaria se lance con éxito sobre una miniatura individual, selecciona otro
        objetivo dentro de 3" del objetivo original para que comparta la sabiduría del Sacerdote:
        tira de nuevo el lanzamiento de la misma plegaria aplicando +1 a la Dificultad (un +1
        adicional en cada repetición, sin superar nunca 12). Amigo del Búho: el Sacerdote atrae a un
        compañero búho; el jugador controlador puede declarar a un guerrero al comienzo de la fase
        de disparo, que podrá repetir las tiradas fallidas por impactar con armas de misiles; el
        búho nunca se posa dos veces seguidas en el mismo guerrero; si el Sacerdote queda Fuera de
        combate, el búho vuela y regresa tras la batalla; los búhos no pueden ser atacados ni
        abatidos, pero si el Sacerdote muere, el búho se pierde como cualquier otro equipo.
    name_i18n:
      es: Marcas de Verena
  - id: hireling.priest.priest-of-verena.rule.marks-of-solkan
    name: Marks of Solkan (War-Priest variant)
    effect: >-
      War-Priests of Solkan may choose skills from the Strength skills list and can receive a Mark
      of Solkan instead of choosing a new skill on a double advance roll. Witch-finder: the Priest
      possesses a sixth sense alerting him to the presence of the minions of Chaos and warlocks; he
      must declare a charge against any follower of Chaos, warlock, necromancer, sorcerer or
      warp-tainted character, even if he cannot see them. Inquisitor: the Priest becomes an
      Inquisitor of Solkan; at the beginning of a new round of combat with the Priest, roll a D6 for
      an enemy warrior who is not Undead or a follower of Chaos — on a roll of 6 the warrior is
      judged corrupt: roll on the Random mutation chart and apply the result as its brand.
      Inquisitors may never leave combat and are Immune to Psychology.
    effect_i18n:
      es: >-
        Los Sacerdotes de Guerra de Solkan pueden elegir habilidades de la lista de Fuerza y pueden
        recibir una Marca de Solkan en lugar de elegir una nueva habilidad con un doble en la tirada
        de avance. Buscador de Brujas: el Sacerdote posee un sexto sentido que le alerta de la
        presencia de los secuaces del Caos y los hechiceros; debe declarar una carga contra
        cualquier seguidor del Caos, hechicero, nigromante, brujo o personaje corrompido por la
        urde, aunque no pueda verlo. Inquisidor: el Sacerdote se convierte en Inquisidor de Solkan;
        al comienzo de una nueva ronda de combate con el Sacerdote, tira un D6 por cada guerrero
        enemigo que no sea No Muerto o seguidor del Caos: con un 6 el guerrero es declarado
        corrupto: tira en la tabla de mutaciones aleatorias y aplica el resultado como su marca. Los
        Inquisidores nunca pueden abandonar el combate y son Inmunes a la Psicología.
    name_i18n:
      es: Marcas de Solkan (variante Sacerdote de Guerra)
  source_refs:
  - manual: Liber Malefic (Miracle Workers, Werekin)
    printed_page: 16
    section: Priests for Every Occasion / Priest of Verena
    url: https://www.scribd.com/document/241727651/Miracle-workers-in-Mordheim
