  rules:
  - id: hireling.priest.wolf-priest-of-ulric.rule.prayers
    name: Prayers
    effect: >-
      A Wolf-Priest of Ulric is a servant of Ulric and may use the Prayers of Ulric as detailed
      elsewhere in the Miracle Workers chapter. In addition, Ulrican Priests can receive a Mark of
      Ulric instead of choosing a new skill if a double was rolled on the advance roll.
    effect_i18n:
      es: >-
        Un Sacerdote Lobo de Ulric es un sirviente de Ulric y puede usar las Plegarias de Ulric como
        se detalla en el capítulo Trabajadores de Milagros. Además, los Sacerdotes de Ulric pueden
        recibir una Marca de Ulric en lugar de elegir una nueva habilidad si se saca un doble en la
        tirada de avance.
    name_i18n:
      es: Plegarias
  - id: hireling.priest.wolf-priest-of-ulric.rule.strictures
    name: Strictures
    effect: >-
      Wolf-Priests of Ulric may never wear armour, trusting in Ulric's protection. The only
      exception is that every Wolf-Priest is garbed in a cloak made from the pelt of a white wolf;
      the pelt allows a 6+ saving throw. Black powder weapons, crossbows and helmets are not
      favoured by Ulric; use of them shows a lack of courage. Wolf-Priests of Ulric may never be
      equipped with blackpowder weapons.
    effect_i18n:
      es: >-
        Los Sacerdotes Lobo de Ulric nunca pueden llevar armadura, confiando en la protección de
        Ulric. La única excepción es que todo Sacerdote Lobo viste una capa hecha con la piel de un
        lobo blanco; la piel otorga una tirada de salvación de 6+. Las armas de pólvora, las
        ballestas y los yelmos no son del agrado de Ulric; usarlos demuestra falta de valor. Los
        Sacerdotes Lobo de Ulric nunca pueden equiparse con armas de pólvora.
    name_i18n:
      es: Preceptos
  - id: hireling.priest.wolf-priest-of-ulric.rule.intense-rivals
    name: Intense Rivals
    effect: >-
      A Wolf-Priest hates all Witch Hunters, Warrior-Priests of Sigmar, Sigmarite Matriarchs and
      Sisters of Sigmar as they are the agents of an opposing cult.
    effect_i18n:
      es: >-
        Un Sacerdote Lobo odia a todos los Cazadores de Brujas, Sacerdotes Guerreros de Sigmar,
        Matriarcas de Sigmar y Hermanas de Sigmar por ser los agentes de un culto rival.
    name_i18n:
      es: Rivalidad Intensa
  - id: hireling.priest.wolf-priest-of-ulric.rule.marks-of-ulric
    name: Marks of Ulric
    effect: >-
      Son of Ulric: the Priest is a direct descendent of Ulric's bloodline; his teeth sharpen and
      become elongated and wicked claws manifest, suffering -1 Ballistic Skill; he can fight unarmed
      without the usual penalties so he cannot be disarmed, and becomes immune to the harmful
      effects of cold except when triggered by magic. Wolf Friend: the Priest attracts a wolf
      companion (the mark can be gained multiple times); if the Priest is taken out of action the
      wolf runs away, returning after the battle; if a wolf companion is taken out of action use the
      serious injury chart for Henchmen to determine what happens to it. Wolf Friend profile: M9 WS3
      BS0 S3 T3 W1 I3 A1 Ld5.
    effect_i18n:
      es: >-
        Hijo de Ulric: el Sacerdote es descendiente directo de la estirpe de Ulric; sus dientes se
        afilan y alargan y aparecen garras crueles, sufriendo -1 Habilidad de Combate a Distancia;
        puede luchar desarmado sin las penalizaciones habituales, por lo que no puede ser desarmado,
        y se vuelve inmune a los efectos nocivos del frío salvo cuando los provoca la magia. Amigo
        de los Lobos: el Sacerdote atrae a un compañero lobo (la marca puede obtenerse varias
        veces); si el Sacerdote queda Fuera de combate, el lobo huye y regresa tras la batalla; si
        un compañero lobo queda Fuera de combate, usa la tabla de heridas graves de Peones para
        determinar qué le ocurre. Perfil del Amigo de los Lobos: M9 HA3 HD0 F3 R3 H1 I3 A1 L5.
    name_i18n:
      es: Marcas de Ulric
  source_refs:
  - manual: Liber Malefic (Miracle Workers, Werekin)
    printed_page: 14
    section: Priests for Every Occasion / Wolf-Priest of Ulric
    url: https://www.scribd.com/document/241727651/Miracle-workers-in-Mordheim
