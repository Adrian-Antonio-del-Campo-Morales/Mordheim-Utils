- id: hireling.priest.mariner-priest-of-manann
  kind: priest
  grade: 2b
  publication: Miracle Workers (Liber Malefic / Mutiny in Marienburg)
  name: Mariner-Priest of Manann
  name_i18n:
    es: Sacerdote Marinero de Manann
  normalization_status: normalized
  characteristics:
    M: 4
    WS: 3
    BS: 3
    S: 3
    T: 3
    W: 1
    I: 3
    A: 1
    Ld: 8
  starting_experience: 12
  warband_rating:
    kind: base_plus_experience
    base: 0
    per_experience_point: 1
  hire_fee:
    kind: base_plus_upkeep
    hire: 40
    upkeep: 0
  equipment:
    fixed_items:
    - item_id: dagger
      quantity:
        kind: fixed
        value: 1
      notes: Ceremonial dagger — all priests of the chapter start with one.
    choice_groups:
    - id: hireling.priest.mariner-priest-of-manann.choice.equipment
      choose:
        kind: fixed
        value: 1
      options:
      - kind: item
        item_id: trident
        quantity:
          kind: fixed
          value: 1
        notes: Priest of Manann only; 15 gc in the chapter's priest equipment list; Strike first, Parry;
          Rarity 7 per Unknowable Cargo.
  skill_access:
  - combat
  - academic
  - speed
  starting_skill_ids: []
  lore_assignments:
  - lore.prayers-of-manann
  available_to:
  - source: miracle-workers
    note: Any human, elf or dwarf warband may hire a Mariner-Priest of Manann (or Olovald). Priests may
      not be hired by followers of Chaos, Orcs & Goblins, Dark Elves, Skaven and Undead warbands unless
      specified elsewhere; only one Priest per warband; the Priest counts as a Hero (see the chapter errata
      note above about replacing a starting Hero).
  rules:
  - id: hireling.priest.mariner-priest-of-manann.rule.prayers
    name: Prayers
    effect: >-
      A Priest of Manann is a servant of Manann and may use the Prayers of Manann as detailed
      elsewhere in the Miracle Workers chapter (ingested as lore.prayers-of-manann in
      sources/2B/catalog/magic-2b.yaml). In addition, Manannan Priests can receive a Mark of Manann
      instead of choosing a new skill if a double was rolled on the advance roll.
    effect_i18n:
      es: >-
        Un Sacerdote de Manann es un sirviente de Manann y puede usar las Plegarias de Manann como
        se detalla en el capítulo Trabajadores de Milagros (ingerido como lore.prayers-of-manann en
        sources/2B/catalog/magic-2b.yaml). Además, los Sacerdotes de Manann pueden recibir una Marca
        de Manann en lugar de elegir una nueva habilidad si se saca un doble en la tirada de avance.
    name_i18n:
      es: Plegarias
  - id: hireling.priest.mariner-priest-of-manann.rule.seafaring
    name: Seafaring
    effect: >-
      Priests of Manann are seafaring people and spend much of their time rowing boats. To represent
      this, all Priests of Manann get +2 to Strength when they row a boat.
    effect_i18n:
      es: >-
        Los Sacerdotes de Manann son gente de mar y pasan gran parte de su tiempo remando. Para
        representarlo, todos los Sacerdotes de Manann obtienen +2 a su Fuerza cuando reman en una
        embarcación.
    name_i18n:
      es: Navegante de Mar
  - id: hireling.priest.mariner-priest-of-manann.rule.navigator
    name: Navigator
    effect: >-
      His maritime intuition means the Priest can influence the exploration outcome of a battle
      fought at sea. When rolling on the Nautical Exploration chart, the Priest allows you to modify
      one dice roll by -1/+1.
    effect_i18n:
      es: >-
        Su intuición marítima permite al Sacerdote influir en el resultado de la exploración de una
        batalla librada en el mar. Al tirar en la tabla de Exploración Náutica, el Sacerdote permite
        modificar una tirada de dado en -1/+1.
    name_i18n:
      es: Navegante
  - id: hireling.priest.mariner-priest-of-manann.rule.priest-hero-slot
    name: Priest Hero Slot (chapter errata)
    effect: >-
      The Priest counts as a Hero and starts with 12 experience. Chapter errata (author ruling, TBMF
      t8634): the Priest must replace one of the warband's starting Heroes; the original PDF wording
      allowed exceeding the Hero limit, which was never corrected in the published file.
    effect_i18n:
      es: >-
        El Sacerdote cuenta como Héroe y comienza con 12 puntos de experiencia. Errata del capítulo
        (decisión del autor, TBMF t8634): el Sacerdote debe sustituir a uno de los Héroes iniciales
        de la banda; la redacción original del PDF permitía superar el límite de Héroes, y nunca se
        corrigió en el archivo publicado.
    name_i18n:
      es: Plaza de Héroe Sacerdotal (errata del capítulo)
  - id: hireling.priest.mariner-priest-of-manann.rule.marks-of-manann
    name: Marks of Manann
    effect: >-
      One with the Sea: if the Priest falls into water then regardless of the injury roll the Priest
      cannot be drowned. Webbed: the fingers and toes of the Priest develop webbed skin and he
      becomes Aquatic.
    effect_i18n:
      es: >-
        Uno con el Mar: si el Sacerdote cae al agua, independientemente de la tirada de herida, el
        Sacerdote no puede ahogarse. Palmeado: los dedos de las manos y los pies del Sacerdote
        desarrollan membranas y se convierte en Acuático.
    name_i18n:
      es: Marcas de Manann
  source_refs:
  - manual: Liber Malefic (Miracle Workers, Werekin)
    printed_page: 3
    section: Priests for Every Occasion / Mariner-Priest of Manann
    url: https://www.scribd.com/document/241727651/Miracle-workers-in-Mordheim
  - manual: broheim.net
    printed_page: 3
    section: Heroes / 0-1 Mutant-Priest / Special Rules / Prayers
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Shallows%20Beasts.pdf
- id: hireling.priest.priest-of-morr
  kind: priest
  grade: 2b
  publication: Miracle Workers (Liber Malefic / Mutiny in Marienburg)
  name: Priest of Morr
  name_i18n:
    es: Sacerdote de Morr
  normalization_status: normalized
  characteristics:
    M: 4
    WS: 3
    BS: 3
    S: 3
    T: 3
    W: 1
    I: 3
    A: 1
    Ld: 8
  starting_experience: 12
  warband_rating:
    kind: base_plus_experience
    base: 0
    per_experience_point: 1
  hire_fee:
    kind: base_plus_upkeep
    hire: 35
    upkeep: 0
  equipment:
    fixed_items:
    - item_id: dagger
      quantity:
        kind: fixed
        value: 1
      notes: Ceremonial dagger — all priests of the chapter start with one.
    - item_id: scythe
      quantity:
        kind: fixed
        value: 1
      notes: Scythe (chapter special weapon — Close combat, As user +1, Difficult to use, Two-handed;
        no cost/rarity printed in the article). Resolves to the KB item `scythe` (catalog/items/trollheim.yaml);
        the chapter's +1 Strength variant is noted for promotion merge.
  skill_access:
  - academic
  - speed
  starting_skill_ids: []
  lore_assignments:
  - lore.prayers-of-morr
  available_to:
  - source: miracle-workers
    note: Any human or elf warband may hire a Priest of Morr.
  rules:
  - id: hireling.priest.priest-of-morr.rule.prayers
    name: Prayers
    effect: >-
      A Priest of Morr is a servant of the Death God and may use the Prayers of Morr as detailed
      elsewhere in the Miracle Workers chapter. In addition, Morrian Priests can receive a Mark of
      Morr instead of choosing a new skill if a double was rolled on the advance roll. Only one Mark
      of Morr can be chosen by Priests of Morr.
    effect_i18n:
      es: >-
        Un Sacerdote de Morr es un sirviente del Dios de la Muerte y puede usar las Plegarias de
        Morr como se detalla en el capítulo Trabajadores de Milagros. Además, los Sacerdotes de Morr
        pueden recibir una Marca de Morr en lugar de elegir una nueva habilidad si se saca un doble
        en la tirada de avance. Los Sacerdotes de Morr solo pueden elegir una Marca de Morr.
    name_i18n:
      es: Plegarias
  - id: hireling.priest.priest-of-morr.rule.strictures
    name: Strictures
    effect: >-
      Priests of the Death God seldom engage in martial activities. Priests of Morr always begin
      equipped with a scythe and a dagger. They may only be armed with a scythe and dagger. Priests
      of Morr may never wear armour.
    effect_i18n:
      es: >-
        Los sacerdotes del Dios de la Muerte rara vez se dedican a actividades marciales. Los
        Sacerdotes de Morr siempre comienzan equipados con una hoz y una daga. Solo pueden ir
        armados con hoz y daga. Los Sacerdotes de Morr nunca pueden llevar armadura.
    name_i18n:
      es: Preceptos
  - id: hireling.priest.priest-of-morr.rule.loner
    name: Loner
    effect: >-
      Few people care to spend any length of time in the company of a Priest of Morr, even when it
      is their duty to do so. As such, a Priest of Morr is used to being alone and probably prefers
      it that way. Priests of Morr do not suffer from the All Alone rules.
    effect_i18n:
      es: >-
        Poca gente desea pasar tiempo en compañía de un Sacerdote de Morr, aunque sea su deber. Por
        eso, un Sacerdote de Morr está acostumbrado a estar solo y probablemente lo prefiere así.
        Los Sacerdotes de Morr no sufren las reglas de Estar Solo.
    name_i18n:
      es: Solitario
  - id: hireling.priest.priest-of-morr.rule.morrs-servant
    name: Morr's Servant
    effect: >-
      Undead creatures shy away from the Priest's presence. Any Undead creature declaring a charge
      against the Priest or being charged by the Priest must pass a Leadership test or be treated as
      suffering the effects of fear. This ignores all the exemptions for Psychology which are
      normally applied to Undead models.
    effect_i18n:
      es: >-
        Las criaturas no muertas rehúyen la presencia del Sacerdote. Cualquier criatura no muerta
        que declare una carga contra el Sacerdote o sea cargada por él debe superar una tirada de
        Liderazgo o se trata como si sufriera los efectos del miedo. Esto ignora todas las
        exenciones de Psicología que normalmente se aplican a las miniaturas de No Muertos.
    name_i18n:
      es: Siervo de Morr
  - id: hireling.priest.priest-of-morr.rule.protected-by-morr
    name: Protected by Morr
    effect: >-
      Morr has a special purpose in mind for His Priests, or so it seems. He, or some other
      mysterious benefactor, is protecting them from serious harm. As such, when rolling for serious
      injuries, ignore rolls of 'Dead' and 'Sold to the Pits'. Simply apply the next injury after
      the relevant entry (ie, for 'Dead' use 'Multiple Injuries' and for 'Sold to the Pits' use
      'Survives Against the Odds').
    effect_i18n:
      es: >-
        Morr tiene un propósito especial reservado a sus Sacerdotes, o eso parece. Él, o algún otro
        benefactor misterioso, los protege de daños graves. Por tanto, al tirar en la tabla de
        heridas graves, ignora los resultados 'Muerto' y 'Vendido a losfosos'; aplica simplemente la
        herida siguiente ('Heridas Múltiples' en lugar de 'Muerto' y 'Sobrevive contra todo
        pronóstico' en lugar de 'Vendido a los fosos').
    name_i18n:
      es: Protegido por Morr
  - id: hireling.priest.priest-of-morr.rule.marks-of-morr
    name: Marks of Morr
    effect: >-
      Augur: inured to fear by long exposure to death, the Priest becomes Immune to Psychology and
      may re-roll any one dice roll he makes during a battle, but suffers -1 Strength permanently.
      Haunted Mien: the Priest enters into the martial career of the Black Guard; strictures are
      ignored by a Black Guardsman, who may choose skills from the Combat and Strength skills lists
      but may not determine a new prayer from the Prayers of Morr list.
    effect_i18n:
      es: >-
        Augur: curtido en el miedo por la larga exposición a la muerte, el Sacerdote se vuelve
        Inmune a la Psicología y puede repetir una tirada de dado que realice durante una batalla,
        pero sufre -1 de Fuerza permanentemente. Rostro Embrujado: el Sacerdote inicia la carrera
        marcial de la Guardia Negra; los preceptos son ignorados por un Guardia Negro, que puede
        elegir habilidades de las listas de Combate y Fuerza, pero no puede determinar una plegaria
        nueva de la lista de Plegarias de Morr.
    name_i18n:
      es: Marcas de Morr
  source_refs:
  - manual: Liber Malefic (Miracle Workers, Werekin)
    printed_page: 5
    section: Priests for Every Occasion / Priest of Morr
    url: https://www.scribd.com/document/241727651/Miracle-workers-in-Mordheim
