    hire: 45
    upkeep: 0
  equipment:
    fixed_items:
    - item_id: dagger
      quantity:
        kind: fixed
        value: 1
      notes: Ceremonial dagger — all priests of the chapter start with one.
  skill_access:
  - combat
  - academic
  - strength
  - speed
  starting_skill_ids: []
  lore_assignments:
  - lore.prayers-of-taal
  available_to:
  - source: miracle-workers
    note: Any human warband may hire a Priest of Taal or Rhya (or Karog) except Witch Hunters, Sisters
      of Sigmar, Pit Fighters, Norse, Kislevites, Tileans, Arabyans and Middenheim mercenaries.
  rules:
  - id: hireling.priest.druid-priest-of-taal.rule.prayers
    name: Prayers
    effect: >-
      A Priest of Taal is a servant of Taal and may use the Prayers of Taal as detailed elsewhere in
      the Miracle Workers chapter. In addition, Taalite Priests can receive a Mark of Taal instead
      of choosing a new skill if a double was rolled on the advance roll.
    effect_i18n:
      es: >-
        Un Sacerdote de Taal es un sirviente de Taal y puede usar las Plegarias de Taal como se
        detalla en el capítulo Trabajadores de Milagros. Además, los Sacerdotes de Taal pueden
        recibir una Marca de Taal en lugar de elegir una nueva habilidad si se saca un doble en la
        tirada de avance.
    name_i18n:
      es: Plegarias
  - id: hireling.priest.druid-priest-of-taal.rule.strictures
    name: Strictures
    effect: >-
      Priests of Taal may never wear heavy armour. Druid-Priests may never be equipped with
      blackpowder weapons.
    effect_i18n:
      es: >-
        Los Sacerdotes de Taal nunca pueden llevar armadura pesada. Los Sacerdotes Druidas nunca
        pueden equiparse con armas de pólvora.
    name_i18n:
      es: Preceptos
  - id: hireling.priest.druid-priest-of-taal.rule.marks-of-taal
    name: Marks of Taal
    effect: >-
      Tranquil Fauna: animals are calmed by the presence of the Priest and will never attack him;
      animals controlled by a warrior with an Animal Handler skill or large predatory beasts must
      pass a Leadership test (taken using the handler's Leadership) or they may not attack the
      Priest; a failed test does not result in a failed charge. Enlivened Flora: once during each
      battle, models (friend as well as foe) except friendly Taalites within 3" of the Priest are
      pushed directly away from him by a wall of blooms, standing no closer than 3" away; the living
      barrier wilts during the recovery phase after D3 turns have elapsed.
    effect_i18n:
      es: >-
        Fauna Tranquila: los animales se calman ante la presencia del Sacerdote y nunca lo atacarán;
        los animales controlados por un guerrero con la habilidad de Adiestrador de Animales o las
        grandes bestias depredadoras deben superar una tirada de Liderazgo (con el Liderazgo del
        adiestrador) o no podrán atacar al Sacerdote; una tirada fallida no provoca una carga
        fallida. Flora Vivificada: una vez por batalla, las miniaturas (amigas y enemigas) salvo los
        Taalitas amigos dentro de 3" del Sacerdote son empujadas directamente lejos de él por una
        muralla de flores, quedando a no menos de 3"; la barrera viva se marchita en la fase de
        recuperación después de que transcurran D3 turnos.
    name_i18n:
      es: Marcas de Taal
  source_refs:
  - manual: Liber Malefic (Miracle Workers, Werekin)
    printed_page: 13
    section: Priests for Every Occasion / Warrior-Priest of Sigmar and Taal
    url: https://www.scribd.com/document/241727651/Miracle-workers-in-Mordheim
