schema_version: 1
ruleset: mordheim
catalog: hirelings-2b
grade: 2b
status: staging
# Hired Swords and Dramatis Personae introduced by the Broheim Grade-2b sources.
#
# Full-profile entries (characteristics transcribed from the source stat blocks):
#   - black-orc-bodyguard, snorri-nosebiter, aldred-fellblade  (Karak Azgal anthology)
#
# Name-only entries (the 2B sources list them as hireable but print no profile;
# characteristics left null pending the external source documents):
#   - bog-hunter, whaler            (referenced by lords-of-the-marsh-mim)
#   - strigani-seer-necromancer     (referenced by strigoi-kaz)
#   - snerik-night-goblin-scout     (referenced by night-goblins-kaz / savage-orcs-kaz)
#
# Band availability lives in the "available_to" list of each profile (mirrors the
# static eligibility of catalog/campaign/hired-swords-and-dramatis.yaml in the KB).
profiles:
- id: hireling.hired-sword.black-orc-bodyguard
  kind: hired-sword
  grade: 2b
  publication: Karak Azgal (Broheim anthology)
  name: Black Orc Bodyguard
  name_i18n:
    es: Guardaespaldas Orco Negro
  normalization_status: normalized
  characteristics:
    M: 4
    WS: 4
    BS: 3
    S: 4
    T: 4
    W: 1
    I: 2
    A: 1
    Ld: 7
  warband_rating:
    kind: base_plus_experience
    base: 15
    per_experience_point: 1
  hire_fee:
    kind: base_plus_upkeep
    hire: 60
    upkeep: 40
  equipment:
    fixed_items:
    - item_id: heavy_armour
      quantity:
        kind: fixed
        value: 1
    - item_id: helmet
      quantity:
        kind: fixed
        value: 1
    choice_groups:
    - id: hireling.hired-sword.black-orc-bodyguard.choice.weapons
      choose:
        kind: fixed
        value: 1
      options:
      - kind: item
        item_id: axe
        quantity:
          kind: fixed
          value: 2
      - kind: item
        item_id: two_handed_weapon
        quantity:
          kind: fixed
          value: 1
  skill_access:
  - combat
  - strength
  - special
  starting_skill_ids: []
  available_to:
  - source: 2b
    note: Any greenskin warband may hire a Black Orc Bodyguard.
    bands:
    - night-goblins-kaz
    - savage-orcs-kaz
  rules:
  - id: hireling.hired-sword.black-orc-bodyguard.rule.i-said-shut-it
    name: I Said 'Shut It'
    effect: >-
      Whilst the Boss has this ferocious warrior in the warband the greenskins are reluctant
      to make trouble. Any orcs or goblins within 6" of the Black Orc do not suffer from the
      effects of Animosity. The rest of the warband tests as normal.
    effect_i18n:
      es: >-
        Mientras el Jefe tenga a este feroz guerrero en la banda, los pieles verdes se
        muestran reacios a causar problemas. Cualquier orco o goblin dentro de 6" del Orco
        Negro no sufre los efectos de Animosidad. El resto de la banda hace las tiradas
        con normalidad.
    name_i18n:
      es: He Dicho 'Cállate'
  - id: hireling.hired-sword.black-orc-bodyguard.rule.whose-da-man
    name: Whose Da Man!
    effect: >-
      If the night goblin leader is taken OOA during the battle, the Black Orc HS steps up
      to replace him. For the duration of the battle he gains the "Leader" ability. If the
      night goblin leader gets the "Killed" result after the battle, then the Black Orc
      decides to fill the new vacant position permanently. The Black Orc becomes the new
      warband leader, but he keeps his upkeep cost. The Black Orc does not count towards
      the warband size when selling treasure.
    effect_i18n:
      es: >-
        Si el líder goblin queda Fuera de combate durante la batalla, el Orco Negro lo
        sustituye: durante esa batalla gana la capacidad de "Líder". Si el líder goblin
        recibe el resultado "Muerto" tras la batalla, el Orco Negro ocupa la vacante de
        forma permanente y se convierte en el nuevo líder de la banda, conservando su coste
        de manutención. El Orco Negro no cuenta para el tamaño de la banda al vender el
        tesoro.
    name_i18n:
      es: ¡Quién Manda Aquí!
  source_refs:
  - manual: broheim.net
    printed_page: 62
    section: Hired Swords and Dramatis Personae / Black Orc Bodyguard - Hired Sword V1.1
    url: https://broheim.net/downloads/campaigns/karakazgal/Karak Azgal.pdf
- id: hireling.dramatis.snorri-nosebiter
  kind: dramatis-personae
  grade: 2b
  publication: Karak Azgal (Broheim anthology)
  name: Snorri Nosebiter
  name_i18n:
    es: Snorri Muerde-narices
  normalization_status: normalized
  characteristics:
    M: 3
    WS: 5
    BS: 3
    S: 4
    T: 4
    W: 2
    I: 2
    A: 2
    Ld: 8
  warband_rating:
    kind: fixed
    value: 20
  hire_fee:
    kind: base_plus_upkeep
    hire: 40
    upkeep: 25
  equipment:
    fixed_items:
    - item_id: dwarf_axe
      quantity:
        kind: fixed
        value: 1
    - item_id: hammer
      quantity:
        kind: fixed
        value: 1
  skill_access: []
  starting_skill_ids: []
  available_to:
  - source: 2b
    note: Any human or Dwarf warband may hire Snorri Nosebiter.
    bands:
    - adventurers-kaz
  rules:
  - id: hireling.dramatis.snorri-nosebiter.rule.slayer-rules
    name: Slayer Rules
    effect: >-
      Snorri follows all the special rules for Slayers as can be found in the Mordheim
      rulebook and the Slayer warband.
    effect_i18n:
      es: >-
        Snorri sigue todas las reglas especiales de los Matatrolles que aparecen en el
        libro de Mordheim y en la banda de Matatrolles.
    name_i18n:
      es: Reglas de Matatrolles
  - id: hireling.dramatis.snorri-nosebiter.rule.drunk
    name: Drunk
    effect: >-
      Snorri likes a drink before a battle. Roll a D6 on the following table to see what
      effect it has: 1 - Snorri drinks to forget. This time he has forgotten to turn up.
      2 - Snorri's head is feeling a bit delicate. His WS and S are both reduced by -1.
      3 - It takes more than that to slow down Snorri. No effect. 4 - The effects on
      Snorri's digestion become evident to everyone. Any model friend or foe, fighting
      within 2" of Snorri is at -1 to hit. 5 - Fortified with liquor Snorri gains +1
      strength. 6 - A bucket of his favourite vodka has put fire in his belly. Snorri is
      subject to frenzy.
    effect_i18n:
      es: >-
        A Snorri le gusta beber antes de una batalla. Lanza un D6 en la siguiente tabla
        para ver qué efecto tiene: 1 - Snorri bebe para olvidar. Esta vez ha olvidado
        presentarse. 2 - La cabeza de Snorri está algo delicada; su HA y su F se reducen
        en -1. 3 - Hace falta más que eso para frenar a Snorri; sin efecto. 4 - Los
        efectos en la digestión de Snorri se hacen evidentes para todos: cualquier
        miniatura, amiga o enemiga, que luche dentro de 2" de Snorri obtiene -1 por
        impactar. 5 - Fortalecido por el licor, Snorri gana +1 de Fuerza. 6 - Un cubo de
        su vodka favorito le ha puesto fuego en las tripas: Snorri sufre frenesí.
    name_i18n:
      es: Borracho
  - id: hireling.dramatis.snorri-nosebiter.rule.lucky
    name: Lucky
    effect: >-
      Although he has no armour Snorri has a knack of avoiding harm. He has a 5+ ward
      save against shooting and combat.
    effect_i18n:
      es: >-
        Aunque no lleva armadura, Snorri tiene el don de esquivar el daño. Tiene una
        tirada de salvación especial de 5+ contra disparos y combate.
    name_i18n:
      es: Afortunado
  source_refs:
  - manual: broheim.net
    printed_page: 62
    section: Hired Swords and Dramatis Personae / Snorri Nosebiter - Dramatis Personae
    url: https://broheim.net/downloads/campaigns/karakazgal/Karak Azgal.pdf
