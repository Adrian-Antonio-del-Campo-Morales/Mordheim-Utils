  skill_access: []
  starting_skill_ids:
  - skill.combat-master
  - skill.strongman
  - skill.sign-of-sigmar
  - skill.protection-of-sigmar
  - skill.righteous-fury
  available_to:
  - source: 2b
    note: >-
      Only human warbands can hire Aldred (Human Mercenaries, Witch Hunters, and
      Adventurers).
    bands:
    - adventurers-kaz
  rules:
  - id: hireling.dramatis.aldred-fellblade.rule.righteous-fury-orcs-goblins
    name: Righteous Fury (Orcs & Goblins)
    effect: >-
      Aldred's Righteous Fury adds Orc & Goblins as affected enemies.
    effect_i18n:
      es: >-
        la Ira Justiciera de Aldred añade Orcos & Goblins como enemigos afectados.
    name_i18n:
      es: Ira Justiciera (Orcos y Goblins)
  - id: hireling.dramatis.aldred-fellblade.rule.fellblade
    name: Fellblade
    effect: >-
      Aldred is a master with this sword and he can therefore parry with it as though it
      was a normal sword.
    effect_i18n:
      es: >-
        Aldred es un maestro con esta espada y por tanto puede parar con ella como si
        fuera una espada normal.
    name_i18n:
      es: Hoja Maldita
  - id: hireling.dramatis.aldred-fellblade.rule.destiny
    name: Destiny
    effect: >-
      If the "Dead" result is rolled on the Serious Injury Chart then Aldred isn't really
      dead but he decides to quit the warband and travel to another Dwarf Hold in his
      quest for the sword Karaghul. He is no longer available for the rest of the
      campaign.
    effect_i18n:
      es: >-
        Si se obtiene el resultado "Muerto" en la tabla de Heridas Graves, Aldred no está
        realmente muerto, sino que decide abandonar la banda y viajar a otro bastión enano
        en su búsqueda de la espada Karaghul. Ya no estará disponible durante el resto de
        la campaña.
    name_i18n:
      es: Destino
  source_refs:
  - manual: broheim.net
    printed_page: 63
    section: Hired Swords and Dramatis Personae / Aldred Fellblade - Dramatis Personae
    url: https://broheim.net/downloads/campaigns/karakazgal/Karak Azgal.pdf
- id: hireling.hired-sword.bog-hunter
  kind: hired-sword
  grade: 2b
  publication: Mutiny in Marienburg Specialists (Broheim)
  name: Bog Hunter
  name_i18n:
    es: Cazador de Ciénagas
  normalization_status: normalized
  characteristics:
    M: 4
    WS: 3
    BS: 3
    S: 3
    T: 4
    W: 1
    I: 3
    A: 1
    Ld: 6
  warband_rating:
    kind: base_plus_experience
    base: 15
    per_experience_point: 1
  hire_fee:
    kind: base_plus_upkeep
    hire: 30
    upkeep: 15
  equipment:
    fixed_items:
    - item_id: beastlash
      quantity:
        kind: fixed
        value: 1
      notes: >-
        Resolves to the active-KB item `beastlash`
        (catalog/items/weapons-close-combat.yaml, "Látigo de Señor de las Bestias").
        The MiM Specialists source prints no price/rarity for it; the KB entry's
        Beastbane effect (Fear in animals) applies.
    - item_id: net
      quantity:
        kind: fixed
        value: 1
    - item_id: toughened_leathers
      quantity:
        kind: fixed
        value: 1
  skill_access:
  - combat
  - strength
  starting_skill_ids:
  - skill.streetwise
  - skill.haggle
  available_to:
  - source: 2b
    note: Fimir, Beastmen and Greenskin Warbands may hire a Bog Hunter.
    bands:
    - lords-of-the-marsh-mim
  rules:
  - id: hireling.hired-sword.bog-hunter.rule.unholy-stink
    name: Unholy Stink
    effect: >-
      The Bog hunter is covered in a thick layer of dung, the smell is so distracting
      that all enemies are at -1 to hit the Bog hunter in close combat.
    effect_i18n:
      es: >-
        El Cazador de Ciénagas está cubierto por una gruesa capa de estiércol; el olor es
        tan distractor que todos los enemigos obtienen -1 por impactar al Cazador de
        Ciénagas en combate cuerpo a cuerpo.
    name_i18n:
      es: Hedor Impío
  - id: hireling.hired-sword.bog-hunter.rule.gopher
    name: Gopher
    effect: >-
      The Bog hunter may venture into town for his masters, ferrying back his goods to
      the waiting warband. In place of a hero doing a roll on either the Daemon swamp or
      Trading, the Bog hunter may visit any 1 place in the Craftsmarket, Infamous Haunts
      or Marketplace as the Hero waits outside of town for the bog hunters return.
    effect_i18n:
      es: >-
        El Cazador de Ciénagas puede aventurarse en la ciudad por sus amos y traer de
        vuelta los bienes a la banda. En lugar de que un héroe haga una tirada en el
        Pantano del Daemon o en Comercio, el Cazador de Ciénagas puede visitar cualquier
        lugar del Mercado de Artesanía, Refugios Infames o Mercado mientras el héroe espera fuera
        de la ciudad su regreso.
    name_i18n:
      es: Recadero
  - id: hireling.hired-sword.bog-hunter.rule.fenland-strider
    name: Fenland Strider
    effect: >-
      The Bog Hunter may re-roll any failed Initiative tests when fighting on causeways,
      jetties and gangplanks or crossing a marsh.
    effect_i18n:
      es: >-
        El Cazador de Ciénagas puede repetir cualquier tirada de Iniciativa fallida cuando
        luche en calzadas, embarcaderos y pasarelas o cruce un marisma.
    name_i18n:
      es: Zancada de las Ciénagas
  source_refs:
  - manual: broheim.net
    printed_page: 1
    section: Hired Swords
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Lords%20of%20the%20Marsh.pdf
  - manual: broheim.net
    printed_page: 5
    section: Mutiny In Marienburg Specialists / Bog Hunter
    url: https://broheim.net/downloads/hiredswords/mutinyinmarienburg/MiM%20Specialists.pdf
- id: hireling.hired-sword.whaler
  kind: hired-sword
  grade: 2b
  publication: Mutiny in Marienburg Specialists (Broheim)
  name: Whaler
  name_i18n:
    es: Ballenero
  normalization_status: normalized
  characteristics:
    M: 4
    WS: 3
    BS: 4
    S: 4
    T: 3
    W: 1
    I: 3
    A: 1
    Ld: 7
  warband_rating:
    kind: base_plus_experience
    base: 30
    per_experience_point: 1
  hire_fee:
    kind: base_plus_upkeep
    hire: 70
    upkeep: 30
  equipment:
    fixed_items:
    - item_id: spear
      quantity:
        kind: fixed
        value: 1
    - item_id: net
      quantity:
        kind: fixed
        value: 1
    - item_id: harpoon_crossbow
      quantity:
        kind: fixed
        value: 1
      notes: Harpoon gun counts as harpoon crossbow.
    - item_id: javelin
      quantity:
        kind: fixed
        value: 1
      notes: Harpoons count as javelins.
  skill_access:
  - strength
  - shooting
  starting_skill_ids: []
  available_to:
  - source: 2b
    note: >-
      Whalers may not be hired by Undead and Skaven warbands. Fimir warbands may hire
      the Whaler (Lords of the Marsh).
    bands:
    - lords-of-the-marsh-mim
  rules:
  - id: hireling.hired-sword.whaler.rule.marine-hunter
    name: Marine Hunter
    effect: >-
      Whalers grow accustomed to hunting marine beasts. Double any wounds inflicted to aquatic
      models.
    effect_i18n:
      es: >-
        Los Balleneros se acostumbran a cazar bestias marinas. Duplica cualquier herida
        infligida a miniaturas acuáticas.
    name_i18n:
      es: Cazador Marino
  - id: hireling.hired-sword.whaler.rule.hardened
    name: Hardened
    effect: >-
      Having come face to face with some of the largest most terrifying beasts the seas
      have to offer and survived, the Whaler is immune to fear.
    effect_i18n:
      es: >-
        Tras enfrentarse a algunas de las bestias más grandes y terroríficas de los mares
        y sobrevivir, el Ballenero es inmune al miedo.
    name_i18n:
      es: Endurecido
  - id: hireling.hired-sword.whaler.rule.harpooner
    name: Harpooner
    effect: >-
      When the Whaler hits a model in the shooting phase, if he wounds the target, he may
      attempt to reel in the catch. If the Whaler passes a Strength test, the target model
      is pulled 8" towards the Whaler. Neither model counts as charging if a model is
      reeled into close combat.
    effect_i18n:
      es: >-
        Cuando el Ballenero impacta a una miniatura en la fase de disparo, si la hiere,
        puede intentar recoger la presa. Si el Ballenero supera una tirada de Fuerza, la
        miniatura objetivo es arrastrada 8" hacia el Ballenero. Ninguna de las dos
        miniaturas cuenta como carga si una es arrastrada hasta el combate cuerpo a
        cuerpo.
    name_i18n:
      es: Arponero
  - id: hireling.hired-sword.whaler.rule.whalebone-carver
    name: Whalebone Carver
    effect: >-
      Heroes get +2 on search rolls when looking for Scrimshaw Baubles when a Whaler
      joins the warband.
    effect_i18n:
      es: >-
        Los héroes obtienen +2 en las tiradas de búsqueda de Adornos de Escrimshaw cuando
        un Ballenero se une a la banda.
    name_i18n:
      es: Tallador de Hueso de Ballena
  source_refs:
  - manual: broheim.net
    printed_page: 1
    section: Hired Swords
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Lords%20of%20the%20Marsh.pdf
  - manual: broheim.net
    printed_page: 3
    section: Mutiny In Marienburg Specialists / Whaler
    url: https://broheim.net/downloads/hiredswords/mutinyinmarienburg/MiM%20Specialists.pdf
