      quantity:
        kind: fixed
        value: 1
      notes: Two-handed sword — resolved to the KB `two_handed_weapon` item
        (the source offers no separate double-handed-sword item).
    - item_id: heavy_armour
      quantity:
        kind: fixed
        value: 1
