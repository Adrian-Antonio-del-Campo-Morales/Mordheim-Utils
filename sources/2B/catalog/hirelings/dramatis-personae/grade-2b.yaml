  name: Strigani Seer Necromancer
  name_i18n:
    es: Adivino Nigromante Strigani
  normalization_status: out_of_scope
  starting_skill_ids: []
  rules:
  - id: hireling.dramatis.strigani-seer-necromancer.rule.hiring-condition
    name: Hiring Condition
    effect: >-
      The Strigoi Vampire warband may only hire the Strigani Seer Necromancer if they have no
      vampire.
    effect_i18n:
      es: >-
        La banda de Vampiros Strigoi solo puede contratar al Adivino Nigromante Strigani si no tiene
        ningún vampiro.
    name_i18n:
      es: Condición de Contratación
  source_refs:
  - manual: broheim.net
    printed_page: 31
    section: Hired Swords
    url: https://broheim.net/downloads/campaigns/karakazgal/Karak Azgal.pdf
  out_of_scope_reason: The source lists the Strigani Seer Necromancer among the Hired Swords the Strigoi
    Vampire warband may hire (only when it has no vampire) and prints no stat block; the profile stays
    unmodelled until the referenced source document is recovered.
