- id: hireling.dramatis.snorri-nosebiter
  kind: dramatis-personae
  grade: 2b
  publication: Karak Azgal (Broheim anthology)
  name: Snorri Nosebiter
  name_i18n:
    es: Snorri Muerde-Narices
  normalization_status: normalized
  characteristics:
    M: 3
    WS: 5
    BS: 3
    S: 4
    T: 4
    W: 2
    I: 2
    A: 2
    Ld: 8
  warband_rating:
    kind: fixed
    value: 20
  equipment:
    fixed_items:
    - item_id: dwarf_axe
      quantity:
        kind: fixed
        value: 1
    - item_id: hammer
      quantity:
        kind: fixed
        value: 1
  starting_skill_ids: []
  rules:
  - id: hireling.dramatis.snorri-nosebiter.rule.slayer-rules
    name: Slayer Rules
    effect: >-
      Snorri follows all the special rules for Slayers as can be found in the Mordheim rulebook and
      the Slayer warband.
    effect_i18n:
      es: >-
        Snorri sigue todas las reglas especiales de los Matatrolles que aparecen en el libro de
        Mordheim y en la banda de Matatrolles.
    name_i18n:
      es: Reglas de Matatrolles
  - id: hireling.dramatis.snorri-nosebiter.rule.drunk
    name: Drunk
    effect: >-
      Snorri likes a drink before a battle. Roll a D6 on the following table to see what effect it
      has: 1 - Snorri drinks to forget. This time he has forgotten to turn up. 2 - Snorri's head is
      feeling a bit delicate. His WS and S are both reduced by -1. 3 - It takes more than that to
      slow down Snorri. No effect. 4 - The effects on Snorri's digestion become evident to everyone.
      Any model friend or foe, fighting within 2" of Snorri is at -1 to hit. 5 - Fortified with
      liquor Snorri gains +1 strength. 6 - A bucket of his favourite vodka has put fire in his
      belly. Snorri is subject to frenzy.
    effect_i18n:
      es: >-
        A Snorri le gusta beber antes de una batalla. Lanza un D6 en la siguiente tabla para ver qué
        efecto tiene: 1 - Snorri bebe para olvidar. Esta vez ha olvidado presentarse. 2 - La cabeza
        de Snorri está algo delicada; su HA y su F se reducen en -1. 3 - Hace falta más que eso para
        frenar a Snorri; sin efecto. 4 - Los efectos en la digestión de Snorri se hacen evidentes
        para todos: cualquier miniatura, amiga o enemiga, que luche dentro de 2" de Snorri obtiene
        -1 por impactar. 5 - Fortalecido por el licor, Snorri gana +1 de Fuerza. 6 - Un cubo de su
        vodka favorito le ha puesto fuego en las tripas: Snorri sufre frenesí.
    name_i18n:
      es: Borracho
  - id: hireling.dramatis.snorri-nosebiter.rule.lucky
    name: Lucky
    effect: >-
      Although he has no armour Snorri has a knack of avoiding harm. He has a 5+ ward save against
      shooting and combat.
    effect_i18n:
      es: >-
        Aunque no lleva armadura, Snorri tiene el don de esquivar el daño. Tiene una tirada de
        salvación especial de 5+ contra disparos y combate.
    name_i18n:
      es: Afortunado
  source_refs:
  - manual: broheim.net
    printed_page: 62
    section: Hired Swords and Dramatis Personae / Snorri Nosebiter - Dramatis Personae
    url: https://broheim.net/downloads/campaigns/karakazgal/Karak Azgal.pdf
