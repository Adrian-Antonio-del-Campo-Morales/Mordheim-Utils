- id: hireling.dramatis.aldred-fellblade
  kind: dramatis-personae
  grade: 2b
  publication: Karak Azgal (Broheim anthology)
  name: Aldred Fellblade
  name_i18n:
    es: Aldred Hoja Maldita
  normalization_status: normalized
  characteristics:
    M: 4
    WS: 6
    BS: 4
    S: 4
    T: 4
    W: 2
    I: 4
    A: 2
    Ld: 8
  warband_rating:
    kind: fixed
    value: 60
  equipment:
    fixed_items:
    - item_id: two_handed_weapon
      quantity:
        kind: fixed
        value: 1
      notes: Two-handed sword — resolved to the KB `two_handed_weapon` item (the source offers no separate
        double-handed-sword item).
    - item_id: heavy_armour
      quantity:
        kind: fixed
        value: 1
    - item_id: shield
      quantity:
        kind: fixed
        value: 1
  starting_skill_ids:
  - skill.combat-master
  - skill.strongman
  - skill.sign-of-sigmar
  - skill.protection-of-sigmar
  - skill.righteous-fury
  rules:
  - id: hireling.dramatis.aldred-fellblade.rule.righteous-fury-orcs-goblins
    name: Righteous Fury (Orcs & Goblins)
    effect: Aldred's Righteous Fury adds Orc & Goblins as affected enemies.
    effect_i18n:
      es: la Ira Justiciera de Aldred añade Orcos & Goblins como enemigos afectados.
    name_i18n:
      es: Ira Justiciera (Orcos y Goblins)
  - id: hireling.dramatis.aldred-fellblade.rule.fellblade
    name: Fellblade
    effect: >-
      Aldred is a master with this sword and he can therefore parry with it as though it was a
      normal sword.
    effect_i18n:
      es: >-
        Aldred es un maestro con esta espada y por tanto puede parar con ella como si fuera una
        espada normal.
    name_i18n:
      es: Hoja Maldita
  - id: hireling.dramatis.aldred-fellblade.rule.destiny
    name: Destiny
    effect: >-
      If the "Dead" result is rolled on the Serious Injury Chart then Aldred isn't really dead but
      he decides to quit the warband and travel to another Dwarf Hold in his quest for the sword
      Karaghul. He is no longer available for the rest of the campaign.
    effect_i18n:
      es: >-
        Si se obtiene el resultado "Muerto" en la tabla de Heridas Graves, Aldred no está realmente
        muerto, sino que decide abandonar la banda y viajar a otro bastión enano en su búsqueda de
        la espada Karaghul. Ya no estará disponible durante el resto de la campaña.
    name_i18n:
      es: Destino
  source_refs:
  - manual: broheim.net
    printed_page: 63
    section: Hired Swords and Dramatis Personae / Aldred Fellblade - Dramatis Personae
    url: https://broheim.net/downloads/campaigns/karakazgal/Karak Azgal.pdf
- id: hireling.dramatis.armen-abbas
  kind: dramatis-personae
  grade: 2b
  publication: Relics of the Crusades (Broheim anthology)
  name: Armen Abbas
  name_i18n:
    es: Armen Abbas
  normalization_status: normalized
  characteristics:
    M: 4
    WS: 4
    BS: 5
    S: 2
    T: 2
    W: 3
    I: 3
    A: 1
    Ld: 9
  warband_rating:
    kind: fixed
    value: 65
  equipment:
    fixed_items:
    - item_id: sword
      quantity:
        kind: fixed
        value: 1
    - item_id: angel_wings
      quantity:
        kind: fixed
        value: 1
      notes: REL-specific item (see the Angel Wings rule); no KB or 2B catalog equivalent exists — deliberate
        dangling ref, define at promotion.
    - item_id: stickfire
      quantity:
        kind: fixed
        value: 1
      notes: REL-specific item, "enough stickfire and vermin pots to last for the entire battle"; no KB
        or 2B catalog equivalent — deliberate dangling ref, define at promotion.
    - item_id: vermin_pot
      quantity:
        kind: fixed
        value: 1
      notes: REL-specific item (see stickfire note); deliberate dangling ref, define at promotion.
  starting_skill_ids:
  - skill.leap
  - skill.acrobat
  - skill.dodge
  rules:
  - id: hireling.dramatis.armen-abbas.rule.skills-physician
    name: Physician
    effect: >-
      Armen Abbas has the following skills: Leap, Acrobat, Dodge, On the Wings of Angels. He is also
      counted as a Physician, see the Scholar entry in the Arabian Tribe warband list.
    effect_i18n:
      es: >-
        Armen Abbas tiene las siguientes habilidades Salto, Acróbata, Esquiva y En las Alas de los
        Ángeles. También cuenta como Médico, ver la entrada de Erudito en la lista de banda de la
        Tribu Arabia.
    name_i18n:
      es: Médico
  - id: hireling.dramatis.armen-abbas.rule.angel-wings
    name: Angel Wings
    effect: >-
      The Angel Wings grant Armen the ability to glide through the air. To use the Angel Wings he
      must give up his movement and apply the effects below. At the beginning of a movement phase in
      which Armen is at least 3" above ground level, the player may draw a straight line 1" wide and
      24" long to any point on the table that is at or below the height he starts from. The line may
      include a turn of up to 45 degrees. The line cannot move through any piece of terrain higher
      than Armen's starting point. Any enemy model, susceptible to fear, underneath the line must
      make a leadership test or flee 2D6" directly away from it. At the end of the movement phase,
      place Armen where the line ends. During the shooting phase Armen will always fire first. His
      player may work out the point from where he fires from at any point along his line of flight,
      and the vertical height in inches does not add to the extent of the weapons range.
    effect_i18n:
      es: >-
        Las Alas de Ángel otorgan a Armen la capacidad de planear por el aire. Para usar las Alas de
        Ángel debe renunciar a su movimiento y aplicar los efectos siguientes. Al comienzo de una
        fase de movimiento en la que Armen esté al menos a 3" del nivel del suelo, el jugador puede
        trazar una línea recta de 1" de ancho y 24" de largo hacia cualquier punto del tablero que
        esté a la altura desde la que parte o por debajo. La línea puede incluir un giro de hasta 45
        grados. La línea no puede atravesar ninguna escenografía más alta que el punto de partida de
        Armen. Cualquier miniatura enemiga susceptible de Miedo que esté bajo la línea debe superar
        una tirada de Liderazgo o huir 2D6" directamente alejándose de ella. Al final de la fase de
        movimiento, coloca a Armen donde termina la línea. Durante la fase de disparo Armen siempre
        disparará primero. Su jugador puede calcular el punto desde el que dispara en cualquier
        punto de su línea de vuelo, y la altura vertical en pulgadas no suma al alcance de las
        armas.
    name_i18n:
      es: Alas de Ángel
  source_refs:
  - manual: broheim.net
    printed_page: 16
    section: Dramatis Personae / Armen Abbas
    url: https://broheim.net/downloads/fo/97RelicsoftheCrusadesPt2.pdf
