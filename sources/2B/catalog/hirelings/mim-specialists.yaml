  name_i18n:
    es: Guardaespaldas Hombre Oso Nórdico
  normalization_status: normalized
  characteristics:
    M: 4
    WS: 4
    BS: 3
    S: 4
    T: 3
    W: 1
    I: 3
    A: 2
    Ld: 7
  warband_rating:
    kind: base_plus_experience
    base: 30
    per_experience_point: 1
  equipment:
    fixed_items:
    - item_id: axe
      quantity:
        kind: fixed
        value: 1
    - item_id: shield
      quantity:
        kind: fixed
        value: 1
    - item_id: light_armour
      quantity:
        kind: fixed
        value: 1
    - item_id: wolfcloak
      quantity:
        kind: fixed
        value: 1
      notes: Wolf cloak — resolved to the KB `wolfcloak` item (Middenheim hunt cloak, +1 armour saves vs
        shooting) as the closest existing cloak item; the MiM source grants no effect for it. Review the
        equivalence at promotion (distinct from the MW White Wolf Pelt Cloak, which is a different 6+-save
        item).
  skill_access:
  - combat
  - strength
  starting_skill_ids: []
  rules:
  - id: hireling.hired-sword.norse-bearman-bodyguard.rule.shieldmaster
    name: Shieldmaster
    effect: >-
      A Norse mercenary has trained with a shield since childhood becoming so skilled as to repel
      any blow. A Bearman Bodyguard may parry with it in addition to getting a save throw.
    effect_i18n:
      es: >-
        Un mercenario nórdico ha entrenado con un escudo desde la infancia, llegando a ser tan
        diestro que repele cualquier golpe. Un Guardaespaldas Hombre Oso puede parar con él además
        de obtener su tirada de salvación.
    name_i18n:
      es: Maestro del Escudo
  - id: hireling.hired-sword.norse-bearman-bodyguard.rule.bulwark
    name: Bulwark
    effect: >-
      Bearmen fight expertly with a shield in one hand and an axe in the other. The Bearman
      Bodyguard gets an additional +1 bonus on his armour saving roll in close combat.
    effect_i18n:
      es: >-
        Los Hombres Oso luchan con maestría con un escudo en una mano y un hacha en la otra. El
        Guardaespaldas Hombre Oso obtiene un bonus adicional de +1 en su tirada de salvación por
        armadura en combate cuerpo a cuerpo.
    name_i18n:
      es: Baluarte
  - id: hireling.hired-sword.norse-bearman-bodyguard.rule.drunken
    name: Drunken
    effect: >-
      Bearmen are notorious for their uncontrollable consumption of alcohol. Roll a D6 at the start
      of each turn. On a roll of 1, they must test for stupidity that turn. On a roll of 2-5 nothing
      happens and on a roll of 6 they become subject to frenzy for that turn. While subject to both
      stupidity and frenzy they are immune to all other forms of psychology.
    effect_i18n:
      es: >-
        Los Hombres Oso son notorios por su consumo incontrolable de alcohol. Tira un D6 al comienzo
        de cada turno. Con un resultado de 1 deben superar una tirada de Estupidez ese turno. Con un
        resultado de 2-5 no ocurre nada, y con un 6 sufren frenesí ese turno. Mientras sufran tanto
        estupidez como frenesí son inmunes a todas las demás formas de psicología.
    name_i18n:
      es: Borrachuzo
  source_refs:
  - manual: broheim.net
    printed_page: 3
    section: Specialists / Norse Bearman Bodyguard
    url: https://broheim.net/downloads/hiredswords/mutinyinmarienburg/Specialists.pdf
- id: hireling.hired-sword.fire-eater
  kind: hired-sword
  grade: 2b
  publication: Mutiny in Marienburg Specialists (Broheim)
  name: Fire-Eater
  name_i18n:
    es: Traga Fuego
  normalization_status: normalized
  characteristics:
    M: 4
    WS: 2
    BS: 3
    S: 3
    T: 4
    W: 2
    I: 2
    A: 1
    Ld: 7
  warband_rating:
    kind: base_plus_experience
    base: 30
    per_experience_point: 1
  equipment:
    fixed_items:
    - item_id: fire_stick
      quantity:
        kind: fixed
        value: 1
      notes: MiM-specific item (see the Fire-Stick rule); no KB or 2B catalog equivalent — deliberate dangling
        ref, define at promotion.
  skill_access: []
  starting_skill_ids: []
  rules:
  - id: hireling.hired-sword.fire-eater.rule.fire-stick
    name: Fire-Stick
    effect: >-
      Being almost perfectly trained in mystical arts, the Fire-Eater spits fire upon his enemies in
      the shooting phase. Use the teardrop shaped flame template to determine which models suffer an
      automatic Strength 4 hit. In addition, any models hit are set on fire on a roll of 4+ (see
      Fire Rules). Fire-Eaters can use this breath attack even when engaged in close combat.
    effect_i18n:
      es: >-
        Al estar entrenado casi a la perfección en las artes místicas, el Traga Fuego escupe fuego
        sobre sus enemigos en la fase de disparo. Usa la plantilla de llamas con forma de lágrima
        para determinar qué miniaturas sufren un impacto automático de Fuerza 4. Además, cualquier
        miniatura alcanzada se incendia con un resultado de 4+ (ver Reglas de Fuego). Los Traga
        Fuego pueden usar este ataque de aliento incluso cuando estén trabados en combate cuerpo a
        cuerpo.
    name_i18n:
      es: Palo de Fuego
  - id: hireling.hired-sword.fire-eater.rule.inhaling-fire
    name: Inhaling Fire
    effect: >-
      After belching the first flume of heat, roll a D6 each time a Fire-Eater makes an additional
      breath attack. On a roll of 1 the Fire-Eater has inhaled the fire he should have been spewing!
      The warrior suffers a Strength 4 hit instead of using the flame template.
    effect_i18n:
      es: >-
        Después de escupir la primera lengua de fuego, tira un D6 cada vez que el Traga Fuego
        realice un ataque de aliento adicional. Con un resultado de 1, el Traga Fuego ha inhalado el
        fuego que debía escupir. El guerrero sufre un impacto de Fuerza 4 en lugar de usar la
        plantilla de llamas.
    name_i18n:
      es: Inhalando Fuego
  source_refs:
  - manual: broheim.net
    printed_page: 4
    section: Specialists / Fire-Eater
    url: https://broheim.net/downloads/hiredswords/mutinyinmarienburg/Specialists.pdf
