    - item_id: long_boathook
      quantity:
        kind: fixed
        value: 1
      notes: Resolved to the KB `long_boathook` item (trollheim catalog).
    - item_id: sword
      quantity:
        kind: fixed
        value: 1
      notes: Cutlass counts as a sword.
    - item_id: pistol
