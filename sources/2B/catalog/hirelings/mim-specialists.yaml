  starting_skill_ids: []
  rules:
  - id: hireling.hired-sword.midshipman.rule.pilot
    name: Pilot
    effect: >-
      A boat piloted by the Hero may re-roll results on the Propulsion Damage Chart once. The second
      result must be accepted even if it is worse.
    effect_i18n:
      es: >-
        Una embarcación pilotada por el Héroe puede repetir una vez los resultados de la Tabla de
        Daños de Propulsión. Siempre debe aceptarse el segundo resultado, aunque sea peor.
    name_i18n:
      es: Piloto
  - id: hireling.hired-sword.midshipman.rule.rigger
    name: Rigger
    effect: >-
      The Hero is skilled in fixing minor damage to watercraft. If the boat or barge is stationary
      and has not moved during the last turn then if the Hero is in contact with it, he may repair
      one location previously damaged or set on fire. ie, a paddle or mast. The Hero may do nothing
      else that turn and the boat may not be moved. A boat cannot be repaired if an enemy model is
      in contact with the Hero or the watercraft.
    effect_i18n:
      es: >-
        El Héroe es diestro reparando daños menores en embarcaciones. Si el bote o la barcaza está
        detenido y no se ha movido durante el último turno, y el Héroe está en contacto con él,
        puede reparar una localización dañada o incendiada previamente, es decir, un remo o un
        mástil. El Héroe no puede hacer nada más ese turno y la embarcación no puede moverse. No se
        puede reparar una embarcación si hay una miniatura enemiga en contacto con el Héroe o con la
        embarcación.
    name_i18n:
      es: Cordelista
  - id: hireling.hired-sword.midshipman.rule.a-crew-fer-me
    name: A Crew Fer Me!
    effect: >-
      A midshipman craves the comradery and adventure of the sea and a worthy crew. As such, any
      seafaring warbands gain a +1 to blood pact rolls with the Midshipman.
    effect_i18n:
      es: >-
        Un guardiamarina ansía la camaradería y la aventura del mar, así como una tripulación digna.
        Por ello, las bandas navales obtienen un +1 en las tiradas de pacto de sangre con el
        Guardiamarina.
    name_i18n:
      es: ¡Una Tripulación para Mí!
  source_refs:
  - manual: broheim.net
    printed_page: 5
    section: Specialists / Midshipman
    url: https://broheim.net/downloads/hiredswords/mutinyinmarienburg/Specialists.pdf
