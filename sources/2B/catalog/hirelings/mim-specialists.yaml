  rules:
  - id: hireling.hired-sword.sister-of-sigmar.rule.blessing-of-sigmar
    name: Blessing of Sigmar
    effect: The Sister has two of the special skills from page 83 of Mordheim Rulebook.
    effect_i18n:
      es: La Hermana tiene dos de las habilidades especiales de la página 83 del libro de Mordheim.
    name_i18n:
      es: Bendición de Sigmar
  - id: hireling.hired-sword.sister-of-sigmar.rule.candle-tree
    name: Candle Tree
    effect: >-
      Sisters were orphaned children. In holy light they are recognised as saviours of orphans
      including mutants with minor afflictions. Arcane Candelabrum counts as a holy relic, brazier
      iron and lantern that is used one-handed. Any mutant taken out of action by the Sister of
      Sigmar is captured.
    effect_i18n:
      es: >-
        Las Hermanas fueron niños huérfanos. A la luz sagrada se las reconoce como salvadoras de
        huérfanos, incluidos los mutantes con aflicciones menores. El Candelabro Arcano cuenta como
        reliquia sagrada, brasero de hierro y farol que se usa a una mano. Cualquier mutante dejado
        Fuera de combate por la Hermana de Sigmar es capturado.
    name_i18n:
      es: Árbol de Candelas
