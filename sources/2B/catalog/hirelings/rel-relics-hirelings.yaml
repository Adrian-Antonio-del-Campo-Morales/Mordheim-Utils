schema_version: 1
ruleset: mordheim
catalog: hirelings-hired-swords
grade: 2b
# Hirelings introduced by the 'Relics of the Crusades' (REL) Araby campaign
# anthology (Broheim). Priced in DINARS, the Araby campaign currency (documented
# per profile; at promotion decide whether to keep the dinar pricing with a
# currency note or normalize to gold crowns).
#
# Extracted from the anthology text bundled with the REL band PDFs
# (build/cache/2b-pdfs/text/muzil-rel.txt, pp. 15-16).
profiles:
- id: hireling.hired-sword.crimashin
  kind: hired-sword
  grade: 2b
  publication: Relics of the Crusades (Broheim anthology)
  name: Crimashin
  name_i18n:
    es: Crimashin
  normalization_status: normalized
  characteristics:
    M: 4
    WS: 4
    BS: 3
    S: 4
    T: 4
    W: 1
    I: 5
    A: 2
    Ld: 7
  warband_rating:
    kind: base_plus_experience
    base: 12
    per_experience_point: 1
  equipment:
    fixed_items:
    - item_id: dagger
      quantity:
        kind: fixed
        value: 1
      notes: Gromril dagger — counts as a dagger with the gromril weapon upgrade (KB materials-and-upgrades
        `gromril_weapon`).
    - item_id: sword
      quantity:
        kind: fixed
        value: 1
  skill_access:
  - combat
  - speed
  starting_skill_ids: []
  rules:
  - id: hireling.hired-sword.crimashin.rule.infiltrate
    name: Infiltrate
    effect: >-
      A Crimashin starts with the Infiltrate skill and may choose from the Combat and Speed lists
      when he gains a new skill.
    effect_i18n:
      es: >-
        Un Crimashin empieza con la habilidad Infiltrarse y puede elegir de las listas de Combate y
        Velocidad cuando gana una habilidad nueva.
    name_i18n:
      es: Infiltrarse
  - id: hireling.hired-sword.crimashin.rule.a-worthy-foe
    name: A Worthy Foe
    effect: >-
      The Grand Master will only lend one of his operatives if he can gain something from the
      transaction, such as the assassination of powerful enemy. A Crimashin will only be a part of a
      warband if its opponents have a rating of over 250.
    effect_i18n:
      es: >-
        El Gran Maestro solo prestará a uno de sus operativos si puede ganar algo con la
        transacción, como el asesinato de un poderoso enemigo. Un Crimashin solo formará parte de
        una banda si sus oponentes tienen una valoración superior a 250.
    name_i18n:
      es: Un Adversario Digno
  source_refs:
  - manual: broheim.net
    printed_page: 16
    section: Hired Swords / Crimashin
    url: https://broheim.net/downloads/fo/97RelicsoftheCrusadesPt2.pdf
- id: hireling.hired-sword.holy-man
  kind: hired-sword
  grade: 2b
  publication: Relics of the Crusades (Broheim anthology)
  name: Holy Man
  name_i18n:
    es: Hombre Santo
  normalization_status: normalized
  characteristics:
    M: 4
    WS: 3
    BS: 2
    S: 3
    T: 3
    W: 1
    I: 4
    A: 1
    Ld: 8
  warband_rating:
    kind: base_plus_experience
    base: 12
    per_experience_point: 1
  equipment:
    fixed_items:
    - item_id: staff
      quantity:
        kind: fixed
        value: 1
      notes: Treat as a double-handed weapon.
    - item_id: hammer
      quantity:
        kind: fixed
        value: 1
      notes: Blunt hand weapon, treat as a hammer.
  skill_access:
  - strength
  starting_skill_ids: []
  rules:
  - id: hireling.hired-sword.holy-man.rule.true-believer
    name: True Believer
    effect: >-
      A Holy Man starts with two spells from the Divine Intervention spell list (these are the same
      as the Prayers of Sigmar as detailed in the core rules).
    effect_i18n:
      es: >-
        Un Hombre Santo empieza con dos hechizos de la lista de hechizos Intervención Divina (son
        los mismos que las Plegarias de Sigmar según se detallan en las reglas básicas).
    name_i18n:
      es: Creyente Verdadero
  - id: hireling.hired-sword.holy-man.rule.holy
    name: Holy
    effect: >-
      If a warband that follows the Path of Sigmar or The One hires a Holy Man, his hire fee will be
      reduced to 20 dinars.
    effect_i18n:
      es: >-
        Si una banda que sigue el Sendero de Sigmar o El Uno contrata a un Hombre Santo, su coste de
        contratación se reduce a 20 dinares.
    name_i18n:
      es: Santo
  - id: hireling.hired-sword.holy-man.rule.skills
    name: Skills
    effect: A Holy Man may choose from the Strength and Holy lists when he gains a new skill.
    effect_i18n:
      es: >-
        Un Hombre Santo puede elegir de las listas de Fuerza y Santa cuando gana una habilidad
        nueva.
    name_i18n:
      es: Habilidades
  source_refs:
  - manual: broheim.net
    printed_page: 16
    section: Hired Swords / Holy Man
    url: https://broheim.net/downloads/fo/97RelicsoftheCrusadesPt2.pdf
