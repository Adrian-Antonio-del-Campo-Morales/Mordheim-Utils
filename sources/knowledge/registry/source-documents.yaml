schema_version: 1
# Documentos fuente del cotejo de catálogo contra fuente.
#
# Cada entrada es **un documento**, no una cita: `source_refs` de un registro del
# catálogo lleva la sección y la página, y el `url` apunta aquí. Un documento que
# se cita con dos formas (`Specialists.pdf` y `MiM%20Specialists.pdf`) se declara
# una vez, con sus dos `urls`, para que las dos citas cotejen la misma copia.
#
# `mirror` es dónde el espejo local (`build/cache/`) guarda la copia descargada,
# relativo a la raíz del espejo. Un `pdf` se lee con el corpus de geometría
# (`PdfCorpus`) y una `page` con el corpus que la copia declare: el HTML trae la
# estructura y el `.txt` hermano es el respaldo sin geometría. Que la copia no
# esté descargada no es un error del registro: el cotejo declara el hueco con la
# ruta que le falta, y esta ruta es la instrucción para rellenarlo.
documents:
# --- los PDFs de broheim.net (2B) ------------------------------------------
- id: broheim.karak-azgal
  manual: broheim.net
  kind: pdf
  mirror: 2b-pdfs/adventurers-kaz.pdf
  urls:
  - https://broheim.net/downloads/campaigns/karakazgal/Karak Azgal.pdf
