  name: Rousing Sermon
  name_i18n:
    es: Sermón Enardecedor
  category: special
  kind: profile
  effect: >-
    At own-turn start the Warrior Priest may declare +1 Attack for this combat phase, once per duel.
    Other friendly models are outside the 1v1 scope.
  effect_i18n:
    es: >-
      Al inicio de su turno el Sacerdote Guerrero puede declarar +1 Ataque durante esta fase de
      combate, una vez por duelo. Otras miniaturas amigas quedan fuera del ámbito 1v1.
  engine_option: Rousing Sermon
  source_refs:
