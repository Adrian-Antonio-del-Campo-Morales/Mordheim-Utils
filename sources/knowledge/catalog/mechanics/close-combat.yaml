- id: weapon.chainsaw-sword
  name: Chainsaw Sword
  name_i18n:
    es: Espada Motosierra
  effect: 'A mechanical nightmare borne of insanity, this ear-splitting device tears through armour with ease. Range: Close Combat. Strength: As user. Special Rules: Fear, Shredder. Fear: Incredibly loud and belching forth a sickly green smoke, this weapon causes even seasoned soldiers to quiver. A model bearing a Chainsaw Sword causes Fear. Shredder: The Chainsaw sword rips and chews through armour as if it were cloth. All blows from a Chainsaw Sword are at -2 Armour Save.'
  effect_i18n:
    es: 'Una pesadilla mecánica fruto de la locura, este estruendoso artilugio desgarra la armadura con facilidad. Alcance: combate cuerpo a cuerpo. Fuerza: como el usuario. Reglas Especiales: Miedo, Trituradora. Miedo: Increíblemente ruidosa y escupiendo un humo verdoso enfermizo, esta arma hace temblar incluso a los soldados más curtidos. Una miniatura que lleve una Espada Motosierra causa Miedo. Trituradora: La Espada Motosierra desgarra y mastica la armadura como si fuera trapo. Todos los golpes de una Espada Motosierra reciben -2 a la salvación por armadura.'
  hands: 1
  paired: false
  main_hand: true
  off_hand: true
  engine_option: Chainsaw sword
  rules_source_url: https://mordheimer.net/docs/warbands/grade-2a-warbands/masters-of-horror
  source_refs:
  - manual: sylvania-supplement
    printed_page: 0
    section: Special Equipment / Chainsaw Sword
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/masters-of-horror
- id: weapon.hellblade
  name: Hellblade
  name_i18n:
    es: Hoja Infernal
  effect: 'Cost 35 gc, Availability Rare 8. A rare blade charged with the power of Khorne himself. Range: Close Combat; Strength: As user +1; Special Rules: Soulseeking, Two-handed, Deadly, Magical. Soulseeking: all attacks made with a Hellblade are at +1 To Hit; this does not work on Undead or Demon models. Two-handed: a model armed with a Hellblade may not use a shield, buckler or additional weapon in close combat; if the model has a shield he still gets a +1 bonus to his armour save against shooting. Deadly: a Hellblade causes critical hits on rolls of 5 or 6; this rule does not apply if the warrior requires 5s or higher to wound. Magical: all attacks from a Hellblade count as Magical; a Hellblade cannot be made of Gromril, Ithilmar or similar mortal metals.'
  effect_i18n:
    es: 'Coste: 35 coronas, Disponibilidad Rara 8. Una hoja rara cargada con el poder del propio Khorne. Alcance: cuerpo a cuerpo; Fuerza: la del usuario +1; Reglas especiales: Buscadora de Almas, a dos manos, Mortífera, Mágica. Buscadora de Almas: todos los ataques con una Hoja Infernal golpean con +1; no funciona contra modelos No Muertos ni Demonios. A dos manos: un modelo con una Hoja Infernal no puede usar escudo, broquel ni arma adicional en combate; si el modelo lleva escudo, conserva el +1 a su salvación por armadura contra disparos. Mortífera: una Hoja Infernal causa impactos críticos con tiradas de 5 o 6; esta regla no se aplica si el guerrero necesita 5 o más para herir. Mágica: todos los ataques de una Hoja Infernal cuentan como Mágicos; no puede estar forjada en gromril, ithilmar ni metales mortales similares.'
  hands: 2
  paired: false
  main_hand: true
  off_hand: false
  engine_option: Hellblade
  source_refs:
  - manual: broheim.net
    printed_page: 2
    section: Special Equipment / Hellblade
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Khorne%20Raiders.pdf
  rules_source_url: https://mordheimer.net/docs/warbands/grade-1b-warbands/khorne-raiders
