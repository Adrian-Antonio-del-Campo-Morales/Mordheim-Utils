  effect_i18n:
    es: Un mercenario nórdico ha entrenado con un escudo desde la infancia, llegando a ser tan diestro que repele cualquier golpe. Un Guardaespaldas Hombre Oso puede parar con él además de obtener su tirada de salvación.
