    url: https://mordheimer.net/docs/rules/leadership-psychology
- id: mechanic.automatic-leadership
  name: Automatic Leadership Tests
  name_i18n:
    es: Chequeos de Liderazgo Automáticos
  category: special
  kind: profile
  effect: Automatically pass any required Leadership test without rolling dice.
  effect_i18n:
    es: Supera automáticamente cualquier chequeo de Liderazgo requerido sin tirar dados.
  engine_option: Automatic Leadership Tests
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
