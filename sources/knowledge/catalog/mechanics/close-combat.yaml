    section: heroes / 0-2 Templars / Special Rules / Zealous
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/protectorate-of-sigmar
- id: mechanic.hatred-skaven
  name: Miraglean — Hatred of Skaven
  name_i18n:
    es: Miragleo — Odio a los Skaven
  category: special
  kind: profile
  effect: All Miraglean warband members are subject to Hatred against Skaven. Hired Swords do not gain this Hatred.
  effect_i18n:
    es: Todos los miembros de una banda miraglea están sujetos a Odio contra los skaven. Las Espadas a sueldo no ganan este Odio.
