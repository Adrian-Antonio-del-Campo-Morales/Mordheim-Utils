    section: Special Rules / Hate Skavens, Orcs and Goblins
    url: https://broheim.net/downloads/campaigns/karakazgal/Karak Azgal.pdf
- id: mechanic.hatred-dwarfs-skaven
  name: Hate Stunties and Skaven
  name_i18n:
    es: Odio a los Stunties y Skaven
  category: special
  kind: profile
  effect: Night Goblins are subject to hatred towards Dwarfs and Skaven. This only affects Night Goblins, not any other greenskins. Fanatics are so out of their skull that they are not affected.
  effect_i18n:
    es: Los Goblins Nocturnos están sujetos a odio hacia los Enanos y los Skaven. Esto solo afecta a los Goblins Nocturnos, no a otros pieles verdes. Los Fanáticos están tan fuera de sí que no se ven afectados.
  engine_option: Hate Stunties and Skaven
  source_refs:
