- id: condition.massively-built-lost-turn
  name: Massively Built — Lost Turn
  name_i18n:
    es: Complexión Masiva — Turno Perdido
  effect: >-
    The supplied target of a failed Massively Built check loses its entire next turn as it stands
    dumbfounded. The check itself, its shooting-phase activation, the 12-inch range and the
    visibility of a male target stay outside the duel; the caller supplies the failed outcome. The
    printed exemption stays with the supplied fact, not with a generic immunity. Females, Skaven,
    Orcs and other non-human races are immune, while Vampires and Necromancers are not, and Elves
    and Dwarves are affected.
  effect_i18n:
    es: >-
      El objetivo suministrado de una prueba fallida de Complexión Masiva pierde su turno siguiente
      completo, aturdido por su imponente volumen. La prueba en sí, su activación en fase de
      disparo, el alcance de 12" y la visibilidad de un objetivo masculino quedan fuera del duelo;
      el llamador aporta el resultado fallido. La excepción impresa permanece en el hecho
      suministrado, no en una inmunidad genérica. Las mujeres, los Skaven, los Orcos y otras razas
      no humanas son inmunes, mientras que los Vampiros y Nigromantes no lo son, y Elfos y Enanos se
      ven afectados.
  engine_option: Massively Built Lost Turn
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Dramatis Personae / “Busty” Gwen / Special Rules / Massively Built
    url: https://mordheimer.net/docs/campaigns/dramatis-personae/grade-2a
