    Gains Frenzy after taking an enemy out of action; lost when knocked down, stunned or out of
    action.
  effect_i18n:
    es: >-
      Gana Frenesí al dejar al enemigo fuera de combate; se pierde al quedar derribado, aturdido o
      fuera de combate.
  engine_option: Great Thirster
  source_refs:
  - manual: sylvania-supplement
