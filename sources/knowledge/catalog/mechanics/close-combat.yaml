- id: mechanic.herb-lore
  name: Herb Lore
  name_i18n:
    es: Sabiduría de las Hierbas
  effect: >-
    Out in the Cursed Marsh, Swamp-folk learn basic herb lore to cure simple injuries. Any model in
    base contact with the Swamper may be healed at the start of the recovery phase. On a roll of 4+
    the model has 1 wound restored. The Swamper may not move in the same turn as he uses this skill,
    but may use it to heal himself.
  effect_i18n:
    es: >-
      En la Marisma Maldita, la gente del pantano aprende conocimientos básicos de hierbas para
      curar heridas simples. Cualquier modelo en contacto con el Cienaguero puede ser curado al
      comienzo de la fase de recuperación. Con un resultado de 4+ el modelo recupera 1 herida. El
      Cienaguero no puede moverse en el mismo turno en que usa esta habilidad, pero puede usarla
      para curarse a sí mismo.
  engine_option: Herb Lore
  source_refs:
