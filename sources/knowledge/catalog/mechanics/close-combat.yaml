  effect_i18n:
    es: >-
      Durante cada turno del Vampiro, un enemigo varón en contacto de peana debe hacer un chequeo
      contra su propio Liderazgo. Si falla, el jugador Lahmia controla inmediatamente a ese
      guerrero. Cualquier ataque de la banda Lahmia que impacte al guerrero controlado rompe el
      control. Haz un chequeo en cada fase de Recuperación para ver si el guerrero recupera el
      control. Solo un guerrero puede estar controlado a la vez. Los modelos inmunes a la
      Psicología, los No-muertos, los Demonios y los modelos sujetos a Estupidez no se ven
      afectados.
  source_refs:
  - manual: chaos-in-the-streets
    printed_page: 183
    section: Lahmia Special Skills / Seduction
- id: mechanic.hypnotic-gaze
  kind: profile
  category: special
  name: Hypnotic Gaze
  name_i18n:
    es: Mirada Hipnótica
  engine_option: Hypnotic Gaze
  effect: >-
    Once per turn, one enemy in base contact must pass a Leadership test using its own Leadership,
    not the leader's. If it fails, it may not attack that turn and all attacks against it hit
    automatically. Models immune to Psychology are unaffected.
  effect_i18n:
    es: >-
      Una vez por asalto, un enemigo en contacto de peana debe superar un chequeo de Liderazgo
      usando su propio Liderazgo, no el del líder. Si falla, no puede atacar ese asalto y todos los
      ataques contra él impactan automáticamente. Los modelos inmunes a la Psicología no se ven
      afectados.
  source_refs:
  - manual: chaos-in-the-streets
    printed_page: 181
    section: Von Carstein Special Skills / Hypnotic Gaze
- id: mechanic.lahmian-hypnotize
  kind: profile
  category: special
  name: Lahmian Hypnotize
  name_i18n:
    es: Hipnotizar
  engine_option: Lahmian Hypnotize
  effect: >-
    At the start of the Combat phase, choose one enemy model in base contact with the Vampire. That
    model must pass a Leadership test or it may not attack that turn and all attacks directed
    against it gain +1 To Hit. Models immune to Psychology are unaffected.
  effect_i18n:
    es: >-
      Al comienzo de la fase de Combate, elige un modelo enemigo en contacto de base con el Vampiro.
      Ese modelo debe superar un chequeo de Liderazgo o no podrá atacar ese turno y todos los
      ataques dirigidos contra él obtienen +1 por Golpear. Los modelos inmunes a la Psicología no se
      ven afectados.
  source_refs:
  - manual: khemri
    printed_page: 90
    section: Lahmian Vampire Special Skills / Hypnotize
- id: mechanic.lahmian-seduction
  kind: profile
  category: special
  name: Lahmian Seduction
  name_i18n:
    es: Seducción
  engine_option: Lahmian Seduction
  effect: >-
    At the start of the Combat phase, the Vampire first takes a Leadership test. If she passes,
    choose one enemy model in base contact; that model must pass its own Leadership test or it
    becomes controlled by the Vampire's player. The original owner may attempt to regain control
    during each Recovery phase by passing a Leadership test. If the Vampire attacks the seduced
    warrior, control ends automatically. If the battle ends while the warrior is still controlled,
    that warrior counts as Out of Action. Only one warrior may be controlled at a time, and models
    immune to Psychology are unaffected.
  effect_i18n:
    es: >-
      Al comienzo de la fase de Combate, el Vampiro realiza primero un chequeo de Liderazgo. Si lo
      supera, elige un modelo enemigo en contacto de base; ese modelo debe superar su propio chequeo
      de Liderazgo o pasa a estar controlado por el jugador del Vampiro. El propietario original
      puede intentar recuperar el control durante cada fase de Recuperación superando un chequeo de
      Liderazgo. Si el Vampiro ataca al guerrero seducido, el control termina automáticamente.
  source_refs:
  - manual: khemri
    printed_page: 90
    section: Lahmian Vampire Special Skills / Seduction
- id: mechanic.sea-shanty
  name: Sea Shanty Singer
  name_i18n:
    es: Cantante de Salomas
  kind: profile
  category: special
  engine_option: Sea Shanty Singer
  effect: >-
    The pirate is renowned throughout the seas as one of the greatest singers aboard a ship, able to
    raise the spirits of any crew with his stirring renditions of 'The Sloop Johan Bee', 'What do
    you do with a Drunken Halfling?', and other famous pirate ditties. At the start of his Close
    Combat phase he can suddenly burst out in song, distracting one opponent in base contact of his
    choosing. That enemy must pass a Leadership test, or lose 1 Attack that turn. This does not
    affect Undead or other non-living creatures, such as Possessed.
  effect_i18n:
    es: >-
      El pirata es renombrado en todos los mares como uno de los mejores cantantes de a bordo, capaz
      de levantar los ánimos de cualquier tripulación con sus conmovedoras versiones de 'La Goleta
      Johan Bee', '¿Qué se hace con un Halfling Borracho?' y otras famosas coplas piratas. Al inicio
      de su fase de Combate Cuerpo a Cuerpo puede estallar de repente en canción, distrayendo a un
      oponente en contacto de peana de su elección. Ese enemigo debe superar un chequeo de
      Liderazgo, o perder 1 Ataque ese asalto. Esto no afecta a No-muertos ni otras criaturas no
      vivientes, como los Poseídos.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Pirate Special Skills / Sea Shanty Singer
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/pirates
- id: mechanic.sea-shanty-psychology
  name: Sea Shanty Singer
  name_i18n:
    es: Cantante de Salomas
  kind: profile
  category: special
  engine_option: Sea Shanty Singer
  effect: >-
    At the start of the Combat phase, choose one enemy model in base contact with the Hero. That
    model must pass a Leadership test or lose 1 Attack for that turn. Models immune to Psychology
    are unaffected.
  effect_i18n:
    es: >-
      Al comienzo de la fase de Combate, elige un modelo enemigo en contacto de base con el Héroe.
      Ese modelo debe superar un chequeo de Liderazgo o perder 1 Ataque ese turno. Los modelos
      inmunes a la Psicología no se ven afectados.
  source_refs:
  - manual: lustria
    printed_page: 91
    section: Pirate Special Skills / Sea Shanty Singer
- id: mechanic.crude-belch-ogre
  name: Crude Belch
  name_i18n:
    es: Eructo Grosero
  kind: profile
  category: special
  engine_option: Crude Belch
  effect: >-
    Ogres eat almost anything. Consequences are to be expected from those inconsiderate enough to
    consume a rich meal before battle. A Hero with this 'condition' may unleash his thunderous fumes
    on all enemies engaged in close combat. Those that do not pass a Ld test suffer a -1 'to hit'
    modifier for the turn. The Ogre must wait until a new enemy engages him in combat before he
    relieves himself again.
  effect_i18n:
    es: >-
      Los ogros comen casi cualquier cosa. De los inconscientes que consumen una comida copiosa
      antes de la batalla son de esperar consecuencias. Un héroe con esta 'afección' puede soltar
      sus humos atronadores sobre todos los enemigos empeñados en combate cuerpo a cuerpo. Los que
      no superen un chequeo de Ld sufren un modificador de -1 para impactar durante el asalto. El
      ogro debe esperar a que un nuevo enemigo lo entable en combate antes de aliviarse de nuevo.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Ogres special skills / crude belch
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/maneaters
- id: mechanic.noblesse-stomp
  name: Noblesse Obliges
  name_i18n:
    es: Noblesse Oblige
  kind: profile
  category: special
  engine_option: Noblesse Obliges
  effect: >-
    The warrior feels utterly superior to his opponents, with long lineage and prestige to look down
    upon his common enemies, seen as nothing more than cattle to be slaughtered. The Warrior is
    immune to fear and can stomp opponents who are knocked down with is iron-shod boots. This gives
    them additional attack against Knocked down opponents at their own Strength.
  effect_i18n:
    es: >-
      El guerrero se siente totalmente superior a sus oponentes, con un largo linaje y prestigio
      para mirar por encima del hombro a sus enemigos plebeyos, vistos como nada más que ganado para
      ser sacrificado. El Guerrero es inmune al miedo y puede pisotear a los oponentes Derribados
      con sus botas con suela de hierro. Esto les otorga un ataque adicional contra oponentes
      Derribados con su propia Fuerza.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Cursed Cavalcade Special Skills / Noblesse obliges
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/cursed-cavalcade
- id: mechanic.feral-instinct
  name: Feral Instinct
  name_i18n:
    es: Instinto Feral
  kind: profile
  category: special
  engine_option: Feral Instinct
  effect: >-
    Even a Guide has difficulty controlling such feral beasts. At the beginning of the Ogres turn
    the Sabretusk must pass a Leadership test. If the test is failed, the opponent may move the
    Sabretusk this turn. An uncontrolled Sabretusk may charge models from his own warband!
  effect_i18n:
    es: >-
      Incluso un Guía tiene dificultades para controlar bestias tan feroces. Al comienzo del turno
      del ogro, el Diente de Sable debe superar un chequeo de Liderazgo. Si falla el chequeo, el
      oponente puede mover al Diente de Sable este turno. Un Diente de Sable descontrolado ¡puede
      cargar contra modelos de su propia banda!
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 2 Sabretusks / Special Rules / Feral Instinct
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/maneaters
