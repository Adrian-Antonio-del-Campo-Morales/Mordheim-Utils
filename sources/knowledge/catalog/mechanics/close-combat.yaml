- id: mechanic.causes-fear
  name: Causes Fear
  name_i18n:
    es: Causa Miedo
  category: special
  kind: profile
  effect: >-
    Enemies test Leadership when charging or being charged by this warrior; failure prevents a
    voluntary charge or requires sixes to hit for that combat round. Fear-causing warriors ignore
    these tests.
  effect_i18n:
    es: >-
      Los enemigos chequean Liderazgo al cargar o recibir una carga de este guerrero; fallar impide
      una carga voluntaria o exige seises para impactar en esa ronda de combate. Los guerreros que
      causan Miedo ignoran estos chequeos.
  engine_option: Causes Fear
  source_refs:
  - manual: mordheim-rulebook
    printed_page: 23
    section: Leadership and Psychology / Fear
    url: https://broheim.net/downloads/rules/Mordheim%20-%20Part%201%20-%20Background%20%26%20Rules.pdf
- id: skill.fearsome
  name: Fearsome
  category: strength
  effect: The warrior causes fear in opposing models.
  effect_i18n:
    es: El guerrero provoca Miedo en los modelos enemigos.
  kind: general
  rules_source_url: https://mordheimer.net/docs/campaigns/skills
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Skills / Strength Skills / Fearsome
    url: https://mordheimer.net/docs/campaigns/skills
  name_i18n:
    es: Temible
  engine_option: Fearsome
- id: mechanic.cold-blooded-psychology
  name: Cold-Blooded (Psychology)
  name_i18n:
    es: Sangre Fría (Psicología)
  category: special
  kind: profile
  effect: >-
    For individual Psychology tests, roll three dice and keep the lowest two. This does not alter
    other Leadership tests.
  effect_i18n:
    es: >-
      En chequeos individuales de Psicología, tira tres dados y conserva los dos más bajos. No
      modifica otros chequeos de Liderazgo.
  engine_option: Cold-Blooded (Psychology)
  source_refs:
  - manual: broheim.net
    printed_page: 1
    section: Lizardmen / Cold Blooded
    url: https://broheim.net/downloads/warbands/supplement/lustria/Lizardmen.pdf
- id: mechanic.cold-blooded-leadership
  name: Cold-Blooded (Leadership)
  name_i18n:
    es: Sangre Fría (Liderazgo)
  category: special
  kind: profile
  effect: For individual Leadership tests, roll three dice and discard the highest result.
  effect_i18n:
    es: En chequeos individuales de Liderazgo, tira tres dados y descarta el resultado más alto.
  engine_option: Cold-Blooded (Leadership)
  source_refs:
  - manual: broheim.net
    printed_page: 2
    section: Lords of the Marsh / Cold-blooded
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Lords%20Of%20The%20Marsh.pdf
- id: mechanic.craven
  name: Craven
  name_i18n:
    es: Cobarde
  category: special
  kind: profile
  effect: >-
    In the supported normal duel, this warrior is subject to Fear even if it causes Fear. Mystic
    Mist protection is outside the simulator's map-rule scope.
  effect_i18n:
    es: >-
      En el duelo normal admitido, este guerrero está sujeto al Miedo aunque lo cause. La protección
      por Niebla Mística queda fuera del alcance de reglas de mapa del simulador.
  engine_option: Craven
  source_refs:
  - manual: broheim.net
    printed_page: 3
    section: Lords of the Marsh / Draich / Craven
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Lords%20Of%20The%20Marsh.pdf
- id: mechanic.stupidity
  name: Stupidity
  name_i18n:
    es: Estupidez
  category: special
  kind: profile
  effect: >-
    Test individual Leadership at the start of each own turn. Failure prevents close-combat attacks
    until the next own turn, without changing enemy hit rolls. Random board movement is outside duel
    scope.
  effect_i18n:
    es: >-
      Chequea Liderazgo individual al inicio de cada turno propio. Un fallo impide atacar cuerpo a
      cuerpo hasta el siguiente turno propio, sin cambiar las tiradas para impactar del enemigo. El
      movimiento aleatorio por el tablero queda fuera del duelo.
  engine_option: Stupidity
  source_refs:
  - manual: mordheim-rulebook
    printed_page: 23
    section: Leadership and Psychology / Stupidity
    url: https://broheim.net/downloads/rules/Mordheim%20-%20Part%201%20-%20Background%20%26%20Rules.pdf
- id: mechanic.handler-leadership
  name: Handler-Only Leadership
  name_i18n:
    es: Liderazgo Exclusivo del Adiestrador
  category: special
  kind: profile
  effect: >-
    Use own Leadership or the supplied eligible handler's own value within 6 inches. Ordinary
    warband Leader borrowing is prohibited. For Cold One Beasthounds the Beastmaster's value cannot
    include borrowed Leader bonuses.
  effect_i18n:
    es: >-
      Usa Liderazgo propio o el valor propio indicado del adiestrador válido a 6 pulgadas. No
      permite usar el Liderazgo del jefe de banda. Para Mastines Gélidos el valor del Maestro de
      Bestias no incluye bonificaciones prestadas del jefe.
  engine_option: Handler-only Leadership
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Dark Elves / Cold One Beasthounds / Stupidity
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/dark-elves
- id: mechanic.brood-mentality
  name: Brood Mentality
  name_i18n:
    es: Mentalidad de Cría
  category: special
  kind: profile
  effect: >-
    Add the supplied active Brood Mentality bonus to individual Stupidity Leadership tests only. No
    nearby-group counting is simulated.
  effect_i18n:
    es: >-
      Suma la bonificación activa indicada de Mentalidad de Cría solo al Liderazgo de los chequeos
      individuales de Estupidez. No se simula el recuento de grupos cercanos.
  engine_option: Brood Mentality
  source_refs:
  - manual: broheim.net
    printed_page: 1
    section: Brood of Ghurash / Brood Mentality
