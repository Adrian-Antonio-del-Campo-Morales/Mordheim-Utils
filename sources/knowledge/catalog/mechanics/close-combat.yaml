    gaining +1 Attack. In close combat, it scores a critical hit on a 'to wound' roll of 5-6 instead
    of only 6. When combined with Eshin Fighting Claws, this grants +2 Attacks instead of +1.
  kind: profile
  engine_option: Art of Silent Death
  source_refs: []
  name_i18n:
    es: Arte de la Muerte Silenciosa
  effect_i18n:
    es: >-
      El Héroe puede luchar con las garras desnudas sin penalización y cuenta como usando dos armas
      cuerpo a cuerpo, ganando +1 Ataque. En el combate cuerpo a cuerpo, causa un impacto crítico
      con una tirada de herir de 5-6 en lugar de solo 6. Combinado con las Garras de Combate de
      Eshin, esto otorga +2 Ataques en lugar de +1.
- id: skill.unarmed-critical-strikes
  name: Unarmed Critical Strikes
  category: special
  effect: Unarmed attacks score critical hits on To Wound rolls of 5-6.
  effect_i18n:
    es: >-
      Los ataques desarmados logran golpes críticos con tiradas para herir de 5-6.
  kind: profile
  engine_option: Unarmed Critical Strikes
  source_refs: []
  name_i18n:
    es: Golpes Críticos Desarmado
- id: skill.blessed-sight
  name: Blessed Sight
  category: special
  effect: >-
    The Augur may re-roll failed characteristic tests and failed rolls to hit in close combat or
    shooting; the second result must be accepted. If she was not taken Out of Action, she rolls two
    dice for her contribution during Exploration and may choose either die as the result.
  kind: profile
  engine_option: Blessed Sight
  source_refs: []
  name_i18n:
    es: Vista Bendecida
  effect_i18n:
    es: >-
      La Augur puede repetir los chequeos de característica fallidos y las tiradas para impactar
      fallidas en combate cuerpo a cuerpo o con disparos; debe aceptarse el segundo resultado. Si no
      quedó Fuera de combate, tira dos dados por su contribución durante la Exploración y puede
      elegir cualquiera de los dos como resultado.
- id: skill.crack-shot
  name: Crack Shot
  category: special
  effect: >-
    Experts with pistols in close quarters; they have an uncanny ability to turn what should have
    missed its target into a success. When using pistols in close combat, they may re-roll any
    missed to-hit rolls with the pistol in the first round of combat.
  kind: profile
  engine_option: Crack Shot
  source_refs: []
  name_i18n:
    es: Tirador Certero
  effect_i18n:
    es: >-
      Expertos con las pistolas en espacios reducidos; tienen una capacidad asombrosa de convertir
      en acierto lo que debería haber fallado su objetivo. Al usar pistolas en combate cuerpo a
      cuerpo, pueden repetir cualquier tirada de impacto fallida con la pistola en la primera ronda
      de combate.
- id: skill.duellist
  name: Duellist
  category: special
  effect: >-
    If the Saurus Slayer is engaged with only a single opponent in melee, he may re-roll missed hits
    in the first round whether he charged or was charged.
  kind: profile
  engine_option: Duellist
  source_refs: []
  name_i18n:
    es: Duelista
  effect_i18n:
    es: >-
      Si el Matareaus está empeñado con un único oponente en melé, puede repetir los impactos
      fallados en el primer asalto, ya sea que haya cargado o sido cargado.
- id: skill.extra-attack
  name: Extra Attack
  category: special
  effect: Adds one Attack to the profile.
  effect_i18n:
    es: >-
      Añade un Ataque al perfil.
  kind: profile
  engine_option: Extra Attack
  source_refs: []
  name_i18n:
    es: Ataque Extra
- id: skill.hatred
  name: Hatred
  category: special
  effect: >-
    Battle Pilgrims suffer Hatred against all of their enemies, seeing them as enemies and heretics
    to the true Lady’s cause.
  kind: profile
  engine_option: Hatred
  source_refs: []
  name_i18n:
    es: Odio
  effect_i18n:
    es: >-
      Los Peregrinos de Guerra sufren Odio contra todos sus enemigos, considerándolos enemigos y
      herejes de la causa de la verdadera Dama.
- id: skill.swordmaster
  name: Swordmaster
  category: special
  effect: >-
    In order to remain alive, a Duelist picks up swordfighting techniques that few others master.
    The Duelist successfully parries an enemy blow on a roll equal to or over the roll to hit, not
    just over the roll as with normal parries. Obviously a Duelist must first be armed with a weapon
    or armour that allows him to Parry in order to use this rule.
  kind: profile
  engine_option: Swordmaster
  source_refs: []
  name_i18n:
    es: Maestro de la Espada
  effect_i18n:
    es: >-
      Para seguir con vida, un Duelista aprende técnicas de esgrima que pocos dominan. El Duelista
      emparanza con éxito un golpe enemigo con una tirada igual o superior a la tirada para
      impactar, no solo superior a la tirada como en las paradas normales. Obviamente, el Duelista
      debe estar armado primero con un arma o armadura que le permita Emparañar para usar esta
      regla.
- id: mechanic.black-hunger
  name: Black Hunger
  category: special
  effect: >-
    At the beginning of his turn, the Hero may invoke Black Hunger. For that turn he gains +1 Attack
    and adds the result of 1D6 x 0.4" + 1" to his Movement. At the end of the turn he suffers 1D3
    Strength 3 hits with no armour save.
  kind: warband
  engine_option: Black Hunger
  source_refs: []
  name_i18n:
    es: Hambre Negra
  effect_i18n:
    es: >-
      Al comienzo de su turno, el Héroe puede invocar el Hambre negra. Durante ese turno gana +1
      Ataque y añade a su Movimiento el resultado de 1D6 x 0,4" + 1". Al final del turno sufre 1D3
      impactos de Fuerza 3 sin tirada de salvación por armadura.
- id: mechanic.body-slam
  name: Body Slam
  category: special
  effect: >-
    Replaces charge attacks with one +1 Strength, +1 To Hit attack that critically wounds on 5+ and
    ignores weapon and skill modifiers.
  effect_i18n:
    es: >-
      Sustituye los ataques de carga por un único ataque con +1 a la Fuerza y +1 para
      impactar que hiere críticamente con 5+ e ignora los modificadores de armas y
      habilidades.
  kind: warband
  engine_option: Body Slam
  source_refs: []
  name_i18n:
    es: Planchazo
- id: mechanic.bull-charge
  name: Bull Charge
  category: special
  effect: >-
    Ogres learn to use their vast bulk in a charge, trampling the enemy to the ground. When
    charging, an Ogre with this skill may attempt a single attack with a +1 'to hit' modifier rather
    than making his normal attacks. If successful the enemy model is automatically knocked down.
  kind: warband
  engine_option: Bull Charge
  source_refs: []
  name_i18n:
    es: Carga de Toro
  effect_i18n:
    es: >-
      Los ogros aprenden a usar su enorme mole al cargar, arrollando al enemigo. Al cargar, un ogro
      con esta habilidad puede intentar un único ataque con un modificador de +1 para impactar en
      lugar de realizar sus ataques normales. Si tiene éxito, el modelo enemigo queda
      automáticamente derribado.
- id: mechanic.force-of-will
  name: Force of Will
  category: special
  effect: >-
    When the Hero loses his last Wound and would be taken Out of Action, roll D6. If the result is
    equal to or below Toughness, he stands back up and continues fighting. Repeat this roll in each
    subsequent combat round with a cumulative -1 modifier. If he is taken Out of Action a second
    time, remove him normally.
  kind: warband
  engine_option: Force of Will
  source_refs: []
  name_i18n:
    es: Fuerza de Voluntad
  effect_i18n:
    es: >-
      Cuando el Héroe pierde su última Herida y va a ser puesto Fuera de combate, tira D6. Si el
      resultado es igual o inferior a su Resistencia, se levanta y sigue luchando. Repite esta
      tirada en cada asalto de combate posterior con un modificador acumulativo de -1. Si es puesto
      Fuera de combate una segunda vez, retíralo con normalidad.
- id: mechanic.unpredictable-attack
  name: Unpredictable
  category: special
  effect: >-
    The Hero may declare one of its attacks Unpredictable; that attack cannot be parried by the
    opponent.
  kind: warband
  engine_option: Unpredictable
  source_refs: []
  name_i18n:
    es: Impredecible
  effect_i18n:
    es: >-
      El Héroe puede declarar uno de sus ataques Impredecible; ese ataque no puede ser emparañado
      por el oponente.
- id: mechanic.strike-first-vs-skinks-first-round
