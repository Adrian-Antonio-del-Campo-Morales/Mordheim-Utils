- id: mechanic.corruption
  name: Corruption
  name_i18n:
    es: Corrupción
  effect: >-
    Masters of finances are not good fighters but they are certainly skilled at convincing the enemy
    to leave them alone. When hit in close combat but before rolling to wound, the player
    controlling the Mazzalupo warband can give 5 gold crowns to the opponent for each model that hit
    the Master of finances. If it does, the corrupted model must reroll a successful attack roll.
    Each model cannot reroll more than one attack in this way, but multiple models can be bribed
    with 5 gold crowns each. Models immune to Psychology cannot be corrupted.
  effect_i18n:
    es: >-
      Los Maestros de Finanzas no son buenos luchadores, pero ciertamente son diestros convenciendo
      al enemigo de dejarlos en paz. Cuando le golpean en combate cuerpo a cuerpo pero antes de
      tirar para herir, el jugador que controle la banda Mazzalupo puede dar 5 coronas de oro al
      oponente por cada modelo que haya golpeado al Maestro de Finanzas. Si lo hace, el modelo
      corrompido debe repetir una tirada de impacto exitosa. Cada modelo no puede repetir más de un
      impacto de esta forma, pero se puede sobornar a varios modelos con 5 coronas de oro cada uno.
      Los modelos inmunes a la Psicología no pueden ser corrompidos.
  engine_option: Corruption
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: 0-1 Master of Finances / Special Rules / Corruption
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/mazzalupo
  kind: profile
  category: special
