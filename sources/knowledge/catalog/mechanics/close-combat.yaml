- id: mechanic.snorri-drunk
  name: Snorri's Drunk
  name_i18n:
    es: Embriaguez de Snorri
  kind: profile
  category: special
  effect: 'Supply the pre-battle drinking result: 2 reduces WS and S by 1; 3 has no effect; 4 gives all combatants within 2 inches -1 to hit; 5 adds 1 Strength; 6 grants Frenzy as an explicit Slayer exception. Result 1 means he is absent and is outside the duel.'
  effect_i18n:
    es: 'Indica el resultado previo de bebida: 2 reduce HA y F en 1; 3 no tiene efecto; 4 impone -1 por impactar a todos los combatientes a 2 pulgadas; 5 añade 1 a F; 6 concede Frenesí como excepción expresa de Matatroll. Con 1 no se presenta y queda fuera del duelo.'
  engine_option: Snorri's Drunk
  source_refs:
  - manual: broheim.net
    printed_page: 63
    section: Dramatis Personae / Snorri Nosebiter / Drunk
    url: https://broheim.net/downloads/campaigns/karakazgal/Karak%20Azgal.pdf
