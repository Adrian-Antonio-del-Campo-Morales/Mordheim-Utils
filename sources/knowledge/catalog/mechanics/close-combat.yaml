    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/shadow-warriors
- id: mechanic.hatred-high-elves
  name: Hatred Against High Elves
  name_i18n:
    es: Odio contra Elfos Altos
  category: special
  kind: profile
  effect: >-
    Reroll missed melee hits in the first combat turn only against an individual High Elf warrior.
    Membership in an Elf warband alone does not establish the enemy's identity.
  effect_i18n:
    es: >-
      Repite los impactos fallidos cuerpo a cuerpo solo en el primer turno de combate contra un
      guerrero Elfo Alto. La pertenencia a una banda elfa no determina por sí sola la identidad del
      enemigo.
  engine_option: Hatred against High Elves
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Dark Elves / Kindred Hatred
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/dark-elves
- id: mechanic.hatred-slavers
  name: Hatred Against Slavers
  name_i18n:
    es: Odio contra Esclavistas
  category: special
  kind: profile
  effect: >-
    Pit Fighters hate slavers: reroll missed melee hits in the first combat turn against an opponent whose
    own identity is a slaver. Selling captured opponents to slavers is a campaign resolution and stays
    outside the duel.
  effect_i18n:
    es: >-
      Los Luchadores de Foso odian a los esclavistas: repiten los impactos fallidos cuerpo a cuerpo en el
      primer turno de combate contra un oponente cuya propia identidad sea la de esclavista. Vender
      oponentes capturados a esclavistas es una resolución de campaña y queda fuera del duelo.
  engine_option: Hatred against Slavers
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Pit Fighters / Special Rules / Free the Slaves!
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/pit-fighters
- id: mechanic.vengeful-hatred
  name: Vengeful Hatred
  name_i18n:
    es: Odio Vengativo
  category: special
  kind: profile
  effect: >-
    The warrior permanently hates the single enemy the campaign's serious-injury result determined:
    the individual who caused the injury (the enemy leader when a henchman caused it), that warband's
    leader, the whole warband, or every warband of its type. The duel is supplied that concrete
    identity: the warrior's own instance key, the key of the warband instance it belongs to, or, for
    the last kind alone, the warband type. It rerolls missed melee hits in the first combat round
    only against that identity, never against every warrior of a profile, every warband of a
    catalogue list or, in the leader kind, every bearer of a Leader rule; the D6 that chose the
    target belongs to the campaign and is not simulated.
  effect_i18n:
    es: >-
      El guerrero odia permanentemente al único enemigo que determinó el resultado de herida grave:
      el individuo que causó la herida (el líder enemigo si fue un Secuaz), el líder de esa banda, la
      banda entera o todas las bandas de su tipo. El duelo recibe esa identidad concreta: la clave
      de instancia del guerrero, la de la banda concreta a la que pertenece o, sólo en el último
      caso, el tipo de banda. Sólo contra ella repite los impactos fallidos del primer turno de
      combate, nunca contra todos los guerreros de un perfil, todas las bandas de un listado ni, en
      la rama de líder, todo portador de una regla de Líder; el 1D6 que eligió el objetivo
      pertenece a la campaña y no se simula.
  engine_option: Vengeful Hatred
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Serious Injuries / Heroes' Serious Injuries Chart / 56 Bitter Enmity
    url: https://mordheimer.net/docs/campaigns
- id: mechanic.fear-immunity
  name: Fear Immunity
  name_i18n:
    es: Inmunidad al Miedo
  category: special
  kind: profile
  effect: No Fear test is taken. Other Leadership and Psychology tests are unaffected.
  effect_i18n:
    es: No realiza chequeos de Miedo. Los demás chequeos de Liderazgo y Psicología no cambian.
  engine_option: Fear Immunity
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Beastmen Special Skills / Fearless
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/beastmen-raiders
- id: mechanic.holy-relic-frenzy
  name: Holy Relic Frenzy
  name_i18n:
    es: Frenesí por Reliquia Santa
  category: special
  kind: profile
  effect: >-
    A Battle Pilgrim who owns a Holy Relic is Frenzied; a Frenzied warrior is immune to Hatred.
  effect_i18n:
    es: >-
      Un Peregrino de Guerra que posee una Reliquia Santa está en Frenesí; un guerrero en
      Frenesí es inmune al Odio.
  engine_option: Holy Relic Frenzy
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 5 Battle pilgrims / Special Rules / Holy Relics
- id: mechanic.fear-immunity-undead-chargers
  name: Hardened to Terror
  name_i18n:
    es: Curtido ante el Terror
  category: special
  kind: profile
  effect: >-
    No Fear test is taken when the charger is an Undead model; other Leadership and Psychology
    tests are unaffected, and an Undead opponent that did not charge leaves Fear normal.
  effect_i18n:
    es: >-
      No realiza chequeo de Miedo cuando quien carga es una miniatura No Muerta; los demás
      chequeos de Liderazgo y Psicología no cambian, y un oponente No Muerto que no ha cargado
      deja el Miedo normal.
  engine_option: Hardened to Terror
  source_refs:
  - manual: sylvania-supplement
    printed_page: 0
    section: Special Skills / Instinctual Violence
- id: mechanic.nominated-strike-first
  name: Nominated Strike First
  name_i18n:
    es: Golpe Primero Designado
  category: special
  kind: profile
  effect: >-
    One of this warrior's attacks strikes first; the rest of his attack pool keeps its own
    priority instead of acting before the opponent.
  effect_i18n:
    es: >-
      Uno de los ataques de este guerrero golpea primero; el resto de su reserva de ataques
      conserva su propia prioridad en lugar de resolver antes que el oponente.
  engine_option: Nominated Strike First
  source_refs:
  - manual: sylvania-supplement
    printed_page: 0
    section: Special Skills / Instinctual Violence
- id: mechanic.undead-foes-no-fear
  name: Fearless Against the Undead Servants of Necromancers
  name_i18n:
    es: Sin Miedo Ante los Siervos No Muertos de los Nigromantes
  category: special
  kind: warband
  effect: >-
    Conditional Fear immunity: no Fear test is taken when the opponent causing Fear is a
    vampire, a necromancer, or one of their undead followers (canonical duel identities
    species.vampire, identity.necromancer or nature.undead). A necromancer need not be
    Undead; being a spellcaster alone does not qualify. Fear against any other enemy is normal, and
    other Leadership and Psychology tests are unaffected.
  effect_i18n:
    es: >-
      Inmunidad al Miedo condicional: no se realiza el chequeo de Miedo cuando el enemigo que
      provoca Miedo es un vampiro, un nigromante o uno de sus seguidores no muertos
      (identidades canónicas species.vampire, identity.necromancer o nature.undead). Un
      nigromante no tiene por qué ser no muerto; ser hechicero no basta. El Miedo
      ante cualquier otro enemigo sigue siendo normal, y los demás chequeos de Liderazgo y
      Psicología no cambian.
  engine_option: Fearless Against the Undead Servants of Necromancers
  source_refs:
  - manual: mordheim-facebook-group
    printed_page: 0
    section: Special Rules / Necromancers and vampires are Morr's ultimate enemies
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/dreamwalkers-cult-of-morr
