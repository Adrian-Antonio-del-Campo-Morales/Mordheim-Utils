  name_i18n:
    es: Voto de la Búsqueda
  category: special
  kind: profile
  effect: >-
    While charging, charged by or engaged with a Fear-causing opponent, may reroll a failed
    individual Leadership test once. Group Rout tests are outside the duel scope.
  effect_i18n:
    es: >-
      Al cargar, recibir una carga o combatir con un enemigo que cause Miedo, puede repetir una
      prueba individual de Liderazgo fallida una vez. Las pruebas de huida de banda quedan fuera del
      duelo.
  engine_option: Questing Vow
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Knightly Skills / Questing Vow
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/bretonnian-chapel-guard
- id: mechanic.iron-cage
  name: Iron Cage
  name_i18n:
    es: Jaula de Hierro
  category: special
  kind: profile
  effect: >-
    The gibbet cage fastened around the skeleton forms a makeshift protection. Gibbets receive a 5+
    armour save, as if they wear Heavy Armor. This may not be lost, stolen, or given to other
    models.
  effect_i18n:
    es: >-
      La jaula sujeta alrededor del esqueleto forma una protección improvisada. Las Jaulas de Hierro
      obtienen una tirada de salvación por armadura de 5+, como si llevaran Armadura Pesada. Esta no
      puede perderse, robarse ni cederse a otros modelos.
  engine_option: Iron Cage
  source_refs:
  - manual: broheim.net
    printed_page: 4
    section: Henchmen / 0-5 The Gibbets / Special Rules
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Ghost%20Pirates.pdf
- id: mechanic.frustratingly-tiny
  name: Frustratingly Tiny
  name_i18n:
    es: Exasperantemente Minúsculo
  category: special
  kind: profile
  effect: >-
    Acquired Snotling skill; enemies suffer -1 to hit in melee. Cannot combine with Big Bully.
    Hidden detection is outside the duel scope.
  effect_i18n:
    es: >-
      Habilidad adquirida de los Snotlings; los enemigos sufren -1 al impactar en combate cuerpo a
      cuerpo. No se combina con Matón Enorme. Detectar miniaturas ocultas queda fuera del duelo.
  engine_option: Frustratingly Tiny
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Snotling Special Skills / Frustratingly Tiny
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/snotlings
- id: mechanic.bestial
  name: Bestial
  name_i18n:
    es: Bestia (Bestial)
  category: special
  kind: profile
  effect: >-
    The vampire has an innate way of avoiding being hurt. He has a 6+ ward save against all attacks.
  effect_i18n:
    es: >-
      El vampiro tiene una forma innata de evitar ser dañado. Tiene una salvación de parada de 6+
      contra todos los ataques.
  engine_option: Bestial
  source_refs:
