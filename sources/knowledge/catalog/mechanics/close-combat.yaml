- id: mechanic.myrmidia-eagle-friend
  name: Eagle Friend
  kind: profile
  category: special
  engine_option: Eagle Friend
  name_i18n:
    es: Amiga de las Águilas
  effect: 'The Priestess gains an eagle companion each time she acquires this mark. Eagles are weapons she directs:
    in close combat they strike first, use her Weapon Skill, and each successful attack inflicts a Strength 3 hit.
    Eagles cannot be attacked or slain and fly away when the Priestess is taken out of action. Their 24-inch shooting
    attack and post-battle return/loss are outside the resolved melee duel.'
  effect_i18n:
    es: 'La Sacerdotisa obtiene un águila compañera cada vez que adquiere esta marca. Las águilas son armas que
      dirige: en cuerpo a cuerpo golpean primero, usan su Habilidad de Armas y cada ataque exitoso inflige un impacto
      de Fuerza 3. No pueden ser atacadas ni abatidas y vuelan lejos cuando la Sacerdotisa queda Fuera de combate.
      Su disparo a 24 pulgadas y el retorno o pérdida tras la batalla quedan fuera del duelo cuerpo a cuerpo.'
  source_refs:
  - manual: liber-malefic
    printed_page: 6
    section: Priests for Every Occasion / Marks of Myrmidia
    url: https://www.scribd.com/document/241727651/Miracle-workers-in-Mordheim
- id: mechanic.guiding-dream
  kind: profile
  category: special
  name: Guiding Dream
  name_i18n:
    es: Sueño Guía
  engine_option: GuidingDream
  effect: Roll D6 once before battle. Against the nominated opposing Hero, 2-3 grants +1 to hit, 4-5 grants +1 Strength and
    6 grants Frenzy. Movement and narrative assignments are outside the melee duel.
  effect_i18n:
    es: Tira un D6 una vez antes de la batalla. Contra el Héroe enemigo designado, 2-3 concede +1 para impactar, 4-5 concede
      +1 Fuerza y 6 concede Frenesí. El Movimiento y los encargos narrativos quedan fuera del duelo cuerpo a cuerpo.
  source_refs:
