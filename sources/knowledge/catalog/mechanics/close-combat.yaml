    action on a 6 only).
  effect_i18n: {es: 'El Hombre Maldito es un hombre lobo: cada vez que pierde una herida tira 1D6 y con
                   4+ la bestia escapa y se transforma, ignorando las tiradas de la tabla de heridas.
                   Transformado usa el perfil de lobo M7 HA4 HP0 F4 R4 H2 I5 A2 Ld6 y gana un ataque de
                   Mordisco a -1 Fuerza, descartando todas las prendas y armas durante el resto de la
                   batalla y sin reversión impresa. Una tirada fallida resuelve la tabla de heridas a
                   -1 (derribado 2-3, aturdido 4-5, fuera de combate solo con 6).'}
