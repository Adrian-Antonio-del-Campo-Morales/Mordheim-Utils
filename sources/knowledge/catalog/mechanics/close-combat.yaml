  rules_source_url: https://mordheimer.net/docs/campaigns/skills
  source_refs: []
  name_i18n:
    es: Telaraña de Acero
- id: skill.art-of-silent-death
  name: Art of Silent Death
  category: special
  effect: >-
    The Hero may fight with bare claws without penalty and counts as using two close-combat weapons,
    gaining +1 Attack. In close combat, it scores a critical hit on a 'to wound' roll of 5-6 instead
    of only 6. When combined with Eshin Fighting Claws, this grants +2 Attacks instead of +1.
  kind: profile
  engine_option: Art of Silent Death
  source_refs: []
  name_i18n:
    es: Arte de la Muerte Silenciosa
  effect_i18n:
    es: >-
      El Héroe puede luchar con las garras desnudas sin penalización y cuenta como usando dos armas
      cuerpo a cuerpo, ganando +1 Ataque. En el combate cuerpo a cuerpo, causa un impacto crítico
      con una tirada de herir de 5-6 en lugar de solo 6. Combinado con las Garras de Combate de
      Eshin, esto otorga +2 Ataques en lugar de +1.
- id: skill.unarmed-critical-strikes
  name: Unarmed Critical Strikes
  category: special
  effect: Unarmed attacks score critical hits on To Wound rolls of 5-6.
  effect_i18n:
    es: >-
      Los ataques desarmados logran golpes críticos con tiradas para herir de 5-6.
  kind: profile
  engine_option: Unarmed Critical Strikes
  source_refs: []
  name_i18n:
    es: Golpes Críticos Desarmado
- id: skill.blessed-sight
  name: Blessed Sight
  category: special
  effect: >-
    The Augur may re-roll failed characteristic tests and failed rolls to hit in close combat or
    shooting; the second result must be accepted. If she was not taken Out of Action, she rolls two
    dice for her contribution during Exploration and may choose either die as the result.
  kind: profile
  engine_option: Blessed Sight
  source_refs: []
  name_i18n:
    es: Vista Bendecida
  effect_i18n:
    es: >-
      La Augur puede repetir los chequeos de característica fallidos y las tiradas para impactar
      fallidas en combate cuerpo a cuerpo o con disparos; debe aceptarse el segundo resultado. Si no
      quedó Fuera de combate, tira dos dados por su contribución durante la Exploración y puede
      elegir cualquiera de los dos como resultado.
- id: skill.crack-shot
  name: Crack Shot
  category: special
  effect: >-
    Experts with pistols in close quarters; they have an uncanny ability to turn what should have
    missed its target into a success. When using pistols in close combat, they may re-roll any
    missed to-hit rolls with the pistol in the first round of combat.
  kind: profile
  engine_option: Crack Shot
  source_refs: []
  name_i18n:
    es: Tirador Certero
  effect_i18n:
    es: >-
      Expertos con las pistolas en espacios reducidos; tienen una capacidad asombrosa de convertir
      en acierto lo que debería haber fallado su objetivo. Al usar pistolas en combate cuerpo a
      cuerpo, pueden repetir cualquier tirada de impacto fallida con la pistola en la primera ronda
      de combate.
- id: skill.duellist
  name: Duellist
  category: special
  effect: >-
    If the Saurus Slayer is engaged with only a single opponent in melee, he may re-roll missed hits
    in the first round whether he charged or was charged.
  kind: profile
  engine_option: Duellist
  source_refs: []
  name_i18n:
    es: Duelista
  effect_i18n:
    es: >-
      Si el Matareaus está empeñado con un único oponente en melé, puede repetir los impactos
      fallados en el primer asalto, ya sea que haya cargado o sido cargado.
- id: skill.extra-attack
  name: Extra Attack
  category: special
  effect: Adds one Attack to the profile.
  effect_i18n:
    es: >-
      Añade un Ataque al perfil.
  kind: profile
  engine_option: Extra Attack
  source_refs: []
  name_i18n:
    es: Ataque Extra
- id: skill.hatred
  name: Hatred
  category: special
  effect: >-
    Battle Pilgrims suffer Hatred against all of their enemies, seeing them as enemies and heretics
    to the true Lady’s cause.
  kind: profile
  engine_option: Hatred
  source_refs: []
  name_i18n:
    es: Odio
  effect_i18n:
    es: >-
      Los Peregrinos de Guerra sufren Odio contra todos sus enemigos, considerándolos enemigos y
      herejes de la causa de la verdadera Dama.
- id: skill.swordmaster
  name: Swordmaster
  category: special
  effect: >-
    In order to remain alive, a Duelist picks up swordfighting techniques that few others master.
    The Duelist successfully parries an enemy blow on a roll equal to or over the roll to hit, not
    just over the roll as with normal parries. Obviously a Duelist must first be armed with a weapon
    or armour that allows him to Parry in order to use this rule.
  kind: profile
  engine_option: Swordmaster
  source_refs: []
  name_i18n:
    es: Maestro de la Espada
  effect_i18n:
    es: >-
      Para seguir con vida, un Duelista aprende técnicas de esgrima que pocos dominan. El Duelista
      emparanza con éxito un golpe enemigo con una tirada igual o superior a la tirada para
      impactar, no solo superior a la tirada como en las paradas normales. Obviamente, el Duelista
      debe estar armado primero con un arma o armadura que le permita Emparañar para usar esta
      regla.
- id: mechanic.black-hunger
  name: Black Hunger
  category: special
  effect: >-
    At the beginning of his turn, the Hero may invoke Black Hunger. For that turn he gains +1 Attack
    and adds the result of 1D6 x 0.4" + 1" to his Movement. At the end of the turn he suffers 1D3
    Strength 3 hits with no armour save.
  kind: warband
  engine_option: Black Hunger
  source_refs: []
  name_i18n:
    es: Hambre Negra
  effect_i18n:
    es: >-
      Al comienzo de su turno, el Héroe puede invocar el Hambre negra. Durante ese turno gana +1
      Ataque y añade a su Movimiento el resultado de 1D6 x 0,4" + 1". Al final del turno sufre 1D3
      impactos de Fuerza 3 sin tirada de salvación por armadura.
- id: mechanic.body-slam
  name: Body Slam
  category: special
  effect: >-
    Replaces charge attacks with one +1 Strength, +1 To Hit attack that critically wounds on 5+ and
    ignores weapon and skill modifiers.
  effect_i18n:
    es: >-
      Sustituye los ataques de carga por un único ataque con +1 a la Fuerza y +1 para
      impactar que hiere críticamente con 5+ e ignora los modificadores de armas y
      habilidades.
  kind: warband
  engine_option: Body Slam
  source_refs: []
  name_i18n:
    es: Embestida Corporal
- id: mechanic.bull-charge
  name: Bull Charge
  category: special
  effect: >-
    Ogres learn to use their vast bulk in a charge, trampling the enemy to the ground. When
    charging, an Ogre with this skill may attempt a single attack with a +1 'to hit' modifier rather
    than making his normal attacks. If successful the enemy model is automatically knocked down.
  kind: warband
  engine_option: Bull Charge
  source_refs: []
  name_i18n:
    es: Embestida de Toro
  effect_i18n:
    es: >-
      Los ogros aprenden a usar su enorme mole al cargar, arrollando al enemigo. Al cargar, un ogro
      con esta habilidad puede intentar un único ataque con un modificador de +1 para impactar en
      lugar de realizar sus ataques normales. Si tiene éxito, el modelo enemigo queda
      automáticamente derribado.
- id: mechanic.force-of-will
  name: Force of Will
  category: special
  effect: >-
    When the Hero loses his last Wound and would be taken Out of Action, roll D6. If the result is
    equal to or below Toughness, he stands back up and continues fighting. Repeat this roll in each
    subsequent combat round with a cumulative -1 modifier. If he is taken Out of Action a second
    time, remove him normally.
  kind: warband
  engine_option: Force of Will
  source_refs: []
  name_i18n:
    es: Fuerza de Voluntad
  effect_i18n:
    es: >-
      Cuando el Héroe pierde su última Herida y va a ser puesto Fuera de combate, tira D6. Si el
      resultado es igual o inferior a su Resistencia, se levanta y sigue luchando. Repite esta
      tirada en cada asalto de combate posterior con un modificador acumulativo de -1. Si es puesto
      Fuera de combate una segunda vez, retíralo con normalidad.
- id: mechanic.unpredictable-attack
  name: Unpredictable
  category: special
  effect: >-
    The Hero may declare one of its attacks Unpredictable; that attack cannot be parried by the
    opponent.
  kind: warband
  engine_option: Unpredictable
  source_refs: []
  name_i18n:
    es: Impredecible
  effect_i18n:
    es: >-
      El Héroe puede declarar uno de sus ataques Impredecible; ese ataque no puede ser emparañado
      por el oponente.
- id: mechanic.strike-first-vs-skinks-first-round
  name: Skink Hunter (First Round)
  category: special
  effect: Always strikes first in the first combat round against Skink profiles.
  effect_i18n:
    es: >-
      Siempre golpea primero en el primer turno de combate contra perfiles Skink.
  kind: warband
  engine_option: Strike First vs Skinks (First Round)
  source_refs: []
  name_i18n:
    es: Cazador Skink (Primera Ronda)
- id: mechanic.strike-first-vs-skinks-always
  name: Lizard Hunter
  category: special
  effect: >-
    The Hero always strikes first in close combat when fighting any type of Skink, regardless of the
    weapon used or which model charged.
  kind: warband
  engine_option: Strike First vs Skinks (Always)
  source_refs: []
  name_i18n:
    es: Cazador de Lagartos
  effect_i18n:
    es: >-
      La Héroe siempre golpea primero en combate cuerpo a cuerpo al combatir contra cualquier tipo
      de Skink, sin importar el arma empleada ni qué modelo cargó.
- id: skill.monster-slayer-effective-strength-armour
  name: Monster Slayer (Effective Strength Armour Modifier)
  category: special
  effect: >-
    Uses the effective Strength needed to wound on 4+ when calculating the armour-save modifier.
  effect_i18n:
    es: >-
      Usa la Fuerza efectiva necesaria para herir con 4+ al calcular el modificador de
      salvación de armadura.
  kind: warband
  engine_option: Monster Slayer Effective Strength
  source_refs: []
  name_i18n:
    es: Matamostro (Modificador de Armadura por Fuerza Efectiva)
- id: skill.regeneration-blocked-by-blessed
  name: Regeneration Blocked by Blessed Attacks
  category: special
  effect: Blessed attacks prevent the warrior's Regeneration roll.
  effect_i18n:
    es: >-
      Los ataques bendecidos impiden la tirada de Regeneración del guerrero.
  kind: warband
  engine_option: Regeneration Blocked by Blessed Attacks
  source_refs: []
  name_i18n:
    es: Regeneración Bloqueada por Ataques Bendecidos
- id: skill.regeneration-5-plus
  name: Regeneration (5+)
  category: armour
  effect: Ignores wounds on 5+, except wounds caused by fire.
  effect_i18n:
    es: >-
      Ignora las heridas con 5+, excepto las causadas por fuego.
  kind: warband
  engine_option: Regeneration 5+
  source_refs: []
  name_i18n:
    es: Regeneración (5+)
- id: mechanic.anvil-head
  name: Anvil Head
  category: special
  effect: >-
    11 on 2D6; costs 45 gc. If the Necromantic Abomination charged, it may replace all of its
    attacks with one attack. If that attack hits, it inflicts 1D3 Wounds; roll To Wound separately
    for each Wound.
  kind: warband
  engine_option: Anvil Head
  source_refs: []
  name_i18n:
    es: Cabeza de Yunque
  effect_i18n:
    es: >-
      11 en 2D6; cuesta 45 coronas. Si la Abominación necromántica cargó, puede reemplazar todos sus
      ataques por uno solo. Si ese ataque impacta, inflige 1D3 Heridas; tira para herir por separado
      cada Herida.
- id: mechanic.death-blow
  name: Death Blow
  category: special
  effect: >-
    If the Hero has at least 2 Attacks on its profile, it may replace all of its attacks with a
    single attack resolved at +1 To Hit, +1 To Wound and +1 on the Injury roll.
  kind: warband
  engine_option: Death Blow
  source_refs: []
  name_i18n:
    es: Golpe Mortal
  effect_i18n:
    es: >-
      Si el Héroe tiene al menos 2 Ataques en su perfil, puede sustituir todos sus ataques por un
      único ataque resuelto a +1 para impactar, +1 para herir y +1 en la tirada de heridas.
- id: mechanic.disability
  name: Disability
  category: special
  effect: >-
    When a Cripple Henchman group is created, roll D6 once and apply that result permanently to the
    entire group: 1 Lame and Arthritic — reduce Movement and Initiative by 1; 2 Parkinson's — reduce
    Weapon Skill by 1 and the models may not use two weapons or a weapon and shield; 3 Poor Eyesight
    — reduce Ballistic Skill by 1; 4 Sickly — reduce Toughness by 1; 5 Weakness — reduce Strength by
    1; 6 Head Injury — the group is subject to Stupidity unless within 6" of a Hero.
  kind: profile
  engine_option: Disability
  source_refs: []
  name_i18n:
    es: Invalidez
  effect_i18n:
    es: >-
      Cuando se crea un grupo de secuaces Lisiados, tira 1D6 una vez y aplica ese resultado
      permanentemente a todo el grupo: 1 Cojo y artrítico: reduce Movimiento e Iniciativa en 1; 2
      Mal de Parkinson: reduce Habilidad de Armas en 1 y los modelos no pueden usar dos armas o un
      arma y un escudo; 3 Mala vista: reduce Habilidad de Disparo en 1; 4 Enfermizo: reduce
      Resistencia en 1; 5 Debilidad: reduce Fuerza en 1; 6 Lesión craneal: el grupo está sujeto a
      Estupidez salvo que esté a 6" de un Héroe.
- id: mechanic.energy-focus
  name: Energy Focus
  category: special
  effect: >-
    If fighting unarmed, the Hero may choose to reduce his Attacks by –1 and thus gain +1 Strength
    in close combat. The monk may sacrifice any number of attacks this way.
  kind: warband
  engine_option: Energy Focus
  source_refs: []
  name_i18n:
    es: Foco de Energía
  effect_i18n:
    es: >-
      Si lucha sin armas, el héroe puede optar por reducir sus Ataques en -1 y ganar así +1 Fuerza
      en el combate cuerpo a cuerpo. El monje puede sacrificar cualquier número de ataques de esta
      manera.
- id: mechanic.mark-of-the-old-ones
  name: Mark of the Old Ones
  category: special
  effect: >-
    Costs 50 gc. Once per battle, the Hero may change one failed roll into a valid successful
    result. This is a Sacred Mark and is therefore available only when the Hero is recruited.
  kind: warband
  engine_option: Mark of the Old Ones
  source_refs: []
  name_i18n:
    es: Marca de los Antiguos
  effect_i18n:
    es: >-
      Cuesta 50 coronas. Una vez por batalla, el Héroe puede convertir una tirada fallada en un
      resultado de éxito válido. Es una Marca sagrada y, por tanto, solo está disponible cuando el
      Héroe es reclutado.
- id: mechanic.netter
  name: Netter
  category: special
  effect: >-
    The goblin is adept at using a net to disable his enemies. They learn their skill hunting wild
    cave squigs in the depths of the mountains. The technique he has mastered is 'chuck and charge'.
    The goblin may declare that he is making a net charge. He throws the net at a target in the same
    way as described in the Mordheim rulebook. If he hits and the target fails to escape the net
    then target counts as knocked down and the goblin completes his charge. If he misses or the
    target escapes then the goblin makes a failed charge. If the failed charge would take him into
    base contact then stop him 1" away. A warrior who is caught in a net will be automatically hit
    in combat. The goblin must still roll to wound just as with a knocked down enemy. In the
    warrior's next recovery phase, unless he is stunned or out of action he will cut himself out of
    the net but cannot do anything else and will go last in combat just as if he had stood up from
    being knocked down.
  kind: warband
  engine_option: Netter
  source_refs: []
  name_i18n:
    es: Rededor
  effect_i18n:
    es: >-
      El goblin es experto en usar una red para inutilizar a sus enemigos. Aprenden esta habilidad
      cazando squigs de cueva salvajes en las profundidades de las montañas. La técnica que ha
      dominado es 'lanzar y cargar'. El goblin puede declarar que realiza una carga con red. Lanza
      la red a un objetivo de la misma manera que se describe en el reglamento de Mordheim. Si
      impacta y el objetivo no logra escapar de la red, el objetivo cuenta como derribado y el
      goblin completa su carga. Si falla o el objetivo escapa, el goblin realiza una carga fallida.
      Si la carga fallida lo llevaría a contacto de peana, deténlo a 1". Un guerrero atrapado en una
      red será impactado automáticamente en el combate. El goblin debe seguir tirando para herir,
      igual que con un enemigo derribado. En la siguiente fase de recuperación del guerrero, a menos
      que esté aturdido o Fuera de combate, se cortará la red, pero no podrá hacer nada más y
      luchará el último en el combate, igual que si se hubiera levantado de un derribo.
- id: mechanic.spawn-special-attacks
  name: Spawn Special Attacks
  category: attacks
  effect: Rolls D6+1 Attacks again at the start of every close-combat phase.
  effect_i18n:
    es: >-
      Vuelve a tirar D6+1 Ataques al comienzo de cada fase de combate cuerpo a cuerpo.
  kind: profile
  engine_option: Spawn Special Attacks
  source_refs: []
  name_i18n:
    es: Ataques Especiales de Engendro
- id: mechanic.amazon-isolationists
  name: Amazon Isolationists
  category: attacks
  effect: Re-rolls failed attacks in the first combat round against Lizardmen and Norse.
  effect_i18n:
    es: >-
      Repite los ataques fallidos en el primer turno de combate contra Hombres Lagarto y
      Norses.
  kind: warband
  engine_option: Amazon Isolationists
  source_refs: []
  name_i18n:
    es: Aislacionistas Amazonas
- id: mechanic.spider-infested
  name: Spider Infested
  category: initiative
  effect: >-
    Whenever an enemy fails a To Hit roll against the Hero, or the Hero successfully parries an
    attack, that enemy suffers a cumulative -1 Initiative penalty until it is no longer engaged with
    the Hero or the Hero is taken Out of Action. The penalty can reduce Initiative to 0.
  kind: warband
  engine_option: Spider Infested
  source_refs: []
  name_i18n:
    es: Infestado de Arañas
  effect_i18n:
    es: >-
      Siempre que un enemigo falle una tirada por Golpear contra el Héroe, o que el Héroe efectúe
      una estocada con éxito, ese enemigo sufre una penalización acumulativa de -1 de Iniciativa
      hasta que deje de estar enfrentado al Héroe o el Héroe salga de Combate. La penalización puede
      reducir la Iniciativa a 0.
- id: mechanic.untiring
  name: Untiring
  category: armour
  effect: >-
    The Knight ignores movement penalties for wearing armour while on foot. Strength, axes, critical
    hits and similar modifiers cannot reduce the Knight's armour save below 5+, and non-magical
    means cannot ignore that save.
  kind: warband
  engine_option: Untiring
  source_refs: []
  name_i18n:
    es: Incansable
  effect_i18n:
    es: >-
      El Caballero ignora las penalizaciones de movimiento por llevar armadura mientras vaya a pie.
      Los modificadores de Fuerza, hachas, impactos críticos y similares no pueden reducir la
      salvación por armadura del Caballero por debajo de 5+, y medios no mágicos no pueden ignorar
      esa salvación.
- id: mechanic.armour-save-bonus
  name: Armour Save Bonus
  category: armour
  effect: Improves the warrior's armour save by one point.
  effect_i18n:
    es: >-
      Mejora la salvación de armadura del guerrero en un punto.
  kind: warband
  engine_option: Armour Save Bonus
  source_refs: []
  name_i18n:
    es: Bono de Salvación por Armadura
- id: mechanic.retain-flail-morning-star-strength-bonus
  name: Retain Flail and Morning Star Strength Bonus
  category: strength
  effect: Retains the first-round Strength bonus of Flails and Morning Stars in later rounds.
  effect_i18n:
    es: >-
      Conserva en turnos posteriores el bono de Fuerza de primer turno de los mayales y las
      estrellas matutinas.
  kind: warband
  engine_option: Retain Flail and Morning Star Strength Bonus
  source_refs: []
  name_i18n:
    es: Conservar el Bono de Fuerza de Mayal y Mangual
