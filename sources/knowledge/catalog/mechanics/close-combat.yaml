  name: Manhater
  name_i18n:
    es: Odia-Hombres
  category: special
  kind: profile
  effect: Will be affected by the rules of hatred when fighting any Human warbands.
  effect_i18n:
    es: Se verá afectado por las reglas de odio al luchar contra cualquier banda humana.
  engine_option: Manhater
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Beastmen Special Skills / Manhater
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/beastmen-raiders
- id: mechanic.hatred-chaotic-warband
  name: Zealous
  name_i18n:
    es: Fervoroso
  category: special
  kind: profile
  effect: Strong is the devotion of the Templar. The model hates any model belonging to a chaotic warband. This includes Skaven, Possessed, Carnival of Chaos, Beastmen and any warband that has a Daemon in it.
  effect_i18n:
    es: Fuerte es la devoción del Templario. La miniatura odia a cualquier miniatura perteneciente a una banda caótica. Esto incluye Skaven, Posesos, Carnaval del Caos, Hombres Bestia y cualquier banda que tenga un Demonio en ella.
  engine_option: Zealous
  source_refs:
  - manual: mordheimer.net
