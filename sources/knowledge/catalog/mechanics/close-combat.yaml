- id: mechanic.netter
  name: Netter
  category: special
  note: >-
    The goblin is adept at using a net to disable his enemies. They learn their skill hunting wild
    cave squigs in the depths of the mountains. The technique he has mastered is 'chuck and charge'.
    The goblin may declare that he is making a net charge. He throws the net at a target in the same
    way as described in the Mordheim rulebook. If he hits and the target fails to escape the net
    then target counts as knocked down and the goblin completes his charge. If he misses or the
    target escapes then the goblin makes a failed charge. If the failed charge would take him into
    base contact then stop him 1" away. A warrior who is caught in a net will be automatically hit
    in combat. The goblin must still roll to wound just as with a knocked down enemy. In the
    warrior's next recovery phase, unless he is stunned or out of action he will cut himself out of
    the net but cannot do anything else and will go last in combat just as if he had stood up from
    being knocked down.
  kind: warband
  engine_option: Netter
  source_refs: []
  name_i18n:
    es: Redador
  clauses:
  - id: whole
    scope: 'NO'
  - id: failed-charge-movement
    scope: 'NO'
