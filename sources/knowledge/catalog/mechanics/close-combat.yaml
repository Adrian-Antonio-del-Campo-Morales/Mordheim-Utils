  name: Psychology Immunity
  name_i18n:
    es: Inmunidad a Psicología
  category: special
  kind: profile
  effect: >-
    Ignores individual Fear and Stupidity and receives no Hatred or Frenzy benefit. Other Leadership
    tests are unaffected.
  effect_i18n:
    es: >-
      Ignora Miedo y Estupidez individuales y no recibe beneficios de Odio ni Frenesí. Los demás
