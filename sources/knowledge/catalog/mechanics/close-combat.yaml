    The Rememberer's task is to record the doom of each of the slayers. When he is close by, the
    slayers will fight even harder to make their death more honourable. Once per game, any Slayer
    Hero fighting against a large creature (such as a troll or ogre) and within 6\" of the
    Rememberer, may re-roll any failed To Hit rolls once only.
  effect_i18n:
    es: >-
      La tarea del Memoralista es registrar la perdición de cada uno de los Matatrolles. Cuando está
      cerca, los Matatrolles lucharán aún con más ahínco para hacer su muerte más honorable. Una vez
      por partida, cualquier Héroe Matatrolles que luche contra una criatura grande (como un troll o
      un ogro) y que esté a 6" del Memoralista puede repetir una sola vez cualquier tirada por
      impactar fallida.
  engine_option: Rememberer support dwarf-slayers-kaz
