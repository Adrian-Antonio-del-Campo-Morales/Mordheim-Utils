    es: >-
      Los ataques bendecidos impiden la tirada de Regeneración del guerrero.
  kind: warband
  engine_option: Regeneration Blocked by Blessed Attacks
  source_refs: []
  name_i18n:
    es: Regeneración Bloqueada por Ataques Bendecidos
- id: skill.regeneration-5-plus
  name: Regeneration (5+)
  category: armour
  effect: Ignores wounds on 5+, except wounds caused by fire.
  effect_i18n:
    es: >-
      Ignora las heridas con 5+, excepto las causadas por fuego.
  kind: warband
  engine_option: Regeneration 5+
  source_refs: []
  name_i18n:
    es: Regeneración (5+)
- id: mechanic.anvil-head
