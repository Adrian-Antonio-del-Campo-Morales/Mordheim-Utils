    url: https://www.scribd.com/document/241727651/Miracle-workers-in-Mordheim
- id: mechanic.ulric-intense-rivals
  name: Intense Rivals
  name_i18n:
    es: Rivalidad Intensa
  kind: profile
  category: special
  effect: >-
    A Wolf-Priest hates Witch Hunters, Warrior-Priests of Sigmar, Sigmarite Matriarchs and Sisters
    of Sigmar.
  effect_i18n:
    es: >-
      El Sacerdote Lobo odia a Cazadores de Brujas, Sacerdotes Guerreros de Sigmar, Matriarcas
      Sigmaritas y Hermanas de Sigmar.
  engine_option: Intense Rivals
  source_refs:
  - manual: liber-malefic
    printed_page: 9
    section: Priests for Every Occasion / Wolf-Priest of Ulric
    url: https://www.scribd.com/document/241727651/Miracle-workers-in-Mordheim
- id: mechanic.first-failed-leadership-reroll
  name: War-Honed Leadership
  name_i18n:
    es: Liderazgo Templado en la Guerra
  kind: profile
  category: special
  effect: >-
    May reroll the first failed Leadership test of the battle. Declining forfeits that first-failure
    opportunity.
  effect_i18n:
    es: >-
      Puede repetir la primera prueba de Liderazgo fallida de la batalla; rechazarla no permite
      reservar otra prueba posterior.
  engine_option: War-Honed Leadership
  source_refs:
  - manual: liber-malefic
    printed_page: 6
    section: Priests for Every Occasion / War-Priestess of Myrmidia / War-Honed
    url: https://www.scribd.com/document/241727651/Miracle-workers-in-Mordheim
- id: mechanic.sigmar-enlightened
  name: Enlightened
  name_i18n:
    es: Iluminado
  kind: profile
  category: special
  effect: Automatically passes Leadership tests against Orcs, Goblins or followers of Chaos.
  effect_i18n:
    es: Supera automáticamente las pruebas de Liderazgo contra Orcos, Goblins o seguidores del Caos.
  engine_option: Enlightened
  source_refs:
  - manual: liber-malefic
    printed_page: 12
    section: Priests for Every Occasion / Warrior-Priest of Sigmar / Marks of Sigmar
    url: https://www.scribd.com/document/241727651/Miracle-workers-in-Mordheim
- id: skill.righteous-fury
  name: Righteous Fury
  name_i18n:
    es: Ira Justa
  kind: warband
  category: special
  effect: >-
    The bearer hates all Skaven, Undead, Possessed, Beastmen, Dark Elves and other warbands classed
    as evil. Non-Chaos human warbands whose members are merely killers or looters are not included.
  effect_i18n:
    es: >-
      El portador odia a todos los Skaven, No-muertos, Posesos, Bestias del Caos, Elfos Oscuros y
      demás bandas clasificadas como malvadas. Las bandas humanas que no son del Caos, cuyos
      miembros son solo asesinos o saqueadores, no están incluidas.
  source_refs:
