    section: Specialists / Halfling Pimp
    url: https://broheim.net/downloads/hiredswords/mutinyinmarienburg/Specialists.pdf
- id: mechanic.morrs-servant
  name: Morr's Servant
  name_i18n:
    es: Siervo de Morr
  kind: profile
  category: special
  effect: >-
    Undead charging or charged by the Priest must pass Leadership or suffer Fear, ignoring their
    usual Psychology exemptions.
  effect_i18n:
    es: >-
      Los no muertos que carguen o sean cargados por el Sacerdote deben superar Liderazgo o sufrir
      Miedo, ignorando sus exenciones habituales de Psicología.
  engine_option: Morr's Servant
  source_refs:
  - manual: liber-malefic
    printed_page: 5
