  name: Righteous Fury
  name_i18n:
    es: Ira Justa
  kind: warband
  category: special
  effect: The bearer hates all Skaven, Undead, Possessed, Beastmen, Dark Elves and other warbands classed
    as evil. Non-Chaos human warbands whose members are merely killers or looters are not included.
  effect_i18n:
    es: El portador odia a todos los Skaven, No-muertos, Posesos, Bestias del Caos, Elfos Oscuros y demás
      bandas clasificadas como malvadas. Las bandas humanas que no son del Caos, cuyos miembros son solo
