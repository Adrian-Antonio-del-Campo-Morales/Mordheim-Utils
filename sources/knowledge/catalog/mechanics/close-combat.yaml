    printed_page: 8
    section: Special Rules / Hate Stunties and Skaven
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Crooked Moon Night Goblins.pdf
- id: mechanic.hatred-dwarfs
  name: Special Rules
  name_i18n:
    es: Reglas Especiales
  category: special
  kind: profile
  effect: 'Greenskins have a deep mistrust of Skaven, and this is doubly true in the case of Goblins. They rally around one of them, with whom the Demagogue will have to deal. Special Rules: Hate Dwarfs.'
  effect_i18n:
    es: 'Los pieles verdes desconfían profundamente de los Skaven, y esto es doblemente cierto en el caso de los Goblins. Se agrupan en torno a uno de ellos, con quien el Demagogo tendrá que entenderse. Reglas Especiales: Odio a los Enanos.'
  engine_option: Special Rules
