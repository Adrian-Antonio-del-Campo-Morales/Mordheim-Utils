- id: mechanic.hatred-dark-elves
  name: Hatred Against Dark Elves
  name_i18n:
    es: Odio contra Elfos Oscuros
  category: special
  kind: profile
  effect: >-
    Reroll missed melee hits in the first combat turn only against an individual Dark Elf warrior.
    Membership in an Elf warband alone does not establish the enemy's identity.
  effect_i18n:
    es: >-
      Repite los impactos fallidos cuerpo a cuerpo solo en el primer turno de combate contra un
      guerrero Elfo Oscuro. La pertenencia a una banda elfa no determina por sí sola la identidad
      del enemigo.
  engine_option: Hatred against Dark Elves
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
