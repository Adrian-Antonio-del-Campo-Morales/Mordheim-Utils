    an Initiative test.
  effect_i18n:
    es: >-
      Con un arma a dos manos, sustituye todos los ataques por un único golpe automático si
      el oponente falla un chequeo de Iniciativa.
  kind: warband
  engine_option: Sweep
  source_refs: []
  name_i18n:
    es: Barrido
- id: skill.sword-master
  name: Sword Master
  category: special
  effect: >-
    When parrying, the Vampire only needs to equal the opponent's roll and may therefore parry a
    roll of 6. The Vampire may also re-roll one failed parry, but may not re-roll the re-roll and
    may not parry more than one attack.
  kind: warband
  engine_option: Sword Master
  source_refs: []
  name_i18n:
    es: Maestro de la Espada
  effect_i18n:
    es: >-
      Al emparañar, el Vampiro solo necesita igualar la tirada del oponente y puede por tanto
      emparañar un 6. El Vampiro también puede repetir una parada fallada, pero no puede repetir la
      repetición ni emparañar más de un ataque.
- id: skill.thick-skull
  name: Thick Skull
  category: special
  effect: >-
    The Hero has a 3+ save to turn a Stunned result into Knocked Down. If wearing a Helmet this
    becomes 2+ and replaces the Helmet's normal rule.
  kind: warband
  engine_option: Thick Skull
  source_refs:
