                   otro enemigo permanece en contacto, le cose la boca, de modo que un Líder ya no puede
                   usar su habilidad de líder y un lanzador no puede lanzar hechizos durante el resto
                   de la batalla. El duelo aplica la supresión del Líder que lee el préstamo de liderazgo;
                   el lanzamiento queda fuera del duelo.'}
