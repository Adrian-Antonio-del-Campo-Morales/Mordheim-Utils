- id: mechanic.hatred-dwarfs
  name: Special Rules
  name_i18n:
    es: Reglas Especiales
  category: special
  kind: profile
  effect: >-
    Greenskins have a deep mistrust of Skaven, and this is doubly true in the case of Goblins. They
    rally around one of them, with whom the Demagogue will have to deal. Special Rules: Hate Dwarfs.
  effect_i18n:
    es: >-
      Los pieles verdes desconfían profundamente de los Skaven, y esto es doblemente cierto en el
      caso de los Goblins. Se agrupan en torno a uno de ellos, con quien el Demagogo tendrá que
      entenderse. Reglas Especiales: Odio a los Enanos.
  engine_option: Special Rules
  source_refs:
  - manual: broheim.net
    printed_page: 24
    section: Heroes / 0-1 Goblin Leader
    url: https://broheim.net/downloads/warbands/supplement/karakeightpeaks/Slave Uprising.pdf
- id: mechanic.hatred-orcs-goblins
  name: Hate Orcs and Goblins
  name_i18n:
    es: Odio a Orcos y Goblins
  category: special
  kind: profile
  effect: All Dwarfs hate Orcs and Goblins.
  effect_i18n:
    es: Todos los enanos odian a los orcos y los goblins.
  engine_option: Hate Orcs and Goblins
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Special Rules / Hate Orcs and Goblins
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/dwarf-rangers
- id: mechanic.noble-disdain
  name: Virtue of Noble Disdain
  name_i18n:
    es: Virtud del Noble Desdén
  category: special
  kind: profile
  effect: The warrior is subject to Hatred of all enemies armed with shooting weapons.
  effect_i18n:
    es: El guerrero está sujeto a Odio contra todos los enemigos armados con armas de proyectiles.
  engine_option: Virtue of Noble Disdain
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Bretonnian Knight Virtues
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/bretonnian
- id: mechanic.mark-of-arkhar
  name: Mark of Arkhar the Dog
  name_i18n:
    es: Marca de Arkhar el Perro
  category: special
  kind: profile
  effect: >-
    A marked leader is subject to Frenzy and spells targeting him fail on 4+. A Seer with this mark
    becomes a Bloodfather: he cannot cast spells; whenever he takes an enemy Out of Action in
    hand-to-hand combat, he may pass a Leadership test to gain +1 WS, S, T or I until the end of the
    battle, with each characteristic increased at most once. A Bloodfather may also take Strength
    skills.
  effect_i18n:
    es: >-
      Un líder marcado está sujeto a Frenesí y los hechizos dirigidos contra él fallan con un 4+. Un
      Vidente con esta marca se convierte en un Padre de Sangre: no puede lanzar hechizos; siempre
      que saque del combate a un enemigo en combate cuerpo a cuerpo, puede superar un chequeo de
      Liderazgo para ganar +1 HA, F, R o I hasta el final de la batalla, con cada característica
      aumentada como máximo una vez. Un Padre de Sangre también puede tomar habilidades de Fuerza.
  engine_option: Mark of Arkhar the Dog
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Mark of the Dark Gods / Mark of Arkhar the Dog
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/marauders-of-chaos
- id: mechanic.wheelo-impact
  name: Impact Hits
  name_i18n:
    es: Impactos de Colisión
  category: special
  kind: profile
  effect: >-
    Whenever a Wheelo moves into a model, that model automatically suffers 1D3 Strength 4 hits,
    which are worked out before any blows are struck, in the same way as a crossbow pistol. These
    represent the Impact Hits of the Wheelo as it comes to a sudden stop against an unsolid object.
    These are only dealt in the first round of combat, and only if the Wheelo "charged" this turn.
    Models that charge a Wheelo during his or her turn do NOT suffer Impact Hits. If a Wheelo rolls
    into a friendly model, that model still suffers Impact Hits as normal. An Impact Hit does not
    reflect the strength of the Wheelo crew, and thus the attack will remain S4, even if the crew
    gains a Strength Upgrade.
  effect_i18n:
    es: >-
      Siempre que un Wheelo se mueve contra un modelo, ese modelo sufre automáticamente 1D3 impactos
      de Fuerza 4, que se resuelven antes de que se golpee ningún golpe, de la misma manera que una
      ballesta de pistola. Estos representan los Impactos de Colisión del Wheelo cuando se detiene
      de golpe contra un objeto no sólido. Solo se causan en la primera ronda de combate, y solo si
      el Wheelo "cargó" este turno. Los modelos que cargan contra un Wheelo durante su turno NO
      sufren Impactos de Colisión. Si un Wheelo rueda contra un modelo amistoso, ese modelo sufre
      Impactos de Colisión con normalidad. Un Impacto de Colisión no refleja la fuerza de la
      tripulación del Wheelo, y por tanto el ataque se mantendrá en F4, incluso si la tripulación
      gana una mejora de Fuerza.
  engine_option: Impact Hits
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: 0-1 Snotling Wheelo / Special Rules / Impact Hits
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/snotlings
- id: mechanic.beauty-of-the-sea
  name: Beauty of the Sea
  name_i18n:
    es: Belleza del Mar
  category: special
  kind: profile
  effect: >-
    In order for a male, non-animal enemy to charge a Sea Singer, he must pass a Leadership test, or
    else be dazzled at her beauty and remain in place. If charged by a Sea Singer, the model may not
    attack back in combat until he passes a Leadership Test in the beginning of the Combat Phase.
    Once a test is passed, the model doesn't need to test for the rest of the combat. The Sea Singer
    causes Fear in female models. The Singer's 'Beauty' counts as a form of Psychology.
  effect_i18n:
    es: >-
      Para cargar contra una Cantora del Mar, un enemigo varón no animal debe superar una tirada de
      Liderazgo o, si la falla, queda deslumbrado por su belleza y se queda en su sitio. Si es
      cargado por una Cantora del Mar, el modelo no puede devolver el ataque en combate hasta
      superar una tirada de Liderazgo al comienzo de la fase de combate. Una vez superada la tirada,
      el modelo no necesita repetirla durante el resto del combate. La Cantora del Mar causa miedo a
      los modelos femeninos. La 'Belleza' de la Cantora cuenta como una forma de Psicología.
  engine_option: Beauty of the Sea
  source_refs:
  - manual: broheim.net
    printed_page: 3
    section: Heroes / 0-1 Sea Singer / Special Rules
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Ghost%20Pirates.pdf
- id: mechanic.goblin-squabble
  name: Animosity
  name_i18n:
    es: Rencor
  category: special
  kind: profile
  effect: >-
    At the beginning of each Night Goblin turn roll a D6. On a 1, the Night Goblins squabble and do
    nothing else for the rest of that turn. Trolls, Cave Squigs, Snotlings and other non-Goblins are
    unaffected.
  effect_i18n:
    es: >-
      Al comienzo de cada turno de Goblins Nocturnos, tira 1D6. Con un 1, los Goblins Nocturnos se
      enzarzan en rencillas y no hacen nada más durante el resto de ese turno. Los trolls, Squigs de
      Cueva, Snotlings y otros no goblins no se ven afectados.
  engine_option: Animosity
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Special Rules / Animosity
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/night-goblins
- id: mechanic.fear-human
  name: Nasty Reputation
  name_i18n:
    es: Mala Reputación
  category: special
  kind: profile
  effect: >-
    Gaolers are known for their brutality. The dreaded sight of them and the very thought of being
    captured causes fear in Humans.
  effect_i18n:
    es: >-
      Los Carceleros son conocidos por su brutalidad. La temible visión de ellos y la mera idea de
      ser capturado provoca miedo en los Humanos.
  engine_option: Nasty Reputation
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 – 2 Gaolers / Special Rules / Nasty Reputation
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/black-dwarfs
- id: mechanic.undivided-leader
  name: Mark of Chaos Undivided
  name_i18n:
    es: Marca del Caos Indiviso
  category: special
  kind: profile
  effect: >-
    A marked leader allows all warband members within the Leader radius to re-roll failed Leadership
    tests. If the Seer has this mark, the warband may include 0-3 Gors counting toward the normal
    warband maximum; The Lad's Got Talent results for those Gors are re-rolled. Spell details are
    not modelled here.
  effect_i18n:
    es: >-
      Un líder marcado permite a todos los miembros de la banda dentro del radio del líder repetir
      los chequeos de Liderazgo fallidos. Si el Vidente tiene esta marca, la banda puede incluir 0-3
      Gores que cuentan contra el máximo normal de la banda; los resultados de The Lad's Got Talent
      para esos Gores se repiten. Los detalles de hechizos no están modelados aquí.
  engine_option: Mark of Chaos Undivided
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Mark of the Dark Gods / Mark of Chaos Undivided
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/marauders-of-chaos
- id: mechanic.wizened-halfling
  name: Wizened Halfling (Leaders Only)
  name_i18n:
    es: Mediano Arrugado (Solo Líderes)
  category: special
  kind: profile
  effect: >-
    This old halfling is greatly respected by the other members of the warband and they never
    question his word. All halflings may also re-roll any failed leadership test when within 6" of
    the leader as well as using his leadership for both tests.
  effect_i18n:
    es: >-
      Este viejo mediano es muy respetado por los demás miembros de la banda y nunca cuestionan su
      palabra. Todos los medianos también pueden repetir cualquier prueba de liderazgo fallida
      cuando estén a 6" del líder, además de usar su liderazgo para ambas pruebas.
  engine_option: Wizened Halfling (Leaders Only)
  source_refs:
  - manual: mordheim-index-catalog
    printed_page: 0
    section: Halfling Special Skills / Wizened Halfling
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/halflings
- id: mechanic.righteous-charge
  name: Righteous Charge
  name_i18n:
    es: Carga Justiciera
  category: special
  kind: profile
  effect: >-
    When the mounted Knight charges, if he has at least 1 other model within 2 inches, all friendly
    charging mounted warriors (including the Questing Knight) within 4 inches gain +1 to Hit, cause
    fear and are immune to all Psychology for the first round of combat.
  effect_i18n:
    es: >-
      Cuando el Caballero montado carga, si tiene al menos otro modelo a 2 pulgadas, todos los
      guerreros montados amigos que carguen (incluido el Caballero Buscador) a 4 pulgadas obtienen
      +1 para impactar, causan miedo y son inmunes a toda Psicología durante el primer asalto de
      combate.
  engine_option: Righteous Charge
  source_refs:
  - manual: broheim.net
    printed_page: 4
    section: 1 Questing Knight / Special Rules / Righteous Charge
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Knights Of The Bitter%20Moors.pdf
- id: mechanic.ghost-pirate-ethereal
  name: Ethereal
  name_i18n:
    es: Etéreo
  category: special
  kind: profile
  effect: >-
    Ghost Pirates and Screaming Ghosts have the ability 'Ethereal', which gives a 4+ unmodifiable
    save against all attacks. It may not be used with Dodge or Step Aside, and has no effect against
    magical attacks (Spells, Prayers, Artifacts, Gromril, Ithilmar, & Silver Bullets). Also, the
    model may take a Leadership test in the movement phase: if successful, they may move through any
    terrain piece and/or on top of water. If the model starts his next turn in the middle of a
    terrain piece or on top of water, they must take another Leadership test in the movement phase:
    if the test fails, the model is instantly taken out of action. However, after warband formation,
    all items cost double to purchase for Ethereal models. If the crew finds any items, roll a D6:
    on 5+ they can be used by both Ethereal and Non-Ethereal models. On 1-4, it can only be used by
    Non-Ethereal models (mark it as such on your roster).
  effect_i18n:
    es: >-
      Los Piratas Fantasma y los Espectros Aullantes tienen la habilidad 'Etéreo', que otorga una
      tirada de salvación de 4+ no modificable contra todos los ataques. No puede usarse con Esquiva
      ni Apartar el golpe, y no tiene efecto contra ataques mágicos (hechizos, plegarias,
      artefactos, gromril, ithilmar y balas de plata). Además, el modelo puede hacer una tirada de
      Liderazgo en la fase de movimiento: si la supera, puede atravesar cualquier terreno y/o
      moverse sobre el agua. Si el modelo comienza su siguiente turno dentro de un terreno o sobre
      el agua, debe superar otra tirada de Liderazgo en la fase de movimiento: si falla, el modelo
      queda fuera de combate al instante. Sin embargo, tras la formación de la banda, todos los
      objetos cuestan el doble para los modelos Etéreos. Si la tripulación encuentra objetos, tira
      1D6: con 5+ pueden usarlos tanto modelos Etéreos como no Etéreos; con 1-4, solo pueden usarlos
      modelos no Etéreos (márcalo en tu lista).
  engine_option: Ethereal
  source_refs:
  - manual: broheim.net
    printed_page: 1
    section: Special Rules / Ethereal
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Ghost%20Pirates.pdf
- id: mechanic.wheelo-skill-modifications
  name: Special Skill Modifications
  name_i18n:
    es: Modificaciones de Habilidades Especiales
  category: special
  kind: profile
  effect: >-
    Weapons Training: as Wheelos do not carry weapons as such (any blades etc. on the Wheelo itself
    count as the instruments for the actual Impact Hits themselves). However, a Wheelo who gains
    "Weapons Training" may have one of the following weapons fitted to its body. This will boost the
    Impact Hits in the following way: Axe - Impact Hits deal -1 Armour save. Club - Impact Hits deal
    Concussion. Spear - if charged, the Wheelo still deals a single Impact Hit to the charger before
    attacks are made. Morning Star - the first round of Impact Hits dealt each game are at S5
    instead of S4; all Impact Hits after are at normal Strength. Sprint: instead of rolling 2D6" to
    run/charge, the Snotling player may choose to move the Wheelo 3D6" instead. Mighty Blow: the
    crew gains +1 to wound in combat; has no effect on Impact Hits.
  effect_i18n:
    es: >-
      Entrenamiento con Armas: como los Wheelos no llevan armas como tal (cualquier cuchilla u otra
      cosa en el propio Wheelo cuenta como el instrumento de los Impactos de Colisión). Sin embargo,
      un Wheelo que obtenga "Entrenamiento con Armas" puede llevar una de las siguientes armas
      acopladas a su cuerpo, lo que potencia los Impactos de Colisión así: Hacha - los Impactos de
      Colisión causan -1 a la salvación por armadura. Garrote - los Impactos de Colisión causan
      Conmoción. Lanza - si es cargado, el Wheelo sigue causando un único Impacto de Colisión al
      cargador antes de que se hagan los ataques. Lucero del Alba - la primera ronda de Impactos de
      Colisión de cada partida es a F5 en lugar de F4; todos los Impactos posteriores son a Fuerza
      normal. Esprintar: en lugar de tirar 2D6" para correr/cargar, el jugador Snotling puede elegir
      mover el Wheelo 3D6". Golpe Poderoso: la tripulación gana +1 para herir en combate; no tiene
      efecto sobre los Impactos de Colisión.
  engine_option: Special Skill Modifications
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: 0-1 Snotling Wheelo / Special Rules / Special Skill Modifications
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/snotlings
- id: mechanic.unholy-stink
  name: Unholy Stink
  name_i18n:
    es: Hedor Impío
  kind: profile
  category: special
  effect: >-
    The Bog hunter is covered in a thick layer of dung, the smell is so distracting that all enemies
    are at -1 to hit the Bog hunter in close combat.
  effect_i18n:
    es: >-
      El Cazador de Ciénagas está cubierto por una gruesa capa de estiércol; el olor es tan
      distractor que todos los enemigos obtienen -1 por impactar al Cazador de Ciénagas en combate
      cuerpo a cuerpo.
  engine_option: Unholy Stink
  source_refs:
  - manual: broheim.net
    printed_page: 1
    section: Hired Swords
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Lords%20of%20the%20Marsh.pdf
