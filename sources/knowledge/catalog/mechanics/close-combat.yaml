- id: mechanic.wolf-rat-bite
  name: Wolf Rat Bite
  name_i18n:
    es: Mordisco de Rata Lobo
  category: special
  kind: profile
  effect: Attacks use Strength 4 without modifying enemy armour saves.
  effect_i18n:
    es: Los ataques usan Fuerza 4 sin modificar las salvaciones por armadura enemigas.
  engine_option: Wolf Rat Bite
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Wolf Rats / Poisoned Attack
