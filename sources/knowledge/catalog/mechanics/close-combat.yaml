    When rolling on the Injury table for this Hero, a roll of 1-3 is treated as knocked down, 4-5 as
    stunned, and 6 as out of action.
  effect_i18n:
    es: >-
      Al tirar en la tabla de Heridas para este Héroe, un resultado de 1-3 se trata como derribado, 4-5
      como aturdido y 6 como fuera de combate.
  kind: warband
  engine_option: Tough as Steel
  source_refs: []
  name_i18n:
    es: Duro Como el Acero
