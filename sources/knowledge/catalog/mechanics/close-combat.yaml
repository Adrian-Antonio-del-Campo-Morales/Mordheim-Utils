defences:
- id: defence.holy-relic
  name: Holy Relic
  name_i18n:
    es: Reliquia Santa
  effect: >-
    A model with a holy relic will automatically pass the first Leadership test he is required to
    make in the game. If worn by the leader, it will allow him to automatically pass the first Rout
    test if he has not taken any Leadership tests before. You can only ignore the first Leadership
    test in any single game – owning two or more holy relics will not allow you to ignore second and
    subsequent tests.
  effect_i18n:
    es: >-
      Una miniatura con una reliquia sagrada pasará automáticamente la primera prueba de Liderazgo
      que debe realizar en el juego. Si el líder lo usa, le permitirá pasar automáticamente la
      primera prueba de Huida si no ha realizado ninguna prueba de Liderazgo antes. Solo puedes
      ignorar la primera prueba de Liderazgo en un solo juego; poseer dos o más reliquias sagradas
      no te permitirá ignorar la segunda prueba y las siguientes.
  engine_option: Holy relic
  source_refs:
