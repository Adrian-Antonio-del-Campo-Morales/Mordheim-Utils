- id: skill.crude-belch-halfling
  name: Crude Belch (Halflings)
  name_i18n:
    es: Eructo Grosero (Medianos)
  category: special
  kind: warband
  effect: >-
    In the first melee round, enemies in base contact test Leadership and miss their first attack on
    failure, even their only attack.
  effect_i18n:
    es: >-
      En la primera ronda cuerpo a cuerpo, los enemigos en contacto base hacen una prueba de
      Liderazgo y pierden su primer ataque si fallan, incluso si es el único.
  engine_option: Crude Belch (Halflings)
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Halfling Special Skills / Crude Belch
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/halflings
- id: mechanic.sabretusk-charge
  name: Sabretusk Charge
  name_i18n:
    es: Carga de Colmillos de Sable
  category: special
  kind: profile
  effect: Sabretusks fight with two attacks instead of one during the turn they charge.
  effect_i18n:
    es: >-
      Los Colmillos de Sable combaten con dos ataques en lugar de uno durante el turno en que
      cargan.
  engine_option: Sabretusk Charge
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Sabretusk Cubs / Charge
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/ogre-hunting-party
- id: mechanic.seaguard-spear-master
  name: Seaguard Spear Master
  name_i18n:
    es: Maestro de la Lanza de los Guardias del Mar
  category: special
  kind: profile
  effect: >-
    In the first combat round with a spear, gain +1 Strength and choose one failed hit to reroll.
  effect_i18n:
    es: >-
      En la primera ronda de combate con lanza, obtiene +1 Fuerza y elige una tirada fallida para
      impactar que repetir.
  engine_option: Seaguard Spear Master
  source_refs:
  - manual: broheim.net
    printed_page: 4
    section: Henchmen / Seaguards / Spear Master
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Lothern%20Sea%20Patrol.pdf
- id: mechanic.leader-six
  name: Local Leader (6 Inches)
  name_i18n:
    es: Líder Local (6 Pulgadas)
  category: special
  kind: profile
  effect: >-
    A standing leader may optionally lend Leadership to a warrior of the same warband within 6
    inches.
  effect_i18n:
    es: >-
      Un líder en pie puede prestar opcionalmente su Liderazgo a un guerrero de su banda a 6
      pulgadas.
  engine_option: Local Leader (6 inches)
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
