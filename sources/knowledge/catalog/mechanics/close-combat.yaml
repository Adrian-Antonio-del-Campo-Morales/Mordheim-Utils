    url: https://broheim.net/downloads/hiredswords/mutinyinmarienburg/MiM%20Specialists.pdf
- id: mechanic.flesh-peddler
  name: Flesh-Peddler
  name_i18n:
    es: Mercader de Carne
  kind: profile
  category: special
  effect: >-
    The Pimp gets +1 to hit his nominated female mark. Movement and campaign consequences are
    outside the duel.
  effect_i18n:
    es: >-
      El Rufián obtiene +1 por impactar a su objetivo femenino designado. Movimiento y consecuencias
