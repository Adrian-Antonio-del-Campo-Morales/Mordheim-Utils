- id: mechanic.taal-tranquil-fauna
  name: Tranquil Fauna
  kind: profile
  category: special
  engine_option: Tranquil Fauna
  name_i18n:
    es: Fauna Tranquila
  effect: Animals never attack the Priest. Animals controlled by a warrior with Animal Handler or large predatory
    beasts must pass a Leadership test using the handler's Leadership to attack him; failure does not result in
    a failed charge.
  effect_i18n:
    es: Los animales nunca atacan al Sacerdote. Los animales controlados por un guerrero con Adiestrador de Animales
      o las grandes bestias depredadoras deben superar un chequeo con el Liderazgo del adiestrador para atacarlo;
      fallar no provoca una carga fallida.
