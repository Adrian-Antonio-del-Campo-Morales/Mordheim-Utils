    es: Chequea Liderazgo individual al inicio de cada turno propio. Un fallo impide atacar cuerpo a cuerpo hasta el siguiente turno propio, sin cambiar las tiradas para impactar del enemigo. El movimiento aleatorio por el tablero queda fuera del duelo.
