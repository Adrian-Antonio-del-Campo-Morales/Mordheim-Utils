- id: skill.wound-valour
  name: Virtue of Valour (Bitter Moors)
  name_i18n:
    es: Virtud del Valor (Páramos Amargos)
  category: special
  kind: warband
  effect: Re-rolls failed wound rolls against opponents with a strictly higher natural Strength.
  effect_i18n:
    es: >-
      Repite las tiradas para herir fallidas contra enemigos con una Fuerza natural estrictamente
      superior.
  engine_option: Virtue of Valour (Bitter Moors)
  source_refs:
  - manual: broheim.net
    printed_page: 3
    section: Bretonnian Special Skills / Virtue of Valour
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Knights%20Of%20The%20Bitter%20Moors.pdf
- id: mechanic.sea-troll-slime
  name: Sea Troll Slime
  name_i18n:
    es: Baba del Troll Marino
  category: special
  kind: warband
  effect: Enemies suffer -1 to hit the Sea Troll in melee; a natural six still hits.
  effect_i18n:
    es: >-
      Los enemigos sufren -1 para impactar al Troll Marino en cuerpo a cuerpo; un seis natural sigue
      impactando.
  engine_option: Sea Troll Slime
  source_refs:
  - manual: broheim.net
