    url: https://broheim.net/downloads/hiredswords/mutinyinmarienburg/MiM%20Specialists.pdf
- id: mechanic.snorri-lucky
  name: Lucky
  name_i18n:
    es: Afortunado
  kind: profile
  category: special
  effect: >-
    Although he has no armour Snorri has a knack of avoiding harm. He has a 5+ ward save against
    shooting and combat.
  effect_i18n:
    es: >-
      Aunque no lleva armadura, Snorri tiene el don de esquivar el daño. Tiene una tirada de
      salvación especial de 5+ contra disparos y combate.
  engine_option: Lucky
  source_refs:
  - manual: broheim.net
    printed_page: 62
    section: Hired Swords and Dramatis Personae / Snorri Nosebiter - Dramatis Personae
    url: https://broheim.net/downloads/campaigns/karakazgal/Karak Azgal.pdf
- id: mechanic.norse-shieldmaster
  name: Shieldmaster
  name_i18n:
    es: Maestro del Escudo
  kind: profile
  category: special
  effect: >-
    A Norse mercenary has trained with a shield since childhood becoming so skilled as to repel any
    blow. A Bearman Bodyguard may parry with it in addition to getting a save throw.
  effect_i18n:
    es: >-
      Un mercenario nórdico ha entrenado con un escudo desde la infancia, llegando a ser tan diestro
      que repele cualquier golpe. Un Guardaespaldas Hombre Oso puede parar con él además de obtener
      su tirada de salvación.
  engine_option: Shieldmaster
  source_refs:
  - manual: broheim.net
    printed_page: 3
    section: Specialists / Norse Bearman Bodyguard
    url: https://broheim.net/downloads/hiredswords/mutinyinmarienburg/Specialists.pdf
- id: mechanic.norse-bulwark
  name: Bulwark
  name_i18n:
    es: Baluarte
  kind: profile
  category: special
  effect: >-
    Bearmen fight expertly with a shield in one hand and an axe in the other. The Bearman Bodyguard
    gets an additional +1 bonus on his armour saving roll in close combat.
  effect_i18n:
    es: >-
      Los Hombres Oso luchan con maestría con un escudo en una mano y un hacha en la otra. El
      Guardaespaldas Hombre Oso obtiene un bonus adicional de +1 en su tirada de salvación por
      armadura en combate cuerpo a cuerpo.
  engine_option: Bulwark
  source_refs:
  - manual: broheim.net
    printed_page: 3
    section: Specialists / Norse Bearman Bodyguard
    url: https://broheim.net/downloads/hiredswords/mutinyinmarienburg/Specialists.pdf
- id: mechanic.marine-hunter
  name: Marine Hunter
  name_i18n:
    es: Cazador Marino
  kind: profile
  category: special
  effect: >-
    Whalers grow accustomed to hunting marine beasts. Double any wounds inflicted to aquatic models.
  effect_i18n:
    es: >-
      Los Balleneros se acostumbran a cazar bestias marinas. Duplica cualquier herida infligida a
      miniaturas acuáticas.
  engine_option: Marine Hunter
  source_refs:
  - manual: broheim.net
    printed_page: 3
