- id: mechanic.vengeful-hatred
  name: Vengeful Hatred
  name_i18n:
    es: Odio Vengativo
  category: special
  kind: profile
  note: >-
    The warrior permanently hates the single enemy the campaign's serious-injury result determined:
    the individual who caused the injury (the enemy leader when a henchman caused it), that
    warband's leader, the whole warband, or every warband of its type. The duel is supplied that
    concrete identity: the warrior's own instance key, the key of the warband instance it belongs
    to, or, for the last kind alone, the warband type. It rerolls missed melee hits in the first
    combat round only against that identity, never against every warrior of a profile, every warband
    of a catalogue list or, in the leader kind, every bearer of a Leader rule; the D6 that chose the
    target belongs to the campaign and is not simulated.
  engine_option: Vengeful Hatred
  source_refs:
  - manual: mordheimer.net
