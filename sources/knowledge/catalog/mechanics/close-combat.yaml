- id: mechanic.gypsy-ward
  name: Gypsy Ward
  name_i18n:
    es: Protección Gitana
  category: special
  kind: profile
  effect: Domnu has a special save of 5+ against magical attacks.
  effect_i18n:
    es: El Domnu tiene una salvación especial de 5+ contra ataques mágicos.
  engine_option: Gypsy Ward
  source_refs:
  - manual: sylvania-supplement
    printed_page: 0
    section: Domnu / Gypsy Ward
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/survivors-of-strigos
- id: mechanic.ravening-onslaught
  name: Ravening Onslaught
  name_i18n:
    es: Embestida Devoradora
  category: special
  kind: profile
  effect: >-
    Each natural hit roll of six grants another attack; further natural sixes generate further
    attacks.
  effect_i18n:
    es: >-
      Cada seis natural para impactar concede otro ataque; nuevos seises naturales generan nuevos
      ataques.
  engine_option: Ravening Onslaught
  source_refs:
  - manual: broheim.net
    printed_page: 5
