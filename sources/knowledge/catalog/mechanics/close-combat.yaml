  name_i18n:
    es: Odio Ancestral
  engine_option: KindredHatred
  effect: The Strigoi Vampire hates vampires of other bloodlines. This expressly granted Hatred applies despite his innate
    psychology immunity; normal Frenzy suppression and first-round timing remain.
