    friendly models are outside the 1v1 scope.
  effect_i18n:
    es: Al inicio de su turno el Sacerdote Guerrero puede declarar +1 Ataque durante esta fase de combate, una vez
      por duelo. Otras miniaturas amigas quedan fuera del ámbito 1v1.
  engine_option: Rousing Sermon
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Special Skills / Rousing Sermon
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/protectorate-of-sigmar
- id: mechanic.frantic
  name: Frantic
  name_i18n:
    es: Frenético
  category: special
  kind: profile
  effect: Strike before ordinary combatants regardless of weapon penalties or Initiative.
  effect_i18n:
    es: Ataca antes que los combatientes ordinarios sin importar las penalizaciones del arma ni la Iniciativa.
  engine_option: Frantic
  source_refs:
  - manual: broheim.net
    printed_page: 14
    section: Henchmen / 0-2 Fanatics / Special Rules / Frantic
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Crooked Moon Night Goblins.pdf
- id: mechanic.questing-vow
  name: Questing Vow
  name_i18n:
    es: Voto de la Búsqueda
  category: special
  kind: profile
  effect: While charging, charged by or engaged with a Fear-causing opponent, may reroll a failed individual Leadership
    test once. Group Rout tests are outside the duel scope.
  effect_i18n:
    es: Al cargar, recibir una carga o combatir con un enemigo que cause Miedo, puede repetir una prueba individual
      de Liderazgo fallida una vez. Las pruebas de huida de banda quedan fuera del duelo.
  engine_option: Questing Vow
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Knightly Skills / Questing Vow
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/bretonnian-chapel-guard
- id: mechanic.iron-cage
  name: Iron Cage
  name_i18n:
    es: Jaula de Hierro
  category: special
  kind: profile
  effect: The gibbet cage fastened around the skeleton forms a makeshift protection. Gibbets receive a 5+ armour
    save, as if they wear Heavy Armor. This may not be lost, stolen, or given to other models.
  effect_i18n:
    es: La jaula sujeta alrededor del esqueleto forma una protección improvisada. Las Jaulas de Hierro obtienen
      una tirada de salvación por armadura de 5+, como si llevaran Armadura Pesada. Esta no puede perderse, robarse
      ni cederse a otros modelos.
  engine_option: Iron Cage
  source_refs:
  - manual: broheim.net
    printed_page: 4
    section: Henchmen / 0-5 The Gibbets / Special Rules
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Ghost%20Pirates.pdf
- id: mechanic.frustratingly-tiny
  name: Frustratingly Tiny
  name_i18n:
    es: Exasperantemente Minúsculo
  category: special
  kind: profile
  effect: Acquired Snotling skill; enemies suffer -1 to hit in melee. Cannot combine with Big Bully. Hidden detection is outside the duel scope.
  effect_i18n:
    es: Habilidad adquirida de los Snotlings; los enemigos sufren -1 al impactar en combate cuerpo a cuerpo. No se combina con Matón Enorme. Detectar miniaturas ocultas queda fuera del duelo.
  engine_option: Frustratingly Tiny
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Snotling Special Skills / Frustratingly Tiny
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/snotlings
- id: mechanic.bestial
  name: Bestial
  name_i18n:
    es: Bestia (Bestial)
  category: special
  kind: profile
  effect: The vampire has an innate way of avoiding being hurt. He has a 6+ ward save
    against all attacks.
  effect_i18n:
    es: El vampiro tiene una forma innata de evitar ser dañado. Tiene una salvación
      de parada de 6+ contra todos los ataques.
  engine_option: Bestial
  source_refs:
  - manual: broheim.net
    printed_page: 51
    section: heroes / 1 Vampire / Special Rules / Bestial
    url: https://broheim.net/downloads/campaigns/karakazgal/Karak Azgal.pdf
- id: mechanic.magical-void
  name: Magical Void
  name_i18n:
    es: Vacío Mágico
  category: special
  kind: profile
  effect: The Corpse Master is a space void of magic and thus gains a 4+ save against
    enemy spells and magic weapons.
  effect_i18n:
    es: El Maestro de Cadáveres es un espacio vacío de magia y por tanto obtiene una
      salvación de 4+ contra hechizos enemigos y armas mágicas.
  engine_option: Magical Void
  source_refs:
  - manual: broheim.net
    printed_page: 4
    section: 1 Corpse Master / Special Rules / Magical Void
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Call
      Of The Night Haint.pdf
- id: mechanic.hard-to-rattle
  name: Hard to Rattle
  name_i18n:
    es: Difícil de Aturdir
  category: special
  kind: profile
  effect: All Fen Guard count as wearing a helmet, which gives a 4+ stun save. Fire
    attacks ignore this rule.
  effect_i18n:
    es: Toda la Guardia del Ciénaga cuenta como si llevara casco, lo que otorga una
      salvación por aturdimiento de 4+. Los ataques de fuego ignoran esta regla.
  engine_option: Hard to Rattle
  source_refs:
  - manual: broheim.net
    printed_page: 1
    section: Special Rules / Hard to Rattle
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Fen
      Guard.pdf
- id: mechanic.fen-hard-to-kill
  name: Hard to Kill
  name_i18n:
    es: Difíciles de Matar
  category: special
  kind: profile
  effect: 'Dryads and Spiteborn can only be taken out of action on a roll of 6 instead
    of 5-6 on the injury chart: treat 1-2 as knocked down, 3-5 as stunned and 6 as
    out of action. Fire attacks ignore this rule.'
  effect_i18n:
    es: 'Las Dríadas y los Nacidos del Rencor solo pueden quedar Fuera de combate
      con un 6 en lugar de 5-6 en la tabla de heridas: trata 1-2 como derribado, 3-5
      como aturdido y 6 como Fuera de combate. Los ataques de fuego ignoran esta regla.'
  engine_option: Hard to Kill (fen-guard-mim)
  source_refs:
  - manual: broheim.net
    printed_page: 1
    section: Special Rules / Hard to Kill
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Fen
      Guard.pdf
- id: mechanic.bat-injury-chart
  name: Squishy
  name_i18n:
    es: Blanditos
  category: special
  kind: profile
  effect: 'Bats are not very tough and use the following Injury chart: 1-2 Knocked
    Down, 3 Stunned, 4-6 Out of Action.'
  effect_i18n:
    es: 'Los Murciélagos no son muy resistentes y usan la siguiente tabla de Heridas:
      1-2 Derribado, 3 Aturdido, 4-6 Fuera de Combate.'
  engine_option: Squishy (strigoi-kaz)
  source_refs:
  - manual: broheim.net
    printed_page: 53
    section: henchmen / 0-5 Bats / Special Rules / Squishy
    url: https://broheim.net/downloads/campaigns/karakazgal/Karak Azgal.pdf
- id: dance.whirling-death
  name: Whirling Death
  name_i18n:
    es: Muerte Giratoria
  category: special
  kind: profile
  effect: Each strike of the Wardancer's blade is made with uncanny precision, capable
    of severing a head or piercing a heart with one deceptively elegant stroke. While
    performing this Dance, the warrior gains +1 to any Injury rolls.
  effect_i18n:
    es: Cada golpe de la hoja del Bailarín de la Guerra se asesta con una precisión
      sobrenatural, capaz de segar una cabeza o atravesar un corazón con un solo movimiento
      engañosamente elegante. Mientras interpreta esta Danza, el guerrero gana +1
      a cualquier tirada de Heridas.
  engine_option: Whirling Death
  source_refs:
  - manual: broheim.net
    printed_page: 5
    section: Wardancer special skills / Whirling Death
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Sea%20Ghosts.pdf
- id: dance.storm-of-blades
  name: Storm of Blades
  name_i18n:
    es: Tormenta de Hojas
  category: special
  kind: profile
  effect: The Wardancer rains blow after blow upon their opponent, moving with such
    speed that the eye cannot follow each distinct cut and thrust. While performing
    this Dance, a warrior is granted +1 Attack.
  effect_i18n:
    es: El Bailarín de la Guerra descarga golpe tras golpe sobre su oponente, moviéndose
      con tal velocidad que el ojo no puede seguir cada corte y estocada. Mientras
      interpreta esta Danza, el guerrero recibe +1 Ataque.
  engine_option: Storm of Blades
  source_refs:
  - manual: broheim.net
    printed_page: 5
    section: Wardancer special skills / Storm of Blades
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Sea%20Ghosts.pdf
- id: dance.the-shadows-coil
  name: The Shadows Coil
  name_i18n:
    es: El Rizo de las Sombras
  category: special
  kind: profile
  effect: With agile grace the Wardancer evades the clumsy attacks of their enemies,
    becoming almost impossible to strike. While performing this Dance, the Wardancer
    has a special 4+ save throw which cannot be modified by Strength, magic spells
    or magic weapons.
  effect_i18n:
    es: Con ágil gracia, el Bailarín de la Guerra esquiva los torpes ataques de sus
      enemigos y se vuelve casi imposible de golpear. Mientras interpreta esta Danza,
      el Bailarín de la Guerra dispone de una salvación especial de 4+ que no puede
      ser modificada por la Fuerza, los hechizos ni las armas mágicas.
  engine_option: The Shadows Coil
  source_refs:
  - manual: broheim.net
    printed_page: 5
    section: Wardancer special skills / The Shadows Coil
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Sea%20Ghosts.pdf
- id: dance.woven-mist
  name: Woven Mist
  name_i18n:
    es: Niebla Tejida
  category: special
  kind: profile
  effect: The sinuous movements of this Dance distract and confuse the enemy, allowing
    the Wardancer to strike before their foe can react. When performing this Dance,
    the warrior reduces his total attacks by one but always Strikes first in combat.
    If their opponent also Strikes first, resolve attacks in Initiative order.
  effect_i18n:
    es: Los movimientos sinuosos de esta Danza distraen y confunden al enemigo, permitiendo
      al Bailarín de la Guerra golpear antes de que su oponente pueda reaccionar.
      Al interpretar esta Danza, el guerrero reduce en uno su total de ataques pero
      siempre golpea primero en combate. Si su oponente también golpea primero, se
      resuelven los ataques por orden de Iniciativa.
  engine_option: Woven Mist
  source_refs:
  - manual: broheim.net
    printed_page: 5
    section: Wardancer special skills / Woven Mist
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Sea%20Ghosts.pdf
- id: mechanic.honorable
  name: Honorable
  name_i18n:
    es: Honrado
  category: special
  kind: profile
  effect: The Imperial Noble will never attack an opponent that is Knocked Down or
    Stunned.
  effect_i18n:
    es: El Noble Imperial nunca atacará a un oponente que esté Derribado o Aturdido.
  engine_option: Honorable
  source_refs:
  - manual: broheim.net
    printed_page: 23
    section: heroes / 0-1 Imperial Noble / Special Rules / Honorable
    url: https://broheim.net/downloads/campaigns/karakazgal/Karak Azgal.pdf
- id: mechanic.animal-friendship
  name: Animal Friendship
  name_i18n:
    es: Amistad Animal
  category: special
  kind: profile
  effect: Having grown up amidst the animals of the forest, this warrior exudes a certain charm to all 'normal' animals (ie, warhorses, warhounds, etc) Animals will never attack him and up to two wardogs (see Mordheim book, page 54) that the warrior owns do not count against the maximum number of models in the warband.
  effect_i18n:
    es: Habiéndose criado entre los animales del bosque, este guerrero desprende un cierto encanto para todos los animales 'normales' (es decir, corceles de guerra, perros de guerra, etc). Los animales nunca lo atacarán y hasta dos perros de guerra (ver el libro de Mordheim, página 54) que posea el guerrero no cuentan contra el número máximo de modelos de la banda.
  engine_option: Animal Friendship
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Ostlander Special Skills / Animal friendship
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/ostlander
- id: mechanic.thirst-for-vengeance
  name: Thirst for Vengeance
  name_i18n:
    es: Sed de Venganza
  category: special
  kind: profile
  effect: The warrior Hates all undead. In his quest for revenge, he gains +1 attack in a turn where he has charged.
  effect_i18n:
    es: El guerrero Odia a todos los no-muertos. En su búsqueda de venganza, gana +1 ataque en un turno en el que haya cargado.
  engine_option: Thirst for Vengeance
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Special Skills / Thirst for Vengeance
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/vampire-hunters-of-sylvania
- id: mechanic.blessing-of-morr
  name: Blessing of Morr
  name_i18n:
    es: Bendición de Morr
  category: special
  kind: profile
  effect: The warrior has the Death god's blessing in his work. Add +1 to all injury rolls against the undead.
  effect_i18n:
    es: El guerrero cuenta con la bendición del dios de la Muerte en su labor. Suma +1 a todas las tiradas de herida contra los no-muertos.
  engine_option: Blessing of Morr
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Special Skills / Blessing of Morr
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/vampire-hunters-of-sylvania
- id: mechanic.torturer
  name: Torturer
  name_i18n:
    es: Torturador
  category: special
  kind: profile
  effect: Having learned the craft of torture in the Ritual of the Comet, the warrior knows how to inflict maximum pain on the body and uses it in a sadistic and cruel way in combat. Any model successfully wounded (and not saved) in close combat by this Hero loses 1 point of Strength permanently for the duration of the battle as the pain from the wound causes agony. The effect is accumulative and can reduce the Strength of the target to a minimum of 1. The Undead are immune to this effect.
  effect_i18n:
    es: Habiendo aprendido el oficio de la tortura en el Ritual del Cometa, el guerrero sabe cómo infligir el máximo dolor al cuerpo y lo usa de forma sádica y cruel en combate. Cualquier miniatura herida con éxito (y no salvada) en combate cuerpo a cuerpo por este Héroe pierde 1 punto de Fuerza permanentemente durante el resto de la batalla, ya que el dolor de la herida causa agonía. El efecto es acumulativo y puede reducir la Fuerza del objetivo a un mínimo de 1. Los Muertos Vivientes son inmunes a este efecto.
  engine_option: Torturer
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Cursed Cavalcade Special Skills / Torturer
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/cursed-cavalcade
- id: mechanic.mesmerising-dance
  name: Mesmerising Dance
  name_i18n:
    es: Danza Hipnótica
  category: special
  kind: warband
  effect: Some Amazon women develop their fighting motions into a graceful dance that can transfix their foes. Any model fighting in base contact with the Amazon must take a Leadership test at the start of each turn. If they fail they cannot attack that turn but may defend themselves. The dance however is useless against Lizardmen and undead who are immune to their charms.
  effect_i18n:
    es: Algunas mujeres amazonas desarrollan sus movimientos de combate hasta convertirlos en una danza graceful capaz de hipnotizar a sus enemigos. Cualquier modelo que luche en contacto de peana con la Amazona debe superar un chequeo de Liderazgo al inicio de cada asalto. Si lo fallan, no pueden atacar ese asalto, pero pueden defenderse. Sin embargo, la danza es inútil contra Hombres Lagarto y no-muertos, inmunes a sus encantos.
  engine_option: Mesmerising Dance
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Amazon special skills / mesmerising dance
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/amazons-lustria
- id: mechanic.savage-fury
  name: Savage Fury
  name_i18n:
    es: Furia Salvaje
  category: special
  kind: warband
  effect: The Amazon has learned to channel her anger and aggression making her a veritable animal while attacking her foes. Any Amazon model with this skill receives + 1 A when charging and is immune to charm effects and fear.
  effect_i18n:
    es: La Amazona ha aprendido a canalizar su ira y agresividad, convirtiéndose en un auténtico animal al atacar a sus enemigos. Cualquier modelo Amazona con esta habilidad recibe +1 A al cargar y es inmune a los efectos de encantamiento y al miedo.
  engine_option: Savage Fury
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Amazon special skills / savage fury
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/amazons-lustria
- id: mechanic.mark-of-shornaal
  name: Mark of Shornaal the Serpent
  name_i18n:
    es: Marca de Shornaal la Serpiente
  category: special
  kind: profile
  effect: Enemy models that are not Immune to Psychology cannot attack a marked leader in close combat unless they pass a Leadership test on 3D6, discarding the lowest die. On failure, they are hit automatically in close combat. Once passed, no further test is required that battle. Lizardmen Cold Blooded cannot be used for this test. Seer ritual and item-creation effects are intentionally not modelled here.
  effect_i18n:
    es: Las miniaturas enemigas que no sean Inmunes a la Psicología no pueden atacar a un líder marcado en combate cuerpo a cuerpo a menos que superen un chequeo de Liderazgo con 3D6, descartando el dado más bajo. Si fallan, son impactadas automáticamente en combate cuerpo a cuerpo. Una vez superado, no se requiere ningún chequeo más esa batalla. La Sangre Fría de los Hombres Lagarto no puede usarse para este chequeo. Los efectos de ritual y creación de objetos del Vidente no están modelados intencionadamente aquí.
  engine_option: Mark of Shornaal the Serpent
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Mark of the Dark Gods / Mark of Shornaal the Serpent
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/marauders-of-chaos
- id: mechanic.hypnotist
  name: Hypnotist
  name_i18n:
    es: Hipnotista
  category: special
  kind: profile
  effect: 'At the beginning of the combat phase the Sleuth may hypnotise any living warrior in base contact that is not Immune to Psychology. The suspect must pass a Leadership test or be entranced: an entranced warrior may not attack in close combat and is treated as knocked down for the purpose of being attacked. The trance ends when the entranced warrior or the Sleuth has been attacked, or when the Sleuth chooses to end it.'
  effect_i18n:
    es: 'Al inicio de la fase de combate, la detective puede hipnotizar a cualquier guerrero vivo en contacto de base que no sea Inmune a la Psicología. El sospechoso debe superar un chequeo de Liderazgo o quedará embelesado: un guerrero embelesado no puede atacar en combate cuerpo a cuerpo y se trata como derribado a efectos de ser atacado. El trance termina cuando el guerrero embelesado o la detective sean atacados, o cuando la detective decida finalizarlo.'
  engine_option: Hypnotist
  source_refs:
  - manual: broheim.net
    printed_page: 4
    section: 0-1 Private sleuth / Special Rules / Hypnotist
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Watchmen.pdf
- id: mechanic.wraith-touch
  name: Wraith Touch
  name_i18n:
    es: Toque de Espectro
  category: special
  kind: warband
  effect: The hero may make a Wraith Touch attack instead of their normal attacks in close combat. The hero making a Wraith Touch makes a single unarmed attack, if it hits, it wounds automatically, all rules that apply to unarmed attacks apply to the Wraith Touch. If a Liche uses this skill and wounds, then he may regain one lost wound. This may not take the hero beyond his starting total. Necromancers do not regain wounds with this skill. This skill has no effect on the Possessed or Undead.
  effect_i18n:
    es: El héroe puede realizar un ataque de Toque de espectro en lugar de sus ataques normales en combate cuerpo a cuerpo. El héroe que realiza un Toque de espectro hace un único ataque desarmado; si impacta, hiere automáticamente; todas las reglas que aplican a los ataques desarmados aplican al Toque de espectro. Si un Liche usa esta habilidad y hiere, puede recuperar una herida perdida. Esto no puede llevar al héroe más allá de su total inicial. Los Nigromantes no recuperan heridas con esta habilidad. Esta habilidad no tiene efecto sobre los Poseídos ni los Muertos Vivientes.
  engine_option: Wraith Touch
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Restless Dead special skills / wraith touch
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/restless-dead
- id: mechanic.titanic-strength
  name: Titanic Strength
  name_i18n:
    es: Fuerza Titánica
  category: special
  kind: warband
  effect: The hero is titanic in size and muscle mass. Whenever this Brood member hits an enemy warrior, but fails to wound, the hit model must pass a Strength test to avoid getting knocked down.
  effect_i18n:
    es: El héroe es titánico en tamaño y masa muscular. Siempre que este miembro de la Camada impacte a un guerrero enemigo pero no consiga herirlo, el modelo impactado debe superar un chequeo de Fuerza para evitar quedar derribado.
  engine_option: Titanic Strength
  source_refs:
  - manual: broheim.net
    printed_page: 2
    section: Special rules / Titanic Strength
    url: https://broheim.net/downloads/warbands/supplement/sealedcity/Brood Of Ghurash.pdf
- id: mechanic.foul-odour
  name: Foul Odour
  name_i18n:
    es: Hedor
  category: special
  kind: warband
  effect: Ostlanders are prodigious drinkers and none too hygienic! This warrior rises head and shoulders above the rest. After a lifetime of drinking, liquor has little effect on him any more... not that this stops him from consuming massive quantities! His unwashed clothes and sweat reek of alcohol and all living enemies (not Undead or Possessed) are at -1 to hit him in hand-to-hand combat. In addition, the warrior cannot carry any open flames (torch, lantern, etc) and fire attacks made against him are resolved at +1 Strength as his booze soaked clothing burns readily.
  effect_i18n:
    es: ¡Los ostlandeses son bebedores prodigiosos y poco higiénicos! Este guerrero sobresale por encima del resto. Tras toda una vida de bebida, el licor apenas le afecta ya... lo que no le impide consumir cantidades masivas. Sus ropas sin lavar y su sudor huelen a alcohol, y todos los enemigos vivos (no Muertos Vivientes ni Poseídos) sufren -1 para impactarlo en combate cuerpo a cuerpo. Además, el guerrero no puede portar llamas abiertas (antorcha, farol, etc.) y los ataques de fuego contra él se resuelven con +1 de Fuerza, ya que sus ropas empapadas de bebida arden con facilidad.
  engine_option: Foul Odour
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Ostlander Special Skills / Foul Odour
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/ostlander
- id: mechanic.centigor-drunken
  name: Drunken
  name_i18n:
    es: Ebrios
  category: special
  kind: profile
  effect: Centigor are inclined to drink vast quantities of noxious beer and looted wine and spirits before battle, working themselves up into a drunken frenzy. Roll 1D6 at the start of each turn. On a roll of 1, they must test for stupidity that turn. On a roll of 2-5 nothing happens and on the roll of a 6 they become subject to frenzy for that turn. Whilst subject to either stupidity or frenzy, they are immune to all other forms of psychology.
  effect_i18n:
    es: Los Centigor tienden a beber vastas cantidades de cerveza nociva y vino y aguardiente saqueados antes de la batalla, provocándose un frenesí ebrio. Tira 1D6 al comienzo de cada turno. Con un 1, deben chequear estupidez ese turno. Con un 2-5 no ocurre nada y con un 6 se vuelven sujetos a frenesí ese turno. Mientras estén sujetos a estupidez o frenesí, son inmunes a todas las demás formas de psicología.
  engine_option: Drunken
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 – 1 Centigors / Special Rules / Drunken
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/beastmen-raiders
- id: mechanic.undead
  name: Undead
  name_i18n:
    es: No Muerto
  category: special
  kind: profile
  effect: Skeletons are undead and follow all rules for the Undead.
  effect_i18n:
    es: Los Esqueletos son muertos vivientes y siguen todas las reglas de los Muertos Vivientes.
  engine_option: Undead
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: henchmen / Skeleton warriors / Special Rules / Undead
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/tomb-guardians
- id: mechanic.ethereal-hit-save
  name: Ethereal
  name_i18n:
    es: Etéreo
  category: special
  kind: profile
  effect: Spirits have a 4+ unmodifiable save against all attacks, taken after the To Hit roll. It may not be used with Dodge or Step Aside and has no effect against magical attacks. Missile attacks that fail to hit an ethereal model because of the save pass through, hitting the next closest target directly behind. The model is unaffected by terrain and may take a Leadership test in the movement phase to pass through any terrain piece and/or over water; if it starts its next turn inside a terrain piece it must take another Leadership test or be instantly taken out of action. After warband formation all items cost double for Ethereal models; items found are usable by both Ethereal and non-Ethereal models on a D6 roll of 5+, otherwise only by non-Ethereal models.
  effect_i18n:
    es: Los espíritus tienen una salvación de 4+ no modificable contra todos los ataques, que se realiza tras la tirada para impactar. No puede usarse con Esquiva ni Echarse a un lado y no tiene efecto contra ataques mágicos. Los ataques de misil que no impacten a un modelo etéreo por la salvación pasan a través, impactando al siguiente objetivo más cercano detrás. El modelo no se ve afectado por el terreno y puede hacer un chequeo de Liderazgo en la fase de movimiento para atravesar cualquier pieza de terreno y/o el agua; si comienza su siguiente turno dentro de una pieza de terreno debe hacer otro chequeo de Liderazgo o quedar Fuera de combate instantáneamente. Tras la formación de la banda, todos los objetos cuestan el doble para los modelos etéreos; los objetos encontrados pueden usarlos etéreos y no etéreos con un 5+ en 1D6; si no, solo los no etéreos.
  engine_option: Ethereal
  source_refs:
  - manual: broheim.net
    printed_page: 1
    section: Special rules / Ethereal
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Call Of The Night Haint.pdf
- id: mechanic.hatred-undead
  name: Hate Undead
  name_i18n:
    es: Odio a los No-Muertos
  category: special
  kind: profile
  effect: The men of Araby have suffered heavily at the hands (or should that be claws!) of the Tomb King’s armies in the Land of the Dead. Therefore, Araby Nomad Heroes hate all Undead.
  effect_i18n:
    es: Los hombres de Araby han sufrido enormemente a manos (¿o deberíamos decir garras?) de los ejércitos del Rey de las Tumbas en la Tierra de los Muertos. Por ello, los héroes Nómadas de Araby odian a todos los No-muertos.
  engine_option: Hate Undead
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: special rules / Hate Undead
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/arabian-tomb-raiders
- id: mechanic.andanti-knowledge
  name: Andanti Knowledge
  name_i18n:
    es: Conocimiento Andanti
  category: special
  kind: profile
  effect: Their secret knowledge passed from member to member makes them skilled fighters against vampires. When fighting a vampire they get +1 to hit in close combat.
  effect_i18n:
    es: Su conocimiento secreto, transmitido de miembro a miembro, los convierte en luchadores diestros contra los vampiros. Al luchar contra un vampiro obtienen +1 por impactar en combate cuerpo a cuerpo.
  engine_option: Andanti Knowledge
  source_refs:
