- id: mechanic.hatred-skaven-orcs-goblins
  name: Hate Skavens, Orcs and Goblins
  name_i18n:
    es: Odian a los Skaven, Orcos y Goblins
  category: special
  kind: profile
  effect: All Dwarfs hate Skavens, Orcs and Goblins. See the Psychology section of the Mordheim rules for details on the effects of hatred.
  effect_i18n:
    es: Todos los Enanos odian a los Skaven, Orcos y Goblins. Consulta la sección de Psicología de las reglas de Mordheim para más detalles sobre los efectos del odio.
  engine_option: Hate Skavens, Orcs and Goblins
  source_refs:
  - manual: broheim.net
