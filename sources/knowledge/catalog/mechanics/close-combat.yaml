- id: mechanic.despise-despoilers
  name: Despise Despoilers
  name_i18n:
    es: Desprecio a los Saqueadores
  category: special
  kind: profile
  effect: >-
    The Dark Mage hates Necromancers and adversaries using Necromancy or Dreaded Scrolls of Nagash
    spells in the first round of close combat.
  effect_i18n:
    es: >-
      El Mago Oscuro odia a los Nigromantes y a los adversarios que usan Nigromancia o los Pergaminos
      Temidos de Nagash durante la primera ronda de combate cuerpo a cuerpo.
  engine_option: Despise Despoilers
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Hired Swords / Dark Mage / Special Rules / Despise Despoilers
    url: https://mordheimer.net/docs/campaigns/hired-swords/grade-2a
- id: mechanic.ashamed-and-afraid
  name: Ashamed and Afraid
  name_i18n:
    es: Avergonzado y Asustado
  category: special
  kind: profile
  effect: >-
    The Fallen Sister must pass a Leadership test before charging a Sisters of Sigmar warband or a
    Warrior-Priest of a Witch Hunters warband; failure prevents the declared charge.
  effect_i18n:
    es: >-
      La Hermana Caída debe superar una prueba de Liderazgo antes de cargar contra una banda de
      Hermanas de Sigmar o un Sacerdote Guerrero de una banda de Cazadores de Brujas; si falla, la
      carga declarada no se realiza.
  engine_option: Ashamed and Afraid
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Hired Swords / The Fallen Sister / Special Rules / Ashamed and Afraid
    url: https://mordheimer.net/docs/campaigns/hired-swords/grade-2a
