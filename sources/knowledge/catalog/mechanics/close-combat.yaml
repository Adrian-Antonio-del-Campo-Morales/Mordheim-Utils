  name_i18n:
    es: Maldición del Réprobo
  category: special
  kind: profile
  effect: >-
    At own-turn start recover at most one lost wound on 5+, unaffected by fire. Requires Great
    Thirster.
  effect_i18n:
    es: >-
      Al inicio de su turno recupera como máximo una herida perdida con 5+, incluso por fuego.
      Requiere Gran Asediador.
  engine_option: Curse of the Revenant
  source_refs:
  - manual: sylvania-supplement
    printed_page: 0
    section: Strigoi Special Skills
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/survivors-of-strigos
