    attacks with one attack. If that attack hits, it inflicts 1D3 Wounds; roll To Wound separately
    for each Wound.
  kind: warband
  engine_option: Anvil Head
  source_refs: []
  name_i18n:
    es: Cabeza de Yunque
  effect_i18n:
    es: >-
      11 en 2D6; cuesta 45 coronas. Si la Abominación necromántica cargó, puede reemplazar todos sus
      ataques por uno solo. Si ese ataque impacta, inflige 1D3 Heridas; tira para herir por separado
      cada Herida.
- id: mechanic.death-blow
