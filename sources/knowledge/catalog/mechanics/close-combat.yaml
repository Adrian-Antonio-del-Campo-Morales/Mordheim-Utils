- id: skill.vampire-reflexes
  name: Vampire Reflexes
  category: special
  effect: >-
    The Vampire has an unmodifiable 6+ save against any Wound. If an attack causes multiple Wounds,
    make this save before multiplying the Wounds. This ability may be combined with Step Aside or
    Dodge to improve the save to 4+.
  kind: warband
  engine_option: Vampire Reflexes
  source_refs: []
  name_i18n:
    es: Reflejos de Vampiro
  effect_i18n:
    es: >-
      El Vampiro tiene una tirada de salvación inmodificable de 6+ contra cualquier Herida. Si un
      ataque causa varias Heridas, realiza esta tirada antes de multiplicar las Heridas. Esta
      habilidad puede combinarse con Apartarse o Esquivar para mejorar la salvación a 4+.
- id: skill.virtue-of-valour
  name: Virtue of Valour
  category: special
  effect: >-
    When fighting a model with a higher Strength characteristic, the warrior may re-roll failed
    hand-to-hand hit rolls.
  kind: warband
  engine_option: Virtue of Valour
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Bretonnian Knight Virtues
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/bretonnian
  name_i18n:
    es: Virtud del Valor
  effect_i18n:
    es: >-
      Cuando combate contra un modelo con una característica de Fuerza superior, el guerrero puede
      repetir las tiradas para impactar fallidas en combate cuerpo a cuerpo.
- id: skill.weapons-of-the-north
  name: Weapons of the North
  category: special
  effect: Re-rolls failed hit rolls with an axe or double-handed weapon.
