schema_version: 2
ruleset: mordheim
note: Cross-band rules promoted after an equivalence review (identical prose across two or more band files).
note2: Band rules restate them as `rule_ref`; runtime stays on the band rule.
rules:
- id: shared-rule.always-hungry
  name: Always Hungry
  name_i18n:
    es: Siempre Hambriento
  effect: >-
    A Troll requires an upkeep cost. This upkeep represents the copious amounts of food that must be
    fed to the Troll in order to keep him loyal to the warband. The warband must pay 20 gold crowns
    after every game in order to keep the Troll. If a warband lacks the gold to pay the upkeep, the
    Boss has the option to let him count as 2 members, letting the Troll cost only 5 crowns. However
    this does effectively drop your maximum warband size down to 11 models.
  effect_i18n:
    es: >-
      Un troll requiere un coste de manutención. Este coste representa las cantidades copiosas de
      comida que hay que darle al troll para mantenerlo leal a la banda. La banda debe pagar 20
      coronas de oro tras cada partida para conservar al troll. Si la banda carece de oro para pagar
      la manutención, el Jefe tiene la opción de que cuente como 2 miembros, de modo que el troll
      solo cueste 5 coronas. Sin embargo, esto reduce efectivamente el tamaño máximo de tu banda a
      11 modelos.
- id: shared-rule.animal
  name: Animal
  name_i18n:
    es: Animal
  effect: >-
    This warrior is an animal and never gains Experience.
  effect_i18n:
    es: >-
      Este guerrero es un animal y nunca gana Experiencia.
- id: shared-rule.animosity
  name: Animosity
  name_i18n:
    es: Rencor
  effect: >-
    Subject to the warband's Animosity rule. At the start of the Orc player's turn, roll a D6 for
    this Orc Henchman if it is not in hand-to-hand combat; on a 1, roll on the Animosity result
    table.
  effect_i18n:
    es: >-
      Sujeto a la regla especial Rencor de la banda. Al inicio del turno del jugador orco, tira 1D6
      por este secuaz orco si no está en combate cuerpo a cuerpo; con un 1, tira en la tabla de
      resultados de Rencor.
- id: shared-rule.dwarf-armour
  name: Armour
  name_i18n:
    es: Armadura
  effect: >-
    Dwarfs never suffer movement penalties for wearing armour.
  effect_i18n:
    es: >-
      Los enanos nunca sufren penalizaciones de movimiento por llevar armadura.
- id: shared-rule.barbarian-courage
  name: Barbarian Courage
  name_i18n:
    es: Coraje Bárbaro
  effect: >-
    As Norse warriors strive to die bravely in battle, they learn to fear nothing and embrace
    hardship. This hero never needs to take all alone tests and may re-roll failed fear tests.
  effect_i18n:
    es: >-
      Como los guerreros Norse se esfuerzan por morir con valentía en la batalla, aprenden a no
      temer nada y a abrazar la adversidad. Este héroe jamás necesita hacer chequeos de Estar Solo y
      puede repetir los chequeos de miedo fallados.
- id: shared-rule.battle-tongue
  name: Battle Tongue
  name_i18n:
    es: Lengua de Batalla
  effect: >-
    Only a hero with the leader skill may gain this skill. It allows models within 12" of him to use
    his leadership, rather than the normal 6".
  effect_i18n:
    es: >-
      Solo un héroe con la habilidad de líder puede ganar esta habilidad. Permite a los modelos a
      12" de él usar su liderazgo, en lugar de los 6" normales.
- id: shared-rule.berserk-charge
  name: Berserk Charge
  name_i18n:
    es: Carga Berserker
  effect: >-
    The Norse are very skilled with weapons that many other races see as primitive and savage. When
    this hero is armed with an axe or double handed weapon, he may re-roll all failed to hit rolls
    when he charges.
  effect_i18n:
    es: >-
      Los Norse son muy diestros con armas que muchas otras razas consideran primitivas y salvajes.
      Cuando este héroe está armado con un hacha o un arma a dos manos, puede repetir todas las
      tiradas de impactar falladas cuando carga.
- id: shared-rule.berserkers
  name: Berserkers
  name_i18n:
    es: Berserkers
  effect: >-
    Berserkers are subject to frenzy as detailed in the Psychology section of the Mordheim rulebook.
  effect_i18n:
    es: >-
      Los Berserkers están sujetos al frenesí tal como se detalla en la sección de Psicología del
      reglamento de Mordheim.
- id: shared-rule.bestial
  name: Bestial
  name_i18n:
    es: Bestia (Bestial)
  effect: >-
    Wulfen are ravenous beasts and therefore immune to psychology. Also despite being greatly
    revered by their barbarian kinsmen, Wulfen are too feral and uncontrolled to become the leader
    of the warband.
  effect_i18n:
    es: >-
      Los Wulfen son bestias voraces y por tanto inmunes a la psicología. Además, a pesar de ser muy
      venerados por sus parientes bárbaros, los Wulfen son demasiado feroces e indomables para
      convertirse en el líder de la banda.
- id: shared-rule.burn-the-witch
  name: Burn the Witch!
  name_i18n:
    es: ¡Quemad a la Bruja!
  effect: >-
    This warrior is subject to Hatred against all models capable of casting spells.
  effect_i18n:
    es: >-
      Este guerrero está sujeto a Odio contra todos los modelos capaces de lanzar hechizos.
  runtime:
    grant: profile
    scope: 'YES'
    implemented: 'YES'
    effects:
    - id: mechanic.burn-the-witch
      scope: 'YES'
      binding:
        kind: mechanic
        id: mechanic.burn-the-witch
- id: shared-rule.cause-fear-undead
  name: Cause Fear
  name_i18n:
    es: Causan Miedo
  effect: >-
    All warriors with the Undead special rule cause Fear.
  effect_i18n:
    es: >-
      Todos los guerreros con la regla especial No muerto causan Miedo.
- id: shared-rule.censer-bearer
  name: Censer Bearer
  name_i18n:
    es: Portador de Incensario
  effect: >-
    Requires Black Hunger. The Hero gains Frenzy and may use only a Censer as a close-combat weapon.
  effect_i18n:
    es: >-
      Requiere Hambre negra. El Héroe gana Frenesí y solo puede usar un Incensario como arma de
      combate cuerpo a cuerpo.
- id: shared-rule.charge
  name: Charge
  name_i18n:
    es: Carga
  effect: >-
    A Dire Wolf has 2 Attacks instead of 1 during a turn in which it charges.
  effect_i18n:
    es: >-
      Un Lobo dire tiene 2 Ataques en lugar de 1 durante un turno en el que cargue.
- id: shared-rule.crushing-blow
  name: Crushing Blow
  name_i18n:
    es: Golpe Aplastante
  effect: >-
    Norse warriors train in almost all of their spare time. They are expert fighters and learn to
    put all of their strength into very powerful attacks. No enemy may parry an attack made by this
    hero because it strikes with such great power that it pushes right through a buckler or sword.
  effect_i18n:
    es: >-
      Los guerreros Norse se entrenan en casi todo su tiempo libre. Son luchadores expertos y
      aprenden a meter toda su fuerza en ataques muy poderosos. Ningún enemigo puede emparañar un
      ataque de este héroe, pues golpea con una fuerza tan grande que atraviesa de lleno un broquel
      o una espada.
- id: shared-rule.da-cunnin-plan
  name: Da Cunnin' Plan
  name_i18n:
    es: El Plan Maestro
  effect: >-
    Only the Boss may have this skill. The warband may re-roll any failed Rout tests as long as the
    Boss is not out of action.
  effect_i18n:
    es: >-
      Solo el Jefe puede tener esta habilidad. La banda puede repetir cualquier chequeo de huida
      fallido mientras el Jefe no esté Fuera de combate.
- id: shared-rule.deathwish
  name: Deathwish
  name_i18n:
    es: Deseo de Muerte
  effect: >-
    Troll Slayers seek an honourable death in combat. They are completely immune to all psychology
    and never need to test if fighting alone.
  effect_i18n:
    es: >-
      Los Matatrolles buscan una muerte honorable en combate. Son completamente inmunes a toda la
      psicología y nunca necesitan chequear si luchan solos.
- id: shared-rule.dumb-monster
  name: Dumb Monster
  name_i18n:
    es: Monstruo Tonto
  effect: >-
    A Troll is far too stupid to ever learn any new skills. Trolls do not gain experience.
  effect_i18n:
    es: >-
      Un troll es demasiado estúpido para aprender nuevas habilidades. Los trolls no ganan
      experiencia.
- id: shared-rule.eadbasher
  name: '''Eadbasher'
  name_i18n:
    es: Machacacráneos
  effect: >-
    Orcs have massive physical strength and some of them even learn to aim their blows at the heads
    of their opponents, with obvious results. Any knocked down results which the Orc causes in
    hand-to-hand count as stunned results instead.
  effect_i18n:
    es: >-
      Los orcos tienen una fuerza física masiva y algunos incluso aprenden a dirigir sus golpes
      contra las cabezas de sus oponentes, con resultados obvios. Cualquier resultado de derribado
      que el orco cause en el cuerpo a cuerpo cuenta como resultado de aturdido.
- id: shared-rule.elven-agility
  name: Elven Agility
  name_i18n:
    es: Agilidad Élfica
  effect: >-
    The Hero has a 6+ special save against close-combat and missile attacks. If the Hero also has
    Dodge or Step Aside, the relevant save improves to 4+ and Elven Agility no longer applies to
    that attack type.
  effect_i18n:
    es: >-
      El Héroe tiene una tirada de salvación especial de 6+ contra ataques de combate cuerpo a
      cuerpo y de misil. Si el Héroe también tiene Esquivar o Echarse a un lado, la salvación pertinente
      mejora a 4+ y la Agilidad élfica deja de aplicarse a ese tipo de ataque.
- id: shared-rule.ere-we-go
  name: '''Ere We Go!'
  name_i18n:
    es: ¡Allá Vamos! ('Ere We Go!)
  effect: >-
    Orcs often charge even the most fearsome opponents. The model may ignore fear tests when
    charging.
  effect_i18n:
    es: >-
      Los orcos suelen cargar contra los oponentes más temibles. El modelo puede ignorar los
      chequeos de miedo cuando carga.
- id: shared-rule.evade
  name: Evade
  name_i18n:
    es: Evadir
  effect: >-
    When an enemy charges a Pursuer, the Pursuer may attempt to evade. On a successful Initiative
    test the charge counts as failed and the normal failed-charge rules apply.
  effect_i18n:
    es: >-
      Cuando un enemigo carga contra un Perseguidor, este puede intentar evadir. Con un chequeo de
      Iniciativa con éxito, la carga cuenta como fallida y se aplican las reglas normales de carga
      fallida.
- id: shared-rule.extra-tough
  name: Extra Tough
  name_i18n:
    es: Extra Resistente
  effect: >-
    This Dwarf is notorious for walking away from wounds that would kill a lesser being. When
    rolling on the Heroes Serious Injury chart for this Hero after a game in which he has been taken
    out of action, the dice may be re-rolled once. The result of this second dice roll must be
    accepted, even if it is a worse result.
  effect_i18n:
    es: >-
      Este enano es famoso por sobrevivir a heridas que matarían a un ser inferior. Al tirar en la
      tabla de Heridas Graves de Héroes para este héroe tras una partida en la que haya sido
      retirado del combate, el dado puede repetirse una vez. El resultado de esta segunda tirada
      debe aceptarse, incluso si es peor.
- id: shared-rule.fear
  name: Fear
  name_i18n:
    es: Miedo
  effect: >-
    This warrior causes Fear.
  effect_i18n:
    es: >-
      Este guerrero causa Miedo.
- id: shared-rule.free-the-slaves
  name: Free the Slaves!
  name_i18n:
    es: ¡Libertad a los Esclavos!
  effect: >-
    Pit Fighters hate slavers and will never sell captured opponents to slavers.
  effect_i18n:
    es: >-
      Los Luchadores de Foso odian a los tratantes de esclavos y jamás venderán oponentes capturados
      a esclavistas.
  runtime:
    grant: profile
    scope: 'YES'
    implemented: 'YES'
    effects:
    - id: mechanic.hatred-slavers
      scope: 'YES'
      binding:
        kind: mechanic
        id: mechanic.hatred-slavers
- id: shared-rule.goblin-limit
  name: Goblin Limit
  name_i18n:
    es: Límite de Goblins
  effect: >-
    The warband may never include more than two Goblin Warriors for each Orc in the warband,
    including Orc Heroes.
  effect_i18n:
    es: >-
      La banda nunca puede incluir más de dos Guerreros goblin por cada orco de la banda, incluidos
      los Héroes orcos.
- id: shared-rule.grudgebearers
  name: Grudgebearers
  name_i18n:
    es: Portadores del Agravio
  effect: >-
    A Dwarf warband may never include any kind of Elven Hired Sword or Dramatis Personae.
  effect_i18n:
    es: >-
      Una banda enana nunca puede incluir ningún tipo de Espada a sueldo o Dramatis Personae élfico.
- id: shared-rule.hard-as-steel
  name: True Grit
  name_i18n:
    es: Entereza
  effect: >-
    This Hero is exceptionally hardy. When rolling on the Injury table for this Hero, a roll of 1-3
    is treated as knocked down, 4-5 as stunned, and 6 as out of action.
  effect_i18n:
    es: >-
      Este Héroe es excepcionalmente duro. Al tirar en la tabla de Heridas para este Héroe, un
      resultado de 1-3 se trata como Derribado, 4-5 como Aturdido y 6 como Fuera de combate.
- id: shared-rule.dwarf-hard-head
  name: Hard Head
  name_i18n:
    es: Cabeza Dura
  effect: >-
    Dwarfs ignore the special rules for maces, clubs and similar weapons.
  effect_i18n:
    es: >-
      Los enanos ignoran las reglas especiales de mazas, garrotes y armas similares.
- id: shared-rule.hard-to-kill
  name: Hard to Kill
  name_i18n:
    es: Difíciles de Matar
  effect: >-
    This warrior is tough and resilient and is taken Out of Action only on a roll of 6 on the Injury
    chart; treat a roll of 1-2 as Knocked Down and 3-5 as Stunned.
  effect_i18n:
    es: >-
      Este guerrero es duro y resistente y solo queda Fuera de combate con un resultado de 6 en la
      tabla de Heridas; trata un resultado de 1-2 como Derribado y 3-5 como Aturdido.
- id: shared-rule.hate-orcs-and-goblins
  name: Hate Orcs and Goblins
  name_i18n:
    es: Odio a Orcos y Goblins
  effect: >-
    All Dwarfs hate Orcs and Goblins.
  effect_i18n:
    es: >-
      Todos los enanos odian a los orcos y los goblins.
- id: shared-rule.immune-to-poison
  name: Immune to Poison
  name_i18n:
    es: Inmune al Veneno
  effect: This warrior is immune to Poison.
  effect_i18n:
    es: Este guerrero es inmune al Veneno.
- id: shared-rule.immune-to-poison-undead
  name: Immune to Poison
  name_i18n:
    es: Inmune al Veneno
  effect: >-
    Warriors with the Undead special rule are unaffected by poison.
  effect_i18n:
    es: >-
      Los guerreros con la regla especial Muerto viviente no se ven afectados por el veneno.
- id: shared-rule.immune-to-psychology
  name: Immune to Psychology
  name_i18n:
    es: Inmune a la Psicología
  effect: >-
    This warrior is immune to Psychology and never leaves combat because of Psychology.
  effect_i18n:
    es: >-
      Este guerrero es inmune a la Psicología y nunca abandona el combate a causa de la Psicología.
- id: shared-rule.immune-to-psychology-undead
  name: Immune to Psychology
  name_i18n:
    es: Inmune a la Psicología
  effect: >-
    All warriors with the Undead special rule are immune to Psychology and never leave combat
    because of Psychology.
  effect_i18n:
    es: >-
      Todos los guerreros con la regla especial No muerto son inmunes a la Psicología y nunca
      abandonan el combate a causa de la Psicología.
- id: shared-rule.incomparable-miners
  name: Incomparable Miners
  name_i18n:
    es: Mineros Incomparables
  effect: >-
    When checking for wyrdstone at the end of a game, add +1 to the number of pieces found by the
    Dwarf warband.
  effect_i18n:
    es: >-
      Al buscar wyrdstone al final de una partida, añade +1 al número de fragmentos encontrados por
      la banda enana.
- id: shared-rule.large-target
  name: Large Target
  name_i18n:
    es: Objetivo Grande
  effect: This warrior is a Large Target, as defined in the shooting rules.
  effect_i18n:
    es: Este guerrero es un Objetivo Grande, tal como se define en las reglas de disparo.
- id: shared-rule.leader
  name: Leader
  name_i18n:
    es: Líder
  effect: >-
    Any model in the warband within 6" of this warrior may use this warrior's Leadership instead of
    their own when taking Leadership tests.
  effect_i18n:
    es: >-
      Cualquier miniatura de la banda a 6" de este guerrero puede usar su Liderazgo en lugar del suyo
      propio al realizar chequeos de Liderazgo.
- id: shared-rule.living
  name: Living
  name_i18n:
    es: Viviente
  effect: >-
    Tomb Scorpions are living creatures and are affected by Psychology normally, but they do not
    need water.
  effect_i18n:
    es: >-
      Los Escorpiones de tumba son criaturas vivientes y se ven afectados por la Psicología con
      normalidad, pero no necesitan agua.
- id: shared-rule.marienburg-enormous-wealth
  name: Marienburg — Enormous Wealth
  name_i18n:
    es: Marienburgo — Enorme Riqueza
  effect: >-
    A Marienburg warband starts a campaign with 600 gc instead of 500 gc. In a one-off game it
    receives 20% more gold crowns for recruitment.
  effect_i18n:
    es: >-
      Una banda de Mariemburgo comienza la campaña con 600 coronas en lugar de 500. En una partida
      suelta recibe un 20% más de coronas de oro para el reclutamiento.
- id: shared-rule.marienburg-natural-traders
  name: Marienburg — Natural Traders
  name_i18n:
    es: Marienburgo — Comerciantes Natos
  effect: >-
    A Marienburg warband receives +1 when attempting to find Rare items.
  effect_i18n:
    es: >-
      Una banda de Mariemburgo recibe +1 al intentar encontrar objetos Raros.
- id: shared-rule.may-not-run
  name: May Not Run
  name_i18n:
    es: No Pueden Correr
  effect: This warrior may not run, but may charge normally.
  effect_i18n:
    es: Este guerrero no puede correr, pero puede cargar con normalidad.
- id: shared-rule.may-not-run-undead
  name: May Not Run
  name_i18n:
    es: No Pueden Correr
  effect: >-
    Warriors with the Undead special rule may not run, but may charge normally.
  effect_i18n:
    es: >-
      Los guerreros con la regla especial No muerto no pueden correr, pero pueden cargar con
      normalidad.
- id: shared-rule.middenheim-physical-prowess
  name: Middenheim — Physical Prowess
  name_i18n:
    es: Middenheim — Proeza Física
  effect: >-
    The Mercenary Captain and all Champions in a Middenheim warband start with Strength 4 instead of
    Strength 3.
  effect_i18n:
    es: >-
      El Capitán mercenario y todos los Campeones de una banda de Middenheim comienzan con Fuerza 4
      en lugar de Fuerza 3.
- id: shared-rule.minderz
  name: Minderz
  name_i18n:
    es: Cuidadores (Minderz)
  effect: >-
    Each Cave Squig must always remain within 6" of a Goblin Warrior, who keeps the creature in
    line. If a Cave Squig finds itself without a Goblin within 6" at the start of its Movement
    phase, it will go wild. From that point on, move the Squig 2D6" in a random direction during
    each of its Movement phases. If its movement takes it into contact with another model (friend or
    foe), it will engage the model in hand-to-hand combat as normal. The Cave Squig is out of the
    Orc & Goblin player's control until the end of the game.
  effect_i18n:
    es: >-
      Cada Squig de Cueva debe permanecer siempre a 6" de un guerrero goblin, quien mantiene a la
      criatura a raya. Si un Squig de Cueva se encuentra sin ningún goblin a 6" al inicio de su fase
      de Movimiento, se volverá salvaje. A partir de ese momento, mueve el Squig 2D6" en una
      dirección aleatoria durante cada una de sus fases de Movimiento. Si su movimiento lo pone en
      contacto con otro modelo (amigo o enemigo), entablará combate cuerpo a cuerpo con él con
      normalidad. El Squig de Cueva queda fuera del control del jugador de Orcos y Goblins hasta el
      final de la partida.
- id: shared-rule.movement
  name: Movement
  name_i18n:
    es: Movimiento
  effect: >-
    Cave Squigs do not have a set Movement characteristic but move with an ungainly bouncing stride.
    To represent this, when moving Squigs, roll 2D6 for the distance they move. Squigs never run and
    never declare charges. Instead, they are allowed to contact enemy models with their normal 2D6"
    movement. If this happens, they count as charging for the following round of close combat, just
    as if they had declared a charge.
  effect_i18n:
    es: >-
      Los Squigs de Cueva no tienen una característica de Movimiento fija, sino que se mueven con un
      zancudo brinco desgarbado. Para representarlo, cuando muevas Squigs, tira 2D6 para la
      distancia que se desplazan. Los Squigs nunca corren ni declaran cargas. En cambio, se les
      permite contactar con modelos enemigos con su movimiento normal de 2D6". Si esto sucede,
      cuentan como cargando en el siguiente asalto de combate cuerpo a cuerpo, igual que si hubieran
      declarado una carga.
- id: shared-rule.natural-weapons
  name: Natural Weapons
  name_i18n:
    es: Armas Naturales
  effect: >-
    The Wulfen fights with teeth and claws, may never use weapons or armour, and suffers no penalty
    for fighting unarmed.
  effect_i18n:
    es: >-
      El Wulfen lucha con dientes y garras, jamás puede usar armas ni armadura y no sufre
      penalización por luchar sin armas.
- id: shared-rule.never-gain-experience
  name: Never Gain Experience
  name_i18n:
    es: Nunca Ganan Experiencia
  effect: >-
    This warrior never gains Experience.
  effect_i18n:
    es: >-
      Este guerrero nunca gana Experiencia.
- id: shared-rule.no-pain
  name: No Pain
  name_i18n:
    es: Sin Dolor
  effect: This warrior treats any Stunned result on the Injury chart as Knocked Down.
  effect_i18n:
    es: Este guerrero trata cualquier resultado de Aturdido en la tabla de Heridas como Derribado.
- id: shared-rule.no-pain-undead
  name: No Pain
  name_i18n:
    es: Sin Dolor
  effect: >-
    All warriors with the Undead special rule treat a Stunned result as Knocked Down.
  effect_i18n:
    es: >-
      Todos los guerreros con la regla especial Muerto viviente tratan un resultado de Aturdido como
      Derribado.
- id: shared-rule.pack-leader
  name: Pack Leader
  name_i18n:
    es: Líder de la Manada
  effect: >-
    Wolves may only be included in the warband if it includes a Wulfen. If the Wulfen is dead or
    unavailable because of injury, the Wolves cannot be used until a Wulfen is available again.
  effect_i18n:
    es: >-
      Los lobos solo pueden incluirse en la banda si esta incluye un Wulfen. Si el Wulfen está
      muerto o no disponible por herida, los Lobos no pueden usarse hasta que haya un Wulfen
      disponible de nuevo.
- id: shared-rule.prayers
  name: Prayers
  name_i18n:
    es: Plegarias
  effect: >-
    A Priest of Taal may use the Prayers of Taal.
  effect_i18n:
    es: >-
      Un Sacerdote de Taal puede usar las Oraciones de Taal.
- id: shared-rule.regeneration
  name: Regeneration
  name_i18n:
    es: Regeneración
  effect: >-
    Trolls have a unique physiology that allows them to regenerate wounds. Whenever an enemy
    successfully inflicts a wound on a Troll roll a D6, on a result of 4 or more the wound is
    ignored and the Troll is unhurt. Trolls may not regenerate wounds caused by fire or fire-based
    magic. Trolls never roll for Injury after a battle, unless they were taken Out of Action by a
    Flaming weapon or spell. Then they roll after the battle as a normal Henchman.
  effect_i18n:
    es: >-
      Los trolls tienen una fisiología única que les permite regenerar heridas. Siempre que un
      enemigo inflija con éxito una herida a un troll, tira 1D6: con un resultado de 4 o más la
      herida se ignora y el troll queda ileso. Los trolls no pueden regenerar heridas causadas por
      fuego o magia de fuego. Los trolls nunca tiran por heridas tras una batalla, salvo que hayan
      sido puestos Fuera de combate por un arma o hechizo ígneo; entonces tiran tras la batalla como
      un secuaz normal.
- id: shared-rule.resource-hunter
  name: Resource Hunter
  name_i18n:
    es: Cazador de Recursos
  effect: >-
    This warrior is especially good at locating valuable resources. When rolling on the Exploration
    chart at the end of a game, the Hero may modify one dice roll by +1/-1.
  effect_i18n:
    es: >-
      Este guerrero es especialmente bueno localizando recursos valiosos. Al tirar en la tabla de
      Exploración al final de una partida, el Héroe puede modificar una tirada de dado en +1/-1.
- id: shared-rule.seafaring
  name: Seafaring
  name_i18n:
    es: Navegante
  effect: >-
    All Norse warriors receive +2 Strength when rowing a boat.
  effect_i18n:
    es: >-
      Todos los guerreros Norse reciben +2 Fuerza cuando reman un bote.
- id: shared-rule.shield-master
  name: Shield Master
  name_i18n:
    es: Maestro del Escudo
  effect: >-
    Norse warriors begin training with shields when they are still children. Some warriors become so
    skilled with these weapons they can block almost any blow against them. When this hero is armed
    with a shield he may parry with it in addition to getting a 6+ save.
  effect_i18n:
    es: >-
      Los guerreros Norse comienzan a entrenar con escudos cuando todavía son niños. Algunos
      guerreros se vuelven tan diestros con estas armas que pueden bloquear casi cualquier golpe
      contra ellos. Cuando este héroe está armado con un escudo, puede emparañar con él además de
      obtener una salvación de 6+.
- id: shared-rule.skills
  name: Skills
  name_i18n:
    es: Habilidades
  effect: >-
    If the Ogre Pit Fighter becomes a Hero through The Lad's Got Talent, it may choose Combat,
    Strength and Pit Fighter Special Skills.
  effect_i18n:
    es: >-
      Si el Luchador de Foso Ogro se convierte en Héroe mediante 'El mozo tiene talento', puede
      elegir Habilidades de Combate, Fuerza y Habilidades Especiales de Luchador de Foso.
- id: shared-rule.strictures
  name: Strictures
  name_i18n:
    es: Preceptos
  effect: >-
    Priests of Taal may never wear heavy armour.
  effect_i18n:
    es: >-
      Los Sacerdotes de Taal jamás pueden llevar armadura pesada.
- id: shared-rule.stupidity
  name: Stupidity
  name_i18n:
    es: Estupidez
  effect: >-
    The Rat Ogre is subject to Stupidity unless a Skaven Hero is within 6".
  effect_i18n:
    es: >-
      El Ogro rata está sujeto a Estupidez a menos que haya un Héroe skaven a 6" de él.
  runtime:
    grant: profile
    scope: 'YES'
    implemented: 'YES'
    effects:
    - id: mechanic.stupidity
      scope: 'YES'
      binding:
        kind: mechanic
        id: mechanic.stupidity
    # The printed exemption: the supplied nearby qualifying hero is an admitted
    # current fact of this duelist, which psychology.resolve_stupidity honours.
    - id: condition.stupidity-exempt
      scope: 'YES'
      binding:
        kind: mechanic
        id: condition.stupidity-exempt
    - id: shared-rule.stupidity.proximity-producer
      scope: 'NO'
      binding: null
      reason: out-of-scope.group
- id: shared-rule.troll-stupidity
  name: Stupidity
  name_i18n:
    es: Estupidez
  effect: >-
    A Troll is subject to the rules for stupidity.
  effect_i18n:
    es: >-
      Un troll está sujeto a las reglas de estupidez.
- id: shared-rule.thick-skull
  name: Thick Skull
  name_i18n:
    es: Cráneo Grueso
  effect: >-
    This warrior has a 3+ save on a D6 to avoid being Stunned. If the save is successful, treat the
    Stunned result as Knocked Down instead. If the warrior is also wearing a helmet, this save is 2+
    instead of 3+; this replaces the helmet's normal special rule.
  effect_i18n:
    es: >-
      Este guerrero tiene una salvación de 3+ en 1D6 para evitar quedar Aturdido. Si supera la
      salvación, trata el resultado de Aturdido como Derribado. Si además lleva casco, esta salvación
      es de 2+ en lugar de 3+; esto sustituye a la regla especial normal del casco.
- id: shared-rule.undead
  name: Undead
  name_i18n:
    es: No Muerto
  effect: >-
    This warrior is undead and follows all the rules for the Undead.
  effect_i18n:
    es: >-
      Este guerrero es un muerto viviente y sigue todas las reglas de los Muertos Vivientes.
- id: shared-rule.vomit-attack
  name: Vomit Attack
  name_i18n:
    es: Ataque de Vómito
  effect: >-
    Instead of his normal attacks, a Troll can regurgitate its highly corrosive digestive juices on
    an unfortunate hand-to-hand combat opponent. This is a single attack that automatically hits
    with a Strength of 5 and ignores armour saves.
  effect_i18n:
    es: >-
      En lugar de sus ataques normales, un troll puede regurgitar sus jugos digestivos, altamente
      corrosivos, sobre un desdichado oponente en combate cuerpo a cuerpo. Es un ataque único que
      impacta automáticamente con una Fuerza de 5 e ignora las tiradas de salvación por armadura.
- id: shared-rule.waaagh
  name: Waaagh!
  name_i18n:
    es: ¡WAAAGH!
  effect: >-
    Orcs are aggressive creatures and some are experts at bulldozing charges. The warrior may add
    +D3" to his charge range.
  effect_i18n:
    es: >-
      Los orcos son criaturas agresivas y algunos son expertos en cargas arrolladoras. El guerrero
      puede sumar +D3" a su alcance de carga.
- id: shared-rule.weedy
  name: Weedy
  name_i18n:
    es: Debiluchos
  effect: >-
    Snotlings are not the most robust of creatures. If wounded they will be knocked down on a 1,
    stunned on a 2-3 and go out of action on a 4-6.
  effect_i18n:
    es: >-
      Los Snotlings no son precisamente criaturas robustas. Si resultan heridos, quedarán derribados
      con un 1, aturdidos con un 2-3 y Fuera de combate con un 4-6.
- id: shared-rule.wizard
  name: Wizard
  name_i18n:
    es: Mago
  effect: >-
    The Necromancer is a Wizard and starts knowing one of the Liche's two Necromantic spells. The
    spell list itself is not modelled here.
  effect_i18n:
    es: >-
      El Nigromante es un Mago y comienza conociendo uno de los dos hechizos Nigrománticos del
      Liche. La propia lista de hechizos no está modelada aquí.
- id: shared-rule.black-hunger
  name: Black Hunger
  name_i18n:
    es: Hambre Negra
  effect: >-
    At the start of his turn, this Hero may invoke Black Hunger. For that turn he gains +1 Attack
    and +D3 inches to his total Movement, then suffers D3 Strength 3 hits with no armour save at the
    end of the turn.
  effect_i18n:
    es: >-
      Al comienzo de su turno, este Héroe puede invocar el Hambre Negra. Durante ese turno gana +1
      Ataque y +D3 pulgadas a su Movimiento total, y al final del turno sufre D3 impactos de Fuerza
      3 sin tirada de salvación por armadura.
- id: shared-rule.fey-quickness
  name: Fey Quickness
  name_i18n:
    es: Celeridad Feérica
  effect: >-
    Few can ever hope to match an Elf's inhuman quickness and agility. An Elf with Fey Quickness can
    avoid melee or missile attacks on a roll of 6. If the Elf also has Step Aside or Dodge, this
    will increase to a 4+ in the relevant area. For example, an Elf with Fey Quickness and Step
    Aside avoids melee attacks on a 4+ and missile attacks on a 6.
  effect_i18n:
    es: >-
      Pocos pueden esperar igualar la inhumana rapidez y agilidad de un Elfo. Un Elfo con Celeridad
      Feérica puede evitar ataques cuerpo a cuerpo o de proyectiles con una tirada de 6. Si el Elfo
      también tiene Echarse a un lado o Esquivar, esto aumenta a 4+ en el área correspondiente. Por
      ejemplo, un Elfo con Celeridad Feérica y Echarse a un lado evita ataques cuerpo a cuerpo con
      un 4+ y ataques de proyectiles con un 6.
- id: shared-rule.infiltration
  name: Infiltration
  name_i18n:
    es: Infiltración
  effect: >-
    A warrior with this skill is always placed on the battlefield after the opposing warband and can
    be placed anywhere on the table as long as it is out of sight of the opposing warband and more
    than 12" away from any enemy model. If both players have models which infiltrate, roll a D6 for
    each, and the lowest roll sets up first.
  effect_i18n:
    es: >-
      Un guerrero con esta habilidad siempre se sitúa en el campo de batalla después de la banda
      rival y puede colocarse en cualquier punto de la mesa mientras esté fuera de la línea de
      visión de la banda rival y a más de 12" de cualquier miniatura enemiga. Si ambos jugadores
      tienen miniaturas que se infiltran, tira 1D6 por cada una, y la tirada más baja se despliega
      primero.
- id: shared-rule.master-of-blades
  name: Master of Blades
  name_i18n:
    es: Maestro de las Hojas
  effect: >-
    This Dwarf's martial skills surpass those of a normal warrior; he has fought unscathed against
    hordes of Orcs and Goblins. When using a weapon that has a Parry special rule, this hero parries
    successfully if he beats or matches his opponent's highest 'to hit' roll, not just if he beats
    the roll. In addition, if this warrior is using two weapons that have the Parry special rule, he
    is allowed to parry two attacks (if his two dice match or beat the two highest Attack dice
    against him) instead of the normal maximum of one. Note that if this Dwarf has two Dwarf axes
    (as detailed above) he can reroll any failed parries.
  effect_i18n:
    es: >-
      Las habilidades marciales de este Enano superan a las de un guerrero normal; ha luchado sin un
      rasguño contra hordas de Orcos y Goblins. Al usar un arma que tenga la regla especial Parada,
      este héroe para con éxito si iguala o supera la tirada más alta «para impactar» de su
      oponente, no solo si la supera. Además, si este guerrero usa dos armas que tienen la regla
      especial Parada, puede parar dos ataques (si sus dos dados igualan o superan los dos dados de
      Ataque más altos contra él) en lugar del máximo normal de uno. Ten en cuenta que si este Enano
      lleva dos hachas Enanas (como se detalla arriba) puede repetir cualquier parada fallida.
- id: shared-rule.excellent-sight
  name: Excellent Sight
  name_i18n:
    es: Vista Excepcional
  effect: >-
    Elves have eyesight unmatched by mere humans. The Elves of the warband can spot Hidden enemies
    from twice as far away as other warriors (i.e. twice their Initiative in inches).
  effect_i18n:
    es: >-
      Los Elfos tienen una vista sin igual entre los humanos. Los Elfos de la banda pueden detectar
      enemigos Ocultos al doble de distancia que otros guerreros (es decir, el doble de su
      Iniciativa en pulgadas).
- id: shared-rule.foul-odour
  name: Foul Odour
  name_i18n:
    es: Hedor
  effect: >-
    This warrior is a prodigious drinker and none too hygienic! He rises head and shoulders above
    the rest. After a lifetime of drinking, liquor has little effect on him any more... not that
    this stops him from consuming massive quantities! His unwashed clothes and sweat reek of alcohol
    and all living enemies (not Undead or Possessed) are at -1 to hit him in close combat. In
    addition, the warrior cannot carry any open flames (torch, lantern, etc.) and fire attacks made
    against him are resolved at +1 Strength as his beer-soaked clothing burns readily.
  effect_i18n:
    es: >-
      ¡Este guerrero es un bebedor prodigioso y nada higiénico! Sobresale por encima del resto. Tras
      toda una vida de bebida, el licor apenas le afecta ya... ¡lo que no le impide consumir
      cantidades masivas! Su ropa sin lavar y su sudor huelen a alcohol y todos los enemigos vivos
      (no Muertos Vivientes ni Poseídos) sufren -1 para impactarlo en combate cuerpo a cuerpo.
      Además, el guerrero no puede portar llamas abiertas (antorcha, farol, etc.) y los ataques de
      fuego contra él se resuelven con +1 de Fuerza, ya que sus ropas empapadas de cerveza arden con
      facilidad.
- id: shared-rule.jungle-born
  name: Jungle Born
  name_i18n:
    es: Nacidos de la Selva
  effect: >-
    Skinks move through jungle terrain without penalty.
  effect_i18n:
    es: >-
      Los Skinks se mueven por terreno de selva sin penalización.
- id: shared-rule.kindred-hatred
  name: Kindred Hatred
  name_i18n:
    es: Odio Ancestral
  effect: >-
    Dark Elves Hate all High Elf warriors, including High Elf Hired Swords.
  effect_i18n:
    es: >-
      Los Elfos Oscuros Odian a todos los guerreros Altos Elfos, incluidas las Espadas de Alquiler
      Altos Elfos.
- id: shared-rule.knights-feats
  name: Knights Feats
  name_i18n:
    es: Hazañas de Caballería
  effect: >-
    The Hero may choose from the Knight's Feats skill list in addition to his ordinary skills. 1 -
    Combat charge: the character gains +1 attack and +1 WS when he charges. 2 - Lancer: the
    character can use this skill only on horseback; may not be combined with combat charge; if the
    character's first opponent(s) suffer an unsaved wound, the character may continue his charge;
    opponents are not allowed to strike back; the charge may then be continued another 4", and any
    enemy within 2" of that charge line can be charged; if the character does charge another enemy
    he counts as charging in the next combat round. 3 - Sword master: when using a sword the
    character may parry, with reroll at equal or higher. 4 - Armour specialist: when using Heavy
    armour and shield the subject ignores the standard movement penalty and his armour save cannot
    be modified beyond 5+ due to strength; this does not work on horseback.
  effect_i18n:
    es: >-
      El Héroe puede elegir de la lista de habilidades Hazañas de Caballería además de sus
      habilidades ordinarias. 1 - Carga de combate: el personaje gana +1 ataque y +1 HA cuando
      carga. 2 - Lancero: el personaje solo puede usar esta habilidad a caballo; no puede combinarse
      con carga de combate; si el primer oponente u oponentes del personaje sufren una herida no
      salvada, el personaje puede continuar su carga; los oponentes no pueden devolver los golpes;
      la carga puede continuarse otros 4", y cualquier enemigo a 2" o menos de esa línea de carga
      puede ser cargado; si el personaje carga contra otro enemigo, cuenta como cargando en la
      siguiente ronda de combate. 3 - Maestro de la espada: al usar una espada el personaje puede
      parar, repitiendo la tirada con igual o mayor. 4 - Especialista en armaduras: al usar armadura
      pesada y escudo, el sujeto ignora la penalización estándar de movimiento y su salvación por
      armadura no puede modificarse por debajo de 5+ por fuerza; esto no funciona a caballo.
- id: shared-rule.skink-infiltration
  name: Infiltration (Skinks)
  name_i18n:
    es: Infiltración (Skinks)
  effect: >-
    The Skink is a great hunter and is an expert at sneaking up on his prey unnoticed. The Hero may
    set up anywhere on the table but no closer than 12" to an enemy and he must start the game in
    hiding.
  effect_i18n:
    es: >-
      El Skink es un gran cazador y un experto en acercarse a su presa sin ser notado. El Héroe
      puede desplegarse en cualquier punto de la mesa, pero no a menos de 12" de un enemigo, y debe
      comenzar la partida oculto.
- id: shared-rule.skaven-rulebook-inheritance
  name: Rulebook Inheritance
  name_i18n:
    es: Herencia del Libro de Reglas
  effect: >-
    This warband may use the Skaven weapons as detailed in the rulebook. Skaven Heroes may use any
    of the Skaven Special Skills in the rulebook except for the Art of Silent Death. The Skaven
    weapons travel in the declared Skaven Hero and Henchmen equipment lists; the admitted special
    skills are published as the four member rules Black Hunger, Tail Fighting, Wall Runner and
    Infiltration, each naming the Heroes it reaches, while the Art of Silent Death stays refused.
  effect_i18n:
    es: >-
      Esta banda puede usar las armas Skaven tal y como se detallan en el libro de reglas. Los
      Héroes Skaven pueden usar cualquiera de las Habilidades Especiales Skaven del libro de reglas,
      excepto el Arte de la Muerte Silenciosa. Las armas Skaven viajan en las listas de equipo
      declaradas de Héroes y Secuaces Skaven; las habilidades especiales admitidas se publican como
      las cuatro reglas miembro Hambre Negra, Combate con la Cola, Corredor de Muros e Infiltración,
      cada una nombrando a los Héroes a los que alcanza, mientras que el Arte de la Muerte
      Silenciosa queda rechazado.
- id: shared-rule.swamp-striders
  name: Swamp Striders
  name_i18n:
    es: Zancudos del Pantano
  effect: >-
    This warrior can move through any swamp and marshland terrain without penalty.
  effect_i18n:
    es: >-
      Este guerrero puede moverse por cualquier terreno de ciénaga y pantano sin penalización.
- id: shared-rule.dragon-monk-art-of-silent-death
  name: Art of Silent Death (Dragon Monks)
  name_i18n:
    es: Arte de la Muerte Silenciosa (Monjes Dragón)
  effect: >-
    Dragon Monks have become masters of the Cathayan art of open-hand fighting. In hand-to-hand
    combat, if fighting unarmed, they will cause a critical hit on a roll 'to wound' of 5-6 instead
    of a 6. If the Dragon Monk wields a quarterstaff, only the unarmed attacks will cause a critical
    hit on 5+.
  effect_i18n:
    es: >-
      Los Monjes Dragón se han convertido en maestros del arte cathayano de la lucha a mano abierta.
      En combate cuerpo a cuerpo, si luchan desarmados, causan un impacto crítico con una tirada
      para herir de 5-6 en lugar de un 6. Si el Monje Dragón empuña un bastón, solo los ataques
      desarmados causarán un impacto crítico con 5+.
- id: shared-rule.unarmed-fighting
  name: Unarmed Fighting
  name_i18n:
    es: Combate sin Armas
  effect: >-
    This warrior suffers no penalties for fighting unarmed and receives +1 Attack when doing so.
  effect_i18n:
    es: >-
      Este guerrero no sufre penalización por luchar sin armas y recibe +1 Ataque al hacerlo.
- id: shared-rule.death-oath
  name: Death Oath
  name_i18n:
    es: Juramento de Muerte
  effect: >-
    This warrior is completely immune to Psychology and does not need to take tests for fighting
    alone.
  effect_i18n:
    es: >-
      Este guerrero es completamente inmune a la Psicología y no necesita hacer chequeos por luchar
      solo.
- id: shared-rule.sniper
  name: Sniper
  name_i18n:
    es: Francotirador
  effect: >-
    Due to their years of training this warrior can shoot while keeping almost invisible. This
    allows the character to shoot while hiding. After the shot roll a D6; on a 5+ no one noticed
    where the arrow came from.
  effect_i18n:
    es: >-
      Debido a sus años de entrenamiento, este guerrero puede disparar manteniéndose casi invisible.
      Esto permite al personaje disparar mientras está oculto. Tras el disparo tira un D6; con un 5+
      nadie advirtió de dónde vino la flecha.
- id: shared-rule.turjuk-riding-skills
  name: Ride Horse, Ride Arabian Steed and Horse Archer
  name_i18n:
    es: Montar Caballo, Montar Corcel Árabe y Arquero a Caballo
  effect: >-
    This warrior has the following skills: Ride Horse, Ride Arabian Steed and Horse Archer.
  effect_i18n:
    es: >-
      Este guerrero tiene las habilidades de Montar Caballo, Montar Corcel Árabe y Arquero a
      Caballo.
- id: shared-rule.not-orcs
  name: Not Orcs
  name_i18n:
    es: No Son Orcos
  effect: >-
    For Rout-test casualty calculations, each Goblin Warrior or Cave Squig taken Out of Action
    counts as half a model.
  effect_i18n:
    es: >-
      Para el cálculo de bajas de los chequeos de huida, cada Guerrero Goblin o Squig de Cueva
      puesto Fuera de combate cuenta como medio modelo.
- id: shared-rule.daemonic-aura
  name: Daemonic Aura
  name_i18n:
    es: Aura Demoníaca
  effect: >-
    Due to the magical, intangible nature of Daemons they have a special Armour save of 5+. This is
    modified by the Strength of the attack as normal and is completely negated by magic weapons and
    spells. This warrior's attacks are also considered magical.
  effect_i18n:
    es: >-
      Debido a la naturaleza mágica e intangible de los Demonios, tienen una salvación de armadura
      especial de 5+. Esta se modifica por la Fuerza del ataque con normalidad y queda completamente
      anulada por armas y hechizos mágicos. Los ataques de este guerrero también se consideran
      mágicos.
- id: shared-rule.chapel-guard-knight
  name: Knight
  name_i18n:
    es: Caballero
  effect: >-
    The following rules from above apply to this warrior: Chivalry, Lord's Boon and Virtue of
    Purity.
  effect_i18n:
    es: >-
      A este guerrero le aplican las siguientes reglas anteriores: Caballerosidad, Don del Señor y
      Virtud de Pureza.
- id: shared-rule.knights-virtue
  name: Knight's Virtue
  name_i18n:
    es: Virtud del Caballero
  effect: >-
    A knight is a chivalrous warrior who is superior to ordinary warriors. He will never panic and
    break from combat and so does not have to pass a Leadership test for being all alone.
  effect_i18n:
    es: >-
      Un caballero es un guerrero caballeroso superior a los guerreros ordinarios. Nunca entra en
      pánico ni huye del combate, por lo que no tiene que superar un chequeo de Liderazgo por estar
      solo.
- id: shared-rule.forest-goblin-wizard
  name: Wizard (Forest Goblin Shaman)
  name_i18n:
    es: Mago (Chamán Goblin del Bosque)
  effect: >-
    The Shaman begins with one spell randomly chosen from the Forest Goblin Spell list.
  effect_i18n:
    es: >-
      El Chamán comienza con un hechizo elegido aleatoriamente de la lista de hechizos de los
      Goblins del Bosque.
- id: shared-rule.tunnel-rat
  name: Tunnel Rat
  name_i18n:
    es: Rata de Túnel
  effect: >-
    Any characteristic-based tests taken for scenarios set in sewers or elsewhere underground can be
    re-rolled.
  effect_i18n:
    es: >-
      Cualquier chequeo basado en características realizado en escenarios situados en cloacas u
      otros lugares subterráneos puede repetirse.
- id: shared-rule.amphibious
  name: Amphibious
  name_i18n:
    es: Anfibio
  effect: >-
    This warrior moves through aquatic terrain without movement penalties and counts as being in
    cover while in water.
  effect_i18n:
    es: >-
      Este guerrero se mueve por terreno acuático sin penalizaciones de movimiento y cuenta como en
      cobertura mientras esté en el agua.
- id: shared-rule.dodgy
  name: Dodgy
  name_i18n:
    es: Escurridizos
  effect: >-
    The little creatures are constantly ducking and diving in the most infuriating way. They get a
    6+ dodge save against shooting.
  effect_i18n:
    es: >-
      Las pequeñas criaturas se agachan y esquivan constantemente de la forma más irritante. Tienen
      una salvación de esquiva de 6+ contra disparos.
- id: shared-rule.snotling-mob
  name: Mob
  name_i18n:
    es: Horda
  effect: >-
    Snotlings are naturally gregarious creatures. They are initially bought in a mob of 5. You may
    replace mob members up to the maximum of 5. They will always move and fight as a mob. All
    members must stay within 1" and all will join in the same combat if possible.
  effect_i18n:
    es: >-
      Los Snotlings son criaturas naturalmente gregarias. Se compran inicialmente en una horda de 5.
      Puedes reponer miembros de la horda hasta un máximo de 5. Siempre se moverán y lucharán como
      una horda. Todos los miembros deben permanecer a 1" y todos se unirán al mismo combate si es
      posible.
- id: shared-rule.they-got-away
  name: They Got Away!
  name_i18n:
    es: ¡Se Han Escapado!
  effect: >-
    If the Pirate Warband itself Routs, any of these warriors who have already left the table in
    previous turns are presumed to have made a successful escape, and are never seen from again.
    Remove them from your warband roster as if they had been killed.
  effect_i18n:
    es: >-
      Si la Banda Pirata Huye, cualquiera de estos guerreros que ya haya abandonado la mesa en
      turnos anteriores se da por escapado con éxito, y nunca más se le verá. Retíralos de la lista
      de la banda como si hubieran muerto.
- id: shared-rule.dont-mind-them
  name: Don't Mind Them, They Ain't True Crew!
  name_i18n:
    es: ¡No Les Hagáis Caso, No Son Tripulación de Verdad!
  effect: >-
    The rest of the crew barely notice if any of these warriors run away or go Out of Action - they
    know they'll find them later on and give them 30 lashes if they're lucky! Any of these warriors
    who are running away or have been taken out of action do not count towards the need to take a
    Rout test for the warband.
  effect_i18n:
    es: >-
      Al resto de la tripulación apenas le importa si alguno de estos guerreros huye o queda Fuera
      de combate: ¡saben que los encontrarán más tarde y les darán 30 latigazos si tienen suerte!
      Los que estén huyendo o hayan quedado fuera de combate no cuentan a la hora de hacer el
      chequeo de Huida de la banda.
- id: shared-rule.crew-never-gain-experience
  name: Never Gain Experience (Crew)
  name_i18n:
    es: Nunca Ganan Experiencia (Tripulación)
  effect: >-
    These warriors generally aren't interested in proving their worth to the crew, they are
    interested in survival and hopefully escape! They never gain experience in games.
  effect_i18n:
    es: >-
      Estos guerreros no están interesados en demostrar su valor a la tripulación, ¡les interesa
      sobrevivir y escapar si pueden! Nunca ganan experiencia en las partidas.
- id: shared-rule.flammable
  name: Flammable
  name_i18n:
    es: Inflamable
  effect: >-
    A fire-based attack that wounds this warrior causes double the normal number of Wounds.
  effect_i18n:
    es: >-
      Un ataque de fuego que hiera a este guerrero causa el doble del número normal de Heridas.
- id: shared-rule.stake-the-vampire
  name: Stake the Vampire!
  name_i18n:
    es: ¡Empala al Vampiro!
  effect: >-
    This warrior Hates Vampires. He must always move towards a Vampire on the field (if he can see
    one) unless he can shoot (in which case he may choose).
  effect_i18n:
    es: >-
      Este guerrero Odia a los Vampiros. Siempre debe moverse hacia un Vampiro en el campo (si puede
      verlo) a menos que pueda disparar (en cuyo caso puede elegir).
- id: shared-rule.high-elf-equipment-restrictions
  name: Equipment Restrictions (High Elves)
  name_i18n:
    es: Restricciones de Equipo (Altos Elfos)
  effect: >-
    May never use blackpowder weapons. May never use drugs or poisons. May never use Dwarf-made
    equipment, including Gromril and Obsidian equipment. May not select the Mage Staff or Elven
    Runestones; those entries are Loremaster only.
  effect_i18n:
    es: >-
      Nunca puede usar armas de pólvora negra. Nunca puede usar drogas ni venenos. Nunca puede usar
      equipo de fabricación enana, incluido el equipo de Gromril y Obsidiana. No puede elegir el
      Bastón de Mago ni las Runas Élficas; esas entradas son solo para el Maestro de Saberes.
# The two armour prohibitions differ in what they forbid, and each text says exactly that. Members
# of `no-armour` bind `forbids: armour` (every armour item, shields and helmets included); members
# of `no-body-armour` bind `forbids: armour-suit` (body armour only). Most members state the
# prohibition in their profile entry rather than as a printed rule.
- id: shared-rule.no-armour
  name: No Armour
  name_i18n:
    es: Sin Armadura
  effect: >-
    This warrior may never wear any form of armour.
  effect_i18n:
    es: >-
      Este guerrero nunca puede llevar ningún tipo de armadura.
- id: shared-rule.no-body-armour
  name: No Body Armour
  name_i18n:
    es: Sin Armadura Corporal
  effect: >-
    This warrior may not wear body armour. Shields, bucklers and helmets are not affected by this
    restriction.
  effect_i18n:
    es: >-
      Este guerrero no puede llevar armadura corporal. Los escudos, las rodelas y los yelmos no se
      ven afectados por esta restricción.
- id: shared-rule.no-missile-weapons
  name: No Missile Weapons
  name_i18n:
    es: Sin Armas de Proyectil
  effect: >-
    This warrior may never use missile weapons.
  effect_i18n:
    es: >-
      Este guerrero nunca puede usar armas de proyectiles.
- id: shared-rule.no-armoured-casting
  name: No Armoured Casting
  name_i18n:
    es: Sin Lanzar Hechizos con Armadura
  effect: >-
    This warrior may not cast spells while wearing armour.
  effect_i18n:
    es: >-
      Este guerrero no puede lanzar hechizos mientras lleve armadura.
- id: shared-rule.no-weapons-or-armour
  name: No Weapons or Armour
  name_i18n:
    es: Sin Armas ni Armadura
  effect: >-
    This warrior never uses or needs weapons or armour.
  effect_i18n:
    es: >-
      Este guerrero nunca usa ni necesita armas ni armadura.
- id: shared-rule.expert-riggers
  name: Expert Riggers
  name_i18n:
    es: Jarcia Experta
  effect: >-
    Boatswains are highly trained in using their ropes, as they are the ones who maintain the
    complex network of rigging throughout the ship. They may re-roll failed Initiative tests Leaping
    over Gaps, Jumping Down, and performing a Diving Charge, as well as the normal test for Climbing
    Up or Down that a Rope allows.
  effect_i18n:
    es: >-
      Los Contramaestres están muy entrenados en el uso de sus cuerdas, ya que son quienes mantienen
      la compleja red de aparejos de todo el barco. Pueden repetir los chequeos de Iniciativa
      fallidos al Saltar huecos, Saltar hacia abajo y realizar una Carga en picado, así como el
      chequeo normal de Trepar o Descender que permite una Cuerda.
- id: shared-rule.swabbies-not-hired
  name: Not Hired
  name_i18n:
    es: No Contratadas
  effect: >-
    Swabbies are not hired, they follow the special 'recruitment' rules (see the Sartosa campaign
    rules for capturing Swabbies).
  effect_i18n:
    es: >-
      Los Fregones no se contratan: siguen las reglas especiales de «reclutamiento» (véanse las
      reglas de campaña de Sartosa para capturar Fregones).
- id: shared-rule.pit-fighter
  name: Pit Fighter
  name_i18n:
    es: Luchador de Foso
  effect: >-
    This warrior has the warband's Pit Fighter rule.
  effect_i18n:
    es: >-
      Este guerrero tiene la regla Luchador de Foso de la banda.
- id: shared-rule.black-orc-save
  name: Black Orc
  name_i18n:
    es: Orco Negro
  effect: >-
    Model starts with a natural 6+ Armour Black Orc Save. This save may be combined with other
    equipment to improve it.
  effect_i18n:
    es: >-
      El modelo empieza con una tirada de salvación de Orco Negro natural de 6+. Esta salvación
      puede combinarse con otro equipo para mejorarla.
- id: shared-rule.killing-blow
  name: Killing Blow
  name_i18n:
    es: Golpe Asesino
  effect: >-
    A natural rolled 6 on the to-hit roll wounds automatically; the strike might not be parried, but
    armour and saving throws are allowed.
  effect_i18n:
    es: >-
      Un 6 natural en la tirada para golpear hiere automáticamente; el golpe no puede ser detenido,
      pero se permiten las tiradas de armadura y salvación.
- id: shared-rule.pirate-rules
  name: General Pirate Rules
  name_i18n:
    es: Reglas Generales de Piratas
  effect: >-
    Swabbies: Human Pirates take human Swabbies (see the rules for capturing Swabbies in the Sartosa
    campaign rules). Hired Swords: unless noted otherwise, Pirate Warbands have the same access to
    Hired Swords & any other items as for a regular human Mercenary Warband; they must however pay
    an additional +20 gc in upkeep if they have both Dwarfs and Elves together in the same warband
    (the ship is only so big!). Swivel Guns are Rare, Matey!: except for Sartosan Pirates, no Pirate
    Warband may start with a Swivel Gun on their roster in campaign games; if playing a one-off
    game, non-Sartosans may purchase a Swivel Gun for an additional price of 2D6 gc. Succession: if
    the Captain is killed, one of the Mates will take over in the same manner as a Champion taking
    over for a Mercenary warband.
  effect_i18n:
    es: >-
      Fregones: los Piratas Humanos llevan Fregones humanos (ver las reglas para capturar Fregones
      en las reglas de campaña de Sartosa). Espadas a Sueldo: salvo indicación contraria, las bandas
      de Piratas tienen el mismo acceso a Espadas a Sueldo y objetos que una banda mercenaria humana
      normal; sin embargo, deben pagar +20 coronas adicionales de mantenimiento si tienen enanos y
      elfos juntos en la misma banda (¡el barco es solo tan grande!). Los cañones giratorios son
      raros, ¡amigo!: salvo los Piratas Sartosanos, ninguna banda pirata puede empezar con un cañón
      giratorio en su lista en partidas de campaña; en partidas sueltas, los no Sartosanos pueden
      comprar uno por 2D6 coronas adicionales. Sucesión: si el Capitán muere, uno de los
      Contramaestres tomará el mando de la misma forma que un Campeón en una banda mercenaria.
- id: shared-rule.swivel-guns-are-dangerous
  name: Swivel Guns Is Dangerous, Matey!
  name_i18n:
    es: ¡Los Cañones Giratorios Son Peligrosos, Grumete!
  effect: >-
    If a Pirate Warband includes a Swivel Gun, the Gunner wielding it will always be considered an
    individual and can never have anyone else with him. Since a Pirate Warband may only have one
    Swivel Gun, if a Gunner is equipped with one then he must either be a new Gunner, or split from
    an existing unit. If the latter, he retains all Experience and Skills he had previously.
  effect_i18n:
    es: >-
      Si una Banda Pirata incluye un Cañón Giratorio, el Artillero que lo porte siempre será
      considerado un individuo y nunca podrá llevar a nadie más con él. Como una Banda Pirata solo
      puede tener un Cañón Giratorio, si un Artillero lleva uno, debe ser un Artillero nuevo o
      separarse de una unidad existente. En este último caso, conserva toda la Experiencia y
      Habilidades que tuviera previamente.
- id: shared-rule.rabble
  name: Rabble
  name_i18n:
    es: Chusma
  effect: >-
    Swabbies do not need to be armed all the same. Each may be given different equipment, but only
    items listed in the Swabbie equipment list. Swabbies can never use magic, or cast spells of any
    sort, no matter their original background or abilities.
  effect_i18n:
    es: >-
      Los Fregones no necesitan ir armados todos igual. Cada uno puede recibir equipo distinto, pero
      solo objetos de la lista de equipo de Fregones. Los Fregones nunca pueden usar magia ni lanzar
      hechizos de ningún tipo, sin importar su origen o habilidades previas.
- id: shared-rule.ethereal-reference
  name: Ethereal
  name_i18n:
    es: Etéreo
  effect: >-
    See the band Ethereal rule.
  effect_i18n:
    es: >-
      Ver la regla de banda Etéreo.
- id: shared-rule.mutations-great-claw
  name: Great Claw
  name_i18n:
    es: Garra Enorme
  effect: >-
    One of the mutant’s arms ends in a great, crab-like claw. He may carry no weapons in this arm,
    but gains an extra attack in hand-to-hand combat with a +1 Strength bonus. Cost: 50 gold crowns.
  effect_i18n:
    es: >-
      Uno de los brazos del mutante termina en una gran garra parecida a la de un cangrejo. No puede
      llevar armas en este brazo, pero gana un ataque extra en combate cuerpo a cuerpo con un bonus
      de +1 de Fuerza. Coste: 50 coronas de oro.
- id: shared-rule.mutations-tentacle
  name: Tentacle
  name_i18n:
    es: Tentáculo
  effect: >-
    One of the mutant’s arms ends in a tentacle. He may grapple his opponent in close combat to
    reduce his attacks by -1, down to a minimum of 1. The mutant may decide which attack his
    opponent loses. Cost: 35 gold crowns
  effect_i18n:
    es: >-
      Uno de los brazos del mutante termina en un tentáculo. Puede atrapar a su oponente en combate
      cuerpo a cuerpo para reducir sus ataques en -1, hasta un mínimo de 1. El mutante puede decidir
      qué ataque pierde su oponente. Coste: 35 coronas de oro.
- id: shared-rule.mutations-blackblood
  name: Blackblood
  name_i18n:
    es: Sangre Negra
  effect: >-
    If the model loses a wound in close combat, anyone in base contact with the model suffers a
    Strength 3 hit (no critical hits) from the spurting corrosive blood. Cost: 30 gold crowns
  effect_i18n:
    es: >-
      Si la miniatura pierde una herida en combate cuerpo a cuerpo, cualquiera en contacto base con
      la miniatura sufre un impacto de Fuerza 3 (sin golpes críticos) de la sangre corrosiva a
      chorro. Coste: 30 coronas de oro.
- id: shared-rule.loner
  name: Loner
  name_i18n:
    es: Solitario
  effect: >-
    Few people care to spend any length of time in the company of a priest of Morr - even when it is
    their duty to do so. As such, a priest of Morr is used to being alone and probably prefers it
    that way. Priests of Morr do not suffer from the all alone rules.
  effect_i18n:
    es: >-
      Poca gente se detiene a pasar tiempo en compañía de un sacerdote de Morr, aunque sea su deber
      hacerlo. Así, un sacerdote de Morr está acostumbrado a estar solo y probablemente lo prefiere
      así. Los sacerdotes de Morr no sufren las reglas de Todo Solo.
- id: shared-rule.town-crier-6-dwarf-special-skills
  name: Dwarf Special Skills
  name_i18n:
    es: Habilidades Especiales Enanas
  effect: >-
    Dwarf Heroes may use any of the Dwarf Special Skills listed in Town Crier 6 (or Best of Town
    Crier): Master of Blades, Extra Tough, Resource Hunter, True Grit and Thick Skull. Master of
    Blades is one printed entry and publishes one equivalent skill, Unbeatable Warrior (parry by
    equalling the highest hit roll, and two parries with two Parry weapons); the Vampire's Sword
    Master is a different contract and is never granted for this entry. The printed Master of Blades
    sentence about two Dwarf Axes reaches rule.dwarf-axe-parry-reroll, not this column. Extra Tough
    and Resource Hunter are printed members whose entire effect is post-game campaign bookkeeping,
    so each carries its own out-of-scope disposition.
  effect_i18n:
    es: >-
      Los heroes enanos pueden usar cualquiera de las Habilidades Especiales Enanas listadas en Town
      Crier 6 (o Best of Town Crier): Maestro de Hojas, Duro de Pelar, Cazador de Recursos, Temple
      de Acero y Craneo Grueso. Maestro de Hojas es una unica entrada impresa y publica una unica
      habilidad equivalente, Guerrero Imbatible (parar igualando la tirada mas alta y dos paradas
      con dos armas con Parada); Maestro de la Espada del Vampiro es un contrato distinto y nunca se
      concede por esta entrada. La frase impresa de Maestro de Hojas sobre dos Hachas Enanas llega a
      rule.dwarf-axe-parry-reroll, no a esta columna. Duro de Pelar y Cazador de Recursos son
      miembros impresos cuyo efecto completo es contabilidad de campana posterior a la partida, asi
      que cada uno lleva su propia disposicion fuera de alcance.
- id: shared-rule.animosity-forest-goblins
  name: Animosity
  name_i18n:
    es: Rencor
  effect: >-
    Forest Goblins are subject to the rules for Animosity .
  effect_i18n:
    es: >-
      Los Goblins del Bosque están sujetos a las reglas de Rencor.
- id: shared-rule.field-of-scholarship
  name: Field of Scholarship
  name_i18n:
    es: Campo de Erudición
  effect: >-
    When joining a warband, the scholar must choose the area of knowledge he specialises in. Choose
    one of the following. Cartography: the Scholar keeps a detailed map of where you have been; you
    may add or deduct 1 from a D6 when exploring. Physiology: after all serious injuries have been
    resolved you may select a hero to re-roll his result. Poetry: the Scholar writes grand poems
    that increase the reputation of the warband throughout the land and inspires them to great
    deeds; your leader adds +1 to his Leadership for his first leadership test in a scenario if your
    warband won the last battle they fought; also, for one turn during a scenario the poet grants
    any friendly model within 6" +1 WS and +1 A. Theology: this Scholar is a devoted servant of The
    One and has access to Holy Skills. The Occult: the scholar is versed in the arts of magic and is
    a wizard that can use Lesser magic (see the Magic section of the Core Rules).
  effect_i18n:
    es: >-
      Al unirse a una banda, el erudito debe elegir el área de conocimiento en la que se
      especializa. Elige una de las siguientes. Cartografía: el Erudito conserva un mapa detallado
      de los lugares visitados; puedes sumar o restar 1 a un D6 al explorar. Fisiología: una vez
      resueltas todas las heridas graves, puedes elegir un héroe para que repita su resultado.
      Poesía: el Erudito escribe grandes poemas que aumentan la reputación de la banda por toda la
      tierra y los inspiran a grandes hazañas; tu líder suma +1 a su Liderazgo en su primer chequeo
      de liderazgo de un escenario si tu banda ganó la última batalla; además, durante un turno de
      un escenario, el poeta otorga a cualquier modelo amigable a 6" +1 HA y +1 A. Teología: este
      Erudito es un devoto servidor de El Uno y tiene acceso a Habilidades Sagradas. Lo Oculto: el
      erudito está versado en las artes de la magia y es un mago que puede usar Magia Menor (ver la
      sección de Magia de las reglas básicas).
- id: shared-rule.knights-ride
  name: Ride – Horse, Warhorse
  name_i18n:
    es: Montar – Caballo, Caballo de Guerra
  effect: >-
    Knights have the Ride skill as detailed in the Blazing Saddles article.
  effect_i18n:
    es: >-
      Los Caballeros tienen la habilidad Montar tal como se detalla en el artículo Blazing Saddles.
- id: shared-rule.skink-priest-wizard
  name: Wizard
  name_i18n:
    es: Mago
  effect: >-
    The Skink Priest is a Wizard and may use Lizardmen magic.
  effect_i18n:
    es: >-
      El Sacerdote Skink es un hechicero y puede usar la magia de los Hombres Lagarto.
- id: shared-rule.kroxigor-large
  name: Large
  name_i18n:
    es: Grande
  effect: >-
    Kroxigor stand out amongst the rest of the Warband and may be picked out by an archer even if he
    is not the closest model.
  effect_i18n:
    es: >-
      Los Kroxigor destacan entre el resto de la banda y pueden ser elegidos por un arquero incluso
      si no es el modelo más cercano.
- id: shared-rule.saurus-skill-prohibitions
  name: Saurus Skill Prohibitions
  name_i18n:
    es: Prohibiciones de Habilidades Saurus
  effect: >-
    Saurus can never receive Academic skills and can never use missile weapons.
  effect_i18n:
    es: >-
      Los Saurus jamás pueden recibir habilidades Académicas y jamás pueden usar armas de misil.
- id: shared-rule.great-hunter
  name: Great Hunter
  name_i18n:
    es: Gran Cazador
  effect: >-
    The Skink Great Crest is adept at making the most of the cover available and imposes an
    additional -1 to hit the Skink if he is in cover, i.e. a -2 to hit penalty.
  effect_i18n:
    es: >-
      El Skink Gran Cresta es experto en sacar el máximo provecho de la cobertura disponible e
      impone un -1 adicional para impactar al Skink si está en cobertura, es decir, una penalización
      de -2 para impactar.
- id: shared-rule.bellowing-battle-roar
  name: Bellowing Battle Roar
  name_i18n:
    es: Rugido de Batalla Atronador
  effect: >-
    The Saurus' roar is so deafening that enemy models in base contact suffer -1 to hit in the first
    round of combat against them.
  effect_i18n:
    es: >-
      El rugido del Saurus es tan ensordecedor que los modelos enemigos en contacto de peana sufren
      -1 para impactar en el primer asalto de combate contra ellos.
- id: shared-rule.toughened-hide
  name: Toughened Hide
  name_i18n:
    es: Piel Endurecida
  effect: >-
    Through years of battle the Saurus' hide has become hardened and the Saurus will only be taken
    out of action on a 6+.
  effect_i18n:
    es: >-
      Tras años de batalla, la piel del Saurus se ha endurecido y el Saurus solo será puesto Fuera
      de combate con un 6+.
- id: shared-rule.animal-no-equipment
  name: Equipment Restrictions
  name_i18n:
    es: Restricciones de Equipo
  effect: >-
    This model is an Animal and does not select weapons or armour from the warband equipment lists.
  effect_i18n:
    es: >-
      Este modelo es un Animal y no elige armas ni armaduras de las listas de equipo de la banda.
- id: shared-rule.ogre-no-daggers
  name: Equipment Restrictions
  name_i18n:
    es: Restricciones de Equipo
  effect: >-
    Ogres do not receive free daggers and never fight with daggers in close combat.
  effect_i18n:
    es: >-
      Los Ogros no reciben dagas gratis y nunca luchan con dagas en combate cuerpo a cuerpo.
- id: shared-rule.slaves-can-lead
  name: Slaves May Become Warband Leader
  name_i18n:
    es: Los Esclavos Pueden Llegar a Líderes de Banda
  effect: >-
    It is a regular occurrence for slaves, or the sons of slaves, to gain high positions, especially
    if they can prove themselves on the battlefield. Therefore, it is possible for a slave in an
    Arabian warband to become a warband leader.
  effect_i18n:
    es: >-
      Es habitual que los esclavos, o los hijos de esclavos, alcancen posiciones elevadas, sobre
      todo si demuestran su valía en el campo de batalla. Por tanto, es posible que un esclavo de
      una banda árabe se convierta en el líder de la banda.
- id: shared-rule.no-weapons-or-armour-unarmed
  name: Equipment Restrictions
  name_i18n:
    es: Restricciones de Equipo
  effect: >-
    May never use weapons or armour and suffers no penalty for fighting unarmed.
  effect_i18n:
    es: >-
      Nunca puede usar armas ni armaduras y no sufre penalización por luchar sin armas.
- id: shared-rule.tail-fighting
  name: Tail Fighting
  name_i18n:
    es: Combate con la Cola
  effect: >-
    The Skaven may wield a shield, knife or sword with his tail. A weapon grants one additional
    attack with that weapon; a shield grants +1 to the model's armour save.
  effect_i18n:
    es: >-
      El skaven puede empuñar un escudo, cuchillo o espada con su cola. Un arma concede un ataque
      adicional con esa arma; un escudo concede +1 a la salvación por armadura de la miniatura.
- id: shared-rule.wall-runner
  name: Wall Runner
  name_i18n:
    es: Corredor de Muros
  effect: >-
    The Skaven automatically passes Initiative tests required to climb walls and other sheer
    surfaces.
  effect_i18n:
    es: >-
      El skaven supera automáticamente los chequeos de Iniciativa necesarios para trepar por muros y
      otras superficies verticales.
- id: shared-rule.slaves-all-races
  name: All Races
  name_i18n:
    es: Todas las Razas
  effect: >-
    Skaven slaves may be from any race including their fellow Skaven. The above profile represents
    the weakened state of all of them.
  effect_i18n:
    es: >-
      Los esclavos Skaven pueden ser de cualquier raza, incluidos sus propios compañeros Skaven. El
      perfil anterior representa el estado debilitado de todos ellos.
- id: shared-rule.slavers
  name: Slavers
  name_i18n:
    es: Esclavistas
  effect: >-
    Any enemy warrior who is captured may be added to a Skavenslave group. He will have the above
    profile and will have to be equipped the same as the rest of the group. Any equipment he carried
    when he was captured may be kept or sold by the warband.
  effect_i18n:
    es: >-
      Cualquier guerrero enemigo que sea capturado puede añadirse a un grupo de Esclavos Skaven.
      Tendrá el perfil anterior y deberá equiparse igual que el resto del grupo. Cualquier equipo
      que llevara cuando fue capturado puede quedarse la banda o venderse.
- id: shared-rule.diseased-frenzy
  name: Frenzy
  name_i18n:
    es: Frenesí
  effect: >-
    The Skaven has contracted a disease that gives him feverish nightmares that turn him into a
    frothing madman in combat. The Skaven is subject to Frenzy.
  effect_i18n:
    es: >-
      El skaven ha contraído una enfermedad que le da pesadillas febriles que lo convierten en un
      loco espumeante en combate. El skaven está sujeto a Frenesí.
- id: shared-rule.giant-rat-pack-size
  name: Pack Size
  name_i18n:
    es: Tamaño de la Manada
  effect: >-
    You can recruit as many Giant Rats as you wish.
  effect_i18n:
    es: >-
      Puedes reclutar tantas Ratas Gigantes como desees.
- id: shared-rule.bat-flyers
  name: Flyers
  name_i18n:
    es: Voladores
  effect: >-
    The Bats ignore terrain when they move and can freely charge any model that they can see,
    regardless of height and interceptors.
  effect_i18n:
    es: >-
      Los Murciélagos ignoran el terreno cuando se mueven y pueden cargar libremente contra
      cualquier modelo que puedan ver, sin importar la altura ni los interceptores.
- id: shared-rule.flagellants-no-missile-weapons
  name: No Missile Weapons
  name_i18n:
    es: Sin Armas de Proyectil
  effect: >-
    Flagellants may never use missile weapons, even if an Advance would otherwise allow access to
    them.
  effect_i18n:
    es: >-
      Los Flagelantes jamás pueden usar armas de proyectil, incluso si una Mejora les permitiera
      acceder a ellas.
- id: shared-rule.crossfire
  name: Crossfire
  name_i18n:
    es: Fuego Cruzado
  effect: >-
    If more than one scout henchman shoots at the same target, they get +1 on the injury roll.
  effect_i18n:
    es: >-
      Si más de un explorador (hombre de tropa) dispara al mismo objetivo, obtienen +1 en la tirada
      de herida.
- id: shared-rule.lahmian-brotherhood-equipment-restrictions
  name: Equipment Restrictions
  name_i18n:
    es: Restricciones de Equipo
  effect: >-
    Use only the Undead Equipment List assigned by the selected Foreign or Native background. May
    not select the Snake Whip; it is restricted to the Lahmian Vampire and Blood Sister.
  effect_i18n:
    es: >-
      Usa solo la Lista de Equipo No Muerto asignada por el trasfondo Extranjero o Nativo elegido.
      No puede elegir el Látigo de Serpiente; está restringido al Vampiro Lahmiano y a la Hermana de
      Sangre.
- id: shared-rule.khemri-mages-equipment-restrictions
  name: Equipment Restrictions
  name_i18n:
    es: Restricciones de Equipo
  effect: >-
    Sling is Pupils only. A Familiar cannot be bought by this profile during warband creation; after
    creation it may be acquired through Trading because this profile is a spellcaster.
  effect_i18n:
    es: >-
      La Honda es solo para Pupilos. Este perfil no puede comprar un Familiar durante la creación de
      la banda; después de la creación puede adquirirse mediante Comercio, ya que este perfil es
      lanzador de conjuros.
- id: shared-rule.thieves-guild-equipment-restrictions
  name: Equipment Restrictions
  name_i18n:
    es: Restricciones de Equipo
  effect: >-
    May not select Spear, Ankus, Shield or Heavy Armour from the Thief Equipment List; those entries
    are Ruffians and Enforcers only. May not select Bagh Nakh at the listed warband-creation price;
    only the Hashashiyyin Assassin may do so. Other warband members must acquire it through Trading.
  effect_i18n:
    es: >-
      No puede elegir Lanza, Ankus, Escudo ni Armadura Pesada de la Lista de Equipo de Ladrones;
      esas entradas son solo para Rufianes y Ejecutores. No puede elegir Bagh Nakh al precio
      indicado para la creación de la banda; solo el Asesino Hashashiyyin puede hacerlo. Los demás
      miembros de la banda deben adquirirlo mediante Comercio.
- id: shared-rule.thieves-guild-bagh-nakh-restriction
  name: Equipment Restrictions
  name_i18n:
    es: Restricciones de Equipo
  effect: >-
    May not select Bagh Nakh at the listed warband-creation price; only the Hashashiyyin Assassin
    may do so. Other warband members must acquire it through Trading.
  effect_i18n:
    es: >-
      No puede elegir Bagh Nakh al precio indicado para la creación de la banda; solo el Asesino
      Hashashiyyin puede hacerlo. Los demás miembros de la banda deben adquirirlo mediante Comercio.
- id: shared-rule.pestilens-rat-familiar-restriction
  name: Equipment Restrictions
  name_i18n:
    es: Restricciones de Equipo
  effect: >-
    May not use the Rat Familiar Scroll; only a Pestilens Sorcerer can use its spell.
  effect_i18n:
    es: >-
      No puede usar el Pergamino del Familiar Rata; solo un Hechicero Pestilens puede usar su
      conjuro.
- id: shared-rule.parrot-restriction
  name: Equipment Restrictions
  name_i18n:
    es: Restricciones de Equipo
  effect: >-
    May not select a Parrot; it is restricted to the Pirate Captain and Boatswains.
  effect_i18n:
    es: >-
      No puede elegir un Loro; está restringido al Capitán Pirata y a los Contramaestres.
- id: shared-rule.no-missiles-or-armour
  name: No Missile Weapons or Armour
  name_i18n:
    es: Sin Armas de Proyectil ni Armadura
  effect: >-
    May not use any missile weapons or armour.
  effect_i18n:
    es: >-
      No puede usar armas de proyectil ni armadura de ningún tipo.
- id: shared-rule.no-equipment-but-bones
  name: No Equipment but Bones
  name_i18n:
    es: Sin Equipo Salvo Huesos
  effect: >-
    This warrior never carries any equipment, apart from a few bones used as primitive weapons.
  effect_i18n:
    es: >-
      Este guerrero nunca lleva equipo alguno, aparte de unos pocos huesos que usa como armas
      primitivas.
- id: shared-rule.no-equipment-unarmed
  name: No Equipment
  name_i18n:
    es: Sin Equipo
  effect: >-
    This warrior carries no equipment and suffers no penalty for fighting unarmed.
  effect_i18n:
    es: >-
      Este guerrero no lleva equipo y no sufre penalización por luchar sin armas.
- id: shared-rule.no-weapons-unarmed
  name: No Weapons
  name_i18n:
    es: Sin Armas
  effect: >-
    This warrior may never use weapons and suffers no penalty for fighting unarmed.
  effect_i18n:
    es: >-
      Este guerrero nunca puede usar armas y no sufre penalización por luchar sin armas.
