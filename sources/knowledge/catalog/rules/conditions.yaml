- id: condition.massively-built-leadership-penalty
  name: Massively Built — Distracted
  name_i18n: {es: Complexión Masiva — Distraído}
  effect: >-
    A cult member who failed the supplied Massively Built check has one less Leadership for the
    remainder of the battle.
  effect_i18n:
    es: >-
      Un miembro del culto que falló la prueba de Complexión Masiva suministrada tiene un punto menos
      de Liderazgo durante el resto de la batalla.
