schema_version: 2
ruleset: mordheim
conditions:
- id: condition.unseen-charge
  name: Unseen Charge
  name_i18n: {es: Carga sin Visibilidad}
  effect: >-
    The bearer charges a reachable opponent it cannot see; supplied individual fact, without map or
    visibility simulation.
  effect_i18n: {es: 'El portador carga a un enemigo alcanzable que no ve; hecho individual aportado, sin
                   simular mapa ni visibilidad.'}
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Imperial Assassin / Backstabber
    url: https://mordheimer.net/docs/campaigns/hired-swords/grade-1a
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: none
    effects:
    - id: condition.unseen-charge
      scope: 'YES'
      binding: {kind: mechanic, id: condition.unseen-charge}
- id: condition.summoned-this-turn
  name: Summoned this turn
  name_i18n: {es: Invocado este turno}
  effect: >-
    Supplied individual fact that this Malignant Spirit was released from the Requilary on the
    current turn. By itself it grants nothing: Violent Entry pays its +1 to hit and +1 Strength only
    when the bearer also charges on that turn. The summoning procedure is not simulated.
  effect_i18n: {es: 'Hecho individual aportado de que este Espíritu Maligno fue liberado del Relicario
                   en el turno actual. Por sí solo no concede nada: Entrada Violenta solo paga su +1 para
                   impactar y +1 Fuerza si además carga en ese turno; no se simula la invocación.'}
  source_refs:
  - manual: broheim.net
    printed_page: 4
    section: 0-2 Malignant Spirits / Special Rules / Violent Entry
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Call Of The Night Haint.pdf
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: none
    effects:
    - id: condition.summoned-this-turn
      scope: 'YES'
      binding: {kind: mechanic, id: condition.summoned-this-turn}
- id: condition.large-target
  name: Large Target
  name_i18n: {es: Objetivo Grande}
  effect: >-
    This model is explicitly Large; size is supplied rather than inferred from its species or
    Wounds.
  effect_i18n: {es: Este modelo es explícitamente Grande; el tamaño se aporta y no se infiere de su especie ni Heridas.}
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Halfling Knight / Slay Large Creature
    url: https://mordheimer.net/docs/campaigns/hired-swords/grade-2a
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: none
    effects:
    - id: condition.large-target
      scope: 'YES'
      binding: {kind: mechanic, id: condition.large-target}
