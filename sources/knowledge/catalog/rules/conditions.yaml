      Poseídos con 2+, sea cual sea la diferencia de Fuerza; su tirada de impacto, las salvaciones del
      defensor y la secuencia de heridas no cambian. Consecuencia individual suministrada de una
      bendición concedida a Hermanas de Sigmar y Cazadores de Brujas; la tirada de exploración y su oro
      quedan excluidos.
