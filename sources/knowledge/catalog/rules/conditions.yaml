  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: none
    variant_fact: cold_blooded_origin
    effects:
    - id: mechanic.cold-blooded-psychology
      scope: 'YES'
      variant: lizardmen
      binding:
        kind: mechanic
        id: mechanic.cold-blooded-psychology
    - id: mechanic.cold-blooded-leadership
      scope: 'YES'
      variant: fimir
      binding:
        kind: mechanic
        id: mechanic.cold-blooded-leadership
