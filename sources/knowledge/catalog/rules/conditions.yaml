- id: condition.giggle-juice-coating
  name: Giggle Juice Coating (Master Craftsman)
  name_i18n:
    es: Recubrimiento de Zumo de Risas (Maestro Artesano)
  effect: >-
    The weapon the bearer names carries the printed Giggle Juice coating for this battle: +1 Strength
    and +1 Injury with that weapon only, and a poison-immune defender meets the piece without it. The
    coating parameters are the printed ones already declared by the poison.giggle-juice execution
    entry; producing it, the post-battle random improvement roll and its two-battle supply are
    excluded. The separate fixed-Strength spray stays with the Poison Ring.
  effect_i18n:
    es: >-
      El arma designada por el portador lleva el recubrimiento impreso de Zumo de Risas durante esta
      batalla: +1 Fuerza y +1 a Heridas solo con esa arma, y un defensor inmune al veneno se enfrenta a
      la pieza sin el recubrimiento. Los parámetros son los impresos que ya declara la entrada de
      ejecución poison.giggle-juice; producir el frasco, la tirada aleatoria posterior a la batalla y
      su suministro de dos batallas quedan excluidos. El rociado fijo aparte sigue con el Anillo de
      Veneno.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
