  name_i18n:
    es: Líder actual de la banda
  effect: >-
    The caller supplies that this warrior is its warband's actual current leader. The position itself
    carries the printed Leader rule, so any warband warrior within 6 inches may use this warrior's
    Leadership. A band skill that widens the radius of that Leader rule widens the rule the position
    already carries and grants no Leader rule of its own. How the position changed hands, and any
    succession or election, is never simulated here.
  effect_i18n:
    es: >-
      El llamador aporta que este guerrero es el líder actual de su banda. La propia posición lleva
      la regla impresa de Líder, de modo que cualquier guerrero de la banda a 6" puede usar el
      Liderazgo de este guerrero. Una habilidad de banda que amplía el radio de esa regla de Líder
      amplía la que la posición ya lleva y no concede ninguna regla de Líder por sí misma. Cómo
      cambió de manos la posición, y cualquier sucesión o elección, no se simula aquí.
  source_refs:
  - manual: lustria
    printed_page: 108
    section: Heroes / 1 Jarl / Leader
  - manual: lustria
