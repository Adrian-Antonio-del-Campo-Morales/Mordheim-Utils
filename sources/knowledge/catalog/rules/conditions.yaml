- id: condition.fear
  name: Fear
  effect: >-
    A model tests Leadership when charging or being charged by a fear-causing enemy. Failure to
    charge leaves it stationary; failure when charged requires sixes to hit for that combat round.
    Fear-causing models ignore these tests. Frenzied models ignore them while within charge range.
  effect_i18n:
    es: >-
      Una miniatura chequea Liderazgo al cargar o recibir una carga de un enemigo que causa Miedo.
      Si falla al intentar cargar, permanece inmóvil; si falla al recibir la carga, necesita seises
      para impactar durante esa ronda de combate. Las miniaturas que causan Miedo ignoran estos
      chequeos. Las miniaturas sujetas a Furia Asesina los ignoran mientras estén a distancia de carga.
  source_refs:
  - manual: mordheim-rulebook
    printed_page: 23
    section: Leadership and Psychology / Fear and Frenzy
    url: https://broheim.net/downloads/rules/Mordheim%20-%20Part%201%20-%20Background%20%26%20Rules.pdf
  name_i18n:
    es: Miedo
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: none
    effects:
    - id: rule.fear
      scope: 'NO'
      binding: null
      reason: >-
        General Fear rule text, consumed by psychology.resolve_fear and
        psychology.causes_fear. It is not a per-warrior condition: supply
        campaign.condition.causes-fear to make a warrior cause Fear.
- id: condition.terror
  name: Terror
  effect: >-
    A model charged by an enemy that causes terror must pass a Leadership test or flee. Models that
    cause fear or terror are immune to terror.
  effect_i18n:
    es: >-
      Una miniatura cargada por un enemigo que cause terror debe superar una tirada de Liderazgo o
      huir. Las miniaturas que causen miedo o terror son inmunes al terror.
  source_refs:
  - manual: mordheim-rulebook
    printed_page: 0
    section: Psychology / Terror
  name_i18n:
    es: Terror
- id: condition.hatred
  name: Hatred
  effect: >-
    A warrior fighting an enemy it hates may re-roll missed attacks in the first turn of their
    hand-to-hand combat. In later combat turns it fights normally.
  effect_i18n:
    es: >-
      Un guerrero que combate contra un enemigo al que odia puede repetir los ataques fallados
      durante el primer turno de su combate cuerpo a cuerpo. En los turnos de combate posteriores
      combate normalmente.
  source_refs:
  - manual: mordheim-rulebook
    printed_page: 23
    section: Leadership and Psychology / Hatred
    url: https://broheim.net/downloads/rules/Mordheim%20-%20Part%201%20-%20Background%20%26%20Rules.pdf
  name_i18n:
    es: Odio
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: none
    effects:
    - id: skill.hatred
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.hatred
- id: condition.stubborn
  name: Stubborn
  effect: >-
    The model never automatically breaks when losing close combat; it always takes a Leadership test
    as normal.
  effect_i18n:
    es: >-
      La miniatura nunca huye automáticamente al perder un combate cerrado; siempre hace una tirada
      de Liderazgo con normalidad.
  source_refs:
  - manual: mordheim-rulebook
    printed_page: 0
    section: Psychology / Stubborn
  name_i18n:
    es: Obstinado
- id: condition.animosity
  name: Animosity
  effect: >-
    At the start of its turn the model must pass a Leadership test; if it fails, it may not move,
    shoot or cast spells that turn.
  effect_i18n:
    es: >-
      Al comienzo de su turno, la miniatura debe superar una tirada de Liderazgo; si falla, no puede
      moverse, disparar ni lanzar hechizos ese turno.
  source_refs:
  - manual: mordheim-rulebook
    printed_page: 0
    section: Psychology / Animosity
  name_i18n:
    es: Rencor
- id: condition.immune-to-psychology
  name: Immune to Psychology
  effect: >-
    The model ignores all psychology rules, including fear, terror, hatred, frenzy, stupidity and
    animosity.
  effect_i18n:
    es: >-
      La miniatura ignora todas las reglas de psicología, incluidos miedo, terror, odio, frenesí,
      estupidez y rencor.
  source_refs:
  - manual: mordheim-rulebook
    printed_page: 0
    section: Psychology / Immune to Psychology
  name_i18n:
    es: Inmune a la Psicología
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: none
    effects:
    - id: mechanic.psychology-immunity
      scope: 'YES'
      binding:
        kind: mechanic
        id: mechanic.psychology-immunity
- id: condition.cold-blooded
  name: Cold-Blooded
  effect: >-
    Cold-Blooded uses the lowest two of three dice. Lizardmen apply it to Psychology and Rout tests;
    Fimir apply it to Leadership tests. Warband Rout resolution is outside Combat Lab's 1v1 scope.
  effect_i18n:
    es: >-
      Sangre Fría usa los dos dados más bajos de tres. Los Hombres Lagarto la aplican en chequeos
      de Psicología y Huida; los Fimir, en chequeos de Liderazgo. La Huida de bandas queda fuera
      del alcance 1v1 de Combat Lab.
  source_refs:
  - manual: broheim.net
    printed_page: 1
    section: Lizardmen / Cold Blooded
    url: https://broheim.net/downloads/warbands/supplement/lustria/Lizardmen.pdf
  - manual: broheim.net
    printed_page: 2
    section: Lords of the Marsh / Cold-blooded
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Lords%20Of%20The%20Marsh.pdf
  name_i18n:
