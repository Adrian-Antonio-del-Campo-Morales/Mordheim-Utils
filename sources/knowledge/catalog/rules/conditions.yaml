- id: condition.alchemist-addicted
  name: Alchemist Addiction
  name_i18n:
    es: Alchemist Addiction
  effect: >-
    The supplied addicted Scientist cannot act until he rolls a 6 while brewing Aberrantius
    Vigortia. By project ruling, a standing Scientist attempts once at the start of each own turn;
    success releases him and supplies the potion's Strength and Toughness bonus once.
  effect_i18n:
    es: >-
      El Científico adicto no actúa hasta sacar un 6 elaborando Aberrantius Vigortia. Por decisión
      del proyecto, si está de pie lo intenta al inicio de cada turno propio; el éxito lo libera y
      concede una sola vez el bono de Fuerza y Resistencia de la poción.
  source_refs:
