- id: condition.massively-built-lost-turn
  name: Massively Built — Lost Turn
  name_i18n: {es: Complexión Masiva — Turno Perdido}
  effect: >-
    The supplied target of a failed Massively Built check loses its entire next turn as it stands
    dumbfounded. The shooting-phase check, its 12-inch range and the visible male target are
    excluded; the caller supplies the failed outcome. The printed exemptions belong to that supplied
    fact: females, Skaven, Orcs and other non-human races are immune, Vampires and Necromancers are
    not, and Elves and Dwarves are affected.
  effect_i18n:
    es: >-
      El objetivo suministrado de una prueba fallida de Complexión Masiva pierde su turno siguiente
      completo, aturdido por su imponente volumen. La prueba en fase de disparo, su alcance de 12" y
      el objetivo masculino visible quedan excluidos; el llamador aporta el resultado fallido. Las
      excepciones impresas pertenecen a ese hecho suministrado: mujeres, Skaven, Orcos y otras razas
      no humanas son inmunes, los Vampiros y Nigromantes no lo son, y Elfos y Enanos se ven
      afectados.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Dramatis Personae / “Busty” Gwen / Special Rules / Massively Built
    url: https://mordheimer.net/docs/campaigns/dramatis-personae/grade-2a
  - manual: fanatic-online-89
    printed_page: 2
    section: Dramatis Personae / “Busty” Gwen / Special Rules / Massively Built
    url: https://broheim.net/downloads/fo/89RunnersUp.pdf
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: none
    effects:
    - id: condition.massively-built-lost-turn
      scope: 'YES'
      binding:
        kind: mechanic
        id: condition.massively-built-lost-turn
