schema_version: 2
ruleset: mordheim
conditions:
- id: campaign.condition.frenzy
  name: Frenzy
  effect: The warrior suffers from frenzy from now on.
  effect_i18n:
    es: >-
      El guerrero sufre frenesí a partir de ahora.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Serious Injuries / Heroes' Serious Injuries Chart
    url: https://mordheimer.net/docs/campaigns
  name_i18n:
    es: Frenesí
- id: campaign.condition.stupidity
  name: Stupidity
  effect: The warrior suffers from stupidity from now on.
  effect_i18n:
    es: >-
      El guerrero sufre estupidez a partir de ahora.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Serious Injuries / Heroes' Serious Injuries Chart
    url: https://mordheimer.net/docs/campaigns
  name_i18n:
    es: Estupidez
- id: campaign.condition.cannot-run
  name: Smashed Leg
  effect: The warrior may not run any more but he may still charge.
  effect_i18n:
    es: >-
      El guerrero ya no puede correr, pero todavía puede cargar.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Serious Injuries / Heroes' Serious Injuries Chart
    url: https://mordheimer.net/docs/campaigns
  name_i18n:
    es: Pierna Destrozada
- id: campaign.condition.immune-to-fear
  name: Hardened
  effect: The warrior becomes inured to the horrors of Mordheim and is immune to fear from now on.
  effect_i18n:
    es: >-
      El guerrero se acostumbra a los horrores de Mordheim y es inmune al miedo a partir de ahora.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Serious Injuries / Heroes' Serious Injuries Chart
    url: https://mordheimer.net/docs/campaigns
  name_i18n:
    es: Endurecido
- id: campaign.condition.causes-fear
  name: Horrible Scars
  effect: The warrior causes fear from now on.
  effect_i18n:
    es: >-
      El guerrero causa miedo a partir de ahora.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Serious Injuries / Heroes' Serious Injuries Chart
    url: https://mordheimer.net/docs/campaigns
  name_i18n:
    es: Cicatrices Horribles
- id: condition.fear
  name: Fear
  effect: >-
    A model charged by an enemy that causes fear must pass a Leadership test or flee. A model that
    causes fear does not need to test when charged by another model that causes fear.
  effect_i18n:
    es: >-
      Una miniatura cargada por un enemigo que cause miedo debe superar una tirada de Liderazgo o
      huir. Una miniatura que cause miedo no necesita tirada cuando es cargada por otra miniatura
      que cause miedo.
  source_refs:
  - manual: Mordheim Rulebook
    printed_page: 0
    section: Psychology / Fear
  name_i18n:
    es: Miedo
- id: condition.terror
  name: Terror
  effect: >-
    A model charged by an enemy that causes terror must pass a Leadership test or flee. Models that
    cause fear or terror are immune to terror.
  effect_i18n:
    es: >-
      Una miniatura cargada por un enemigo que cause terror debe superar una tirada de Liderazgo o
      huir. Las miniaturas que causen miedo o terror son inmunes al terror.
  source_refs:
  - manual: Mordheim Rulebook
    printed_page: 0
    section: Psychology / Terror
  name_i18n:
    es: Terror
- id: condition.hatred
  name: Hatred
  effect: >-
    The model must pass a Leadership test to avoid charging an enemy it hates; it re-rolls failed to
    hit rolls in close combat against hated enemies.
  effect_i18n:
    es: >-
      La miniatura debe superar una tirada de Liderazgo para evitar cargar contra un enemigo al que
      odia; repite las tiradas de impacto falladas en combate cerrado contra enemigos odiados.
  source_refs:
  - manual: Mordheim Rulebook
    printed_page: 0
    section: Psychology / Hatred
  name_i18n:
    es: Odio
- id: condition.stubborn
  name: Stubborn
  effect: >-
    The model never automatically breaks when losing close combat; it always takes a Leadership test
    as normal.
  effect_i18n:
    es: >-
      La miniatura nunca huye automáticamente al perder un combate cerrado; siempre hace una tirada
      de Liderazgo con normalidad.
  source_refs:
  - manual: Mordheim Rulebook
    printed_page: 0
    section: Psychology / Stubborn
  name_i18n:
    es: Obstinado
- id: condition.animosity
  name: Animosity
  effect: >-
    At the start of its turn the model must pass a Leadership test; if it fails, it may not move,
    shoot or cast spells that turn.
  effect_i18n:
    es: >-
      Al comienzo de su turno, la miniatura debe superar una tirada de Liderazgo; si falla, no puede
      moverse, disparar ni lanzar hechizos ese turno.
  source_refs:
  - manual: Mordheim Rulebook
    printed_page: 0
    section: Psychology / Animosity
  name_i18n:
    es: Rencor
- id: condition.immune-to-psychology
  name: Immune to Psychology
  effect: >-
    The model ignores all psychology rules, including fear, terror, hatred, frenzy, stupidity and
    animosity.
  effect_i18n:
    es: >-
      La miniatura ignora todas las reglas de psicología, incluidos miedo, terror, odio, frenesí,
      estupidez y rencor.
  source_refs:
  - manual: Mordheim Rulebook
    printed_page: 0
    section: Psychology / Immune to Psychology
  name_i18n:
    es: Inmune a la Psicología
- id: condition.cold-blooded
  name: Cold-Blooded
  effect: Lizardmen take Leadership tests using two dice, discarding the highest result.
  effect_i18n:
    es: >-
      Los Hombres Lagarto hacen las tiradas de Liderazgo con dos dados, descartando el resultado más
      alto.
  source_refs:
  - manual: Mordheim Rulebook
    printed_page: 0
    section: Psychology / Cold-Blooded
  name_i18n:
    es: Sangre Fría
note: Structured conditions will be extended as combat and psychology mechanics are reviewed. The general
  ids (condition.*) declare canonical psychology conditions; the campaign ids (campaign.condition.*) cover
  the serious injury effects that apply them.
