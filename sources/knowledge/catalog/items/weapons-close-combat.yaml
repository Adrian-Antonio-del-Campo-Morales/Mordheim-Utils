- id: beastlash
  kind: close-combat-weapon
  name: Beastlash
  name_i18n:
    es: Látigo de Señor de las Bestias
  effect: >-
    Range: Close Combat Strength: As user -1 Beastbane : The Beastmaster wielding a Beastlash causes
    Fear in animals, any animal charged or wishing to charge a Beastmaster with one of these weapons
    must first take a Fear test as mentioned in the psychology section of the Mordheim rules.
  effect_i18n:
    es: >-
      Alcance: Combate cuerpo a cuerpo Fuerza: Como usuario -1 Beastbane: El Beastmaster que empuña
      un Beastlash causa miedo en los animales, cualquier animal cargado o que desee cargar contra
      un Beastmaster con una de estas armas primero debe realizar una prueba de miedo como se
      menciona en la sección de psicología de las reglas de Mordheim.
  source_refs:
  - *id002
  combat_status: implemented
  mechanic_id: weapon.beastlash
- id: belaying_pin
  kind: close-combat-weapon
  name: Belaying Pin
  name_i18n:
    es: Cabilla de Maniobra
  effect: >-
    Range: 6" Strength: As user -1 Awkward Thrown Weapon : Models using Belaying Pins do not suffer
    any penalties for range, but still suffer a -1 to hit penalty if they use them after moving that
    turn.
  effect_i18n:
    es: >-
      Alcance: 6" Fuerza: Como usuario -1 Arma arrojadiza incómoda: Los modelos que usan pasadores
      de seguridad no sufren ninguna penalización por alcance, pero aún sufren una penalización de
      -1 al impacto si los usan después de moverse ese turno.
  source_refs:
  - *id003
  - *id004
  combat_status: implemented
  mechanic_id: weapon.mace
