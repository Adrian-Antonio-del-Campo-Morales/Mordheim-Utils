- id: boat_hook
  kind: close-combat-weapon
  name: Boat Hook
  name_i18n:
    es: Bichero
  effect: >-
    Range: Close Combat Strength: As user -1 Strike First : Boat Hooks are used in Close Combat.
    They allow the user to Strike First in the first round of any close combat, no matter which
    model charged, but require both hands to use.
  effect_i18n:
    es: >-
      Alcance: Combate cuerpo a cuerpo Fuerza: Como usuario -1 Golpe primero: Los ganchos para botes
      se usan en combate cuerpo a cuerpo. Permiten al usuario atacar primero en la primera ronda de
      cualquier combate cuerpo a cuerpo, sin importar qué modelo cargue, pero requieren ambas manos
      para usarlos.
  source_refs:
  - *id003
  - *id004
  combat_status: implemented
  mechanic_id: weapon.long-boat-hook
- id: broadsword
  kind: close-combat-weapon
  name: Broadsword
  name_i18n:
    es: Espada Ancha
  effect: >-
    Range: Close Combat Strength: As user +1 Difficult to use : A model with a Broadsword may not
    use a second weapon or buckler in his other hand because it requires all his skill to wield it.
    He may carry a shield or a kite shield as normal though.
  effect_i18n:
    es: >-
      Alcance: Cuerpo a cuerpo Fuerza: Como usuario +1 Difícil de usar: Un modelo con una espada
      ancha no puede usar una segunda arma o escudo en su otra mano porque requiere toda su
      habilidad para manejarlo. Sin embargo, puede llevar un escudo o un escudo de cometa como de
      costumbre.
  source_refs:
  - &id028
    manual: mordheimer.net
    printed_page: 0
    section: Knights Equipment List
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/bretonnian-chapel-guard
  combat_status: implemented
  mechanic_id: weapon.broadsword
- id: cat_o_nine_tails
  kind: close-combat-weapon
  name: Cat O Nine Tails
  name_i18n:
    es: Gato de Nueve Colas
  effect: >-
    Range: Close Combat Strength: As user Cannot be parried : Like the Steel Whips of the
    Sisterhood, Cats cannot be parried by swords or bucklers.
  effect_i18n:
    es: >-
      Alcance: combate cuerpo a cuerpo Fuerza: como usuario No se puede detener: al igual que los
      látigos de acero de la Hermandad, los gatos no se pueden detener con espadas o escudos.
  source_refs:
