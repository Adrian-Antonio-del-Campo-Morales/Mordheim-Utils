- id: barbed_whip
  kind: close-combat-weapon
  name: Barbed Whip
  name_i18n:
    es: Látigo de Púas
  effect: >-
    Range: Close Combat Strength: As user Whipcrack : When the wielder charges they gain +1A for
    that turn. This bonus attack is added after any other modifications. When the wielder is charged
    they gain +1A that they may only use against the charger. This additional attack will 'strike
    first'. If the wielder is simultaneously charged by two or more opponents they will still only
    receive a total of +1A. If the wielder is using two whips at the same time then they get +1A for
    the additional hand weapon, but only the first whip gets the whipcrack +1A. ✏️
  effect_i18n:
    es: >-
      Alcance: Cuerpo a cuerpo Fuerza: Como usuario Whipcrack: Cuando el portador carga, obtiene +1A
      para ese turno. Este ataque adicional se agrega después de cualquier otra modificación. Cuando
      se carga al portador, obtiene +1A que solo puede usar contra el cargador. Este ataque
      adicional "atacará primero". Si el portador es cargado simultáneamente por dos o más
      oponentes, solo recibirá un total de +1A. Si el portador usa dos látigos al mismo tiempo,
      obtiene +1A por el arma de mano adicional, pero solo el primer látigo recibe el chasquido +1A.
      ✏️
  source_refs:
  - *id001
  combat_status: implemented
  mechanic_id: weapon.beastlash
