- id: chain_sticks
  kind: close-combat-weapon
  name: Chain Sticks
  name_i18n:
    es: Porras Encadenadas
  effect: >-
    Range: Close Combat Strength: As user Flurry : A set of chain sticks allows its wielder to
    unleash a furious bludgeoning. A warrior armed with chain sticks gets +2 Attacks. This bonus
    only applies in the first turn of each hand-to-hard combat. Using chain sticks otherwise counts
    as having two hand weapons.
  effect_i18n:
    es: >-
      Alcance: combate cuerpo a cuerpo Fuerza: como usuario Flurry: un conjunto de cadenas permite a
      su portador desatar una furiosa contundencia. Un guerrero armado con palos de cadena obtiene
      +2 Ataques. Esta bonificación sólo se aplica en el primer turno de cada combate cuerpo a
      cuerpo. De lo contrario, usar palos de cadena cuenta como tener armas de dos manos.
  source_refs:
