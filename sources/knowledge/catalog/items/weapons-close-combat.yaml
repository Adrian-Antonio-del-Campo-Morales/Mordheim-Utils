  kind: close-combat-weapon
  name: Sword Gnoblar
  name_i18n:
    es: Gnoblar de la Espada
  effect: >-
    30 gold crowns Availability: Rare 10 (Ogres only) An Ogre with a Sword-Gnoblar gains one extra
    Strength 2 attack in Close Combat, at the weapon skill of the owning model. This attack is made
    at the same time as the owning Hero’s attacks and must be directed at a model the Ogre has
    directed attacks toward. The opponent’s attention is on the Ogre!
  effect_i18n:
    es: >-
      30 coronas de oro Disponibilidad: Raro 10 (solo ogros) Un ogro con un Gnoblar de espada
      obtiene un ataque adicional de Fuerza 2 en combate cuerpo a cuerpo, con la habilidad de arma
      del modelo propietario. Este ataque se realiza al mismo tiempo que los ataques del héroe
      propietario y debe dirigirse a una miniatura hacia la que el Ogro haya dirigido sus ataques.
      ¡La atención del oponente está en el Ogro!
