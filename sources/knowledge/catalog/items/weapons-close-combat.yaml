- id: weeping_blades
  kind: close-combat-weapon
  name: Weeping Blades
  name_i18n:
    es: Espadas Supurantes
  effect: >-
    Range: Close Combat Strength: As user Pair : Weeping Blades are traditionally used in pairs, one
    in each hand. A warrior armed with Weeping Blades gets an additional attack.
  effect_i18n:
    es: >-
      Alcance: Combate cuerpo a cuerpo Fuerza: Como usuario Pareja: Las espadas lloronas se utilizan
      tradicionalmente en parejas, una en cada mano. Un guerrero armado con Weeping Blades recibe un
      ataque adicional.
  source_refs:
  - *id086
  combat_status: implemented
  mechanic_id: weapon.weeping-blades
- id: beastwhip
  kind: close-combat-weapon
  name: Beastwhip
  name_i18n:
    es: Látigo de Bestias
  effect: >-
    These warpstone-studded corded leather whips are an essential tool for Clan Moulder, nothing
    motivates living creatures quite like the sting of the lash. Range: Close Combat. Strength: As
    user. Save modifier: -. Special rules: Cannot be parried, Whipcrack, Cruel Barbs. Cannot be
    parried: the Beastwhip coils and twists like a serpent, attempts to parry its attacks are
    futile. A model attacked with a Beastwhip may not make parries with weapons or bucklers.
    Whipcrack: when the wielder charges they gain +1A that turn. This bonus is added after any other
    modifications. When charged they gain +1A only against the charger, striking first. If
    simultaneously charged by 2+ opponents, they still only gain +1A. If dual-wielding, only one
    whip gains the bonus from Whipcrack. Cruel Barbs: Models equipped with a Beastwhip gain a +1
    bonus to their roll when making Difficulty checks during Goading attempts. Note this bonus
    applies only once in each attempt even if the model is armed with two Beastwhips.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Special Equipment / Beastwhip
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/skaven-of-clan-moulder
  combat_status: out_of_scope
  effect_i18n:
    es: >-
      Estos látigos de cuero trenzado tachonados de piedra bruja son una herramienta esencial para
      el Clan Moulder; nada motiva a las criaturas vivientes como el latigazo del azote. Alcance:
      combate cuerpo a cuerpo. Fuerza: como el usuario. Modificador de salvación: -. Reglas
      especiales: No puede pararse, Latigazo, Púas Crueles. No puede pararse: el Látigo de Bestias
      se enrosca y retuerce como una serpiente; los intentos de parar sus ataques son inútiles. Una
      miniatura atacada con un Látigo de Bestias no puede hacer paradas con armas ni broqueles.
      Latigazo: cuando el portador carga, gana +1A ese turno. Este bonificador se añade después de
      cualquier otra modificación. Cuando es cargado, gana +1A solo contra el cargador, golpeando
      primero. Si es cargado simultáneamente por 2+ oponentes, aun así solo gana +1A. Si empuña dos,
      solo un látigo gana el bonificador de Latigazo. Púas Crueles: los modelos equipados con un
      Látigo de Bestias obtienen +1 a su tirada al hacer pruebas de Dificultad durante intentos de
      Azuzamiento. Ten en cuenta que este bonificador se aplica solo una vez en cada intento,
      incluso si el modelo está armado con dos Látigos de Bestias.
- id: thingcatcher
  kind: close-combat-weapon
  name: Thingcatcher
  name_i18n:
    es: Cazacosas
  effect: >-
    The spiked jaws of the Thingcatcher can subdue even the most stubborn or monstrous of beasts.
    Range: Close Combat. Strength: As user +1. Save modifier: -. Special rules: Two-handed, Iron
    Grip. Two-handed: a model armed with a Thingcatcher may not use a shield, buckler, or additional
    weapon in close combat. If the model has a shield it still gains a +1 bonus to armour save
    against shooting. Iron Grip: models equipped with a Thingcatcher can force beasts to reroll a
    failed Stupidity test resulting from a failed Goading attempt.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Special Equipment / Thingcatcher
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/skaven-of-clan-moulder
  combat_status: out_of_scope
  effect_i18n:
    es: >-
      Las mandíbulas con púas del Cazacosas pueden someter incluso a las bestias más tercas o
      monstruosas. Alcance: combate cuerpo a cuerpo. Fuerza: como el usuario +1. Modificador de
      salvación: -. Reglas especiales: A Dos Manos, Garra de Hierro. A Dos Manos: una miniatura
      armada con un Cazacosas no puede usar escudo, broquel ni arma adicional en combate cuerpo a
      cuerpo. Si el modelo lleva escudo, sigue obteniendo el bonificador de +1 a la salvación por
      armadura contra disparos. Garra de Hierro: los modelos equipados con un Cazacosas pueden
      obligar a las bestias a repetir una prueba de Estupidez fallida como resultado de un intento
      de Azuzamiento fallido.
- id: runic_sword_of_snorri_elfbane
  kind: close-combat-weapon
  name: Sword of Snorri Elfbane
  name_i18n:
    es: Espada de Snorri Azote de Elfos
  effect: >-
    The Rune of Slaying is a potent rune, which adds to the killing power of a blade. It has
    obviously been worn by generations of Dwarf thanes. Opponents wounded by the sword are stunned
    on a result of 1-3 (Undead are knocked down as normal) and put out of action on a 4-6.
  effect_i18n:
    es: >-
      La Runa de Matanza es una runa poderosa que aumenta el poder letal de una hoja; obviamente ha
      sido portada por generaciones de thanes enanos. Los rivales heridos por la espada quedan
      aturdidos con un resultado de 1-3 (los No Muertos caen derribados como de costumbre) y Fuera
      de combate con un 4-6.
  source_refs:
  - manual: broheim.net
    printed_page: 70
    section: Runic Artefacts Table / Sword of Snorri Elfbane
    url: https://broheim.net/downloads/campaigns/karakazgal/Karak Azgal.pdf
  combat_status: out_of_scope
- id: mage_staff_of_hoeth
  kind: close-combat-weapon
  name: Mage Staff of Hoeth
  name_i18n:
    es: Bastón Mágico de Hoeth
  effect: >-
    Mage Staves of Hoeth are forged from the finest Ithilmar, and are works of art that are truly
    beautiful to behold. They are usually decorated with gems and other precious materials. Only a
    Loremaster may use a Mage Staff. Range: Close Combat; Strength: as user, as user +1; special
    rules: one or two-handed, concussion. One or Two-handed: a Mage Staff of Hoeth can be used
    either one or two-handed; when used one-handed a Mage Staff counts as a club; when using a Mage
    Staff in two hands it counts as a club and gives the Loremaster +1 Strength. 20 gold crowns,
    Rare 10, High Elf Loremaster only.
  effect_i18n:
    es: >-
      Los Bastones Mágicos de Hoeth se forjan con el mejor Ithilmar y son obras de arte verdaderamente
      hermosas de contemplar. Suelen estar decorados con gemas y otros materiales preciosos. Solo un
      Maestro de Saberes puede usar un Bastón Mágico. Alcance: cuerpo a cuerpo; Fuerza: la del
      usuario, la del usuario +1; reglas especiales: a una o dos manos, conmoción. A una o dos manos:
      un Bastón Mágico de Hoeth puede usarse a una o a dos manos; usado a una mano cuenta como un
      garrote; usado a dos manos cuenta como un garrote y otorga al Maestro de Saberes +1 de Fuerza.
      20 coronas de oro, Rara 10, solo Maestro de Saberes de los Altos Elfos.
  source_refs:
  - manual: broheim.net
    printed_page: 3
    section: Special High Elven Equipment / Mage Staff of Hoeth
    url: https://broheim.net/downloads/warbands/supplement/lustria/High%20Elves.pdf
  combat_status: out_of_scope
- id: plague_censer
  kind: close-combat-weapon
  name: Plague Censer
  name_i18n:
    es: Incensario de la Peste
  effect: >-
    A Plague Censer is a hollow spiked metal ball attached to a long chain and is swung as a flail.
    A plague-infested shard of warpstone is burning inside the ball so that it emits a foul bubonic
    vapour as the censer is swung. Flesh exposed to the vapour quickly erupts into sores and
    fluid-filled blisters and lungs liquefy as the poisonous gas is inhaled. Only members of Clan
    Pestilens that have proven their skill in combat and knowledge of the Liturgus Infecticus are
    given the honour of wielding a Plague Censer. Range: Close Combat; Strength: as user +2; special
    rules: heavy, two-handed, fog of death. Heavy: the Plague Censer is wielded as a flail, and
    confers +2 Strength only on the first round of combat. Two-handed: may not use a shield, buckler
    or additional hand weapon in close combat (a shield still gives +1 armour save against
    shooting). Fog of Death: the billowing clouds of vapour make the wielder hard to shoot at (an
    extra -1 to hit when shooting at the wielder); at the end of each close-combat phase roll a D6
    for each model in base contact with the wielder — on a 6 the model suffers a wound from the
    poisonous gas with no armour save allowed (the vapours penetrate any defenses); Plague Censer
    wielders are immune to the Fog of Death. Cost: 75+5D6 (wt or gc per source), Rare 12, Clan
    Pestilens Champions only. The LUS and MOU texts are verbatim identical; both source refs are
    kept.
  effect_i18n:
    es: >-
      Un Incensario de la Peste es una bola metálica hueca con pinchos unida a una larga cadena y se
      blande como un mayal. En su interior arde un fragmento de piedra bruja infestado de plagas, de
      modo que emite un vapor bubónico fétido al blandir el incensario. La carne expuesta al vapor
      pronto revienta en llagas y ampollas llenas de líquido, y los pulmones se licúan al inhalar el
      gas venenoso. Solo los miembros del Clan Pestilens que han demostrado su habilidad en combate y
      su conocimiento del Liturgus Infecticus reciben el honor de empuñar un Incensario de la Peste.
      Alcance: cuerpo a cuerpo; Fuerza: la del usuario +2; reglas especiales: Pesado, a dos manos,
      Niebla de Muerte. Pesado: el Incensario de la Peste se blande como un mayal y otorga +2 de
      Fuerza solo en la primera ronda de combate. A dos manos: no puede usarse escudo, broquel ni arma
      de mano adicional en combate cuerpo a cuerpo (un escudo sigue dando +1 a la salvación de
      armadura contra disparos). Niebla de Muerte: las nubes de vapor hacen difícil disparar al
      portador (una penalización adicional de -1 al dispararle); al final de cada fase de combate
      cuerpo a cuerpo, tira 1D6 por cada modelo en contacto base con el portador: con un 6, el modelo
      sufre una herida por el gas venenoso sin permitirse salvación de armadura (los vapores penetran
      cualquier defensa); los portadores de Incensarios de la Peste son inmunes a la Niebla de Muerte.
      Coste: 75+5D6 (wt o gc según la fuente), Rara 12, solo Campeones del Clan Pestilens. Los textos
      LUS y MOU son idénticos palabra por palabra; se conservan ambas referencias de fuente.
  source_refs:
  - manual: broheim.net
    printed_page: 2
    section: Special Clan Pestilens Equipment / Plague Censer (Lustria)
    url: https://broheim.net/downloads/warbands/supplement/lustria/Clan%20Pestilens.pdf
  - manual: broheim.net
    printed_page: 2
    section: Clan Pestilence special equipment / Plague Censer (Mousillon)
    url: https://broheim.net/downloads/warbands/supplement/mousillon/Skaven%20of%20Clan%20Pestilens.pdf
  combat_status: out_of_scope
- id: warp_blades
  kind: close-combat-weapon
  name: Warp Blades
  name_i18n:
    es: Hojas de Warp
  effect: >-
    These arcane tools come in the shape of large blades and are attached to any pole the skaven has
    handy. Tap into the winds: warp blades may be attached to any spear, staff or halberd; they give
    their bearer +1 Strength and the knowledge of the Chain Lightening spell. 40+D6 dinars, Rare 8,
    Clan Skryre only (Relics of the Crusades Pt 2).
  effect_i18n:
    es: >-
      Estas herramientas arcanas tienen forma de grandes hojas y se fijan a cualquier asta que el
      skaven tenga a mano. Canalizar los vientos: las hojas de warp pueden fijarse a cualquier
      lanza, bastón o alabarda; otorgan a su portador +1 de Fuerza y el conocimiento del conjuro
      Rayo Eléctrico. 40+1D6 dinares, Rara 8, solo Clan Skryre (Relics of the Crusades Pt 2).
  source_refs:
  - manual: broheim.net
    printed_page: 6
    section: Clan Skryre special equipment / Warp blades
    url: https://broheim.net/downloads/fo/97RelicsoftheCrusadesPt2.pdf
  combat_status: out_of_scope
- id: trappers_pole
  kind: close-combat-weapon
  name: Trapper's Pole
  name_i18n:
    es: Percha de Trampero
  effect: >-
    Used for capturing beasts at arm's length; a trapper's pole makes use of a noose attached to a
    long pole. The trapper's pole works exactly like a spear with the following special rule.
    Trapper: keep track of a living, non-experience-gaining animal (which includes horses, dogs,
    giant rats and boars) that a warrior armed with a trapper's pole takes out of action; if a 1 or
    2 is rolled for the animal when working out injuries it will be added to the trapper's warband.
    15 dinars, Rare 6, Slavers only.
  effect_i18n:
    es: >-
      Se usa para capturar bestias a distancia de un brazo; la percha de trampero emplea un lazo
      sujeto a un palo largo. La percha de trampero funciona exactamente igual que una lanza con la
      siguiente regla especial. Trampero: registra cualquier animal vivo que no gane experiencia (lo
      que incluye caballos, perros, ratas gigantes y jabalíes) que un guerrero armado con una percha
      de trampero deje fuera de combate; si al resolver sus heridas se saca un 1 o un 2 para el
      animal, se añadirá a la banda del trampero. 15 dinares, Rara 6, solo Esclavistas.
  source_refs:
  - manual: broheim.net
    printed_page: 10
    section: Slavers special equipment / Trapper's pole
    url: https://broheim.net/downloads/fo/97RelicsoftheCrusadesPt2.pdf
  combat_status: out_of_scope
- id: spike_jawed_snatcher
  kind: close-combat-weapon
  name: Spike-Jawed Snatcher
  name_i18n:
    es: Capturador de Mandíbulas con Púas
  effect: >-
    Skaven-snatchers: semi-circular prongs mounted on pole-arms, ready to catch an enemy between the
    spike-jawed snapping steel claw. Popular among the Chaos Dwarfs, this non-lethal spring loaded
    mancatcher can ensnare the most violent of prisoners. Range: Close Combat; Strength: as user;
    special rules: capture, two-handed. Capture: a model taken out of action by a spike-jawed
    snatcher becomes captured unless the warband is routed; do not roll for Serious Injuries. Large
    models such as Ogres or Trolls cannot be captured this way, and neither can animals — roll for
    Serious Injuries as normal. 25 gc (Skaven only), Rare 10.
  effect_i18n:
    es: >-
      Capturadores skaven: púas semicirculares montadas sobre armas de asta, listas para atrapar a un
      enemigo entre la garra de acero dentada de mandíbulas con púas. Popular entre los Enanos del
      Caos, este capturador de resortes no letal puede atrapar al más violento de los prisioneros.
      Alcance: cuerpo a cuerpo; Fuerza: la del usuario; reglas especiales: Captura, a dos manos.
      Captura: un modelo dejado fuera de combate por un capturador de mandíbulas con púas queda
      capturado, a menos que la banda huya; no tires por Heridas Graves. Los modelos grandes, como
      Ogros o Trolls, no pueden capturarse así, y tampoco los animales; en esos casos, tira por
      Heridas Graves con normalidad. 25 gc (solo skaven), Rara 10.
  source_refs:
  - manual: broheim.net
    printed_page: 2
    section: Metal Mongers Hand-to-hand / Spike-jawed snatcher
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Metal%20Mongers.pdf
  combat_status: out_of_scope
- id: wrench
  kind: close-combat-weapon
  name: Wrench
  name_i18n:
    es: Llave Inglesa
  effect: >-
    Heavy workshop wrench of the Metal Mongers' artificers. Counts as a club in close combat. 3 gc.
  effect_i18n:
    es: >-
      Llave inglesa pesada de taller, de los artífices de los Mercaderes de Metal. Cuenta como un
      garrote en combate cuerpo a cuerpo. 3 gc.
  source_refs:
  - manual: broheim.net
    printed_page: 2
    section: Metal Mongers Hand-to-hand Combat Weapons / Wrench (counts as club)
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Metal%20Mongers.pdf
  combat_status: implemented
  mechanic_id: weapon.mace
- id: greenwood_scythe
  kind: close-combat-weapon
  name: Greenwood Scythe
  name_i18n:
    es: Guadaña del Bosque
  effect: >-
    Both deal and life is dealt with the Greenwood Scythe. After slaying their enemies the
    Branchwyches use their scythes to harvest the Lamentari or souls of their brethren to prepare
    them for rebirth. Range: Close Combat; Strength: as user +1; special rules: two-handed,
    Treescuttle Venom. Treescuttle Venom: +1 to injury rolls. 60 gold crowns, Rare 10 (Branchwych
    only).
  effect_i18n:
    es: >-
      Con la Guadaña del Bosque se da y se quita la vida. Tras matar a sus enemigos, las Branchwyches
      usan sus guadañas para segar a los Lamentari, las almas de sus hermanos, y prepararlas para el
      renacimiento. Alcance: cuerpo a cuerpo; Fuerza: la del usuario +1; reglas especiales: a dos
      manos, Veneno de Trepabosques. Veneno de Trepabosques: +1 a las tiradas de heridas. 60 coronas
      de oro, Rara 10 (solo Branchwych).
  source_refs:
  - manual: broheim.net
    printed_page: 2
    section: Special equipment / Greenwood scythe
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Fen%20Guard.pdf
  combat_status: out_of_scope
- id: knuckledusters
  kind: close-combat-weapon
  name: Knuckledusters
  name_i18n:
    es: Pies de Cerdo
  effect: >-
    Thugs and robbers infest mighty cities of the Empire. Marienburg has more than its share of
    hoodlums who would not hesitate to strike their enemies with a low blow! Easily secreted,
    knuckledusters used in pairs. Range: Close Combat; Strength: as user; special rules: pair,
    concealable. Pair: knuckledusters are used in pairs, one in each hand; a warrior armed with
    knuckledusters gets an additional attack. Concealable: small enough to stow away in any pocket;
    they do not count towards the two close combat weapons a model may carry and may be used in any
    scenario which prohibits use of weapons, such as 'Last Orders!' or 'Pit of Blood'. 5 gold
    crowns, Rare 6.
  effect_i18n:
    es: >-
      Matones y ladrones infestan las poderosas ciudades del Imperio. Marienburgo tiene más que su
      parte de golfos que no dudarían en golpear a sus enemigos con un golpe bajo. Fáciles de
      esconder, los pies de cerdo se usan por parejas. Alcance: cuerpo a cuerpo; Fuerza: la del
      usuario; reglas especiales: pareja, ocultable. Pareja: los pies de cerdo se usan por parejas,
      uno en cada mano; un guerrero armado con ellos obtiene un ataque adicional. Ocultable: son lo
      bastante pequeños para guardarse en cualquier bolsillo; no cuentan para el límite de las dos
      armas de combate cuerpo a cuerpo que un modelo puede llevar y pueden usarse en cualquier
      escenario que prohíba el uso de armas, como '¡Última Ronda!' o 'Foso de Sangre'. 5 coronas de
      oro, Rara 6.
  source_refs:
  - manual: broheim.net
    printed_page: 2
    section: Low Kings special equipment / Knuckledusters
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Low%20Kings.pdf
  mechanic_id: weapon.knuckledusters
  combat_status: implemented
- id: spirit_knife
  kind: close-combat-weapon
  name: Spirit Knife
  name_i18n:
    es: Cuchillo Espiritual
  effect: >-
    Bones of hanged men, shards of tomb stones, splinters of coffin lids — the Spirit knife is made
    of many different materials with one thing in common: death. Range: Close Combat; Strength: as
    user; special rules: +1 enemy armour save, spectral touch. Spectral Touch: if the hit roll for
    an attack made by a Spirit Knife is 6, the blade's frightful touch stills the victim's beating
    heart, immediately inflicting 1 additional wound; roll to wound for the hit as normal. 20 gold
    crowns (description) vs 25 gc (equipment list) — preserving the source discrepancy. Rare 8.
  effect_i18n:
    es: >-
      Huesos de ahorcados, esquirlas de lápidas, astillas de tapas de ataúd: el Cuchillo Espiritual
      está hecho de muchos materiales distintos con una cosa en común: la muerte. Alcance: cuerpo a
      cuerpo; Fuerza: la del usuario; reglas especiales: +1 a la salvación de armadura del enemigo,
      Toque Espectral. Toque Espectral: si el resultado para impactar de un ataque hecho con un
      Cuchillo Espiritual es 6, el espantoso toque de la hoja detiene el corazón palpitante de la
      víctima y le inflige inmediatamente 1 herida adicional; tira para herir por el impacto con
      normalidad. 20 coronas de oro (descripción) frente a 25 gc (lista de equipo) — se conserva la
      discrepancia de la fuente. Rara 8.
  source_refs:
  - manual: broheim.net
    printed_page: 2
    section: Call of the Night Haint special equipment / Spirit Knife
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Call%20Of%20The%20Night%20Haint.pdf
  combat_status: implemented
  mechanic_id: weapon.spirit-knife
- id: spear_stave
  kind: close-combat-weapon
  name: Spear-Stave
  name_i18n:
    es: Barda-Lanza
  effect: >-
    Elven spear-stave of the Sea Ghosts: counts as a Halberd. 10 gc.
  effect_i18n:
    es: >-
      Barda-lanza élfica de los Fantasmas del Mar: cuenta como una Alabarda. 10 gc.
  source_refs:
