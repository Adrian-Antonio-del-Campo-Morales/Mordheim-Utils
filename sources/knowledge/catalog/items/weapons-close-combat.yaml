  combat_status: implemented
  mechanic_id: weapon.pirate-scourge
- id: cathayan_longsword
  kind: close-combat-weapon
  name: Cathayan Longsword
  name_i18n:
    es: Espada Larga de Cathay
  effect: >-
    Range: Close Combat Strength: As user Parry : Swords offer an excellent balance of defence and
    offence. A model armed with a sword may parry blows. When his opponent rolls to hit, the model
    armed with a sword may roll a D6. If the score is greater than the highest to hit score of his
    opponent, the model has parried the blow, and that attack is discarded. A model may not parry
    attacks made with double or more its own Strength – they are simply too powerful to be stopped.
  effect_i18n:
    es: >-
      Alcance: Cuerpo a cuerpo Fuerza: Como usuario Parar: Las espadas ofrecen un excelente
      equilibrio entre defensa y ataque. Una miniatura armada con una espada puede parar golpes.
      Cuando su oponente tira para impactar, la miniatura armada con una espada puede tirar 1D6. Si
      la puntuación es mayor que la puntuación más alta para impactar de su oponente, el modelo ha
      parado el golpe y ese ataque se descarta. Un modelo no puede parar ataques realizados con el
      doble o más de su propia Fuerza; simplemente son demasiado poderosos para detenerlos.
  source_refs:
  - &id023
    manual: mordheimer.net
    printed_page: 0
    section: Soldier Equipment List
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/battle-monks-of-cathay
  - &id008
    manual: mordheimer.net
    printed_page: 0
    section: Ogre Equipment List
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/maneaters
  combat_status: implemented
  mechanic_id: weapon.cathayan-longsword
