- id: skull_busta
  kind: close-combat-weapon
  name: Skull Busta
  name_i18n:
    es: Reventacraneos
  effect: >-
    Huge hammers that can cause horrific wounds. On the first turn of any combat, the wielder gains
    +1 Strength and causes concussion as a normal hammer. In subsequent rounds of combat, a Skull
    Busta counts as a normal hammer. Skull Bustas are so huge that they may not be used while
    mounted, they may not be used by goblins and cannot be used in conjunction with any other
    weapons (but shields are allowed). Feelin' wobbly: when using a Skull Busta a roll of 2-4 is
    treated as stunned when rolling to see the extent of the model's injuries. Basha: warriors
    wearing a helmet only save vs stunning on a roll of a 6 when hit by a Skull Busta; Knight's
    helms (Crusading Knights warbands) only save on a 4+. 15 gc, Rare 6.
  effect_i18n:
    es: >-
      Enormes martillos capaces de causar heridas horribles. En el primer turno de cualquier combate,
      su portador gana +1 de Fuerza y causa conmoción como un martillo normal. En las rondas de
      combate siguientes, un Reventacraneos cuenta como un martillo normal. Los Reventacraneos son tan
      enormes que no pueden usarse montado, no pueden usarlos los goblins y no pueden usarse junto con
      ninguna otra arma (aunque se permiten escudos). Sentirse flojo: al usar un Reventacraneos, un
      resultado de 2-4 se trata como aturdido al tirar para ver el alcance de las heridas del modelo.
      Basha: los guerreros que lleven yelmo solo salvan contra el aturdimiento con un 6 cuando les
      golpea un Reventacraneos; los yelmos de caballero (bandas de Caballeros Cruzados) solo salvan
      con un 4+. 15 gc, Rara 6.
  source_refs:
  - manual: broheim.net
    printed_page: 59
    section: Special Equipment / Skull Busta
    url: https://broheim.net/downloads/campaigns/karakazgal/Karak Azgal.pdf
  mechanic_id: weapon.skull-busta
  combat_status: implemented
- id: long_daggers
  kind: close-combat-weapon
  name: Long Daggers
  name_i18n:
    es: Dagas Largas
  effect: >-
    These daggers are stuck somewhere between dagger and sword, combining concealment with
    flexibility. They are even sturdy enough to parry enemy blows with a cross block. Range: Close
    Combat; Strength: as user; special rules: pair, parry. Pair: long daggers are traditionally used
    in pairs, one in each hand; a warrior armed with long daggers gets an additional attack for
    using two weapons. Parry: a warrior armed with long daggers may parry blows in the same way as a
    model armed with a sword. 10 gc, Rare 6, Silent Brotherhood only.
  effect_i18n:
    es: >-
      Estas dagas están a medio camino entre la daga y la espada, y combinan el ocultamiento con la
      versatilidad. Son incluso lo bastante robustas para detener golpes enemigos con un cruce.
      Alcance: cuerpo a cuerpo; Fuerza: la del usuario; reglas especiales: pareja, parada. Pareja: las
      dagas largas se usan tradicionalmente por parejas, una en cada mano; un guerrero armado con
      dagas largas obtiene un ataque adicional por usar dos armas. Parada: un guerrero armado con
      dagas largas puede detener golpes igual que un modelo armado con una espada. 10 gc, Rara 6, solo
      Hermandad Silenciosa.
  source_refs:
  - manual: broheim.net
    printed_page: 3
    section: Special equipment / Long daggers
    url: https://broheim.net/downloads/warbands/supplement/sealedcity/Silent%20Brotherhood.pdf
  mechanic_id: weapon.long-daggers
  combat_status: implemented
- id: shock_rod
  kind: close-combat-weapon
  name: Shock Rod
  name_i18n:
    es: Vara de Descargas
  effect: >-
    Another tool of the trade to contain mutated and captured things, with its unnerving electric
    crackling. Range: Close Combat; Strength: as user; special rules: first strike, shock,
    two-handed. Shock: the rod's top crackles with electricity able to overload the victim's nerve
    system, sending them unconscious or flinching in the dirt; when using a shock rod, a roll of 1-4
    is treated as stunned when rolling to see the extent of a model's injuries. 15 gc (description)
    vs 10 gc (Clan Pristekk equipment list) — preserving the source discrepancy. Rare 6, Clan
    Pristekk only.
  effect_i18n:
    es: >-
      Otra útil herramienta del oficio para contener criaturas mutadas y capturadas, con su
      inquietante crepitar eléctrico. Alcance: cuerpo a cuerpo; Fuerza: la del usuario; reglas
      especiales: Golpe primero, Descarga, a dos manos. Descarga: la punta de la vara crepita con
      electricidad capaz de sobrecargar el sistema nervioso de la víctima, dejándola inconsciente o
      arrastrándose por el suelo; al usar una vara de descargas, un resultado de 1-4 se trata como
      aturdido al tirar para ver el alcance de las heridas de un modelo. 15 gc (descripción) frente a
      10 gc (lista de equipo del Clan Pristekk) — se conserva la discrepancia de la fuente. Rara 6,
      solo Clan Pristekk.
  source_refs:
  - manual: broheim.net
    printed_page: 4
    section: Special equipment / Shock rod
    url: https://broheim.net/downloads/warbands/supplement/sealedcity/Clan%20Pristekk.pdf
  - manual: broheim.net
    printed_page: 2
    section: Clan Pristekk equipment list / Shock rod
    url: https://broheim.net/downloads/warbands/supplement/sealedcity/Clan%20Pristekk.pdf
  mechanic_id: weapon.shock-rod
  combat_status: implemented
- id: thing_catcher
  kind: close-combat-weapon
  name: Thing Catcher
  name_i18n:
    es: Cazacosas
  effect: >-
    Used to put down their precious prey; thingcatchers often resemble oversized mancatchers and
    sometimes just a long stick with a wire snare on one end. Range: Close Combat; Strength: as
    user; special rules: two-handed, capture. Capture: a model taken out of action by a
    Thing-catcher becomes captured; do not roll for Serious Injuries. Only animals and large models,
    such as Ogres and Duskcats, may be captured this way. 25 gc, Rare 9, Clan Pristekk only.
  effect_i18n:
    es: >-
      Se usa para abatir a su preciada presa; los cazacosas suelen parecerse a capturadores
      sobredimensionados y, a veces, a un simple palo largo con un lazo de alambre en un extremo.
      Alcance: cuerpo a cuerpo; Fuerza: la del usuario; reglas especiales: a dos manos, Captura.
      Captura: un modelo dejado fuera de combate por un Cazacosas queda capturado; no tires por
      Heridas Graves. Solo pueden capturarse así animales y modelos grandes, como Ogros y Gatos del
      Crepúsculo. 25 gc, Rara 9, solo Clan Pristekk.
  source_refs:
  - manual: broheim.net
    printed_page: 4
    section: Special equipment / Thing-catcher
    url: https://broheim.net/downloads/warbands/supplement/sealedcity/Clan%20Pristekk.pdf
  combat_status: out_of_scope
- id: thinglash
  kind: close-combat-weapon
  name: Thinglash
  name_i18n:
    es: Latigocosas
  effect: >-
    Every Packmaster uses the whip to ensure that his protégés go after the enemy and not
    accidentally after him. Range: Close Combat; Strength: as user +1; special rules: +1 enemy
    armour save, whipcrack, cannot be parried, infuriate. +1 Enemy armour save: an enemy wounded by
    a thinglash gains a +1 bonus to his armour save, and a 6+ armour save if he has none normally.
    Cannot be parried: the thinglash is a flexible weapon and the Packmasters use it with great
    expertise; attempts to parry its strikes are futile. Whipcrack: when the wielder charges they
    gain +1A for that turn; when the wielder is charged they gain +1A that they may only use against
    the charger, striking first. Infuriate: Giant Rats, Rat Ogres and Things within 4" hate all
    enemy warriors. 10 gc, common, Clan Pristekk only.
  effect_i18n:
    es: >-
      Todos los Packmasters usan el látigo para asegurarse de que sus pupilos van tras el enemigo y
      no, por accidente, tras él. Alcance: cuerpo a cuerpo; Fuerza: la del usuario +1; reglas
      especiales: +1 a la salvación de armadura del enemigo, Whipcrack, no puede detenerse, Enfurecer.
      +1 a la salvación de armadura del enemigo: un enemigo herido por un latigocosas obtiene un
      bonificador de +1 a su salvación de armadura, y una salvación de armadura de 6+ si normalmente
      no tiene ninguna. No puede detenerse: el latigocosas es un arma flexible y los Packmasters la
      usan con gran maestría; los intentos de detener sus golpes son inútiles. Whipcrack: cuando el
      portador carga, gana +1 A ese turno; cuando el portador es cargado, gana +1 A que solo puede
      usar contra quien le carga, golpeando primero. Enfurecer: las Ratas Gigantes, los Ogros Rata y
      las Cosas a 4" odian a todos los guerreros enemigos. 10 gc, común, solo Clan Pristekk.
  source_refs:
  - manual: broheim.net
    printed_page: 4
    section: Special equipment / Thinglash
    url: https://broheim.net/downloads/warbands/supplement/sealedcity/Clan%20Pristekk.pdf
  combat_status: out_of_scope
