- id: misericordia
  kind: close-combat-weapon
  name: Misericordia
  name_i18n:
    es: Misericordia
  effect: >-
    Range: Close combat Strength: As user : Coup de Grace Coup de Grace: As the warriors of the
    Cursed Cavalcade are experts at hitting the vital spots of their opponents, and the Misericordia
    can find the smallest chink in even the best suit of armor. Often the wielders choose a spot
    that causes indescribable pain but does not kill the target outright so he can be dragged before
    the Throne of Worms. When attacking knocked down opponents, Misericordia bypasses all armor
    saves.
  effect_i18n:
    es: >-
      Alcance: Combate cuerpo a cuerpo Fuerza: Como usuario: Coup de Grace Coup de Grace: Como los
      guerreros de la Cabalgata Maldita son expertos en golpear los puntos vitales de sus oponentes,
      y la Misericordia puede encontrar la grieta más pequeña incluso en la mejor armadura. A
      menudo, los portadores eligen un lugar que causa un dolor indescriptible pero que no mata al
      objetivo directamente para poder arrastrarlo ante el Trono de Gusanos. Al atacar a oponentes
      derribados, Misericordia pasa por alto todas las salvaciones de armadura.
  source_refs:
  - *id038
  - *id090
  combat_status: implemented
  mechanic_id: weapon.misericordia
