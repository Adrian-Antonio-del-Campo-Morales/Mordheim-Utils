- id: man_catcher
  kind: close-combat-weapon
  name: Man Catcher
  name_i18n:
    es: Capitulador
  effect: >-
    Range: Close Combat Strength: As user Capture : A model taken out of action by a Mancatcher
    becomes captured. Do not roll for Serious Injuries. The catch is locked up in the Engine of
    Chaos instead. If the warband does not include an Engine of Chaos, roll for Serious Injuries as
    normal. Large models, such as Ogres, Trolls and Minotaurs, cannot be captured this way, and
    neither can animals.
  effect_i18n:
    es: >-
      Alcance: Cuerpo a cuerpo Fuerza: Como usuario Captura: Un modelo dejado fuera de combate por
      un Mancatcher queda capturado. No tire por Lesiones Graves. En cambio, la captura está
      encerrada en el Motor del Caos. Si la banda no incluye una Máquina del Caos, tira para Heridas
      Graves como de costumbre. Los modelos grandes, como ogros, trolls y minotauros, no se pueden
      capturar de esta manera, ni tampoco los animales.
