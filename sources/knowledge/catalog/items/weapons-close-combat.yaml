- id: rapier
  kind: close-combat-weapon
  name: Rapier
  name_i18n:
    es: Estoque
  effect: >-
    Range: Close Combat Strength: As user Parry : Like all swords, you may use a rapier to parry in
    hand to hand combat. When your opponent scores a hit you must roll a D6. If you can score
    greater than the highest 'to hit' roll you have parried the blow and the attack is discarded.
  effect_i18n:
    es: >-
      Alcance: Cuerpo a cuerpo Fuerza: Como usuario Parada: Como todas las espadas, puedes usar un
      estoque para parar en combate cuerpo a cuerpo. Cuando tu oponente logra un golpe, debes tirar
      un D6. Si puedes obtener una puntuación mayor que la tirada más alta para golpear, habrás
      detenido el golpe y el ataque se descarta.
