  combat_status: implemented
  mechanic_id: weapon.rapier
- id: serpent_staff
  kind: close-combat-weapon
  name: Serpent Staff
  name_i18n:
    es: Bastón de la Serpiente
  effect: >-
    Range: Close Combat Strength: As user Parry : The staff is used with two hands and may be used
    to Parry . However, the Liche Priest may forgo all his normal attacks and parries in a round to
    use the power contained within the staff. A single word of command brings the serpent to life to
    attack their enemy. The staff always attacks first in close combat and makes a single attack
    with WS4 and S4.
  effect_i18n:
    es: >-
      Alcance: Combate cuerpo a cuerpo Fuerza: Como usuario Parar: El bastón se usa con las dos
      manos y puede usarse para parar. Sin embargo, el Liche Priest puede renunciar a todos sus
      ataques y paradas normales en una ronda para usar el poder contenido en el bastón. Una sola
      palabra de orden hace que la serpiente cobre vida para atacar a su enemigo. El bastón siempre
      ataca primero en combate cuerpo a cuerpo y realiza un único ataque con WS4 y S4.
  source_refs:
  - *id081
  combat_status: implemented
  mechanic_id: weapon.serpent-staff
- id: shortsword
  kind: close-combat-weapon
  name: Shortsword
  name_i18n:
    es: Espada Corta
  effect: >-
    Range: Close Combat Strength: As user Parry : Shortswords offer an excellent balance of defence
    and offence. A model armed with a sword may parry blows. When his opponent rolls to hit, the
    model armed with a sword may roll a D6. If the score is greater than the highest to hit score of
    his opponent, the model has parried the blow, and that attack is discarded. A model may not
    parry attacks made with double or more its own Strength – they are simply too powerful to be
    stopped.
  effect_i18n:
    es: >-
      Alcance: Combate cuerpo a cuerpo Fuerza: Como usuario Parar: Las espadas cortas ofrecen un
      excelente equilibrio entre defensa y ataque. Una miniatura armada con una espada puede parar
      golpes. Cuando su oponente tira para impactar, la miniatura armada con una espada puede tirar
      1D6. Si la puntuación es mayor que la puntuación más alta para impactar de su oponente, el
      modelo ha parado el golpe y ese ataque se descarta. Un modelo no puede parar ataques
      realizados con el doble o más de su propia Fuerza; simplemente son demasiado poderosos para
      detenerlos.
  source_refs:
  - *id029
  - *id030
  combat_status: implemented
