schema_version: 2
ruleset: mordheim
items:
- id: crimson_shade
  kind: combat-equipment
  name: Crimson Shade
  name_i18n:
    es: Sombra Carmesí
  effect: >-
    Effect : A model using Crimson Shade has his Initiative increased by +D3 points, and Movement
    and Strength by +1 (this effect lasts for one game). Crimson Shade has no effect on Undead such
    as Vampires and Zombies, or the Possessed.
  effect_i18n:
    es: >-
      Efecto: Un modelo que usa Crimson Shade ve su Iniciativa aumentada en +D3 puntos y su
      Movimiento y Fuerza en +1 (este efecto dura un juego). Crimson Shade no tiene ningún efecto
      sobre los no muertos, como los vampiros y los zombis, o los poseídos.
  source_refs:
  - &id001
    manual: mordheimer.net
    printed_page: 0
    section: Hero Equipment List
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/lustrian-reavers
  combat_status: implemented
  mechanic_id: preparation.crimson-shade
- id: dark_venom
  kind: combat-equipment
  name: Dark Venom
  name_i18n:
    es: Veneno Oscuro
  effect: >-
    Any hit caused by a weapon coated with Dark Venom counts as having +1 Strength, so, for example,
    if a warrior with Strength 3 wielding a poisoned sword hits an opponent, he will cause a
    Strength 4 hit instead. Armour saving throws are modified to take into account the increased
    Strength of the attack.
  effect_i18n:
    es: >-
      Cualquier golpe causado por un arma cubierta con Dark Venom cuenta como +1 de Fuerza, por lo
      que, por ejemplo, si un guerrero con Fuerza 3 empuñando una espada envenenada golpea a un
      oponente, causará un golpe de Fuerza 4 en su lugar. Las tiradas de salvación de armadura se
      modifican para tener en cuenta el aumento de la fuerza del ataque.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Dark Elf Equipment List
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/dark-elves
  - *id001
  combat_status: implemented
  mechanic_id: poison.black-venom
- id: hobgoblin_poisoned_daggers
  kind: combat-equipment
  name: Hobgoblin Poisoned Daggers
  name_i18n:
    es: Dagas Envenenadas Hobgoblin
  effect: >-
    Range: Close Combat Strength: As user Pair : Poisoned Daggers are traditionally used in pairs,
    one in each hand. A warrior armed with Poisoned Daggers gets an additional attack (for the
    offhand weapon attack).
  effect_i18n:
    es: >-
      Alcance: Combate cuerpo a cuerpo Fuerza: Como usuario Pareja: Las dagas envenenadas se
      utilizan tradicionalmente en parejas, una en cada mano. Un guerrero armado con dagas
      envenenadas recibe un ataque adicional (para el ataque con arma improvisada).
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Hobgoblins equipment lists
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/sons-of-hashut
  combat_status: implemented
  mechanic_id: weapon.poisoned-daggers
- id: lucky_charm
  kind: combat-equipment
  name: Lucky Charm
  name_i18n:
    es: Amuleto de la Suerte
  effect: >-
    The first time a model with a lucky charm is hit in a battle they roll a D6. On a 4+ the hit is
    discarded and no damage is suffered. Owning two or more charms does not confer any extra
    benefits, the model may still only try to discard the first hit. ✏️
  effect_i18n:
    es: >-
      La primera vez que una miniatura con un amuleto de la suerte es golpeada en una batalla, tira
      un D6. Con un 4+ el impacto se descarta y no se sufre ningún daño. Poseer dos o más amuletos
      no confiere ningún beneficio adicional, el modelo sólo puede intentar descartar el primer
      golpe. ✏️
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Knights Equipment List
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/bretonnian-chapel-guard
  combat_status: implemented
  mechanic_id: defence.lucky-charm
- id: mad_cap_mushrooms
  kind: combat-equipment
  name: Mad Cap Mushrooms
  name_i18n:
    es: Hongos Sombrero Loco
  effect: >-
    Effect : Any warrior who takes Mad Cap Mushrooms before a battle will be subject to frenzy . The
    Mad Cap Mushroom has no effect on Undead such as Vampires and Zombies, or the Possessed.
  effect_i18n:
    es: >-
      Efecto: Cualquier guerrero que tome Mad Cap Mushrooms antes de una batalla estará sujeto a un
      frenesí. El hongo Mad Cap no tiene ningún efecto sobre los no muertos, como los vampiros y los
      zombis, o los poseídos.
  source_refs:
  - &id002
    manual: mordheimer.net
    printed_page: 0
    section: Fanatic Equipment List
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/night-goblins
