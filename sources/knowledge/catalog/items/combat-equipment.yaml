- id: whirling_blades
  kind: combat-equipment
  name: Whirling Blades
  name_i18n:
    es: Hojas Giratorias
  effect: >-
    The signature weapon of the Doomseeker, the Whirling Blade is an axe on a chain. Even expert
    slayers have trouble mastering such a difficult weapon, but once mastered, the damage dealt can
    be staggering. Range: Close Combat. Strength: As User. Special Rules: Cannot be parried, Cutting
    Edge, Pair, Dance of Doom, Whirlwind of Death. Cannot Be Parried: The Whirling Blades is a
    flexible weapon and a Doomseeker uses it with great expertise. Attempts to parry its strikes are
    futile. A model attacked by a whirling blade may not make parries with swords or bucklers.
    Cutting Edge: Whirling Blades have an extra save modifier of -1, so a model with Strength 4
    using a Whirling Blade has a -2 save modifier when he hits an opponent with the blade in close
    combat. Pair: Whirling Blades are traditionally used in pairs, one in each hand. This off-hand
    weapon provides an additional attack like normal. A warrior armed with a pair of whirling blades
    may not wield a different off-hand weapon, and may never split up the pair (unless he loses a
    hand). Dance of Doom: Whenever the Doomseeker charges, the blade in their main hand provides a
    +1 attack in the first round of combat. The main hand also grants an additional attack in any
    turn in which the Doomseeker is charged by one or more opponents; this attack must be used
    against one of the chargers. If the wielder is simultaneously charged by two or more opponents
    they will still only receive a total of +1A. "Dance of Doom" does apply to the off-hand Whirling
    Blade. Whirlwind of Death: Whenever the Doomseeker is charged, the free attack from the Dance of
    Doom attack and the additional attack from the off-hand both gain 'Strike First,' like a Steel
    Whip for that turn. All of the Slayer's other attacks strike at normal speed.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Special Equipment / Whirling Blades
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/dwarf-slayer-cult
  combat_status: out_of_scope
  effect_i18n:
    es: >-
      El arma insignia del Buscador de la Perdición, la Hoja Giratoria es un hacha sujeta a una
      cadena. Incluso los matatrolles más expertos tienen dificultades para dominar un arma tan
      difícil, pero una vez dominada, el daño que puede causar es pasmoso. Alcance: combate cuerpo a
      cuerpo. Fuerza: como el usuario. Reglas Especiales: No puede pararse, Filo Cortante, Par,
      Danza de la Perdición, Torbellino de Muerte. No Puede Pararse: Las Hojas Giratorias son un
      arma flexible y un Buscador de la Perdición las usa con gran destreza. Los intentos de parar
      sus golpes son inútiles. Una miniatura atacada por una hoja giratoria no puede hacer paradas
      con espadas ni broqueles. Filo Cortante: Las Hojas Giratorias tienen un modificador de
      salvación adicional de -1, de modo que una miniatura con Fuerza 4 que golpee a un oponente con
      la hoja en combate cuerpo a cuerpo tiene un modificador de salvación de -2. Par: Las Hojas
      Giratorias se usan tradicionalmente en parejas, una en cada mano. Esta arma de mano secundaria
      proporciona un ataque adicional como de costumbre. Un guerrero armado con un par de hojas
      giratorias no puede empuñar otra arma distinta en la mano secundaria, y nunca puede separar el
      par (salvo que pierda una mano). Danza de la Perdición: Siempre que el Buscador de la
      Perdición carga, la hoja de su mano principal proporciona +1 ataque en la primera ronda de
      combate. La mano principal también otorga un ataque adicional en cualquier turno en que el
      Buscador de la Perdición sea cargado por uno o más oponentes; este ataque debe usarse contra
      uno de los cargadores. Si el portador es cargado simultáneamente por dos o más oponentes, aun
      así solo recibirá un total de +1A. La "Danza de la Perdición" sí se aplica a la Hoja Giratoria
      de la mano secundaria. Torbellino de Muerte: Siempre que el Buscador de la Perdición es
      cargado, el ataque gratuito de la Danza de la Perdición y el ataque adicional de la mano
      secundaria obtienen ambos "Golpear en Primero", como un Látigo de Acero, durante ese turno.
      Todos los demás ataques del Matatroll golpean a velocidad normal.
- id: hooded_lantern_rig
  kind: combat-equipment
  name: Hooded Lantern & Rig
  name_i18n:
    es: Farol con Capuchón y Arnés
  effect: >-
    Allowing a Grave Robber to do his work in private and free-handed whilst provided a source of
    light. Concealed Light: Provides light like a regular Lantern, but removes the visibility for
    enemy models. Free-Hand: The Rig that the Hooded Lantern attaches to allows the Graver free
    hands with which to ply his trade.
  effect_i18n:
    es: >-
      Permite al Saqueador de Tumbas realizar su trabajo en privado y con las manos libres,
      disponiendo al mismo tiempo de una fuente de luz. Luz Oculta: Proporciona luz como un farol
      normal, pero impide que las miniaturas enemigas la vean. Mano Libre: El arnés al que se sujeta
      el farol con capuchón deja al Saqueador las manos libres para ejercer su oficio.
  source_refs:
  - manual: sylvania-supplement
    printed_page: 0
    section: Special Equipment / Hooded Lantern and Rig
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/grave-robbers
  combat_status: out_of_scope
- id: pry_bar
  kind: combat-equipment
  name: Pry Bar
  name_i18n:
    es: Palanqueta
  effect: >-
    Whilst acting as a club in every sense, the pry bar allows the Graver to parry attacks. Range:
    Close Combat. Strength: As User. Special Rules: Parry. Parry: Whilst acting as a club in every
    sense, the pry bar allows the Graver to parry attacks.
  effect_i18n:
    es: >-
      Aunque funciona como una maza en todos los sentidos, la palanqueta permite al Saqueador parar
      ataques. Alcance: combate cuerpo a cuerpo. Fuerza: como el usuario. Reglas Especiales: Parada.
      Parada: Aunque funciona como una maza en todos los sentidos, la palanqueta permite al
      Saqueador parar ataques.
  source_refs:
  - manual: sylvania-supplement
    printed_page: 0
    section: Special Equipment / Pry Bar
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/grave-robbers
  combat_status: out_of_scope
- id: surgeons_journal
  kind: combat-equipment
  name: Surgeon's Journal
  name_i18n:
    es: Diario del Cirujano
  effect: >-
    Written by those who have cut into far too many injured, the Journal provides the Medic with
    further insight. Skilled Hand: A Medic equipped with the Journal may modify a single dice rolled
    for Serious Injury for one friendly model by +/- 1 instead of using his Sawbones skill.
  effect_i18n:
    es: >-
      Escrito por quienes han abierto a demasiados heridos, el Diario aporta al Médico un
      conocimiento más profundo. Mano Hábil: Un Médico equipado con el Diario puede modificar en
      +1/-1 un único dado de la tirada de Herida Grave de un modelo amistoso, en lugar de usar su
      habilidad de Curandero.
  source_refs:
  - manual: sylvania-supplement
    printed_page: 0
    section: Special Equipment / Surgeon's Journal
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/grave-robbers
  combat_status: out_of_scope
- id: finger_pendant
  kind: combat-equipment
  name: Finger Pendant
  name_i18n:
    es: Colgante de Dedo
  effect: >-
    A grim trophy worn by the Grave Robbers. (No descriptive text is printed for this item beyond
    its special rule.) Death-Ward: Gives a one-time 5+ save vs. Necromantic or Dark Arts magic.
  effect_i18n:
    es: >-
      Un sombrío trofeo que lucen los Saqueadores de Tumbas. (No se imprime texto descriptivo para
      este objeto más allá de su regla especial.) Contra la Muerte: Concede una salvación de un solo
      uso de 5+ contra la magia Necromántica o de Artes Oscuras.
  source_refs:
  - manual: sylvania-supplement
    printed_page: 0
    section: Special Equipment / Finger Pendant
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/grave-robbers
  combat_status: out_of_scope
- id: chainsaw_sword
  kind: combat-equipment
  name: Chainsaw Sword
  name_i18n:
    es: Espada Motosierra
  effect: >-
    A mechanical nightmare borne of insanity, this ear-splitting device tears through armour with
    ease. Range: Close Combat. Strength: As user. Special Rules: Fear, Shredder. Fear: Incredibly
    loud and belching forth a sickly green smoke, this weapon causes even seasoned soldiers to
    quiver. A model bearing a Chainsaw Sword causes Fear. Shredder: The Chainsaw sword rips and
    chews through armour as if it were cloth. All blows from a Chainsaw Sword are at -2 Armour Save.
  effect_i18n:
    es: >-
      Una pesadilla mecánica fruto de la locura, este estruendoso artilugio desgarra la armadura con
      facilidad. Alcance: combate cuerpo a cuerpo. Fuerza: como el usuario. Reglas Especiales:
      Miedo, Trituradora. Miedo: Increíblemente ruidosa y escupiendo un humo verdoso enfermizo, esta
      arma hace temblar incluso a los soldados más curtidos. Una miniatura que lleve una Espada
      Motosierra causa Miedo. Trituradora: La Espada Motosierra desgarra y mastica la armadura como
      si fuera trapo. Todos los golpes de una Espada Motosierra reciben -2 a la salvación por
      armadura.
  source_refs:
  - manual: sylvania-supplement
    printed_page: 0
    section: Special Equipment / Chainsaw Sword
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/masters-of-horror
  combat_status: out_of_scope
- id: electric_trident
  kind: combat-equipment
  name: Electric Trident
  name_i18n:
    es: Tridente Eléctrico
  effect: >-
    Nothing quite as shocking as a poke from this little treat. Range: Close Combat. Strength: As
    user. Special Rules: Zzap!, Shocking, Nail in Boot. Zzap!: So stunning is the Electric Trident
    that a model wounded by it is considered Stunned on a roll of 2-4. Shocking: On a natural 6
    To-Hit followed by a natural 6 To-Wound, the Electric Trident discharges a field 2" around the
    target. All models (save for the bearer of the weapon) are struck with a S3 hit. Nail in Boot:
    If a D6 roll of 1 occurs on the To-Hit roll with the Trident, the bearer is struck with a S3
    hit.
  effect_i18n:
    es: >-
      Nada tan estremecedor como un pinchazo de esta pequeña delicia. Alcance: combate cuerpo a
      cuerpo. Fuerza: como el usuario. Reglas Especiales: ¡Zzap!, Conmocionante, Clavo en la Bota.
      ¡Zzzap!: El Tridente Eléctrico es tan aturdidor que una miniatura herida por él cuenta como
      Aturdida con un resultado de 2-4. Electrizante: Con un 6 natural por impactar seguido de un 6
      natural por herir, el Tridente Eléctrico descarga un campo de 2" alrededor del objetivo. Todas
      las miniaturas (salvo el portador del arma) sufren un impacto de F3. Clavo en la Bota: Si en
      la tirada por impactar con el Tridente sale un 1 en 1D6, el portador sufre un impacto de F3.
  source_refs:
  - manual: sylvania-supplement
    printed_page: 0
    section: Special Equipment / Electric Trident
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/masters-of-horror
  combat_status: out_of_scope
- id: bearcloak
  kind: combat-equipment
  name: Bearcloak
  name_i18n:
    es: Capa de Oso
  effect: >-
    A model wearing a bearcloak will gain +1 to their armour saves against all shooting attacks.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Special Equipment / Bearcloak
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/mazzalupo
  combat_status: out_of_scope
  effect_i18n:
    es: >-
      Una miniatura que lleve una capa de oso gana +1 a sus salvaciones por armadura contra todos
      los ataques de disparo.
- id: staff_of_damnation
  kind: combat-equipment
  name: Staff of Damnation
  name_i18n:
    es: Bastón de la Perdición
  effect: >-
    The preferred weapon of these ancient mages, the Staff of Damnation allows them to bear deadly
    magic against their foes. Range: Close Combat. Strength: As user. Special Rules: Two-Handed,
    Magic-well. Two-Handed: As the Staff of Damnation requires two hands to wield, a model equipped
    with it may not use a shield, buckler or secondary weapon in close combat. If the model has a
    shield it will still get a +1 bonus to its armour save against shooting. Magic-Well: A Necrarch
    Vampire may cast a spell into the Staff of Damnation during his Magic phase instead of casting
    as normal. Upon a successful casting, the spell is stored within the staff. The spell may be
    released during a later shooting phase in lieu of casting another spell.
  effect_i18n:
    es: >-
      El arma predilecta de estos magos ancestrales, el Bastón de la Perdición les permite descargar
      magia letal contra sus enemigos. Alcance: combate cuerpo a cuerpo. Fuerza: como el usuario.
      Reglas Especiales: A Dos Manos, Pozo de magia. A Dos Manos: Como el Bastón de la Perdición
      requiere dos manos para empuñarlo, una miniatura equipada con él no puede usar escudo, broquel
      ni arma secundaria en combate cuerpo a cuerpo. Si la miniatura lleva escudo, sigue recibiendo
      el bonificador de +1 a su salvación por armadura contra disparos. Pozo de Magia: Un Vampiro
      Necrarca puede lanzar un hechizo dentro del Bastón de la Perdición durante su fase de Magia en
      lugar de lanzarlo con normalidad. Si el lanzamiento tiene éxito, el hechizo queda almacenado
      en el bastón. El hechizo puede liberarse en una fase de Disparo posterior en lugar de lanzar
      otro hechizo.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Special Equipment / Staff of Damnation
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/necrarchs-the-soul-stealers
  combat_status: out_of_scope
- id: unholy_relic
  kind: combat-equipment
  name: Unholy Relic
  name_i18n:
    es: Reliquia Impía
  effect: >-
    A blasphemous artefact carried by the Necrarchs' servants. (No further rules text is printed for
    this item on the source page; it appears only in the Hero Equipment List at 15 gc.)
  effect_i18n:
    es: >-
      Un artefacto blasfemo que portan los sirvientes de los Necrarcas. (La página de origen no
      imprime más texto de reglas para este objeto; solo aparece en la Lista de Equipo de Héroes por
      15 coronas.)
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Necrarch equipment lists / Hero Equipment List / Miscellaneous Equipment (Heroes Only)
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/necrarchs-the-soul-stealers
  combat_status: out_of_scope
- id: damned_book
  kind: combat-equipment
  name: Damned Book
  name_i18n:
    es: Libro Maldito
  effect: >-
    Penned in the blood of elven maidens and written upon the flesh of virgins, the Damned Book
    perverts space about it. Cursed Aura: a model bearing the Damned Book causes all enemy models
    within 2 inches to suffer a -1 penalty to hit in close combat. Cursed Aura: A model bearing the
    Damned Book causes all enemy models within 2 inches to suffer a -1 penalty to hit in close
    combat.
  effect_i18n:
    es: >-
      Escrito con la sangre de doncellas elfas y sobre la carne de vírgenes, el Libro Maldito
      pervierte el espacio a su alrededor. Aura Maldita: una miniatura que porte el Libro Maldito
      hace que todas las miniaturas enemigas a 2 pulgadas sufran una penalización de -1 por impactar
      en combate cuerpo a cuerpo. Aura Maldita: Una miniatura que porte el Libro Maldito hace que
      todas las miniaturas enemigas a 2 pulgadas sufran una penalización de -1 por impactar en
      combate cuerpo a cuerpo.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Special Equipment / Damned Book
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/necrarchs-the-soul-stealers
  combat_status: out_of_scope
- id: kanabo
  kind: combat-equipment
  name: Kanabo
  name_i18n:
    es: Kanabo
  effect: >-
    Forged from the heartwood of ancient oaks and reinforced with iron, the Kanabo is a fearsome
    weapon wielded by Nipponese warriors, its brutal strikes crushing bone and rending armor with
    relentless force. Range: Close Combat. Strength: As user +1. Two-Handed: A model armed with a
    double-handed weapon may not use a shield, buckler or additional weapon in close combat. If the
    model is equipped with a shield he will still get a +1 bonus to his armour save against
    shooting. Concussion: Hammers and other bludgeoning weapons are excellent to use for striking
    your enemy senseless. When using a hammer, club or mace, a roll of 2-4 is treated as stunned
    when rolling to see the extent of a model's injuries.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Nippon Special Equipment / Kanabo
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/nipponese-expedition
  combat_status: out_of_scope
  effect_i18n:
    es: >-
      Forjado con el duramen de robles ancestrales y reforzado con hierro, el Kanabo es un arma
      temible empuñada por los guerreros nipones; sus brutales golpes trituran huesos y desgarran
      armaduras con fuerza implacable. Alcance: combate cuerpo a cuerpo. Fuerza: como el usuario +1.
      A Dos Manos: Una miniatura armada con un arma a dos manos no puede usar escudo, broquel ni
      arma adicional en combate cuerpo a cuerpo. Si la miniatura está equipada con escudo, seguirá
      obteniendo el bonificador de +1 a su salvación por armadura contra disparos. Conmoción: Los
      martillos y otras armas contundentes son excelentes para dejar sin sentido al enemigo. Al usar
      un martillo, garrote o maza, un resultado de 2-4 se considera aturdido al tirar para ver la
      extensión de las heridas de una miniatura.
- id: sashimono
  kind: combat-equipment
  name: Sashimono
  name_i18n:
    es: Sashimono
  effect: >-
    Emblazoned with the colors of honor and bearing the proud insignia of their clan, the Sashimono
    adorns the back of Nipponese warriors, fluttering defiantly in the wind as they march into
    battle, a symbol of their unwavering resolve and undying loyalty. Clan Banner: A model wearing a
    Sashimono can re-roll all non-rout related leadership checks but must keep the second roll.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Nippon Special Equipment / Sashimono
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/nipponese-expedition
  combat_status: out_of_scope
  effect_i18n:
    es: >-
      Decorado con los colores del honor y luciendo el orgulloso emblema de su clán, el Sashimono
      adorna la espalda de los guerreros nipones, ondeando desafiante al viento mientras marchan a
      la batalla, símbolo de su determinación inquebrantable y su lealtad eterna. Estandarte del
      Clán: Una miniatura que lleve un Sashimono puede repetir todas las pruebas de liderazgo no
      relacionadas con la huida, pero debe conservar la segunda tirada.
- id: kusarigama
  kind: combat-equipment
  name: Kusarigama
  name_i18n:
    es: Kusarigama
  effect: >-
    Forged in the crucible of martial tradition, the Kusarigama is a deadly combination of chain and
    sickle, wielded by skilled Nipponese warriors with lethal precision. Its whirling arc strikes
    fear into the hearts of foes, weaving a dance of death that leaves no opportunity for escape.
    Range: Close Combat. Strength: As user. Two-Handed: A model armed with a double-handed weapon
    may not use a shield, buckler or additional weapon in close combat. If the model is equipped
    with a shield he will still get a +1 bonus to his armour save against shooting. Cannot Be
    Parried: A model attacked by a Kusarigama may not make parries with a sword or buckler. Chain
    Strike: Due to the length of the chain attached to the weapon, a model not engaged in combat
    that has a Kusarigama can force enemies who fail a charge against them or friendlies within 3"
    to become knocked down.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Nippon Special Equipment / Kusarigama
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/nipponese-expedition
  combat_status: out_of_scope
  effect_i18n:
    es: >-
      Forjado en el crisol de la tradición marcial, el Kusarigama es una combinación letal de cadena
      y hoz, empuñada por diestros guerreros nipones con precisión letal. Su arco giratorio siembra
      el miedo en el corazón de los enemigos, tejiendo una danza de muerte que no deja oportunidad
      de escape. Alcance: combate cuerpo a cuerpo. Fuerza: como el usuario. A Dos Manos: Una
      miniatura armada con un arma a dos manos no puede usar escudo, broquel ni arma adicional en
      combate cuerpo a cuerpo. Si la miniatura está equipada con escudo, seguirá obteniendo el
      bonificador de +1 a su salvación por armadura contra disparos. No Puede Pararse: Una miniatura
      atacada por un Kusarigama no puede hacer paradas con espada ni broquel. Golpe de Cadena:
      Debido a la longitud de la cadena unida al arma, una miniatura que no esté en combate y que
      porte un Kusarigama puede hacer que los enemigos que fallen una carga contra ella, o los
      amistosos dentro de 3", queden derribados.
- id: wizards_staff
  kind: combat-equipment
  name: Wizard's Staff
  name_i18n:
    es: Bastón de Mago
  effect: >-
    Many Wizards find the use of a staff both practical for their long journeys and to defend them
    when the use of their magical arts will draw suspicion. Range: Close Combat. Strength: As User.
    Special Rules: Parry, 2 Handed, Concussion. Parry: A warrior armed with a Wizard's Staff may
    attempt to Parry a blow, just as a sword. 2 Handed: A model using a Wizard's Staff may not use a
    shield, buckler or additional weapon in close combat. If the model has a shield, it receives a
    +1 bonus to his armour save versus shooting attacks. Concussion: When using a Wizard's Staff, a
    roll of 2-4 is treated as stunned when rolling on the injury table.
  effect_i18n:
    es: >-
      A muchos Magos les resulta práctico el bastón tanto para sus largos viajes como para
      defenderse cuando el uso de sus artes mágicas podría levantar sospechas. Alcance: combate
      cuerpo a cuerpo. Fuerza: como el usuario. Reglas Especiales: Parada, A Dos Manos, Conmoción.
      Parada: Un guerrero armado con un Bastón de Mago puede intentar Parar un golpe, igual que con
      una espada. A Dos Manos: Una miniatura que use un Bastón de Mago no puede usar escudo, broquel
      ni arma adicional en combate cuerpo a cuerpo. Si la miniatura lleva escudo, recibe un
      bonificador de +1 a su salvación por armadura contra ataques de disparo. Conmoción: Al usar un
      Bastón de Mago, un resultado de 2-4 se considera aturdido al tirar en la tabla de heridas.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Special Equipment / Wizard's Staff
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/sorcerous-society
  combat_status: out_of_scope
- id: chest_talon
  kind: combat-equipment
  name: Chest Talon
  name_i18n:
    es: Garra de Pecho
  effect: >-
    Designed for the Domnu, these pick-like great weapons are ideal for pinning von Carstein
    blood-thirsters. Range: Close Combat. Strength: As User +1. Special Rules: Two-Handed,
    Heart-Pierce. Two-Handed: As the Chest Talon requires two hands to wield, a model equipped with
    it may not use a shield, buckler or secondary weapon in close combat. If the model has a shield
    he still gets a +1 bonus to his armour save against shooting. Heart-Pierce: Such is the
    destructive design of the weapon that it adds +1 to wound against a blood-thirster.
  effect_i18n:
    es: >-
      Diseñadas para el Domnu, estas armas a dos manos en forma de pico son ideales para rematar a
      los sedientos de sangre von Carstein. Alcance: combate cuerpo a cuerpo. Fuerza: como el
      usuario +1. Reglas Especiales: A Dos Manos, Perforacorazones. A Dos Manos: Como la Garra de
      Pecho requiere dos manos para empuñarla, una miniatura equipada con ella no puede usar escudo,
      broquel ni arma secundaria en combate cuerpo a cuerpo. Si la miniatura lleva escudo, sigue
      recibiendo el bonificador de +1 a su salvación por armadura contra disparos.
      Atraviesa-Corazones: Tal es el diseño destructivo del arma que suma +1 por herir contra un
      sediento de sangre.
  source_refs:
  - manual: sylvania-supplement
    printed_page: 0
    section: Special Equipment / Chest Talon
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/survivors-of-strigos
  combat_status: out_of_scope
- id: black_gold_wristbands
  kind: combat-equipment
  name: Black Gold Wristbands
  name_i18n:
    es: Brazaletes de Oro Negro
  effect: >-
    Created with dark magic of ages past, the wristbands enable the wearer to better protect himself
    from missile fire. Quickened: a model wearing Black Gold Wristbands gains a 6+ save against all
    missile-fire, including magical. This ability will stack with the Dodge skill.
  effect_i18n:
    es: >-
      Creados con la magia oscura de épocas pasadas, los brazaletes permiten a quien los lleva
      protegerse mejor del fuego de misiles. Acelerado: una miniatura que lleve Brazaletes de Oro
      Negro obtiene una salvación de 6+ contra todo fuego de misiles, incluido el mágico. Esta
      habilidad se acumula con la habilidad de Esquiva.
  source_refs:
  - manual: sylvania-supplement
    printed_page: 0
    section: Special Equipment / Black Gold Wristbands
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/survivors-of-strigos
  combat_status: out_of_scope
- id: ring_of_strigos
  kind: combat-equipment
  name: Ring of Strigos
  name_i18n:
    es: Anillo de Strigos
  effect: >-
    Forged with the blood of Necrarchs, these rings once adorned the fingers of Strigos' nobility.
    Arcane Barrier: a model wearing a Ring of Strigos gains a 6+ save versus all spells that they
    are a target of, or find themselves affected by.
  effect_i18n:
    es: >-
      Forjados con la sangre de los Necrarcas, estos anillos adornaron antaño los dedos de la
      nobleza de Strigos. Barrera Arcana: una miniatura que lleve un Anillo de Strigos obtiene una
      salvación de 6+ contra todos los hechizos de los que sea objetivo o se vea afectada.
  source_refs:
  - manual: sylvania-supplement
    printed_page: 0
    section: Special Equipment / Ring of Strigos
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/survivors-of-strigos
  combat_status: out_of_scope
- id: cursed_book
  kind: combat-equipment
  name: Cursed Book
  name_i18n:
    es: Libro Maldito
  effect: >-
    Written by spiteful Seers, the Cursed Book offers its bearer some protection against those that
    would do him harm. Cursed Aura: a model bearing the Cursed Book causes all enemy models within
    2" to suffer a -1 penalty to hit in close combat.
  effect_i18n:
    es: >-
      Escrito por Videntes rencorosos, el Libro Maldito ofrece a su portador cierta protección
      contra quienes quieran dañarlo. Aura Maldita: una miniatura que porte el Libro Maldito hace
      que todas las miniaturas enemigas a 2" sufran una penalización de -1 por impactar en combate
      cuerpo a cuerpo.
  source_refs:
  - manual: sylvania-supplement
    printed_page: 0
    section: Special Equipment / Cursed Book
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/survivors-of-strigos
  combat_status: out_of_scope
- id: silver_tip_stake
  kind: combat-equipment
  name: Silver-Tip Stake
  name_i18n:
    es: Estaca de Punta de Plata
  effect: >-
    Such is the destructive power of silver over a Vampire's form that the silver-tip stake adds +1
    to the injury roll when it causes a wound. Range: Close Combat. Strength: As User. Special
    Rules: Heart-seeker. Heart-Seeker: The silver-tip stake adds +1 to the injury roll when it
    causes a wound.
  effect_i18n:
    es: >-
      Tal es el poder destructivo de la plata sobre la forma de un Vampiro que la estaca de punta de
      plata suma +1 a la tirada de heridas cuando causa una herida. Alcance: combate cuerpo a
      cuerpo. Fuerza: como el usuario. Reglas Especiales: Buscacorazones. Busca-Corazones: La estaca
      de punta de plata suma +1 a la tirada de heridas cuando causa una herida.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Special Equipment / Silver-tip Stake
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/vampire-hunters-of-sylvania
  combat_status: out_of_scope
- id: corpse_liquor
  kind: combat-equipment
  name: Corpse Liquor
  name_i18n:
    es: Licor de Cadáver
  effect: >-
    The Strigoi distil the liquor that seeps from rotting corpses. This liquor forms the basis for a
    potent poison, which they spread on their weapons and claws. A weapon or claw coated with Corpse
    Liquor will wound its target automatically if you roll a 6 to hit. Note that you can still roll
    a dice for every wound inflicted in this way. If you roll a 6, you will inflict a critical hit
    with that roll. If you do not roll 6, you will cause a normal wound. Take armour saves as
    normal. Each purchase of poison lasts one warrior for one battle.
  effect_i18n:
    es: >-
      Los Strigoi destilan el licor que mana de los cadáveres en putrefacción. Este licor es la base
      de un veneno potente, que untan en sus armas y garras. Un arma o garra recubierta de Licor de
      Cadáver herirá automáticamente a su objetivo si sacas un 6 para impactar. Ten en cuenta que aún
      puedes tirar un dado por cada herida infligida de esta forma: si sacas un 6, ese resultado
      inflige un impacto crítico; si no sacas 6, causas una herida normal. Realiza las salvaciones de
      armadura con normalidad. Cada compra del veneno sirve para un guerrero durante una batalla.
  source_refs:
  - manual: broheim.net
    printed_page: 51
    section: Special Equipment / Corpse Liquor
    url: https://broheim.net/downloads/campaigns/karakazgal/Karak Azgal.pdf
  combat_status: out_of_scope
- id: shovel
  kind: combat-equipment
  name: Shovel
  name_i18n:
    es: Pala
  effect: A digging shovel carried by Grave Wardens. Counts as an axe in close combat.
  effect_i18n:
    es: >-
      Una pala de excavar que llevan los Guardianes de los Jardines. Cuenta como un hacha en combate
      cuerpo a cuerpo.
  source_refs:
  - manual: broheim.net
    printed_page: 2
    section: Specialists / Grave Warden / Equipment
    url: https://broheim.net/downloads/hiredswords/mutinyinmarienburg/Specialists.pdf
  combat_status: out_of_scope
- id: arcane_candelabrum
  kind: combat-equipment
  name: Arcane Candelabrum
  name_i18n:
    es: Candelabro Arcano
  effect: >-
    An Arcane Candelabrum from a holy temple. Counts as a holy relic, brazier iron and lantern that
    is used one-handed.
  effect_i18n:
    es: >-
      Un Candelabro Arcano de un templo sagrado. Cuenta como reliquia sagrada, brasero de hierro y
      farol que se usa a una mano.
  source_refs:
  - manual: broheim.net
    printed_page: 4
    section: Specialists / Sister of Sigmar / Candle Tree
    url: https://broheim.net/downloads/hiredswords/mutinyinmarienburg/Specialists.pdf
  combat_status: out_of_scope
- id: wolf_cloak
  kind: combat-equipment
  name: Wolf Cloak
  name_i18n:
    es: Capa de Lobo
  effect: A cloak made from the pelt of a wolf. The source grants it no game effect.
  effect_i18n:
    es: Una capa hecha con la piel de un lobo. La fuente no le concede ningún efecto de juego.
  source_refs:
  - manual: broheim.net
    printed_page: 3
    section: Specialists / Norse Bearman Bodyguard / Equipment
    url: https://broheim.net/downloads/hiredswords/mutinyinmarienburg/Specialists.pdf
  combat_status: out_of_scope
- id: runic_redbeards_belt_of_rage
  kind: combat-equipment
  name: Redbeard's Belt of Rage
  name_i18n:
    es: Cinturón de Ira de Barbarroja
  effect: >-
    Made in the days of the War of the Beard, this talisman turns the wearer into a cruel and
    frightening warrior. It was only worn at times of great need. A warrior wearing this amulet
    becomes subject to and always will be frenzied even if he is knocked down or stunned. He also
    adds +1 to his strength in close combat, such is the power of his fury. The wearer never leaves
    close combat under any circumstances, and will attack opponents in base contact until they are
    taken out of action. If there are any stunned or knocked down models within the wearer's charge
    range at the beginning of his turn, he will charge and attack the closest one, even if they are
    members of his own warband! Fight the hand-to-hand combat until one of the warriors is taken out
    of action.
  effect_i18n:
    es: >-
      Fabricado en los días de la Guerra de la Barba, este talismán convierte a quien lo lleva en un
      guerrero cruel y temible; solo se portaba en tiempos de gran necesidad. El guerrero que lo
      lleva sufre frenesí y siempre lo sufrirá, aunque esté derribado o aturdido. También suma +1 a
      su Fuerza en el combate cuerpo a cuerpo, tal es el poder de su furia. El portador nunca
      abandona el combate cuerpo a cuerpo bajo ninguna circunstancia, y atacará a los rivales en
      contacto hasta que queden Fuera de combate. Si al comienzo de su turno hay miniaturas
      aturdidas o derribadas dentro de su distancia de carga, cargará contra la más cercana y la
      atacará, ¡aunque sea de su propia banda! Se pelea ese combate cuerpo a cuerpo hasta que uno de
      los dos guerreros quede Fuera de combate.
  source_refs:
  - manual: broheim.net
    printed_page: 70
    section: Runic Artefacts Table / Redbeard's Belt of Rage
    url: https://broheim.net/downloads/campaigns/karakazgal/Karak Azgal.pdf
  combat_status: out_of_scope
- id: runic_eye_of_izril
  kind: combat-equipment
  name: The Eye of Izril
  name_i18n:
    es: El Ojo de Izril
  effect: >-
    In the closed tunnels of a Dwarf stronghold it is a great advantage to be able to see what is
    happening elsewhere. A lord with this amulet could hold his power against the most secretive of
    enemies. The bearer of this amulet can see all models on the table top, even if they are hidden
    or out of sight. He can guide his fellow warband members through the ruins (this allows you to
    roll two dice for the bearer after battle when rolling on the exploration chart). The bearer
    also has a 6+ ward save against all shooting attacks and strikes in close combat, as he can
    sense the attacks before they are made. All animals (such as wardogs, horses, etc) will be
    affected by frenzy when fighting against the bearer of the amulet.
  effect_i18n:
    es: >-
      En los túneles cerrados de un bastión enano es una gran ventaja poder ver lo que ocurre en
      otros lugares; un señor con este amuleto podría mantener su poder frente a los enemigos más
      sigilosos. El portador de este amuleto puede ver todas las miniaturas de la mesa, aunque estén
      ocultas o fuera de la vista, y puede guiar a sus compañeros de banda a través de las ruinas
      (esto permite lanzar dos dados por el portador tras la batalla al tirar en la tabla de
      exploración). El portador también tiene una tirada de salvación especial de 6+ contra todos
      los ataques de disparo y golpea en el combate cuerpo a cuerpo, ya que percibe los ataques
      antes de que se produzcan. Todos los animales (como perros de guerra, caballos, etc.) sufrirán
      frenesí al luchar contra el portador del amuleto.
  source_refs:
  - manual: broheim.net
    printed_page: 71
    section: Runic Artefacts Table / The Eye of Izril
    url: https://broheim.net/downloads/campaigns/karakazgal/Karak Azgal.pdf
  combat_status: out_of_scope
- id: book_of_bad_ideas
  kind: combat-equipment
  name: Book of Bad Ideas
  name_i18n:
    es: Libro de las Malas Ideas
  effect: >-
    Ancestor-weapon of the Guild of Disgraced Engineers. Leader: in the event the Expelled Engineer
    dies, he will pass the Book of Bad Ideas onto an Apprentice Engineer, who will take over the
    title of Engineer, allowing him to take the inventor special rule and hire a new apprentice.
    Dwarfs who take the book argue that if their newest idea is a great idea, then many of their
    forefathers may have also been sound — hence they take the book of bad ideas, to prove these
    inventions worthy of going down in the annals of dwarf history. 50 gc (warband equipment;
    carried, not bought separately).
  effect_i18n:
    es: >-
      Arma ancestral del Gremio de Ingenieros Deshonrados. Líder: si el Ingeniero Expulsado muere,
      legará el Libro de las Malas Ideas a un Ingeniero Aprendiz, que asumirá el título de Ingeniero,
      lo que le permite adquirir la regla especial Inventor y contratar a un nuevo aprendiz. Los
      enanos que adoptan el libro sostienen que, si su última idea es una gran idea, muchos de sus
      antepasados también debieron de estar en lo cierto; de ahí que tomen el libro de las malas
      ideas, para demostrar que estos inventos merecen pasar a los anales de la historia enana. 50 gc
      (equipo de banda; se lleva, no se compra aparte).
  source_refs:
  - manual: broheim.net
    printed_page: 3
    section: Guild of Disgraced Engineers / Book of Bad Ideas
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Guild%20Of%20Disgraced%20Engineers.pdf
  combat_status: out_of_scope
- id: manacles
  kind: combat-equipment
  name: Manacles
  name_i18n:
    es: Grilletes
  effect: >-
    A handy device for slavers made of metal, often rusted, and always uncomfortable. A new slave
    that sees the manufacturer's name or the country of origin proudly displayed on a pair of
    manacles will have a focus for his hatred for many years to come. You're mine: keep track of any
    living henchmen that a warrior equipped with manacles takes out of action; if a 1 is rolled for
    the henchmen when working out injuries he will be added to the slaver warband if he is human;
    the warrior will need to have his spirit broken and loses all experience. 20+D6 dinars, Rare 8,
    Slavers only (equipment list shows a flat 20 dinars — preserving both figures).
  effect_i18n:
    es: >-
      Un práctico artilugio para esclavistas, hecho de metal, a menudo oxidado y siempre incómodo. Un
      esclavo nuevo que vea el nombre del fabricante o el país de origen orgullosamente grabados en
      unos grilletes tendrá un foco para su odio durante muchos años. Es mío: registra cualquier
      secuaz vivo que un guerrero equipado con grilletes deje fuera de combate; si al resolver las
      heridas del secuaz sale un 1, se añadirá a la banda esclavista si es humano; el guerrero
      necesitará que le quiebren el espíritu y pierde toda su experiencia. 20+1D6 dinares, Rara 8,
      solo Esclavistas (la lista de equipo muestra 20 dinares fijos; se conservan ambas cifras).
  source_refs:
  - manual: broheim.net
    printed_page: 10
    section: Slavers special equipment / Manacles
    url: https://broheim.net/downloads/fo/97RelicsoftheCrusadesPt2.pdf
  combat_status: out_of_scope
- id: red_toof_clan_membership
  kind: combat-equipment
  name: Red Toof Clan Membership
  name_i18n:
    es: Membresía del Clan Diente Rojo
  effect: >-
    Only proving one's prowess in battle can attract the attention of this cadre of warriors. Once
    inducted, the membership can never be removed; the owner is too proud! The model will now be
    subject to the rules for Frenzy as described in the Mordheim rulebook. 40 gold crowns, Rare 9.
  effect_i18n:
    es: >-
      Solo demostrar la propia valía en combate puede atraer la atención de este grupo de guerreros.
      Una vez admitido, la membresía nunca puede retirarse; ¡su dueño es demasiado orgulloso! El
      modelo quedará ahora sujeto a las reglas de Frenesí descritas en el libro de reglas de Mordheim.
      40 coronas de oro, Rara 9.
  source_refs:
  - manual: broheim.net
    printed_page: 2
    section: Forest Goblins special equipment / Red Toof Clan Membership
    url: https://broheim.net/downloads/warbands/supplement/lustria/Forest%20Goblins.pdf
  combat_status: out_of_scope
- id: mark_of_the_old_ones
  kind: combat-equipment
  name: Mark of the Old Ones
  name_i18n:
    es: Marca de los Antiguos
  effect: >-
    This is the greatest mark a Lizardman can be born with, for these Albinos are destined for
    greatness in the eyes of their gods and other Lizardmen. The Hero may change one of his failed
    dice rolls into a successful one; this mark may only be used once per battle and only on actions
    that the Hero is making himself. You may use this mark on a failed Rout test if you wish. Sacred
    Marking: a Hero may only have a single Sacred Marking and these may only be bought when you
    recruit the Hero, not in the middle of a campaign. 50 gold crowns.
  effect_i18n:
    es: >-
      Esta es la mayor marca con la que puede nacer un hombre lagarto, pues estos Albino están
      destinados a la grandeza a los ojos de sus dioses y de los demás hombres lagarto. El Héroe puede
      convertir una de sus tiradas de dado fallidas en un éxito; esta marca solo puede usarse una vez
      por batalla y solo en acciones que el propio Héroe esté realizando. Puedes usar esta marca en un
      chequeo de Huida fallido si lo deseas. Marca Sagrada: un Héroe solo puede tener una única Marca
      Sagrada y estas solo pueden comprarse cuando reclutas al Héroe, no a mitad de campaña. 50
      coronas de oro.
  source_refs:
  - manual: broheim.net
    printed_page: 2
    section: Lizardmen Sacred Markings / Mark of the Old Ones
    url: https://broheim.net/downloads/warbands/supplement/lustria/Lizardmen.pdf
  combat_status: out_of_scope
- id: oversized_jaws
  kind: combat-equipment
  name: Oversized Jaws
  name_i18n:
    es: Mandíbulas Cremallera
  effect: >-
    The Saurus has been granted the addition of powerful neck muscles and oversized jaws, even
    greater than those of a normal Saurus. The Hero may make his bite attack at +1 Strength. Sacred
    Marking: a Hero may only have a single Sacred Marking and these may only be bought when you
    recruit the Hero, not in the middle of a campaign. (Saurus only.) 40 gold crowns.
  effect_i18n:
    es: >-
      Al Saurus se le han concedido unos poderosos músculos del cuello y unas mandíbulas descomunales,
      aún mayores que las de un Saurus normal. El Héroe puede hacer su ataque de mordisco con +1 de
      Fuerza. Marca Sagrada: un Héroe solo puede tener una única Marca Sagrada y estas solo pueden
      comprarse cuando reclutas al Héroe, no a mitad de campaña. (Solo Saurus). 40 coronas de oro.
  source_refs:
  - manual: broheim.net
    printed_page: 2
    section: Lizardmen Sacred Markings / Oversized Jaws
    url: https://broheim.net/downloads/warbands/supplement/lustria/Lizardmen.pdf
  combat_status: out_of_scope
- id: poison_glands
  kind: combat-equipment
  name: Poison Glands
  name_i18n:
    es: Glándulas Venenosas
  effect: >-
    The Skink has been gifted with glands that produce a deadly poison. The Skink may choose to
    attack with his teeth instead of his weapons. These attacks are treated just like a Saurus bite
    attack but are resolved at a +1 save modifier regardless of the Skink's Strength. In addition,
    when rolling on the injury table add +1 to the result. Sacred Marking: a Hero may only have a
    single Sacred Marking and these may only be bought when you recruit the Hero, not in the middle
    of a campaign. (Skinks only.) 40 gold crowns.
  effect_i18n:
    es: >-
      Al Skink se le han otorgado glándulas que producen un veneno letal. El Skink puede optar por
      atacar con sus dientes en lugar de con sus armas. Estos ataques se tratan igual que un ataque de
      mordisco de Saurus, pero se resuelven con un modificador de salvación de +1 independientemente
      de la Fuerza del Skink. Además, al tirar en la tabla de heridas, suma +1 al resultado. Marca
      Sagrada: un Héroe solo puede tener una única Marca Sagrada y estas solo pueden comprarse cuando
      reclutas al Héroe, no a mitad de campaña. (Solo Skinks). 40 coronas de oro.
  source_refs:
  - manual: broheim.net
    printed_page: 3
    section: Lizardmen Sacred Markings / Poison Glands
    url: https://broheim.net/downloads/warbands/supplement/lustria/Lizardmen.pdf
  combat_status: out_of_scope
- id: pneumatic_arm
  kind: combat-equipment
  name: Pneumatic Arm
  name_i18n:
    es: Brazo Neumático
  effect: >-
    Pneumatic arms fastened to harnesses allow an Engineer Adept to wield weapons well beyond his
    strength; the wearer counts as having two extra arms. The harness may hold missile weapons with
    the Unwieldy trait (Ratling Gun, Warpfire Thrower etc.), the power of the arms ignoring the
    two-model requirement. Experimental Technology: weapons manufactured by Skryre Warp Engineers
    are prone to malfunction — on a roll of 1 to hit with any missile weapon, roll on the
    Experimental Weapon Chart; if the weapon malfunctions the hit is resolved against the firer on a
    4+. 140 gc (Engineer Adept only), Rare 13.
  effect_i18n:
    es: >-
      Los brazos neumáticos fijados a arneses permiten a un Adepto Ingeniero empuñar armas muy por
      encima de su fuerza; el portador cuenta como si tuviera dos brazos extra. El arnés puede portar
      armas de misil con el rasgo Poco manejable (Ametralladora Ratling, Lanzallamas warp, etc.), y la
      potencia de los brazos ignora el requisito de dos modelos. Tecnología Experimental: las armas
      fabricadas por los Ingenieros Warp de Skryre son propensas a funcionar mal; si sacas un 1 al
      impactar con cualquier arma de misil, tira en la tabla de Armas Experimentales; si el arma
      funciona mal, el impacto se resuelve contra el tirador con un 4+. 140 gc (solo Adepto
      Ingeniero), Rara 13.
  source_refs:
  - manual: broheim.net
    printed_page: 2
    section: Metal Mongers Miscellaneous / Pneumatic arm
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Metal%20Mongers.pdf
  combat_status: out_of_scope
- id: marienburg_map
  kind: combat-equipment
  name: Marienburg Map
  name_i18n:
    es: Mapa de Marienburgo
  effect: >-
    A detailed chart of the canals, wards and alleyways of Marienburg carried by the City Watch.
    Watchmen listed equipment; no separate special-rules paragraph is printed beyond the list entry.
    20 gc.
  effect_i18n:
    es: >-
      Una carta detallada de los canales, los distritos y los callejones de Marienburgo que lleva la
      Guardia Urbana. Equipo listado de los Guardias; no se imprime ningún párrafo de reglas
      especiales aparte de la entrada de la lista. 20 gc.
  source_refs:
  - manual: broheim.net
    printed_page: 3
    section: Watchmen Miscellaneous Equipment / Marienburg Map
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Watchmen.pdf
  combat_status: out_of_scope
- id: falconry_glove
  kind: combat-equipment
  name: Falconry Glove
  name_i18n:
    es: Guante de Cetrería
  effect: >-
    A leather or mesh glove worn to protect the falconer's arm. A warrior using a hunting bird
    without a falconry glove must roll on the Serious Injury chart in the post battle sequence.
    (Sergeants only). 10 gc.
  effect_i18n:
    es: >-
      Guante de cuero o de malla que se lleva para proteger el brazo del cetrero. Un guerrero que use
      un ave de cetrería sin un guante de cetrería debe tirar en la tabla de Heridas Graves en la
      secuencia posterior a la batalla. (Solo Sargentos). 10 gc.
  source_refs:
  - manual: broheim.net
    printed_page: 3
    section: Watchmen Miscellaneous Equipment / Falconry glove
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Watchmen.pdf
  combat_status: out_of_scope
- id: horn_of_the_wild_hunt
  kind: combat-equipment
  name: Horn of the Wild Hunt
  name_i18n:
    es: Cuerno de la Cacería Salvaje
  effect: >-
    Before each battle the Branch Nymph may take a Leadership test to blow the horn. If they are
    successful, roll on the table below; these animals will fight for the warband and leave once the
    battle has finished; they do not count towards your rout test or warband max. D6: 1 nothing
    answers the call; 2 D3+1 Hunting Hounds appear; 3 a Tiger joins the battle; 4 a Bear joins the
    battle; 5 a Great Stag joins the battle; 6 a Great Eagle joins. 120 gold crowns (description,
    printed page 2) vs 110 gc (equipment list) — preserving the source discrepancy. Rare 12 (Branch
    Nymph only).
  effect_i18n:
    es: >-
      Antes de cada batalla la Branch Nymph puede hacer un chequeo de Liderazgo para soplar el cuerno.
      Si lo supera, tira en la tabla siguiente; estos animales lucharán para la banda y se marcharán
      cuando termine la batalla; no cuentan para tu chequeo de Huida ni para el máximo de la banda.
      1D6: 1 nada responde a la llamada; 2 aparecen 1D3+1 Sabuesos de Caza; 3 se une a la batalla un
      Tigre; 4 se une a la batalla un Oso; 5 se une a la batalla un Gran Ciervo; 6 se une un Gran
      Águila. 120 coronas de oro (descripción, página impresa 2) frente a 110 gc (lista de equipo) —
      se conserva la discrepancia de la fuente. Rara 12 (solo Branch Nymph).
  source_refs:
  - manual: broheim.net
    printed_page: 2
    section: Special equipment / Horn of the hunt
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Fen%20Guard.pdf
  - manual: broheim.net
    printed_page: 2
    section: Fen Guard Miscellaneous Equipment / Horn of the Wild Hunt
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Fen%20Guard.pdf
  combat_status: out_of_scope
- id: magic_acorn
  kind: combat-equipment
  name: Magic Acorn
  name_i18n:
    es: Bellota Mágica
  effect: >-
    An arcane enchantment of premonition has been woven into this golden acorn by the Spellsingers
    of Laurelorn Forest. With the sparkling acorn tucked snugly in his breast pocket the carrier is
    imbued with great fortune in a fight: in the first round of every close combat the Hero
    automatically hits with a single attack that was rolled as a miss. 250 gold crowns, Rare 15
    (Militiant Mootlanders text) vs 100 gc (Fen Guard equipment list) — preserving the source
    discrepancy; review owner should reconcile.
  effect_i18n:
    es: >-
      Los Cantores de Hechizos del Bosque de Laurelorn han tejido un arcano encantamiento de
      premonición en esta bellota dorada. Con la centelleante bellota bien guardada en su bolsillo del
      pecho, el portador queda imbuido de una gran fortuna en la pelea: en la primera ronda de cada
      combate cuerpo a cuerpo, el Héroe impacta automáticamente con un único ataque que se haya tirado
      como fallo. 250 coronas de oro, Rara 15 (texto de los Mootlander Belicosos) frente a 100 gc
      (lista de equipo de la Guardia del Ciénaga) — se conserva la discrepancia de la fuente; el
      responsable de la revisión debería reconciliarla.
  source_refs:
  - manual: broheim.net
    printed_page: 2
    section: Militiant Mootlanders special equipment / Magic Acorn
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Militiant%20Mootlanders.pdf
  - manual: broheim.net
    printed_page: 2
    section: Fen Guard Miscellaneous Equipment / Magic Acorn
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Fen%20Guard.pdf
  combat_status: out_of_scope
- id: thiefs_cloak
  kind: combat-equipment
  name: Thief's Cloak
  name_i18n:
    es: Capa del Ladrón
  effect: >-
    Thieves wear cloaks that help them blend in with their surroundings and can disguise them very
    well in both the desert and the towns. The distance required to spot a warrior wearing a Thief's
    cloak when hidden is doubled. 15 gold crowns, Rare 9.
  effect_i18n:
    es: >-
      Los ladrones llevan capas que les ayudan a camuflarse con su entorno y pueden disfrazarlos muy
      bien tanto en el desierto como en las ciudades. La distancia necesaria para detectar a un
      guerrero que lleve una Capa del Ladrón cuando está oculto se duplica. 15 coronas de oro, Rara 9.
  source_refs:
  - manual: broheim.net
    printed_page: 2
    section: Low Kings special equipment / Thief's cloak
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Low%20Kings.pdf
  combat_status: out_of_scope
- id: fences_iron_strongbox
  kind: combat-equipment
  name: Fence's Iron Strongbox
  name_i18n:
    es: Caja Fuerte de Hierro del Receptor
  effect: >-
    The strongbox has a hidden compartment providing storage space for a fence to smuggle goods past
    watch patrols and excise men. One item can be concealed inside the iron strongbox; a wyrdstone
    item can be sealed in this way, meaning its hazardous side-effects may be ignored by the bearer.
    The strongbox never leaves the possession of the warband but it cannot be used unless the
    warband includes a Fence. Two models are required to move the strongbox. 30 gold crowns, Rare 10
    (Fence only).
  effect_i18n:
    es: >-
      La caja fuerte tiene un compartimento oculto que da espacio de almacenamiento para que un
      Receptor pase mercancías de contrabando ante las patrullas de la guardia y los recaudadores. Se
      puede ocultar un objeto dentro de la caja fuerte de hierro; un objeto de piedra bruja puede
      precintarse así, lo que significa que su portador puede ignorar sus peligrosos efectos
      secundarios. La caja fuerte nunca abandona la posesión de la banda, pero no puede usarse a menos
      que la banda incluya un Receptor. Se necesitan dos modelos para mover la caja fuerte. 30 coronas
      de oro, Rara 10 (solo Receptor).
  source_refs:
  - manual: broheim.net
    printed_page: 2
    section: Low Kings special equipment / Fence's iron strongbox
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Low%20Kings.pdf
  combat_status: out_of_scope
- id: stromfels_heart
  kind: combat-equipment
  name: Stromfels Heart
  name_i18n:
    es: Corazón de Stromfels
  effect: >-
    Old pirates tell of mutant followers of Stromfels who became possessed and took on the aspect of
    the Shark God through the use of a cursed trinket in a ritual. Damned artefacts called
    Stromfels' heart were cast from Dwarf gold. In becoming the harbinger, the mutant seaman wearing
    Stromfels heart transforms, distorting and thickening into an iron grey-skinned representation
    of the Storm God: a razor-teethed, shark-mouthed octopoid monstrosity with python-thick
    tentacles. Harbinger: a Hero with Stromfels Heart becomes a Stromfels Harbinger by visiting an
    Altar to Stromfels; if three or more captives were sacrificed when rolling on the Ceremony of
    Sacrifice Chart in the post battle sequence the transformation occurs. The Harbinger is immune
    to psychology, cannot carry weapons and has the following mutations: blackblood, prehensile
    tail, tentacle, mer-creature, eye stalks (counts as hideous) and suckers; the Harbinger has a
    Massive Beak (Mordheim Annual p.35). Profile while transformed: M6 WS5 BS0 S5 T6 W4 I4 A4 Ld8.
    If the Harbinger is taken out of action the Stromfels Heart is considered lost and the
    transformation is reversed. 40 gold crowns (Stromfels Reavers only), Rare 10.
  effect_i18n:
    es: >-
      Los viejos piratas hablan de seguidores mutantes de Stromfels que quedaron poseídos y adoptaron
      el aspecto del Dios Tiburón mediante el uso de un amuleto maldito en un ritual. Los artefactos
      malditos llamados Corazón de Stromfels se fundieron con oro enano. Al convertirse en el heraldo,
      el marinero mutante que lleva el Corazón de Stromfels se transforma, distorsionándose y
      engrosando hasta convertirse en una representación de gris hierro del Dios de la Tormenta: una
      monstruosidad octopoide de dientes afilados y boca de tiburón, con tentáculos gruesos como
      pitones. Heraldo: un Héroe con el Corazón de Stromfels se convierte en un Heraldo de Stromfels
      al visitar un Altar de Stromfels; si se sacrificaron tres o más cautivos al tirar en la tabla de
      la Ceremonia de Sacrificio en la secuencia posterior a la batalla, la transformación ocurre. El
      Heraldo es inmune a la psicología, no puede llevar armas y tiene las siguientes mutaciones:
      sangre negra, cola prensil, tentáculo, criatura marina, pedúnculos oculares (cuenta como
      repugnante) y ventosas; el Heraldo tiene un Pico Enorme (Mordheim Annual p.35). Perfil mientras
      está transformado: M6 WS5 BS0 S5 T6 W4 I4 A4 Ld8. Si el Heraldo queda fuera de combate, el
      Corazón de Stromfels se considera perdido y la transformación se invierte. 40 coronas de oro
      (solo Saqueadores de Stromfels), Rara 10.
  source_refs:
  - manual: broheim.net
    printed_page: 2
    section: Shallows Beasts special equipment / Stromfels heart
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Shallows%20Beasts.pdf
  combat_status: out_of_scope
- id: shark_tooth_necklace
  kind: combat-equipment
  name: Shark Tooth Necklace
  name_i18n:
    es: Collar de Dientes de Tiburón
  effect: >-
    The rattling teeth are parts of Stromfels — parts of his power! Priests of Stromfels wear
    mouthfuls of shark teeth strung on a grisly necklace. Stromfels Luck: instead of searching for a
    rare item during the post battle sequence, the Mutant-Priest may visit the city to recruit
    sailors into the cult; teeth from the necklace are given as charms used to place a hex on the
    sailors. Roll 2D6: 2 the Priest gets arrested by the City Watch (roll on the Conviction Chart);
    3-6 nothing happens; 7-9 recruit one Wrecker; 10-11 recruit D3 Wreckers into the cult; 12
    recruit three Wreckers! Wreckers recruited form a new Henchman group for no additional cost;
    equipment must be paid for as normal. Stromfels Guest: if a Mutant-Priest is wearing the
    necklace it can be used to ensnare warriors that fall under Stromfels' influence (per the Chaos
    ritual 'Lure of Chaos', Mordheim Rulebook p.59); unless the Cult of Stromfels routs, any model
    the Priest gained control of when the game ends is captured by Stromfels Reavers. 25 gold crowns
    (Mutant-Priest of Stromfels only), Rare 8.
  effect_i18n:
    es: >-
      Los dientes que traquetean son partes de Stromfels, ¡partes de su poder! Los sacerdotes de
      Stromfels llevan bocanadas de dientes de tiburón ensartados en un collar macabro. Fortuna de
      Stromfels: en lugar de buscar un objeto raro durante la secuencia posterior a la batalla, el
      Sacerdote Mutante puede visitar la ciudad para reclutar marineros para el culto; los dientes del
      collar se entregan como amuletos usados para lanzar un maleficio a los marineros. Tira 2D6: 2 el
      Sacerdote es detenido por la Guardia Urbana (tira en la tabla de Convicción); 3-6 no pasa nada;
      7-9 recluta un Naufragador; 10-11 recluta 1D3 Naufragadores para el culto; 12 ¡recluta tres
      Naufragadores! Los Naufragadores reclutados forman un nuevo grupo de Secuaces sin coste
      adicional; el equipo debe pagarse con normalidad. Invitado de Stromfels: si un Sacerdote Mutante
      lleva el collar, puede usarse para atrapar a guerreros que caigan bajo la influencia de
      Stromfels (según el ritual del Caos 'Señuelo del Caos', libro de reglas de Mordheim p.59); a
      menos que el Culto de Stromfels huya, cualquier modelo cuyo control haya ganado el Sacerdote
      cuando acabe la partida queda capturado por los Saqueadores de Stromfels. 25 coronas de oro
      (solo Sacerdote Mutante de Stromfels), Rara 8.
  source_refs:
  - manual: broheim.net
    printed_page: 2
    section: Shallows Beasts special equipment / Shark-tooth necklace
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Shallows%20Beasts.pdf
  combat_status: out_of_scope
- id: scrimshaw_bauble
  kind: combat-equipment
  name: Scrimshaw Bauble
  name_i18n:
    es: Amuleto de Escrimshaw
  effect: >-
    An engraved article of whale ivory, whalebone, or walrus tusks, caught by whalers, usually
    carved into the shape of an albatross or sea creature then enchanted by a priest of Manann or
    the shamans of Norsca. The bauble is supposed to protect the wearer from monsters of the deep. A
    Hero wearing a Scrimshaw Bauble receives a special 4+ save against attacks made by models if
    they are aquatic; the bauble's special save is never modified by armour or negated by critical
    hit results. 40 gold crowns, Rare 11.
  effect_i18n:
    es: >-
      Un artículo grabado de marfil de ballena, hueso de ballena o colmillos de morsa, capturado por
      los balleneros, tallado normalmente en forma de albatros o de criatura marina y luego encantado
      por un sacerdote de Manann o por los chamanes de Norsca. Se supone que el amuleto protege a su
      portador de los monstruos de las profundidades. Un Héroe que lleve un Amuleto de Escrimshaw
      recibe una salvación especial de 4+ contra los ataques hechos por modelos si son acuáticos; la
      salvación especial del amuleto nunca es modificada por la armadura ni anulada por resultados de
      impacto crítico. 40 coronas de oro, Rara 11.
  source_refs:
  - manual: broheim.net
    printed_page: 2
    section: Shallows Beasts special equipment / Scrimshaw bauble
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Shallows%20Beasts.pdf
  combat_status: out_of_scope
- id: lyre
  kind: combat-equipment
  name: Lyre
  name_i18n:
    es: Lira
  effect: >-
    Elven lyre listed among the Sea Ghosts miscellaneous equipment; no separate special-rules
    paragraph is printed beyond the list entry (asterisked, hero-restricted). 15 gc.
  effect_i18n:
    es: >-
      Lira élfica listada entre el equipo misceláneo de los Fantasmas del Mar; no se imprime ningún
      párrafo de reglas especiales aparte de la entrada de la lista (marcada con asterisco,
      restringida a héroes). 15 gc.
  source_refs:
  - manual: broheim.net
    printed_page: 3
    section: Sea Ghosts Miscellaneous Equipment / Lyre
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Sea%20Ghosts.pdf
  combat_status: out_of_scope
- id: wolf_pelt_cloak
  kind: combat-equipment
  name: White Wolf Pelt Cloak
  name_i18n:
    es: Capa de Piel de Lobo Blanco
  effect: >-
    Wolf-Priests of Ulric may never wear armour, trusting in Ulric's protection. The only exception
    is that every Wolf-Priest is garbed in a cloak made from the pelt of a white wolf; the pelt
    allows a 6+ saving throw.
  effect_i18n:
    es: >-
      Los Sacerdotes Lobo de Ulric nunca pueden llevar armadura, confiando en la protección de
      Ulric. La única excepción es que cada Sacerdote Lobo viste una capa hecha con la piel de un
      lobo blanco; la piel concede una tirada de salvación de 6+.
  source_refs:
  - manual: liber-malefic
    printed_page: 9
    section: Wolf-Priest of Ulric / Strictures
    url: https://www.scribd.com/document/241727651/Miracle-workers-in-Mordheim
  combat_status: out_of_scope
- id: warpaint
  kind: combat-equipment
  name: Warpaint
  name_i18n:
    es: Pintura de Guerra
  effect: >-
    Some Savage Orcs decorate themselves with warpaint (either blue, red or white). While wearing
    the warpaint, the Orc believes that Mork protects him and he gains a 6+ invulnerable save. One
    use only. Also useable by Savage Goblin Boyz. 5 gc, Rare 6.
  effect_i18n:
    es: >-
      Algunos Orkos Salvajes se decoran con pintura de guerra (azul, roja o blanca). Mientras lleva la
      pintura de guerra, el Orko cree que Mork lo protege y obtiene una salvación invulnerable de 6+.
      Un solo uso. También pueden usarla los Goblins Salvajes Boyz. 5 gc, Rara 6.
  source_refs:
  - manual: broheim.net
    printed_page: 59
    section: Special Equipment / Warpaint
    url: https://broheim.net/downloads/campaigns/karakazgal/Karak Azgal.pdf
  combat_status: out_of_scope
- id: effigy_of_mork
  kind: combat-equipment
  name: Effigy of Mork
  name_i18n:
    es: Efigie de Mork
  effect: >-
    The Effigy of Mork allows the bearer to ignore the first hit against him in battle. In addition
    its presence allows a re-roll for the first Leadership test anyone in the warband has to make.
    If carried by Da Boss, the Effigy allows the first Rout test to be re-rolled, providing its
    powers had not already been used during the battle. A Savage Orc who carries an Effigy of Mork
    believes he is divinely protected and would never carry a Lucky Charm or Holy Relic. 30 gc, Rare
    7.
  effect_i18n:
    es: >-
      La Efigie de Mork permite a su portador ignorar el primer impacto que reciba en la batalla.
      Además, su presencia permite repetir la primera tirada de Liderazgo que tenga que hacer
      cualquier miembro de la banda. Si la lleva Da Boss, la Efigie permite repetir el primer chequeo
      de Huida, siempre que sus poderes no se hayan usado ya durante la batalla. Un Orko Salvaje que
      porte una Efigie de Mork cree estar protegido por los dioses y jamás llevaría un Amuleto de la
      Suerte ni una Reliquia Sagrada. 30 gc, Rara 7.
  source_refs:
  - manual: broheim.net
    printed_page: 59
    section: Special Equipment / Effigy of Mork
    url: https://broheim.net/downloads/campaigns/karakazgal/Karak Azgal.pdf
  combat_status: out_of_scope
- id: orichalcum_token
  kind: combat-equipment
  name: Orichalcum Token
  name_i18n:
    es: Ficha de Oricalco
  effect: >-
    Moonstone infusion: the hero may temporarily enhance the power supply of a clockwork construct
    with some orichalcum tokens; before the game you may increase any characteristic besides
    Toughness and Wounds of a single construct by 1 per used token. Each characteristic may be
    increased only once and lasts for a single game. 10 gc.
  effect_i18n:
    es: >-
      Infusión de piedra lunar: el héroe puede mejorar temporalmente la fuente de energía de una
      construcción de relojería con algunas fichas de oricalco; antes de la partida puedes aumentar en
      1, por cada ficha usada, cualquier característica excepto Resistencia y Heridas de una única
