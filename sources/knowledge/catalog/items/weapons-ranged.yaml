- id: javelin
  kind: ranged-weapon
  name: Javelin
  name_i18n:
    es: Jabalina
  effect: >-
    Range: 8" Strength: As user Thrown weapon : Javelins are thrown weapons and the warrior suffers
    no penalty for range or moving. There are entries for Javelin in TC #11, #14, #21, #23 and
    Border Town Burning. In all those issues there are no less than four different versions for the
    javelins' thrown weapon special rule and range. It was decided to use the thrown weapon rule
    from the original rulebook (used by throwing knives, blessed water, net, etc), which ignores
    both moving and range. This is the same as the most recent version of Javelins. 4 out of 5
    sources used 8" range, so this was decided as the norm (only new Pit Fighters had 10", whereas
    the Norse, Lizardmen, old Pit Fighters, and Amazons all are 8").
  effect_i18n:
    es: >-
      Alcance: 8" Fuerza: Como usuario Arma arrojadiza: Las jabalinas son armas arrojadizas y el
      guerrero no sufre ninguna penalización por alcance o movimiento. Hay entradas para Javelin en
      TC #11, #14, #21, #23 y Border Town Burning. En todos esos números hay no menos de cuatro
      versiones diferentes para la regla y el alcance especial del arma arrojadiza de las jabalinas.
      Se decidió usar la regla de arma arrojadiza del libro de reglas original (utilizada para
      arrojar cuchillos, agua bendita, red, etc.), que ignora tanto el movimiento como el alcance.
      Esto es lo mismo que la versión más reciente de Javelins. 4 de cada 5 fuentes usaban un
      alcance de 8", por lo que se decidió como la norma (solo los nuevos Pit Fighter tenían 10",
      mientras que los nórdicos, los hombres lagarto, los antiguos Pit Fighter y las Amazonas son
      todos de 8").
