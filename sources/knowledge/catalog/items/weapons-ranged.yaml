  name: Ulthar's Bow of Seeking
  name_i18n:
    es: Balsa Buscadora de Ulthar
  effect: >-
    The crossbow was made for Ulthar Grudgbringer, a noble of Karak Haskal. It is not known how it
    got here. A bolt shot from this bow will seek its target. It will always hit on a 2+
    irrespective of ballistic skill, cover or any other modifiers. The shooter may choose any target
