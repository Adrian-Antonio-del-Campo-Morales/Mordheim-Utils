  kind: ranged-weapon
  tags:
  - blackpowder
  name: Double Barrelled Pistol
  name_i18n:
    es: Pistola de Dos Cañones
  effect: >-
    Range: 6" Strength: 4 Prepare Shot : A pistol takes a complete turn to reload ❓ , so your model
    may only fire every other turn. If he has a brace of pistols he may fire every turn.
  effect_i18n:
    es: >-
      Alcance: 6" Fuerza: 4 Preparar disparo: una pistola necesita un turno completo para recargarse
      ❓, por lo que tu modelo solo puede disparar cada dos turnos. Si tiene un par de pistolas,
