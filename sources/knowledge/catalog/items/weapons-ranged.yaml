- id: crossbow_pistol
  kind: ranged-weapon
  tags:
  - blackpowder
  name: Crossbow Pistol
  name_i18n:
    es: Pistola Ballesta
  effect: >-
    Range: 10" Strength: 4 Shoot In Hand-To-Hand Combat : A model armed with a crossbow pistol may
    shoot it in the first round of a hand-to-hand combat and this shot is always resolved first,
    before any blows are struck. This shot has an extra -2 to hit penalty. Use model's Ballistic
    Skill to see whether it hits or not. ❓ This bonus attack is in addition to any close combat
    weapon attacks. ✏️
  effect_i18n:
    es: >-
      Alcance: 10" Fuerza: 4 Disparar en combate cuerpo a cuerpo: un modelo armado con una pistola
      ballesta puede dispararla en la primera ronda de un combate cuerpo a cuerpo y este disparo
      siempre se resuelve primero, antes de que se realice cualquier golpe. Este disparo tiene una
      penalización adicional de -2 al impactar. Usa la habilidad balística del modelo para ver si
      impacta o no. ❓ Este ataque adicional se suma a cualquier ataque con arma de combate cuerpo a
      cuerpo. ✏️
  source_refs:
  - &id043
    manual: mordheimer.net
    printed_page: 0
    section: Dark Elf Equipment List
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/dark-elves
  - *id015
  combat_status: out_of_scope
- id: double_barrelled_duelling_pistol
  kind: ranged-weapon
  tags:
  - blackpowder
  name: Double Barrelled Duelling Pistol
  name_i18n:
    es: Pistola Duelo de Dos Cañones
  effect: >-
    Range: 9" Strength: 4 Accuracy : A duelling pistol is built for accuracy as a skilled duellist
    is able to hit a coin from twenty paces. All shots and close combat attacks from a duelling
    pistol have a +1 bonus to hit.
  effect_i18n:
    es: >-
      Alcance: 9" Fuerza: 4 Precisión: Una pistola de duelo está diseñada para brindar precisión, ya
      que un duelista experto puede golpear una moneda desde veinte pasos. Todos los disparos y
      ataques de combate cuerpo a cuerpo de una pistola de duelo tienen una bonificación de +1 al
      impacto.
  source_refs:
  - &id016
    manual: mordheimer.net
    printed_page: 0
    section: Gunnery School equipment lists
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/gunnery-school-of-nuln
  combat_status: out_of_scope
- id: double_barrelled_handgun
  kind: ranged-weapon
  tags:
  - blackpowder
  name: Double Barrelled Handgun
  name_i18n:
    es: Ardilagana de Dos Cañones
  effect: >-
    Range: 24" Strength: 4 Prepare shot : A handgun takes a complete turn to reload ❓ , so you may
    only fire it every other turn.
  effect_i18n:
    es: >-
      Alcance: 24" Fuerza: 4 Preparar el tiro: una pistola necesita un turno completo para
      recargarse ❓, por lo que solo puedes dispararla cada dos turnos.
  source_refs:
  - *id016
  - *id017
  combat_status: out_of_scope
- id: double_barrelled_hunting_rifle
  kind: ranged-weapon
  tags:
  - blackpowder
  name: Double Barrelled Hunting Rifle
  name_i18n:
    es: Rifle de Caza de Dos Cañones
  effect: >-
    Range: 48" Strength: 4 A double-barrelled gun (of any sort) is treated exactly like a normal
    version with one exception. Any enemy is hit by two blasts rather than one (ie, a pistol causes
    two S4 hits rather than one for each successful hit). However, each barrel takes a full turn to
    reload ❓ (although if you reload only one barrel you can fire it like a normal pistol/rifle). If
    you own a brace of double-barreled pistols you may fire them every other round (rather than
    every round like a normal brace).
  effect_i18n:
    es: >-
      Alcance: 48" Fuerza: 4 Un arma de dos cañones (de cualquier tipo) se trata exactamente como
      una versión normal con una excepción. Cualquier enemigo recibe dos disparos en lugar de uno
      (es decir, una pistola causa dos impactos S4 en lugar de uno por cada impacto exitoso). Sin
      embargo, cada cañón necesita un turno completo para recargarse ❓ (aunque si recargas solo un
      cañón puedes dispararlo como una pistola/rifle normal). Si tienes un par de pistolas de dos
      cañones, puedes disparar úselos cada dos rondas (en lugar de cada ronda como un aparato
      ortopédico normal).
  source_refs:
  - *id003
  combat_status: out_of_scope
