  name_i18n:
    es: Jabalina Nehekarana
  effect: >-
    Range: 8" Strength: As user +1 to hit : These javelins receive +1 to hit when thrown. Note that
    the original writing merely had a +1 to hit included. Normal javelins are thrown weapons and the
    warrior suffers no penalty for range or moving, it is suggested to combine the rules for a
    normal javelin with the +1 to hit.
