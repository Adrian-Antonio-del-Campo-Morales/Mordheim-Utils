      de salvación -2. Prepara el disparo: una pistola tarda un turno entero en recargarse, así que
      solo puedes disparar en turnos alternos (una pareja puede disparar cada turno). Cuerpo a cuerpo:
      puede usarse en combate cuerpo a cuerpo; un modelo armado con una pistola y otra arma de combate
      gana +1 Ataque resuelto a Fuerza 4 con un modificador de salvación de -2, utilizable una vez por
      combate. 35 gc (70 por una pareja).
  source_refs:
