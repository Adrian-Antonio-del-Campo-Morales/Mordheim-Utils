- id: harpoon
  kind: ranged-weapon
  name: Harpoon (Javelin)
  name_i18n:
    es: Arpón (Jabalina)
  effect: >-
    Whaling harpoon usable as a thrown javelin; listed as "Harpoon (Javelin)" in the Khorne Raiders
