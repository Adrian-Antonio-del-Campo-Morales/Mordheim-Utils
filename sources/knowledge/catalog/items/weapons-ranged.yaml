- id: crossbow_pistol
  kind: ranged-weapon
  name: Crossbow Pistol
  name_i18n:
    es: Pistola Ballesta
  effect: >-
    Range: 10" Strength: 4 Shoot In Hand-To-Hand Combat : A model armed with a crossbow pistol may
    shoot it in the first round of a hand-to-hand combat and this shot is always resolved first,
    before any blows are struck. This shot has an extra -2 to hit penalty. Use model's Ballistic
    Skill to see whether it hits or not. ❓ This bonus attack is in addition to any close combat
    weapon attacks. ✏️
  effect_i18n:
    es: >-
      Alcance: 10" Fuerza: 4 Disparar en combate cuerpo a cuerpo: un modelo armado con una pistola
      ballesta puede dispararla en la primera ronda de un combate cuerpo a cuerpo y este disparo
      siempre se resuelve primero, antes de que se realice cualquier golpe. Este disparo tiene una
      penalización adicional de -2 al impactar. Usa la habilidad balística del modelo para ver si
      impacta o no. ❓ Este ataque adicional se suma a cualquier ataque con arma de combate cuerpo a
      cuerpo. ✏️
  source_refs:
  - &id043
    manual: mordheimer.net
    printed_page: 0
    section: Dark Elf Equipment List
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/dark-elves
  - *id015
  combat_status: out_of_scope
- id: double_barrelled_duelling_pistol
  kind: ranged-weapon
  name: Double Barrelled Duelling Pistol
  name_i18n:
    es: Pistola Duelo de Dos Cañones
  effect: >-
    Range: 9" Strength: 4 Accuracy : A duelling pistol is built for accuracy as a skilled duellist
    is able to hit a coin from twenty paces. All shots and close combat attacks from a duelling
    pistol have a +1 bonus to hit.
  effect_i18n:
    es: >-
      Alcance: 9" Fuerza: 4 Precisión: Una pistola de duelo está diseñada para brindar precisión, ya
      que un duelista experto puede golpear una moneda desde veinte pasos. Todos los disparos y
      ataques de combate cuerpo a cuerpo de una pistola de duelo tienen una bonificación de +1 al
      impacto.
  source_refs:
  - &id016
    manual: mordheimer.net
