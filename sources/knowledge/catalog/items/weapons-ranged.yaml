- id: repeater_pistol_moh
  kind: ranged-weapon
  tags:
  - blackpowder
  name: Repeater Pistol (Masters of Horror)
  name_i18n:
    es: Pistola de Repetición (Maestros del Horror)
  effect: >-
    A dangerous weapon to those on both ends of the pistol. One always goes out with a Bang! Range:
    8". Strength: 4. Special Rules: -2 Armour Save, Too Much Tinkering, Repeater. This is the
    Masters of Horror variant of the trading-post Repeater Pistol; it has a longer range (8" instead
    of 6") and unique tinkering and repeater mechanics. Save Modifier: Pistols are even better at
    penetrating armour than their Strength of 4 suggests. A model taking a wound from a Repeater
    Pistol must take its armour save at -2. Too Much Tinkering: The Repeater Pistol is a heavily
    modified weapon. To represent its unstable mechanics, each time the trigger is pulled, you must
    roll a D6. On a roll of 4+, the pistol works fine. On a roll of 2-3, the pistol does nothing.
    One a roll of 1, roll on the "Misfire" Chart. Repeater: The Repeater Pistol has the possibility
    of firing more than once during the Shooting phase. For each additional shot, you must roll a D6
    at -1 on the above table. For example, for one shot, you must roll a 4+, with a roll of a 1
    forcing a roll on the Misfire Table. For a second shot, you need a 5+, with a roll of 1-2
    forcing a roll on the misfire table. Of course, it is impossible to attempt more than 3 shots
    per round.
  effect_i18n:
    es: >-
      Un arma peligrosa para quienes están en ambos extremos de la pistola. Siempre acaba con ¡un
      estampido! Alcance: 8". Fuerza: 4. Reglas Especiales: -2 Salvación por Armadura, Demasiados
      Retoques, Repetición. Esta es la variante de los Maestros del Horror de la Pistola de
      Repetición del puesto comercial; tiene mayor alcance (8" en lugar de 6") y mecánicas únicas de
      retoques y repetición. Modificador de Salvación: Las pistolas perforan la armadura aún mejor
      de lo que sugiere su Fuerza de 4. Una miniatura que sufra una herida de una Pistola de
      Repetición debe hacer su salvación por armadura con -2. Demasiados Trucos: La Pistola de
      Repetición es un arma fuertemente modificada. Para representar su mecánica inestable, cada vez
      que se aprieta el gatillo debes tirar 1D6: con un 4+ la pistola funciona bien; con un 2-3 la
      pistola no hace nada; con un 1, tira en la tabla de «Fallo de disparo». Repetidora: La Pistola
      de Repetición puede disparar más de una vez durante la fase de Disparo. Por cada disparo
      adicional debes tirar 1D6 con -1 en la tabla anterior. Por ejemplo, para un disparo necesitas
      un 4+, y un 1 obliga a tirar en la tabla de Fallo de Disparo; para un segundo disparo
      necesitas un 5+, y un 1-2 obliga a tirar en la tabla de fallo de disparo. Por supuesto, es
      imposible intentar más de 3 disparos por ronda.
  source_refs:
  - manual: sylvania-supplement
    printed_page: 0
    section: Special Equipment / Repeater Pistol
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/masters-of-horror
  combat_status: out_of_scope
