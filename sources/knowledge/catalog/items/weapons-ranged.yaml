  combat_status: out_of_scope
- id: fire_stick
  kind: ranged-weapon
  name: Fire-Stick
  name_i18n:
    es: Palo de Fuego
  effect: >-
    Being almost perfectly trained in mystical arts, the Fire-Eater spits fire upon his enemies in
    the shooting phase. Use the teardrop shaped flame template to determine which models suffer an
    automatic Strength 4 hit. In addition, any models hit are set on fire on a roll of 4+ (see Fire
    Rules). Fire-Eaters can use this breath attack even when engaged in close combat.
  effect_i18n:
    es: >-
      Al estar entrenado casi a la perfección en las artes místicas, el Traga Fuego escupe fuego
      sobre sus enemigos en la fase de disparo. Usa la plantilla de llamas con forma de lágrima para
      determinar qué miniaturas sufren un impacto automático de Fuerza 4. Además, cualquier
      miniatura alcanzada se incendia con un resultado de 4+ (ver Reglas de Fuego). Los Traga Fuego
      pueden usar este ataque de aliento incluso cuando estén trabados en combate cuerpo a cuerpo.
