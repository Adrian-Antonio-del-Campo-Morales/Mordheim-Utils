- id: bronze_helmet
  kind: trollheim-equipment
  name: Bronze Helmet
  name_i18n:
    es: Yelmo de Bronce
  effect: >-
    From the shining steel helmets of Bretonnian knights to the leather caps of the Skaven, all
    sensible warriors try to protect the most vulnerable part of their body – their head. Even the
    most vain fighters still use a helmet, as it can be festooned with plumes, horns and other
    decorations. Helmets come in varying shapes and sizes, but their basic function remains the
    same. Avoid Stun : A model that is equipped with a helmet has a special 4+ save on a D6 against
    being stunned. If the save is made, treat the stunned result as knocked down instead. This save
    is not modified by the opponent's Strength.
  effect_i18n:
    es: >-
      Desde los brillantes cascos de acero de los caballeros bretonianos hasta las gorras de cuero
      de los Skavens, todos los guerreros sensatos intentan proteger la parte más vulnerable de su
      cuerpo: la cabeza. Incluso los luchadores más vanidosos todavía usan casco, ya que puede estar
      adornado con plumas, cuernos y otras decoraciones. Los cascos vienen en diferentes formas y
      tamaños, pero su función básica sigue siendo la misma. Evitar el aturdimiento: Un modelo que
      está equipado con un casco tiene una salvación especial de 4+ en un D6 contra ser aturdido. Si
      se realiza la salvación, trate el resultado aturdido como si fuera derribado. Esta salvación
      no se ve modificada por la Fuerza del oponente.
  source_refs:
  - *id003
  combat_status: out_of_scope
