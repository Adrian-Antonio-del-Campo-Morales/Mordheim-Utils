- id: treasure_map
  kind: trollheim-equipment
  name: Treasure Map
  name_i18n:
    es: Mapa del Tesoro
  effect: >-
    Roll a D6 after the game to determine where the map leads you (note that any gold crowns found
    represent the profit after all shares have been given to the crew). D6 Result 1 The map turns
    out to be a fake! However, you do manage to return and trounce the bilge-drinking swine who sold
    it to you, and he gives your Warband D6x5 gold crowns to make amends (and prevent himself
    getting keel-hauled!). 2 The map leads your crew to a minor stash. After some hours digging, the
    find a chest containing 1 shard of wyrdstone and some jewels worth 2D6x10 gold crowns. 3 The map
    reveals one of the fabled alestashes of Long Drong Slayer himself! You uncover several barrels
    of the finest rums, ales, and other assorted spirits. One is a barrel of Bugman's XXXX, which
    can be used as per the rules for Bugman's Ale. After 'sampling' many of the other barrels, the
    remainders are sold off for 2D6x10 gold crowns (after the crew wakes up, of course). 4 Buried
    deep in the ruins of an unassuming hovel you find several chests filled with fine clothes, plus
    several notebooks outlining blackmail information for many of the local trading merchants. You
    realise this must be one of the stashes left by Facio, the great Tilean trickster and rogue.
    Armed with your new clothing and information, on your next visit to the trading posts you may
    buy any one item listed on the regular Price Chart as if it was Common (except any other Pirate
    Warband unique items, such as Swivel Guns or Treasure Maps), assuming you have the money. Once
    the transaction is complete, you turn around and sell the notebooks to his competitors for
    2D6x10 gold crowns, and make any other trading post purchases as normal. Also, if in your next
    game your warband captures anyone, or finds any Stragglers or Prisoners, the fine clothing
    impresses them quite a bit! The Captain's Leadership is increased by +1 when testing to see if
    any join your warband. 5 The treasure chest that is found has been carefully booby-trapped! One
    of your Heroes must try to penetrate the maze of poisoned dart-shooters and collapsing pathways
    that surround the chest by passing an Initiative test. If he passes, his expert approach reveals
    a Lucky Charm near the chest (which he claims for himself!), and 3D6x10 gold crowns in the chest
    itself. If he fails the test, he must sit out the next game as he recovers, but the crew do
    manage to open the chest now that the traps have been set off and gain the gold as above. They
    do not find the Lucky Charm though as it is drawn back into it's hiding place, there to await a
    more careful adventurer. 6 Your crew bow their heads in reverent silence, as the map has lead
    them to one of the legendary secret burial spots used by Black-Wyrd the Pirate King, first and
    finest pirate to ever ravage Mordheim. Known for tying shards of Wyrdstone into the thick
    strands of his hair and beard and then setting them alight so they set off sparks of unholy
    fire, he was rightly feared by all Warbands throughout the land and sea. Though only a small
    chest is found at the site, when opened it reveals 2+D3 shards of Wyrdstone, plus a Mordheim
    Map!
  effect_i18n:
    es: >-
      Tira un D6 después del juego para determinar adónde te lleva el mapa (ten en cuenta que
      cualquier corona de oro encontrada representa la ganancia después de que todas las acciones se
      hayan entregado a la tripulación). D6 Resultado 1 ¡El mapa resulta ser falso! Sin embargo,
      logras regresar y derrotar al cerdo bebedor de sentina que te lo vendió, y él le da a tu
      Warband D6x5 coronas de oro para enmendarlo (¡y evitar que lo arrastren por la quilla!). 2 El
      mapa lleva a tu tripulación a un escondite menor. Después de algunas horas de excavación,
      encuentran un cofre que contiene 1 fragmento de piedra bruja y algunas joyas por valor de
      2D6x10 coronas de oro. 3 ¡El mapa revela uno de los legendarios alestashes del mismísimo Long
      Drong Slayer! Descubrirá varios barriles de los mejores rones, cervezas y otras bebidas
      espirituosas variadas. Uno es un barril de Bugman's XXXX, que se puede utilizar según las
      reglas de Bugman's Ale. Después de "muestrear" muchos de los otros barriles, los restantes se
      venden por 2D6x10 coronas de oro (después de que la tripulación se despierta, por supuesto). 4
      Enterrados en lo profundo de las ruinas de una modesta choza, encontrarás varios cofres llenos
      de ropa fina, además de varios cuadernos que describen información sobre chantajes a muchos de
      los comerciantes locales. Te das cuenta de que este debe ser uno de los escondites que dejó
      Facio, el gran embaucador y pícaro de Tilea. Armado con tu nueva ropa e información, en tu
      próxima visita a los puestos comerciales podrás comprar cualquier artículo que aparezca en la
      tabla de precios normal como si fuera común (excepto cualquier otro artículo exclusivo de
      Pirate Warband, como armas giratorias o mapas del tesoro), suponiendo que tengas el dinero.
      Una vez que se completa la transacción, usted da la vuelta y vende los cuadernos a sus
      competidores por 2D6x10 coronas de oro, y realiza cualquier otra compra en el puesto comercial
      como de costumbre. Además, si en tu próxima partida tu banda captura a alguien o encuentra
      rezagados o prisioneros, ¡la fina ropa los impresionará bastante! El liderazgo del capitán
      aumenta en +1 cuando se prueba para ver si alguno se une a tu banda. 5 ¡El cofre del tesoro
      encontrado ha sido cuidadosamente colocado en una trampa explosiva! Uno de tus héroes debe
      intentar penetrar el laberinto de lanzadores de dardos envenenados y caminos colapsados ​​que
      rodean el cofre pasando una prueba de Iniciativa. Si pasa, su enfoque experto revela un
      amuleto de la suerte cerca del cofre (¡que reclama para sí mismo!) y 3D6x10 coronas de oro en
      el cofre mismo. Si no pasa la prueba, deberá quedarse fuera del siguiente juego mientras se
      recupera, pero la tripulación logra abrir el cofre ahora que se han activado las trampas y
      gana el oro como se indicó anteriormente. Sin embargo, no encuentran el amuleto de la suerte,
      ya que lo devuelven a su escondite, allí para esperar a un aventurero más cuidadoso. 6 Tu
      tripulación inclina la cabeza en reverente silencio, mientras el mapa los conduce a uno de los
      legendarios lugares de entierro secretos utilizados por Black-Wyrd, el Rey Pirata, el primer y
      mejor pirata que jamás haya asolado Mordheim. Conocido por atar fragmentos de Wyrdstone en los
      gruesos mechones de su cabello y barba y luego prenderles fuego para que provocaran chispas de
      fuego impío, todas las Bandas de Guerreros de toda la tierra y el mar lo temían con razón.
      Aunque solo se encuentra un pequeño cofre en el sitio, cuando se abre revela 2+D3 fragmentos
      de Wyrdstone, ¡además de un mapa de Mordheim!
