- id: eshin_assassin_clothes
  kind: trollheim-equipment
  name: Eshin Assassin Clothes
  name_i18n:
    es: Atuendo de Asesino de Eshin
  effect: >-
    15 gc. Availability: Common (Silent Hunter only). These special garments are made of a
    noise-damping cloth. Save: the Eshin Assassin Clothes act exactly like Light Armour,
    granting a 6+ save, and cannot be combined with any other armour except a helmet. The
    Assassin's Luck: the Eshin assassin robes allow failed save rolls to be re-rolled.
  effect_i18n:
    es: >-
      15 coronas de oro. Disponibilidad: Común (Solo Cazador Silencioso). Estos atuendos
      especiales están hechos con una tela especial que amortigua el ruido. Salvación: los
      Ropajes de Asesino Eshin actúan exactamente igual que una Armadura Ligera,
      proporcionando una tirada de salvación de 6+, y no pueden combinarse con ninguna otra
      armadura excepto el casco. La suerte del Asesino: los ropajes de asesino eshin
      permiten repetir las tiradas de salvación fallidas.
  source_refs:
  - *id008
  combat_status: implemented
  mechanic_id: armour.eshin-assassin-robes
