- id: beastmaster_whip
  kind: trollheim-equipment
  name: Beastmaster Whip
  name_i18n:
    es: Látigo de Señor de las Bestias
  effect: >-
    Range: Close Combat Strength: As user -1 Beastbane : The Beastmaster wielding a Beastlash causes
    Fear in animals, any animal charged or wishing to charge a Beastmaster with one of these weapons
    must first take a Fear test as mentioned in the psychology section of the Mordheim rules.
  effect_i18n:
    es: >-
      Alcance: Combate cuerpo a cuerpo Fuerza: Como usuario -1 Beastbane: El Beastmaster que empuña
      un Beastlash causa miedo en los animales, cualquier animal cargado o que desee cargar contra
      un Beastmaster con una de estas armas primero debe realizar una prueba de miedo como se
      menciona en la sección de psicología de las reglas de Mordheim.
  source_refs:
  - &id007
    manual: lustria
    printed_page: 59
    section: Dark Elf Equipment List
  combat_status: out_of_scope
- id: black_lotus
  kind: trollheim-equipment
  name: Black Lotus
  name_i18n:
    es: Loto Negro
  effect: >-
    A weapon coated with the sap of the Black Lotus will wound its target automatically if you roll
    a 6 to hit. Note that you can still roll a dice for every wound inflicted in this way. If you
    roll a 6, you will inflict a critical hit with that roll. If you do not roll a 6, you will cause
    a normal wound. Take armour saves as normal.
  effect_i18n:
    es: >-
      Un arma recubierta con la savia del Loto Negro herirá a su objetivo automáticamente si sacas
      un 6 para impactar. Ten en cuenta que aún puedes tirar un dado por cada herida infligida de
      esta manera. Si obtienes un 6, infligirás un golpe crítico con esa tirada. Si no sacas un 6,
      provocarás una herida normal. Realiza salvaciones de armadura como de costumbre.
  source_refs:
  - &id008
    manual: chaos-in-the-streets
    printed_page: 161
    section: Deathbringer Assassin Equipment List
  - &id020
    manual: chaos-in-the-streets
    printed_page: 161
    section: Deathbringer Sniper Equipment List
  - &id021
    manual: lustria
    printed_page: 53
    section: Lizardmen Poison List
