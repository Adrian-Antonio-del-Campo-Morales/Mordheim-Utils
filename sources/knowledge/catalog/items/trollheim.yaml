- id: mage_robes
  kind: trollheim-equipment
  name: Mage Robes
  name_i18n:
    es: Túnica de Mago
  effect: >-
    The mages, after suffering many wounds in combat, have woven these magic robes for their
    protection. Save: the robe grants its bearer a 6+ armour save and cannot combine its
    effects with any other piece of armour. Spellcasting: because they are made with
    magic, the robes do not prevent the caster from casting spells.
  effect_i18n:
    es: >-
      Los magos, a copia de sufrir múltiples heridas en combate, han tejido estas túnicas
      mágicas para su protección. Salvación: una túnica de mago otorga al portador una
      tirada de salvación por armadura de 6+, que no se combinará con ninguna otra pieza de
      armadura. Lanzamiento de Hechizos: al ser unas túnicas fabricadas con
      magia, estas no impiden al hechicero ejecutar hechizos como pasa con el resto de
      armaduras.
  source_refs:
  - *id009
  combat_status: implemented
  mechanic_id: armour.mage-robes
