- id: nomad_robes
  kind: trollheim-equipment
  name: Nomad Robes
  name_i18n:
    es: Túnicas Nómadas
  effect: >-
    Khemri setting, Town Cryer #18 ( 1b ) Woven by native desert dwellers these robes enable the
    wearer to suffer only half penalties from Weather Conditions. The robes affect the following
    results on the Weather table: It's Raining: The robe protects the warrior's equipment. When
    rolling a D6 each time that you fire a black powder weapon, the shot is only wasted on a 1. Hot
    as Hades: A warrior wearing a Nomad Robe only suffers a penalty of -1 to WS and BS and he only
    requires the normal amount of water. Hot: A warrior wearing a Nomad Robe suffers no penalty to
    WS or BS. If at least half of the warband are wearing Nomad Robes, they only require the normal
    amount of water. Dust Storm: The robe has no effect – not even the Nomad Robes can protect the
    warrior from the ferocity of the storm. Apply rules for a Dust Storm as normal
  effect_i18n:
    es: >-
      Escenario de Khemri, Town Cryer #18 (1b) Tejidas por habitantes nativos del desierto, estas
      túnicas permiten al usuario sufrir solo la mitad de las penalizaciones por las condiciones
      climáticas. Las túnicas afectan los siguientes resultados en la tabla de Clima: Está
      lloviendo: La túnica protege el equipo del guerrero. Al tirar un D6 cada vez que disparas un
      arma de pólvora negra, el disparo sólo se desperdicia con un 1. Caliente como Hades: Un
      guerrero que lleva una túnica nómada sólo sufre una penalización de -1 a WS y BS y sólo
      requiere la cantidad normal de agua. Caliente: Un guerrero que lleva una Túnica Nómada no
      sufre ninguna penalización a WS o BS. Si al menos la mitad de la banda lleva túnicas nómadas,
      sólo necesitarán la cantidad normal de agua. Tormenta de polvo: la túnica no tiene ningún
      efecto; ni siquiera las túnicas nómadas pueden proteger al guerrero de la ferocidad de la
      tormenta. Aplica las reglas para una tormenta de polvo como de costumbre.
  source_refs:
  - *id011
  - *id013
  combat_status: out_of_scope
