- id: rat_familiar_scroll
  kind: trollheim-equipment
  name: Rat Familiar Scroll
  name_i18n:
    es: Pergamino del Familiar Rata
  effect: >-
    The Scroll of Familiar Rat has a spell inscribed on it, usable by a Pestilens Sorcerer as many
    times as he wants. If the warband includes at least one Giant Rat, the spell may be cast on it
    before the combat begins, transforming it in a Rat Familiar. If his Rat Familiar is within 6",
    the sorcerer may reroll once in a game the dice to overcome the difficulty of a spell. A
    sorcerer may only have one Rat Familiar at any one time, it is an henchman and it counts
    normally toward the maximum number of models permitted co the warband. If the sorcerer dies, his
    Rat Familiar turns back to Giant Rat form. (Clan Pestilens members use this item instead of the
    normal Familiar ). The Rat Familiar is a Giant Rat enchanted with the Scroll of the Rat
    Familiar.
  effect_i18n:
    es: >-
      El Pergamino de la Rata Familiar tiene un hechizo inscrito, que un Hechicero Pestilens puede
      utilizar tantas veces como quiera. Si la banda incluye al menos una Rata Gigante, el hechizo
      puede lanzarse sobre ella antes de que comience el combate, transformándola en una Rata
      Familiar. Si su Familiar Rata está dentro de los 6", el hechicero puede volver a tirar los
      dados una vez en un juego para superar la dificultad de un hechizo. Un hechicero solo puede
      tener un Familiar Rata a la vez, es un secuaz y cuenta normalmente para el número máximo de
      miniaturas permitidas para la banda. Si el hechicero muere, su Familiar Rata vuelve a su forma
      de Rata Gigante. (Los miembros del Clan Pestilens usan este objeto en lugar del Familiar
      normal). El Familiar Rata es una Rata Gigante encantada con el Pergamino del Familiar Rata.
  source_refs:
