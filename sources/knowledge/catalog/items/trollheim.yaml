  name: Feather Headdress
  name_i18n:
    es: Tocado de Plumas
  source_refs:
  - *id010
  combat_status: out_of_scope
- id: flying_carpet
  kind: trollheim-equipment
  name: Flying Carpet
  name_i18n:
    es: Alfombra Voladora
  effect: >-
    These wondrous items from a forgotten age are even rarer than the lamps of the Djinn and are
    thought to have originated from the distant long dead Sorcerer's Isles. A magic carpet is indeed
    just that – a carpet that flies! It counts as a mount and allows movement of 16" with no
    restrictions for terrain. You can move onto the roofs of buildings and other high places with no
    penalty. The carpet may carry up to three men or one large creature and a man. One of the riders
    must be a character. Due to its magical nature it cannot be destroyed.
  effect_i18n:
    es: >-
      Estos maravillosos objetos de una época olvidada son incluso más raros que las lámparas de los
      Djinn y se cree que se originaron en las lejanas Islas de los Hechiceros, extintas hace mucho
      tiempo. Una alfombra mágica es precisamente eso: ¡una alfombra que vuela! Cuenta como una
      montura y permite un movimiento de 16" sin restricciones de terreno. Puedes moverte a los
      tejados de los edificios y otros lugares altos sin penalización. La alfombra puede transportar
      hasta tres hombres o una criatura grande y un hombre. Uno de los jinetes debe ser un
      personaje. Debido a su naturaleza mágica no puede ser destruido.
  source_refs:
  - *id009
  combat_status: out_of_scope
- id: fog_warpstone_fragments
  kind: trollheim-equipment
  name: Fog Warpstone Fragments
  name_i18n:
    es: Fragmentos de Piedra Bruja de Niebla
  effect: >-
    When put inside a censer these warpstone shards have the peculiar characteristic of making the
    resulting clouds of pestilential fumes thicker than usual. The wielder of a censer who also have
    some fog-enhancing warpstone shards is a difficult target to shoot at, and other models suffer a
    -1 penalty to hit when targeting him with missile weapons (Clan Pestilens members use this item
    instead of the Elven Cloak ).
  effect_i18n:
    es: >-
      Cuando se colocan dentro de un incensario, estos fragmentos de piedra bruja tienen la peculiar
      característica de hacer que las nubes resultantes de vapores pestilentes sean más espesas de
      lo habitual. El portador de un incensario que también tiene algunos fragmentos de piedra de
      disformidad que mejoran la niebla es un objetivo difícil al que disparar, y otras miniaturas
      sufren una penalización de -1 al impactar cuando lo apuntan con armas de proyectiles (los
      miembros del Clan Pestilens usan este objeto en lugar de la capa élfica).
  source_refs:
  - &id015
