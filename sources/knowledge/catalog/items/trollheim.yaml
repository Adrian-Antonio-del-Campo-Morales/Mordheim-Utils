- id: peg_leg
  kind: trollheim-equipment
  name: Peg Leg
  name_i18n:
    es: Pata de Palo
  effect: >-
    This will reduce his Movement (and maximum possible Movement characteristic) by -1, but offers a
    chance that stray hits will strike the leg instead. This gives him a special saving throw of 6+,
    which can be taken whenever he fails any other saving throws allowed against any wounding
    shooting or hand-to-hand hits. This save is not modified, and can be used even if no saving
    throw is normally allowed. A new pirate joining the warband, either during initial warband
    creation or as a new hire, may also start out with a Peg Leg. If the wearer gets a Leg Wound or
    Smashed Leg in further battles, these can be ignored on a roll of 4+ as the hit was taken by the
    Peg Leg instead.
  effect_i18n:
    es: >-
      Esto reducirá su Movimiento (y la máxima característica de Movimiento posible) en -1, pero
      ofrece la posibilidad de que los golpes perdidos golpeen la pierna. Esto le otorga una tirada
      de salvación especial de 6+, que puede realizar siempre que falle cualquier otra tirada de
      salvación permitida contra cualquier disparo hiriente o golpe cuerpo a cuerpo. Esta salvación
      no se modifica y se puede utilizar incluso si normalmente no se permite ninguna tirada de
      salvación. Un nuevo pirata que se une a la banda, ya sea durante la creación inicial de la
      banda o como nuevo empleado, también puede comenzar con una pata de palo. Si el usuario recibe
      una herida en la pierna o una pierna rota en futuras batallas, estos pueden ignorarse con una
      tirada de 4+ ya que el golpe fue recibido por la pata de palo.
  source_refs:
  - *id014
  combat_status: out_of_scope
- id: pestilens_banner
