      Alcance: Combate cuerpo a cuerpo Fuerza: Como usuario Filo de corte: Un hacha tiene un
      modificador de salvación adicional de -1, por lo que un modelo con Fuerza 4 que usa un hacha
      tiene un modificador de salvación de -2 cuando golpea a un oponente en combate cuerpo a
      cuerpo.
  source_refs:
