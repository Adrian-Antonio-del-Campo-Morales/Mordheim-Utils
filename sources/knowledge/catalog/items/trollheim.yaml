- id: nagarythe_standard
  kind: trollheim-equipment
  name: Nagarythe Standard
  name_i18n:
    es: Estandarte de Nagarythe
  effect: >-
    While many Shadow Warrior Warbands are simply wandering, some represent groups that have been
    sent from Ulthuan on some special mission for the Phoenix King. Such bands are really closer to
    military units than loose bands of warriors. As such, they tend to retain their unit insignia
    and other trappings. Chief among these is the unit standard. A unit's colours can hold a lot of
    meaning, particularly when the warriors in that unit lack a true home. A Shadow Warrior band
    normally makes their standard by hand; cost and rarity represent the difficulty of finding the
    proper materials (fine silks and thread of gold, for example). A Standard of Nagarythe can serve
    as a second rallying point (the Shadow Master is the first, represented by his Leader skill) for
    the unit. Any members of the Shadow Warrior warband within 12" of their standard may re-roll any
    failed Leadership tests, should the standard be captured by the enemy (model holding the
    standard is taken Out of Action), all members of the warband will be subject to Hatred for the
    remainder of the game, and may not voluntarily Rout. Note that these effects do not affect any
    Hired Swords in the warband, only actual Shadow Warriors (including Shadow Warrior heroes) are
    affected. A model carrying a standard requires one hand free to do so, so no weapons, shields,
    etc, may be carried in this hand, and no double-handed weapons may be used while the standard is
    carried. A standard may be used in close combat as a makeshift spear (use the rules for a spear
    but with -1 on the to hit rolls). A standard may only ever be purchased when the warband is
    created and may never be added later to the warband.
  effect_i18n:
    es: >-
      Si bien muchas Bandas de Guerreros de las Sombras simplemente deambulan, algunas representan
      grupos que han sido enviados desde Ulthuan en alguna misión especial para el Rey Fénix. En
      realidad, estas bandas están más cercanas a las unidades militares que las bandas sueltas de
      guerreros. Como tales, tienden a conservar las insignias de su unidad y otros adornos. El
      principal de ellos es el estándar de la unidad. Los colores de una unidad pueden tener mucho
      significado, especialmente cuando los guerreros de esa unidad carecen de un verdadero hogar.
      Una banda de Guerreros de las Sombras normalmente hace su estandarte a mano; el costo y la
      rareza representan la dificultad de encontrar los materiales adecuados (sedas finas e hilos de
      oro, por ejemplo). Un Estandarte de Nagarythe puede servir como segundo punto de reunión (el
      Maestro de las Sombras es el primero, representado por su habilidad Líder) para la unidad.
      Cualquier miembro de la banda de Guerreros de las Sombras que se encuentre a 12" o menos de su
      estandarte puede repetir cualquier prueba de Liderazgo fallida; si el enemigo captura el
      estandarte (el modelo que porta el estandarte queda Fuera de combate), todos los miembros de
      la banda estarán sujetos al Odio por el resto del juego y no podrán Huir voluntariamente.
      Tenga en cuenta que estos efectos no afectan a ningún Espadachín a sueldo en la banda, solo
      los Guerreros de las Sombras reales (incluidos los héroes de los Guerreros de las Sombras) se
      ven afectados. Un modelo que lleva un estandarte requiere una mano libre para hacerlo. Por lo
      tanto, no se pueden llevar armas, escudos, etc. en esta mano, y no se pueden usar armas de dos
      manos mientras se lleva el estandarte. Se puede usar un estandarte en combate cuerpo a cuerpo
      como una lanza improvisada (use las reglas para una lanza pero con -1 en las tiradas para
      impactar. Un estandarte sólo se puede comprar cuando se crea la banda y nunca se puede agregar
      a la banda).
  source_refs:
  - *id018
  combat_status: out_of_scope
- id: nagarythe_war_horn
  kind: trollheim-equipment
  name: Nagarythe War Horn
  name_i18n:
    es: Cuerno de Guerra de Nagarythe
  effect: >-
    Similar to the Standard of Nagarythe, units of Shadow Warriors sent into Mordheim often bring
    with them a war horn to rally around. The rules for the War Horn of Nagarythe are the same as
    for a normal War Horn above (except for Rarity and price).
  effect_i18n:
    es: >-
      Al igual que el Estandarte de Nagarythe, las unidades de Guerreros de las Sombras enviadas a
      Mordheim suelen traer consigo un cuerno de guerra para unirse. Las reglas para el Cuerno de
      Guerra de Nagarythe son las mismas que para un Cuerno de Guerra normal mencionado
      anteriormente (excepto la Rareza y el precio).
  source_refs:
  - *id018
  combat_status: out_of_scope
- id: nightshade
  kind: trollheim-equipment
  name: Nightshade
  name_i18n:
    es: Belladona
  effect: Each unsaved wound reduces the opponent’s Initiative by 1, to a minimum of 1.
  effect_i18n:
    es: >-
      Cada herida no salvada reduce la Iniciativa del oponente en 1, hasta un mínimo de 1.
  source_refs:
  - *id002
  combat_status: implemented
  mechanic_id: poison.nightshade
- id: nomad_robes
  kind: trollheim-equipment
  name: Nomad Robes
  name_i18n:
    es: Túnicas Nómadas
  effect: >-
    Woven by native desert dwellers these robes enable the
    wearer to suffer only half penalties from Weather Conditions. The robes affect the following
    results on the Weather table: It's Raining: The robe protects the warrior's equipment. When
    rolling a D6 each time that you fire a black powder weapon, the shot is only wasted on a 1. Hot
    as Hades: A warrior wearing a Nomad Robe only suffers a penalty of -1 to WS and BS and he only
    requires the normal amount of water. Hot: A warrior wearing a Nomad Robe suffers no penalty to
    WS or BS. If at least half of the warband are wearing Nomad Robes, they only require the normal
    amount of water. Dust Storm: The robe has no effect – not even the Nomad Robes can protect the
    warrior from the ferocity of the storm. Apply rules for a Dust Storm as normal
  effect_i18n:
    es: >-
      Tejidas por habitantes nativos del desierto, estas
      túnicas permiten al usuario sufrir solo la mitad de las penalizaciones por las condiciones
      climáticas. Las túnicas afectan los siguientes resultados en la tabla de Clima: Está
      lloviendo: La túnica protege el equipo del guerrero. Al tirar un D6 cada vez que disparas un
      arma de pólvora negra, el disparo sólo se desperdicia con un 1. Caliente como Hades: Un
      guerrero que lleva una túnica nómada sólo sufre una penalización de -1 a HA y HP y sólo
      requiere la cantidad normal de agua. Caliente: Un guerrero que lleva una Túnica Nómada no
      sufre ninguna penalización a HA o HP. Si al menos la mitad de la banda lleva túnicas nómadas,
      sólo necesitarán la cantidad normal de agua. Tormenta de polvo: la túnica no tiene ningún
      efecto; ni siquiera las túnicas nómadas pueden proteger al guerrero de la ferocidad de la
      tormenta. Aplica las reglas para una tormenta de polvo como de costumbre.
  source_refs:
  - *id011
  - *id013
  combat_status: out_of_scope
- id: parrot
  kind: trollheim-equipment
  name: Parrot
  name_i18n:
    es: Loro
  effect: >-
    All enemy in base contact with the owner will be at –1 to hit in their first round of combat
    with the pirate unless they can pass a Leadership Test.
  effect_i18n:
    es: >-
      Todos los enemigos en contacto peana con el propietario tendrán -1 para impactar en su primera
      ronda de combate con el pirata a menos que puedan pasar una Prueba de Liderazgo.
  source_refs:
  - *id014
  combat_status: out_of_scope
- id: peg_leg
  kind: trollheim-equipment
  name: Peg Leg
  name_i18n:
    es: Pata de Palo
  effect: >-
    This will reduce his Movement (and maximum possible Movement characteristic) by -1, but offers a
    chance that stray hits will strike the leg instead. This gives him a special saving throw of 6+,
    which can be taken whenever he fails any other saving throws allowed against any wounding
    shooting or hand-to-hand hits. This save is not modified, and can be used even if no saving
    throw is normally allowed. A new pirate joining the warband, either during initial warband
    creation or as a new hire, may also start out with a Peg Leg. If the wearer gets a Leg Wound or
    Smashed Leg in further battles, these can be ignored on a roll of 4+ as the hit was taken by the
    Peg Leg instead.
  effect_i18n:
    es: >-
      Esto reducirá su Movimiento (y la máxima característica de Movimiento posible) en -1, pero
      ofrece la posibilidad de que los golpes perdidos golpeen la pierna. Esto le otorga una tirada
      de salvación especial de 6+, que puede realizar siempre que falle cualquier otra tirada de
      salvación permitida contra cualquier disparo hiriente o golpe cuerpo a cuerpo. Esta salvación
      no se modifica y se puede utilizar incluso si normalmente no se permite ninguna tirada de
      salvación. Un nuevo pirata que se une a la banda, ya sea durante la creación inicial de la
      banda o como nuevo empleado, también puede comenzar con una pata de palo. Si el usuario recibe
      una herida en la pierna o una pierna rota en futuras batallas, estos pueden ignorarse con una
      tirada de 4+ ya que el golpe fue recibido por la pata de palo.
  source_refs:
  - *id014
  combat_status: out_of_scope
- id: pestilens_banner
  kind: trollheim-equipment
  name: Pestilens Banner
  name_i18n:
    es: Estandarte de Pestilens
  effect: >-
    A model within 12" of the standard bearer of the band, usually a Plague
    Monk or a Monk Initiate, may reroll once every failed all alone test. The staff of the Clan
    Pestilens banner counts as a two-handed weapon. A warband may have a single Clan Pestilens
    banner at any one time. (Clan Pestilens members use this item instead of the normal Banner).
  effect_i18n:
    es: >-
      Una miniatura a 12" o menos del abanderado de la banda, normalmente un
      Monje de la Plaga o un Monje Iniciado, puede volver a tirar una vez por cada prueba fallida en
      solitario. El bastón del estandarte del Clan Pestilens cuenta como un arma de dos manos. Una
      banda puede tener un solo estandarte del Clan Pestilens en cualquier momento. (Los miembros
      del Clan Pestilens usan este objeto en lugar del estandarte normal).
  source_refs:
  - *id015
  combat_status: out_of_scope
- id: pirate_flag
  kind: trollheim-equipment
  name: Pirate Flag
  name_i18n:
    es: Bandera Pirata
  effect: >-
    One per warband. Any Hero may carry the Jolly Roger. Any Pirates within 12" of the Jolly Roger
    never count as being All Alone in combat. Carrying the banner takes up one hand, so that model
    may not carry or use any two-handed weapons during the game. Swabbies, lacking the true Pirate
    spirit, do not gain any benefit from the Jolly Roger.
  effect_i18n:
    es: >-
      Una por banda. Cualquier Héroe puede llevar la Bandera Pirata. Los Piratas a 12" o menos de la
      Bandera Pirata nunca cuentan como Todo Solo en combate. Llevar el estandarte ocupa una mano, así
      que esa miniatura no puede llevar ni usar armas a dos manos durante la partida. Los Fregones,
      que carecen del verdadero espíritu pirata, no obtienen ningún beneficio de la Bandera Pirata.
  source_refs:
  - *id014
  combat_status: out_of_scope
