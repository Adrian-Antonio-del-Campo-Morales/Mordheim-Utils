- id: elf_boots
  kind: trollheim-equipment
  name: Elf Boots
  name_i18n:
    es: Botas Élficas
  effect: >-
    A rare but highly prized item, Elven boots are made from the finest materials. They are light
    weight and supple granting the wearer almost supernatural speed to match that of the fey race
    that created them. Elven boots increase the wearer's move characteristic by +1. This can take a
    warrior's move value above its maximum.
  effect_i18n:
    es: >-
      Las botas élficas, un artículo raro pero muy preciado, están hechas con los mejores
      materiales. Son livianos y flexibles, lo que otorga al usuario una velocidad casi sobrenatural
      que iguala la de la raza feérica que los creó. Las botas élficas aumentan la característica de
      movimiento del usuario en +1. Esto puede hacer que el valor de movimiento de un guerrero
      supere su máximo.
  source_refs:
  - &id018
    manual: chaos-in-the-streets
    printed_page: 139
    section: Shadow Warrior Equipment List
  combat_status: out_of_scope
