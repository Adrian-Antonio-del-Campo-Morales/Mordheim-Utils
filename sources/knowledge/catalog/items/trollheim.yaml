    manual: lustria
    printed_page: 121
    section: Pygmy Equipment List
  - &id010
    manual: lustria
    printed_page: 97
    section: Savage Goblin Hero Equipment List
  combat_status: implemented
  mechanic_id: poison.black-lotus
