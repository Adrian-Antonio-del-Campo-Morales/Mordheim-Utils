- id: arcane_familiar
  kind: trollheim-equipment
  name: Arcane Familiar
  name_i18n:
    es: Familiar Arcano
  effect: >-
    Wizards are often solitary, usually shunned by those who can barely conceive of, much less
    understand, the power these individuals wield. As such, they often share their lives with animal
    companions, rather than more ‘sentient' beings. Sometimes a magical link will develop between
    one of these animals and the wizard, to the extent that the wizard begins to see through the
    animal's eyes, and hear its thoughts. Wizards in different lands favour different types of
    familiars, depending on their environment: Shadow Weavers tend to favour darkly-coloured animals
    that can blend into the shadows with them easily-- ravens or darkly-coloured cats are most
    common. Regardless of their form, familiars are actually not normal members of their kind at
    all, but rather creatures that have somehow become attuned to the Winds of Magic. Familiars
    cannot actually be purchased as normal equipment. The cost to ‘purchase' a familiar actually
    represents the cost of materials to cast the ritual to summon a familiar and form a magical bond
    with it; the Rarity level represents the chances of the ritual actually working. As such, the
    cost of the familiar must always be paid if the rarity roll is attempted, regardless of the
    success of the roll. Also, only spell-casters can attempt to ‘find' a familiar. If a familiar is
    found, it should be modelled on the spellcaster as with any other piece of equipment. A familiar
    may be placed on a separate base (in fact many of the familiars that GW sells come this way),
    but if this is done the familiar must always remain in base-to-base contact with the wizard, and
    it is ignored for game purposes (so it may not attack enemy models or be attacked itself, may
    not intercept attackers, does not increase the wizard's base size, etc.), other than the effect
    below. A wizard with a familiar is allowed to re-roll one failed roll to cast a spell each turn.
    The result of this re-roll must be accepted, even if it fails, and remember that you may never
    reroll a re-roll. Spell-users only (does not include users of Prayers). Note that unlike many of
    the warband specific items, this item is equipment that any warband with a spell-user may use,
    if he can summon it successfully.
  effect_i18n:
    es: >-
      Los magos suelen ser solitarios, normalmente rechazados por aquellos que apenas pueden
      concebir, y mucho menos comprender, el poder que ejercen estos individuos. Como tales, a
      menudo comparten sus vidas con compañeros animales, en lugar de seres más "sensibles". A veces
      se desarrollará un vínculo mágico entre uno de estos animales y el mago, hasta el punto de que
      el mago comienza a ver a través de los ojos del animal y a escuchar sus pensamientos. Los
      magos en diferentes tierras prefieren diferentes tipos de familiares, dependiendo de su
      entorno: los Tejedores de Sombras tienden a preferir animales de colores oscuros que pueden
      mezclarse fácilmente con las sombras; los cuervos o los gatos de colores oscuros son los más
      comunes. Independientemente de su forma, los familiares en realidad no son miembros normales
      de su especie, sino criaturas que de alguna manera se han sintonizado con los Vientos de la
      Magia. En realidad, los familiares no se pueden comprar como equipo normal. El costo de
      "comprar" un familiar en realidad representa el costo de los materiales para realizar el
      ritual para convocar a un familiar y formar un vínculo mágico con él; El nivel de rareza
      representa las posibilidades de que el ritual realmente funcione. Como tal, el coste del
      familiar siempre debe pagarse si se intenta realizar la tirada de rareza, independientemente
      del éxito de la tirada. Además, sólo los lanzadores de hechizos pueden intentar "encontrar" un
      familiar. Si se encuentra un familiar, se debe modelar según el lanzador del hechizo como con
      cualquier otra pieza del equipo. Un familiar puede colocarse en una base separada (de hecho,
      muchos de los familiares que vende GW vienen de esta manera), pero si se hace esto, el
      familiar siempre debe permanecer en contacto base con base con el mago, y se ignora para
      propósitos del juego (por lo que no puede atacar a modelos enemigos ni ser atacado él mismo,
      no puede interceptar atacantes, no aumenta el tamaño de la base del mago, etc.), aparte del
      efecto que se detalla a continuación. Un mago con un familiar puede repetir una tirada fallida
      para lanzar un hechizo cada turno. El resultado de esta repetición debe ser aceptado, incluso
      si falla, y recuerda que nunca podrás repetir una repetición. Solo usuarios de hechizos (no
      incluye usuarios de Oraciones). Tenga en cuenta que, a diferencia de muchos de los elementos
      específicos de la banda, este elemento es un equipo que cualquier banda con un usuario de
      hechizos puede usar, si puede invocarlo con éxito.
  source_refs:
  - &id019
    manual: chaos-in-the-streets
    printed_page: 167
    section: Arcane Society Equipment List
  combat_status: out_of_scope
