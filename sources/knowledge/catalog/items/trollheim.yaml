    At the beginning of a turn, or just before taking a Rout Test, the warband
    may chant the Liturgicus Infecticus, and benefit of a +1 Leadership bonus until the end of the
    turn. (Clan Pestilens members use this item instead of the War horn ).
  effect_i18n:
    es: >-
      Al comienzo de un turno, o justo antes de realizar una Prueba de Huida, la
      banda puede cantar el Liturgicus Infecticus y beneficiarse de una bonificación de Liderazgo +1
      hasta el final del turno. (Los miembros del clan Pestilens usan este objeto en lugar del
