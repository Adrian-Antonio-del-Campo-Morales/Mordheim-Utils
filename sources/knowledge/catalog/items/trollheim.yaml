- id: bronze_dagger
  kind: trollheim-equipment
  name: Bronze Dagger
  name_i18n:
    es: Daga de Bronce
  effect: >-
    Range: Close Combat Strength: As user +1 Enemy armour save : Daggers are not the best weapons to
    use for penetrating an enemy model's armour. An enemy wounded by a dagger gains a +1 bonus to
    his armour save, and a 6+ armour save if he has none normally.
  effect_i18n:
    es: >-
      Alcance: Cuerpo a cuerpo Fuerza: Como usuario +1 Salvación por armadura enemiga: Las dagas no
      son las mejores armas para penetrar la armadura de un modelo enemigo. Un enemigo herido por
      una daga obtiene una bonificación de +1 a su salvación por armadura, y una salvación por
      armadura de 6+ si normalmente no la tiene.
  source_refs:
  - *id003
  - &id004
    manual: khemri
    printed_page: 41
    section: Mortuary Priest Equipment List
  combat_status: out_of_scope
- id: bronze_helmet
  kind: trollheim-equipment
  name: Bronze Helmet
  name_i18n:
    es: Yelmo de Bronce
  effect: >-
    From the shining steel helmets of Bretonnian knights to the leather caps of the Skaven, all
    sensible warriors try to protect the most vulnerable part of their body – their head. Even the
    most vain fighters still use a helmet, as it can be festooned with plumes, horns and other
    decorations. Helmets come in varying shapes and sizes, but their basic function remains the
    same. Avoid Stun : A model that is equipped with a helmet has a special 4+ save on a D6 against
    being stunned. If the save is made, treat the stunned result as knocked down instead. This save
    is not modified by the opponent's Strength.
  effect_i18n:
    es: >-
      Desde los brillantes cascos de acero de los caballeros bretonianos hasta las gorras de cuero
      de los Skavens, todos los guerreros sensatos intentan proteger la parte más vulnerable de su
      cuerpo: la cabeza. Incluso los luchadores más vanidosos todavía usan casco, ya que puede estar
      adornado con plumas, cuernos y otras decoraciones. Los cascos vienen en diferentes formas y
      tamaños, pero su función básica sigue siendo la misma. Evitar el aturdimiento: Un modelo que
      está equipado con un casco tiene una salvación especial de 4+ en un D6 contra ser aturdido. Si
      se realiza la salvación, trate el resultado aturdido como si fuera derribado. Esta salvación
      no se ve modificada por la Fuerza del oponente.
  source_refs:
  - *id003
  combat_status: out_of_scope
- id: bronze_spear
  kind: trollheim-equipment
  name: Bronze Spear
  name_i18n:
    es: Lanza de Bronce
  effect: >-
    Range: Close Combat Strength: As user Strike first : A warrior with a spear 'strikes first' in
    the first turn of hand-to-hand combat. ✏️
  effect_i18n:
    es: >-
      Alcance: Cuerpo a cuerpo Fuerza: Como usuario Golpea primero: un guerrero con una lanza "ataca
      primero" en el primer turno del combate cuerpo a cuerpo. ✏️
  source_refs:
  - *id003
  combat_status: out_of_scope
- id: bronze_sword
  kind: trollheim-equipment
  name: Bronze Sword
  name_i18n:
    es: Espada de Bronce
  effect: >-
    Range: Close Combat Strength: As user Parry : Swords offer an excellent balance of defence and
    offence. A model armed with a sword may parry blows. When his opponent rolls to hit, the model
    armed with a sword may roll a D6. If the score is greater than the highest to hit score of his
    opponent, the model has parried the blow, and that attack is discarded. A model may not parry
    attacks made with double or more its own Strength – they are simply too powerful to be stopped.
  effect_i18n:
    es: >-
      Alcance: Cuerpo a cuerpo Fuerza: Como usuario Parar: Las espadas ofrecen un excelente
      equilibrio entre defensa y ataque. Una miniatura armada con una espada puede parar golpes.
      Cuando su oponente tira para impactar, la miniatura armada con una espada puede tirar 1D6. Si
      la puntuación es mayor que la puntuación más alta para impactar de su oponente, el modelo ha
      parado el golpe y ese ataque se descarta. Un modelo no puede parar ataques realizados con el
      doble o más de su propia Fuerza; simplemente son demasiado poderosos para detenerlos.
  source_refs:
  - *id003
  - *id004
  combat_status: out_of_scope
