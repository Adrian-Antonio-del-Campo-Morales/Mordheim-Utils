- id: hook_hand
  kind: trollheim-equipment
  name: Hook Hand
  name_i18n:
    es: Mano de Gancho
  effect: >-
    The wearer of the stylish new device cannot use any two-handed weapons, but will always count as
    having a close combat weapon in that hand. The hook strikes in close combat in the same manner
    as a dagger . A new pirate joining the warband, either during initial warband creation or as a
    new hire, may also start out with a Hook Hand. If the wearer gets a Hand Injury or Arm Wound in
    further battles, these can be ignored on a roll of 4+ as the hit was taken by the Hook Hand
    instead.
  effect_i18n:
    es: >-
      El usuario del nuevo y elegante dispositivo no puede utilizar ningún arma a dos manos, pero
      siempre contará como si tuviera un arma de combate cuerpo a cuerpo en esa mano. El gancho
      golpea en combate cuerpo a cuerpo de la misma manera que una daga. Un nuevo pirata que se une
      a la banda, ya sea durante la creación inicial de la banda o como nuevo recluta, también puede
      comenzar con una Mano Garfio. Si el usuario sufre una lesión en la mano o en el brazo en
      futuras batallas, estas pueden ignorarse con una tirada de 4+, ya que el golpe fue recibido
      por la mano con gancho.
  source_refs:
