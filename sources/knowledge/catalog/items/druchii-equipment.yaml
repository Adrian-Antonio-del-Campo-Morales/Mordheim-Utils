schema_version: 2
ruleset: mordheim
items:
- id: druchii_draich
  kind: close-combat-weapon
  name: Draich (Druchii)
  name_i18n:
    es: Draich Druchii
  effect: >-
    A two-handed sword used by the Executioners of Har Ganeth, well balanced not to encumber an
    elven swordsman. Strength: As user +2. Special Rules: Two-handed, Swift. Unlike other
    double-handed weapons, it does not Strike last. This printed variant carries no parry,
    Concussion or Critical Hit bonus.
  effect_i18n:
    es: >-
      Espada a dos manos usada por los Ejecutores de Har Ganeth, equilibrada para no estorbar al
      espadachín elfo. Fuerza: la del usuario +2. Reglas especiales: a dos manos, Veloz. A
      diferencia de otras armas a dos manos, no golpea el último. Esta variante impresa no hereda
      la parada, la Conmoción ni el bono crítico.
  source_refs:
  - manual: mordheim-index-catalog
    printed_page: 0
    section: Druchii / Special Equipment / Draich
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/druchii
  combat_status: implemented
  mechanic_id: weapon.draich-druchii
- id: druchii_sea_dragon_cloak
  kind: shield-or-defence
  name: Sea Dragon Cloak (Druchii)
  name_i18n:
    es: Capa de Dragón Marino Druchii
  effect: >-
    Scales: a +1 bonus to the wearer's save in close combat, or a 6+ save if he has none, and it
    may be combined with other pieces of armour (shield, light armour) with no penalty. The +2
    save against shooting is outside the current duel runtime.
  effect_i18n:
    es: >-
      Escamas: bono de +1 a la salvación en combate cuerpo a cuerpo, o 6+ si no tiene ninguna, y
      se puede combinar con otras piezas de armadura (escudo, armadura ligera) sin penalización.
      El bono de +2 contra disparos queda fuera del duelo actual.
  source_refs:
  - manual: mordheim-index-catalog
    printed_page: 0
    section: Druchii / Special Equipment / Sea Dragon Cloak
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/druchii
  combat_status: implemented
  mechanic_id: defence.sea-dragon-cloak-druchii
