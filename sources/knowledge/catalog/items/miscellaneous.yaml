      Escenario de Khemri, Town Cryer #18 (1b) Al comienzo de la batalla, el guerrero puede convocar
      a un solo Tomb Scorpion para luchar por la banda si puede pasar una prueba de Liderazgo. El
      escorpión convocado luchará solo en una batalla (usa Tomb Scorpion de la lista Tomb
      Guardians).
  source_refs:
