- id: skeleton_chariot
  kind: combat-equipment
  name: Skeleton Chariot
  name_i18n:
    es: Carro de Guerra Esqueleto
  effect: >-
    To use the Skeleton Chariot to it's full effect, Tomb Guardian have access to an additional
    skill: Drive Chariot (academic) Chariots are very difficult to control and a warrior must have
    this skill to drive a chariot effectively in combat. A charioteer without this skill cannot
