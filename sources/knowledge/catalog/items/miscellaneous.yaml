- id: rickshaw
  kind: combat-equipment
  name: Rickshaw
  name_i18n:
    es: Rikshaw
  effect: >-
    One non-animal warband member must be assigned as the runner in order to move the rickshaw. He
    cannot charge or run whilst pulling the cart. As long as he pulls the rickshaw it remains in
    base contact with the runner and both are moved together. The runner may stop pulling the
    rickshaw at any time and move normally the same turn (including declaring charges). There is one
    seat in the rickshaw for one passenger to sit down. Boarding and deboarding the cart works the
    same way as mounting and dismounting. Models shooting at a rickshaw get a +1 on their ‘to hit'
    rolls. For each hit, roll on the table below to determine which part of the rickshaw and crew is
    hit. Then apply ‘to wound' rolls accordingly. D6 Result 1-2 Runner 3-4 Rickshaw (Toughness 8,
    Wounds 2) 5 Wheel (Toughness 6, Wounds 1) 6 Passenger In hand-to-hand combat attackers may
    choose whether they want to attack the runner, a wheel, the rickshaw itself or the passenger as
    long as they are in base contact with the respective part. The passenger is hit on 6+ only. Note
    that as soon as one of the wheels is destroyed (i.e. loses its last wound) the rickshaw can be
    pulled no more. Unless the rickshaw is destroyed completely it can be repaired after the battle.
  effect_i18n:
    es: >-
      Se debe asignar a un miembro de la banda que no sea animal como corredor para poder mover el
      rickshaw. No puede cargar ni correr mientras tira del carro. Mientras tira del rickshaw, este
      permanece en contacto con la base del corredor y ambos se mueven juntos. El corredor podrá
      dejar de tirar del rickshaw en cualquier momento y circular normalmente en el mismo turno
      (incluida la declaración de cargas). En el rickshaw hay un asiento para que se siente un
      pasajero. Subir y bajar del carrito funciona de la misma manera que subir y bajar. Los modelos
      que disparan a un rickshaw obtienen un +1 en sus tiradas de "acertar". Para cada impacto, tira
      en la tabla a continuación para determinar qué parte del rickshaw y de la tripulación es
      impactada. Luego aplique los rollos "para herir" en consecuencia. D6 Resultado 1-2 Corredor
      3-4 Rickshaw (Dureza 8, Heridas 2) 5 Rueda (Dureza 6, Heridas 1) 6 Pasajero En el combate
      cuerpo a cuerpo los atacantes pueden elegir si quieren atacar al corredor, a una rueda, al
      propio rickshaw o al pasajero siempre que estén en contacto peana con la parte respectiva. El
      pasajero recibe un impacto únicamente con 6+. Tenga en cuenta que tan pronto como una de las
      ruedas se destruya (es decir, pierda su última herida), ya no se podrá tirar del rickshaw. A
      menos que el rickshaw se destruya por completo, podrá repararse después de la batalla.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Trading Post / Miscellaneous
    url: https://mordheimer.net/docs/trading-post
  combat_status: out_of_scope
