  name_i18n:
    es: Amuleto de Piedra Bruja
  effect: >-
    Town Cryer #29 ( 1b ) The owner of a warpstone amulet may reroll a single die during the battle
    or, if not out of combat at the end of the game, a single die when looking for wyrdstone shards
    (Clan Pestilens members use this item instead of the Rabbit's Foot ).
  effect_i18n:
    es: >-
      Town Cryer #29 (1b) El dueño de un amuleto de piedra bruja puede volver a tirar un solo dado
      durante la batalla o, si no está fuera de combate al final del juego, un solo dado cuando
      busca fragmentos de piedra bruja (los miembros del Clan Pestilens usan este objeto en lugar de
      la Pata de Conejo).
