  effect_i18n:
    es: >-
      Para utilizar el Skeleton Chariot con todo su efecto, Tomb Guardian tiene acceso a una
      habilidad adicional: Drive Chariot (académico) Los carros son muy difíciles de controlar y un
      guerrero debe tener esta habilidad para conducir un carro de manera efectiva en combate. Un
      auriga sin esta habilidad no puede cargar.
  source_refs:
