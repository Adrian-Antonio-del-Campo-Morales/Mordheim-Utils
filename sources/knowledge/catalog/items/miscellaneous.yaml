- id: rhinox
  kind: out-of-scope
  name: Rhinox
  name_i18n:
    es: Rhinox
  effect: >-
    Availability : A Hero searching for a Rhinox adds +1 to his rarity roll for each point of
    Strength he has. If a Rhinox was found the Hero must take a Strength test. If the test is failed
    he was wounded by the Rhinox while he tried to capture and tame it. Roll once on the Serious
    Injury table for him immediately.
  effect_i18n:
    es: >-
      Disponibilidad: Un héroe que busca un Rhinox añade +1 a su tirada de rareza por cada punto de
      Fuerza que tenga. Si se encuentra un Rhinox, el Héroe debe realizar una prueba de Fuerza. Si
      la prueba falla, el Rhinox lo hirió mientras intentaba capturarlo y domesticarlo. Tira una vez
      en la tabla de Heridas graves para él inmediatamente.
  source_refs:
