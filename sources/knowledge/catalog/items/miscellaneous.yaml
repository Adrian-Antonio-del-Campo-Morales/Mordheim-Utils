- id: war_horn
  kind: combat-equipment
  name: War Horn
  name_i18n:
    es: Cuerno de Guerra
  effect: >-
    A war horn may be used once per battle at the beginning of any turn. It allows the warband to
    increase its Leadership by +1. The effect will last from the start of one turn to the start of
    the next. The war horn can be used just before a warband is about to take a rout test.
  effect_i18n:
    es: >-
      Se puede usar un cuerno de guerra una vez por batalla al comienzo de cualquier turno. Permite
      a la banda aumentar su Liderazgo en +1. El efecto durará desde el comienzo de un turno hasta
      el comienzo del siguiente. El cuerno de guerra se puede utilizar justo antes de que una banda
      esté a punto de realizar una prueba de derrota.
  source_refs:
  - manual: mordheimer.net
