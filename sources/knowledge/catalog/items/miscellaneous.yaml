schema_version: 2
ruleset: mordheim
items:
- id: bec_de_corbin
  kind: close-combat-weapon
  name: Bec De Corbin
  name_i18n:
    es: Bec de Corbin
  effect: >-
    Range: Close Combat Strength: As user +1 Two-handed : A model armed with a Bec de Corbin may not
    use a shield, buckler or additional weapon in close combat. If the model has a shield he still
    gets a +1 bonus to his armour save against shooting.
  effect_i18n:
    es: >-
      Alcance: Cuerpo a cuerpo Fuerza: Como usuario +1 A dos manos: Una miniatura armada con un Bec
      de Corbin no puede usar escudo, broquel o arma adicional en combate cuerpo a cuerpo. Si el
      modelo tiene un escudo, aún obtiene una bonificación de +1 a su salvación de armadura contra
      disparos.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Trading Post / Hand-to-hand Combat Weapons
    url: https://mordheimer.net/docs/trading-post
  combat_status: out_of_scope
- id: brass_knuckles
  kind: close-combat-weapon
  name: Brass Knuckles
  name_i18n:
    es: Puños de Latón
  effect: >-
    Range: Close Combat Strength: As user +1 Pair : Brass knuckles are used in pairs and the warrior
    fighting with them gains an extra Attack. He may not use any other weapons or items in his hands
    while doing this however. He is free to swap his brass knuckles for other weapons and items
    during the battle but may not do this if in combat.
  effect_i18n:
    es: >-
      Alcance: Combate cuerpo a cuerpo Fuerza: Como usuario +1 Par: Los nudillos de bronce se usan
      en pares y el guerrero que lucha con ellos gana un ataque adicional. Sin embargo, no puede
      usar otras armas ni objetos en sus manos mientras hace esto. Es libre de cambiar sus puños
      americanos por otras armas y objetos durante la batalla, pero no puede hacerlo si está en
      combate.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Trading Post / Hand-to-hand Combat Weapons
    url: https://mordheimer.net/docs/trading-post
  combat_status: out_of_scope
- id: brazier_iron
  kind: close-combat-weapon
  name: Brazier Iron
  name_i18n:
    es: Brasero de Hierro
  effect: >-
    Range: Close Combat Strength: As user +1 Two handed : A warrior armed with a brazier staff
    requires two hands to wield it effectively and so may not use a shield with it or another hand
    weapon or buckler in close combat. The warrior may still use a shield for the purposes of
    missile fire though.
  effect_i18n:
    es: >-
      Alcance: combate cuerpo a cuerpo Fuerza: como usuario +1 Dos manos: un guerrero armado con un
      bastón de brasero requiere dos manos para blandirlo con eficacia y, por lo tanto, no puede
      usar un escudo con él ni otra arma de mano o escudo en combate cuerpo a cuerpo. Sin embargo,
      el guerrero aún puede usar un escudo para disparar misiles.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Trading Post / Hand-to-hand Combat Weapons
    url: https://mordheimer.net/docs/trading-post
  combat_status: out_of_scope
- id: horsemans_hammer
  kind: close-combat-weapon
  name: Horseman's Hammer
  name_i18n:
    es: Martillo de Jinete
  effect: >-
    Range: Close Combat Strength: As user +1 Two-handed : A model armed with a Horseman's Hammer may
    not use a shield, buckler, or additional weapon in close combat. If the model is equipped with a
    shield he will still get a +1 bonus to his armour save against shooting.
  effect_i18n:
    es: >-
      Alcance: Combate cuerpo a cuerpo Fuerza: Como usuario +1 A dos manos: Una miniatura armada con
      un Martillo de jinete no puede usar escudo, rodela ni arma adicional en combate cuerpo a
      cuerpo. Si el modelo está equipado con un escudo, seguirá obteniendo una bonificación de +1 a
      su salvación de armadura contra disparos.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Trading Post / Hand-to-hand Combat Weapons
    url: https://mordheimer.net/docs/trading-post
  combat_status: out_of_scope
- id: sword_breaker
  kind: close-combat-weapon
  name: Sword Breaker
  name_i18n:
    es: Rompe Espadas
  effect: >-
    Range: Close Combat Strength: As user Parry : The sword breaker allows the wielder to parry the
    attacks of his opponents in close combat. When your opponent scores a hit roll a D6. If you can
    roll greater than the highest 'to hit' roll of your opponent you have parried the attack and the
    blow is wasted.
  effect_i18n:
    es: >-
      Alcance: Combate cuerpo a cuerpo Fuerza: Como usuario Parada: El rompe espadas permite al
      portador parar los ataques de sus oponentes en combate cuerpo a cuerpo. Cuando tu oponente
      consiga un impacto, tira un D6. Si puedes obtener una tirada mayor que la tirada más alta para
      golpear de tu oponente, habrás detenido el ataque y el golpe será en vano.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Trading Post / Hand-to-hand Combat Weapons
    url: https://mordheimer.net/docs/trading-post
  combat_status: out_of_scope
- id: trident
  kind: close-combat-weapon
  name: Trident
  name_i18n:
    es: Tridente
  effect: >-
    Range: Close Combat Strength: As user Parry : Can parry enemy blows
  effect_i18n:
    es: >-
      Alcance: Cuerpo a cuerpo Fuerza: Como usuario Parry: Puede detener los golpes enemigos
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Trading Post / Hand-to-hand Combat Weapons
    url: https://mordheimer.net/docs/trading-post
  combat_status: out_of_scope
- id: fist
  kind: close-combat-weapon
  name: Fist
  name_i18n:
    es: Puño
  effect: >-
    Range: Close Combat Strength: As user -1 Warriors using their fists can only ever make 1 attack.
  effect_i18n:
    es: >-
      Alcance: Combate cuerpo a cuerpo Fuerza: Como usuario -1 Los guerreros que usan sus puños solo
      pueden realizar 1 ataque.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Trading Post / Hand-to-hand Combat Weapons
    url: https://mordheimer.net/docs/trading-post
  combat_status: out_of_scope
- id: cathayan_candles
  kind: ranged-weapon
  name: Cathayan Candles
  name_i18n:
    es: Velas de Cathay
  effect: >-
    Range: 6" Strength: 6 Thrown Weapon : A model using Cathayan candles does not suffer penalties
    for range or moving.
  effect_i18n:
    es: >-
      Alcance: 6" Fuerza: 6 Arma arrojadiza: Un modelo que usa velas Catayan no sufre penalizaciones
      por alcance o movimiento.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Trading Post / Missile Weapons
    url: https://mordheimer.net/docs/trading-post
  combat_status: out_of_scope
- id: firepots_miragliano
  kind: ranged-weapon
  name: Firepots Miragliano
  name_i18n:
    es: Botes de Fuego de Miragliano
  effect: >-
    Range: 8" Strength: 2 Awkward Thrown Weapon : Models using Firepots Miragliano do not suffer any
    penalties for range, but still suffer a -1 to hit penalty if they use them after moving that
    turn.
  effect_i18n:
    es: >-
      Alcance: 8" Fuerza: 2 Arma arrojadiza incómoda: Los modelos que usan Firepots Miragliano no
      sufren ninguna penalización por alcance, pero aún sufren una penalización de -1 al impacto si
      los usan después de moverse ese turno.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Trading Post / Missile Weapons
    url: https://mordheimer.net/docs/trading-post
  combat_status: out_of_scope
- id: chaos_armour
  kind: armour
  name: Chaos Armour
  name_i18n:
    es: Armadura del Caos
  effect: >-
    Rarity : When searching for Chaos armour a warrior gains +1 on his Rarity roll for each model he
    took out of action in the previous battle.
  effect_i18n:
    es: >-
      Rareza: Cuando busca una armadura del Caos, un guerrero obtiene +1 en su tirada de Rareza por
      cada miniatura que dejó fuera de combate en la batalla anterior.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Trading Post / Armour
    url: https://mordheimer.net/docs/trading-post
  combat_status: out_of_scope
- id: lamellar_armour
  kind: armour
  name: Lamellar Armour
  name_i18n:
    es: Armadura de Escamas
  effect: >-
    Movement Penalty : A warrior that is armed with both a lamellar armour and a shield suffers a –1
    Movement penalty.
  effect_i18n:
    es: >-
      Penalización de movimiento: un guerrero que está armado con una armadura laminar y un escudo
      sufre una penalización de movimiento de -1.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Trading Post / Armour
    url: https://mordheimer.net/docs/trading-post
  combat_status: out_of_scope
- id: masterwork_heavy_armour
  kind: armour
  name: Masterwork Heavy Armour
  name_i18n:
    es: Armadura Pesada de Obra Maestra
  effect: >-
    Movement Penalty : It grants 4+ Armour Save, but suffers from -1M even without a shield.
  effect_i18n:
    es: >-
      Penalización de movimiento: Otorga 4+ de salvación por armadura, pero sufre -1M incluso sin
      escudo.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Trading Post / Armour
    url: https://mordheimer.net/docs/trading-post
  combat_status: out_of_scope
- id: pavise
  kind: shield-or-defence
  name: Pavise
  name_i18n:
    es: Pavesa
  effect: >-
    Cover : A warrior using a pavise counts as if he is in cover against missile attacks (-1 to
    hit). In close combat, The pavise counts as a shield (+1 armour save) but only if the warrior
    was charged to his front.
  effect_i18n:
    es: >-
      Cobertura: Un guerrero que usa un pavise cuenta como si estuviera en cobertura contra ataques
      con misiles (-1 al impacto). En combate cuerpo a cuerpo, el pavise cuenta como un escudo (+1
      salvación por armadura), pero sólo si el guerrero fue cargado hacia su frente.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Trading Post / Armour
    url: https://mordheimer.net/docs/trading-post
  combat_status: out_of_scope
- id: banner
  kind: combat-equipment
  name: Banner
  name_i18n:
    es: Estandarte
  effect: >-
    A banner requires one hand to use and can be carried by any Hero in the warband. Friendly
    warriors within 12" of the banner bearer may re-roll any failed 'All Alone' test; but remember,
    you can't re-roll a failed re-roll.
  effect_i18n:
    es: >-
      Un estandarte requiere una mano para usarse y puede ser llevado por cualquier héroe de la
      banda. Los guerreros amigos a 12" o menos del portaestandarte pueden repetir cualquier tirada
      fallida de 'Todo solo'; pero recuerda, no puedes repetir una tirada fallida.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Trading Post / Miscellaneous
    url: https://mordheimer.net/docs/trading-post
  combat_status: out_of_scope
- id: bear_claw_necklace
  kind: combat-equipment
  name: Bear-Claw Necklace
  name_i18n:
    es: Collar de Garras de Oso
  effect: >-
    A warrior wearing a bearclaw necklace receives some of the strength and wild ferocity of the
    bear it came from. A warrior wearing a bear-claw necklace becomes subject to Frenzy .
  effect_i18n:
    es: >-
      Un guerrero que lleva un collar de garra de oso recibe algo de la fuerza y ​​la ferocidad
      salvaje del oso del que procede. Un guerrero que lleva un collar de garras de oso queda sujeto
      a Frenesí.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Trading Post / Miscellaneous
    url: https://mordheimer.net/docs/trading-post
  combat_status: out_of_scope
- id: book_of_the_dead
  kind: combat-equipment
  name: Book of the Dead
  name_i18n:
    es: Libro de los Muertos
  effect: >-
    A Vampire can learn Necromantic magic with the Arcane Lore skill and this book and a Necromancer
    will gain a new spell permanently.
  effect_i18n:
    es: >-
      Un vampiro puede aprender magia nigromántica con la habilidad Conocimiento arcano y este libro
      y un Nigromante obtendrá un nuevo hechizo de forma permanente.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Trading Post / Miscellaneous
    url: https://mordheimer.net/docs/trading-post
  combat_status: out_of_scope
- id: bota_bag
  kind: combat-equipment
  name: Bota Bag
  name_i18n:
    es: Odre
  effect: >-
    Khemri setting, Town Cryer #18 ( 1b ) Like a wine skin it allows the owner to carry one more
    water unit than normal. Each character may only take one Bota Bag.
  effect_i18n:
    es: >-
      Escenario de Khemri, Town Cryer #18 (1b) Como un odre de vino, permite al propietario llevar
      una unidad de agua más de lo normal. Cada personaje sólo podrá llevar una Bolsa de Bota.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Trading Post / Miscellaneous
    url: https://mordheimer.net/docs/trading-post
  combat_status: out_of_scope
- id: bugmans_ale
  kind: combat-equipment
  name: Bugman's Ale
  name_i18n:
    es: Cerveza de Bugman
  effect: >-
    A warband that drinks a barrel of Bugman's before a battle will be immune to fear for the whole
    of the battle. Elves may not drink Bugman's ale as they are far too delicate to cope with its
    effects. There is only enough ale to supply the warband for one battle. ✏️
  effect_i18n:
    es: >-
      Una banda que bebe un barril de Bugman's antes de una batalla será inmune al miedo durante
      toda la batalla. Los elfos no pueden beber la cerveza de Bugman porque son demasiado delicados
      para soportar sus efectos. Sólo hay suficiente cerveza para abastecer a la banda para una
      batalla. ✏️
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Trading Post / Miscellaneous
    url: https://mordheimer.net/docs/trading-post
  combat_status: out_of_scope
- id: caltrops
  kind: combat-equipment
  name: Caltrops
  name_i18n:
    es: Abrojos
  effect: >-
    There are enough caltrops to last for one use only. They may be used when an opponent decides to
    charge. The defender simply throws the caltrops into the path of his attacker and they reduce
    his charge range by D6 inches. If this means that the attacker cannot reach his target then it
    is a failed charge.
  effect_i18n:
    es: >-
      Hay suficientes abrojos para un solo uso. Pueden usarse cuando un oponente decide cargar. El
      defensor simplemente lanza los abrojos en el camino de su atacante y reducen su alcance de
      carga en D6 pulgadas. Si esto significa que el atacante no puede alcanzar su objetivo,
      entonces se trata de una carga fallida.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Trading Post / Miscellaneous
    url: https://mordheimer.net/docs/trading-post
  combat_status: out_of_scope
- id: chest
  kind: combat-equipment
  name: Chest
  name_i18n:
    es: Arcón
  effect: >-
    Cumbersome: A chest must be carried by two models. The carriers must remain in base contact with
    the chest or it is dropped. They may not use ranged weapons or attack in combat.
  effect_i18n:
    es: >-
      Engorroso: Un cofre debe ser llevado por dos modelos. Los transportadores deben permanecer en
      contacto base con el cofre o este se caerá. No podrán utilizar armas a distancia ni atacar en
      combate.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Trading Post / Miscellaneous
    url: https://mordheimer.net/docs/trading-post
  combat_status: out_of_scope
- id: compass
  kind: combat-equipment
  name: Compass
  name_i18n:
    es: Brújula
  effect: >-
    In any scenarios where players roll to see which side deploys first, then his warband may
    re-roll their result. This can only be done if the pirate with the compass is not missing the
    game though! Note that only one re-roll is allowed, even If multiple pirates have a Compass, and
    if both sides have one then no re-rolls are allowed.
  effect_i18n:
    es: >-
      En cualquier escenario donde los jugadores tiran para ver qué lado se despliega primero, su
      banda puede volver a tirar el resultado. ¡Esto sólo se puede hacer si el pirata con la brújula
      no se pierde el juego! Tenga en cuenta que solo se permite una repetición de tirada, incluso
      si varios piratas tienen una brújula, y si ambos bandos tienen una, no se permiten repetidas
      tiradas.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Trading Post / Miscellaneous
    url: https://mordheimer.net/docs/trading-post
  combat_status: out_of_scope
- id: conch_shell_horn
  kind: combat-equipment
  name: Conch Shell Horn
  name_i18n:
    es: Caracola Marina
  effect: >-
    At the beginning of the game a Piranha warrior may use the horn to re-roll when deciding who
    deploys first and who goes first. Multiple models that have the horn cannot force a second
    re-roll.
  effect_i18n:
    es: >-
      Al comienzo del juego, un guerrero Piraña puede usar el cuerno para volver a tirar y decidir
      quién se despliega primero y quién va primero. Varios modelos que tengan la bocina no pueden
      forzar una segunda repetición.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Trading Post / Miscellaneous
    url: https://mordheimer.net/docs/trading-post
  combat_status: out_of_scope
- id: fire_arrows
  kind: combat-equipment
  name: Fire Arrows
  name_i18n:
    es: Flechas de Fuego
  effect: >-
    If you hit with a fire arrow roll a D6. If you score a 4+ your opponent has been set on fire.
    They must roll a D6 in the recovery phase and score a 4+ to put themselves out or they will
    suffer a strength 4 hit and will be unable to do anything other than move for each turn they are
    on fire. Allies may also attempt to put the warrior out. They must be in base contact and need a
    4+ to be successful. The fire arrows last for one battle only.
  effect_i18n:
    es: >-
      Si golpeas con una flecha de fuego, tira 1D6. Si obtienes un 4+, tu oponente ha sido prendido
      fuego. Deben tirar un D6 en la fase de recuperación y obtener un 4+ para apagarse o sufrirán
      un golpe de fuerza 4 y no podrán hacer nada más que moverse por cada turno que estén en
      llamas. Los aliados también pueden intentar expulsar al guerrero. Deben estar en contacto con
      la peana y necesitan un 4+ para tener éxito. Las flechas de fuego duran sólo una batalla.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Trading Post / Miscellaneous
    url: https://mordheimer.net/docs/trading-post
  combat_status: out_of_scope
- id: fire_bomb
  kind: combat-equipment
  name: Fire Bomb
  name_i18n:
    es: Bomba de Fuego
  effect: >-
    The fire bomb may be thrown in the shooting phase in the same way as blessed water (see p53
    Mordheim rule book). If the bomb lands on target the warrior hit takes D3 Strength 4 hits with
    no saves for armour and all warriors, friend or foe, within 1 inch of him take 1 Strength 3 hit
    with saves as normal. If the throwing warrior rolls a 1 when rolling to hit the bomb misfires
    and explodes just as if the throwing warrior had been hit by his own fire bomb!
  effect_i18n:
    es: >-
      La bomba incendiaria se puede lanzar en la fase de disparo del mismo modo que el agua bendita
      (consulte la página 53 del libro de reglas de Mordheim). Si la bomba cae en el objetivo, el
      guerrero impactado recibe 1D3 golpes de Fuerza 4 sin salvaciones para armadura y todos los
      guerreros, amigos o enemigos, a 1 pulgada de él reciben 1 golpe de Fuerza 3 con salvaciones
      como de costumbre. Si el guerrero lanzador obtiene un 1 al tirar para impactar, la bomba falla
      y explota como si el guerrero arrojador hubiera sido alcanzado por su propia bomba
      incendiaria.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Trading Post / Miscellaneous
    url: https://mordheimer.net/docs/trading-post
  combat_status: out_of_scope
- id: firecrackers
  kind: combat-equipment
  name: Firecrackers
  name_i18n:
    es: Petardos
  effect: >-
    If an animal or mounted warrior tries to charge the model, while it is not in combat, knocked
    down or stunned, it may pass an Initiative test in order to use the firecrackers. If it succeeds
    the animal must pass an Ld test (animals may not use the Ld of the warband's leader and mounts
    may not use the Ld of its rider). If it fails the test, the charge has failed and mounted
    warriors have to roll on the Whoa Boy! table. If the mount has the battle schooled special rule,
    the rider may re-roll the result of the Whoa Boy! table once. The model can also throw the
    firecrackers in the shooting phase. It may throw them at any point in 8” distance. All Mounts or
    Animals in 3” around the detonation spot have to take a Ld test. If it fails, mounts have to
    roll on the Whoa Boy! table, and animals flee as if they failed an all alone test. There are
    enough firecrackers to last for one game.
  effect_i18n:
    es: >-
      Si un animal o guerrero montado intenta cargar contra la miniatura, mientras ésta no está en
      combate, derribada o aturdida, podrá superar un chequeo de Iniciativa para poder utilizar los
      petardos. Si tiene éxito, el animal debe pasar una prueba de Ld (los animales no pueden usar
      el Ld del líder de la banda y las monturas no pueden usar el Ld de su jinete). Si no pasa la
      prueba, la carga habrá fallado y los guerreros montados tendrán que tirar la tirada Whoa Boy!
      mesa. Si la montura tiene la regla especial educada en batalla, el jinete puede repetir el
      resultado de Whoa Boy! mesa una vez. El modelo también puede lanzar los petardos en la fase de
      disparo. Puede lanzarlos en cualquier punto dentro de una distancia de 8". Todas las monturas
      o animales en un radio de 3" alrededor del lugar de detonación deben realizar una prueba de
      Ld. Si falla, las monturas tienen que rodar sobre Whoa Boy! mesa, y los animales huyen como si
      hubieran fallado una prueba en solitario. Hay suficientes petardos para un juego.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Trading Post / Miscellaneous
    url: https://mordheimer.net/docs/trading-post
  combat_status: out_of_scope
- id: flash_powder
  kind: combat-equipment
  name: Flash Powder
  name_i18n:
    es: Polvo de Destello
  effect: >-
    Flash powder can be thrown as an enemy charges the wielder (as an interrupt). The charger must
    take an immediate Initiative test in order to cover their eyes. If he fails, he is temporarily
    blinded and it counts as a failed charge. There is only enough flash powder for one use during
    the battle.
  effect_i18n:
    es: >-
      Se puede lanzar polvo relámpago cuando un enemigo carga contra el portador (como una
      interrupción). El cargador debe realizar una prueba de iniciativa inmediata para cubrir sus
      ojos. Si falla, queda cegado temporalmente y cuenta como una carga fallida. Sólo hay
      suficiente pólvora para un uso durante la batalla.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Trading Post / Miscellaneous
    url: https://mordheimer.net/docs/trading-post
  combat_status: out_of_scope
- id: garlic
  kind: combat-equipment
  name: Garlic
  name_i18n:
    es: Ajo
  effect: >-
    A Vampire must pass a Leadership test or it will be unable to charge a model carrying a clove of
    garlic. Garlic lasts for the duration of one battle only, whether it is used or not.
  effect_i18n:
    es: >-
      Un Vampiro debe pasar una prueba de Liderazgo o no podrá cargar contra una miniatura que lleve
      un diente de ajo. El ajo dura solo lo que dura una batalla, ya sea que se use o no.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Trading Post / Miscellaneous
    url: https://mordheimer.net/docs/trading-post
  combat_status: out_of_scope
- id: halfling_cookbook
  kind: combat-equipment
  name: Halfling Cookbook
  name_i18n:
    es: Libro de Cocina Halfling
  effect: >-
    The maximum number of warriors allowed in your warband is increased by +1 ❓ (note that neither
    an Undead warband nor a Carnival of Chaos warband can use this item). ✏️
  effect_i18n:
    es: >-
      El número máximo de guerreros permitidos en tu banda aumenta en +1 ❓ (ten en cuenta que ni una
      banda de No-muertos ni una banda de Carnival of Chaos pueden usar este objeto). ✏️
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Trading Post / Miscellaneous
    url: https://mordheimer.net/docs/trading-post
  combat_status: out_of_scope
- id: hammer_of_witches
  kind: combat-equipment
  name: Hammer of Witches
  name_i18n:
    es: Martillo de Brujas
  effect: >-
    A Hero with the Hammer of Witches will hate all Possessed, Skaven, Beastmen, Chaos, Daemons,
    Dark Elf, Orc & Goblins and Sigmarite Sisters.
  effect_i18n:
    es: >-
      Un héroe con el Martillo de las Brujas odiará a todos los Poseídos, Skavens, Hombres Bestia,
      Caos, Demonios, Elfos Oscuros, Orcos y Goblins y Hermanas Sigmaritas.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Trading Post / Miscellaneous
    url: https://mordheimer.net/docs/trading-post
  combat_status: out_of_scope
- id: hardtack_biscuits
  kind: combat-equipment
  name: Hardtack Biscuits
  name_i18n:
    es: Galletas de Marinero
  effect: >-
    At the start of any one of his turns the pirate may pop some in his mouth as long as he is not
    already in hand-to-hand combat. His Toughness is temporarily increased by +1 for the duration of
    that turn and the following enemy turn, with the effects generally wearing off afterwards. Roll
    a D6 after that turn; on a 1 his biscuits were tainted and filled with maggots (yuck!). Make a
    note of his name – the pirate must miss the next game as he recovers (and thumps the cook a few
    times to boot!). If the Pirate winds up missing a game because of other effects, the losses will
    add together and he will miss the next two games.
  effect_i18n:
    es: >-
      Al comienzo de cualquiera de sus turnos, el pirata puede llevarse un poco a la boca, siempre y
      cuando no esté ya en combate cuerpo a cuerpo. Su dureza aumenta temporalmente en +1 durante
      ese turno y el siguiente turno enemigo, y los efectos generalmente desaparecen después. Tira
      un D6 después de ese turno; con un 1, sus galletas estaban contaminadas y llenas de gusanos
      (¡qué asco!). Toma nota de su nombre: el pirata debe perderse el siguiente juego mientras se
      recupera (¡y para colmo, golpea al cocinero unas cuantas veces!). Si el Pirata termina
      perdiendo un juego debido a otros efectos, las pérdidas se sumarán y se perderá los siguientes
      dos juegos.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Trading Post / Miscellaneous
    url: https://mordheimer.net/docs/trading-post
  combat_status: out_of_scope
- id: iron_shod_boots
  kind: combat-equipment
  name: Iron Shod Boots
  name_i18n:
    es: Botas con Suela de Hierro
  effect: >-
    Any warrior wearing a pair of iron shod boots may make an additional kick attack in hand-to-hand
    combat each turn. The attack is resolved at -1 to hit.
  effect_i18n:
    es: >-
      Cualquier guerrero que lleve un par de botas de hierro puede realizar un ataque de patada
      adicional en el combate cuerpo a cuerpo en cada turno. El ataque se resuelve con -1 al
      impacto.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Trading Post / Miscellaneous
    url: https://mordheimer.net/docs/trading-post
  combat_status: out_of_scope
- id: lamp_of_the_djinn
  kind: combat-equipment
  name: Lamp of the Djinn
  name_i18n:
    es: Lámpara de los Djinns
  effect: >-
    Each time a hero uses the lamp it grants him three wishes but each time you roll on the 'Light
    table' you must roll on the 'Dark table' and apply the results. D6 Light 1 Gain D6 Experience
    points 2 Gain one skill from your skill list 3 Gain D6x10 gc 4 Gain a random item from the
    equipment list 5 Choose an item from the equipment list 6 Roll twice more on this chart D6 Dark
    1 Nothing happens 2 Nothing happens 3 Lose D6x10 gc 4 Lose D6 weapons 5 Lose the lamp 6 Roll
    once on the injury chart
  effect_i18n:
    es: >-
      Cada vez que un héroe usa la lámpara, le concede tres deseos, pero cada vez que tiras en la
      'Mesa de luz' debes tirar en la 'Mesa de oscuridad' y aplicar los resultados. D6 Luz 1 Gana D6
      puntos de experiencia 2 Gana una habilidad de tu lista de habilidades 3 Gana D6x10 gc 4 Gana
      un elemento aleatorio de la lista de equipo 5 Elige un elemento de la lista de equipo 6 Tira
      dos veces más en esta tabla D6 Oscuro 1 No pasa nada 2 No pasa nada 3 Pierde D6x10 gc 4 Pierde
      D6 armas 5 Pierde la lámpara 6 Tira una vez en la tabla de lesiones
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Trading Post / Miscellaneous
    url: https://mordheimer.net/docs/trading-post
  combat_status: out_of_scope
- id: lantern
  kind: combat-equipment
  name: Lantern
  name_i18n:
    es: Linterna
  effect: >-
    Mordheim Rulebook ( core ) A model that is in possession of a lantern may add +4" to the
    distance from which he is able to spot hidden enemies.
  effect_i18n:
    es: >-
      Libro de reglas de Mordheim (básico) Una miniatura que esté en posesión de una linterna puede
      añadir +4" a la distancia desde la que puede detectar enemigos ocultos.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Trading Post / Miscellaneous
    url: https://mordheimer.net/docs/trading-post
  combat_status: out_of_scope
- id: large_ladder
  kind: combat-equipment
  name: Large Ladder
  name_i18n:
    es: Escalera Grande
  effect: >-
    A ladder is placed on the board like any other model. If you have no adequate model, use a
    marker to represent the ladder. A Ladder requires two models, Heroes or Henchmen, (or a single
    large model) to carry it. ✏️ However, one model can carry a ladder alone, but may then move at
    half speed only (quarter for large ladders). Models carrying a ladder may not run. They may drop
    the ladder any time they wish (e.g. when charged). A ladder may be set up in the Movement phase
    in base contact with any of the carriers. This requires a quarter of their Movement (half for
    large ladders). Note that if one of the models has a lower Movement than the other, both models
    are slowed down while carrying the ladder. Ladders are considered open ground and do not affect
    the model's movement rate (see Mordheim Rulebook). Any model in base contact with a ladder may
    try to knock it over in the hand-to-hand combat phase. The model must pass a Strength test with
    a –1 modifier for every model on the ladder after the first. If the test is successful treat the
    models as falling from where they were. Small ladders have a length of up to 3”, large ladders
    are longer than 3”.
  effect_i18n:
    es: >-
      Sobre el tablero se coloca una escalera como cualquier otro modelo. Si no tienes un modelo
      adecuado, utiliza un marcador para representar la escalera. Una Escalera requiere dos
      miniaturas, Héroes o Secuaces, (o una sola miniatura grande) para llevarla. ✏️ Sin embargo, un
      modelo puede llevar una escalera solo, pero luego puede moverse solo a la mitad de velocidad
      (un cuarto para escaleras grandes). Los modelos que lleven escalera no podrán correr. Pueden
      soltar la escalera en cualquier momento que lo deseen (por ejemplo, cuando se carga). Se puede
      colocar una escalera en la fase de Movimiento en contacto peana con cualquiera de los
      transportadores. Esto requiere una cuarta parte de su Movimiento (la mitad para escaleras
      grandes). Tenga en cuenta que si uno de los modelos tiene un movimiento menor que el otro,
      ambos modelos se ralentizan mientras llevan la escalera. Las escaleras se consideran terreno
      abierto y no afectan la velocidad de movimiento del modelo (consulte el Libro de reglas de
      Mordheim). Cualquier miniatura que esté en contacto peana con una escalera puede intentar
      derribarla en la fase de combate cuerpo a cuerpo. El modelo debe pasar una prueba de Fuerza
      con un modificador de -1 por cada modelo en la escalera después del primero. Si la prueba
      tiene éxito, trate los modelos como si cayeran desde donde estaban. Las escaleras pequeñas
      tienen una longitud de hasta 3”, las escaleras grandes miden más de 3”.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Trading Post / Miscellaneous
    url: https://mordheimer.net/docs/trading-post
  combat_status: out_of_scope
- id: liber_bubonicus
  kind: combat-equipment
  name: Liber Bubonicus
  name_i18n:
    es: Liber Bubonicus
  effect: >-
    This item replaces the Tome of Magic for Skaven of Clan Pestilens. For the Tome of Magic, the
    skill Arcane Lore is used to learn Lesser Magic, it is assumed this was meant for the Liber
    Bubonicus as well. For gameplay purposes it matters little as the warrior is still required to
    learn an academic skill.
  effect_i18n:
    es: >-
      Este objeto reemplaza el Tomo de Magia de los Skavens del Clan Pestilens. Para el Tomo de
      Magia, la habilidad Conocimiento Arcano se usa para aprender Magia Menor, se supone que esto
      también estaba destinado al Liber Bubonicus. A efectos de juego, importa poco, ya que todavía
      se requiere que el guerrero aprenda una habilidad académica.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Trading Post / Miscellaneous
    url: https://mordheimer.net/docs/trading-post
  combat_status: out_of_scope
- id: lock_picks
  kind: combat-equipment
  name: Lock Picks
  name_i18n:
    es: Ganzúas
  effect: >-
    A model equipped with a set of lock picks may make his test to open doors on his Initiative
    rather than his Strength characteristic if he wishes. This is done at the end of his Movement
    phase as if the model were ripping the door off its hinges, though he uses his Initiative rather
    than Strength, there is no -1 modifier, and there is no chance that the door is too damaged to
    be locked again later.
  effect_i18n:
    es: >-
      Una miniatura equipada con un juego de ganzúas puede realizar su prueba para abrir puertas
      basándose en su Iniciativa en lugar de en su característica Fuerza si así lo desea. Esto se
      hace al final de su fase de Movimiento como si el modelo estuviera arrancando la puerta de sus
      bisagras, aunque usa su Iniciativa en lugar de Fuerza, no hay un modificador de -1 y no hay
      posibilidad de que la puerta esté demasiado dañada para volver a cerrarla más tarde.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Trading Post / Miscellaneous
    url: https://mordheimer.net/docs/trading-post
  combat_status: out_of_scope
- id: magic_gourd
  kind: combat-equipment
  name: Magic Gourd
  name_i18n:
    es: Calabaza Mágica
  effect: >-
    Khemri setting, Town Cryer #18 ( 1b ) The power of the gourd may be used at the end of each
    battle. It will supply 1D3 units of water. Once the amount of water is determined, roll an
    additional D6 – on a roll of 6, the gourd's magic is exhausted and it shatters.
  effect_i18n:
    es: >-
      Escenario de Khemri, Town Cryer #18 (1b) El poder de la calabaza se puede usar al final de
      cada batalla. Suministrará 1D3 unidades de agua. Una vez determinada la cantidad de agua, tira
      1D6 adicional; con una tirada de 6, la magia de la calabaza se agota y se hace añicos.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Trading Post / Miscellaneous
    url: https://mordheimer.net/docs/trading-post
  combat_status: out_of_scope
- id: magic_gubbinz
  kind: combat-equipment
  name: Magic Gubbinz
  name_i18n:
    es: Chismes Mágicos
  effect: >-
    The Shaman may re-roll a failed magic test on a D6 roll of 4+.
  effect_i18n:
    es: >-
      El Chamán puede repetir una tirada de magia fallida con una tirada de 4+ en D6.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Trading Post / Miscellaneous
    url: https://mordheimer.net/docs/trading-post
  combat_status: out_of_scope
- id: mandrake_root
  kind: combat-equipment
  name: Mandrake Root
  name_i18n:
    es: Raíz de Mandrágora
  effect: >-
    Effect : Mandrake Root makes a man almost oblivious to pain. His Toughness is increased by +1
    for the duration of a battle and he treats all stunned results as knocked down instead. Mandrake
    Root has no effect on Undead, such as Vampires and Zombies, or on the Possessed.
  effect_i18n:
    es: >-
      Efecto: La raíz de mandrágora hace que el hombre casi no se dé cuenta del dolor. Su Dureza
      aumenta en +1 durante la duración de una batalla y, en su lugar, trata todos los resultados
      aturdidos como derribados. Mandrake Root no tiene ningún efecto sobre los no muertos, como
      vampiros y zombis, ni sobre los poseídos.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Trading Post / Miscellaneous
    url: https://mordheimer.net/docs/trading-post
  combat_status: out_of_scope
- id: manticore_spoor
  kind: combat-equipment
  name: Manticore Spoor
  name_i18n:
    es: Rastro de Manticora
  effect: >-
    Any model wounded by a weapon smeared with Manticore Spoor must roll a D6 at the beginning of
    its turn: On a roll of 1 the poisoned model loses one wound. On a roll of 6 the poison's effect
    ends and the model has to test no more. Multiple wounds caused by a weapon using Manticore Spoor
    do not cause the victim to test more than once per turn.
  effect_i18n:
    es: >-
      Cualquier miniatura herida por un arma untada con Manticore Spoor debe tirar 1D6 al comienzo
      de su turno: con un resultado de 1, la miniatura envenenada pierde una herida. Con una tirada
      de 6, el efecto del veneno termina y el modelo no tiene que realizar más pruebas. Las heridas
      múltiples causadas por un arma que usa Manticore Spoor no hacen que la víctima realice una
      prueba más de una vez por turno.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Trading Post / Miscellaneous
    url: https://mordheimer.net/docs/trading-post
  combat_status: out_of_scope
- id: map_of_cathay
  kind: combat-equipment
  name: Map of Cathay
  name_i18n:
    es: Mapa de Cathay
  effect: >-
    Roll a D6 to determine what the map depicts. D6 Result Outcome 1 The map is fake and completely
    useless! 2-3 The map shows the way to a mysterious lady. As the warband follows the depicted
    route, the first random happening to occur in the next battle will be "The Old Crone" (56)
    automatically. 4-5 The next time a roll of 4+ is scored on the progress table, the warband with
    a map of Cathay automatically counts as having the most campaign points and thus may choose the
    next scenario. If both warbands have a map of Cathay, compare campaign points as usual. 6 The
    map leads to the hideout of Belandysh! Whenever the warband with this map rolls a 1 for random
    happenings, they may choose to have the "Belandysh comes!" (42-43) event happen automatically
    instead of determining at random.
  effect_i18n:
    es: >-
      Tira un D6 para determinar qué representa el mapa. Resultado D6 Resultado 1 ¡El mapa es falso
      y completamente inútil! 2-3 El mapa muestra el camino hacia una dama misteriosa. A medida que
      la banda sigue la ruta representada, el primer suceso aleatorio que ocurrirá en la siguiente
      batalla será "La vieja bruja" (56) automáticamente. 4-5 La próxima vez que se obtenga una
      tirada de 4+ en la tabla de progreso, la banda con un mapa de Cathay automáticamente cuenta
      como la que tiene la mayor cantidad de puntos de campaña y, por lo tanto, puede elegir el
      siguiente escenario. Si ambas bandas tienen un mapa de Cathay, compara los puntos de campaña
      como de costumbre. 6 ¡El mapa conduce al escondite de Belandysh! Siempre que la banda con este
      mapa obtenga un 1 en sucesos aleatorios, puede elegir que aparezca el mensaje "¡Viene
      Belandysh!" (42-43) el evento ocurre automáticamente en lugar de determinarse al azar.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Trading Post / Miscellaneous
    url: https://mordheimer.net/docs/trading-post
  combat_status: out_of_scope
- id: monkeys_paw
  kind: combat-equipment
  name: Monkey's Paw
  name_i18n:
    es: Pata de Mono
  effect: >-
    Each time a Hero uses the paw it grants three wishes but you only have to roll once on the dark
    side. If you roll this item you must take it. Every two games you have it and don't use it you
    have to roll on the dark side. You may not get rid of the paw unless you use it three times or
    roll lose the paw. After the third use it disappears. D6 Light 1 Gain D6 Experience points 2
    Gain one skill from your skill list 3 Gain D6x10 gc 4 Gain an extra Hero even if it is above
    your maximum allowed 5 Gain an extra Henchman even if it is above your maximum allowed 6 Roll
    twice more on this chart D6 Dark 1 Lose D6 Experience points 2 Lose one random skill 3 Lose
    D6x10 gc 4 Lose a Hero 5 Lose a Henchman 6 Lose the paw
  effect_i18n:
    es: >-
      Cada vez que un héroe usa la pata, concede tres deseos, pero solo tienes que tirar una vez en
      el lado oscuro. Si lanzas este objeto debes tomarlo. Cada dos juegos lo tienes y no lo usas
      tienes que tirarte al lado oscuro. No puedes deshacerte de la pata a menos que la uses tres
      veces o la pierdas. Después del tercer uso desaparece. D6 Light 1 Gana D6 puntos de
      experiencia 2 Gana una habilidad de tu lista de habilidades 3 Gana D6x10 gc 4 Gana un héroe
      adicional incluso si está por encima de tu máximo permitido 5 Gana un secuaz adicional incluso
      si está por encima de tu máximo permitido 6 Tira dos veces más en esta tabla D6 Oscuro 1
      Pierde D6 puntos de experiencia 2 Pierde una habilidad aleatoria 3 Pierde D6x10 gc 4 Pierde un
      héroe 5 Pierde un secuaz 6 Pierde la pata
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Trading Post / Miscellaneous
    url: https://mordheimer.net/docs/trading-post
  combat_status: out_of_scope
- id: nehekharan_map
  kind: combat-equipment
  name: Nehekharan Map
  name_i18n:
    es: Mapa Nehekharano
  effect: >-
    Khemri setting, Town Cryer #18 ( 1b ) Maps of the Land of the Dead are rare. Accurate ones are
    even rarer. The shifting sands and dry riverbeds can render a map obsolete in a season. Use the
    rules for the Mordheim map in the rulebook.
  effect_i18n:
    es: >-
      Escenario de Khemri, Town Cryer #18 (1b) Los mapas de la Tierra de los Muertos son raros. Los
      precisos son aún más raros. Las arenas movedizas y los lechos secos de los ríos pueden hacer
      que un mapa quede obsoleto en una temporada. Usa las reglas para el mapa de Mordheim en el
      libro de reglas.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Trading Post / Miscellaneous
    url: https://mordheimer.net/docs/trading-post
  combat_status: out_of_scope
- id: opulent_coach
  kind: combat-equipment
  name: Opulent Coach
  name_i18n:
    es: Carroza Opulenta
  effect: >-
    The opulent coach impresses even the most suspicious merchant and they will flock to offer their
    most exotic wares to the obviously rich warband leader. The warband leader gains +3 to any rolls
    to locate rare items .
  effect_i18n:
    es: >-
      El opulento carruaje impresiona incluso al comerciante más sospechoso, que acudirá en masa
      para ofrecer sus productos más exóticos al obviamente rico líder de la banda. El líder de la
      banda gana +3 a cualquier tirada para localizar objetos raros.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Trading Post / Miscellaneous
    url: https://mordheimer.net/docs/trading-post
  combat_status: out_of_scope
- id: poisoned_weapon
  kind: material-or-upgrade
  name: Poisoned Weapon
  name_i18n:
    es: Arma Envenenada
  effect: >-
    Unlike other poisons, this is a permanent weapon upgrade.
  effect_i18n:
    es: >-
      A diferencia de otros venenos, esta es una mejora permanente del arma.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Trading Post / Miscellaneous
    url: https://mordheimer.net/docs/trading-post
  combat_status: out_of_scope
- id: powder_keg
  kind: combat-equipment
  name: Powder Keg
  name_i18n:
    es: Barril de Pólvora
  effect: >-
    Warriors may shoot at a powder keg with blackpowder weapons, Cathayan candles, fire bombs and
    fire arrows and they may attack the keg in close combat using torches and brazier irons. Of
    course, they may also use all similar weapons and items that can ignite the powder inside. The
    model must hit and wound as usual (Toughness 4). Then roll a D6: on a 4+ the keg explodes
    (remove the keg from the game). If the model rolled a critical hit the keg automatically
    explodes. An exploding powder keg causes an automatic Strength 6 hit to all models within a
    range of D6+3”. When playing the Horrors of the Underground scenario, roll another D6: on a 4+
    the explosion caused the tunnel to cave in. Place a marker at the powder keg's previous position
    as described in the Tunnel collapse event.
  effect_i18n:
    es: >-
      Los guerreros pueden disparar a un barril de pólvora con armas de pólvora, velas catayanas,
      bombas incendiarias y flechas incendiarias y pueden atacar el barril en combate cuerpo a
      cuerpo utilizando antorchas y braseros. Por supuesto, también pueden usar armas y elementos
      similares que puedan encender la pólvora del interior. La miniatura debe golpear y herir como
      de costumbre (Dureza 4). Luego tira un D6: con un 4+ el barril explota (retira el barril del
      juego). Si el modelo obtuvo un golpe crítico, el barril explota automáticamente. Un barril de
      pólvora que explota provoca un impacto automático de Fuerza 6 a todos los modelos dentro de un
      rango de 1D6+3". Al jugar el escenario Horrores del subsuelo, tira otro 1D6: con un 4+, la
      explosión provocó que el túnel se derrumbara. Coloca un marcador en la posición anterior del
      barril de pólvora como se describe en el evento Colapso del túnel.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Trading Post / Miscellaneous
    url: https://mordheimer.net/docs/trading-post
  combat_status: out_of_scope
- id: rabbits_foot
  kind: combat-equipment
  name: Rabbit's Foot
  name_i18n:
    es: Pata de Conejo
  effect: >-
    A rabbit's foot allows the warrior wearing it to reroll one dice during the battle. If not used
    in the battle it can be used to reroll one dice during the exploration phase providing the hero
    is able to search through the ruins.
  effect_i18n:
    es: >-
      La pata de conejo permite al guerrero que la lleva volver a tirar un dado durante la batalla.
      Si no se usa en la batalla, se puede usar para volver a tirar un dado durante la fase de
      exploración, siempre que el héroe pueda buscar entre las ruinas.
  source_refs:
  - manual: mordheimer.net
