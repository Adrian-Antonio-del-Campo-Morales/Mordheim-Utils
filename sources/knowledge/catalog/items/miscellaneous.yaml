  combat_status: out_of_scope
- id: wheelbarrow
  kind: combat-equipment
  name: Wheelbarrow
  name_i18n:
    es: Carretilla
  effect: >-
    A wheelbarrow is placed on the board like any other model. If you have no adequate model, use a
    marker to represent the wheelbarrow. A Hero or Henchman who is neither an animal nor stupid may
    push a wheelbarrow while he is in base-contact with it. Pushing a wheelbarrow does not affect
    the normal movement of the model. However, it cannot charge whilst pushing a wheelbarrow but it
    may let go of it at any time. A wheelbarrow can be used to transport cumbersome items such as
    chests and barrels. First, the item must be dropped on the wheelbarrow. After that, a model can
    push the wheelbarrow and its load. A wheelbarrow can contain no more than one cumbersome item at
    a time, but any number of smaller items (weapons, armour and small misc equipment).
  effect_i18n:
    es: >-
      Sobre el tablero se coloca una carretilla como cualquier otro modelo. Si no tienes un modelo
      adecuado, utiliza un marcador para representar la carretilla. Un Héroe o Secuaz que no sea ni
      un animal ni un estúpido puede empujar una carretilla mientras esté en contacto peana con
      ella. Empujar una carretilla no afecta el movimiento normal del modelo. Sin embargo, no puede
      cargar mientras empuja una carretilla, pero puede soltarla en cualquier momento. Se puede
      utilizar una carretilla para transportar objetos voluminosos como cofres y barriles. Primero,
      el artículo debe dejarse caer en la carretilla. Después de eso, un modelo puede empujar la
      carretilla y su carga. Una carretilla no puede contener más de un objeto engorroso a la vez,
      sino cualquier cantidad de objetos más pequeños (armas, armaduras y equipo misceláneo
      pequeño).
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Trading Post / Miscellaneous
    url: https://mordheimer.net/docs/trading-post
  combat_status: out_of_scope
- id: winter_furs
  kind: combat-equipment
  name: Winter Furs
  name_i18n:
    es: Pieles de Invierno
  effect: >-
    If the pelt clothing becomes soaked with water, it is useless for the rest of the battle. Note
    that like Rain Coats, this item may be used by Henchmen also.
  effect_i18n:
    es: >-
      Si la ropa de piel se empapa de agua, será inútil durante el resto de la batalla. Tenga en
      cuenta que, al igual que los chubasqueros, los secuaces también pueden utilizar este artículo.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Trading Post / Miscellaneous
    url: https://mordheimer.net/docs/trading-post
  combat_status: out_of_scope
