- id: scorpion_ring
  kind: combat-equipment
  name: Scorpion Ring
  name_i18n:
    es: Anillo Escorpión
  effect: >-
    Khemri setting, Town Cryer #18 ( 1b ) At the beginning of the battle the warrior is able to call
    forth a single Tomb Scorpion to fight for the warband if he can pass a Leadership test. The
    summoned scorpion will fight for a single battle only (use Tomb Scorpion from Tomb Guardians
    list).
  effect_i18n:
