  kind: combat-equipment
  name: Rosary
  name_i18n:
    es: Rosario
  effect: >-
    A prayer user wearing a Rosary may re-roll a failed Difficulty test if he hasn't done anything
    that turn except moving (no running) or remaining stationary. A Rosary cannot be used in combat.
  effect_i18n:
    es: >-
      Un usuario de oración que lleve un Rosario puede volver a tirar una prueba de Dificultad
      fallida si no ha hecho nada en ese turno excepto moverse (no correr) o permanecer
      estacionario. Un Rosario no se puede utilizar en combate.
