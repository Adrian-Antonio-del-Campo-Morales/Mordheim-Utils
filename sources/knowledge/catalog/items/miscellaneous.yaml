- id: small_ladder
  kind: combat-equipment
  name: Small Ladder
  name_i18n:
    es: Escalera Pequeña
  effect: >-
    A ladder is placed on the board like any other model. If you have no adequate model, use a
    marker to represent the ladder. A Ladder requires two models, Heroes or Henchmen, (or a single
    large model) to carry it. ✏️ However, one model can carry a ladder alone, but may then move at
    half speed only (quarter for large ladders). Models carrying a ladder may not run. They may drop
    the ladder any time they wish (e.g. when charged). A ladder may be set up in the Movement phase
    in base contact with any of the carriers. This requires a quarter of their Movement (half for
    large ladders). Note that if one of the models has a lower Movement than the other, both models
    are slowed down while carrying the ladder. Ladders are considered open ground and do not affect
    the model's movement rate (see Mordheim Rulebook). Any model in base contact with a ladder may
    try to knock it over in the hand-to-hand combat phase. The model must pass a Strength test with
    a –1 modifier for every model on the ladder after the first. If the test is successful treat the
    models as falling from where they were. Small ladders have a length of up to 3”, large ladders
    are longer than 3”.
  effect_i18n:
    es: >-
      Sobre el tablero se coloca una escalera como cualquier otro modelo. Si no tienes un modelo
      adecuado, utiliza un marcador para representar la escalera. Una Escalera requiere dos
      miniaturas, Héroes o Secuaces, (o una sola miniatura grande) para llevarla. ✏️ Sin embargo, un
      modelo puede llevar una escalera solo, pero luego puede moverse solo a la mitad de velocidad
      (un cuarto para escaleras grandes). Los modelos que lleven escalera no podrán correr. Pueden
      soltar la escalera en cualquier momento que lo deseen (por ejemplo, cuando se carga). Se puede
      colocar una escalera en la fase de Movimiento en contacto peana con cualquiera de los
      transportadores. Esto requiere una cuarta parte de su Movimiento (la mitad para escaleras
      grandes). Tenga en cuenta que si uno de los modelos tiene un movimiento menor que el otro,
      ambos modelos se ralentizan mientras llevan la escalera. Las escaleras se consideran terreno
      abierto y no afectan la velocidad de movimiento del modelo (consulte el Libro de reglas de
      Mordheim). Cualquier miniatura que esté en contacto peana con una escalera puede intentar
      derribarla en la fase de combate cuerpo a cuerpo. El modelo debe pasar una prueba de Fuerza
      con un modificador de -1 por cada modelo en la escalera después del primero. Si la prueba
      tiene éxito, trate los modelos como si cayeran desde donde estaban. Las escaleras pequeñas
      tienen una longitud de hasta 3”, las escaleras grandes miden más de 3”.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Trading Post / Miscellaneous
    url: https://mordheimer.net/docs/trading-post
  combat_status: out_of_scope
- id: smoke_bomb
  kind: combat-equipment
  name: Smoke Bomb
  name_i18n:
    es: Bomba de Humo
  effect: >-
    At the beginning of the Movement phase, a smoke bomb may be thrown at any point within 4" where
    it creates a thick smoke of 2" radius that lasts until the beginning of the model's next turn.
    If the model is in close combat, it must pass an Initiative test or suffer one automatic hit
    from each enemy model. After that the bomb detonates anyhow – even if the model is wounded.
    Models within the smoke may not attack/shoot or be attacked/shot at. Same applies to casting
    spells and prayers. Models engaged in close combat are immediately moved 1" away from each
    other. As models cannot see through the smoke, they cannot attack through it either. However,
    models can move in the smoke, out of it and through it as normal. Note that the Augur of the
    Sisters of Sigmar is not affected by smoke bombs due to her Blessed Sight. Whenever a model
    carrying a smoke bomb is knocked down, stunned or out of action, the bomb detonates on a roll of
    4+. Note that no extra roll is needed when a stunned model turns knocked down at the beginning
    of its turn.
  effect_i18n:
    es: >-
      Al comienzo de la fase de Movimiento, se puede lanzar una bomba de humo en cualquier punto
      dentro de 4" donde crea un humo espeso de un radio de 2" que dura hasta el comienzo del
      siguiente turno del modelo. Si el modelo está en combate cuerpo a cuerpo, debe pasar un
      chequeo de Iniciativa o sufrir un impacto automático de cada modelo enemigo. Después de eso,
      la bomba detona de todos modos, incluso si el modelo resulta herido. Los modelos dentro del
      humo no pueden atacar/disparar ni ser atacados/disparados. Lo mismo se aplica al lanzamiento
      de hechizos y oraciones. Las miniaturas involucradas en combate cuerpo a cuerpo se alejan
      inmediatamente 1" una de otra. Como las miniaturas no pueden ver a través del humo, tampoco
      pueden atacar a través de él. Sin embargo, las miniaturas pueden moverse en el humo, fuera de
      él y a través de él de forma normal. Tenga en cuenta que el Augur de las Hermanas de Sigmar no
      se ve afectado por las bombas de humo debido a su Vista Bendita. Siempre que una miniatura que
      lleva una bomba de humo es derribada, aturdida o fuera de combate, la bomba detona con una
      tirada de 4+. Tenga en cuenta que no hay tirada adicional Es necesario cuando un modelo
      aturdido resulta derribado al comienzo de su turno.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Trading Post / Miscellaneous
    url: https://mordheimer.net/docs/trading-post
  combat_status: out_of_scope
- id: snake_charmers_flute
  kind: combat-equipment
  name: Snake Charmer's Flute
  name_i18n:
    es: Flauta del Encantador de Serpientes
  effect: >-
    Khemri setting, Town Cryer #18 ( 1b ) A warrior who possesses this item is able to transfix and
    control serpents. If the warrior does nothing for a whole turn, he may play the flute. If this
    happens, any serpent within 6" may not move or attack in their subsequent turn.
  effect_i18n:
    es: >-
      Escenario de Khemri, Town Cryer #18 (1b) Un guerrero que posee este objeto es capaz de
      traspasar y controlar serpientes. Si el guerrero no hace nada durante todo un turno, puede
      tocar la flauta. Si esto sucede, cualquier serpiente dentro de 6" no podrá moverse ni atacar
      en su turno siguiente.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Trading Post / Miscellaneous
    url: https://mordheimer.net/docs/trading-post
  combat_status: out_of_scope
- id: spy_glass
  kind: combat-equipment
  name: Spy Glass
  name_i18n:
    es: Catalejo
  effect: >-
    At the start of his turn, the owner can try to detect one Hidden enemy model to which he has
    normal Line of Sight. On a roll of 4+, the model looses his Hidden status. The spying Pirate can
    move as normal in that turn, but cannot run or charge.
  effect_i18n:
    es: >-
      Al comienzo de su turno, el propietario puede intentar detectar un modelo enemigo oculto con
      el que tenga línea de visión normal. Con una tirada de 4+, la miniatura pierde su estado
      Oculto. El Pirata espía puede moverse normalmente en ese turno, pero no puede correr ni
      cargar.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Trading Post / Miscellaneous
    url: https://mordheimer.net/docs/trading-post
  combat_status: out_of_scope
- id: tarot_cards
  kind: combat-equipment
  name: Tarot Cards
  name_i18n:
    es: Cartas del Tarot
  effect: >-
    A Hero with a deck of tarot cards may consult them before each game. Make a Leadership test. If
    successful, the Hero gains a favorable insight into the future and you may modify the result of
    any one dice in the Exploration phase by -1/+1 (even if the Hero with the cards is taken Out Of
    Action). If the Leadership test is failed by three or more (i.e., a Hero with Ld of 8 rolls 11
    or 12) the cards show a portent of doom and despair and the Hero refuses to fight in the
    following battle and must miss the next game.
  effect_i18n:
    es: >-
      Un Héroe con una baraja de cartas del tarot podrá consultarlas antes de cada partida. Haz una
      prueba de Liderazgo. Si tiene éxito, el Héroe obtiene una visión favorable del futuro y puedes
      modificar el resultado de cualquier dado en la fase de Exploración en -1/+1 (incluso si el
      Héroe con las cartas queda Fuera de Combate). Si la prueba de Liderazgo falla por tres o más
      (es decir, un Héroe con Ld de 8 tira 11 o 12), las cartas muestran un presagio de perdición y
      desesperación y el Héroe se niega a luchar en la siguiente batalla y debe perderse el
      siguiente juego.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Trading Post / Miscellaneous
    url: https://mordheimer.net/docs/trading-post
  combat_status: out_of_scope
- id: tears_of_shallaya
  kind: combat-equipment
  name: Tears of Shallaya
  name_i18n:
    es: Lágrimas de Shallaya
  effect: >-
    A model who drinks a vial of the Tears of Shallaya at the beginning of a battle will be
    completely immune to all poisons for the duration of combat. Undead and Possessed warriors may
    not use the Tears of Shallaya. There is enough liquid in a vial of the Tears of Shallaya to last
    for the duration of one battle.
  effect_i18n:
    es: >-
      Un modelo que beba un frasco de Lágrimas de Shallaya al comienzo de una batalla será
      completamente inmune a todos los venenos durante el combate. Los guerreros no muertos y
      poseídos no pueden usar las Lágrimas de Shallaya. Hay suficiente líquido en un frasco de
      Lágrimas de Shallaya para durar una batalla.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Trading Post / Miscellaneous
    url: https://mordheimer.net/docs/trading-post
  combat_status: out_of_scope
- id: telescope
  kind: combat-equipment
  name: Telescope
  name_i18n:
    es: Telescopio
  effect: >-
    Any hero using a telescope may increase the range of any missile weapon he is using by D6 inches
    each turn. Furthermore, he triples the distance at which he can spot hidden enemies.
  effect_i18n:
    es: >-
      Cualquier héroe que use un telescopio puede aumentar el alcance de cualquier arma de misiles
      que esté usando en D6 pulgadas en cada turno. Además, triplica la distancia a la que puede
      detectar enemigos ocultos.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Trading Post / Miscellaneous
    url: https://mordheimer.net/docs/trading-post
  combat_status: out_of_scope
- id: tome_of_magic
  kind: combat-equipment
  name: Tome of Magic
  name_i18n:
    es: Tomo de Magia
  effect: >-
    If the warband doesn't contain a wizard, a warrior with the Arcane Lore skill may use the Tome
    of Magic to learn Lesser Magic
  effect_i18n:
    es: >-
      Si la banda no contiene un mago, un guerrero con la habilidad Conocimiento Arcano puede usar
      el Tomo de Magia para aprender Magia Menor.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Trading Post / Miscellaneous
    url: https://mordheimer.net/docs/trading-post
  combat_status: out_of_scope
- id: torch
  kind: combat-equipment
  name: Torch
  name_i18n:
    es: Antorcha
  effect: >-
    Torches act exactly as lanterns, adding +4" to the range the model may spot hidden enemies, but
    has a few other special rules as well. A torch will only last one game. A model armed with a
    torch counts as causing fear in animals (Hunting Dogs, all riding steeds, Bears, Wolves, etc),
    and may use a torch as a makeshift club. When used in combat, a torch is treated as a normal
    club, though with a -1 to hit modifier. Any models that have a Regeneration special rule (like
    Trolls) will not be able to regenerate wounds caused by a torch during the battle. (Torches may
    also cause buildings to catch fire – see 'Let the Damned Burn' , from Town Cryer 8).
  effect_i18n:
    es: >-
      Las antorchas actúan exactamente como linternas, agregando +4" al alcance en el que el modelo
      puede detectar enemigos ocultos, pero también tiene algunas otras reglas especiales. Una
      antorcha solo durará una partida. Un modelo armado con una antorcha cuenta como causante de
      miedo en los animales (perros de caza, todos los que montan corceles, osos, lobos, etc.), y
      puede usar una antorcha como un garrote improvisado. Cuando se usa en combate, una antorcha se
      trata como un garrote normal, aunque con un modificador de -1 al impacto. Cualquier modelo que
      tenga una Regeneración La regla especial (como los Trolls) no podrá regenerar las heridas
      causadas por una antorcha durante la batalla (las antorchas también pueden hacer que los
      edificios se incendien; consulte 'Let the Damned Burn', de Town Cryer 8).
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Trading Post / Miscellaneous
    url: https://mordheimer.net/docs/trading-post
  combat_status: out_of_scope
- id: venom_ring
  kind: combat-equipment
  name: Venom Ring
  name_i18n:
    es: Anillo de Veneno
  effect: >-
    Khemri setting, Town Cryer #18 ( 1b ) The Venom Ring renders the wearer immune to the effects of
    all poisons.
  effect_i18n:
    es: >-
      Configuración de Khemri, Town Cryer #18 (1b) El Anillo de Veneno vuelve al usuario inmune a
      los efectos de todos los venenos.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Trading Post / Miscellaneous
    url: https://mordheimer.net/docs/trading-post
  combat_status: out_of_scope
- id: vial_of_pestilens
  kind: combat-equipment
  name: Vial of Pestilens
  name_i18n:
    es: Vial de Pestilencia
  effect: >-
    The vial may be opened and shoved in the face of the model in base contact that just took the
    Skaven Out of Action. The opponent must roll equal to or under its Toughness or automatically be
    taken Out of Action, no save is allowed. If the opponent succumbs to the disease, he didn't
    manage to go through with the attack and the Skaven is only Stunned not Out of Action. The vial
    may be used once.
  effect_i18n:
    es: >-
      El frasco puede abrirse y empujarse hacia la cara de la miniatura en contacto con la peana que
      acaba de dejar al Skaven fuera de combate. El oponente debe obtener una tirada igual o
      inferior a su Dureza o quedará automáticamente Fuera de Combate, no se permite ninguna
      salvación. Si el oponente sucumbe a la enfermedad, no logró realizar el ataque y el Skaven
      solo queda aturdido, no fuera de acción. El vial se puede utilizar una vez.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Trading Post / Miscellaneous
    url: https://mordheimer.net/docs/trading-post
  combat_status: out_of_scope
- id: victuals
  kind: combat-equipment
  name: Victuals
  name_i18n:
    es: Vituallas
  effect: >-
    Border Town Burning ( 1c ) Fire : Victuals may be used after a battle. If the warband sells
    Treasures, the warband is considered to be one size lower (so a warband with 10-12 members is
    considered to be comprised of 7-9 members instead). A warband may use as many victuals as they
    wish, but note that the warband size cannot be considered lower than 1-3 models.
  effect_i18n:
    es: >-
      Incendio de ciudad fronteriza (1c): Se pueden utilizar víveres después de una batalla. Si la
      banda vende Tesoros, se considera que es de un tamaño inferior (por lo que una banda con 10-12
      miembros se considera compuesta por 7-9 miembros). Una banda puede utilizar tantos víveres
      como desee, pero tenga en cuenta que el tamaño de la banda no puede considerarse inferior a
      1-3 miniaturas.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Trading Post / Miscellaneous
    url: https://mordheimer.net/docs/trading-post
  combat_status: out_of_scope
- id: vodka
  kind: combat-equipment
  name: Vodka
  name_i18n:
    es: Vodka
  effect: >-
    In game terms, vodka is a one-use item of equipment that a Kislevite Hero may give to the
    warband before the start of the game. Every warrior in the warband receives +1 Leadership (up to
    a maximum of 10) for that game. In addition, because of its nullifying alcoholic effects, every
    warband member must test against their Toughness before the start of the game — a failure
    resulting in -1 Initiative for the duration of the game.
  effect_i18n:
    es: >-
      En términos de juego, el vodka es un equipo de un solo uso que un héroe kislevita puede
      entregar a la banda antes del comienzo del juego. Cada guerrero de la banda recibe +1 de
      Liderazgo (hasta un máximo de 10) para esa partida. Además, debido a sus efectos alcohólicos
      anuladores, cada miembro de la banda debe realizar una prueba de Dureza antes del comienzo del
      juego, una falla que resulta en -1 Iniciativa durante la duración del juego.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Trading Post / Miscellaneous
    url: https://mordheimer.net/docs/trading-post
  combat_status: out_of_scope
- id: wagon_stagecoach
  kind: combat-equipment
  name: Wagon, Stagecoach
  name_i18n:
    es: Carro, Diligencia
  effect: >-
    Empire in Flames supplement ( 1b ) For all the rules on how to use Rowboats, Riverboats, and
    Barges in your campaign, see the Vehicles of the Empire section.
  effect_i18n:
    es: >-
      Suplemento Empire in Flames (1b) Para conocer todas las reglas sobre cómo usar botes de remos,
      botes fluviales y barcazas en tu campaña, consulta la sección Vehículos del Imperio.
  source_refs:
  - manual: mordheimer.net
