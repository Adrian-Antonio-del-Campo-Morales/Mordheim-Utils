  kind: armour
  name: Kumfy Gear
  name_i18n:
    es: Ropa Acojinada
  effect: >-
    The Savage Orc name for clothing made from particularly thick, treated, animal skins. These
    skins bestow a 5+ armour save as well as a 5+ save against all fire-based and cold-based
    attacks. These skins are occasionally traded with other Orcs and so may be worn by any Orc
    warband. Kumfy Gear cannot be combined with Warpaint or light armour. 75 gc.
