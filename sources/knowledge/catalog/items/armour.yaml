schema_version: 2
ruleset: mordheim
items:
- id: cathayan_quilted_silk_armour
  kind: armour
  name: Cathayan Quilted Silk Armour
  name_i18n:
    es: Armadura de Seda Acolchada de Cathay
  effect: >-
    The caravans from the far-off lands of the East sometimes bring fabulous, quilted silk armour,
    light as feather yet tough as steel. It is often worn by Imperial nobles under their armour or
    clothes to ward off arrows of Assassins. The Silk Armour adds +1 to the armour saves against any
    type of attack. It can be combined with any other type of armour.
  effect_i18n:
    es: >-
      Las caravanas de las lejanas tierras del Este a veces traen fabulosas armaduras de seda
      acolchadas, ligeras como una pluma pero resistentes como el acero. Los nobles imperiales
      suelen usarlo debajo de su armadura o ropa para protegerse de las flechas de los Asesinos. La
      Armadura de Seda añade +1 a las salvaciones de armadura contra cualquier tipo de ataque. Se
      puede combinar con cualquier otro tipo de armadura.
  source_refs:
  - &id001
    manual: mordheimer.net
    printed_page: 0
    section: Heroes Equipment List
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/cursed-cavalcade
  combat_status: implemented
  mechanic_id: armour.cathayan-quilted-silk
- id: gromril_armour
  kind: armour
  name: Gromril Armour
  name_i18n:
    es: Armadura de Gromril
  effect: >-
    Movement Penalty : Gromril armour ❓ gives the wearer a 4+ basic save, and does not slow him down
    if he is also armed with a shield.
  effect_i18n:
    es: >-
      Penalización de movimiento: la armadura Gromril ❓ le da al usuario una salvación básica de 4+
      y no lo ralentiza si también está armado con un escudo.
