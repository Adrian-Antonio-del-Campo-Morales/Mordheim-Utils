- id: horo
  kind: armour
  name: Horo
  name_i18n:
    es: Horo
  effect: >-
    Woven from the finest silk and adorned with intricate patterns, the Horo drapes over the
    shoulders of Nipponese warriors like a cloak of whispers, offering protection from the biting
    winds of battle while concealing their movements with ethereal grace, an emblem of both elegance
    and stealth amidst the chaos of war. Silk Shadow: A model wearing a horo receives a +1 to all
    armor saves (6+ if no armor is worn) against ranged weapons, as long as they are mounted on a
    horse or warhorse.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Nippon Special Equipment / Horo
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/nipponese-expedition
  combat_status: out_of_scope
  effect_i18n:
    es: >-
      Tejido con la mejor seda y adornado con intrincados motivos, el Horo se drapea sobre los
      hombros de los guerreros nipones como una capa de susurros, ofreciendo protección contra los
      vientos cortantes de la batalla mientras oculta sus movimientos con una gracia etérea; emblema
      a la vez de elegancia y sigilo en medio del caos de la guerra. Sombra de Seda: Una miniatura
      que lleve un horo recibe +1 a todas las salvaciones por armadura (6+ si no lleva armadura)
      contra armas a distancia, siempre que esté montada en un caballo o corcel de guerra.
- id: shield_of_sigmar
  kind: armour
  name: Shield of Sigmar
  name_i18n:
    es: Escudo de Sigmar
  effect: >-
    Passed down through the church, these shields were borne by men led by the Heldenhammer himself.
    An aura surrounds these shields, granting their bearer uncanny protection. Anyone protected by a
    Shield of Sigmar has a special 6+ save versus all ranged attacks. Furthermore, the weight of the
    shield seems diminished: the -1 penalty for bearing a shield with Heavy Armour does not apply.
    Armour Save: 6. Shield of Faith: Anyone protected by a Shield of Sigmar has a special 6+ save
    versus all ranged attacks, and the -1 penalty for bearing a shield with Heavy Armour does not
    apply.
  effect_i18n:
    es: >-
      Transmitidos a través de la iglesia, estos escudos fueron portados por los hombres que lideró
      el propio Martillo de los Héroes. Un aura rodea estos escudos, otorgando a su portador una
      protección sobrenatural. Quien se proteja con un Escudo de Sigmar tiene una salvación especial
      de 6+ contra todos los ataques a distancia. Además, el peso del escudo parece disminuir: no se
      aplica la penalización de -1 por llevar escudo con Armadura Pesada. Salvación por Armadura: 6.
      Escudo de Fe: Quien se proteja con un Escudo de Sigmar tiene una salvación especial de 6+
      contra todos los ataques a distancia, y no se aplica la penalización de -1 por llevar escudo
      con Armadura Pesada.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Special Equipment / Shield of Sigmar
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/protectorate-of-sigmar
  combat_status: out_of_scope
- id: throat_guard
  kind: armour
  name: Throat Guard
  name_i18n:
    es: Protector de Garganta
  effect: >-
    As the vampires of Sylvania rely upon hapless human victims to sate their thirst for blood, it
    is only prudent to protect vulnerable areas. As such, the Throat Guard allows a Slayer the peace
    of mind knowing that their blood shall remain in their veins. All injury rolls caused by a
    Vampire have a special 6+ save while this equipment is worn. This save is not modified by
    strength, but can be bypassed by criticals that ignore armour. It does not add any armour-save
    modifiers, and can be worn on its own, or combined with light or heavy armour. Life Saver: All
    injury rolls caused by a Vampire have a special 6+ save while this equipment is worn. The save
    is not modified by strength, but can be bypassed by criticals that ignore armour. It adds no
    armour-save modifiers.
  effect_i18n:
    es: >-
      Como los vampiros de Sylvania dependen de desdichadas víctimas humanas para saciar su sed de
      sangre, es prudente proteger las zonas vulnerables. Así, el Protector de Garganta permite al
      Slayer tener la tranquilidad de saber que su sangre permanecerá en sus venas. Todas las
      tiradas de heridas causadas por un Vampiro tienen una salvación especial de 6+ mientras se
      lleve este equipo. Esta salvación no se ve modificada por la Fuerza, pero puede evitarse con
      críticos que ignoren la armadura. No añade ningún modificador a la salvación por armadura, y
      puede llevarse solo o combinado con armadura ligera o pesada. Salvavidas: Todas las tiradas de
      heridas causadas por un Vampiro tienen una salvación especial de 6+ mientras se lleve este
      equipo. La salvación no se ve modificada por la Fuerza, pero puede evitarse con críticos que
      ignoren la armadura. No añade ningún modificador a la salvación por armadura.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Special Equipment / Throat Guard
