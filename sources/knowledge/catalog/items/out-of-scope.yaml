  name: Warhound
  name_i18n:
    es: Sabueso de Guerra
  effect: >-
    If you purchase a wardog, it will fight exactly like a member of your warband, though it is
    treated as part of the equipment of the Hero who bought it. You will need a model to represent
    it on a battlefield. In combat the wardog behaves just like every other warrior, including
    counting towards rout tests. In the campaign part (shopping, upkeep, exploration), it counts as
    equipment so does not get counted for upkeep.
  effect_i18n:
    es: >-
      Si compras un perro de guerra, luchará exactamente como un miembro de tu banda, aunque se
      considera parte del equipo del héroe que lo compró. Necesitarás una miniatura para
      representarlo en el campo de batalla. En combate, el perro de guerra se comporta como
      cualquier otro guerrero, incluso cuenta para las pruebas de derrota. En la parte de la campaña
      (compras, mantenimiento, exploración), cuenta como equipo, por lo que no cuenta para el
      mantenimiento.
  source_refs:
  - *id013
  - manual: broheim.net
    printed_page: 3
    section: Watchmen Miscellaneous Equipment / Wardog
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Watchmen.pdf
  combat_status: out_of_scope
- id: wolfcloak
  kind: out-of-scope
  name: Wolfcloak
  name_i18n:
    es: Capalobo
  effect: >-
    To acquire a Wolfcloak, a Hero must pay 10 gc (to represent the expense of traveling to
    Middenheim and taking part in a hunt). In addition, the Hero must roll equal to or under his
    Strength on a D6. If successful, the Hero finds and slays the wolf and can wear its cloak as a
    mark of his skill and prowess. Note that Middenheimers may buy Wolfcloaks when starting their
    warband without making a test for availability. A model wearing a Wolfcloak will gain +1 to his
    armour saves against all shooting attacks.
  effect_i18n:
    es: >-
      Para adquirir una capa de lobo, un héroe debe pagar 10 co (para representar el gasto de viajar
      a Middenheim y participar en una cacería). Además, el Héroe debe obtener una tirada igual o
      inferior a su Fuerza en un D6. Si tiene éxito, el héroe encuentra y mata al lobo y puede usar
      su capa como muestra de su habilidad y destreza. Tenga en cuenta que los habitantes de
      Middenheim pueden comprar Wolfcloaks al iniciar su banda sin realizar una prueba de
      disponibilidad. Un modelo que lleve una capa de lobo obtendrá +1 a sus salvaciones de armadura
      contra todos los ataques de disparo.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Mercenary equipment lists
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/mercenaries
  combat_status: out_of_scope
- id: wolf_rat_mount
  kind: out-of-scope
  name: Wolf Rat Mount
  name_i18n:
    es: Montura de Rata Lobo
  effect: >-
    Though it is extremely challenging, a few Packmasters have developed methods to break the will
    of a Wolf Rat sufficiently for them to be ridden. While not as tough as a Great Pox Rat or Brood
    Horror, many Skaven leaders value the speed of a Wolf Rat mount if the incompetence of
    underlings makes a "tactical withdrawal" necessary. Profile: M9 WS3 BS0 S4 T3 W1 I4 A1 Ld4.
    Poisoned Attack: the mouths of Wolf Rats fester with any number of poxes and corrosive agents.
    Any attacks made by a Wolf Rat Mount are considered to be Strength 4, but do not modify armour
    saves.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Special Equipment / Wolf Rat Mount
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/skaven-of-clan-moulder
  combat_status: out_of_scope
  effect_i18n:
    es: >-
      Aunque es sumamente difícil, algunos Maestros de Manada han desarrollado métodos para quebrar
      la voluntad de una Rata Lobo lo suficiente como para ser montada. Aunque no es tan resistente
      como una Gran Rata de Peste o un Horror de Cría, muchos líderes skaven valoran la velocidad de
      una montura de Rata Lobo cuando la incompetencia de los subordinados hace necesaria una
      «retirada táctica». Perfil: M9 HA3 HP0 F4 R3 H1 I4 A1 L4. Ataque Envenenado: las bocas de las
      Ratas Lobo están podridas por todo tipo de viruelas y agentes corrosivos. Cualquier ataque
      realizado por una Montura de Rata Lobo se considera de Fuerza 4, pero no modifica las
      salvaciones por armadura.
- id: pigback_mount
  kind: out-of-scope
  name: Pigback Mount
  name_i18n:
    es: Montura a Caballito
  effect: >-
    A gnoblar hero may ride a luckless gnoblar, who is forced to carry them piggyback. Profile: M5
    WS2 BS- S2 T- W1 I3 A1 Ld5. Like a Mount: Uses the following standard rules for Mounted Combat
    in the PHB: cannot climb, uses movement of mount, can jump obstacles up to 2", and uses Mounted
    rules for Spears. Cannot Infiltrate. Not Like a Mount: Unlike a mount, a gnoblar on Pigback does
    NOT count as a large target, may enter buildings, and doesn't gain +1AS. May not wear barding.
    Extra Hand: The Pigback has 1 free hand to hold a weapon. It starts with a free dagger, but may
    be given a club or axe. Alternatively, may be given a shield (this increases the rider's save by
    +1, but the mount cannot attack).
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Special Equipment / Pigback Mount
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/ogre-hunting-party
  combat_status: out_of_scope
  effect_i18n:
    es: >-
      Un héroe gnoblar puede montar sobre un desdichado gnoblar, obligado a llevárselo a horcajadas
      a la espalda. Perfil: M5 HA2 HP- F2 R- H1 I3 A1 Ld5. Como una Montura: Usa las siguientes
      reglas estándar de Combate Montado del libro básico: no puede trepar, usa el movimiento de la
      montura, puede saltar obstáculos de hasta 2", y usa las reglas Montadas para lanzas. No puede
      Infiltrarse. No Como una Montura: A diferencia de una montura, un gnoblar a caballito NO
      cuenta como objetivo grande, puede entrar en edificios y no gana +1 a la salvación por
      armadura. No puede llevar gualdrapa. Mano Extra: El Caballito tiene 1 mano libre para sostener
      un arma. Comienza con una daga gratis, pero se le puede dar un garrote o un hacha.
      Alternativamente, se le puede dar un escudo (esto aumenta la salvación del jinete en +1, pero
      la montura no puede atacar).
- id: power_squig
  kind: out-of-scope
  name: Power Squig
  name_i18n:
    es: Squig de Poder
  effect: >-
    The Power Squig acts exactly the same as a Familiar available to all warbands from the Shadow
    Warrior Equipment List. It's just more Snotlingish!
  effect_i18n:
    es: >-
      El Squig de Poder funciona exactamente igual que un Familiar disponible para todas las bandas
      en la Lista de Equipo del Guerrero Sombra. ¡Solo que es más snotlinguesco!
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: New Equipment / Power Squig
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/snotlings
  combat_status: out_of_scope
- id: society_familiar
  kind: out-of-scope
  name: Familiar
  name_i18n:
    es: Familiar
  effect: >-
    Familiars are animals that share a special connection with a particular Wizard. Each Wizard may
    possess only one Familiar. While Familiars are considered equipment they are also living
    creatures. If one is taken Out Of Action during a battle then they roll for injuries as a
    Henchman. They do not, however, count towards maximum warband size or towards Rout Tests. If a
    Wizard's Familiar dies or leaves then he may search for a replacement using rarity rules.
    Profiles — Dog: M6 WS4 S3 T3 W1 I4 A1 Ld5; Cat: M6 WS4 S2 T2 W1 I6 A1 Ld5; Raven: M2 WS2 S1 T1
    W1 I4 A1 Ld5; Viper: M3 WS4 S2/4* T1 W1 I5 A1 Ld5. Small Target: models shooting at a Familiar
    suffer a -1 to their BS due to the small size of the target. (* Viper: S2, or S4 vs targets
    susceptible to poison.) Small Target: Models shooting at a Familiar suffer a -1 to their BS due
    to the small size of the target. Loyal (Dog): A Dog Familiar that remains within 6 inches of its
    wizard is immune to fear. Sniff (Dog): A Dog has a keen sense of smell and can be used to aid
    during exploration. The warband may roll one additional dice and may use the result of this dice
    rather than that of one of the surviving heroes. Go for the Eyes! (Cat): If both attacks
    successfully wound in one round then the enemy model is blinded and may not fight back until
    their next turn. If only one attack wounds then the affected model suffers a -1 to both WS & BS
    until the beginning of their next turn. Fly (Raven): May fly up to 12 inches anywhere on the
    table. I See You! (Raven): Spells may be cast on models if they are within range of either the
    Wizard or the Raven. Therefore, a spell with a 12-inch range may be cast on models within 12
    inches of either model. Poison (Viper): Should a Viper roll a 6 to hit, the attack automatically
    wounds with no armour save. Any other successful hit result on a target susceptible to poison
    will suffer a S4 hit. If the creature is immune to poison then treat the attack as S2. Coiled
    and Ready (Viper): A Viper is not easily caught unaware. A Viper has Lightning Reflexes.
  effect_i18n:
    es: >-
      Los Familiares son animales que comparten una conexión especial con un Mago concreto. Cada
      Mago solo puede poseer un Familiar. Aunque los Familiares se consideran equipo, también son
      criaturas vivientes. Si uno queda Fuera de Combate durante una batalla, tira heridas como un
      Secuaz. Sin embargo, no cuentan para el tamaño máximo de la banda ni para las tiradas de
      Huida. Si el Familiar de un Mago muere o lo abandona, puede buscar un reemplazo usando las
      reglas de rareza. Perfiles — Perro: M6 HA4 F3 R3 H1 I4 A1 Ld5; Gato: M6 HA4 F2 R2 H1 I6 A1
      Ld5; Cuervo: M2 HA2 F1 R1 H1 I4 A1 Ld5; Víbora: M3 HA4 F2/4* R1 H1 I5 A1 Ld5. Objetivo
      Pequeño: las miniaturas que disparan a un Familiar sufren -1 a su HP debido al pequeño tamaño
      del objetivo. (* Víbora: F2, o F4 contra objetivos susceptibles al veneno.) Objetivo Pequeño:
      Las miniaturas que disparan a un Familiar sufren -1 a su HP debido al pequeño tamaño del
      objetivo. Leal (Perro): Un Familiar Perro que permanezca a 6 pulgadas de su mago es inmune al
      miedo. Olfateo (Perro): El Perro tiene un olfato muy fino y puede usarse para ayudar durante
      la exploración. La banda puede tirar un dado adicional y usar el resultado de este dado en
      lugar del de uno de los héroes supervivientes. ¡A los Ojos! (Gato): Si ambos ataques hieren
      con éxito en la misma ronda, la miniatura enemiga queda cegada y no puede devolver los golpes
      hasta su siguiente turno. Si solo uno de los ataques hiere, la miniatura afectada sufre -1 a
      HA y HP hasta el comienzo de su siguiente turno. Volar (Cuervo): Puede volar hasta 12 pulgadas
      a cualquier punto de la mesa. ¡Te Veo! (Cuervo): Los hechizos pueden lanzarse sobre miniaturas
      que estén dentro del alcance del Mago o del Cuervo. Por tanto, un hechizo con alcance de 12
      pulgadas puede lanzarse sobre miniaturas a 12 pulgadas de cualquiera de los dos modelos.
      Veneno (Víbora): Si la Víbora saca un 6 por impactar, el ataque hiere automáticamente sin
      salvación por armadura. Cualquier otro impacto exitoso contra un objetivo susceptible al
      veneno inflige un impacto de F4. Si la criatura es inmune al veneno, considera el ataque como
      F2. En Guardia (Víbora): No es fácil pillarse a una Víbora desprevenida. Una Víbora tiene
      Reflejos Súbitos.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Special Equipment / Familiar
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/sorcerous-society
  combat_status: out_of_scope
- id: wicker_man
  kind: out-of-scope
  name: Wicker Man
  name_i18n:
    es: Hombre de Mimbre
  effect: >-
    Golems follow the commands of a Petru. They can be fashioned using witchcraft from mud with
    wicker, driftwood, or (when available) flesh parts. They are lifeless constructs in the shape of
    a man. Retainers that never make excuses or ask for a fix. Profile: M4 WS2 BS0 S4 T4 W1 I1 A1
    Ld5. Zombified: Golems use all of the special rules for a zombie; Cause fear, May Not Run, No
    Brain etc. Construct: A Wicker Man ignores any injury rolled on the Injury chart on the roll of
    a 4+ and continues fighting; not an armour save and so not modified by the Strength of the
    attack. This rule is ignored for wounds caused by magic or magic weapons.
  effect_i18n:
    es: >-
      Los gólems obedecen las órdenes de un Petru. Pueden fabricarse con brujería a partir de barro
      con mimbre, madera a la deriva o (cuando hay disponible) partes de carne. Son construcciones sin
      vida con forma de hombre. Sirvientes que nunca ponen excusas ni piden una reparación. Perfil: M4
      WS2 BS0 S4 T4 W1 I1 A1 Ld5. Zombificado: los gólems usan todas las reglas especiales de un
      zombi; Causa miedo, No puede correr, Sin cerebro, etc. Construcción: un Hombre de Mimbre ignora
      cualquier herida obtenida en la tabla de Heridas con una tirada de 4+ y sigue luchando; no es
      una salvación de armadura, por lo que no la modifica la Fuerza del ataque. Esta regla se ignora
      para las heridas causadas por magia o por armas mágicas.
  source_refs:
  - manual: broheim.net
    printed_page: 178
    section: Strigany Special Equipment / Wicker Man
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Channel Rats.pdf
  combat_status: out_of_scope
- id: scuttling_hand
  kind: out-of-scope
  name: Scuttling Hand
  name_i18n:
    es: Mano Reptante
  effect: >-
    A hand cut from a corpse of a murderer, called a 'Hand of Glory', is well known by warlocks for
    its magical properties. Vampires have perfected a way of reanimating these hands for use as
    assistants, attendants, and even familiars. They are only able of causing a paltry amount of
    damage in a fight but can be used as a distraction at a vital moment. Profile: M3 WS1 BS0 S1 T1
    W1 I4 A1 Ld7. Immune to Psychology, Dodge, Scale Sheer Surfaces. Silent Move: Scuttling Hands
    always remain hidden unless they attack an enemy warrior.
  effect_i18n:
    es: >-
      Una mano cortada del cadáver de un asesino, llamada 'Mano de Gloria', es bien conocida por los
      brujos por sus propiedades mágicas. Los vampiros han perfeccionado una forma de reanimar estas
      manos para usarlas como ayudantes, sirvientes e incluso familiares. Solo son capaces de causar
      una mísera cantidad de daño en una pelea, pero pueden usarse como distracción en un momento
      vital. Perfil: M3 WS1 BS0 S1 T1 W1 I4 A1 Ld7. Inmune a la Psicología, Esquiva, Escalar
      Superficies. Movimiento Sigiloso: las Manos Reptantes permanecen siempre ocultas a menos que
      ataquen a un guerrero enemigo.
  source_refs:
  - manual: broheim.net
    printed_page: 178
    section: Strigany Special Equipment / Scuttling Hand
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Channel Rats.pdf
  combat_status: out_of_scope
- id: angel_wings
  kind: out-of-scope
  name: Angel Wings
  name_i18n:
    es: Alas de Ángel
  effect: >-
    Armen Abbas' huge batwing cloak. The Angel Wings grant Armen the ability to glide through the
    air (see the Angel Wings rule of the Armen Abbas Dramatis Personae profile for the full glide
    mechanics: 1"-wide, 24"-long flight line, fear tests for susceptible enemies beneath the line,
    always fires first during the shooting phase).
  effect_i18n:
    es: >-
      La enorme capa de alas de murciélago de Armen Abbas. Las Alas de Ángel otorgan a Armen la
      capacidad de planear por el aire (ver la regla Alas de Ángel del perfil de Dramatis Personae
      de Armen Abbas para la mecánica completa de planeo: línea de vuelo de 1" de ancho y 24" de
      largo, tiradas de Miedo para los enemigos susceptibles bajo la línea, siempre dispara primero
      en la fase de disparo).
  source_refs:
  - manual: broheim.net
    printed_page: 16
    section: Dramatis Personae / Armen Abbas / Angel Wings
    url: https://broheim.net/downloads/fo/97RelicsoftheCrusadesPt2.pdf
  combat_status: out_of_scope
- id: stickfire
  kind: out-of-scope
  name: Stickfire
  name_i18n:
    es: Varillas de Fuego
  effect: >-
    Araby incendiary sticks carried by Armen Abbas. The source prints no game rules for them beyond
    the equipment note that he carries "enough stickfire and vermin pots to last for the entire
    battle".
  effect_i18n:
    es: >-
      Varillas incendiarias de Araby que lleva Armen Abbas. La fuente no imprime reglas de juego
      para ellas más allá de la nota de equipo de que lleva "suficientes varillas de fuego y ollas
      de bichos para toda la batalla".
  source_refs:
  - manual: broheim.net
    printed_page: 16
    section: Dramatis Personae / Armen Abbas / Equipment
    url: https://broheim.net/downloads/fo/97RelicsoftheCrusadesPt2.pdf
  combat_status: out_of_scope
- id: vermin_pot
  kind: out-of-scope
  name: Vermin Pot
  name_i18n:
    es: Olla de Bichos
  effect: >-
    Pot of vermin carried by Armen Abbas. The source prints no game rules for it beyond the
    equipment note that he carries "enough stickfire and vermin pots to last for the entire battle".
  effect_i18n:
    es: >-
      Olla de bichos que lleva Armen Abbas. La fuente no imprime reglas de juego para ella más allá
      de la nota de equipo de que lleva "suficientes varillas de fuego y ollas de bichos para toda
      la batalla".
  source_refs:
  - manual: broheim.net
    printed_page: 16
    section: Dramatis Personae / Armen Abbas / Equipment
    url: https://broheim.net/downloads/fo/97RelicsoftheCrusadesPt2.pdf
  combat_status: out_of_scope
- id: diving_bell_helmet
  kind: out-of-scope
  name: Diving Bell Helmet
  name_i18n:
    es: Casco de Campana de Buceo
  effect: >-
    Rusted diving equipment including a diving bell for a helmet, worn by the Ogre Treasure-Hunter.
    Flavour gear: the source grants it no effect of its own — the water movement and breathing
    benefit is covered by the Ogre's Diver rule (counts as aquatic).
  effect_i18n:
    es: >-
      Equipo de buceo oxidado que incluye una campana de buceo a modo de casco, que viste el
      Cazatesoros Ogro. Equipamiento de sabor: la fuente no le concede efecto propio; el beneficio
      de moverse y respirar en el agua queda cubierto por la regla Buceador del ogro (cuenta como
      Acuático).
  source_refs:
  - manual: broheim.net
    printed_page: 1
    section: Specialists / Ogre Treasure-Hunter / Equipment
    url: https://broheim.net/downloads/hiredswords/mutinyinmarienburg/Specialists.pdf
  combat_status: out_of_scope
- id: runic_builders_boots
  kind: out-of-scope
  name: Builder's Boots
  name_i18n:
    es: Botas del Constructor
  effect: >-
    Whilst runes are commonly inscribed on weapons or armour they are much less common on other
    items. These boots are therefore a very rare item. They are said to have been made for one of
    the engineers who built part of the stronghold in forgotten times. A model wearing these boots
    may move normally (including running, charging, etc) on any kind of terrain, including vertical
    surfaces. When moving the model simply adds the distances moved horizontally to that moved
    vertically, with no initiative test needed (except to jump across gaps).
  effect_i18n:
    es: >-
      Aunque las runas suelen grabarse en armas o armaduras, son mucho menos comunes en otros
      objetos, por lo que estas botas son un objeto muy raro. Se dice que fueron fabricadas para uno
      de los ingenieros que construyó parte del bastión en tiempos olvidados. Una miniatura que las
      lleve puede moverse con normalidad (incluyendo correr, cargar, etc.) sobre cualquier tipo de
      terreno, incluidas superficies verticales: simplemente suma las distancias recorridas en
      horizontal a las recorridas en vertical, sin necesitar tirada de Iniciativa (salvo para saltar
      huecos).
  source_refs:
  - manual: broheim.net
    printed_page: 70
    section: Runic Artefacts Table / Builder's Boots
    url: https://broheim.net/downloads/campaigns/karakazgal/Karak Azgal.pdf
  combat_status: out_of_scope
- id: field_trebuchet
  kind: out-of-scope
  name: Field Trebuchet
  name_i18n:
    es: Trébuchet de Campaña
  effect: >-
    Profile: M* WS- BS- S- T7 W3 I- A- Ld-. Range 12"-48"; strength: special; special rules: hard to
    fire, large target, constructed, ammo for all occasions, explosive radius, artillery. Hard to
    fire: the Trebuchet can fire once every other turn with two crew. Constructed: the Field
    Trebuchet is a large contraption which cannot be moved when set up; at the start of a match the
    Trebuchet starts as 4 small crates carried by the operating crew (4 non-Knight models, at least
    until it is set up; only Men-at-Arms may operate it); finding a suitable spot takes D3 turns to
    set up; once set up it cannot move but may swivel on the spot; deconstructing takes 1 turn; only
    Bretonnian Henchmen and Squires know anything about the siege weapon and no one else may
    deconstruct it. Artillery: the Trebuchet is a siege weapon. Availability: special — takes D3+1
    games to build if not bought at the start of the campaign. Mounted Yeomen may not be fielded
    with the Trebuchet (one or the other). 175 gold crowns.
  effect_i18n:
    es: >-
      Perfil: M* WS- BS- S- T7 W3 I- A- Ld-. Alcance 12"-48"; Fuerza: especial; reglas especiales:
      Difícil de disparar, Objetivo Grande, Se Construye, Munición para todas las ocasiones, Radio
      Explosivo, Artillería. Difícil de disparar: el Trébuchet puede disparar un turno sí y otro no
      con dos servidores. Se Construye: el Trébuchet de Campaña es un gran artefacto que no puede
      moverse una vez montado; al comienzo de una partida el Trébuchet empieza como 4 pequeñas cajas
      transportadas por la tripulación que lo opera (4 modelos no Caballeros, al menos hasta que esté
      montado; solo los Hombres de Armas pueden operarlo); encontrar un lugar adecuado requiere 1D3
      turnos de montaje; una vez montado no puede moverse, pero puede girar sobre su posición;
      desmontarlo lleva 1 turno; solo los Secuaces y Escuderos bretonianos saben algo de esta arma de
      asedio y nadie más puede desmontarla. Artillería: el Trébuchet es un arma de asedio.
      Disponibilidad: especial — tarda 1D3+1 partidas en construirse si no se compra al inicio de la
      campaña. Los Vassalos Montados no pueden desplegarse con el Trébuchet (uno u otro). 175 coronas
      de oro.
  source_refs:
  - manual: broheim.net
    printed_page: 2
    section: Knights of the Bitter Moors Bretonnian Special Equipment / Field Trebuchet
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Knights%20Of%20The%20Bitter%20Moors.pdf
  combat_status: out_of_scope
- id: slave
  kind: out-of-scope
  name: Slave
  name_i18n:
    es: Esclavo
  effect: >-
    Miscellaneous equipment (Heroes only) of the Slavers warband: a purchased slave. A slaver
    warband may have up to 20 warriors even though hiring restrictions allow a maximum of 12,
    because a slave merchant isn't much of a slave merchant without slaves — slaves bought this way
    make up the numbers. Slaves are generally ill-treated: if any slave achieves the 'Lad's got the
    Talent' advance, the slave must make a Leadership test; if passed the merchant frees him (he
    retains his statistic line but his type changes to caravan guard and may become a warband
    leader); if failed the slave is removed from the warband list and becomes a new eunuch in his
    own henchman group. 8 dinars.
  effect_i18n:
    es: >-
      Equipo misceláneo (solo Héroes) de la banda de los Esclavistas: un esclavo comprado. Una banda
      esclavista puede tener hasta 20 guerreros aunque las restricciones de contratación permitan un
      máximo de 12, porque un mercader de esclavos no es gran cosa sin esclavos; los esclavos
      comprados así completan el número. Los esclavos suelen ser maltratados: si algún esclavo logra
      el avance 'El chaval tiene talento', el esclavo debe hacer un chequeo de Liderazgo; si lo
      supera, el mercader lo libera (conserva su línea de características, pero su tipo cambia a
      guardián de caravana y puede convertirse en líder de banda); si lo falla, el esclavo se retira
      de la lista de la banda y se convierte en un nuevo eunuco en su propio grupo de secuaces. 8
      dinares.
  source_refs:
  - manual: broheim.net
    printed_page: 10
    section: Slavers Miscellaneous Equipment (Heroes only) / Slave
    url: https://broheim.net/downloads/fo/97RelicsoftheCrusadesPt2.pdf
  combat_status: out_of_scope
- id: rel_riding_horse
  kind: out-of-scope
  name: Riding Horse
  name_i18n:
    es: Caballo de Montar
  effect: >-
    Riding horse listed in the Arabian warband miscellaneous/equipment lists (Turjuk heroes, 40
    dinars; Disciples of Maldred, 30 gc). Mounted models follow the optional rules for mounts. NOTE:
    the active KB has no generic Riding Horse item; at promotion consider merging with the KB's
    mount handling or keep as source-scoped entry. 30 gc / 40 dinars depending on list.
  effect_i18n:
    es: >-
      Caballo de montar listado en las listas de equipo/misceláneo de las bandas arábigas (héroes
      Turjuk, 40 dinares; Discípulos de Maldred, 30 gc). Los modelos montados siguen las reglas
      opcionales de monturas. NOTA: la KB activa no tiene un objeto Caballo de Montar genérico; al
      promover, considera fusionarlo con el tratamiento de monturas de la KB o mantenerlo como entrada
      acotada a la fuente. 30 gc / 40 dinares según la lista.
  source_refs:
  - manual: broheim.net
    printed_page: 3
    section: Disciples of Maldred / Riding Horse
    url: https://broheim.net/downloads/warbands/supplement/mousillon/Disciples%20of%20Maldred.pdf
  - manual: broheim.net
    printed_page: 3
    section: Turjuk Heroes equipment list / Riding Horse
    url: https://broheim.net/downloads/fo/97RelicsoftheCrusadesPt2.pdf
  combat_status: out_of_scope
- id: arachnid_mount
  kind: out-of-scope
  name: Arachnid Mount
  name_i18n:
    es: Montura de Arácnido
  effect: >-
    If you are using the optional rules for mounts, then your warband's heroes may ride giant
    spiders. The rider's Movement is increased to 6, and armour save increased by +1, exactly as if
    mounted on an ordinary horse. The rider need not dismount to climb terrain (including building
    exteriors) and the spider's natural climbing abilities allow the rider to re-roll any failed
    climbing attempts. 45 gold crowns, Rare 5.
  effect_i18n:
    es: >-
      Si usas las reglas opcionales de monturas, los héroes de tu banda pueden montar arañas gigantes.
      El Movimiento del jinete aumenta a 6 y su salvación de armadura en +1, exactamente como si
      montara un caballo corriente. El jinete no necesita desmontar para trepar por el terreno
      (incluidas las fachadas de los edificios) y las habilidades trepadoras naturales de la araña le
      permiten repetir cualquier intento fallido de trepar. 45 coronas de oro, Rara 5.
  source_refs:
  - manual: broheim.net
    printed_page: 2
    section: Forest Goblins special equipment / Arachnid Mount
    url: https://broheim.net/downloads/warbands/supplement/lustria/Forest%20Goblins.pdf
  combat_status: out_of_scope
- id: hunting_bird
  kind: out-of-scope
  name: Hunting Bird
  name_i18n:
    es: Ave de Cetrería
  effect: >-
    Special rules: Falconer. A good bird, trained almost from the egg, is a lethal pet: huge
    she-hawks and warhawks require jesses and a hood, but a well-trained bird does not take to the
    air until signalled. Hunting birds may only be used by a Hero with the animal handling skill
    'Falconer'. A well trained fighting falcon is fully capable of blinding an opponent. Hunting
    birds can be used as missile weapons and as weapons in hand-to-hand combat: range of the falcon
    24", roll to hit using the warrior's Ballistic Skill; in close combat falcons strike first with
    a single attack using the warrior's Weapon Skill, each successful attack inflicts a Strength 3
    hit. If the Hero is taken out of action the falcon flies away, returning after the battle.
    Falcons cannot be attacked or slain, but if the Hero is slain the falcons are lost. A warrior
    must wear a falconry glove, otherwise roll on the Serious Injury chart in the post battle
    sequence; a falconer may supervise only a single hunting bird. 25 gc, Rare 12 (Sergeants only).
  effect_i18n:
    es: >-
      Reglas especiales: Cetrero. Un pájaro bien adiestrado, casi desde el huevo, es una mascota
      letal: las enormes halconas y los halcones de guerra requieren correas y caperuza, pero un
      pájaro bien adiestrado no levanta el vuelo hasta que se le da la señal. Las aves de cetrería
      solo pueden ser usadas por un Héroe con la habilidad de trato con animales 'Cetrero'. Un halcón
      de caza bien adiestrado es perfectamente capaz de cegar a un oponente. Las aves de cetrería
      pueden usarse como armas de misil y como armas en combate cuerpo a cuerpo: alcance del halcón
      24", tira para impactar usando la Habilidad de Disparo del guerrero; en combate cuerpo a cuerpo
      los halcones golpean primero con un único ataque que usa la Habilidad de Armas del guerrero, y
      cada ataque exitoso inflige un impacto de Fuerza 3. Si el Héroe queda fuera de combate, el
      halcón se marcha volando y regresa tras la batalla. Los halcones no pueden ser atacados ni
      muertos, pero si el Héroe muere los halcones se pierden. Un guerrero debe llevar un guante de
      cetrería; de lo contrario tira en la tabla de Heridas Graves en la secuencia posterior a la
      batalla; un cetrero solo puede supervisar una única ave de cetrería. 25 gc, Rara 12 (solo
      Sargentos).
  source_refs:
  - manual: broheim.net
    printed_page: 3
    section: Watchmen Miscellaneous Equipment / Hunting bird
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Watchmen.pdf
  combat_status: out_of_scope
- id: watch_carriage
  kind: out-of-scope
  name: Watch Carriage / Stage Coach
  name_i18n:
    es: Carruaje de la Guardia / Coche de Línea
  effect: >-
    Black Caps: City Watch patrols may requisition one Watch Carriage with two horses before every
    battle. Listed as watch carriage/stage coach in the Watchmen miscellaneous equipment. 100 gc.
  effect_i18n:
    es: >-
      Gorras Negras: las patrullas de la Guardia Urbana pueden requisar un Carruaje de la Guardia con
      dos caballos antes de cada batalla. Aparece como carruaje de la guardia / coche de línea en el
      equipo misceláneo de los Guardias. 100 gc.
  source_refs:
  - manual: broheim.net
    printed_page: 3
    section: Watchmen Miscellaneous Equipment / Watch carriage/Stage coach
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Watchmen.pdf
  combat_status: out_of_scope
- id: hunting_hounds
  kind: out-of-scope
  tags:
  - animal
  name: Hunting Hounds
  name_i18n:
    es: Sabuesos de Caza
  effect: >-
    Profile M 6, WS 4, BS 0, S 4, T 3, W 1, I 4, A 1, Ld 10. Weapons/armour: Jaws and brutality! War
    hounds never use or need weapons and armour. Called by the Horn of the Wild Hunt: on a result of
    2 on the Horn's table D3+1 Hunting Hounds appear. Animals: War hounds are animals and thus do
    not gain experience.
  effect_i18n:
    es: >-
      Perfil M 6, HA 4, HP 0, F 4, R 3, H 1, I 4, A 1, L 10. Armas/armadura: ¡Fauces y brutalidad!
      Los sabuesos de guerra nunca usan ni necesitan armas ni armadura. Llamados por el Cuerno de la
      Cacería Salvaje: con un resultado de 2 en la tabla del Cuerno aparecen 1D3+1 Sabuesos de Caza.
      Animales: Los sabuesos de guerra son animales y por tanto no ganan experiencia.
  source_refs:
  - manual: broheim.net
    printed_page: 6
    section: Animals of the Hunt / Hunting Hounds
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Fen%20Guard.pdf
  combat_status: out_of_scope
- id: bear_of_the_hunt
  kind: out-of-scope
  name: Bear
  name_i18n:
    es: Oso
  effect: >-
    Profile M 6, WS 3, BS 0, S 5, T 5, W 2, I 2, A 2, Ld 6. Special rules: Trained, Fear, Bear Hug,
    Fiercely Loyal, Woodland Dwelling, Animal. Called by the Horn of the Wild Hunt: on a result of 4
    on the Horn's table a Bear joins the battle. Bear Hug: If the Bear hits the same enemy warrior
    with both of his attacks in the same round of combat, the player may choose to make a single
    Bear Hug attack instead of resolving the attacks normally. If this option is chosen, each player
    must roll a D6 and add his model's Strength to the roll. If the Bear's total is higher or the
    totals are equal, the opposing warrior takes a single automatic wound with no armour save
    allowed. If the enemy warrior's total is higher, the warrior has broken the Bear's hold and
    suffers no damage from the attack. Woodland Dwelling: Bears suffer no movement penalty for
    moving through wooded areas.
  effect_i18n:
    es: >-
      Perfil M 6, HA 3, HP 0, F 5, R 5, H 2, I 2, A 2, L 6. Reglas especiales: Adiestrado, Miedo,
      Abrazo de Oso, Ferozmente Leal, Morador del Bosque, Animal. Llamado por el Cuerno de la
      Cacería Salvaje: con un resultado de 4 en la tabla del Cuerno un Oso se une a la batalla.
      Abrazo de Oso: Si el Oso impacta al mismo guerrero enemigo con sus dos ataques en la misma
      ronda de combate, el jugador puede elegir hacer un único ataque de Abrazo de Oso en lugar de
      resolver los ataques normalmente. Si se elige esta opción, cada jugador debe tirar 1D6 y sumar
      la Fuerza de su miniatura a la tirada. Si el total del Oso es mayor o los totales son iguales,
      el guerrero enemigo sufre una herida automática sin salvación por armadura. Si el total del
      guerrero enemigo es mayor, este ha roto el agarre del Oso y no sufre daño por el ataque.
      Morador del Bosque: Los Osos no sufren penalización de movimiento al atravesar zonas boscosas.
  source_refs:
  - manual: broheim.net
    printed_page: 6
    section: Animals of the Hunt / Bear
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Fen%20Guard.pdf
  combat_status: out_of_scope
- id: sabre_toothed_tiger
  kind: out-of-scope
  name: Sabre Toothed Tiger
  name_i18n:
    es: Tigre de Dientes de Sable
  effect: >-
    Profile M 7, WS 4, BS 0, S 5, T 4, W 2, I 6, A 3, Ld 4 (printed as "Big Cat"). Special rules:
    Fear, Animal. Called by the Horn of the Wild Hunt: on a result of 3 on the Horn's table a Tiger
    joins the battle.
  effect_i18n:
    es: >-
      Perfil M 7, HA 4, HP 0, F 5, R 4, H 2, I 6, A 3, L 4 (impreso como «Big Cat»). Reglas
      especiales: Miedo, Animal. Llamado por el Cuerno de la Cacería Salvaje: con un resultado de 3
      en la tabla del Cuerno un Tigre se une a la batalla.
  source_refs:
  - manual: broheim.net
    printed_page: 6
