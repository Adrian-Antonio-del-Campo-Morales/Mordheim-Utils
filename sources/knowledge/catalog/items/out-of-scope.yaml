- id: net
  kind: out-of-scope
  name: Net
  name_i18n:
    es: Red
  effect: >-
    "All one use only items are clearly identified as such. Net is not, so it can be recovered
    between battles. As indicated in the colour text, it can indeed be torn, cut etc. during battle,
    but the warrior will simply repair it. I mean swords get bent, shields splintered, armour
    battered, spear points get blunted during a typical Mordheim battle, and we simply consider the
    warriors have the basic skills to repair such damage. Same goes for the nets." - Tuomas Pirinen,
    Facebook
  effect_i18n:
    es: >-
      "Todos los artículos de un solo uso están claramente identificados como tales. La red no, por
      lo que se puede recuperar entre batallas. Como se indica en el texto en color, de hecho se
      puede romper, cortar, etc. durante la batalla, pero el guerrero simplemente la reparará.
      Quiero decir, las espadas se doblan, los escudos se astillan, las armaduras se estropean, las
      puntas de las lanzas se despuntan durante una batalla típica de Mordheim, y simplemente
      consideramos que los guerreros tienen las habilidades básicas para reparar ese daño. Lo mismo
      ocurre con las redes". -Tuomas Pirinen, Facebook
  source_refs:
