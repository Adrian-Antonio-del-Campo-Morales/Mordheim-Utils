      Alcance: 8" Fuerza: 2 Fuego: Si golpeas, tira un D6, con un 4+ tu oponente se prende fuego.
      Debe tirar un D6 en cada fase de Recuperación, con un 4+ extingue el fuego o inmediatamente
      sufre un impacto S4 y solo puede moverse. Los modelos amigos pueden ayudar a extinguir el
      modelo que está en llamas. Deben estar en contacto base con base y necesitan tirar un 4+ con
      un D6. Contra objetivos secos como Momias, tienen Fuerza 3 en adelante. un 2+ en 1D6 la Momia
      se incendia [email protected] Cómprame un café Comentarios discord Broheim.net r/mordheim
      Mordheim discord.
