  combat_status: out_of_scope
- id: great_stag
  kind: out-of-scope
  name: Great Stag
  name_i18n:
    es: Gran Ciervo
  effect: >-
    Profile M 8, WS 4, BS 0, S 4, T 4, W 2, I 6, A 2, Ld 10. Special rules: Fear, Animal, Forest
    Walk, Thunderous Charge. Called by the Horn of the Wild Hunt: on a result of 5 on the Horn's
    table a Great Stag joins the battle. Thunderous Charge: A charging Great Stag is a terrifying
    sight, the ground itself trembling as the Forest Lord thunders into the ranks of their foe. On
    any turn when a Great Stag charges more than 8", he causes D3 impact hits at the basic strength
    of the Stag.
  effect_i18n:
    es: >-
      Perfil M 8, HA 4, HP 0, F 4, R 4, H 2, I 6, A 2, L 10. Reglas especiales: Miedo, Animal, Paso
      del Bosque, Carga Atronadora. Llamado por el Cuerno de la Cacería Salvaje: con un resultado de
      5 en la tabla del Cuerno un Gran Ciervo se une a la batalla. Carga Atronadora: Un Gran Ciervo
      que carga es una visión aterradora, el propio suelo tiembla cuando el Señor del Bosque irrumpe
      entre las filas de su enemigo. En cualquier turno en el que un Gran Ciervo cargue más de 8",
      causa 1D3 impactos a la Fuerza básica del Ciervo.
  source_refs:
  - manual: broheim.net
    printed_page: 6
    section: Animals of the Hunt / Great Stag
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Fen%20Guard.pdf
  combat_status: out_of_scope
- id: great_eagle
  kind: out-of-scope
  name: Great Eagle
  name_i18n:
    es: Gran Águila
  effect: >-
    Profile M 4, WS 4, BS 0, S 4, T 4, W 3, I 2, A 2, Ld 6. Called by the Horn of the Wild Hunt: on
    a result of 6 on the Horn's table a Great Eagle joins the battle. Flying Charge: A Great Eagle
    may fly up to 16". Any model a Great Eagle comes into contact with while flying is considered
    charged. Models that are stunned or knocked down cannot be charged as it is too difficult for
    the Great Eagle to fly that close to the ground. Aerial Escape: Great Eagles circle their prey
    before swooping in and remain in the air while harrying a foe. This makes them harder to hit.
    Only a warrior with sharp enough reflexes or a long pointy weapon stands a chance of pinning a
    Great Eagle down! If the charged model strikes first then resolve combat as normal. Otherwise
    after the Great Eagle attacks it retreats immediately to a lofty position within 2D6" before the
    charged model reacts. Similarly to escaping from combat, the Great Eagle receives an automatic
    hit from its opponent (see page 161 of the Mordheim rulebook) unless it passes a Leadership
    test. Drop Attack: If a Great Eagle is successful with both attacks in the first round of combat
    then the Great Eagle has successfully grabbed on to her enemy and swoops back up in the air to
    drop the model, allowing gravity to do the work instead! The attacks themselves do not wound but
    instead roll a D6 and a scatter dice. That is the distance and direction from the place where
    the attack took place that the model was dropped. Roll another D6 to determine a height from
    which the model falls. Falling models take D3 hits at a Strength equal to the height. If a model
    falls into a building then count the fall to where they land and then determine if the model
    falls again if it is within 1" of the platform edge. Any model that is struck by the dropped
    model suffers a Strength 3 hit. Large targets may only be dropped D3" due to weight. After
    dropping a model the Great Eagle retreats 2D6" to the nest or nearby rooftop. Talons: Creatures
    with talons are accustomed to fighting unarmed. Grounded: After the combat phase if a Great
    Eagle has been unable to flee for any reason the model is assumed to have landed and may be
    charged. While on the ground, a Great Eagle uses its movement characteristic and may only fly
    again when able to.
  effect_i18n:
    es: >-
      Perfil M 4, HA 4, HP 0, F 4, R 4, H 3, I 2, A 2, L 6. Llamada por el Cuerno de la Cacería
      Salvaje: con un resultado de 6 en la tabla del Cuerno una Gran Águila se une a la batalla.
      Carga en Vuelo: Una Gran Águila puede volar hasta 16". Cualquier miniatura con la que entre en
      contacto mientras vuela se considera cargada. Las miniaturas aturdidas o derribadas no pueden
      ser cargadas, pues es demasiado difícil para la Gran Águila volar tan cerca del suelo. Escape
      Aéreo: Las Grandes Águilas circulan sobre su presa antes de abatirse sobre ella y permanecen
      en el aire mientras hostigan al enemigo. Esto las hace más difíciles de impactar. ¡Solo un
      guerrero con reflejos lo bastante rápidos o con un arma larga y puntiaguda tiene alguna
      posibilidad de inmovilizar a una Gran Águila! Si la miniatura cargada golpea primero, resuelve
      el combate con normalidad. En caso contrario, tras atacar la Gran Águila se retira de
      inmediato a una posición elevada a 2D6" antes de que reaccione la miniatura cargada. De forma
      similar a escapar de un combate, la Gran Águila recibe un impacto automático de su oponente
      (ver página 161 del reglamento de Mordheim) a menos que supere un chequeo de Liderazgo. Ataque
      en Picado: Si una Gran Águila tiene éxito con ambos ataques en la primera ronda de combate, ha
      agarrado a su enemigo y remonta el vuelo para dejarlo caer, ¡dejando que la gravedad haga el
      trabajo! Los ataques en sí no hieren; en su lugar tira 1D6 y un dado de dispersión. Esa es la
      distancia y dirección, desde el lugar donde se produjo el ataque, a la que se dejó caer a la
      miniatura. Tira otro 1D6 para determinar la altura desde la que cae. Las miniaturas que caen
      reciben 1D3 impactos a una Fuerza igual a la altura. Si una miniatura cae dentro de un
      edificio, cuenta la caída hasta donde aterriza y luego determina si vuelve a caer si está a 1"
      del borde de la plataforma. Cualquier miniatura golpeada por la miniatura que cae sufre un
      impacto de Fuerza 3. Las miniaturas grandes solo pueden dejarse caer 1D3" debido a su peso.
      Tras dejar caer a una miniatura, la Gran Águila se retira 2D6" al nido o a un tejado cercano.
      Garras: Las criaturas con garras están acostumbradas a luchar sin armas. En Tierra: Después de
      la fase de combate, si una Gran Águila no ha podido huir por cualquier motivo, se considera
      que ha aterrizado y puede ser cargada. Mientras está en tierra, una Gran Águila usa su
      característica de movimiento y solo puede volver a volar cuando le sea posible.
  source_refs:
  - manual: broheim.net
    printed_page: 6
    section: Animals of the Hunt / Great Eagle
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Fen%20Guard.pdf
  combat_status: out_of_scope
- id: wild_mountain_goat
  kind: out-of-scope
  name: Wild Mountain Goat
  name_i18n:
    es: Cabra Montesa Salvaje
  effect: >-
    Mount for Halfling heroes. Profile M7 WS2 BS0 S2 T3 W1 I4 A1 Ld5. Ride Mountain Goat: any
    Halfling hero who learns the appropriate Animal Handling skill can use the Speed skill 'Scale
    Sheer Surfaces' if he has it, to climb while riding, equal to twice the normal Movement of his
    mount. 85 gc.
  effect_i18n:
    es: >-
      Montura para héroes medianos. Perfil M7 WS2 BS0 S2 T3 W1 I4 A1 Ld5. Montar en cabra montesa:
      cualquier héroe mediano que aprenda la habilidad apropiada de trato con animales puede usar la
      habilidad de Velocidad 'Escalar Superficies' si la tiene, para trepar mientras cabalga,
      equivalente al doble del Movimiento normal de su montura. 85 gc.
  source_refs:
  - manual: broheim.net
    printed_page: 2
    section: Militiant Mootlanders / Wild mountain goat
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Militiant%20Mootlanders.pdf
  combat_status: out_of_scope
- id: mortis_engine
  kind: out-of-scope
  name: Mortis Engine
  name_i18n:
    es: Motor Mortis
  effect: >-
    A horrific magical artifact that radiates strongly with Dark Magic and is kept afloat by a horde
    of vengeful spirits. Within are powerful relics saturated with Dark Magic, such as the remains
    of powerful Necromancers and Lich-Lords of ancient times. Profiles: Engine (- - - - W6 I4),
    Requiliary (- - - - W6 I3 Ld7), Nightmare (M6, W3 I1). Special rules: Undead (immune to
    psychology, poison, disease, causes fear); Ethereal; Wagon (Empire in Flames p.30-33); Spectral
    Nightmares (pulled by 4 ghostly Nightmares — only roll on the out of control table if a
    Nightmare fails its Ethereal Save); Passengers (the Corpse Master must function as the driver,
    no other models may ride; whilst driving he gains all its special rules); Storage (may carry any
    number of Corpses without impeding movement). Members of the warband within 6" gain its
    protection; in missions where bringing the Mortis Engine is not an option (underground, pit of
    blood etc) the Corpsemaster may carry it on his back, impeding his movement and stopping him
    from running. If the Requiliary is ever destroyed the spiritual energy contained within explodes
    violently. 195 gold crowns (description) vs 125 gc (stub's observed list cost) — preserving the
    source discrepancy.
  effect_i18n:
    es: >-
      Un horrible artefacto mágico que irradia con fuerza Magia Oscura y se mantiene a flote gracias a
      una horda de espíritus vengativos. En su interior hay poderosas reliquias saturadas de Magia
      Oscura, como los restos de poderosos Nigromantes y Señores Liches de tiempos antiguos. Perfiles:
      Motor (- - - - W6 I4), Requiliary (- - - - W6 I3 Ld7), Nightmare (M6, W3 I1). Reglas especiales:
      No Muerto (inmune a la psicología, al veneno y a las enfermedades; causa miedo); Etéreo; Carro
      (Empire in Flames p.30-33); Nightmares Espectrales (tirado por 4 Nightmares fantasmales — tira
      solo en la tabla de fuera de control si un Nightmare falla su salvación Etérea); Pasajeros (el
      Amo de los Cadáveres debe actuar como conductor y ningún otro modelo puede montar; mientras
      conduce obtiene todas sus reglas especiales); Almacén (puede transportar cualquier número de
      Cadáveres sin impedir el movimiento). Los miembros de la banda a 6" obtienen su protección; en
      las misiones en las que llevar el Motor Mortis no es una opción (subterráneos, foso de sangre,
      etc.) el Amo de los Cadáveres puede llevarlo a la espalda, lo que le impide el movimiento y le
      impide correr. Si el Requiliary es destruido alguna vez, la energía espiritual que contiene
      explota violentamente. 195 coronas de oro (descripción) frente a 125 gc (coste de lista
      observado en el stub) — se conserva la discrepancia de la fuente.
  source_refs:
  - manual: broheim.net
    printed_page: 2
    section: Call of the Night Haint special equipment / Mortis Engine
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Call%20Of%20The%20Night%20Haint.pdf
  combat_status: out_of_scope
- id: black_marketeer
  kind: out-of-scope
  name: Black Marketeer
  name_i18n:
    es: Mercader Negro
  effect: >-
    Underground contact of the Silent Brotherhood. Availability: Rare 6, Silent Brotherhood only.
    Bribery: D6 gold crowns. Benefit: you may roll on the Merchant hired sword's Black Market table
    and buy the found goods. 20+D6 gold crowns.
  effect_i18n:
    es: >-
      Contacto del Bajo Mundo de la Hermandad Silenciosa. Disponibilidad: Rara 6, solo Hermandad
      Silenciosa. Soborno: 1D6 coronas de oro. Beneficio: puedes tirar en la tabla del Mercado Negro
      de la espada a sueldo Mercader y comprar los objetos encontrados. 20+1D6 coronas de oro.
  source_refs:
  - manual: broheim.net
    printed_page: 6
    section: Underground Contacts / Black-marketeer
    url: https://broheim.net/downloads/warbands/supplement/sealedcity/Silent%20Brotherhood.pdf
  combat_status: out_of_scope
- id: fence
  kind: out-of-scope
  name: Fence
  name_i18n:
    es: Receptor
  effect: >-
    Underground contact of the Silent Brotherhood. Availability: Rare 6, Silent Brotherhood only.
    Bribery: none. Benefit: the fence may sell a rare item that has been stored during the preceding
    battle; this must be done before Heroes of either warband search for rare items. Roll a D6 to
    determine how many gold coins the fence would get for the item: 1-3 half the item's basic price;
    4-5 the item's full basic price; 6 full price plus half the item's basic price. 30+D6 gold
    crowns.
  effect_i18n:
    es: >-
      Contacto del Bajo Mundo de la Hermandad Silenciosa. Disponibilidad: Rara 6, solo Hermandad
      Silenciosa. Soborno: ninguno. Beneficio: el Receptor puede vender un objeto raro que se haya
      guardado durante la batalla anterior; esto debe hacerse antes de que los Héroes de cualquiera de
      las dos bandas busquen objetos raros. Tira 1D6 para determinar cuántas monedas de oro obtendría
      el Receptor por el objeto: 1-3 la mitad del precio básico del objeto; 4-5 el precio básico
      completo del objeto; 6 el precio completo más la mitad del precio básico del objeto. 30+1D6
      coronas de oro.
  source_refs:
  - manual: broheim.net
    printed_page: 6
    section: Underground Contacts / Fence
    url: https://broheim.net/downloads/warbands/supplement/sealedcity/Silent%20Brotherhood.pdf
  combat_status: out_of_scope
- id: rumour_monger
  kind: out-of-scope
  name: Rumour-Monger
  name_i18n:
    es: Correo de Rumores
  effect: >-
    Underground contact of the Silent Brotherhood. Availability: Rare 6, Silent Brotherhood only.
    Bribery: 2D6 gold crowns. Benefit: with some whispers in the right ears, the rumour-monger may
    either praise or denounce a single warband in the campaign; the next time that warband's heroes
    search for rare items they get +1 or -1 on all rarity rolls according to the rumour-monger's
    wishes. 30+2D6 gold crowns.
  effect_i18n:
    es: >-
      Contacto del Bajo Mundo de la Hermandad Silenciosa. Disponibilidad: Rara 6, solo Hermandad
      Silenciosa. Soborno: 2D6 coronas de oro. Beneficio: con unos cuantos susurros en los oídos
