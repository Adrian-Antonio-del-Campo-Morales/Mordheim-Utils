- id: swivel_gun
  kind: out-of-scope
  name: Swivel Gun
  name_i18n:
    es: Radastré
  effect: >-
    It's Everywhere! If a hit is scored, D6 other enemy models within 4" of the target and also in
    Line of Sight will automatically take a single hit. If the original target was in the open, no
    hits can be applied to models in cover though (only if the original target was in cover can hits
    go to models in cover as well). The closest enemy model to the target must take the first hit,
    then the next closest, and so on. Models in Hiding will also count towards being close to the
    target, and can be hit as well. There is no Armour Save modifier from Grape Shot hits. Pirates
    know to duck out of the way when they hear a Swivel Gun going off, and thus are never hit by
    friendly Grape Shot.
  effect_i18n:
    es: >-
      ¡Está en todas partes! Si se logra un impacto, D6 otros modelos enemigos dentro de 4" del
      objetivo y también en línea de visión recibirán automáticamente un solo impacto. Si el
      objetivo original estaba al aire libre, no se pueden aplicar impactos a los modelos en
      cobertura (solo si el objetivo original estaba en cobertura los impactos también pueden ir a
      los modelos en cobertura). El modelo enemigo más cercano al objetivo debe recibir el primer
      impacto, luego el siguiente más cercano, y así sucesivamente. Los modelos escondidos también
      contarán para estar cerca del objetivo y también pueden ser impactados. no hay modificador de
      salvación de armadura por los golpes de Grape Shot. Los piratas saben que deben apartarse del
      camino cuando escuchan el disparo de un arma giratoria y, por lo tanto, nunca son golpeados
      por un Grape Shot amigo.
  source_refs:
  - *id003
  combat_status: out_of_scope
- id: trade_wagon
  kind: out-of-scope
  name: Trade Wagon
  name_i18n:
    es: Carro Comercial
  effect: >-
    Reputation: For every five different rare items stored inside the Trade Wagon, the Merchant gets
    +1 to his rolls for finding rare items. Abandoned: If the warband fails its Rout test and no
    model is driving the Trade Wagon, then it is abandoned. The wagon falls into the winning
    warband's hands. They may choose to steal the contents, to keep the wagon for themselves if
    allowed to (treat as Wagon or Stage Coach), or agree to cut a deal (using the ransom rules in
    Captured from the Serious Injuries chart on page 119 of the Mordheim rulebook) with the
    Merchant. A warband capturing a Wagon from a Merchant Caravan may not search for rare items
    following the battle unless every model from the Merchant's warband was taken out of action, as
    word of it spreads and they are avoided by the fearful local traders.
  effect_i18n:
    es: >-
      Reputación: por cada cinco objetos raros diferentes almacenados dentro del carro comercial, el
      comerciante obtiene +1 a sus tiradas para encontrar objetos raros. Abandonado: Si la banda
      falla su tirada de Huida y ninguna miniatura conduce el Carro Comercial, entonces es
      abandonada. El carro cae en manos de la banda ganadora. Pueden optar por robar el contenido,
      quedarse con el vagón si se les permite (tratarlo como vagón o diligencia), o aceptar llegar a
      un acuerdo (usando las reglas de rescate en Capturado de la tabla de Lesiones graves en la
      página 119 del libro de reglas de Mordheim) con el Comerciante. Una banda que capture un carro
      de una caravana de mercaderes no puede buscar objetos raros después de la batalla a menos que
      todas las miniaturas de la banda de mercaderes queden fuera de combate, ya que se corre la voz
      y los temerosos comerciantes locales los evitan.
  source_refs:
  - *id017
  combat_status: out_of_scope
- id: trip_wire
  kind: out-of-scope
  name: Trip Wire
  name_i18n:
    es: Cable Trampa
  effect: >-
    A Hero may set a trap if he spends a turn doing nothing else (he may not set traps if he's just
    recovered from being knocked down). Place a marker in base contact with the Hero. When a model,
    friend or foe, moves within 2" of the marker he risks setting off the trap – roll a D6. On a
    score of 3+ he has triggered the trap and suffers a S4 hit (note that the Hero won't trigger his
    own traps). If the trap did not wound the model or it didn't trigger, the victim may finish his
    move otherwise he is placed knocked down or stunned 2" from the marker. The marker is removed
    whether the trap was triggered or not.
  effect_i18n:
    es: >-
      Un héroe puede colocar una trampa si pasa un turno sin hacer nada más (no puede colocar
      trampas si acaba de recuperarse de un derribo). Coloca un marcador en contacto peana con el
      Héroe. Cuando un modelo, amigo o enemigo, se mueve a 2" del marcador, corre el riesgo de
      activar la trampa: tira 1D6. Con una puntuación de 3+, ha activado la trampa y sufre un
      impacto S4 (tenga en cuenta que el héroe no activará sus propias trampas). Si la trampa no
      hirió al modelo o no se activó, la víctima puede terminar su movimiento, de lo contrario
      quedará derribado o aturdido a 2" del marcador. El marcador se elimina independientemente de
      que la trampa se haya activado o no.
  source_refs:
  - *id010
  combat_status: out_of_scope
- id: tufenk
  kind: out-of-scope
