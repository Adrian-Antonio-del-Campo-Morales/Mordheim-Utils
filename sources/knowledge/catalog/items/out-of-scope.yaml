  effect: >-
    To acquire a Wolfcloak, a Hero must pay 10 gc (to represent the expense of traveling to
    Middenheim and taking part in a hunt). In addition, the Hero must roll equal to or under his
    Strength on a D6. If successful, the Hero finds and slays the wolf and can wear its cloak as a
    mark of his skill and prowess. Note that Middenheimers may buy Wolfcloaks when starting their
    warband without making a test for availability. A model wearing a Wolfcloak will gain +1 to his
    armour saves against all shooting attacks.
  effect_i18n:
    es: >-
      Para adquirir una capa de lobo, un héroe debe pagar 10 co (para representar el gasto de viajar
      a Middenheim y participar en una cacería). Además, el Héroe debe obtener una tirada igual o
      inferior a su Fuerza en un D6. Si tiene éxito, el héroe encuentra y mata al lobo y puede usar
      su capa como muestra de su habilidad y destreza. Tenga en cuenta que los habitantes de
      Middenheim pueden comprar Wolfcloaks al iniciar su banda sin realizar una prueba de
      disponibilidad. Un modelo que lleve una capa de lobo obtendrá +1 a sus salvaciones de armadura
      contra todos los ataques de disparo.
