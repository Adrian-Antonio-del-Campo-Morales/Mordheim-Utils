  name_i18n:
    es: Tufenk
  effect: >-
    Range: 8" Strength: 2 Fire : If you hit roll a D6, on a 4+ your opponent is set on fire. They
    must roll a D6 each Recovery phase, on a 4+ they extinguish the fire or they immediately suffer
    a S4 hit and may only move. Friendly models may help in extinguishing the model that is ablaze.
    They must be in base-to-base contact and need to roll a 4+ on a D6. Against dry targets like
    Mummies they are Strength 3 and on a 2+ on 1D6 the Mummy catches fire. [email protected] Buy me
    a coffee Feedback discord Broheim.net r/mordheim Mordheim discord
  effect_i18n:
