schema_version: 2
ruleset: mordheim
items:
- id: amulet_of_the_moon
  kind: out-of-scope
  name: Amulet of the Moon
  name_i18n:
    es: Amuleto de la Luna
  effect: >-
    Any missile fire directed at a model equipped with the amulet suffers a penalty of -1 to hit.
    The amulet also confers a special save of 5+ against missile fire.
  effect_i18n:
    es: >-
      Cualquier disparo de misil dirigido a una miniatura equipada con el amuleto sufre una
      penalización de -1 al impacto. El amuleto también confiere una salvación especial de 5+ contra
      disparos de misiles.
  source_refs:
  - &id006
    manual: mordheimer.net
    printed_page: 0
    section: Heroines Equipment List
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/amazons-lustria
  - &id007
    manual: mordheimer.net
    printed_page: 0
    section: Heroines Equipment List
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/amazons
  combat_status: out_of_scope
- id: asp_arrows
  kind: out-of-scope
  name: Asp Arrows
  name_i18n:
    es: Flechas de Áspid
  effect: >-
    Note that no Rarity is given. They were also listed as a Missile Weapon originally even though
    they function more like special arrows such as hunting arrows, which are purchased as
    Miscellaneous Equipment.
  effect_i18n:
    es: >-
      Tenga en cuenta que no se proporciona ninguna rareza. También figuraban originalmente como
      arma de misiles, aunque funcionan más como flechas especiales, como flechas de caza, que se
      compran como equipo misceláneo.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Undead equipment lists
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/tomb-guardians
  combat_status: out_of_scope
- id: ball_shot
  kind: out-of-scope
  name: Ball Shot
  name_i18n:
    es: Bala Redonda
  effect: >-
    Maximum Range: 36"; Strength: 5; Special Rule: Armour Save -2, Concussion. Concussion: The
    impact of the heavy lead projectile is enough to rattle even the hardiest warrior. Treat any
    resulting Injury Rolls of 2-4 as a Stunned result.
  effect_i18n:
    es: >-
      Alcance máximo: 36"; Fuerza: 5; Regla especial: Salvación por armadura -2, Conmoción cerebral.
      Conmoción cerebral: El impacto del pesado proyectil de plomo es suficiente para sacudir
      incluso al guerrero más resistente. Trate cualquier Tirada de Heridas resultante de 2-4 como
      un resultado de Aturdimiento.
  source_refs:
  - &id003
    manual: mordheimer.net
    printed_page: 0
    section: Gunner Equipment List
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/pirates
  combat_status: out_of_scope
- id: barding
  kind: out-of-scope
  name: Barding
  name_i18n:
    es: Barda
  effect: >-
    Movement Penalty : Armour, called barding, may be purchased for a warhorse. It adds a further +1
    bonus to the model's armour save, but subtracts one from its Movement. A normal horse may not
    wear barding.
  effect_i18n:
    es: >-
      Penalización por movimiento: Se puede comprar armadura, llamada barda, para un caballo de
      guerra. Añade un bono adicional de +1 a la salvación por armadura del modelo, pero resta uno a
      su Movimiento. Un caballo normal no puede usar barda.
  source_refs:
  - &id018
    manual: mordheimer.net
    printed_page: 0
    section: Knights Equipment List
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/bretonnian-chapel-guard
  - manual: mordheimer.net
    printed_page: 0
    section: Imperial Outriders equipment lists / Hand-to-hand Combat Weapons and Armour
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/imperial-outriders
  combat_status: out_of_scope
- id: bird_of_prey_aristocrat_only
  kind: out-of-scope
  name: Bird of Prey Aristocrat Only
  name_i18n:
    es: Ave Rapaz (Solo Aristócrata)
  effect: >-
    Trained Falcon, Hawk or other winged predator trained from birth to hunt and fight for its noble
    owner. The Bird of Prey can be used in the Shooting Phase exactly like a Missile weapon with the
    following exceptions: it has a range of 18", does not need line of sight (but cannot be used
    against hidden targets) and ignores penalties for moving, long range and cover. Use the BS of
    its owner to determine if it hits. If successful, the attack causes a Strength 4 hit.
  effect_i18n:
    es: >-
      Halcón, halcón u otro depredador alado entrenado desde su nacimiento para cazar y luchar por
      su noble dueño. El Ave de Presa puede usarse en la Fase de Disparo exactamente como un arma de
      Misiles con las siguientes excepciones: tiene un alcance de 18", no necesita línea de visión
      (pero no puede usarse contra objetivos ocultos) e ignora las penalizaciones por movimiento,
      largo alcance y cobertura. Usa la BS de su dueño para determinar si impacta. Si tiene éxito,
      el ataque causa un impacto de Fuerza 4.
  source_refs:
  - &id015
    manual: mordheimer.net
    printed_page: 0
    section: Heroes Equipment List
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/cursed-cavalcade
  combat_status: out_of_scope
- id: blessed_stag_hide
  kind: out-of-scope
  name: Blessed Stag Hide
  name_i18n:
    es: Piel de Ciervo Bendecida
  effect: >-
    A blessed hide bestows unchallenged grace to the wearer allowing the re-roll of a failed
    Initiative test once per turn.
  effect_i18n:
    es: >-
      Una piel bendita otorga una gracia indiscutible al portador, permitiéndole repetir una prueba
      de Iniciativa fallida una vez por turno.
  source_refs:
  - &id010
    manual: mordheimer.net
    printed_page: 0
    section: Horned Hunter equipment lists
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/horned-hunters
  combat_status: out_of_scope
- id: blessed_water
  kind: out-of-scope
  name: Blessed Water
  name_i18n:
    es: Agua Bendita
  effect: >-
    A vial of blessed water contains enough liquid for just one use, and has a thrown range of twice
    the thrower's Strength in inches. Roll to hit using the model's BS. No modifiers for range or
    moving apply. Blessed water causes 1 wound on Undead, Daemon or Possessed models automatically.
    There is no armour save. Undead or Possessed models may not use blessed water.
  effect_i18n:
    es: >-
      Un frasco de agua bendita contiene suficiente líquido para un solo uso y tiene un alcance de
      lanzamiento del doble de la fuerza del lanzador en pulgadas. Tira para golpear usando la BS
      del modelo. No se aplican modificadores por alcance o movimiento. El agua bendita causa 1
      herida en modelos no muertos, demonios o poseídos automáticamente. No hay salvación de
      armadura. Los modelos no muertos o poseídos no pueden usar agua bendita.
  source_refs:
  - &id008
    manual: mordheimer.net
    printed_page: 0
    section: Sisters of Sigmar equipment lists
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/sisters-of-sigmar
  combat_status: out_of_scope
- id: blowpipe
  kind: out-of-scope
  name: Blowpipe
  name_i18n:
    es: Cerbatana
  effect: >-
    Range: 8" Strength: 1 Poison : The needles fired by a blowpipe are coated in a venom very
    similar in its effects to the Black Lotus (if you roll a 6 on the To Hit roll, the victim is
    automatically wounded). A blowpipe cannot cause critical hits. This weapon has a positive armour
    save modifier, so a model that normally has a save of 5+ will get a save of 4+ against a
    blowpipe dart. Even models that normally do not have an armour save will get a 6+ save to take
    into account protection offered by clothes, fur or the like.
  effect_i18n:
    es: >-
      Alcance: 8" Fuerza: 1 Veneno: Las agujas disparadas por una cerbatana están recubiertas de un
      veneno muy similar en sus efectos al Loto Negro (si obtienes un 6 en la tirada para impactar,
      la víctima resulta herida automáticamente). Una cerbatana no puede causar golpes críticos.
      Esta arma tiene un modificador positivo de salvación por armadura, por lo que un modelo que
      normalmente tiene una salvación de 5+ obtendrá una salvación de 4+ contra un dardo de
      cerbatana. Incluso los modelos que normalmente no tienen una salvación por armadura obtendrán
      una salvación de 4+. 6+ guardar para tener en cuenta la protección que ofrece la ropa, pieles
      o similares.
  source_refs:
  - &id002
    manual: mordheimer.net
    printed_page: 0
    section: Hero Equipment List
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/forest-goblins
  - manual: mordheimer.net
    printed_page: 0
    section: Henchmen Equipment List
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/forest-goblins
  - &id001
    manual: mordheimer.net
    printed_page: 0
    section: Skinks equipment list
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/lizardmen
  - &id013
    manual: mordheimer.net
    printed_page: 0
    section: Hero Equipment List
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/lustrian-reavers
  - manual: mordheimer.net
    printed_page: 0
    section: Heroes equipment lists
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/skaven-eshin
  combat_status: out_of_scope
- id: bolas
  kind: out-of-scope
  name: Bolas
  name_i18n:
    es: Bolas
  effect: >-
    Range: 16" Strength: Special Dangerous : If the to hit roll is a natural 1, the bolas brain the
    wielder with a Strength 3 hit.
  effect_i18n:
    es: >-
      Alcance: 16" Fuerza: Especial Peligroso: Si la tirada para impactar es un 1 natural, las bolas
      atacan al portador con un impacto de Fuerza 3.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
