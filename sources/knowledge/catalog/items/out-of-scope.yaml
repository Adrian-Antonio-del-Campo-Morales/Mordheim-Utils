- id: standard_of_nagarythe
  kind: out-of-scope
  name: Standard of Nagarythe
  name_i18n:
    es: Estandarte de Nagarythe
  effect: >-
    A Standard of Nagarythe can serve as a second rallying point (the Shadow Master is the first,
    represented by his Leader skill) for the unit. Any members of the Shadow Warrior warband within
    12" of their standard may re-roll any failed Leadership tests, should the standard be captured
    by the enemy (model holding the standard is taken Out of Action), all members of the warband
    will be subject to Hatred for the remainder of the game, and may not voluntarily Rout. Note that
    these effects do not affect any Hired Swords in the warband, only actual Shadow Warriors
    (including Shadow Warrior heroes) are affected. A model carrying a standard requires one hand
    free to do so, so no weapons, shields, etc, may be carried in this hand, and no double-handed
    weapons may be used while the standard is carried. A standard may be used in close combat as a
    makeshift spear (use the rules for a spear but with -1 on the to hit rolls). A standard may only
    ever be purchased when the warband is created and may never be added later to the warband.
  effect_i18n:
    es: >-
      Un Estandarte de Nagarythe puede servir como segundo punto de reunión (el Maestro de las
      Sombras es el primero, representado por su habilidad Líder) para la unidad. Cualquier miembro
      de la banda de Guerreros de las Sombras que se encuentre a 12" o menos de su estandarte puede
      repetir cualquier prueba de Liderazgo fallida; si el enemigo captura el estandarte (el modelo
      que porta el estandarte queda Fuera de combate), todos los miembros de la banda estarán
      sujetos al Odio por el resto del juego y no podrán Huir voluntariamente. Tenga en cuenta que
      estos efectos no afectan a ningún Espadachín a sueldo en la banda, solo los Guerreros de las
      Sombras reales (incluidos los héroes de los Guerreros de las Sombras) se ven afectados. Un
      modelo que lleva un estandarte requiere una mano libre para hacerlo. Por lo tanto, no se
      pueden llevar armas, escudos, etc. en esta mano, y no se pueden usar armas de dos manos
      mientras se lleva el estandarte. Se puede usar un estandarte en combate cuerpo a cuerpo como
      una lanza improvisada (use las reglas para una lanza pero con -1 en las tiradas para impactar.
      Un estandarte sólo se puede comprar cuando se crea la banda y nunca se puede agregar a la
      banda).
  source_refs:
  - *id004
  combat_status: out_of_scope
