  combat_status: out_of_scope
- id: boss_pole
  kind: out-of-scope
  name: Boss Pole
  name_i18n:
    es: Estandarte de Jefe
  effect: >-
    Range: Close Combat Strength: As user Strike First : A warrior with a spear strikes first, even
    if charged. Note that this only applies in the first turn of hand-to-hand combat.
  effect_i18n:
    es: >-
      Alcance: Cuerpo a cuerpo Fuerza: Como usuario Golpea primero: Un guerrero con una lanza ataca
      primero, incluso si está cargado. Ten en cuenta que esto sólo se aplica en el primer turno del
      combate cuerpo a cuerpo.
  source_refs:
  - *id002
  - &id014
    manual: mordheimer.net
    printed_page: 0
    section: Hero Equipment List
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/night-goblins-web
  combat_status: out_of_scope
- id: bretonnian_barding
  kind: out-of-scope
  name: Bretonnian Barding
  name_i18n:
    es: Barda Bretoniana
  effect: >-
    Mordheim Annual 2002, Page 103: The cost and rarity of Bretonnian barding differs radically from
    that listed on the trading chart. This is special Bretonnian blessed horse armour not normally
    available except to Bretonnian knights.
  effect_i18n:
    es: >-
      Mordheim Annual 2002, página 103: El coste y la rareza de las bardas bretonianas difieren
      radicalmente de las que figuran en el cuadro comercial. Esta es una armadura de caballo
      bendecida bretoniana especial que normalmente no está disponible excepto para los caballeros
      bretonianos.
  source_refs:
  - &id019
    manual: mordheimer.net
    printed_page: 0
    section: Knights Equipment List
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/bretonnian
  combat_status: out_of_scope
- id: cathayan_silk_cloak
  kind: out-of-scope
  name: Cathayan Silk Cloak
  name_i18n:
    es: Capa de Seda de Cathay
  effect: >-
    Some rich warband leaders like to flaunt their wealth and purchase clothes made out of silk from
    distant Cathay. This silk is the most expensive fabric in the known world, and wearing such
    clothes is a sure way to attract attention – especially thieves and assassins! Any Mercenary
    warband whose leader is wearing silk clothes may re-roll the first failed Rout test. However,
    after each battle in which the leader is taken out of action, roll a D6. On a roll of 1-3 the
    clothes are ruined and must be discarded.
  effect_i18n:
    es: >-
      A algunos líderes ricos de bandas de guerra les gusta hacer alarde de su riqueza y comprar
      ropa hecha de seda en la lejana Cathay. Esta seda es la tela más cara del mundo conocido, y
      usar esa ropa es una forma segura de llamar la atención, ¡especialmente de ladrones y
      asesinos! Cualquier banda de Mercenarios cuyo líder vista ropas de seda puede repetir la
      primera tirada fallida de Huida. Sin embargo, después de cada batalla en la que el líder quede
      fuera de combate, tira 1D6. En una tirada de 1 a 3, la ropa está arruinada y debe desecharse.
  source_refs:
  - &id009
    manual: mordheimer.net
    printed_page: 0
    section: Soldier Equipment List
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/battle-monks-of-cathay
  - &id017
    manual: mordheimer.net
    printed_page: 0
    section: Hero Equipment List
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/merchant-caravans
  combat_status: out_of_scope
- id: chain_shot
  kind: out-of-scope
  name: Chain Shot
  name_i18n:
    es: Bala en Cadena
  effect: >-
    Maximum Range: 24"; Strength: 4; Special Rule: Armour Save -1, All Wrapped Up! All Wrapped Up!
    Enemy hit by Chain Shot which are not wounded are Knocked Down on a roll of 4+, even if they
    normally can never be Knocked Down.
  effect_i18n:
    es: >-
      Alcance máximo: 24"; Fuerza: 4; Regla especial: Salvación por armadura -1, ¡Todo listo! ¡Todo
      listo! Los enemigos golpeados por Disparo en cadena que no estén heridos son Derribados con
      una tirada de 4+, incluso si normalmente nunca pueden ser Derribados.
  source_refs:
  - *id003
  combat_status: out_of_scope
- id: elven_cloak
  kind: out-of-scope
  name: Elven Cloak
  name_i18n:
    es: Capa Élfica
  effect: >-
    A warrior aiming a missile weapon at a warrior wearing an Elven Cloak suffers -1 on the hit
    roll.
  effect_i18n:
    es: >-
      Un guerrero que dispare un arma de proyectiles contra otro guerrero que lleve una Capa Élfica
      sufre un modificador de -1 a la tirada para impactar.
  source_refs:
  - &id004
    manual: mordheimer.net
    printed_page: 0
    section: Shadow Warrior equipment lists
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/shadow-warriors
  combat_status: out_of_scope
- id: elven_runestones
  kind: out-of-scope
  name: Elven Runestones
  name_i18n:
    es: Piedras Rúnicas Élficas
  effect: >-
    A mage with Elven Runestones may use them to attempt to dispel a spell that has been
    successfully cast against himself or another member of his warband. To dispel such a spell, the
    mage must roll against the spell's Difficulty (Sorcery does not help here). If he succeeds, the
    spell fails to work. If the roll fails, the spell works normally
  effect_i18n:
    es: >-
      Un mago con piedras rúnicas élficas puede usarlas para intentar disipar un hechizo que haya
      sido lanzado con éxito contra él mismo o contra otro miembro de su banda. Para disipar tal
      hechizo, el mago debe tirar contra la Dificultad del hechizo (la hechicería no ayuda aquí). Si
      lo logra, el hechizo no funciona. Si la tirada falla, el hechizo funciona normalmente.
  source_refs:
  - *id004
  combat_status: out_of_scope
- id: elven_wine
  kind: out-of-scope
  name: Elven Wine
  name_i18n:
    es: Vino Élfico
  effect: >-
    A Shadow Warrior Warband that drinks Elven Wine before a battle will be immune to fear for the
    whole of the battle.
  effect_i18n:
    es: >-
      Una banda de guerreros de las sombras que bebe vino élfico antes de una batalla será inmune al
      miedo durante toda la batalla.
  source_refs:
  - *id004
  combat_status: out_of_scope
- id: engine_of_chaos
  kind: out-of-scope
  name: Engine of Chaos
  name_i18n:
    es: Máquina del Caos
  effect: >-
    Wagon : The Engine of Chaos follows all rules for Wagons (see Empire in Flames Supplement, p.
    30–33) unless specified otherwise here.
  effect_i18n:
    es: >-
      Carro: La Máquina del Caos sigue todas las reglas para Carros (ver Suplemento Empire in
      Flames, p. 30-33) a menos que se especifique lo contrario aquí.
  source_refs:
  - &id012
    manual: mordheimer.net
    printed_page: 0
    section: Chaos Dwarf Equipment List
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/black-dwarfs
  combat_status: out_of_scope
- id: fish_hook_shot
  kind: out-of-scope
  name: Fish Hook Shot
  name_i18n:
    es: Disparo de Anzuelo
  effect: >-
    Range: 3" Strength: 3 Thrown Weapon : Models using a fish-hook shot do not suffer penalties for
    range or moving as it is designed for short-range use anyway.
  effect_i18n:
    es: >-
      Alcance: 3" Fuerza: 3 Arma arrojadiza: Los modelos que usan un disparo de anzuelo no sufren
      penalizaciones por alcance o movimiento, ya que de todos modos está diseñado para uso a corto
      alcance.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Monk Equipment List
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/battle-monks-of-cathay
  combat_status: out_of_scope
- id: forest_cloak
  kind: out-of-scope
  name: Forest Cloak
  name_i18n:
    es: Capa del Bosque
  effect: >-
    So long as the wearer is beside a tree, bush or hedge, any enemy using any kind of missile
    weapon at a warrior wearing a Forest Cloak is at an additional –1BS to hit (in addition to all
    other modifiers). Similarly, if any spellcaster wishes to target a magical attack against an
    Outlaw camouflaged in this way, he can only do so by successfully rolling a 4+ on a D6. The only
    exception to this is if the shooting warrior or the spellcaster is already within their
    Initiative range in inches.
  effect_i18n:
    es: >-
      Mientras el portador esté al lado de un árbol, arbusto o seto, cualquier enemigo que use
      cualquier tipo de arma de proyectiles contra un guerrero que lleva una Capa del Bosque tiene
      un -1BS adicional para impactar (además de todos los demás modificadores). De manera similar,
      si algún lanzador de conjuros desea realizar un ataque mágico contra un Forajido camuflado de
      esta manera, sólo podrá hacerlo si obtiene un 4+ en un D6. La única excepción a esto es si el
      guerrero que dispara o el lanzador de conjuros ya se encuentra dentro de su alcance de
      Iniciativa en pulgadas.
  source_refs:
  - &id011
    manual: mordheimer.net
    printed_page: 0
    section: Outlaws equipment lists
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/outlaws-of-stirwood-forest
  combat_status: out_of_scope
- id: gnoblar_fighter
  kind: out-of-scope
  name: Gnoblar Fighter
  name_i18n:
    es: Gnoblar Luchador
  effect: >-
    Weapons/Armour : Dagger and sharp stuff (treat as thrown weapon with S2, range 8" and fire
    twice)
  effect_i18n:
    es: >-
      Armas/Armadura: Daga y objetos punzantes (tratar como arma arrojadiza con S2, alcance 8" y
      disparar dos veces)
  source_refs:
  - &id005
    manual: mordheimer.net
    printed_page: 0
    section: Ogre Equipment List
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/maneaters
  combat_status: out_of_scope
- id: grape_shot
  kind: out-of-scope
  name: Grape Shot
  name_i18n:
    es: Metralla
  effect: >-
    Maximum Range: 24"; Strength: 3; Special Rule: It's Everywhere! It's Everywhere! If a hit is
    scored, D6 other enemy models within 4" of the target and also in Line of Sight will
    automatically take a single hit. If the original target was in the open, no hits can be applied
    to models in cover though (only if the original target was in cover can hits go to models in
    cover as well). The closest enemy model to the target must take the first hit, then the next
    closest, and so on. Models in Hiding will also count towards being close to the target, and can
    be hit as well. There is no Armour Save modifier from Grape Shot hits. Pirates know to duck out
    of the way when they hear a Swivel Gun going off, and thus are never hit by friendly Grape Shot.
  effect_i18n:
    es: >-
      Alcance máximo: 24"; Fuerza: 3; Regla especial: ¡Está en todas partes! ¡Está en todas partes!
      Si se logra un impacto, D6 otros modelos enemigos dentro de 4" del objetivo y también en la
      línea de visión recibirán automáticamente un solo impacto. Sin embargo, si el objetivo
      original estaba al aire libre, no se pueden aplicar impactos a los modelos en cobertura (solo
      si el objetivo original estaba en cobertura, los impactos también pueden ir a los modelos en
      cobertura). El modelo enemigo más cercano al objetivo debe recibir el primer impacto, luego el
      siguiente más cercano, y así sucesivamente. Los modelos escondidos también contarán para estar
      cerca del objetivo y también podrán ser alcanzados. No hay ningún modificador de salvación de
      armadura por los golpes de Grape Shot. Los piratas saben que deben apartarse del camino cuando
      escuchan el disparo de un arma giratoria y, por lo tanto, nunca son alcanzados por un Grape
      Shot amistoso.
  source_refs:
  - *id003
  combat_status: out_of_scope
- id: hand_held_mortar
  kind: out-of-scope
  name: Hand Held Mortar
  name_i18n:
    es: Mortero de Mano
  effect: >-
    Range: 24" Strength: 4 Prepare shot : A Hand-held Mortar takes a complete turn to reload ❓ , so
    you may only fire it every other turn.
  effect_i18n:
    es: >-
      Alcance: 24" Fuerza: 4 Preparar el tiro: un mortero de mano necesita un turno completo para
      recargarse ❓, por lo que solo puedes dispararlo cada dos turnos.
  source_refs:
  - &id016
    manual: mordheimer.net
    printed_page: 0
    section: Marksman equipment list
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/gunnery-school-of-nuln
  - *id005
  combat_status: out_of_scope
- id: healing_herbs
  kind: out-of-scope
  name: Healing Herbs
  name_i18n:
    es: Hierbas Curativas
  effect: >-
    A Hero may use the herbs at the beginning of a Recovery phase while not engaged in hand-to-hand
    combat to restore all wounds lost during the battle.
  effect_i18n:
    es: >-
      Un Héroe puede usar las hierbas al comienzo de una fase de Recuperación si no está trabado en
      combate cuerpo a cuerpo para recuperar todas las Heridas perdidas durante la batalla.
  source_refs:
  - *id006
  - *id007
  combat_status: out_of_scope
- id: holy_relic
  kind: out-of-scope
  name: Holy Relic
  name_i18n:
    es: Reliquia Santa
  effect: >-
    A model with a holy relic will automatically pass the first Leadership test he is required to
    make in the game. If worn by the leader, it will allow him to automatically pass the first Rout
    test if he has not taken any Leadership tests before. You can only ignore the first Leadership
    test in any single game – owning two or more holy relics will not allow you to ignore second and
    subsequent tests.
  effect_i18n:
    es: >-
      Una miniatura con una reliquia sagrada pasará automáticamente la primera prueba de Liderazgo
      que debe realizar en el juego. Si el líder lo usa, le permitirá pasar automáticamente la
