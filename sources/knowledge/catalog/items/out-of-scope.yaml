- id: mordheim_map
  kind: out-of-scope
  name: Mordheim Map
  name_i18n:
    es: Mapa de Mordheim
  effect: >-
    A map can help a warband find their way through the confusing maze of streets and into areas
    with rich buildings to loot. When you buy a map, roll a D6: D6 Result 1 Fake. The map is a fake,
    and is completely worthless. It leads you on a fool's errand. Your opponent may automatically
    choose the next scenario you play. 2-3 Vague. Though crude, the map is generally accurate
    (well... parts of it are... perhaps!). You may re-roll any one dice during the next exploration
    phase if you wish but you must accept the result of the second roll. 4 Catacomb map. The map
    shows a way through the catacombs into the city. You may automatically choose the scenario next
    time you fight a battle. 5 Accurate. The map is recently made and very detailed. You may re-roll
    up to three dice during the next exploration phase if you wish. You must accept the result of
    the second roll. 6 Master map. This is one of the twelve master maps of Mordheim made for Count
    von Steinhardt of Ostermark. From now on you may always re-roll ❓ one dice when rolling on the
    Exploration chart as long as the Hero who possesses this map was not taken out of action in the
    battle.
  effect_i18n:
    es: >-
      Un mapa puede ayudar a una banda a encontrar su camino a través del confuso laberinto de
      calles y áreas con ricos edificios para saquear. Cuando compras un mapa, tira un D6: D6
      Resultado 1 Falso. El mapa es falso y no tiene ningún valor. Te lleva a una misión tonta. Tu
      oponente puede elegir automáticamente el siguiente escenario que juegues. 2-3 Vago. Aunque
      tosco, el mapa es generalmente preciso (bueno... partes de él lo son... ¡quizás!). Puedes
      volver a tirar cualquier dado durante la siguiente fase de exploración si lo deseas, pero
      debes aceptar el resultado de la segunda tirada. 4 Mapa de catacumbas. El mapa muestra un
      camino a través de las catacumbas hacia la ciudad. Puedes elegir automáticamente el escenario
      la próxima vez que pelees una batalla. 5 Preciso. El mapa está hecho recientemente y es muy
      detallado. Puedes volver a tirar hasta tres dados durante la siguiente fase de exploración si
      lo deseas. Debes aceptar el resultado de la segunda tirada. 6 Mapa maestro. Este es uno de los
      doce mapas maestros de Mordheim realizados para el Conde von Steinhardt de Ostermark. A partir
      de ahora siempre podrás volver a tirar ❓ un dado cuando lances en la tabla de Exploración,
      siempre y cuando el Héroe que posee este mapa no quede fuera de combate en la batalla.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Income / Exploration procedure
    url: https://mordheimer.net/docs/campaigns/income
  - manual: mordheimer.net
