- id: kite_shield
  kind: shield-or-defence
  name: Kite Shield
  name_i18n:
    es: Escudo de Cometa
  effect: >-
    Save : A model with a kite shield has a basic save of 5+ on a D6 while on foot, and 6+ while
    mounted (or, if the model is already wearing armour, as +2 on foot, and +1 save while mounted).
    This cannot bring a save over 1+. (Note: If your gaming group already uses house rules for
    enhanced shields [ex. Ones that provide +2 AS in combat], remove Kite Shield from the equipment
    list.)
  effect_i18n:
    es: >-
      Salvación: Un modelo con un escudo de cometa tiene una salvación básica de 5+ en un D6
      mientras está a pie, y 6+ mientras está montado (o, si el modelo ya lleva armadura, como +2 a
      pie y +1 de salvación mientras está montado). Esto no puede generar una salvación superior a
      1+. (Nota: si su grupo de juego ya usa reglas internas para escudos mejorados [por ejemplo,
      aquellos que proporcionan +2 AS en combate], elimine Kite Shield de la lista de equipos).
  source_refs:
  - *id027
  combat_status: implemented
  mechanic_id: defence.kite-shield
- id: sea_dragon_cloak
  kind: shield-or-defence
  name: Sea Dragon Cloak
  name_i18n:
    es: Capa de Dragón Marino
  effect: >-
    It was never fully clarified whether the Sea Dragon Cloak may be combined with armour and
    shields. Some argue it may not, as the cloak specifies a base armour save, others state that as
    it is a Miscellaneous Equipment item, it should be possible to combine with a suit of armour, in
    which case it improves the save by 2 in melee, and 3 versus ranged attacks.
  effect_i18n:
    es: >-
      Nunca se aclaró del todo si la Capa del Dragón Marino se puede combinar con armaduras y
      escudos. Algunos argumentan que puede que no, ya que la capa especifica una salvación de
      armadura básica, otros afirman que, como es un elemento de equipo misceláneo, debería ser
      posible combinarlo con una armadura, en cuyo caso mejora la salvación en 2 en cuerpo a cuerpo
      y 3 contra ataques a distancia.
  source_refs:
  - *id015
  combat_status: implemented
  mechanic_id: defence.sea-dragon-cloak
- id: shield
  kind: shield-or-defence
  name: Shield
  name_i18n:
    es: Escudo
  effect: >-
    Combined Save : As explained in the Armour section, shields combine with armour to give +1 to
    the save.
  effect_i18n:
    es: >-
      Salvación combinada: como se explica en la sección Armadura, los escudos se combinan con la
      armadura para dar +1 a la salvación.
