- id: helmet
  kind: shield-or-defence
  name: Helmet
  name_i18n:
    es: Yelmo
  effect: >-
    Avoid Stun : A model that is equipped with a helmet has a special 4+ save on a D6 against being
    stunned. If the save is made, treat the stunned result as knocked down instead. This save is not
    modified by the opponent's Strength.
  effect_i18n:
    es: >-
      Evitar el aturdimiento: Un modelo que está equipado con un casco tiene una salvación especial
      de 4+ en un D6 contra ser aturdido. Si se realiza la salvación, trate el resultado aturdido
      como si fuera derribado. Esta salvación no se ve modificada por la Fuerza del oponente.
