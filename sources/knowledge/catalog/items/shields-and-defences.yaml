- id: buckler
  kind: shield-or-defence
  name: Buckler
  name_i18n:
    es: Rodela
  effect: >-
    Parry : A model equipped with a buckler may parry the first blow in each round of hand-to-hand
    combat. When his opponent scores a hit, a model with a buckler may roll 1D6. If the score is
    greater than the highest to hit score of his opponent, the model has parried the blow, and that
    attack is discarded. A model may not parry attacks made with double or more its own Strength –
    they are simply too powerful to be stopped.
  effect_i18n:
    es: >-
      Parar: Una miniatura equipada con un escudo puede parar el primer golpe en cada ronda de
      combate cuerpo a cuerpo. Cuando su oponente logra un impacto, una miniatura con un escudo
      puede tirar 1D6. Si la puntuación es mayor que la puntuación más alta para impactar de su
      oponente, el modelo ha parado el golpe y ese ataque se descarta. Un modelo no puede parar
      ataques realizados con el doble o más de su propia Fuerza; simplemente son demasiado poderosos
      para detenerlos.
