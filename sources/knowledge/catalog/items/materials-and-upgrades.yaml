- id: gromril_weapon
  kind: material-or-upgrade
  name: Gromril Weapon
  name_i18n:
    es: Arma de Gromril
  effect: >-
    Gromril : A gromril weapon has an extra -1 save modifier, and costs four times the price of a
    normal weapon of its kind. You may choose which type of hand-to-hand weapon is offered to you as
    explained in the Trading section. ❓
  effect_i18n:
    es: >-
      Gromril: Un arma de gromril tiene un modificador de salvación adicional de -1 y cuesta cuatro
      veces el precio de un arma normal de su tipo. Puedes elegir qué tipo de arma cuerpo a cuerpo
      se te ofrece como se explica en la sección Comercio. ❓
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Dwarf Warrior Equipment List
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/dwarf-rangers
