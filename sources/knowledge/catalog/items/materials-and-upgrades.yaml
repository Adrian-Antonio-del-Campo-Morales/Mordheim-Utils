- id: obsidian_weapon
  kind: material-or-upgrade
  name: Obsidian Weapon
  name_i18n:
    es: Arma de Obsidiana
  effect: >-
    Range: Close Combat Strength: As user +1 Blemished : Although not strictly tainted by Chaos, all
    artefacts of Obsidian are considered tinged with evil, by the same darkness associated with
    their artisans. Obsidian weapons may never be used by Dwarfs, Elves, Sisters of Sigmar, Witch
    Hunters or Priests. Both the Sons of Hashut warband and Border Town Burning contain the Obsidian
    Weapon. The Sons of Hashut editor recommends your campaign use EITHER the obsidian rules
    contained, or from Border Town Burning; do not use both, unless you rename one of them for
    clarity
  effect_i18n:
    es: >-
      Alcance: Cuerpo a cuerpo Fuerza: Como usuario +1 Manchado: Aunque no están estrictamente
      contaminados por el Caos, todos los artefactos de Obsidiana se consideran teñidos de maldad,
      por la misma oscuridad asociada con sus artesanos. Las armas de obsidiana nunca podrán ser
      utilizadas por enanos, elfos, hermanas de Sigmar, cazadores de brujas o sacerdotes. Tanto la
      banda de los Hijos de Hashut como el Border Town Burning contienen el arma de obsidiana. El
      editor de Sons of Hashut recomienda que su campaña utilice O BIEN las reglas de obsidiana
      contenidas o las de Border Town Burning; no utilice ambos, a menos que cambie el nombre de uno
      de ellos para mayor claridad
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Chaos Dwarf equipment lists
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/sons-of-hashut
  combat_status: implemented
  mechanic_id: material.obsidian
- id: darksteel_blade
  kind: material-or-upgrade
  name: Darksteel Blade
  name_i18n:
    es: Hoja de Acero Oscuro
  effect: >-
    Darksteel weapons are forged in the city of Hag Graef, the Dark Crag. They are fashioned from
    black steel, a rare form of steel found deep within the mountains around the city and are forged
    using an ancient technique known only to the Dark Elves. Weapons with Darksteel blades have
    wicked protrusions and serrated edges, which inflict serious damage on an opponent. Any Druchii
    hero can use a close-combat weapon with a Darksteel blade. Getting it, however, is not that
    easy. Range: Close combat. Strength: As user. Special Rules: Critical damage, Wicked edge.
    Critical Damage: Darksteel weapons inflict serious damage on their opponents. When rolling on
    the critical hit chart, a Darksteel weapon will add +1 to the result. Wicked Edge: Darksteel
    weapons are set with sharp protrusions and serrated edges which inflict serious damage on an
    opponent. A roll of 2-4 on the injury table is a stunned result.
  effect_i18n:
    es: >-
      Las armas de Acero Oscuro se forjan en la ciudad de Hag Graef, el Risco Oscuro. Están forjadas
      con acero negro, una forma rara de acero que se encuentra en las profundidades de las montañas
      que rodean la ciudad, empleando una técnica ancestral conocida únicamente por los Elfos
      Oscuros. Las armas con hojas de Acero Oscuro tienen protuberancias afiladas y bordes dentados,
      que infligen graves daños al oponente. Cualquier héroe Druchii puede usar un arma de combate
      cuerpo a cuerpo con hoja de Acero Oscuro. Conseguirla, sin embargo, no es tarea fácil.
      Alcance: combate cuerpo a cuerpo. Fuerza: como el usuario. Reglas Especiales: Daño crítico,
      Filo cruel. Daño Crítico: Las armas de Acero Oscuro infligen graves daños a sus oponentes. Al
      tirar en la tabla de impactos críticos, un arma de Acero Oscuro suma +1 al resultado. Filo
      Maléfico: Las armas de Acero Oscuro están tachonadas de protuberancias afiladas y bordes
      dentados que infligen graves daños al oponente. Un resultado de 2-4 en la tabla de heridas es
      un resultado de aturdido.
  source_refs:
  - manual: mordheim-index-catalog
    printed_page: 0
    section: Special Equipment / Darksteel Blade
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/druchii
  combat_status: out_of_scope
- id: blessed_bolts
  kind: material-or-upgrade
  name: Blessed Bolts
  name_i18n:
    es: Saetas Bendecidas
  effect: >-
    Blessed by the Warrior Priest and his Acolytes, the Blessed Bolts may be fired against the
    enemies of Sigmar. Any Chaotic being, be they Undead, Chaos-infused (mutants or Possessed) or
    Twister of Magic suffers greatly from these missiles: add +1S to the weapon when fired against
    such a target. Range: As Weapon. Strength: As Weapon. Special Rules: Holy. Holy: Add +1S to the
    weapon when fired against any Chaotic being (Undead, Chaos-infused mutants or Possessed, or
    Twisters of Magic).
  effect_i18n:
    es: >-
      Bendecidas por el Sacerdote Guerrero y sus Acólitos, las Saetas Bendecidas pueden dispararse
      contra los enemigos de Sigmar. Cualquier ser Caótico, ya sea No Muerto, infundido por el Caos
      (mutantes o Endemoniados) o Retorcedor de la Magia, sufre enormemente con estos proyectiles:
      suma +1F al arma cuando se dispara contra ese tipo de objetivo. Alcance: como el arma. Fuerza:
      como el arma. Reglas Especiales: Sagrada. Sagrado: Suma +1F al arma cuando se dispara contra
      cualquier ser Caótico (No Muertos, mutantes infundidos por el Caos o Endemoniados, o
      Retorcedores de la Magia).
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Special Equipment / Blessed Bolts
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/protectorate-of-sigmar
  combat_status: out_of_scope
