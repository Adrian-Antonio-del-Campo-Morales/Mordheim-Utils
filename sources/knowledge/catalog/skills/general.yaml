schema_version: 2
ruleset: mordheim
scope: close-combat-only
skills:
- id: skill.acrobat
  name: Acrobat
  category: speed
  effect: >-
    Pass an Initiative test to avoid damage from falls or jumps up to 12 inches; re-roll failed
    Diving Charge rolls.
  effect_i18n:
    es: >-
      Supera un chequeo de Iniciativa para evitar daño por caídas o saltos de hasta 12";
      repite las tiradas fallidas de Carga en Picado.
  kind: general
  rules_source_url: https://mordheimer.net/docs/campaigns/skills
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Skills / Speed Skills / Acrobat
    url: https://mordheimer.net/docs/campaigns/skills
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: none
    effects:
    - id: unimplemented.skill.acrobat
      scope: 'NO'
      binding: null
      reason: >-
        Does not impact duel simulations: movement, falling and diving-charge rules are outside the
        current scope.
  name_i18n:
    es: Acróbata
- id: skill.arcane-lore
