- id: skill.lightning-reflexes
  name: Lightning Reflexes
  category: speed
  effect: >-
    If the warrior is charged, he will strike first against those that charged that turn. As the
    charger(s) will also normally strike first (for charging), the order of attack between the
    charger(s) and the warrior will be determined by comparing Initiative values.
  kind: general
  engine_option: Lightning Reflexes
  rules_source_url: https://mordheimer.net/docs/campaigns/skills
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Heroes / 0 – 2 Knights Vanguard / Special Rules / Lightning Reflexes
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/merchant-caravans
  name_i18n:
    es: Reflejos de Relámpago
  effect_i18n:
    es: >-
      Si el guerrero es cargado, golpeará primero contra quienes cargaron ese asalto. Como el/los
      cargador(es) normalmente también golpearán primero (por cargar), el orden de ataque entre
      el/los cargador(es) y el guerrero se determinará comparando los valores de Iniciativa.
