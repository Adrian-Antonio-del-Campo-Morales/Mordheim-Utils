  effect_i18n:
    es: >-
      Ambientado en un enorme templo que arde hasta los cimientos durante la batalla. Los Héroes del
      defensor deben sacar tres reliquias del templo; los atacantes deben impedirlo.
  tags:
  - attacker-defender
  - objective
  - hazards
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / Burn the Witches
    url: https://mordheimer.net/docs/campaigns/scenarios/town-cryer/burn-the-witches
  progression:
    experience:
    - ref: campaign.experience.award.survives
    - ref: campaign.experience.award.winning-leader
    - effect: Any Hero in possession of a relic at the end of the game gains +1 Experience
      effect_i18n:
        es: >-
          Cualquier Héroe en posesión de una reliquia al final de la partida gana +1 de Experiencia
      amount: 1
    - effect: Any Hero from the defending warband who manages to escape gains +1 Experience
      effect_i18n:
        es: >-
          Cualquier Héroe de la banda defensora que logre escapar gana +1 de Experiencia
      amount: 1
    - ref: campaign.experience.award.per-enemy-out-of-action
    wyrdstone: The attackers can pilfer the tomb after the battle and find D3+1 wyrdstone shards.
    wyrdstone_i18n:
      es: >-
        Los atacantes pueden saquear la tumba tras la batalla y encuentran D3+1 fragmentos de Piedra
        bruja.
    notes:
    - The three relics (Holy Tome, Holy Relic and Blessed Water) are chosen by the defender if only some
      are rescued; the attackers do not use them.
    notes_i18n:
      es: >-
        El defensor elige las tres reliquias (Tomo Sagrado, Reliquia Santa y Agua Bendita) si solo se
        rescatan algunas; los atacantes no las usan.
  name_i18n:
    es: Quemad a las Brujas
- id: scenario.one-mans-rescue
  name: One Man's Rescue Is Another Man's Kidnap
  setting: Khemri
  source: Town Cryer
  author: Khemri Development Team
  player_mode: 1v1
  effect: >-
    A prisoner is being guarded within one of several tents. The attacker must find the prisoner by
    entering the correct tent and then escort him from the table.
  effect_i18n:
    es: >-
      Un prisionero está custodiado en una de varias tiendas. El atacante debe encontrar al
      prisionero entrando en la tienda correcta y escoltarlo fuera de la mesa.
  tags:
  - attacker-defender
  - escort-npc
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / One Man's Rescue is Another Man's Kidnap
    url: https://mordheimer.net/docs/campaigns/scenarios/town-cryer/one-mans-rescue-is-another-mans-kidnap
  progression:
    experience:
    - ref: campaign.experience.award.survives
    - ref: campaign.experience.award.winning-leader
    - ref: campaign.experience.award.per-enemy-out-of-action
    - effect: The warrior who rescues the victim gains +1 Experience; the winning leader bonus and this bonus are not awarded if the kidnap victim dies (the game is a draw)

      effect_i18n:
        es: >-
          El guerrero que rescate a la víctima gana +1 de Experiencia; el bonus del líder ganador y
          este bonus no se otorgan si la víctima del secuestro muere (la partida es un empate)
      amount: 1
    income: The winning warband gains 5D6 + 10 gc as a ransom/reward; if the victim dies neither side
      gets the win bonus, additional Experience or gold.
  name_i18n:
    es: El Rescate de Uno Es el Secuestro de Otro
- id: scenario.the-gauntlet
  name: The Gauntlet
  setting: Mordheim
  source: Town Cryer
  author: Erik Johnson
  player_mode: multiplayer
  effect: >-
    Classic Indiana Jones stuff. Warbands race along trap-laden corridors towards a great treasure.
    For 2+ warbands.
  effect_i18n:
    es: >-
      Puro Indiana Jones. Las bandas corren por pasillos llenos de trampas hacia un gran tesoro.
      Para 2 o más bandas.
  tags:
  - treasure
  - hazards
  - interior
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / The Gauntlet
    url: https://mordheimer.net/docs/campaigns/scenarios/town-cryer/the-gauntlet
  progression:
    experience:
    - ref: campaign.experience.award.survives
    - ref: campaign.experience.award.winning-leader
    - ref: campaign.experience.award.per-enemy-out-of-action
    - effect: Any Hero earns +1 Experience for surviving a trap (or escaping from it)
      effect_i18n:
        es: >-
          Cualquier Héroe gana +1 de Experiencia por sobrevivir a una trampa (o escapar de ella)
      amount: 1
    notes:
    - The 'Great Treasure' is defined by the referee (magic items, chest, etc.) and there are D3 extra
      wyrdstone/treasure counters in the central room; the concrete value is not fixed in the source.
    notes_i18n:
      es: >-
        El «Gran Tesoro» lo define el árbitro (objetos mágicos, cofre, etc.) y hay D3 fichas
        adicionales de Piedra bruja/tesoro en la sala central; el valor concreto no está fijado en la
        fuente.
  name_i18n:
    es: El Guantelete
- id: scenario.assault-on-the-rock
  name: Assault on the Rock
  setting: Mordheim
  source: Town Cryer
  author: Grayson Gaudreault
  player_mode: 1v1
  effect: Warbands infiltrate the Sisters' rock and attempt to steal a magical tome.
  effect_i18n:
    es: >-
      Las bandas se infiltran en la roca de las Hermanas e intentan robar un grimorio mágico.
  tags:
  - attacker-defender
  - treasure
  - objective-building
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / Assault on the Rock
    url: https://mordheimer.net/docs/campaigns/scenarios/town-cryer/assault-on-the-rock
  progression:
    experience:
    - ref: campaign.experience.award.survives
    - ref: campaign.experience.award.winning-leader
    - ref: campaign.experience.award.per-enemy-out-of-action
    - effect: Any Hero or Henchman who leaves the board with the magic tome gains +1 Experience
      effect_i18n:
        es: >-
          Cualquier Héroe o Secuaz que salga del tablero con el grimorio mágico gana +1 de
          Experiencia
      amount: 1
    loot:
      effect: >-
        The tome of magic allows the user to gain two spells from the lesser magic list, two new
        spells from his own list, or any combination thereof; any warband may use it except Sisters
        of Sigmar, Witch Hunters and warbands containing a priest of Morr.
      effect_i18n:
        es: >-
          El grimorio mágico permite a quien lo use obtener dos hechizos de la lista de magia menor,
          dos hechizos nuevos de su propia lista, o cualquier combinación de ambas; cualquier banda
          puede usarlo salvo las Hermanas de Sigmar, los Cazadores de Brujas y las bandas que
          contengan un sacerdote de Morr.
    notes:
    - 'Awards per faction: the Sisters gain 100 gc and +2 Experience for the Matriarch, and Sisters recruited
      during the battle may join the warband; the Witch Hunters and warbands with a priest of Morr destroy
      the book and gain +D6 Experience to share, the Witch Hunters additionally +2 Experience per Augur/Matriarch
      out of action and 50 gc.'
    notes_i18n:
      es: >-
        Recompensas por facción: las Hermanas ganan 100 co y +2 de Experiencia para la Matriarca, y
        las Hermanas reclutadas durante la batalla pueden unirse a la banda; los Cazadores de Brujas y
        las bandas con un sacerdote de Morr destruyen el libro y ganan +D6 de Experiencia a repartir;
        los Cazadores de Brujas ganan además +2 de Experiencia por cada Augur/Matriarca Fuera de
        Combate y 50 co.
  name_i18n:
    es: Asalto a la Roca
- id: scenario.in-the-dead-of-the-night
  name: In the Dead of the Night
  setting: Mordheim
  source: Town Cryer
  author: Space McQuirk & Chris Blair
  player_mode: 1v1
  effect: >-
    Set in Mordheim's Cemetery of Saint Voller. Graveyard battle with an Undead warband, half of
    which is unavailable, as the defenders.
  effect_i18n:
    es: >-
      Ambientado en el Cementerio de Saint Voller de Mordheim. Batalla en el cementerio con una
      banda de No Muertos, de la que la mitad no está disponible, como defensores.
  tags:
  - attacker-defender
  - reserves
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / In The Dead Of The Night
    url: https://mordheimer.net/docs/campaigns/scenarios/town-cryer/in-the-dead-of-the-night
  progression:
    experience:
    - ref: campaign.experience.award.survives
    - ref: campaign.experience.award.winning-leader
    - ref: campaign.experience.award.per-enemy-out-of-action
    - effect: Any Hero earns a further +3 Experience for taking the Undead spellcaster Out of Action and stopping the ritual

      effect_i18n:
        es: >-
          Cualquier Héroe gana +3 de Experiencia adicionales por dejar al lanzador de hechizos No
          Muerto Fuera de Combate y detener el ritual
      amount: 3
    wyrdstone: The winning warband recovers D3 shards of Wyrdstone left over from the ritual.
    wyrdstone_i18n:
      es: >-
        La banda ganadora recupera D3 fragmentos de Piedra bruja sobrantes del ritual.
    notes:
    - If the defender completes the ritual he retains D3+3 of the summoned Zombies (without exceeding
      his warband limit); the rival models out of action come back as Zombies keeping their original equipment.
    notes_i18n:
      es: >-
        Si el defensor completa el ritual, conserva D3+3 de los Zombis invocados (sin superar el
        límite de su banda); las miniaturas rivales Fuera de Combate vuelven como Zombis conservando
        su equipo original.
  name_i18n:
    es: En Mitad de la Noche
- id: scenario.a-stroll-in-the-garden
  name: A Stroll in the Garden
  setting: Mordheim
  source: Town Cryer
  author: Anonymous
  author_i18n:
    es: Anónimo
  player_mode: 1v1
  effect: >-
    Skirmish set in Mordheim's Steinhardt Memorial Gardens. Warriors within 2" of a tree or bush
    receive hits from the chaos-wracked foliage.
  effect_i18n:
    es: >-
      Escaramuza ambientada en los Jardines Conmemorativos Steinhardt de Mordheim. Los guerreros a
      2" de un árbol o arbusto reciben impactos de la vegetación azotada por el Caos.
  tags:
  - brawl
  - hazards
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / A Stroll In The Garden
    url: https://mordheimer.net/docs/campaigns/scenarios/town-cryer/a-stroll-in-the-garden
  progression:
    experience:
    - ref: campaign.experience.award.survives
    - ref: campaign.experience.award.winning-leader
    - ref: campaign.experience.award.per-enemy-out-of-action
    - effect: Any Hero who gets hit at least once by an attack from a plant gains +1 Experience
      effect_i18n:
        es: >-
          Cualquier Héroe que reciba al menos un impacto de un ataque de una planta gana +1 de
          Experiencia
      amount: 1
    exploration: At the end of the game each player receives one additional dice for Exploration; after
      rolling, each player may re-roll ALL of his Exploration dice (never keeping some and re-rolling
      others).
  name_i18n:
    es: Un Paseo por el Jardín
- id: scenario.the-bodyguards
  name: The Bodyguards
  setting: Mordheim
  source: Town Cryer
  author: Anonymous
  author_i18n:
    es: Anónimo
  player_mode: 1v1
  effect: Town Cryer edit of "Now Keep Me Safe, You Hear!?"
  effect_i18n:
    es: >-
      Edición del Town Cryer de "Now Keep Me Safe, You Hear!?"
  tags:
  - escort-npc
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / The Bodyguards
    url: https://mordheimer.net/docs/campaigns/scenarios/town-cryer/the-bodyguards
  progression:
    experience:
    - ref: campaign.experience.award.survives
    - ref: campaign.experience.award.winning-leader
    - ref: campaign.experience.award.per-enemy-out-of-action
    income: If the merchant survives he gives the defender 7D6 + 20 gold pieces plus a 2D6 roll on the
      defender reward table. An attacking warband that snatches the merchant or his head and returns it
      to his overlord receives 4D6 + 15 gold pieces plus a 2D6 roll on the attacker reward table.
    loot:
      effect: Reward tables for each side; roll 2D6 once (rows carry the side that receives them).
      effect_i18n:
        es: >-
          Tablas de recompensa para cada bando; tira 2D6 una vez (las filas indican el bando que las
          recibe).
      contents:
      - side: defender
        when:
          min: 2
          max: 2
        roll: 2D6
        reward: Holy or Unholy Relic
        reward_i18n:
          es: >-
            Reliquia Santa o Impía
      - side: defender
        when:
          min: 3
          max: 5
        roll: 2D6
        reward: Cathayan Silk Clothes
        reward_i18n:
          es: >-
            Ropas de Seda de Cathay
      - side: defender
        when:
          min: 6
          max: 8
        roll: 2D6
        reward: Ithilmar Armour
        reward_i18n:
          es: >-
            Armadura de Ithilmar
      - side: defender
        when:
          min: 9
          max: 10
        roll: 2D6
        reward: Elven Cloak
        reward_i18n:
          es: >-
            Capa Élfica
      - side: defender
        when:
          min: 11
          max: 12
        roll: 2D6
        reward: Gromril Armour
        reward_i18n:
          es: >-
            Armadura de Gromril
      - side: attacker
        when:
          min: 2
          max: 2
        roll: 2D6
        reward: Throwing Knives
        reward_i18n:
          es: >-
            Cuchillos Arrojadizos
      - side: attacker
        when:
          min: 3
          max: 5
        roll: 2D6
        reward: Crossbow Pistol
        reward_i18n:
          es: >-
            Pistola Ballesta
      - side: attacker
        when:
          min: 6
          max: 8
        roll: 2D6
        reward: Hunting Arrows
        reward_i18n:
          es: >-
            Flechas de Caza
      - side: attacker
        when:
          min: 9
          max: 10
        roll: 2D6
        reward: Repeater Crossbow
        reward_i18n:
          es: >-
            Ballesta de Repetición
      - side: attacker
        when:
          min: 11
          max: 12
        roll: 2D6
        reward: Hunting Rifle
        reward_i18n:
          es: >-
            Rifle de Caza
  name_i18n:
    es: Los Guardaespaldas
- id: scenario.blood-hunt
  name: Blood Hunt
  setting: Mordheim
  source: Town Cryer
  author: Mark Havener, et al.
  player_mode: 1v1
  effect: >-
    Clashing warbands gain the help of a Dramatis Personae, most likely Johann The Knife & Marriana
    Chevaux, free of charge.
  effect_i18n:
    es: >-
      Las bandas enfrentadas obtienen la ayuda de un Personaje Singular, muy probablemente Johann el
      Cuchillo y Marriana Chevaux, gratis.
  tags:
  - friendly-npc
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / Blood Hunt
    url: https://mordheimer.net/docs/campaigns/scenarios/town-cryer/blood-hunt
  progression:
    experience:
    - ref: campaign.experience.award.survives
    - ref: campaign.experience.award.winning-leader
    - ref: campaign.experience.award.per-enemy-out-of-action
    - effect: Any Hero who takes an enemy Dramatis Personae Out of Action gets an additional +2 Experience, in addition to the normal +1 for taking out an enemy warrior

      effect_i18n:
        es: >-
          Cualquier Héroe que deje Fuera de Combate a un Personaje Singular enemigo obtiene +2 de
          Experiencia adicionales, además del +1 normal por dejar fuera de combate a un guerrero
          enemigo
      amount: 2
    notes:
    - Each warband receives the services of a Dramatis Personae free of charge during the scenario; if
      that Dramatis Personae is put Out of Action, the warband automatically routs at the start of its
      next turn. The Dramatis Personae catalogue (hired-swords-and-dramatis.yaml) remains in draft.
    notes_i18n:
      es: >-
        Cada banda recibe los servicios de un Dramatis Personae gratis durante el escenario; si ese
        Dramatis Personae queda Fuera de Combate, la banda se desbanda automáticamente al comienzo de
        su siguiente turno. El catálogo de Dramatis Personae (hired-swords-and-dramatis.yaml) sigue en
        borrador.
  name_i18n:
    es: Cacería de Sangre
- id: scenario.bounty-hunting
  name: Bounty Hunting
  setting: The Empire
  source: Town Cryer
  author: Mark Havener, et al.
  player_mode: 1v1
  effect: >-
    An Empire In Flames scenario. Warbands attempt to round up a gang of bandits who are holed up in
    a remote hideout building.
  effect_i18n:
    es: >-
      Un escenario de Un Imperio en Llamas. Las bandas intentan dar caza a una banda de bandidos
      atrincherados en un escondite remoto.
  tags:
  - objective-building
  - hostile-npc
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / Bounty Hunting
    url: https://mordheimer.net/docs/campaigns/scenarios/town-cryer/bounty-hunting
  progression:
    experience:
    - ref: campaign.experience.award.survives
    - ref: campaign.experience.award.winning-leader
    - ref: campaign.experience.award.per-enemy-out-of-action
    - effect: Any Hero who gets wounded by a bandit crossbow but is not taken Out of Action gains +1 Experience

      effect_i18n:
        es: >-
          Cualquier Héroe que resulte herido por una ballesta de bandido pero no quede Fuera de
          Combate gana +1 de Experiencia
      amount: 1
    income: The bandits may be turned in to the authorities for 5 + 1D6 gc per head (roll separately for
      each bandit). There are 6 plus the number of warbands bandits in the hideout.
    loot:
      effect: The winning warband captures the bandits' equipment.
      effect_i18n:
        es: >-
          La banda ganadora captura el equipo de los bandidos.
      contents:
      - reward: 6 Crossbows
        reward_i18n:
          es: >-
            6 Ballestas
        roll: automatic
      - reward: D3 swords
        reward_i18n:
          es: >-
            D3 espadas
        item_id: sword
        roll: automatic
      - reward: 2D6 daggers
        reward_i18n:
          es: >-
            2D6 dagas
        roll: automatic
  name_i18n:
    es: Cazarrecompensas
- id: scenario.down-at-the-docks
  name: Down at the Docks
  setting: Mordheim
  source: Town Cryer
  author: Mark Havener, et al.
  player_mode: 1v1
  effect: Warbands must attempt to gain cargo crates from smugglers' ship by carrying them off.
  effect_i18n:
    es: >-
      Las bandas deben intentar conseguir cajas de carga del barco de los contrabandistas
      llevándoselas.
  tags:
  - treasure
  - objective
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / Down At The Docks
    url: https://mordheimer.net/docs/campaigns/scenarios/town-cryer/down-at-the-docks
  progression:
    experience:
    - ref: campaign.experience.award.survives
    - ref: campaign.experience.award.winning-leader
    - ref: campaign.experience.award.per-enemy-out-of-action
    - effect: A Hero or Henchman from an attacking warband who takes a crate from the battlefield earns +1 Experience

      effect_i18n:
        es: >-
          Un Héroe o Secuaz de una banda atacante que se lleve una caja del campo de batalla gana +1
          de Experiencia
      amount: 1
    loot:
      effect: >-
        Any crates removed from the battlefield may be prised open after the battle; roll 4D6 per
        crate and consult the table. The defending warband instead receives 25 gc per crate
        remaining on the battlefield at the end of the game.
      effect_i18n:
        es: >-
          Las cajas retiradas del campo de batalla pueden forzarse tras la batalla; tira 4D6 por
          caja y consulta la tabla. La banda defensora recibe en cambio 25 coronas por cada caja que
          permanezca en el campo de batalla al final de la partida.
      contents:
      - when:
          min: 4
          max: 4
        roll: 4D6
        reward: Gems worth 100 gc (fence value 40 gc, or worn adds +1 to rarity finds) and a pack of Tarot
          cards
        reward_i18n:
          es: >-
            Gemas por valor de 100 co (valor al venderlas 40 co, o si se llevan puestas añaden +1 a
            las tiradas de rareza) y una baraja de Cartas del Tarot
      - when:
          min: 5
          max: 5
        roll: 4D6
        reward: Blunderbuss and shot
        reward_i18n:
          es: >-
            Trabuco y munición
      - when:
          min: 6
          max: 6
        roll: 4D6
        reward: Medicine chest usable as D6 doses of Healing Herbs or as a one-off re-roll on the Hero
          Serious Injury table
        reward_i18n:
          es: >-
            Botiquín utilizable como D6 dosis de Hierbas Curativas o como una única repetición en la
            tabla de Heridas Graves de Héroes
      - when:
          min: 7
          max: 7
        roll: 4D6
        reward: Suit of heavy armour
        reward_i18n:
          es: >-
            Armadura pesada
        item_id: heavy_armour
      - when:
          min: 8
          max: 8
        roll: 4D6
        reward: Elven Cloak
        reward_i18n:
          es: >-
            Capa Élfica
      - when:
          min: 9
          max: 9
        roll: 4D6
        reward: D3 shields and swords
        reward_i18n:
          es: >-
            D3 escudos y espadas
      - when:
          min: 10
          max: 11
        roll: 4D6
        reward: Beer worth 2D6 gc per crate; on a D6 roll of 6 there is one dose of Bugman's Ale
        reward_i18n:
          es: >-
            Cerveza por valor de 2D6 co por caja; con un 6 en un D6 hay una dosis de Cerveza de Bugman
      - when:
          min: 12
          max: 16
        roll: 4D6
        reward: Food worth D6 gc per crate, including one clove of Garlic per warband member; on a D6
          roll of 6 also one dose of Dark Venom (1-2), Black Lotus (3-4) or Crimson Shade (5-6)
        reward_i18n:
          es: >-
            Comida por valor de D6 co por caja, incluido un diente de Ajo por cada miembro de la
            banda; con un 6 en un D6 también una dosis de Veneno Oscuro (1-2), Loto Negro (3-4) o
            Sombra Carmesí (5-6)
      - when:
          min: 17
          max: 18
        roll: 4D6
        reward: Clothing worth 2D6 gc per crate, including D3 sets of toughened leathers
        reward_i18n:
          es: >-
            Ropa por valor de 2D6 co por caja, incluidos D3 conjuntos de Cuero Endurecido
      - when:
          min: 19
          max: 19
        roll: 4D6
        reward: Luxury goods worth 4D6 gc per crate; hidden inside is a Wyrdstone pendulum (1-3) or a
          set of Cathayan Silks (4-6)
        reward_i18n:
          es: >-
            Artículos de lujo por valor de 4D6 co por caja; escondido dentro hay un Péndulo de Piedra
            bruja (1-3) o un conjunto de Sedas de Cathay (4-6)
      - when:
          min: 20
          max: 20
        roll: 4D6
        reward: Blackpowder worth 5D6 per crate, containing one pack of Superior Blackpowder
        reward_i18n:
          es: >-
            Pólvora por valor de 5D6 por barril, que contiene un paquete de Pólvora Superior
      - when:
          min: 21
          max: 21
        roll: 4D6
        reward: D3 Crossbows each with Hunting Bolts (same as Hunting Arrows) for one game
        reward_i18n:
          es: >-
