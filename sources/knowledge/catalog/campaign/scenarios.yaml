- id: scenario.mule-train
  name: Mule Train
  setting: Mordheim
  source: Town Cryer #14
  author: Robert J Walker
  player_mode: 1v1
  summary: The good guys try to lead the mule train along a country road while
    the bad guys try to steal them.
  tags: [escort-npc, objective]
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / Mule Train
    url: https://mordheimer.net/docs/campaigns/scenarios/town-cryer/mule-train
  progression:
    experience:
    - ref: campaign.experience.award.survives
    - ref: campaign.experience.award.winning-leader
    - ref: campaign.experience.award.per-enemy-out-of-action
