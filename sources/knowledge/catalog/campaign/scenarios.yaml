      summary: 'The Heroes carry chests out of the Wizard''s Tower (a D6 per appearing Hero: on a 6 he brings a chest; if no Hero brings one, a random Hero is given one, so there is always at least one chest).
        In the post-battle sequence, roll D6 for each chest removed from the table. After this battle no Exploration rolls are made: no one dares search the cursed ruins of the tower.'
      contents:
      - when:
          min: 1
          max: 2
        roll: D6
        reward: 'Illusions: the treasures were simple illusions and vanish before the warband returns to camp.'
      - when:
          min: 3
          max: 5
        roll: D6
        reward: 'Valuables: roll 3D6, the result being the gc the items are traded for.'
      - when:
          min: 6
          max: 6
        roll: D6
        reward: 'Gold, Gold, GOLD: roll 6D6 and add the result to the Treasury.'
