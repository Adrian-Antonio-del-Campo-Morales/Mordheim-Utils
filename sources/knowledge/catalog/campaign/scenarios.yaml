  author: Tuomas Pirinen
  player_mode: 1v1
  effect: >-
    Possessed vs any warband. Rescue a fair maiden before she gets sacrificed, or sacrifice her
    before she gets rescued.
  effect_i18n:
    es: >-
      Los Endemoniados contra cualquier banda. Rescata a la doncella antes de que la sacrifiquen, o
      sacrifícala antes de que la rescaten.
