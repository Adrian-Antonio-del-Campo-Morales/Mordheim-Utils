    - Because of how hard his task is, the Defender gains double Experience for surviving or for being
      the winning leader; the page shows the +1 awards with the double applied to the Defender.
    notes_i18n:
      es: >-
        Debido a lo duro de su tarea, el Defensor gana el doble de Experiencia por sobrevivir o por
        ser el líder ganador; la página muestra las recompensas de +1 con el doble aplicado al
        Defensor.
  name_i18n:
    es: A Través del Paso del Fuego Negro
- id: scenario.brigands-in-the-pasturelands
  name: Brigands in the Pasturelands
  setting: The Empire
  source: Fanatic Magazine
  author: Nick Kyme
  player_mode: 1v1
  effect: >-
    One warband attempts to hunt down the other, a lawless band of brigands hiding out in the
    forest.
  effect_i18n:
    es: >-
      Una banda intenta dar caza a la otra, un grupo de bandoleros sin ley escondido en el bosque.
  tags:
  - attacker-defender
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / Brigands in the Pasturelands
    url: https://mordheimer.net/docs/campaigns/scenarios/fanatic-magazine/brigands-in-the-pasturelands
  progression:
    experience:
    - effect: Surviving Heroes or Henchman groups gain +1 Experience among the attackers and +2 Experience among the defenders

      effect_i18n:
        es: >-
          Los Héroes o grupos de Secuaces supervivientes ganan +1 de Experiencia entre los atacantes
          y +2 de Experiencia entre los defensores
    - effect: The leader of the winning warband gains +1 Experience if he was an attacker and +2 Experience if he was a defender

      effect_i18n:
        es: >-
          El líder de la banda ganadora gana +1 de Experiencia si era atacante y +2 de Experiencia
          si era defensor
    - ref: campaign.experience.award.per-enemy-out-of-action
    income: If the attackers win they gain D6 gold crowns for each Henchman they put out of action and
      D6 x 5 gold crowns for each Hero put out of action; in a campaign, if a Hero rolls a Captured result
      on the Serious Injuries chart the Baron pays an additional D6 x 10 gold crowns for that Hero.
    notes:
    - If the defenders win, one of the hired mercenaries still standing joins the warband for free (even
      if he is a hired sword normally not allowed); his subsequent upkeep is normal.
    notes_i18n:
      es: >-
        Si ganan los defensores, uno de los mercenarios contratados que siga en pie se une gratis a la
        banda (aunque sea una espada a sueldo normalmente no permitida); su manutención posterior es
        normal.
  name_i18n:
    es: Bandidos en los Pastizales
- id: scenario.the-watchtower
  name: The Watchtower
  setting: The Empire
  source: Fanatic Magazine
  author: Nick Kyme
  player_mode: 1v1
  effect: >-
    Half of the defending warband starts on or near a well-defended central tower (with special
    rules to reflect this).
  effect_i18n:
    es: >-
      La mitad de la banda defensora comienza en una torre central bien defendida o cerca de ella
      (con reglas especiales que lo reflejan).
  tags:
  - attacker-defender
  - objective-building
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / The Watchtower
    url: https://mordheimer.net/docs/campaigns/scenarios/fanatic-magazine/the-watchtower
  progression:
    experience:
    - ref: campaign.experience.award.survives
    - ref: campaign.experience.award.winning-leader
    - ref: campaign.experience.award.per-enemy-out-of-action
    - effect: Any Hero who successfully lights the beacon gains +1 Experience
      effect_i18n:
        es: >-
          Cualquier Héroe que encienda la hoguera de señales con éxito gana +1 de Experiencia
      amount: 1
  name_i18n:
    es: La Atalaya
- id: scenario.wolf-hunt
  name: Wolf Hunt!
  setting: The Empire
  source: Fanatic Magazine
  author: Nick Kyme
  player_mode: 1v1
  effect: Both warbands have been offered a reward to kill a pack of troublesome wolves.
  effect_i18n:
    es: >-
      A ambas bandas se les ha ofrecido una recompensa por matar a una manada de lobos
      problemáticos.
  tags:
  - hostile-npc
  - objective
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / Wolf Hunt!
    url: https://mordheimer.net/docs/campaigns/scenarios/fanatic-magazine/wolf-hunt
  progression:
    experience:
    - ref: campaign.experience.award.survives
    - ref: campaign.experience.award.winning-leader
    - ref: campaign.experience.award.per-enemy-out-of-action
    - effect: Any Hero earns +1 Experience for each bear he puts out of action
      effect_i18n:
        es: >-
          Cualquier Héroe gana +1 de Experiencia por cada oso que deje fuera de combate
      amount: 1
    income: The baron rewards any warband a bounty of 10 gold crowns for each slain wolf (there is no
      reward for slaying a bear).
  name_i18n:
    es: ¡Caza del Lobo!
- id: scenario.protect-hornsbys-ferry
  name: Protect Hornsby's Ferry!
  setting: The Empire
  source: Fanatic Magazine
  author: Mark Havener
  player_mode: 1v1
  effect: >-
    Defenders must protect a boat and pull-rope style river ferry crossing from sabotage; attackers
    must sabotage it.
  effect_i18n:
    es: >-
      Los defensores deben proteger de sabotaje un paso de transbordador fluvial de cuerda y
      barcaza; los atacantes deben sabotearlo.
  tags:
  - attacker-defender
  - objective
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / Protect Hornsby's Ferry!
    url: https://mordheimer.net/docs/campaigns/scenarios/fanatic-magazine/protect-hornsbys-ferry
  progression:
    experience:
    - ref: campaign.experience.award.survives
    - ref: campaign.experience.award.winning-leader
    - ref: campaign.experience.award.per-enemy-out-of-action
    - effect: The leader of an attacking warband gains +1 Experience if members of that warband rough up the Hornsbys

      effect_i18n:
        es: >-
          El líder de una banda atacante gana +1 de Experiencia si miembros de esa banda dan una
          paliza a los Hornsby
      amount: 1
    - effect: The leader of the defending warband gains an additional +1 Experience if his warband wins the scenario without letting the Hornsbys get roughed up

      effect_i18n:
        es: >-
          El líder de la banda defensora gana +1 de Experiencia adicional si su banda gana el
          escenario sin dejar que los Hornsby reciban una paliza
      amount: 1
    income: In addition to normal exploration money, if the attackers win the scenario they receive 3D6
      gc each (rolled separately per warband). Any attacking warband that has a warrior taking part in
      roughing up the Hornsbys receives 2D6 gc whether they win or not. If the defenders win and the Hornsbys
      have NOT been roughed up, the defenders receive 5D6 gc from the Hornsbys (subtract 2D6 gc if the
      win came from the turn limit, representing the patrol's fees). If the defenders win but the Hornsbys
      were roughed up they receive no pay.
  name_i18n:
    es: ¡Proteger el Transbordador de Hornsby!
- id: scenario.stop-thief
  name: Stop Thief!
  setting: The Empire
  source: Fanatic Magazine
  author: Mark Havener
  player_mode: 1v1
  effect: Defenders must protect the Halfling Thief hired sword from the attacking warband.
  effect_i18n:
    es: >-
      Los defensores deben proteger al Ladrón Mediano, espada a sueldo, de la banda atacante.
  tags:
  - escort-npc
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / Stop Thief!
    url: https://mordheimer.net/docs/campaigns/scenarios/fanatic-magazine/stop-thief
  progression:
    experience:
    - ref: campaign.experience.award.survives
    - ref: campaign.experience.award.winning-leader
    - ref: campaign.experience.award.per-enemy-out-of-action
    - effect: The leader of an attacking warband that retrieves its stolen item gains an additional +1 Experience

      effect_i18n:
        es: >-
          El líder de una banda atacante que recupere su objeto robado gana +1 de Experiencia
          adicional
      amount: 1
    income: If the defending warband wins, the Thief hocks the stolen items (half value, as usual for
      selling equipment) and gives the proceeds to his warband. If the attackers win they get all their
      items back and additionally find 2D6 gc worth of valuables the Thief stole from other victims.
  name_i18n:
    es: ¡Al Ladrón!
- id: scenario.hunt-the-heretic
  name: Hunt the Heretic
  setting: The Empire
  source: Fanatic Magazine
  author: Nick Kyme
  player_mode: 1v1
  effect: >-
    Four members of the defenders' warband attempt to protect a tooled-up Warlock hired sword from
    the attackers plus an accompanying Witch Hunter Captain.
  effect_i18n:
    es: >-
      Cuatro miembros de la banda defensora intentan proteger a un Brujo espada a sueldo bien
      pertrechado de los atacantes y de un Capitán Cazador de Brujas que los acompaña.
  tags:
  - escort-npc
  - attacker-defender
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / Hunt the Heretic
    url: https://mordheimer.net/docs/campaigns/scenarios/fanatic-magazine/hunt-the-heretic
  progression:
    experience:
    - ref: campaign.experience.award.survives
    - ref: campaign.experience.award.winning-leader
    - ref: campaign.experience.award.per-enemy-out-of-action
    income: If the Witch Hunter's warband wins they gain D6 x 15 gold crowns as payment and D3 vials of
      Blessed Water. If the Warlock's warband wins he concocts D3 doses of any poison or drug of their
      choice.
  name_i18n:
    es: Cazar al Hereje
- id: scenario.river-watch
  name: River Watch
  setting: The Empire
  source: Fanatic Magazine
  author: Nick Kyme
  player_mode: 1v1
  effect: >-
    Attackers at the south side must smuggle some loot across an east-west flowing river at night
    and get 25% of their band off the north edge.
  effect_i18n:
    es: >-
      Los atacantes, en el lado sur, deben pasar de contrabando parte del botín por un río que corre
      de este a oeste de noche y sacar el 25% de su banda por el borde norte.
  tags:
  - attacker-defender
  - traverse-the-board
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / River Watch
    url: https://mordheimer.net/docs/campaigns/scenarios/fanatic-magazine/river-watch
  progression:
    experience:
    - ref: campaign.experience.award.survives
    - ref: campaign.experience.award.winning-leader
    - ref: campaign.experience.award.per-enemy-out-of-action
    - effect: Each Hero or Henchman group that manages to escape off the north board edge in the attacking warband gains +1 Experience

      effect_i18n:
        es: >-
          Cada Héroe o grupo de Secuaces de la banda atacante que logre escapar por el borde norte
          del tablero gana +1 de Experiencia
      amount: 1
    income: If the defender wins they are paid D6 x 20 gold crowns plus 5 gold crowns extra for each enemy
      they take out of action.
  name_i18n:
    es: Vigilancia del Río
- id: scenario.night-of-the-dead
  name: Night of the Dead
  setting: Mordheim
  source: Fanatic Online
  author: Andy Tabor
  player_mode: 1v1
  effect: >-
    Warband members must venture to the centre of the board, grab a wyrdstone shard and escape from
    the table.
  effect_i18n:
    es: >-
      Los miembros de la banda deben adentrarse en el centro del tablero, coger un fragmento de
      Piedra bruja y escapar de la mesa.
  tags:
  - wyrdstone-tokens
  - traverse-the-board
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / Night Of The Dead
    url: https://mordheimer.net/docs/campaigns/scenarios/fanatic-online/night-of-the-dead
  progression:
    experience:
    - ref: campaign.experience.award.survives
    - ref: campaign.experience.award.winning-leader
    - ref: campaign.experience.award.per-enemy-out-of-action
    - effect: Any Hero or Henchman group earns +1 Experience for each piece of wyrdstone they get to carry off the board

      effect_i18n:
        es: >-
          Cualquier Héroe o grupo de Secuaces gana +1 de Experiencia por cada pieza de Piedra bruja
          que logren sacar del tablero
    - effect: Any Hero earns +1 Experience for each Zombie he puts Out of Action
      effect_i18n:
        es: >-
          Cualquier Héroe gana +1 de Experiencia por cada Zombi que deje Fuera de Combate
    wyrdstone: A pile of wyrdstone sits in an 8" circle in the centre of the board; the pile is brought
      to safety as D6+2 wyrdstone. Each time a model takes wyrdstone from the pile, D3+1 Zombies per warband
      are generated 8" away around the pile.
    wyrdstone_i18n:
      es: >-
        Un montón de Piedra bruja se encuentra en un círculo de 8" en el centro del tablero; el montón
        se pone a salvo como D6+2 de Piedra bruja. Cada vez que una miniatura coge Piedra bruja del
        montón, se generan D3+1 Zombis por banda a 8" alrededor del montón.
    notes:
    - Multiplayer (one or several players; adapted from Troll 23). Only one Hero and one group of henchmen
      chosen at random are on the table at a time; upon returning to the deployment zone with wyrdstone,
      another of the same type may come out. The fog limits visibility to 4" with its own 2D6 table. Victory
      is decided by the agreed option (most wyrdstone recovered, last one standing, etc.).
    notes_i18n:
      es: >-
        Multijugador (uno o varios jugadores; adaptado de Troll 23). Solo un Héroe y un grupo de
        secuaces elegidos al azar están en la mesa a la vez; al regresar a la zona de despliegue con
        Piedra bruja, puede salir otro del mismo tipo. La niebla limita la visibilidad a 4" con su
        propia tabla de 2D6. La victoria se decide por la opción acordada (más Piedra bruja
        recuperada, el último en pie, etc.).
  name_i18n:
    es: Noche de los Muertos
- id: scenario.happy-harpy-hunting-grounds
  name: Happy Harpy Hunting Grounds
  setting: Mordheim
  source: Fanatic Online
  author: Chris Van Tigem
  player_mode: 1v1
  effect: >-
    A group of 3 Harpies have nested in one of the tall buildings and their scavenging and attacks
    on unfortunate warbands has ensured a sizable stash of valuables.
  effect_i18n:
    es: >-
      Un grupo de 3 Arpías ha anidado en uno de los edificios altos y su expolio y ataques a bandas
      desafortunadas han asegurado un considerable alijo de objetos valiosos.
  tags:
  - treasure
  - hostile-npc
  - objective-building
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / Happy Harpy Hunting Grounds
    url: https://mordheimer.net/docs/campaigns/scenarios/fanatic-online/happy-harpy-hunting-grounds
  progression:
    experience:
    - ref: campaign.experience.award.survives
    - ref: campaign.experience.award.winning-leader
    - ref: campaign.experience.award.per-enemy-out-of-action
    - effect: A Hero earns +1 Experience for each enemy he puts out of action, including Harpies
      effect_i18n:
        es: >-
          Un Héroe gana +1 de Experiencia por cada enemigo que deje fuera de combate, incluidas las
          Arpías
      amount: 1
    wyrdstone: 'The nest contains a number of wyrdstone shards: roll D3 at set-up to determine how many
      are included.'
    wyrdstone_i18n:
      es: >-
        El nido contiene varios fragmentos de Piedra bruja: al desplegar, tira D3 para determinar
        cuántos incluye.
    loot:
      effect: >-
        The warband that does not rout is the winner and may roll on the nest contents chart if all
        three Harpies were taken out of action first; otherwise no one receives the rewards. Each
        item is rolled for separately.
      effect_i18n:
        es: >-
          La banda que no huya es la ganadora y puede tirar en la tabla de contenidos del nido si
          las tres Arpías fueron dejadas fuera de combate primero; de lo contrario, nadie recibe las
          recompensas. Cada objeto se tira por separado.
      contents:
      - roll: 5+
        reward: 2D6 gc.
        reward_i18n:
          es: >-
            2D6 co.
      - roll: 3+
        reward: Jeweled Dagger.
        reward_i18n:
          es: >-
            Daga Enjoyada.
      - roll: 5+
        reward: Heavy Armour.
        reward_i18n:
          es: >-
            Armadura Pesada.
        item_id: heavy_armour
      - roll: 6+
        reward: Ithilmar Sword.
        reward_i18n:
          es: >-
            Espada de Ithilmar.
      - roll: 3+
        reward: Gems worth 30 gc.
        reward_i18n:
          es: >-
            Gemas por valor de 30 co.
      - roll: 6+
        reward: Wolfcloak.
        reward_i18n:
          es: >-
            Capa de Lobo.
        item_id: wolfcloak
      - roll: 5+
        reward: 'Straggler: an unfortunate captive who may aid the warband in its exploration phase either
          this game or next.'
        reward_i18n:
          es: >-
            Rezagado: un desgraciado cautivo que puede ayudar a la banda en su fase de exploración, ya
            sea esta partida o la siguiente.
      - roll: 3+
        reward: Lucky Charm.
        reward_i18n:
          es: >-
            Amuleto de la Suerte.
        item_id: lucky_charm
      - roll: 4+
        reward: D3 Shields.
        reward_i18n:
          es: >-
            D3 Escudos.
        item_id: shield
      - roll: 5+
        reward: D3 Helmets.
        reward_i18n:
          es: >-
            D3 Yelmos.
        item_id: helmet
      - roll: 6+
        reward: D3 Swords.
        reward_i18n:
          es: >-
            D3 Espadas.
        item_id: sword
    notes:
    - 'Multiplayer scenario for three players: one controls a warband of three Harpies (own profile, never
      flee) and the other two try to kill them to get the treasure.'
    notes_i18n:
      es: >-
        Escenario multijugador para tres jugadores: uno controla una banda de tres Arpías (perfil
        propio, nunca huyen) y los otros dos intentan matarlas para conseguir el tesoro.
  name_i18n:
    es: Felices Cotos de Caza de Arpías
- id: scenario.round-up-at-the-mordheim-corral
  name: Round-Up at the Mordheim Corral
  setting: Mordheim
  source: Fanatic Online
  author: Andy Tabor
  player_mode: 1v1
  effect: >-
    Two to four wild boars have eaten a merchant's wyrdstone. Warbands must kill randomly moving and
    aggressive boars to recover it. Optional suggestion of using mutations.
  effect_i18n:
    es: >-
      De dos a cuatro jabalíes salvajes se han comido la Piedra bruja de un mercader. Las bandas
      deben matar a los jabalíes agresivos que se mueven al azar para recuperarla. Sugerencia
      opcional: usar mutaciones.
  tags:
  - wyrdstone-tokens
  - hostile-npc
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / Round-up at the Mordheim Corral
    url: https://mordheimer.net/docs/campaigns/scenarios/fanatic-online/roundup-at-the-mordheim-corral
  progression:
    experience:
    - ref: campaign.experience.award.survives
    - ref: campaign.experience.award.winning-leader
    - ref: campaign.experience.award.per-enemy-out-of-action
    - effect: Any Hero or Henchman group carrying a wyrdstone counter at the end of the battle gains +1 Experience

      effect_i18n:
        es: >-
          Cualquier Héroe o grupo de Secuaces que lleve un contador de Piedra bruja al final de la
          batalla gana +1 de Experiencia
      amount: 1
    wyrdstone: 'The boars have swallowed the wyrdstone. Each boar must be killed before it can be searched:
      roll D6, on 1-3 the warrior cannot locate the stomach and may try again next turn, on 4-6 he rolls
      D3 to determine how many shards are found. A warrior carrying wyrdstone who is killed, stunned or
      knocked down drops counters where he fell.'
    wyrdstone_i18n:
      es: >-
        Los jabalíes se han tragado la Piedra bruja. Hay que matar a cada jabalí antes de poder
        registrarlo: tira D6; con 1-3 el guerrero no encuentra el estómago y puede volver a intentarlo
        en el siguiente turno; con 4-6 tira D3 para determinar cuántos fragmentos encuentra. Un
        guerrero que lleve Piedra bruja y sea matado, aturdido o derribado suelta las fichas donde
        cayó.
    notes:
    - Multiplayer; the boars (own profile, D3+1 per warband, do not flee) move first. Optional mutation
      rules (5+ per boar from its second turn) and domestication by Orc Heroes.
    notes_i18n:
      es: >-
        Multijugador; los jabalíes (perfil propio, D3+1 por banda, no huyen) se mueven primero. Reglas
        opcionales de mutación (5+ por jabalí desde su segundo turno) y domesticación por Héroes
        Orcos.
  name_i18n:
    es: Redada en el Corral de Mordheim
- id: scenario.the-recipe
  name: The Recipe
  setting: Mordheim
  source: Fanatic Online
  author: Mark Havener
  player_mode: 1v1
  effect: >-
    Warbands must attempt to abduct an esteemed pie-maker who is being stoutly defended by his
    ballistically adept bodyguard.
  effect_i18n:
    es: >-
      Las bandas deben intentar secuestrar a un estimado pastelero que está firmemente defendido por
      su guardaespaldas, un experto en balística.
  tags:
  - escort-npc
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / The Recipe
    url: https://mordheimer.net/docs/campaigns/scenarios/fanatic-online/the-recipe
  progression:
    experience:
    - ref: campaign.experience.award.survives
    - ref: campaign.experience.award.winning-leader
    - ref: campaign.experience.award.per-enemy-out-of-action
    - effect: Any Hero who turns in one or more pies gains +1 Experience
      effect_i18n:
        es: >-
          Cualquier Héroe que entregue uno o más pasteles gana +1 de Experiencia
      amount: 1
    income: 'The winning warband is considered to have captured Geefer: turning him in is worth 5D6 gc
      (if two or more warbands share the win they must decide which one turns him in). Pies that have
      not been ruined may also be turned in: worth 1 gc each for a non-winning warband, or half that amount
      rounded up for the winning warband. A winning warband also gets any pies held by its warriors or
      still in the cart at the end of the game.'
    notes:
    - Multiplayer (two or more). Geefer Lugbottom (own profile, ignores psychology) and his six halfling
      guards (bows) defend the pie cart (3D6+6 pies). If all warbands flee leaving Geefer or his guards
      in play, all lose.
    notes_i18n:
      es: >-
        Multijugador (dos o más). Geefer Lugbottom (perfil propio, ignora la psicología) y sus seis
        guardias halflings (arcos) defienden el carro de empanadas (3D6+6 empanadas). Si todas las
        bandas huyen dejando a Geefer o a sus guardias en juego, todas pierden.
  name_i18n:
    es: La Receta
- id: scenario.ambush-archive-pestilens
  name: Ambush
  setting: Mordheim
  source: Archive Pestilen
  author: Andrew "Boss Orc"
  player_mode: 1v1
  effect: >-
    Some more devious gangs use the element of surprise as a safer alternative to a drawn out battle
    of attrition. These gangs are often smaller than their rivals and use the surprise to their
    advantage.
  effect_i18n:
    es: >-
      Algunas bandas más astutas usan el elemento sorpresa como alternativa más segura a una
      prolongada batalla de desgaste. Estas bandas suelen ser más pequeñas que sus rivales y usan la
      sorpresa a su favor.
  tags:
  - attacker-defender
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / Ambush
    url: https://mordheimer.net/docs/campaigns/scenarios/archive-pestilen/ambush-archive-pestilen
  progression:
    experience:
