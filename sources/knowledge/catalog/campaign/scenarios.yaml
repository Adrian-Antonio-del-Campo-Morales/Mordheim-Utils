- id: scenario.forbidden-square
  name: Forbidden Square
  setting: Mordheim
  source: Town Cryer #8
  author: Donato Ranzato
  player_mode: 1v1
  summary: A Witch Hunter Warband has been sent into a specific part of the
    City of the Damned by prominent members of the Order of the Templars of Sigmar.
  tags: [objective]
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / Forbidden Square
    url: https://mordheimer.net/docs/campaigns/scenarios/town-cryer/forbidden-square
  progression:
    experience:
    - summary: A fighter who survives the battle earns +1 Experience; even fighters who are wounded and taken Out of Action receive Experience for taking part
      amount: 1
    - summary: The leader of the winning side earns +2 Experience
      amount: 2
    - summary: A fighter earns +1 Experience for each opposing fighter he takes down or Out of Action during the battle
      amount: 1
    wyrdstone: >-
      D6+2 Wyrdstone counters are placed before deployment. Warriors pick them
      up by moving into contact; when a warrior is knocked down, stunned or
      taken Out of Action he drops all counters he is carrying. Each side
      carries its counters off through the gate (or offers them to the totem
      for the Possessed). When all counters have been carried away or absorbed
      the game ends and the player with the most stones wins.
    notes:
    - >-
      The page does not declare the conversion of counters held at the end into
      earned wyrdstone shards. The text of the '+1 Winning Leader' award
      declares '+2 Experience'; the page header cites Town Cryer #7 /
      Christian Ellegaard while the site index assigns it to Town Cryer #8 /
      Donato Ranzato. Verify both ends against the prints.
- id: scenario.stake-out
  name: Stake-Out
  setting: Mordheim
  source: Town Cryer #8
  author: Gavin Thorpe
  player_mode: 1v1
  summary: Sneaky attackers must kill the leader of the startled defenders; the
    defenders' leader must escape from the table.
  tags: [attacker-defender, objective]
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / Stake-Out
    url: https://mordheimer.net/docs/campaigns/scenarios/town-cryer/stake-out
  progression:
    experience:
    - summary: An attacking model which takes out the defending leader earns one extra Experience
      amount: 1
    - summary: The winning warband gains +1 Fame
      amount: 1
    - ref: campaign.experience.award.survives
    - ref: campaign.experience.award.winning-leader
    - ref: campaign.experience.award.per-enemy-out-of-action
    wyrdstone: The loser earns D6 shards of wyrdstone and the winner D6+1 shards.
    notes:
    - >-
      'Fame' is not a standard campaign metric; the page itself marks it as a
      possible leftover of a previous version. Verify against Town Cryer #8.
- id: scenario.the-lair-of-the-snake
  name: The Lair of the Snake
  setting: Mordheim
  source: Town Cryer #9
  author: Christian Ellegaard
  player_mode: multiplayer
  summary: Four player scenario. Each player must take out his randomly specified enemy.
  tags: [objective]
