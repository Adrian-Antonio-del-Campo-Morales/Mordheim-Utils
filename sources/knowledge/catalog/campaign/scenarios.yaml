- id: scenario.gift-of-the-truthsayers
  name: Gift of the Truthsayers
  setting: Albion
  source: Town Cryer #15
  author: Nicodemus Kyme
  player_mode: 1v1
  summary: Scrap over a magic item with random boggy happenings.
  tags: [treasure]
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / Gift of the Truthsayers
    url: https://mordheimer.net/docs/campaigns/scenarios/town-cryer/gift-of-the-truthsayers
  progression:
    experience:
    - ref: campaign.experience.award.survives
    - ref: campaign.experience.award.winning-leader
    - ref: campaign.experience.award.per-enemy-out-of-action
    - summary: If a Hero is carrying the artefact at the end of the game he earns +2 Experience
      amount: 2
    loot:
      summary: The warband in possession of the artefact at the end of the game may examine it to discover its worth; roll 2D6.
      contents:
      - when: { min: 1, max: 4 }
        roll: 2D6
        reward: The artefact is valuable and worth 5D6 gold coins
      - when: { min: 5, max: 6 }
        roll: 2D6
        reward: Enchanted Totem of Light (bearer immune to psychology and all alone tests; +1 Leadership if given to the warband's leader)
      - when: { min: 7, max: 8 }
        roll: 2D6
        reward: Silver Sickle (acts like a normal sword, +1 Weapon Skill, +1 Strength vs Daemons, Possessed and Undead)
      - when: { min: 9, max: 9 }
        roll: 2D6
        reward: Talisman of Light (nullifies any harmful spell cast at the wearer on a 4+)
      - when: { min: 10, max: 11 }
        roll: 2D6
        reward: Tome of the Truthsayers (cast a single randomly determined Lore of Light spell once per battle without difficulty roll)
      - when: { min: 12, max: 12 }
        roll: 2D6
        reward: Vambrace of Silver (any ranged weapon that hits the wearer is deflected harmlessly on a 5+)
- id: scenario.the-mummy
  name: The Mummy
  setting: Mordheim
  source: Town Cryer #15
  author: Rob Houdek
  player_mode: 1v1
  summary: Hidden Treasure except warbands look for the stash of a mummy while
    its scary original owner plus friends have their say.
  tags: [treasure, hostile-npc]
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / The Mummy
    url: https://mordheimer.net/docs/campaigns/scenarios/town-cryer/the-mummy
  progression:
    experience:
    - ref: campaign.experience.award.survives
    - ref: campaign.experience.award.winning-leader
    - ref: campaign.experience.award.per-enemy-out-of-action
    - summary: Any Hero or Henchman group earns +1 Experience for wounding the mummy
