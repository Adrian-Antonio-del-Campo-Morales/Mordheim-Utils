- id: scenario.raids
  name: Raids
  setting: The Empire
  source: Archive Pestilen
  author: Christian Ellegaard
  player_mode: 1v1
  effect: Bad warband vs townsfolk; raid a village for loot and slaves.
  effect_i18n:
    es: >-
      Banda malvada contra los lugareños; asalta una aldea en busca de botín y esclavos.
  tags:
  - attacker-defender
  - treasure
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / Raids
    url: https://mordheimer.net/docs/campaigns/scenarios/archive-pestilen/raids
  progression:
    loot:
      effect: >-
        The raiders search the settlement buildings (one Hero or two Henchmen must enter and spend
        the next turn searching an empty building). Roll on the Search table, applying the modifier
        from the Townsfolk table; a roll of 1 always fails. Jewelleries are later sold at 5 gc each.
      effect_i18n:
        es: >-
          Los asaltantes registran los edificios del asentamiento (un Héroe o dos Secuaces deben
          entrar y pasar el siguiente turno registrando un edificio vacío). Tira en la tabla de
          Búsqueda, aplicando el modificador de la tabla de Lugareños; un 1 siempre falla. Las joyas
          se venden después a 5 coronas cada una.
      contents:
      - when:
          min: 1
          max: 2
        roll: D6
        reward: 'Failure: the building is empty; nothing is found.'
        reward_i18n:
          es: >-
            Fracaso: el edificio está vacío; no se encuentra nada.
      - when:
          min: 3
          max: 3
        roll: D6
        reward: Worthless inventories; nothing is taken but the next house searched gains +1 to the roll.
        reward_i18n:
          es: >-
            Inventarios sin valor; no se coge nada, pero la siguiente casa registrada gana +1 a la
            tirada.
      - when:
          min: 4
          max: 4
        roll: D6
        reward: A chest with valuable trinkets; add 1 Jewellery to the warband total.
        reward_i18n:
          es: >-
            Un arcón con baratijas valiosas; añade 1 Joya al total de la banda.
      - when:
          min: 5
          max: 5
        roll: D6
        reward: A bureau full of jewelleries; add D6 Jewelleries.
        reward_i18n:
          es: >-
            Un escritorio lleno de joyas; añade D6 Joyas.
      - when:
          min: 6
          max: 6
        roll: D6
        reward: A treasure chest under a trapdoor; add 2D6 Jewelleries.
        reward_i18n:
          es: >-
            Un cofre del tesoro bajo una trampilla; añade 2D6 Joyas.
    income: 'After the raid the Jewelleries are sold: multiply the total number of Jewelleries by five
      to get the gold crowns paid. Warriors may also capture slaves: three Inhabitants or one Townsman
      put out of action count as one Slave, recorded on the roster and usable in a later post-battle phase
      to add one die to the warband dice pool (then crossed off). After the raid roll D6 minus 1 per Slave
      captured plus 1 per building set on fire; on 1 or less the warband was traced and ambushed: randomly
      roll D6 Henchmen and roll on the Injury table for each.'
    notes:
    - 'The page has no Experience section nor winning-leader awards: it is a campaign event with its own
      rewards (building searches, slaves and burning).'
    notes_i18n:
      es: >-
        La página no tiene sección de Experiencia ni recompensas de líder ganador: es un evento de
        campaña con sus propias recompensas (registros de edificios, esclavos e incendios).
  name_i18n:
    es: Incursiones
