- id: scenario.defend-the-village
  name: Defend the Village!
  name_i18n:
    es: Defiende al Pueblo
  setting: The Empire
  source: Archive Pestilen
  author: Mark "Rinku" Dewis
  player_mode: 1v1
  effect: The Magnificent Seven without the cowboy hats.
  effect_i18n:
    es: >-
      Los Siete Magníficos sin sombreros de vaquero.
  tags:
  - attacker-defender
  - objective-building
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / Defend the Village!
    url: https://mordheimer.net/docs/campaigns/scenarios/archive-pestilen/defend-the-village
  progression:
    experience:
    - ref: campaign.experience.award.survives
    - ref: campaign.experience.award.winning-leader
    - ref: campaign.experience.award.per-enemy-out-of-action
    - effect: If less than 25% of the villagers are put out of action and the defender wins, each surviving member of the winning warband gets a bonus +1 Experience for saving the village

      effect_i18n:
        es: >-
          Si menos del 25% de los aldeanos quedan fuera de combate y gana el defensor, cada miembro
          superviviente de la banda ganadora obtiene un bonus de +1 de Experiencia por salvar la
          aldea
      amount: 1
    loot:
      effect: >-
        The winning player rolls D6 to see what reward the villagers provide (defender) or what loot
        is squeezed from them (attacker). If the attacker won he adds +1 to the roll.
      effect_i18n:
        es: >-
          El jugador ganador tira 1D6 para ver qué recompensa dan los aldeanos (defensor) o qué
          botín se les extorsiona (atacante). Si ganó el atacante, suma +1 a la tirada.
      contents:
      - when:
          min: 1
          max: 2
        roll: D6
        reward: Nothing. The villagers were on their last legs and tricked the defenders about the hire
          fee.
        reward_i18n:
          es: >-
            Nada. Los aldeanos estaban en las últimas y engañaron a los defensores con el precio de la
            contratación.
      - when:
          min: 3
          max: 4
        roll: D6
        reward: 2D6 gc worth of food, personal possessions and tools.
        reward_i18n:
          es: >-
            2D6 co en comida, objetos personales y herramientas.
      - when:
          min: 5
          max: 7
        roll: D6
        reward: 1D3 Wyrdstone shards.
        reward_i18n:
          es: >-
            1D3 fragmentos de Piedra bruja.
    notes:
    - The original reward table lists the 5-7 range with a D6; the attacker's +1 explains the 7 (when
      the attacker wins, the effective range becomes 2-3 / 4-5 / 6-8).
    notes_i18n:
      es: >-
        La tabla de recompensas original incluye el intervalo 5-7 con un D6; el +1 del atacante
        explica el 7 (cuando gana el atacante, el intervalo efectivo pasa a ser 2-3 / 4-5 / 6-8).
  name_i18n:
    es: ¡Defender la Aldea!
- id: scenario.dont-wake-the-giant
  name: Don't Wake the Giant
  name_i18n:
    es: No Despiertes al Gigante
  setting: Mordheim
  source: Archive Pestilen
  author: David Gitchel
  player_mode: 1v1
  effect: Two warbands fight for the giant's goodies while trying not to wake him.
  effect_i18n:
    es: >-
      Dos bandas luchan por las chucherías del gigante mientras intentan no despertarlo.
  tags:
  - treasure
  - hostile-npc
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / Don't Wake the Giant
    url: https://mordheimer.net/docs/campaigns/scenarios/archive-pestilen/dont-wake-the-giant
  progression:
    experience:
    - ref: campaign.experience.award.survives
    - ref: campaign.experience.award.per-enemy-out-of-action
    - effect: The leader of a warband that gets any treasure off the board gains +1 Experience (only once, even if multiple treasures are taken)

      effect_i18n:
        es: >-
          El líder de una banda que saque cualquier tesoro del tablero gana +1 de Experiencia (solo
          una vez, aunque se saquen varios tesoros)
      amount: 1
    - effect: Any Hero or Henchman group that successfully gets a treasure chest to safety gains +1 Experience
      effect_i18n:
        es: >-
          Cualquier Héroe o grupo de Secuaces que ponga a salvo un cofre del tesoro con éxito gana
          +1 de Experiencia
      amount: 1
    - effect: The Hero or Henchman group that lands the killing blow on the Giant gains +2 Experience
      effect_i18n:
        es: >-
          El Héroe o grupo de Secuaces que aseste el golpe de gracia al Gigante gana +2 de
          Experiencia
      amount: 2
    - effect: Any Hero or Henchman group that successfully gets the bag of gold to safety gains +2 Experience
      effect_i18n:
        es: >-
          Cualquier Héroe o grupo de Secuaces que ponga a salvo la bolsa de oro con éxito gana +2 de
          Experiencia
      amount: 2
    loot:
      effect: >-
        The giant holds two treasure chests and a bag of gold. A model reaching a chest must pass an
        Initiative test to steal it; taking the bag requires a -1 Initiative test. Carrying the
        chest follows the Hidden Treasure scenario rules. Each treasure is rolled on its own table.
      effect_i18n:
        es: >-
          El gigante custodia dos cofres del tesoro y una bolsa de oro. Una miniatura que llegue a
          un cofre debe superar una tirada de Iniciativa para robarlo; coger la bolsa requiere una
          tirada de Iniciativa con -1. Llevar el cofre sigue las reglas del escenario Tesoro Oculto.
          Cada tesoro se tira en su propia tabla.
      contents:
      - roll: automatic
        reward: 'Chest: 3D6 gold crowns.'
        reward_i18n:
          es: >-
            Arcón: 3D6 coronas de oro.
      - roll: 5+
        reward: 'Chest: D3 pieces of wyrdstone.'
        reward_i18n:
          es: >-
            Arcón: D3 fragmentos de Piedra bruja.
      - roll: 5+
        reward: 'Chest: D3 gems worth 10 gc each.'
        reward_i18n:
          es: >-
            Arcón: D3 gemas por valor de 10 co cada una.
      - roll: 4+
        reward: 'Chest: Mordheim map.'
        reward_i18n:
          es: >-
            Arcón: Mapa de Mordheim.
        item_id: mordheim_map
      - roll: 4+
        reward: 'Chest: Suit of light armour.'
        reward_i18n:
          es: >-
            Arcón: Armadura ligera.
        item_id: light_armour
      - roll: 3+
        reward: 'Chest: Lucky charm.'
        reward_i18n:
          es: >-
            Arcón: Amuleto de la suerte.
        item_id: lucky_charm
      - roll: automatic
        reward: 'Bag of gold: D6 x 10 gold crowns.'
        reward_i18n:
          es: >-
            Bolsa de oro: D6 x 10 coronas de oro.
      - roll: 5+
        reward: 'Bag of gold: D3 gems worth 10 gc each.'
        reward_i18n:
          es: >-
            Bolsa de oro: D3 gemas por valor de 10 co cada una.
  name_i18n:
    es: No Despertar al Gigante
