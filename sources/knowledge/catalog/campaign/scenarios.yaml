      mules are determined as if the warband found a Slaughtered Warband in the exploration phase, adding
      +1 to the dice roll for every mule recovered over the first. The defenders gain 2D6 gc for each
      mule they lead off the table. Both warbands may explore as normal at the end of the scenario.
