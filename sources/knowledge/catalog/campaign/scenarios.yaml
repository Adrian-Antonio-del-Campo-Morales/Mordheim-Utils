    url: https://mordheimer.net/docs/campaigns/scenarios/archive-pestilen/raids
  progression:
    loot:
      summary: The raiders search the settlement buildings (one Hero or two Henchmen must enter and spend the next turn searching an empty building). Roll on the Search table, applying the modifier from the
        Townsfolk table; a roll of 1 always fails. Jewelleries are later sold at 5 gc each.
      contents:
      - when:
          min: 1
          max: 2
        roll: D6
        reward: 'Failure: the building is empty; nothing is found.'
      - when:
          min: 3
          max: 3
        roll: D6
        reward: Worthless inventories; nothing is taken but the next house searched gains +1 to the roll.
      - when:
          min: 4
          max: 4
        roll: D6
        reward: A chest with valuable trinkets; add 1 Jewellery to the warband total.
      - when:
          min: 5
          max: 5
        roll: D6
        reward: A bureau full of jewelleries; add D6 Jewelleries.
      - when:
          min: 6
          max: 6
        roll: D6
        reward: A treasure chest under a trapdoor; add 2D6 Jewelleries.
    income: 'After the raid the Jewelleries are sold: multiply the total number of Jewelleries by five to get the gold crowns paid. Warriors may also capture slaves: three Inhabitants or one Townsman put
      out of action count as one Slave, recorded on the roster and usable in a later post-battle phase to add one die to the warband dice pool (then crossed off). After the raid roll D6 minus 1 per Slave
      captured plus 1 per building set on fire; on 1 or less the warband was traced and ambushed: randomly roll D6 Henchmen and roll on the Injury table for each.'
    notes:
    - 'The page has no Experience section nor winning-leader awards: it is a campaign event with its own rewards (building searches, slaves and burning).'
