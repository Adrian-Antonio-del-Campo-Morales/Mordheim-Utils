- id: scenario.the-night-of-the-headless-one
  name: The Night Of The Headless One
  setting: Mordheim
  source: Town Cryer #12
  author: Kevin J Coleman
  player_mode: 1v1
  summary: Hidden Treasure except warbands look for the skull of the Headless
    One while its awesome original owner creates carnage.
  tags: [treasure, hostile-npc]
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / The Night Of The Headless One
    url: https://mordheimer.net/docs/campaigns/scenarios/town-cryer/the-night-of-the-headless-one
  progression:
    experience:
    - ref: campaign.experience.award.survives
    - ref: campaign.experience.award.winning-leader
    - ref: campaign.experience.award.per-enemy-out-of-action
    - summary: The model that carries the Headless One's Skull off the opposite table edge earns +2 Experience
      amount: 2
    - summary: Any Hero earns +2 Experience for placing the Headless One Out of Action
      amount: 2
    loot:
      summary: >-
        A warband that captures the Skull of the Headless One (by moving it off
        the table) may keep it and, in a campaign, attempt to summon the
        Headless One at the start of any subsequent game.
    notes:
    - >-
      The skull summoning roll (1 it is lost; 2-5 the Headless One does not
      appear; 6 it appears and increases the warband rating by +125 for the
      game) remains pending modelling together with the Headless One profile.
- id: scenario.the-hunters-become-the-hunted
  name: The Hunters Become The Hunted
  setting: Lustria
  source: Town Cryer #13
  author: Lustria Development Team
  player_mode: 1v1
  summary: Similar to Surprise Attack.
  tags: [attacker-defender, reserves]
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / The Hunters Become The Hunted
    url: https://mordheimer.net/docs/campaigns/scenarios/town-cryer/the-hunters-become-the-hunted
  progression:
    experience:
    - ref: campaign.experience.award.survives
    - summary: The Leader of the winning warband gains +2 Experience
      amount: 2
    - ref: campaign.experience.award.per-enemy-out-of-action
    - summary: All units in the winning warband which survive get +1 Experience per Cold One alive
      amount: 1
    income: >-
      If the winning warband captures the Cold Ones alive they can either mount
      a unit on them or sell them for 80 gc; if one or both Cold Ones are dead
      they can be sold for 40 gc each. The artefacts taken from the Beastmaster
      are the equivalent of a Wyrdstone shard each and can also be sold.
    notes:
    - >-
      The unit that puts the Beastmaster Out of Action obtains his whip and
      control of the Cold Ones; it also carries D3 artefacts. The Beastmaster
      and Cold Ones profiles (Town Cryer #11) are not modelled here. A model
      killed by a carnivorous plant is removed from the campaign on a 1 (D6).
- id: scenario.lost-temple-of-the-slann
  name: Lost Temple Of The Slann
  setting: Lustria
  source: Town Cryer #13
  author: Lustria Development Team
  player_mode: multiplayer
  summary: Similar to Wizard's Mansion.
  tags: [treasure]
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / Lost Temple Of The Slann
    url: https://mordheimer.net/docs/campaigns/scenarios/town-cryer/lost-temple-of-the-slann
  progression:
    experience:
    - ref: campaign.experience.award.survives
    - ref: campaign.experience.award.winning-leader
    - ref: campaign.experience.award.per-enemy-out-of-action
    loot:
      summary: >-
        At the end of the game the winning warband finds all of the items of the
        defender's booty table that were not found before the battle, plus it
        rolls once on the relics chart for each Hero it has that is not Out of
        Action (maximum 6 rolls). Each item is rolled for separately apart from
        the gold crowns, which are always found.
      contents:
      - reward: 3D6 gc
        roll: automatic
      - reward: D3 gems worth 10 gc each
        roll: 5+
      - reward: Tome of Magic
        roll: 4+
      - reward: Gromril Sword
        roll: 5+
      - reward: Cloak of Mists
        roll: 5+
      - reward: Healing Herbs (D3 doses)
        roll: 4+
      - reward: Dispel Scroll
        roll: 5+
    notes:
    - >-
      The defender receives, in addition, one roll on the loot table per
      additional attacking warband (1 Temple Stone Guard; 2 1D3 doses of Dark
      Venom; 3 1D3 doses of Crimson Shade; 4 Holy/Unholy Relic; 5 Lucky Charm;
      6 Heavy Armour); each item may only be found once. The magic items
      (Cloak of Mists, Dispel Scroll, Gromril Sword, Tome of Magic) have no
      entry in the canonical Trading Post.
- id: scenario.the-sword-of-the-herald
  name: The Sword of the Herald
  setting: Mordheim
  source: Town Cryer #13
  author: Jeff Hogg
  player_mode: multiplayer
  summary: Multiplayer scenario involving a mean sword, huge chunks of
    wyrdstone and those ever-popular random zombies.
  tags: [treasure, wyrdstone-tokens, hostile-npc]
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / The Sword of the Herald
    url: https://mordheimer.net/docs/campaigns/scenarios/town-cryer/the-sword-of-the-herald
  progression:
    experience:
    - ref: campaign.experience.award.survives
    - summary: A Hero earns +1 Experience for each enemy model he puts Out of Action; Heroes are restricted to earning +1 point for killing any number of Zombies
      amount: 1
    - ref: campaign.experience.award.winning-leader
    wyrdstone: >-
      Each Star Stone splinter is worth 3 additional wyrdstone in the post
      battle sequence when removed from the table. Note that additional
      experience is not earned for removing the Star Stone splinters or the
      Sword of the Herald.
    notes:
    - >-
      Players who choose that the game 'does not count' gain no experience, do
      not roll serious injuries and do not search for wyrdstone in the
      post-battle sequence, but they can still gain the awards for drawing the
      sword and the shards. The sword value is left to the referee's
      discretion.
