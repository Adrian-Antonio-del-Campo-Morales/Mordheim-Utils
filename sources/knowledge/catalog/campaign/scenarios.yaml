- id: scenario.the-caravan-archive-pestilens
  name: The Caravan
  setting: Mordheim
  source: Archive Pestilen
  author: Unknown
  author_i18n:
    es: Desconocido
  player_mode: 1v1
  effect: Guard or plunder a caravan of gold before it gets to the other side.
  effect_i18n:
    es: >-
      Protege o saquea una caravana de oro antes de que llegue al otro lado.
  tags:
  - escort-npc
  - traverse-the-board
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / The Caravan
    url: https://mordheimer.net/docs/campaigns/scenarios/archive-pestilen/the-caravan-archive-pestilen
  progression:
    experience:
    - ref: campaign.experience.award.survives
    - ref: campaign.experience.award.winning-leader
    - ref: campaign.experience.award.per-enemy-out-of-action
    - effect: A Hero or Henchman carrying the cargo at the end of the battle gains +1 Experience
      effect_i18n:
        es: >-
          Un Héroe o Secuaz que lleve la carga al final de la batalla gana +1 de Experiencia
      amount: 1
    wyrdstone: The merchant carries a small chest with D3+1 shards of wyrdstone. If a warband ends the
      game in possession of the cargo it keeps all of the wyrdstone. If the merchant successfully keeps
      the cargo, the guarding warband receives 1 shard plus D6 x 5 gold crowns for their trouble.
    wyrdstone_i18n:
      es: >-
        El mercader lleva un pequeño arcón con D3+1 fragmentos de Piedra bruja. Si una banda termina
        la partida en posesión del cargamento, conserva toda la Piedra bruja. Si el mercader logra
        conservar el cargamento, la banda que lo escolta recibe 1 fragmento más D6 x 5 coronas de oro
        por sus molestias.
    notes:
    - 'The editorial note of the page says the scenario proved very difficult for the defender in four
      games; they suggest toughening the merchant (T4, shield, lucky bastard) and that the defenders should
      not fail the fleeing test except voluntarily. Optional variants: Lucky Fool, Two''s a Crowd, Greedy
      Bastard and A Friend in the Business (20% discount/surcharge on equipment until the next battle).'
    notes_i18n:
      es: >-
        La nota editorial de la página dice que el escenario resultó muy difícil para el defensor en
        cuatro partidas; se sugiere endurecer al mercader (R4, escudo, tipo con suerte) y que los
        defensores no fallen el chequeo de huida salvo de forma voluntaria. Variantes opcionales:
        Tonto con Suerte, Dos Son Multitud, Avaro y Un Amigo en el Negocio (20% de descuento/recargo
        en el equipo hasta la siguiente batalla).
  name_i18n:
    es: La Caravana
