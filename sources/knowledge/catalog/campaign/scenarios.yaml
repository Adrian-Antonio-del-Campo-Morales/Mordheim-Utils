    url: https://mordheimer.net/docs/campaigns/scenarios/town-cryer/kidnapped
  progression:
    experience:
    - effect: If the game ends before the sacrificial victim is killed or escapes, the warband controlling the victim gains +1 Experience which can be given to any Hero in the warband

      effect_i18n:
        es: >-
          Si la partida termina antes de que la víctima sacrificial muera o escape, la banda que
          controle a la víctima gana +1 de Experiencia que puede darse a cualquier Héroe de la banda
      amount: 1
    - effect: If the Possessed manage to sacrifice the victim, the warband gains +D6 Experience to be
        freely distributed between its Heroes, and may optionally roll on the Rewards of the Shadowlord
        for any two Heroes
