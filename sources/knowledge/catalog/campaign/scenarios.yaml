  setting: Mordheim
  source: Town Cryer
  author: Kevin J Coleman
  player_mode: 1v1
  effect: >-
    Hidden Treasure except warbands look for the skull of the Headless One while its awesome
    original owner creates carnage.
  effect_i18n:
    es: >-
      Tesoro Oculto, salvo que las bandas buscan el cráneo del Decapitado mientras su imponente
      dueño original siembra la carnicería.
  tags:
  - treasure
  - hostile-npc
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / The Night Of The Headless One
    url: https://mordheimer.net/docs/campaigns/scenarios/town-cryer/the-night-of-the-headless-one
  progression:
    experience:
    - ref: campaign.experience.award.survives
    - ref: campaign.experience.award.winning-leader
    - ref: campaign.experience.award.per-enemy-out-of-action
    - effect: The model that carries the Headless One's Skull off the opposite table edge earns +2 Experience
      effect_i18n:
        es: >-
          La miniatura que lleve el Cráneo del Decapitado fuera por el borde de mesa contrario gana
          +2 de Experiencia
      amount: 2
    - effect: Any Hero earns +2 Experience for placing the Headless One Out of Action
      effect_i18n:
        es: >-
          Cualquier Héroe gana +2 de Experiencia por dejar al Decapitado Fuera de Combate
      amount: 2
    loot:
      effect: >-
        A warband that captures the Skull of the Headless One (by moving it off the table) may keep
        it and, in a campaign, attempt to summon the Headless One at the start of any subsequent
        game.
      effect_i18n:
        es: >-
          Una banda que capture el Cráneo del Decapitado (sacándolo de la mesa) puede conservarlo y,
          en campaña, intentar invocar al Decapitado al comienzo de cualquier partida posterior.
    notes:
    - The skull summoning roll (1 it is lost; 2-5 the Headless One does not appear; 6 it appears and increases
      the warband rating by +125 for the game) remains pending modelling together with the Headless One
      profile.
    notes_i18n:
      es: >-
        La tirada de invocación de la calavera (1 se pierde; 2-5 el Hombre sin Cabeza no aparece; 6
        aparece y aumenta la valoración de la banda en +125 durante la partida) queda pendiente de
        modelar junto con el perfil del Hombre sin Cabeza.
