  progression:
    experience:
    - effect: A fighter who survives the battle earns +1 Experience; even fighters who are wounded and taken Out of Action receive Experience for taking part

      effect_i18n:
        es: >-
          Un guerrero que sobreviva a la batalla gana +1 de Experiencia; incluso los guerreros
          heridos y dejados Fuera de Combate reciben Experiencia por participar
      amount: 1
    - effect: The leader of the winning side earns +2 Experience
      effect_i18n:
        es: >-
          El líder del bando ganador gana +2 de Experiencia
      amount: 2
    - effect: A fighter earns +1 Experience for each opposing fighter he takes down or Out of Action during the battle

