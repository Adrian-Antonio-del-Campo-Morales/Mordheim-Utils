- id: scenario.ambush-surrounded
  name: Ambush
  setting: Mordheim
  source: Archive Pestilen
  author: Michael Reuvers
  player_mode: 1v1
  effect: >-
    One warband is on the way back to their encampment with the wyrdstone they found in the ruins
    when suddenly they are surrounded.
  effect_i18n:
    es: >-
      Una banda vuelve a su campamento con la Piedra bruja que encontraron en las ruinas cuando de
      repente son rodeados.
  tags:
  - attacker-defender
  - wyrdstone-tokens
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / Ambush
    url: https://mordheimer.net/docs/campaigns/scenarios/archive-pestilen/ambush-2-archive-pestilen
  progression:
    experience:
    - ref: campaign.experience.award.survives
    - ref: campaign.experience.award.winning-leader
    - ref: campaign.experience.award.per-enemy-out-of-action
    - effect: Any Hero or Henchman group earns +1 Experience for breaking through enemy lines
      effect_i18n:
        es: >-
          Cualquier Héroe o grupo de Secuaces gana +1 de Experiencia por romper las líneas enemigas
      amount: 1
    wyrdstone: The defender starts the battle carrying D6 pieces of wyrdstone, but never more than the
      number of Heroes in the warband. The defending warband gains all the wyrdstone it was carrying at
      the beginning, minus the number of its own Heroes taken Out of Action during the game, down to a
      minimum of zero. The attacking warband gains one shard for each enemy Hero it takes Out of Action,
      up to the number of shards the opposing warband was carrying at the start.
    wyrdstone_i18n:
      es: >-
        El defensor empieza la batalla llevando D6 fragmentos de Piedra bruja, pero nunca más que el
        número de Héroes de la banda. La banda defensora gana toda la Piedra bruja que llevaba al
        principio, menos el número de sus propios Héroes que hayan quedado Fuera de Combate durante la
        partida, hasta un mínimo de cero. La banda atacante gana un fragmento por cada Héroe enemigo
        que deje Fuera de Combate, hasta el número de fragmentos que la banda contraria llevaba al
        inicio.
  name_i18n:
    es: Emboscada
