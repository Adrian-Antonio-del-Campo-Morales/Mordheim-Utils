        roll: 4D6
        reward: Suit of heavy armour
        item_id: heavy_armour
      - when: { min: 8, max: 8 }
        roll: 4D6
        reward: Elven Cloak
      - when: { min: 9, max: 9 }
        roll: 4D6
        reward: D3 shields and swords
