        es: >-
          Si los Endemoniados logran sacrificar a la víctima, la banda gana +1D6 de Experiencia para
          repartir libremente entre sus Héroes, y puede tirar opcionalmente en las Recompensas del
          Señor de la Sombra para dos Héroes cualesquiera
