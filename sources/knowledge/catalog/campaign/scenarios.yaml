- id: scenario.the-caravan
  name: The Caravan
  setting: Mordheim
  source: Town Cryer
  author: Honza Skypala & Stepan Stepanov
  player_mode: 1v1
  effect: Escort or rob a merchant's caravan train.
  effect_i18n:
    es: >-
      Escolta o roba una caravana de mercader.
  tags:
  - escort-npc
  - objective
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / The Caravan
    url: https://mordheimer.net/docs/campaigns/scenarios/town-cryer/the-caravan
  progression:
    experience:
    - ref: campaign.experience.award.survives
    - effect: Any Hero earns +1 Experience for each enemy (or wagon) he puts Out of Action
      effect_i18n:
        es: >-
          Cualquier Héroe gana +1 de Experiencia por cada enemigo (o carro) que deje Fuera de
          Combate
      amount: 1
    - effect: 'Winning leader: if at least two wagons escape the defender wins the game, otherwise the
        attacker wins; the bonus does not depend on routing'
      effect_i18n:
        es: >-
          Líder ganador: si al menos dos carros escapan, el defensor gana la partida; si no, gana el
          atacante; el bonus no depende de la huida
      amount: 1
    income: The defender receives 5D6 gold crowns as a starting payment plus 5D6 gold crowns for each
      wagon that escapes, with an additional bonus of 5D6 gold crowns if all three wagons escape. The
      attacker receives 3D6 gold crowns for each wagon he loots. A traitorous defender who attacks the
      caravan he was hired to protect receives 3D6 gold crowns per looted wagon instead.
    notes:
    - The traitor defender warband can never escort another caravan in the campaign and suffers -1 when
      searching for rare items over the next D6 games. Defenders can only be Mercenaries, Witch Hunters,
      Sisters of Sigmar or Bretonnians.
    notes_i18n:
      es: >-
        La banda defensora traidora nunca puede escoltar otra caravana en la campaña y sufre -1 al
        buscar objetos raros durante las siguientes D6 partidas. Los defensores solo pueden ser
        Mercenarios, Cazadores de Brujas, Hermanas de Sigmar o Bretonianos.
  name_i18n:
    es: La Caravana
- id: scenario.the-secrets-of-beujuntae
  name: The Secrets of Beujuntae
  setting: Lustria
  source: Town Cryer
  author: Stephanus Cornette
  player_mode: 1v1
  effect: Wyrdstone Hunt while a Daemon spirit flits around possessing random Heroes.
  effect_i18n:
    es: >-
      Caza de Piedra bruja mientras un espíritu demoníaco revolotea poseyendo Héroes al azar.
  tags:
  - wyrdstone-tokens
  - hostile-npc
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / The Secrets of Beujuntae
    url: https://mordheimer.net/docs/campaigns/scenarios/town-cryer/the-secrets-of-beujuntae
  progression:
    experience:
    - ref: campaign.experience.award.survives
    - effect: The Leader and Heroes of the winning warband each gain +1 Experience
      effect_i18n:
        es: >-
          El Líder y los Héroes de la banda ganadora ganan +1 de Experiencia cada uno
      amount: 1
    - effect: A Hero or Henchman carrying an artefact counter at the end of the battle receives +1 Experience
      effect_i18n:
        es: >-
          Un Héroe o Secuaz que lleve un contador de artefacto al final de la batalla recibe +1 de
          Experiencia
      amount: 1
    loot:
      effect: >-
        The winning player gets to open the tomb of a long-dead Slann Mage Priest and rolls on the
        items chart to see what he finds within.
      effect_i18n:
        es: >-
          El jugador ganador puede abrir la tumba de un Sacerdote Hechicero Slann fallecido hace
          mucho tiempo y tira en la tabla de objetos para ver qué encuentra dentro.
      contents:
      - reward: 2D6 gc
        reward_i18n:
          es: >-
            2D6 co
        roll: automatic
      - reward: Magic Sickle (raises WS of the bearer +1)
        reward_i18n:
          es: >-
            Hoz Mágica (eleva en +1 la HA del portador)
        roll: 6+
      - reward: D6 gems worth 10 gc each
        reward_i18n:
          es: >-
            D6 gemas por valor de 10 co cada una
        roll: 7+
      - reward: Ancient Bone Armour (confers a 4+ save and in all other respects acts like light armour)
        reward_i18n:
          es: >-
            Armadura de Hueso Antigua (otorga una salvación de 4+ y por lo demás funciona como una
            armadura ligera)
        roll: 8+
    notes:
    - 'The page reward table is badly formatted (''Roll 2D6'' heading with confusing columns); it is interpreted
      like other treasure tables of the site: automatic crowns and each item with its required roll. Verify
      against Town Cryer #12.'
    notes_i18n:
      es: >-
        La tabla de recompensas de la página está mal formateada (encabezado «Tira 2D6» con columnas
        confusas); se interpreta como las demás tablas de tesoro del sitio: coronas automáticas y cada
        objeto con su tirada requerida. Verificar contra Town Cryer #12.
  name_i18n:
    es: Los Secretos de Beujuntae
