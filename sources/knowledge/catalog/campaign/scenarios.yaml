      each mule they lead off the table. Both warbands may explore as normal
      at the end of the scenario.
    notes:
    - >-
      The page shows '(4 4 4 4 4 4)' next to the reference of the warband wiped
      out in exploration without clarifying its meaning; verify against Town
      Cryer #14.
