        es: >-
          La Varita de Phyrros permite a quien la empuñe usar el hechizo Fuegos de U'Zhul una vez
          por partida (automáticamente exitoso, sin necesidad de ser lanzador de hechizos, pero
          quien la empuñe debe ser un Héroe); puede venderse por 100 coronas.
