      discrepancy is left documented for verification against Town Cryer #9.
- id: scenario.the-script-of-sigmar
  name: The Script of Sigmar
  setting: Mordheim
  source: Town Cryer #9
  author: Paul Smith
  player_mode: 1v1
  summary: Witch Hunters vs Sisters of Sigmar. Two linked scenarios involving
    burgling the Sisters' Abbey.
  tags: [objective-building, objective]
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / The Script of Sigmar
    url: https://mordheimer.net/docs/campaigns/scenarios/town-cryer/the-script-of-sigmar
  progression:
    experience:
    - ref: campaign.experience.award.survives
    - ref: campaign.experience.award.per-enemy-out-of-action
    - summary: 'Mission 1: the Sisterhood warband leader earns +1 Experience if the alarm is raised'
      amount: 1
    - summary: 'Mission 1: each surviving Witch Hunter warband member who makes it to the door earns +1 Experience'
      amount: 1
    - summary: 'Mission 1: the Witch Hunter leader earns +1 Experience if they reached the door without the alarm being raised'
      amount: 1
    - summary: 'Mission 2: the winning warband leader earns +1 Experience (the warbands that reach the second mission use the surviving members of the first)'
      amount: 1
    notes:
