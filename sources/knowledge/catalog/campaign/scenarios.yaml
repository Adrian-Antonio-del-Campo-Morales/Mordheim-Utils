schema_version: 1
ruleset: mordheim
catalog: campaign-scenarios
status: published
pre_battle:
  id: campaign.pre-battle
  effect: >-
    The player with the lowest warband rating rolls on the scenario table to determine which
    scenario is played. In scenarios with an attacker and a defender, the same player may choose
    which he is. Roll for warriors with old battle wounds to see whether they can take part, then
    set up terrain and warbands according to the scenario.
  effect_i18n:
    es: >-
      El jugador con la valoración de banda más baja tira en la tabla de escenarios para determinar
      qué escenario se juega. En los escenarios con atacante y defensor, ese mismo jugador puede
      elegir cuál ser. Tira por los guerreros con viejas heridas de guerra para ver si pueden
      participar, y después despliega el terreno y las bandas según el escenario.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / Pre-battle Sequence
    url: https://mordheimer.net/docs/campaigns/scenarios
selection_tables:
- id: campaign.scenario-table.rulebook
  name: Mordheim Rulebook Scenario Table
  dice:
    count: 2
    sides: 6
  rows:
  - when:
      min: 2
      max: 2
    outcome: The player with the lower warband rating may choose which scenario is played
    outcome_i18n:
      es: El jugador con la valoración de banda inferior puede elegir el escenario que se juega
  - when:
      min: 3
      max: 3
    scenario: scenario.street-fight
  - when:
      min: 4
      max: 4
    scenario: scenario.hidden-treasure
  - when:
      min: 5
      max: 5
    scenario: scenario.wyrdstone-hunt
  - when:
      min: 6
      max: 6
    scenario: scenario.occupy
  - when:
      min: 7
      max: 7
    scenario: scenario.skirmish
  - when:
      min: 8
      max: 8
    scenario: scenario.breakthrough
  - when:
      min: 9
      max: 9
    scenario: scenario.surprise-attack
  - when:
      min: 10
      max: 10
    scenario: scenario.chance-encounter
  - when:
      min: 11
      max: 11
    scenario: scenario.defend-the-find
  - when:
      min: 12
      max: 12
    outcome: The player with the lower warband rating may choose which scenario is played
    outcome_i18n:
      es: El jugador con la valoración de banda inferior puede elegir el escenario que se juega
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / Mordheim rulebook scenario table
    url: https://mordheimer.net/docs/campaigns/scenarios
  name_i18n:
    es: Tabla de Escenarios del Manual de Mordheim
- id: campaign.scenario-table.chaos-on-the-streets
  name: Chaos on the Streets Scenarios
  dice:
    count: 2
    sides: 6
  note: Multiplayer scenarios introduced in Town Cryer
  note_i18n:
    es: Escenarios para varios jugadores introducidos en Town Cryer
  rows:
  - when:
      min: 2
      max: 2
    outcome: The player with the lowest warband rating may choose which scenario is played
    outcome_i18n:
      es: El jugador con la valoración de banda más baja puede elegir el escenario que se juega
  - when:
      min: 3
      max: 3
    scenario: scenario.monster-hunt
  - when:
      min: 4
      max: 4
    scenario: scenario.wizards-mansion
  - when:
      min: 5
      max: 6
    scenario: scenario.treasure-hunt
  - when:
      min: 7
      max: 7
    scenario: scenario.street-brawl
  - when:
      min: 8
      max: 9
    scenario: scenario.ambush
  - when:
      min: 10
      max: 10
    scenario: scenario.the-pool
  - when:
      min: 11
      max: 11
    scenario: scenario.the-lost-prince
  - when:
      min: 12
      max: 12
    outcome: The player with the lowest warband rating may choose which scenario is played
    outcome_i18n:
      es: El jugador con la valoración de banda más baja puede elegir el escenario que se juega
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / Chaos on the Streets Scenarios
    url: https://mordheimer.net/docs/campaigns/scenarios
  name_i18n:
    es: Escenarios de Caos en las Calles
scenarios:
- id: scenario.defend-the-find
  name: Defend the Find
  number: 1
  setting: Mordheim
  source: Mordheim Rulebook
  author: Tuomas Pirinen
  player_mode: 1v1
  effect: Defend a building from attackers.
  effect_i18n:
    es: >-
      Defiende un edificio de los atacantes.
  tags:
  - attacker-defender
  - objective-building
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / Defend the Find
    url: https://mordheimer.net/docs/campaigns/scenarios/mordheim-rulebook/defend-the-find
  progression:
    experience:
    - ref: campaign.experience.award.survives
    - ref: campaign.experience.award.winning-leader
    - ref: campaign.experience.award.per-enemy-out-of-action
    wyrdstone: One shard of wyrdstone for each Hero of either warband who is inside the objective building
      at the end of the game, up to a maximum of three shards per warband.
    wyrdstone_i18n:
      es: >-
        Un fragmento de Piedra bruja por cada Héroe de cualquiera de las bandas que esté dentro del
        edificio objetivo al final de la partida, hasta un máximo de tres fragmentos por banda.
  name_i18n:
    es: Defender el Botín
- id: scenario.skirmish
  name: Skirmish
  number: 2
  setting: Mordheim
  source: Mordheim Rulebook
  author: Tuomas Pirinen
  player_mode: 1v1
  effect: Brawl between rival warbands.
  effect_i18n:
    es: >-
      Pelea entre bandas rivales.
  tags:
  - brawl
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / Skirmish
    url: https://mordheimer.net/docs/campaigns/scenarios/mordheim-rulebook/skirmish
  progression:
    experience:
    - ref: campaign.experience.award.survives
    - ref: campaign.experience.award.winning-leader
    - ref: campaign.experience.award.per-enemy-out-of-action
  name_i18n:
    es: Escaramuza
- id: scenario.wyrdstone-hunt
  name: Wyrdstone Hunt
  number: 3
  setting: Mordheim
  source: Mordheim Rulebook
  author: Tuomas Pirinen
  player_mode: 1v1
  effect: Gain wealth by picking up wyrdstone.
  effect_i18n:
    es: >-
      Consigue riqueza recogiendo Piedra bruja.
  tags:
  - wyrdstone-tokens
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / Wyrdstone Hunt
    url: https://mordheimer.net/docs/campaigns/scenarios/mordheim-rulebook/wyrdstone-hunt
  progression:
    experience:
    - ref: campaign.experience.award.survives
    - ref: campaign.experience.award.winning-leader
    - effect: A Hero or Henchman carrying a Wyrdstone counter at the end of the battle receives +1 Experience
      effect_i18n:
        es: >-
          Un Héroe o Secuaz que lleve un contador de Piedra bruja al final de la batalla recibe +1 de
          Experiencia
      amount: 1
    - ref: campaign.experience.award.per-enemy-out-of-action
    wyrdstone: Warriors earn one shard of wyrdstone for each counter still in their possession at the
      end of the battle.
    wyrdstone_i18n:
      es: >-
        Los guerreros ganan un fragmento de Piedra bruja por cada ficha que aún posean al final de la
        batalla.
  name_i18n:
    es: A la Búsqueda de Piedra Bruja
- id: scenario.breakthrough
  name: Breakthrough
  number: 4
  setting: Mordheim
  source: Mordheim Rulebook
  author: Tuomas Pirinen
  player_mode: 1v1
  effect: The attacker needs to reach the other side of the board.
  effect_i18n:
    es: >-
      El atacante debe llegar al otro lado del tablero.
  tags:
  - attacker-defender
  - traverse-the-board
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / Breakthrough
    url: https://mordheimer.net/docs/campaigns/scenarios/mordheim-rulebook/breakthrough
  progression:
    experience:
    - ref: campaign.experience.award.survives
    - ref: campaign.experience.award.winning-leader
    - ref: campaign.experience.award.per-enemy-out-of-action
    - effect: Any warrior earns +1 Experience for breaking through enemy lines; if the warrior is a Henchman the whole group gains +1 Experience

      effect_i18n:
        es: >-
          Cualquier guerrero gana +1 de Experiencia por romper las líneas enemigas; si el guerrero
          es un Secuaz, todo el grupo gana +1 de Experiencia
      amount: 1
  name_i18n:
    es: ¡No Pasaréis!
- id: scenario.street-fight
  name: Street Fight
  number: 5
  setting: Mordheim
  source: Mordheim Rulebook
  author: Tuomas Pirinen
  player_mode: 1v1
  effect: Both warbands try to reach the other side of the street.
  effect_i18n:
    es: >-
      Ambas bandas intentan llegar al otro lado de la calle.
  tags:
  - traverse-the-board
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / Street Fight
    url: https://mordheimer.net/docs/campaigns/scenarios/mordheim-rulebook/street-fight
  progression:
    experience:
    - ref: campaign.experience.award.survives
    - ref: campaign.experience.award.winning-leader
    - ref: campaign.experience.award.per-enemy-out-of-action
    - effect: The first Hero from either side (not both) who exits via the opposing table edge gains +1 Experience

      effect_i18n:
        es: >-
          El primer Héroe de cualquier bando (no ambos) que salga por el borde de mesa contrario
          gana +1 de Experiencia
      amount: 1
  name_i18n:
    es: Pelea Callejera
- id: scenario.chance-encounter
  name: Chance Encounter
  number: 6
  setting: Mordheim
  source: Mordheim Rulebook
  author: Tuomas Pirinen
  player_mode: 1v1
  effect: Two warbands try to steal each other's wyrdstone.
  effect_i18n:
    es: >-
      Dos bandas intentan robarse la Piedra bruja mutuamente.
  tags:
  - wyrdstone-tokens
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / Chance Encounter
    url: https://mordheimer.net/docs/campaigns/scenarios/mordheim-rulebook/chance-encounter
  progression:
    experience:
    - ref: campaign.experience.award.survives
    - ref: campaign.experience.award.winning-leader
    - ref: campaign.experience.award.per-enemy-out-of-action
    wyrdstone: Each warband starts the battle carrying D3 shards of wyrdstone, recorded before the game.
      At the end, each warband gains all the wyrdstone it was carrying minus one shard per Hero of its
      own that was taken out of action during the game (down to a minimum of zero), plus one extra shard
      for each enemy Hero it took out of action, up to the maximum number of shards the opposing warband
      was carrying at the beginning of the battle.
    wyrdstone_i18n:
      es: >-
        Cada banda empieza la batalla llevando D3 fragmentos de Piedra bruja, anotados antes de la
        partida. Al final, cada banda gana toda la Piedra bruja que llevaba menos un fragmento por
        cada Héroe propio que haya quedado Fuera de Combate durante la partida (hasta un mínimo de
        cero), más un fragmento adicional por cada Héroe enemigo que haya dejado Fuera de Combate,
        hasta el máximo de fragmentos que la banda contraria llevaba al comenzar la batalla.
  name_i18n:
    es: Encuentro Casual
- id: scenario.hidden-treasure
  name: Hidden Treasure
  number: 7
  setting: Mordheim
  source: Mordheim Rulebook
  author: Tuomas Pirinen
  player_mode: 1v1
  effect: Search the buildings for a hidden treasure.
  effect_i18n:
    es: >-
      Busca en los edificios un tesoro oculto.
  tags:
  - treasure
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / Hidden Treasure
    url: https://mordheimer.net/docs/campaigns/scenarios/mordheim-rulebook/hidden-treasure
  progression:
    experience:
    - ref: campaign.experience.award.survives
    - ref: campaign.experience.award.winning-leader
    - ref: campaign.experience.award.per-enemy-out-of-action
    - effect: A Hero who finds the treasure chest earns +2 Experience
      effect_i18n:
        es: >-
          Un Héroe que encuentre el cofre del tesoro gana +2 de Experiencia
      amount: 2
    loot:
      effect: >-
        Whoever recovers the chest rolls on the contents chart after the game; each item is rolled
        for separately, apart from the gold crowns which are always found.
      effect_i18n:
        es: >-
          Quien recupere el cofre tira en la tabla de contenidos después de la partida; cada objeto
          se tira por separado, salvo las coronas de oro, que siempre se encuentran.
      contents:
      - reward: 3D6 gold crowns
        reward_i18n:
          es: >-
            3D6 coronas de oro
        roll: automatic
      - reward: D3 pieces of wyrdstone
        reward_i18n:
          es: >-
            D3 fragmentos de Piedra bruja
        roll: 5+
      - reward: Suit of light armour
        reward_i18n:
          es: >-
            Armadura ligera
        item_id: light_armour
        roll: 4+
      - reward: Sword
        reward_i18n:
          es: >-
            Espada
        item_id: sword
        roll: 3+
      - reward: D3 gems worth 10 gc each
        reward_i18n:
          es: >-
            D3 gemas por valor de 10 co cada una
        roll: 5+
  name_i18n:
    es: Tesoro Escondido
- id: scenario.occupy
  name: Occupy
  number: 8
  setting: Mordheim
  source: Mordheim Rulebook
  author: Tuomas Pirinen
  player_mode: 1v1
  effect: Both warbands try to capture as many buildings as they can.
  effect_i18n:
    es: >-
      Ambas bandas intentan capturar tantos edificios como puedan.
  tags:
  - objective-building
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / Occupy
    url: https://mordheimer.net/docs/campaigns/scenarios/mordheim-rulebook/occupy
  progression:
    experience:
    - ref: campaign.experience.award.survives
    - effect: The leader of the warband controlling the highest number of buildings at the end of the battle gains +1 Experience; if both warbands occupy the same number of buildings it is a draw and neither leader gains the bonus

      effect_i18n:
        es: >-
          El líder de la banda que controle más edificios al final de la batalla gana +1 de
          Experiencia; si ambas bandas ocupan el mismo número de edificios hay empate y ningún líder
          gana el bonus
      amount: 1
    - ref: campaign.experience.award.per-enemy-out-of-action
  name_i18n:
    es: Ocupar
- id: scenario.surprise-attack
  name: Surprise Attack
  number: 9
  setting: Mordheim
  source: Mordheim Rulebook
  author: Tuomas Pirinen
  player_mode: 1v1
  effect: The defender tries to fend off the attacker and starts with limited numbers.
  effect_i18n:
    es: >-
      El defensor intenta rechazar al atacante y comienza con un número limitado de tropas.
  tags:
  - attacker-defender
  - reserves
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / Surprise Attack
    url: https://mordheimer.net/docs/campaigns/scenarios/mordheim-rulebook/surprise-attack
  progression:
    experience:
    - ref: campaign.experience.award.survives
    - ref: campaign.experience.award.winning-leader
    - ref: campaign.experience.award.per-enemy-out-of-action
  name_i18n:
    es: Ataque Sorpresa
- id: scenario.treasure-hunt
  name: Treasure Hunt
  setting: Mordheim
  source: Town Cryer
  author: Mark Havener
  player_mode: multiplayer
  effect: Multiplayer. Similar to Wyrdstone Hunt.
  effect_i18n:
    es: >-
      Multijugador. Similar a Caza de Piedra bruja.
  tags:
  - chaos-on-the-streets
  - wyrdstone-tokens
  - treasure
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / Treasure Hunt
    url: https://mordheimer.net/docs/campaigns/scenarios/town-cryer/treasure-hunt-tc5
  progression:
    experience:
    - ref: campaign.experience.award.survives
    - ref: campaign.experience.award.winning-leader
    - effect: A Hero or Henchman carrying a Wyrdstone counter at the end of the battle receives +1 Experience
      effect_i18n:
        es: >-
          Un Héroe o Secuaz que lleve un contador de Piedra bruja al final de la batalla recibe +1 de
          Experiencia
      amount: 1
    - ref: campaign.experience.award.per-enemy-out-of-action
    wyrdstone: Warriors earn one shard of wyrdstone for each counter in their possession at the end of
      the battle.
    wyrdstone_i18n:
      es: >-
        Los guerreros ganan un fragmento de Piedra bruja por cada ficha que posean al final de la
        batalla.
  name_i18n:
    es: A la Búsqueda del Tesoro
- id: scenario.street-brawl
  name: Street Brawl
  setting: Mordheim
  source: Town Cryer
  author: Mark Havener
  player_mode: multiplayer
  effect: Multiplayer. Similar to Skirmish.
  effect_i18n:
    es: >-
      Multijugador. Similar a Escaramuza.
  tags:
  - chaos-on-the-streets
  - brawl
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / Street Brawl
    url: https://mordheimer.net/docs/campaigns/scenarios/town-cryer/street-brawl-tc5
  progression:
    experience:
    - ref: campaign.experience.award.survives
    - ref: campaign.experience.award.winning-leader
    - ref: campaign.experience.award.per-enemy-out-of-action
  name_i18n:
    es: Bronca Callejera
- id: scenario.the-lost-prince
  name: The Lost Prince
  setting: Mordheim
  source: Town Cryer
  author: Mark Havener
  player_mode: multiplayer
  effect: >-
    The warbands have heard rumours that a powerful man's son has wandered into the ruins and a
    handsome reward will be paid for his return.
  effect_i18n:
    es: >-
      Las bandas han oído rumores de que el hijo de un hombre poderoso se ha adentrado en las ruinas
      y se pagará una jugosa recompensa por su regreso.
  tags:
  - chaos-on-the-streets
  - escort-npc
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / The Lost Prince
    url: https://mordheimer.net/docs/campaigns/scenarios/town-cryer/lost-prince-tc5
  progression:
    experience:
    - ref: campaign.experience.award.survives
    - ref: campaign.experience.award.winning-leader
    - ref: campaign.experience.award.per-enemy-out-of-action
    loot:
      effect: >-
        The grateful father awards the winning warband with the following treasure; each item is
        rolled for separately apart from the gold crowns, which are always received. If the
        merchant's son is killed, no reward is issued to the winning warband.
      effect_i18n:
        es: >-
          El padre agradecido entrega a la banda ganadora el siguiente tesoro; cada objeto se tira
          por separado, salvo las coronas de oro, que siempre se reciben. Si el hijo del mercader
          muere, no se entrega recompensa alguna a la banda ganadora.
      contents:
      - reward: 5D6 gold crowns
        reward_i18n:
          es: >-
            5D6 coronas de oro
        roll: automatic
      - reward: D3 swords
        reward_i18n:
          es: >-
            D3 espadas
        item_id: sword
        roll: 4+
      - reward: Suit of heavy armour
        reward_i18n:
          es: >-
            Armadura pesada
        item_id: heavy_armour
        roll: 5+
      - reward: Suit of light armour
        reward_i18n:
          es: >-
            Armadura ligera
        item_id: light_armour
        roll: 4+
      - reward: Shield
        reward_i18n:
          es: >-
            Escudo
        roll: 4+
      - reward: Helmet
        reward_i18n:
          es: >-
            Yelmo
        roll: 4+
      - reward: D3 gems worth 10 gc each
        reward_i18n:
          es: >-
            D3 gemas por valor de 10 co cada una
        roll: 5+
  name_i18n:
    es: El Príncipe Perdido
- id: scenario.wizards-mansion
  name: The Wizard's Mansion
  setting: Mordheim
  source: Town Cryer
  author: Mark Havener
  player_mode: multiplayer
  effect: Multiplayer. Similar to Skirmish with items at stake.
  effect_i18n:
    es: >-
      Multijugador. Similar a Escaramuza con objetos en juego.
  tags:
  - chaos-on-the-streets
  - treasure
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / The Wizard's Mansion
    url: https://mordheimer.net/docs/campaigns/scenarios/town-cryer/wizards-mansion-tc5
  progression:
    experience:
    - ref: campaign.experience.award.survives
    - ref: campaign.experience.award.winning-leader
    - ref: campaign.experience.award.per-enemy-out-of-action
    loot:
      effect: >-
        At the end of the game the winning warband finds all of the items of the defender's
        pre-battle chart that were not found before the battle, plus the mansion chart below; each
        item is rolled for separately apart from the gold crowns, which are always found.
      effect_i18n:
        es: >-
          Al final de la partida, la banda ganadora encuentra todos los objetos de la tabla previa a
          la batalla del defensor que no se encontraran antes de la batalla, más la tabla de la
          mansión de abajo; cada objeto se tira por separado, salvo las coronas de oro, que siempre
          se encuentran.
      contents:
      - reward: 5D6 gold crowns
        reward_i18n:
          es: >-
            5D6 coronas de oro
        roll: automatic
      - reward: D3 gems worth 10 gc each
        reward_i18n:
          es: >-
            D3 gemas por valor de 10 co cada una
        roll: 5+
      - reward: Tome of magic
        reward_i18n:
          es: >-
            Tomo de magia
        roll: 4+
      - reward: Gromril sword
        reward_i18n:
          es: >-
            Espada de Gromril
        roll: 5+
      - reward: Athame
        reward_i18n:
          es: >-
            Athame
        roll: 4+
      - reward: D3 doses of healing herbs
        reward_i18n:
          es: >-
            D3 dosis de Hierbas Curativas
        roll: 4+
      - reward: Dispel scroll
        reward_i18n:
          es: >-
            Pergamino de disipación
        roll: 5+
    notes:
    - 'The defender receives, in addition, one roll on the initial equipment table per additional attacking
      warband (Wooden Man, Mandrake Root, Crimson Shade, Lucky Charm, Holy/Unholy Relic or Cathayan Silk
      Cloak); each item may be found only once. Verify the special rules of those items in Town Cryer
      #5 before modelling them.'
    notes_i18n:
      es: >-
        El defensor recibe, además, una tirada en la tabla de equipo inicial por cada banda atacante
        adicional (Hombre de Madera, Raíz de Mandrágora, Sombra Carmesí, Amuleto de la Suerte,
        Reliquia Santa/Impía o Capa de Seda de Cathay); cada objeto solo puede encontrarse una vez.
        Verificar las reglas especiales de esos objetos en Town Cryer #5 antes de modelarlos.
  name_i18n:
    es: La Mansión del Hechicero
- id: scenario.the-pool
  name: The Pool
  setting: Mordheim
  source: Town Cryer
  author: Mark Havener
  player_mode: multiplayer
  effect: Multiplayer. Root around for wyrdstone in a pool in the centre of the table.
  effect_i18n:
    es: >-
      Multijugador. Busca Piedra bruja en una charca en el centro de la mesa.
  tags:
  - chaos-on-the-streets
  - wyrdstone-tokens
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / The Pool
    url: https://mordheimer.net/docs/campaigns/scenarios/town-cryer/pool-tc5
  progression:
    experience:
    - ref: campaign.experience.award.survives
    - ref: campaign.experience.award.winning-leader
    - effect: A Hero or Henchman carrying a Wyrdstone counter at the end of the battle receives +1 Experience
      effect_i18n:
        es: >-
          Un Héroe o Secuaz que lleve un contador de Piedra bruja al final de la batalla recibe +1 de
          Experiencia
      amount: 1
    - ref: campaign.experience.award.per-enemy-out-of-action
    wyrdstone: The pool contains D3+3 pieces of wyrdstone; a Hero spending a whole turn within 1" of the
      pool doing nothing else finds one piece on a D6 roll of 1-2 at the end of his turn (no Hero may
      search within 1" of another model). Only as many pieces may be found as were rolled at the start
      of the game.
    wyrdstone_i18n:
      es: >-
        El estanque contiene D3+3 fragmentos de Piedra bruja; un Héroe que pase un turno entero a 1"
        del estanque sin hacer otra cosa encuentra un fragmento con un resultado de 1-2 en un D6 al
        final de su turno (ningún Héroe puede buscar a 1" de otra miniatura). Solo se pueden encontrar
        tantos fragmentos como se hayan tirado al comenzar la partida.
    notes:
    - 'The page does not repeat the final conversion of counters into shards (one shard per counter held
      at the end); the same convention as Treasure Hunt, which does declare it, is assumed. Verify against
      the Town Cryer #5 print.'
    notes_i18n:
      es: >-
        La página no repite la conversión final de fichas en fragmentos (un fragmento por ficha
        conservada al final); se asume la misma convención que A la Búsqueda del Tesoro, que sí la
        declara. Verificar contra la impresión de Town Cryer #5.
  name_i18n:
    es: El Estanque
