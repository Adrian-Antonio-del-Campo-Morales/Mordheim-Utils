- id: scenario.the-caravan
  name: The Caravan
  setting: Mordheim
  source: Town Cryer #11
  author: Honza Skypala & Stepan Stepanov
  player_mode: 1v1
  summary: Escort or rob a merchant's caravan train.
  tags: [escort-npc, objective]
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / The Caravan
    url: https://mordheimer.net/docs/campaigns/scenarios/town-cryer/the-caravan
  progression:
    experience:
    - ref: campaign.experience.award.survives
    - summary: Any Hero earns +1 Experience for each enemy (or wagon) he puts Out of Action
      amount: 1
    - summary: 'Winning leader: if at least two wagons escape the defender wins the game, otherwise the attacker wins; the bonus does not depend on routing'
      amount: 1
    income: >-
      The defender receives 5D6 gold crowns as a starting payment plus 5D6 gold
      crowns for each wagon that escapes, with an additional bonus of 5D6 gold
      crowns if all three wagons escape. The attacker receives 3D6 gold crowns
      for each wagon he loots. A traitorous defender who attacks the caravan he
      was hired to protect receives 3D6 gold crowns per looted wagon instead.
    notes:
    - >-
      The traitor defender warband can never escort another caravan in the
      campaign and suffers -1 when searching for rare items over the next D6
      games. Defenders can only be Mercenaries, Witch Hunters, Sisters of
      Sigmar or Bretonnians.
- id: scenario.the-secrets-of-beujuntae
  name: The Secrets of Beujuntae
  setting: Lustria
  source: Town Cryer #12
  author: Stephanus Cornette
  player_mode: 1v1
  summary: Wyrdstone Hunt while a Daemon spirit flits around possessing random Heroes.
  tags: [wyrdstone-tokens, hostile-npc]
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / The Secrets of Beujuntae
    url: https://mordheimer.net/docs/campaigns/scenarios/town-cryer/the-secrets-of-beujuntae
  progression:
    experience:
    - ref: campaign.experience.award.survives
    - summary: The Leader and Heroes of the winning warband each gain +1 Experience
      amount: 1
    - summary: A Hero or Henchman carrying an artefact counter at the end of the battle receives +1 Experience
      amount: 1
    loot:
      summary: The winning player gets to open the tomb of a long-dead Slann Mage Priest and rolls on the items chart to see what he finds within.
      contents:
      - reward: 2D6 gc
        roll: automatic
      - reward: Magic Sickle (raises WS of the bearer +1)
        roll: 6+
      - reward: D6 gems worth 10 gc each
        roll: 7+
      - reward: Ancient Bone Armour (confers a 4+ save and in all other respects acts like light armour)
        roll: 8+
    notes:
    - >-
      The page reward table is badly formatted ('Roll 2D6' heading with
      confusing columns); it is interpreted like other treasure tables of the
      site: automatic crowns and each item with its required roll. Verify
      against Town Cryer #12.
