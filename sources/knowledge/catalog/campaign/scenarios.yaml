- id: scenario.gift-of-the-truthsayers
  name: Gift of the Truthsayers
  setting: Albion
  source: Town Cryer
  author: Nicodemus Kyme
  player_mode: 1v1
  effect: Scrap over a magic item with random boggy happenings.
  effect_i18n:
    es: >-
      Pelea por un objeto mágico con sucesos pantanosos aleatorios.
  tags:
  - treasure
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / Gift of the Truthsayers
    url: https://mordheimer.net/docs/campaigns/scenarios/town-cryer/gift-of-the-truthsayers
  progression:
    experience:
    - ref: campaign.experience.award.survives
    - ref: campaign.experience.award.winning-leader
    - ref: campaign.experience.award.per-enemy-out-of-action
    - effect: If a Hero is carrying the artefact at the end of the game he earns +2 Experience
      effect_i18n:
        es: >-
          Si un Héroe lleva el artefacto al final de la partida, gana +2 de Experiencia
      amount: 2
    loot:
      effect: >-
        The warband in possession of the artefact at the end of the game may examine it to discover
        its worth; roll 2D6.
      effect_i18n:
        es: >-
          La banda que posea el artefacto al final de la partida puede examinarlo para descubrir su
          valor; tira 2D6.
      contents:
      - when:
          min: 1
          max: 4
        roll: 2D6
        reward: The artefact is valuable and worth 5D6 gold coins
        reward_i18n:
          es: >-
            El artefacto es valioso y vale 5D6 monedas de oro
      - when:
          min: 5
          max: 6
        roll: 2D6
        reward: Enchanted Totem of Light (bearer immune to psychology and all alone tests; +1 Leadership
          if given to the warband's leader)
        reward_i18n:
          es: >-
            Tótem Encantado de Luz (el portador es inmune a la psicología y a las pruebas en
            solitario; +1 de Liderazgo si se entrega al líder de la banda)
      - when:
          min: 7
          max: 8
        roll: 2D6
        reward: Silver Sickle (acts like a normal sword, +1 Weapon Skill, +1 Strength vs Daemons, Possessed
          and Undead)
        reward_i18n:
          es: >-
            Hoz de Plata (funciona como una espada normal, +1 de Habilidad de Armas, +1 de Fuerza
            contra Demonios, Poseídos y No Muertos)
      - when:
          min: 9
          max: 9
        roll: 2D6
        reward: Talisman of Light (nullifies any harmful spell cast at the wearer on a 4+)
        reward_i18n:
          es: >-
            Talismán de Luz (anula cualquier hechizo dañino lanzado contra el portador con un 4+)
      - when:
          min: 10
          max: 11
        roll: 2D6
        reward: Tome of the Truthsayers (cast a single randomly determined Lore of Light spell once per
          battle without difficulty roll)
        reward_i18n:
          es: >-
            Tomo de los Decidores de la Verdad (lanza un único hechizo de la Senda de la Luz
            determinado al azar una vez por batalla sin tirada de dificultad)
      - when:
          min: 12
          max: 12
        roll: 2D6
        reward: Vambrace of Silver (any ranged weapon that hits the wearer is deflected harmlessly on
          a 5+)
        reward_i18n:
          es: >-
            Brazalete de Plata (cualquier arma a distancia que alcance al portador se desvía sin
            causar daño con un 5+)
  name_i18n:
    es: Don de los Decidores de Verdades
