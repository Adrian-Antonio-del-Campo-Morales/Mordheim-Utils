      splinters or the Sword of the Herald.
    wyrdstone_i18n:
      es: >-
        Cada esquirla de Piedra Estelar vale 3 de Piedra bruja adicionales en la secuencia posterior a
        la batalla cuando se retira de la mesa. Ten en cuenta que no se gana experiencia adicional por
        retirar las esquirlas de Piedra Estelar ni la Espada del Heraldo.
    notes:
    - Players who choose that the game 'does not count' gain no experience, do not roll serious injuries
      and do not search for wyrdstone in the post-battle sequence, but they can still gain the awards
      for drawing the sword and the shards. The sword value is left to the referee's discretion.
    notes_i18n:
      es: >-
