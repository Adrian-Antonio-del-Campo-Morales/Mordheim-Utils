- id: scenario.lost-temple-of-the-slann
  name: Lost Temple of the Slann
  setting: Lustria
  source: Town Cryer
  author: Lustria Development Team
  player_mode: multiplayer
  effect: Similar to Wizard's Mansion.
  effect_i18n:
    es: >-
      Similar a la Mansión del Hechicero.
  tags:
  - treasure
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / Lost Temple Of The Slann
    url: https://mordheimer.net/docs/campaigns/scenarios/town-cryer/lost-temple-of-the-slann
  progression:
    experience:
    - ref: campaign.experience.award.survives
    - ref: campaign.experience.award.winning-leader
    - ref: campaign.experience.award.per-enemy-out-of-action
    loot:
      effect: >-
        At the end of the game the winning warband finds all of the items of the defender's booty
        table that were not found before the battle, plus it rolls once on the relics chart for each
        Hero it has that is not Out of Action (maximum 6 rolls). Each item is rolled for separately
        apart from the gold crowns, which are always found.
      effect_i18n:
        es: >-
          Al final de la partida, la banda ganadora encuentra todos los objetos de la tabla de botín
          del defensor que no se encontraran antes de la batalla, y además tira una vez en la tabla
          de reliquias por cada Héroe que tenga que no esté Fuera de Combate (máximo 6 tiradas).
          Cada objeto se tira por separado, salvo las coronas de oro, que siempre se encuentran.
      contents:
      - reward: 3D6 gc
        reward_i18n:
          es: >-
            3D6 co
        roll: automatic
      - reward: D3 gems worth 10 gc each
        reward_i18n:
          es: >-
            D3 gemas por valor de 10 co cada una
        roll: 5+
      - reward: Tome of Magic
        reward_i18n:
          es: >-
            Tomo de Magia
        roll: 4+
      - reward: Gromril Sword
        reward_i18n:
          es: >-
            Espada de Gromril
        roll: 5+
      - reward: Cloak of Mists
        reward_i18n:
          es: >-
            Capa de Nieblas
        roll: 5+
      - reward: Healing Herbs (D3 doses)
        reward_i18n:
          es: >-
            Hierbas Curativas (D3 dosis)
        roll: 4+
      - reward: Dispel Scroll
        reward_i18n:
          es: >-
            Pergamino de Disipación
        roll: 5+
    notes:
    - The defender receives, in addition, one roll on the loot table per additional attacking warband
      (1 Temple Stone Guard; 2 1D3 doses of Dark Venom; 3 1D3 doses of Crimson Shade; 4 Holy/Unholy Relic;
      5 Lucky Charm; 6 Heavy Armour); each item may only be found once. The magic items (Cloak of Mists,
      Dispel Scroll, Gromril Sword, Tome of Magic) have no entry in the canonical Trading Post.
    notes_i18n:
      es: >-
        El defensor recibe, además, una tirada en la tabla de botín por cada banda atacante adicional
        (1 Guardia de Piedra del Templo; 2 1D3 dosis de Veneno Oscuro; 3 1D3 dosis de Sombra Carmesí;
        4 Reliquia Santa/Impía; 5 Amuleto de la Suerte; 6 Armadura Pesada); cada objeto solo puede
        encontrarse una vez. Los objetos mágicos (Capa de Nieblas, Pergamino de Disipación, Espada de
        Gromril, Tomo de Magia) no tienen entrada en el Mercado canónico.
  name_i18n:
    es: Templo Perdido de los Slann
- id: scenario.the-sword-of-the-herald
