      amount: 1
    wyrdstone: D6+2 Wyrdstone counters are placed before deployment. Warriors pick them up by moving into
      contact; when a warrior is knocked down, stunned or taken Out of Action he drops all counters he
      is carrying. Each side carries its counters off through the gate (or offers them to the totem for
