- id: scenario.the-square-of-the-snake
  name: The Square of the Snake
  setting: Mordheim
  source: Archive Pestilen
  author: Christian Ellegaard
  player_mode: multiplayer
  effect: Four player scenario. Each player must take out his randomly specified enemy.
  effect_i18n:
    es: >-
      Escenario para cuatro jugadores. Cada jugador debe dejar Fuera de Combate al enemigo que le
      haya sido asignado al azar.
  tags:
  - objective
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / The Square Of The Snake
    url: https://mordheimer.net/docs/campaigns/scenarios/archive-pestilen/the-square-of-the-snake
  progression:
    experience:
    - effect: The warrior who reaches the tombstone at the end of the battle (after eliminating his chosen enemy warband) is awarded 5 free Experience points

      effect_i18n:
        es: >-
          El guerrero que llegue a la lápida al final de la batalla (tras eliminar a su banda
          enemiga asignada) recibe 5 puntos de Experiencia gratis
      amount: 5
    notes:
    - 'Multiplayer scenario by victory points, not standard experience: 10 points for the first warband
      that reaches the platform and receives a random opponent, 1 for putting any warrior out of action,
      2 for the chosen enemy warrior, and 10 for returning to the platform after eliminating the chosen
      enemy. There are no gc or wyrdstone rewards on the page.'
    notes_i18n:
      es: >-
        Escenario multijugador por puntos de victoria, no experiencia estándar: 10 puntos para la
        primera banda que alcance la plataforma y reciba un oponente aleatorio, 1 por dejar Fuera de
        Combate a cualquier guerrero, 2 por el guerrero enemigo elegido y 10 por volver a la
        plataforma tras eliminar al enemigo elegido. La página no incluye recompensas en co ni en
        Piedra bruja.
  name_i18n:
    es: La Plaza de la Serpiente
- id: scenario.the-wizards-tower
  name: The Wizard's Tower
  setting: Mordheim
  source: Archive Pestilen
  author: Christian Ellegaard
  player_mode: 1v1
  effect: >-
    Your warband is peacefully making their way through the city to a wyrdstone deposit when they
    are set upon by a rival warband. They have no choice but to fight their way through them to get
    to the wyrdstone.
  effect_i18n:
    es: >-
      Tu banda avanza tranquilamente por la ciudad hacia un yacimiento de Piedra bruja cuando es
      asaltada por una banda rival. No le queda más remedio que abrirse camino a través de ella para
      llegar a la Piedra bruja.
  tags:
  - wyrdstone-tokens
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / The Wizard's Tower
    url: https://mordheimer.net/docs/campaigns/scenarios/archive-pestilen/the-wizards-tower
  progression:
    experience:
    - ref: campaign.experience.award.survives
    - ref: campaign.experience.award.winning-leader
    - ref: campaign.experience.award.per-enemy-out-of-action
    loot:
      effect: >-
        The Heroes carry chests out of the Wizard's Tower (a D6 per appearing Hero: on a 6 he brings
        a chest; if no Hero brings one, a random Hero is given one, so there is always at least one
        chest). In the post-battle sequence, roll D6 for each chest removed from the table. After
        this battle no Exploration rolls are made: no one dares search the cursed ruins of the
        tower.
      effect_i18n:
        es: >-
          Los Héroes sacan cofres de la Torre del Hechicero (1D6 por Héroe que aparezca: con un 6
          trae un cofre; si ningún Héroe trae uno, se le da uno a un Héroe al azar, de modo que
          siempre hay al menos un cofre). En la secuencia posterior a la batalla, tira 1D6 por cada
          cofre retirado de la mesa. Tras esta batalla no se hacen tiradas de Exploración: nadie se
          atreve a registrar las ruinas malditas de la torre.
      contents:
      - when:
          min: 1
          max: 2
        roll: D6
        reward: 'Illusions: the treasures were simple illusions and vanish before the warband returns
          to camp.'
        reward_i18n:
          es: >-
            Ilusiones: los tesoros eran simples ilusiones y se desvanecen antes de que la banda
            regrese al campamento.
      - when:
          min: 3
          max: 5
        roll: D6
        reward: 'Valuables: roll 3D6, the result being the gc the items are traded for.'
        reward_i18n:
          es: >-
            Objetos de valor: tira 3D6, y el resultado son las co por las que se cambian los objetos.
      - when:
          min: 6
          max: 6
        roll: D6
        reward: 'Gold, Gold, GOLD: roll 6D6 and add the result to the Treasury.'
        reward_i18n:
          es: >-
            ¡Oro, Oro, ORO!: tira 6D6 y añade el resultado a la Tesorería.
  name_i18n:
    es: La Torre del Mago
- id: scenario.mordheims-burning
  name: Mordheim's Burning
  setting: Mordheim
  source: Rynn Tyrr
  author: Rowan Coupland
  player_mode: 1v1
  effect: >-
    This scenario is set at the end of Mordheim's existence, and provides a very fitting ending to a
    campaign.
  effect_i18n:
    es: >-
      Este escenario se desarrolla al final de la existencia de Mordheim, y ofrece un cierre muy
      apropiado para una campaña.
  tags:
  - hazards
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / Mordheim's Burning
    url: https://mordheimer.net/docs/campaigns/scenarios/other/mordheims-burning
  progression:
    experience:
    - effect: If a Hero or Henchman group survives the battle they gain +5 Experience
      effect_i18n:
        es: >-
          Si un Héroe o grupo de Secuaces sobrevive a la batalla, gana +5 de Experiencia
      amount: 5
    - effect: The leader of the winning warband gains +5 Experience
      effect_i18n:
        es: >-
          El líder de la banda ganadora gana +5 de Experiencia
      amount: 5
    - ref: campaign.experience.award.per-enemy-out-of-action
    wyrdstone: The winning warband is the only warband that may search for wyrdstone after the battle
      (it does not roll the extra exploration D6). Due to the increased demand after the city's destruction,
      wyrdstone sells for triple the normal gold crowns.
    wyrdstone_i18n:
      es: >-
        La banda ganadora es la única banda que puede buscar Piedra bruja después de la batalla (no
        tira el D6 adicional de exploración). Debido a la mayor demanda tras la destrucción de la
        ciudad, la Piedra bruja se vende por el triple de coronas de oro de lo normal.
    notes:
    - 'Multiplayer end-of-campaign scenario (at least three warbands with rating 300+). Special injury
      table: anyone out of action rolls on the own table (1-5 death, 6 the warrior escapes unhurt and
      gains +1 Experience). No voluntary fleeing: fleeing tests only start at 50% casualties, with unmodified
      Ld 10 while the leader lives. Random events occur automatically every turn.'
    notes_i18n:
      es: >-
        Escenario multijugador de final de campaña (al menos tres bandas con valoración 300+). Tabla
        de heridas especial: cualquiera Fuera de Combate tira en su propia tabla (1-5 muerte, 6 el
        guerrero escapa ileso y gana +1 de Experiencia). Sin huida voluntaria: los chequeos de huida
        solo comienzan al 50% de bajas, con Ld 10 sin modificar mientras viva el líder. Los eventos
        aleatorios ocurren automáticamente cada turno.
  name_i18n:
    es: Mordheim Arde
