        roll: 4D6
        reward: Beer worth 2D6 gc per crate; on a D6 roll of 6 there is one dose of Bugman's Ale
      - when: { min: 12, max: 16 }
        roll: 4D6
        reward: Food worth D6 gc per crate, including one clove of Garlic per warband member; on a D6 roll of 6 also one dose of Dark Venom (1-2), Black Lotus (3-4) or Crimson Shade (5-6)
      - when: { min: 17, max: 18 }
        roll: 4D6
        reward: Clothing worth 2D6 gc per crate, including D3 sets of toughened leathers
      - when: { min: 19, max: 19 }
        roll: 4D6
        reward: Luxury goods worth 4D6 gc per crate; hidden inside is a Wyrdstone pendulum (1-3) or a set of Cathayan Silks (4-6)
      - when: { min: 20, max: 20 }
        roll: 4D6
        reward: Blackpowder worth 5D6 per crate, containing one pack of Superior Blackpowder
      - when: { min: 21, max: 21 }
        roll: 4D6
        reward: D3 Crossbows each with Hunting Bolts (same as Hunting Arrows) for one game
      - when: { min: 22, max: 22 }
        roll: 4D6
        reward: D3 Elven bows
      - when: { min: 23, max: 23 }
        roll: 4D6
        reward: Hunting Rifle
      - when: { min: 24, max: 24 }
        roll: 4D6
        reward: Suit of Gromril armour
