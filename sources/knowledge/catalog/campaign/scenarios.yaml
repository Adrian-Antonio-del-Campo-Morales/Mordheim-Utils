    - effect: If the rescuers move the victim off the table, the warband gains +D6 Experience freely
        distributed among its Heroes
      effect_i18n:
        es: >-
          Si los rescatadores sacan a la víctima de la mesa, la banda gana +1D6 de Experiencia
          repartida libremente entre sus Héroes
      amount_dice: D6
    - ref: campaign.experience.award.survives
    - ref: campaign.experience.award.winning-leader
    - ref: campaign.experience.award.per-enemy-out-of-action
    income: If the sacrificial victim escapes, the rescuing warband gains a reward of 50 gold crowns added
      directly to its treasury.
