    loot:
      summary: The warband that does not rout is the winner and may roll on the nest contents chart if all three Harpies were taken out of action first; otherwise no one receives the rewards. Each item is
        rolled for separately.
      contents:
      - roll: 5+
        reward: 2D6 gc.
      - roll: 3+
        reward: Jeweled Dagger.
      - roll: 5+
        reward: Heavy Armour.
        item_id: heavy_armour
      - roll: 6+
        reward: Ithilmar Sword.
      - roll: 3+
        reward: Gems worth 30 gc.
      - roll: 6+
        reward: Wolfcloak.
