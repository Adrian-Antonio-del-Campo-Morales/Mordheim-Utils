schema_version: 1
ruleset: mordheim
catalog: campaign-scenarios
status: published
# Scenario catalogue: identity, selection and victory conditions.
# The development of a concrete scenario (terrain, deployment, special rules)
# is scenario rule; its result in a concrete campaign is external state.
pre_battle:
  id: campaign.pre-battle
  summary: The player with the lowest warband rating rolls on the scenario
    table to determine which scenario is played. In scenarios with an attacker
    and a defender, the same player may choose which he is. Roll for warriors
    with old battle wounds to see whether they can take part, then set up
    terrain and warbands according to the scenario.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / Pre-battle Sequence
    url: https://mordheimer.net/docs/campaigns/scenarios
selection_tables:
- id: campaign.scenario-table.rulebook
  name: Mordheim rulebook scenario table
  dice: { count: 2, sides: 6 }
  rows:
  - when: { min: 2, max: 2 }
    outcome: The player with the lower warband rating may choose which scenario is played
  - when: { min: 3, max: 3 }
    scenario: scenario.street-fight
  - when: { min: 4, max: 4 }
    scenario: scenario.hidden-treasure
  - when: { min: 5, max: 5 }
    scenario: scenario.wyrdstone-hunt
  - when: { min: 6, max: 6 }
    scenario: scenario.occupy
  - when: { min: 7, max: 7 }
    scenario: scenario.skirmish
  - when: { min: 8, max: 8 }
    scenario: scenario.breakthrough
  - when: { min: 9, max: 9 }
    scenario: scenario.surprise-attack
  - when: { min: 10, max: 10 }
    scenario: scenario.chance-encounter
  - when: { min: 11, max: 11 }
    scenario: scenario.defend-the-find
  - when: { min: 12, max: 12 }
    outcome: The player with the lower warband rating may choose which scenario is played
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / Mordheim rulebook scenario table
    url: https://mordheimer.net/docs/campaigns/scenarios
- id: campaign.scenario-table.chaos-on-the-streets
  name: Chaos on the Streets Scenarios
  dice: { count: 2, sides: 6 }
  note: Multiplayer scenarios introduced in Town Cryer #5.
  rows:
  - when: { min: 2, max: 2 }
    outcome: The player with the lowest warband rating may choose which scenario is played
  - when: { min: 3, max: 3 }
    scenario: scenario.monster-hunt
  - when: { min: 4, max: 4 }
    scenario: scenario.wizards-mansion
  - when: { min: 5, max: 6 }
    scenario: scenario.treasure-hunt
  - when: { min: 7, max: 7 }
    scenario: scenario.street-brawl
  - when: { min: 8, max: 9 }
    scenario: scenario.ambush
  - when: { min: 10, max: 10 }
    scenario: scenario.the-pool
  - when: { min: 11, max: 11 }
    scenario: scenario.the-lost-prince
  - when: { min: 12, max: 12 }
    outcome: The player with the lowest warband rating may choose which scenario is played
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / Chaos on the Streets Scenarios
    url: https://mordheimer.net/docs/campaigns/scenarios
scenarios:
# Mordheim Rulebook (core)
- id: scenario.defend-the-find
  name: Defend the Find
  number: 1
  setting: Mordheim
  source: Mordheim Rulebook
  author: Tuomas Pirinen
  player_mode: 1v1
  summary: Defend a building from attackers.
  tags: [attacker-defender, objective-building]
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / Defend the Find
    url: https://mordheimer.net/docs/campaigns/scenarios/mordheim-rulebook/defend-the-find
  progression:
    experience:
    - ref: campaign.experience.award.survives
    - ref: campaign.experience.award.winning-leader
    - ref: campaign.experience.award.per-enemy-out-of-action
    wyrdstone: One shard of wyrdstone for each Hero of either warband who is inside the objective building at the end of the game, up to a maximum of three shards per warband.
- id: scenario.skirmish
  name: Skirmish
  number: 2
  setting: Mordheim
  source: Mordheim Rulebook
  author: Tuomas Pirinen
  player_mode: 1v1
  summary: Brawl between rival warbands.
  tags: [brawl]
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / Skirmish
    url: https://mordheimer.net/docs/campaigns/scenarios/mordheim-rulebook/skirmish
  progression:
    experience:
    - ref: campaign.experience.award.survives
    - ref: campaign.experience.award.winning-leader
    - ref: campaign.experience.award.per-enemy-out-of-action
- id: scenario.wyrdstone-hunt
  name: Wyrdstone Hunt
  number: 3
  setting: Mordheim
  source: Mordheim Rulebook
  author: Tuomas Pirinen
  player_mode: 1v1
  summary: Gain wealth by picking up wyrdstone.
  tags: [wyrdstone-tokens]
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / Wyrdstone Hunt
    url: https://mordheimer.net/docs/campaigns/scenarios/mordheim-rulebook/wyrdstone-hunt
  progression:
    experience:
    - ref: campaign.experience.award.survives
    - ref: campaign.experience.award.winning-leader
    - summary: A Hero or Henchman carrying a Wyrdstone counter at the end of the battle receives +1 Experience
      amount: 1
    - ref: campaign.experience.award.per-enemy-out-of-action
    wyrdstone: Warriors earn one shard of wyrdstone for each counter still in their possession at the end of the battle.
- id: scenario.breakthrough
  name: Breakthrough
  number: 4
  setting: Mordheim
  source: Mordheim Rulebook
  author: Tuomas Pirinen
  player_mode: 1v1
  summary: The attacker needs to reach the other side of the board.
  tags: [attacker-defender, traverse-the-board]
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / Breakthrough
    url: https://mordheimer.net/docs/campaigns/scenarios/mordheim-rulebook/breakthrough
  progression:
    experience:
    - ref: campaign.experience.award.survives
    - ref: campaign.experience.award.winning-leader
    - ref: campaign.experience.award.per-enemy-out-of-action
    - summary: Any warrior earns +1 Experience for breaking through enemy lines; if the warrior is a Henchman the whole group gains +1 Experience
      amount: 1
- id: scenario.street-fight
  name: Street Fight
  number: 5
  setting: Mordheim
  source: Mordheim Rulebook
  author: Tuomas Pirinen
  player_mode: 1v1
  summary: Both warbands try to reach the other side of the street.
  tags: [traverse-the-board]
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / Street Fight
    url: https://mordheimer.net/docs/campaigns/scenarios/mordheim-rulebook/street-fight
  progression:
    experience:
    - ref: campaign.experience.award.survives
    - ref: campaign.experience.award.winning-leader
    - ref: campaign.experience.award.per-enemy-out-of-action
    - summary: The first Hero from either side (not both) who exits via the opposing table edge gains +1 Experience
      amount: 1
- id: scenario.chance-encounter
  name: Chance Encounter
  number: 6
  setting: Mordheim
  source: Mordheim Rulebook
  author: Tuomas Pirinen
  player_mode: 1v1
  summary: Two warbands try to steal each other's wyrdstone.
  tags: [wyrdstone-tokens]
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / Chance Encounter
    url: https://mordheimer.net/docs/campaigns/scenarios/mordheim-rulebook/chance-encounter
  progression:
    experience:
    - ref: campaign.experience.award.survives
    - ref: campaign.experience.award.winning-leader
    - ref: campaign.experience.award.per-enemy-out-of-action
    wyrdstone: >-
      Each warband starts the battle carrying D3 shards of wyrdstone, recorded
      before the game. At the end, each warband gains all the wyrdstone it was
      carrying minus one shard per Hero of its own that was taken out of action
      during the game (down to a minimum of zero), plus one extra shard for
      each enemy Hero it took out of action, up to the maximum number of shards
      the opposing warband was carrying at the beginning of the battle.
- id: scenario.hidden-treasure
  name: Hidden Treasure
  number: 7
  setting: Mordheim
  source: Mordheim Rulebook
  author: Tuomas Pirinen
  player_mode: 1v1
  summary: Search the buildings for a hidden treasure.
  tags: [treasure]
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / Hidden Treasure
    url: https://mordheimer.net/docs/campaigns/scenarios/mordheim-rulebook/hidden-treasure
  progression:
    experience:
    - ref: campaign.experience.award.survives
    - ref: campaign.experience.award.winning-leader
    - ref: campaign.experience.award.per-enemy-out-of-action
    - summary: A Hero who finds the treasure chest earns +2 Experience
      amount: 2
    loot:
      summary: >-
        Whoever recovers the chest rolls on the contents chart after the game;
        each item is rolled for separately, apart from the gold crowns which are
        always found.
      contents:
      - reward: 3D6 gold crowns
        roll: automatic
      - reward: D3 pieces of wyrdstone
        roll: 5+
      - reward: Suit of light armour
        item_id: light_armour
        roll: 4+
      - reward: Sword
        item_id: sword
        roll: 3+
      - reward: D3 gems worth 10 gc each
        roll: 5+
- id: scenario.occupy
  name: Occupy
  number: 8
  setting: Mordheim
  source: Mordheim Rulebook
  author: Tuomas Pirinen
  player_mode: 1v1
  summary: Both warbands try to capture as many buildings as they can.
  tags: [objective-building]
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / Occupy
    url: https://mordheimer.net/docs/campaigns/scenarios/mordheim-rulebook/occupy
  progression:
    experience:
    - ref: campaign.experience.award.survives
    - summary: The leader of the warband controlling the highest number of buildings at the end of the battle gains +1 Experience; if both warbands occupy the same number of buildings it is a draw and neither leader gains the bonus
      amount: 1
    - ref: campaign.experience.award.per-enemy-out-of-action
- id: scenario.surprise-attack
  name: Surprise Attack
  number: 9
  setting: Mordheim
  source: Mordheim Rulebook
  author: Tuomas Pirinen
  player_mode: 1v1
  summary: The defender tries to fend off the attacker and starts with limited numbers.
  tags: [attacker-defender, reserves]
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / Surprise Attack
    url: https://mordheimer.net/docs/campaigns/scenarios/mordheim-rulebook/surprise-attack
  progression:
    experience:
    - ref: campaign.experience.award.survives
    - ref: campaign.experience.award.winning-leader
    - ref: campaign.experience.award.per-enemy-out-of-action
# Chaos on the Streets (Town Cryer #5, multiplayer)
- id: scenario.treasure-hunt
  name: Treasure Hunt
  setting: Mordheim
  source: Town Cryer #5
  author: Mark Havener
  player_mode: multiplayer
  summary: Multiplayer. Similar to Wyrdstone Hunt.
  tags: [chaos-on-the-streets, wyrdstone-tokens, treasure]
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / Treasure Hunt
    url: https://mordheimer.net/docs/campaigns/scenarios/town-cryer/treasure-hunt-tc5
  progression:
    experience:
    - ref: campaign.experience.award.survives
    - ref: campaign.experience.award.winning-leader
    - summary: A Hero or Henchman carrying a Wyrdstone counter at the end of the battle receives +1 Experience
      amount: 1
    - ref: campaign.experience.award.per-enemy-out-of-action
    wyrdstone: Warriors earn one shard of wyrdstone for each counter in their possession at the end of the battle.
- id: scenario.street-brawl
  name: Street Brawl
  setting: Mordheim
  source: Town Cryer #5
  author: Mark Havener
  player_mode: multiplayer
  summary: Multiplayer. Similar to Skirmish.
  tags: [chaos-on-the-streets, brawl]
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / Street Brawl
    url: https://mordheimer.net/docs/campaigns/scenarios/town-cryer/street-brawl-tc5
  progression:
    experience:
    - ref: campaign.experience.award.survives
    - ref: campaign.experience.award.winning-leader
    - ref: campaign.experience.award.per-enemy-out-of-action
- id: scenario.the-lost-prince
  name: The Lost Prince
  setting: Mordheim
  source: Town Cryer #5
  author: Mark Havener
  player_mode: multiplayer
  summary: The warbands have heard rumours that a powerful man's son has
    wandered into the ruins and a handsome reward will be paid for his return.
  tags: [chaos-on-the-streets, escort-npc]
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / The Lost Prince
    url: https://mordheimer.net/docs/campaigns/scenarios/town-cryer/lost-prince-tc5
  progression:
    experience:
    - ref: campaign.experience.award.survives
    - ref: campaign.experience.award.winning-leader
    - ref: campaign.experience.award.per-enemy-out-of-action
    loot:
      summary: >-
        The grateful father awards the winning warband with the following
        treasure; each item is rolled for separately apart from the gold crowns,
        which are always received. If the merchant's son is killed, no reward is
        issued to the winning warband.
      contents:
      - reward: 5D6 gold crowns
        roll: automatic
      - reward: D3 swords
        item_id: sword
        roll: 4+
      - reward: Suit of heavy armour
        item_id: heavy_armour
        roll: 5+
      - reward: Suit of light armour
        item_id: light_armour
        roll: 4+
      - reward: Shield
        roll: 4+
      - reward: Helmet
        roll: 4+
      - reward: D3 gems worth 10 gc each
        roll: 5+
- id: scenario.wizards-mansion
  name: The Wizard's Mansion
  setting: Mordheim
  source: Town Cryer #5
  author: Mark Havener
  player_mode: multiplayer
  summary: Multiplayer. Similar to Skirmish with items at stake.
  tags: [chaos-on-the-streets, treasure]
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / The Wizard's Mansion
    url: https://mordheimer.net/docs/campaigns/scenarios/town-cryer/wizards-mansion-tc5
  progression:
    experience:
    - ref: campaign.experience.award.survives
    - ref: campaign.experience.award.winning-leader
    - ref: campaign.experience.award.per-enemy-out-of-action
    loot:
      summary: >-
        At the end of the game the winning warband finds all of the items of
        the defender's pre-battle chart that were not found before the battle,
        plus the mansion chart below; each item is rolled for separately apart
        from the gold crowns, which are always found.
      contents:
      - reward: 5D6 gold crowns
        roll: automatic
      - reward: D3 gems worth 10 gc each
        roll: 5+
      - reward: Tome of magic
        roll: 4+
      - reward: Gromril sword
        roll: 5+
      - reward: Athame
        roll: 4+
      - reward: D3 doses of healing herbs
        roll: 4+
      - reward: Dispel scroll
        roll: 5+
    notes:
    - >-
      The defender receives, in addition, one roll on the initial equipment
      table per additional attacking warband (Wooden Man, Mandrake Root,
      Crimson Shade, Lucky Charm, Holy/Unholy Relic or Cathayan Silk Cloak);
      each item may be found only once. Verify the special rules of those
      items in Town Cryer #5 before modelling them.
- id: scenario.the-pool
  name: The Pool
  setting: Mordheim
  source: Town Cryer #5
  author: Mark Havener
  player_mode: multiplayer
  summary: Multiplayer. Root around for wyrdstone in a pool in the centre of the table.
  tags: [chaos-on-the-streets, wyrdstone-tokens]
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / The Pool
    url: https://mordheimer.net/docs/campaigns/scenarios/town-cryer/pool-tc5
  progression:
    experience:
    - ref: campaign.experience.award.survives
    - ref: campaign.experience.award.winning-leader
    - summary: A Hero or Henchman carrying a Wyrdstone counter at the end of the battle receives +1 Experience
      amount: 1
    - ref: campaign.experience.award.per-enemy-out-of-action
    wyrdstone: >-
      The pool contains D3+3 pieces of wyrdstone; a Hero spending a whole turn
      within 1" of the pool doing nothing else finds one piece on a D6 roll of
      1-2 at the end of his turn (no Hero may search within 1" of another
      model). Only as many pieces may be found as were rolled at the start of
      the game.
    notes:
    - >-
      The page does not repeat the final conversion of counters into shards
      (one shard per counter held at the end); the same convention as Treasure
      Hunt, which does declare it, is assumed. Verify against the Town Cryer
      #5 print.
- id: scenario.ambush
  name: Ambush!
  setting: Mordheim
  source: Town Cryer #5
  author: Mark Havener
  player_mode: multiplayer
  summary: Multiplayer. Wyrdstone carrying defenders have to get off the table alive.
  tags: [chaos-on-the-streets, wyrdstone-tokens, traverse-the-board]
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / Ambush!
    url: https://mordheimer.net/docs/campaigns/scenarios/town-cryer/ambush-tc5
  progression:
    experience:
    - ref: campaign.experience.award.survives
    - ref: campaign.experience.award.winning-leader
    - summary: A Hero or Henchman carrying a Wyrdstone counter at the end of the battle receives +1 Experience
      amount: 1
    - ref: campaign.experience.award.per-enemy-out-of-action
    wyrdstone: >-
      Each Hero of the defending warband carries D3 pieces of wyrdstone; if a
      Hero carrying wyrdstone is taken out of action, place counters equal to
      the amount he was carrying where he fell, and any Hero may pick them up.
      The warband that gets the most wyrdstone shards off the table (or held by
      one of its Heroes when the game ends) is the winner.
    notes:
    - >-
      The page does not declare the conversion of counters held at the end into
      earned wyrdstone shards; the standard convention of wyrdstone scenarios
      is assumed (see Treasure Hunt). Verify against Town Cryer #5.
- id: scenario.monster-hunt
  name: Monster Hunt
  setting: Mordheim
  source: Town Cryer #5
  author: Mark Havener
  player_mode: multiplayer
  summary: Multiplayer. Warbands team up (or not) to take on a monster.
  tags: [chaos-on-the-streets, hostile-npc]
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / Monster Hunt
    url: https://mordheimer.net/docs/campaigns/scenarios/town-cryer/monster-hunt-tc5
  progression:
    experience:
    - ref: campaign.experience.award.survives
    - ref: campaign.experience.award.winning-leader
    - summary: A Hero or Henchman earns +1 Experience for each wound he inflicts on the monster
      amount: 1
    - summary: The Hero that puts the monster out of action gets a bonus +2 Experience
      amount: 2
    - ref: campaign.experience.award.per-enemy-out-of-action
    loot:
      summary: >-
        Whichever warband has control of the monster's lair at the end of the
        game may search it; each item is rolled for separately apart from the
        gold crowns, which are always found.
      contents:
      - reward: 5D6 gold crowns
        roll: automatic
      - reward: Magical artefact (roll on the artefact table)
        roll: 6+
      - reward: D3+1 pieces of wyrdstone
        roll: 4+
      - reward: Gromril axe
        roll: 5+
      - reward: Suit of heavy armour
        item_id: heavy_armour
        roll: 5+
      - reward: Suit of light armour
        item_id: light_armour
        roll: 4+
      - reward: Suit of light armour
        item_id: light_armour
        roll: 4+
      - reward: Shield
        roll: 4+
      - reward: Helmet
        roll: 4+
      - reward: D3 swords
        item_id: sword
        roll: 4+
      - reward: D3 gems worth 10 gc each
        roll: 5+
      - reward: Jewellery worth D6 x 10 gc
        roll: 5+
    notes:
    - >-
      The 'Suit of light armour' row appears twice in the source (Town Cryer
      #5); it is transcribed as-is for fidelity, pending verification of
      whether it is an errata or two independent rolls.
# Town Cryer and other supplements (registry entries)
- id: scenario.kidnapped
  name: Kidnapped
  setting: Mordheim
  source: Town Cryer #6
  author: Tuomas Pirinen
  player_mode: 1v1
  summary: Possessed vs any warband. Rescue a fair maiden before she gets
    sacrificed, or sacrifice her before she gets rescued.
  tags: [escort-npc, objective]
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / Kidnapped
    url: https://mordheimer.net/docs/campaigns/scenarios/town-cryer/kidnapped
  progression:
    experience:
    - summary: If the game ends before the sacrificial victim is killed or escapes, the warband controlling the victim gains +1 Experience which can be given to any Hero in the warband
      amount: 1
    - summary: If the Possessed manage to sacrifice the victim, the warband gains +D6 Experience to be freely distributed between its Heroes, and may optionally roll on the Rewards of the Shadowlord for any two Heroes
      amount_dice: D6
    - summary: If the rescuers move the victim off the table, the warband gains +D6 Experience freely distributed among its Heroes
      amount_dice: D6
    - ref: campaign.experience.award.survives
    - ref: campaign.experience.award.winning-leader
    - ref: campaign.experience.award.per-enemy-out-of-action
    income: If the sacrificial victim escapes, the rescuing warband gains a reward of 50 gold crowns added directly to its treasury.
- id: scenario.rat-attack
  name: Rat Attack
  setting: Mordheim
  source: Town Cryer #7
  author: Christian Ellegaard
  player_mode: 1v1
  summary: Skaven vs any warband. Sewers. The defender must escape from the
    opposite table edge; Skaven use a mixture of decoy counters and warband
    counters to confuse the enemy.
  tags: [underground, traverse-the-board]
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / Rat Attack
    url: https://mordheimer.net/docs/campaigns/scenarios/town-cryer/rat-attack
  progression:
    experience:
    - ref: campaign.experience.award.survives
    - ref: campaign.experience.award.per-enemy-out-of-action
    notes:
    - >-
      The source additionally lists '+2 Putting a Skaven Out of Action' with
      the text of a generic +1 per enemy out of action; the page itself marks
      it as a probable errata ('should probably read +1 additional Experience
      for each Skaven enemy put out of action'). The notice is transcribed
      without fixing the amount until verifying the Town Cryer #7 print.
- id: scenario.scourge-and-purge
  name: Scourge & Purge
  setting: Mordheim
  source: Town Cryer #7
  author: Donato Ranzato
  player_mode: 1v1
  summary: Witch Hunters vs any warband. Skirmish in the company of a possessed wizard.
  tags: [brawl, hostile-npc]
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Scenarios / List of Scenarios / Scourge & Purge
    url: https://mordheimer.net/docs/campaigns/scenarios/town-cryer/scourge-and-purge
  progression:
    experience:
    - summary: A fighter who survives the battle earns +1 Experience; even fighters who are wounded and taken Out of Action receive Experience for taking part
      amount: 1
    - summary: The leader of the winning side earns +2 Experience
      amount: 2
    - summary: A fighter earns +1 Experience for each opposing fighter he takes down or Out of Action during the battle
      amount: 1
    - summary: The fighter that takes the possessed wizard Out of Action earns +3 Experience
      amount: 3
    - summary: '+2 Purge: a Witch Hunter earns double Experience for each opposing fighter he takes Out of Action during the battle'
    - summary: '+6 Scourge: if the Witch Hunter Captain personally takes the possessed wizard Out of Action he earns double Experience'
    notes:
    - >-
      The '+2 Purge' and '+6 Scourge' awards mix amount and text ('earns
      double Experience'); both are transcribed as-is, pending verification
      against Town Cryer #7.
- id: scenario.surrounded
  name: Surrounded
