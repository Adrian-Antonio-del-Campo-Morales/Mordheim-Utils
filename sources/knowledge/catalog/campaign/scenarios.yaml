      amount: 1
    - effect: Each driver that gets off the board with his wagon gains +1 Experience
      effect_i18n:
        es: >-
          Cada conductor que salga del tablero con su carro gana +1 de Experiencia
      amount: 1
    - effect: Each warrior that stops a wagon gains +1 Experience
      effect_i18n:
        es: >-
          Cada guerrero que detenga un carro gana +1 de Experiencia
      amount: 1
    income: Before the game the Marienburger player chooses one wagon to carry his wyrdstone and remaining
      gold (gaining vast profits if it gets through, losing it all if it does not), or leaves all wagons
      empty for no bonus. If the ambushers stop the wyrdstone from leaving the table they gain whatever
      amount was placed in the wagon. If the Marienburgers get the wyrdstone off the table they gain 30%
      of the amount placed in the wagon (e.g. 100 gc of wyrdstone becomes 130 gc).
    notes:
    - The page adapts the original print awards (which used +20 xp to the leader, +5 xp per driver, D6
      xp per survivor, +5 xp per wound and for stopping a wagon) to the site standard +1 system; the originals
      are listed on the page itself under Original Experience.
    notes_i18n:
      es: >-
        La página adapta las recompensas de la impresión original (que usaban +20 px para el líder, +5
        px por conductor, D6 px por superviviente, +5 px por herida y por detener un carro) al sistema
        estándar de +1 del sitio; los originales se enumeran en la propia página bajo Experiencia
        Original.
  name_i18n:
    es: Cuero Crudo
