magical_artefacts:
  id: campaign.magical-artefacts-table
  dice: { count: 1, sides: 6 }
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Income / Magical Artefacts Table
    url: https://mordheimer.net/docs/campaigns/income
  note: In a campaign none of these items can appear more than once; if a magic
    item is already in someone else's possession, roll again.
  results:
  - id: campaign.magical-artefact.boots-and-rope-of-pieter
    roll: '1'
    result: The Boots and Rope of Pieter
    summary: The wearer may move normally (including running, charging, etc) on
      any kind of terrain, including vertical surfaces, with no Initiative test
      needed (except to jump across gaps).
  - id: campaign.magical-artefact.count-of-ventimiglias-misericordia
    roll: '2'
    result: The Count of Ventimiglia's Misericordia
    summary: Treated as a sword. Opponents wounded by it are stunned on a
      result of 1-3 (Undead are knocked down as normal) and put out of action
      on a 4-6.
  - id: campaign.magical-artefact.attlas-plate-mail
    roll: '3'
    result: Att'la's Plate Mail
    summary: A suit of Gromril Armour with Rune of Spell Eating (immune to all
      spells), Rune of Passage (move through solid objects) and Rune of
      Fortitude (an extra wound, possibly above the race's maximum).
  - id: campaign.magical-artefact.bow-of-seeking
    roll: '4'
    result: Bow of Seeking
    summary: Treated as an Elven Bow that always hits on a 2+, regardless of to
      hit modifiers; all arrows count as Hunting Arrows (+1 on all Injury
      rolls). May pick any visible enemy model in range, not just the closest.
      Cannot be used to shoot at Elves.
  - id: campaign.magical-artefact.executioners-hood
    roll: '5'
    result: Executioner's Hood
    summary: The wearer is always frenzied even if knocked down or stunned, and
      adds +1 to his Strength in close combat. He never leaves combat and
      always attacks opponents in base contact until they are taken out of
      action.
  - id: campaign.magical-artefact.all-seeing-eye-of-numas
    roll: '6'
    result: All-seeing Eye of Numas
    summary: The bearer can see all models on the table top, may roll two dice
      after battle when rolling on the Exploration chart, and has an additional
      6+ save against all shooting attacks and strikes in close combat that is
      not modified by Strength or weapon modifiers.
