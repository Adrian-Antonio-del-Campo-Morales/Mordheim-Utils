schema_version: 1
ruleset: mordheim
catalog: campaign-exploration-and-income
status: published
# Defines possible tables and rewards. Dice rolled, findings, crowns and
# wyrdstone obtained are saved in the campaign state, not here.
exploration:
  dice_allocation:
  - id: campaign.exploration.dice.per-surviving-hero
    eligible_warrior: hero
    dice: 1
    condition: survived_battle
    source_refs:
    - manual: mordheimer.net
      printed_page: 0
      section: Campaigns / Income / Exploration
      url: https://mordheimer.net/docs/campaigns/income
  - id: campaign.exploration.dice.bonus-if-won
    eligible_warrior: warband
    dice: 1
    condition: warband_won_battle
    source_refs:
    - manual: mordheimer.net
      printed_page: 0
      section: Campaigns / Income / Exploration
      url: https://mordheimer.net/docs/campaigns/income
  max_dice: 6
  shards_chart:
    id: campaign.exploration.shards-chart
    source_refs:
    - manual: mordheimer.net
      printed_page: 0
      section: Campaigns / Income / Number Of Wyrdstone Shards Found
      url: https://mordheimer.net/docs/campaigns/income
    cells:
    - when: { dice_total: { min: 1, max: 5 } }
      shards: 1
    - when: { dice_total: { min: 6, max: 11 } }
      shards: 2
    - when: { dice_total: { min: 12, max: 17 } }
      shards: 3
    - when: { dice_total: { min: 18, max: 24 } }
      shards: 4
    - when: { dice_total: { min: 25, max: 30 } }
      shards: 5
    - when: { dice_total: { min: 31, max: 35 } }
      shards: 6
    - when: { dice_total: { min: 36 } }
      shards: 7
  results:
  # DOUBLES
  - id: campaign.exploration.result.11-well
    dice_pattern: '1,1'
    outcome: Well
    description: >-
      Choose a Hero and roll a D6. If it is no higher than their Toughness, gain one wyrdstone
      shard; otherwise the Hero misses the next battle.
    description_i18n: { es: "Elige un Héroe y tira 1D6. Si no supera su Resistencia, obtienes un fragmento de piedra bruja; si falla, el Héroe se pierde la próxima batalla." }
    follow_up:
      type: sequence
      steps:
      - type: choose_one
        bind: searching_hero
        from: eligible_heroes
      - type: characteristic_test
        actor: $searching_hero
        characteristic: toughness
        dice: { count: 1, sides: 6 }
        success_when: roll_less_than_or_equal_to_characteristic
        on_success:
        - type: grant
          recipient: warband
          resources:
            wyrdstone_fragments: { kind: fixed, value: 1 }
        on_failure:
        - type: warrior.miss_games
          subject: $searching_hero
          games: { kind: fixed, value: 1 }
    source_refs:
    - manual: mordheimer.net
      printed_page: 0
      section: Campaigns / Income / Doubles / (1 1) Well
      url: https://mordheimer.net/docs/campaigns/income
  - id: campaign.exploration.result.22-shop
    dice_pattern: '2,2'
    outcome: Shop
    description: "Gain D6 gc. If the roll is 1, also find a Lucky Charm."
    description_i18n: { es: "Obtienes 1D6 co. Si el resultado es 1, también encuentras un Amuleto de la Suerte." }
    follow_up:
      type: sequence
      steps:
      - type: grant
        recipient: warband
        resources:
          gold_crowns: { kind: dice, dice: { count: 1, sides: 6 } }
      - type: conditional
        cases:
        - when: { field: roll, operator: equals, value: 1 }
          then:
          - type: grant
            recipient: warband
            items: [{ item_id: lucky_charm, quantity: { kind: fixed, value: 1 } }]
        default: []
    source_refs:
    - manual: mordheimer.net
      printed_page: 0
      section: Campaigns / Income / Doubles / (2 2) Shop
      url: https://mordheimer.net/docs/campaigns/income
  - id: campaign.exploration.result.33-corpse
    dice_pattern: '3,3'
    outcome: Corpse
    description: "Roll a D6 to loot the corpse: find D6 gc, a dagger, an axe, a sword or light armour."
    description_i18n: { es: "Tira 1D6 para registrar el cadáver: puedes encontrar 1D6 co, una daga, un hacha, una espada o una armadura ligera." }
    follow_up:
      type: roll_table
      dice: { count: 1, sides: 6 }
      branches:
      - when: { min: 1, max: 2 }
        then:
        - type: grant
          recipient: warband
          resources:
            gold_crowns: { kind: dice, dice: { count: 1, sides: 6 } }
      - when: { min: 3, max: 3 }
        then:
        - type: grant
          recipient: warband
          items: [{ item_id: dagger, quantity: { kind: fixed, value: 1 } }]
      - when: { min: 4, max: 4 }
        then:
        - type: grant
          recipient: warband
          items: [{ item_id: axe, quantity: { kind: fixed, value: 1 } }]
      - when: { min: 5, max: 5 }
        then:
        - type: grant
          recipient: warband
          items: [{ item_id: sword, quantity: { kind: fixed, value: 1 } }]
      - when: { min: 6, max: 6 }
        then:
        - type: grant
          recipient: warband
          items: [{ item_id: light_armour, quantity: { kind: fixed, value: 1 } }]
    source_refs:
    - manual: mordheimer.net
      printed_page: 0
      section: Campaigns / Income / Doubles / (3 3) Corpse
      url: https://mordheimer.net/docs/campaigns/income
  - id: campaign.exploration.result.44-straggler
    dice_pattern: '4,4'
    outcome: Straggler
    description: >-
      The reward depends on the warband: Skaven gain 2D6 gc, Possessed gain +1 XP for their leader,
      Undead gain a Zombie, and others gain an extra die to discard in their next exploration.
    description_i18n: { es: "La recompensa depende de la banda: los Skaven obtienen 2D6 co, el líder de los Poseídos gana +1 XP, los No Muertos obtienen un Zombi y las demás bandas tiran y descartan un dado adicional en su próxima exploración." }
    follow_up:
      type: conditional
      cases:
      - when: { field: context.band_id, operator: equals, value: skaven-clan-eshin }
        then:
        - type: grant
          recipient: warband
          resources:
            gold_crowns: { kind: dice, dice: { count: 2, sides: 6 } }
      - when: { field: context.band_id, operator: equals, value: cult-of-the-possessed }
        then:
        - type: reward.grant
          recipient: leader
          resources:
            experience: { kind: fixed, value: 1 }
      - when: { field: context.band_id, operator: in, value: [undead, restless-dead] }
        then:
        - type: grant_free_profile
          profile_name: Zombie
      default:
      - type: grant_rule
        recipient: warband
        text: Next exploration roll gains one extra die; discard any one die after rolling.
        text_i18n:
          es: >-
            La siguiente tirada de exploración gana un dado extra; descarta cualquier dado tras la tirada.
        expires_after_battles: 1
    source_refs:
    - manual: mordheimer.net
      printed_page: 0
      section: Campaigns / Income / Doubles / (4 4) Straggler
      url: https://mordheimer.net/docs/campaigns/income
  - id: campaign.exploration.result.55-overturned-cart
    dice_pattern: '5,5'
    outcome: Overturned Cart
    description: "Roll a D6 to find a Mordheim Map, 2D6 gc, or a jewelled sword and dagger."
    description_i18n: { es: "Tira 1D6 para encontrar un Mapa de Mordheim, 2D6 co o una espada y una daga enjoyadas." }
    follow_up:
      type: roll_table
      dice: { count: 1, sides: 6 }
      branches:
      - when: { min: 1, max: 2 }
        then:
        - type: grant
          recipient: warband
          items: [{ item_id: mordheim_map, quantity: { kind: fixed, value: 1 } }]
      - when: { min: 3, max: 4 }
        then:
        - type: grant
          recipient: warband
          resources:
            gold_crowns: { kind: dice, dice: { count: 2, sides: 6 } }
      - when: { min: 5, max: 6 }
        then:
        - type: grant
          recipient: warband
          items:
          - { item_id: sword, quantity: { kind: fixed, value: 1 } }
          - { item_id: dagger, quantity: { kind: fixed, value: 1 } }
          note: Jewelled sword and dagger, saleable at twice the normal value
            (the jewelled sword sells for 10 gc, for instance).
    source_refs:
    - manual: mordheimer.net
      printed_page: 0
      section: Campaigns / Income / Doubles / (5 5) Overturned Cart
      url: https://mordheimer.net/docs/campaigns/income
  - id: campaign.exploration.result.66-ruined-hovels
    dice_pattern: '6,6'
    outcome: Ruined Hovels
    description: "Find loot worth D6 gc among the ruins."
    description_i18n: { es: "Encuentras entre las ruinas un botín por valor de 1D6 co." }
    follow_up:
      type: grant
      recipient: warband
      resources:
        gold_crowns: { kind: dice, dice: { count: 1, sides: 6 } }
    source_refs:
    - manual: mordheimer.net
      printed_page: 0
      section: Campaigns / Income / Doubles / (6 6) Ruined Hovels
      url: https://mordheimer.net/docs/campaigns/income
  # TRIPLES
  - id: campaign.exploration.result.111-tavern
    dice_pattern: '1,1,1'
    outcome: Tavern
    description: >-
      Test the leader's Leadership: gain 4D6 gc on success or D6 gc on failure. Undead, Witch
      Hunters and Sisters of Sigmar succeed automatically.
    description_i18n: { es: "Haz una prueba de Liderazgo con el líder: obtienes 4D6 co si tiene éxito o 1D6 co si falla. No Muertos, Cazadores de Brujas y Hermanas de Sigmar superan la prueba automáticamente." }
    follow_up:
      type: conditional
      cases:
      - when: { field: context.band_id, operator: in, value: [undead, restless-dead, witch-hunters, sisters-of-sigmar] }
        then:
        - type: grant
          recipient: warband
          resources:
            gold_crowns: { kind: dice, dice: { count: 4, sides: 6 } }
          note: The warband automatically passes the test.
      default:
      - type: characteristic_test
        actor: leader
        characteristic: leadership
        dice: { count: 2, sides: 6 }
        success_when: roll_less_than_or_equal_to_characteristic
        on_success:
        - type: grant
          recipient: warband
          resources:
            gold_crowns: { kind: dice, dice: { count: 4, sides: 6 } }
        on_failure:
        - type: grant
          recipient: warband
          resources:
            gold_crowns: { kind: dice, dice: { count: 1, sides: 6 } }
    source_refs:
    - manual: mordheimer.net
      printed_page: 0
      section: Campaigns / Income / Triples / (1 1 1) Tavern
      url: https://mordheimer.net/docs/campaigns/income
  - id: campaign.exploration.result.222-smithy
    dice_pattern: '2,2,2'
    outcome: Smithy
    description: "Roll a D6 to find a sword, double-handed weapon, flail, D3 halberds, a lance or 2D6 gc."
    description_i18n: { es: "Tira 1D6 para encontrar una espada, un arma a dos manos, un mayal, 1D3 alabardas, una lanza de caballería o 2D6 co." }
    follow_up:
      type: roll_table
      dice: { count: 1, sides: 6 }
      branches:
      - when: { min: 1, max: 1 }
        then:
        - type: grant
          recipient: warband
          items: [{ item_id: sword, quantity: { kind: fixed, value: 1 } }]
      - when: { min: 2, max: 2 }
        then:
        - type: grant
          recipient: warband
          items: [{ item_id: two_handed_weapon, quantity: { kind: fixed, value: 1 } }]
      - when: { min: 3, max: 3 }
        then:
        - type: grant
          recipient: warband
          items: [{ item_id: flail, quantity: { kind: fixed, value: 1 } }]
      - when: { min: 4, max: 4 }
        then:
        - type: grant
          recipient: warband
          items: [{ item_id: halberd, quantity: { kind: dice, dice: { count: 1, sides: 3 } } }]
      - when: { min: 5, max: 5 }
        then:
        - type: grant
          recipient: warband
          items: [{ item_id: lance, quantity: { kind: fixed, value: 1 } }]
      - when: { min: 6, max: 6 }
        then:
        - type: grant
          recipient: warband
          resources:
            gold_crowns: { kind: dice, dice: { count: 2, sides: 6 } }
    source_refs:
    - manual: mordheimer.net
      printed_page: 0
      section: Campaigns / Income / Triples / (2 2 2) Smithy
      url: https://mordheimer.net/docs/campaigns/income
  - id: campaign.exploration.result.333-prisoners
    dice_pattern: '3,3,3'
    outcome: Prisoners
    outcome_i18n: { es: Prisioneros }
    description: >-
      The reward depends on the warband: XP for Possessed, Zombies for Undead, gold for Skaven, or
      2D6 gc and a possible free human Henchman for others.
    description_i18n: { es: "La recompensa depende de la banda: XP para los Poseídos, Zombis para los No Muertos, oro para los Skaven, o 2D6 co y un posible Secuaz humano gratuito para las demás." }
    follow_up:
      type: conditional
      cases:
      - when: { field: context.band_id, operator: in, value: [cult-of-the-possessed, trollheim-cult-of-the-possessed] }
        then:
        - type: reward.grant
          recipient: heroes
          resources:
            experience: { kind: dice, dice: { count: 1, sides: 3 } }
      - when: { field: context.band_id, operator: in, value: [undead, restless-dead, trollheim-undead] }
        then:
        - type: roll_table
          dice: { count: 1, sides: 3 }
          branches:
          - when: { min: 1, max: 1 }
            then: [{ type: grant_free_profile, profile_name: Zombie }]
          - when: { min: 2, max: 2 }
            then:
            - { type: grant_free_profile, profile_name: Zombie }
            - { type: grant_free_profile, profile_name: Zombie }
          - when: { min: 3, max: 3 }
            then:
            - { type: grant_free_profile, profile_name: Zombie }
            - { type: grant_free_profile, profile_name: Zombie }
            - { type: grant_free_profile, profile_name: Zombie }
      - when: { field: context.band_id, operator: in, value: [skaven-clan-eshin, skaven-clan-pestilens, trollheim-skaven-clan-eshin] }
        then:
        - type: grant
          recipient: warband
          resources:
            gold_crowns: { kind: dice, dice: { count: 3, sides: 6 } }
      default:
      - type: grant
        recipient: warband
        resources:
          gold_crowns: { kind: dice, dice: { count: 2, sides: 6 } }
      - type: choose_henchman_group
        label: Choose a human Henchman group for the prisoner, or decline
        allow_decline: true
    source_refs:
    - manual: mordheimer.net
      printed_page: 0
      section: Campaigns / Income / Triples / (3 3 3) Prisoners
      url: https://mordheimer.net/docs/campaigns/income
  - id: campaign.exploration.result.444-fletcher
    dice_pattern: '4,4,4'
    outcome: Fletcher
    description: "Roll a D6 to find D3 short bows, bows or long bows, hunting arrows, or D3 crossbows."
    description_i18n: { es: "Tira 1D6 para encontrar 1D3 arcos cortos, arcos o arcos largos, flechas de caza, o 1D3 ballestas." }
    follow_up:
      type: roll_table
      dice: { count: 1, sides: 6 }
      branches:
      - when: { min: 1, max: 2 }
        then:
        - type: grant
          recipient: warband
          items: [{ item_id: short_bow, quantity: { kind: dice, dice: { count: 1, sides: 3 } } }]
      - when: { min: 3, max: 3 }
        then:
        - type: grant
          recipient: warband
          items: [{ item_id: bow, quantity: { kind: dice, dice: { count: 1, sides: 3 } } }]
      - when: { min: 4, max: 4 }
        then:
        - type: grant
          recipient: warband
          items: [{ item_id: long_bow, quantity: { kind: dice, dice: { count: 1, sides: 3 } } }]
      - when: { min: 5, max: 5 }
        then:
        - type: grant
          recipient: warband
          items: [{ item_id: hunting_arrows, quantity: { kind: fixed, value: 1 } }]
      - when: { min: 6, max: 6 }
        then:
        - type: grant
          recipient: warband
          items: [{ item_id: crossbow, quantity: { kind: dice, dice: { count: 1, sides: 3 } } }]
    source_refs:
    - manual: mordheimer.net
      printed_page: 0
      section: Campaigns / Income / Triples / (4 4 4) Fletcher
      url: https://mordheimer.net/docs/campaigns/income
  - id: campaign.exploration.result.555-market-hall
    dice_pattern: '5,5,5'
    outcome: Market Hall
    description: "Find assorted valuables worth 2D6 gc."
    description_i18n: { es: "Encuentras varios objetos valiosos por un valor total de 2D6 co." }
    follow_up:
      type: grant
      recipient: warband
      resources:
        gold_crowns: { kind: dice, dice: { count: 2, sides: 6 } }
    source_refs:
    - manual: mordheimer.net
      printed_page: 0
      section: Campaigns / Income / Triples / (5 5 5) Market Hall
      url: https://mordheimer.net/docs/campaigns/income
  - id: campaign.exploration.result.666-returning-a-favour
    dice_pattern: '6,6,6'
    outcome: Returning a Favour
    description: "Choose one available Hired Sword to serve for the next battle without a hiring fee."
    description_i18n: { es: "Elige una Espada de Alquiler disponible para que sirva durante la próxima batalla sin pagar su tarifa de contratación." }
    follow_up:
      type: choose_hireling
      label: Choose the Hired Sword who returns the favour
    source_refs:
    - manual: mordheimer.net
      printed_page: 0
      section: Campaigns / Income / Triples / (6 6 6) Returning a Favour
      url: https://mordheimer.net/docs/campaigns/income
  # FOUR OF A KIND
  - id: campaign.exploration.result.1111-gunsmith
    dice_pattern: '1,1,1,1'
    outcome: Gunsmith
    description: "Roll a D6 to find a blackpowder weapon or superior blackpowder."
    description_i18n: { es: "Tira 1D6 para encontrar un arma de pólvora o pólvora superior." }
    follow_up:
      type: roll_table
      dice: { count: 1, sides: 6 }
      branches:
      - when: { min: 1, max: 1 }
        then:
        - type: grant
          recipient: warband
          items: [{ item_id: blunderbuss, quantity: { kind: fixed, value: 1 } }]
      - when: { min: 2, max: 2 }
        then:
        - type: grant
          recipient: warband
          items: [{ item_id: pistol, quantity: { kind: fixed, value: 2 } }]
      - when: { min: 3, max: 3 }
        then:
        - type: grant
          recipient: warband
          items: [{ item_id: duelling_pistol, quantity: { kind: fixed, value: 2 } }]
      - when: { min: 4, max: 4 }
        then:
        - type: grant
          recipient: warband
          items: [{ item_id: handgun, quantity: { kind: dice, dice: { count: 1, sides: 3 } } }]
      - when: { min: 5, max: 5 }
        then:
        - type: grant
          recipient: warband
          items: [{ item_id: superior_blackpowder, quantity: { kind: dice, dice: { count: 1, sides: 3 } } }]
      - when: { min: 6, max: 6 }
        then:
        - type: grant
          recipient: warband
          items: [{ item_id: hochland_long_rifle, quantity: { kind: fixed, value: 1 } }]
    source_refs:
    - manual: mordheimer.net
      printed_page: 0
      section: Campaigns / Income / Four of a kind / (1 1 1 1) Gunsmith
      url: https://mordheimer.net/docs/campaigns/income
  - id: campaign.exploration.result.2222-shrine
    dice_pattern: '2,2,2,2'
    outcome: Shrine
    description: >-
      Gain 3D6 gc. Sisters of Sigmar and Witch Hunters also bless one weapon, which wounds Undead
      and Possessed on 2+.
    description_i18n: { es: "Obtienes 3D6 co. Las Hermanas de Sigmar y los Cazadores de Brujas también bendicen un arma, que hiere a No Muertos y Poseídos con 2+." }
    follow_up:
      type: sequence
      steps:
      - type: conditional
        cases:
        - when: { field: context.band_id, operator: in, value: [sisters-of-sigmar, witch-hunters] }
          then:
          - type: grant
            recipient: warband
            resources:
              gold_crowns: { kind: dice, dice: { count: 3, sides: 6 } }
          - type: choose_equipment
            label: Choose the weapon to bless
            text: "Blessed weapon ({item}): wounds Undead and Possessed on 2+."
            text_i18n:
              es: >-
                Arma bendecida ({item}): hiere a No-muertos y Endemoniados con 2+.
        default:
        - type: grant
          recipient: warband
          resources:
            gold_crowns: { kind: dice, dice: { count: 3, sides: 6 } }
    source_refs:
    - manual: mordheimer.net
      printed_page: 0
      section: Campaigns / Income / Four of a kind / (2 2 2 2) Shrine
      url: https://mordheimer.net/docs/campaigns/income
  - id: campaign.exploration.result.3333-townhouse
    dice_pattern: '3,3,3,3'
    outcome: Townhouse
    description: "Find loot worth 3D6 gc in the surviving townhouse."
    description_i18n: { es: "Encuentras en la casa superviviente un botín por valor de 3D6 co." }
    follow_up:
      type: grant
      recipient: warband
      resources:
        gold_crowns: { kind: dice, dice: { count: 3, sides: 6 } }
    source_refs:
    - manual: mordheimer.net
      printed_page: 0
      section: Campaigns / Income / Four of a kind / (3 3 3 3) Townhouse
      url: https://mordheimer.net/docs/campaigns/income
  - id: campaign.exploration.result.4444-armourer
    dice_pattern: '4,4,4,4'
    outcome: Armourer
    description: "Roll a D6 to find shields or bucklers, helmets, light armour, heavy armour or Ithilmar armour."
    description_i18n: { es: "Tira 1D6 para encontrar escudos o rodelas, yelmos, armadura ligera, armadura pesada o armadura de Ithilmar." }
    follow_up:
      type: roll_table
      dice: { count: 1, sides: 6 }
      branches:
      - when: { min: 1, max: 2 }
        then:
        - type: choose_option
          label: Choose the armour found
          options:
          - id: shields
            label: D3 Shields
            then:
            - type: grant
              recipient: warband
              items: [{ item_id: shield, quantity: { kind: dice, dice: { count: 1, sides: 3 } } }]
          - id: bucklers
            label: D3 Bucklers
            then:
            - type: grant
              recipient: warband
              items: [{ item_id: buckler, quantity: { kind: dice, dice: { count: 1, sides: 3 } } }]
      - when: { min: 3, max: 3 }
        then:
        - type: grant
          recipient: warband
          items: [{ item_id: helmet, quantity: { kind: dice, dice: { count: 1, sides: 3 } } }]
      - when: { min: 4, max: 4 }
        then:
        - type: grant
          recipient: warband
          items: [{ item_id: light_armour, quantity: { kind: dice, dice: { count: 1, sides: 3 } } }]
      - when: { min: 5, max: 5 }
        then:
        - type: grant
          recipient: warband
          items: [{ item_id: heavy_armour, quantity: { kind: dice, dice: { count: 1, sides: 3 } } }]
      - when: { min: 6, max: 6 }
        then:
        - type: grant
          recipient: warband
          items: [{ item_id: ithilmar_armour, quantity: { kind: fixed, value: 1 } }]
    source_refs:
    - manual: mordheimer.net
      printed_page: 0
      section: Campaigns / Income / Four of a kind / (4 4 4 4) Armourer
      url: https://mordheimer.net/docs/campaigns/income
  - id: campaign.exploration.result.5555-graveyard
    dice_pattern: '5,5,5,5'
    outcome: Graveyard
    description: >-
      Sisters of Sigmar and Witch Hunters seal the graves and distribute D6 XP. Other warbands loot
      D6x10 gc but will be hated by those bands in their next battle.
    description_i18n: { es: "Las Hermanas de Sigmar y los Cazadores de Brujas sellan las tumbas y reparten 1D6 XP. Las demás bandas saquean 1D6×10 co, pero serán odiadas por esas bandas en su próximo enfrentamiento." }
    follow_up:
      type: conditional
      cases:
      - when: { field: context.band_id, operator: in, value: [sisters-of-sigmar, witch-hunters] }
        then:
        - type: reward.grant
          recipient: heroes
          resources:
            experience: { kind: dice, dice: { count: 1, sides: 6 } }
          note: The warband seals the graves.
      default:
      - type: grant
        recipient: warband
        resources:
          gold_crowns: { kind: dice, dice: { count: 1, sides: 6 }, multiplier: 10 }
      - type: grant_rule
        recipient: warband
        text: The entire enemy warband hates this warband in its next battle against Sisters of Sigmar or Witch Hunters.
        text_i18n:
          es: >-
            Toda la banda enemiga odia a esta banda en su siguiente batalla contra Hermanas de Sigmar o
            Cazadores de Brujas.
        expires_after_battles: 1
        consume_when_opponent_contains: [sisters, sigmar, witch hunter]
    source_refs:
    - manual: mordheimer.net
      printed_page: 0
      section: Campaigns / Income / Four of a kind / (5 5 5 5) Graveyard
