magical_artefacts:
  id: campaign.magical-artefacts-table
  dice: { count: 1, sides: 6 }
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Campaigns / Income / Magical Artefacts Table
    url: https://mordheimer.net/docs/campaigns/income
  note: In a campaign none of these items can appear more than once; if a magic
    item is already in someone else's possession, roll again.
  results:
  - id: campaign.magical-artefact.boots-and-rope-of-pieter
    roll: '1'
    result: The Boots and Rope of Pieter
    effect: >-
      The wearer may move normally (including running, charging, etc) on any kind of terrain,
      including vertical surfaces, with no Initiative test needed (except to jump across gaps).
    effect_i18n:
      es: >-
        El portador puede moverse con normalidad (incluyendo correr, cargar, etc.) sobre cualquier
        tipo de terreno, incluso superficies verticales, sin necesidad de superación de Iniciativa
        (excepto para saltar huecos).
  - id: campaign.magical-artefact.count-of-ventimiglias-misericordia
    roll: '2'
    result: The Count of Ventimiglia's Misericordia
    effect: >-
      Treated as a sword. Opponents wounded by it are stunned on a result of 1-3 (Undead are knocked
      down as normal) and put out of action on a 4-6.
    effect_i18n:
      es: >-
        Se considera una espada. Los oponentes heridos por ella quedan aturdidos con un resultado de
        1-3 (los No Muertos son derribados con normalidad) y fuera de combate con un 4-6.
  - id: campaign.magical-artefact.attlas-plate-mail
    roll: '3'
    result: Att'la's Plate Mail
    effect: >-
      A suit of Gromril Armour with Rune of Spell Eating (immune to all spells), Rune of Passage
      (move through solid objects) and Rune of Fortitude (an extra wound, possibly above the race's
      maximum).
    effect_i18n:
      es: >-
        Una coraza de gromril con Runa de Devorahechizos (inmune a todos los hechizos), Runa del
        Pasaje (atraviesa objetos sólidos) y Runa de Fortaleza (una herida adicional, posiblemente
        por encima del máximo de la raza).
  - id: campaign.magical-artefact.bow-of-seeking
    roll: '4'
    result: Bow of Seeking
    effect: >-
      Treated as an Elven Bow that always hits on a 2+, regardless of to hit modifiers; all arrows
      count as Hunting Arrows (+1 on all Injury rolls). May pick any visible enemy model in range,
      not just the closest. Cannot be used to shoot at Elves.
    effect_i18n:
      es: >-
        Se considera un Arco Élfico que siempre impacta con un 2+, sin importar los modificadores al
        impactar; todas las flechas cuentan como Flechas de Caza (+1 en todas las tiradas de
        herida). Puede elegir cualquier miniatura enemiga visible al alcance, no solo la más
        cercana. No puede dispararse contra Elfos.
  - id: campaign.magical-artefact.executioners-hood
    roll: '5'
    result: Executioner's Hood
    result_i18n:
      es: Capucha del Verdugo
    effect: >-
      The wearer is always frenzied even if knocked down or stunned, and adds +1 to his Strength in
      close combat. He never leaves combat and always attacks opponents in base contact until they
      are taken out of action.
    effect_i18n:
      es: >-
        El portador está siempre frenético incluso si es derribado o aturdido, y suma +1 a su Fuerza en combate cerrado.
        Nunca abandona el combate y siempre ataca a los oponentes en contacto de base hasta dejarlos fuera de combate.
  - id: campaign.magical-artefact.all-seeing-eye-of-numas
    roll: '6'
    result: All-seeing Eye of Numas
    effect: >-
      The bearer can see all models on the table top, may roll two dice after battle when rolling on
      the Exploration chart, and has an additional 6+ save against all shooting attacks and strikes
      in close combat that is not modified by Strength or weapon modifiers.
    effect_i18n:
      es: >-
        El portador puede ver todas las miniaturas de la mesa, puede tirar dos dados tras la batalla
        al tirar en la tabla de Exploración, y tiene una tirada de salvación adicional de 6+ contra
        todos los ataques de disparo y golpes en combate cerrado que no se ve modificada por la
        Fuerza ni por modificadores de armas.
effect_ids:
- campaign.exploration.dice
- campaign.exploration.reroll
- campaign.exploration.result
- campaign.income.sell-wyrdstone
