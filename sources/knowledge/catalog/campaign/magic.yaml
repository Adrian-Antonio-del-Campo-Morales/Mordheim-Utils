- id: lore.prayers-of-taal
  name: Prayers of Taal
  note: Used by the Ostlander Mercenaries Priest of Taal and the Horned Hunters Priest of Taal. Prayers
    of Taal work like Prayers of Sigmar; the Taal Priest never wears armour (clarified as heavy armour
    only, so Light Armour, Helmets and Shields are allowed).
  spells:
  - id: spell.prayers-of-taal.stags-leap
    roll: '1'
    name: Stag's Leap
    difficulty: 7
    summary: The Priest of Taal may immediately move anywhere within 9", including into base contact with
      the enemy, in which case he counts as charging and gains +1 Strength to his first round of attacks.
      If he engages a fleeing enemy, in the close combat phase he scores one automatic hit at +1 Strength
      and then his opponent will flee again, if he survives.
    name_i18n:
      en: Stag's Leap
      es: Salto del ciervo
  - id: spell.prayers-of-taal.blessed-ale
    roll: '2'
    name: Blessed Ale
    difficulty: 5
    summary: Drinking a flask of Taal-blessed ale may heal any one model within 2" of the Priest, including
      himself. The warrior is restored to his full quota of Wounds. Any living enemy models, not Undead
      or Possessed, within 2" of the Priest lose 1 Attack during the next round of combat due to the fumes
      of the ale.
    name_i18n:
      en: Blessed Ale
      es: Cerveza bendecida
  - id: spell.prayers-of-taal.bears-paw
    roll: '3'
    name: Bear's Paw
    difficulty: 7
    summary: The Priest invokes the blessing of Taal on himself or a single friendly model within 6".
      The target receives a bonus of +2 to his Strength until the Priest's next turn.
    name_i18n:
      en: Bear's Paw
      es: Garra de oso
  - id: spell.prayers-of-taal.earthshudder
    roll: '4'
    name: Earthshudder
    difficulty: 9
    summary: The spell is cast on a single building within 4". Any enemy models touching the building
      suffer a single S3 hit. In addition the building collapses and any models on it count as having
      fallen to the ground. Remove the terrain feature from the board for the rest of the game.
    name_i18n:
      en: Earthshudder
      es: Sacudida telúrica
  - id: spell.prayers-of-taal.tanglefoot
    roll: '5'
    name: Tanglefoot
    difficulty: 8
    summary: Plants, vines and small trees burst forth from the earth. All models, friend as well as foe,
      with the exception of Ostlander Jaegers and friendly Horned Hunter Zealots, within 12" of the Priest
      can only move at half speed until the next shooting phase.
    name_i18n:
      en: Tanglefoot
      es: Pies atados
  - id: spell.prayers-of-taal.summon-squirrels
    roll: '6'
    name: Summon Squirrels
    difficulty: 7
    summary: The furious rodents assault one enemy within 12" of the Priest. The target suffers 2D6 Strength
      1 hits. No armour saves are allowed.
    name_i18n:
      en: Summon Squirrels
      es: Invocar ardillas
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Magic / Prayers of Taal
    url: https://mordheimer.net/docs/magic/prayers-of-taal
  name_i18n:
    en: Prayers of Taal
    es: Plegarias de Taal
- id: lore.funerary-rites
  name: Funerary Rites
  note: Used by the Priest of Morr.
  spells:
  - id: spell.funerary-rites.morrs-protection
    roll: '1'
    name: Morr's Protection
    difficulty: 6
    summary: Any magical attacks made by a Necromancer, a Magister or Daemons that would be considered
      a direct attack on the priest are negated if this rite is successful.
    name_i18n:
      en: Morr's Protection
      es: Protección de Morr
  - id: spell.funerary-rites.death-holds-no-fear
    roll: '2'
    name: Death Holds No Fear
    difficulty: auto
    summary: The Priest of Morr is fearless for the remainder of the game.
    name_i18n:
      en: Death Holds No Fear
      es: La muerte no da miedo
  - id: spell.funerary-rites.sanctity-of-the-fallen
    roll: '3'
    name: Sanctity of the Fallen
    difficulty: 7
    summary: The Priest of Morr may perform the Rite of Sanctity on a model, friend or foe, that has been
      taken out of action, provided he is within 6" of it. If successful, the model may not be raised
      up by a Necromancer.
    name_i18n:
      en: Sanctity of the Fallen
      es: Santidad de los caídos
  - id: spell.funerary-rites.hand-of-morr
    roll: '4'
    name: Hand of Morr
    difficulty: 9
    summary: The Priest of Morr must be in base-to-base contact with an Undead model. Before hand-to-hand
      combat occurs he may use the Hand of Morr. If successful the foe immediately goes out of action,
      affecting Zombies, Dire Wolves and Vampires. Ghouls and Possessed affected flee their full Move
      away from the Priest of Morr.
    name_i18n:
      en: Hand of Morr
      es: Mano de Morr
  - id: spell.funerary-rites.do-you-know-who-i-am
    roll: '5'
    name: Do you know who I am?
    difficulty: 7
    summary: This rite has a range of 6" and must be directed at the closest Undead model first, or if
      no Undead are within range, at the next closest human servant of the Undead, or finally at any model.
      If successful, that model is immediately Stunned. If the model cannot be Stunned, it is Knocked
      Down instead.
    name_i18n:
      en: Do you know who I am?
      es: ¿Sabes quién soy?
  - id: spell.funerary-rites.i-am-death
    roll: '6'
    name: I am death!
    difficulty: 8
    summary: This spell gives the Priest of Morr a 6+ armour save and increases his WS by either +1 or
      to 4, whichever is greater.
    name_i18n:
      en: I am death!
      es: ¡Yo soy la muerte!
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Magic / Funerary Rites
    url: https://mordheimer.net/docs/magic/funerary-rites
  name_i18n:
    en: Funerary Rites
    es: Ritos funerarios
- id: lore.shadow-warrior-magic
  name: Shadow Warrior Magic
  note: Used by the Shadow Warriors Shadow Weaver. Several of these spells require the target to be within
    a certain distance of a wall; this may include any piece of terrain that could cast a man-sized shadow.
  spells:
  - id: spell.shadow-warrior-magic.pool-of-shadow
    roll: '1'
    name: Pool of Shadow
    difficulty: 7
    summary: The mage and all allies within 6" may Hide, exactly as if there were a wall or other obstruction
      between them and their enemies, even after marching. The hiding is disrupted if any enemy enters
      the area of effect. In addition, all affected count as being in cover against enemy shooting. The
      spell lasts until the start of the Shadow Weaver's next turn.
    name_i18n:
      en: Pool of Shadow
      es: Charco de sombra
  - id: spell.shadow-warrior-magic.the-living-shadows
    roll: '2'
    name: The Living Shadows
    difficulty: 7
    summary: The Shadow Weaver may cast this spell at any enemy model within 12" of him and within 2"
      of a wall. The target suffers a single Strength 4 hit with no armour saves.
    name_i18n:
      en: The Living Shadows
      es: Las Sombras vivientes
  - id: spell.shadow-warrior-magic.wings-of-night
    roll: '3'
    name: Wings of Night
    difficulty: 6
    summary: This spell may only be cast if the Shadow Weaver is within 2" of a wall. He is instantly
      moved up to 12" to a place that is also within 2" of a wall. If moved into contact with an enemy
      model, the Shadow Weaver counts as charging in the first round.
    name_i18n:
      en: Wings of Night
      es: Alas de la noche
  - id: spell.shadow-warrior-magic.cloak-of-darkness
    roll: '4'
    name: Cloak of Darkness
    difficulty: 7
    summary: The Shadow Weaver is effectively concealed from enemy sight. As long as he does not attack
      any enemy models, he may not be attacked. He may intercept as normal if his controller wishes. The
      spell lasts until the Shadow Weaver attacks an enemy model. A model engaged in close combat with
      an enemy may never choose to not attack.
    name_i18n:
      en: Cloak of Darkness
      es: Capa de oscuridad
  - id: spell.shadow-warrior-magic.shadowbind
    roll: '5'
    name: Shadowbind
    difficulty: 9
    summary: The Shadow Weaver may cast this spell at any enemy model within 24" of him and within 2"
      of a wall. The target may not move unless it first passes a Strength test on 1D6 +1 at the start
      of its turn, before the recovery phase. The spell lasts until the Shadow Weaver suffers a wound
      or attempts to cast another spell. If attacked while affected, treat the target exactly as if he
      were Stunned.
    name_i18n:
      en: Shadowbind
      es: Vínculo de sombra
  - id: spell.shadow-warrior-magic.shield-of-shadow
    roll: '6'
    name: Shield of Shadow
    difficulty: 7
    summary: The Shadow Weaver may cast this spell on himself or a member of his warband within 12". The
      target receives an armour save of 5+ that is not modified by the attacker's Strength. The spell
      lasts until the start of the Shadow Weaver's next turn.
    name_i18n:
      en: Shield of Shadow
      es: Escudo de sombra
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Magic / Shadow Warrior Magic
    url: https://mordheimer.net/docs/magic/shadow-warrior-magic
  name_i18n:
    en: Shadow Warrior Magic
    es: Magia de los guerreros de las sombras
- id: lore.amazon-rituals
  name: Amazon Rituals
  note: Used by the Amazons (Lustria) Serpent Priestess and the Amazons (Mordheim) Priestess.
  spells:
  - id: spell.amazon-rituals.singing-wind
    roll: '1'
    name: Singing Wind
    difficulty: 8
    summary: Singing motes and dancing lights entrance and hold any model within 10" until the start of
      the Amazon player's next turn. The model cannot move, shoot or cast spells, but may defend itself
      in hand-to-hand combat. Affected models automatically go last in combat.
    name_i18n:
      en: Singing Wind
      es: Viento cantante
  - id: spell.amazon-rituals.serpents-strength
    roll: '2'
    name: Serpent's Strength
    difficulty: 9
    summary: Any model within 8" of the Priestess, including herself, adds +1 to their Strength until
      the end of their next turn. The ritual cannot be cast if the Priestess is in close combat during
      her shooting phase.
    name_i18n:
      en: Serpent's Strength
      es: Fuerza de la serpiente
  - id: spell.amazon-rituals.wendalas-maelstrom
    roll: '3'
    name: Wendala's Maelstrom
    difficulty: 7
    summary: The storm extends out from the Priestess 18". All attempts to shoot missile weapons by the
      enemy are at -1 to hit. The ritual lasts until the start of the Amazon player's next turn.
    name_i18n:
      en: Wendala's Maelstrom
      es: Maelstrom de Wendala
  - id: spell.amazon-rituals.shield-of-thorns
    roll: '4'
    name: Shield of Thorns
    difficulty: 7
    summary: The ritual produces a cocoon of thorns about the Priestess, making her immune to ranged or
      magical attacks. Any models wishing to charge the Priestess may do so, but the thorns negate any
      strikes by the Priestess and her enemies in the first round of combat. The Priestess cannot cast
      this ritual while in hand-to-hand combat.
    name_i18n:
      en: Shield of Thorns
      es: Escudo de espinas
  - id: spell.amazon-rituals.the-living-jungle
    roll: '5'
    name: The Living Jungle
    difficulty: 6
    summary: Pick one model within 12". The model is swarmed by a savage mix of snakes, spiders and insects,
      most of them poisonous. The afflicted model takes 1D6 Strength 2 hits with no armour saves allowed
      apart from ward saves. A dodge save cannot be used against a swarm.
    name_i18n:
      en: The Living Jungle
      es: La Selva viviente
  - id: spell.amazon-rituals.sirens-dreams
    roll: '6'
    name: Siren's Dreams
    difficulty: 7
    summary: The song momentarily distracts the Amazons' enemies within 12", so all Leadership tests for
      the opposing warband are made at -1 until the end of the opposing player's next turn. Lizardmen
      and Undead are immune to the effects of this ritual.
    name_i18n:
      en: Siren's Dreams
      es: Sueños de sirena
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Magic / Amazon Rituals
    url: https://mordheimer.net/docs/magic/amazon-rituals
  name_i18n:
    en: Amazon Rituals
    es: Rituales de las amazonas
- id: lore.necromancy-restless-dead
  name: Necromancy (The Restless Dead)
  note: 'Used by The Restless Dead Liche and Necromancer. Similar to the original Necromancy list, but
    revised for a Restless Dead warband. Roll 6 covers two spells: Deathly Visage (Necromancers only)
    and Living Horror (Liche only).'
  spells:
  - id: spell.necromancy-restless-dead.spell-of-awakening
    roll: '1'
    name: Spell of Awakening
    difficulty: auto
    summary: If an enemy Hero is killed, i.e. the opponent rolls 11-15 on the serious injury chart after
      the battle, the Sorcerer may raise him to fight as a Zombie in his servitude. The dead Hero retains
      his characteristics and all his weapons and armour but may not use any equipment or skills. He may
      no longer run, counts as a Henchmen group on his own and does not gain additional experience.
    name_i18n:
      en: Spell of Awakening
      es: Hechizo de Despertar
  - id: spell.necromancy-restless-dead.lifestealer
    roll: '2'
    name: Lifestealer
    difficulty: 10
    summary: Choose a single model within 6". The target suffers a wound with no saves allowed and the
      Sorcerer gains an extra wound for the duration of the battle. This may take the Wounds of a Necromancer
      above their original maximum, but a Liche may only restore lost wounds. This spell will not affect
      the Possessed or any Undead models.
    name_i18n:
      en: Lifestealer
      es: Robavidas
  - id: spell.necromancy-restless-dead.reanimation
    roll: '3'
    name: Reanimation
    difficulty: 5
    summary: One Zombie that went out of action during the last hand-to-hand combat phase immediately
      returns to battle, placed within 6" of the Sorcerer and not straight into hand-to-hand combat. The
      spell can be used on Grave Guards and Wights to restore 1 lost wound. It cannot bring Scarecrows,
      Grave Guards, Wights or Skeletons back to life as it does Zombies.
    name_i18n:
      en: Reanimation
      es: Reanimación
  - id: spell.necromancy-restless-dead.spell-of-doom
    roll: '4'
    name: Spell of Doom
    difficulty: 9
    summary: Choose one enemy model within 12". The model must roll equal to or less than his Strength
      on a D6 or the dead emerging from the earth will rend him with supernatural power. If he fails,
      you may roll on the injury table to see what happens to him.
    name_i18n:
      en: Spell of Doom
      es: Hechizo de perdición
  - id: spell.necromancy-restless-dead.call-of-vanhel
    roll: '5'
    name: Call of Vanhel
    difficulty: 6
    summary: A single Zombie, Skeleton, Wight or Grave Guard within 6" of the caster may immediately move
      again up to its maximum movement distance. If this moves it into base contact with an enemy model
      it counts as charging. The target automatically passes Initiative tests needed during this extra
      movement.
    name_i18n:
      en: Call of Vanhel
      es: Llamado de Vanhel
  - id: spell.necromancy-restless-dead.deathly-visage
    roll: '6'
    name: Deathly Visage
    difficulty: 6
    summary: Necromancers only. The Necromancer causes fear in his enemies for the duration of the battle
      and is likewise immune to fear. This is the one exception to the Apprentice rule Necromancers must
      usually follow in a Liche warband; a Necromancer may choose this spell if the Liche has the spell
      Horror.
    name_i18n:
      en: Deathly Visage
      es: Rostro mortecino
  - id: spell.necromancy-restless-dead.living-horror
    roll: '6'
    name: Living Horror
    difficulty: 8
    summary: Liche only. Choose one model within 8" of the Liche and roll D6 +3. If the score is equal
      to or greater than the Leadership of the target, that model suffers a wound with no armour saves
      allowed. If this wounds the target and it still has wounds remaining, it may not move, shoot or
      cast spells during its next turn unless it passes a Leadership test. This spell will not affect
      the Possessed, Undead or any model immune to fear.
    name_i18n:
      en: Living Horror
      es: Horror viviente
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Magic / Necromancy (The Restless Dead)
    url: https://mordheimer.net/docs/magic/necromancy-restless-dead
  name_i18n:
    en: Necromancy (The Restless Dead)
    es: Nigromancia (Los Muertos Inquietos)
- id: lore.chaos-dwarfs-magic
  name: Chaos Dwarfs Magic
  note: Used by The Sons of Hashut Apprentice Sorcerer.
  spells:
  - id: spell.chaos-dwarfs-magic.spectre-of-hashut
    roll: '1'
    name: Spectre of Hashut
    difficulty: 9
    summary: A spectral apparition hits the enemy miniature closest to the Sorcerer within 10". That miniature
      is automatically stunned.
    name_i18n:
      en: Spectre of Hashut
      es: Espectro de Hashut
  - id: spell.chaos-dwarfs-magic.stone-statue
    roll: '2'
    name: Stone Statue
    difficulty: 9
    summary: Choose an enemy miniature within 12" and in line of sight. For the rest of the turn and the
      following turn the miniature cannot do anything. If attacked in melee it suffers an automatic hit;
      if it is shot, the shooter gets a +1 bonus to hit.
    name_i18n:
      en: Stone Statue
      es: Estatua de piedra
  - id: spell.chaos-dwarfs-magic.fireball
    roll: '3'
    name: Fireball
    difficulty: 7
    summary: This spell has a range of 16" and requires line of sight. The target receives an automatic
      hit of Strength 4.
    name_i18n:
      en: Fireball
      es: Bola de fuego
  - id: spell.chaos-dwarfs-magic.vanish
    roll: '4'
    name: Vanish
    difficulty: 7
    summary: The Sorcerer may immediately make a move of up to 6" in any direction and may enter or leave
      combat without penalty. If he enters combat, he is considered to be making a charge move.
    name_i18n:
      en: Vanish
      es: Desvanecerse
  - id: spell.chaos-dwarfs-magic.eruption
    roll: '5'
    name: Eruption
    difficulty: 8
    summary: All miniatures within a distance of up to 4", friend or foe, suffer an automatic hit of Strength
      4. After resolving the effects, the Sorcerer cannot cast any more spells until the next turn and
      suffers -1 to his Toughness attribute.
    name_i18n:
      en: Eruption
      es: Erupción
  - id: spell.chaos-dwarfs-magic.eye-of-hashut
    roll: '6'
    name: Eye of Hashut
    difficulty: 6
    summary: Choose a friendly miniature within 12" and roll 1D6, Hobgoblins always subtract 1 from the
      result. On 1 the miniature is immediately out of action, although it will not roll on the serious
      injury table. On 2-5 the miniature adds +1 to one of its attributes for the rest of the game. On
      6 it adds +1 to all attributes for the rest of the game. The Eye of Hashut can be used successfully
      only once per battle.
    name_i18n:
      en: Eye of Hashut
      es: Ojo de Hashut
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Magic / Chaos Dwarfs Magic
    url: https://mordheimer.net/docs/magic/chaos-dwarfs-magic
  name_i18n:
    en: Chaos Dwarfs Magic
    es: Magia de los enanos del caos
- id: lore.mortuary-cult-scrolls
  name: Mortuary Cult Scrolls
  note: Used by the Tomb Guardians Liche Priest.
  spells:
  - id: spell.mortuary-cult-scrolls.menkares-scroll-of-urgency
    roll: '1'
    name: Menkare's scroll of Urgency
    difficulty: 6
    summary: A single Skeleton Soldier within 6" may immediately move again up to its maximum Movement
      distance, ie 4". If this takes the model into base contact with an enemy model, it counts as charging.
    name_i18n:
      en: Menkare's scroll of Urgency
      es: Pergamino de Urgencia de Menkare
  - id: spell.mortuary-cult-scrolls.horrebes-curse-of-the-mummy
    roll: '2'
    name: Horrebe's Curse of the Mummy
    difficulty: 8
    summary: The target must be in base-to-base contact with a Mummy and within 18" of the Liche Priest.
      The enemy model has a -1 penalty on all to hit and to wound rolls and on all armour saves. This
      lasts until the start of the next Tomb Guardians shooting phase.
    name_i18n:
      en: Horrebe's Curse of the Mummy
      es: Maldición de la momia de Horrebe
  - id: spell.mortuary-cult-scrolls.tawosrets-scroll-of-tomb-dust
    roll: '3'
    name: Tawosret's Scroll of Tomb Dust
    difficulty: 7
    summary: The Liche Priest commands the sand around him to assault a single warrior within 12". The
      warrior is automatically knocked down as he chokes on the sand. This spell only affects a living
      model.
    name_i18n:
      en: Tawosret's Scroll of Tomb Dust
      es: Pergamino de Polvo de Tumba de Tawosret
  - id: spell.mortuary-cult-scrolls.neferres-scroll-of-quaking-horror
    roll: '4'
    name: Neferre's Scroll of Quaking Horror
    difficulty: 7
    summary: The model within 12" must pass a Leadership test or flee 2D6" directly away from the Liche
      Priest, continuing to flee in each movement phase until it makes a successful Rally test in the
      recovery phase. This spell has no effect on Undead models or models immune to psychology.
    name_i18n:
      en: Neferre's Scroll of Quaking Horror
      es: Pergamino de Horror Tembloroso de Neferre
  - id: spell.mortuary-cult-scrolls.merneptahs-scroll-of-the-scarab-song
    roll: '5'
    name: Merneptah's Scroll of the Scarab Song
    difficulty: 7
    summary: A single model within 8" of the Liche Priest suffers 2D6 Strength 1 hits. In addition, that
      model may not be shot at for the rest of the Tomb Guardians shooting phase, nor fight or be fought
      in hand-to-hand combat. If already in hand-to-hand combat, move it 1" away. Unless it suffers an
      actual injury, the warrior counts as having just stood up in the next turn.
    name_i18n:
      en: Merneptah's Scroll of the Scarab Song
      es: Pergamino del Canto del Escarabajo de Merneptah
  - id: spell.mortuary-cult-scrolls.djedres-summonation-of-the-vengeful-dead
    roll: '6'
    name: Djedre's summonation of the Vengeful Dead
    difficulty: 5
    summary: The Liche Priest may re-animate a Skeleton Soldier that went out of action during the last
      turn. Place the model anywhere within 6" of the Liche Priest, but not straight into hand-to-hand
      combat with an enemy model.
    name_i18n:
      en: Djedre's summonation of the Vengeful Dead
      es: Invocación de Djedre de los Muertos Vengativos
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Magic / Mortuary Cult Scrolls
    url: https://mordheimer.net/docs/magic/mortuary-cult-scrolls
  name_i18n:
    en: Mortuary Cult Scrolls
    es: Pergaminos del culto funerario
- id: lore.waaagh-magic
  name: Waaaagh! Magic
  note: Used by the Orc Mob Shaman and the Night Goblins Shaman.
  spells:
  - id: spell.waaagh-magic.ledz-go
    roll: '1'
    name: Led'z go
    difficulty: 9
    summary: Any Orc or Goblin within 4" of the Shaman automatically strikes first in hand-to-hand combat
      regardless of other circumstances. The spell lasts until the caster is knocked down, stunned or
      taken out of action.
    name_i18n:
      en: Led'z go
      es: ¡Marchando!
  - id: spell.waaagh-magic.oi-gerroff
    roll: '2'
    name: Oi! Gerroff!
    difficulty: 7
    summary: Range 8". Moves any enemy model within range D6" directly away from the Shaman. If the target
      collides with another model or a building, both suffer 1 S3 hit. May not be cast on models in hand-to-hand
      combat.
    name_i18n:
      en: Oi! Gerroff!
      es: ¡Oye! ¡Suéltalo!
  - id: spell.waaagh-magic.zzap
    roll: '3'
    name: Zzap!
    difficulty: 9
    summary: Range 12". Causes D3 S4 hits on the closest enemy target, with no armour saves allowed.
    name_i18n:
      en: Zzap!
      es: ¡Zas!
  - id: spell.waaagh-magic.fooled-ya
    roll: '4'
    name: Fooled Ya!
    difficulty: 6
    summary: No enemy may charge the Shaman during their next turn. If the Shaman is engaged in hand-to-hand
      combat he may immediately move 4" away.
    name_i18n:
      en: Fooled Ya!
      es: ¡Te engañé!
  - id: spell.waaagh-magic.clubba
    roll: '5'
    name: Clubba
    difficulty: 7
    summary: The ectoplasmic club counts as a normal club with a +2 Strength bonus and gives the Shaman
      +1 attack as well. The spell lasts until the Shaman suffers a wound.
    name_i18n:
      en: Clubba
      es: Porra
  - id: spell.waaagh-magic.fire-of-gork
    roll: '6'
    name: Fire of Gork
    difficulty: 8
    summary: Range 12". Each of the two bolts causes D3 S3 hits; the bolts can be fired both at the closest
      enemy target or split between the two closest enemy targets.
    name_i18n:
      en: Fire of Gork
      es: Fuego de Gork
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Magic / Waaaagh! Magic
    url: https://mordheimer.net/docs/magic/waaaagh
  name_i18n:
    en: Waaaagh! Magic
    es: Magia ¡Waaagh!
- id: lore.lizardman-magic
  name: Lizardman Magic
  note: Used by the Lizardmen Skink Priest. Lizardmen spells work like the Prayers of Sigmar and may be
    used even if the Skink Priest is wearing armour.
  spells:
  - id: spell.lizardman-magic.chotecs-wrath
    roll: '1'
    name: Chotec's Wrath
    difficulty: 8
    summary: A lightning bolt strikes the closest enemy model within 10" of the Skink Priest, causing
      a single Strength 5 hit. Add +1 to the Strength and +1 to the roll on the injury table if the model
      is wearing armour.
    name_i18n:
      en: Chotec's Wrath
      es: Ira de Chotec
  - id: spell.lizardman-magic.sotecs-blessing
    roll: '2'
    name: Sotec's Blessing
    difficulty: 7
    summary: This spell may be cast on a single model within 6" of the Skink Priest or on himself. Roll
      a D6; on 1-2 the target gains +1 BS or +1 to hit in close combat, on 3-4 Toughness +1, on 5-6 Movement
      and Initiative +1. The effects remain in play until the Priest or the model is stunned or taken
      out of action. Only a single model may be affected at any given time.
    name_i18n:
      en: Sotec's Blessing
      es: Bendición de Sotec
  - id: spell.lizardman-magic.huanchis-stealth
    roll: '3'
    name: Huanchi's Stealth
    difficulty: 7
    summary: The spell affects all Skinks within 6" of the Skink Priest, including himself, and allows
      any model in cover to immediately go into hiding. A model may go into hiding even if it ran in the
      movement phase or has already shot with a missile weapon.
    name_i18n:
      en: Huanchi's Stealth
      es: Sigilo de Huanchi
  - id: spell.lizardman-magic.the-old-ones-protection
    roll: '4'
    name: The Old Ones' Protection
    difficulty: 6
    summary: The Skink Priest and any Lizardmen within 4" of him gain a save of 4+ against the effects
      of spells or prayers. The spell remains in play until the Skink Priest is taken out of action.
    name_i18n:
      en: The Old Ones' Protection
      es: La Protección de los Antiguos
  - id: spell.lizardman-magic.tincis-rage
    roll: '5'
    name: Tinci's Rage
    difficulty: 8
    summary: A single Lizardman within 6" of the Skink Priest, or the Priest himself, is overtaken by
      rage, follows the rules for Frenzy and gains +1 Strength. The spell remains in play until the Priest
      or the model is stunned or taken out of action; at the beginning of the turn the Skink Priest must
      pass a Leadership roll to keep it going. Only a single model may be affected at any given time.
    name_i18n:
      en: Tinci's Rage
      es: Ira de Tinci
  - id: spell.lizardman-magic.itzls-speed
    roll: '6'
    name: Itzl's Speed
    difficulty: 7
    summary: A single Lizardman within 6" of the Skink Priest, or the Priest himself, may make an additional
      sprint of up to 4". This counts as running and a model may not move if it has already fired a missile
      weapon. It may not charge with this extra move.
    name_i18n:
      en: Itzl's Speed
      es: Velocidad de Itzl
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Magic / Lizardman Magic
    url: https://mordheimer.net/docs/magic/lizardmen-magic
  name_i18n:
    en: Lizardman Magic
    es: Magia de los hombres lagarto
- id: lore.dark-magic
  name: Dark Magic
  note: Used by the Dark Mage hired sword. Not indexed in the site's magic section; transcribed from the
    Dark Mage entry (Letters of the Damned 6).
  spells:
  - id: spell.dark-magic.banishment
    roll: '1'
    name: Banishment
    difficulty: 8
    summary: All Undead within 4\" of the Dark Mage must take an unmodified Leadership test or suffer
      a Strength 4 hit.
    name_i18n:
      en: Banishment
      es: Destierro
  - id: spell.dark-magic.soul-render
    roll: '2'
    name: Soul Render
    difficulty: 8
    summary: Soul Render is a magic missile spell with a range of 18 inches. If successfully cast, the
      spell causes D3 Strength 3 hits.
    name_i18n:
      en: Soul Render
      es: Desgarrador de almas
  - id: spell.dark-magic.shade-mount
    roll: '3'
    name: Shade Mount
    difficulty: 8
    summary: May be cast on the wizard himself or a Hero within 8 inches. Upon a successful casting the
      model may immediately fly up to 12 inches; moving into base-to-base contact counts as a charge.
    name_i18n:
      en: Shade Mount
      es: Montura de sombra
  - id: spell.dark-magic.jozuns-decay
    roll: '4'
    name: Jozun's Decay
    difficulty: 9
    summary: Range 12 inches. The target must pass a Leadership test or suffer a one-point reduction to
      its Toughness. Each Recovery phase the model must pass a Leadership test or lose a further point;
      at Toughness 0 it is removed from the game. A model may not be targeted more than once per game.
    name_i18n:
      en: Jozun's Decay
      es: Decadencia de Jozun
  - id: spell.dark-magic.cowel-of-pain
    roll: '5'
    name: Cowel of Pain
    difficulty: 6
    summary: Until the wizard's next magic phase he cannot be Stunned; treat 3-4 results as Knocked Down
      instead.
    name_i18n:
      en: Cowel of Pain
      es: Capucha del dolor
  - id: spell.dark-magic.doom-and-dark
    roll: '6'
    name: Doom & Dark
    difficulty: 7
    summary: Any model within 2 inches of the Dark Mage must take an immediate All Alone test, even if
      in close combat. Should a model flee from close combat, free strikes occur as normal.
    name_i18n:
      en: Doom & Dark
      es: Perdición y oscuridad
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Hired Swords / Grade 2A / Dark Mage (Dark Magic spell list)
    url: https://mordheimer.net/docs/campaigns/hired-swords/grade-2a
  name_i18n:
    en: Dark Magic
    es: Magia oscura
