lores:
- id: lore.lesser-magic
  name: Lesser Magic
  note: Used by human warlocks.
  spells:
  - id: spell.lesser-magic.fires-of-uzhul
    roll: '1'
    name: Fires of U'Zhul
    difficulty: 7
    summary: The fireball has a range of 18" and causes one Strength 4 hit. It strikes the first model
      in its path. Armour saves are taken as normal (ie, with -1 modifier).
    name_i18n:
      en: Fires of U'Zhul
      es: Fuegos de U'Zhul
  - id: spell.lesser-magic.flight-of-zimmeran
    roll: '2'
    name: Flight of Zimmeran
    difficulty: 7
    summary: The wizard may immediately move anywhere within 12", including into base contact with an
      enemy, in which case he counts as charging. If he engages a fleeing enemy he will score 1 automatic
      hit and then his opponent will flee again (if he survives).
    name_i18n:
      en: Flight of Zimmeran
      es: Vuelo de Zimmeran
  - id: spell.lesser-magic.dread-of-aramar
    roll: '3'
    name: Dread of Aramar
    difficulty: 7
    summary: A single model within 12" must pass a Leadership test or flee 2D6" directly away from him.
      Does not affect Undead or any model immune to fear.
    name_i18n:
      en: Dread of Aramar
      es: Pavor de Aramar
  - id: spell.lesser-magic.silver-arrows-of-arha
    roll: '4'
    name: Silver Arrows of Arha
    difficulty: 7
    summary: Cannot be cast in hand-to-hand combat. Summons D6+2 arrows which may be shot against one
      enemy model at a range of 24". Use the wizard's Ballistic Skill, ignoring movement, range and cover
      penalties. Each arrow causes one S3 hit.
    name_i18n:
      en: Silver Arrows of Arha
      es: Flechas de plata de Arha
  - id: spell.lesser-magic.luck-of-shemtek
    roll: '5'
    name: Luck of Shemtek
    difficulty: 6
    summary: The wizard may re-roll all his failed dice rolls; the second results stand. The effect lasts
      until the beginning of his own next turn.
    name_i18n:
      en: Luck of Shemtek
      es: Suerte de Shemtek
  - id: spell.lesser-magic.sword-of-rezhebel
    roll: '6'
    name: Sword of Rezhebel
    difficulty: 8
    summary: The sword gives the wizard +1 Attack, +2 Strength and +2 Weapon Skill. Take a Leadership
      test at the beginning of each of the wizard's own turns; if the test fails, the sword disappears.
    name_i18n:
      en: Sword of Rezhebel
      es: Espada de Rezhebel
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Magic / Lesser Magic
    url: https://mordheimer.net/docs/magic/lesser-magic
  name_i18n:
    en: Lesser Magic
    es: Magia menor
- id: lore.necromancy
  name: Necromancy
  note: Used by the Undead Necromancer.
  spells:
  - id: spell.necromancy.lifestealer
    roll: '1'
    name: Lifestealer
    difficulty: 10
    summary: Choose a single model within 6". The target suffers a wound (no save allowed) and the Necromancer
      gains an extra wound for the duration of the battle. Will not affect the Possessed or any Undead
      models.
    name_i18n:
      en: Lifestealer
      es: Robavidas
  - id: spell.necromancy.re-animation
    roll: '2'
    name: Re-Animation
    difficulty: 5
    summary: One Zombie that went out of action during the last hand-to-hand combat or shooting phase
      immediately returns to the battle, placed within 6" of the Necromancer and not straight into hand-to-hand
      combat.
    name_i18n:
      en: Re-Animation
      es: Reanimación
  - id: spell.necromancy.death-vision
    roll: '3'
    name: Death vision
    difficulty: 6
    summary: The Necromancer causes fear in his enemies for the duration of the battle.
    name_i18n:
      en: Death vision
      es: Visión de la muerte
  - id: spell.necromancy.spell-of-doom
    roll: '4'
    name: Spell of Doom
    difficulty: 9
    summary: Choose one enemy model within 12". The model must roll equal to or less than his Strength
      on a D6 or be struck; if he fails, roll on the Injury table.
    name_i18n:
      en: Spell of Doom
      es: Hechizo de perdición
  - id: spell.necromancy.call-of-vanhel
    roll: '5'
    name: Call of Vanhel
    difficulty: 6
    summary: A single Zombie or Dire Wolf within 6" may immediately move again up to its maximum Movement
      distance. If this moves them into base contact with an enemy model, they count as charging.
    name_i18n:
      en: Call of Vanhel
      es: Llamado de Vanhel
  - id: spell.necromancy.spell-of-awakening
    roll: '6'
    name: Spell of Awakening
    difficulty: auto
    summary: If an enemy Hero is killed (11-15 on the Serious Injury chart), the Necromancer may raise
      him to fight as a Zombie. The dead Hero retains his characteristics and weapons and armour but may
      not use other equipment or skills, may not run, counts as a Henchman group on his own, and may not
      gain further experience. Always succeeds.
    name_i18n:
      en: Spell of Awakening
      es: Hechizo de Despertar
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Magic / Necromancy
    url: https://mordheimer.net/docs/magic/necromancy
  name_i18n:
    en: Necromancy
    es: Nigromancia
- id: lore.charms-and-hexes
  name: Charms & Hexes
  note: Used by Witches.
  spells:
  - id: spell.charms-and-hexes.scry
    roll: '1'
    name: Scry
    difficulty: 6
    summary: For the duration of the turn one hero or henchman may re-roll D3 dice rolls and add +1 or
      -1 to the result.
    name_i18n:
      en: Scry
      es: Adivinar
  - id: spell.charms-and-hexes.curse
    roll: '2'
    name: Curse
    difficulty: 6
    summary: One enemy model within 12" must re-roll all successful dice rolls for the duration of this
      and their next turn.
    name_i18n:
      en: Curse
      es: Maldición
  - id: spell.charms-and-hexes.dust-of-the-blind
    roll: '3'
    name: Dust of the Blind
    difficulty: 9
    summary: "One enemy model within 16\" is struck blind: may not shoot, charge\n      or run, fights\
      \ at half Weapon Skill and moves in a random direction at the\n      start of its turn. Lasts until\
      \ the Witch casts another spell or moves."
    name_i18n:
      en: Dust of the Blind
      es: Polvo de los ciegos
  - id: spell.charms-and-hexes.age-of-stone
    roll: '4'
    name: Age of Stone
    difficulty: 8
    summary: One enemy model within 12" has all of its characteristics reduced by -1 for the duration
      of this and their next turn.
    name_i18n:
      en: Age of Stone
      es: Era de piedra
  - id: spell.charms-and-hexes.warriors-bane
    roll: '5'
    name: Warrior's Bane
    difficulty: 7
    summary: "One enemy model within 18\" cannot use any weapons: unable to\n      shoot and counts as\
      \ fighting with fists in hand-to-hand combat. Lasts\n      for the duration of this and their next\
      \ turn."
    name_i18n:
      en: Warrior's Bane
      es: Flaqueza del guerrero
  - id: spell.charms-and-hexes.cure
    roll: '6'
    name: Cure
    difficulty: 6
    summary: All friendly models within 6" have a single wound healed; stunned or knocked down models
      may immediately stand up.
    name_i18n:
      en: Cure
      es: Curar
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Magic / Charms & Hexes
    url: https://mordheimer.net/docs/magic/charms-and-hexes
  name_i18n:
    en: Charms & Hexes
    es: Encantamientos y maldiciones
- id: lore.arabian-elemental-magic
  name: Arabian Elemental Magic
  note: Used by Arabian Mystics and Khar-mel The Djinn.
  spells:
  - id: spell.arabian-elemental-magic.riding-the-wind
    roll: '1'
    name: Riding the Wind
    difficulty: 6
    summary: Cast at the beginning of the Movement phase. The caster may move up to 12+D6" anywhere, ignoring
      intervening terrain. May not move into base contact with an enemy; may shoot as normal with a -1
      penalty.
    name_i18n:
      en: Riding the Wind
      es: Cabalgando el viento
  - id: spell.arabian-elemental-magic.skin-of-stone
    roll: '2'
    name: Skin of Stone
    difficulty: 7
    summary: Cast on any friendly warrior within 6". The target gains +2 to his armour save but suffers
      -1 Initiative. May be maintained each turn while within 6" of the caster and the caster passes a
      Difficulty test.
    name_i18n:
      en: Skin of Stone
      es: Piel de piedra
  - id: spell.arabian-elemental-magic.burning-hand
    roll: '3'
    name: Burning Hand
    difficulty: 8
    summary: Cast at the beginning of the Combat phase. The caster may sacrifice all normal attacks to
      make one hand-to-hand attack at Strength 5 causing 2 wounds. On a 4+ the target is set on fire.
      Lasts one round only.
    name_i18n:
      en: Burning Hand
      es: Mano ardiente
  - id: spell.arabian-elemental-magic.quicksand
    roll: '4'
    name: Quicksand
    difficulty: 6
    summary: Cast at any warrior within 6". Water floods a 3" area around the target until the beginning
      of the caster's next Recovery phase. All warriors within the quicksand must pass a Strength test
      or be unable to move; warriors in combat cannot attack but may defend.
    name_i18n:
      en: Quicksand
      es: Arenas movedizas
  - id: spell.arabian-elemental-magic.storm-of-magic
    roll: '5'
    name: Storm of Magic
    difficulty: 9
    summary: Target any warrior within 12". The target takes one S5 hit. Armour saves may be taken as
      normal.
    name_i18n:
      en: Storm of Magic
      es: Tormenta de magia
  - id: spell.arabian-elemental-magic.blessing-of-the-elements
    roll: '6'
    name: Blessing of the Elements
    difficulty: 6
    summary: In the post-battle sequence, the player may re-roll any one dice or modify one dice by +1/-1.
      If the caster was taken out of action, this spell may not be cast.
    name_i18n:
      en: Blessing of the Elements
      es: Bendición de los elementos
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Magic / Arabian Elemental Magic
    url: https://mordheimer.net/docs/magic/arabian-elemental-magic
  name_i18n:
    en: Arabian Elemental Magic
    es: Magia elemental de Araby
- id: lore.prayers-of-sigmar
  name: Prayers of Sigmar
  note: Used by Witch Hunter Warrior Priests and Sigmarite Matriarchs. A warrior may use the divine power
    of Sigmar while wearing armour. Prayers of Sigmar are not regarded as spells, so any special protection
    against spells does not affect them.
  spells:
  - id: spell.prayers-of-sigmar.the-hammer-of-sigmar
    roll: '1'
    name: The Hammer of Sigmar
    difficulty: 7
    summary: The wielder gains +2 Strength in hand-to-hand combat and all hits he inflicts cause double
      damage. The Priest must test each shooting phase he wants to use the Hammer.
    name_i18n:
      en: The Hammer of Sigmar
      es: El Martillo de Sigmar
  - id: spell.prayers-of-sigmar.hearts-of-steel
    roll: '2'
    name: Hearts of Steel
    difficulty: 8
    summary: Allied warriors within 8" become immune to fear and all alone tests; the whole warband gains
      +1 to any Rout tests. Lasts until the caster is knocked down, stunned or put out of action. Not
      cumulative.
    name_i18n:
      en: Hearts of Steel
      es: Corações de acero
  - id: spell.prayers-of-sigmar.soulfire
    roll: '3'
    name: Soulfire
    difficulty: 9
    summary: All enemy models within 4" suffer a Strength 3 hit with no armour saves. Undead and Possessed
      models in range suffer a Strength 5 hit instead.
    name_i18n:
      en: Soulfire
      es: Fuego de almas
  - id: spell.prayers-of-sigmar.shield-of-faith
    roll: '4'
    name: Shield of Faith
    difficulty: 6
    summary: The Priest is immune to all spells. Roll at the beginning of each turn in the recovery phase;
      on a roll of 1 or 2 the shield disappears.
    name_i18n:
      en: Shield of Faith
      es: Escudo de fe
  - id: spell.prayers-of-sigmar.healing-hand
    roll: '5'
    name: Healing Hand
    difficulty: 5
    summary: Any one model within 2" (including himself) is restored to its full quota of Wounds; stunned
      or knocked down friendly models within 2" stand up.
    name_i18n:
      en: Healing Hand
      es: Mano sanadora
  - id: spell.prayers-of-sigmar.armour-of-righteousness
    roll: '6'
    name: Armour of Righteousness
    difficulty: 9
    summary: The Priest has an armour save of 2+ which replaces his normal save, causes fear and is immune
      to fear. Lasts until the beginning of the Priest's next Shooting phase.
    name_i18n:
      en: Armour of Righteousness
      es: Armadura de la rectitud
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Magic / Prayers of Sigmar
    url: https://mordheimer.net/docs/magic/prayers-of-sigmar
  name_i18n:
    en: Prayers of Sigmar
    es: Plegarias de Sigmar
- id: lore.prayers-of-ulric
  name: Prayers of Ulric
  note: Used by the Wolf Priest of Ulric. Wolf Priests may use a wolf cloak and still chant these prayers.
    They are prayers, not spells, so special protection against spells does not affect them.
  spells:
  - id: spell.prayers-of-ulric.snow-squall
    roll: '1'
    name: Snow Squall
    difficulty: 6
    summary: All enemy models in hand-to-hand combat with the priest are at -1 to hit. Lasts for the duration
      of the hand-to-hand combat.
    name_i18n:
      en: Snow Squall
      es: Chubasco de nieve
  - id: spell.prayers-of-ulric.hammerschlag
    roll: '2'
    name: Hammerschlag
    difficulty: 10
    summary: The Wolf Priest calls down a hammer blow from Ulric on any model within 6". That model suffers
      an S4 attack from an enormous ethereal hammer, including the concussion special rule.
    name_i18n:
      en: Hammerschlag
      es: Golpe de martillo
  - id: spell.prayers-of-ulric.bloodlust
    roll: '3'
    name: Bloodlust
    difficulty: 7
    summary: All attacks are at S+2 and he scores a critical hit on a 5-6. The Wolf Priest must test each
      turn to see if the prayer remains in effect.
    name_i18n:
      en: Bloodlust
      es: Sed de sangre
  - id: spell.prayers-of-ulric.wolfs-hunger
    roll: '4'
    name: Wolf's Hunger
    difficulty: 7
    summary: One member of the warband (priest's choice) is thrown into a Frenzy.
    name_i18n:
      en: Wolf's Hunger
      es: Hambre del lobo
  - id: spell.prayers-of-ulric.ulrics-howl
    roll: '5'
    name: Ulric's Howl
    difficulty: 10
    summary: For the duration of the battle, all members of the priest's warband are immune to Fear and
      all alone tests; all Rout tests are at +1.
    name_i18n:
      en: Ulric's Howl
      es: Aullido de Ulric
  - id: spell.prayers-of-ulric.call-of-ulric
    roll: '6'
    name: Call of Ulric
    difficulty: 10
    summary: The Wolf Priest's body re-shapes into a huge wolf (M6 WS4 BS0 S4 T4 W1 I5 A2 Ld6). While
      in wolf form he may only attack as a wolf. Each shooting phase he may test Leadership to regain
      human form; if still in wolf form at the end of the battle he gets one last chance, otherwise he
      remains a wolf forever (still a Hero, skills only from the Speed Table except Scale Sheer Surfaces;
      maximums M7 WS6 BS0 S4 T4 W3 I7 A3 Ld7).
    name_i18n:
      en: Call of Ulric
      es: Llamado de Ulric
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Magic / Prayers of Ulric
    url: https://mordheimer.net/docs/magic/prayers-of-ulric
  name_i18n:
    en: Prayers of Ulric
    es: Plegarias de Ulric
- id: lore.chaos-rituals
  name: Chaos Rituals
  note: Used by Magisters of the Cult of the Possessed, Daemons, Beastmen, and Marauders of Chaos seers
    with the Mark of Chaos Undivided.
  spells:
  - id: spell.chaos-rituals.vision-of-torment
    roll: '1'
    name: Vision of Torment
    difficulty: 10
    summary: Range 6", must be cast on the closest enemy model (or one in base contact in hand-to-hand
      combat). The affected model is immediately stunned; if it cannot be stunned it is knocked down instead.
    name_i18n:
      en: Vision of Torment
      es: Visión de tormento
  - id: spell.chaos-rituals.eye-of-god
    roll: '2'
    name: Eye of God
    difficulty: 7
    summary: 'Usable successfully only once per battle. Choose any single model

      within 6", friend or foe, and roll a D6: 1 = taken out of action (no

      Serious Injury roll); 2-5 = +1 to any one characteristic for this battle;

      6 = +1 to all characteristics for the duration of the battle.'
    name_i18n:
      en: Eye of God
      es: Ojo de Dios
  - id: spell.chaos-rituals.dark-blood
    roll: '3'
    name: Dark Blood
    difficulty: 8
    summary: Range 8", causes D3 S5 hits and strikes the first model in its path. After using this spell
      the Chaos Mage rolls on the Injury table for himself, treating the out of action result as stunned
      instead.
    name_i18n:
      en: Dark Blood
      es: Sangre oscura
  - id: spell.chaos-rituals.lure-of-chaos
    roll: '4'
    name: Lure of Chaos
    difficulty: 9
    summary: Range 12", must be cast on the closest enemy model. Roll a D6 and add the Chaos Mage's Leadership;
      then roll a D6 and add the target's Leadership. If the Chaos Mage beats the target, he gains control
      of the model until it passes a Leadership test in its own recovery phase.
    name_i18n:
      en: Lure of Chaos
      es: Llamado del caos
  - id: spell.chaos-rituals.wings-of-darkness
    roll: '5'
    name: Wings of Darkness
    difficulty: 7
    summary: The Chaos Mage may immediately move anywhere within 12", including into base contact with
      an enemy, in which case he counts as charging.
    name_i18n:
      en: Wings of Darkness
      es: Alas de oscuridad
  - id: spell.chaos-rituals.word-of-pain
    roll: '6'
    name: Word of Pain
    difficulty: 7
    summary: All models within 3" of the Chaos Mage, friend or foe, suffer one S3 hit with no armour saves
      allowed.
    name_i18n:
      en: Word of Pain
      es: Palabra de dolor
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Magic / Chaos Rituals
    url: https://mordheimer.net/docs/magic/chaos-rituals
  name_i18n:
    en: Chaos Rituals
    es: Rituales del Caos
- id: lore.norse-runes
  name: Norse Runes
  note: Used by Norse Shamans.
  spells:
  - id: spell.norse-runes.howl-of-the-north
    roll: '1'
    name: Howl of the North
    difficulty: 9
    summary: The Shaman is immune to all missile fire. Roll a dice in the Shaman's recovery phase; on
      a 1 or 2 the winds dissipate.
    name_i18n:
      en: Howl of the North
      es: Aullido del norte
  - id: spell.norse-runes.angvars-fury
    roll: '2'
    name: Angvar's Fury
    difficulty: 7
    summary: All warriors within 8" of the Shaman gain +1 to hit in hand-to-hand combat against the opposing
      warband. Lasts till the start of the Norse player's next turn.
    name_i18n:
      en: Angvar's Fury
      es: Furia de Angvar
  - id: spell.norse-runes.elviks-cold-spear
    roll: '3'
    name: Elvek's Cold Spear
    difficulty: 7
    summary: A razor sharp icicle with a range of 18" causes one S4 hit and strikes the first model in
      its path. Normal armour saves apply.
    name_i18n:
      en: Elvek's Cold Spear
      es: Lanza gélida de Elvek
  - id: spell.norse-runes.gift-of-the-fates
    roll: '4'
    name: Gift of the Fates
    difficulty: 7
    summary: The Shaman may adjust one die roll by +1/-1 between a successful casting of this rune and
      his next recovery phase. A 'to wound' roll adjusted to or from 6 will not cause a critical.
    name_i18n:
      en: Gift of the Fates
      es: Don de las Parcas
  - id: spell.norse-runes.kiss-of-frost
    roll: '5'
    name: Kiss of Frost
    difficulty: 6
    summary: A single model within 12" must pass an Initiative test or be knocked down.
    name_i18n:
      en: Kiss of Frost
      es: Beso de escarcha
  - id: spell.norse-runes.bears-might
    roll: '6'
    name: Bear's Might
    difficulty: 9
    summary: The Shaman gains +1 Attack, +2 Strength, +2 Toughness and -2 Initiative (minimum 1). Take
      a Leadership test at the beginning of each turn; if it fails, Bear's Might drains away. Can only
      be cast successfully once per game.
    name_i18n:
      en: Bear's Might
      es: Poder del oso
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Magic / Norse Runes
    url: https://mordheimer.net/docs/magic/norse-runes
  name_i18n:
    en: Norse Runes
    es: Runas norse
- id: lore.magic-of-the-horned-rat
  name: Magic of the Horned Rat
  note: Used by Skaven Sorcerers (Clan Eshin and Clan Pestilens).
  spells:
  - id: spell.magic-of-the-horned-rat.warpfire
    roll: '1'
    name: Warpfire
    difficulty: 8
    summary: Range 8", hitting the first model in its path. Causes D3 Strength 4 hits on its target and
      one Strength 3 hit on each model within 2" of the target.
    name_i18n:
      en: Warpfire
      es: Fuego de disformidad
  - id: spell.magic-of-the-horned-rat.children-of-the-horned-rat
    roll: '2'
    name: Children of the Horned Rat
    difficulty: auto
    summary: Must be used before the game and only once. Summons D3 Giant Rats placed within 6" of the
      Sorcerer. The rats disappear after the battle and do not count towards the maximum size of the warband.
    name_i18n:
      en: Children of the Horned Rat
      es: Hijos del Rata Cuernudo
  - id: spell.magic-of-the-horned-rat.gnawdoom
    roll: '3'
    name: Gnawdoom
    difficulty: 7
    summary: Causes 2D6 Strength 1 hits on a single model within 8" of the caster.
    name_i18n:
      en: Gnawdoom
      es: Gnawdoom
  - id: spell.magic-of-the-horned-rat.black-fury
    roll: '4'
    name: Black Fury
    difficulty: 8
    summary: The Sorcerer may immediately charge any enemy model within 12" (ignoring terrain and interposing
      models) and gains 2 extra Attacks and +1 Strength during this turn's hand-to-hand combat phase only.
    name_i18n:
      en: Black Fury
      es: Furia negra
  - id: spell.magic-of-the-horned-rat.eye-of-the-warp
    roll: '5'
    name: Eye of the Warp
    difficulty: 8
    summary: All standing models in base contact with the Sorcerer must take an immediate Leadership test.
      On failure each suffers a Strength 3 hit and runs 2D6" directly away from the Sorcerer.
    name_i18n:
      en: Eye of the Warp
      es: Ojo de la disformidad
  - id: spell.magic-of-the-horned-rat.sorcerers-curse
    roll: '6'
    name: Sorcerer's Curse
    difficulty: 6
    summary: Range 12". The target must re-roll any successful armour saves and to hit rolls during the
      Skaven hand-to-hand phase and his own next shooting and hand-to-hand combat phases.
    name_i18n:
      en: Sorcerer's Curse
      es: Maldición del hechicero
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Magic / Magic of the Horned Rat
    url: https://mordheimer.net/docs/magic/magic-of-the-horned-rat
  name_i18n:
    en: Magic of the Horned Rat
    es: Magia del Rata Cuernudo
- id: lore.lore-of-darkness
  name: Lore of Darkness
  note: Used by the Dark Emissary.
  spells:
  - id: spell.lore-of-darkness.bolt-of-dark-light
    roll: '1'
    name: Bolt of Dark Light
    difficulty: 7
    summary: The Dark Emissary conjures a bolt of malign power. The bolt has a range of 12" and causes
      a single Strength 5 hit against the first model in its path.
    name_i18n:
      en: Bolt of Dark Light
      es: Rayo de luz oscura
  - id: spell.lore-of-darkness.betrayal-in-death
    roll: '2'
    name: Betrayal in Death
    difficulty: 8
    summary: Affects all enemy models slain in the shooting phase or close combat, lasting until the start
      of the caster's next turn. The slain reanimate and attack their comrades; if not in combat the model
      shoots if able, or charges if it has no missile weapons; if in combat it makes only a single attack,
      then falls dead once more.
    name_i18n:
      en: Betrayal in Death
      es: Traición en la muerte
  - id: spell.lore-of-darkness.nightmare
    roll: '3'
    name: Nightmare
    difficulty: 7
    summary: Cast on an enemy model within 18". The model takes an immediate fear test as if charged by
      a fear-causing enemy; if failed it flees 2D6" away from the Dark Emissary.
    name_i18n:
      en: Nightmare
      es: Pesadilla
  - id: spell.lore-of-darkness.curse-of-the-dark-master
    roll: '4'
    name: Curse of the Dark Master
    difficulty: 8
    summary: Cast on a single model within 24". All of that model's rolls to hit for both shooting and
      combat are reduced by -1 until the start of the caster's next turn.
    name_i18n:
      en: Curse of the Dark Master
      es: Maldición del Señor Oscuro
  - id: spell.lore-of-darkness.fog-of-death
    roll: '5'
    name: Fog of Death
    difficulty: 10
    summary: A deep and impenetrable fog cloaks the entire battlefield. Affects every model on the board
      except the Dark Emissary; enemies are affected on a roll of 4+, friendly models on a 6+, all suffering
      a Strength 2 hit. The fog lasts until the start of the caster's next turn and reduces line of sight
      to 3D6" for all warriors, affecting shooting, charging and so on.
    name_i18n:
      en: Fog of Death
      es: Niebla de muerte
  - id: spell.lore-of-darkness.coils-of-the-serpent
    roll: '6'
    name: Coils of the Serpent
    difficulty: 10
    summary: Cast on a single enemy model within 6". The model takes an immediate toughness test; if failed
      it is crushed to death and out of action. No saves of any kind protect against this magic.
    name_i18n:
      en: Coils of the Serpent
      es: Espiras de la serpiente
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Magic / Lore of Darkness
    url: https://mordheimer.net/docs/magic/lore-of-darkness
  name_i18n:
    en: Lore of Darkness
    es: Sabiduría de la oscuridad
- id: lore.lore-of-light
  name: Lore of Light
  note: Used by the Truthsayer.
  spells:
  - id: spell.lore-of-light.wings-of-fate
    roll: '1'
    name: Wings of Fate
    difficulty: 6
    summary: Conjures a flock of birds to sweep down and attack the enemy. The flock has a range of 18"
      and may attack any model within this range of the Truthsayer; the enemy model suffers D3 Strength
      2 hits.
    name_i18n:
      en: Wings of Fate
      es: Alas del destino
  - id: spell.lore-of-light.light-of-battle
    roll: '2'
    name: Light of Battle
    difficulty: 6
    summary: Cast on a friendly model within 12". The model has an additional save of 5+ against all attacks
      until the start of the Truthsayer's next turn.
    name_i18n:
      en: Light of Battle
      es: Luz de batalla
  - id: spell.lore-of-light.gift-of-life
    roll: '3'
    name: Gift of Life
    difficulty: 9
    summary: Cast on a friendly model slain in the previous enemy turn. The model is immediately restored
      to 1 wound remaining and placed as accurately as possible where it fell.
    name_i18n:
      en: Gift of Life
      es: Don de vida
  - id: spell.lore-of-light.blessing-of-valour
    roll: '4'
    name: Blessing of Valour
    difficulty: 8
    summary: Cast on a single friendly model within 24". The model gains +1 to all hit rolls in close
      combat for the duration of the turn.
    name_i18n:
      en: Blessing of Valour
      es: Bendición de valentía
  - id: spell.lore-of-light.boon-of-courage
    roll: '5'
    name: Boon of Courage
    difficulty: 8
    summary: Affects all friendly models within 12". The models are completely immune to the effects of
      psychology and all alone tests until the end of the Truthsayer's next turn.
    name_i18n:
      en: Boon of Courage
      es: Don de coraje
  - id: spell.lore-of-light.voice-of-command
    roll: '6'
    name: Voice of Command
    difficulty: 9
    summary: Affects one model within 24" of the Truthsayer. The model may do nothing in its next turn
      other than defend itself in combat; it may not move, shoot, attack or perform any other action.
    name_i18n:
      en: Voice of Command
      es: Voz de mando
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Magic / Lore of Light
    url: https://mordheimer.net/docs/magic/lore-of-light
  name_i18n:
    en: Lore of Light
    es: Sabiduría de la luz
- id: lore.rituals-of-hashut
  name: Rituals of Hashut
  note: Used by Black Dwarfs Sorcerers. The Sorcerer starts with the Sacrificial Ritual (roll 0); all
    other rituals are determined by a D6 roll.
  spells:
  - id: spell.rituals-of-hashut.sacrificial-ritual
    roll: '0'
    name: Sacrificial Ritual
    difficulty: 10
    summary: The Sorcerer must be in contact with an Engine of Chaos to cast. He removes one captive model
      from the Engine of Chaos and its starting warband roster. He may sacrifice additional captives before
      rolling to lower the difficulty by 1 per sacrifice. The Sorcerer gains +D3 Experience.
    name_i18n:
      en: Sacrificial Ritual
      es: Ritual de sacrificio
  - id: spell.rituals-of-hashut.spirit-of-hashut
    roll: '1'
    name: Spirit of Hashut
    difficulty: 9
    summary: The player draws a line 18" from the Sorcerer. All models crossed by the line suffer one
      S4 hit.
    name_i18n:
      en: Spirit of Hashut
      es: Espíritu de Hashut
  - id: spell.rituals-of-hashut.bellow-of-doom
    roll: '2'
    name: Bellow of Doom
    difficulty: 8
    summary: All models engaged in base contact with the Sorcerer must make an immediate Leadership test
      or break from combat and run.
    name_i18n:
      en: Bellow of Doom
      es: Bramido de perdición
  - id: spell.rituals-of-hashut.fumes-of-azgorh
    roll: '3'
    name: Fumes of Azgorh
    difficulty: 7
    summary: The spell has a range of 8", hitting all models in its path on a D6 score of 4+. Any model
      hit suffers a S4 hit, rolling to wound as normal. No armour saves are allowed.
    name_i18n:
      en: Fumes of Azgorh
      es: Vapores de Azgorh
  - id: spell.rituals-of-hashut.flickering-hide
    roll: '4'
    name: Flickering Hide
    difficulty: 10
    summary: The Sorcerer may cast this spell upon himself or any one model within 6". The flaming hide
      negates any one wound suffered on a D6 roll of 4+. In hand-to-hand combat any model that hits the
      flaming hide suffers one S3 hit for each hit scored. The flaming hide lasts until the beginning
      of the Sorcerer's next shooting phase.
    name_i18n:
      en: Flickering Hide
      es: Piel parpadeante
  - id: spell.rituals-of-hashut.lava-flow
    roll: '5'
    name: Lava Flow
    difficulty: 7
    summary: The Sorcerer may move 12" in any direction, even into combat, counting as a charge. Due to
      the nature of the spell he may only reappear on or below the ground.
    name_i18n:
      en: Lava Flow
      es: Corriente de lava
  - id: spell.rituals-of-hashut.earthquake
    roll: '6'
    name: Earthquake
    difficulty: 9
    summary: All models within 3" of the Sorcerer, friend or foe alike, must roll equal to or under their
      Initiative or suffer D3 S4 hits.
    name_i18n:
      en: Earthquake
      es: Terremoto
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Magic / Rituals of Hashut
    url: https://mordheimer.net/docs/magic/rituals-of-hashut
  name_i18n:
    en: Rituals of Hashut
    es: Rituales de Hashut
- id: lore.ladys-prayers
  name: Lady's Prayers
  note: Used by the Bretonnian Chapel Guard Damsel. Prayers are not regarded as spells, so any special
    protection against spells does not affect them.
  spells:
  - id: spell.ladys-prayers.ladys-favors
    roll: '1'
    name: Lady's Favors
    difficulty: auto
    summary: All your heroes count as having Lucky Charms for this battle and ignore the first hit against
      them on a D6 roll of 4+. If they already own Lucky Charms, they may reroll a failed Lucky Charm
      save, accepting the second result.
    name_i18n:
      en: Lady's Favors
      es: Favores de la Dama
  - id: spell.ladys-prayers.blessed-protection
    roll: '2'
    name: Blessed Protection
    difficulty: 8
    summary: The Damsel and any Bretonnians within 6" of her gain an unmodified ward save of 4+ against
      the effects of spells or prayers. Test each shooting phase; on a roll of 1 or 2 the spell dissipates.
    name_i18n:
      en: Blessed Protection
      es: Protección bendecida
  - id: spell.ladys-prayers.swiftstride
    roll: '3'
    name: Swiftstride
    difficulty: 7
    summary: The Damsel may pick a friendly hero or henchman within 12" that charged or failed a charge
      this turn. That warrior gains +1 to hit on all attacks until the end of the turn. If not in combat,
      they may make an additional move of D6" towards an enemy; moving into base contact with an enemy
      counts as a charge.
    name_i18n:
      en: Swiftstride
      es: Zancada veloz
  - id: spell.ladys-prayers.ladys-scorn
    roll: '4'
    name: Lady's Scorn
    difficulty: 5
    summary: Anyone attempting to shoot at the Damsel must first pass a Leadership test or they are unable
      to fire this turn. This includes Silver Arrows, Crossbow Pistols, Hand-to-Hand Pistols and template
      shot weapons that she is within the path of. The spell lasts until the end of the game.
    name_i18n:
      en: Lady's Scorn
      es: Desdén de la Dama
  - id: spell.ladys-prayers.elixir-of-life
    roll: '5'
    name: Elixir of Life
    difficulty: 7
    summary: Any one model within 4" of the Damsel, including herself, is restored to its full quota of
      Wounds. Any friendly models within 4" that are stunned or knocked down immediately come to their
      senses, stand up and continue fighting as normal.
    name_i18n:
      en: Elixir of Life
      es: Elixir de vida
  - id: spell.ladys-prayers.guiding-vision
    roll: '6'
    name: Guiding Vision
    difficulty: 6
    summary: The Damsel picks a friendly hero or henchman within 8". Until the start of her next shooting
      phase, that warrior may reroll one die roll they make and add +1 or -1 to the result.
    name_i18n:
      en: Guiding Vision
      es: Visión guía
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Magic / Lady's Prayers
    url: https://mordheimer.net/docs/magic/ladys-prayers
  name_i18n:
    en: Lady's Prayers
    es: Plegarias de la Dama
- id: lore.nurgle-rituals
  name: Nurgle Rituals
  note: Used by the Carnival of Chaos Carnival Master.
  spells:
  - id: spell.nurgle-rituals.daemonic-vigour
    roll: '1'
    name: Daemonic Vigour
    difficulty: 8
    summary: Any Plague Bearers or Nurglings within 8" of the Master increase their Daemonic Aura save
      from 5+ to 4+ until the beginning of their next turn.
    name_i18n:
      en: Daemonic Vigour
      es: Vigor demoníaco
  - id: spell.nurgle-rituals.buboes
    roll: '2'
    name: Buboes
    difficulty: 7
    summary: The spell has a range of 8" and affects a single enemy warrior. The warrior must pass a Toughness
      test or lose a Wound. No armour saves are allowed.
    name_i18n:
      en: Buboes
      es: Bubones
  - id: spell.nurgle-rituals.stench-of-nurgle
    roll: '3'
    name: Stench of Nurgle
    difficulty: 8
    summary: The spell has a range of 6" and affects all living creatures, friend or foe. Each enemy warrior
      in range must pass a Toughness test or lose an Attack until their next turn.
    name_i18n:
      en: Stench of Nurgle
      es: Hedor de Nurgle
  - id: spell.nurgle-rituals.pestilence
    roll: '4'
    name: Pestilence
    difficulty: 10
    summary: All enemy models within 12" of the Master suffer a Strength 3 hit. No armour saves are allowed.
    name_i18n:
      en: Pestilence
      es: Pestilencia
  - id: spell.nurgle-rituals.scabrous-hide
    roll: '5'
    name: Scabrous Hide
    difficulty: 8
    summary: The Master's skin becomes tough and leathery. He has an armour save of 2+ which replaces
      any normal armour save. The scabrous hide lasts until the beginning of his next shooting phase.
    name_i18n:
      en: Scabrous Hide
      es: Piel costrosa
  - id: spell.nurgle-rituals.nurgles-rot
    roll: '6'
    name: Nurgle's Rot
    difficulty: 9
    summary: All enemy models in base contact with the Master must immediately test against their Toughness
      or contract Nurgle's Rot.
    name_i18n:
      en: Nurgle's Rot
      es: Podredumbre de Nurgle
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Magic / Nurgle Rituals
    url: https://mordheimer.net/docs/magic/nurgle-rituals
  name_i18n:
    en: Nurgle Rituals
    es: Rituales de Nurgle
- id: lore.dark-elf-magic
  name: Dark Elf Magic
  note: Used by Dark Elf Sorceresses.
  spells:
  - id: spell.dark-elf-magic.doombolt
    roll: '1'
    name: Doombolt
    difficulty: 9
    summary: The bolt may be targeted at any enemy model in line of sight. It has an 18" range and causes
      a Strength 5 hit. If the target is wounded, the next closest model within 6" is also hit on a 4+,
      at -1 Strength to the previous hit. The bolt keeps leaping until there are no more targets within
      range or its Strength drops to one. Each model can only be hit once per turn. Take armour saves
      as normal.
    name_i18n:
      en: Doombolt
      es: Rayo de perdición
  - id: spell.dark-elf-magic.word-of-pain
    roll: '2'
    name: Word of Pain
    difficulty: 8
    summary: The spell may be cast at an enemy model within 12". The victim must reroll all successful
      hand-to-hand or missile attacks and all to wound rolls. To charge, the victim must first pass a
      successful Leadership test. The spell lasts until the beginning of the next Dark Elf turn.
    name_i18n:
      en: Word of Pain
      es: Palabra de dolor
  - id: spell.dark-elf-magic.soul-stealer
    roll: '3'
    name: Soul Stealer
    difficulty: 9
    summary: The Sorceress makes a to hit roll against a model in base contact. If the attack is successful
      and her opponent is struck, he suffers a wound with no armour save possible. The Sorceress adds
      one wound to her profile. She can never have more than one extra wound from this spell and the extra
      wound is lost at the end of the battle.
    name_i18n:
      en: Soul Stealer
      es: Ladronalmas
  - id: spell.dark-elf-magic.flamesword
    roll: '4'
    name: Flamesword
    difficulty: 8
    summary: The Sorceress may choose the hand-to-hand combat weapon of a member of her warband within
      6" to be engulfed in flames. A weapon with these flames acts as a normal weapon of its type, but
      adds a +2 bonus to the user's Strength. Hits inflicted from the weapon ignore armour saves. Lasts
      until the Sorceress' next shooting phase.
    name_i18n:
      en: Flamesword
      es: Espada llameante
  - id: spell.dark-elf-magic.deathspasm
    roll: '5'
    name: Deathspasm
    difficulty: 10
    summary: The Deathspasm has a range of 6" and must be cast on the closest enemy model. The affected
      model must roll on the injury chart. If successfully cast, the casting Sorceress is immediately
      knocked down.
    name_i18n:
      en: Deathspasm
      es: Espasmo mortal
  - id: spell.dark-elf-magic.witch-flight
    roll: '6'
    name: Witch Flight
    difficulty: 7
    summary: The Sorceress may immediately move anywhere within 12" and may count as charging. If she
      engages a fleeing enemy in the close combat phase she will score one automatic hit and then the
      opponent will flee again.
    name_i18n:
      en: Witch Flight
      es: Vuelo de bruja
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Magic / Dark Elf Magic
    url: https://mordheimer.net/docs/magic/dark-elf-magic
  name_i18n:
    en: Dark Elf Magic
    es: Magia de los elfos oscuros
- id: lore.onogal-rituals
  name: Onogal Rituals
  note: Modified Nurgle rituals used by Marauders of Chaos Seers with the Mark of Onogal the Crow.
  spells:
  - id: spell.onogal-rituals.touch-of-onogal
    roll: '1'
    name: Touch of Onogal
    difficulty: 10
    summary: This spell can be used against one of the Seer's close combat opponents. If he takes the
      model out of action in the following hand-to-hand combat phase, the player rolls for Serious Injuries
      immediately. If the model dies permanently, replace it with a Nurgle Plague Bearer for the rest
      of the game under the Seer's control. If the Seer is stunned or taken out of action the Plague Bearer
      disappears into the Realm of Chaos. Only one Plague Bearer can be created at a time.
    name_i18n:
      en: Touch of Onogal
      es: Toque de Onogal
  - id: spell.onogal-rituals.buboes
    roll: '2'
    name: Buboes
    difficulty: 7
    summary: The spell has a range of 8" and affects a single enemy warrior. The warrior must pass a Toughness
      test or lose a Wound. No armour saves are allowed.
    name_i18n:
      en: Buboes
      es: Bubones
  - id: spell.onogal-rituals.stench-of-nurgle
    roll: '3'
    name: Stench of Nurgle
    difficulty: 8
    summary: The spell has a range of 6" and affects all living creatures, friend or foe. Each enemy warrior
      in range must pass a Toughness test or lose an Attack until their next turn.
    name_i18n:
      en: Stench of Nurgle
      es: Hedor de Nurgle
  - id: spell.onogal-rituals.pestilence
    roll: '4'
    name: Pestilence
    difficulty: 10
    summary: All enemy models within 12" of the Seer suffer a Strength 3 hit. No armour saves are allowed.
    name_i18n:
      en: Pestilence
      es: Pestilencia
  - id: spell.onogal-rituals.scabrous-hide
    roll: '5'
    name: Scabrous Hide
    difficulty: 8
    summary: The Seer has an armour save of 2+ which replaces any normal armour save. The scabrous hide
      lasts until the beginning of his next shooting phase.
    name_i18n:
      en: Scabrous Hide
      es: Piel costrosa
  - id: spell.onogal-rituals.nurgles-rot
    roll: '6'
    name: Nurgle's Rot
    difficulty: 9
    summary: All enemy models in base contact with the Seer must immediately test against their Toughness
      or contract Nurgle's Rot.
    name_i18n:
      en: Nurgle's Rot
      es: Podredumbre de Nurgle
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Magic / Onogal Rituals
    url: https://mordheimer.net/docs/magic/onogal-rituals
  name_i18n:
    en: Onogal Rituals
    es: Rituales de Onogal
- id: lore.shornaal-rituals
  name: Shornaal Rituals
  note: Used by Marauders of Chaos Seers with the Mark of Shornaal the Serpent.
  spells:
  - id: spell.shornaal-rituals.delicious-suffering
    roll: '1'
    name: Delicious Suffering
    difficulty: 8
    summary: All models, friend and foe except the Seer, within 3" must pass a Leadership test or are
      knocked down.
    name_i18n:
      en: Delicious Suffering
      es: Sufrimiento delicioso
  - id: spell.shornaal-rituals.dance-of-the-serpent
    roll: '2'
    name: Dance of the Serpent
    difficulty: 8
    summary: All enemy models that are not immune to psychology suffer a -1 to hit against him in close
      combat. The dance lasts until the beginning of the Seer's next shooting phase.
    name_i18n:
      en: Dance of the Serpent
      es: Danza de la serpiente
  - id: spell.shornaal-rituals.endless-torment
    roll: '3'
    name: Endless Torment
    difficulty: 9
    summary: Choose one enemy model within 8". From now on the model must roll for injury at -1 after
      its recovery phase. For the duration of the torment the Seer can do nothing else; he may end the
      spell at the beginning of his turn, and if attacked in close combat he is hit automatically and
      the spell breaks.
    name_i18n:
      en: Endless Torment
      es: Tormento infinito
  - id: spell.shornaal-rituals.mystify
    roll: '4'
    name: Mystify
    difficulty: 8
    summary: A target enemy model within 8" has its Initiative reduced to 1 and always strikes last in
      close combat, even if it charges or is armed with a spear or pike. The spell lasts until the target
      passes a Leadership test during the recovery phase.
    name_i18n:
      en: Mystify
      es: Desconcertar
  - id: spell.shornaal-rituals.a-thousand-voices
    roll: '5'
    name: A Thousand Voices
    difficulty: 8
    summary: Choose one enemy model within 12". For the duration of the spell the model reduces its Leadership
      by D3 +1, to a minimum of 2, if it is not immune to psychology. The model must pass a Leadership
      test at the beginning of its turn to end the spell. The spell also breaks when the Seer loses a
      wound. Only one model can be enchanted at a time.
    name_i18n:
      en: A Thousand Voices
      es: Mil voces
  - id: spell.shornaal-rituals.shornaals-temptation
    roll: '6'
    name: Shornaal's Temptation
    difficulty: 7
    summary: Choose one enemy model within 8" that is not immune to psychology. The model must pass a
      Leadership test or the Seer gains control over it. The player may attempt to regain control at the
      beginning of his turn by passing a Leadership test. Only one model can be enchanted at a time. If
      the Seer is hit, by a missile or in close combat, he must pass a Leadership test or the spell ends.
    name_i18n:
      en: Shornaal's Temptation
      es: Tentación de Shornaal
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Magic / Shornaal Rituals
    url: https://mordheimer.net/docs/magic/shornaal-rituals
  name_i18n:
    en: Shornaal Rituals
    es: Rituales de Shornaal
- id: lore.tchar-rituals
  name: Tchar Rituals
  note: Used by Marauders of Chaos Seers with the Mark of Tchar the Eagle.
  spells:
  - id: spell.tchar-rituals.tchars-blessing
    roll: '1'
    name: Tchar's Blessing
    difficulty: auto
    summary: This spell must be used before the game and may only be used once. The Seer may not cast
      spells in the following battle. After the game he gains D3 Experience points if he was not taken
      out of action.
    name_i18n:
      en: Tchar's Blessing
      es: Bendición de Tchar
  - id: spell.tchar-rituals.dispel-magic
    roll: '2'
    name: Dispel Magic
    difficulty: 7
    summary: The Seer ends all effects of currently active spells.
    name_i18n:
      en: Dispel Magic
      es: Disipar magia
  - id: spell.tchar-rituals.foresight
    roll: '3'
    name: Foresight
    difficulty: 10
    summary: This spell must be used before the game and may only be used once. Choose a warband. One
      randomly determined Hero of that warband must miss the following game. Models that are capable of
      casting spells or prayers are immune to this effect.
    name_i18n:
      en: Foresight
      es: Previsión
  - id: spell.tchar-rituals.wrath-of-the-great-eagle
    roll: '4'
    name: Wrath of the Great Eagle
    difficulty: 9
    summary: Choose one enemy model within 12". The model is hit with a Strength equal to the difference
      between the Seer's Experience points and the model's Experience, to a maximum of 10. Armour saves
      are taken as normal. If the victim has more Experience than the Seer, the Seer is hit instead.
    name_i18n:
      en: Wrath of the Great Eagle
      es: Ira del Gran Águila
  - id: spell.tchar-rituals.tchars-reward
    roll: '5'
    name: Tchar's Reward
    difficulty: 8
    summary: The Seer gets +1 on any one stat per 10 Experience points he has. Each stat may be increased
      only once through this spell. The power lasts until the end of the Seer's next shooting phase and
      can be re-cast in that phase.
    name_i18n:
      en: Tchar's Reward
      es: Recompensa de Tchar
  - id: spell.tchar-rituals.slave-to-chaos
    roll: '6'
    name: Slave to Chaos
    difficulty: 9
    summary: This spell has a range of 12" and causes one Strength 2 hit with no armour save. If the model
      is taken out of action, roll for Serious Injuries immediately. If it dies, replace the killed warrior
      with a Horror of Tzeentch until the end of the game. If the Seer is stunned or taken out of action
      the Horror disappears into the Realm of Chaos.
    name_i18n:
      en: Slave to Chaos
      es: Esclavo del caos
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Magic / Tchar Rituals
    url: https://mordheimer.net/docs/magic/tchar-rituals
  name_i18n:
    en: Tchar Rituals
    es: Rituales de Tchar
- id: lore.goblin-magic
  name: Goblin Magic
  note: Used by Night Goblins (web) Shamans.
  spells:
  - id: spell.goblin-magic.wind-of-gork
    roll: '1'
    name: Wind of Gork
    difficulty: 6
    summary: Range 12". The first model in its path must roll under its Toughness or take a Strength 2
      hit and be knocked down automatically.
    name_i18n:
      en: Wind of Gork
      es: Viento de Gork
  - id: spell.goblin-magic.gaze-of-mork
    roll: '2'
    name: Gaze of Mork
    difficulty: 8
    summary: Range 12". D3 Strength 3 hits strike the first model in their path.
    name_i18n:
      en: Gaze of Mork
      es: Mirada de Mork
  - id: spell.goblin-magic.eadbanger
    roll: '3'
    name: ’Eadbanger
    difficulty: 8
    summary: Range 6". Fire bolts equal to the number of the Shaman's Base Attacks, resolved with Strength
      equal to the Shaman's Toughness at the first model in their path. After the bolts effects are resolved,
      roll a die. On a 1 the Shaman has drawn upon too much power, collapses and goes out of action.
    name_i18n:
      en: ’Eadbanger
      es: Rompecabezas
  - id: spell.goblin-magic.leap-of-waaagh
    roll: '4'
    name: Leap of Waaagh!
    difficulty: 7
    summary: The Shaman or any other Goblin within 3" may be moved up to 12", ignoring terrain. If this
      move brings them into close combat, they count as charging in the close combat phase.
    name_i18n:
      en: Leap of Waaagh!
      es: Salto ¡Waaagh!
  - id: spell.goblin-magic.idol-of-gork
    roll: '5'
    name: Idol of Gork
    difficulty: 8
    summary: The Shaman gains +1 WS, +1 S and +1 A. This enhancement lasts until the Shaman takes a wound.
    name_i18n:
      en: Idol of Gork
      es: Ídolo de Gork
  - id: spell.goblin-magic.ere-we-go
    roll: '6'
    name: ’Ere we go!
    difficulty: 8
    summary: All friendly models within 6" of the Shaman treat stunned results on the injury table as
      knocked down instead. The effects last until the Shaman takes a wound.
    name_i18n:
      en: ’Ere we go!
      es: ¡Marchando!
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Magic / Goblin Magic
    url: https://mordheimer.net/docs/magic/goblin-magic
  name_i18n:
    en: Goblin Magic
    es: Magia goblin
- id: lore.spells-of-the-djedhi
  name: Spells of the Djed'hi
  note: Used by the Elf Mage.
  spells:
  - id: spell.spells-of-the-djedhi.divination-of-shirath
    roll: '1'
    name: Divination of Shirath
    difficulty: 6
    summary: The Mage may reroll all his failed dice rolls, though the second result stands. The effect
      lasts until the beginning of the Mage's next turn.
    name_i18n:
      en: Divination of Shirath
      es: Adivinación de Shirath
  - id: spell.spells-of-the-djedhi.shimmering-shield
    roll: '2'
    name: Shimmering Shield
    difficulty: 7
    summary: This spell gives the Mage an additional unmodified 5+ save against all attacks. The effect
      lasts until the beginning of the Mage's next turn.
    name_i18n:
      en: Shimmering Shield
      es: Escudo refulgente
  - id: spell.spells-of-the-djedhi.statue-of-light
    roll: '3'
    name: Statue of Light
    difficulty: 7
    summary: The Mage chooses a single enemy model he can see. That model may not move as long as the
      Mage remains both static and alive. The Mage and the target may cast spells normally, but fight
      in close combat at -2 WS, minimum of 1.
    name_i18n:
      en: Statue of Light
      es: Estatua de luz
  - id: spell.spells-of-the-djedhi.fleeting-shadows
    roll: '4'
    name: Fleeting Shadows
    difficulty: 8
    summary: The first time the Mage is hit in close combat or shooting, the hit is ignored. Move the
      Mage 2" from his current position in a random direction, not off a cliff or similar. The spell remains
      in play until it saves the Mage from a hit, whereupon it is dispelled. It may not be cast again
      whilst it is in play.
    name_i18n:
      en: Fleeting Shadows
      es: Sombras fugaces
  - id: spell.spells-of-the-djedhi.hunters-fury
    roll: '5'
    name: Hunter's Fury
    difficulty: 9
    summary: The spell summons D3 +1 arrows which the Mage can use to shoot against one enemy model following
      the rules for normal shooting. The arrows have a range of 36". Use the Mage's own Ballistic Skill
      to determine hits, but ignore movement, range and cover penalties. Each arrow causes one S3 hit.
    name_i18n:
      en: Hunter's Fury
      es: Furia del cazador
  - id: spell.spells-of-the-djedhi.silent-guardian
    roll: '6'
    name: Silent Guardian
    difficulty: 9
    summary: If the Mage is attacked in close combat, the guardian fights first with WS5, S3, making one
      attack per turn against each enemy that attacks the Mage. The guardian will not leave the Mage's
      side and can only be dispelled if the Mage casts another spell or dies. The guardian cannot be attacked
      in return.
    name_i18n:
      en: Silent Guardian
      es: Guardián silencioso
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Magic / Spells of the Djed'hi
    url: https://mordheimer.net/docs/magic/spells-of-the-djedhi
  name_i18n:
    en: Spells of the Djed'hi
    es: Hechizos de los Djed'hi
