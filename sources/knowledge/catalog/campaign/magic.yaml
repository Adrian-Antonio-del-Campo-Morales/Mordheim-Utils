casting_rules:
  id: campaign.magic.casting
  summary: Spells are cast in the shooting phase and may be used even if the caster is in hand-to-hand
    combat. To use a spell, the wizard rolls equal to or greater than the spell's Difficulty on 2D6. If
    he fails, he may not cast a spell that turn. A wizard may cast one spell per turn and may not use
    missile weapons if he wants to cast a spell; he may run. A wizard may not use magic if he is wearing
    armour or has a shield or buckler; the only exception is the Prayers of Sigmar.
  damage: Spells that cause direct damage are resolved the same way as damage from shooting or blows in
    hand-to-hand combat. Spells do not cause critical hits. Models always receive armour saves against
    wounds caused by spells unless noted otherwise.
  starting_spells: Each wizard starts with one randomly determined spell, but may gain more. Roll a D6
    and consult the appropriate chart. If the same spell is rolled twice, roll again or lower the spell's
    difficulty by 1.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Magic / Casting Spells
    url: https://mordheimer.net/docs/magic
