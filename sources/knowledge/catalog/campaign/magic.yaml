lores:
- id: lore.lesser-magic
  name: Lesser Magic
  note: Used by human warlocks.
  note_i18n:
    es: La usan los brujos humanos.
  spells:
  - id: spell.lesser-magic.fires-of-uzhul
    roll: '1'
    name: Fires of U'Zhul
    difficulty: 7
    effect: >-
      The fireball has a range of 18" and causes one Strength 4 hit. It strikes the first model in
      its path. Armour saves are taken as normal (ie, with -1 modifier).
    effect_i18n:
      es: >-
        La bola de fuego tiene un alcance de 18" y causa un impacto de Fuerza 4. Golpea a la primera
        miniatura en su trayectoria. Las tiradas de salvación por armadura se hacen con normalidad
        (es decir, con un modificador de -1).
    name_i18n:
      es: Fuegos de U'Zhul
  - id: spell.lesser-magic.flight-of-zimmeran
    roll: '2'
    name: Flight of Zimmeran
    difficulty: 7
    effect: >-
      The wizard may immediately move anywhere within 12", including into base contact with an
      enemy, in which case he counts as charging. If he engages a fleeing enemy he will score 1
      automatic hit and then his opponent will flee again (if he survives).
    effect_i18n:
      es: >-
        El hechicero puede moverse inmediatamente a cualquier punto dentro de 12", incluyendo
        contacto base con un enemigo, en cuyo caso cuenta como cargando. Si alcanza a un enemigo en
        huida, logrará 1 impacto automático y después su rival volverá a huir (si sobrevive).
    name_i18n:
      es: Vuelo de Zimmeran
  - id: spell.lesser-magic.dread-of-aramar
    roll: '3'
    name: Dread of Aramar
    difficulty: 7
    effect: >-
      A single model within 12" must pass a Leadership test or flee 2D6" directly away from him.
      Does not affect Undead or any model immune to fear.
    effect_i18n:
      es: >-
        Una sola miniatura dentro de 12" debe superar un test de Liderazgo o huir 2D6" directamente
        alejándose de él. No afecta a los No Muertos ni a ninguna miniatura inmune al miedo.
    name_i18n:
      es: Pavor de Aramar
  - id: spell.lesser-magic.silver-arrows-of-arha
    roll: '4'
    name: Silver Arrows of Arha
    difficulty: 7
    effect: >-
      Cannot be cast in hand-to-hand combat. Summons D6+2 arrows which may be shot against one enemy
      model at a range of 24". Use the wizard's Ballistic Skill, ignoring movement, range and cover
      penalties. Each arrow causes one S3 hit.
    effect_i18n:
      es: >-
        No puede lanzarse en combate cuerpo a cuerpo. Invoca D6+2 flechas que pueden dispararse
        contra una miniatura enemiga a un alcance de 24". Usa la Habilidad de Disparo del hechicero,
        ignorando las penalizaciones por movimiento, alcance y cobertura. Cada flecha causa un
        impacto de F3.
    name_i18n:
      es: Flechas de Plata de Arha
  - id: spell.lesser-magic.luck-of-shemtek
    roll: '5'
    name: Luck of Shemtek
    difficulty: 6
    effect: >-
      The wizard may re-roll all his failed dice rolls; the second results stand. The effect lasts
      until the beginning of his own next turn.
    effect_i18n:
      es: >-
        El hechicero puede repetir todas sus tiradas de dado fallidas; el segundo resultado es
        definitivo. El efecto dura hasta el principio de su siguiente turno.
    name_i18n:
      es: Suerte de Shemtek
  - id: spell.lesser-magic.sword-of-rezhebel
    roll: '6'
    name: Sword of Rezhebel
    difficulty: 8
    effect: >-
      The sword gives the wizard +1 Attack, +2 Strength and +2 Weapon Skill. Take a Leadership test
      at the beginning of each of the wizard's own turns; if the test fails, the sword disappears.
    effect_i18n:
      es: >-
        La espada da al hechicero +1 Ataque, +2 Fuerza y +2 Habilidad de Armas. Haz un test de
        Liderazgo al principio de cada turno propio del hechicero; si falla, la espada desaparece.
    name_i18n:
      es: Espada de Rezhebel
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Magic / Lesser Magic
    url: https://mordheimer.net/docs/magic/lesser-magic
  name_i18n:
    es: Magia Menor
- id: lore.necromancy
  name: Necromancy
  note: Used by the Undead Necromancer.
  note_i18n:
    es: La usa el Nigromante de los No Muertos.
  spells:
  - id: spell.necromancy.lifestealer
    roll: '1'
    name: Lifestealer
    difficulty: 10
    effect: >-
      Choose a single model within 6". The target suffers a wound (no save allowed) and the
      Necromancer gains an extra wound for the duration of the battle. Will not affect the Possessed
      or any Undead models.
    effect_i18n:
      es: >-
        Elige una sola miniatura dentro de 6". El objetivo sufre una herida (sin tirada de
        salvación) y el Nigromante gana una herida extra durante el resto de la batalla. No afecta a
        los Poseídos ni a ninguna miniatura No Muerta.
    name_i18n:
      es: Robavidas
  - id: spell.necromancy.re-animation
    roll: '2'
    name: Re-Animation
    difficulty: 5
    effect: >-
      One Zombie that went out of action during the last hand-to-hand combat or shooting phase
      immediately returns to the battle, placed within 6" of the Necromancer and not straight into
      hand-to-hand combat.
    effect_i18n:
      es: >-
        Un Zombi que quedó Fuera de combate durante la última fase de combate cuerpo a cuerpo o de
        disparo vuelve inmediatamente a la batalla, se coloca dentro de 6" del Nigromante y nunca
        directamente en combate cuerpo a cuerpo.
    name_i18n:
      es: Reanimación
  - id: spell.necromancy.death-vision
    roll: '3'
    name: Death Vision
    difficulty: 6
    effect: The Necromancer causes fear in his enemies for the duration of the battle.
    effect_i18n:
      es: El Nigromante causa miedo en sus enemigos durante el resto de la batalla.
    name_i18n:
      es: Visión de la Muerte
  - id: spell.necromancy.spell-of-doom
    roll: '4'
    name: Spell of Doom
    difficulty: 9
    effect: >-
      Choose one enemy model within 12". The model must roll equal to or less than his Strength on a
      D6 or be struck; if he fails, roll on the Injury table.
    effect_i18n:
      es: >-
        Elige una miniatura enemiga dentro de 12". La miniatura debe sacar en un D6 igual o menos
        que su Fuerza o ser golpeada; si falla, tira en la tabla de Heridas.
    name_i18n:
      es: Hechizo de Perdición
  - id: spell.necromancy.call-of-vanhel
    roll: '5'
    name: Call of Vanhel
    difficulty: 6
    effect: >-
      A single Zombie or Dire Wolf within 6" may immediately move again up to its maximum Movement
      distance. If this moves them into base contact with an enemy model, they count as charging.
    effect_i18n:
      es: >-
        Un solo Zombi o Lobo Dire dentro de 6" puede moverse de nuevo inmediatamente hasta su
        distancia máxima de Movimiento. Si esto los lleva a contacto base con una miniatura enemiga,
        cuentan como cargando.
    name_i18n:
      es: Llamado de Vanhel
  - id: spell.necromancy.spell-of-awakening
    roll: '6'
    name: Spell of Awakening
    difficulty: auto
    effect: >-
      If an enemy Hero is killed (11-15 on the Serious Injury chart), the Necromancer may raise him
      to fight as a Zombie. The dead Hero retains his characteristics and weapons and armour but may
      not use other equipment or skills, may not run, counts as a Henchman group on his own, and may
      not gain further experience. Always succeeds.
    effect_i18n:
      es: >-
        Si un Héroe enemigo muere (11-15 en la tabla de Heridas graves), el Nigromante puede
        resucitarlo para que luche como Zombi. El Héroe muerto conserva sus características, armas y
        armadura, pero no puede usar otro equipo ni habilidades, no puede correr, cuenta como un
        grupo de Secuaces por sí solo y no puede ganar más experiencia. Siempre funciona.
    name_i18n:
      es: Hechizo de Despertar
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Magic / Necromancy
    url: https://mordheimer.net/docs/magic/necromancy
  name_i18n:
    es: Nigromancia
- id: lore.charms-and-hexes
  name: Charms & Hexes
  note: Used by Witches.
  note_i18n:
    es: La usan las Brujas.
  spells:
  - id: spell.charms-and-hexes.scry
    roll: '1'
    name: Scry
    difficulty: 6
    effect: >-
      For the duration of the turn one hero or henchman may re-roll D3 dice rolls and add +1 or -1
      to the result.
    effect_i18n:
      es: >-
        Durante ese turno, un héroe o secuaz puede repetir D3 tiradas de dado y sumar +1 o -1 al
        resultado.
    name_i18n:
      es: Adivinar
  - id: spell.charms-and-hexes.curse
    roll: '2'
    name: Curse
    difficulty: 6
    effect: >-
      One enemy model within 12" must re-roll all successful dice rolls for the duration of this and
      their next turn.
    effect_i18n:
      es: >-
        Una miniatura enemiga dentro de 12" debe repetir todas las tiradas exitosas durante este
        turno y el siguiente.
    name_i18n:
      es: Maldición
  - id: spell.charms-and-hexes.dust-of-the-blind
    roll: '3'
    name: Dust of the Blind
    difficulty: 9
    effect: >-
      One enemy model within 16" is struck blind: may not shoot, charge or run, fights at half
      Weapon Skill and moves in a random direction at the start of its turn. Lasts until the Witch
      casts another spell or moves.
    effect_i18n:
      es: >-
        Una miniatura enemiga dentro de 16" queda cegada: no puede disparar, cargar ni correr, lucha
        con la mitad de su Habilidad de Armas y se mueve en una dirección aleatoria al principio de
        su turno. Dura hasta que la Bruja lance otro conjuro o se mueva.
    name_i18n:
      es: Polvo de los Ciegos
  - id: spell.charms-and-hexes.age-of-stone
    roll: '4'
    name: Age of Stone
    difficulty: 8
    effect: >-
      One enemy model within 12" has all of its characteristics reduced by -1 for the duration of
      this and their next turn.
    effect_i18n:
      es: >-
        Una miniatura enemiga dentro de 12" ve todas sus características reducidas en -1 durante
        este turno y el siguiente.
    name_i18n:
      es: Era de Piedra
  - id: spell.charms-and-hexes.warriors-bane
    roll: '5'
    name: Warrior's Bane
    difficulty: 7
    effect: >-
      One enemy model within 18" cannot use any weapons: unable to shoot and counts as fighting with
      fists in hand-to-hand combat. Lasts for the duration of this and their next turn.
    effect_i18n:
      es: >-
        Una miniatura enemiga dentro de 18" no puede usar armas: no puede disparar y cuenta como
        luchando con los puños en combate cuerpo a cuerpo. Dura este turno y el siguiente.
    name_i18n:
      es: Flaqueza del Guerrero
  - id: spell.charms-and-hexes.cure
    roll: '6'
    name: Cure
    difficulty: 6
    effect: >-
      All friendly models within 6" have a single wound healed; stunned or knocked down models may
      immediately stand up.
    effect_i18n:
      es: >-
        Todas las miniaturas amigas dentro de 6" curan una herida; las miniaturas aturdidas o
        derribadas pueden levantarse inmediatamente.
    name_i18n:
      es: Curar
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Magic / Charms & Hexes
    url: https://mordheimer.net/docs/magic/charms-and-hexes
  name_i18n:
    es: Encantamientos y Maldiciones
- id: lore.arabian-elemental-magic
  name: Arabian Elemental Magic
  note: Used by Arabian Mystics and Khar-mel The Djinn.
  note_i18n:
    es: La usan los Místicos Arabyanos y Khar-mel el Djinn.
  spells:
  - id: spell.arabian-elemental-magic.riding-the-wind
    roll: '1'
    name: Riding the Wind
    difficulty: 6
    effect: >-
      Cast at the beginning of the Movement phase. The caster may move up to 12+D6" anywhere,
      ignoring intervening terrain. May not move into base contact with an enemy; may shoot as
      normal with a -1 penalty.
    effect_i18n:
      es: >-
        Se lanza al principio de la fase de Movimiento. El lanzador puede moverse hasta 12+D6" a
        cualquier lugar, ignorando el terreno interpuesto. No puede moverse a contacto base con un
        enemigo; puede disparar con normalidad con una penalización de -1.
    name_i18n:
      es: Cabalgando el Viento
  - id: spell.arabian-elemental-magic.skin-of-stone
    roll: '2'
    name: Skin of Stone
    difficulty: 7
    effect: >-
      Cast on any friendly warrior within 6". The target gains +2 to his armour save but suffers -1
      Initiative. May be maintained each turn while within 6" of the caster and the caster passes a
      Difficulty test.
    effect_i18n:
      es: >-
        Se lanza sobre cualquier guerrero amigo dentro de 6". El objetivo gana +2 a su salvación por
        armadura pero sufre -1 Iniciativa. Puede mantenerse cada turno mientras esté dentro de 6"
        del lanzador y este supere un test de Dificultad.
    name_i18n:
      es: Piel de Piedra
  - id: spell.arabian-elemental-magic.burning-hand
    roll: '3'
    name: Burning Hand
    difficulty: 8
    effect: >-
      Cast at the beginning of the Combat phase. The caster may sacrifice all normal attacks to make
      one hand-to-hand attack at Strength 5 causing 2 wounds. On a 4+ the target is set on fire.
      Lasts one round only.
    effect_i18n:
      es: >-
        Se lanza al principio de la fase de Combate. El lanzador puede sacrificar todos sus ataques
        normales para hacer un ataque cuerpo a cuerpo con Fuerza 5 que causa 2 heridas. Con un 4+ el
        objetivo prende fuego. Dura solo un asalto.
    name_i18n:
      es: Mano Ardiente
  - id: spell.arabian-elemental-magic.quicksand
    roll: '4'
    name: Quicksand
    difficulty: 6
    effect: >-
      Cast at any warrior within 6". Water floods a 3" area around the target until the beginning of
      the caster's next Recovery phase. All warriors within the quicksand must pass a Strength test
      or be unable to move; warriors in combat cannot attack but may defend.
    effect_i18n:
      es: >-
        Se lanza sobre cualquier guerrero dentro de 6". El agua inunda un área de 3" alrededor del
        objetivo hasta el principio de la siguiente fase de Recuperación del lanzador. Todos los
        guerreros dentro de las arenas movedizas deben superar un test de Iniciativa o quedan
        atrapados; no pueden moverse, y luchan con la mitad de sus ataques.
    name_i18n:
      es: Arenas Movedizas
  - id: spell.arabian-elemental-magic.storm-of-magic
    roll: '5'
    name: Storm of Magic
    difficulty: 9
    effect: >-
      Target any warrior within 12". The target takes one S5 hit. Armour saves may be taken as
      normal.
    effect_i18n:
      es: >-
        Apunta a cualquier guerrero dentro de 12". El objetivo sufre un impacto de F5. Las
        salvaciones por armadura pueden hacerse con normalidad.
    name_i18n:
      es: Tormenta de Magia
  - id: spell.arabian-elemental-magic.blessing-of-the-elements
    roll: '6'
    name: Blessing of the Elements
    difficulty: 6
    effect: >-
      In the post-battle sequence, the player may re-roll any one dice or modify one dice by +1/-1.
      If the caster was taken out of action, this spell may not be cast.
    effect_i18n:
      es: >-
        En la secuencia de posbatalla, el jugador puede repetir un dado cualquiera o modificar un
        dado en +1/-1. Si el lanzador quedó Fuera de combate, este conjuro no puede lanzarse.
    name_i18n:
      es: Bendición de los Elementos
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Magic / Arabian Elemental Magic
    url: https://mordheimer.net/docs/magic/arabian-elemental-magic
  name_i18n:
    es: Magia Elemental de Araby
- id: lore.prayers-of-sigmar
  name: Prayers of Sigmar
  note: Used by Witch Hunter Warrior Priests and Sigmarite Matriarchs. A warrior may use the divine power
    of Sigmar while wearing armour. Prayers of Sigmar are not regarded as spells, so any special protection
    against spells does not affect them.
  note_i18n:
    es: >-
      La usan los Sacerdotes Guerreros de los Cazadores de Brujas y las Matriarcas Sigmaritas.
      Un guerrero puede usar el poder divino de Sigmar llevando armadura. Las Plegarias de
      Sigmar no se consideran hechizos, por lo que ninguna protección especial contra hechizos
      les afecta.
  spells:
  - id: spell.prayers-of-sigmar.the-hammer-of-sigmar
    roll: '1'
    name: The Hammer of Sigmar
    difficulty: 7
    effect: >-
      The wielder gains +2 Strength in hand-to-hand combat and all hits he inflicts cause double
      damage. The Priest must test each shooting phase he wants to use the Hammer.
    effect_i18n:
      es: >-
        El portador gana +2 Fuerza en combate cuerpo a cuerpo y todos los impactos que inflige
        causan el doble de daño. El Sacerdote debe hacer un test en cada fase de disparo en la que
        quiera usar el Martillo.
    name_i18n:
      es: El Martillo de Sigmar
  - id: spell.prayers-of-sigmar.hearts-of-steel
    roll: '2'
    name: Hearts of Steel
    difficulty: 8
    effect: >-
      Allied warriors within 8" become immune to fear and all alone tests; the whole warband gains
      +1 to any Rout tests. Lasts until the caster is knocked down, stunned or put out of action.
      Not cumulative.
    effect_i18n:
      es: >-
        Los guerreros aliados dentro de 8" se vuelven inmunes al miedo y a todos los tests de
        soledad; toda la banda gana +1 en las tiradas de Huida. Dura hasta que el lanzador sea
        derribado, aturdido o puesto Fuera de combate. No es acumulativo.
    name_i18n:
      es: Corazones de Acero
  - id: spell.prayers-of-sigmar.soulfire
    roll: '3'
    name: Soulfire
    difficulty: 9
    effect: >-
      All enemy models within 4" suffer a Strength 3 hit with no armour saves. Undead and Possessed
      models in range suffer a Strength 5 hit instead.
    effect_i18n:
      es: >-
        Todas las miniaturas enemigas dentro de 4" sufren un impacto de Fuerza 3 sin tiradas de
        salvación por armadura. Las miniaturas No Muertas y Poseídas dentro del alcance sufren un
        impacto de Fuerza 5 en su lugar.
    name_i18n:
      es: Fuego de Almas
  - id: spell.prayers-of-sigmar.shield-of-faith
    roll: '4'
    name: Shield of Faith
    difficulty: 6
    effect: >-
      The Priest is immune to all spells. Roll at the beginning of each turn in the recovery phase;
      on a roll of 1 or 2 the shield disappears.
    effect_i18n:
      es: >-
        El Sacerdote es inmune a todos los conjuros. Tira al principio de cada turno en la fase de
        recuperación; con un resultado de 1 o 2, el escudo desaparece.
    name_i18n:
      es: Escudo de Fe
  - id: spell.prayers-of-sigmar.healing-hand
    roll: '5'
    name: Healing Hand
    difficulty: 5
    effect: >-
      Any one model within 2" (including himself) is restored to its full quota of Wounds; stunned
      or knocked down friendly models within 2" stand up.
    effect_i18n:
      es: >-
        Cualquier miniatura dentro de 2" (incluido él mismo) recupera todo su total de Heridas; las
        miniaturas amigas aturdidas o derribadas dentro de 2" se levantan.
    name_i18n:
      es: Mano Sanadora
  - id: spell.prayers-of-sigmar.armour-of-righteousness
    roll: '6'
    name: Armour of Righteousness
    difficulty: 9
    effect: >-
      The Priest has an armour save of 2+ which replaces his normal save, causes fear and is immune
      to fear. Lasts until the beginning of the Priest's next Shooting phase.
    effect_i18n:
      es: >-
        El Sacerdote tiene una salvación por armadura de 2+ que sustituye a su salvación normal,
        causa miedo y es inmune al miedo. Dura hasta el principio de la siguiente fase de Disparo
        del Sacerdote.
    name_i18n:
      es: Armadura de la Rectitud
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Magic / Prayers of Sigmar
    url: https://mordheimer.net/docs/magic/prayers-of-sigmar
  name_i18n:
    es: Plegarias de Sigmar
- id: lore.prayers-of-ulric
  name: Prayers of Ulric
  note: Used by the Wolf Priest of Ulric. Wolf Priests may use a wolf cloak and still chant these prayers.
    They are prayers, not spells, so special protection against spells does not affect them.
  note_i18n:
    es: >-
      La usa el Sacerdote Lobo de Ulric. Los Sacerdotes Lobo pueden usar una capa de lobo y
      seguir entonando estas plegarias. Son plegarias, no hechizos, así que la protección
      especial contra hechizos no les afecta.
  spells:
  - id: spell.prayers-of-ulric.snow-squall
    roll: '1'
    name: Snow Squall
    difficulty: 6
    effect: >-
      All enemy models in hand-to-hand combat with the priest are at -1 to hit. Lasts for the
      duration of the hand-to-hand combat.
    effect_i18n:
      es: >-
        Todas las miniaturas enemigas en combate cuerpo a cuerpo con el sacerdote tienen -1 por
        impactar. Dura mientras dure el combate cuerpo a cuerpo.
    name_i18n:
      es: Chubasco de Nieve
  - id: spell.prayers-of-ulric.hammerschlag
    roll: '2'
    name: Hammerschlag
    difficulty: 10
    effect: >-
      The Wolf Priest calls down a hammer blow from Ulric on any model within 6". That model suffers
      an S4 attack from an enormous ethereal hammer, including the concussion special rule.
    effect_i18n:
      es: >-
        El Sacerdote del Lobo invoca un golpe de martillo de Ulric sobre cualquier miniatura dentro
        de 6". Esa miniatura sufre un ataque de F4 de un enorme martillo etéreo, incluida la regla
        especial de conmoción.
    name_i18n:
      es: Golpe de Martillo
  - id: spell.prayers-of-ulric.bloodlust
    roll: '3'
    name: Bloodlust
    difficulty: 7
    effect: >-
      All attacks are at S+2 and he scores a critical hit on a 5-6. The Wolf Priest must test each
      turn to see if the prayer remains in effect.
    effect_i18n:
      es: >-
        Todos los ataques son a F+2 y logra un impacto crítico con un 5-6. El Sacerdote del Lobo
        debe hacer un test cada turno para ver si la oración sigue en vigor.
    name_i18n:
      es: Sed de Sangre
  - id: spell.prayers-of-ulric.wolfs-hunger
    roll: '4'
    name: Wolf's Hunger
    difficulty: 7
    effect: One member of the warband (priest's choice) is thrown into a Frenzy.
    effect_i18n:
      es: Un miembro de la banda (a elección del sacerdote) cae en Frenesí.
    name_i18n:
      es: Hambre del Lobo
  - id: spell.prayers-of-ulric.ulrics-howl
    roll: '5'
    name: Ulric's Howl
    difficulty: 10
    effect: >-
      For the duration of the battle, all members of the priest's warband are immune to Fear and all
      alone tests; all Rout tests are at +1.
    effect_i18n:
      es: >-
        Durante el resto de la batalla, todos los miembros de la banda del sacerdote son inmunes al
        Miedo y a los tests de soledad; todas las tiradas de Huida se hacen con +1.
    name_i18n:
      es: Aullido de Ulric
  - id: spell.prayers-of-ulric.call-of-ulric
    roll: '6'
    name: Call of Ulric
    difficulty: 10
    effect: >-
      The Wolf Priest's body re-shapes into a huge wolf (M6 WS4 BS0 S4 T4 W1 I5 A2 Ld6). While in
      wolf form he may only attack as a wolf. Each shooting phase he may test Leadership to regain
      human form; if still in wolf form at the end of the battle he gets one last chance, otherwise
      he remains a wolf forever (still a Hero, skills only from the Speed Table except Scale Sheer
      Surfaces; maximums M7 WS6 BS0 S4 T4 W3 I7 A3 Ld7).
    effect_i18n:
      es: >-
        El cuerpo del Sacerdote del Lobo se transforma en un lobo enorme (M6 HA4 HD0 F4 R4 H1 I5 A2
        L6). En forma de lobo solo puede atacar como lobo. En cada fase de disparo puede hacer un
        test de Liderazgo para recuperar la forma humana; si sigue en forma de lobo al final de la
        batalla, tiene una última oportunidad; de lo contrario, sigue siendo un lobo para siempre
        (sigue siendo un Héroe, solo con habilidades de lobo).
    name_i18n:
      es: Llamado de Ulric
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Magic / Prayers of Ulric
    url: https://mordheimer.net/docs/magic/prayers-of-ulric
  name_i18n:
    es: Plegarias de Ulric
- id: lore.chaos-rituals
  name: Chaos Rituals
  note: Used by Magisters of the Cult of the Possessed, Daemons, Beastmen, and Marauders of Chaos seers
    with the Mark of Chaos Undivided.
  note_i18n:
    es: >-
      La usan los Magísteres del Culto de los Poseídos, los Demonios, los Hombres Bestia y los
      videntes Merodeadores del Caos con la Marca del Caos Indiviso.
  spells:
  - id: spell.chaos-rituals.vision-of-torment
    roll: '1'
    name: Vision of Torment
    difficulty: 10
    effect: >-
      Range 6", must be cast on the closest enemy model (or one in base contact in hand-to-hand
      combat). The affected model is immediately stunned; if it cannot be stunned it is knocked down
      instead.
    effect_i18n:
      es: >-
        Alcance 6", debe lanzarse sobre la miniatura enemiga más cercana (o una en contacto base en
        combate cuerpo a cuerpo). La miniatura afectada queda inmediatamente aturdida; si no puede
        quedar aturdida, se derriba en su lugar.
    name_i18n:
      es: Visión de Tormento
  - id: spell.chaos-rituals.eye-of-god
    roll: '2'
    name: Eye of God
    difficulty: 7
    effect: >-
      Usable successfully only once per battle. Choose any single model within 6", friend or foe,
      and roll a D6: 1 = taken out of action (no Serious Injury roll); 2-5 = +1 to any one
      characteristic for this battle; 6 = +1 to all characteristics for the duration of the battle.
    effect_i18n:
      es: >-
        Utilizable con éxito solo una vez por batalla. Elige una sola miniatura dentro de 6", amiga
        o enemiga, y tira un D6: 1 = Fuera de combate (sin tirada en la tabla de Heridas graves);
        2-5 = +1 a una característica cualquiera para esta batalla; 6 = +1 a todas las
        características durante el resto de la batalla.
    name_i18n:
      es: Ojo de Dios
  - id: spell.chaos-rituals.dark-blood
    roll: '3'
    name: Dark Blood
    difficulty: 8
    effect: >-
      Range 8", causes D3 S5 hits and strikes the first model in its path. After using this spell
      the Chaos Mage rolls on the Injury table for himself, treating the out of action result as
      stunned instead.
    effect_i18n:
      es: >-
        Alcance 8", causa D3 impactos de F5 y golpea a la primera miniatura en su trayectoria.
        Después de usar este conjuro, el Mago del Caos tira para sí mismo en la tabla de Heridas,
        tratando el resultado de Fuera de combate como aturdido.
    name_i18n:
      es: Sangre Oscura
  - id: spell.chaos-rituals.lure-of-chaos
    roll: '4'
    name: Lure of Chaos
    difficulty: 9
    effect: >-
      Range 12", must be cast on the closest enemy model. Roll a D6 and add the Chaos Mage's
      Leadership; then roll a D6 and add the target's Leadership. If the Chaos Mage beats the
      target, he gains control of the model until it passes a Leadership test in its own recovery
      phase.
    effect_i18n:
      es: >-
        Alcance 12", debe lanzarse sobre la miniatura enemiga más cercana. Tira un D6 y suma el
        Liderazgo del Mago del Caos; después tira un D6 y suma el Liderazgo del objetivo. Si el Mago
        del Caos supera al objetivo, gana el control de la miniatura hasta que esta supere un test
        de Liderazgo en su propia fase de recuperación.
    name_i18n:
      es: Llamado del Caos
  - id: spell.chaos-rituals.wings-of-darkness
    roll: '5'
    name: Wings of Darkness
    difficulty: 7
    effect: >-
      The Chaos Mage may immediately move anywhere within 12", including into base contact with an
      enemy, in which case he counts as charging.
    effect_i18n:
      es: >-
        El Mago del Caos puede moverse inmediatamente a cualquier punto dentro de 12", incluyendo
        contacto base con un enemigo, en cuyo caso cuenta como cargando.
    name_i18n:
      es: Alas de Oscuridad
  - id: spell.chaos-rituals.word-of-pain
    roll: '6'
    name: Word of Pain
    difficulty: 7
    effect: >-
      All models within 3" of the Chaos Mage, friend or foe, suffer one S3 hit with no armour saves
      allowed.
    effect_i18n:
      es: >-
        Todas las miniaturas dentro de 3" del Mago del Caos, amigas o enemigas, sufren un impacto de
        F3 sin tiradas de salvación por armadura.
    name_i18n:
      es: Palabra de Dolor
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Magic / Chaos Rituals
    url: https://mordheimer.net/docs/magic/chaos-rituals
  name_i18n:
    es: Rituales del Caos
- id: lore.norse-runes
  name: Norse Runes
  note: Used by Norse Shamans.
  note_i18n:
    es: La usan los Chamanes Norse.
  spells:
  - id: spell.norse-runes.howl-of-the-north
    roll: '1'
    name: Howl of the North
    difficulty: 9
    effect: >-
      The Shaman is immune to all missile fire. Roll a dice in the Shaman's recovery phase; on a 1
      or 2 the winds dissipate.
    effect_i18n:
      es: >-
        El Chamán es inmune a todo el fuego de proyectiles. Tira un dado en la fase de recuperación
        del Chamán; con un 1 o 2, los vientos se disipan.
    name_i18n:
      es: Aullido del Norte
  - id: spell.norse-runes.angvars-fury
    roll: '2'
    name: Angvar's Fury
    difficulty: 7
    effect: >-
      All warriors within 8" of the Shaman gain +1 to hit in hand-to-hand combat against the
      opposing warband. Lasts till the start of the Norse player's next turn.
    effect_i18n:
      es: >-
        Todos los guerreros dentro de 8" del Chamán ganan +1 por impactar en combate cuerpo a cuerpo
        contra la banda rival. Dura hasta el principio del siguiente turno del jugador Nórdico.
    name_i18n:
      es: Furia de Angvar
  - id: spell.norse-runes.elviks-cold-spear
    roll: '3'
    name: Elvek's Cold Spear
    difficulty: 7
    effect: >-
      A razor sharp icicle with a range of 18" causes one S4 hit and strikes the first model in its
      path. Normal armour saves apply.
    effect_i18n:
      es: >-
        Un carámbano afilado como una cuchilla, con un alcance de 18", causa un impacto de F4 y
        golpea a la primera miniatura en su trayectoria. Se aplican las salvaciones por armadura
        normales.
    name_i18n:
      es: Lanza Gélida de Elvek
  - id: spell.norse-runes.gift-of-the-fates
    roll: '4'
    name: Gift of the Fates
    difficulty: 7
    effect: >-
      The Shaman may adjust one die roll by +1/-1 between a successful casting of this rune and his
      next recovery phase. A 'to wound' roll adjusted to or from 6 will not cause a critical.
    effect_i18n:
      es: >-
        El Chamán puede ajustar una tirada de dado en +1/-1 entre un lanzamiento exitoso de esta
        runa y su siguiente fase de recuperación. Una tirada de herir ajustada hacia o desde un 6 no
        causará un crítico.
    name_i18n:
      es: Don de las Parcas
  - id: spell.norse-runes.kiss-of-frost
    roll: '5'
    name: Kiss of Frost
    difficulty: 6
    effect: A single model within 12" must pass an Initiative test or be knocked down.
    effect_i18n:
      es: Una sola miniatura dentro de 12" debe superar un test de Iniciativa o ser derribada.
    name_i18n:
      es: Beso de Escarcha
  - id: spell.norse-runes.bears-might
    roll: '6'
    name: Bear's Might
    difficulty: 9
    effect: >-
      The Shaman gains +1 Attack, +2 Strength, +2 Toughness and -2 Initiative (minimum 1). Take a
      Leadership test at the beginning of each turn; if it fails, Bear's Might drains away. Can only
      be cast successfully once per game.
    effect_i18n:
      es: >-
        El Chamán gana +1 Ataque, +2 Fuerza, +2 Resistencia y -2 Iniciativa (mínimo 1). Haz un test
        de Liderazgo al principio de cada turno; si falla, la Fuerza del Oso se desvanece. Solo
        puede lanzarse con éxito una vez por partida.
    name_i18n:
      es: Poder del Oso
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Magic / Norse Runes
    url: https://mordheimer.net/docs/magic/norse-runes
  name_i18n:
    es: Runas Norse
- id: lore.magic-of-the-horned-rat
  name: Magic of the Horned Rat
  note: Used by Skaven Sorcerers (Clan Eshin and Clan Pestilens).
  note_i18n:
    es: La usan los Hechiceros Skaven (Clan Eshin y Clan Pestilens).
  spells:
  - id: spell.magic-of-the-horned-rat.warpfire
    roll: '1'
    name: Warpfire
    difficulty: 8
    effect: >-
      Range 8", hitting the first model in its path. Causes D3 Strength 4 hits on its target and one
      Strength 3 hit on each model within 2" of the target.
    effect_i18n:
      es: >-
        Alcance 8", golpea a la primera miniatura en su trayectoria. Causa D3 impactos de Fuerza 4
        en su objetivo y un impacto de Fuerza 3 en cada miniatura dentro de 2" del objetivo.
    name_i18n:
      es: Fuego de Disformidad
  - id: spell.magic-of-the-horned-rat.children-of-the-horned-rat
    roll: '2'
    name: Children of the Horned Rat
    difficulty: auto
    effect: >-
      Must be used before the game and only once. Summons D3 Giant Rats placed within 6" of the
      Sorcerer. The rats disappear after the battle and do not count towards the maximum size of the
      warband.
    effect_i18n:
      es: >-
        Debe usarse antes de la partida y solo una vez. Invoca D3 Ratas Gigantes colocadas dentro de
        6" del Hechicero. Las ratas desaparecen tras la batalla y no cuentan para el tamaño máximo
        de la banda.
    name_i18n:
      es: Hijos del Rata Cuernudo
  - id: spell.magic-of-the-horned-rat.gnawdoom
    roll: '3'
    name: Gnawdoom
    difficulty: 7
    effect: Causes 2D6 Strength 1 hits on a single model within 8" of the caster.
    effect_i18n:
      es: Causa 2D6 impactos de Fuerza 1 en una sola miniatura dentro de 8" del lanzador.
    name_i18n:
      es: Gnawdoom
  - id: spell.magic-of-the-horned-rat.black-fury
    roll: '4'
    name: Black Fury
    difficulty: 8
    effect: >-
      The Sorcerer may immediately charge any enemy model within 12" (ignoring terrain and
      interposing models) and gains 2 extra Attacks and +1 Strength during this turn's hand-to-hand
      combat phase only.
    effect_i18n:
      es: >-
        El Hechicero puede cargar inmediatamente contra cualquier miniatura enemiga dentro de 12"
        (ignorando terreno y miniaturas interpuestas) y gana 2 Ataques extra y +1 Fuerza durante
        este turno.
    name_i18n:
      es: Furia Negra
  - id: spell.magic-of-the-horned-rat.eye-of-the-warp
    roll: '5'
    name: Eye of the Warp
    difficulty: 8
    effect: >-
      All standing models in base contact with the Sorcerer must take an immediate Leadership test.
      On failure each suffers a Strength 3 hit and runs 2D6" directly away from the Sorcerer.
    effect_i18n:
      es: >-
        Todas las miniaturas en pie en contacto base con el Hechicero deben hacer un test de
        Liderazgo inmediato. Si fallan, cada una sufre un impacto de Fuerza 3 y corre 2D6"
        alejándose directamente del Hechicero.
    name_i18n:
      es: Ojo de la Disformidad
  - id: spell.magic-of-the-horned-rat.sorcerers-curse
    roll: '6'
    name: Sorcerer's Curse
    difficulty: 6
    effect: >-
      Range 12". The target must re-roll any successful armour saves and to hit rolls during the
      Skaven hand-to-hand phase and his own next shooting and hand-to-hand combat phases.
    effect_i18n:
      es: >-
        Alcance 12". El objetivo debe repetir todas sus tiradas de salvación por armadura y de
        impactar exitosas durante la fase de combate cuerpo a cuerpo Skaven y sus propias fases de
        disparo y combate cuerpo a cuerpo siguientes.
    name_i18n:
      es: Maldición del Hechicero
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Magic / Magic of the Horned Rat
    url: https://mordheimer.net/docs/magic/magic-of-the-horned-rat
  name_i18n:
    es: Magia del Rata Cuernudo
- id: lore.lore-of-darkness
  name: Lore of Darkness
  note: Used by the Dark Emissary.
  note_i18n:
    es: La usa el Emisario Oscuro.
  spells:
  - id: spell.lore-of-darkness.bolt-of-dark-light
    roll: '1'
    name: Bolt of Dark Light
    difficulty: 7
    effect: >-
      The Dark Emissary conjures a bolt of malign power. The bolt has a range of 12" and causes a
      single Strength 5 hit against the first model in its path.
    effect_i18n:
      es: >-
        El Emisario Oscuro conjura un rayo de poder maligno. El rayo tiene un alcance de 12" y causa
        un único impacto de Fuerza 5 contra la primera miniatura en su trayectoria.
    name_i18n:
      es: Rayo de Luz Oscura
  - id: spell.lore-of-darkness.betrayal-in-death
    roll: '2'
    name: Betrayal in Death
    difficulty: 8
    effect: >-
      Affects all enemy models slain in the shooting phase or close combat, lasting until the start
      of the caster's next turn. The slain reanimate and attack their comrades; if not in combat the
      model shoots if able, or charges if it has no missile weapons; if in combat it makes only a
      single attack, then falls dead once more.
    effect_i18n:
      es: >-
        Afecta a todas las miniaturas enemigas abatidas en la fase de disparo o combate cuerpo a
        cuerpo, y dura hasta el principio del siguiente turno del lanzador. Los abatidos se reaniman
        y atacan a sus camaradas; si no están en combate, la miniatura dispara si puede, o carga si
        no tiene armas de proyectiles; si está en combate, hace solo un único ataque y después
        vuelve a caer muerta.
    name_i18n:
      es: Traición en la Muerte
  - id: spell.lore-of-darkness.nightmare
    roll: '3'
    name: Nightmare
    difficulty: 7
    effect: >-
      Cast on an enemy model within 18". The model takes an immediate fear test as if charged by a
      fear-causing enemy; if failed it flees 2D6" away from the Dark Emissary.
    effect_i18n:
      es: >-
        Se lanza sobre una miniatura enemiga dentro de 18". La miniatura hace un test de miedo
        inmediato como si fuera cargada por un enemigo que cause miedo; si falla, huye 2D6"
        alejándose del Emisario Oscuro.
    name_i18n:
      es: Pesadilla
  - id: spell.lore-of-darkness.curse-of-the-dark-master
    roll: '4'
    name: Curse of the Dark Master
    difficulty: 8
    effect: >-
      Cast on a single model within 24". All of that model's rolls to hit for both shooting and
      combat are reduced by -1 until the start of the caster's next turn.
    effect_i18n:
      es: >-
        Se lanza sobre una sola miniatura dentro de 24". Todas las tiradas de impactar de esa
        miniatura, tanto de disparo como de combate, se reducen en -1 hasta el principio del
        siguiente turno del lanzador.
    name_i18n:
      es: Maldición del Señor Oscuro
  - id: spell.lore-of-darkness.fog-of-death
    roll: '5'
    name: Fog of Death
    difficulty: 10
    effect: >-
      A deep and impenetrable fog cloaks the entire battlefield. Affects every model on the board
      except the Dark Emissary; enemies are affected on a roll of 4+, friendly models on a 6+, all
      suffering a Strength 2 hit. The fog lasts until the start of the caster's next turn and
      reduces line of sight to 3D6" for all warriors, affecting shooting, charging and so on.
    effect_i18n:
      es: >-
        Una niebla densa e impenetrable cubre todo el campo de batalla. Afecta a todas las
        miniaturas del tablero excepto al Emisario Oscuro; los enemigos se ven afectados con un
        resultado de 4+, las miniaturas amigas con un 6+, y todas sufren un impacto de Fuerza 2. La
        niebla dura hasta el principio del siguiente turno del lanzador y reduce la línea de visión
        a 3D6" para todos los guerreros, afectando al disparo, la carga, etc.
    name_i18n:
      es: Niebla de Muerte
  - id: spell.lore-of-darkness.coils-of-the-serpent
    roll: '6'
    name: Coils of the Serpent
    difficulty: 10
    effect: >-
      Cast on a single enemy model within 6". The model takes an immediate toughness test; if failed
      it is crushed to death and out of action. No saves of any kind protect against this magic.
    effect_i18n:
      es: >-
        Se lanza sobre una sola miniatura enemiga dentro de 6". La miniatura hace un test de
        Resistencia inmediato; si falla, es aplastada hasta la muerte y queda Fuera de combate.
        Ninguna salvación de ningún tipo protege contra esta magia.
    name_i18n:
      es: Espiras de la Serpiente
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Magic / Lore of Darkness
    url: https://mordheimer.net/docs/magic/lore-of-darkness
  name_i18n:
    es: Sabiduría de la Oscuridad
- id: lore.lore-of-light
  name: Lore of Light
  note: Used by the Truthsayer.
  note_i18n:
    es: La usa el Decidor de Verdades.
  spells:
  - id: spell.lore-of-light.wings-of-fate
    roll: '1'
    name: Wings of Fate
    difficulty: 6
    effect: >-
      Conjures a flock of birds to sweep down and attack the enemy. The flock has a range of 18" and
      may attack any model within this range of the Truthsayer; the enemy model suffers D3 Strength
      2 hits.
    effect_i18n:
      es: >-
        Conjura una bandada de pájaros que se abalanza sobre el enemigo. La bandada tiene un alcance
        de 18" y puede atacar cualquier miniatura dentro de ese alcance del Vehedor; la miniatura
        enemiga sufre D3 impactos de Fuerza 2.
    name_i18n:
      es: Alas del Destino
  - id: spell.lore-of-light.light-of-battle
    roll: '2'
    name: Light of Battle
    difficulty: 6
    effect: >-
      Cast on a friendly model within 12". The model has an additional save of 5+ against all
      attacks until the start of the Truthsayer's next turn.
    effect_i18n:
      es: >-
        Se lanza sobre una miniatura amiga dentro de 12". La miniatura tiene una salvación adicional
        de 5+ contra todos los ataques hasta el principio del siguiente turno del Vehedor.
    name_i18n:
      es: Luz de Batalla
  - id: spell.lore-of-light.gift-of-life
    roll: '3'
    name: Gift of Life
    difficulty: 9
    effect: >-
      Cast on a friendly model slain in the previous enemy turn. The model is immediately restored
      to 1 wound remaining and placed as accurately as possible where it fell.
    effect_i18n:
      es: >-
        Se lanza sobre una miniatura amiga abatida en el turno enemigo anterior. La miniatura
        recupera inmediatamente 1 herida restante y se coloca lo más fielmente posible donde cayó.
    name_i18n:
      es: Don de Vida
  - id: spell.lore-of-light.blessing-of-valour
    roll: '4'
    name: Blessing of Valour
    difficulty: 8
    effect: >-
      Cast on a single friendly model within 24". The model gains +1 to all hit rolls in close
      combat for the duration of the turn.
    effect_i18n:
      es: >-
        Se lanza sobre una sola miniatura amiga dentro de 24". La miniatura gana +1 en todas sus
        tiradas de impactar en combate cuerpo a cuerpo durante ese turno.
    name_i18n:
      es: Bendición de Valentía
  - id: spell.lore-of-light.boon-of-courage
    roll: '5'
    name: Boon of Courage
    difficulty: 8
    effect: >-
      Affects all friendly models within 12". The models are completely immune to the effects of
      psychology and all alone tests until the end of the Truthsayer's next turn.
    effect_i18n:
      es: >-
        Afecta a todas las miniaturas amigas dentro de 12". Las miniaturas son completamente inmunes
        a los efectos de la psicología y a los tests de soledad hasta el final del siguiente turno
        del Vehedor.
    name_i18n:
      es: Don de Coraje
  - id: spell.lore-of-light.voice-of-command
    roll: '6'
    name: Voice of Command
    difficulty: 9
    effect: >-
      Affects one model within 24" of the Truthsayer. The model may do nothing in its next turn
      other than defend itself in combat; it may not move, shoot, attack or perform any other
      action.
    effect_i18n:
      es: >-
        Afecta a una miniatura dentro de 24" del Vehedor. La miniatura no puede hacer nada en su
        siguiente turno excepto defenderse en combate; no puede moverse, disparar, atacar ni
        realizar ninguna otra acción.
    name_i18n:
      es: Voz de Mando
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Magic / Lore of Light
    url: https://mordheimer.net/docs/magic/lore-of-light
  name_i18n:
    es: Sabiduría de la Luz
- id: lore.rituals-of-hashut
  name: Rituals of Hashut
  note: Used by Black Dwarfs Sorcerers. The Sorcerer starts with the Sacrificial Ritual (roll 0); all
    other rituals are determined by a D6 roll.
  note_i18n:
    es: >-
      La usan los Hechiceros Enanos Negros. El Hechicero empieza con el Ritual Sacrificial
      (tirada 0); todos los demás rituales se determinan con una tirada de D6.
  spells:
  - id: spell.rituals-of-hashut.sacrificial-ritual
    roll: '0'
    name: Sacrificial Ritual
    difficulty: 10
    effect: >-
      The Sorcerer must be in contact with an Engine of Chaos to cast. He removes one captive model
      from the Engine of Chaos and its starting warband roster. He may sacrifice additional captives
      before rolling to lower the difficulty by 1 per sacrifice. The Sorcerer gains +D3 Experience.
    effect_i18n:
      es: >-
        El Hechicero debe estar en contacto con un Motor del Caos para lanzarlo. Retira una
        miniatura cautiva del Motor del Caos y de la plantilla de su banda de origen. Puede
        sacrificar cautivos adicionales antes de tirar para reducir la dificultad en 1 por
        sacrificio. El Hechicero gana +D3 de Experiencia.
    name_i18n:
      es: Ritual de Sacrificio
  - id: spell.rituals-of-hashut.spirit-of-hashut
    roll: '1'
    name: Spirit of Hashut
    difficulty: 9
    effect: >-
      The player draws a line 18" from the Sorcerer. All models crossed by the line suffer one S4
      hit.
    effect_i18n:
      es: >-
        El jugador traza una línea de 18" desde el Hechicero. Todas las miniaturas cruzadas por la
        línea sufren un impacto de F4.
    name_i18n:
      es: Espíritu de Hashut
  - id: spell.rituals-of-hashut.bellow-of-doom
    roll: '2'
    name: Bellow of Doom
    difficulty: 8
    effect: >-
      All models engaged in base contact with the Sorcerer must make an immediate Leadership test or
      break from combat and run.
    effect_i18n:
      es: >-
        Todas las miniaturas en contacto base con el Hechicero deben hacer un test de Liderazgo
        inmediato o romper el combate y huir.
    name_i18n:
      es: Bramido de Perdición
  - id: spell.rituals-of-hashut.fumes-of-azgorh
    roll: '3'
    name: Fumes of Azgorh
    difficulty: 7
    effect: >-
      The spell has a range of 8", hitting all models in its path on a D6 score of 4+. Any model hit
      suffers a S4 hit, rolling to wound as normal. No armour saves are allowed.
    effect_i18n:
      es: >-
        El conjuro tiene un alcance de 8" y golpea a todas las miniaturas en su trayectoria con un
        resultado de 4+ en un D6. Cualquier miniatura golpeada sufre un impacto de F4, tirando para
        herir con normalidad. No se permiten salvaciones por armadura.
    name_i18n:
      es: Vapores de Azgorh
  - id: spell.rituals-of-hashut.flickering-hide
    roll: '4'
    name: Flickering Hide
    difficulty: 10
    effect: >-
      The Sorcerer may cast this spell upon himself or any one model within 6". The flaming hide
      negates any one wound suffered on a D6 roll of 4+. In hand-to-hand combat any model that hits
      the flaming hide suffers one S3 hit for each hit scored. The flaming hide lasts until the
      beginning of the Sorcerer's next shooting phase.
    effect_i18n:
      es: >-
        El Hechicero puede lanzar este conjuro sobre sí mismo o sobre cualquier miniatura dentro de
        6". La piel llameante anula una herida sufrida con un resultado de 4+ en un D6. En combate
        cuerpo a cuerpo, cualquier miniatura que golpee la piel llameante sufre un impacto de F3 por
        cada impacto logrado. La piel llameante dura hasta el principio de la siguiente fase de
        disparo del Hechicero.
    name_i18n:
      es: Piel Parpadeante
  - id: spell.rituals-of-hashut.lava-flow
    roll: '5'
    name: Lava Flow
    difficulty: 7
    effect: >-
      The Sorcerer may move 12" in any direction, even into combat, counting as a charge. Due to the
      nature of the spell he may only reappear on or below the ground.
    effect_i18n:
      es: >-
        El Hechicero puede moverse 12" en cualquier dirección, incluso hacia el combate, contando
        como una carga. Por la naturaleza del conjuro, solo puede reaparecer sobre el suelo o bajo
        él.
    name_i18n:
      es: Corriente de Lava
  - id: spell.rituals-of-hashut.earthquake
    roll: '6'
    name: Earthquake
    difficulty: 9
    effect: >-
      All models within 3" of the Sorcerer, friend or foe alike, must roll equal to or under their
      Initiative or suffer D3 S4 hits.
    effect_i18n:
      es: >-
        Todas las miniaturas dentro de 3" del Hechicero, amigas o enemigas, deben sacar igual o
        menos que su Iniciativa o sufrir D3 impactos de F4.
    name_i18n:
      es: Terremoto
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Magic / Rituals of Hashut
    url: https://mordheimer.net/docs/magic/rituals-of-hashut
  name_i18n:
    es: Rituales de Hashut
- id: lore.ladys-prayers
  name: Lady's Prayers
  note: Used by the Bretonnian Chapel Guard Damsel. Prayers are not regarded as spells, so any special
    protection against spells does not affect them.
  note_i18n:
    es: >-
      La usa la Dama de la Guardia de la Capilla Brettoniana. Las plegarias no se consideran
      hechizos, por lo que ninguna protección especial contra hechizos les afecta.
  spells:
  - id: spell.ladys-prayers.ladys-favors
    roll: '1'
    name: Lady's Favors
    difficulty: auto
    effect: >-
      All your heroes count as having Lucky Charms for this battle and ignore the first hit against
      them on a D6 roll of 4+. If they already own Lucky Charms, they may reroll a failed Lucky
      Charm save, accepting the second result.
    effect_i18n:
      es: >-
        Todos tus héroes cuentan como si llevaran Amuletos de la Suerte para esta batalla e ignoran
        el primer impacto contra ellos con un resultado de 4+ en un D6. Si ya tienen Amuletos de la
        Suerte, pueden repetir una salvación fallida de Amuleto de la Suerte, aceptando el segundo
        resultado.
    name_i18n:
      es: Favores de la Dama
  - id: spell.ladys-prayers.blessed-protection
    roll: '2'
    name: Blessed Protection
    difficulty: 8
    effect: >-
      The Damsel and any Bretonnians within 6" of her gain an unmodified ward save of 4+ against the
      effects of spells or prayers. Test each shooting phase; on a roll of 1 or 2 the spell
      dissipates.
    effect_i18n:
      es: >-
        La Dama y cualquier bretoniano dentro de 6" de ella ganan una salvación de protección no
        modificable de 4+ contra los efectos de conjuros u oraciones. Haz un test en cada fase de
        disparo; con un resultado de 1 o 2, el conjuro se disipa.
    name_i18n:
      es: Protección Bendecida
  - id: spell.ladys-prayers.swiftstride
    roll: '3'
    name: Swiftstride
    difficulty: 7
    effect: >-
      The Damsel may pick a friendly hero or henchman within 12" that charged or failed a charge
      this turn. That warrior gains +1 to hit on all attacks until the end of the turn. If not in
      combat, they may make an additional move of D6" towards an enemy; moving into base contact
      with an enemy counts as a charge.
    effect_i18n:
      es: >-
        La Dama puede elegir un héroe o secuaz amigo dentro de 12" que haya cargado o fallado una
        carga este turno. Ese guerrero gana +1 por impactar en todos sus ataques hasta el final del
        turno. Si no está en combate, puede hacer un movimiento adicional de D6" hacia un enemigo;
        moverse a contacto base con un enemigo cuenta como carga.
    name_i18n:
      es: Zancada Veloz
  - id: spell.ladys-prayers.ladys-scorn
    roll: '4'
    name: Lady's Scorn
    difficulty: 5
    effect: >-
      Anyone attempting to shoot at the Damsel must first pass a Leadership test or they are unable
      to fire this turn. This includes Silver Arrows, Crossbow Pistols, Hand-to-Hand Pistols and
      template shot weapons that she is within the path of. The spell lasts until the end of the
      game.
    effect_i18n:
      es: >-
        Quien intente disparar a la Dama debe superar primero un test de Liderazgo o no podrá
        disparar este turno. Esto incluye Flechas de Plata, Ballestas de Pistola, Pistolas de
        Combate y armas de plantilla cuya trayectoria la incluya. El conjuro dura hasta el final de
        la partida.
    name_i18n:
      es: Desdén de la Dama
  - id: spell.ladys-prayers.elixir-of-life
    roll: '5'
    name: Elixir of Life
    difficulty: 7
    effect: >-
      Any one model within 4" of the Damsel, including herself, is restored to its full quota of
      Wounds. Any friendly models within 4" that are stunned or knocked down immediately come to
      their senses, stand up and continue fighting as normal.
    effect_i18n:
      es: >-
        Cualquier miniatura dentro de 4" de la Dama, incluida ella misma, recupera todo su total de
        Heridas. Las miniaturas amigas dentro de 4" que estén aturdidas o derribadas recobran
        inmediatamente el sentido, se levantan y siguen luchando con normalidad.
    name_i18n:
      es: Elixir de Vida
  - id: spell.ladys-prayers.guiding-vision
    roll: '6'
    name: Guiding Vision
    difficulty: 6
    effect: >-
      The Damsel picks a friendly hero or henchman within 8". Until the start of her next shooting
      phase, that warrior may reroll one die roll they make and add +1 or -1 to the result.
    effect_i18n:
      es: >-
        La Dama elige un héroe o secuaz amigo dentro de 8". Hasta el principio de su siguiente fase
        de disparo, ese guerrero puede repetir una tirada de dado que haga y sumar +1 o -1 al
        resultado.
    name_i18n:
      es: Visión Guía
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Magic / Lady's Prayers
    url: https://mordheimer.net/docs/magic/ladys-prayers
  name_i18n:
    es: Plegarias de la Dama
- id: lore.nurgle-rituals
  name: Nurgle Rituals
  note: Used by the Carnival of Chaos Carnival Master.
  note_i18n:
    es: La usa el Maestro de Ceremonias del Carnaval del Caos.
  spells:
  - id: spell.nurgle-rituals.daemonic-vigour
    roll: '1'
    name: Daemonic Vigour
    difficulty: 8
    effect: >-
      Any Plague Bearers or Nurglings within 8" of the Master increase their Daemonic Aura save from
      5+ to 4+ until the beginning of their next turn.
    effect_i18n:
      es: >-
        Cualquier Portadores de la Plaga o Nurglins dentro de 8" del Maestro aumentan su salvación
        de Aura Demoníaca de 5+ a 4+ hasta el principio de su siguiente turno.
    name_i18n:
      es: Vigor Demoníaco
  - id: spell.nurgle-rituals.buboes
    roll: '2'
    name: Buboes
    difficulty: 7
    effect: >-
      The spell has a range of 8" and affects a single enemy warrior. The warrior must pass a
      Toughness test or lose a Wound. No armour saves are allowed.
    effect_i18n:
      es: >-
        El conjuro tiene un alcance de 8" y afecta a un solo guerrero enemigo. El guerrero debe
        superar un test de Resistencia o perder una Herida. No se permiten salvaciones por armadura.
    name_i18n:
      es: Bubones
  - id: spell.nurgle-rituals.stench-of-nurgle
    roll: '3'
    name: Stench of Nurgle
    difficulty: 8
    effect: >-
      The spell has a range of 6" and affects all living creatures, friend or foe. Each enemy
      warrior in range must pass a Toughness test or lose an Attack until their next turn.
    effect_i18n:
      es: >-
        El conjuro tiene un alcance de 6" y afecta a todas las criaturas vivas, amigas o enemigas.
        Cada guerrero enemigo dentro del alcance debe superar un test de Resistencia o perder un
        Ataque hasta su siguiente turno.
    name_i18n:
      es: Hedor de Nurgle
  - id: spell.nurgle-rituals.pestilence
    roll: '4'
    name: Pestilence
    difficulty: 10
    effect: >-
      All enemy models within 12" of the Master suffer a Strength 3 hit. No armour saves are
      allowed.
    effect_i18n:
      es: >-
        Todas las miniaturas enemigas dentro de 12" del Maestro sufren un impacto de Fuerza 3. No se
        permiten salvaciones por armadura.
    name_i18n:
      es: Pestilencia
  - id: spell.nurgle-rituals.scabrous-hide
    roll: '5'
    name: Scabrous Hide
    difficulty: 8
    effect: >-
      The Master's skin becomes tough and leathery. He has an armour save of 2+ which replaces any
      normal armour save. The scabrous hide lasts until the beginning of his next shooting phase.
    effect_i18n:
      es: >-
        La piel del Maestro se vuelve dura y correosa. Tiene una salvación por armadura de 2+ que
        sustituye cualquier salvación por armadura normal. La piel costra dura hasta el principio de
        su siguiente fase de disparo.
    name_i18n:
      es: Piel Costrosa
  - id: spell.nurgle-rituals.nurgles-rot
    roll: '6'
    name: Nurgle's Rot
    difficulty: 9
    effect: >-
      All enemy models in base contact with the Master must immediately test against their Toughness
      or contract Nurgle's Rot.
    effect_i18n:
      es: >-
        Todas las miniaturas enemigas en contacto base con el Maestro deben hacer un test de
        Resistencia inmediato o contraer la Peste de Nurgle.
    name_i18n:
      es: Podredumbre de Nurgle
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Magic / Nurgle Rituals
    url: https://mordheimer.net/docs/magic/nurgle-rituals
  name_i18n:
    es: Rituales de Nurgle
- id: lore.dark-elf-magic
  name: Dark Elf Magic
  note: Used by Dark Elf Sorceresses.
  note_i18n:
    es: La usan las Hechiceras de los Elfos Oscuros.
  spells:
  - id: spell.dark-elf-magic.doombolt
    roll: '1'
    name: Doombolt
    difficulty: 9
    effect: >-
      The bolt may be targeted at any enemy model in line of sight. It has an 18" range and causes a
      Strength 5 hit. If the target is wounded, the next closest model within 6" is also hit on a
      4+, at -1 Strength to the previous hit. The bolt keeps leaping until there are no more targets
      within range or its Strength drops to one. Each model can only be hit once per turn. Take
      armour saves as normal.
    effect_i18n:
      es: >-
        El rayo puede dirigirse contra cualquier miniatura enemiga con línea de visión. Tiene un
        alcance de 18" y causa un impacto de Fuerza 5. Si el objetivo es herido, la siguiente
        miniatura más cercana dentro de 6" también es golpeada con un 4+, con -1 de Fuerza respecto
        al impacto anterior. El rayo sigue saltando hasta que no queden objetivos dentro del alcance
        o su Fuerza baje a uno. Cada miniatura solo puede ser golpeada una vez por turno. Haz las
        salvaciones por armadura con normalidad.
    name_i18n:
      es: Rayo de Perdición
  - id: spell.dark-elf-magic.word-of-pain
    roll: '2'
    name: Word of Pain
    difficulty: 8
    effect: >-
      The spell may be cast at an enemy model within 12". The victim must reroll all successful
      hand-to-hand or missile attacks and all to wound rolls. To charge, the victim must first pass
      a successful Leadership test. The spell lasts until the beginning of the next Dark Elf turn.
    effect_i18n:
      es: >-
        El conjuro puede lanzarse sobre una miniatura enemiga dentro de 12". La víctima debe repetir
        todos sus ataques cuerpo a cuerpo o de proyectiles exitosos y todas sus tiradas de herir.
        Para cargar, la víctima debe superar primero un test de Liderazgo. El conjuro dura hasta el
        principio del siguiente turno del Elfo Oscuro.
    name_i18n:
      es: Palabra de Dolor
  - id: spell.dark-elf-magic.soul-stealer
    roll: '3'
    name: Soul Stealer
    difficulty: 9
    effect: >-
      The Sorceress makes a to hit roll against a model in base contact. If the attack is successful
      and her opponent is struck, he suffers a wound with no armour save possible. The Sorceress
      adds one wound to her profile. She can never have more than one extra wound from this spell
      and the extra wound is lost at the end of the battle.
    effect_i18n:
      es: >-
        La Hechicera hace una tirada de impactar contra una miniatura en contacto base. Si el ataque
        tiene éxito y golpea a su oponente, este sufre una herida sin posibilidad de salvación por
        armadura. La Hechicera añade una herida a su perfil. Nunca puede tener más de una herida
        extra por este conjuro, y la herida extra se pierde al final de la batalla.
    name_i18n:
      es: Ladronalmas
  - id: spell.dark-elf-magic.flamesword
    roll: '4'
    name: Flamesword
    difficulty: 8
    effect: >-
      The Sorceress may choose the hand-to-hand combat weapon of a member of her warband within 6"
      to be engulfed in flames. A weapon with these flames acts as a normal weapon of its type, but
      adds a +2 bonus to the user's Strength. Hits inflicted from the weapon ignore armour saves.
      Lasts until the Sorceress' next shooting phase.
    effect_i18n:
      es: >-
        La Hechicera puede elegir que el arma de combate cuerpo a cuerpo de un miembro de su banda
        dentro de 6" quede envuelta en llamas. Un arma con estas llamas actúa como un arma normal de
        su tipo, pero añade un bono de +2 a la Fuerza del usuario. Los impactos infligidos con el
        arma ignoran las salvaciones por armadura. Dura hasta la siguiente fase de disparo de la
        Hechicera.
    name_i18n:
      es: Espada Llameante
  - id: spell.dark-elf-magic.deathspasm
    roll: '5'
    name: Deathspasm
    difficulty: 10
    effect: >-
      The Deathspasm has a range of 6" and must be cast on the closest enemy model. The affected
      model must roll on the injury chart. If successfully cast, the casting Sorceress is
      immediately knocked down.
    effect_i18n:
      es: >-
        El Espasmo de Muerte tiene un alcance de 6" y debe lanzarse sobre la miniatura enemiga más
        cercana. La miniatura afectada debe tirar en la tabla de heridas. Si el conjuro se lanza con
        éxito, la Hechicera lanzadora queda inmediatamente derribada.
    name_i18n:
      es: Espasmo Mortal
  - id: spell.dark-elf-magic.witch-flight
    roll: '6'
    name: Witch Flight
    difficulty: 7
    effect: >-
      The Sorceress may immediately move anywhere within 12" and may count as charging. If she
      engages a fleeing enemy in the close combat phase she will score one automatic hit and then
      the opponent will flee again.
    effect_i18n:
      es: >-
        La Hechicera puede moverse inmediatamente a cualquier punto dentro de 12" y puede contar
        como cargando. Si alcanza a un enemigo en huida en la fase de combate cuerpo a cuerpo,
        logrará un impacto automático y después el oponente volverá a huir.
    name_i18n:
      es: Vuelo de Bruja
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Magic / Dark Elf Magic
    url: https://mordheimer.net/docs/magic/dark-elf-magic
  name_i18n:
    es: Magia de los Elfos Oscuros
- id: lore.onogal-rituals
  name: Onogal Rituals
  note: Modified Nurgle rituals used by Marauders of Chaos Seers with the Mark of Onogal the Crow.
  note_i18n:
    es: >-
      Rituales de Nurgle modificados, usados por los Videntes Merodeadores del Caos con la Marca
      de Onogal el Cuervo.
  spells:
  - id: spell.onogal-rituals.touch-of-onogal
    roll: '1'
    name: Touch of Onogal
    difficulty: 10
    effect: >-
      This spell can be used against one of the Seer's close combat opponents. If he takes the model
      out of action in the following hand-to-hand combat phase, the player rolls for Serious
      Injuries immediately. If the model dies permanently, replace it with a Nurgle Plague Bearer
      for the rest of the game under the Seer's control. If the Seer is stunned or taken out of
      action the Plague Bearer disappears into the Realm of Chaos. Only one Plague Bearer can be
      created at a time.
    effect_i18n:
      es: >-
        Este conjuro puede usarse contra uno de los oponentes de combate cuerpo a cuerpo del
        Vidente. Si lo pone Fuera de combate en la siguiente fase de combate cuerpo a cuerpo, el
        jugador tira inmediatamente en la tabla de Heridas graves. Si la miniatura muere
        permanentemente, sustitúyela por un Portador de la Plaga de Nurgle durante el resto de la
        partida bajo el control del Vidente. Si el Vidente queda aturdido o Fuera de combate, el
        Portador de la Plaga desaparece en el Reino del Caos. Solo puede crearse un Portador de la
        Plaga a la vez.
    name_i18n:
      es: Toque de Onogal
  - id: spell.onogal-rituals.buboes
    roll: '2'
    name: Buboes
    difficulty: 7
    effect: >-
      The spell has a range of 8" and affects a single enemy warrior. The warrior must pass a
      Toughness test or lose a Wound. No armour saves are allowed.
    effect_i18n:
      es: >-
        El conjuro tiene un alcance de 8" y afecta a un solo guerrero enemigo. El guerrero debe
        superar un test de Resistencia o perder una Herida. No se permiten salvaciones por armadura.
    name_i18n:
      es: Bubones
  - id: spell.onogal-rituals.stench-of-nurgle
    roll: '3'
    name: Stench of Nurgle
    difficulty: 8
    effect: >-
      The spell has a range of 6" and affects all living creatures, friend or foe. Each enemy
      warrior in range must pass a Toughness test or lose an Attack until their next turn.
    effect_i18n:
      es: >-
        El conjuro tiene un alcance de 6" y afecta a todas las criaturas vivas, amigas o enemigas.
        Cada guerrero enemigo dentro del alcance debe superar un test de Resistencia o perder un
        Ataque hasta su siguiente turno.
    name_i18n:
      es: Hedor de Nurgle
  - id: spell.onogal-rituals.pestilence
    roll: '4'
    name: Pestilence
    difficulty: 10
    effect: >-
      All enemy models within 12" of the Seer suffer a Strength 3 hit. No armour saves are allowed.
    effect_i18n:
      es: >-
        Todas las miniaturas enemigas dentro de 12" del Vidente sufren un impacto de Fuerza 3. No se
        permiten salvaciones por armadura.
    name_i18n:
      es: Pestilencia
  - id: spell.onogal-rituals.scabrous-hide
    roll: '5'
    name: Scabrous Hide
    difficulty: 8
    effect: >-
      The Seer has an armour save of 2+ which replaces any normal armour save. The scabrous hide
      lasts until the beginning of his next shooting phase.
    effect_i18n:
      es: >-
        El Vidente tiene una salvación por armadura de 2+ que sustituye cualquier salvación por
        armadura normal. La piel costra dura hasta el principio de su siguiente fase de disparo.
    name_i18n:
      es: Piel Costrosa
  - id: spell.onogal-rituals.nurgles-rot
    roll: '6'
    name: Nurgle's Rot
    difficulty: 9
    effect: >-
      All enemy models in base contact with the Seer must immediately test against their Toughness
      or contract Nurgle's Rot.
    effect_i18n:
      es: >-
        Todas las miniaturas enemigas en contacto base con el Vidente deben hacer un test de
        Resistencia inmediato o contraer la Peste de Nurgle.
    name_i18n:
      es: Podredumbre de Nurgle
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Magic / Onogal Rituals
    url: https://mordheimer.net/docs/magic/onogal-rituals
  name_i18n:
    es: Rituales de Onogal
- id: lore.shornaal-rituals
  name: Shornaal Rituals
  note: Used by Marauders of Chaos Seers with the Mark of Shornaal the Serpent.
  note_i18n:
    es: La usan los Videntes Merodeadores del Caos con la Marca de Shornaal la Serpiente.
  spells:
  - id: spell.shornaal-rituals.delicious-suffering
    roll: '1'
    name: Delicious Suffering
    difficulty: 8
    effect: >-
      All models, friend and foe except the Seer, within 3" must pass a Leadership test or are
      knocked down.
    effect_i18n:
      es: >-
        Todas las miniaturas, amigas y enemigas, excepto el Vidente, dentro de 3" deben superar un
        test de Liderazgo o son derribadas.
    name_i18n:
      es: Sufrimiento Delicioso
  - id: spell.shornaal-rituals.dance-of-the-serpent
    roll: '2'
    name: Dance of the Serpent
    difficulty: 8
    effect: >-
      All enemy models that are not immune to psychology suffer a -1 to hit against him in close
      combat. The dance lasts until the beginning of the Seer's next shooting phase.
    effect_i18n:
      es: >-
        Todas las miniaturas enemigas que no sean inmunes a la psicología sufren -1 por impactar
        contra él en combate cuerpo a cuerpo. La danza dura hasta el principio de la siguiente fase
        de disparo del Vidente.
    name_i18n:
      es: Danza de la Serpiente
  - id: spell.shornaal-rituals.endless-torment
    roll: '3'
    name: Endless Torment
    difficulty: 9
    effect: >-
      Choose one enemy model within 8". From now on the model must roll for injury at -1 after its
      recovery phase. For the duration of the torment the Seer can do nothing else; he may end the
      spell at the beginning of his turn, and if attacked in close combat he is hit automatically
      and the spell breaks.
    effect_i18n:
      es: >-
        Elige una miniatura enemiga dentro de 8". De ahora en adelante, la miniatura debe tirar en
        la tabla de heridas con -1 tras su fase de recuperación. Durante el tormento, el Vidente no
        puede hacer nada más; puede terminar el conjuro al principio de su turno, y si es atacado en
        combate cuerpo a cuerpo es golpeado automáticamente y el conjuro se rompe.
    name_i18n:
      es: Tormento Infinito
  - id: spell.shornaal-rituals.mystify
    roll: '4'
    name: Mystify
    difficulty: 8
    effect: >-
      A target enemy model within 8" has its Initiative reduced to 1 and always strikes last in
      close combat, even if it charges or is armed with a spear or pike. The spell lasts until the
      target passes a Leadership test during the recovery phase.
    effect_i18n:
      es: >-
        Una miniatura enemiga objetivo dentro de 8" ve su Iniciativa reducida a 1 y siempre golpea
        el último en combate cuerpo a cuerpo, incluso si carga o está armada con lanza o pica. El
        conjuro dura hasta que el objetivo supere un test de Liderazgo durante la fase de
        recuperación.
    name_i18n:
      es: Desconcertar
  - id: spell.shornaal-rituals.a-thousand-voices
    roll: '5'
    name: A Thousand Voices
    difficulty: 8
    effect: >-
      Choose one enemy model within 12". For the duration of the spell the model reduces its
      Leadership by D3 +1, to a minimum of 2, if it is not immune to psychology. The model must pass
      a Leadership test at the beginning of its turn to end the spell. The spell also breaks when
      the Seer loses a wound. Only one model can be enchanted at a time.
    effect_i18n:
      es: >-
        Elige una miniatura enemiga dentro de 12". Mientras dure el conjuro, la miniatura reduce su
        Liderazgo en D3 +1, hasta un mínimo de 2, si no es inmune a la psicología. La miniatura debe
        superar un test de Liderazgo al principio de su turno para terminar el conjuro. El conjuro
        también se rompe si el Vidente pierde una herida. Solo puede encantarse una miniatura a la
        vez.
    name_i18n:
      es: Mil Voces
  - id: spell.shornaal-rituals.shornaals-temptation
    roll: '6'
    name: Shornaal's Temptation
    difficulty: 7
    effect: >-
      Choose one enemy model within 8" that is not immune to psychology. The model must pass a
      Leadership test or the Seer gains control over it. The player may attempt to regain control at
      the beginning of his turn by passing a Leadership test. Only one model can be enchanted at a
      time. If the Seer is hit, by a missile or in close combat, he must pass a Leadership test or
      the spell ends.
    effect_i18n:
      es: >-
        Elige una miniatura enemiga dentro de 8" que no sea inmune a la psicología. La miniatura
        debe superar un test de Liderazgo o el Vidente gana el control sobre ella. El jugador puede
        intentar recuperar el control al principio de su turno superando un test de Liderazgo. Solo
        puede encantarse una miniatura a la vez. Si el Vidente es golpeado, por un proyectil o en
        combate cuerpo a cuerpo, debe superar un test de Liderazgo o el conjuro termina.
    name_i18n:
      es: Tentación de Shornaal
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Magic / Shornaal Rituals
    url: https://mordheimer.net/docs/magic/shornaal-rituals
  name_i18n:
    es: Rituales de Shornaal
- id: lore.tchar-rituals
  name: Tchar Rituals
  note: Used by Marauders of Chaos Seers with the Mark of Tchar the Eagle.
  note_i18n:
    es: La usan los Videntes Merodeadores del Caos con la Marca de Tchar el Águila.
  spells:
  - id: spell.tchar-rituals.tchars-blessing
    roll: '1'
    name: Tchar's Blessing
    difficulty: auto
    effect: >-
      This spell must be used before the game and may only be used once. The Seer may not cast
      spells in the following battle. After the game he gains D3 Experience points if he was not
      taken out of action.
    effect_i18n:
      es: >-
        Este conjuro debe usarse antes de la partida y solo puede usarse una vez. El Vidente no
        puede lanzar conjuros en la siguiente batalla. Tras la partida, gana D3 puntos de
        Experiencia si no quedó Fuera de combate.
    name_i18n:
      es: Bendición de Tchar
  - id: spell.tchar-rituals.dispel-magic
    roll: '2'
    name: Dispel Magic
    difficulty: 7
    effect: The Seer ends all effects of currently active spells.
    effect_i18n:
      es: El Vidente termina todos los efectos de los conjuros actualmente activos.
    name_i18n:
      es: Disipar Magia
  - id: spell.tchar-rituals.foresight
    roll: '3'
    name: Foresight
    difficulty: 10
    effect: >-
      This spell must be used before the game and may only be used once. Choose a warband. One
      randomly determined Hero of that warband must miss the following game. Models that are capable
      of casting spells or prayers are immune to this effect.
    effect_i18n:
      es: >-
        Este conjuro debe usarse antes de la partida y solo puede usarse una vez. Elige una banda.
        Un Héroe determinado aleatoriamente de esa banda debe perderse la siguiente partida. Las
        miniaturas capaces de lanzar conjuros u oraciones son inmunes a este efecto.
    name_i18n:
      es: Previsión
  - id: spell.tchar-rituals.wrath-of-the-great-eagle
    roll: '4'
    name: Wrath of the Great Eagle
    difficulty: 9
    effect: >-
      Choose one enemy model within 12". The model is hit with a Strength equal to the difference
      between the Seer's Experience points and the model's Experience, to a maximum of 10. Armour
      saves are taken as normal. If the victim has more Experience than the Seer, the Seer is hit
      instead.
    effect_i18n:
      es: >-
        Elige una miniatura enemiga dentro de 12". La miniatura es golpeada con una Fuerza igual a
        la diferencia entre los puntos de Experiencia del Vidente y la Experiencia de la miniatura,
        con un máximo de 10. Las salvaciones por armadura se hacen con normalidad. Si la víctima
        tiene más Experiencia que el Vidente, el golpeado es el Vidente.
    name_i18n:
      es: Ira del Gran Águila
  - id: spell.tchar-rituals.tchars-reward
    roll: '5'
    name: Tchar's Reward
    difficulty: 8
    effect: >-
      The Seer gets +1 on any one stat per 10 Experience points he has. Each stat may be increased
      only once through this spell. The power lasts until the end of the Seer's next shooting phase
      and can be re-cast in that phase.
    effect_i18n:
      es: >-
        El Vidente obtiene +1 en una característica cualquiera por cada 10 puntos de Experiencia que
        tenga. Cada característica solo puede aumentarse una vez mediante este conjuro. El poder
        dura hasta el final de la siguiente fase de disparo del Vidente y puede volver a lanzarse en
        esa fase.
    name_i18n:
      es: Recompensa de Tchar
  - id: spell.tchar-rituals.slave-to-chaos
    roll: '6'
    name: Slave to Chaos
    difficulty: 9
    effect: >-
      This spell has a range of 12" and causes one Strength 2 hit with no armour save. If the model
      is taken out of action, roll for Serious Injuries immediately. If it dies, replace the killed
      warrior with a Horror of Tzeentch until the end of the game. If the Seer is stunned or taken
      out of action the Horror disappears into the Realm of Chaos.
    effect_i18n:
      es: >-
        Este conjuro tiene un alcance de 12" y causa un impacto de Fuerza 2 sin salvación por
        armadura. Si la miniatura queda Fuera de combate, tira inmediatamente en la tabla de Heridas
        graves. Si muere, sustituye al guerrero muerto por un Horror de Tzeentch hasta el final de
        la partida. Si el Vidente queda aturdido o Fuera de combate, el Horror desaparece en el
        Reino del Caos.
    name_i18n:
      es: Esclavo del Caos
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Magic / Tchar Rituals
    url: https://mordheimer.net/docs/magic/tchar-rituals
  name_i18n:
    es: Rituales de Tchar
- id: lore.goblin-magic
  name: Goblin Magic
  note: Used by Night Goblins (web) Shamans.
  note_i18n:
    es: La usan los Chamanes de los Goblins Nocturnos (web).
  spells:
  - id: spell.goblin-magic.wind-of-gork
    roll: '1'
    name: Wind of Gork
    difficulty: 6
    effect: >-
      Range 12". The first model in its path must roll under its Toughness or take a Strength 2 hit
      and be knocked down automatically.
    effect_i18n:
      es: >-
        Alcance 12". La primera miniatura en su trayectoria debe sacar menos que su Resistencia o
        sufrir un impacto de Fuerza 2 y ser derribada automáticamente.
    name_i18n:
      es: Viento de Gork
  - id: spell.goblin-magic.gaze-of-mork
    roll: '2'
    name: Gaze of Mork
    difficulty: 8
    effect: Range 12". D3 Strength 3 hits strike the first model in their path.
    effect_i18n:
      es: Alcance 12". D3 impactos de Fuerza 3 golpean a la primera miniatura en su trayectoria.
    name_i18n:
      es: Mirada de Mork
  - id: spell.goblin-magic.eadbanger
    roll: '3'
    name: ’Eadbanger
    difficulty: 8
    effect: >-
      Range 6". Fire bolts equal to the number of the Shaman's Base Attacks, resolved with Strength
      equal to the Shaman's Toughness at the first model in their path. After the bolts effects are
      resolved, roll a die. On a 1 the Shaman has drawn upon too much power, collapses and goes out
      of action.
    effect_i18n:
      es: >-
        Alcance 6". Dispara rayos en número igual a los Ataques Base del Chamán, resueltos con una
        Fuerza igual a la Resistencia del Chamán, contra la primera miniatura en su trayectoria.
        Después de resolver los efectos de los rayos, tira un dado. Con un 1, el Chamán ha
        canalizado demasiado poder, se derrumba y queda Fuera de combate.
    name_i18n:
      es: Rompecabezas
  - id: spell.goblin-magic.leap-of-waaagh
    roll: '4'
    name: Leap of Waaagh!
    difficulty: 7
    effect: >-
      The Shaman or any other Goblin within 3" may be moved up to 12", ignoring terrain. If this
      move brings them into close combat, they count as charging in the close combat phase.
    effect_i18n:
      es: >-
        El Chamán o cualquier otro Trasgo dentro de 3" puede moverse hasta 12", ignorando el
        terreno. Si este movimiento los lleva a combate cuerpo a cuerpo, cuentan como cargando en la
        fase de combate cuerpo a cuerpo.
    name_i18n:
      es: Salto ¡Waaagh!
  - id: spell.goblin-magic.idol-of-gork
    roll: '5'
    name: Idol of Gork
    difficulty: 8
    effect: >-
      The Shaman gains +1 WS, +1 S and +1 A. This enhancement lasts until the Shaman takes a wound.
    effect_i18n:
      es: El Chamán gana +1 HA, +1 F y +1 A. Esta mejora dura hasta que el Chamán reciba una herida.
    name_i18n:
      es: Ídolo de Gork
  - id: spell.goblin-magic.ere-we-go
    roll: '6'
    name: ’Ere We Go!
    difficulty: 8
    effect: >-
      All friendly models within 6" of the Shaman treat stunned results on the injury table as
      knocked down instead. The effects last until the Shaman takes a wound.
    effect_i18n:
      es: >-
        Todas las miniaturas amigas dentro de 6" del Chamán tratan los resultados de aturdido de la
        tabla de heridas como derribado. Los efectos duran hasta que el Chamán reciba una herida.
    name_i18n:
      es: ¡Allá Vamos! ('Ere We Go!)
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Magic / Goblin Magic
    url: https://mordheimer.net/docs/magic/goblin-magic
  name_i18n:
    es: Magia Goblin
- id: lore.spells-of-the-djedhi
  name: Spells of the Djed'hi
  note: Used by the Elf Mage.
  note_i18n:
    es: La usa el Mago Elfo.
  spells:
  - id: spell.spells-of-the-djedhi.divination-of-shirath
    roll: '1'
    name: Divination of Shirath
    difficulty: 6
    effect: >-
      The Mage may reroll all his failed dice rolls, though the second result stands. The effect
      lasts until the beginning of the Mage's next turn.
    effect_i18n:
      es: >-
        El Mago puede repetir todas sus tiradas de dado fallidas, aunque el segundo resultado es
        definitivo. El efecto dura hasta el principio del siguiente turno del Mago.
    name_i18n:
      es: Adivinación de Shirath
  - id: spell.spells-of-the-djedhi.shimmering-shield
    roll: '2'
    name: Shimmering Shield
    difficulty: 7
    effect: >-
      This spell gives the Mage an additional unmodified 5+ save against all attacks. The effect
      lasts until the beginning of the Mage's next turn.
    effect_i18n:
      es: >-
        Este conjuro da al Mago una salvación adicional no modificable de 5+ contra todos los
        ataques. El efecto dura hasta el principio del siguiente turno del Mago.
    name_i18n:
      es: Escudo Refulgente
  - id: spell.spells-of-the-djedhi.statue-of-light
    roll: '3'
    name: Statue of Light
    difficulty: 7
    effect: >-
      The Mage chooses a single enemy model he can see. That model may not move as long as the Mage
      remains both static and alive. The Mage and the target may cast spells normally, but fight in
      close combat at -2 WS, minimum of 1.
    effect_i18n:
      es: >-
        El Mago elige una sola miniatura enemiga que pueda ver. Esa miniatura no puede moverse
        mientras el Mago permanezca estático y vivo. El Mago y el objetivo pueden lanzar conjuros
        con normalidad, pero luchan en combate cuerpo a cuerpo con -2 HA, mínimo 1.
    name_i18n:
      es: Estatua de Luz
  - id: spell.spells-of-the-djedhi.fleeting-shadows
    roll: '4'
    name: Fleeting Shadows
    difficulty: 8
    effect: >-
      The first time the Mage is hit in close combat or shooting, the hit is ignored. Move the Mage
      2" from his current position in a random direction, not off a cliff or similar. The spell
      remains in play until it saves the Mage from a hit, whereupon it is dispelled. It may not be
      cast again whilst it is in play.
    effect_i18n:
      es: >-
        La primera vez que el Mago sea golpeado en combate cuerpo a cuerpo o por disparos, el
        impacto se ignora. Mueve al Mago 2" desde su posición actual en una dirección aleatoria, sin
        caer por un precipicio o similar. El conjuro permanece en juego hasta que salve al Mago de
        un impacto, momento en el que se disipa. No puede volver a lanzarse mientras esté en juego.
    name_i18n:
      es: Sombras Fugaces
  - id: spell.spells-of-the-djedhi.hunters-fury
    roll: '5'
    name: Hunter's Fury
    difficulty: 9
    effect: >-
      The spell summons D3 +1 arrows which the Mage can use to shoot against one enemy model
      following the rules for normal shooting. The arrows have a range of 36". Use the Mage's own
      Ballistic Skill to determine hits, but ignore movement, range and cover penalties. Each arrow
      causes one S3 hit.
    effect_i18n:
      es: >-
        El conjuro invoca D3 +1 flechas que el Mago puede usar para disparar contra una miniatura
        enemiga siguiendo las reglas de disparo normales. Las flechas tienen un alcance de 36". Usa
        la propia Habilidad de Disparo del Mago para determinar los impactos, pero ignora las
        penalizaciones por movimiento, alcance y cobertura. Cada flecha causa un impacto de F3.
    name_i18n:
      es: Furia del Cazador
  - id: spell.spells-of-the-djedhi.silent-guardian
    roll: '6'
    name: Silent Guardian
    difficulty: 9
    effect: >-
      If the Mage is attacked in close combat, the guardian fights first with WS5, S3, making one
      attack per turn against each enemy that attacks the Mage. The guardian will not leave the
      Mage's side and can only be dispelled if the Mage casts another spell or dies. The guardian
      cannot be attacked in return.
    effect_i18n:
      es: >-
        Si el Mago es atacado en combate cuerpo a cuerpo, el guardián golpea primero con HA5 y F3,
        haciendo un ataque por turno contra cada enemigo que ataque al Mago. El guardián no se
        separará del lado del Mago y solo puede ser disipado si el Mago lanza otro conjuro o muere.
        El guardián no puede ser atacado en respuesta.
    name_i18n:
      es: Guardián Silencioso
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Magic / Spells of the Djed'hi
    url: https://mordheimer.net/docs/magic/spells-of-the-djedhi
  name_i18n:
    es: Hechizos de los Djed'hi
