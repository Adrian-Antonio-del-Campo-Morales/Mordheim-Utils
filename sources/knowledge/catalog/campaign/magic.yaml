- id: lore.dark-magic
  name: Dark Magic
  note: Used by the Dark Mage hired sword. Not indexed in the site's magic section; transcribed from the
    Dark Mage entry (Letters of the Damned 6).
  spells:
  - id: spell.dark-magic.banishment
    roll: '1'
    name: Banishment
    difficulty: 8
    effect: >-
      All Undead within 4\" of the Dark Mage must take an unmodified Leadership test or suffer a
      Strength 4 hit.
    effect_i18n:
      es: >-
        Todos los No Muertos dentro de 4" del Mago Oscuro deben hacer un test de Liderazgo no
        modificable o sufrir un impacto de Fuerza 4.
    name_i18n:
      es: Destierro
  - id: spell.dark-magic.soul-render
    roll: '2'
    name: Soul Render
    difficulty: 8
    effect: >-
      Soul Render is a magic missile spell with a range of 18 inches. If successfully cast, the
      spell causes D3 Strength 3 hits.
    effect_i18n:
      es: >-
        Rasga Almas es un conjuro de misil mágico con un alcance de 18 pulgadas. Si se lanza con
        éxito, el conjuro causa D3 impactos de Fuerza 3.
    name_i18n:
      es: Desgarrador de Almas
  - id: spell.dark-magic.shade-mount
    roll: '3'
    name: Shade Mount
    difficulty: 8
    effect: >-
      May be cast on the wizard himself or a Hero within 8 inches. Upon a successful casting the
      model may immediately fly up to 12 inches; moving into base-to-base contact counts as a
      charge.
    effect_i18n:
      es: >-
        Puede lanzarse sobre el propio mago o sobre un Héroe dentro de 8 pulgadas. Tras un
        lanzamiento exitoso, la miniatura puede volar inmediatamente hasta 12 pulgadas; moverse a
        contacto base cuenta como carga.
    name_i18n:
      es: Montura de Sombra
  - id: spell.dark-magic.jozuns-decay
    roll: '4'
    name: Jozun's Decay
    difficulty: 9
    effect: >-
      Range 12 inches. The target must pass a Leadership test or suffer a one-point reduction to its
      Toughness. Each Recovery phase the model must pass a Leadership test or lose a further point;
      at Toughness 0 it is removed from the game. A model may not be targeted more than once per
      game.
    effect_i18n:
      es: >-
        Alcance 12 pulgadas. El objetivo debe superar un test de Liderazgo o sufrir una reducción de
        un punto en su Resistencia. En cada fase de Recuperación, la miniatura debe superar un test
        de Liderazgo o perder otro punto; con Resistencia 0 se retira de la partida. Una miniatura
        no puede ser objetivo más de una vez por partida.
    name_i18n:
      es: Decadencia de Jozun
  - id: spell.dark-magic.cowel-of-pain
    roll: '5'
    name: Cowel of Pain
    difficulty: 6
    effect: >-
      Until the wizard's next magic phase he cannot be Stunned; treat 3-4 results as Knocked Down
      instead.
    effect_i18n:
      es: >-
        Hasta la siguiente fase de magia del mago, no puede quedar Aturdido; trata los resultados
        3-4 como Derribado en su lugar.
    name_i18n:
      es: Capucha del Dolor
  - id: spell.dark-magic.doom-and-dark
    roll: '6'
    name: Doom & Dark
    difficulty: 7
    effect: >-
      Any model within 2 inches of the Dark Mage must take an immediate All Alone test, even if in
      close combat. Should a model flee from close combat, free strikes occur as normal.
    effect_i18n:
      es: >-
        Cualquier miniatura dentro de 2 pulgadas del Mago Oscuro debe hacer un test de Soledad
        inmediato, incluso si está en combate cuerpo a cuerpo. Si una miniatura huye del combate
        cuerpo a cuerpo, los golpes libres se resuelven con normalidad.
    name_i18n:
      es: Perdición y Oscuridad
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Hired Swords / Grade 2A / Dark Mage (Dark Magic spell list)
    url: https://mordheimer.net/docs/campaigns/hired-swords/grade-2a
  name_i18n:
    es: Magia Oscura
