- id: lore.prayers-of-taal
  name: Prayers of Taal
  note: Used by the Ostlander Mercenaries Priest of Taal and the Horned Hunters Priest of Taal. Prayers
    of Taal work like Prayers of Sigmar; the Taal Priest never wears armour (clarified as heavy armour
    only, so Light Armour, Helmets and Shields are allowed).
  note_i18n:
    es: >-
      La usan el Sacerdote de Taal de los Mercenarios Ostlanders y el Sacerdote de Taal de los
      Cazadores Cornudos. Las Plegarias de Taal funcionan como las Plegarias de Sigmar; el
      Sacerdote de Taal nunca lleva armadura (aclarado como solo armadura pesada, así que se
      permiten armadura ligera, yelmos y escudos).
  spells:
  - id: spell.prayers-of-taal.stags-leap
    roll: '1'
    name: Stag's Leap
    difficulty: 7
    effect: >-
      The Priest of Taal may immediately move anywhere within 9", including into base contact with
      the enemy, in which case he counts as charging and gains +1 Strength to his first round of
      attacks. If he engages a fleeing enemy, in the close combat phase he scores one automatic hit
      at +1 Strength and then his opponent will flee again, if he survives.
    effect_i18n:
      es: >-
        El Sacerdote de Taal puede moverse inmediatamente a cualquier punto dentro de 9", incluso a
        contacto base con el enemigo, en cuyo caso cuenta como cargando y gana +1 Fuerza en su
        primer asalto de ataques. Si alcanza a un enemigo en huida, en la fase de combate cuerpo a
        cuerpo logra un impacto automático con +1 Fuerza y después su oponente volverá a huir, si
        sobrevive.
    name_i18n:
      es: Salto del Ciervo
  - id: spell.prayers-of-taal.blessed-ale
    roll: '2'
    name: Blessed Ale
    difficulty: 5
    effect: >-
      Drinking a flask of Taal-blessed ale may heal any one model within 2" of the Priest, including
      himself. The warrior is restored to his full quota of Wounds. Any living enemy models, not
      Undead or Possessed, within 2" of the Priest lose 1 Attack during the next round of combat due
      to the fumes of the ale.
    effect_i18n:
      es: >-
        Beber una cantimplora de cerveza bendecida por Taal puede curar a cualquier miniatura dentro
        de 2" del Sacerdote, incluido él mismo. El guerrero recupera todo su total de Heridas. Las
        miniaturas enemigas vivas, no No Muertas ni Poseídas, dentro de 2" del Sacerdote pierden 1
        Ataque durante la siguiente ronda de combate por los vapores de la cerveza.
    name_i18n:
      es: Cerveza Bendecida
  - id: spell.prayers-of-taal.bears-paw
    roll: '3'
    name: Bear's Paw
    difficulty: 7
    effect: >-
      The Priest invokes the blessing of Taal on himself or a single friendly model within 6". The
      target receives a bonus of +2 to his Strength until the Priest's next turn.
    effect_i18n:
      es: >-
        El Sacerdote invoca la bendición de Taal sobre sí mismo o sobre una sola miniatura amiga
        dentro de 6". El objetivo recibe un bono de +2 a su Fuerza hasta el siguiente turno del
        Sacerdote.
    name_i18n:
      es: Garra de Oso
  - id: spell.prayers-of-taal.earthshudder
    roll: '4'
    name: Earthshudder
    difficulty: 9
    effect: >-
      The spell is cast on a single building within 4". Any enemy models touching the building
      suffer a single S3 hit. In addition the building collapses and any models on it count as
      having fallen to the ground. Remove the terrain feature from the board for the rest of the
      game.
    effect_i18n:
      es: >-
        El conjuro se lanza sobre un solo edificio dentro de 4". Cualquier miniatura enemiga que
        toque el edificio sufre un único impacto de F3. Además, el edificio se derrumba y las
        miniaturas sobre él cuentan como caídas al suelo. Retira el elemento de terreno del tablero
        por el resto de la partida.
    name_i18n:
      es: Sacudida Telúrica
  - id: spell.prayers-of-taal.tanglefoot
    roll: '5'
    name: Tanglefoot
    difficulty: 8
    effect: >-
      Plants, vines and small trees burst forth from the earth. All models, friend as well as foe,
      with the exception of Ostlander Jaegers and friendly Horned Hunter Zealots, within 12" of the
      Priest can only move at half speed until the next shooting phase.
    effect_i18n:
      es: >-
        Plantas, enredaderas y árboles pequeños brotan de la tierra. Todas las miniaturas, amigas y
        enemigas, con la excepción de los Cazadores Jaegers de Ostland y los Zelotes Cuernos del
        Cazador amigos, dentro de 12" del Sacerdote solo pueden moverse a media velocidad hasta la
        siguiente fase de disparo.
    name_i18n:
      es: Pies Atados
  - id: spell.prayers-of-taal.summon-squirrels
    roll: '6'
    name: Summon Squirrels
    difficulty: 7
    effect: >-
      The furious rodents assault one enemy within 12" of the Priest. The target suffers 2D6
      Strength 1 hits. No armour saves are allowed.
    effect_i18n:
      es: >-
        Los furiosos roedores asaltan a un enemigo dentro de 12" del Sacerdote. El objetivo sufre
        2D6 impactos de Fuerza 1. No se permiten salvaciones por armadura.
    name_i18n:
      es: Invocar Ardillas
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Magic / Prayers of Taal
    url: https://mordheimer.net/docs/magic/prayers-of-taal
  name_i18n:
    es: Plegarias de Taal
- id: lore.funerary-rites
  name: Funerary Rites
  note: Used by the Priest of Morr.
  note_i18n:
    es: La usa el Sacerdote de Morr.
  spells:
  - id: spell.funerary-rites.morrs-protection
    roll: '1'
    name: Morr's Protection
    difficulty: 6
    effect: >-
      Any magical attacks made by a Necromancer, a Magister or Daemons that would be considered a
      direct attack on the priest are negated if this rite is successful.
    effect_i18n:
      es: >-
        Cualquier ataque mágico hecho por un Nigromante, un Magister o Demonios que pudiera
        considerarse un ataque directo contra el sacerdote se anula si este rito tiene éxito.
    name_i18n:
      es: Protección de Morr
  - id: spell.funerary-rites.death-holds-no-fear
    roll: '2'
    name: Death Holds No Fear
    difficulty: auto
    effect: The Priest of Morr is fearless for the remainder of the game.
    effect_i18n:
      es: El Sacerdote de Morr es intrépido por el resto de la partida.
    name_i18n:
      es: La Muerte No Da Miedo
  - id: spell.funerary-rites.sanctity-of-the-fallen
    roll: '3'
    name: Sanctity of the Fallen
    difficulty: 7
    effect: >-
      The Priest of Morr may perform the Rite of Sanctity on a model, friend or foe, that has been
      taken out of action, provided he is within 6" of it. If successful, the model may not be
      raised up by a Necromancer.
    effect_i18n:
      es: >-
        El Sacerdote de Morr puede realizar el Rito de Santidad sobre una miniatura, amiga o
        enemiga, que haya quedado Fuera de combate, siempre que esté dentro de 6" de ella. Si tiene
        éxito, la miniatura no puede ser resucitada por un Nigromante.
    name_i18n:
      es: Santidad de los Caídos
  - id: spell.funerary-rites.hand-of-morr
    roll: '4'
    name: Hand of Morr
    difficulty: 9
    effect: >-
      The Priest of Morr must be in base-to-base contact with an Undead model. Before hand-to-hand
      combat occurs he may use the Hand of Morr. If successful the foe immediately goes out of
      action, affecting Zombies, Dire Wolves and Vampires. Ghouls and Possessed affected flee their
      full Move away from the Priest of Morr.
    effect_i18n:
      es: >-
        El Sacerdote de Morr debe estar en contacto base con una miniatura No Muerta. Antes de que
        se produzca el combate cuerpo a cuerpo, puede usar la Mano de Morr. Si tiene éxito, el
        enemigo queda inmediatamente Fuera de combate; afecta a Zombis, Lobos Dire y Vampiros. Los
        Ghouls y Poseídos afectados huyen todo su Movimiento alejándose del Sacerdote de Morr.
    name_i18n:
      es: Mano de Morr
  - id: spell.funerary-rites.do-you-know-who-i-am
    roll: '5'
    name: Do You Know Who I Am?
    difficulty: 7
    effect: >-
      This rite has a range of 6" and must be directed at the closest Undead model first, or if no
      Undead are within range, at the next closest human servant of the Undead, or finally at any
      model. If successful, that model is immediately Stunned. If the model cannot be Stunned, it is
      Knocked Down instead.
    effect_i18n:
      es: >-
        Este rito tiene un alcance de 6" y debe dirigirse primero a la miniatura No Muerta más
        cercana, o si no hay No Muertos dentro del alcance, al siguiente siervo humano de los No
        Muertos más cercano, o finalmente a cualquier miniatura. Si tiene éxito, esa miniatura queda
        inmediatamente Aturdida. Si la miniatura no puede quedar Aturdida, se derriba en su lugar.
    name_i18n:
      es: ¿Sabes Quién Soy?
  - id: spell.funerary-rites.i-am-death
    roll: '6'
    name: I Am Death!
    difficulty: 8
    effect: >-
      This spell gives the Priest of Morr a 6+ armour save and increases his WS by either +1 or to
      4, whichever is greater.
    effect_i18n:
      es: >-
        Este conjuro da al Sacerdote de Morr una salvación por armadura de 6+ y aumenta su HA en +1
        o hasta 4, lo que sea mayor.
    name_i18n:
      es: ¡Yo Soy la Muerte!
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Magic / Funerary Rites
    url: https://mordheimer.net/docs/magic/funerary-rites
  name_i18n:
    es: Ritos Funerarios
- id: lore.shadow-warrior-magic
  name: Shadow Warrior Magic
  note: Used by the Shadow Warriors Shadow Weaver. Several of these spells require the target to be within
    a certain distance of a wall; this may include any piece of terrain that could cast a man-sized shadow.
  note_i18n:
    es: >-
      La usa el Tejedor de Sombras de los Guerreros de las Sombras. Varios de estos hechizos
      exigen que el objetivo esté a cierta distancia de un muro; esto puede incluir cualquier
      pieza de terreno que pueda proyectar una sombra del tamaño de un hombre.
  spells:
  - id: spell.shadow-warrior-magic.pool-of-shadow
    roll: '1'
    name: Pool of Shadow
    difficulty: 7
    effect: >-
      The mage and all allies within 6" may Hide, exactly as if there were a wall or other
      obstruction between them and their enemies, even after marching. The hiding is disrupted if
      any enemy enters the area of effect. In addition, all affected count as being in cover against
      enemy shooting. The spell lasts until the start of the Shadow Weaver's next turn.
    effect_i18n:
      es: >-
        El mago y todos los aliados dentro de 6" pueden Ocultarse exactamente como si hubiera un
        muro u otro obstáculo entre ellos y sus enemigos, incluso después de marchar. La ocultación
        se interrumpe si cualquier enemigo entra en el área de efecto. Además, todos los afectados
        cuentan como en cobertura contra el disparo enemigo. El conjuro dura hasta el principio del
        siguiente turno del Tejedor de Sombras.
    name_i18n:
      es: Charco de Sombra
  - id: spell.shadow-warrior-magic.the-living-shadows
    roll: '2'
    name: The Living Shadows
    difficulty: 7
    effect: >-
      The Shadow Weaver may cast this spell at any enemy model within 12" of him and within 2" of a
      wall. The target suffers a single Strength 4 hit with no armour saves.
    effect_i18n:
      es: >-
        El Tejedor de Sombras puede lanzar este conjuro contra cualquier miniatura enemiga dentro de
        12" de él y dentro de 2" de un muro. El objetivo sufre un único impacto de Fuerza 4 sin
        salvaciones por armadura.
    name_i18n:
      es: Las Sombras Vivientes
  - id: spell.shadow-warrior-magic.wings-of-night
    roll: '3'
    name: Wings of Night
    difficulty: 6
    effect: >-
      This spell may only be cast if the Shadow Weaver is within 2" of a wall. He is instantly moved
      up to 12" to a place that is also within 2" of a wall. If moved into contact with an enemy
      model, the Shadow Weaver counts as charging in the first round.
    effect_i18n:
      es: >-
        Este conjuro solo puede lanzarse si el Tejedor de Sombras está dentro de 2" de un muro. Se
        traslada instantáneamente hasta 12" a un lugar que también esté dentro de 2" de un muro. Si
        se mueve a contacto con una miniatura enemiga, el Tejedor de Sombras cuenta como cargando en
        la primera ronda.
    name_i18n:
      es: Alas de la Noche
  - id: spell.shadow-warrior-magic.cloak-of-darkness
    roll: '4'
    name: Cloak of Darkness
    difficulty: 7
    effect: >-
      The Shadow Weaver is effectively concealed from enemy sight. As long as he does not attack any
      enemy models, he may not be attacked. He may intercept as normal if his controller wishes. The
      spell lasts until the Shadow Weaver attacks an enemy model. A model engaged in close combat
      with an enemy may never choose to not attack.
    effect_i18n:
      es: >-
        El Tejedor de Sombras queda efectivamente oculto a la vista enemiga. Mientras no ataque a
        ninguna miniatura enemiga, no puede ser atacado. Puede interceptar con normalidad si su
        controlador lo desea. El conjuro dura hasta que el Tejedor de Sombras ataque a una miniatura
        enemiga. Una miniatura en combate cuerpo a cuerpo con un enemigo nunca puede elegir no
        atacar.
    name_i18n:
      es: Capa de Oscuridad
  - id: spell.shadow-warrior-magic.shadowbind
    roll: '5'
    name: Shadowbind
    difficulty: 9
    effect: >-
      The Shadow Weaver may cast this spell at any enemy model within 24" of him and within 2" of a
      wall. The target may not move unless it first passes a Strength test on 1D6 +1 at the start of
      its turn, before the recovery phase. The spell lasts until the Shadow Weaver suffers a wound
      or attempts to cast another spell. If attacked while affected, treat the target exactly as if
      he were Stunned.
    effect_i18n:
      es: >-
        El Tejedor de Sombras puede lanzar este conjuro contra cualquier miniatura enemiga dentro de
        24" de él y dentro de 2" de un muro. El objetivo no puede moverse salvo que supere primero
        un test de Fuerza en 1D6 +1 al principio de su turno, antes de la fase de recuperación. El
        conjuro dura hasta que el Tejedor de Sombras sufra una herida o intente lanzar otro conjuro.
        Si es atacado mientras está afectado, trata al objetivo exactamente como si estuviera
        Aturdido.
    name_i18n:
      es: Vínculo de Sombra
  - id: spell.shadow-warrior-magic.shield-of-shadow
    roll: '6'
    name: Shield of Shadow
    difficulty: 7
    effect: >-
      The Shadow Weaver may cast this spell on himself or a member of his warband within 12". The
      target receives an armour save of 5+ that is not modified by the attacker's Strength. The
      spell lasts until the start of the Shadow Weaver's next turn.
    effect_i18n:
      es: >-
        El Tejedor de Sombras puede lanzar este conjuro sobre sí mismo o sobre un miembro de su
        banda dentro de 12". El objetivo recibe una salvación por armadura de 5+ que no se ve
        modificada por la Fuerza del atacante. El conjuro dura hasta el principio del siguiente
        turno del Tejedor de Sombras.
    name_i18n:
      es: Escudo de Sombra
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Magic / Shadow Warrior Magic
    url: https://mordheimer.net/docs/magic/shadow-warrior-magic
  name_i18n:
    es: Magia de los Guerreros de las Sombras
- id: lore.amazon-rituals
  name: Amazon Rituals
  note: Used by the Amazons (Lustria) Serpent Priestess and the Amazons (Mordheim) Priestess.
  note_i18n:
    es: La usan la Sacerdotisa Serpiente de las Amazonas (Lustria) y la Sacerdotisa de las Amazonas (Mordheim).
  spells:
  - id: spell.amazon-rituals.singing-wind
    roll: '1'
    name: Singing Wind
    difficulty: 8
    effect: >-
      Singing motes and dancing lights entrance and hold any model within 10" until the start of the
      Amazon player's next turn. The model cannot move, shoot or cast spells, but may defend itself
      in hand-to-hand combat. Affected models automatically go last in combat.
    effect_i18n:
      es: >-
        Motas cantarinas y luces danzantes embelesan y retienen a cualquier miniatura dentro de 10"
        hasta el principio del siguiente turno del jugador Amazona. La miniatura no puede moverse,
        disparar ni lanzar conjuros, pero puede defenderse en combate cuerpo a cuerpo. Las
        miniaturas afectadas golpean automáticamente las últimas en combate.
    name_i18n:
      es: Viento Cantante
  - id: spell.amazon-rituals.serpents-strength
    roll: '2'
    name: Serpent's Strength
    difficulty: 9
    effect: >-
      Any model within 8" of the Priestess, including herself, adds +1 to their Strength until the
      end of their next turn. The ritual cannot be cast if the Priestess is in close combat during
      her shooting phase.
    effect_i18n:
      es: >-
        Cualquier miniatura dentro de 8" de la Sacerdotisa, incluida ella misma, suma +1 a su Fuerza
        hasta el final de su siguiente turno. El ritual no puede lanzarse si la Sacerdotisa está en
        combate cuerpo a cuerpo durante su fase de disparo.
    name_i18n:
      es: Fuerza de la Serpiente
  - id: spell.amazon-rituals.wendalas-maelstrom
    roll: '3'
    name: Wendala's Maelstrom
    difficulty: 7
    effect: >-
      The storm extends out from the Priestess 18". All attempts to shoot missile weapons by the
      enemy are at -1 to hit. The ritual lasts until the start of the Amazon player's next turn.
    effect_i18n:
      es: >-
        La tormenta se extiende desde la Sacerdotisa 18". Todos los intentos de disparo de armas de
        proyectiles del enemigo se hacen con -1 por impactar. El ritual dura hasta el principio del
        siguiente turno del jugador Amazona.
    name_i18n:
      es: Maelstrom de Wendala
  - id: spell.amazon-rituals.shield-of-thorns
    roll: '4'
    name: Shield of Thorns
    difficulty: 7
    effect: >-
      The ritual produces a cocoon of thorns about the Priestess, making her immune to ranged or
      magical attacks. Any models wishing to charge the Priestess may do so, but the thorns negate
      any strikes by the Priestess and her enemies in the first round of combat. The Priestess
      cannot cast this ritual while in hand-to-hand combat.
    effect_i18n:
      es: >-
        El ritual produce un capullo de espinas alrededor de la Sacerdotisa, haciéndola inmune a los
        ataques a distancia o mágicos. Las miniaturas que quieran cargar contra la Sacerdotisa
        pueden hacerlo, pero las espinas anulan los golpes de la Sacerdotisa y de sus enemigos en la
        primera ronda de combate. La Sacerdotisa no puede lanzar este ritual mientras esté en
        combate cuerpo a cuerpo.
    name_i18n:
      es: Escudo de Espinas
  - id: spell.amazon-rituals.the-living-jungle
    roll: '5'
    name: The Living Jungle
    difficulty: 6
    effect: >-
      Pick one model within 12". The model is swarmed by a savage mix of snakes, spiders and
      insects, most of them poisonous. The afflicted model takes 1D6 Strength 2 hits with no armour
      saves allowed apart from ward saves. A dodge save cannot be used against a swarm.
    effect_i18n:
      es: >-
        Elige una miniatura dentro de 12". La miniatura es asaltada por una mezcla salvaje de
        serpientes, arañas e insectos, la mayoría venenosos. La miniatura afligida sufre 1D6
        impactos de Fuerza 2 sin permitirse salvaciones por armadura, salvo salvaciones de
        protección. Una salvación de esquiva no puede usarse contra un enjambre.
    name_i18n:
      es: La Selva Viviente
  - id: spell.amazon-rituals.sirens-dreams
    roll: '6'
    name: Siren's Dreams
    difficulty: 7
    effect: >-
      The song momentarily distracts the Amazons' enemies within 12", so all Leadership tests for
      the opposing warband are made at -1 until the end of the opposing player's next turn.
      Lizardmen and Undead are immune to the effects of this ritual.
    effect_i18n:
      es: >-
        El canto distrae momentáneamente a los enemigos de las Amazonas dentro de 12", de modo que
        todos los tests de Liderazgo de la banda rival se hacen con -1 hasta el final del siguiente
        turno del jugador rival. Los Hombres Lagarto y los No Muertos son inmunes a los efectos de
        este ritual.
    name_i18n:
      es: Sueños de Sirena
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Magic / Amazon Rituals
    url: https://mordheimer.net/docs/magic/amazon-rituals
  name_i18n:
    es: Rituales de las Amazonas
- id: lore.necromancy-restless-dead
  name: Necromancy (the Restless Dead)
  note: 'Used by The Restless Dead Liche and Necromancer. Similar to the original Necromancy list, but
    revised for a Restless Dead warband. Roll 6 covers two spells: Deathly Visage (Necromancers only)
    and Living Horror (Liche only).'
  note_i18n:
    es: >-
      La usan el Liche y el Nigromante de los Muertos Inquietos. Similar a la lista de
      Nigromancia original, pero revisada para una banda de Muertos Inquietos. La tirada de 6
      cubre dos hechizos: Deathly Visage (solo Nigromantes) y Living Horror (solo Liche).
  spells:
  - id: spell.necromancy-restless-dead.spell-of-awakening
    roll: '1'
    name: Spell of Awakening
    difficulty: auto
    effect: >-
      If an enemy Hero is killed, i.e. the opponent rolls 11-15 on the serious injury chart after
      the battle, the Sorcerer may raise him to fight as a Zombie in his servitude. The dead Hero
      retains his characteristics and all his weapons and armour but may not use any equipment or
      skills. He may no longer run, counts as a Henchmen group on his own and does not gain
      additional experience.
    effect_i18n:
      es: >-
        Si un Héroe enemigo muere, es decir, si el oponente saca 11-15 en la tabla de heridas graves
        después de la batalla, el Hechicero puede resucitarlo para que luche como Zombi a su
        servicio. El Héroe muerto conserva sus características y todas sus armas y armadura, pero no
        puede usar ningún otro equipo ni habilidades. Ya no puede correr, cuenta como un grupo de
        Secuaces por sí solo y no gana experiencia adicional.
    name_i18n:
      es: Hechizo de Despertar
  - id: spell.necromancy-restless-dead.lifestealer
    roll: '2'
    name: Lifestealer
    difficulty: 10
    effect: >-
      Choose a single model within 6". The target suffers a wound with no saves allowed and the
      Sorcerer gains an extra wound for the duration of the battle. This may take the Wounds of a
      Necromancer above their original maximum, but a Liche may only restore lost wounds. This spell
      will not affect the Possessed or any Undead models.
    effect_i18n:
      es: >-
        Elige una sola miniatura dentro de 6". El objetivo sufre una herida sin permitirse
        salvaciones y el Hechicero gana una herida extra durante el resto de la batalla. Esto puede
        llevar las Heridas de un Nigromante por encima de su máximo original, pero un Liche solo
        puede restaurar heridas perdidas. Este conjuro no afecta a los Poseídos ni a ninguna
        miniatura No Muerta.
    name_i18n:
      es: Robavidas
  - id: spell.necromancy-restless-dead.reanimation
    roll: '3'
    name: Reanimation
    difficulty: 5
    effect: >-
      One Zombie that went out of action during the last hand-to-hand combat phase immediately
      returns to battle, placed within 6" of the Sorcerer and not straight into hand-to-hand combat.
      The spell can be used on Grave Guards and Wights to restore 1 lost wound. It cannot bring
      Scarecrows, Grave Guards, Wights or Skeletons back to life as it does Zombies.
    effect_i18n:
      es: >-
        Un Zombi que quedó Fuera de combate durante la última fase de combate cuerpo a cuerpo vuelve
        inmediatamente a la batalla, colocado dentro de 6" del Hechicero y nunca directamente en
        combate cuerpo a cuerpo. El conjuro puede usarse en Guardias de Tumba y Espectros para
        restaurar 1 herida perdida. No puede devolver la vida a Espantapájaros, Guardias de Tumba,
        Espectros ni Esqueletos como hace con los Zombis.
    name_i18n:
      es: Reanimación
  - id: spell.necromancy-restless-dead.spell-of-doom
    roll: '4'
    name: Spell of Doom
    difficulty: 9
    effect: >-
      Choose one enemy model within 12". The model must roll equal to or less than his Strength on a
      D6 or the dead emerging from the earth will rend him with supernatural power. If he fails, you
      may roll on the injury table to see what happens to him.
    effect_i18n:
      es: >-
        Elige una miniatura enemiga dentro de 12". La miniatura debe sacar en un D6 igual o menos
        que su Fuerza, o los muertos que emergen de la tierra la desgarrarán con poder sobrenatural.
        Si falla, puedes tirar en la tabla de heridas para ver qué le ocurre.
    name_i18n:
      es: Hechizo de Perdición
  - id: spell.necromancy-restless-dead.call-of-vanhel
    roll: '5'
    name: Call of Vanhel
    difficulty: 6
    effect: >-
      A single Zombie, Skeleton, Wight or Grave Guard within 6" of the caster may immediately move
      again up to its maximum movement distance. If this moves it into base contact with an enemy
      model it counts as charging. The target automatically passes Initiative tests needed during
      this extra movement.
    effect_i18n:
      es: >-
        Un solo Zombi, Esqueleto, Espectro o Guardia de Tumba dentro de 6" del lanzador puede
        moverse de nuevo inmediatamente hasta su distancia máxima de movimiento. Si esto lo lleva a
        contacto base con una miniatura enemiga, cuenta como cargando. El objetivo supera
        automáticamente los tests de Iniciativa necesarios durante este movimiento extra.
    name_i18n:
      es: Llamado de Vanhel
  - id: spell.necromancy-restless-dead.deathly-visage
    roll: '6'
    name: Deathly Visage
    difficulty: 6
    effect: >-
      Necromancers only. The Necromancer causes fear in his enemies for the duration of the battle
      and is likewise immune to fear. This is the one exception to the Apprentice rule Necromancers
      must usually follow in a Liche warband; a Necromancer may choose this spell if the Liche has
      the spell Horror.
    effect_i18n:
      es: >-
        Solo Nigromantes. El Nigromante causa miedo en sus enemigos durante el resto de la batalla y
        es igualmente inmune al miedo. Es la única excepción a la regla de Aprendiz que los
        Nigromantes deben seguir normalmente en una banda de Liche; un Nigromante puede elegir este
        conjuro si el Liche tiene el conjuro Horror.
    name_i18n:
      es: Rostro Mortecino
  - id: spell.necromancy-restless-dead.living-horror
    roll: '6'
    name: Living Horror
    difficulty: 8
    effect: >-
      Liche only. Choose one model within 8" of the Liche and roll D6 +3. If the score is equal to
      or greater than the Leadership of the target, that model suffers a wound with no armour saves
      allowed. If this wounds the target and it still has wounds remaining, it may not move, shoot
      or cast spells during its next turn unless it passes a Leadership test. This spell will not
      affect the Possessed, Undead or any model immune to fear.
    effect_i18n:
      es: >-
        Solo Liche. Elige una miniatura dentro de 8" del Liche y tira D6 +3. Si el resultado es
        igual o mayor que el Liderazgo del objetivo, esa miniatura sufre una herida sin permitirse
        salvaciones por armadura. Si esto hiere al objetivo y aún le quedan heridas, no puede
        moverse, disparar ni lanzar conjuros durante su siguiente turno salvo que supere un test de
        Liderazgo. Este conjuro no afecta a los Poseídos, No Muertos ni a ninguna miniatura inmune
        al miedo.
    name_i18n:
      es: Horror Viviente
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Magic / Necromancy (The Restless Dead)
    url: https://mordheimer.net/docs/magic/necromancy-restless-dead
  name_i18n:
    es: Nigromancia (los Muertos Inquietos)
- id: lore.chaos-dwarfs-magic
  name: Chaos Dwarfs Magic
  note: Used by The Sons of Hashut Apprentice Sorcerer.
  note_i18n:
    es: La usa el Hechicero Aprendiz de los Hijos de Hashut.
  spells:
  - id: spell.chaos-dwarfs-magic.spectre-of-hashut
    roll: '1'
    name: Spectre of Hashut
    difficulty: 9
    effect: >-
      A spectral apparition hits the enemy miniature closest to the Sorcerer within 10". That
      miniature is automatically stunned.
    effect_i18n:
      es: >-
        Una aparición espectral golpea a la miniatura enemiga más cercana al Hechicero dentro de
        10". Esa miniatura queda automáticamente aturdida.
    name_i18n:
      es: Espectro de Hashut
  - id: spell.chaos-dwarfs-magic.stone-statue
    roll: '2'
    name: Stone Statue
    difficulty: 9
    effect: >-
      Choose an enemy miniature within 12" and in line of sight. For the rest of the turn and the
      following turn the miniature cannot do anything. If attacked in melee it suffers an automatic
      hit; if it is shot, the shooter gets a +1 bonus to hit.
    effect_i18n:
      es: >-
        Elige una miniatura enemiga dentro de 12" y con línea de visión. Durante el resto de este
        turno y el siguiente, la miniatura no puede hacer nada. Si es atacada en melé, sufre un
        impacto automático; si se le dispara, el tirador obtiene un bono de +1 por impactar.
    name_i18n:
      es: Estatua de Piedra
  - id: spell.chaos-dwarfs-magic.fireball
    roll: '3'
    name: Fireball
    difficulty: 7
    effect: >-
      This spell has a range of 16" and requires line of sight. The target receives an automatic hit
      of Strength 4.
    effect_i18n:
      es: >-
        Este conjuro tiene un alcance de 16" y requiere línea de visión. El objetivo recibe un
        impacto automático de Fuerza 4.
    name_i18n:
      es: Bola de Fuego
  - id: spell.chaos-dwarfs-magic.vanish
    roll: '4'
    name: Vanish
    difficulty: 7
    effect: >-
      The Sorcerer may immediately make a move of up to 6" in any direction and may enter or leave
      combat without penalty. If he enters combat, he is considered to be making a charge move.
    effect_i18n:
      es: >-
        El Hechicero puede hacer inmediatamente un movimiento de hasta 6" en cualquier dirección y
        puede entrar o salir del combate sin penalización. Si entra en combate, se considera que
        hace un movimiento de carga.
    name_i18n:
      es: Desvanecerse
  - id: spell.chaos-dwarfs-magic.eruption
    roll: '5'
    name: Eruption
    difficulty: 8
    effect: >-
      All miniatures within a distance of up to 4", friend or foe, suffer an automatic hit of
      Strength 4. After resolving the effects, the Sorcerer cannot cast any more spells until the
      next turn and suffers -1 to his Toughness attribute.
    effect_i18n:
      es: >-
        Todas las miniaturas a una distancia de hasta 4", amigas o enemigas, sufren un impacto
        automático de Fuerza 4. Después de resolver los efectos, el Hechicero no puede lanzar más
        conjuros hasta el siguiente turno y sufre -1 a su atributo de Resistencia.
    name_i18n:
      es: Erupción
  - id: spell.chaos-dwarfs-magic.eye-of-hashut
    roll: '6'
    name: Eye of Hashut
    difficulty: 6
    effect: >-
      Choose a friendly miniature within 12" and roll 1D6, Hobgoblins always subtract 1 from the
      result. On 1 the miniature is immediately out of action, although it will not roll on the
      serious injury table. On 2-5 the miniature adds +1 to one of its attributes for the rest of
      the game. On 6 it adds +1 to all attributes for the rest of the game. The Eye of Hashut can be
      used successfully only once per battle.
    effect_i18n:
      es: >-
        Elige una miniatura amiga dentro de 12" y tira 1D6; los Hobgoblins siempre restan 1 al
        resultado. Con un 1, la miniatura queda inmediatamente Fuera de combate, aunque no tirará en
        la tabla de heridas graves. Con un 2-5, la miniatura suma +1 a uno de sus atributos por el
        resto de la partida. Con un 6, suma +1 a todos los atributos por el resto de la partida. El
        Ojo de Hashut solo puede usarse con éxito una vez por batalla.
    name_i18n:
      es: Ojo de Hashut
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Magic / Chaos Dwarfs Magic
    url: https://mordheimer.net/docs/magic/chaos-dwarfs-magic
  name_i18n:
    es: Magia de los Enanos del Caos
- id: lore.mortuary-cult-scrolls
  name: Mortuary Cult Scrolls
  note: Used by the Tomb Guardians Liche Priest.
  note_i18n:
    es: La usa el Sacerdote Liche de los Guardianes de la Tumba.
  spells:
  - id: spell.mortuary-cult-scrolls.menkares-scroll-of-urgency
    roll: '1'
    name: Menkare's Scroll of Urgency
    difficulty: 6
    effect: >-
      A single Skeleton Soldier within 6" may immediately move again up to its maximum Movement
      distance, ie 4". If this takes the model into base contact with an enemy model, it counts as
      charging.
    effect_i18n:
      es: >-
        Un solo Soldado Esqueleto dentro de 6" puede moverse de nuevo inmediatamente hasta su
        distancia máxima de Movimiento, es decir, 4". Si esto lleva la miniatura a contacto base con
        una miniatura enemiga, cuenta como cargando.
    name_i18n:
      es: Pergamino de Urgencia de Menkare
  - id: spell.mortuary-cult-scrolls.horrebes-curse-of-the-mummy
    roll: '2'
    name: Horrebe's Curse of the Mummy
    difficulty: 8
    effect: >-
      The target must be in base-to-base contact with a Mummy and within 18" of the Liche Priest.
      The enemy model has a -1 penalty on all to hit and to wound rolls and on all armour saves.
      This lasts until the start of the next Tomb Guardians shooting phase.
    effect_i18n:
      es: >-
        El objetivo debe estar en contacto base con una Momia y dentro de 18" del Sacerdote Liche.
        La miniatura enemiga tiene una penalización de -1 en todas sus tiradas de impactar, herir y
        salvaciones por armadura. Dura hasta el principio de la siguiente fase de disparo de los
        Guardianes de la Tumba.
    name_i18n:
      es: Maldición de la Momia de Horrebe
  - id: spell.mortuary-cult-scrolls.tawosrets-scroll-of-tomb-dust
    roll: '3'
    name: Tawosret's Scroll of Tomb Dust
    difficulty: 7
    effect: >-
      The Liche Priest commands the sand around him to assault a single warrior within 12". The
      warrior is automatically knocked down as he chokes on the sand. This spell only affects a
      living model.
    effect_i18n:
      es: >-
        El Sacerdote Liche ordena a la arena que lo rodea asaltar a un solo guerrero dentro de 12".
        El guerrero queda automáticamente derribado mientras se ahoga con la arena. Este conjuro
        solo afecta a miniaturas vivas.
    name_i18n:
      es: Pergamino de Polvo de Tumba de Tawosret
  - id: spell.mortuary-cult-scrolls.neferres-scroll-of-quaking-horror
    roll: '4'
    name: Neferre's Scroll of Quaking Horror
    difficulty: 7
    effect: >-
      The model within 12" must pass a Leadership test or flee 2D6" directly away from the Liche
      Priest, continuing to flee in each movement phase until it makes a successful Rally test in
      the recovery phase. This spell has no effect on Undead models or models immune to psychology.
    effect_i18n:
      es: >-
        La miniatura dentro de 12" debe superar un test de Liderazgo o huir 2D6" alejándose
        directamente del Sacerdote Liche, y sigue huyendo en cada fase de movimiento hasta que
        supere un test de Reagrupación en la fase de recuperación. Este conjuro no afecta a las
        miniaturas No Muertas ni a las miniaturas inmunes a la psicología.
    name_i18n:
      es: Pergamino de Horror Tembloroso de Neferre
  - id: spell.mortuary-cult-scrolls.merneptahs-scroll-of-the-scarab-song
    roll: '5'
    name: Merneptah's Scroll of the Scarab Song
    difficulty: 7
    effect: >-
      A single model within 8" of the Liche Priest suffers 2D6 Strength 1 hits. In addition, that
      model may not be shot at for the rest of the Tomb Guardians shooting phase, nor fight or be
      fought in hand-to-hand combat. If already in hand-to-hand combat, move it 1" away. Unless it
      suffers an actual injury, the warrior counts as having just stood up in the next turn.
    effect_i18n:
      es: >-
        Una sola miniatura dentro de 8" del Sacerdote Liche sufre 2D6 impactos de Fuerza 1. Además,
        esa miniatura no puede recibir disparos por el resto de la fase de disparo de los Guardianes
        de la Tumba, ni luchar ni ser atacada en combate cuerpo a cuerpo. Si ya está en combate
        cuerpo a cuerpo, aléjala 1". Salvo que sufra una herida real, el guerrero cuenta como recién
        levantado en el siguiente turno.
    name_i18n:
      es: Pergamino del Canto del Escarabajo de Merneptah
  - id: spell.mortuary-cult-scrolls.djedres-summonation-of-the-vengeful-dead
    roll: '6'
    name: Djedre's Summonation of the Vengeful Dead
    difficulty: 5
    effect: >-
      The Liche Priest may re-animate a Skeleton Soldier that went out of action during the last
      turn. Place the model anywhere within 6" of the Liche Priest, but not straight into
      hand-to-hand combat with an enemy model.
    effect_i18n:
      es: >-
        El Sacerdote Liche puede reanimar a un Soldado Esqueleto que quedó Fuera de combate durante
        el último turno. Coloca la miniatura en cualquier punto dentro de 6" del Sacerdote Liche,
        pero nunca directamente en combate cuerpo a cuerpo con una miniatura enemiga.
    name_i18n:
      es: Invocación de Djedre de los Muertos Vengativos
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Magic / Mortuary Cult Scrolls
    url: https://mordheimer.net/docs/magic/mortuary-cult-scrolls
  name_i18n:
    es: Pergaminos del Culto Funerario
- id: lore.waaagh-magic
  name: Waaaagh! Magic
  note: Used by the Orc Mob Shaman and the Night Goblins Shaman.
  note_i18n:
    es: La usan el Chamán de la Turba Orca y el Chamán de los Goblins Nocturnos.
  spells:
  - id: spell.waaagh-magic.ledz-go
    roll: '1'
    name: Led'z Go
    difficulty: 9
    effect: >-
      Any Orc or Goblin within 4" of the Shaman automatically strikes first in hand-to-hand combat
      regardless of other circumstances. The spell lasts until the caster is knocked down, stunned
      or taken out of action.
    effect_i18n:
      es: >-
        Cualquier Orco o Trasgo dentro de 4" del Chamán golpea automáticamente el primero en combate
        cuerpo a cuerpo sin importar otras circunstancias. El conjuro dura hasta que el lanzador sea
        derribado, aturdido o puesto Fuera de combate.
    name_i18n:
      es: ¡Allá Vamos! ('Ere We Go!)
  - id: spell.waaagh-magic.oi-gerroff
    roll: '2'
    name: Oi! Gerroff!
    difficulty: 7
    effect: >-
      Range 8". Moves any enemy model within range D6" directly away from the Shaman. If the target
      collides with another model or a building, both suffer 1 S3 hit. May not be cast on models in
      hand-to-hand combat.
    effect_i18n:
      es: >-
        Alcance 8". Mueve cualquier miniatura enemiga dentro del alcance D6" directamente alejándola
        del Chamán. Si el objetivo choca con otra miniatura o con un edificio, ambas sufren 1
        impacto de F3. No puede lanzarse sobre miniaturas en combate cuerpo a cuerpo.
    name_i18n:
      es: ¡Oye! ¡Suéltalo!
  - id: spell.waaagh-magic.zzap
    roll: '3'
    name: Zzap!
    difficulty: 9
    effect: Range 12". Causes D3 S4 hits on the closest enemy target, with no armour saves allowed.
    effect_i18n:
      es: >-
        Alcance 12". Causa D3 impactos de F4 en el objetivo enemigo más cercano, sin permitirse
        salvaciones por armadura.
    name_i18n:
      es: ¡Zas!
  - id: spell.waaagh-magic.fooled-ya
    roll: '4'
    name: Fooled Ya!
    difficulty: 6
    effect: >-
      No enemy may charge the Shaman during their next turn. If the Shaman is engaged in
      hand-to-hand combat he may immediately move 4" away.
    effect_i18n:
      es: >-
        Ningún enemigo puede cargar contra el Chamán durante su siguiente turno. Si el Chamán está
        en combate cuerpo a cuerpo, puede moverse inmediatamente 4" alejándose.
    name_i18n:
      es: ¡Te Engañé!
  - id: spell.waaagh-magic.clubba
    roll: '5'
    name: Clubba
    difficulty: 7
    effect: >-
      The ectoplasmic club counts as a normal club with a +2 Strength bonus and gives the Shaman +1
      attack as well. The spell lasts until the Shaman suffers a wound.
    effect_i18n:
      es: >-
        El garrote ectoplásmico cuenta como un garrote normal con un bono de +2 Fuerza y también da
        al Chamán +1 ataque. El conjuro dura hasta que el Chamán sufra una herida.
    name_i18n:
      es: Porra
  - id: spell.waaagh-magic.fire-of-gork
    roll: '6'
    name: Fire of Gork
    difficulty: 8
    effect: >-
      Range 12". Each of the two bolts causes D3 S3 hits; the bolts can be fired both at the closest
      enemy target or split between the two closest enemy targets.
    effect_i18n:
      es: >-
        Alcance 12". Cada uno de los dos rayos causa D3 impactos de F3; los rayos pueden dispararse
        ambos contra el objetivo enemigo más cercano o repartirse entre los dos objetivos enemigos
        más cercanos.
    name_i18n:
      es: Fuego de Gork
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Magic / Waaaagh! Magic
    url: https://mordheimer.net/docs/magic/waaaagh
  name_i18n:
    es: Magia ¡Waaagh!
- id: lore.lizardman-magic
  name: Lizardman Magic
  note: Used by the Lizardmen Skink Priest. Lizardmen spells work like the Prayers of Sigmar and may be
    used even if the Skink Priest is wearing armour.
  note_i18n:
    es: >-
      La usa el Sacerdote Skink de los Hombres Lagarto. Los hechizos de los Hombres Lagarto
      funcionan como las Plegarias de Sigmar y pueden usarse aunque el Sacerdote Skink lleve
      armadura.
  spells:
  - id: spell.lizardman-magic.chotecs-wrath
    roll: '1'
    name: Chotec's Wrath
    difficulty: 8
    effect: >-
      A lightning bolt strikes the closest enemy model within 10" of the Skink Priest, causing a
      single Strength 5 hit. Add +1 to the Strength and +1 to the roll on the injury table if the
      model is wearing armour.
    effect_i18n:
      es: >-
        Un rayo golpea a la miniatura enemiga más cercana dentro de 10" del Sacerdote Skink,
        causando un único impacto de Fuerza 5. Suma +1 a la Fuerza y +1 a la tirada en la tabla de
        heridas si la miniatura lleva armadura.
    name_i18n:
      es: Ira de Chotec
  - id: spell.lizardman-magic.sotecs-blessing
    roll: '2'
    name: Sotec's Blessing
    difficulty: 7
    effect: >-
      This spell may be cast on a single model within 6" of the Skink Priest or on himself. Roll a
      D6; on 1-2 the target gains +1 BS or +1 to hit in close combat, on 3-4 Toughness +1, on 5-6
      Movement and Initiative +1. The effects remain in play until the Priest or the model is
      stunned or taken out of action. Only a single model may be affected at any given time.
    effect_i18n:
      es: >-
        Este conjuro puede lanzarse sobre una sola miniatura dentro de 6" del Sacerdote Skink o
        sobre él mismo. Tira un D6; con 1-2 el objetivo gana +1 HD o +1 por impactar en combate
        cuerpo a cuerpo; con 3-4 Resistencia +1; con 5-6 Movimiento e Iniciativa +1. Los efectos
        permanecen en juego hasta que el Sacerdote o la miniatura quede aturdida o Fuera de combate.
        Solo una miniatura puede estar afectada en cada momento.
    name_i18n:
      es: Bendición de Sotec
  - id: spell.lizardman-magic.huanchis-stealth
    roll: '3'
    name: Huanchi's Stealth
    difficulty: 7
    effect: >-
      The spell affects all Skinks within 6" of the Skink Priest, including himself, and allows any
      model in cover to immediately go into hiding. A model may go into hiding even if it ran in the
      movement phase or has already shot with a missile weapon.
    effect_i18n:
      es: >-
        El conjuro afecta a todos los Skinks dentro de 6" del Sacerdote Skink, incluido él mismo, y
        permite que cualquier miniatura en cobertura entre inmediatamente en ocultación. Una
        miniatura puede ocultarse incluso si corrió en la fase de movimiento o ya disparó con un
        arma de proyectiles.
    name_i18n:
      es: Sigilo de Huanchi
  - id: spell.lizardman-magic.the-old-ones-protection
    roll: '4'
    name: The Old Ones' Protection
    difficulty: 6
    effect: >-
      The Skink Priest and any Lizardmen within 4" of him gain a save of 4+ against the effects of
      spells or prayers. The spell remains in play until the Skink Priest is taken out of action.
    effect_i18n:
      es: >-
        El Sacerdote Skink y cualquier Hombre Lagarto dentro de 4" de él ganan una salvación de 4+
        contra los efectos de conjuros u oraciones. El conjuro permanece en juego hasta que el
        Sacerdote Skink quede Fuera de combate.
    name_i18n:
      es: La Protección de los Antiguos
  - id: spell.lizardman-magic.tincis-rage
    roll: '5'
    name: Tinci's Rage
    difficulty: 8
    effect: >-
      A single Lizardman within 6" of the Skink Priest, or the Priest himself, is overtaken by rage,
      follows the rules for Frenzy and gains +1 Strength. The spell remains in play until the Priest
      or the model is stunned or taken out of action; at the beginning of the turn the Skink Priest
      must pass a Leadership roll to keep it going. Only a single model may be affected at any given
      time.
    effect_i18n:
      es: >-
        Un solo Hombre Lagarto dentro de 6" del Sacerdote Skink, o el propio Sacerdote, es presa de
        la rabia, sigue las reglas de Frenesí y gana +1 Fuerza. El conjuro permanece en juego hasta
        que el Sacerdote o la miniatura quede aturdida o Fuera de combate; al principio del turno el
        Sacerdote Skink debe superar un test de Liderazgo para mantenerlo. Solo una miniatura puede
        estar afectada en cada momento.
    name_i18n:
      es: Ira de Tinci
  - id: spell.lizardman-magic.itzls-speed
    roll: '6'
    name: Itzl's Speed
    difficulty: 7
    effect: >-
      A single Lizardman within 6" of the Skink Priest, or the Priest himself, may make an
      additional sprint of up to 4". This counts as running and a model may not move if it has
      already fired a missile weapon. It may not charge with this extra move.
    effect_i18n:
      es: >-
        Un solo Hombre Lagarto dentro de 6" del Sacerdote Skink, o el propio Sacerdote, puede hacer
        un esprinte adicional de hasta 4". Esto cuenta como correr y una miniatura no puede moverse
        si ya disparó un arma de proyectiles. No puede cargar con este movimiento extra.
    name_i18n:
      es: Velocidad de Itzl
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Magic / Lizardman Magic
    url: https://mordheimer.net/docs/magic/lizardmen-magic
  name_i18n:
    es: Magia de los Hombres Lagarto
- id: lore.dark-magic
  name: Dark Magic
  note: Used by the Dark Mage hired sword. Not indexed in the site's magic section; transcribed from the
    Dark Mage entry (Letters of the Damned 6).
  note_i18n:
    es: >-
      La usa la espada a sueldo Mago Oscuro. No está indexada en la sección de magia del sitio;
      transcrita de la entrada del Mago Oscuro (Letters of the Damned 6).
  spells:
  - id: spell.dark-magic.banishment
    roll: '1'
    name: Banishment
    difficulty: 8
    effect: >-
      All Undead within 4\" of the Dark Mage must take an unmodified Leadership test or suffer a
      Strength 4 hit.
    effect_i18n:
      es: >-
        Todos los No Muertos dentro de 4" del Mago Oscuro deben hacer un test de Liderazgo no
        modificable o sufrir un impacto de Fuerza 4.
    name_i18n:
      es: Destierro
  - id: spell.dark-magic.soul-render
    roll: '2'
    name: Soul Render
    difficulty: 8
    effect: >-
      Soul Render is a magic missile spell with a range of 18 inches. If successfully cast, the
      spell causes D3 Strength 3 hits.
    effect_i18n:
      es: >-
        Rasga Almas es un conjuro de misil mágico con un alcance de 18 pulgadas. Si se lanza con
        éxito, el conjuro causa D3 impactos de Fuerza 3.
    name_i18n:
      es: Desgarrador de Almas
  - id: spell.dark-magic.shade-mount
    roll: '3'
    name: Shade Mount
    difficulty: 8
    effect: >-
      May be cast on the wizard himself or a Hero within 8 inches. Upon a successful casting the
      model may immediately fly up to 12 inches; moving into base-to-base contact counts as a
      charge.
    effect_i18n:
      es: >-
        Puede lanzarse sobre el propio mago o sobre un Héroe dentro de 8 pulgadas. Tras un
        lanzamiento exitoso, la miniatura puede volar inmediatamente hasta 12 pulgadas; moverse a
        contacto base cuenta como carga.
    name_i18n:
      es: Montura de Sombra
  - id: spell.dark-magic.jozuns-decay
    roll: '4'
    name: Jozun's Decay
    difficulty: 9
    effect: >-
      Range 12 inches. The target must pass a Leadership test or suffer a one-point reduction to its
      Toughness. Each Recovery phase the model must pass a Leadership test or lose a further point;
      at Toughness 0 it is removed from the game. A model may not be targeted more than once per
      game.
    effect_i18n:
      es: >-
        Alcance 12 pulgadas. El objetivo debe superar un test de Liderazgo o sufrir una reducción de
        un punto en su Resistencia. En cada fase de Recuperación, la miniatura debe superar un test
        de Liderazgo o perder otro punto; con Resistencia 0 se retira de la partida. Una miniatura
        no puede ser objetivo más de una vez por partida.
    name_i18n:
      es: Decadencia de Jozun
  - id: spell.dark-magic.cowel-of-pain
    roll: '5'
    name: Cowel of Pain
    difficulty: 6
    effect: >-
      Until the wizard's next magic phase he cannot be Stunned; treat 3-4 results as Knocked Down
      instead.
    effect_i18n:
      es: >-
        Hasta la siguiente fase de magia del mago, no puede quedar Aturdido; trata los resultados
        3-4 como Derribado en su lugar.
    name_i18n:
      es: Capucha del Dolor
  - id: spell.dark-magic.doom-and-dark
    roll: '6'
    name: Doom & Dark
    difficulty: 7
    effect: >-
      Any model within 2 inches of the Dark Mage must take an immediate All Alone test, even if in
      close combat. Should a model flee from close combat, free strikes occur as normal.
    effect_i18n:
      es: >-
        Cualquier miniatura dentro de 2 pulgadas del Mago Oscuro debe hacer un test de Soledad
        inmediato, incluso si está en combate cuerpo a cuerpo. Si una miniatura huye del combate
        cuerpo a cuerpo, los golpes libres se resuelven con normalidad.
    name_i18n:
      es: Perdición y Oscuridad
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Hired Swords / Grade 2A / Dark Mage (Dark Magic spell list)
    url: https://mordheimer.net/docs/campaigns/hired-swords/grade-2a
  name_i18n:
    es: Magia Oscura
- id: lore.dreaded-scrolls-of-nagash
  name: Dreaded Scrolls of Nagash
  name_i18n:
    es: Pergaminos Malditos de Nagash
  note: 'The Necromancy spell list of the Necrarchs (LotD #1), written upon the flesh of elven children.
    The Necrarch Vampire''s Wizard rule generates one spell randomly from this list.'
  note_i18n:
    es: >-
      La lista de hechizos de Nigromancia de los Necrarcas (LotD #1), escrita sobre la carne de
      niños elfos. La regla Mago del Vampiro Necrarca genera un hechizo al azar de esta lista.
  spells:
  - id: spell.dreaded-scrolls-of-nagash.soulcage
    roll: '1'
    name: Soulcage
    name_i18n:
      es: Jaula de Almas
    difficulty: 9
    effect: >-
      Wracked with pain unimaginable, the victim shoulders the burden that belongs to the caster.
      You may choose a single model within 6''. All wounds are transferred to this model at +1 to
      the Injury Roll. Should a natural 6 be rolled on the Injury chart, not only is the Soulcaged
      model removed from action, but the caster is treated as Stunned. Only one Soulcage spell may
      be in effect at a time.
    effect_i18n:
      es: >-
        Presa de un dolor inimaginable, la víctima carga con la carga que pertenece al lanzador.
        Puedes elegir una sola miniatura a 6 pulgadas. Todas las heridas se transfieren a esa
        miniatura sumando +1 a la Tirada de Herida. Si se obtiene un 6 natural en la tabla de
        Heridas, no solo se retira del combate la miniatura enjaulada, sino que el lanzador se
        considera Aturdido. Solo puede haber un hechizo Jaula de Almas activo a la vez.
  - id: spell.dreaded-scrolls-of-nagash.black-breath
    roll: '2'
    name: Black Breath
    name_i18n:
      es: Aliento Negro
    difficulty: 8
    effect: >-
      The mage belches forth a toxic wind of death, engulfing all within the embrace of slumber
      eternal. The spell has a range of 8'', and hits the first model within its path. It causes 2
      S4 hits on its target, and one S3 hit on all models within 2''.
    effect_i18n:
      es: >-
        El mago escupe un viento tóxico de muerte, envolviendo a todos en el abrazo del sueño
        eterno. El hechizo tiene un alcance de 8 pulgadas y alcanza a la primera miniatura en su
        trayectoria. Causa 2 impactos de F4 a su objetivo y un impacto de F3 a todas las miniaturas
        dentro de 2 pulgadas.
  - id: spell.dreaded-scrolls-of-nagash.servants-eternal
    roll: '3'
    name: Servants Eternal
    name_i18n:
      es: Sirvientes Eternos
    difficulty: auto
    effect: >-
      Calling upon the powers of darkness, the caster summons undying servants to do his bidding.
      This spell must be used before the game, and may only be used once. When cast, the spell
      summons D3 Zombies to the caster's side. The evil that sustains the abominations will fade
      after the battle, turning their damned flesh to dust. As such, these zombies do not count
      towards the warband's maximum size.
    effect_i18n:
      es: >-
        Invocando los poderes de la oscuridad, el lanzador convoca sirvientes inmortales para hacer
        su voluntad. Este hechizo debe usarse antes de la partida y solo puede usarse una vez. Al
        ser lanzado, convoca D3 Zombis al lado del lanzador. El mal que sostiene las abominaciones
        se desvanecerá tras la batalla, convirtiendo su carne maldita en polvo. Por tanto, estos
        zombis no cuentan para el tamaño máximo de la banda.
  - id: spell.dreaded-scrolls-of-nagash.fear-of-the-ages
    roll: '4'
    name: Fear of the Ages
    name_i18n:
      es: Miedo de los Siglos
    difficulty: 9
    effect: >-
      Like a wave of pure despair, the mage releases the fear of the ages over those around him. All
      enemy models within 4'' of the caster suffer a S3 hit. No armour saves are allowed. The
      servants of Morr, Sigmar and Ulric are especially susceptible to this evil, and suffer a S4
      hit instead.
    effect_i18n:
      es: >-
        Como una ola de puro desesperación, el mago libera el miedo de los siglos sobre quienes lo
        rodean. Todas las miniaturas enemigas a 4 pulgadas del lanzador sufren un impacto de F3. No
        se permiten tiradas de salvación por armadura. Los sirvientes de Morr, Sigmar y Ulric son
        especialmente susceptibles a este mal y sufren un impacto de F4 en su lugar.
  - id: spell.dreaded-scrolls-of-nagash.wall-of-despair
    roll: '5'
    name: Wall of Despair
    name_i18n:
      es: Muro de la Desesperación
    difficulty: 6
    effect: >-
      The caster weaves about him a wall of pure despair, rendering himself immune to the will of
      others. The caster is immune to all spells and prayers. Roll at the beginning of each turn
      during the Recovery Phase. On a roll of 1 or 2, the Wall of Despair disappears.
    effect_i18n:
      es: >-
        El lanzador teje a su alrededor un muro de pura desesperación, volviéndose inmune a la
        voluntad de los demás. El lanzador es inmune a todos los hechizos y plegarias. Tira al
        principio de cada turno durante la Fase de Recuperación. Con un resultado de 1 o 2, el Muro
        de la Desesperación desaparece.
  - id: spell.dreaded-scrolls-of-nagash.claws-of-nagash
    roll: '6'
    name: Claws of Nagash
    name_i18n:
      es: Garras de Nagash
    difficulty: 10
    effect: >-
      The withered hands of the caster grow and flash with the dark power of Nagash. The Claws of
      Nagash grant the caster +1 Weapon Skill, and the caster becomes Frenzied. Test at the
      beginning of each turn during the Recovery Phase. On a roll of 2 or less, the Claws of Nagash
      vanish.
    effect_i18n:
      es: >-
        Las manos marchitas del lanzador crecen y destellan con el poder oscuro de Nagash. Las
        Garras de Nagash otorgan al lanzador +1 Habilitad con las Armas y el lanzador se vuelve
        Frenético. Tira al principio de cada turno durante la Fase de Recuperación. Con un resultado
        de 2 o menos, las Garras de Nagash desaparecen.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Spells - Dreaded Scrolls of Nagash
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/necrarchs-the-soul-stealers
- id: lore.elemental-water
  name: Elemental Lore of Water
  name_i18n:
    es: Lore Elemental del Agua
  note: Elemental spell list available to Sorcerous Society wizards (LotD
  note_i18n:
    es: Lista de hechizos elemental disponible para los magos de la Sociedad Hechicera (LotD
  spells:
  - id: spell.elemental-water.geyser
    roll: '1'
    name: Geyser
    name_i18n:
      es: Géiser
    difficulty: 9
    effect: >-
      Calling upon the earth, the caster beckons a steaming geyser to erupt. The spell has a range
      of 10 inches and cannot target elevated targets. The unit suffers a S4 hit and is blown 2
      inches in a random direction. Should the model collide with something, both will suffer an
      additional S2 hit.
    effect_i18n:
      es: >-
        Invocando la tierra, el lanzador hace erupcionar un géiser humeante. El hechizo tiene un
        alcance de 10 pulgadas y no puede apuntar a objetivos elevados. La unidad sufre un impacto
        de F4 y es lanzada 2 pulgadas en una dirección aleatoria. Si la miniatura choca con algo,
        ambas sufren un impacto adicional de F2.
  - id: spell.elemental-water.portent-of-amul
    roll: '2'
    name: Portent of Amul
    name_i18n:
      es: Presagio de Amul
    difficulty: 6
    effect: >-
      Divining auspicious signs, the wizard guides the minds of his fellow warriors, allowing them
      to predict the actions of their foes. This spell affects all of the wizard's friendly units.
      During this and their opponents' Close Combat phase, any 1's that are cast may be re-rolled.
      Re-rolled scores of 1 must stand, as you may never re-roll a re-roll.
    effect_i18n:
      es: >-
        Adivinando señales auspiciosas, el hechicero guía las mentes de sus compañeros guerreros,
        permitiéndoles predecir las acciones de sus enemigos. Este hechizo afecta a todas las
        unidades amigas del hechicero. Durante esta fase de Combate Cuerpo a Cuerpo y la del
        oponente, se puede repetir cualquier 1 obtenido. Los resultados repetidos de 1 deben
        mantenerse, pues nunca se puede repetir una repetición.
  - id: spell.elemental-water.premonition
    roll: '3'
    name: Premonition
    name_i18n:
      es: Presentimiento
    difficulty: 8
    effect: >-
      The wizard closes his eyes and seeks to foresee the outcome of the battle. As long as the
      wizard stands, the warband will gain +1 to its Leadership and the ability to re-roll any
      failed Rout Tests. The wizard has foretold of their victory, and they are not easily swayed
      from his Premonition.
    effect_i18n:
      es: >-
        El hechicero cierra los ojos e intenta prever el desenlace de la batalla. Mientras el
        hechicero siga en pie, la banda gana +1 a su Liderazgo y la capacidad de repetir cualquier
        tirada de Huida fallida. El hechicero ha profetizado su victoria, y no se dejan convencer
        fácilmente en contra de su Presentimiento.
  - id: spell.elemental-water.frostbolts
    roll: '4'
    name: Frostbolts
    name_i18n:
      es: Saetas de Escarcha
    difficulty: 8
    effect: >-
      Holding a small icicle aloft, the wizard channels the power of the Winds of Magic into it.
      Borne upon the arcane winds, the frozen bolts arc through the skies at the wizard's foe.
      Frostbolts is a magic missile with a range of 16 inches. If successfully cast, a squall of
      frozen missiles hit the target and causes D3 S3 hits.
    effect_i18n:
      es: >-
        Sosteniendo un pequeño carámbano en alto, el hechicero canaliza en él el poder de los
        Vientos de la Magia. Sobre los vientos arcanos, los carámbanos helados surcan el cielo hacia
        el enemigo del hechicero. Saetas de Escarcha es un misil mágico con un alcance de 16
        pulgadas. Si se lanza con éxito, una squall de misiles helados alcanza al objetivo y causa
        D3 impactos de F3.
  - id: spell.elemental-water.blindness-of-the-depths
    roll: '5'
    name: Blindness of the Depths
    name_i18n:
      es: Ceguera de las Profundidades
    difficulty: 7
    effect: >-
      The caster binds the enemy in the shadows and silence of the deep, rendering him oblivious to
      the world around him. This spell has a range of 12 inches. The target may make an immediate
      Initiative test. If passed, the spell has no effect. If the test is failed, the model is Blind
      and may not fight or shoot any missile weapons, nor cast any spells. Furthermore, the model
      may not be charged or targeted for ranged fire or spells, as it is completely engulfed in
      shadow. The model may make an Initiative test during each of its own Recovery Phases. Once
      passed, the spell fades.
    effect_i18n:
      es: >-
        El lanzador ata al enemigo en las sombras y el silencio de las profundidades, dejándolo
        ajeno al mundo que lo rodea. Este hechizo tiene un alcance de 12 pulgadas. El objetivo puede
        hacer una prueba de Iniciativa inmediata. Si la supera, el hechizo no tiene efecto. Si la
        falla, la miniatura queda Ciega y no puede luchar ni disparar armas de misiles, ni lanzar
        hechizos. Además, no se puede cargar contra la miniatura ni elegir como objetivo de fuego a
        distancia o hechizos, pues está completamente envuelta en sombras. La miniatura puede hacer
        una prueba de Iniciativa durante cada una de sus propias Fases de Recuperación. Una vez
        superada, el hechizo se desvanece.
  - id: spell.elemental-water.lifespring
    roll: '6'
    name: Lifespring
    name_i18n:
      es: Manantial de Vida
    difficulty: 8
    effect: >-
      Bearing the gift of life, the wizard wisely taps into the Lifespring and offers its blessing
      to his friends. Any one friendly model within 4 inches of the wizard instantly regains a
      wound, and recovers from being Knocked Down or Stunned and may act as normal this turn.
    effect_i18n:
      es: >-
        Portando el don de la vida, el hechicero aprovecha sabiamente el Manantial de Vida y ofrece
        su bendición a sus amigos. Cualquier miniatura amiga a 4 pulgadas del hechicero recupera
        instantáneamente una herida, se recupera de estar Derribada o Aturdida y puede actuar con
        normalidad este turno.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Elemental Lore of Water
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/sorcerous-society
- id: lore.elemental-fire
  name: Elemental Lore of Fire
  name_i18n:
    es: Lore Elemental del Fuego
  note: Elemental spell list available to Sorcerous Society wizards (LotD
  note_i18n:
    es: Lista de hechizos elemental disponible para los magos de la Sociedad Hechicera (LotD
  spells:
  - id: spell.elemental-fire.joruns-blast-of-brimstone
    roll: '1'
    name: Jorun's Blast of Brimstone
    name_i18n:
      es: Explosión de Azufre de Jorun
    difficulty: 9
    effect: >-
      The Mage casts a small ball of mixed stuffs, mostly ash, sulfur and coal, at his enemies. The
      results are, to say the least, explosive. Range of the spell equals the caster's Strength plus
      1D6 inches. The caster then throws the small sulfurous rock at any model he has Line of Sight
      to within that range, and it explodes upon impact. The rock does a S3 hit to that model, and
      any others within 1.5 inches from it.
    effect_i18n:
      es: >-
        El Mago lanza una pequeña bola de materiales mixtos, principalmente ceniza, azufre y carbón,
        a sus enemigos. Los resultados son, por decirlo suavemente, explosivos. El alcance del
        hechizo es igual a la Fuerza del lanzador más 1D6 pulgadas. El lanzador arroja la pequeña
        roca sulfurosa a cualquier miniatura con Línea de Visión dentro de ese alcance, y explota al
        impactar. La roca causa un impacto de F3 a esa miniatura y a cualquier otra a 1,5 pulgadas
        de ella.
  - id: spell.elemental-fire.tazouls-burning-skull
    roll: '2'
    name: Tazoul's Burning Skull
    name_i18n:
      es: Cráneo Ardiente de Tazoul
    difficulty: 9
    effect: >-
      Throwing one's own head o'er the battlefield is never recommended, especially when it's
      aflame. The Wizard known as Tazoul never heeded such warnings. The flaming skull has a range
      of 8 inches and causes one S5 hit. On a roll of 5+ it will hit the nearest enemy model with a
      S3 hit. On a further roll of 4+ it will hit the next nearest enemy model with a S2 hit. The
      spell may not target the same model during one casting.
    effect_i18n:
      es: >-
        Lanzar la propia cabeza sobre el campo de batalla nunca es recomendable, y menos aún cuando
        está en llamas. El hechicero conocido como Tazoul nunca hizo caso de tales advertencias. El
        cráneo llameante tiene un alcance de 8 pulgadas y causa un impacto de F5. Con un resultado
        de 5+ alcanzará a la miniatura enemiga más cercana con un impacto de F3. Con una tirada
        adicional de 4+ alcanzará a la siguiente miniatura enemiga más cercana con un impacto de F2.
        El hechizo no puede apuntar a la misma miniatura en un mismo lanzamiento.
  - id: spell.elemental-fire.hades-heat
    roll: '3'
    name: Hades Heat
    name_i18n:
      es: Calor de Hades
    difficulty: 6
    effect: >-
      The wizard calls upon the sun to intensify its rays o'er a small area. Place a small Blast
      Template (3 inches) anywhere within 8 inches of the caster. Models that are under or partially
      under the template suffer -1WS and -1S due to the exhaustion the intense heat causes until the
      caster's next turn.
    effect_i18n:
      es: >-
        El hechicero invoca al sol para que intensifique sus rayos sobre una pequeña zona. Coloca
        una plantilla pequeña de explosión (3 pulgadas) en cualquier punto a 8 pulgadas del
        lanzador. Las miniaturas bajo la plantilla, total o parcialmente, sufren -1HA y -1F por el
        agotamiento que causa el calor intenso hasta el próximo turno del lanzador.
  - id: spell.elemental-fire.shield-of-flame
    roll: '4'
    name: Shield of Flame
    name_i18n:
      es: Escudo de Llamas
    difficulty: 8
    effect: >-
      The wizard weaves a shield of pure flame, aiding him in his defense. The Shield of Flame
      hovers between the wizard and his foes. He is free to use his weapons normally as the Shield
      of Flame moves in conjunction with the Wizard's attacks. The shield grants the Wizard an
      Armour Save of 4+ in Close Combat and 5+ to ranged attacks. These do not stack and are
      unmodifiable.
    effect_i18n:
      es: >-
        El hechicero teje un escudo de llama pura que le ayuda en su defensa. El Escudo de Llamas
        flota entre el hechicero y sus enemigos. Puede usar sus armas con normalidad, pues el Escudo
        de Llamas se mueve en conjunción con los ataques del Hechicero. El escudo otorga al
        Hechicero una Tirada de Salvación por Armadura de 4+ en Combate Cuerpo a Cuerpo y de 5+
        contra ataques a distancia. Estas no se acumulan y no son modificables.
  - id: spell.elemental-fire.uzhuls-inferno
    roll: '5'
    name: U'Zhuls Inferno
    name_i18n:
      es: Infierno de U'Zhul
    difficulty: 9
    effect: >-
      A pillar of flame erupts from the caster's hand, engulfing all in its path. The pillar of
      flame has a range of 12 inches and is 1 inch wide. It hits all models in its path with a S2
      hit. The target of the spell suffers the brunt of the attack, receiving a S4 hit. All hits
      have a -1 AS modifier.
    effect_i18n:
      es: >-
        Un pilar de llamas brota de la mano del lanzador, envolviendo todo a su paso. El pilar de
        fuego tiene un alcance de 12 pulgadas y 1 pulgada de ancho. Golpea a todas las miniaturas en
        su trayectoria con un impacto de F2. El objetivo del hechizo sufre el grueso del ataque,
        recibiendo un impacto de F4. Todos los impactos tienen un modificador de -1 a la TS.
  - id: spell.elemental-fire.flesh-of-the-forge
    roll: '6'
    name: Flesh of the Forge
    name_i18n:
      es: Carne de la Forja
    difficulty: 6
    effect: >-
      Surrendering himself to the winds of magic, the alchemist imbues his flesh with the heat of
      the forge. The Wizard's skin becomes hot, smoldering with the heat of a thousand coals. All
      hits against the wizard in Close Combat are at -1 to hit. Roll a D6 during the Wizard's
      Recovery phase. On a roll of 1-2, his flesh reverts to its natural form.
    effect_i18n:
      es: >-
        Entregándose a los vientos de la magia, el alquimista impregna su carne con el calor de la
        forja. La piel del Hechicero se calienta, ardiendo con el calor de mil brasas. Todos los
        impactos contra el hechicero en Combate Cuerpo a Cuerpo sufren -1 para impactar. Tira un D6
        durante la fase de Recuperación del Hechicero. Con un resultado de 1-2, su carne vuelve a su
        forma natural.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Elemental Lore of Fire
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/sorcerous-society
- id: lore.elemental-earth
  name: Elemental Lore of Earth
  name_i18n:
    es: Lore Elemental de la Tierra
  note: Elemental spell list available to Sorcerous Society wizards (LotD
  note_i18n:
    es: Lista de hechizos elemental disponible para los magos de la Sociedad Hechicera (LotD
  spells:
  - id: spell.elemental-earth.flesh-of-clay
    roll: '1'
    name: Flesh of Clay
    name_i18n:
      es: Carne de Arcilla
    difficulty: 8
    effect: >-
      Attuning himself to the earth, the wizard's flesh becomes as dense as clay. The wizard doubles
      his Toughness, but halves his Movement and Initiative. The spell remains in effect until the
      caster is Knocked Down, Stunned or taken Out of Action.
    effect_i18n:
      es: >-
        Sintonizándose con la tierra, la carne del hechicero se vuelve densa como la arcilla. El
        hechicero duplica su Resistencia, pero reduce a la mitad su Movimiento e Iniciativa. El
        hechizo permanece en vigor hasta que el lanzador sea Derribado, Aturdido o puesto Fuera de
        Combate.
  - id: spell.elemental-earth.healing-might
    roll: '2'
    name: Healing Might
    name_i18n:
      es: Poder Curativo
    difficulty: 9
    effect: >-
      Allowing the healing power of the earth to rise up within him, the wizard aids even those with
      the most grievous wounds around him. All models within 4 inches of the wizard rise from the
      ground, shrugging off the effects of being Knocked Down or Stunned. Furthermore, any units
      within 2 inches of the wizard have all of their wounds restored.
    effect_i18n:
      es: >-
        Permitiendo que el poder curativo de la tierra se alce dentro de él, el hechicero socorre
        incluso a los que tienen las heridas más graves a su alrededor. Todas las miniaturas a 4
        pulgadas del hechicero se levantan del suelo, liberándose de los efectos de estar Derribadas
        o Aturdidas. Además, cualquier unidad a 2 pulgadas del hechicero recupera todas sus heridas.
  - id: spell.elemental-earth.curse-of-thorns
    roll: '3'
    name: Curse of Thorns
    name_i18n:
      es: Maldición de Espinas
    difficulty: 6
    effect: >-
      The caster curses his foes, calling upon their life-force to transform into a jagged and
      thorny essence. The target of the spell must be within 18 inches. The model must pass a
      Toughness test or be wracked with unimaginable pain. The model will remain immobile and will
      only defend himself if attacked. A Toughness test must be passed before the spell will fade.
    effect_i18n:
      es: >-
        El lanzador maldice a sus enemigos, invocando su fuerza vital para transformarla en una
        esencia dentada y espinosa. El objetivo del hechizo debe estar a 18 pulgadas. La miniatura
        debe superar una prueba de Resistencia o quedará presa de un dolor inimaginable. La
        miniatura permanecerá inmóvil y solo se defenderá si es atacada. Debe superarse una prueba
        de Resistencia antes de que el hechizo se desvanezca.
  - id: spell.elemental-earth.jozuns-decay
    roll: '4'
    name: Jozun's Decay
    name_i18n:
      es: Decadencia de Jozun
    difficulty: 9
    effect: >-
      Ashes and dust. The caster calls upon the earth to reclaim what is rightfully hers. This spell
      has a range of 12 inches. Upon a successful casting, the target must pass a Leadership Test or
      suffer a one point reduction to its Toughness attribute. Each Recovery phase the model must
      attempt to pass a Leadership test, reducing its Toughness a further point for each failure.
      Should a model be reduced to 0 Toughness, it is removed from the game irrespective of how many
      wounds it has left. Should a Leadership test be passed, the model must play the remainder of
      the game at its modified Toughness score. A model may not be targeted by Eternal Rot more than
      once per game.
    effect_i18n:
      es: >-
        Cenizas y polvo. El lanzador invoca a la tierra para reclamar lo que por derecho le
        pertenece. Este hechizo tiene un alcance de 12 pulgadas. Tras un lanzamiento con éxito, el
        objetivo debe superar una prueba de Liderazgo o sufrir una reducción de un punto en su
        atributo de Resistencia. En cada fase de Recuperación la miniatura debe intentar superar una
        prueba de Liderazgo, reduciendo su Resistencia un punto adicional por cada fallo. Si una
        miniatura queda reducida a 0 de Resistencia, se retira del juego sin importar cuántas
        heridas le queden. Si se supera una prueba de Liderazgo, la miniatura debe jugar el resto de
        la partida con su Resistencia modificada. Una miniatura no puede ser objetivo de esta
        podredumbre eterna más de una vez por partida.
  - id: spell.elemental-earth.the-hunters-spear
    roll: '5'
    name: The Hunter's Spear
    name_i18n:
      es: Lanza del Cazador
    difficulty: 8
    effect: >-
      Beseeching Venor the Hunter, the caster conjures a pure manifestation of amber-hued magic in
      the shape of a mighty hunting spear. The wizard's weapon takes on an amber-hue and transmutes
      into a hunting spear. It grants the caster an additional two points to his Strength, and
      grants him an additional attack. The caster must make a Leadership test during his Recovery
      phases. The spear fades away if the test is failed.
    effect_i18n:
      es: >-
        Implorando a Venor el Cazador, el lanzador conjura una pura manifestación de magia ámbar en
        forma de una poderosa lanza de caza. El arma del hechicero toma un tono ámbar y se transmuta
        en una lanza de caza. Otorga al lanzador dos puntos adicionales de Fuerza y un ataque
        adicional. El lanzador debe hacer una prueba de Liderazgo durante sus fases de Recuperación.
        La lanza se desvanece si falla la prueba.
  - id: spell.elemental-earth.shifting-sands
    roll: '6'
    name: Shifting Sands
    name_i18n:
      es: Arenas Movedizas
    difficulty: 8
    effect: >-
      Calling upon the very fibers of the earth, the mage forces the ground to swallow his foes.
      This spell may be cast on any enemy model within sight of the wizard. The model in question
      must make a successful Initiative test or be treated as Knocked Down until its next Recovery
      phase, where it has another chance to pass an Initiative test. Any friendly models within 1
      inch of the trapped model reduce the difficulty of the Initiative test by 1, to a minimum of
      1.
    effect_i18n:
      es: >-
        Invocando las propias fibras de la tierra, el mago obliga al suelo a tragarse a sus
        enemigos. Este hechizo puede lanzarse sobre cualquier miniatura enemiga con línea de visión
        del hechicero. La miniatura en cuestión debe superar una prueba de Iniciativa o se la
        considera Derribada hasta su siguiente fase de Recuperación, donde tiene otra oportunidad de
        superar una prueba de Iniciativa. Cualquier miniatura amiga a 1 pulgada de la miniatura
        atrapada reduce en 1 la dificultad de la prueba de Iniciativa, hasta un mínimo de 1.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Elemental Lore of Earth
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/sorcerous-society
- id: lore.elemental-air
  name: Elemental Lore of Air
  name_i18n:
    es: Lore Elemental del Aire
  note: Elemental spell list available to Sorcerous Society wizards (LotD
  note_i18n:
    es: Lista de hechizos elemental disponible para los magos de la Sociedad Hechicera (LotD
  spells:
  - id: spell.elemental-air.winters-gale
    roll: '1'
    name: Winter's Gale
    name_i18n:
      es: Vendaval de Invierno
    difficulty: 10
    effect: >-
      Calling to the northern winds, the wizard brings forth freezing air and biting snow. Place the
      large blast template (5 inches) over a location within 12 inches of the caster. Any model
      covered or partially covered will suffer a S4 hit. Undead and Possessed models do not suffer
      as mortals do from the cold, and thus only suffer a S2 hit instead.
    effect_i18n:
      es: >-
        Llamando a los vientos del norte, el hechicero trae aire gélido y nieve cortante. Coloca la
        plantilla grande de explosión (5 pulgadas) sobre un punto a 12 pulgadas del lanzador.
        Cualquier miniatura cubierta, total o parcialmente, sufre un impacto de F4. Las miniaturas
        No Muertas y Posesas no sufren el frío como los mortales, y por tanto solo sufren un impacto
        de F2.
  - id: spell.elemental-air.crows-feast
    roll: '2'
    name: Crow's Feast
    name_i18n:
      es: Banquete del Cuervo
    difficulty: 9
    effect: >-
      With dark intentions, the caster brings the attentions of Corvos the Crow upon his enemies.
      Crow's Feast is a magic missile spell, with a range of 24 inches. If successfully cast, the
      spell causes D6 S3 hits.
    effect_i18n:
      es: >-
        Con oscuras intenciones, el lanzador atrae la atención de Corvos el Cuervo sobre sus
        enemigos. El Banquete del Cuervo es un hechizo de misil mágico con un alcance de 24
        pulgadas. Si se lanza con éxito, el hechizo causa D6 impactos de F3.
  - id: spell.elemental-air.dust-dervish
    roll: '3'
    name: Dust Dervish
    name_i18n:
      es: Derviche de Polvo
    difficulty: 9
    effect: >-
      Calling upon minor elementals, the caster bids them to seek out and attack his foes. The spell
      summons D3 Dust Dervishes, who attack a model each who are within 12 inches of the caster. No
      other targeting restrictions apply, so even a model that is hidden may be sought out by the
      air elementals. Each Dust Dervish delivers a rapid succession of attacks, delivering D6 S1
      hits to its target prior to vanishing back from whence it came.
    effect_i18n:
      es: >-
        Invocando elementales menores, el lanzador les ordena buscar y atacar a sus enemigos. El
        hechizo invoca D3 Derviches de Polvo, cada uno de los cuales ataca a una miniatura a 12
        pulgadas del lanzador. No se aplican otras restricciones de objetivo, de modo que incluso
        una miniatura oculta puede ser hallada por los elementales del aire. Cada Derviche de Polvo
        entrega una rápida sucesión de ataques, causando D6 impactos de F1 a su objetivo antes de
        desvanecerse de donde vino.
  - id: spell.elemental-air.howler-wind
    roll: '4'
    name: Howler Wind
    name_i18n:
      es: Viento Aullador
    difficulty: 8
    effect: >-
      The fury of the skies unbound is a force that few can hold at bay. This spell is cast upon the
      wizard himself. Both he and any models within 8 inches of him gain the protection of the
      Howler Wind. Anyone targeting these models with mundane ranged weapons suffer a -2 penalty to
      their Ballistic Skill, however shooting past these models does not affect the missile in any
      way.
    effect_i18n:
      es: >-
        La furia desatada de los cielos es una fuerza que pocos pueden contener. Este hechizo se
        lanza sobre el propio hechicero. Tanto él como cualquier miniatura a 8 pulgadas de él
        obtienen la protección del Viento Aullador. Quien apunte a estas miniaturas con armas a
        distancia mundanas sufre una penalización de -2 en su Habilitad de Disparo; sin embargo,
        disparar más allá de estas miniaturas no afecta en nada al proyectil.
  - id: spell.elemental-air.celestial-shield
    roll: '5'
    name: Celestial Shield
    name_i18n:
      es: Escudo Celestial
    difficulty: 8
    effect: >-
      The wizard manipulates the magic of the cosmos to create a scintillating blue shield capable
      of turning aside even the most powerful of projectile or spell. This spell can be cast upon
      any friendly model within 6 inches of the caster, or the caster himself. The Celestial Shield
      provides a 4+ save versus all ranged attacks, and a 5+ save versus all hostile spells. Should
      the recipient of the Shield be the primary target of an area-effect spell and the save be
      made, no models shall suffer any of the spell's effects.
    effect_i18n:
      es: >-
        El hechicero manipula la magia del cosmos para crear un escudo azul centelleante capaz de
        desviar incluso el proyectil o hechizo más poderoso. Este hechizo puede lanzarse sobre
        cualquier miniatura amiga a 6 pulgadas del lanzador, o sobre el propio lanzador. El Escudo
        Celestial otorga una salvación de 4+ contra todos los ataques a distancia y de 5+ contra
        todos los hechizos hostiles. Si el receptor del Escudo es el objetivo principal de un
        hechizo de área y supera la salvación, ninguna miniatura sufrirá los efectos del hechizo.
  - id: spell.elemental-air.shade-mount
    roll: '6'
    name: Shade Mount
    name_i18n:
      es: Montura de Sombra
    difficulty: 8
    effect: >-
      Darkness forms about the caster, carrying him aloft upon wings of shadow. This spell may be
      cast upon the wizard himself, or a hero within 8 inches of him. Upon a successful casting, the
      model may immediately fly up to 12 inches. Should this movement bring the model into Base to
      Base contact with an enemy model, consider it a charge.
    effect_i18n:
      es: >-
        La oscuridad se forma alrededor del lanzador y lo eleva sobre alas de sombra. Este hechizo
        puede lanzarse sobre el propio hechicero, o sobre un héroe a 8 pulgadas de él. Tras un
        lanzamiento con éxito, la miniatura puede volar inmediatamente hasta 12 pulgadas. Si este
        movimiento lleva a la miniatura a contacto Base con Base con una miniatura enemiga,
        considérese una carga.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Elemental Lore of Air
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/sorcerous-society
- id: lore.funerary-rites-lotd5
  name: Funerary Rites (Vampire Hunters of Sylvania Variant)
  name_i18n:
    es: Ritos Funerarios (Variante de los Cazadores de Vampiros de Sylvania)
  note: VARIANT of the active KB lore lore.funerary-rites (core Mordheim, Priest of Morr). This page (LotD
    no. 5) prints the same six rites with different difficulties (3. Sanctity of the Fallen 5 vs 7; 5.
    Do You Know Who I Am? 9 vs 7; 6. I Am Death! 7 vs 8). Per the no-fusion rule the variant is preserved
    verbatim for this band; equivalence review happens at promotion.
  note_i18n:
    es: >-
      VARIANTE del saber activo del KB lore.funerary-rites (Mordheim básico, Sacerdote de Morr).
      Esta página (LotD n.º 5) imprime los mismos seis ritos con dificultades distintas (3.
      Sanctity of the Fallen 5 vs 7; 5. Do You Know Who I Am? 9 vs 7; 6. I Am Death! 7 vs 8).
      Según la regla de no fusión, la variante se conserva literalmente para esta banda; la
      revisión de equivalencia se realiza en la promoción.
  spells:
  - id: spell.funerary-rites-lotd5.morrs-protection
    roll: '1'
    name: Morr's Protection
    name_i18n:
      es: Protección de Morr
    difficulty: 6
    effect: >-
      'Morr, watch over your faithful servants!' The Priest of Morr calls out to his god when
      confronted by an abomination and asks that he be shielded from the corrupted magic of the
      tainted. Any Magical attacks made by a Necromancer, a Magister or Daemons, which would be
      considered a direct attack on the priest, will be negated if this rite is successful. This
      effect remains until the priest's next shooting phase.
    effect_i18n:
      es: >-
        «¡Morr, vela por tus fieles servidores!» El Sacerdote de Morr llama a su dios al enfrentarse
        a una abominación y pide ser protegido de la magia corrompida de los contaminados. Cualquier
        ataque mágico realizado por un Nigromante, un Magister o Demonios, que se considere un
        ataque directo contra el sacerdote, se anulará si el rito tiene éxito. Este efecto permanece
        hasta la próxima fase de disparo del sacerdote.
  - id: spell.funerary-rites-lotd5.death-holds-no-fear
    roll: '2'
    name: Death Holds No Fear
    name_i18n:
      es: La Muerte No Da Miedo
    difficulty: auto
    effect: >-
      Priests of Morr must be steadfast in their resolution and as such must, above all else, have
      no fear of death. The Priest of Morr is now Fearless for the remainder of the game.
    effect_i18n:
      es: >-
        Los sacerdotes de Morr deben ser firmes en su resolución y, como tales, deben, por encima de
        todo, no temer a la muerte. El Sacerdote de Morr es ahora Incapaz de Temor por el resto de
        la partida.
  - id: spell.funerary-rites-lotd5.sanctity-of-the-fallen
    roll: '3'
    name: Sanctity of the Fallen
    name_i18n:
      es: Santidad de los Caídos
    difficulty: 5
    effect: >-
      'Those who fall shall be sanctified and their soul freed, in the name of Morr, god of death.'
      The Priest of Morr may attempt to perform the Rite of Sanctity on a model (friend or foe) who
      has been taken Out of Action. The Priest must be within 6 inches of the model in question. If
      successful, the model may not be raised up by a Necromancer.
    effect_i18n:
      es: >-
        «Los que caigan serán santificados y su alma liberada, en el nombre de Morr, dios de la
        muerte.» El Sacerdote de Morr puede intentar realizar el Rito de Santidad sobre una
        miniatura (amiga o enemiga) que haya sido puesta Fuera de Combate. El Sacerdote debe estar a
        6 pulgadas de la miniatura en cuestión. Si tiene éxito, la miniatura no puede ser resucitada
        por un Nigromante.
  - id: spell.funerary-rites-lotd5.hand-of-morr
    roll: '4'
    name: Hand of Morr
    name_i18n:
      es: Mano de Morr
    difficulty: 9
    effect: >-
      'By the hand of Morr, the Undead shall become as dust and ashes.' The Priest of Morr must be
      in base-to-base contact with the Undead model. Before Hand-to-Hand combat occurs, the Priest
      may attempt to use the Hand of Morr rite. If successful, the foe immediately goes Out of
      Action (this affects Zombies, Dire Wolves and Vampires). Ghouls, Possessed, Daemons and
      creatures of Chaos affected will immediately flee their full Move away from the Priest of
      Morr.
    effect_i18n:
      es: >-
        «Por la mano de Morr, los No Muertos se convertirán en polvo y cenizas.» El Sacerdote de
        Morr debe estar en contacto base con base con la miniatura No Muerta. Antes de que ocurra el
        combate cuerpo a cuerpo, el Sacerdote puede intentar usar el rito de la Mano de Morr. Si
        tiene éxito, el enemigo queda inmediatamente Fuera de Combate (esto afecta a Zombis, Lobos
        Siniestros y Vampiros). Los Gulles, Posesos, Demonios y criaturas del Caos afectados huirán
        inmediatamente su Movimiento completo alejándose del Sacerdote de Morr.
  - id: spell.funerary-rites-lotd5.do-you-know-who-i-am
    roll: '5'
    name: Do You Know Who I Am?
    name_i18n:
      es: ¿Sabes Quién Soy?
    difficulty: 9
    effect: >-
      'Gaze upon me, abomination, for I am a Priest of Morr.' This rite has a range of 6 inches and
      must be directed at the closest Undead model first, or if no Undead are within range, at the
      next closest human servant of the Undead (Dregs, Ghouls, Necromancers), or finally at any
      model. If successful, that model is immediately Stunned. If the model cannot be Stunned, then
      it is Knocked Down instead.
    effect_i18n:
      es: >-
        «Contémplame, abominación, pues soy un Sacerdote de Morr.» Este rito tiene un alcance de 6
        pulgadas y debe dirigirse primero a la miniatura No Muerta más cercana, o si no hay No
        Muertos dentro del alcance, al siguiente sirviente humano de los No Muertos más cercano
        (Dregs, Gulles, Nigromantes), o finalmente a cualquier miniatura. Si tiene éxito, esa
        miniatura queda inmediatamente Aturdida. Si la miniatura no puede quedar Aturdida, entonces
        queda Derribada.
  - id: spell.funerary-rites-lotd5.i-am-death
    roll: '6'
    name: I Am Death!
    name_i18n:
      es: ¡Yo Soy la Muerte!
    difficulty: 7
    effect: >-
      'I am a Priest of Morr, god of death!' There are times when a Priest of Morr will be called to
      engage in combat, and who would be more feared than a representative of the god of Death? This
      spell gives the Priest of Morr a 6+ armour save and increases their WS by either +1 or makes
      it 4, whichever is the greater. A Leadership test is required to maintain this spell in
      subsequent rounds.
    effect_i18n:
      es: >-
        «¡Yo soy un Sacerdote de Morr, dios de la muerte!» Hay momentos en que un Sacerdote de Morr
        será llamado a entrar en combate, ¿y a quién se temería más que a un representante del dios
        de la Muerte? Este hechizo otorga al Sacerdote de Morr una salvación por armadura de 6+ y
        aumenta su HA en +1 o la fija en 4, lo que sea mayor. Se requiere una prueba de Liderazgo
        para mantener este hechizo en rondas posteriores.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Funerary Rites
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/vampire-hunters-of-sylvania
- id: lore.snotling-waaagh-magic
  name: Snotling Waaagh! Magic
  name_i18n:
    es: Magia ¡Waaagh! Snotling
  note: The self-destructive spell list of the Snotling Shaman.
  note_i18n:
    es: La lista de hechizos autodestructivos del Chamán Snotling.
  spells:
  - id: spell.snotling-waaagh-magic.morks-blessing
    roll: '1'
    name: Mork's Blessing
    name_i18n:
      es: Bendición de Mork
    difficulty: 6
    effect: >-
      The warrior targeted by this spell has become Blessed by the Greenskin God Mork, who gets
      quite irate when anyone inflicts harm on the Little Fellow. Mork's Blessing can be used to
      target any friendly greenskin hero on the board regardless of line of sight to the caster or
      not. In any game that the Hero is put Out of Action, roll a D6. On a roll of 4+, the inflictor
      of the damage suffers an automatic wound with no saving throw allowed. Once cast, the blessing
      remains active till the end of the game or the blessed hero is put out of action. It may be
      recast, but once successfully recast, the original blessing fades (if the original Blessed
      model is still on the board). It may be cast on the shaman himself.
    effect_i18n:
      es: >-
        El guerrero objetivo de este hechizo ha sido Bendecido por el Dios Pielesverde Mork, que se
        pone bastante furioso cuando alguien hace daño al Pequeño Compañero. La Bendición de Mork
        puede usarse sobre cualquier héroe pielesverde amistoso en la mesa, haya o no línea de
        visión con el lanzador. En cualquier partida en que el Héroe quede Fuera de Combate, tira un
        D6. Con un resultado de 4+, el causante del daño sufre una herida automática sin salvación
        posible. Una vez lanzada, la bendición permanece activa hasta el final de la partida o hasta
        que el héroe bendecido quede fuera de combate. Puede volverse a lanzar, pero al relanzarse
        con éxito, la bendición original se desvanece (si el modelo bendecido original sigue en la
        mesa). Puede lanzarse sobre el propio chamán.
  - id: spell.snotling-waaagh-magic.we-can-fly
    roll: '2'
    name: '''We Can Fly!'''
    name_i18n:
      es: ¡Podemos Volar!
    difficulty: 7
    effect: >-
      The Shaman draws upon the might of the Waaagh! energy in the air to propel himself and a group
      of Snotlings nearby, towards the enemy. The Shaman and the closest 1D6 Friendly models within
      6 inches are immediately moved 12 inches towards the closest enemy model. If they contact the
      enemy, they count as Charging in the close combat phase.
    effect_i18n:
      es: >-
        El Chamán se nutre del poder de la energía del ¡Waaagh! en el aire para impulsionarse a sí
        mismo y a un grupo de Snotlings cercanos hacia el enemigo. El Chamán y los 1D6 modelos
        Amistosos más cercanos a 6 pulgadas se mueven inmediatamente 12 pulgadas hacia el modelo
        enemigo más cercano. Si entran en contacto con el enemigo, cuentan como que Cargan en la
        fase de combate cuerpo a cuerpo.
  - id: spell.snotling-waaagh-magic.foot-of-gork
    roll: '3'
    name: Foot of Gork!
    name_i18n:
      es: ¡Pie de Gork!
    difficulty: 9
    effect: >-
      The great Greenskin God Gork sees that the Snotlings are engaging a far superior force then
      themselves and decides that he'll give them a little bit of help as a reward for being so
      audacious. Randomly select an enemy model on the board. That model, and any other model
      (friend or foe) within 3 inches are automatically crushed under a giant green foot that
      descends from the heavens. Each model in range suffers D3 hits wounding enemies on a 3+ and
      snotling warband members on a 5+. All hits are at a -3 save modifier.
    effect_i18n:
      es: >-
        El gran Dios Pielesverde Gork ve que los Snotlings se enfrentan a una fuerza muy superior a
        ellos y decide darles una pequeña ayuda como recompensa por ser tan audaces. Elige
        aleatoriamente un modelo enemigo en la mesa. Ese modelo, y cualquier otro modelo (amigo o
        enemigo) a 3 pulgadas, es automáticamente aplastado bajo un pie verde gigante que desciende
        de los cielos. Cada modelo en el área sufre D3 impactos que hieren a los enemigos con un 3+
        y a los miembros de la banda snotling con un 5+. Todos los impactos tienen un modificador de
        salvación de -3.
  - id: spell.snotling-waaagh-magic.pebbles-of-doom
    roll: '4'
    name: Pebbles of Doom
    name_i18n:
      es: Piedrecitas de la Perdición
    difficulty: 6
    effect: >-
      Any friendly Hero within 6" gains D6 magical pebbles blessed by Gork. These may be thrown or
      shot from a slingshot, and count as having +1 to hit and +1 Strength from the respective
      weapon. These pebbles last until they are each used up, until the hero is taken out of action,
      until the end of the game, or until the spell is successfully recast. If the spell is
      successfully recast, any existing Pebbles of Doom created by your shaman that are already on
      the board dissipate.
    effect_i18n:
      es: >-
        Cualquier Héroe amistoso a 6" gana D6 piedrecitas mágicas bendecidas por Gork. Pueden
        lanzarse a mano o con una hondita, y cuentan con +1 al impacto y +1 de Fuerza sobre el arma
        respectiva. Estas piedrecitas duran hasta agotarse, hasta que el héroe quede fuera de
        combate, hasta el final de la partida o hasta que el hechizo se relance con éxito. Si el
        hechizo se relanza con éxito, cualquier Piedrecita de la Perdición existente creada por tu
        chamán que ya esté en la mesa se disipa.
  - id: spell.snotling-waaagh-magic.pointy-stick-of-death
    roll: '5'
    name: Pointy Stick of Death
    name_i18n:
      es: Palo Afilado de la Muerte
    difficulty: 7
    effect: >-
      The Shaman is blessed with the Pointy Stick of Death. It grants the Shaman +2 WS, +1 Strength,
      and the Shaman strikes first in every round of combat (even when charged). The Shaman must
      make a Difficulty test at the start of each Recovery Phase if he wants to maintain the Pointy
      Stick of Death.
    effect_i18n:
      es: >-
        El Chamán es bendecido con el Palo Afilado de la Muerte. Le otorga +2 HA, +1 de Fuerza, y el
        Chamán golpea primero en cada ronda de combate (incluso cuando es cargado). El Chamán debe
        hacer una prueba de Dificultad al comienzo de cada Fase de Recuperación si quiere mantener
        el Palo Afilado de la Muerte.
  - id: spell.snotling-waaagh-magic.blessing-of-the-shrimp
    roll: '6'
    name: Blessing of the Shrimp
    name_i18n:
      es: Bendición del Camarón
    difficulty: 6
    effect: >-
      Target Hero within 6" gains +1WS, +1T and +1 Leadership. If used on your Leader, all models
      within 12" may test off his Leadership. If not used on your Leader, all models within 6" may
      test off its Leadership as if he was an additional Leader. The Blessing will fade after 1D3
      Rounds (thus, a blessing that lasts 1 Round would wear off at the beginning of your next
      Recovery Phase.) Only one friendly model may have the Blessing of the Shrimp at any given
      time, and if recast before it fades, the new model gains the bonus while the old one loses it.
    effect_i18n:
      es: >-
        El Héroe objetivo a 6" gana +1HA, +1R y +1 de Liderazgo. Si se usa en tu Líder, todos los
        modelos a 12" pueden usar su Liderazgo para las pruebas. Si no se usa en tu Líder, todos los
        modelos a 6" pueden usar su Liderazgo como si fuera un Líder adicional. La Bendición se
        desvanece tras 1D3 Rondas (así, una bendición que dure 1 Ronda se extinguiría al comienzo de
        tu próxima Fase de Recuperación). Solo un modelo amistoso puede tener la Bendición del
        Camarón en un momento dado, y si se relanza antes de que se desvanezca, el nuevo modelo gana
        el bonificador mientras el anterior lo pierde.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Magic - Snotling Waaagh! Magic
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/snotlings
- id: lore.blessings-of-the-mare
  name: Blessings of the Mare
  name_i18n:
    es: Bendiciones de la Yegua
  note: The prayer list of the Dame of the Mare (Order of the Mare, by Fredrik Edman). The Dame's Prayers
    rule generates one prayer randomly from this list.
  note_i18n:
    es: >-
      La lista de plegarias de la Dama de la Yegua (Orden de la Yegua, de Fredrik Edman). La
      regla Plegarias de la Dama genera una plegaria al azar de esta lista.
  spells:
  - id: spell.blessings-of-the-mare.unnerving-gaze
    roll: '1'
    name: Unnerving Gaze
    name_i18n:
      es: Mirada Inquietante
    difficulty: 7
    effect: >-
      The Dame of the Mare, with her daunting gaze, petrifies her adversaries and renders them
      hesitant to act against her. All attacks targeting the Dame in hand-to-hand combat are at -1
      to hit. Furthermore, all enemy models that are in base contact with the Dame must strike last,
      no matter their target. The effects of the spell lasts until the beginning of the Order of the
      Mare player's next Shooting phase.
    effect_i18n:
      es: >-
        La Dama de la Yegua, con su mirada imponente, petrifica a sus adversarios y les hace dudar
        de actuar contra ella. Todos los ataques dirigidos a la Dama en combate cuerpo a cuerpo
        sufren -1 por impactar. Además, todas las miniaturas enemigas en contacto base con la Dama
        deben golpear en último lugar, independientemente de su objetivo. Los efectos del hechizo
        duran hasta el comienzo de la próxima fase de Disparo del jugador de la Orden de la Yegua.
  - id: spell.blessings-of-the-mare.phantom-hoof
    roll: '2'
    name: Phantom Hoof
    name_i18n:
      es: Casco Espectral
    difficulty: 9
    effect: >-
      The Dame channels a spectral force to deliver a distant and impactful strike, akin to a
      horse's kick. Target any enemy warrior within 6" of the Dame, that model suffers a Strength 5
      hit with the concussion special rule.
    effect_i18n:
      es: >-
        La Dama canaliza una fuerza espectral para asestar un golpe distante e impactante, semejante
        a una coz de caballo. Elige a cualquier guerrero enemigo a 6" de la Dama; esa miniatura
        sufre un impacto de Fuerza 5 con la regla especial Conmoción.
  - id: spell.blessings-of-the-mare.dames-inspiration
    roll: '3'
    name: Dame's Inspiration
    name_i18n:
      es: Inspiración de la Dama
    difficulty: 7
    effect: >-
      Infused with equine fervour, the Dame enhances her striking power and agility, allowing a
      relentless onslaught in the heat of battle. The Dame's attacks in combat gain +1 to hit and +1
      to their Strength. The Dame must test, by rolling the prayer's difficulty or greater on 2D6,
      at the start of each of her turns to see if the effect remains in play.
    effect_i18n:
      es: >-
        Impregnada de fervor equino, la Dama aumenta su poder de golpe y su agilidad, lo que le
        permite un asedio implacable en el fragor de la batalla. Los ataques de la Dama en combate
        obtienen +1 por impactar y +1 a su Fuerza. La Dama debe hacer una prueba, sacando la
        dificultad de la plegaria o más en 2D6, al comienzo de cada uno de sus turnos para ver si el
        efecto sigue en juego.
  - id: spell.blessings-of-the-mare.thirst-for-valour
    roll: '4'
    name: Thirst for Valour
    name_i18n:
      es: Sed de Valentía
    difficulty: 8
    effect: >-
      The Dame ignites one of her allies (it can't be herself) within 12" with inspiration and an
      insatiable thirst for glory and honour in the name of the Prophetess of the Mare. The target
      warrior is now frenzied. Only one warrior can be affected by this spell at a time, if the Dame
      chooses a new warrior the former target loses their frenzy.
    effect_i18n:
      es: >-
        La Dama enciende a uno de sus aliados (no puede ser ella misma) dentro de 12" con
        inspiración y una sed insaciable de gloria y honor en nombre de la Profetisa de la Yegua. El
        guerrero objetivo queda ahora en frenesí. Solo un guerrero puede verse afectado por este
        hechizo a la vez; si la Dama elige a un nuevo guerrero, el objetivo anterior pierde su
        frenesí.
  - id: spell.blessings-of-the-mare.aura-of-dauntlessness
    roll: '5'
    name: Aura of Dauntlessness
    name_i18n:
      es: Aura de Impavidez
    difficulty: 10
    effect: >-
      The Dame says a prayer to bestow unwavering courage upon her entire retinue, empowering them
      to face adversity with resolute bravery and unyielding determination on the battlefield. For
      the duration of the battle, the save provided by Dame's and friendly Companion fillies'
      special armour save is increased by 1. The rest of the warband gains a special unmodifiable 6+
      save against all non-magical attacks, this save is in addition to (and taken after) any other
      saves they may have.
    effect_i18n:
      es: >-
        La Dama reza una plegaria para otorgar valor inquebrantable a todo su séquito,
        capacitándolos para enfrentar la adversidad con bravura resuelta y determinación
        inquebrantable en el campo de batalla. Durante el resto de la batalla, la salvación especial
        por armadura de la Dama y de las Potrancas Compañeras amistosas aumenta en 1. El resto de la
        banda obtiene una salvación especial inmodificable de 6+ contra todos los ataques no
        mágicos; esta salvación es adicional a (y se resuelve después de) cualquier otra salvación
        que puedan tener.
  - id: spell.blessings-of-the-mare.dames-charger
    roll: '6'
    name: The Dame's Charger
    name_i18n:
      es: Corcel de la Dama
    difficulty: 8
    effect: >-
      Eerie lights engulf the Dame who suddenly sits upon a spectral steed from ancient history:
      this counts as her becoming mounted on a warhorse with a modified statline. It will remain in
      play until the end of the game or until the Dame is dismounted. The Spectral charger offers no
      armour save like other mounts, but increases the special save from the Dame's own armour by 1.
      In addition, the Spectral charger is such a ghastly apparition that it and its rider cause
      fear. M8 WS4 BS0 S4 T4 W1 I4 A2 Ld7.
    effect_i18n:
      es: >-
        Luces escalofriantes envuelven a la Dama, que de repente se sienta sobre un corcel espectral
        de la historia antigua: esto cuenta como si se montara en un corcel de guerra con una línea
        de características modificada. Permanecerá en juego hasta el final de la partida o hasta que
        la Dama sea desmontada. El corcel espectral no ofrece salvación por armadura como otras
        monturas, pero aumenta en 1 la salvación especial de la armadura de la propia Dama. Además,
        el corcel espectral es una aparición tan espeluznante que él y su jinete causan miedo. M8
        HA4 HP0 F4 R4 H1 I4 A2 L7.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Blessings of the Mare
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/order-of-the-mare
- id: lore.commands
  name: Commands
  name_i18n:
    es: Órdenes
  note: The Command list of the Mazzalupo Wandering Knight (Mordheim Italia, V3.5). Commands do not count
    as spells and the knight is not a wizard, but they are cast following the rules for Magic (difficulty
    listed per Command) during the recovery phase, if the knight is not knocked down, stunned, or out
    of action, instead of running. Commands affect friendly models within 6" that can hear him (not stunned
    or knocked down); models may only benefit from one Command per turn.
  note_i18n:
    es: >-
      La lista de Mandatos del Caballero Errante de Mazzalupo (Mordheim Italia, V3.5). Los
      Mandatos no cuentan como hechizos y el caballero no es un mago, pero se lanzan siguiendo
      las reglas de Magia (con la dificultad indicada por Mandato) durante la fase de
      recuperación, si el caballero no está derribado, aturdido o fuera de combate, en lugar de
      huir. Los Mandatos afectan a los modelos aliados que puedan oírle en un radio de 15 cm (6
      pulgadas) y que no estén aturdidos ni derribados; los modelos solo pueden beneficiarse de
      un Mandato por turno.
  spells:
  - id: spell.commands.raise-our-insignia
    roll: '1'
    name: Raise Our Insignia!
    name_i18n:
      es: ¡Enarbolar Nuestro Estandarte!
    difficulty: 6
    effect: >-
      Encouraging the Squire to raise a handkerchief in the army's colours, the Mazzalupo regain
      courage, united under the same banner. This Command can only be issued to the Squire if it is
      within 12" and is not fleeing, knocked down, stunned, or taken out of action. Until the
      beginning of the next Shooting phase, every model of the Mazzalupo warband, including the
      Wandering knight, who has line of sight to the Squire can reroll failed Leadership tests,
      including the warband's Rout test.
    effect_i18n:
      es: >-
        Animando al Escudero a enarbolar un pañuelo con los colores del ejército, los Mazzalupo
        recuperan el valor, unidos bajo la misma bandera. Esta Orden solo puede darse al Escudero si
        está a 12" y no está huyendo, derribado, aturdido ni Fuera de Combate. Hasta el comienzo de
        la próxima fase de Disparo, cada modelo de la banda Mazzalupo, incluido el Caballero
        Errante, que tenga línea de visión al Escudero puede repetir las pruebas de Liderazgo
        fallidas, incluida la tirada de Huida de la banda.
  - id: spell.commands.move-ye-miscreant
    roll: '2'
    name: Move, Ye Miscreant!
    name_i18n:
      es: ¡Muévete, Granuja!
    difficulty: 6
    effect: >-
      The booming voice of the Knight Errant urges even the most slothful of the Mazzalupo to spring
      into action. A single Mazzalupo warrior within 6" of the Wandering knight may immediately move
      again up to its maximum Movement distance. If this moves them into base contact with an enemy
      model, they count as charging.
    effect_i18n:
      es: >-
        La voz atronadora del Caballero Andante insta incluso al más perezoso de los Mazzalupo a
        ponerse en acción. Un único guerrero Mazzalupo a 6" del Caballero Errante puede moverse
        inmediatamente de nuevo hasta su distancia máxima de Movimiento. Si esto lo pone en contacto
        base con un modelo enemigo, cuenta como carga.
  - id: spell.commands.follow-me-mine-pugnacious-ones
    roll: '3'
    name: Follow Me, Mine Pugnacious Ones!
    name_i18n:
      es: ¡Seguidme, Belicosos Míos!
    difficulty: 8
    effect: >-
      With heroic demeanour, the Wandering knight rallies his men and bolsters their fighting
      spirit. Members of the Mazzalupo warband within 4" of the Wandering knight gain a +1 bonus to
      hit in hand-to-hand combat until the end of the turn.
    effect_i18n:
      es: >-
        Con aire heroico, el Caballero Errante reúne a sus hombres y vigoriza su espíritu de lucha.
        Los miembros de la banda Mazzalupo a 4" del Caballero Errante obtienen un bonificador de +1
        por impactar en combate cuerpo a cuerpo hasta el final del turno.
  - id: spell.commands.be-on-guard-my-brave-ones
    roll: '4'
    name: Be on Guard, My Brave Ones!
    name_i18n:
      es: ¡En Guardia, Mis Valientes!
    difficulty: 7
    effect: >-
      A true commander knows the importance of caution and teaches his comrades that there is no
      shame in fleeing from a fight, only wisdom. Choose a member of the Mazzalupo warband within
      12" that is engaged in hand-to-hand combat. That model can immediately move away from the
      combat up to the maximum distance allowed by their Movement value but cannot come into contact
      with other enemy models.
    effect_i18n:
      es: >-
        Un verdadero comandante conoce la importancia de la cautela y enseña a sus camaradas que no
        hay vergüenza alguna en huir de una pelea, solo sabiduría. Elige a un miembro de la banda
        Mazzalupo a 12" que esté en combate cuerpo a cuerpo. Ese modelo puede alejarse
        inmediatamente del combate hasta la distancia máxima que permita su valor de Movimiento,
        pero no puede entrar en contacto con otros modelos enemigos.
  - id: spell.commands.pay-them-no-heed
    roll: '5'
    name: Pay Them No Heed!
    name_i18n:
      es: ¡No Les Hagáis Caso!
    difficulty: 6
    effect: >-
      Ever watchful of battlefield developments, the Knight Errant issues orders on which targets
      are the highest priority. Choose a Mazzalupo model within 12". Until the next Shooting phase,
      the model can target any enemy warrior even if they are not the closest.
    effect_i18n:
      es: >-
        Siempre atento a la evolución del campo de batalla, el Caballero Andante da órdenes sobre
        qué objetivos son prioritarios. Elige un modelo Mazzalupo a 12". Hasta la próxima fase de
        Disparo, el modelo puede atacar a cualquier guerrero enemigo aunque no sea el más cercano.
  - id: spell.commands.art-thou-ready-to-die-fighting
    roll: '6'
    name: Art Thou Ready to Die Fighting?
    name_i18n:
      es: ¿Estáis Listos para Morir Luchando?
    difficulty: 8
    effect: >-
      The Wandering knight appeals to the tenacity of his men to withstand the enemy's blows. Every
      Mazzalupo model within 4", including the Wandering knight, can only be taken out of action on
      a roll of 6 until the next Mazzalupo turn.
    effect_i18n:
      es: >-
        El Caballero Errante apela a la tenacidad de sus hombres para resistir los golpes del
        enemigo. Todos los modelos Mazzalupo a 4", incluido el Caballero Errante, solo pueden ser
        dejados Fuera de Combate con un resultado de 6 hasta el próximo turno Mazzalupo.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Commands
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/mazzalupo
- id: lore.woodland-incantations
  name: Woodland Incantations
  name_i18n:
    es: Encantamientos del Bosque
  note: The nature-magic spell list of the Wood Elves of Athel Loren Forest Mage.
  note_i18n:
    es: La lista de hechizos de magia natural del Mago del Bosque de los Elfos del Bosque de Athel Loren.
  spells:
  - id: spell.woodland-incantations.song-of-thorns
    roll: '1'
    name: Song of Thorns
    name_i18n:
      es: Canción de Espinas
    difficulty: 8
    effect: >-
      Branches strike out to the foe under influence of the singer cadence. If no plants are present
      wooden chips fly at the victim, as if they want to be thorns… Victim suffers 2D6 S1 hits,
      range 8".
    effect_i18n:
      es: >-
        Las ramas golpean al enemigo bajo la influencia de la cadencia del cantor. Si no hay plantas
        presentes, astillas de madera vuelan hacia la víctima, como si quisieran ser espinas… La
        víctima sufre 2D6 impactos de F1, alcance 8".
  - id: spell.woodland-incantations.murmuring-of-the-wind
    roll: '2'
    name: Murmuring of the Wind
    name_i18n:
      es: Murmullo del Viento
    difficulty: 7
    effect: >-
      Very softly the wind increases around the caster and takes him wherever he wants. Caster may
      move anywhere within 12", if he gets into HtH it counts as a charge.
    effect_i18n:
      es: >-
        Muy suavemente el viento se intensifica alrededor del lanzador y lo lleva a donde quiera. El
        lanzador puede moverse a cualquier lugar dentro de 12", si entra en combate cuerpo a cuerpo
        cuenta como carga.
  - id: spell.woodland-incantations.the-rain-song
    roll: '3'
    name: The Rain Song
    name_i18n:
      es: La Canción de la Lluvia
    difficulty: 9
    effect: >-
      The air around the caster becomes moist and it starts to rain, until it looks like a major
      downpour… Everything, except Woodelves, within 6" of the caster suffers -1 to hit and suffers
      -1 Initiative. This lasts until the beginning of the caster's next magic phase.
    effect_i18n:
      es: >-
        El aire alrededor del lanzador se vuelve húmedo y empieza a llover, hasta que parece un gran
        diluvio… Todo, excepto los Elfos del Bosque, a 6" del lanzador sufre -1 al impacto y -1
        Iniciativa. Esto dura hasta el comienzo de la siguiente fase de magia del lanzador.
  - id: spell.woodland-incantations.lyrics-of-feral-infatuation
    roll: '4'
    name: Lyrics of Feral Infatuation
    name_i18n:
      es: Letras de Enamoramiento Feral
    difficulty: 8
    effect: >-
      This soothing song seems to calm even the most ferocious monsters and sends them into a
      lethargic state. Any animal or monster has to pass a Ld-test, on his own Ld, in order to
      attack an opponent. If it fails it will do nothing else that turn, not even fighting back if
      attacked.
    effect_i18n:
      es: >-
        Esta canción apacible parece calmar incluso a los monstruos más feroces y los envía a un
        estado letárgico. Cualquier animal o monstruo debe superar una prueba de Ld, con su propia
        Ld, para atacar a un oponente. Si falla, no hará nada más ese turno, ni siquiera defenderse
        si es atacado.
  - id: spell.woodland-incantations.song-of-the-sun
    roll: '5'
    name: Song of the Sun
    name_i18n:
      es: Canción del Sol
    difficulty: 6
    effect: >-
      While the caster sings his victim believes he is in a scorching desert. His movement slows and
      throat becomes parched. The target must be within 18" and is -1M until the caster's next magic
      phase, he also must make a test, if he fails, he suffers a S4 hit.
    effect_i18n:
      es: >-
        Mientras el lanzador canta, su víctima cree estar en un desierto abrasador. Su movimiento se
        ralentiza y su garganta se seca. El objetivo debe estar a 18" y sufre -1M hasta la siguiente
        fase de magia del lanzador; también debe hacer una prueba, si falla, sufre un impacto de F4.
  - id: spell.woodland-incantations.eagles-cry
    roll: '6'
    name: Eagle's Cry
    name_i18n:
      es: Grito del Águila
    difficulty: 8
    effect: >-
      The caster utters a melodious cry, which sounds like a great eagle. This inspires the elves so
      much they gain the legendary sight of Thuarindir. All Wood elves within 6" gain +1 to hit and
      +1 on the critical hit table. This lasts until the beginning of the caster's next magic phase.
    effect_i18n:
      es: >-
        El lanzador emite un grito melodioso, que suena como una gran águila. Esto inspira tanto a
        los elfos que ganan la legendaria visión de Thuarindir. Todos los Elfos del Bosque a 6"
        ganan +1 al impacto y +1 en la tabla de impactos críticos. Esto dura hasta el comienzo de la
        siguiente fase de magia del lanzador.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Woodland Incantations
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/wood-elves-of-athel-loren
- id: lore.charms-and-hexes-strigos
  name: Charms & Hexes
  name_i18n:
    es: Encantamientos y Maldiciones
  note: 'The spell list of the Survivors of Strigos Seer. Newly ingested during the final completeness
    sweep of 2026-09-15; previously deferred as out of scope. VARIANT of the KB lore.charms-and-hexes
    (used by the Witch): the Sylvania page prints the six-spell list with different difficulties (Scry
    8 vs 6, Curse 8 vs 6, Dust of the Blind 9) and expanded wording, and its sixth spell is Cure of Thorns
    (D9) where the KB keeps Cure (D6). Kept apart so a source change stays auditable.'
  note_i18n:
    es: >-
      La lista de hechizos del Vidente de los Supervivientes de Strigos. Incorporada en el
      último barrido de completitud del 2026-09-15; antes diferida por estar fuera de alcance.
      VARIANTE del saber lore.charms-and-hexes del KB (usado por la Bruja): la página de
      Sylvania imprime la lista de seis hechizos con dificultades distintas (Scry 8 vs 6, Curse
      8 vs 6, Dust of the Blind 9) y un texto ampliado, y su sexto hechizo es Cure of Thorns
      (D9) donde el KB conserva Cure (D6). Se mantiene aparte para que un cambio de fuente siga
      siendo auditable.
  spells:
  - id: spell.charms-and-hexes-strigos.scry
    roll: '1'
    name: Scry
    name_i18n:
      es: Adivinar
    difficulty: 8
    effect: >-
      The Seer uses ancient scrying crystals to foretell the future and influence the actions of her
      comrades. For the duration of the turn, one hero or henchman may re-roll D3 dice rolls and
      modify the results by +/- 1.
    effect_i18n:
      es: >-
        La Vidente usa antiguos cristales adivinatorios para predecir el futuro e influir en las
        acciones de sus compañeros. Durante el turno, un héroe o secuaz puede repetir tiradas D3 de
        dados y modificar los resultados en +/- 1.
  - id: spell.charms-and-hexes-strigos.curse
    roll: '2'
    name: Curse
    name_i18n:
      es: Maldición
    difficulty: 8
    effect: >-
      The Seer bestows a powerful curse on one of her enemies that saps their confidence and
      resolve. One enemy model within 12" of the Seer must re-roll all successful dice rolls for the
      duration of this and their next turn.
    effect_i18n:
      es: >-
        La Vidente lanza una poderosa maldición sobre uno de sus enemigos que socava su confianza y
        determinación. Un modelo enemigo a 12" de la Vidente debe repetir todas las tiradas de dados
        exitosas durante este turno y el siguiente.
  - id: spell.charms-and-hexes-strigos.dust-of-the-blind
    roll: '3'
    name: Dust of the Blind
    name_i18n:
      es: Polvo de los Ciegos
    difficulty: 9
    effect: >-
      Casting a handful of dust into the air, the Seer blows it around her blinding her enemies. One
      enemy model within 16" of the Seer is struck instantly blind. They may not shoot, charge, or
      run, are at half Weapon Skill, and will move in a random direction at the start of their turn.
      The Blindness lasts until the Seer casts another spell or moves.
    effect_i18n:
      es: >-
        Lanzando un puñado de polvo al aire, la Vidente lo esparce cegando a sus enemigos. Un modelo
        enemigo a 16" de la Vidente queda instantáneamente ciego. No puede disparar, cargar ni
        correr, tiene la Habilidad de Combate a la mitad y se moverá en una dirección aleatoria al
        comienzo de su turno. La Ceguera dura hasta que la Vidente lance otro hechizo o se mueva.
  - id: spell.charms-and-hexes-strigos.age-of-stone
    roll: '4'
    name: Age of Stone
    name_i18n:
      es: Era de Piedra
    difficulty: 8
    effect: >-
      Whispering words of ancient power, the Seer causes an enemy to age rapidly before their very
      eyes, making them weak and feeble. One enemy model within 12" of the Seer will be severely
      debilitated and all of their characteristics are reduced by -1 for the duration of this and
      their next turn.
    effect_i18n:
      es: >-
        Susurrando palabras de poder ancestral, la Vidente hace que un enemigo envejezca rápidamente
        ante sus ojos, dejándolo débil y endeble. Un modelo enemigo a 12" de la Vidente quedará
        gravemente debilitado y todas sus características se reducen en -1 durante este turno y el
        siguiente.
  - id: spell.charms-and-hexes-strigos.warriors-bane
    roll: '5'
    name: Warrior's Bane
    name_i18n:
      es: Flaqueza del Guerrero
    difficulty: 7
    effect: >-
      Muttering a dark and malicious incantation, the Seer causes a warrior's grip to loosen, making
      it almost impossible for them to attack. One enemy model within 18" of the Seer will be unable
      to use any of their weapons as they perpetually slip from their grasp. They will be unable to
      shoot and count as fighting with fists in hand-to-hand combat. The enchantment lasts for the
      duration of this and their next turn.
    effect_i18n:
      es: >-
        Recitando un conjuro oscuro y malicioso, la Vidente hace que el agarre de un guerrero se
        afloje, volviendo casi imposible que ataque. Un modelo enemigo a 18" de la Vidente no podrá
        usar ninguna de sus armas, pues se le escapan constantemente. No podrá disparar y contará
        como combatir con los puños en el combate cuerpo a cuerpo. El encantamiento dura este turno
        y el siguiente.
  - id: spell.charms-and-hexes-strigos.cure-of-thorns
    roll: '6'
    name: Cure of Thorns
    name_i18n:
      es: Curación de Espinas
    difficulty: 9
    effect: >-
      A faint aura extends from the Seer's body. All who are touched by it feel its power. The Seer
      attempts to aid her comrades by passing their injuries to their enemies. For every Knocked
      Down or Stunned friendly model within 6", one enemy model within the same area is Knocked Down
      or Stunned. There must be an even transfer. If no enemy models are in range, the Seer may
      instead choose to take the injury herself to stand a friendly model up. Models who have just
      stood up act as such and can only cast spells or shoot, but may not charge or run.
    effect_i18n:
      es: >-
        Un aura tenue se extiende desde el cuerpo de la Vidente. Todos los que la tocan sienten su
        poder. La Vidente intenta ayudar a sus compañeros transfiriendo sus heridas a sus enemigos.
        Por cada modelo amistoso Derribado o Aturdido a 6", un modelo enemigo en la misma zona queda
        Derribado o Aturdido. La transferencia debe ser equitativa. Si no hay modelos enemigos al
        alcance, la Vidente puede elegir recibir la herida ella misma para levantar a un modelo
        amistoso. Los modelos que acaban de levantarse actúan como tales y solo pueden lanzar
        hechizos o disparar, pero no cargar ni correr.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Charms & Hexes
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/survivors-of-strigos
- id: lore.dark-arts-strigos
  name: Dark Arts
  name_i18n:
    es: Artes Oscuras
  note: The spell list of the Survivors of Strigos Strigoi Vampire. Newly ingested during the final completeness
    sweep of 2026-09-15; previously deferred as out of scope.
  note_i18n:
    es: >-
      La lista de hechizos del Vampiro Strigoi de los Supervivientes de Strigos. Incorporada en
      el último barrido de completitud del 2026-09-15; antes diferida por estar fuera de
      alcance.
  spells:
  - id: spell.dark-arts-strigos.fires-of-strigos
    roll: '1'
    name: Fires of Strigos
    name_i18n:
      es: Fuegos de Strigos
    difficulty: 7
    effect: >-
      Borne from the eve of Mourkain's destruction, the Strigoi releases his hatred in a fiery ball
      of death. The fireball has a range of 18" and causes one Strength 4 hit. It strikes the first
      model in its path. Armour saves are taken as normal (i.e. at -1 AS).
    effect_i18n:
      es: >-
        Nacido de la víspera de la destrucción de Mourkain, el Strigoi libera su odio en una
        ardiente bola de fuego mortal. La bola de fuego tiene un alcance de 18" y causa un impacto
        de Fuerza 4. Golpea al primer modelo en su trayectoria. Las tiradas de salvación por
        armadura se hacen con normalidad (es decir, a -1 AS).
  - id: spell.dark-arts-strigos.winged-flight
    roll: '2'
    name: Winged Flight
    name_i18n:
      es: Vuelo Alado
    difficulty: 9
    effect: >-
      The Strigoi sprouts great wings and takes to the night sky. The Vampire may immediately move
      anywhere within 18", including into base contact with an enemy, in which case he counts as
      charging. If he engages a fleeing enemy in the close combat phase, he will score 1 automatic
      hit and then his opponent will flee again.
    effect_i18n:
      es: >-
        El Strigoi despliega grandes alas y se lanza al cielo nocturno. El Vampiro puede moverse
        inmediatamente a cualquier lugar dentro de 18", incluyendo contacto base con base con un
        enemigo, en cuyo caso cuenta como cargando. Si alcanza a un enemigo en huida en la fase de
        combate cuerpo a cuerpo, conseguirá 1 impacto automático y su oponente volverá a huir.
  - id: spell.dark-arts-strigos.lifestealer
    roll: '3'
    name: Lifestealer
    name_i18n:
      es: Robavidas
    difficulty: 10
    effect: >-
      The Strigoi sucks out the very essence of life from his victim, stealing its vigor for
      himself. You may choose a single model within 6". The target suffers a wound (no save
      allowed), and the Vampire gains an extra Wound for the duration of the battle. This may take
      the Vampire's Wounds above his original maximum value. This spell will not affect the
      Possessed. Should the Vampire attempt to cast this spell upon another Vampire, increase the
      difficulty by 1.
    effect_i18n:
      es: >-
        El Strigoi absorbe la esencia misma de la vida de su víctima, robando su vigor para sí.
        Puedes elegir un único modelo a 6". El objetivo sufre una herida (sin tirada de salvación) y
        el Vampiro gana una Herida adicional durante el resto de la batalla. Esto puede llevar las
        Heridas del Vampiro por encima de su valor máximo original. Este hechizo no afecta a los
        Posídos. Si el Vampiro intenta lanzar este hechizo sobre otro Vampiro, aumenta la dificultad
        en 1.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Dark Arts
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/survivors-of-strigos
- id: lore.songs-of-sorrow
  name: Songs of Sorrow
  name_i18n:
    es: Cantos del Pesar
  note: A simple form of Necromancy, fueled not by scrolls and ancient prayers, but by a Sea Singer's
    fevered mind and pure willpower. (Ghost Pirates of Sartosa, p. 5.)
  note_i18n:
    es: >-
      Una forma sencilla de nigromancia, alimentada no por pergaminos y plegarias antiguas, sino
      por la mente febril y la pura fuerza de voluntad de un Cantor del Mar. (Piratas Fantasma
      de Sartosa, p. 5.)
  spells:
  - id: spell.songs-of-sorrow.sirens-call
    roll: '1'
    name: Siren's Call
    name_i18n:
      es: Llamada de la Sirena
    difficulty: 10
    effect: >-
      The maiden sings the hymn of the sea, luring unwary warriors to follow her every whim. The
      spell has a range of 6" and must be cast on the closest enemy model. Roll a D6 and add the Sea
      Singer's Leadership to the score. Then roll a D6 and add the target's Leadership to the score,
      with a -1 modifier to the model's Leadership. If the Singer beats his opponent's score, she
      gains control of the model until the model passes a Leadership test in his own recovery phase,
      also with a -1 modifier. The model may not commit suicide, but can attack models on his own
      side, and will not fight warriors from the Chaos Mage's warband. If he was engaged in
      hand-to-hand combat with any warriors from your warband, they will immediately move 1" apart.
    effect_i18n:
      es: >-
        La doncella canta el himno del mar, tentando a los guerreros desprevenidos a seguir sus
        caprichos. El hechizo tiene un alcance de 6" y debe lanzarse contra la miniatura enemiga más
        cercana. Lanza un D6 y suma al resultado la Liderazgo de la Cantora del Mar. Después lanza
        un D6 y suma al resultado el Liderazgo del objetivo, con un modificador de -1 al Liderazgo
        de la miniatura. Si la Cantora supera la puntuación de su oponente, toma el control de la
        miniatura hasta que esta supere una tirada de Liderazgo en su propia fase de recuperación,
        también con un modificador de -1. La miniatura no puede suicidarse, pero puede atacar a
        miniaturas de su propio bando, y no luchará contra los guerreros de la banda del Mago del
        Caos. Si estaba empeñada en combate cuerpo a cuerpo con guerreros de tu banda, estos se
        separarán inmediatamente 1".
  - id: spell.songs-of-sorrow.march-of-sorrow
    roll: '2'
    name: March of Sorrow
    name_i18n:
      es: Marcha del Pesar
    difficulty: 7
    effect: >-
      Like the ebb and flow of the sea, a surge of power rushes over the graveborn. The Sea Singer
      and all friendly Zombies and Skeletons within 6" of her may immediately move up to 1D3+1
      inches in any direction. If this brings them in contact with an opposing model, it counts as a
      charge.
    effect_i18n:
      es: >-
        Como el flujo y reflujo del mar, una oleada de poder recorre a los nacidos de la tumba. La
        Cantora del Mar y todos los Zombis y Esqueletos amigos dentro de 6" de ella pueden moverse
        inmediatamente hasta 1D3+1 pulgadas en cualquier dirección. Si esto los pone en contacto con
        una miniatura enemiga, cuenta como una carga.
  - id: spell.songs-of-sorrow.wraiths-dirge
    roll: '3'
    name: Wraith's Dirge
    name_i18n:
      es: Endecha del Espectro
    difficulty: 9
    effect: >-
      The Sea Singer chants a dark song and points her pale fingers at one of her adversaries, who
      feels the very air sucked from their lungs. Must target the closest opponent within 6". That
      model must immediately roll on the injury chart. If this spell is successful, the Sea Singer
      may not attack in the close combat phase. Roll for injury even if the model has more than 1
      wound. A successful roll of 'Out of Action' causes 1 wound.
    effect_i18n:
      es: >-
        La Cantora del Mar entona una canción oscura y apunta con sus dedos pálidos a uno de sus
        adversarios, que siente cómo el aire le es arrancado de los pulmones. Debe seleccionar al
        oponente más cercano dentro de 6". Esa miniatura debe tirar inmediatamente en la tabla de
        heridas. Si el hechizo tiene éxito, la Cantora del Mar no puede atacar en la fase de combate
        cuerpo a cuerpo. Tira por la herida aunque la miniatura tenga más de 1 herida. Un resultado
        de 'Fuera de combate' causa 1 herida.
  - id: spell.songs-of-sorrow.lovers-lament
    roll: '4'
    name: Lover's Lament
    name_i18n:
      es: Lamento de la Amante
    difficulty: 6
    effect: >-
      The Sea Singer sings her favorite hymn, the one that reminds her of her love, and reanimates
      the fallen with a shadow of hope. This spell brings back into play any Bloated taken out of
      action last turn. It may also be used to resurrect a Gibbet, but the difficulty is 2 higher (8
      instead of 6). If successful, place the resurrected model within 6" of the Sea Singer. It may
      not be placed into hand-to-hand combat with an enemy model.
    effect_i18n:
      es: >-
        La Cantora del Mar canta su himno favorito, el que le recuerda a su amor, y reanima a los
        caídos con una sombra de esperanza. Este hechizo devuelve al juego a cualquier Hinchado que
        quedara Fuera de combate el turno anterior. También puede usarse para resucitar a un
        Ahusado, pero la dificultad es 2 puntos mayor (8 en lugar de 6). Si tiene éxito, coloca la
        miniatura resucitada dentro de 6" de la Cantora del Mar. No puede colocarse en combate
        cuerpo a cuerpo con una miniatura enemiga.
  - id: spell.songs-of-sorrow.song-of-discord
    roll: '5'
    name: Song of Discord
    name_i18n:
      es: Canción de la Discordia
    difficulty: 9
    effect: >-
      The Sea Singer's voice raises to notes piercing and eerie, until the nerves of her enemies are
      weak and frayed. Any opposing warriors within 6" of the Sea Singer must reroll all successful
      Leadership Tests, unless they are immune to psychology.
    effect_i18n:
      es: >-
        La voz de la Cantora del Mar se eleva hasta notas penetrantes y escalofriantes, hasta que
        los nervios de sus enemigos quedan débiles y deshilachados. Todos los guerreros enemigos
        dentro de 6" de la Cantora del Mar deben repetir todas las tiradas de Liderazgo exitosas, a
        menos que sean inmunes a la psicología.
  - id: spell.songs-of-sorrow.hymn-of-rebirth
    roll: '6'
    name: Hymn of Rebirth
    name_i18n:
      es: Himno del Renacimiento
    difficulty: 5
    effect: >-
      In the hopes of bringing back her own true love, the Sea Singer has mastered the song of
      rebirth, to call the dead alive, albeit without mind or soul. This spell may be cast once each
      time an enemy Hero dies (i.e. a roll of 11-15 on the serious injury table). If successfully
      cast, the hero is raised as a Skeleton (see the rules for Skeleton Mates) and forms a brand
      new Henchmen group. He retains all weapons and armour, but may not use any other items. He
      loses any ability to use spells and cannot gain experience, but he retains his characteristics
      and any non-spell skills he had. If the spell is unsuccessful, the hero becomes a Bloated
      instead, and has the same rules and stats as any normal Bloated model (you may still keep his
      equipment).
    effect_i18n:
      es: >-
        Con la esperanza de recuperar a su verdadero amor, la Cantora del Mar ha dominado la canción
        del renacimiento, para llamar a los muertos a la vida, aunque sea sin mente ni alma. Este
        hechizo puede lanzarse una vez cada vez que muere un Héroe enemigo (es decir, con un
        resultado de 11-15 en la tabla de heridas graves). Si se lanza con éxito, el héroe se alza
        como un Esqueleto (ver las reglas de los Compañeros Esqueleto) y forma un grupo nuevo de
        Peones. Conserva todas las armas y la armadura, pero no puede usar otros objetos. Pierde
        toda capacidad de lanzar hechizos y no puede ganar experiencia, pero conserva sus
        características y sus habilidades no mágicas. Si el hechizo falla, el héroe se convierte en
        un Hinchado, con las mismas reglas y características que cualquier Hinchado normal (aun así
        puedes quedarte con su equipo).
  source_refs:
  - manual: broheim.net
    printed_page: 5
    section: Songs of Sorrow
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Ghost%20Pirates.pdf
- id: lore.wood-elven-spells
  name: Wood Elven Spell List
  name_i18n:
    es: Lista de Hechizos Silvanos
  note: Spell list of the Wood Elves of Arden (Mousillon supplement). The Forest Mage randomly chooses
    one spell from this list.
  note_i18n:
    es: >-
      Lista de hechizos de los Elfos del Bosque de Arden (suplemento Mousillon). El Mago del
      Bosque elige al azar un hechizo de esta lista.
  spells:
  - id: spell.wood-elven-spells.song-of-thorns
    roll: '1'
    name: Song of Thorns
    name_i18n:
      es: Canción de Espinas
    difficulty: 8
    effect: >-
      Branches strike out to the foe under influence of the singer cadence; if no plants are present
      wooden chips fly at the victim, as if they want to be thorns; the victim suffers 2D6 S1 hits,
      range 8".
    effect_i18n:
      es: >-
        Las ramas golpean al enemigo al compás del canto; si no hay plantas, virutas de madera
        vuelan hacia la víctima como queriendo ser espinas; la víctima sufre 2D6 impactos de F1,
        alcance 8".
  - id: spell.wood-elven-spells.murmuring-of-the-wind
    roll: '2'
    name: Murmuring of the Wind
    name_i18n:
      es: Murmullo del Viento
    difficulty: 7
    effect: >-
      Very softly the wind increases around the caster and takes him wherever he wants; the caster
      may move anywhere within 12", if he gets into HtH it counts as a charge.
    effect_i18n:
      es: >-
        Muy suavemente, el viento se intensifica alrededor del lanzador y lo lleva donde quiera; el
        lanzador puede moverse a cualquier punto dentro de 12"; si entra en combate cuerpo a cuerpo,
        cuenta como carga.
  - id: spell.wood-elven-spells.the-rain-song
    roll: '3'
    name: The Rain Song
    name_i18n:
      es: La Canción de la Lluvia
    difficulty: 9
    effect: >-
      The air around the caster becomes moist and it starts to rain, until it looks like a major
      downpour; everything, except Wood Elves, within 6" of the caster suffers -1 to hit and suffers
      -1 Initiative; lasts until the beginning of the caster's next magic phase.
    effect_i18n:
      es: >-
        El aire alrededor del lanzador se humedece y empieza a llover, hasta parecer un auténtico
        diluvio; todo lo que esté dentro de 6" del lanzador, salvo los Elfos Silvanos, sufre -1 por
        impactar y -1 de Iniciativa; dura hasta el principio de la próxima fase de magia del
        lanzador.
  - id: spell.wood-elven-spells.lyrics-of-feral-infatuation
    roll: '4'
    name: Lyrics of Feral Infatuation
    name_i18n:
      es: Letras de Enamoramiento Feral
    difficulty: 8
    effect: >-
      This soothing song seems to calm even the most ferocious monsters and sends them into a sort
      of lethargic state; any animal or monster has to pass a Ld-test, on his own Ld, in order to
      attack an opponent; if it fails it will do nothing else that turn, not even fighting back if
      attacked.
    effect_i18n:
      es: >-
        Esta canción relajante parece calmar incluso a los monstruos más feroces y los sume en una
        especie de estado letárgico; cualquier animal o monstruo debe superar una tirada de Ld, con
        su propia Ld, para atacar a un oponente; si la falla, no hará nada más ese turno, ni
        siquiera defenderse si es atacado.
  - id: spell.wood-elven-spells.song-of-the-sun
    roll: '5'
    name: Song of the Sun
    name_i18n:
      es: Canción del Sol
    difficulty: 6
    effect: >-
      While the caster sings his victim thinks he is in a scorching desert; his movement slows and
      he might suffer from heat stroke; the target within 18" is -1 M until the caster's next magic
      phase, and he also must make a T-test; if he fails, he suffers a S4 hit.
    effect_i18n:
      es: >-
        Mientras el lanzador canta, su víctima cree estar en un desierto abrasador; su movimiento se
        ralentiza y puede sufrir una insolación; el objetivo dentro de 18" sufre -1 M hasta la
        próxima fase de magia del lanzador, y además debe superar una tirada de T; si la falla,
        sufre un impacto de F4.
  - id: spell.wood-elven-spells.eagles-cry
    roll: '6'
    name: Eagle's Cry
    name_i18n:
      es: Grito del Águila
    difficulty: 8
    effect: >-
      The caster utters a melodious cry, which sounds like a great eagle; this inspires the elves so
      much they gain the legendary sight of Thuarindir; all Wood Elves within 6" gain +1 on to hit
      and +1 on the critical hittable; lasts until the beginning of the caster's next magic phase.
    effect_i18n:
      es: >-
        El lanzador profiere un grito melodioso que suena como un gran águila; esto inspira tanto a
        los elfos que obtienen la legendaria vista de Thuarindir; todos los Elfos Silvanos dentro de
        6" ganan +1 por impactar y +1 para recibir golpes críticos; dura hasta el principio de la
        próxima fase de magia del lanzador.
  source_refs:
  - manual: broheim.net
    printed_page: 2
    section: Special Rules / Woodland Incantations
    url: https://broheim.net/downloads/warbands/supplement/mousillon/Wood%20Elves%20of%20Arden.pdf
- id: lore.lothern-sea-spells
  name: Spells of the Lothern Sea
  name_i18n:
    es: Hechizos del Mar de Lothern
  note: 'VARIANT of the KB Djedhi lore (lore.spells-of-the-djedhi), stated in full the way the KB keeps
    its own reprints (lore.necromancy-restless-dead, lore.onogal-rituals): the source reprints five of
    the Djedhi spells and the fourth spell, Mistress of the Deep (D8), replaces Fleeting Shadows. Source
    note: "Most of the following spells are taken from the ''Djed-Hi Spell List'' from the ''Elven Mage
    Hired Sword'' by Jake Thornton. The exception is the 4th spell, ''Mistress of the Deep'', which replaces
    the spell ''Fleeting Shadows''."'
  note_i18n:
    es: >-
      VARIANTE del saber Djedhi del KB (lore.spells-of-the-djedhi), enunciada íntegra tal como
      el KB conserva sus propias reimpresiones (lore.necromancy-restless-dead,
      lore.onogal-rituals): la fuente reimprime cinco de los hechizos Djedhi y el cuarto
      hechizo, Mistress of the Deep (D8), sustituye a Fleeting Shadows. Nota de la fuente: "Most
      of the following spells are taken from the 'Djed-Hi Spell List' from the 'Elven Mage Hired
      Sword' by Jake Thornton. The exception is the 4th spell, 'Mistress of the Deep', which
      replaces the spell 'Fleeting Shadows'."
  spells:
  - id: spell.lothern-sea-spells.divination-of-shirath
    roll: '1'
    name: Divination of Shirath
    difficulty: 6
    effect: >-
      The Mage may reroll all his failed dice rolls, though the second result stands. The effect
      lasts until the beginning of the Mage's next turn.
    effect_i18n:
      es: >-
        El Mago puede repetir todas sus tiradas de dado fallidas, aunque el segundo resultado es
        definitivo. El efecto dura hasta el principio del siguiente turno del Mago.
    name_i18n:
      es: Adivinación de Shirath
  - id: spell.lothern-sea-spells.shimmering-shield
    roll: '2'
    name: Shimmering Shield
    difficulty: 7
    effect: >-
      This spell gives the Mage an additional unmodified 5+ save against all attacks. The effect
      lasts until the beginning of the Mage's next turn.
    effect_i18n:
      es: >-
        Este conjuro da al Mago una salvación adicional no modificable de 5+ contra todos los
        ataques. El efecto dura hasta el principio del siguiente turno del Mago.
    name_i18n:
      es: Escudo Refulgente
  - id: spell.lothern-sea-spells.statue-of-light
    roll: '3'
    name: Statue of Light
    difficulty: 7
    effect: >-
      The Mage chooses a single enemy model he can see. That model may not move as long as the Mage
      remains both static and alive. The Mage and the target may cast spells normally, but fight in
      close combat at -2 WS, minimum of 1.
    effect_i18n:
      es: >-
        El Mago elige una sola miniatura enemiga que pueda ver. Esa miniatura no puede moverse
        mientras el Mago permanezca estático y vivo. El Mago y el objetivo pueden lanzar conjuros
        con normalidad, pero luchan en combate cuerpo a cuerpo con -2 HA, mínimo 1.
    name_i18n:
      es: Estatua de Luz
  - id: spell.lothern-sea-spells.mistress-of-the-deep
    roll: '4'
    name: Mistress of the Deep
    name_i18n:
      es: Señora de las Profundidades
    difficulty: 8
    effect: >-
      The mage summons a spirit from water, more beauteous than imagined and bewitching to hear.
      Place a man-sized Oceanid model within 6" of the Mist Mage. This model may not move or make
      any actions (it is, for all intents and purposes, scenery rather than a living model). Any
      time an enemy model wants to shoot or declare a charge on your Mist Mage, it must first
      measure the distance between itself and the Oceanid. If the Oceanid is closer than the mage,
      the attacker must first take a Leadership test or be distracted by the Oceanid's singing. If
      the test is failed, the attacker cannot shoot/charge this turn. Once a model has passed a
      test, it does not have to test again for the rest of the game. The spell has no effect against
      models Immune to Psychology. The spell ends when the Mist Mage wants it to, the Mage attempts
      to recast the spell, or the Mage casts another spell. If successfully recast, the Oceanid
      model is moved to any new location within 6" of the Mage.
    effect_i18n:
      es: >-
        El mago invoca un espíritu del agua, más bello de lo imaginable y embrujador de oír. Coloca
        una miniatura de Oceanida de tamaño hombre dentro de 6" del Mago de la Niebla. Esta
        miniatura no puede moverse ni realizar ninguna acción (es, a todos los efectos, escenografía
        en lugar de una miniatura viva). Cada vez que una miniatura enemiga quiera disparar o
        declarar una carga contra tu Mago de la Niebla, primero debe medir la distancia entre ella y
        la Oceanida. Si la Oceanida está más cerca que el mago, el atacante debe superar primero una
        tirada de Liderazgo o quedar distruido por el canto de la Oceanida. Si la tirada falla, el
        atacante no puede disparar ni cargar este turno. Una vez que una miniatura ha superado la
        tirada, no necesita repetirla durante el resto de la partida. El hechizo no afecta a las
        miniaturas Inmunes a la Psicología. El hechizo termina cuando el Mago de la Niebla lo desea,
        cuando el Mago intenta volver a lanzarlo o cuando lanza otro hechizo. Si se relanza con
        éxito, la miniatura de Oceanida se traslada a cualquier nueva posición dentro de 6" del
        Mago.
  - id: spell.lothern-sea-spells.hunters-fury
    roll: '5'
    name: Hunter's Fury
    difficulty: 9
    effect: >-
      The spell summons D3 +1 arrows which the Mage can use to shoot against one enemy model
      following the rules for normal shooting. The arrows have a range of 36". Use the Mage's own
      Ballistic Skill to determine hits, but ignore movement, range and cover penalties. Each arrow
      causes one S3 hit.
    effect_i18n:
      es: >-
        El conjuro invoca D3 +1 flechas que el Mago puede usar para disparar contra una miniatura
        enemiga siguiendo las reglas de disparo normales. Las flechas tienen un alcance de 36". Usa
        la propia Habilidad de Disparo del Mago para determinar los impactos, pero ignora las
        penalizaciones por movimiento, alcance y cobertura. Cada flecha causa un impacto de F3.
    name_i18n:
      es: Furia del Cazador
  - id: spell.lothern-sea-spells.silent-guardian
    roll: '6'
    name: Silent Guardian
    difficulty: 9
    effect: >-
      If the Mage is attacked in close combat, the guardian fights first with WS5, S3, making one
      attack per turn against each enemy that attacks the Mage. The guardian will not leave the
      Mage's side and can only be dispelled if the Mage casts another spell or dies. The guardian
      cannot be attacked in return.
    effect_i18n:
      es: >-
        Si el Mago es atacado en combate cuerpo a cuerpo, el guardián golpea primero con HA5 y F3,
        haciendo un ataque por turno contra cada enemigo que ataque al Mago. El guardián no se
        separará del lado del Mago y solo puede ser disipado si el Mago lanza otro conjuro o muere.
        El guardián no puede ser atacado en respuesta.
    name_i18n:
      es: Guardián Silencioso
  source_refs:
  - manual: broheim.net
    printed_page: 5
    section: Spells of the Lothen Sea
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Lothern%20Sea%20Patrol.pdf
- id: lore.prayers-of-manann
  name: Prayers of Manann
  name_i18n:
    es: Plegarias de Manann
  note: 'SOURCE COMPLETED 2026-09-14: the prayers come from the ''Miracle Workers'' chapter (Werekin/Stuart
    Cresswell, Liber Malefic — the priest article of the Mutiny in Marienburg supplement project; accessible
    copy: scribd document 241727651, ''Miracle Workers in Mordheim'', 18 pages). The shallows-beasts-mim
    Mutant-Priest (servant of Stromfels, Manann''s dark opposite) uses this list, and may receive a Mark
    of Manann on a double advance roll instead of a new skill. The chapter also defines the Mariner-Priest
    of Manann (40 gc, profile 4/3/3/3/3/1/3/1/8, Combat/ Academic/Speed skills, Seafaring +2 S rowing,
    Navigator +/-1 on Nautical Exploration, Marks: One with the Sea, Webbed) and the trident (Close combat,
    Strike first, Parry; rarity 7 per Unknowable Cargo). Casting follows the chapter''s priest rules:
    prayers are cast like spells in the shooting phase, priests may wear armour, prayers cause no critical
    hits. A Priest starts with 12 experience and counts as a Hero.'
  note_i18n:
    es: >-
      FUENTE COMPLETADA 2026-09-14: las plegarias provienen del capítulo 'Miracle Workers'
      (Werekin/Stuart Cresswell, Liber Malefic; el artículo del sacerdote del proyecto del
      suplemento Mutiny in Marienburg; copia accesible: documento de scribd 241727651, 'Miracle
      Workers in Mordheim', 18 páginas). El Mutante-Sacerdote de shallows-beasts-mim (servidor
      de Stromfels, el opuesto oscuro de Manann) usa esta lista, y puede recibir una Marca de
      Manann con una tirada doble de avance en lugar de una nueva habilidad. El capítulo también
      define al Sacerdote Marinero de Manann (40 co, perfil 4/3/3/3/3/1/3/1/8, habilidades de
      Combate, Académicas y Velocidad, Marinería +2 F remando, Navegante +/-1 en Exploración
      Náutica, Marcas: Uno con el Mar, Palmeado) y el tridente (cuerpo a cuerpo, Golpe primero,
      Parada; rareza 7 según Carga Inescrutable). El lanzamiento sigue las reglas de sacerdote
      del capítulo: las plegarias se lanzan como hechizos en la fase de disparo, los sacerdotes
      pueden llevar armadura y las plegarias no causan impactos críticos. Un Sacerdote empieza
      con 12 de experiencia y cuenta como héroe.
  spells:
  - id: spell.prayers-of-manann.blessed-voyage
    roll: '1'
    name: Blessed Voyage
    name_i18n:
      es: Viaje Bendecido
    difficulty: 5
    effect: >-
      Mariner-Priests commune with the fickle God of the Seas at the beginning of every voyage. The
      strength of his divine influence is enough to turn any tide. As long as the Priest began the
      battle upon water, then so long as he remains upon water for the entire duration of the
      battle, any single dice result can be re-rolled during the post battle sequence. Being upon
      water can be defined as standing on a jetty or watercraft, or being submerged in water.
    effect_i18n:
      es: >-
        Los Sacerdotes Marineros comulgan con el caprichoso Dios de los Mares al comienzo de cada
        viaje. La fuerza de su influencia divina basta para cambiar cualquier marea. Mientras el
        Sacerdote comenzara la batalla sobre el agua, y mientras permanezca sobre el agua durante
        toda la batalla, cualquier resultado de dado puede repetirse durante la secuencia posterior
        a la batalla. Estar sobre el agua puede definirse como estar de pie en un embarcadero o
        embarcación, o sumergido en el agua.
  - id: spell.prayers-of-manann.curse-of-the-albatross
    roll: '2'
    name: Curse of the Albatross
    name_i18n:
      es: Maldición del Albatros
    difficulty: 10
    effect: >-
      The wrath of Manann is not to be trifled with. Landlubbers quail as the Priest invokes their
      ultimate doom. Enemy warriors within 24" of the Priest will suffer a critical hit on a roll of
      a 5 or 6 instead of a 6 for the next round of close combat.
    effect_i18n:
      es: >-
        No debe burlarse la ira de Manann. Los grumos se acobardan cuando el Sacerdote invoca su
        perdición definitiva. Los guerreros enemigos dentro de 24" del Sacerdote sufren un golpe
        crítico con un resultado de 5 o 6 en lugar de 6 durante la siguiente ronda de combate cuerpo
        a cuerpo.
  - id: spell.prayers-of-manann.drowned-mans-face
    roll: '3'
    name: Drowned Man's Face
    name_i18n:
      es: Rostro del Ahogado
    difficulty: 7
    effect: >-
      A seasoned Mariner-Priest chants prayer to beseech Manann to impede the unfaithful. The
      enemies lungs instantaneously become pumped full of salt water. An enemy warrior within 18" of
      the Priest receives a +1 modifier to all characteristic based tests. During each of his
      recovery phases, the player controlling the drowning man may have the warrior attempt to break
      the spell by passing a toughness test with no modifier applied. The affected warrior suffers a
      Strength 2 hit when the spell expires.
    effect_i18n:
      es: >-
        Un Sacerdote Marinero curtido entona una plegaria para implorar a Manann que impida a los
        infieles. Los pulmones del enemigo se llenan instantáneamente de agua salada. Un guerrero
        enemigo dentro de 18" del Sacerdote recibe un modificador de +1 a todas las tiradas basadas
        en características. Durante cada una de sus fases de recuperación, el jugador que controla
        al ahogado puede intentar romper el hechizo superando una tirada de Resistencia sin
        modificadores. El guerrero afectado sufre un impacto de Fuerza 2 cuando el hechizo expira.
  - id: spell.prayers-of-manann.sea-legs
    roll: '4'
    name: Sea Legs
    name_i18n:
      es: Patas de Mar
    difficulty: 8
    effect: >-
      Prayer can be used to bind individuals to the will of Manann. Priests can curse their foe to
      stand upon the deck of a ship caught in stormy weather. An enemy warrior within 18" of the
      Priest must pass an Initiative test to remain standing. If the warrior fails the test he is
      knocked down and may only stand with a successfully passed Initiative test with a +1 modifier
      applied.
    effect_i18n:
      es: >-
        La plegaria puede usarse para atar a los individuos a la voluntad de Manann. Los Sacerdotes
        pueden maldecir a su enemigo para que se mantenga en pie sobre la cubierta de un barco
        azotado por la tormenta. Un guerrero enemigo dentro de 18" del Sacerdote debe superar una
        tirada de Iniciativa para permanecer en pie. Si falla la tirada, cae derribado y solo puede
        levantarse superando una tirada de Iniciativa con un modificador de +1.
  - id: spell.prayers-of-manann.water-blast
    roll: '5'
    name: Water Blast
    name_i18n:
      es: Explosión de Agua
    difficulty: 8
    effect: >-
      Hands outstretched reverently, the old Mariner unleashes a sweeping torrent of brine water by
      the grace of the Lord of Tides. Any model within 18" of the Priest is struck with a magical
      blast of water. The blast has Strength 4 and the target must pass a Strength test or be
      knocked down. A water blast extinguishes flames, affecting anything set on fire within 2" of
      its target.
    effect_i18n:
      es: >-
        Con las manos extendidas con reverencia, el viejo Marino desata un torrente de agua salada
        por la gracia del Señor de las Mareas. Cualquier miniatura dentro de 18" del Sacerdote es
        golpeada por una explosión mágica de agua. La explosión tiene Fuerza 4 y el objetivo debe
        superar una tirada de Fuerza o caer derribado. Una explosión de agua extingue las llamas,
        afectando a todo lo que esté ardiendo dentro de 2" de su objetivo.
  - id: spell.prayers-of-manann.waterwalk
    roll: '6'
    name: Waterwalk
    name_i18n:
      es: Paseo sobre las Aguas
    difficulty: 9
    effect: >-
      Floating on a raft of true belief, the Priest solicits the power of faith in a majestic
      display that defies all logic. In the next movement phase the Priest is able to walk on water,
      marsh and swampland as if it were firm ground. The effects of this prayer last until the
      Priest returns to any solid platform.
    effect_i18n:
      es: >-
        Flotando sobre una balsa de fe verdadera, el Sacerdote solicita el poder de la fe en una
        exhibición majestuosa que desafía toda lógica. En la siguiente fase de movimiento el
        Sacerdote puede caminar sobre el agua, la marisma y el terreno pantanoso como si fuera
        tierra firme. Los efectos de esta plegaria duran hasta que el Sacerdote regresa a cualquier
        plataforma sólida.
  source_refs:
  - manual: liber-malefic
    printed_page: 17
    section: Prayers of Manann
    url: https://www.scribd.com/document/241727651/Miracle-workers-in-Mordheim
  - manual: broheim.net
    printed_page: 3
    section: Heroes / 0-1 Mutant-Priest / Special Rules / Prayers
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Shallows%20Beasts.pdf
- id: lore.prayers-of-morr
  name: Prayers of Morr
  name_i18n:
    es: Plegarias de Morr
  note: El Sacerdote de Morr elige al azar una plegaria de esta lista.
  note_i18n:
    es: El Sacerdote de Morr elige al azar una plegaria de esta lista.
  spells:
  - id: spell.prayers-of-morr.destroy-undead
    roll: '1'
    name: Destroy Undead
    name_i18n:
      es: Destruir No Muertos
    difficulty: 8
    effect: >-
      Through a devout supplicant, by the hand of Morr, the Undead shall become as dust and ashes.
      The Priest of Morr must be touching an enemy Undead or Daemon model to use this prayer. If
      successful the foe immediately goes out of action (this only affects Zombies, Dire Wolves,
      Vampires etc). Ghouls, Possessed and Daemons affected by this prayer will immediately flee
      their full Movement away from the Priest of Morr.
    effect_i18n:
      es: >-
        Por medio de un devoto suplicante, de la mano de Morr, los No Muertos se convertirán en
        polvo y cenizas. El Sacerdote de Morr debe estar en contacto con una miniatura No Muerta o
        Demoníaca enemiga para usar esta plegaria. Si tiene éxito, el enemigo queda inmediatamente
        Fuera de combate (solo afecta a Zombis, Lobos Dire, Vampiros, etc.). Los Ghouls, Poseídos y
        Demonios afectados por esta plegaria huirán inmediatamente todo su Movimiento alejándose del
        Sacerdote de Morr.
  - id: spell.prayers-of-morr.glimpse-ahead
    roll: '2'
    name: Glimpse Ahead
    name_i18n:
      es: Vislumbre del Porvenir
    difficulty: 9
    effect: >-
      Amongst the church of Morr there are augurs who are said to be possessed of witch sight. It is
      said this trait can lead only to madness and as such the augurs are given a wider berth by
      fellow clergymen than their Morrian counterparts. The Priest is entitled to modify the result
      of a roll he makes by +1 or -1. Successful casting of this rite cannot be repeated during a
      battle or else the Priest would succumb to insanity! If the modifier has not been applied to
      the result of a roll during the battle, then it can be applied to a roll the Priest makes
      during the post battle sequence when either searching for a Rare item or visiting another
      location.
    effect_i18n:
      es: >-
        Entre la iglesia de Morr hay augures de los que se dice que poseen vista de brujo. Se cuenta
        que este rasgo solo puede conducir a la locura y, por ello, los clérigos les dan un margen
        mayor que a sus homólogos morrianos. El Sacerdote tiene derecho a modificar el resultado de
        una tirada que realice en +1 o -1. El lanzamiento con éxito de este rito no puede repetirse
        durante una batalla, o el Sacerdote sucumbiría a la locura. Si el modificador no se ha
        aplicado al resultado de una tirada durante la batalla, puede aplicarse a una tirada que el
        Sacerdote realice durante la secuencia posterior a la batalla, ya sea al buscar un objeto
        Raro o al visitar otra localización.
  - id: spell.prayers-of-morr.preserve-corpse
    roll: '3'
    name: Preserve Corpse
    name_i18n:
      es: Preservar el Cadáver
    difficulty: 5
    effect: >-
      Those who fall become sanctified through funerary rites carried out the Priest and their soul
      freed, in the name of Morr, God of Death. The Priest of Morr may attempt to perform the prayer
      of sanctity on a model (friend or foe) who has been taken out of action. The Priest of Morr
      must be within 6" of the model in question. If successful, the model may not be raised by a
      Necromancer.
    effect_i18n:
      es: >-
        Los que caen son santificados mediante los ritos funerarios llevados a cabo por el Sacerdote
        y su alma es liberada, en nombre de Morr, Dios de la Muerte. El Sacerdote de Morr puede
        intentar realizar la plegaria de santidad sobre una miniatura (amiga o enemiga) que haya
        quedado Fuera de combate. El Sacerdote de Morr debe estar a 6" o menos de la miniatura en
        cuestión. Si tiene éxito, la miniatura no podrá ser alzada por un Nigromante.
  - id: spell.prayers-of-morr.sign-of-the-raven
    roll: '4'
    name: Sign of the Raven
    name_i18n:
      es: Signo del Cuervo
    difficulty: 7
    effect: >-
      Priests of Morr must be steadfast in their resolution and as such must, above all else, have
      no fear of death. Dire circumstances are when the actions of a Morrian Priest can inspire
      warriors to perform heroic deeds, despite of certain doom. During the next close combat phase
      all friendly models with 6" including the Priest, receive +1 on all rolls to wound.
    effect_i18n:
      es: >-
        Los Sacerdotes de Morr deben ser firmes en su resolución y, como tales, deben tener, ante
        todo, ningún miedo a la muerte. Las circunstancias adversas son cuando las acciones de un
        Sacerdote morriano pueden inspirar a los guerreros a realizar gestas heroicas, a pesar de la
        perdición segura. Durante la siguiente fase de combate cuerpo a cuerpo, todas las miniaturas
        amigas a 6" o menos, incluido el Sacerdote, reciben +1 en todas las tiradas para herir.
  - id: spell.prayers-of-morr.sleep-of-death
    roll: '5'
    name: Sleep of Death
    name_i18n:
      es: Sueño de la Muerte
    difficulty: 10
    effect: >-
      Servants of Morr are taught to divine and invoke the will of the God of Dreams, allowing them
      to interfere with the conscious minds of the living. The most learned of the church are
      capable of manipulating individuals in a dreamstate. Draw a 12" line from the Priest. Any
      enemy models falling under the line fall asleep for D6 turns, unless a successful Leadership
      test is passed by each model. Roll a D6 for each model affected. Sleeping models are treated
      as being knocked down. Undead creatures are immune to the effects of this prayer.
    effect_i18n:
      es: >-
        A los siervos de Morr se les enseña a adivinar e invocar la voluntad del Dios de los Sueños,
        lo que les permite interferir en las mentes conscientes de los vivos. Los más doctos de la
        iglesia son capaces de manipular a los individuos en estado de ensueño. Traza una línea de
        12" desde el Sacerdote. Las miniaturas enemigas que caigan bajo la línea se quedan dormidas
        durante D6 turnos, a menos que cada miniatura supere con éxito una tirada de Liderazgo. Tira
        un D6 por cada miniatura afectada. Las miniaturas dormidas se consideran derribadas. Las
        criaturas No Muertas son inmunes a los efectos de esta plegaria.
  - id: spell.prayers-of-morr.threshold-line
    roll: '6'
    name: Threshold Line
    name_i18n:
      es: Línea Umbral
    difficulty: 8
    effect: >-
      Charcoal is used after reciting an arcane phrase when the Priest is confronted by an
      apparition of Old Night to block its path. Mark a 4" long line. This mark can be applied to a
      walkway, doorway, stair or other entry point to prevent an Undead creature from passing it.
      Any Undead creature must pass a Leadership test with a +1 modifier to the roll before it can
      pass the threshold marker, which lasts for the duration of the battle.
    effect_i18n:
      es: >-
        Se usa carbón, tras recitar una frase arcana, cuando el Sacerdote se enfrenta a una
        aparición de la Vieja Noche, para bloquear su paso. Marca una línea de 4" de largo. Esta
        marca puede aplicarse a un paso, una puerta, una escalera u otro punto de entrada para
        impedir que la cruce una criatura No Muerta. Cualquier criatura No Muerta debe superar una
        tirada de Liderazgo con un modificador de +1 a la tirada antes de poder cruzar el marcador
        umbral, que dura el resto de la batalla.
  source_refs:
  - manual: liber-malefic
    url: https://www.scribd.com/document/241727651/Miracle-workers-in-Mordheim
    printed_page: 12
    section: Prayers of Prayers of Morr
- id: lore.prayers-of-myrmidia
  name: Prayers of Myrmidia
  name_i18n:
    es: Plegarias de Myrmidia
  note: La Sacerdotisa de Guerra de Myrmidia elige al azar una plegaria de esta lista.
  note_i18n:
    es: La Sacerdotisa de Guerra de Myrmidia elige al azar una plegaria de esta lista.
  spells:
  - id: spell.prayers-of-myrmidia.blazing-sun
    roll: '1'
    name: Blazing Sun
    name_i18n:
      es: Sol Abrasador
    difficulty: 10
    effect: >-
      For some Priestesses there is a unique view where the world can be brought into order with
      blinding flames of retribution. Myrmidia answers prayer with fury. Any models within 4" of the
      Priestess suffer a Strength 3 hit with no armour saves allowed, and must pass a Leadership
      test or be knocked down (to extinguish their attire and half-blind by the blinding flames). A
      War-Priestess of Myrmidia is unaffected by the prayer.
    effect_i18n:
      es: >-
        Para algunas Sacerdotisas existe una visión única en la que el mundo puede ser puesto en
        orden con llamas cegadoras de retribución. Myrmidia responde a la plegaria con furia. Las
        miniaturas a 4" o menos de la Sacerdotisa sufren un impacto de Fuerza 3 sin tiradas de
        salvación por armadura permitidas, y deben superar una tirada de Liderazgo o quedar
        derribadas (para apagar su vestimenta y quedarse medio cegadas por las llamas
        deslumbrantes). Una Sacerdotisa de Guerra de Myrmidia no resulta afectada por la plegaria.
  - id: spell.prayers-of-myrmidia.command-the-legion
    roll: '2'
    name: Command the Legion
    name_i18n:
      es: Comandar la Legión
    difficulty: 6
    effect: >-
      Myrmidia lends her strength to the snarling words of the War-Priestess. As the vassal dictates
      solid tactics through prayer, the legionnaires become righteous. Any target warrior within the
      Priestess's line of sight receives +1 Leadership until the start of the players next turn.
    effect_i18n:
      es: >-
        Myrmidia presta su fuerza a las palabras atronadoras de la Sacerdotisa de Guerra. Mientras
        la vasalla dicta tácticas sólidas mediante la plegaria, los legionarios se vuelven justos.
        Cualquier guerrero objetivo dentro de la línea de visión de la Sacerdotisa recibe +1 de
        Liderazgo hasta el comienzo del siguiente turno de los jugadores.
  - id: spell.prayers-of-myrmidia.dismay-foe
    roll: '3'
    name: Dismay Foe
    name_i18n:
      es: Consternar al Enemigo
    difficulty: 9
    effect: >-
      In her wrathful aspect the War Goddess can be invoked by a Priestess. All those heretics who
      gaze upon her just form in melee become utterly terrified. Any model attacking the Priestess
      in close combat this turn must pass a Leadership test or is unable to make any attacks. Undead
      are immune to the effects of this prayer.
    effect_i18n:
      es: >-
        En su aspecto iracundo, la Diosa de la Guerra puede ser invocada por una Sacerdotisa. Todos
        aquellos herejes que contemplan su forma justa en la melé quedan completamente aterrados.
        Cualquier miniatura que ataque a la Sacerdotisa en combate cuerpo a cuerpo este turno debe
        superar una tirada de Liderazgo o no podrá realizar ningún ataque. Los No Muertos son
        inmunes a los efectos de esta plegaria.
  - id: spell.prayers-of-myrmidia.eagle-s-vision
    roll: '4'
    name: Eagle's Vision
    name_i18n:
      es: Visión del Águila
    difficulty: 8
    effect: >-
      Entering a trance-like state the Priestess receives lucid visions from the Goddess.
      Interpreting answers to her prayers enables sly enemies in hiding to be detected. The
      War-Priestess can use this prayer to reveal any hidden warrior. A Priestess who has moved this
      turn is unable to use this prayer, and the prayer cannot be used if the Priestess is in close
      combat.
    effect_i18n:
      es: >-
        Entrando en un estado de trance, la Sacerdotisa recibe visiones lúcidas de la Diosa. La
        interpretación de las respuestas a sus plegarias permite detectar a los enemigos astutos que
        estén ocultos. La Sacerdotisa de Guerra puede usar esta plegaria para revelar a cualquier
        guerrero oculto. Una Sacerdotisa que se haya movido este turno no puede usar esta plegaria,
        y la plegaria no puede usarse si la Sacerdotisa está en combate cuerpo a cuerpo.
  - id: spell.prayers-of-myrmidia.fury-s-call
    roll: '5'
    name: Fury's Call
    name_i18n:
      es: Llamada de la Ira
    difficulty: 9
    effect: >-
      Passion can be found in prayer. The Priestess recants fervent sermons deposing hated despots
      in opposition of the War Goddess. All friendly models within 12" not including the Priestess
      may re-roll their first missed attack during the next close combat phase.
    effect_i18n:
      es: >-
        La pasión puede hallarse en la plegaria. La Sacerdotisa recita fervientes sermones depuestos
        contra los déspotas odiados en oposición a la Diosa de la Guerra. Todas las miniaturas
        amigas a 12" o menos, sin incluir a la Sacerdotisa, pueden repetir su primer ataque fallido
        durante la siguiente fase de combate cuerpo a cuerpo.
  - id: spell.prayers-of-myrmidia.vengeful-wrath
    roll: '6'
    name: Vengeful Wrath
    name_i18n:
      es: Ira Vengativa
    difficulty: 6
    effect: >-
      Lifeblood of the wronged fuels a divine command of unbridled fury. The Priestess dictates
      vengeance upon all hated foes in a rite of retaliation. The War-Priestess may re-roll each
      failed roll to hit the next time that a round of hand-to-hand combat is being fought. Until
      her next close combat has started the Priestess must always charge if there are enemy models
      within charge range. The player has no choice in the matter – the Priestess will automatically
      declare a charge.
    effect_i18n:
      es: >-
        La sangre de los agraviados alimenta un mandato divino de ira desbocada. La Sacerdotisa
        decreta la venganza sobre todos los enemigos odiados en un rito de represalia. La
        Sacerdotisa de Guerra puede repetir cada tirada para impactar fallida la próxima vez que se
        luche una ronda de combate cuerpo a cuerpo. Hasta que comience su próximo combate cuerpo a
        cuerpo, la Sacerdotisa siempre debe cargar si hay miniaturas enemigas dentro de alcance de
        carga. El jugador no tiene elección en el asunto: la Sacerdotisa declarará automáticamente
        una carga.
  source_refs:
  - manual: liber-malefic
    url: https://www.scribd.com/document/241727651/Miracle-workers-in-Mordheim
    printed_page: 13
    section: Prayers of Prayers of Myrmidia
- id: lore.prayers-of-ranald-and-handrich
  name: Prayers of Ranald & Handrich
  name_i18n:
    es: Plegarias de Ranald y Handrich
  note: El Sacerdote Tramposo de Ranald elige al azar una plegaria de esta lista; en Marienburg, los sacerdotes
    de Handrich (Dios del Comercio) pueden usar la misma lista.
  note_i18n:
    es: >-
      El Sacerdote Tramposo de Ranald elige al azar una plegaria de esta lista; en Marienburg,
      los sacerdotes de Handrich (Dios del Comercio) pueden usar la misma lista.
  spells:
  - id: spell.prayers-of-ranald-and-handrich.bamboozle
    roll: '1'
    name: Bamboozle
    name_i18n:
      es: Engañifa
    difficulty: 9
    effect: >-
      Creating confusion is a talent the Priest has mastered! By craving the blessing of his fickle
      patron the Priest cajoles a creature short on wit to do his bidding. An enemy warrior within
      12" of the Priest must pass a Leadership test or during the next turn the warrior is
      controlled by the player who controls the Priest. The bamboozled warrior may do something
      which results in its harm, but may not attack itself. Large models, Daemons and Undead are
      immune to the effects of this prayer.
    effect_i18n:
      es: >-
        ¡Crear confusión es un talento que el Sacerdote ha dominado! Suplicando la bendición de su
        caprichoso patrón, el Sacerdote engatusa a una criatura corta de ingenio para que haga su
        voluntad. Un guerrero enemigo a 12" o menos del Sacerdote debe superar una tirada de
        Liderazgo o, durante el siguiente turno, el guerrero será controlado por el jugador que
        controle al Sacerdote. El guerrero embaucado puede hacer algo que le resulte dañino, pero no
        puede atacarse a sí mismo. Las miniaturas Grandes, los Demonios y los No Muertos son inmunes
        a los efectos de esta plegaria.
  - id: spell.prayers-of-ranald-and-handrich.bargain-hunter
    roll: '2'
    name: Bargain Hunter
    name_i18n:
      es: Cazador de Chollos
    difficulty: 8
    effect: >-
      Intoning this litany, the Priest divines a geographical area pinpointing a hotbed of quality
      merchandise. Opulent goods being quickly shifted in a price slash. If successfully cast then
      Common items must be reduced in price by one third of their cost during the next post battle
      sequence. Any fractions should be rounded down. Additionally, one Hero from the Priest's
      warband is guided to a Rare item of his choice which is charged at the normal cost. The
      maximum price for Common items purchased during the post battle sequence is altered to match
      the price slash, which consequently affects all players. The prayer cannot be used again once
      it has been successfully cast.
    effect_i18n:
      es: >-
        Entonando esta letanía, el Sacerdote adivina un área geográfica señalando un hervidero de
        mercancía de calidad. Artículos opulentos que se despachan rápidamente en una rebaja de
        precios. Si se lanza con éxito, los artículos Comunes deben rebajarse un tercio de su coste
        durante la siguiente secuencia posterior a la batalla. Las fracciones se redondean hacia
        abajo. Además, un Héroe de la banda del Sacerdote es guiado hacia un objeto Raro de su
        elección, que se cobra a su coste normal. El precio máximo de los artículos Comunes
        comprados durante la secuencia posterior a la batalla se altera para ajustarse a la rebaja,
        lo que consecuentemente afecta a todos los jugadores. La plegaria no puede usarse de nuevo
        una vez se haya lanzado con éxito.
  - id: spell.prayers-of-ranald-and-handrich.bountiful-fortune
    roll: '3'
    name: Bountiful Fortune
    name_i18n:
      es: Fortuna Espléndida
    difficulty: 10
    effect: >-
      Comrades are gifted with uncanny luck when the Priest implores his deity for an upturn in the
      gang's fortunes. The Priest and any warriors from his warband within 12" may each reverse the
      chances of success on a single dice roll or characteristic test. For example, if a warrior
      with a missile weapon requires a 6 to hit, then reversing the odds will mean that the warrior
      will hit his target on a roll of 1-5 instead. The prayer is effective until the start of the
      players next turn.
    effect_i18n:
      es: >-
        Los camaradas son agraciados con una suerte insólita cuando el Sacerdote implora a su deidad
        un cambio de fortuna para la banda. El Sacerdote y cualquier guerrero de su banda a 12" o
        menos pueden invertir cada uno las probabilidades de éxito de una única tirada de dado o
        tirada de característica. Por ejemplo, si un guerrero con un arma de proyectil necesita un 6
        para impactar, invertir las probabilidades significará que el guerrero impactará a su
        objetivo con un resultado de 1-5. La plegaria es efectiva hasta el comienzo del siguiente
        turno de los jugadores.
  - id: spell.prayers-of-ranald-and-handrich.open
    roll: '4'
    name: Open
    name_i18n:
      es: Abrir
    difficulty: 7
    effect: >-
      Few doors are considered closed to clergymen. It is joked that this Priest can walk through
      walls! The Priest petitions for safe passage to override any barrier. A lock, bolt or latch
      becomes unlocked by the Priest. This includes magical locks. The Priest model must be touching
      the lock to use this prayer.
    effect_i18n:
      es: >-
        Pocas puertas se consideran cerradas para los clérigos. Se bromea diciendo que este
        Sacerdote puede atravesar paredes. El Sacerdote pide paso seguro para superar cualquier
        barrera. Una cerradura, cerrojo o pestillo queda abierto por el Sacerdote. Esto incluye las
        cerraduras mágicas. La miniatura del Sacerdote debe estar en contacto con la cerradura para
        usar esta plegaria.
  - id: spell.prayers-of-ranald-and-handrich.rumour-of-bounty-rumour-of-dearth
    roll: '5'
    name: Rumour of Bounty, Rumour of Dearth
    name_i18n:
      es: Rumor de Abundancia, Rumor de Escasez
    difficulty: 9
    effect: >-
      The Priest requisitions his lord to assist in manipulating priced commodities. If successfully
      cast then all equipment of one type may be halved in price (ie, bows cost 5 gold crowns) or a
      Rare item becomes Common during the next post battle phase. Alternatively, all equipment of
      one type may be doubled in price (ie, bows cost 20 gold crowns) or a Common item becomes Rare
      10. All warbands are affected by the rumour during the post battle sequence. The prayer cannot
      be used again once it has been successfully cast.
    effect_i18n:
      es: >-
        El Sacerdote solicita a su señor que le asista en la manipulación de las mercancías con
        precio. Si se lanza con éxito, todo el equipo de un tipo puede ver su precio reducido a la
        mitad (es decir, los arcos cuestan 5 coronas de oro) o un objeto Raro se convierte en Común
        durante la siguiente fase posterior a la batalla. Alternativamente, todo el equipo de un
        tipo puede ver su precio duplicado (es decir, los arcos cuestan 20 coronas de oro) o un
        artículo Común se convierte en Raro 10. Todas las bandas se ven afectadas por el rumor
        durante la secuencia posterior a la batalla. La plegaria no puede usarse de nuevo una vez se
        haya lanzado con éxito.
  - id: spell.prayers-of-ranald-and-handrich.stealth
    roll: '6'
    name: Stealth
    name_i18n:
      es: Sigilo
    difficulty: 5
    effect: >-
      Calling upon divine favour, bountiful servants quickly develop a knack of going unnoticed and
      evading conflict whenever it suits them. The Priest becomes hidden until the start of the
      players next turn. Any attempts made to detect or spot the Priest will automatically fail
      unless they are achievable through magical means.
    effect_i18n:
      es: >-
        Invocando el favor divino, los pródigos siervos desarrollan rápidamente una habilidad para
        pasar desapercibidos y evitar el conflicto cuando les conviene. El Sacerdote se oculta hasta
        el comienzo del siguiente turno de los jugadores. Cualquier intento de detectar o avistar al
        Sacerdote fallará automáticamente a menos que pueda lograrse por medios mágicos.
  source_refs:
  - manual: liber-malefic
    url: https://www.scribd.com/document/241727651/Miracle-workers-in-Mordheim
    printed_page: 14
    section: Prayers of Prayers of Ranald & Handrich
- id: lore.prayers-of-shallya
  name: Prayers of Shallya
  name_i18n:
    es: Plegarias de Shallya
  note: La Sacerdotisa de Shallya elige al azar una plegaria de esta lista.
  note_i18n:
    es: La Sacerdotisa de Shallya elige al azar una plegaria de esta lista.
  spells:
  - id: spell.prayers-of-shallya.cure-disease
    roll: '1'
    name: Cure Disease
    name_i18n:
      es: Curar Enfermedad
    difficulty: 8
    effect: >-
      The Priestess petitions Shallya to remedy those unfortunate enough to have been struck low by
      the sickness of plague. The Priestess or any model in contact with the Priestess is healed
      from the effects of a disease. The disease is removed from the subject model and all
      ill-effects are ignored.
    effect_i18n:
      es: >-
        La Sacerdotisa implora a Shallya que remedie a aquellos desafortunados que hayan sido
        abatidos por la enfermedad de la plaga. La Sacerdotisa o cualquier miniatura en contacto con
        la Sacerdotisa queda sanada de los efectos de una enfermedad. La enfermedad se elimina de la
        miniatura afectada y todos sus efectos nocivos se ignoran.
  - id: spell.prayers-of-shallya.cure-wounds
    roll: '2'
    name: Cure Wounds
    name_i18n:
      es: Curar Heridas
    difficulty: 6
    effect: >-
      Beseeching the Mercy Goddess to restore health of a fallen warrior is the widely done duty of
      the Priestess. The Priestess or any model in contact with the Priestess immediately recovers 1
      Wound.
    effect_i18n:
      es: >-
        Implorar a la Diosa de la Misericordia que restaure la salud de un guerrero caído es el
        deber ampliamente realizado de la Sacerdotisa. La Sacerdotisa o cualquier miniatura en
        contacto con la Sacerdotisa recupera inmediatamente 1 Herida.
  - id: spell.prayers-of-shallya.golden-tears
    roll: '3'
    name: Golden Tears
    name_i18n:
      es: Lágrimas Doradas
    difficulty: 10
    effect: >-
      Tears of purity shower upon the dying as the Priestess entreats Shallya for a merciful pardon.
      This prayer can only be used if the Priestess is able to reach the spot where a warrior was
      taken out of action in the previous turn. If successfully cast, the Priestess has healed the
      warrior. Return the model to play with 1 Wound, in the knocked down position.
    effect_i18n:
      es: >-
        Lágrimas de pureza llueven sobre los moribundos mientras la Sacerdotisa implora a Shallya un
        indulto misericordioso. Esta plegaria solo puede usarse si la Sacerdotisa es capaz de
        alcanzar el punto donde un guerrero quedó Fuera de combate en el turno anterior. Si se lanza
        con éxito, la Sacerdotisa ha sanado al guerrero. Devuelve la miniatura al juego con 1
        Herida, en la posición derribada.
  - id: spell.prayers-of-shallya.purify
    roll: '4'
    name: Purify
    name_i18n:
      es: Purificar
    difficulty: 9
    effect: >-
      The Cleric displays her abhorrence of the Plague God with an anathema to his polluting
      servants. The Priestess shrivels vile followers of Onogal with the purifying power of Shallya.
      Any warriors from a Carnival of Chaos warband or other servants of Onogal the Fly Lord within
      24" of the Priestess lose D6 Wounds, regardless of Toughness or armour. All affected warriors
      reduced to 0 Wounds must also pass a Leadership test or be treated as being stunned.
    effect_i18n:
      es: >-
        La Clériga muestra su aborrecimiento del Dios de la Plaga con un anatema contra sus siervos
        contaminantes. La Sacerdotisa marchita a los viles seguidores de Onogal con el poder
        purificador de Shallya. Los guerreros de una banda de la Carnival of Chaos u otros siervos
        de Onogal el Señor de las Moscas a 24" o menos de la Sacerdotisa pierden D6 Heridas, sin
        importar Resistencia ni armadura. Todos los guerreros afectados reducidos a 0 Heridas deben
        superar además una tirada de Liderazgo o se los considera aturdidos.
  - id: spell.prayers-of-shallya.shallya-s-endurance
    roll: '5'
    name: Shallya's Endurance
    name_i18n:
      es: Aguante de Shallya
    difficulty: 7
    effect: >-
      In chanting a rite of resilience the Sister delivers the power of Shallya, boosting the
      vitality of a worthy defender. At her decree the champion endures the pain. The Priestess or
      any model in contact with the Priestess receives +1 Toughness during the next round of close
      combat.
    effect_i18n:
      es: >-
        Al entonar un rito de resiliencia, la Hermana canaliza el poder de Shallya, impulsando la
        vitalidad de un defensor digno. Por su decreto, el campeón aguanta el dolor. La Sacerdotisa
        o cualquier miniatura en contacto con la Sacerdotisa recibe +1 de Resistencia durante la
        siguiente ronda de combate cuerpo a cuerpo.
  - id: spell.prayers-of-shallya.vestment-of-purity
    roll: '6'
    name: Vestment of Purity
    name_i18n:
      es: Vestidura de Pureza
    difficulty: 10
    effect: >-
      A miracle of faith as the Priestess weathers the stream of corruption. Heretic lieutenants of
      the Plague Lord yield before the overwhelming purity of Shallya. The Priestess becomes immune
      to all poisons and diseases. In addition, Daemons, warriors from a Carnival of Chaos warband
      or any other servants of Onogal the Fly Lord must pass a Leadership test taken at -2
      Leadership to charge, shoot missiles at or use magic attacks against the Priestess. The
      effects of this prayer last until the Priestess attacks an enemy model in close combat.
    effect_i18n:
      es: >-
        Un milagro de fe mientras la Sacerdotisa resiste la corriente de corrupción. Los tenientes
        herejes del Señor de la Plaga ceden ante la abrumadora pureza de Shallya. La Sacerdotisa se
        vuelve inmune a todos los venenos y enfermedades. Además, los Demonios, los guerreros de una
        banda de la Carnival of Chaos o cualquier otro siervo de Onogal el Señor de las Moscas deben
        superar una tirada de Liderazgo con -2 de Liderazgo para cargar, disparar proyectiles o usar
        ataques mágicos contra la Sacerdotisa. Los efectos de esta plegaria duran hasta que la
        Sacerdotisa ataque a una miniatura enemiga en combate cuerpo a cuerpo.
  source_refs:
  - manual: liber-malefic
    url: https://www.scribd.com/document/241727651/Miracle-workers-in-Mordheim
    printed_page: 15
    section: Prayers of Prayers of Shallya
- id: lore.prayers-of-ulric-miracle-workers
  name: Prayers of Ulric (Miracle Workers)
  name_i18n:
    es: Plegarias de Ulric (Miracle Workers)
  note: 'El Sacerdote Lobo de Ulric elige al azar una plegaria de esta lista. VARIANT of the KB lore.prayers-of-ulric
    (Snow Squall D6, Hammerschlag D10, Bloodlust D7, Wolf''s Hunger D7, Ulric''s Howl D10, Call of Ulric
    D10): the Miracle Workers chapter rewrites the Wolf-Priest prayers completely (Frost''s Bite D7, Heart
    of the Wolf D8, Hoarfrost Thews D8, Ice Storm D10, The Snow King''s Decree D10, Wild Pack D8). No
    spell overlaps; the MW list replaces the Town Cryer list for this profile only. At promotion: keep
    both lores and route lore_assignments of the MW Wolf-Priest to this variant.'
  note_i18n:
    es: >-
      El Sacerdote Lobo de Ulric elige al azar una plegaria de esta lista. VARIANTE del saber
      lore.prayers-of-ulric del KB (Snow Squall D6, Hammerschlag D10, Bloodlust D7, Wolf's
      Hunger D7, Ulric's Howl D10, Call of Ulric D10): el capítulo Miracle Workers reescribe por
      completo las plegarias del Sacerdote Lobo (Frost's Bite D7, Heart of the Wolf D8,
      Hoarfrost Thews D8, Ice Storm D10, The Snow King's Decree D10, Wild Pack D8). No hay
      hechizos coincidentes; la lista de MW sustituye a la de Town Cryer solo para este perfil.
      En la promoción: conservar ambos saberes y dirigir las asignaciones de saber del Sacerdote
      Lobo de MW a esta variante.
  spells:
  - id: spell.prayers-of-ulric.frost-s-bite
    roll: '1'
    name: Frost's Bite
    name_i18n:
      es: Mordisco de Escarcha
    difficulty: 7
    effect: >-
      The snarling Wolf-Priest prays to Ulric to freeze the blood in the body of his enemy. An enemy
      model within 9" must pass a Toughness test or loses 1 Wound ignoring armour saves.
      Furthermore, the target is unable to take any actions during the opponents next turn. If the
      test is failed, the target may still make defensive actions such as Dodge, and defend itself
      in combat.
    effect_i18n:
      es: >-
        El rugiente Sacerdote Lobo reza a Ulric para congelar la sangre en el cuerpo de su enemigo.
        Una miniatura enemiga a 9" o menos debe superar una tirada de Resistencia o pierde 1 Herida,
        ignorando las tiradas de salvación por armadura. Además, el objetivo no puede realizar
        ninguna acción durante el siguiente turno del oponente. Si falla la tirada, el objetivo
        puede seguir realizando acciones defensivas como Esquiva y defenderse en combate.
  - id: spell.prayers-of-ulric.heart-of-the-wolf
    roll: '2'
    name: Heart of the Wolf
    name_i18n:
      es: Corazón del Lobo
    difficulty: 8
    effect: >-
      The Wolf-Priest's prayer is answered as an ear-shattering inhuman howl roars from his throat.
      For the duration of the battle, all members of the Priest's warband are immune to fear and All
      Alone tests as they feel the presence of their god. Additionally, the leader of the warband
      receives +1 Leadership on all Rout Tests.
    effect_i18n:
      es: >-
        La plegaria del Sacerdote Lobo es respondida mientras un aullido inhumano que ensordece
        resuena desde su garganta. Durante el resto de la batalla, todos los miembros de la banda
        del Sacerdote son inmunes a las tiradas de Miedo y de Todo Solo, ya que sienten la presencia
        de su dios. Además, el líder de la banda recibe +1 de Liderazgo en todas las tiradas de
        Desbandada.
  - id: spell.prayers-of-ulric.hoarfrost-thews
    roll: '3'
    name: Hoarfrost Thews
    name_i18n:
      es: Músculos de Escarcha
    difficulty: 8
    effect: >-
      An unnatural chill ripples through the musculature of the Priest as a frost forms upon the
      flesh across his entire body. A chilling cold aura surrounds him. The Priest is immune to
      exposure caused by freezing conditions for the remainder of the battle. This includes the ill
      effects of all types of cold weather and the Priest is immune to the effects of any magical
      attacks or spells which refer to the cold such as snow, frost, ice and hail. All models within
      2" of the Priest without a cloak or winter furs suffers -1 Leadership and -1 Initiative.
      However, Initiative cannot fall below 1. Undead models are immune to the chilling aura's
      effects.
    effect_i18n:
      es: >-
        Un escalofrío antinatural recorre la musculatura del Sacerdote mientras una escarcha se
        forma sobre la carne de todo su cuerpo. Un aura gélida lo rodea. El Sacerdote es inmune a la
        exposición causada por condiciones heladoras durante el resto de la batalla. Esto incluye
        los efectos nocivos de todo tipo de clima frío, y el Sacerdote es inmune a los efectos de
        cualquier ataque mágico o hechizo que se refiera al frío, como nieve, escarcha, hielo y
        granizo. Todas las miniaturas a 2" o menos del Sacerdote sin capa ni pieles de invierno
        sufren -1 de Liderazgo y -1 de Iniciativa. No obstante, la Iniciativa no puede quedar por
        debajo de 1. Las miniaturas No Muertas son inmunes a los efectos del aura gélida.
  - id: spell.prayers-of-ulric.ice-storm
    roll: '4'
    name: Ice Storm
    name_i18n:
      es: Tormenta de Hielo
    difficulty: 10
    effect: >-
      The Priest snarls an invocation that releases a fierce storm of lashing ice to cripple Ulric's
      enemies. An enemy model within 24" of the Priest is lashed by ice, receiving a Strength 5 hit.
      The target, along with any models (friend or foe) within 2" of the target, must take a
      Toughness test. Any model which fails the test is treated as being stunned.
    effect_i18n:
      es: >-
        El Sacerdote profiere una invocación que desata una feroz tormenta de hielo azotador para
        lisiar a los enemigos de Ulric. Una miniatura enemiga a 24" o menos del Sacerdote es azotada
        por el hielo, sufriendo un impacto de Fuerza 5. El objetivo, junto con cualquier miniatura
        (amiga o enemiga) a 2" o menos del objetivo, debe superar una tirada de Resistencia.
        Cualquier miniatura que falle la tirada se considera aturdida.
  - id: spell.prayers-of-ulric.the-snow-king-s-decree
    roll: '5'
    name: The Snow King's Decree
    name_i18n:
      es: El Decreto del Rey de las Nieves
    difficulty: 10
    effect: >-
      Scornful words are bellowed by the Wolf-Priest in tribute to Ulric's hatred for cowardice,
      weakness and dishonour. The decree of Ulric punishes the craven. Silvery, freezing fire erupts
      from one target within 6", and causes one Strength 8 hit. Any devout Ulrican warriors
      including brave Middenheimers are assumed to be immune to the spell. If the chosen target is a
      warrior then he may avoid the effects of the prayer by successfully passing a Leadership test.
      Armour offers no protection against the Snow King's decree.
    effect_i18n:
      es: >-
        Palabras desdeniosas son proclamadas por el Sacerdote Lobo en tributo al odio de Ulric por
        la cobardía, la debilidad y la deshonra. El decreto de Ulric castiga a los cobardes. Un
        fuego plateado y congelante irrumpe desde un objetivo a 6" o menos, y causa un impacto de
        Fuerza 8. Se asume que cualquier guerrero ulricano devoto, incluidos los valientes
        Middenheimers, es inmune al hechizo. Si el objetivo elegido es un guerrero, puede evitar los
        efectos de la plegaria superando con éxito una tirada de Liderazgo. La armadura no ofrece
        protección contra el decreto del Rey de las Nieves.
  - id: spell.prayers-of-ulric.wild-pack
    roll: '6'
    name: Wild Pack
    name_i18n:
      es: Manada Salvaje
    difficulty: 8
    effect: >-
      The Wolf-Priest howls angry prayers to Ulric, leading allies to bristle with menace. All of
      this unrestrained violence unsettles all except the steeliest of foes. All enemy models within
      12" suffer a -1 penalty to their Weapon Skill in the next close combat phase if they are
      attacking warriors from the Priest's warband. This prayer does not affect Undead.
    effect_i18n:
      es: >-
        El Sacerdote Lobo aúlla plegarias furiosas a Ulric, llevando a los aliados a erizarse de
        amenaza. Toda esta violencia desatada inquieta a todos salvo a los enemigos más templados.
        Todas las miniaturas enemigas a 12" o menos sufren una penalización de -1 a su Habilidad de
        Armas en la siguiente fase de combate cuerpo a cuerpo si atacan a guerreros de la banda del
        Sacerdote. Esta plegaria no afecta a los No Muertos.
  source_refs:
  - manual: liber-malefic
    url: https://www.scribd.com/document/241727651/Miracle-workers-in-Mordheim
    printed_page: 17
    section: Prayers of Prayers of Ulric (Miracle Workers)
- id: lore.prayers-of-verena-and-solkan
  name: Prayers of Verena & Solkan
  name_i18n:
    es: Plegarias de Verena y Solkan
  note: El Sacerdote de Verena elige al azar una plegaria de esta lista; los guías de promoción describen
    a los bélicos sacerdotes de Solkan, que usan la misma lista. The chapter notes the Warrior-Priests
    of Solkan chant from the same list; a Solkan-only variant is not printed.
  note_i18n:
    es: >-
      El Sacerdote de Verena elige al azar una plegaria de esta lista; los guías de promoción
      describen a los bélicos sacerdotes de Solkan, que usan la misma lista. El capítulo señala
      que los Sacerdotes Guerreros de Solkan cantan la misma lista; no se imprime una variante
      exclusiva de Solkan.
  spells:
  - id: spell.prayers-of-verena-and-solkan.preserve-the-balance
    roll: '1'
    name: Preserve the Balance
    name_i18n:
      es: Preservar el Equilibrio
    difficulty: 8
    effect: >-
      The Priest's prayers beg to mete out justice to all those who dare to defy a sanctified
      servant of justice. Until the following turn, any vicious act committed against the Priest is
      also inflicted upon the perpetrator of the offence. For example, if the Priest suffered a
      Strength 4 hit from an assailant then the same Strength hit would apply to the attacker, or if
      the Priest lost 1 Wound then the warrior who inflicted the wound would lose 1 Wound also. The
      same conditions apply in reverse when another model is being attacked by the Priest, aside
      from through the use of this prayer.
    effect_i18n:
      es: >-
        Las plegarias del Sacerdote imploran impartir justicia a todos aquellos que se atrevan a
        desafiar a un siervo santificado de la justicia. Hasta el siguiente turno, cualquier acto
        cruel cometido contra el Sacerdote se inflige también al perpetrador de la ofensa. Por
        ejemplo, si el Sacerdote sufrió un impacto de Fuerza 4 de un agresor, el mismo impacto de
        Fuerza se aplicaría al atacante, o si el Sacerdote perdió 1 Herida, el guerrero que la
        infligió también perdería 1 Herida. Las mismas condiciones se aplican a la inversa cuando
        otra miniatura es atacada por el Sacerdote, salvo mediante el uso de esta plegaria.
  - id: spell.prayers-of-verena-and-solkan.retribution
    roll: '2'
    name: Retribution
    name_i18n:
      es: Retribución
    difficulty: 9
    effect: >-
      The Priest delivers a recital to punish guilty scum using the total power of Law. An enemy
      warrior within 12" of the Priest must take a Leadership test with a +2 modifier. If the test
      is failed then during the next close combat phase the warrior loses half of his Attacks. In
      addition, the warrior's Movement is halved. Any fractions are rounded up.
    effect_i18n:
      es: >-
        El Sacerdote pronuncia un recital para castigar a la chusma culpable usando el poder total
        de la Ley. Un guerrero enemigo a 12" o menos del Sacerdote debe superar una tirada de
        Liderazgo con un modificador de +2. Si falla la tirada, durante la siguiente fase de combate
        cuerpo a cuerpo el guerrero pierde la mitad de sus Ataques. Además, el Movimiento del
        guerrero se reduce a la mitad. Las fracciones se redondean hacia arriba.
  - id: spell.prayers-of-verena-and-solkan.shackles-of-law
    roll: '3'
    name: Shackles of Law
    name_i18n:
      es: Grilletes de la Ley
    difficulty: 6
    effect: >-
      Invisible shackles immobilise a character with flagrant disregard for regulations as the
      Priest works magical power into the binding invocation. An enemy warrior within 6" of the
      Priest becomes immobile this turn unless he successfully passes a Leadership test. If the test
      is failed the warrior cannot move, attack or cast spells during the players next turn.
    effect_i18n:
      es: >-
        Grilletes invisibles inmovilizan a un personaje con un desprecio flagrante por las normas
        mientras el Sacerdote infunde poder mágico en la invocación de sujeción. Un guerrero enemigo
        a 6" o menos del Sacerdote queda inmóvil este turno a menos que supere con éxito una tirada
        de Liderazgo. Si falla la tirada, el guerrero no puede moverse, atacar ni lanzar hechizos
        durante el siguiente turno de los jugadores.
  - id: spell.prayers-of-verena-and-solkan.sword-of-justice
    roll: '4'
    name: Sword of Justice
    name_i18n:
      es: Espada de la Justicia
    difficulty: 8
    effect: >-
      The weapon of every Priest of Law is the sword. When all other options fail a prayer can
      empower the weapon turning it into a divine instrument of justice. The Priest receives +1
      Weapon Skill on attacks he makes in the next close combat phase. In addition, the Priest will
      cause a critical hit on a roll to wound of 5-6 instead of just 6.
    effect_i18n:
      es: >-
        El arma de todo Sacerdote de la Ley es la espada. Cuando todas las demás opciones fallan,
        una plegaria puede potenciar el arma convirtiéndola en un instrumento divino de la justicia.
        El Sacerdote recibe +1 de Habilidad de Armas en los ataques que realice en la siguiente fase
        de combate cuerpo a cuerpo. Además, el Sacerdote causará un golpe crítico con una tirada
        para herir de 5-6 en lugar de solo 6.
  - id: spell.prayers-of-verena-and-solkan.the-blind-maiden
    roll: '5'
    name: The Blind Maiden
    name_i18n:
      es: La Doncella Ciega
    difficulty: 9
    effect: >-
      Truth can be divined in a prayer that allows the Priest to find it when blinded. The Priest
      spots any hidden warriors within line of sight and ignores any penalty for effects like
      weather, darkness including any tunnel fighting in underground scenarios, or any blinding
      magical effects. In addition, the Priest ignores psychology tests for being All Alone. The
      effects of the prayer last until the players next shooting phase.
    effect_i18n:
      es: >-
        La verdad puede adivinarse en una plegaria que permite al Sacerdote hallarla incluso ciego.
        El Sacerdote avista a cualquier guerrero oculto dentro de su línea de visión e ignora
        cualquier penalización por efectos como el clima, la oscuridad —incluida cualquier lucha en
        túneles en escenarios subterráneos— o cualquier efecto mágico deslumbrante. Además, el
        Sacerdote ignora las tiradas de psicología por estar Todo Solo. Los efectos de la plegaria
        duran hasta la siguiente fase de disparo de los jugadores.
  - id: spell.prayers-of-verena-and-solkan.trial-by-fire
    roll: '6'
    name: Trial by Fire
    name_i18n:
      es: Juicio por el Fuego
    difficulty: 10
    effect: >-
      In an ultimate test of innocence a party found guilty by the Priest of grave injustice will be
      engulfed in divine flames. An enemy warrior within 6" of the Priest suffers a Strength 6 hit.
      The warrior is treated as being set on fire from the flaming attack.
    effect_i18n:
      es: >-
        En una prueba suprema de inocencia, el accused hallado culpable por el Sacerdote de una
        grave injusticia será envuelto en llamas divinas. Un guerrero enemigo a 6" o menos del
        Sacerdote sufre un impacto de Fuerza 6. El guerrero se considera incendiado por el ataque de
        fuego.
  source_refs:
  - manual: liber-malefic
    url: https://www.scribd.com/document/241727651/Miracle-workers-in-Mordheim
    printed_page: 18
    section: Prayers of Prayers of Verena & Solkan
- id: lore.prayers-of-taal-and-rhya
  name: Prayers of Taal & Rhya
  name_i18n:
    es: Plegarias de Taal y Rhya
  note: 'El Sacerdote Druida de Taal elige al azar una plegaria de esta lista. VARIANT of the KB lore.prayers-of-taal:
    the two publications print the same six spells at the same difficulties, but every effect is different
    printed prose (Tanglefoot names the ''Ostlander Jaegers and friendly Horned Hunter Zealots'' of the
    KB against the ''friendly Taalites'' here, Earthshudder adds the falling example and Bears Paw loses
    its apostrophe), so the chapter keeps its own list beside the Ostlander and Horned Hunter one instead
    of being mapped into it.'
  note_i18n:
    es: >-
      El Sacerdote Druida de Taal elige al azar una plegaria de esta lista. VARIANTE del saber
      lore.prayers-of-taal del KB: las dos publicaciones imprimen los mismos seis hechizos con
      las mismas dificultades, pero cada efecto es prosa impresa distinta (Tanglefoot nombra a
      los 'Jaegers de Ostland y los Zelotes Cazadores Cornudos aliados' del KB frente a los
      'Taalitas aliados' de aquí; Earthshudder añade el ejemplo de la caída y Bears Paw pierde
      su apóstrofo), así que el capítulo conserva su propia lista junto a la de los Ostlanders y
      los Cazadores Cornudos en lugar de asignarla a aquella.
  spells:
  - id: spell.prayers-of-taal-and-rhya.stag-s-leap
    roll: '1'
    name: Stag's Leap
    name_i18n:
      es: Salto del Ciervo
    difficulty: 7
    effect: >-
      Many of Taal's priests wear a stag skull as a symbol of their devotion and the Forest Lord's
      power can be used to emulate the speed and beauty of this magnificent beast. The Priest of
      Taal may immediately move anywhere within 9", including into base-contact with the enemy, in
      which case he counts as charging and gains a +1 Strength to his first round of attacks. If he
      engages a fleeing enemy, in the close combat phase he will score one automatic hit at +1
      Strength and then his opponent will flee again.
    effect_i18n:
      es: >-
        Muchos de los sacerdotes de Taal llevan un cráneo de ciervo como símbolo de su devoción y el
        poder del Señor del Bosque puede usarse para emular la velocidad y belleza de esta magnífica
        bestia. El Sacerdote de Taal puede moverse inmediatamente a cualquier punto a 9" o menos,
        incluido el contacto base con el enemigo, en cuyo caso cuenta como carga y gana +1 de Fuerza
        en su primera ronda de ataques. Si alcanza a un enemigo en huida, en la fase de combate
        cuerpo a cuerpo conseguirá un impacto automático con +1 de Fuerza y después su oponente
        volverá a huir.
  - id: spell.prayers-of-taal-and-rhya.blessed-ale
    roll: '2'
    name: Blessed Ale
    name_i18n:
      es: Cerveza Bendecida
    difficulty: 5
    effect: >-
      Like his brother Ulric, Taal has a great appetite for the strong ales of the Northern Empire.
      During the summer equinox each Priest opens one keg of ale (at least!) in Taal's honour.
      Drinking a flask of Taal-blessed ale (the priest is assumed to carry as many flasks as are
      needed) may heal any one model within 2" of the Priest (including himself). The warrior is
      restored to his full quota of Wounds. In addition, any living enemy models (not Undead or
      Possessed) within 2" of the Priest will lose 1 Attack during the next round of combat due to
      the potent fumes of the ale.
    effect_i18n:
      es: >-
        Como su hermano Ulric, Taal tiene un gran apetito por las cervezas fuertes del Imperio del
        Norte. Durante el solsticio de verano cada Sacerdote abre un barril de cerveza (¡al menos!)
        en honor de Taal. Beber un frasco de cerveza bendecida por Taal (se asume que el sacerdote
        lleva tantos frascos como hagan falta) puede sanar a una miniatura cualquiera a 2" o menos
        del Sacerdote (incluido él mismo). El guerrero recupera toda su cuota de Heridas. Además,
        cualquier miniatura enemiga viva (no No Muerta ni Poseída) a 2" o menos del Sacerdote
        perderá 1 Ataque durante la siguiente ronda de combate debido a los potentes vapores de la
        cerveza.
  - id: spell.prayers-of-taal-and-rhya.bears-paw
    roll: '3'
    name: Bears Paw
    name_i18n:
      es: Pata de Oso
    difficulty: 7
    effect: >-
      Many an armoured knight has been knocked to the ground by the surprising Strength of the
      followers of Taal. Although traditionally called 'Bears Paw' this spell is sometimes referred
      to as 'Moose Breath' by those who have felt its power. The Priest invokes the blessing of Taal
      on himself or a single friendly model within 6". The target receives a bonus of +2 to his
      Strength until the Priest's next turn.
    effect_i18n:
      es: >-
        A más de un caballero armado lo han derribado al suelo la sorprendente Fuerza de los
        seguidores de Taal. Aunque tradicionalmente se llama 'Pata de Oso', este hechizo a veces es
        llamado 'Aliento de Alce' por quienes han sentido su poder. El Sacerdote invoca la bendición
        de Taal sobre sí mismo o sobre una única miniatura amiga a 6" o menos. El objetivo recibe un
        bonus de +2 a su Fuerza hasta el siguiente turno del Sacerdote.
  - id: spell.prayers-of-taal-and-rhya.earthshudder
    roll: '4'
    name: Earthshudder
    name_i18n:
      es: Sacudida Telúrica
    difficulty: 9
    effect: >-
      Taal's domain includes both the earth and the skies and his power can reach out even into the
      dark streets of Mordheim. When his name is invoked three times and the blood of an eagle is
      poured on the ground, the Lord of the Wild will cause thunder to rumble and the earth to
      shake. The spell is cast on a single building within 4". Any enemy models touching the
      building will suffer a single Strength 3 hit. In addition the building will collapse and any
      models on it will count as having fallen to the ground (for example a model falling 5" to the
      tabletop must pass two Initiative tests to avoid taking D3 Strength 5 hits.) Remove the
      terrain feature from the board for the rest of the game.
    effect_i18n:
      es: >-
        El dominio de Taal incluye tanto la tierra como los cielos y su poder puede alcanzar incluso
        las calles oscuras de Mordheim. Cuando su nombre se invoca tres veces y la sangre de un
        águila se derrama en el suelo, el Señor de lo Salvaje hará retumbar el trueno y temblar la
        tierra. El hechizo se lanza sobre un único edificio a 4" o menos. Las miniaturas enemigas
        que toquen el edificio sufrirán un único impacto de Fuerza 3. Además, el edificio se
        derrumbará y cualquier miniatura sobre él contará como caída al suelo (por ejemplo, una
        miniatura que caiga 5" hasta la superficie de juego debe superar dos tiradas de Iniciativa
        para evitar sufrir D3 impactos de Fuerza 5). Retira la escenografía del tablero por el resto
        de la partida.
  - id: spell.prayers-of-taal-and-rhya.tanglefoot
    roll: '5'
    name: Tanglefoot
    name_i18n:
      es: Pies Atados
    difficulty: 8
    effect: >-
      It is said that when Taal walked the earth, living things would spring up behind him as he
      passed. A portion of his power can be summoned by his followers to help regrow forests and aid
      in the return of the land to its natural state. Plants, vines and even small trees burst forth
      from the earth, hindering all those who attempt to move through them. All models (friend as
      well as foe) with the exception of friendly Taalites within 12" of the Priest can only move at
      half their Movement until the next shooting phase.
    effect_i18n:
      es: >-
        Se dice que cuando Taal caminaba por la tierra, los seres vivos brotaban a su paso. Una
        parte de su poder puede ser invocada por sus seguidores para ayudar a reforestar y
        contribuir a que la tierra vuelva a su estado natural. Plantas, enredaderas e incluso
        pequeños árboles brotan de la tierra, dificultando el avance de todos los que intenten
        atravesarlos. Todas las miniaturas (amigas y enemigas), con la excepción de los taalitas
        amigas, a 12" o menos del Sacerdote solo pueden moverse a la mitad de su Movimiento hasta la
        siguiente fase de disparo.
  - id: spell.prayers-of-taal-and-rhya.summon-squirrels
    roll: '6'
    name: Summon Squirrels
    name_i18n:
      es: Invocar Ardillas
    difficulty: 7
    effect: >-
      Taal is the master of all beasts both great and small. Those who anger him may be mauled by a
      mountain lion or drowned in a flood caused by an angry beaver. With this spell the Priest
      invokes the wrath of the Lord of Beasts, summoning forth dozens upon dozens of enraged
      squirrels. The furious rodents will assault one enemy within 12" of the Priest, crawling
      inside the warrior's clothing and armour, pelting him with nuts and causing numerous tiny
      bites and welts. The target suffers 2D6 Strength 1 hits. No armour saves allowed.
    effect_i18n:
      es: >-
        Taal es el señor de todas las bestias, grandes y pequeñas. Quienes le enfurecen pueden ser
        despedazados por un puma o ahogados en una inundación causada por un castor furioso. Con
        este hechizo el Sacerdote invoca la ira del Señor de las Bestias, convocado decenas y
        decenas de ardillas enfurecidas. Los furiosos roedores asaltan a un enemigo a 12" o menos
        del Sacerdote, arrastrándose dentro de la ropa y la armadura del guerrero, apedreándolo con
        nueces y causando numerosos mordiscos diminutos y ronchas. El objetivo sufre 2D6 impactos de
        Fuerza 1. Sin tiradas de salvación por armadura permitidas.
