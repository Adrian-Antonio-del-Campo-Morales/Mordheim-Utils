eligibility_semantics:
  simple_lists:
    allow: If both allow lists are empty, there is no positive static band filter. Otherwise the band must match at least one allow_group or allow_band_id.
    forbid: A match in any forbid_group or forbid_band_id rejects the hire.
    precedence: forbid
  expression:
    purpose: Complete static eligibility predicate for cases that require boolean composition.
    leaf_fields:
    - group_id
    - band_id
    operators:
    - all_of
    - any_of
    - not
    mutual_exclusion: When expression is present, allow/forbid lists are not used for that entry.
