schema_version: 1
ruleset: mordheim
catalog: campaign-trading-and-rarity
status: draft
# Define el procedimiento de compra. Tiradas de rareza, objetos comprados y
# contenido del alijo son datos de una campaña individual, fuera de la KB.
rarity:
  tests: []
  market_catalog: trading-post.yaml
equipment_allocation:
  rules: []
examples:
  tests:
  - id: example.rarity-test
    actor: hero
    roll: 2D6
    target_rarity: 8
    outcome: available_when_roll_gte_target
    source_refs: []
  equipment_allocation:
    rules:
    - id: example.equipment-stash-transfer
      from: warband_stash
      to: eligible_warrior
      condition: warrior_can_use_item
      source_refs: []
# tests: id, actor, roll, target_rarity, outcome, source_refs. Rarity, base
# price and availability are resolved through trading-post.yaml by item_id.
# equipment rules definen alijo, elegibilidad y objetos no transferibles.
# La rareza, precio y tipo de cada item pertenecen a catalog/items. Este
# documento solo indica cómo se resuelve la prueba y cómo se mueve equipo.
effect_ids:
- campaign.trading.rarity-test
- campaign.trading.modify-rarity-test
- campaign.trading.buy-rare-item
- campaign.equipment.reallocate
