- scenario_id: scenario.raids
  rewards:
  - id: scenario.raids.income
    kind: resource
    resource: gold_crowns
    rule: 'After the raid the Jewelleries are sold: multiply the total number of Jewelleries by five to
      get the gold crowns paid. Warriors may also capture slaves: three Inhabitants or one Townsman put
      out of action count as one Slave, recorded on the roster and usable in a later post-battle phase
      to add one die to the warband dice pool (then crossed off). After the raid roll D6 minus 1 per Slave
      captured plus 1 per building set on fire; on 1 or less the warband was traced and ambushed: randomly
      roll D6 Henchmen and roll on the Injury table for each.'
    rule_i18n:
      es: 'Tras la incursión se venden las Joyerías: multiplica el número total de Joyerías por cinco
        para obtener las coronas de oro pagadas. Los guerreros también pueden capturar esclavos: tres
        Habitantes o un Paisano puestos fuera de combate cuentan como un Esclavo, anotado en la plantilla
        y utilizable en una fase de posbatalla posterior para añadir un dado a la pool de dados de la
        banda (y tacharlo después). Tras la incursión tira 1D6 menos 1 por Esclavo capturado más 1 por
        edificio incendiado; con 1 o menos, la banda fue rastreada y emboscada: tira 1D6 Secuaces al azar
        y tira en la tabla de Heridas por cada uno.'
    quantity_input: true
  - id: scenario.raids.loot
    kind: loot_table
    rule: The raiders search the settlement buildings (one Hero or two Henchmen must enter and spend the
      next turn searching an empty building). Roll on the Search table, applying the modifier from the
      Townsfolk table; a roll of 1 always fails. Jewelleries are later sold at 5 gc each.
    rule_i18n:
      es: Los asaltantes registran los edificios del asentamiento (un Héroe o dos Secuaces deben entrar
        y gastar la siguiente vuelta registrando un edificio vacío). Tira en la tabla de Búsqueda aplicando
        el modificador de la tabla de Paisanos; con un resultado de 1 siempre falla. Las Joyerías se venden
        después a 5 co cada una.
