- scenario_id: scenario.the-pool
  rewards:
  - id: scenario.the-pool.wyrdstone
    kind: resource
    resource: wyrdstone_fragments
    rule: The pool contains D3+3 pieces of wyrdstone; a Hero spending a whole turn within 1" of the pool doing nothing
      else finds one piece on a D6 roll of 1-2 at the end of his turn (no Hero may search within 1" of another model).
      Only as many pieces may be found as were rolled at the start of the game.
    quantity_input: true
- scenario_id: scenario.ambush
  rewards:
  - id: scenario.ambush.wyrdstone
    kind: resource
    resource: wyrdstone_fragments
    rule: Each Hero of the defending warband carries D3 pieces of wyrdstone; if a Hero carrying wyrdstone is taken
      out of action, place counters equal to the amount he was carrying where he fell, and any Hero may pick them
      up. The warband that gets the most wyrdstone shards off the table (or held by one of its Heroes when the game
      ends) is the winner.
    quantity_input: true
