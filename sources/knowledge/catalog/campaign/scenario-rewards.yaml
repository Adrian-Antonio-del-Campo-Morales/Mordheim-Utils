- scenario_id: scenario.brigands-in-the-pasturelands
  rewards:
  - id: scenario.brigands-in-the-pasturelands.income
    kind: resource
    resource: gold_crowns
    rule: If the attackers win they gain D6 gold crowns for each Henchman they put out of action and D6
      x 5 gold crowns for each Hero put out of action; in a campaign, if a Hero rolls a Captured result
      on the Serious Injuries chart the Baron pays an additional D6 x 10 gold crowns for that Hero.
    rule_i18n:
      es: Si los atacantes ganan, obtienen 1D6 coronas de oro por cada Secuaz que pongan fuera de combate
        y 1D6×5 coronas de oro por cada Héroe puesto fuera de combate; en campaña, si un Héroe saca un
        resultado de Capturado en la tabla de Heridas Graves, el Barón paga 1D6×10 coronas de oro adicionales
        por ese Héroe.
    quantity_input: true
- scenario_id: scenario.wolf-hunt
  rewards:
  - id: scenario.wolf-hunt.income
    kind: resource
    resource: gold_crowns
    rule: The baron rewards any warband a bounty of 10 gold crowns for each slain wolf (there is no reward
      for slaying a bear).
    rule_i18n:
      es: El barón recompensa a cualquier banda con una recompensa de 10 coronas de oro por cada lobo
        abatido (no hay recompensa por matar un oso).
    quantity_input: true
- scenario_id: scenario.protect-hornsbys-ferry
  rewards:
  - id: scenario.protect-hornsbys-ferry.income
    kind: resource
    resource: gold_crowns
    rule: In addition to normal exploration money, if the attackers win the scenario they receive 3D6
      gc each (rolled separately per warband). Any attacking warband that has a warrior taking part in
      roughing up the Hornsbys receives 2D6 gc whether they win or not. If the defenders win and the Hornsbys
      have NOT been roughed up, the defenders receive 5D6 gc from the Hornsbys (subtract 2D6 gc if the
      win came from the turn limit, representing the patrol's fees). If the defenders win but the Hornsbys
      were roughed up they receive no pay.
    rule_i18n:
      es: Además del dinero de exploración normal, si los atacantes ganan el escenario reciben 3D6 co
        cada uno (tiran por separado por banda). Cualquier banda atacante que tenga un guerrero participando
        en aporrear a los Hornsby recibe 2D6 co, gane o pierda. Si los defensores ganan y los Hornsby
        NO han sido aporreados, los defensores reciben 5D6 co de los Hornsby (resta 2D6 co si la victoria
        vino del límite de vueltas, en concepto de los honorarios de la patrulla). Si los defensores ganan
        pero los Hornsby fueron aporreados, no reciben pago alguno.
    quantity_input: true
- scenario_id: scenario.stop-thief
  rewards:
  - id: scenario.stop-thief.income
    kind: resource
    resource: gold_crowns
    rule: If the defending warband wins, the Thief hocks the stolen items (half value, as usual for selling
      equipment) and gives the proceeds to his warband. If the attackers win they get all their items
      back and additionally find 2D6 gc worth of valuables the Thief stole from other victims.
    rule_i18n:
      es: Si gana la banda defensora, el Ladrón empeña los objetos robados (la mitad de su valor, como
        es habitual al vender equipo) y entrega lo recaudado a su banda. Si ganan los atacantes, recuperan
        todos sus objetos y además encuentran 2D6 co en objetos valiosos que el Ladrón robó a otras víctimas.
    quantity_input: true
- scenario_id: scenario.hunt-the-heretic
  rewards:
  - id: scenario.hunt-the-heretic.income
    kind: resource
    resource: gold_crowns
    rule: If the Witch Hunter's warband wins they gain D6 x 15 gold crowns as payment and D3 vials of
      Blessed Water. If the Warlock's warband wins he concocts D3 doses of any poison or drug of their
      choice.
    rule_i18n:
      es: Si gana la banda del Cazador de Brujas, gana 1D6×15 coronas de oro como pago y 1D3 viales de
        Agua Bendita. Si gana la banda del Brujo, este prepara 1D3 dosis de cualquier veneno o droga a
        su elección.
    quantity_input: true
- scenario_id: scenario.river-watch
  rewards:
  - id: scenario.river-watch.income
    kind: resource
    resource: gold_crowns
    rule: If the defender wins they are paid D6 x 20 gold crowns plus 5 gold crowns extra for each enemy
      they take out of action.
    rule_i18n:
      es: Si gana el defensor, se le paga 1D6×20 coronas de oro más 5 coronas de oro extra por cada enemigo
        que ponga fuera de combate.
    quantity_input: true
- scenario_id: scenario.night-of-the-dead
