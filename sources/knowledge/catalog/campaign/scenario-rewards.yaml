  rewards:
  - id: scenario.ambush-surrounded.wyrdstone
    kind: resource
    resource: wyrdstone_fragments
    rule: The defender starts the battle carrying D6 pieces of wyrdstone, but never more than the number of Heroes
      in the warband. The defending warband gains all the wyrdstone it was carrying at the beginning, minus the
      number of its own Heroes taken Out of Action during the game, down to a minimum of zero. The attacking warband
      gains one shard for each enemy Hero it takes Out of Action, up to the number of shards the opposing warband
      was carrying at the start.
    quantity_input: true
