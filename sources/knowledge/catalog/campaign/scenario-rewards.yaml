    kind: resource
    resource: gold_crowns
    rule: If the prince escapes he rewards his protectors with 4D6 gold crowns from his purse; if he is
      killed the winning warband finds 2D6 gold crowns plus jewellery equivalent to two pieces of treasure
      on his body.
    rule_i18n:
      es: Si el príncipe escapa recompensa a sus protectores con 4D6 coronas de oro de su bolsa; si muere,
