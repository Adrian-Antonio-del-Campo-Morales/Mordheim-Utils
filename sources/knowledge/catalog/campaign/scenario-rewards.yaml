    rule: Warriors earn one shard of wyrdstone for each counter still in their possession at the end of the battle
      (the stash holds 1D3 counters).
    quantity_input: true
- scenario_id: scenario.mule-train
  rewards:
  - id: scenario.mule-train.income
    kind: resource
    resource: gold_crowns
    rule: If the attackers recover one or more mules they may keep or sell them, and the goods on the mules are
      determined as if the warband found a Slaughtered Warband in the exploration phase, adding +1 to the dice roll
      for every mule recovered over the first. The defenders gain 2D6 gc for each mule they lead off the table.
      Both warbands may explore as normal at the end of the scenario.
    quantity_input: true
