- scenario_id: scenario.brigands-in-the-pasturelands
  rewards:
  - id: scenario.brigands-in-the-pasturelands.income
    kind: resource
    resource: gold_crowns
    rule: If the attackers win they gain D6 gold crowns for each Henchman they put out of action and D6 x 5 gold
      crowns for each Hero put out of action; in a campaign, if a Hero rolls a Captured result on the Serious Injuries
      chart the Baron pays an additional D6 x 10 gold crowns for that Hero.
    quantity_input: true
- scenario_id: scenario.wolf-hunt
  rewards:
  - id: scenario.wolf-hunt.income
    kind: resource
    resource: gold_crowns
    rule: The baron rewards any warband a bounty of 10 gold crowns for each slain wolf (there is no reward for slaying
      a bear).
    quantity_input: true
- scenario_id: scenario.protect-hornsbys-ferry
  rewards:
  - id: scenario.protect-hornsbys-ferry.income
    kind: resource
    resource: gold_crowns
    rule: In addition to normal exploration money, if the attackers win the scenario they receive 3D6 gc each (rolled
      separately per warband). Any attacking warband that has a warrior taking part in roughing up the Hornsbys
      receives 2D6 gc whether they win or not. If the defenders win and the Hornsbys have NOT been roughed up, the
      defenders receive 5D6 gc from the Hornsbys (subtract 2D6 gc if the win came from the turn limit, representing
      the patrol's fees). If the defenders win but the Hornsbys were roughed up they receive no pay.
    quantity_input: true
- scenario_id: scenario.stop-thief
  rewards:
  - id: scenario.stop-thief.income
    kind: resource
    resource: gold_crowns
    rule: If the defending warband wins, the Thief hocks the stolen items (half value, as usual for selling equipment)
      and gives the proceeds to his warband. If the attackers win they get all their items back and additionally
      find 2D6 gc worth of valuables the Thief stole from other victims.
    quantity_input: true
- scenario_id: scenario.hunt-the-heretic
  rewards:
  - id: scenario.hunt-the-heretic.income
    kind: resource
    resource: gold_crowns
    rule: If the Witch Hunter's warband wins they gain D6 x 15 gold crowns as payment and D3 vials of Blessed Water.
      If the Warlock's warband wins he concocts D3 doses of any poison or drug of their choice.
    quantity_input: true
- scenario_id: scenario.river-watch
  rewards:
  - id: scenario.river-watch.income
    kind: resource
    resource: gold_crowns
    rule: If the defender wins they are paid D6 x 20 gold crowns plus 5 gold crowns extra for each enemy they take
      out of action.
    quantity_input: true
- scenario_id: scenario.night-of-the-dead
  rewards:
  - id: scenario.night-of-the-dead.wyrdstone
    kind: resource
    resource: wyrdstone_fragments
    rule: A pile of wyrdstone sits in an 8" circle in the centre of the board; the pile is brought to safety as
      D6+2 wyrdstone. Each time a model takes wyrdstone from the pile, D3+1 Zombies per warband are generated 8"
      away around the pile.
    quantity_input: true
