- scenario_id: scenario.the-pool
  rewards:
  - id: scenario.the-pool.wyrdstone
    kind: resource
    resource: wyrdstone_fragments
    rule: The pool contains D3+3 pieces of wyrdstone; a Hero spending a whole turn within 1" of the pool
      doing nothing else finds one piece on a D6 roll of 1-2 at the end of his turn (no Hero may search
      within 1" of another model). Only as many pieces may be found as were rolled at the start of the
      game.
    rule_i18n:
      es: El estanque contiene 1D3+3 fragmentos de piedra bruja; un Héroe que pase una vuelta completa
        a 1" del estanque sin hacer nada más encuentra un fragmento con un resultado de 1-2 en 1D6 al
        final de su turno (ningún Héroe puede buscar a menos de 1" de otra miniatura). Solo puede encontrarse
        la cantidad de fragmentos obtenida en la tirada inicial de la partida.
    quantity_input: true
- scenario_id: scenario.ambush
  rewards:
  - id: scenario.ambush.wyrdstone
    kind: resource
    resource: wyrdstone_fragments
    rule: Each Hero of the defending warband carries D3 pieces of wyrdstone; if a Hero carrying wyrdstone
      is taken out of action, place counters equal to the amount he was carrying where he fell, and any
      Hero may pick them up. The warband that gets the most wyrdstone shards off the table (or held by
      one of its Heroes when the game ends) is the winner.
    rule_i18n:
      es: Cada Héroe de la banda defensora lleva 1D3 fragmentos de piedra bruja; si un Héroe que lleva
        piedra bruja es puesto fuera de combate, coloca contadores igual a la cantidad que llevaba donde
        cayó, y cualquier Héroe puede recogerlos. La banda que saque más fragmentos de piedra bruja de
        la mesa (o que los sostenga con uno de sus Héroes cuando termine la partida) es la ganadora.
    quantity_input: true
