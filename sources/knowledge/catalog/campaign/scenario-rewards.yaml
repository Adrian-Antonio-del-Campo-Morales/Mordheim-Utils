    kind: loot_table
    rule: Whoever recovers the chest rolls on the contents chart after the game; each item is rolled for
      separately, apart from the gold crowns which are always found.
    rule_i18n:
      es: Quien recupere el cofre tira en la tabla de contenidos después de la partida; cada objeto se
        tira por separado, salvo las coronas de oro, que siempre se encuentran.
    contents:
    - id: scenario.hidden-treasure.loot.1.1
      label: 3D6 gold crowns
      label_i18n:
        es: 3D6 coronas de oro
      roll: automatic
      grant:
        kind: resource
        resource: gold_crowns
        quantity_input: true
