    kind: resource
    resource: gold_crowns
    rule: If the winning warband captures the Cold Ones alive they can either mount a unit on them or sell them
      for 80 gc; if one or both Cold Ones are dead they can be sold for 40 gc each. The artefacts taken from the
      Beastmaster are the equivalent of a Wyrdstone shard each and can also be sold.
    quantity_input: true
