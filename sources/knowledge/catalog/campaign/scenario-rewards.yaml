- scenario_id: scenario.kidnapped
  rewards:
  - id: scenario.kidnapped.income
    kind: resource
    resource: gold_crowns
    rule: If the sacrificial victim escapes, the rescuing warband gains a reward of 50 gold crowns added directly
      to its treasury.
    quantity_input: true
- scenario_id: scenario.forbidden-square
  rewards:
  - id: scenario.forbidden-square.wyrdstone
    kind: resource
    resource: wyrdstone_fragments
    rule: D6+2 Wyrdstone counters are placed before deployment. Warriors pick them up by moving into contact; when
      a warrior is knocked down, stunned or taken Out of Action he drops all counters he is carrying. Each side
      carries its counters off through the gate (or offers them to the totem for the Possessed). When all counters
      have been carried away or absorbed the game ends and the player with the most stones wins.
    quantity_input: true
- scenario_id: scenario.stake-out
  rewards:
  - id: scenario.stake-out.wyrdstone
    kind: resource
    resource: wyrdstone_fragments
    rule: The loser earns D6 shards of wyrdstone and the winner D6+1 shards.
    quantity_input: true
- scenario_id: scenario.the-caravan
  rewards:
  - id: scenario.the-caravan.income
    kind: resource
    resource: gold_crowns
    rule: The defender receives 5D6 gold crowns as a starting payment plus 5D6 gold crowns for each wagon that escapes,
      with an additional bonus of 5D6 gold crowns if all three wagons escape. The attacker receives 3D6 gold crowns
      for each wagon he loots. A traitorous defender who attacks the caravan he was hired to protect receives 3D6
      gold crowns per looted wagon instead.
    quantity_input: true
