- scenario_id: scenario.rawhide
  rewards:
  - id: scenario.rawhide.income
    kind: resource
    resource: gold_crowns
    rule: Before the game the Marienburger player chooses one wagon to carry his wyrdstone and remaining gold (gaining
      vast profits if it gets through, losing it all if it does not), or leaves all wagons empty for no bonus. If
      the ambushers stop the wyrdstone from leaving the table they gain whatever amount was placed in the wagon.
      If the Marienburgers get the wyrdstone off the table they gain 30% of the amount placed in the wagon (e.g.
      100 gc of wyrdstone becomes 130 gc).
    quantity_input: true
