  - id: scenario.night-of-the-dead.wyrdstone
    kind: resource
    resource: wyrdstone_fragments
    rule: A pile of wyrdstone sits in an 8" circle in the centre of the board; the pile is brought to
      safety as D6+2 wyrdstone. Each time a model takes wyrdstone from the pile, D3+1 Zombies per warband
      are generated 8" away around the pile.
    rule_i18n:
      es: Un montón de piedra bruja se sitúa en un círculo de 8" en el centro del tablero; el montón se
        lleva a salvo como 1D6+2 de piedra bruja. Cada vez que una miniatura toma piedra bruja del montón,
        se generan 1D3+1 Zombis por banda a 8" alrededor del montón.
    quantity_input: true
