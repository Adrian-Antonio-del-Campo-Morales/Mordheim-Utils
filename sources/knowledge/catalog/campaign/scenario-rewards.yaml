- scenario_id: scenario.raids
  rewards:
  - id: scenario.raids.income
    kind: resource
    resource: gold_crowns
    rule: 'After the raid the Jewelleries are sold: multiply the total number of Jewelleries by five to get the
      gold crowns paid. Warriors may also capture slaves: three Inhabitants or one Townsman put out of action count
      as one Slave, recorded on the roster and usable in a later post-battle phase to add one die to the warband
      dice pool (then crossed off). After the raid roll D6 minus 1 per Slave captured plus 1 per building set on
      fire; on 1 or less the warband was traced and ambushed: randomly roll D6 Henchmen and roll on the Injury table
      for each.'
    quantity_input: true
