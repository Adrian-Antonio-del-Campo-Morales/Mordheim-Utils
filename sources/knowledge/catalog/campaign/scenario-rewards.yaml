  rewards:
  - id: scenario.the-recipe.income
    kind: resource
    resource: gold_crowns
    rule: 'The winning warband is considered to have captured Geefer: turning him in is worth 5D6 gc (if two or
      more warbands share the win they must decide which one turns him in). Pies that have not been ruined may also
      be turned in: worth 1 gc each for a non-winning warband, or half that amount rounded up for the winning warband.
      A winning warband also gets any pies held by its warriors or still in the cart at the end of the game.'
    quantity_input: true
