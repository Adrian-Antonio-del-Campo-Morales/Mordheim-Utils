      it and, in a campaign, attempt to summon the Headless One at the start of any subsequent game.
    rule_i18n:
      es: Una banda que capture el Cráneo del Descabezado (alejándolo de la mesa) puede quedárselo y,
        en campaña, intentar invocar al Descabezado al comienzo de cualquier partida posterior.
    contents:
