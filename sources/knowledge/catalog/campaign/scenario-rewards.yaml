- scenario_id: scenario.mule-train
  rewards:
  - id: scenario.mule-train.income
    kind: resource
    resource: gold_crowns
    rule: If the attackers recover one or more mules they may keep or sell them, and the goods on the
      mules are determined as if the warband found a Slaughtered Warband in the exploration phase, adding
      +1 to the dice roll for every mule recovered over the first. The defenders gain 2D6 gc for each
      mule they lead off the table. Both warbands may explore as normal at the end of the scenario.
    rule_i18n:
      es: Si los atacantes recuperan una o más mulas pueden quedárselas o venderlas, y los bienes de las
        mulas se determinan como si la banda hubiera encontrado una Banda Degollada en la fase de exploración,
        sumando +1 a la tirada de dados por cada mula recuperada además de la primera. Los defensores
        ganan 2D6 co por cada mula que saquen de la mesa. Ambas bandas pueden explorar con normalidad
        al final del escenario.
    quantity_input: true
