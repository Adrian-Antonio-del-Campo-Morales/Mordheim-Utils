    kind: resource
    resource: gold_crowns
    rule: Before the game the Marienburger player chooses one wagon to carry his wyrdstone and remaining
      gold (gaining vast profits if it gets through, losing it all if it does not), or leaves all wagons
      empty for no bonus. If the ambushers stop the wyrdstone from leaving the table they gain whatever
      amount was placed in the wagon. If the Marienburgers get the wyrdstone off the table they gain 30%
      of the amount placed in the wagon (e.g. 100 gc of wyrdstone becomes 130 gc).
    rule_i18n:
      es: Antes de la partida, el jugador marienburgués elige un carro para transportar su piedra bruja
        y el oro restante (obteniendo grandes beneficios si llega a destino, perdiéndolo todo si no),
        o deja todos los carros vacíos sin bonificación alguna. Si los emboscadores impiden que la piedra
        bruja salga de la mesa, ganan la cantidad que se colocara en el carro. Si los marienburgueses
        sacan la piedra bruja de la mesa, ganan el 30% de la cantidad colocada en el carro (p. ej., 100
        co de piedra bruja se convierten en 130 co).
    quantity_input: true
- scenario_id: scenario.the-caravan-archive-pestilens
  rewards:
  - id: scenario.the-caravan-archive-pestilens.wyrdstone
    kind: resource
    resource: wyrdstone_fragments
    rule: The merchant carries a small chest with D3+1 shards of wyrdstone. If a warband ends the game
      in possession of the cargo it keeps all of the wyrdstone. If the merchant successfully keeps the
      cargo, the guarding warband receives 1 shard plus D6 x 5 gold crowns for their trouble.
    rule_i18n:
      es: El mercader lleva un pequeño cofre con 1D3+1 fragmentos de piedra bruja. Si una banda termina
        la partida en posesión del cargamento, se queda con toda la piedra bruja. Si el mercader logra
        conservar el cargamento, la banda guardiana recibe 1 fragmento más 1D6×5 coronas de oro por sus
        servicios.
    quantity_input: true
- scenario_id: scenario.the-wizards-tower
  rewards:
  - id: scenario.the-wizards-tower.loot
    kind: loot_table
    rule: 'The Heroes carry chests out of the Wizard''s Tower (a D6 per appearing Hero: on a 6 he brings
      a chest; if no Hero brings one, a random Hero is given one, so there is always at least one chest).
      In the post-battle sequence, roll D6 for each chest removed from the table. After this battle no
      Exploration rolls are made: no one dares search the cursed ruins of the tower.'
    rule_i18n:
      es: 'Los Héroes sacan cofres de la Torre del Mago (un 1D6 por cada Héroe presente: con un 6 trae
        un cofre; si ningún Héroe trae uno, se entrega uno a un Héroe al azar, de modo que siempre hay
        al menos un cofre). En la secuencia de posbatalla, tira 1D6 por cada cofre retirado de la mesa.
        Después de esta batalla no se hacen tiradas de Exploración: nadie se atreve a registrar las ruinas
        malditas de la torre.'
    contents:
    - id: scenario.the-wizards-tower.loot.1.1
      label: 'Illusions: the treasures were simple illusions and vanish before the warband returns to
        camp.'
      label_i18n:
        es: 'Ilusiones: los tesoros eran simples ilusiones y desaparecen antes de que la banda vuelva
          al campamento.'
      roll: D6
      grant:
        kind: special
        special_id: illusions-the-treasures-were-simple-illusions-and-vanish-bef
        quantity_input: true
      availability:
        dice:
          count: 1
          sides: 6
          multiplier: 1
          modifier: 0
      when:
        min: 1
        max: 2
    - id: scenario.the-wizards-tower.loot.2.1
      label: 'Valuables: roll 3D6, the result being the gc the items are traded for.'
      label_i18n:
        es: 'Objetos valiosos: tira 3D6; el resultado son las co por las que se venden los objetos.'
      roll: D6
      grant:
        kind: resource
        resource: gold_crowns
        quantity_input: true
      quantity_dice:
        count: 3
        sides: 6
        multiplier: 1
        modifier: 0
      availability:
        dice:
          count: 1
          sides: 6
          multiplier: 1
          modifier: 0
      when:
        min: 3
        max: 5
    - id: scenario.the-wizards-tower.loot.3.1
      label: 'Gold, Gold, GOLD: roll 6D6 and add the result to the Treasury.'
      label_i18n:
        es: 'Oro, Oro, ORO: tira 6D6 y suma el resultado a la Tesorería.'
      roll: D6
      grant:
        kind: resource
        resource: gold_crowns
        quantity_input: true
      quantity_dice:
        count: 6
        sides: 6
        multiplier: 1
        modifier: 0
      availability:
        dice:
          count: 1
          sides: 6
          multiplier: 1
          modifier: 0
      when:
        min: 6
        max: 6
    manual_resolution: false
- scenario_id: scenario.mordheims-burning
  rewards:
  - id: scenario.mordheims-burning.wyrdstone
    kind: resource
    resource: wyrdstone_fragments
    rule: The winning warband is the only warband that may search for wyrdstone after the battle (it does
      not roll the extra exploration D6). Due to the increased demand after the city's destruction, wyrdstone
      sells for triple the normal gold crowns.
    rule_i18n:
      es: La banda ganadora es la única que puede buscar piedra bruja después de la batalla (no tira el
        1D6 adicional de exploración). Debido a la mayor demanda tras la destrucción de la ciudad, la
        piedra bruja se vende al triple de las coronas de oro normales.
    quantity_input: true
