schema_version: 2
ruleset: mordheim
catalog: campaign-scenario-rewards
status: published
scenarios:
- scenario_id: scenario.defend-the-find
  rewards:
  - id: scenario.defend-the-find.wyrdstone
    kind: resource
    resource: wyrdstone_fragments
    rule: One shard of wyrdstone for each Hero of either warband who is inside the objective building at the end
      of the game, up to a maximum of three shards per warband.
    quantity_input: true
- scenario_id: scenario.wyrdstone-hunt
  rewards:
  - id: scenario.wyrdstone-hunt.wyrdstone
    kind: resource
    resource: wyrdstone_fragments
    rule: Warriors earn one shard of wyrdstone for each counter still in their possession at the end of the battle.
    quantity_input: true
- scenario_id: scenario.chance-encounter
  rewards:
  - id: scenario.chance-encounter.wyrdstone
    kind: resource
    resource: wyrdstone_fragments
    rule: Each warband starts the battle carrying D3 shards of wyrdstone, recorded before the game. At the end,
      each warband gains all the wyrdstone it was carrying minus one shard per Hero of its own that was taken out
      of action during the game (down to a minimum of zero), plus one extra shard for each enemy Hero it took out
      of action, up to the maximum number of shards the opposing warband was carrying at the beginning of the battle.
    quantity_input: true
- scenario_id: scenario.hidden-treasure
  rewards:
  - id: scenario.hidden-treasure.loot
    kind: loot_table
    rule: Whoever recovers the chest rolls on the contents chart after the game; each item is rolled for separately,
      apart from the gold crowns which are always found.
    contents:
    - id: scenario.hidden-treasure.loot.1.1
      label: 3D6 gold crowns
      roll: automatic
      grant:
        kind: resource
        resource: gold_crowns
        quantity_input: true
      quantity_dice:
        count: 3
        sides: 6
        multiplier: 1
        modifier: 0
    - id: scenario.hidden-treasure.loot.2.1
      label: D3 pieces of wyrdstone
      roll: 5+
      grant:
        kind: resource
        resource: wyrdstone_fragments
        quantity_input: true
      quantity_dice:
        count: 1
        sides: 3
        multiplier: 1
        modifier: 0
      availability:
        dice:
          count: 1
          sides: 6
        target: 5
    - id: scenario.hidden-treasure.loot.3.1
      label: Suit of light armour
      roll: 4+
      grant:
