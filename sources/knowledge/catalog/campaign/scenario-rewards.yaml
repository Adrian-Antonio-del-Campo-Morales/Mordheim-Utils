- scenario_id: scenario.round-up-at-the-mordheim-corral
  rewards:
  - id: scenario.round-up-at-the-mordheim-corral.wyrdstone
    kind: resource
    resource: wyrdstone_fragments
    rule: 'The boars have swallowed the wyrdstone. Each boar must be killed before it can be searched:
      roll D6, on 1-3 the warrior cannot locate the stomach and may try again next turn, on 4-6 he rolls
      D3 to determine how many shards are found. A warrior carrying wyrdstone who is killed, stunned or
      knocked down drops counters where he fell.'
    rule_i18n:
      es: 'Los jabalíes se han tragado la piedra bruja. Cada jabalí debe morir antes de poder registrarlo:
        tira 1D6; con un 1-3 el guerrero no localiza el estómago y puede intentarlo de nuevo en la siguiente
        vuelta; con un 4-6 tira 1D3 para determinar cuántos fragmentos encuentra. Un guerrero que lleve
        piedra bruja y sea muerto, aturdido o derribado suelta los contadores donde cayó.'
    quantity_input: true
- scenario_id: scenario.the-recipe
  rewards:
  - id: scenario.the-recipe.income
    kind: resource
    resource: gold_crowns
    rule: 'The winning warband is considered to have captured Geefer: turning him in is worth 5D6 gc (if
      two or more warbands share the win they must decide which one turns him in). Pies that have not
      been ruined may also be turned in: worth 1 gc each for a non-winning warband, or half that amount
      rounded up for the winning warband. A winning warband also gets any pies held by its warriors or
      still in the cart at the end of the game.'
    rule_i18n:
      es: 'Se considera que la banda ganadora ha capturado a Geefer: entregarlo vale 5D6 co (si dos o
        más bandas comparten la victoria deben decidir cuál lo entrega). Los pasteles que no se hayan
        estropeado también pueden entregarse: valen 1 co cada uno para una banda no ganadora, o la mitad
        de esa cantidad redondeada hacia arriba para la banda ganadora. Una banda ganadora también se
        queda con los pasteles que lleven sus guerreros o que sigan en el carro al final de la partida.'
    quantity_input: true
- scenario_id: scenario.ambush-surrounded
  rewards:
  - id: scenario.ambush-surrounded.wyrdstone
    kind: resource
    resource: wyrdstone_fragments
    rule: The defender starts the battle carrying D6 pieces of wyrdstone, but never more than the number
      of Heroes in the warband. The defending warband gains all the wyrdstone it was carrying at the beginning,
      minus the number of its own Heroes taken Out of Action during the game, down to a minimum of zero.
      The attacking warband gains one shard for each enemy Hero it takes Out of Action, up to the number
      of shards the opposing warband was carrying at the start.
    rule_i18n:
      es: El defensor comienza la batalla llevando 1D6 fragmentos de piedra bruja, pero nunca más que
        el número de Héroes de la banda. La banda defensora gana toda la piedra bruja que llevaba al comienzo,
        menos el número de sus propios Héroes puestos Fuera de Combate durante la partida, hasta un mínimo
        de cero. La banda atacante gana un fragmento por cada Héroe enemigo que ponga Fuera de Combate,
        hasta el número de fragmentos que la banda rival llevaba al inicio.
    quantity_input: true
