- scenario_id: scenario.the-item-lost
  rewards:
  - id: scenario.the-item-lost.wyrdstone
    kind: resource
    resource: wyrdstone_fragments
    rule: If the warband that Nicodemus has hired successfully retrieves the wand, they are considered to have found
      two additional Wyrdstone shards as their payment.
    quantity_input: true
  - id: scenario.the-item-lost.loot
    kind: loot_table
    rule: The Wand of Phyrros allows the wielder to use the spell Fires of U'Zhul once per game (automatically successful,
      no need to be a spell caster, but the wielder must be a Hero); it may be sold for 100 gc.
    contents:
    - id: scenario.the-item-lost.loot.1
      label: The Wand of Phyrros allows the wielder to use the spell Fires of U'Zhul once per game (automatically
        successful, no need to be a spell caster, but the wielder must be a Hero); it may be sold for 100 gc.
      roll: manual
      grant:
        kind: special
        special_id: scenario.the-item-lost.reward
        quantity_input: true
    manual_resolution: true
