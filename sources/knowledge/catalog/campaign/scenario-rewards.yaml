schema_version: 2
ruleset: mordheim
catalog: campaign-scenario-rewards
status: published
scenarios:
- scenario_id: scenario.defend-the-find
  rewards:
  - id: scenario.defend-the-find.wyrdstone
    kind: resource
    resource: wyrdstone_fragments
    rule: One shard of wyrdstone for each Hero of either warband who is inside the objective building
      at the end of the game, up to a maximum of three shards per warband.
    rule_i18n:
      es: Un fragmento de piedra bruja por cada Héroe de cualquiera de las bandas que esté dentro del
        edificio objetivo al final de la partida, hasta un máximo de tres fragmentos por banda.
    quantity_input: true
- scenario_id: scenario.wyrdstone-hunt
  rewards:
  - id: scenario.wyrdstone-hunt.wyrdstone
    kind: resource
    resource: wyrdstone_fragments
    rule: Warriors earn one shard of wyrdstone for each counter still in their possession at the end of
      the battle.
    rule_i18n:
      es: Los guerreros obtienen un fragmento de piedra bruja por cada contador que siga en su poder al
        final de la batalla.
    quantity_input: true
- scenario_id: scenario.chance-encounter
  rewards:
  - id: scenario.chance-encounter.wyrdstone
    kind: resource
    resource: wyrdstone_fragments
    rule: Each warband starts the battle carrying D3 shards of wyrdstone, recorded before the game. At
      the end, each warband gains all the wyrdstone it was carrying minus one shard per Hero of its own
      that was taken out of action during the game (down to a minimum of zero), plus one extra shard for
      each enemy Hero it took out of action, up to the maximum number of shards the opposing warband was
      carrying at the beginning of the battle.
    rule_i18n:
      es: Cada banda comienza la batalla llevando 1D3 fragmentos de piedra bruja, anotados antes de la
        partida. Al final, cada banda obtiene toda la piedra bruja que llevaba menos un fragmento por
        cada Héroe propio puesto fuera de combate durante la partida (hasta un mínimo de cero), más un
        fragmento adicional por cada Héroe enemigo que haya puesto fuera de combate, hasta el número máximo
        de fragmentos que la banda rival llevaba al comienzo de la batalla.
    quantity_input: true
- scenario_id: scenario.hidden-treasure
  rewards:
