- scenario_id: scenario.kidnapped
  rewards:
  - id: scenario.kidnapped.income
    kind: resource
    resource: gold_crowns
    rule: If the sacrificial victim escapes, the rescuing warband gains a reward of 50 gold crowns added
      directly to its treasury.
    rule_i18n:
      es: Si la víctima sacrificial escapa, la banda rescatadora gana una recompensa de 50 coronas de
        oro añadida directamente a su tesorería.
    quantity_input: true
- scenario_id: scenario.forbidden-square
  rewards:
  - id: scenario.forbidden-square.wyrdstone
    kind: resource
    resource: wyrdstone_fragments
    rule: D6+2 Wyrdstone counters are placed before deployment. Warriors pick them up by moving into contact;
      when a warrior is knocked down, stunned or taken Out of Action he drops all counters he is carrying.
      Each side carries its counters off through the gate (or offers them to the totem for the Possessed).
      When all counters have been carried away or absorbed the game ends and the player with the most
      stones wins.
    rule_i18n:
      es: Se colocan 1D6+2 contadores de piedra bruja antes del despliegue. Los guerreros los recogen
        moviéndose en contacto; cuando un guerrero es derribado, aturdido o puesto Fuera de Combate suelta
        todos los contadores que lleva. Cada bando saca sus contadores por la puerta (o los ofrece al
        tótem en el caso de los Poseídos). Cuando todos los contadores hayan sido retirados o absorbidos,
        la partida termina y gana el jugador con más piedras.
    quantity_input: true
- scenario_id: scenario.stake-out
  rewards:
  - id: scenario.stake-out.wyrdstone
    kind: resource
    resource: wyrdstone_fragments
    rule: The loser earns D6 shards of wyrdstone and the winner D6+1 shards.
    rule_i18n:
      es: El perdedor obtiene 1D6 fragmentos de piedra bruja y el ganador 1D6+1 fragmentos.
    quantity_input: true
- scenario_id: scenario.the-caravan
  rewards:
  - id: scenario.the-caravan.income
    kind: resource
    resource: gold_crowns
    rule: The defender receives 5D6 gold crowns as a starting payment plus 5D6 gold crowns for each wagon
      that escapes, with an additional bonus of 5D6 gold crowns if all three wagons escape. The attacker
      receives 3D6 gold crowns for each wagon he loots. A traitorous defender who attacks the caravan
      he was hired to protect receives 3D6 gold crowns per looted wagon instead.
    rule_i18n:
      es: El defensor recibe 5D6 coronas de oro como pago inicial más 5D6 coronas de oro por cada carro
        que escape, con una bonificación adicional de 5D6 coronas de oro si los tres carros escapan. El
        atacante recibe 3D6 coronas de oro por cada carro que saquee. Un defensor traidor que ataque la
        caravana que fue contratado para proteger recibe 3D6 coronas de oro por carro saqueado en su lugar.
    quantity_input: true
