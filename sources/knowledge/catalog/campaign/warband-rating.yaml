      applies_to: hero
      operation: add_experience
      value: 1
      source_refs: []
    - id: example.rating-per-henchman
      applies_to: henchman
      operation: add_per_model
      value: 4
      source_refs: []
    exclusions:
    - id: example.rating-exclude-hirelings
      applies_to: hired_sword
      source_refs: []
