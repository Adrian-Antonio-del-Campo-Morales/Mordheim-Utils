schema_version: 1
ruleset: mordheim
catalog: campaign-trading-post
status: published
# Defines market conditions; money, purchases, already-rolled availability and
# stock of an individual campaign belong to its external state.
source:
  manual: mordheimer.net
  printed_page: 0
  section: Trading Post
  url: https://mordheimer.net/docs/trading-post
# Each published entry: id, item_id, price (base_gc and optional_variable_cost),
# availability (kind common|rare + rarity), restrictions, purchase_options and
# source_refs.
# - price.base_gc: fixed part. price.multiplier: applies to the record being
#   upgraded (e.g. Gromril Weapon 4x the base weapon price). price.per: unit of
#   sale (pair). optional_variable_cost: { dice, multiplier } for costs such as
#   "10 + 1D6 gc" or "200 + D6 x 25 gc".
# - availability.kind: common is always available; rare requires a test against
#   availability.rarity (see trading-and-rarity.yaml).
# - typed restrictions: warband_only (groups/band_ids), warband_forbidden,
#   heroes_only, profile_only (note), limit_per_warband, condition (note).
# - purchase_options: pairs (quantity 2), first unit free, own rarity.
# equipment-access.yaml defines who may select an item when creating the
# warband. A confirmed price difference is expressed as a price_override with
# source_refs, never as a second implicit price.
items:
- id: campaign.trading-post.bearcloak
  item_id: bearcloak
  price:
    base_gc: 10
  availability:
    kind: common
  restrictions:
  - type: warband_only
    band_ids:
    - mazzalupo-web
  - type: condition
    note: Special. To acquire a bearcloak, a Sheepherder must pay 10 gc (to represent expense of taking
      part to the hunt). In addition, the Sheepherder must roll equal to or under his Strength on a D6.
      If successful, the Sheepherder finds and slays the bear and can wear its cloak as a mark of skill
      and prowess. Sheepherders may buy bearcloaks when starting their warband without making a test for
      availability.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Special Equipment / Bearcloak
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/mazzalupo
