schema_version: 1
ruleset: mordheim
catalog: campaign-mutations
status: published
rules:
  id: campaign.mutations.rules
  purchase:
    timing: at_recruitment_only
    note: Mutations may be bought for a Mutant or a Possessed warrior only when they are recruited; you
      may not buy new mutations for a model after recruitment.
    note_i18n:
      es: >-
        Las mutaciones pueden comprarse para un guerrero Mutante o Poseso solo cuando se le
        recluta; no puedes comprar nuevas mutaciones para un modelo después del reclutamiento.
    pricing:
      first_mutation: listed_price
      second_and_subsequent: double_listed_price
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Warbands / Cult of the Possessed / Mutations
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/cult-of-the-possessed
mutations:
- id: campaign.mutation.daemon-soul
  name: Daemon Soul
  cost_gc: 20
  effect: >-
    A Daemon lives within the mutant's soul, giving him a 4+ save against the effects of spells or
    prayers.
  effect_i18n:
    es: >-
      Un Demonio vive en el alma del mutante, dándole una salvación de 4+ contra los efectos de conjuros u oraciones.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Warbands / Cult of the Possessed / Mutations / Daemon Soul
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/cult-of-the-possessed
  name_i18n:
    es: Alma Demoníaca
- id: campaign.mutation.great-claw
  name: Great Claw
  cost_gc: 50
  effect: >-
    One of the mutant's arms ends in a great, crab-like claw. He may carry no weapons in this arm,
    but gains an extra attack in hand-to-hand combat with a +1 Strength bonus.
  effect_i18n:
    es: >-
      Uno de los brazos del mutante termina en una gran garra de cangrejo. No puede llevar armas en
      ese brazo, pero gana un ataque extra en combate cuerpo a cuerpo con un bono de +1 Fuerza.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Warbands / Cult of the Possessed / Mutations / Great Claw
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/cult-of-the-possessed
  name_i18n:
    es: Garra Enorme
- id: campaign.mutation.cloven-hoofs
  name: Cloven Hoofs
  cost_gc: 40
  effect: The warrior gains +1 Movement.
  effect_i18n:
    es: >-
      El guerrero gana +1 Movimiento.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Warbands / Cult of the Possessed / Mutations / Cloven Hoofs
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/cult-of-the-possessed
  name_i18n:
    es: Pezuñas Hendidas
- id: campaign.mutation.tentacle
  name: Tentacle
  cost_gc: 35
  effect: >-
    One of the mutant's arms ends in a tentacle. He may grapple his opponent in close combat to
    reduce his attacks by -1, down to a minimum of 1; the mutant decides which attack his opponent
    loses.
  effect_i18n:
    es: >-
      Uno de los brazos del mutante termina en un tentáculo. Puede agarrar a su oponente en combate
      cuerpo a cuerpo para reducir sus ataques en -1, hasta un mínimo de 1; el mutante decide qué
      ataque pierde su oponente.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Warbands / Cult of the Possessed / Mutations / Tentacle
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/cult-of-the-possessed
  name_i18n:
    es: Tentáculo
- id: campaign.mutation.blackblood
  name: Blackblood
  cost_gc: 30
  effect: >-
    If the model loses a wound in close combat, anyone in base contact with the model suffers a
    Strength 3 hit (no critical hits) from the spurting corrosive blood.
  effect_i18n:
    es: >-
      Si la miniatura pierde una herida en combate cuerpo a cuerpo, cualquiera en contacto base con
      ella sufre un impacto de Fuerza 3 (sin impactos críticos) por la sangre corrosiva que brota.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Warbands / Cult of the Possessed / Mutations / Blackblood
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/cult-of-the-possessed
  name_i18n:
    es: Sangre Negra
- id: campaign.mutation.spines
  name: Spines
  cost_gc: 35
  effect: >-
    Any model in base contact with the mutant suffers an automatic Strength 1 hit at the beginning
    of each close combat phase. Spines never cause critical hits.
  effect_i18n:
    es: >-
      Cualquier miniatura en contacto base con el mutante sufre un impacto automático de Fuerza 1 al
      principio de cada fase de combate cuerpo a cuerpo. Las púas nunca causan impactos críticos.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Warbands / Cult of the Possessed / Mutations / Spines
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/cult-of-the-possessed
  name_i18n:
    es: Púas
- id: campaign.mutation.scorpion-tail
  name: Scorpion Tail
  cost_gc: 40
  effect: >-
    The mutant has a long barbed tail with a venomed tip, allowing him to make an extra Strength 5
    attack in each hand-to-hand combat phase. If the model hit by the tail is immune to poison, the
    Strength of the hit is reduced to 2.
  effect_i18n:
    es: >-
      El mutante tiene una larga cola con púas y punta venenosa, que le permite hacer un ataque
      extra de Fuerza 5 en cada fase de combate cuerpo a cuerpo. Si la miniatura golpeada por la
      cola es inmune al veneno, la Fuerza del impacto se reduce a 2.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Warbands / Cult of the Possessed / Mutations / Scorpion Tail
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/cult-of-the-possessed
  name_i18n:
    es: Cola de Escorpión
- id: campaign.mutation.extra-arm
  name: Extra Arm
  cost_gc: 40
  effect: >-
    The mutant may use any single-handed weapon in the extra arm, giving him +1 attack when fighting
    in hand-to-hand combat. Alternatively, he may carry a shield or a buckler in the extra arm. If a
    Possessed chooses to do this, he gains an extra attack but still cannot carry a weapon.
  effect_i18n:
    es: >-
      El mutante puede usar cualquier arma a una mano en el brazo extra, lo que le da +1 ataque al
      luchar en combate cuerpo a cuerpo. Alternativamente, puede llevar un escudo o un broquel en el
      brazo extra. Si un Poseído elige hacerlo, gana un ataque extra pero sigue sin poder llevar un
      arma.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Warbands / Cult of the Possessed / Mutations / Extra Arm
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/cult-of-the-possessed
  name_i18n:
    es: Brazo Extra
- id: campaign.mutation.hideous
  name: Hideous
  cost_gc: 40
  effect: The mutant causes fear.
  effect_i18n:
    es: >-
      El mutante causa miedo.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Warbands / Cult of the Possessed / Mutations / Hideous
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/cult-of-the-possessed
  name_i18n:
    es: Horripilante
# Printed band rules that grant mutations. Each one names the band, its rule,
# who may receive a mutation and the mutation ids the rule lists that the
# catalogue publishes. The ids the printed rule names but the catalogue does not
# carry (no published cost in the available sources) are recorded in
# `unrouted_mutation_names` instead of being invented.
- id: campaign.mutation.prehensile-tail
  name: Prehensile Tail
  name_i18n:
    es: "Cola Prehensil"
  cost_gc: 50
  effect: >-
    Unless it already possesses a tail, gains one tail attack; may equip one single-handed weapon or
    shield/buckler in that tail. Choosing an equipped prehensile tail excludes every other tail
    attack for that hand-to-hand phase. Unable-to-use-weapons restriction persists.
  effect_i18n:
    es: >-
      Si no posee ya una cola, gana un ataque de cola; puede equipar un arma a una mano o un
      escudo/broquel en esa cola. Elegir una cola prensil equipada excluye cualquier otro ataque de
      cola en esa fase de cuerpo a cuerpo. La restricción de no poder usar armas se mantiene.
  source_refs:
  - manual: mutiny-in-marienburg
    printed_page: 160
    section: Corrupted Characters / Prehensile Tail
    url: https://broheim.net/downloads/campaigns/mutinyinmarienburg/Mutiny%20In%20Marienburg.pdf
- id: campaign.mutation.beak
  name: Beak
  name_i18n:
    es: "Pico"
  cost_gc: 35
  effect: >-
    Unless it already possesses a bite, gains one additional close-combat bite at own Strength with
    no unarmed penalty. Always strikes after double-handed weapons, regardless of charge.
  effect_i18n:
    es: >-
      Si no posee ya un mordisco, gana un mordisco adicional en combate cuerpo a cuerpo con su
      propia Fuerza y sin penalización por luchar desarmado. Golpea siempre después de las armas a
      dos manos, independientemente de la carga.
  source_refs:
  - manual: mutiny-in-marienburg
    printed_page: 162
    section: Corrupted Characters / Beak
    url: https://broheim.net/downloads/campaigns/mutinyinmarienburg/Mutiny%20In%20Marienburg.pdf
- id: campaign.mutation.electrical-touch
  name: Electrical Touch
  name_i18n:
    es: "Toque Eléctrico"
  cost_gc: 45
  effect: >-
    May forfeit one close-combat attack to jolt at +1 Initiative: automatic Strength3 hit, ignores
    all armour; Strength5 against metal armour. Recharge D3 turns after use.
  effect_i18n:
    es: >-
      Puede renunciar a un ataque de combate cuerpo a cuerpo para descargar una sacudida con +1
      Iniciativa: impacto automático de Fuerza 3 que ignora toda armadura; Fuerza 5 contra armadura
      metálica. Recarga tras D3 turnos de uso.
  source_refs:
  - manual: mutiny-in-marienburg
    printed_page: 162
    section: Corrupted Characters / Electrical Touch
    url: https://broheim.net/downloads/campaigns/mutinyinmarienburg/Mutiny%20In%20Marienburg.pdf
- id: campaign.mutation.mer-creature
  name: Mer-Creature
  name_i18n:
    es: "Criatura Marina"
  cost_gc: 25
  effect: >-
    Aquatic terrain and submersion are excluded; when moving on land the Hero has Movement reduced
    by one.
  effect_i18n:
    es: >-
      El terreno acuático y la inmersión quedan excluidos; al moverse en tierra el Héroe tiene el
      Movimiento reducido en uno.
  source_refs:
  - manual: mutiny-in-marienburg
    printed_page: 162
    section: Corrupted Characters / Mer-Creature
    url: https://broheim.net/downloads/campaigns/mutinyinmarienburg/Mutiny%20In%20Marienburg.pdf
- id: campaign.mutation.suckers
  name: Suckers
  name_i18n:
    es: "Ventosas"
  cost_gc: 25
  effect: Automatically passes Initiative tests when climbing. Climbing is outside the duel.
  effect_i18n:
    es: >-
      Supera automáticamente las pruebas de Iniciativa al trepar. Trepar queda fuera del duelo.
  source_refs:
  - manual: mutiny-in-marienburg
    printed_page: 164
    section: Corrupted Characters / Suckers
    url: https://broheim.net/downloads/campaigns/mutinyinmarienburg/Mutiny%20In%20Marienburg.pdf
- id: campaign.mutation.eye-stalks
  name: Eye Stalks
  name_i18n:
    es: "Ojos Pedunculados"
  cost_gc: 40
  effect: Crab-like stalked eyes cause Fear (counts as Hideous).
  effect_i18n:
    es: >-
      Sus ojos pedunculados, semejantes a los de un cangrejo, causan Miedo (cuenta como Horrible).
  source_refs:
  - manual: mutiny-in-marienburg
    printed_page: 159
    section: Corrupted Characters / Eye Stalks
    url: https://broheim.net/downloads/campaigns/mutinyinmarienburg/Mutiny%20In%20Marienburg.pdf
grant_rules:
- id: campaign.mutation.grant.aquatic-mutants
  band_id: shallows-beasts-mim
  rule_id: band--aquatic-mutants
  recipients: hero
  profile_ids: []
  mutation_ids:
  - campaign.mutation.blackblood
  - campaign.mutation.great-claw
  - campaign.mutation.tentacle
  - campaign.mutation.prehensile-tail
  - campaign.mutation.beak
  - campaign.mutation.electrical-touch
  - campaign.mutation.mer-creature
  - campaign.mutation.suckers
  - campaign.mutation.eye-stalks
  unrouted_mutation_names: []
  limit_per_warrior: 1
  name: Aquatic Mutants
  name_i18n:
    es: Mutantes Acuáticos
  effect: >-
    Any Hero may start the campaign with a single mutation from the following gifts and mutations in
    the 'Corrupted Characters' chapter if they pay the appropriate cost; blackblood, great claw,
    tentacle, prehensile tail, beak, electrical touch, mer-creature, suckers, or eye stalks (counts
    as hideous).
  effect_i18n:
    es: >-
      Cualquier Héroe puede comenzar la campaña con una única mutación de los siguientes dones y
      mutaciones del capítulo 'Personajes Corruptos' si paga el coste apropiado; sangre negra, gran
      garra, tentáculo, cola prensil, pico, toque eléctrico, criatura marina, ventosas u ojos tallo
      (cuenta como horripilante).
  source_refs:
  - manual: broheim.net
    printed_page: 1
    section: Special rules / Aquatic Mutants
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Shallows%20Beasts.pdf
effect_ids:
- campaign.mutation.apply
- campaign.mutation.grant-on-advance

