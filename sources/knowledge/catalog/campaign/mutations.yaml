schema_version: 1
ruleset: mordheim
catalog: campaign-mutations
status: published
# Defines the available mutations and their declarative effects. Mutations
# bought by a concrete miniature are campaign state, outside the KB.
rules:
  id: campaign.mutations.rules
  purchase:
    timing: at_recruitment_only
    note: Mutations may be bought for a Mutant or a Possessed warrior only when
      they are recruited; you may not buy new mutations for a model after
      recruitment.
    pricing:
      first_mutation: listed_price
      second_and_subsequent: double_listed_price
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Warbands / Cult of the Possessed / Mutations
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/cult-of-the-possessed
mutations:
- id: campaign.mutation.daemon-soul
  name: Daemon Soul
  cost_gc: 20
  summary: A Daemon lives within the mutant's soul, giving him a 4+ save against
    the effects of spells or prayers.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Warbands / Cult of the Possessed / Mutations / Daemon Soul
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/cult-of-the-possessed
- id: campaign.mutation.great-claw
  name: Great Claw
  cost_gc: 50
  summary: One of the mutant's arms ends in a great, crab-like claw. He may carry
    no weapons in this arm, but gains an extra attack in hand-to-hand combat with
    a +1 Strength bonus.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Warbands / Cult of the Possessed / Mutations / Great Claw
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/cult-of-the-possessed
- id: campaign.mutation.cloven-hoofs
  name: Cloven Hoofs
  cost_gc: 40
  summary: The warrior gains +1 Movement.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Warbands / Cult of the Possessed / Mutations / Cloven Hoofs
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/cult-of-the-possessed
- id: campaign.mutation.tentacle
  name: Tentacle
  cost_gc: 35
  summary: One of the mutant's arms ends in a tentacle. He may grapple his
    opponent in close combat to reduce his attacks by -1, down to a minimum of
    1; the mutant decides which attack his opponent loses.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Warbands / Cult of the Possessed / Mutations / Tentacle
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/cult-of-the-possessed
- id: campaign.mutation.blackblood
  name: Blackblood
  cost_gc: 30
  summary: If the model loses a wound in close combat, anyone in base contact
    with the model suffers a Strength 3 hit (no critical hits) from the spurting
    corrosive blood.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Warbands / Cult of the Possessed / Mutations / Blackblood
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/cult-of-the-possessed
- id: campaign.mutation.spines
  name: Spines
  cost_gc: 35
  summary: Any model in base contact with the mutant suffers an automatic
    Strength 1 hit at the beginning of each close combat phase. Spines never
    cause critical hits.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Warbands / Cult of the Possessed / Mutations / Spines
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/cult-of-the-possessed
- id: campaign.mutation.scorpion-tail
  name: Scorpion Tail
  cost_gc: 40
  summary: The mutant has a long barbed tail with a venomed tip, allowing him to
    make an extra Strength 5 attack in each hand-to-hand combat phase. If the
    model hit by the tail is immune to poison, the Strength of the hit is
    reduced to 2.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Warbands / Cult of the Possessed / Mutations / Scorpion Tail
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/cult-of-the-possessed
- id: campaign.mutation.extra-arm
  name: Extra Arm
  cost_gc: 40
  summary: The mutant may use any single-handed weapon in the extra arm, giving
    him +1 attack when fighting in hand-to-hand combat. Alternatively, he may
    carry a shield or a buckler in the extra arm. If a Possessed chooses to do
    this, he gains an extra attack but still cannot carry a weapon.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Warbands / Cult of the Possessed / Mutations / Extra Arm
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/cult-of-the-possessed
- id: campaign.mutation.hideous
  name: Hideous
  cost_gc: 40
  summary: The mutant causes fear.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Warbands / Cult of the Possessed / Mutations / Hideous
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/cult-of-the-possessed
effect_ids:
- campaign.mutation.apply
- campaign.mutation.grant-on-advance