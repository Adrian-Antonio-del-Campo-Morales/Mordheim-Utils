schema_version: 1
ruleset: mordheim
catalog: campaign-mutations
status: published
rules:
  id: campaign.mutations.rules
  purchase:
    timing: at_recruitment_only
    note: Mutations may be bought for a Mutant or a Possessed warrior only when they are recruited; you
      may not buy new mutations for a model after recruitment.
    pricing:
      first_mutation: listed_price
      second_and_subsequent: double_listed_price
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Warbands / Cult of the Possessed / Mutations
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/cult-of-the-possessed
mutations:
- id: campaign.mutation.daemon-soul
  name: Daemon Soul
  cost_gc: 20
  effect: >-
    A Daemon lives within the mutant's soul, giving him a 4+ save against the effects of spells or
    prayers.
  effect_i18n:
    es: >-
      Un Demonio vive en el alma del mutante, dándole una salvación de 4+ contra los efectos de conjuros u oraciones.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Warbands / Cult of the Possessed / Mutations / Daemon Soul
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/cult-of-the-possessed
  name_i18n:
    es: Alma Demoníaca
- id: campaign.mutation.great-claw
  name: Great Claw
  cost_gc: 50
  effect: >-
    One of the mutant's arms ends in a great, crab-like claw. He may carry no weapons in this arm,
    but gains an extra attack in hand-to-hand combat with a +1 Strength bonus.
  effect_i18n:
    es: >-
      Uno de los brazos del mutante termina en una gran garra de cangrejo. No puede llevar armas en ese brazo, pero gana un ataque extra en combate cuerpo a cuerpo con un bono de +1 Fuerza.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Warbands / Cult of the Possessed / Mutations / Great Claw
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/cult-of-the-possessed
  name_i18n:
    es: Garra Enorme
- id: campaign.mutation.cloven-hoofs
  name: Cloven Hoofs
  cost_gc: 40
  effect: The warrior gains +1 Movement.
  effect_i18n:
    es: >-
      El guerrero gana +1 Movimiento.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Warbands / Cult of the Possessed / Mutations / Cloven Hoofs
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/cult-of-the-possessed
  name_i18n:
    es: Pezuñas Hendidas
- id: campaign.mutation.tentacle
  name: Tentacle
  cost_gc: 35
  effect: >-
    One of the mutant's arms ends in a tentacle. He may grapple his opponent in close combat to
    reduce his attacks by -1, down to a minimum of 1; the mutant decides which attack his opponent
    loses.
  effect_i18n:
    es: >-
      Uno de los brazos del mutante termina en un tentáculo. Puede agarrar a su oponente en combate cuerpo a cuerpo para reducir sus ataques en -1, hasta un mínimo de 1; el mutante decide qué ataque pierde su oponente.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Warbands / Cult of the Possessed / Mutations / Tentacle
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/cult-of-the-possessed
  name_i18n:
    es: Tentáculo
- id: campaign.mutation.blackblood
  name: Blackblood
  cost_gc: 30
  effect: >-
    If the model loses a wound in close combat, anyone in base contact with the model suffers a
    Strength 3 hit (no critical hits) from the spurting corrosive blood.
  effect_i18n:
    es: >-
      Si la miniatura pierde una herida en combate cuerpo a cuerpo, cualquiera en contacto base con ella sufre un impacto de Fuerza 3 (sin impactos críticos) por la sangre corrosiva que brota.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Warbands / Cult of the Possessed / Mutations / Blackblood
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/cult-of-the-possessed
  name_i18n:
    es: Sangre Negra
- id: campaign.mutation.spines
  name: Spines
  cost_gc: 35
  effect: >-
    Any model in base contact with the mutant suffers an automatic Strength 1 hit at the beginning
    of each close combat phase. Spines never cause critical hits.
  effect_i18n:
    es: >-
      Cualquier miniatura en contacto base con el mutante sufre un impacto automático de Fuerza 1 al principio de cada fase de combate cuerpo a cuerpo. Las púas nunca causan impactos críticos.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Warbands / Cult of the Possessed / Mutations / Spines
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/cult-of-the-possessed
  name_i18n:
    es: Púas
- id: campaign.mutation.scorpion-tail
  name: Scorpion Tail
  cost_gc: 40
  effect: >-
    The mutant has a long barbed tail with a venomed tip, allowing him to make an extra Strength 5
    attack in each hand-to-hand combat phase. If the model hit by the tail is immune to poison, the
    Strength of the hit is reduced to 2.
  effect_i18n:
    es: >-
      El mutante tiene una larga cola con púas y punta venenosa, que le permite hacer un ataque extra de Fuerza 5 en cada fase de combate cuerpo a cuerpo. Si la miniatura golpeada por la cola es inmune al veneno, la Fuerza del impacto se reduce a 2.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Warbands / Cult of the Possessed / Mutations / Scorpion Tail
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/cult-of-the-possessed
  name_i18n:
    es: Cola de Escorpión
- id: campaign.mutation.extra-arm
  name: Extra Arm
  cost_gc: 40
  effect: >-
    The mutant may use any single-handed weapon in the extra arm, giving him +1 attack when fighting
    in hand-to-hand combat. Alternatively, he may carry a shield or a buckler in the extra arm. If a
    Possessed chooses to do this, he gains an extra attack but still cannot carry a weapon.
  effect_i18n:
    es: >-
      El mutante puede usar cualquier arma a una mano en el brazo extra, lo que le da +1 ataque al luchar en combate cuerpo a cuerpo. Alternativamente, puede llevar un escudo o un broquel en el brazo extra. Si un Poseído elige hacerlo, gana un ataque extra pero sigue sin poder llevar un arma.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Warbands / Cult of the Possessed / Mutations / Extra Arm
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/cult-of-the-possessed
  name_i18n:
    es: Brazo Extra
- id: campaign.mutation.hideous
  name: Hideous
  cost_gc: 40
  effect: The mutant causes fear.
  effect_i18n:
    es: >-
      El mutante causa miedo.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Warbands / Cult of the Possessed / Mutations / Hideous
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/cult-of-the-possessed
  name_i18n:
    es: Horripilante
effect_ids:
- campaign.mutation.apply
- campaign.mutation.grant-on-advance
