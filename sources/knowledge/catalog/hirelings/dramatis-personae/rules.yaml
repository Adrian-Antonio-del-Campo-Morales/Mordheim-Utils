schema_version: 1
ruleset: mordheim
catalog: hirelings-dramatis-personae-rules
rules:
- id: hireling.dramatis.rule.search
  name: Search for Special Character
  effect: >-
    After a battle, any number of Heroes may search for one named special character; each searcher rolls D6 and succeeds by rolling under Initiative. Searchers cannot also search for rare items.
  effect_i18n:
    es: >-
      Tras una batalla, cualquier número de Héroes puede buscar a un personaje especial con nombre; cada
      buscador tira un D6 y tiene éxito si saca menos que su Iniciativa. Los buscadores no pueden buscar
      además objetos raros.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Dramatis Personae / Looking for Special Characters
    url: https://mordheimer.net/docs/campaigns/dramatis-personae
  name_i18n:
    es: Buscar Personaje Especial
- id: hireling.dramatis.rule.unique-character
  name: Unique Character
  effect: A warband can never include more than one copy of a particular special character.
  effect_i18n:
    es: >-
      Una banda nunca puede incluir más de una copia de un mismo personaje especial.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Dramatis Personae
    url: https://mordheimer.net/docs/campaigns/dramatis-personae
  name_i18n:
    es: Personaje Único
- id: hireling.dramatis.rule.fixed-equipment
  name: Personal Equipment
  effect: >-
    A special character's equipment is personal, cannot be transferred to other warriors, and extra equipment cannot be bought for the character.
  effect_i18n:
    es: >-
      El equipo de un personaje especial es personal, no puede transferirse a otros guerreros y no puede
      comprarse equipo adicional para el personaje.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Dramatis Personae / Experience, Injuries and Equipment
    url: https://mordheimer.net/docs/campaigns/dramatis-personae
  name_i18n:
    es: Equipo Personal
- id: hireling.dramatis.rule.no-experience
  name: No Experience
  effect: Special characters do not earn Experience points.
  effect_i18n:
    es: >-
      Los personajes especiales no ganan puntos de Experiencia.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Dramatis Personae / Experience, Injuries and Equipment
    url: https://mordheimer.net/docs/campaigns/dramatis-personae
  name_i18n:
    es: Sin Experiencia
- id: hireling.dramatis.rule.hero-injuries
  name: Hero Serious Injuries
  effect: >-
    A special character taken Out of Action resolves serious injuries in the same way as a Hero.
  effect_i18n:
    es: >-
      Un personaje especial puesto Fuera de combate resuelve las heridas graves igual que un Héroe.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Dramatis Personae / Experience, Injuries and Equipment
    url: https://mordheimer.net/docs/campaigns/dramatis-personae
  name_i18n:
    es: Heridas Graves de Héroes
