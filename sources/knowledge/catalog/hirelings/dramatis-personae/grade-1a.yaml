  rules:
  - id: hireling.dramatis.countess-marianna-chevaux-vampire-assassin.rule.immune-to-psychology
    name: Immune to Psychology
    effect: Immune to psychology.
    effect_i18n:
      es: >-
        Inmune a la psicología.
    name_i18n:
      es: Inmune a la Psicología
    runtime:
      grant: profile
      scope: 'YES'
      implemented: 'YES'
      effects:
      - id: mechanic.psychology-immunity
        scope: 'YES'
        binding:
          kind: mechanic
          id: mechanic.psychology-immunity
  - id: hireling.dramatis.countess-marianna-chevaux-vampire-assassin.rule.immune-to-poison
    name: Immune to Poison
    effect: Immune to poison.
    effect_i18n:
      es: >-
        Inmune al veneno.
    name_i18n:
      es: Inmune al Veneno
    runtime:
      scope: 'YES'
      implemented: 'YES'
      grant: profile
      effects:
      - id: trait.poison-immune
        scope: 'YES'
        binding:
          kind: trait
          id: trait.poison-immune
          parameters:
            value: true
  - id: hireling.dramatis.countess-marianna-chevaux-vampire-assassin.rule.no-pain
    name: No Pain
    effect: >-
      Stunned Injury results become Knocked Down through No Pain; the source expressly combines her
      Jump Up skill with No Pain so those Knocked Down Injury results do not leave her prone. This
      exception does not prevent a separate Trip effect.
    effect_i18n:
      es: >-
        Los resultados de Herida de Aturdido se convierten en Derribado mediante Insensible al
        Dolor; la fuente combina expresamente su habilidad de Levantarse Rápido con Insensible al
        Dolor, de modo que esos resultados de Derribado no la dejan en el suelo. Esta excepción no
        impide un efecto separado de Zancadilla.
    name_i18n:
      es: Sin Dolor
    runtime:
      scope: 'YES'
      implemented: 'YES'
      grant: profile
      effects:
      - id: skill.ignore-pain
        scope: 'YES'
        binding:
          kind: mechanic
          id: skill.ignore-pain
      - id: skill.jump-up
        scope: 'YES'
        binding:
          kind: mechanic
          id: skill.jump-up
      - id: mechanic.marianna-no-pain-jump-up
        scope: 'YES'
        binding:
          kind: mechanic
          id: mechanic.marianna-no-pain-jump-up
    source_refs:
    - manual: town-cryer-22
      printed_page: 12
      section: Revenge is Eternal / Marianna
      url: https://broheim.net/downloads/fo/62RevengeIsEternal.pdf
  - id: hireling.dramatis.countess-marianna-chevaux-vampire-assassin.rule.causes-fear
    name: Causes Fear
    effect: Causes fear.
    effect_i18n:
      es: >-
        Causa miedo.
    name_i18n:
      es: Causa Miedo
    runtime:
      grant: profile
      scope: 'YES'
      implemented: 'YES'
      effects:
      - id: mechanic.causes-fear
        scope: 'YES'
        binding:
          kind: mechanic
          id: mechanic.causes-fear
  - id: hireling.dramatis.countess-marianna-chevaux-vampire-assassin.rule.serutat
    name: Serutat
    effect: Uses the source minion/retainer rule.
    effect_i18n:
      es: >-
        Usa la regla de séquito/criados de la fuente.
    name_i18n:
      es: Serutat
    runtime:
      scope: 'NO'
      implemented: 'NO'
      grant: none
      effects:
      - id: marianna-serutat
        scope: 'NO'
        binding: null
        reason: >-
          The Serutat retainer/upkeep rule governs hiring and payment in the campaign; the duel
          fields the assassin alone.
  - id: hireling.dramatis.countess-marianna-chevaux-vampire-assassin.rule.fighting-undead
    name: Fighting Undead
    effect: Uses the source anti-Undead rule.
    effect_i18n:
      es: >-
        Usa la regla anti-No-muertos de la fuente.
    name_i18n:
      es: Combatir contra No Muertos
    runtime:
      scope: 'YES'
      implemented: 'YES'
      grant: profile
      effects:
      - id: mechanic.fighting-undead
        scope: 'YES'
        binding:
          kind: mechanic
          id: mechanic.fighting-undead
        reason: >-
          Target-imposed grant: the opposing Vampire, not this profile, is the recipient of the
          Hatred. Printed clause: the source grants Fighting Undead to all Vampires against
          Marianna.
  - id: hireling.dramatis.countess-marianna-chevaux-vampire-assassin.rule.noctu
    name: Noctu
    effect: Applies the source shooting penalty.
    effect_i18n:
      es: >-
        Aplica la penalización de disparo de la fuente.
    name_i18n:
      es: Noctu
    runtime:
      scope: 'NO'
      implemented: 'NO'
      grant: none
      effects:
      - id: marianna-noctu
        scope: 'NO'
        binding: null
        reason: >-
          Noctu is a shooting penalty; shooting resolution is outside the single close combat the
          duel resolves.
  - id: hireling.dramatis.countess-marianna-chevaux-vampire-assassin.rule.garlic-coated-weapons
    name: Garlic-Coated Weapons
    effect: >-
      Her weapons carry a garlic coating. Against Vampires only, the coating acts as Black Lotus:
      a natural 6 to hit guarantees the wound, keeping the ordinary critical attempt and saves.
    effect_i18n:
      es: >-
        Sus armas llevan un recubrimiento de ajo. Solo contra Vampiros, el recubrimiento actúa como
        Loto Negro: un 6 natural para impactar garantiza la herida, con el intento de crítico y
        las salvaciones normales.
    name_i18n:
      es: Armas Recubiertas de Ajo
    source_refs:
    - manual: mordheimer.net
      printed_page: 0
      section: Dramatis Personae / Countess Marianna Chevaux, Vampire Assassin
      url: https://mordheimer.net/docs/campaigns/dramatis-personae/grade-1a
    runtime:
      grant: profile
      scope: 'YES'
      implemented: 'YES'
      effects:
      - id: poison.garlic-black-lotus
        scope: 'YES'
        binding:
          kind: mechanic
          id: poison.garlic-black-lotus
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Dramatis Personae / Countess Marianna Chevaux, Vampire Assassin
    url: https://mordheimer.net/docs/campaigns/dramatis-personae/grade-1a
- id: hireling.dramatis.nicodemus-the-cursed-pilgrim
  kind: dramatis-personae
  grade: 1a
  publication: Mordheim Annual 2002
  name: Nicodemus, the Cursed Pilgrim
  name_i18n:
    es: Nicodemus, el Peregrino Maldito
  normalization_status: normalized
  characteristics:
    M: 4
    WS: 3
    BS: 3
    S: 4
    T: 4
    W: 2
    I: 3
    A: 1
    Ld: 8
  warband_rating:
    kind: fixed
    value: 85
  equipment:
    unique_equipment:
    - id: hireling.dramatis.nicodemus-the-cursed-pilgrim.item.wizards-staff
      name: Enormous Wizard's Staff
      name_i18n:
        es: Bastón de Mago Enorme
      counts_as:
        item_id: enormous_wizards_staff
        context: rules
        quantity:
          kind: fixed
          value: 1
  skill_access: []
  starting_skill_ids:
  - skill.sorcery
  - skill.fearsome
  rules:
  - id: hireling.dramatis.nicodemus-the-cursed-pilgrim.rule.cursed
    name: Cursed
    effect: Requires the source wyrdstone payment when joining and after battles.
    effect_i18n:
      es: >-
        Requiere el pago en piedra bruja de la fuente al unirse y después de las batallas.
    name_i18n:
      es: Maldito
    runtime:
      scope: 'NO'
      implemented: 'NO'
      grant: none
      effects:
      - id: nicodemus-cursed-wyrdstone-payment
        scope: 'NO'
        binding: null
        reason: >-
          The printed clause is the wyrdstone payment owed when joining and after battles, an upkeep
          and post-battle cost with no consequence in a resolved duel.
  - id: hireling.dramatis.nicodemus-the-cursed-pilgrim.rule.wizard-s-staff
    name: Wizard's Staff
    effect: >-
      The staff may be used two-handed, counting as a Club and allowing Nicodemus to parry as if
      armed with a buckler, or in his left hand as a normal Club while the Sword of Rezhebel spell
      occupies his right hand.
    effect_i18n:
      es: >-
        El bastón puede usarse a dos manos, contando como Garrote y permitiendo a Nicodemo parar
        como si llevara un broquel, o en su mano izquierda como un Garrote normal mientras el
        conjuro Espada de Rezhebel ocupa su mano derecha.
    name_i18n:
      es: Bastón de Mago
    runtime:
      grant: profile
      scope: 'YES'
      implemented: 'YES'
      effects:
      - id: weapon.wizards-staff
        scope: 'YES'
        binding:
          kind: mechanic
          id: weapon.wizards-staff
  - id: hireling.dramatis.nicodemus-the-cursed-pilgrim.rule.master-of-lesser-magic
    name: Master of Lesser Magic
    effect: Knows all six Lesser Magic spells.
    effect_i18n:
      es: >-
        Conoce los seis conjuros de Magia Menor.
    name_i18n:
      es: Maestro de la Magia Menor
    runtime:
      scope: 'NO'
      implemented: 'NO'
      grant: none
      effects:
      - id: nicodemus-lesser-magic-spell-selection
        scope: 'NO'
        binding: null
        reason: >-
          Knowing the six Lesser Magic spells grants a spell list; selecting and casting those
          spells is the excluded magic subsystem and leaves no consequence for a resolved duel.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Dramatis Personae / Nicodemus, the cursed pilgrim
    url: https://mordheimer.net/docs/campaigns/dramatis-personae/grade-1a
- id: hireling.dramatis.ulli-and-marquand
  kind: dramatis-personae
  grade: 1a
  publication: Town Cryer 13
  name: Ulli & Marquand
  name_i18n:
    es: Ulli y Marquand
  normalization_status: out_of_scope
  warband_rating:
    kind: fixed
    value: 60
  skill_access: []
  starting_skill_ids: []
  rules:
  - id: hireling.dramatis.ulli-and-marquand.rule.wanderers
    name: Wanderers
    effect: Use the source one-battle/wanderer rule.
    effect_i18n:
      es: >-
        Usan la regla de una batalla/errante de la fuente.
    name_i18n:
      es: Errantes
    runtime:
      scope: 'NO'
      implemented: 'NO'
      grant: none
      effects:
      - id: ulli-wanderers-one-battle-retention
        scope: 'NO'
        binding: null
        reason: >-
          The one-battle wanderer condition decides whether the pair stays with the warband after
          the game, a hiring and retention consequence settled outside the duel.
  - id: hireling.dramatis.ulli-and-marquand.rule.a-fistful-of-crowns
    name: A Fistful of Crowns
    effect: Uses source payment/behaviour rule.
    effect_i18n:
      es: >-
        Usa la regla de pago/comportamiento de la fuente.
    name_i18n:
      es: Un Puñado de Coronas
    runtime:
      scope: 'NO'
      implemented: 'NO'
      grant: none
      effects:
      - id: ulli-a-fistful-of-crowns-payment
        scope: 'NO'
        binding: null
        reason: >-
          The printed clause is the pair's payment and behaviour rule, an upkeep consequence settled
          between games rather than in a resolved duel.
  - id: hireling.dramatis.ulli-and-marquand.rule.where-s-the-money
    name: Where's the Money
    effect: Uses source post-battle rule.
    effect_i18n:
      es: >-
        Usa la regla de postbatalla de la fuente.
    name_i18n:
      es: ¿Dónde Está el Dinero?
    runtime:
      scope: 'NO'
      implemented: 'NO'
      grant: none
      effects:
      - id: ulli-wheres-the-money-post-battle
        scope: 'NO'
        binding: null
        reason: >-
          The printed clause is a post-battle rule over the warband's income and the pair's share of
          it, which a resolved duel does not settle.
  source_notes:
  - >-
    The pair keeps its joint identity and its `out_of_scope` adjudication. Each printed warrior line is
    published as its own normalized close-combat profile: `hireling.dramatis.ulli` carries the printed
    characteristics, two-handed warhammer, Light Armour, Strongman and Unstoppable Charge, and
    `hireling.dramatis.marquand` carries his own line. Combat Master's two-or-more-enemies clause is
    outside the resolved 1v1 duel, so no operator is invented for it.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Dramatis Personae / Ulli & Marquand
    url: https://mordheimer.net/docs/campaigns/dramatis-personae/grade-1a
  out_of_scope_reason: Composite Dramatis entry with two independent warrior profiles.
