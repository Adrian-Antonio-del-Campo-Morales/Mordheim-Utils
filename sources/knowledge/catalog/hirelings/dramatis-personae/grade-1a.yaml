  normalization_status: normalized
  characteristics:
    M: 6
    WS: 6
    BS: 6
    S: 4
    T: 4
    W: 2
    I: 9
    A: 3
    Ld: 9
  warband_rating:
    kind: fixed
    value: 90
  equipment:
    fixed_items:
    - item_id: rapier
      quantity:
        kind: fixed
        value: 1
    - item_id: dagger
      quantity:
        kind: fixed
        value: 1
    - item_id: throwing_knives
      quantity:
        kind: fixed
        value: 1
    - item_id: crossbow_pistol
      quantity:
        kind: fixed
        value: 1
  skill_access: []
  starting_skill_ids:
  - skill.combat-master
  - skill.step-aside
  - skill.leap
  - skill.acrobat
  - skill.lightning-reflexes
  - skill.dodge
