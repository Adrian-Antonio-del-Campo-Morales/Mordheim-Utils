- id: hireling.dramatis.crow-master-the
  kind: dramatis-personae
  grade: 1b
  publication: Town Cryer 25
  name: Crow Master, The
  name_i18n:
    es: El Maestro de Cuervos
  normalization_status: normalized
  characteristics:
    M: 4
    WS: 3
    BS: 3
    S: 3
    T: 4
    W: 3
    I: 5
    A: 2
    Ld: 8
  warband_rating:
    kind: fixed
    value: 85
  equipment:
    fixed_items:
    - item_id: staff
      quantity:
        kind: fixed
        value: 1
    unique_equipment:
    - id: hireling.dramatis.crow-master-the.item.mantle-of-crows
      name: Mantle of Crows
      rules: [hireling.dramatis.crow-master-the.rule.crow-master]
      name_i18n:
        es: Manto de Cuervos
    - id: hireling.dramatis.crow-master-the.item.needle-and-thread
      name: Needle and Thread
      rules: [hireling.dramatis.crow-master-the.rule.crow-master]
      name_i18n:
        es: Aguja e Hilo
  skill_access: []
  starting_skill_ids:
  - skill.sorcery
  - skill.dodge
  rules:
  - id: hireling.dramatis.crow-master-the.rule.crow-master
    name: Crow Master
    effect: >-
      Mantle of Crows: the mantle appears a simple shabby cloak but has hidden malign power,
      attracting crows that distract his adversaries. Any enemy model in base-to-base contact
      with Simius at the start of the Hand-to-hand Combat phase suffers a single automatic
      Strength 2 hit before any blows are struck.
      Needle and Thread: if Simius stuns an opponent in Hand-to-Hand combat and has no other
      enemies standing in base-to-base contact, he sews up the mouth of his enemy. Leaders cannot
      then use their leader ability and spell casters cannot cast spells for the remainder of the battle.
      Payment in blood: if the hiring warband loses, roll D6; on 1 Simius abducts the Hero or
      Henchman with lowest experience (not hired swords), who is removed from the roster as slain.
      Decay of Ages (difficulty 9): a warrior within 6 inches must pass an immediate Toughness
      test or lose 1 from all characteristics except Attacks and Wounds. Each Recovery phase
      repeats the test and loss; success restores all characteristics. A characteristic reaching
      zero takes the victim out of action. Only one victim may be affected; recasting ends the
      previous victim's effects.
    effect_i18n:
      es: >-
        Manto de Cuervos: el manto parece una capa raída y sencilla, pero esconde un poder maligno que
        atrae a los cuervos y distrae a sus adversarios. Cualquier modelo enemigo en contacto peana
        con peana con Simius al comienzo de la fase de combate cuerpo a cuerpo sufre un impacto
        automático de Fuerza 2 antes de que se golpee. Aguja e Hilo: si Simius aturde a un oponente en
        combate cuerpo a cuerpo y no queda ningún otro enemigo en contacto peana con peana, le cose
        la boca; el Líder no puede usar su habilidad de líder y el lanzador de hechizos no puede
        lanzar durante el resto de la batalla. Pago en sangre: si la banda contratante pierde, tira
        1D6; con 1 Simius secuestra al Héroe o Secuaz de menor experiencia (no espadas a sueldo),
        que se elimina de la lista como muerto. Decadencia de las Eras (dificultad 9): un guerrero a
        6 pulgadas debe pasar de inmediato una tirada de Resistencia o pierde 1 en todas sus
        características salvo Ataques y Heridas; cada fase de Recuperación repite la tirada y la
        pérdida, y el éxito restaura todas las características; una característica que llegue a cero
        deja a la víctima fuera de combate y solo puede verse afectada una víctima.
    name_i18n:
      es: Maestro de Cuervos
    runtime:
      scope: 'YES'
      implemented: 'YES'
      grant: profile
      effects:
      - id: mantle-of-crows
        scope: 'YES'
        binding: {kind: mechanic, id: mechanic.mantle-of-crows}
      - id: needle-and-thread
        scope: 'YES'
        binding: {kind: mechanic, id: mechanic.needle-and-thread}
      - id: payment-in-blood
        scope: 'NO'
        binding: null
        reason: >-
          Post-battle abduction and roster removal are outside the duel.
      - id: decay-of-ages
        scope: 'NO'
        binding: null
        reason: >-
          Spell casting is outside the duel; no supplied spell result is assigned here.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Dramatis Personae / Crow Master, The
    url: https://mordheimer.net/docs/campaigns/dramatis-personae/grade-1b
