- id: hireling.dramatis.belandysh-condemned-champion-of-chen
  kind: dramatis-personae
  grade: 1c
  publication: Border Town Burning Supplement
  name: Belandysh, Condemned Champion of Chen
  name_i18n:
    es: Belandysh, Campeón Condenado de Chen
  normalization_status: out_of_scope
  warband_rating:
    kind: fixed
    value: 130
  equipment:
    fixed_items:
    - item_id: helmet
      quantity:
        kind: fixed
        value: 1
    unique_equipment:
    - id: hireling.dramatis.belandysh-condemned-champion-of-chen.item.broadsword-of-damnation
      name: Broadsword of Damnation
      name_i18n:
        es: Espada Ancha de la Condenación
    - id: hireling.dramatis.belandysh-condemned-champion-of-chen.item.chaos-armour
      name: Chaos Armour
      name_i18n:
        es: Armadura del Caos
  skill_access: []
  starting_skill_ids:
  - skill.fearsome
  - skill.strongman
  rules:
  - id: hireling.dramatis.belandysh-condemned-champion-of-chen.rule.immune-to-psychology
    name: Immune to Psychology
    effect: Immune to psychology and automatically passes Leadership tests.
    effect_i18n:
      es: >-
        Inmune a la psicología y supera automáticamente las pruebas de Liderazgo.
    name_i18n:
      es: Inmune a la Psicología
  - id: hireling.dramatis.belandysh-condemned-champion-of-chen.rule.inconsistency
    name: Inconsistency
    effect: Variable characteristics are rerolled when required by source.
    effect_i18n:
      es: >-
        Las características variables se vuelven a tirar cuando la fuente lo requiere.
    name_i18n:
      es: Incoherencia
  - id: hireling.dramatis.belandysh-condemned-champion-of-chen.rule.regeneration
    name: Regeneration
    effect: Regenerates wounds on source 4+ except fire/fire magic.
    effect_i18n:
      es: >-
        Regenera heridas con un 4+ de la fuente, excepto contra fuego/magia de fuego.
    name_i18n:
      es: Regeneración
  - id: hireling.dramatis.belandysh-condemned-champion-of-chen.rule.tol-agath
    name: Tol'Agath
    effect: Uses a mutated mount with source rules.
    effect_i18n:
      es: >-
        Usa una montura mutada con las reglas de la fuente.
    name_i18n:
      es: Tol'Agath
  - id: hireling.dramatis.belandysh-condemned-champion-of-chen.rule.wrath-of-tchar
    name: Wrath of Tchar
    effect: Can be permanently lost from campaign under source condition.
    effect_i18n:
      es: >-
        Puede perderse permanentemente de la campaña bajo la condición de la fuente.
    name_i18n:
      es: Ira de Tchar
  unresolved_references:
  - kind: random_profile
    source_name: Belandysh M4 WS D6 BS0 S D6 T D6 W3 I D6 A D3 Ld10
  - kind: mount_profile
    source_name: Tol'Agath M8 WS3 BS0 S D6 T D6 W1 I3 A1 Ld5
  - kind: skill
    source_name: Ride Tol'Agath
  source_refs:
