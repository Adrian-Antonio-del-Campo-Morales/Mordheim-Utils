- id: hireling.dramatis.grand-master-ippan-shu
  kind: dramatis-personae
  grade: 1c
  publication: Border Town Burning Supplement
  name: Grand Master Ippan Shu
  name_i18n:
    es: Gran Maestre Ippan Shu
  normalization_status: normalized
  characteristics:
    M: 4
    WS: 7
    BS: 7
    S: 4
    T: 4
    W: 2
    I: 6
    A: 4
    Ld: 10
  warband_rating:
    kind: fixed
    value: 110
  equipment:
    unique_equipment:
    - id: hireling.dramatis.grand-master-ippan-shu.item.iron-fan
      name: Iron Fan
      counts_as: iron_fan
      name_i18n:
        es: Abanico de Hierro
  # "all Speed skills and Battle Monk special skills except Warmonger": the
  # Speed list is the canonical category; of the Battle Monk members only
  # Energy Focus is admitted (Lightning Speed is movement, Leap of Faith is
  # voluntary escape and Human Shield is multiple combat; Warmonger is
  # excluded by the clause itself), so it keeps its own selectable record.
  skill_access:
  - speed
  starting_skill_ids:
  - skill.art-of-silent-death
  rules:
  - id: hireling.dramatis.grand-master-ippan-shu.rule.bare-handed
    name: Bare-Handed
    effect: >-
      Bare-handed Fighting: Ippan Shu can fight without weapons and suffers no penalties when doing
      so. In fact, he then counts as having a second close combat weapon and gets +1 attack.
    effect_i18n:
      es: >-
        Combate a Mano Limpia: Ippan Shu puede luchar sin armas y no sufre penalización alguna al
        hacerlo. De hecho, entonces cuenta como si tuviera una segunda arma de combate cuerpo a
        cuerpo y recibe +1 ataque.
    name_i18n:
      es: Desarmado
    runtime:
      scope: 'YES'
      implemented: 'YES'
      grant: profile
      effects:
      - id: skill.unarmed-fighting
        scope: 'YES'
        binding:
          kind: mechanic
          id: skill.unarmed-fighting
  - id: hireling.dramatis.grand-master-ippan-shu.rule.iron-fan
    name: Iron Fan
    effect: >-
      Iron Fan: the weapon grants him +1 Initiative and allows him to parry enemy blows. The bearer
      always carries the fan, so its profile is bound here and the printed missile half of the
      clause is classified separately.
    effect_i18n:
      es: >-
        Abanico de Hierro: el arma le otorga +1 Iniciativa y le permite parar golpes enemigos. El
        portador siempre lleva el abanico, así que su perfil se vincula aquí y la mitad de la
        cláusula sobre proyectiles se clasifica por separado.
    name_i18n:
      es: Abanico de Hierro
    runtime:
      scope: 'YES'
      implemented: 'YES'
      grant: profile
      effects:
      - id: mechanic.iron-fan
        scope: 'YES'
        binding:
          kind: mechanic
          id: mechanic.iron-fan
  - id: hireling.dramatis.grand-master-ippan-shu.rule.parry-missiles
    name: Parry Missiles
    effect: >-
      Parry Missiles: for each hit by a missile weapon he parries the shot if he beats the 'to hit'
      roll.
    effect_i18n:
      es: >-
        Parada de Proyectiles: por cada impacto de un arma a distancia para el disparo si supera la
        tirada 'para impactar'.
    name_i18n:
      es: Estocar Proyectiles
    runtime:
      scope: 'NO'
      implemented: 'NO'
      grant: none
      effects:
      - id: ippan-shu-parry-missiles
        scope: 'NO'
        binding: null
        reason: Parrying a missile shot resolves in the shooting phase against a ranged attack; the duel
          resolves one close combat.
  - id: hireling.dramatis.grand-master-ippan-shu.rule.immune-to-psychology
    name: Immune to Psychology
    effect: >-
      Immune to Psychology: Ippan Shu is in total control of his emotions, therefore immune to
      psychology, and automatically passes all Leadership-based tests.
    effect_i18n:
      es: >-
        Inmune a la Psicología: Ippan Shu controla por completo sus emociones, por lo que es inmune a
        la psicología y supera automáticamente todas las tiradas basadas en Liderazgo.
    name_i18n:
      es: Inmune a la Psicología
    runtime:
      grant: profile
      scope: 'YES'
      implemented: 'YES'
      effects:
      - id: mechanic.psychology-immunity
        scope: 'YES'
        binding:
          kind: mechanic
          id: mechanic.psychology-immunity
      - id: mechanic.automatic-leadership
        scope: 'YES'
        binding:
          kind: mechanic
          id: mechanic.automatic-leadership
  - id: hireling.dramatis.grand-master-ippan-shu.rule.feather-movement
    name: Feather Movement
    effect: >-
      With the Elegance of a Feather: when running or charging he may move up to half his movement
      rate in any direction, not only on the ground, and may combine it with the leap skill.
    effect_i18n:
      es: >-
        Con la Elegancia de una Pluma: al correr o cargar puede moverse hasta la mitad de su ritmo de
        movimiento en cualquier dirección, no solo por el suelo, y puede combinarlo con la habilidad
        de salto.
    name_i18n:
      es: Movimiento de Pluma
    runtime:
      scope: 'NO'
      implemented: 'NO'
      grant: none
      effects:
      - id: ippan-shu-feather-movement
        scope: 'NO'
        binding: null
        reason: Free movement, three-dimensional charge paths and the leap combination are movement and
          boarding rules; the duel resolves a close combat between two models.
  - id: hireling.dramatis.grand-master-ippan-shu.rule.fire-breath
    name: Fire Breath
    effect: >-
      Way of the Dragon: in the shooting phase he spits fire, using the flame template to hit models
      at Strength 4 and setting them on fire on 4+; he may also use it while engaged in close
      combat.
    effect_i18n:
      es: >-
        Vía del Dragón: en la fase de disparo escupe fuego, usando la plantilla de llama para impactar
        a Fuerza 4 y prendiéndolos fuego con 4+; también puede usarlo mientras está trabado en
        combate cuerpo a cuerpo.
    name_i18n:
      es: Aliento de Fuego
    runtime:
      scope: 'NO'
      implemented: 'NO'
      grant: none
      effects:
      - id: ippan-shu-fire-breath
        scope: 'NO'
        binding: null
        reason: The breath is a shooting-phase flame-template producer against a group of models; the single
          opposing duellist is not the printed recipient of a template attack.
  - id: hireling.dramatis.grand-master-ippan-shu.rule.campaign-eligibility
    name: Dynamic Hiring Eligibility — Human or Elf Composition
    effect: >-
      Ippan Shu may only be hired when the current warband includes Humans or Elves. Dark Elves,
      Outlaws and Bandits are excluded statically in the campaign catalog.
    effect_i18n:
      es: >-
        Ippan Shu solo puede contratarse cuando la banda actual incluye Humanos o Elfos. Elfos Oscuros,
        Proscritos y Bandidos están excluidos estáticamente en el catálogo de campaña.
    name_i18n:
      es: Elegibilidad de Contratación Dinámica — Composición Humana o Élfica
    runtime:
      scope: 'NO'
      implemented: 'NO'
      grant: none
      effects:
      - id: ippan-shu-campaign-eligibility
        scope: 'NO'
        binding: null
        reason: Hiring based on the roster's composition is a campaign consequence.
  - id: hireling.dramatis.grand-master-ippan-shu.skill.energy-focus
    name: Energy Focus
    name_i18n:
      es: Concentración de Energía
    effect: >-
      If fighting unarmed, the Hero may choose to reduce his Attacks by –1 and thus gain +1 Strength
      in close combat. The monk may sacrifice any number of attacks this way.
    effect_i18n:
      es: >-
        Si lucha sin armas, el héroe puede optar por reducir sus Ataques en -1 y ganar así +1 Fuerza
        en el combate cuerpo a cuerpo. El monje puede sacrificar cualquier número de ataques de esta
        manera.
    kind: warband_skill
    eligibility:
    - hireling.dramatis.grand-master-ippan-shu
    runtime:
      scope: 'YES'
      implemented: 'YES'
      grant: selectable
      effects:
      - id: mechanic.energy-focus
        scope: 'YES'
        binding:
          kind: mechanic
          id: mechanic.energy-focus
    source_refs:
    - manual: mordheimer.net
      printed_page: 0
      section: Battle Monks Special Skills / Energy Focus
      url: https://mordheimer.net/docs/warbands/grade-1c-warbands/battle-monks-of-cathay
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Dramatis Personae / Grand Master Ippan Shu
    url: https://mordheimer.net/docs/campaigns/dramatis-personae/grade-1c
