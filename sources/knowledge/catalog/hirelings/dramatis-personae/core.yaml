- id: hireling.dramatis.veskit.rule.integrated-warplock-pistols
  name: Integrated Warplock Pistols
  effect: >-
    Both Eshin Fighting Claws have integral Warplock Pistols. In close combat Veskit uses fixed
    Strength 5 with a total -3 armour-save modifier. The extra Attack is already included in his
    printed A4. The claws retain their parry and failed-parry reroll under the adopted paired-claw
    convention; shooting is excluded.
  effect_i18n:
    es: >-
      Ambas Garras de Combate Eshin incorporan Pistolas Warplock. En combate cuerpo a cuerpo Veskit
      usa Fuerza fija 5 con un modificador total de -3 a la salvación de armadura. El Ataque extra
      ya está incluido en su A4 impreso. Las garras conservan su parada y la repetición tras una
      parada fallida según la convención adoptada de garras emparejadas; el disparo queda excluido.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Dramatis Personae / Veskit / Weapons and Armour
    url: https://mordheimer.net/docs/campaigns/dramatis-personae/grade-1a
  name_i18n:
    es: Pistolas Warplock Integradas
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: weapon.veskit-claws
      scope: 'YES'
      binding:
        kind: mechanic
        id: weapon.veskit-claws
