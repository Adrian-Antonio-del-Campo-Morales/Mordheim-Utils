rules:
- id: hireling.dramatis.aenur.rule.invincible-swordsman
  name: Invincible Swordsman
  effect: Aenur hits opponents on 2+ in hand-to-hand combat.
  effect_i18n:
    es: >-
      Aenur golpea a sus oponentes con 2+ en combate cuerpo a cuerpo.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Dramatis Personae / Aenur / Special Rules / Invincible Swordsman
    url: https://mordheimer.net/docs/campaigns/dramatis-personae/grade-1a
  name_i18n:
    es: Espadachín Invencible
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: mechanic.invincible-swordsman
      scope: 'YES'
      binding:
        kind: mechanic
        id: mechanic.invincible-swordsman
- id: hireling.dramatis.aenur.rule.wanderer
  name: Wanderer
  effect: >-
    Aenur stays for one battle only; a warband must fight at least one battle without him before it
    may search for him again.
  effect_i18n:
    es: >-
      Aenur solo permanece una batalla; una banda debe luchar al menos una batalla sin él antes de poder
      volver a buscarlo.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Dramatis Personae / Aenur / Special Rules / Wanderer
    url: https://mordheimer.net/docs/campaigns/dramatis-personae/grade-1a
  name_i18n:
    es: Errante
  runtime:
    grant: profile
    scope: 'NO'
    implemented: 'NO'
    effects:
    - id: aenur.wanderer.non-duel
      scope: 'NO'
      binding: null
      reason: >-
        Hiring, searching and campaign attendance are excluded; this rule grants no in-duel
        withdrawal.
