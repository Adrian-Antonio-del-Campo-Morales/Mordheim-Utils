rules:
- id: hireling.dramatis.aenur.rule.invincible-swordsman
  name: Invincible Swordsman
  effect: Aenur hits opponents on 2+ in hand-to-hand combat.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Dramatis Personae / Aenur / Special Rules / Invincible Swordsman
    url: https://mordheimer.net/docs/campaigns/dramatis-personae/grade-1a
- id: hireling.dramatis.aenur.rule.wanderer
  name: Wanderer
  effect: Aenur stays for one battle only; a warband must fight at least one battle without him before it may search for him again.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Dramatis Personae / Aenur / Special Rules / Wanderer
    url: https://mordheimer.net/docs/campaigns/dramatis-personae/grade-1a
- id: hireling.dramatis.aenur.item.ienh-khain.rule.parry
  name: 'Ienh-Khain: Parry'
  effect: Ienh-Khain can parry.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Dramatis Personae / Aenur / Ienh-Khain
    url: https://mordheimer.net/docs/campaigns/dramatis-personae/grade-1a
- id: hireling.dramatis.aenur.item.ienh-khain.rule.strength
  name: 'Ienh-Khain: Strength'
  effect: Ienh-Khain adds +1 Strength.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Dramatis Personae / Aenur / Ienh-Khain
    url: https://mordheimer.net/docs/campaigns/dramatis-personae/grade-1a
- id: hireling.dramatis.aenur.item.ienh-khain.rule.critical
  name: 'Ienh-Khain: Critical'
  effect: Ienh-Khain causes a critical hit on a wound roll of 5-6.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Dramatis Personae / Aenur / Ienh-Khain
    url: https://mordheimer.net/docs/campaigns/dramatis-personae/grade-1a
- id: hireling.dramatis.bertha-bestraufrung.rule.high-matriarch
  name: High Matriarch
  effect: Bertha automatically becomes the leader of a warband she joins.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Dramatis Personae / Bertha Bestraufrung / Special Rules / High Matriarch
    url: https://mordheimer.net/docs/campaigns/dramatis-personae/grade-1a
- id: hireling.dramatis.bertha-bestraufrung.rule.sigmars-handmaiden
  name: Sigmar's Handmaiden
  effect: Bertha receives +2 on rolls to determine whether her Prayers of Sigmar are granted.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Dramatis Personae / Bertha Bestraufrung / Special Rules / Sigmar's Handmaiden
    url: https://mordheimer.net/docs/campaigns/dramatis-personae/grade-1a
- id: hireling.dramatis.johann-the-knife.rule.poisoned-weapons
  name: Poisoned Weapons
  effect: Johann's weapons are always coated with Black Lotus.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Dramatis Personae / Johann the Knife / Weapons and Armour
    url: https://mordheimer.net/docs/campaigns/dramatis-personae/grade-1a
- id: hireling.dramatis.johann-the-knife.rule.crimson-shade
  name: Crimson Shade
  effect: Johann may take Crimson Shade before a battle.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Dramatis Personae / Johann the Knife / Weapons and Armour
    url: https://mordheimer.net/docs/campaigns/dramatis-personae/grade-1a
- id: hireling.dramatis.johann-the-knife.rule.knife-fighter-extraordinaire
  name: Knife Fighter Extraordinaire
  effect: Johann may combine Knife-Fighter and Quick Shot when using throwing knives.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Dramatis Personae / Johann the Knife / Special Rules / Knife Fighter Extraordinaire
    url: https://mordheimer.net/docs/campaigns/dramatis-personae/grade-1a
- id: hireling.dramatis.veskit.rule.integrated-warplock-pistols
  name: Integrated Warplock Pistols
  effect: Veskit's fighting claws incorporate Warplock Pistols; his listed extra Attack is already included in the profile and his claw attacks use the special Strength/save-modifier rules from his entry.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Dramatis Personae / Veskit / Weapons and Armour
    url: https://mordheimer.net/docs/campaigns/dramatis-personae/grade-1a
- id: hireling.dramatis.veskit.rule.unfeeling
  name: Unfeeling
  effect: Veskit is immune to psychology.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Dramatis Personae / Veskit / Special Rules / Unfeeling
    url: https://mordheimer.net/docs/campaigns/dramatis-personae/grade-1a
- id: hireling.dramatis.veskit.rule.no-pain
  name: No Pain
  effect: Veskit ignores Knocked Down and Stunned injury results and remains until his last Wound is lost.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Dramatis Personae / Veskit / Special Rules / No Pain
    url: https://mordheimer.net/docs/campaigns/dramatis-personae/grade-1a
- id: hireling.dramatis.veskit.rule.unblinking-eye
  name: Unblinking Eye
  effect: Veskit detects Hidden enemies within twice his Initiative value in inches.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Dramatis Personae / Veskit / Special Rules / Unblinking Eye
    url: https://mordheimer.net/docs/campaigns/dramatis-personae/grade-1a
- id: hireling.dramatis.veskit.rule.metallic-body
  name: Metallic Body
  effect: Veskit has a 3+ armour save from his mechanical body.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Dramatis Personae / Veskit / Special Rules / Metallic Body
    url: https://mordheimer.net/docs/campaigns/dramatis-personae/grade-1a
