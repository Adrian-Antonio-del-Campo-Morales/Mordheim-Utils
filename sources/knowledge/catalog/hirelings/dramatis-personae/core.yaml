  name_i18n:
    es: Gran Matriarca
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: none
    effects:
    - id: bertha-high-matriarch
      scope: 'NO'
      binding: null
      reason: >-
        Becoming the warband leader automatically is a roster position settled when she joins; the
        duel's participants and any supplied nearby leader are given at construction.
