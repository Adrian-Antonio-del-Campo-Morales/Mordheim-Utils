- id: hireling.dramatis.bertha-bestraufrung.rule.high-matriarch
  name: High Matriarch
  effect: Bertha automatically becomes the leader of a warband she joins.
  effect_i18n:
    es: >-
      Bertha se convierte automáticamente en la líder de la banda a la que se une.
  source_refs:
