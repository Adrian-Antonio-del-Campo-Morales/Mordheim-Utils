# Intrinsic traits of the hireling profiles.
#
# Canonical, reviewable declaration of the race/alignment/nature facts the
# campaign-eligibility rules reason about (registry file of this catalogue:
# one row per profile that carries at least one trait). The application's
# dynamic eligibility rules read these traits instead of maintaining their
# own curated sets; every profile_id resolves against catalog/hirelings/**.
#
# Traits are the *stable semantic facts* of the warrior (race, fear-causing,
# evil, spellcaster, priest). Availability, fees and static eligibility stay
# in catalog/campaign/hired-swords-and-dramatis.yaml; the campaign-eligibility
# rules stay in the profiles' `rules` (evaluated by the application).
schema_version: 2
ruleset: mordheim
catalog: hirelings-traits
status: published
traits:
