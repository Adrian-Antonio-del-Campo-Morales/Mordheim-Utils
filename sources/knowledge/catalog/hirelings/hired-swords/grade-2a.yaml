        scope: 'YES'
        binding:
          kind: mechanic
          id: mechanic.daemonic-flesh
      - id: trait.natural-armour-save
        scope: 'YES'
        binding:
          kind: trait
          id: trait.natural-armour-save
          parameters:
            value: 5
      - id: trait.natural-armour-unmodified
        scope: 'YES'
        binding:
          kind: trait
          id: trait.natural-armour-unmodified
          parameters:
            value: true
