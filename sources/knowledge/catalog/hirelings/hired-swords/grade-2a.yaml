  - id: hireling.hired-sword.halfling-knight.rule.slay-large-creature
    name: Slay Large Creature
    effect: >-
      A Halfling Knight, when charging a Large sized creature, gains +1S. This is in addition to the
      +1S he gains simply for charging with a cavalry spear. The Large size of the charged target is
      supplied as a duel fact; no size trait is assumed for the opponent.
    effect_i18n:
      es: >-
        Un Caballero Halfling, al cargar contra una criatura de tamaño Grande, gana +1F. Esto se suma
        al +1F que ya obtiene simplemente por cargar con una lanza de caballería. El tamaño Grande del
        objetivo cargado se aporta como hecho del duelo; no se supone ningún rasgo de tamaño al oponente.
    name_i18n:
      es: Matar Criatura Grande
    runtime:
      scope: 'YES'
      implemented: 'YES'
      grant: profile
      effects:
      - id: slay-large-creature
        scope: 'YES'
        binding: {kind: mechanic, id: rule.slay-large-creature}
  unresolved_references:
  - kind: companion_profile
    source_name: Hound M5* WS4 BS0 S4 T3 W1 I4 A1 Ld5
    note: The Hound and the barding are the mounted/companion kit of this printed entry, which the 1v1 duel does not put on the table; no mount is enabled.
  - kind: equipment_mapping
    source_name: Cavalry Spear
    note: >-
      The unique object declares no canonical combat mapping and none is faithful. The source prints
      +1S for charging with a cavalry spear; the canonical spear prints only 'strike first', and the
      canonical lance is a mounted +2 weapon that may only be used on horseback, so substituting
      either one would drop or replace the printed property. The profile is therefore refused by name
      instead of being unblocked with an unfaithful item. Slay Large Creature's own +1S on the charge
      is bound and delivered independently of this block.
