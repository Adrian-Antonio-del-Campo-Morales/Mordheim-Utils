- id: hireling.hired-sword.cursed-hillman
  kind: hired-sword
  grade: 2a
  publication: Fanatic Online 49
  name: Cursed Hillman
  name_i18n:
    es: Montañés Maldito
  normalization_status: normalized
  characteristics:
    M: 4
    WS: 3
    BS: 4
    S: 3
    T: 3
    W: 1
    I: 3
    A: 1
    Ld: 8
  warband_rating:
    kind: base_plus_experience
    base: 20
    per_experience_point: 1
  equipment:
    fixed_items:
    - item_id: axe
      quantity:
        kind: fixed
        value: 1
    - item_id: dagger
      quantity:
        kind: fixed
        value: 1
    - item_id: long_bow
      quantity:
        kind: fixed
        value: 1
    unique_equipment:
    - id: hireling.hired-sword.cursed-hillman.item.fur-cloak
      name: Fur Cloak
      rules: [hireling.hired-sword.cursed-hillman.rule.lycanthrope]
      name_i18n:
        es: Capa de Piel
  skill_access:
  - shooting
  - speed
  - special
  starting_skill_ids: []
  rules:
  - id: hireling.hired-sword.cursed-hillman.rule.hunter
    name: Hunter
    effect: >-
      The Cursed Hillman has had to learn to survive in the bleak wilderness of the Empire.
      As such, he is incredibly skilled with his bow. He may move at half-rate, and still fire
      his bow without penalty.
    effect_i18n:
      es: >-
        El Montañés Maldito ha tenido que aprender a sobrevivir en la árida naturaleza del Imperio, y
        por ello es increíblemente hábil con su arco. Puede moverse a media velocidad y aun así
        disparar su arco sin penalización.
    name_i18n:
      es: Cazador
    runtime:
      scope: 'NO'
      implemented: 'NO'
      grant: profile
      effects:
      - id: moving-bow-shot
        scope: 'NO'
        binding: null
        reason: >-
          Movement and shooting resolution are outside the duel.
  - id: hireling.hired-sword.cursed-hillman.rule.thin-flesh
    name: Thin Flesh
    effect: >-
      Thin Flesh: through his constant changing into lupine form and back, his flesh has weakened to
      ease the transformation; he counts as having -1 Toughness in hand-to-hand combat. His
      Toughness is otherwise unchanged outside close combat.
    effect_i18n:
      es: >-
        Carne Débil: debido a su constante transformación en forma lupina y de vuelta, su carne se ha
        debilitado para facilitar el cambio; cuenta como si tuviera -1 Resistencia en combate cuerpo
        a cuerpo. Fuera del cuerpo a cuerpo su Resistencia no cambia.
    name_i18n:
      es: Carne Flaca
    runtime:
      scope: 'YES'
      implemented: 'YES'
      grant: profile
      effects:
      - id: thin-flesh
        scope: 'YES'
        binding: {kind: mechanic, id: rule.thin-flesh}
  - id: hireling.hired-sword.cursed-hillman.rule.lycanthrope
    name: Lycanthrope
    effect: >-
      While in man-form, the Hillman is armed with an Axe, a Dagger, and a Longbow. He wears a
      heavy fur cloak which offers him an AS of 5+ versus ranged attacks, and 6+ in close combat.
      When in wolf-form, all garments and weapons are discarded. These are collected after the
      battle. The werewolf uses only its teeth and claws in close combat, and suffers no penalties
      for doing so. Man profile M4 WS3 BS4 S3 T3 W1 I3 A1 Ld8; Wolf M7 WS4 BS0 S4 T4 W2 I5 A2(3) Ld6.
      The Cursed Hillman is a werewolf. Any time he loses a wound, he must roll a D6. On a roll of
      4+, the beast within escapes and he transforms into a werewolf. Ignore any injury table rolls.
      Should he not transform, roll on the injury table at -1 (thus knocked down is 2-3, stunned
      is 4-5, and OOA is on a 6 only). While in wolf-form, he has a bonus Bite attack resolved at -1S.
      Control (special skill): during the shooting phase transform on 2+; failure leaves him static
      and knocked down until completely transformed at the beginning of his controller's next turn.
      Rage (requires Control): +1WS, +1S, +1I and an extra attack from an off-hand transformed claw.
      No in-battle reversion is printed.
    effect_i18n:
      es: >-
        En forma de hombre, el Montañés va armado con un Hacha, una Daga y un Arco Largo. Lleva una
        pesada capa de piel que le ofrece una salvación de armadura de 5+ contra ataques a distancia
        y de 6+ en combate cuerpo a cuerpo. En forma de lobo descarta todas las prendas y armas, que
        se recogen después de la batalla. El hombre lobo solo usa sus dientes y garras en combate
        cuerpo a cuerpo y no sufre penalización por ello. Perfil humano M4 HA3 HP4 F3 R3 H1 I3 A1
        Ld8; lobo M7 HA4 HP0 F4 R4 H2 I5 A2(3) Ld6. El Montañés Maldito es un hombre lobo. Cada vez
        que pierde una herida debe tirar un D6: con 4+ la bestia interior escapa y se transforma en
        hombre lobo, ignorando cualquier tirada de la tabla de heridas. Si no se transforma, tira en
        la tabla de heridas con -1 (de modo que Derribado es 2-3, Aturdido 4-5 y Fuera de Combate
        solo con un 6). En forma de lobo tiene un ataque de Mordisco adicional resuelto a -1F.
        Control (habilidad especial): durante la fase de disparo se transforma con 2+; si falla,
        queda inmóvil y Derribado hasta transformarse por completo al inicio del siguiente turno de
        su controlador. Furia (requiere Control): +1HA, +1F, +1I y un ataque extra con una garra
        transformada de la mano secundaria. La fuente no imprime reversión en batalla.
    name_i18n:
      es: Licántropo
    runtime:
      scope: 'YES'
      implemented: 'YES'
      grant: profile
      effects:
      - id: wound-transformation
        scope: 'YES'
        binding: {kind: mechanic, id: mechanic.hillman-lycanthrope}
      - id: man-cloak
        scope: 'YES'
        binding: {kind: trait, id: trait.natural-armour-save, parameters: {value: 6}}
      - id: shooting-and-collection
        scope: 'NO'
        binding: null
        reason: >-
          Ranged cloak save, shooting-phase Control and post-battle equipment collection are outside
          the duel; Rage is an unselected advancement skill.
  - id: hireling.hired-sword.cursed-hillman.rule.wolf-form
    name: Wolf Form
    name_i18n:
      es: Forma de Lobo
    effect: >-
      While in wolf-form the Hillman discards every garment and weapon; the werewolf uses only its
      teeth and claws in close combat, suffers no penalties for doing so, and has a bonus Bite
      attack resolved at -1 Strength. Wolf profile M7 WS4 BS0 S4 T4 W2 I5 A2(3) Ld6.
    effect_i18n:
      es: >-
        En forma de lobo el Montañés descarta todas las prendas y armas; el hombre lobo usa solo sus
        dientes y garras en combate cuerpo a cuerpo sin penalización y tiene un ataque de Mordisco a
        -1F. Perfil de lobo M7 HA4 HP0 F4 R4 H2 I5 A2(3) Ld6.
    kind: special-skill-option
    eligibility:
    - hireling.hired-sword.cursed-hillman
    runtime:
      scope: 'YES'
      implemented: 'YES'
      grant: selectable
      effects:
      - id: wolf-form-stats
        scope: 'YES'
        binding:
          kind: profile
          id: profile.characteristics
          parameters:
            profile_ids:
            - hireling.hired-sword.cursed-hillman
            bonuses:
              movement: 3
              weapon_skill: 1
              strength: 1
              toughness: 1
              wounds: 1
              initiative: 2
              attacks: 1
              leadership: -2
      # The printed kit is not destroyed: it is discarded for the form and
      # collected after the battle, so ownership stays legal while the duel
      # runs the werewolf state (`equipment_for_state` ignores every carried
      # item and supplies the -1S Bite).
      - id: wolf-form-discarded-kit
        scope: 'YES'
        binding:
          kind: compiler
          id: compiler.hillman-wolf-form
      # The heavy fur cloak is a garment, so the wolf form carries no 6+ save;
      # the printed wolf line has no armour of its own.
      - id: wolf-form-no-cloak
        scope: 'YES'
        binding:
          kind: trait
          id: trait.natural-armour-save
          parameters:
            value: 7
    source_refs:
    - manual: mordheimer.net
      printed_page: 0
      section: Hired Swords / Cursed Hillman / Lycanthrope
      url: https://mordheimer.net/docs/campaigns/hired-swords/grade-2a
  special_skill_rule_ids:
  - hireling.hired-sword.cursed-hillman.rule.wolf-form
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Hired Swords / Cursed Hillman
    url: https://mordheimer.net/docs/campaigns/hired-swords/grade-2a
