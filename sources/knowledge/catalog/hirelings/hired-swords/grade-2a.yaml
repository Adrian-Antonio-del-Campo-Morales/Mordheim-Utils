  rules:
  - id: hireling.hired-sword.chaos-fury.rule.fear
    name: Fear
    effect: Causes fear.
    effect_i18n:
      es: >-
        Causa miedo.
    name_i18n:
      es: Miedo
    runtime:
      grant: profile
      scope: 'YES'
      implemented: 'YES'
      effects:
      - id: mechanic.causes-fear
        scope: 'YES'
        binding:
          kind: mechanic
          id: mechanic.causes-fear
  - id: hireling.hired-sword.chaos-fury.rule.daemonic-flesh
    name: Daemonic Flesh
    effect: >-
      A 5+ base armour save is never modified and is entirely negated by magical or blessed weapons
      and spells. All of the daemon's close combat attacks count as magical.
    effect_i18n:
      es: >-
        Una salvación de armadura base de 5+ nunca se modifica y es anulada por completo por armas y
        conjuros mágicos o bendecidos. Todos los ataques cuerpo a cuerpo del demonio cuentan como
        mágicos.
    name_i18n:
      es: Carne Demoníaca
    runtime:
      scope: 'YES'
      implemented: 'YES'
      grant: profile
      effects:
      - id: mechanic.daemonic-flesh
        scope: 'YES'
        binding:
          kind: mechanic
          id: mechanic.daemonic-flesh
      - id: trait.natural-armour-save
        scope: 'YES'
        binding:
          kind: trait
          id: trait.natural-armour-save
          parameters:
            value: 5
      - id: trait.natural-armour-unmodified
        scope: 'YES'
        binding:
          kind: trait
          id: trait.natural-armour-unmodified
          parameters:
            value: true
      - id: trait.creature-kind
        scope: 'YES'
        binding:
          kind: trait
          id: trait.creature-kind
          parameters:
            value: daemon
    source_refs:
    - manual: chaos-fury
      printed_page: 1
      section: Daemonic Flesh
      url: https://www.broheim.net/downloads/hiredswords/facebook/Chaos%20Fury.pdf
  - id: hireling.hired-sword.chaos-fury.rule.daemonic-mind
    name: Daemonic Mind
    effect: Does not gain Experience and is immune to psychology.
    effect_i18n:
      es: >-
        No gana Experiencia y es inmune a la psicología.
    name_i18n:
      es: Mente Demoníaca
    runtime:
      grant: profile
      scope: 'YES'
      implemented: 'YES'
      effects:
      - id: mechanic.psychology-immunity
        scope: 'YES'
        binding:
          kind: mechanic
          id: mechanic.psychology-immunity
  - id: hireling.hired-sword.chaos-fury.rule.instability
    name: Instability
    effect: Uses the source banishment rule.
    effect_i18n:
      es: >-
        Usa la regla de destierro de la fuente.
    name_i18n:
      es: Inestabilidad
    runtime:
