schema_version: 1
ruleset: mordheim
catalog: hirelings-hired-swords
grade: 1c
profiles:
- id: hireling.hired-sword.bone-goliath
  kind: hired-sword
  grade: 1c
  publication: Border Town Burning Supplement
  name: Bone Goliath
  name_i18n:
    es: Goliat de Huesos
  normalization_status: normalized
  characteristics:
    M: 5
    WS: 3
    BS: 0
    S: 5
    T: 5
    W: 3
    I: 2
    A: 3
    Ld: 6
  warband_rating:
    kind: fixed
    value: 50
  equipment:
    innate_weapon_id: weapon.natural-attacks
  skill_access: []
  starting_skill_ids: []
  rules:
  - id: hireling.hired-sword.bone-goliath.rule.cause-fear
    name: Cause Fear
    effect: Causes fear.
    effect_i18n:
      es: >-
        Causa miedo.
    name_i18n:
      es: Causan Miedo
    runtime:
      grant: profile
      scope: 'YES'
      implemented: 'YES'
      effects:
      - id: mechanic.causes-fear
        scope: 'YES'
        binding:
          kind: mechanic
          id: mechanic.causes-fear
  - id: hireling.hired-sword.bone-goliath.rule.may-not-run
    name: May Not Run
    effect: May not run but may charge.
    effect_i18n:
      es: >-
        No puede correr, pero puede cargar.
    name_i18n:
      es: No Pueden Correr
    runtime:
      scope: 'NO'
      implemented: 'NO'
      grant: none
      effects:
      - id: bone-goliath-may-not-run
        scope: 'NO'
        binding: null
        reason: >-
          Running is a movement mechanic; the duel resolves a close combat, so the prohibition has
          no consumer.
  - id: hireling.hired-sword.bone-goliath.rule.immune-to-psychology
    name: Immune to Psychology
    effect: Immune to psychology.
    effect_i18n:
      es: >-
        Inmune a la psicología.
    name_i18n:
      es: Inmune a la Psicología
    runtime:
      grant: profile
      scope: 'YES'
      implemented: 'YES'
      effects:
      - id: mechanic.psychology-immunity
        scope: 'YES'
        binding:
          kind: mechanic
          id: mechanic.psychology-immunity
  - id: hireling.hired-sword.bone-goliath.rule.immune-to-poison
    name: Immune to Poison
    effect: Immune to poison.
    effect_i18n:
      es: >-
        Inmune al veneno.
    name_i18n:
      es: Inmune al Veneno
    runtime:
      scope: 'YES'
      implemented: 'YES'
      grant: profile
      effects:
      - id: trait.poison-immune
        scope: 'YES'
        binding:
          kind: trait
          id: trait.poison-immune
          parameters:
            value: true
  - id: hireling.hired-sword.bone-goliath.rule.undead-construct
    name: Undead Construct
    effect: >-
      For each Injury result roll a D6: on 4+ the result is ignored, without restoring lost Wounds.
      Magical attacks and magical weapons bypass this roll. The ordinary Undead No Pain conversion
      still applies independently.
    effect_i18n:
      es: >-
        Por cada resultado de Herida tira un D6: con 4+ el resultado se ignora, sin recuperar las
        Heridas perdidas. Los ataques mágicos y las armas mágicas ignoran esta tirada. La conversión
        ordinaria de Insensible al Dolor de los No Muertos se sigue aplicando de forma
        independiente.
    name_i18n:
      es: Constructo No Muerto
    runtime:
      scope: 'YES'
      implemented: 'YES'
      grant: profile
      effects:
      - id: mechanic.undead-construct
        scope: 'YES'
        binding:
          kind: mechanic
          id: mechanic.undead-construct
      - id: skill.ignore-pain
        scope: 'YES'
        binding:
          kind: mechanic
          id: skill.ignore-pain
    source_refs:
    - manual: border-town-burning
      printed_page: 173
      section: Bone Goliath / Undead Construct
      url: https://tonightwedineinmordheim.com/pdf/btb_pt3_lq.pdf
  - id: hireling.hired-sword.bone-goliath.rule.assembly
    name: Assembly
    effect: Is constructed by a Liche with the source cost/consequences.
    effect_i18n:
      es: >-
        Es construido por un Liche con el coste/consecuencias de la fuente.
    name_i18n:
      es: Ensamblaje
    runtime:
      scope: 'NO'
      implemented: 'NO'
      grant: none
      effects:
      - id: bone-goliath-assembly
        scope: 'NO'
        binding: null
        reason: >-
          Assembly is the campaign construction of the Goliath by a Liche, with cost and
          consequences outside the duel.
  - id: hireling.hired-sword.bone-goliath.rule.large
    name: Large
    effect: Counts as a large target.
    effect_i18n:
      es: >-
        Cuenta como objetivo grande.
    name_i18n:
      es: Grande
    runtime:
      scope: 'NO'
      implemented: 'NO'
      grant: none
      effects:
      - id: bone-goliath-large
        scope: 'NO'
        binding: null
        reason: >-
          Being a Large target is a shooting-resolution definition with no admitted close-combat
          consequence.
  - id: hireling.hired-sword.bone-goliath.rule.no-pain
    name: No Pain
    effect: Treats Stunned as Knocked Down.
    effect_i18n:
      es: >-
        Trata Aturdido como Derribado.
    name_i18n:
      es: Sin Dolor
    runtime:
      grant: profile
      scope: 'YES'
      implemented: 'YES'
      effects:
      - id: skill.ignore-pain
        scope: 'YES'
        binding:
          kind: mechanic
          id: skill.ignore-pain
  - id: hireling.hired-sword.bone-goliath.rule.mindless
    name: Mindless
    effect: Never gains Experience.
    effect_i18n:
      es: >-
        Nunca gana Experiencia.
    name_i18n:
      es: Carente de Mente
    runtime:
      scope: 'NO'
      implemented: 'NO'
      grant: none
      effects:
      - id: bone-goliath-mindless
        scope: 'NO'
        binding: null
        reason: >-
          Experience gain is campaign progression; no consumer exists in the duel.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Hired Swords / Bone Goliath
    url: https://mordheimer.net/docs/campaigns/hired-swords/grade-1c
- id: hireling.hired-sword.cathayan-merchant
  kind: hired-sword
  grade: 1c
  publication: Border Town Burning Supplement
  name: Cathayan Merchant
  name_i18n:
    es: Mercader de Cathay
  normalization_status: normalized
  characteristics:
    M: 4
    WS: 2
    BS: 2
    S: 3
    T: 3
    W: 1
    I: 4
    A: 1
    Ld: 7
  warband_rating:
    kind: base_plus_experience
    base: 10
    per_experience_point: 1
  equipment:
    fixed_items:
    - item_id: sword
      quantity:
        kind: fixed
        value: 1
  skill_access:
  - academic
  - special
  starting_skill_ids:
  - skill.haggle
  rules:
  - id: hireling.hired-sword.cathayan-merchant.rule.pawnbroker
    name: Pawnbroker
    effect: Uses merchant sale-price rule.
    effect_i18n:
      es: >-
        Usa la regla de precio de venta del mercader.
    name_i18n:
      es: Prestamista
    runtime:
      scope: 'NO'
      implemented: 'NO'
      grant: none
      effects:
      - id: cathayan-merchant-pawnbroker-excluded
        scope: 'NO'
        binding: null
        reason: >-
          The improved merchant sale proceeds are settled during the post-battle trading phase and
          no duel-time consequence remains.
  - id: hireling.hired-sword.cathayan-merchant.rule.marketeer
    name: Marketeer
    effect: Uses special-market rule.
    effect_i18n:
      es: >-
        Usa la regla de mercado especial.
    name_i18n:
      es: Comerciante
    runtime:
      scope: 'NO'
      implemented: 'NO'
      grant: none
      effects:
      - id: cathayan-merchant-marketeer-excluded
        scope: 'NO'
        binding: null
        reason: >-
          Searching a special merchant market after a battle is a campaign acquisition action with
          no consequence in a resolved duel.
  - id: hireling.hired-sword.cathayan-merchant.rule.stone-cutter
    name: Stone Cutter
    effect: Uses source stone-cutting rule.
    effect_i18n:
      es: >-
        Usa la regla de tallado de piedra de la fuente.
    name_i18n:
      es: Cortador de Piedra
    runtime:
      scope: 'NO'
      implemented: 'NO'
      grant: none
      effects:
      - id: cathayan-merchant-stone-cutter-excluded
        scope: 'NO'
        binding: null
        reason: >-
          Refining wyrdstone when the warband sells it is a post-battle trading income clause with
          no consequence in a resolved duel.
  - id: hireling.hired-sword.cathayan-merchant.rule.guardian
    name: Guardian
    effect: Uses source guardian rule.
    effect_i18n:
      es: >-
        Usa la regla de guardián de la fuente.
    name_i18n:
      es: Guardián
    runtime:
      scope: 'NO'
      implemented: 'NO'
      grant: none
      effects:
      - id: cathayan-merchant-guardian-excluded
        scope: 'NO'
        binding: null
        reason: >-
          The printed Guardian is a second model with its own profile that intercepts shooting and
          charges aimed at the Merchant; a second independent fighter is outside the resolved duel
          and the acquisition is a roster matter.
  - id: hireling.hired-sword.cathayan-merchant.rule.campaign-eligibility
    name: Dynamic Hiring Eligibility — Human or Dwarf Composition
    effect: >-
      The Cathayan Merchant may only be hired when the current warband includes Humans or Dwarfs;
      Battle Monks of Cathay are explicitly included by the source.
    effect_i18n:
      es: >-
        El Mercader de Cathay solo puede ser contratado cuando la banda actual incluya Humanos o
        Enanos; los Monjes Guerreros de Cathay están explícitamente incluidos por la fuente.
    name_i18n:
      es: Elegibilidad de Contratación Dinámica — Composición Humana o Enana
    runtime:
      scope: 'NO'
      implemented: 'NO'
      grant: none
      effects:
      - id: cathayan-merchant-campaign-eligibility-excluded
        scope: 'NO'
        binding: null
        reason: >-
          The roster-composition restriction is evaluated when the warband is hired and has no duel-time consequence.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Hired Swords / Cathayan Merchant
    url: https://mordheimer.net/docs/campaigns/hired-swords/grade-1c
- id: hireling.hired-sword.chaos-centaur
  kind: hired-sword
  grade: 1c
  publication: Border Town Burning Supplement
  name: Chaos Centaur
  name_i18n:
    es: Centauro del Caos
  normalization_status: normalized
  characteristics:
    M: 8
    WS: 4
    BS: 3
    S: 4
    T: 3
    W: 1
    I: 3
    A: 1
    Ld: 7
  warband_rating:
    kind: base_plus_experience
    base: 20
    per_experience_point: 1
  equipment:
    fixed_items:
    - item_id: throwing_axe
      quantity:
        kind: fixed
        value: 1
    - item_id: shield
      quantity:
        kind: fixed
        value: 1
    choices:
    - id: hireling.hired-sword.chaos-centaur.weapon-choice
      choose: 1
      options:
      - items:
        - item_id: sword
          quantity:
            kind: fixed
            value: 1
      - items:
        - item_id: spear
          quantity:
            kind: fixed
            value: 1
          notes: The source treats this Centaur spear as cavalry +1 Strength when charging.
  skill_access:
  - combat
  - strength
  starting_skill_ids: []
  rules:
  - id: hireling.hired-sword.chaos-centaur.rule.drunken
    name: Drunken
    effect: >-
      At each own turn start roll D6:1 test Stupidity this turn;2–5 no effect;6 Frenzy this turn.
      While subject to Stupidity or Frenzy ignore other psychology. While subject to Stupidity or
      Frenzy ignore other psychology.
    effect_i18n:
      es: >-
        Al inicio de cada turno propio tira un D6: 1 prueba Estupidez este turno; 2-5 sin efecto; 6
        Frenesí este turno. Mientras está sujeto a Estupidez o Frenesí ignora el resto de la
        psicología.
    name_i18n:
      es: Ebrios
    runtime:
      scope: 'YES'
      implemented: 'YES'
      grant: profile
      effects:
      - id: mechanic.centigor-drunken
        scope: 'YES'
        binding:
          kind: mechanic
          id: mechanic.centigor-drunken
    source_refs:
    - manual: border-town-burning
      printed_page: 1
      section: Chaos Centaur / Special Rules
      url: https://www.broheim.net/downloads/hiredswords/btb/btb%20Soldiers%20Of%20Fortune.pdf
  - id: hireling.hired-sword.chaos-centaur.rule.woodland
    name: Woodland
    effect: Uses source woodland/terrain rule.
    effect_i18n:
      es: >-
        Usa la regla de bosque/terreno de la fuente.
    name_i18n:
      es: Arboleda
    runtime:
      scope: 'NO'
      implemented: 'NO'
      grant: profile
      effects:
      - id: hireling.hired-sword.chaos-centaur.rule.woodland.terrain
        scope: 'NO'
        binding: null
        reason: >-
          Woodland movement is excluded.
  - id: hireling.hired-sword.chaos-centaur.rule.trample
    name: Trample
    effect: >-
      One additional natural attack, separate from the printed A1, which receives no weapon bonuses
      or penalties. or penalties.
    effect_i18n:
      es: >-
        Un ataque natural adicional, separado del A1 impreso, que no recibe bonificaciones ni
        penalizaciones de arma.
    name_i18n:
      es: Pisotear
    runtime:
      scope: 'YES'
      implemented: 'YES'
      grant: profile
      effects:
      - id: mechanic.centaur-trample
        scope: 'YES'
        binding:
          kind: mechanic
          id: mechanic.centaur-trample
    source_refs:
    - manual: border-town-burning
      printed_page: 1
      section: Chaos Centaur / Special Rules
      url: https://www.broheim.net/downloads/hiredswords/btb/btb%20Soldiers%20Of%20Fortune.pdf
