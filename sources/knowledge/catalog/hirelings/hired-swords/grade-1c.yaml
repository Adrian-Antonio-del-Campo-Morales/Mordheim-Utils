- id: hireling.hired-sword.hobgoblin-scout
  kind: hired-sword
  grade: 1c
  publication: Border Town Burning Supplement
  name: Hobgoblin Scout
  name_i18n:
    es: Explorador Hobgoblin
  normalization_status: normalized
  characteristics:
    M: 4
    WS: 3
    BS: 3
    S: 3
    T: 3
    W: 1
    I: 2
    A: 1
    Ld: 6
  warband_rating:
    kind: base_plus_experience
    base: 19
    per_experience_point: 1
  equipment:
    fixed_items:
    - item_id: dagger
      quantity:
        kind: fixed
        value: 1
    - item_id: short_bow
      quantity:
        kind: fixed
        value: 1
    - item_id: shield
      quantity:
        kind: fixed
        value: 1
  skill_access:
  - shooting
  - cavalry
  - special
  starting_skill_ids: []
  rules:
  - id: hireling.hired-sword.hobgoblin-scout.rule.ride
    name: Ride
    effect: A Hobgoblin Scout has the Ride Giant Wolf skill.
    effect_i18n:
      es: >-
        Monta un Lobo Gigante.
    name_i18n:
      es: Montar
    runtime:
      grant: profile
      scope: 'NO'
      implemented: 'NO'
      effects:
      - id: hireling.hired-sword.hobgoblin-scout.rule.ride.non-duel
        scope: 'NO'
        binding: null
        reason: >-
          Mounted skill and Giant Wolf model are excluded.
  - id: hireling.hired-sword.hobgoblin-scout.rule.loner
    name: Loner
    effect: >-
      The Scout may never use the warband leader's Leadership for any tests. He never counts as All
      Alone and may operate independently.
    effect_i18n:
      es: >-
        El Explorador nunca puede usar el Liderazgo del líder de la banda para ninguna prueba. Nunca
        cuenta como en soledad y puede operar de forma independiente.
    name_i18n:
      es: Solitario
    runtime:
      scope: 'YES'
      implemented: 'YES'
      grant: profile
      effects:
      - id: mechanic.own-leadership
        scope: 'YES'
        binding:
          kind: mechanic
          id: mechanic.own-leadership
      - id: hireling.hired-sword.hobgoblin-scout.rule.loner.group
        scope: 'NO'
        binding: null
        reason: >-
          All Alone counting and map independence are excluded; personal Leadership prohibition
          remains executable.
  - id: hireling.hired-sword.hobgoblin-scout.rule.traitor
    name: Traitor
    effect: >-
      Opposing Orcs, Goblins and Black Orcs hate the Hobgoblin Scout; hiring other greenskin hired
      swords is prohibited in the campaign.
    effect_i18n:
      es: >-
        Los Orcos, Goblins y Orcos Negros oponentes odian al Explorador Hobgoblin; contratar otros
        espadachines de alquiler de piel verde está prohibido en la campaña.
    name_i18n:
      es: Traidor
    runtime:
      scope: 'YES'
      implemented: 'YES'
      grant: profile
      effects:
      - id: mechanic.greenskin-traitor
        scope: 'YES'
        binding:
          kind: mechanic
          id: mechanic.greenskin-traitor
  - id: hireling.hired-sword.hobgoblin-scout.rule.spy
    name: Spy
    effect: >-
      Before battle and after deployment the Scout may redeploy D3 other models; alternatively
      deploy outside 18 inches from enemies.
    effect_i18n:
      es: >-
        Antes de la batalla y tras el despliegue, el Explorador puede redesplegar D3 modelos más;
        alternativamente, desplegarse a más de 18 pulgadas de los enemigos.
    name_i18n:
      es: Espía
    runtime:
