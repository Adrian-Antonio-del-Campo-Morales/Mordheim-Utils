  rules:
  - id: hireling.hired-sword.arabian-merchant.rule.pawnbroker
    name: Pawnbroker
    effect: Improves proceeds when the warband sells items, subject to the source conditions.
    effect_i18n:
      es: >-
        Mejora los beneficios cuando la banda vende objetos, sujeto a las condiciones de la fuente.
    name_i18n:
      es: Prestamista
  - id: hireling.hired-sword.arabian-merchant.rule.marketeer
    name: Marketeer
    effect: May search one of the special merchant markets after a battle if eligible.
    effect_i18n:
      es: >-
        Puede buscar en uno de los mercados especiales de mercaderes tras una batalla si es
        elegible.
    name_i18n:
      es: Comerciante
  source_notes:
  - The source calls the weapon a Scimitar and explicitly states that it counts as a Sword.
