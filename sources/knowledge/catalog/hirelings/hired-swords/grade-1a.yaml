      es: Sin Escrúpulos
  - id: hireling.hired-sword.highwayman.rule.campaign-eligibility
    name: Dynamic Hiring Eligibility — Roadwarden Incompatibility
    effect: >-
      The Highwayman cannot be hired by, or remain with, a warband whose current roster contains a
      Roadwarden, according to the source incompatibility rule.
    effect_i18n:
      es: >-
        El Salteador no puede ser contratado por una banda cuya plantilla actual incluya un
        Guardacamino, ni permanecer en ella, según la regla de incompatibilidad de la fuente.
    name_i18n:
      es: Elegibilidad de Contratación Dinámica — Incompatibilidad con Guardiacaminos
