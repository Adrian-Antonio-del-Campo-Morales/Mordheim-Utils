  - id: hireling.hired-sword.wolf-priest-of-ulric.rule.prayers
    name: Prayers
    effect: May use Prayers of Ulric.
    effect_i18n:
      es: >-
        Puede usar Oraciones de Ulric.
    name_i18n:
      es: Plegarias
    runtime:
