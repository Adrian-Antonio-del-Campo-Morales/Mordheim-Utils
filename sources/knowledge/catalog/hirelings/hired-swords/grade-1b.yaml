  - id: hireling.hired-sword.witch-hunter.rule.campaign-eligibility
    name: Dynamic Hiring Eligibility — Spellcaster Restriction
    effect: >-
      The Witch Hunter will not work for a warband whose current roster contains a spellcaster,
      except a Priest of Sigmar, Ulric, Taal or Morr.
    effect_i18n:
      es: >-
        El Cazador de Brujas no trabajará para una banda cuya plantilla actual incluya un lanzador
