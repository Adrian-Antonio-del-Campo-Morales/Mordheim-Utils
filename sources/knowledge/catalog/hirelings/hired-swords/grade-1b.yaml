        scope: 'NO'
        binding: null
        reason: Learning and using Prayers of Ulric is casting, which is excluded; the separate canonical
          spellcaster identity remains available to duel consumers.
  - id: hireling.hired-sword.wolf-priest-of-ulric.rule.hatred
    name: Hatred
    effect: Hates the source-listed Sigmarite models.
    effect_i18n:
      es: >-
        Odia las miniaturas sigmaritas enumeradas en la fuente.
    name_i18n:
      es: Odio
    runtime:
      grant: profile
      scope: 'YES'
      implemented: 'YES'
      effects:
      - id: mechanic.ulric-intense-rivals
        scope: 'YES'
        binding:
          kind: mechanic
          id: mechanic.ulric-intense-rivals
  - id: hireling.hired-sword.wolf-priest-of-ulric.rule.wolf-companion
    name: Wolf Companion
    effect: May be accompanied by the source Wolf Companion.
    effect_i18n:
      es: >-
        Puede ir acompañado del Compañero Lobo de la fuente.
    name_i18n:
      es: Lobo Compañero
    runtime:
      scope: 'NO'
      implemented: 'NO'
      grant: none
      effects:
      - id: wolf-companion
        scope: 'NO'
        binding: null
        reason: The Wolf Companion is a second combatant that the one-against-one duel does not field.
  - id: hireling.hired-sword.wolf-priest-of-ulric.rule.campaign-eligibility
    name: Dynamic Hiring Eligibility — Middenheim Variant
    effect: >-
      The Wolf Priest of Ulric is a Hero replacement available only to Middenheim Mercenaries. The
      application must evaluate the selected Mercenary variant.
    effect_i18n:
      es: >-
        El Sacerdote Lobo de Ulric es un sustituto de Héroe disponible solo para los Mercenarios de
        Middenheim. La aplicación debe evaluar la variante de Mercenario seleccionada.
    name_i18n:
      es: Elegibilidad de Contratación Dinámica — Variante de Middenheim
    runtime:
      scope: 'NO'
      implemented: 'NO'
      grant: none
      effects:
      - id: campaign-eligibility-hero-replacement
        scope: 'NO'
        binding: null
        reason: The Hero replacement and its variant restriction are evaluated when the warband is hired
          and have no duel-time consequence.
  - id: hireling.hired-sword.wolf-priest-of-ulric.rule.strictures
    name: Strictures
    effect: >-
      A Wolf Priest may only use blunt weapons, except for a dagger, and may never wear armour;
      the white wolf cloak is the only garb the stricture allows.
    effect_i18n:
      es: >-
        Un Sacerdote Lobo solo puede usar armas contundentes, salvo una daga, y nunca puede llevar
        armadura; la capa de piel de lobo blanca es la única prenda que permite la estrictura.
    name_i18n:
      es: Preceptos
    runtime:
      scope: 'YES'
      implemented: 'YES'
      grant: profile
      effects:
      - id: profile.equipment-restrictions
        scope: 'YES'
        binding:
          kind: profile
          id: profile.equipment-restrictions
          parameters:
            forbids:
            - armour
            allowed_kinds:
            - weapon.club
            - weapon.mace
            - weapon.flail
            - weapon.quarter-staff
            - weapon.dagger
