  rules:
  - id: hireling.hired-sword.mule-skinner.rule.animal-handler
    name: Animal Handler
    effect: >-
      Animal Handler: a Mule Skinner starts with one Animal Handling skill (the player chooses which
      animal).
    effect_i18n:
      es: >-
        Tratador de Animales: un Arriero de Mulas empieza con una habilidad de Manejo de Animales (el
        jugador elige qué animal).
    name_i18n:
      es: Tratador de Animales
    runtime:
      scope: 'YES'
      implemented: 'YES'
      grant: profile
      effects:
      # 'starts with one Animal Handling skill (the player chooses which
      # animal)' is an admitted construction choice. The KB publishes two
      # named Animal Handling skills, published below as selectable members;
      # both members' own printed content is excluded (shooting-phase bird,
      # mounts), so the selection is a recorded construction fact and the
      # compiler never turns it into a duel effect.
      - id: compiler.animal-handler-skill-choice
        scope: 'YES'
        binding:
          kind: compiler
          id: compiler.animal-handler-skill-choice
          parameters:
            options:
            - hireling.hired-sword.mule-skinner.skill.animal-handling-falconer
            - hireling.hired-sword.mule-skinner.skill.animal-handling-horse
  - id: hireling.hired-sword.mule-skinner.skill.animal-handling-falconer
    name: Animal Handling — Falconer
    name_i18n:
      es: Manejo de Animales — Halconero
    effect: >-
      Falconer: hunting birds may only be used by a Hero with the animal handling skill 'Falconer'.
      The falcon has a 24 inch range as a missile weapon and strikes first in close combat with a
      single Strength 3 attack; it cannot be attacked or slain.
    effect_i18n:
      es: >-
        Halconero: las aves de caza solo pueden usarlas héroes con la habilidad de manejo de
        animales 'Falconero'. El halcón tiene un alcance de 24 pulgadas como arma de misil y golpea
        primero en combate cuerpo a cuerpo con un único ataque de Fuerza 3; no puede ser atacado ni
        muerto.
    kind: warband_skill
    eligibility:
    - hireling.hired-sword.mule-skinner
    runtime:
      scope: 'NO'
      implemented: 'NO'
      grant: selectable
      effects:
      - id: unimplemented.hirelings.hired-sword.mule-skinner.animal-handling-falconer
        scope: 'NO'
        binding: null
        reason: >-
          The printed content is the Watchmen Falconer's 24" hunting bird, resolved as a missile
          weapon in the shooting phase plus a third model that fights on its own; shooting and
          additional combatants are outside the 1v1 duel. The chosen skill is a construction fact.
  - id: hireling.hired-sword.mule-skinner.skill.animal-handling-horse
    name: Animal Handling — Horse Handling
    name_i18n:
      es: Manejo de Animales — Manejo de Caballos
    effect: >-
      Horse Handling: Grooms have the Animal Handling skill as detailed in the Blazing Saddles
      article.
    effect_i18n:
      es: >-
        Manejo de Caballos: los Palafreneros tienen la habilidad Manejo de animales tal como se
        detalla en el artículo Blazing Saddles.
    kind: warband_skill
    eligibility:
    - hireling.hired-sword.mule-skinner
    runtime:
      scope: 'NO'
      implemented: 'NO'
      grant: selectable
      effects:
      - id: unimplemented.hirelings.hired-sword.mule-skinner.animal-handling-horse
        scope: 'NO'
        binding: null
        reason: >-
          The printed content is the Blazing Saddles mount-handling subsystem; mounts and mounted
          play are excluded from the duel. The chosen skill is a construction fact.
  - id: hireling.hired-sword.mule-skinner.rule.whip-master
    name: Whip Master
    effect: May reroll each hit roll using the whip once, accepting the second result even if worse.
    effect_i18n:
      es: >-
        Usa la regla de maestro del látigo de la fuente.
    name_i18n:
      es: Maestro del Látigo
    runtime:
      scope: 'YES'
      implemented: 'YES'
      grant: profile
      effects:
      - id: mechanic.whip-master
        scope: 'YES'
        binding: {kind: mechanic, id: mechanic.whip-master}
