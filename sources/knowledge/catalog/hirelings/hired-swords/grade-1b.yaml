  rules:
  - id: hireling.hired-sword.runesmith-journeyman.rule.runesmith
    name: Runesmith
    effect: Before battle the Runesmith may try each known Rune once. Eligible items are axes, hammers,
      swords, two-handed weapons, helmets, shields, light armour and heavy armour; an item can carry
      only one Rune. Iron grants a 6+ ward, Stone improves armour by 1, Fury adds one Attack with the
      weapon, Striking adds 1 Weapon Skill, Speed adds 1 Initiative and Cleaving adds 1 Strength. A successful
      inscription lasts the coming battle and cannot be dispelled. Inscription, breakage on a natural
      2, learning and durable post-battle history are excluded; supplied already inscribed item consequences
      resolve through the six canonical Rune conditions.
    effect_i18n:
      es: 'Antes de la batalla puede intentar grabar una vez cada runa conocida en hachas, martillos,
        espadas, armas a dos manos, cascos, escudos y armaduras ligeras o pesadas; una runa por objeto.
        Hierro: salvación especial 6+; Piedra: +1 armadura; Furia: +1 ataque con el arma; Impacto: +1
        HA; Velocidad: +1 I; Corte: +1 F. Dura la batalla y no puede disiparse. La inscripción, rotura,
        aprendizaje y durabilidad posterior quedan excluidos; las seis condiciones canónicas aportan
        los efectos ya grabados.'
    name_i18n:
      es: Herrumorco
    source_refs:
    - manual: Nemesis Crown Supplement
      printed_page: 0
      section: Runesmith Journeyman / Rune Use (PDF page 62)
      url: https://broheim.net/downloads/campaigns/nemesiscrown/Nemesis%20Crown%20Complete.pdf
    runtime:
      scope: 'NO'
      implemented: 'NO'
      grant: none
      effects:
      - id: rune-inscription-producer
        scope: 'NO'
        binding: null
        reason: Prebattle inscription/learning and postbattle durability are excluded. Six supplied source-qualified
          item Rune conditions carry the individual battle consequences; no automatic Rune is granted
          to the Runesmith.
