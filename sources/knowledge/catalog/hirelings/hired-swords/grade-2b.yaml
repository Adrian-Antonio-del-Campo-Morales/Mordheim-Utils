    base: 30
    per_experience_point: 1
  equipment:
    fixed_items:
    - item_id: spear
      quantity:
        kind: fixed
        value: 1
    - item_id: net
      quantity:
        kind: fixed
        value: 1
    - item_id: harpoon_crossbow
      quantity:
        kind: fixed
        value: 1
      notes: Harpoon gun counts as harpoon crossbow.
      notes_i18n:
        es: El fusil de arpón cuenta como ballesta de arpón.
    - item_id: javelin
      quantity:
        kind: fixed
