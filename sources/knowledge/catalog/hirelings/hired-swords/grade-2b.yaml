      notes_i18n:
        es: >-
          Capa de piel de lobo blanco: salvación de 6+. Objeto definido en el catálogo de
          staging de Grade-2b (miracle-workers-gear.yaml) a partir de las estrictas observancias
          de este capítulo; no es equivalente al `wolfcloak` del KB (capa de caza de Middenheim,
          salvación solo contra disparos); conservar ambos objetos y revisar cualquier fusión en
          la promoción.
  skill_access:
