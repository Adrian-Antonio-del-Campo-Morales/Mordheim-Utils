  - id: hireling.hired-sword.warrior-priest-of-sigmar-miracle-workers.rule.marks-of-sigmar
    name: Marks of Sigmar
    effect: >-
      Enlightened: divine purpose washes over the Priest; he automatically passes all Leadership
      based tests taken while fighting against Orcs & Goblins or the followers of Chaos. Symbol of
      Unity: the Priest inspires citizens of the Empire with nationalistic pride; his symbolic
      presence affects encounters with Witch Hunters, Sisters of Sigmar or any mercenary warband
      except Marienburg and Middenheim mercenaries; if an enemy warrior within 3" of the Priest
      strikes or shoots at a warrior within 3" of the Priest they suffer -1 on all rolls to hit.
    effect_i18n:
      es: >-
        Iluminado: el propósito divino envuelve al Sacerdote; supera automáticamente todas las
        tiradas basadas en Liderazgo mientras lucha contra Orcos y Goblins o los seguidores del
        Caos. Símbolo de Unidad: el Sacerdote inspira a los ciudadanos del Imperio con orgullo
        nacionalista; su presencia simbólica afecta los encuentros con Cazadores de Brujas, Hermanas
        de Sigmar o cualquier banda mercenaria salvo mercenarios de Mariemburgo y Middenheim; si un
        guerrero enemigo dentro de 3" del Sacerdote golpea o dispara a un guerrero dentro de 3" del
        Sacerdote, sufre -1 en todas las tiradas por impactar.
    name_i18n:
      es: Marcas de Sigmar
  source_refs:
  - manual: liber-malefic
    printed_page: 12
    section: Priests for Every Occasion / Warrior-Priest of Sigmar
    url: https://www.scribd.com/document/241727651/Miracle-workers-in-Mordheim
