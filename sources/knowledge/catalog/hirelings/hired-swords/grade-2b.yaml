  - id: hireling.hired-sword.norse-bearman-bodyguard.rule.bulwark
    name: Bulwark
    effect: >-
      Bearmen fight expertly with a shield in one hand and an axe in the other. The Bearman
      Bodyguard gets an additional +1 bonus on his armour saving roll in close combat.
    effect_i18n:
      es: >-
        Los Hombres Oso luchan con maestría con un escudo en una mano y un hacha en la otra. El
        Guardaespaldas Hombre Oso obtiene un bonus adicional de +1 en su tirada de salvación por
        armadura en combate cuerpo a cuerpo.
    name_i18n:
      es: Baluarte
  - id: hireling.hired-sword.norse-bearman-bodyguard.rule.drunken
    name: Drunken
    effect: >-
      Bearmen are notorious for their uncontrollable consumption of alcohol. Roll a D6 at the start
      of each turn. On a roll of 1, they must test for stupidity that turn. On a roll of 2-5 nothing
      happens and on a roll of 6 they become subject to frenzy for that turn. While subject to both
      stupidity and frenzy they are immune to all other forms of psychology.
    effect_i18n:
      es: >-
        Los Hombres Oso son notorios por su consumo incontrolable de alcohol. Tira un D6 al comienzo
        de cada turno. Con un resultado de 1 deben superar una tirada de Estupidez ese turno. Con un
        resultado de 2-5 no ocurre nada, y con un 6 sufren frenesí ese turno. Mientras sufran tanto
        estupidez como frenesí son inmunes a todas las demás formas de psicología.
    name_i18n:
      es: Ebrios
  source_refs:
