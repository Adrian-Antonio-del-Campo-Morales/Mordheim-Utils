  rules:
  - id: hireling.hired-sword.midshipman.rule.pilot
    name: Pilot
    effect: >-
      A boat piloted by the Hero may re-roll results on the Propulsion Damage Chart once. The second
      result must be accepted even if it is worse.
    effect_i18n:
      es: >-
        Una embarcación pilotada por el Héroe puede repetir una vez los resultados de la Tabla de
        Daños de Propulsión. Siempre debe aceptarse el segundo resultado, aunque sea peor.
    name_i18n:
      es: Piloto
  - id: hireling.hired-sword.midshipman.rule.rigger
    name: Rigger
    effect: >-
      The Hero is skilled in fixing minor damage to watercraft. If the boat or barge is stationary
      and has not moved during the last turn then if the Hero is in contact with it, he may repair
      one location previously damaged or set on fire. ie, a paddle or mast. The Hero may do nothing
      else that turn and the boat may not be moved. A boat cannot be repaired if an enemy model is
      in contact with the Hero or the watercraft.
    effect_i18n:
      es: >-
        El Héroe es diestro reparando daños menores en embarcaciones. Si el bote o la barcaza está
        detenido y no se ha movido durante el último turno, y el Héroe está en contacto con él,
        puede reparar una localización dañada o incendiada previamente, es decir, un remo o un
        mástil. El Héroe no puede hacer nada más ese turno y la embarcación no puede moverse. No se
        puede reparar una embarcación si hay una miniatura enemiga en contacto con el Héroe o con la
        embarcación.
    name_i18n:
      es: Trincador
  - id: hireling.hired-sword.midshipman.rule.a-crew-fer-me
    name: A Crew Fer Me!
    effect: >-
      A midshipman craves the comradery and adventure of the sea and a worthy crew. As such, any
      seafaring warbands gain a +1 to blood pact rolls with the Midshipman.
    effect_i18n:
      es: >-
        Un guardiamarina ansía la camaradería y la aventura del mar, así como una tripulación digna.
        Por ello, las bandas navales obtienen un +1 en las tiradas de pacto de sangre con el
        Guardiamarina.
    name_i18n:
      es: ¡Una Tripulación para Mí!
  source_refs:
  - manual: broheim.net
    printed_page: 5
    section: Specialists / Midshipman
    url: https://broheim.net/downloads/hiredswords/mutinyinmarienburg/Specialists.pdf
- id: hireling.hired-sword.mariner-priest-of-manann
  kind: hired-sword
  grade: 2b
  publication: Miracle Workers (Liber Malefic / Mutiny in Marienburg)
  name: Mariner-Priest of Manann
  name_i18n:
    es: Sacerdote Marinero de Manann
  normalization_status: normalized
  characteristics:
    M: 4
    WS: 3
    BS: 3
    S: 3
    T: 3
    W: 1
    I: 3
    A: 1
    Ld: 8
  warband_rating:
    kind: base_plus_experience
    base: 0
    per_experience_point: 1
  equipment:
    fixed_items:
    - item_id: dagger
      quantity:
        kind: fixed
        value: 1
      notes: Ceremonial dagger — all priests of the chapter start with one.
      notes_i18n:
        es: >-
          Daga ceremonial: todos los sacerdotes del capítulo empiezan con una.
    choices:
    - choose: 1
      options:
      - items:
        - item_id: trident
          quantity:
            kind: fixed
            value: 1
          notes: Priest of Manann only; 15 gc in the chapter's priest equipment list; Strike first, Parry;
            Rarity 7 per Unknowable Cargo.
          notes_i18n:
            es: >-
              Solo Sacerdote de Manann; 15 co en la lista de equipo de sacerdotes del capítulo;
              Golpe primero, Parada; Rareza 7 según Carga Inescrutable.
  skill_access:
  - combat
  - academic
  - speed
  starting_skill_ids: []
  rules:
  - id: hireling.hired-sword.mariner-priest-of-manann.rule.prayers
    name: Prayers
    effect: >-
      A Priest of Manann is a servant of Manann and may use the Prayers of Manann as detailed
      elsewhere in the Miracle Workers chapter (ingested as lore.prayers-of-manann in
      catalog/campaign/magic.yaml). In addition, Manannan Priests can receive a Mark of Manann
      instead of choosing a new skill if a double was rolled on the advance roll.
    effect_i18n:
      es: >-
        Un Sacerdote de Manann es un sirviente de Manann y puede usar las Plegarias de Manann como
        se detalla en el capítulo Trabajadores de Milagros (ingerido como lore.prayers-of-manann en
        catalog/campaign/magic.yaml). Además, los Sacerdotes de Manann pueden recibir una Marca de
        Manann en lugar de elegir una nueva habilidad si se saca un doble en la tirada de avance.
    name_i18n:
      es: Plegarias
  - id: hireling.hired-sword.mariner-priest-of-manann.rule.seafaring
    name: Seafaring
    effect: >-
      Priests of Manann are seafaring people and spend much of their time rowing boats. To represent
      this, all Priests of Manann get +2 to Strength when they row a boat.
    effect_i18n:
      es: >-
        Los Sacerdotes de Manann son gente de mar y pasan gran parte de su tiempo remando. Para
        representarlo, todos los Sacerdotes de Manann obtienen +2 a su Fuerza cuando reman en una
        embarcación.
    name_i18n:
      es: Navegante
  - id: hireling.hired-sword.mariner-priest-of-manann.rule.navigator
    name: Navigator
    effect: >-
      His maritime intuition means the Priest can influence the exploration outcome of a battle
      fought at sea. When rolling on the Nautical Exploration chart, the Priest allows you to modify
      one dice roll by -1/+1.
    effect_i18n:
      es: >-
        Su intuición marítima permite al Sacerdote influir en el resultado de la exploración de una
        batalla librada en el mar. Al tirar en la tabla de Exploración Náutica, el Sacerdote permite
        modificar una tirada de dado en -1/+1.
    name_i18n:
      es: Navegante
  - id: hireling.hired-sword.mariner-priest-of-manann.rule.priest-hero-slot
    name: Priest Hero Slot (Chapter Errata)
    effect: >-
      The Priest counts as a Hero and starts with 12 experience. Chapter errata (author ruling, TBMF
      t8634): the Priest must replace one of the warband's starting Heroes; the original PDF wording
      allowed exceeding the Hero limit, which was never corrected in the published file.
    effect_i18n:
      es: >-
        El Sacerdote cuenta como Héroe y comienza con 12 puntos de experiencia. Errata del capítulo
        (decisión del autor, TBMF t8634): el Sacerdote debe sustituir a uno de los Héroes iniciales
        de la banda; la redacción original del PDF permitía superar el límite de Héroes, y nunca se
        corrigió en el archivo publicado.
    name_i18n:
      es: Plaza de Héroe Sacerdotal (Errata del Capítulo)
  - id: hireling.hired-sword.mariner-priest-of-manann.rule.marks-of-manann
    name: Marks of Manann
    effect: >-
      One with the Sea: if the Priest falls into water then regardless of the injury roll the Priest
      cannot be drowned. Webbed: the fingers and toes of the Priest develop webbed skin and he
      becomes Aquatic.
    effect_i18n:
      es: >-
        Uno con el Mar: si el Sacerdote cae al agua, independientemente de la tirada de herida, el
        Sacerdote no puede ahogarse. Palmeado: los dedos de las manos y los pies del Sacerdote
        desarrollan membranas y se convierte en Acuático.
    name_i18n:
      es: Marcas de Manann
  source_refs:
  - manual: liber-malefic
    printed_page: 3
    section: Priests for Every Occasion / Mariner-Priest of Manann
    url: https://www.scribd.com/document/241727651/Miracle-workers-in-Mordheim
  - manual: broheim.net
    printed_page: 3
    section: Heroes / 0-1 Mutant-Priest / Special Rules / Prayers
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Shallows%20Beasts.pdf
  experience: 12
