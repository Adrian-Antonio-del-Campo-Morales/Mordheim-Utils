        Carnaval del Caos u otros sirvientes de Onogal el Señor de las Moscas. Las Sacerdotisas de
        Shallya siempre comienzan equipadas con un bastón de paseo (cuenta como bastón). Solo pueden
        ir armadas con un bastón de paseo. Las Sacerdotisas de Shallya nunca pueden llevar armadura.
    name_i18n:
      es: Preceptos
  - id: hireling.hired-sword.priestess-of-shallya.rule.mercy
    name: Mercy
    effect: >-
      The Priestess may heal a wounded warrior once during battle. Any model in contact with the
      Priestess immediately recovers 1 Wound. In addition, she may accompany another Hero visiting
      an Apothecary which allows a +1 modifier when rolling on the Surgery charts.
    effect_i18n:
      es: >-
        La Sacerdotisa puede curar a un guerrero herido una vez durante la batalla. Cualquier
        miniatura en contacto con la Sacerdotisa recupera inmediatamente 1 Herida. Además, puede
        acompañar a otro Héroe que visite un Botica lo que permite un modificador de +1 al tirar en
        las tablas de Cirugía.
    name_i18n:
      es: Misericordia
  - id: hireling.hired-sword.priestess-of-shallya.rule.cure-poison
    name: Cure Poison
    effect: >-
      At the beginning of the post battle sequence the Priestess and any other model in the warband
      is healed from the effects of a poison. The disease is removed from the subject model and all
      ill-effects are nullified.
    effect_i18n:
      es: >-
        Al comienzo de la secuencia posterior a la batalla, la Sacerdotisa y cualquier otra
        miniatura de la banda quedan curadas de los efectos de un veneno. La enfermedad se elimina
        del modelo afectado y todos sus efectos negativos quedan anulados.
    name_i18n:
      es: Curar Veneno
  - id: hireling.hired-sword.priestess-of-shallya.rule.marks-of-shallya
    name: Marks of Shallya
    effect: >-
      Healing Hands: the Priestess may heal a grievously wounded warrior once during battle; any
      model in contact immediately recovers 2 Wounds, and she grants a +2 modifier on Surgery
      charts. Tranquil Aura: all models within 2" of the Priestess suffer -1 Weapon Skill and -1
      Ballistic Skill; the aura has no effect on Daemons or Undead.
    effect_i18n:
      es: >-
        Manos Sanadoras: la Sacerdotisa puede curar una vez durante la batalla a un guerrero
        gravemente herido; cualquier miniatura en contacto recupera inmediatamente 2 Heridas, y
        otorga un modificador de +2 en las tablas de Cirugía. Aura de Serenidad: todas las
        miniaturas dentro de 2" de la Sacerdotisa sufren -1 Habilidad de Combate y -1 Habilidad de
        Combate a Distancia; el aura no afecta a Demonios ni No Muertos.
    name_i18n:
      es: Marcas de Shallya
