- id: hireling.hired-sword.fire-eater
  kind: hired-sword
  grade: 2b
  publication: Mutiny in Marienburg Specialists (Broheim)
  name: Fire-Eater
  name_i18n:
    es: Traga Fuego
  normalization_status: normalized
  characteristics:
    M: 4
    WS: 2
    BS: 3
    S: 3
    T: 4
    W: 2
    I: 2
    A: 1
    Ld: 7
  warband_rating:
    kind: base_plus_experience
    base: 30
    per_experience_point: 1
  equipment:
    fixed_items:
    - item_id: fire_stick
      quantity:
        kind: fixed
        value: 1
      notes: MiM-specific item (see the Fire-Stick rule); no KB or 2B catalog equivalent — deliberate
        dangling ref, define at promotion.
      notes_i18n:
        es: >-
          Objeto específico de MiM (véase la regla Palo de Fuego); sin equivalente en el KB ni
          en el catálogo 2B; referencia pendiente deliberada, definir en la promoción.
  skill_access: []
  starting_skill_ids: []
  rules:
  - id: hireling.hired-sword.fire-eater.rule.fire-stick
    name: Fire-Stick
    effect: >-
      Being almost perfectly trained in mystical arts, the Fire-Eater spits fire upon his enemies in
      the shooting phase. Use the teardrop shaped flame template to determine which models suffer an
      automatic Strength 4 hit. In addition, any models hit are set on fire on a roll of 4+ (see
      Fire Rules). Fire-Eaters can use this breath attack even when engaged in close combat.
    effect_i18n:
      es: >-
        Al estar entrenado casi a la perfección en las artes místicas, el Traga Fuego escupe fuego
        sobre sus enemigos en la fase de disparo. Usa la plantilla de llamas con forma de lágrima
        para determinar qué miniaturas sufren un impacto automático de Fuerza 4. Además, cualquier
        miniatura alcanzada se incendia con un resultado de 4+ (ver Reglas de Fuego). Los Traga
        Fuego pueden usar este ataque de aliento incluso cuando estén trabados en combate cuerpo a
        cuerpo.
    name_i18n:
      es: Palo de Fuego
  - id: hireling.hired-sword.fire-eater.rule.inhaling-fire
    name: Inhaling Fire
    effect: >-
      After belching the first flume of heat, roll a D6 each time a Fire-Eater makes an additional
      breath attack. On a roll of 1 the Fire-Eater has inhaled the fire he should have been spewing!
      The warrior suffers a Strength 4 hit instead of using the flame template.
    effect_i18n:
      es: >-
        Después de escupir la primera lengua de fuego, tira un D6 cada vez que el Traga Fuego
        realice un ataque de aliento adicional. Con un resultado de 1, el Traga Fuego ha inhalado el
        fuego que debía escupir. El guerrero sufre un impacto de Fuerza 4 en lugar de usar la
        plantilla de llamas.
    name_i18n:
      es: Inhalando Fuego
  source_refs:
  - manual: broheim.net
    printed_page: 4
    section: Specialists / Fire-Eater
    url: https://broheim.net/downloads/hiredswords/mutinyinmarienburg/Specialists.pdf
