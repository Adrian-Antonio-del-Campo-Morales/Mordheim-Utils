  - skill.streetwise
  rules:
  - id: hireling.hired-sword.trickster-priest-of-ranald.rule.prayers
    name: Prayers
    effect: >-
      A Priest of Ranald is a servant of Ranald and may use the Prayers of Ranald as detailed
      elsewhere in the Miracle Workers chapter. Priests of Handrich use the same prayers. In
      addition, Ranaldan Priests can receive a Mark of Ranald instead of choosing a new skill if a
      double was rolled on the advance roll.
    effect_i18n:
      es: >-
        Un Sacerdote de Ranald es un sirviente de Ranald y puede usar las Plegarias de Ranald como
        se detalla en el capítulo Trabajadores de Milagros. Los Sacerdotes de Handrich usan las
        mismas plegarias. Además, los Sacerdotes de Ranald pueden recibir una Marca de Ranald en
        lugar de elegir una nueva habilidad si se saca un doble en la tirada de avance.
    name_i18n:
      es: Plegarias
  - id: hireling.hired-sword.trickster-priest-of-ranald.rule.strictures
    name: Strictures
    effect: >-
      Trickster-Priests habitually avoid engaging in martial activity. They may only be armed with a
      dagger, throwing knives and a stiletto (counts as a sword). Priests of Ranald may never wear
      armour. The Priest has both the skills Haggle and Streetwise.
    effect_i18n:
      es: >-
        Los Sacerdotes Tramposos evitan habitualmente dedicarse a actividades marciales. Solo pueden
        ir armados con daga, cuchillos arrojadizos y un estilete (cuenta como espada). Los
        Sacerdotes de Ranald nunca pueden llevar armadura. El Sacerdote tiene las habilidades
        Regateo y Callejeo.
    name_i18n:
      es: Preceptos
  - id: hireling.hired-sword.trickster-priest-of-ranald.rule.grifter
    name: Grifter
    effect: >-
      Priests of Ranald are practiced swindlers! Like a merchant, a Trickster-Priest allows (dodgy!)
      trading deals to be arranged with other warbands.
    effect_i18n:
      es: >-
        ¡Los Sacerdotes de Ranald son timadores consumados! Como un mercader, un Sacerdote Tramposo
        permite concertar tratos comerciales (¡poco fiables!) con otras bandas.
    name_i18n:
      es: Trapacero
  - id: hireling.hired-sword.trickster-priest-of-ranald.rule.marks-of-ranald
    name: Marks of Ranald
    effect: >-
      Ranald's Luck: once during each battle the Priest may influence the result of any dice roll he
      makes by +1 or -1; in addition, he ducks past any hits on a 6+ regardless of strength or
      source (including magical attacks) — an unmodifiable roll made before critical hit effects are
      determined. Cat Friend: the Priest attracts a cat companion (the mark can be gained multiple
      times); cats cannot attack or be attacked but can intercept a charge made against the Priest;
      if the Priest is taken out of action the cat runs away, returning after the battle; if the
      Priest is slain the cats are lost like any other equipment.
    effect_i18n:
      es: >-
        Suerte de Ranald: una vez por batalla, el Sacerdote puede influir en el resultado de
        cualquier tirada de dado que realice en +1 o -1; además, esquiva cualquier impacto con un 6+
        sin importar fuerza u origen (incluidos ataques mágicos): tirada no modificable que se hace
        antes de determinar los efectos de golpe crítico. Amigo de los Gatos: el Sacerdote atrae a
        un compañero gato (la marca puede obtenerse varias veces); los gatos no pueden atacar ni ser
        atacados, pero pueden interceptar una carga contra el Sacerdote; si el Sacerdote queda Fuera
        de combate, el gato huye y regresa tras la batalla; si el Sacerdote muere, los gatos se
        pierden como cualquier otro equipo.
    name_i18n:
      es: Marcas de Ranald
  source_refs:
  - manual: liber-malefic
