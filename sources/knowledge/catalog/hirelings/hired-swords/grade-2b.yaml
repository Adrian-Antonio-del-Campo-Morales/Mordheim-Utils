  skill_access:
  - strength
  - shooting
  starting_skill_ids: []
  rules:
  - id: hireling.hired-sword.whaler.rule.marine-hunter
    name: Marine Hunter
    effect: >-
      Whalers grow accustomed to hunting marine beasts. Double any wounds inflicted to aquatic
      models.
    effect_i18n:
      es: >-
        Los Balleneros se acostumbran a cazar bestias marinas. Duplica cualquier herida infligida a
        miniaturas acuáticas.
    name_i18n:
      es: Cazador Marino
  - id: hireling.hired-sword.whaler.rule.hardened
    name: Hardened
    effect: >-
      Having come face to face with some of the largest most terrifying beasts the seas have to
      offer and survived, the Whaler is immune to fear.
    effect_i18n:
      es: >-
        Tras enfrentarse a algunas de las bestias más grandes y terroríficas de los mares y
        sobrevivir, el Ballenero es inmune al miedo.
    name_i18n:
      es: Endurecido
  - id: hireling.hired-sword.whaler.rule.harpooner
    name: Harpooner
    effect: >-
      When the Whaler hits a model in the shooting phase, if he wounds the target, he may attempt to
      reel in the catch. If the Whaler passes a Strength test, the target model is pulled 8" towards
      the Whaler. Neither model counts as charging if a model is reeled into close combat.
    effect_i18n:
      es: >-
        Cuando el Ballenero impacta a una miniatura en la fase de disparo, si la hiere, puede
        intentar recoger la presa. Si el Ballenero supera una tirada de Fuerza, la miniatura
        objetivo es arrastrada 8" hacia el Ballenero. Ninguna de las dos miniaturas cuenta como
        carga si una es arrastrada hasta el combate cuerpo a cuerpo.
    name_i18n:
      es: Arponero
  - id: hireling.hired-sword.whaler.rule.whalebone-carver
    name: Whalebone Carver
    effect: >-
      Heroes get +2 on search rolls when looking for Scrimshaw Baubles when a Whaler joins the
      warband.
    effect_i18n:
      es: >-
        Los héroes obtienen +2 en las tiradas de búsqueda de Adornos de Escrimshaw cuando un
        Ballenero se une a la banda.
    name_i18n:
      es: Tallador de Hueso de Ballena
  source_refs:
  - manual: broheim.net
    printed_page: 1
    section: Hired Swords
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Lords%20of%20the%20Marsh.pdf
  - manual: broheim.net
    printed_page: 3
    section: Mutiny In Marienburg Specialists / Whaler
    url: https://broheim.net/downloads/hiredswords/mutinyinmarienburg/MiM%20Specialists.pdf
- id: hireling.hired-sword.ogre-treasure-hunter
  kind: hired-sword
  grade: 2b
  publication: Mutiny in Marienburg Specialists (Broheim)
  name: Ogre Treasure-Hunter
  name_i18n:
    es: Cazatesoros Ogro
  normalization_status: normalized
  characteristics:
    M: 6
    WS: 3
    BS: 2
    S: 4
    T: 4
    W: 3
    I: 3
    A: 2
    Ld: 7
  warband_rating:
    kind: base_plus_experience
    base: 35
    per_experience_point: 1
  equipment:
    fixed_items:
    - item_id: pistol
      quantity:
        kind: fixed
        value: 2
      notes: Brace of pistols.
      notes_i18n:
        es: Pareja de pistolas.
    - item_id: axe
      quantity:
        kind: fixed
        value: 1
      notes: Anchor counts as an axe.
      notes_i18n:
        es: El ancla cuenta como hacha.
    - item_id: man_catcher
      quantity:
        kind: fixed
        value: 1
      notes: Fishing rod & tackle counts as a man-catcher.
      notes_i18n:
        es: La caña y los aparejos de pesca cuentan como atrapahombres.
    - item_id: diving_bell_helmet
      quantity:
        kind: fixed
        value: 1
      notes: Rusted diving equipment including a diving bell for a helmet (flavour gear); REL/MiM-specific,
        no KB item — deliberate dangling ref, define at promotion if ever needed mechanically.
      notes_i18n:
        es: >-
          Equipo de buceo oxidado, incluida una campana de buceo como yelmo (equipo de
          ambientación); específico de REL/MiM, sin objeto en el KB; referencia pendiente
          deliberada, definir en la promoción si alguna vez se necesita mecánicamente.
  skill_access:
  - combat
  - strength
  starting_skill_ids: []
  rules:
  - id: hireling.hired-sword.ogre-treasure-hunter.rule.diver
    name: Diver
    effect: >-
      Ogre Treasure Hunters wear rusty diving gear allowing them to move (and breathe!) in water
      without penalties. They count as being aquatic.
    effect_i18n:
      es: >-
        Los Cazatesoros Ogro llevan equipo de buceo oxidado que les permite moverse (¡y respirar!)
        en el agua sin penalizaciones. Cuentan como Acuáticos.
    name_i18n:
      es: Buceador
  - id: hireling.hired-sword.ogre-treasure-hunter.rule.fear
    name: Fear
    effect: >-
      Ogres are large, threatening creatures that cause fear. See the Psychology section for
      details.
    effect_i18n:
      es: >-
        Los Ogros son criaturas grandes y amenazantes que causan Miedo. Ver la sección de Psicología
        para más detalles.
    name_i18n:
      es: Miedo
  - id: hireling.hired-sword.ogre-treasure-hunter.rule.large-target
    name: Large Target
    effect: Ogres are Large Targets as defined in the shooting rules.
    effect_i18n:
      es: Los Ogros son Objetivos Grandes según se define en las reglas de disparo.
    name_i18n:
      es: Objetivo Grande
  - id: hireling.hired-sword.ogre-treasure-hunter.rule.parrot-gnoblar
    name: Parrot Gnoblar
    effect: >-
      The ogre is accompanied by a gnoblar dressed as a parrot. The feathery costume is a compulsory
      disguise in a city like Marienburg! An Ogre Treasure Hunter with a Parrot Gnoblar can swipe
      salvage for the warband after each battle. Roll on the Cargo Chart if the Ogre Treasure-Hunter
      was not taken out of action. A Parrot Gnoblar is a 'claimed' gnoblar meaning it is represented
      on the ogre model.
    effect_i18n:
      es: >-
        El ogro va acompañado de un gnoblar vestido de loro. El disfraz emplumado es un disfraz
        obligatorio en una ciudad como Marienburg. Un Cazatesoros Ogro con un Gnoblar Loro puede
        apropiarse de salvamentos para la banda después de cada batalla. Tira en la Tabla de Carga
        si el Cazatesoros Ogro no quedó Fuera de combate. Un Gnoblar Loro es un gnoblar 'reclamado',
        lo que significa que se representa en la propia miniatura del ogro.
    name_i18n:
      es: Gnoblar Loro
  - id: hireling.hired-sword.ogre-treasure-hunter.rule.scrap-dealer
    name: Scrap-Dealer
    effect: >-
      A warband with an Ogre Treasure Hunter can arrange trade deals with other warbands without
      requirement of a wagon or other vehicle. If the player wants to benefit from having a
      reputation in trade deals then a vehicle will be required.
    effect_i18n:
      es: >-
        Una banda con un Cazatesoros Ogro puede acordar tratos comerciales con otras bandas sin
        necesidad de un carro u otro vehículo. Si el jugador quiere beneficiarse de tener reputación
        en los tratos comerciales, entonces sí se requerirá un vehículo.
    name_i18n:
      es: Chatarrero
  source_refs:
  - manual: broheim.net
    printed_page: 1
    section: Specialists / Ogre Treasure-Hunter
    url: https://broheim.net/downloads/hiredswords/mutinyinmarienburg/Specialists.pdf
- id: hireling.hired-sword.grave-warden
  kind: hired-sword
  grade: 2b
  publication: Mutiny in Marienburg Specialists (Broheim)
  name: Grave Warden
  name_i18n:
    es: Guardián de los Jardines
  normalization_status: normalized
  characteristics:
    M: 4
    WS: 3
    BS: 3
    S: 3
    T: 3
    W: 1
    I: 4
    A: 1
    Ld: 6
  warband_rating:
    kind: base_plus_experience
    base: 10
    per_experience_point: 1
  equipment:
    fixed_items:
    - item_id: shovel
      quantity:
        kind: fixed
        value: 1
      notes: Counts as an axe; MiM-specific item, no KB equivalent — deliberate dangling ref, define at
        promotion if ever needed mechanically.
      notes_i18n:
        es: >-
          Cuenta como hacha; objeto específico de MiM, sin equivalente en el KB; referencia
          pendiente deliberada, definir en la promoción si alguna vez se necesita mecánicamente.
    - item_id: toughened_leathers
      quantity:
        kind: fixed
        value: 1
    - item_id: wheelbarrow
      quantity:
        kind: fixed
        value: 1
  skill_access:
  - combat
  - speed
  starting_skill_ids: []
  rules:
  - id: hireling.hired-sword.grave-warden.rule.immune-to-disease
    name: Immune to Disease
    effect: >-
      Grave Wardens guard against those who would disturb the dead from their rest, be they rats,
      bone pickers, grave robbers or worse. Hardy constitution further fortified by drinking bowls
      of graveroot soup means a Grave Warden is not affected by any disease.
    effect_i18n:
      es: >-
        Los Guardianes de los Jardines custodian contra aquellos que perturbarían el descanso de los
        muertos, sean ratas, deshuesadores, ladrones de tumbas o peores. Una constitución recia,
        fortalecida además por cuencos de sopa de raíz de tumba, hace que un Guardián de los
        Jardines no se vea afectado por ninguna enfermedad.
    name_i18n:
      es: Inmune a las Enfermedades
  - id: hireling.hired-sword.grave-warden.rule.hardened
    name: Hardened
    effect: Tending the Gardens comes with heavy responsibilities. Grave Wardens are immune to fear.
    effect_i18n:
      es: >-
        Mantener los Jardines conlleva grandes responsabilidades. Los Guardianes de los Jardines son
        inmunes al Miedo.
    name_i18n:
      es: Endurecido
  - id: hireling.hired-sword.grave-warden.rule.gardener
    name: Gardener
    effect: >-
      Stout-hearted are Morr's Gardeners, offering a grim welcome to anyone who dares trespass into
      his domain. A Grave Warden must move towards the nearest model that attacked a grave marker
      (or trespassing in a tomb) if he has line of sight. The Grave Warden hates all models defiling
      graves and charges any trespassers.
    effect_i18n:
      es: >-
        Firmes son los Jardineros de Morr, que ofrecen una sombría bienvenida a cualquiera que se
        atreva a invadir su dominio. Un Guardián de los Jardines debe moverse hacia la miniatura más
        cercana que haya atacado un marcador de tumba (o que esté invadiendo una tumba) si tiene
        línea de visión. El Guardián de los Jardines odia a todas las miniaturas que profanen tumbas
        y carga contra cualquier intruso.
    name_i18n:
      es: Jardinero
  source_refs:
  - manual: broheim.net
    printed_page: 2
    section: Specialists / Grave Warden
    url: https://broheim.net/downloads/hiredswords/mutinyinmarienburg/Specialists.pdf
- id: hireling.hired-sword.halfling-fence
  kind: hired-sword
  grade: 2b
  publication: Mutiny in Marienburg Specialists (Broheim)
  name: Halfling Fence
  name_i18n:
    es: Receptor Mediano
  normalization_status: normalized
  characteristics:
    M: 4
    WS: 2
    BS: 4
    S: 2
    T: 2
    W: 1
    I: 4
    A: 1
    Ld: 8
  warband_rating:
    kind: base_plus_experience
    base: 15
    per_experience_point: 1
  equipment:
    fixed_items:
    - item_id: pistol
      quantity:
        kind: fixed
        value: 1
    - item_id: dagger
      quantity:
        kind: fixed
        value: 1
  skill_access:
  - speed
  - shooting
  starting_skill_ids: []
  rules:
  - id: hireling.hired-sword.halfling-fence.rule.sham
    name: Sham
    effect: >-
      A Fence has an eclectic range of items procured from sources best left unspoken. Offered at
      incredible prices, traders should be wary for their word is not their bond and such items are
      often flawed… All of the items purchased through the Fence are at their base price (ie, do not
      add the random gold modifier for items). All items bought from the Fence are also at half
      price but once the item is first used roll a D6. On a roll of 1 the item breaks and is useless
      – an elaborate fake! At the end of each battle (whether or not the Halfling Fence actually
      took part), roll a D6 and consult the following chart. D6 Result 1 Halfling cookbook 2
      Ithilmar weapon 3 Gromril weapon 4 Tome of magic or Holy tome 5 Hunting rifle or Elven bow 6
      Brace of duelling pistols.
    effect_i18n:
      es: >-
        Un Receptor tiene una ecléctica gama de artículos conseguidos en fuentes mejor no mencionar.
        Ofrecidos a precios increíbles, los comerciantes deberían andarse con cuidado, pues su
        palabra no es de fiar y tales artículos a menudo son defectuosos… Todos los artículos
        comprados a través del Receptor están a su precio base (es decir, no se añade el modificador
        aleatorio de oro de los artículos). Todos los artículos comprados al Receptor están además a
        mitad de precio, pero la primera vez que se use el artículo tira un D6. Con un resultado de
        1 el artículo se rompe y queda inservible: ¡una falsificación elaborada! Al final de cada
        batalla (tanto si el Receptor Mediano participó como si no), tira un D6 y consulta la
        siguiente tabla. Resultado D6 1 Libro de cocina mediano 2 Arma de ithilmar 3 Arma de gromril
        4 Tomo de magia o Tomo sagrado 5 Rifle de caza o Arco élfico 6 Par de pistolas de duelo.
    name_i18n:
      es: Engaño
  source_refs:
  - manual: broheim.net
    printed_page: 2
    section: Specialists / Halfling Fence
    url: https://broheim.net/downloads/hiredswords/mutinyinmarienburg/Specialists.pdf
