    es: Miedo
- id: hireling.hired-sword.ogre-bodyguard.rule.large-target
  name: Large Target
  effect: The Ogre Bodyguard counts as a Large Target.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Hired Swords / Ogre Bodyguard / Special Rules / Large Target
    url: https://mordheimer.net/docs/campaigns/hired-swords/grade-1a
  name_i18n:
    en: Large Target
    es: Objetivo grande
- id: hireling.hired-sword.warlock.rule.wizard
  name: Wizard
  effect: The Warlock begins with two randomly generated Lesser Magic spells.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Hired Swords / Warlock / Special Rules / Wizard
