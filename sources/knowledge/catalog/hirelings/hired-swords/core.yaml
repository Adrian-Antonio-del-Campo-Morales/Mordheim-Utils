rules:
- id: hireling.hired-sword.dwarf-troll-slayer.rule.deathwish
  name: Deathwish
  effect: The Troll Slayer is immune to psychology and does not test for fighting alone.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Hired Swords / Dwarf Troll Slayer / Special Rules / Deathwish
    url: https://mordheimer.net/docs/campaigns/hired-swords/grade-1a
  name_i18n:
    en: Deathwish
    es: Deseo de muerte
- id: hireling.hired-sword.dwarf-troll-slayer.rule.hard-to-kill
  name: Hard to Kill
  effect: On the Injury chart the Troll Slayer is taken Out of Action only on a 6; a 5 is Stunned.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Hired Swords / Dwarf Troll Slayer / Special Rules / Hard to Kill
    url: https://mordheimer.net/docs/campaigns/hired-swords/grade-1a
  name_i18n:
    en: Hard to Kill
    es: Difíciles de matar
- id: hireling.hired-sword.dwarf-troll-slayer.rule.hard-head
  name: Hard Head
  effect: The Troll Slayer ignores the special concussion-style rules of maces and clubs.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Hired Swords / Dwarf Troll Slayer / Special Rules / Hard Head
    url: https://mordheimer.net/docs/campaigns/hired-swords/grade-1a
  name_i18n:
    en: Hard Head
    es: Cabeza dura
- id: hireling.hired-sword.dwarf-troll-slayer.skill.ferocious-charge
  name: Ferocious Charge
  kind: special-skill-option
  effect: On a charge the Slayer may double his Attacks and suffers -1 To Hit that turn.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Hired Swords / Dwarf Troll Slayer / Troll Slayer Skills / Ferocious Charge
    url: https://mordheimer.net/docs/campaigns/hired-swords/grade-1a
  name_i18n:
    en: Ferocious Charge
    es: Carga feroz
- id: hireling.hired-sword.dwarf-troll-slayer.skill.monster-slayer
  name: Monster Slayer
  kind: special-skill-option
  effect: The Slayer wounds on 4+ regardless of Toughness unless his modified Strength would require a
    lower roll.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Hired Swords / Dwarf Troll Slayer / Troll Slayer Skills / Monster Slayer
    url: https://mordheimer.net/docs/campaigns/hired-swords/grade-1a
  name_i18n:
    en: Monster Slayer
    es: Matamostro
- id: hireling.hired-sword.dwarf-troll-slayer.skill.berserker
  name: Berserker
  kind: special-skill-option
  effect: The Slayer gains +1 To Hit during the turn he charges.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Hired Swords / Dwarf Troll Slayer / Troll Slayer Skills / Berserker
    url: https://mordheimer.net/docs/campaigns/hired-swords/grade-1a
  name_i18n:
    en: Berserker
    es: Berserker
- id: hireling.hired-sword.elf-ranger.rule.seeker
  name: Seeker
  effect: During Exploration the Elf Ranger allows one exploration die to be modified by +1 or -1.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Hired Swords / Elf Ranger / Special Rules / Seeker
    url: https://mordheimer.net/docs/campaigns/hired-swords/grade-1a
  name_i18n:
    en: Seeker
    es: Buscador
- id: hireling.hired-sword.elf-ranger.rule.excellent-sight
  name: Excellent Sight
  effect: The Elf Ranger detects Hidden enemies at twice the normal Initiative-based distance.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Hired Swords / Elf Ranger / Special Rules / Excellent Sight
    url: https://mordheimer.net/docs/campaigns/hired-swords/grade-1a
  name_i18n:
    en: Excellent Sight
    es: Vista excepcional
- id: hireling.hired-sword.elf-ranger.skill.fey
  name: Fey
  kind: special-skill-option
  effect: Hostile spells fail to affect the Elf on a 4+ D6 roll.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Hired Swords / Elf Ranger / Elven Skills / Fey
    url: https://mordheimer.net/docs/campaigns/hired-swords/grade-1a
  name_i18n:
    en: Fey
    es: Hada
- id: hireling.hired-sword.elf-ranger.skill.luck
  name: Luck
  kind: special-skill-option
  effect: Once per game the Elf Ranger may reroll one of his own dice rolls.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Hired Swords / Elf Ranger / Elven Skills / Luck
    url: https://mordheimer.net/docs/campaigns/hired-swords/grade-1a
  name_i18n:
    en: Luck
    es: Suerte
- id: hireling.hired-sword.halfling-scout.rule.cook
  name: Cook
  effect: While the Halfling Scout is employed, the warband's maximum size increases by 1 without increasing
    its Hero limit.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Hired Swords / Halfling Scout / Special Rules / Cook
    url: https://mordheimer.net/docs/campaigns/hired-swords/grade-1a
  name_i18n:
    en: Cook
    es: Cocinero
- id: hireling.hired-sword.ogre-bodyguard.rule.fear
  name: Fear
  effect: The Ogre Bodyguard causes fear.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Hired Swords / Ogre Bodyguard / Special Rules / Fear
    url: https://mordheimer.net/docs/campaigns/hired-swords/grade-1a
  name_i18n:
