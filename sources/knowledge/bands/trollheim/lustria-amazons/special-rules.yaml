schema_version: 2
band_id: lustria-amazons
rules:
- id: amazon-priestess--leader
  name: Leader
  effect: Any warband model within 6" of the Priestess may use her Leadership when taking Leadership tests.
  source:
    manual: lustria
    printed_page: 70
    section: Heroes / 1 Priestess / Leader
  name_i18n:
    en: Leader
    es: Líder
  effect_i18n:
    en: Any warband model within 6" of the Priestess may use her Leadership when taking Leadership tests.
    es: Cualquier modelo de la banda a 6" de la Sacerdotisa puede usar su Liderazgo al realizar chequeos
      de Liderazgo.
  applies_to:
    profile_ids:
    - amazon-priestess
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.lustria-amazons.amazon-priestess.leader
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology or mounts.'
- id: amazon-priestess--wizard
  name: Wizard
  effect: The Priestess is a spellcaster and may use Ritual Chants. She begins with one randomly generated
    ritual. The ritual list and ritual effects are intentionally not modelled in this file.
  source:
    manual: lustria
    printed_page: 70
    section: Heroes / 1 Priestess / Wizard
  name_i18n:
    en: Wizard
    es: Hechicera
  effect_i18n:
    en: The Priestess is a spellcaster and may use Ritual Chants. She begins with one randomly generated
      ritual. The ritual list and ritual effects are intentionally not modelled in this file.
    es: La Sacerdotisa es una lanzadora de hechizos y puede usar Cantos rituales. Comienza con un ritual
      generado al azar. La lista de rituales y sus efectos no se modelan intencionadamente en este archivo.
  applies_to:
    profile_ids:
    - amazon-priestess
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.lustria-amazons.amazon-priestess.wizard
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, magic, or non-duel context.'
- id: amazon-totem-warriors--frenzy
  runtime:
    scope: LATER
    implemented: 'YES'
    grant: profile
    effects:
    - id: trait.frenzy
      scope: LATER
      binding:
        kind: trait
        id: trait.frenzy
        parameters:
          value: true
  name: Frenzy
  effect: Totem Warriors are subject to the Frenzy rules.
  source:
    manual: lustria
    printed_page: 70
    section: Heroes / 0-2 Totem Warriors / Frenzy
  name_i18n:
    en: Frenzy
    es: Frenesí
  effect_i18n:
    en: Totem Warriors are subject to the Frenzy rules.
    es: Los Guerreros tótem están sujetos a las reglas de Frenesí.
  applies_to:
    profile_ids:
    - amazon-totem-warriors
- id: amazon-scouts--silent
  name: Silent
  effect: Scouts may deploy at twice the normal deployment distance allowed to the rest of the warband
    and may begin the battle Hidden.
  source:
    manual: lustria
    printed_page: 71
    section: Henchmen / 0-3 Scouts / Silent
  name_i18n:
    en: Silent
    es: Silenciosas
  effect_i18n:
    en: Scouts may deploy at twice the normal deployment distance allowed to the rest of the warband and
      may begin the battle Hidden.
    es: Las Exploradoras pueden desplegarse al doble de la distancia normal de despliegue permitida al
      resto de la banda y pueden comenzar la batalla Ocultas.
  applies_to:
    profile_ids:
    - amazon-scouts
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.lustria-amazons.amazon-scouts.silent
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, magic, or non-duel context.'
- id: amazon-scouts--animal-companion
  name: Animal Companion
  effect: Each Scout allows the warband to acquire one Great Cat. That Great Cat must deploy alongside
    its Scout at the start of the battle.
  source:
    manual: lustria
    printed_page: 71
    section: Henchmen / 0-3 Scouts / Animal Companion
  name_i18n:
    en: Animal Companion
    es: Compañero animal
  effect_i18n:
    en: Each Scout allows the warband to acquire one Great Cat. That Great Cat must deploy alongside its
      Scout at the start of the battle.
    es: Cada Exploradora permite a la banda adquirir un Gran felino. Ese Gran felino debe desplegarse
      junto a su Exploradora al comienzo de la batalla.
  applies_to:
    profile_ids:
    - amazon-scouts
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.lustria-amazons.amazon-scouts.animal-companion
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, magic, or non-duel context.'
- id: great-cats--animal
  name: Animal
  effect: Great Cats are animals and never gain Experience.
  source:
    manual: lustria
    printed_page: 71
    section: Henchmen / 0-3 Great Cats / Animal
  name_i18n:
    en: Animal
    es: Animal
  effect_i18n:
    en: Great Cats are animals and never gain Experience.
    es: Los Grandes felinos son animales y nunca ganan Experiencia.
  applies_to:
    profile_ids:
    - great-cats
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.lustria-amazons.great-cats.animal
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, magic, or non-duel context.'
- id: great-cats--natural-stealth
  name: Natural Stealth
  effect: While a Great Cat is Hidden, enemy models suffer -1 Initiative when determining whether they
    can detect it.
  source:
    manual: lustria
    printed_page: 71
    section: Henchmen / 0-3 Great Cats / Natural Stealth
  name_i18n:
    en: Natural Stealth
    es: Sigilo natural
  effect_i18n:
    en: While a Great Cat is Hidden, enemy models suffer -1 Initiative when determining whether they can
      detect it.
    es: Mientras un Gran felino esté Oculto, los modelos enemigos sufren -1 de Iniciativa al determinar
      si pueden detectarlo.
  applies_to:
    profile_ids:
    - great-cats
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.lustria-amazons.great-cats.natural-stealth
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, magic, or non-duel context.'
- id: great-cats--animal-companion
  name: Animal Companion
  effect: A Great Cat must deploy alongside its Scout at the start of the battle. If that Scout is taken
    Out of Action during the battle, the Great Cat is subject to Frenzy until the end of the battle. If
    that Scout dies or is dismissed from the warband, the Great Cat also leaves the warband.
  source:
    manual: lustria
    printed_page: 71
    section: Henchmen / 0-3 Great Cats / Animal Companion
  name_i18n:
    en: Animal Companion
    es: Compañero animal
  effect_i18n:
    en: A Great Cat must deploy alongside its Scout at the start of the battle. If that Scout is taken
      Out of Action during the battle, the Great Cat is subject to Frenzy until the end of the battle.
      If that Scout dies or is dismissed from the warband, the Great Cat also leaves the warband.
    es: Un Gran felino debe desplegarse junto a su Exploradora al comienzo de la batalla. Si esa Exploradora
      sale de Combate durante la batalla, el Gran felino está sujeto a Frenesí hasta el final de la batalla.
      Si esa Exploradora muere o es despedida de la banda, el Gran felino también abandona la banda.
  applies_to:
    profile_ids:
    - great-cats
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.lustria-amazons.great-cats.animal-companion
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology or mounts.'
- id: band--sacrifice
  name: Sacrifice
  effect: Whenever the Amazons capture or find a captive after a battle, that captive must be sacrificed.
    The Priestess gains +1 Experience.
  source:
    manual: lustria
    printed_page: 67
    section: Amazon Special Rules / Sacrifice
  name_i18n:
    en: Sacrifice
    es: Sacrificio
  effect_i18n:
    en: Whenever the Amazons capture or find a captive after a battle, that captive must be sacrificed.
      The Priestess gains +1 Experience.
    es: Siempre que las Amazonas capturen o encuentren un cautivo tras una batalla, ese cautivo debe ser
      sacrificado. La Sacerdotisa gana +1 Experiencia.
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.lustria-amazons.band.sacrifice
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, magic, or non-duel context.'
- id: band--not-one-of-us
  name: Not One of Us
  effect: The Amazons may not ally with any other warband and may not hire Hired Swords or Dramatis Personae
    unless those warriors are also Amazons.
  source:
    manual: lustria
    printed_page: 67
    section: Amazon Special Rules / Not One of Us
  name_i18n:
    en: Not One of Us
    es: No somos de los suyos
  effect_i18n:
    en: The Amazons may not ally with any other warband and may not hire Hired Swords or Dramatis Personae
      unless those warriors are also Amazons.
    es: Las Amazonas no pueden aliarse con ninguna otra banda ni contratar Espadas contratadas ni Personajes
      dramáticos salvo que esos guerreros sean también Amazonas.
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.lustria-amazons.band.not-one-of-us
      scope: 'NO'
      binding: null
      reason: 'Out of scope: no effect applies to the isolated 1v1 duel or legal fighter skill/equipment
        construction.'
- id: band--isolationists
  name: Isolationists
  effect: All Amazons are subject to Hatred against Norse and Lizardmen.
  source:
    manual: lustria
    printed_page: 67
    section: Amazon Special Rules / Isolationists
  name_i18n:
    en: Isolationists
    es: Aislacionistas
  effect_i18n:
    en: All Amazons are subject to Hatred against Norse and Lizardmen.
    es: Todas las Amazonas están sujetas a Odio contra los Norse y los Hombres lagarto.
  applies_to:
    band: true
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.lustria-amazons.band.isolationists
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology or mounts.'
- id: band--norse-enmity
  name: Norse Enmity
  effect: When fighting a Norse warband, the Amazons may re-roll their first failed Rout test and may
    never voluntarily Rout.
  source:
    manual: lustria
    printed_page: 67
    section: Amazon Special Rules / Norse Enmity
  name_i18n:
    en: Norse Enmity
    es: Enemistad con los Norse
  effect_i18n:
    en: When fighting a Norse warband, the Amazons may re-roll their first failed Rout test and may never
      voluntarily Rout.
    es: Al combatir contra una banda Norse, las Amazonas pueden repetir su primer chequeo de Retirada
      fallado y nunca pueden retirarse voluntariamente.
  applies_to:
    band: true
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.lustria-amazons.band.norse-enmity
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology or mounts.'
- id: band--great-cat-limit
  name: Great Cat Limit
  effect: The warband may include no more than one Great Cat for each Scout currently in the warband.
  source:
    manual: lustria
    printed_page: 67
    section: Choice of Warriors / Great Cats
  name_i18n:
    en: Great Cat Limit
    es: Límite de Grandes felinos
  effect_i18n:
    en: The warband may include no more than one Great Cat for each Scout currently in the warband.
    es: La banda no puede incluir más de un Gran felino por cada Exploradora presente actualmente en la
      banda.
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.lustria-amazons.band.great-cat-limit
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, magic, or non-duel context.'
- id: band--amazon-special-skills-lizard-hunter
  kind: warband_skill
  name: Lizard Hunter
  effect: The Hero always strikes first in close combat when fighting any type of Skink, regardless of
    the weapon used or which model charged.
  source:
    manual: lustria
    printed_page: 72
    section: Amazon Special Skills / Lizard Hunter
  name_i18n:
    en: Lizard Hunter
    es: Cazadora de lagartos
  effect_i18n:
    en: The Hero always strikes first in close combat when fighting any type of Skink, regardless of the
      weapon used or which model charged.
    es: La Héroe siempre golpea primero en combate cuerpo a cuerpo al combatir contra cualquier tipo de
      Skink, sin importar el arma empleada ni qué modelo cargó.
  eligibility:
  - amazon-priestess
  - amazon-champions
  - amazon-totem-warriors
  applies_to:
    band: true
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: mechanic.strike-first-vs-skinks-always
      scope: 'YES'
      binding:
        kind: mechanic
        id: mechanic.strike-first-vs-skinks-always
- id: band--amazon-special-skills-concealment
  kind: warband_skill
  name: Concealment
  effect: When the Hero is Hidden in jungle terrain or vegetation, enemy models halve their Initiative
    when determining whether they can detect her.
  source:
    manual: lustria
    printed_page: 72
    section: Amazon Special Skills / Concealment
  name_i18n:
    en: Concealment
    es: Ocultamiento
  effect_i18n:
    en: When the Hero is Hidden in jungle terrain or vegetation, enemy models halve their Initiative when
      determining whether they can detect her.
    es: Cuando la Héroe esté Oculta en terreno de selva o vegetación, los modelos enemigos dividen su
      Iniciativa a la mitad al determinar si pueden detectarla.
  eligibility:
  - amazon-priestess
  - amazon-champions
  - amazon-totem-warriors
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.lustria-amazons.band.amazon-special-skills-concealment
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, magic, or non-duel context.'
- id: band--amazon-special-skills-hypnotic-dance
  kind: warband_skill
  name: Hypnotic Dance
  effect: At the start of the Combat phase, any enemy model that wants to attack the Hero must pass a
    Leadership test. If it fails, it may not attack that phase but may defend itself normally. Undead
    and Lizardmen are unaffected.
  source:
    manual: lustria
    printed_page: 72
    section: Amazon Special Skills / Hypnotic Dance
  name_i18n:
    en: Hypnotic Dance
    es: Danza hipnótica
  effect_i18n:
    en: At the start of the Combat phase, any enemy model that wants to attack the Hero must pass a Leadership
      test. If it fails, it may not attack that phase but may defend itself normally. Undead and Lizardmen
      are unaffected.
    es: Al comienzo de la fase de Combate, cualquier modelo enemigo que quiera atacar a la Héroe debe
      superar un chequeo de Liderazgo. Si falla, no puede atacar esa fase, pero puede defenderse con normalidad.
      Los No muertos y los Hombres lagarto no se ven afectados.
  eligibility:
  - amazon-priestess
  - amazon-champions
  - amazon-totem-warriors
  applies_to:
    band: true
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.lustria-amazons.band.amazon-special-skills-hypnotic-dance
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology or mounts.'
- id: band--amazon-special-skills-animal-fury
  kind: warband_skill
  name: Animal Fury
  effect: The Hero is immune to Fear and All Alone tests and gains +1 Attack during a turn in which she
    charges.
  source:
    manual: lustria
    printed_page: 72
    section: Amazon Special Skills / Animal Fury
  name_i18n:
    en: Animal Fury
    es: Furia animal
  effect_i18n:
    en: The Hero is immune to Fear and All Alone tests and gains +1 Attack during a turn in which she
      charges.
    es: La Héroe es inmune al Miedo y a los chequeos de Completamente solo, y gana +1 Ataque durante un
      turno en el que cargue.
  eligibility:
  - amazon-priestess
  - amazon-champions
  - amazon-totem-warriors
  applies_to:
    band: true
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.lustria-amazons.band.amazon-special-skills-animal-fury
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology or mounts.'
- id: band--amazon-special-skills-elixir-of-life
  kind: warband_skill
  name: Elixir of Life
  effect: After a battle, the Hero may re-roll her Injury roll once and must accept the second result
    even if it is worse.
  source:
    manual: lustria
    printed_page: 72
    section: Amazon Special Skills / Elixir of Life
  name_i18n:
    en: Elixir of Life
    es: Elixir de vida
  effect_i18n:
    en: After a battle, the Hero may re-roll her Injury roll once and must accept the second result even
      if it is worse.
    es: Tras una batalla, la Héroe puede repetir una vez su tirada de Heridas y debe aceptar el segundo
      resultado aunque sea peor.
  eligibility:
  - amazon-priestess
  - amazon-champions
  - amazon-totem-warriors
  applies_to:
