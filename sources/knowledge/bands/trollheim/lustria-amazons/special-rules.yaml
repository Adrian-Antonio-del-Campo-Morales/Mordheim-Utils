- id: great-cats--animal-companion
  name: Animal Companion
  effect: A Great Cat must deploy alongside its Scout at the start of the battle. If that Scout is taken Out of Action during
    the battle, the Great Cat is subject to Frenzy until the end of the battle. If that Scout dies or is dismissed from the
    warband, the Great Cat also leaves the warband.
  source:
    manual: lustria
    printed_page: 71
    section: Henchmen / 0-3 Great Cats / Animal Companion
  name_i18n:
    en: Animal Companion
    es: null
  effect_i18n:
