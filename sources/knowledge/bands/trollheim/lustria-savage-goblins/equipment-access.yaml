- id: savage-goblin-hero-equipment-list
  name: Savage Goblin Hero Equipment List
  items:
  - item_id: dagger
    cost: 2
    notes: First dagger is free.
  - item_id: club
    cost: 3
  - item_id: sacrifice_dagger
    cost: 10
    notes: Witch Doctor only; Common. Internal weapon and sacrifice mechanics are intentionally not modelled here.
  - item_id: sword
    cost: 10
  - item_id: spear
    cost: 10
  - item_id: halberd
    cost: 10
  - item_id: great_weapon
    cost: 15
  - item_id: short_bow
    cost: 5
  - item_id: bolas
    cost: 5
  - item_id: javelin
    cost: 10
  - item_id: shrunken_head
    cost: 25
    notes: Savage Goblins only; the detailed entry is Rare 6. Internal missile-weapon mechanics are intentionally not modelled
      here.
  - item_id: blowpipe
    cost: 25
  - item_id: shield
    cost: 5
  - item_id: light_armour
    cost: 20
  - item_id: feather_headdress
    cost: 20
    notes: Warband leader only. At creation the mandatory Witch Doctor is the leader. The detailed entry is Rare 6 and states
      that the headdress is inherited by each new leader and must be worn. Internal item mechanics are intentionally not modelled
      here.
  - item_id: dark_venom
    cost: 20
    notes: 'Available at this listed price only during warband creation. Afterwards use Trading; the general list gives 30+2D6
      gc and Rare 6 for Savage Goblins. Internal poison mechanics are intentionally not modelled here. Source label: black
      venom.'
  - item_id: black_lotus
    cost: 10
    notes: Available at this listed price only during warband creation. Afterwards use Trading; the general list gives 10+1D6
      gc and Rare 7 for Savage Goblins. Internal poison mechanics are intentionally not modelled here.
  - item_id: spider_spit
    cost: 25
    notes: Available at this listed price only during warband creation. Afterwards use Trading; the general list gives 25+1D6
      gc and Rare 7 for Savage Goblins. Internal poison mechanics are intentionally not modelled here.
  - item_id: magic_tattoos
    cost: 30
    notes: The general Trading list gives 30 gc, Rare 9. Internal item mechanics are intentionally not modelled here.
  source:
    manual: lustria
    printed_page: 97
    section: Savage Goblin Hero Equipment List
  name_i18n:
    en: Savage Goblin Hero Equipment List
    es: null
