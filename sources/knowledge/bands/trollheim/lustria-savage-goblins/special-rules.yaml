- id: witch-doctor--return-from-the-darkness
  name: Return from the Darkness
  effect: After a Primitive Goblin dies, the Witch Doctor may add one Zomblin to the warband for free, even if this takes
    the warband above its normal 20-model limit. If more than one Goblin died, the first may be returned automatically; each
    second and subsequent Goblin is returned only on a 4+ on D6. The warband may never contain more than five Zomblins.
  source:
    manual: lustria
    printed_page: 100
    section: Heroes / 1 Witch Doctor / Return from the Darkness
  name_i18n:
    en: Return from the Darkness
    es: null
  effect_i18n:
    en: After a Primitive Goblin dies, the Witch Doctor may add one Zomblin to the warband for free, even if this takes the
      warband above its normal 20-model limit. If more than one Goblin died, the first may be returned automatically; each
      second and subsequent Goblin is returned only on a 4+ on D6. The warband may never contain more than five Zomblins.
    es: null
  applies_to:
    profile_ids:
    - witch-doctor
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.lustria-savage-goblins.witch-doctor.return-from-the-darkness
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, magic, or non-duel context.'
- id: big-boss--second-in-command
