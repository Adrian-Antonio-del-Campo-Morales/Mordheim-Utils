- id: band--animosity
  name: Animosity
  effect: 'At the start of the warband''s turn, roll D6 for each eligible Goblin Henchman that is not engaged in close combat.
    On a 1, roll another D6: 1 = "I Heard That!": if possible the Goblin immediately charges the nearest Goblin Henchman or
    Hired Sword in charge range and fights one round; after that round separate the models by 1". If no such charge is possible
    but the Goblin can shoot, it shoots the nearest eligible friendly target. If neither is possible, or the nearest Goblin
    is a Hero, treat the result as 2-5. 2-5 = "What Did You Call Me?": the Goblin does nothing else that turn except defend
    itself if attacked. 6 = "I''ll Show You!": the Goblin immediately moves as quickly as possible toward the nearest visible
    enemy and charges if possible; if no enemy is visible, it immediately makes a normal move. This is additional to its normal
    Movement-phase move.'
  source:
    manual: lustria
    printed_page: 98
    section: Savage Goblin Special Rules / Animosity
  name_i18n:
    en: Animosity
    es: null
  effect_i18n:
    en: 'At the start of the warband''s turn, roll D6 for each eligible Goblin Henchman that is not engaged in close combat.
      On a 1, roll another D6: 1 = "I Heard That!": if possible the Goblin immediately charges the nearest Goblin Henchman
      or Hired Sword in charge range and fights one round; after that round separate the models by 1". If no such charge is
      possible but the Goblin can shoot, it shoots the nearest eligible friendly target. If neither is possible, or the nearest
      Goblin is a Hero, treat the result as 2-5. 2-5 = "What Did You Call Me?": the Goblin does nothing else that turn except
      defend itself if attacked. 6 = "I''ll Show You!": the Goblin immediately moves as quickly as possible toward the nearest
      visible enemy and charges if possible; if no enemy is visible, it immediately makes a normal move. This is additional
      to its normal Movement-phase move.'
    es: null
  eligibility:
  - savage-goblins
  - headhunters
  - bruisers
  applies_to:
    band: true
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.lustria-savage-goblins.band.animosity
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology or mounts.'
