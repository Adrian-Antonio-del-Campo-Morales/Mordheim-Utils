  name: Regeneration
  effect: Whenever Zomblintua suffers a Wound, roll D6; on 5+ that Wound is ignored. Wounds caused by fire or fire-based magic
    cannot be regenerated. After a battle, Zomblintua does not roll for Serious Injuries unless the relevant wounds were caused
    by fire.
