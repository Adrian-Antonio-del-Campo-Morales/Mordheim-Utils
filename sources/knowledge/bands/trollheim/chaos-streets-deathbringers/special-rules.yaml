  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: skill.art-of-silent-death
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.art-of-silent-death
  name: Art of Unarmed Combat
  effect: The Hero may fight with bare claws without penalty and counts as using two close-combat weapons, gaining +1 Attack.
    In close combat, it scores a critical hit on a 'to wound' roll of 5-6 instead of only 6. When combined with Eshin Fighting
    Claws, this grants +2 Attacks instead of +1.
  source:
    manual: chaos-in-the-streets
    printed_page: 165
    section: Deathbringer Special Skills / Art of Unarmed Combat
  name_i18n:
    en: Art of Unarmed Combat
    es: null
