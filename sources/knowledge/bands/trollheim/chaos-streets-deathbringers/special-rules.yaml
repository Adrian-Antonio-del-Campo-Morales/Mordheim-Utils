      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.defensive-stance
  name: Defensive Stance
  effect: The Hero may parry with any weapon it carries. If that weapon already has the Parry rule, the Hero may successfully
    parry by equalling the attack roll instead of having to exceed it.
  source:
    manual: chaos-in-the-streets
    printed_page: 165
    section: Deathbringer Special Skills / Defensive Stance
  name_i18n:
