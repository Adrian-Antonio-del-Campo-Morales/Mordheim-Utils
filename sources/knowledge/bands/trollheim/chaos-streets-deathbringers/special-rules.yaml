- id: band--leader-death
  name: Death of the Boss
  effect: The warband leader should cause Fear whenever possible. If the leader dies, first choose a successor among Heroes
    with Horrible Scars, the Fearsome skill, or another rule that causes Fear. If no such Hero exists, choose a successor
    normally; that new Boss must select Fearsome at the next skill advance for which it is eligible, as soon as possible.
    Heroes without access to Strength skills are automatically disqualified from becoming the successor.
  source:
    manual: chaos-in-the-streets
    printed_page: 157
    section: Special Rules / Death of the Boss
  name_i18n:
    en: Death of the Boss
    es: null
  effect_i18n:
    en: The warband leader should cause Fear whenever possible. If the leader dies, first choose a successor among Heroes
      with Horrible Scars, the Fearsome skill, or another rule that causes Fear. If no such Hero exists, choose a successor
      normally; that new Boss must select Fearsome at the next skill advance for which it is eligible, as soon as possible.
      Heroes without access to Strength skills are automatically disqualified from becoming the successor.
    es: null
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.chaos-streets-deathbringers.band.leader-death
      scope: 'NO'
      binding: null
      reason: 'Out of scope: no effect applies to the isolated 1v1 duel or legal fighter skill/equipment construction.'
- id: band--deathbringer-special-skills-hit-and-fade
  kind: warband_skill
  name: Hit and Fade
  effect: After charging and resolving attacks normally, if the Hero is neither Knocked Down nor Stunned, roll D6. On 5+ the
    Hero may leave combat and Hide without suffering hits for escaping combat. The Hero must have enough Movement remaining
    after the charge to reach a valid hiding position; otherwise this skill cannot be used. On a failed roll the Hero remains
    engaged.
  source:
    manual: chaos-in-the-streets
    printed_page: 165
    section: Deathbringer Special Skills / Hit and Fade
  name_i18n:
    en: Hit and Fade
    es: null
  effect_i18n:
    en: After charging and resolving attacks normally, if the Hero is neither Knocked Down nor Stunned, roll D6. On 5+ the
      Hero may leave combat and Hide without suffering hits for escaping combat. The Hero must have enough Movement remaining
      after the charge to reach a valid hiding position; otherwise this skill cannot be used. On a failed roll the Hero remains
      engaged.
    es: null
  eligibility:
  - shadow-blade
  - silent-hunter
  - black-knives
  - young-claw
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.chaos-streets-deathbringers.band.deathbringer-special-skills-hit-and-fade
      scope: 'NO'
      binding: null
      reason: 'Out of scope: no effect applies to the isolated 1v1 duel or legal fighter skill/equipment construction.'
