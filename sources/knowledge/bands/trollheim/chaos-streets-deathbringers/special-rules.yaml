      scope: 'NO'
      binding: null
      reason: 'Out of scope: no effect applies to the isolated 1v1 duel or legal fighter skill/equipment construction.'
- id: silent-hunter--infiltration
  name: Infiltration
  effect: The Silent Hunter deploys after the opposing warband and may be placed anywhere outside enemy line of sight and
    more than 12" from every enemy model. If both players have infiltrators, roll D6 for each; the lowest roll deploys first.
  source:
    manual: chaos-in-the-streets
    printed_page: 163
    section: Heroes / 0-1 Silent Hunter / Infiltration
  name_i18n:
    en: Infiltration
    es: null
