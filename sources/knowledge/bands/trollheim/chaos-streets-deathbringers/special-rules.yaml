schema_version: 2
band_id: chaos-streets-deathbringers
rules:
- id: shadow-blade--leader
  name: Leader
  effect: Any warband model within 6" of the Shadow Blade may use his Leadership when taking Leadership tests.
  source:
    manual: chaos-in-the-streets
    printed_page: 162
    section: Heroes / 1 Shadow Blade / Leader
  name_i18n:
    en: Leader
    es: null
  effect_i18n:
    en: Any warband model within 6" of the Shadow Blade may use his Leadership when taking Leadership tests.
    es: null
  applies_to:
    profile_ids:
    - shadow-blade
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.chaos-streets-deathbringers.shadow-blade.leader
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology or mounts.'
- id: shadow-blade--consummate-fighter
  name: Consummate Fighter
  effect: Wounds inflicted by the Shadow Blade, whether in shooting or close combat, impose an additional -1 modifier to the
    enemy's armour save.
  source:
    manual: chaos-in-the-streets
    printed_page: 162
    section: Heroes / 1 Shadow Blade / Consummate Fighter
  name_i18n:
    en: Consummate Fighter
    es: null
  effect_i18n:
    en: Wounds inflicted by the Shadow Blade, whether in shooting or close combat, impose an additional -1 modifier to the
      enemy's armour save.
    es: null
  applies_to:
    profile_ids:
    - shadow-blade
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: trait.perfect-killer
      scope: 'YES'
      binding:
        kind: trait
        id: trait.perfect-killer
        parameters:
          value: true
