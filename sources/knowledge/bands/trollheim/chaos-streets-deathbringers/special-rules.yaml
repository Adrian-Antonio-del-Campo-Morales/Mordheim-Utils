- id: shadow-blade--fade-into-shadows
  name: Fade into the Shadows
  effect: At the beginning of a close-combat round, the Shadow Blade may declare a voluntary Rout for the warband provided
    the warband has already suffered the minimum casualties required to Rout. This decision may therefore be made during the
    turn rather than only at its beginning.
  source:
    manual: chaos-in-the-streets
    printed_page: 162
    section: Heroes / 1 Shadow Blade / Fade into the Shadows
  name_i18n:
    en: Fade into the Shadows
    es: null
  effect_i18n:
    en: At the beginning of a close-combat round, the Shadow Blade may declare a voluntary Rout for the warband provided the
      warband has already suffered the minimum casualties required to Rout. This decision may therefore be made during the
      turn rather than only at its beginning.
    es: null
  applies_to:
    profile_ids:
    - shadow-blade
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
