- id: band--hired-swords
  name: Hired Swords
  effect: The warband may hire Hired Swords available to Mercenary warbands and any Hired Sword explicitly
    willing to work for any warband.
  source:
    manual: chaos-in-the-streets
    printed_page: 145
    section: Special Rules / Hired Swords
  name_i18n:
    en: Hired Swords
    es: Espadas a Sueldo
  effect_i18n:
    en: The warband may hire Hired Swords available to Mercenary warbands and any Hired Sword explicitly
      willing to work for any warband.
    es: La banda puede contratar Espadas a Sueldo disponibles para las bandas Mercenarias y cualquier
      Espada a Sueldo explícitamente dispuesta a trabajar para cualquier banda.
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
