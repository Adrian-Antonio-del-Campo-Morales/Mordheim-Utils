- id: cripples--disability
  name: Disability
  effect: >-
    When a Cripple Henchman group is created, roll D6 once and apply that result permanently to the
    entire group: 1 Lame and Arthritic — reduce Movement and Initiative by 1; 2 Parkinson's — reduce
    Weapon Skill by 1 and the models may not use two weapons or a weapon and shield; 3 Poor Eyesight
    — reduce Ballistic Skill by 1; 4 Sickly — reduce Toughness by 1; 5 Weakness — reduce Strength by
    1; 6 Head Injury — the group is subject to Stupidity unless within 6" of a Hero.
  source:
    manual: chaos-in-the-streets
    printed_page: 149
    section: Henchmen / Cripples / Special Rules / Disability
  name_i18n:
    en: Disability
    es: Discapacidad
  effect_i18n:
    en: 'When a Cripple Henchman group is created, roll D6 once and apply that result permanently to the
      entire group: 1 Lame and Arthritic — reduce Movement and Initiative by 1; 2 Parkinson''s — reduce
      Weapon Skill by 1 and the models may not use two weapons or a weapon and shield; 3 Poor Eyesight
      — reduce Ballistic Skill by 1; 4 Sickly — reduce Toughness by 1; 5 Weakness — reduce Strength by
      1; 6 Head Injury — the group is subject to Stupidity unless within 6" of a Hero.'
    es: 'Cuando se crea un grupo de secuaces Lisiados, tira 1D6 una vez y aplica ese resultado permanentemente
      a todo el grupo: 1 Cojo y artrítico: reduce Movimiento e Iniciativa en 1; 2 Mal de Parkinson: reduce
      Habilidad de Armas en 1 y los modelos no pueden usar dos armas o un arma y un escudo; 3 Mala vista:
      reduce Habilidad de Disparo en 1; 4 Enfermizo: reduce Resistencia en 1; 5 Debilidad: reduce Fuerza
      en 1; 6 Lesión craneal: el grupo está sujeto a Estupidez salvo que esté a 6" de un Héroe.'
  applies_to:
    profile_ids:
    - cripples
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: compiler.disability
      scope: 'YES'
      binding:
        kind: mechanic
        id: mechanic.disability
