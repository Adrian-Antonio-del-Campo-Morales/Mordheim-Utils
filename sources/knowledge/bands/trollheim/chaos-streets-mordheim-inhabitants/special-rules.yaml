- id: band--mordheim-natives
  name: Mordheim Natives
  effect: During a campaign set in Mordheim, the warband may modify one die by +1 or -1 on every Exploration
    roll.
  source:
    manual: chaos-in-the-streets
    printed_page: 145
    section: Special Rules / Mordheim Natives
  name_i18n:
    en: Mordheim Natives
    es: Nativos de Mordheim
  effect_i18n:
    en: During a campaign set in Mordheim, the warband may modify one die by +1 or -1 on every Exploration
      roll.
    es: Durante una campaña ambientada en Mordheim, la banda puede modificar un dado en +1 o -1 en cada
      tirada de Exploración.
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
