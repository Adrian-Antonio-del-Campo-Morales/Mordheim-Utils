    manual: chaos-in-the-streets
    printed_page: 147
    section: Heroes / 1 Prophet / Special Rules / Leader
  name_i18n:
    en: Leader
    es: Líder
  effect_i18n:
    en: Any warband model within 6" of the Prophet may use his Leadership when taking Leadership tests.
    es: Cualquier modelo de la banda a 6" del Profeta puede usar su Liderazgo cuando realice chequeos
      de Liderazgo.
  applies_to:
    profile_ids:
    - prophet
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.chaos-streets-mordheim-inhabitants.prophet.leader
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology or mounts.'
