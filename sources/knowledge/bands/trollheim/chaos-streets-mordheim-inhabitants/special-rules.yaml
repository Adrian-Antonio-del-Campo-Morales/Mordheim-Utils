- id: band--revival-sermons
  name: Revival Sermons
  effect: Revival Sermons are not magical and affect only members of the Mordheim Inhabitants warband;
    they never affect enemy or allied warbands, and Hired Swords in the Prophet's employ do not benefit
    from them. When the Prophet gains a new skill, he may instead learn a random new Revival Sermon or
    reduce the Difficulty of one sermon he already knows by 1. Psychological effects created by sermons
    affect the warband even when a model is normally immune to external Psychology. A sermon's range equals
    the Prophet's Leader range, initially 6", and increases if that range increases. A sermon remains
    active until the Prophet suffers a Wound or ends it. Only one sermon may be active at a time. Unless
    a sermon states otherwise, it is delivered using the same casting procedure as spells. The Prophet
    may wear armour while delivering sermons. The individual sermon list and sermon effects are intentionally
    not modelled in this file.
  source:
    manual: chaos-in-the-streets
    printed_page: 145
    section: Special Rules / Revival Sermons
  name_i18n:
    en: Revival Sermons
    es: Sermones de Resurrección
  effect_i18n:
    en: Revival Sermons are not magical and affect only members of the Mordheim Inhabitants warband; they
      never affect enemy or allied warbands, and Hired Swords in the Prophet's employ do not benefit from
      them. When the Prophet gains a new skill, he may instead learn a random new Revival Sermon or reduce
      the Difficulty of one sermon he already knows by 1. Psychological effects created by sermons affect
      the warband even when a model is normally immune to external Psychology. A sermon's range equals
      the Prophet's Leader range, initially 6", and increases if that range increases. A sermon remains
      active until the Prophet suffers a Wound or ends it. Only one sermon may be active at a time. Unless
      a sermon states otherwise, it is delivered using the same casting procedure as spells. The Prophet
      may wear armour while delivering sermons. The individual sermon list and sermon effects are intentionally
      not modelled in this file.
    es: Los Sermones de Resurrección no son mágicos y solo afectan a los miembros de la banda de Habitantes
      de Mordheim; jamás afectan a bandas enemigas o aliadas, y las Espadas a Sueldo al servicio del Profeta
      no se benefician de ellos. Cuando el Profeta gana una nueva habilidad, puede en su lugar aprender
      un nuevo Sermón de Resurrección aleatorio o reducir en 1 la Dificultad de un sermón que ya conozca.
      Los efectos psicológicos creados por los sermones afectan a la banda incluso cuando un modelo es
      normalmente inmune a la Psicología externa. El alcance de un sermón es igual al alcance de Líder
      del Profeta, inicialmente 6", y aumenta si ese alcance aumenta. Un sermón permanece activo hasta
      que el Profeta sufre una Herida o lo finaliza. Solo puede haber un sermón activo a la vez. Salvo
      que un sermón indique lo contrario, se pronuncia usando el mismo procedimiento de lanzamiento que
      los hechizos. El Profeta puede llevar armadura mientras pronuncia sermones. La lista individual
      de sermones y los efectos de los sermones no están modelados intencionadamente en este archivo.
  applies_to:
    band: true
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.chaos-streets-mordheim-inhabitants.band.revival-sermons
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology or mounts.'
