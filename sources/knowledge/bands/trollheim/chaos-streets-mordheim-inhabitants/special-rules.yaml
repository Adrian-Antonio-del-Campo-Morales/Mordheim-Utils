- id: desolate-soul--death-wish
  name: Death Wish
  effect: The Desolate Soul must always move toward the nearest visible enemy model. It does not have
    to run or charge, but it must move at least 1" during its Movement phase.
  source:
    manual: chaos-in-the-streets
    printed_page: 148
    section: Heroes / 0-1 Desolate Soul / Special Rules / Death Wish
  name_i18n:
    en: Death Wish
    es: Deseo de muerte
  effect_i18n:
    en: The Desolate Soul must always move toward the nearest visible enemy model. It does not have to
      run or charge, but it must move at least 1" during its Movement phase.
    es: El Alma Desolada debe moverse siempre hacia el modelo enemigo visible más cercano. No tiene que
      correr ni cargar, pero debe moverse al menos 1" durante su fase de Movimiento.
  applies_to:
    profile_ids:
    - desolate-soul
  runtime:
