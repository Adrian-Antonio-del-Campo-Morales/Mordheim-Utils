- id: cave-squigs--squig-movement
  name: Movement
  effect: A Cave Squig moves 2D6" instead of using a fixed Movement value. It never runs and never declares
    charges. If its normal movement brings it into contact with an enemy, it counts as having charged
    and attacks as such in the following close-combat phase.
  source:
    manual: chaos-in-the-streets
    printed_page: 134
    section: Henchmen / 0-5 Cave Squigs / Movement
  name_i18n:
    en: Movement
    es: Movimiento de squig
  effect_i18n:
    en: A Cave Squig moves 2D6" instead of using a fixed Movement value. It never runs and never declares
      charges. If its normal movement brings it into contact with an enemy, it counts as having charged
      and attacks as such in the following close-combat phase.
    es: Un Squig de Cueva se mueve 2D6" en lugar de usar un valor de Movimiento fijo. Nunca corre y nunca
      declara cargas. Si su movimiento normal lo pone en contacto con un enemigo, cuenta como que ha cargado
      y ataca como tal en la siguiente fase de combate cuerpo a cuerpo.
  applies_to:
    profile_ids:
    - cave-squigs
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.chaos-streets-greenskins.cave-squigs.squig-movement
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, or non-duel context.'
- id: cave-squigs--squig-keepers
  name: Keepers
  effect: Each Cave Squig must remain within 6" of a Goblin Warrior. If no Goblin Warrior is within 6"
    at the start of the Squig's Movement phase, it goes out of control. From then on it moves 2D6" in
    a random direction during each Movement phase and attacks any model, friend or foe, that it contacts.
    It remains uncontrolled for the rest of the battle.
  source:
    manual: chaos-in-the-streets
    printed_page: 134
    section: Henchmen / 0-5 Cave Squigs / Keepers
  name_i18n:
    en: Keepers
    es: Cuidadores de squigs
  effect_i18n:
    en: Each Cave Squig must remain within 6" of a Goblin Warrior. If no Goblin Warrior is within 6" at
      the start of the Squig's Movement phase, it goes out of control. From then on it moves 2D6" in a
      random direction during each Movement phase and attacks any model, friend or foe, that it contacts.
      It remains uncontrolled for the rest of the battle.
    es: Cada Squig de Cueva debe permanecer a 6" de un Guerrero Goblin. Si no hay ningún Guerrero Goblin
      a 6" al inicio de la fase de Movimiento del Squig, se descontrola. A partir de entonces se mueve
      2D6" en una dirección aleatoria durante cada fase de Movimiento y ataca a cualquier modelo, amigo
      o enemigo, con el que entre en contacto. Sigue descontrolado durante el resto de la batalla.
  applies_to:
    profile_ids:
    - cave-squigs
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.chaos-streets-greenskins.cave-squigs.squig-keepers
