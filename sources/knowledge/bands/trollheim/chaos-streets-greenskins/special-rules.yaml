      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, or non-duel context.'
- id: band--orc-special-skills-ard-ead
  kind: warband_skill
  name: '''Ard ''Ead'
  effect: The Orc has a special 3+ save to turn a Stunned result into Knocked Down. If wearing a Helmet
    this save becomes 2+ and replaces the Helmet's normal special rule.
  source:
    manual: chaos-in-the-streets
    printed_page: 130
    section: Greenskin Special Skills / 'Ard 'Ead
  name_i18n:
    en: '''Ard ''Ead'
    es: Cráneo grueso
  effect_i18n:
    en: The Orc has a special 3+ save to turn a Stunned result into Knocked Down. If wearing a Helmet
      this save becomes 2+ and replaces the Helmet's normal special rule.
    es: El orco tiene una salvación especial de 3+ para convertir un resultado de Aturdido en Derribado.
      Si lleva Yelmo, esta salvación pasa a ser de 2+ y sustituye a la regla especial normal del Yelmo.
  eligibility:
  - orc-boss
  - orc-shaman
  - orc-big-uns
  applies_to:
    band: true
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: skill.thick-skull
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.thick-skull
