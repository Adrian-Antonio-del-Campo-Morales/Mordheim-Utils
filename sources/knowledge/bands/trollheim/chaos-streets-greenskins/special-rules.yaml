- id: cave-squigs--squig-movement
  name: Movement
  effect: A Cave Squig moves 2D6" instead of using a fixed Movement value. It never runs and never declares charges. If its
    normal movement brings it into contact with an enemy, it counts as having charged and attacks as such in the following
    close-combat phase.
  source:
    manual: chaos-in-the-streets
    printed_page: 134
    section: Henchmen / 0-5 Cave Squigs / Movement
  name_i18n:
    en: Movement
    es: null
