- id: troll--always-hungry
  name: Always Hungry
  effect: After each battle, the warband must pay 15 gc to keep the Troll. Instead, the Orc Boss may sacrifice
    one Goblin Warrior or Cave Squig to feed it. If neither the upkeep nor a sacrifice is provided, the
    Troll leaves the warband.
  source:
    manual: chaos-in-the-streets
    printed_page: 135
    section: Henchmen / 0-1 Troll / Always Hungry
  name_i18n:
    en: Always Hungry
    es: Siempre hambriento
  effect_i18n:
    en: After each battle, the warband must pay 15 gc to keep the Troll. Instead, the Orc Boss may sacrifice
      one Goblin Warrior or Cave Squig to feed it. If neither the upkeep nor a sacrifice is provided,
      the Troll leaves the warband.
    es: Tras cada batalla, la banda debe pagar 15 coronas para mantener al Troll. En su lugar, el Jefe
      Orco puede sacrificar un Guerrero Goblin o Squig de Cueva para alimentarlo. Si no se aporta ni la
      manutención ni un sacrificio, el Troll abandona la banda.
  applies_to:
    profile_ids:
