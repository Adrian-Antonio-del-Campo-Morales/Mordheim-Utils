- id: orc-boss--leader
  name: Leader
  effect: Any warband model within 6" of the Orc Boss may use his Leadership when taking Leadership tests.
  source:
    manual: chaos-in-the-streets
    printed_page: 132
    section: Heroes / 1 Orc Boss / Special Rules / Leader
  name_i18n:
    en: Leader
    es: Líder
  effect_i18n:
    en: Any warband model within 6" of the Orc Boss may use his Leadership when taking Leadership tests.
    es: Cualquier modelo de la banda a 6" del Jefe Orco puede usar su Liderazgo cuando realice chequeos
      de Liderazgo.
  applies_to:
    profile_ids:
    - orc-boss
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
