- id: band--animosity
  name: Animosity
  effect: >-
    At the start of each Orc player's turn, roll D6 for every Orc or Goblin Henchman not already
    engaged in close combat. On 2-6 the warrior acts normally. On 1, roll another D6: 1 = the
    warrior immediately attacks the nearest eligible friendly Orc/Goblin Henchman or Hired Sword. If
    one is within charge range, it charges immediately and fights one round of close combat;
    afterwards the models separate by 1". If no eligible target can be charged and the warrior has a
    missile weapon, it shoots the nearest eligible friendly target instead. If neither is possible,
    or the nearest Orc is a Hero, use the 2-5 result instead. The warrior does nothing else that
    turn except defend itself. 2-5 = the warrior spends the whole turn insulting the nearest
    companion and does nothing else except defend itself. 6 = the warrior immediately moves as
    quickly as possible toward the nearest visible enemy, charging if possible. If no enemy is
    visible it immediately makes a normal move. This is additional to its normal Movement-phase
    move, and if the extra move brings an enemy into charge range the warrior must charge during its
    normal Movement phase.
  source:
    manual: chaos-in-the-streets
    printed_page: 127
    section: Special Rules / Animosity
  name_i18n:
    en: Animosity
    es: Rencor (Animosity)
  effect_i18n:
    en: 'At the start of each Orc player''s turn, roll D6 for every Orc or Goblin Henchman not already
      engaged in close combat. On 2-6 the warrior acts normally. On 1, roll another D6: 1 = the warrior
      immediately attacks the nearest eligible friendly Orc/Goblin Henchman or Hired Sword. If one is
      within charge range, it charges immediately and fights one round of close combat; afterwards the
      models separate by 1". If no eligible target can be charged and the warrior has a missile weapon,
      it shoots the nearest eligible friendly target instead. If neither is possible, or the nearest Orc
      is a Hero, use the 2-5 result instead. The warrior does nothing else that turn except defend itself.
      2-5 = the warrior spends the whole turn insulting the nearest companion and does nothing else except
      defend itself. 6 = the warrior immediately moves as quickly as possible toward the nearest visible
      enemy, charging if possible. If no enemy is visible it immediately makes a normal move. This is
      additional to its normal Movement-phase move, and if the extra move brings an enemy into charge
      range the warrior must charge during its normal Movement phase.'
    es: 'Al inicio de cada turno del jugador orco, tira D6 por cada secuaz orco o goblin que aún no esté
      empeñado en combate cuerpo a cuerpo. Con un 2-6 el guerrero actúa con normalidad. Con un 1, tira
      otro D6: 1 = el guerrero ataca inmediatamente al secuaz orco/goblin amigo u Espada a Sueldo elegible
      más cercano. Si alguno está a alcance de carga, carga inmediatamente y lucha un asalto de combate
      cuerpo a cuerpo; después los modelos se separan 1". Si no puede cargarse ningún objetivo elegible
      y el guerrero tiene un arma de misil, dispara en su lugar al objetivo amigo elegible más cercano.
      Si tampoco es posible, o el orco más cercano es un Héroe, usa el resultado 2-5. El guerrero no hace
      nada más ese asalto salvo defenderse. 2-5 = el guerrero pasa todo el asalto insultando al compañero
      más cercano y no hace nada más salvo defenderse. 6 = el guerrero se mueve inmediatamente lo más
      rápido posible hacia el enemigo visible más cercano, cargando si es posible. Si no hay ningún enemigo
      visible hace inmediatamente un movimiento normal. Esto es adicional a su movimiento normal de la
      fase de Movimiento, y si el movimiento extra pone a un enemigo a alcance de carga, el guerrero debe
      cargar durante su fase normal de Movimiento.'
  applies_to:
    band: true
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.chaos-streets-greenskins.band.animosity
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology or mounts.'
