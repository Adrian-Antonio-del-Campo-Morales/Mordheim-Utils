- id: goblin-warriors--animosity
  name: Animosity
  effect: Goblin Warriors are subject to the warband's Animosity rule. If a Goblin rolls a 1 on the second
    Animosity roll, it will never charge an Orc Henchman, although it may shoot at one if otherwise eligible.
  source:
    manual: chaos-in-the-streets
    printed_page: 133
    section: Henchmen / Goblin Warriors / Animosity
  name_i18n:
    en: Animosity
    es: Rencor (Animosity)
  effect_i18n:
    en: Goblin Warriors are subject to the warband's Animosity rule. If a Goblin rolls a 1 on the second
      Animosity roll, it will never charge an Orc Henchman, although it may shoot at one if otherwise
      eligible.
    es: Los Guerreros Goblin están sujetos a la regla de Rencor de la banda. Si un goblin saca un 1 en
      la segunda tirada de Rencor, jamás cargará contra un secuaz orco, aunque puede dispararle si por
      lo demás es elegible.
  applies_to:
    profile_ids:
    - goblin-warriors
  runtime:
