  effect: The warband may never include more Cave Squigs than Goblin Warriors, and may never include more
    than five Cave Squigs.
  source:
    manual: chaos-in-the-streets
    printed_page: 126
    section: Choice of Warriors / Cave Squigs
  name_i18n:
    en: Cave Squig Limit
    es: Proporción de squigs de cueva
  effect_i18n:
    en: The warband may never include more Cave Squigs than Goblin Warriors, and may never include more
      than five Cave Squigs.
    es: La banda jamás puede incluir más Squigs de Cueva que Guerreros Goblin, y jamás puede incluir más
      de cinco Squigs de Cueva.
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
