- id: cave-squigs--squig-keepers
  name: Keepers
  effect: Each Cave Squig must remain within 6" of a Goblin Warrior. If no Goblin Warrior is within 6" at the start of the
    Squig's Movement phase, it goes out of control. From then on it moves 2D6" in a random direction during each Movement
    phase and attacks any model, friend or foe, that it contacts. It remains uncontrolled for the rest of the battle.
  source:
    manual: chaos-in-the-streets
    printed_page: 134
    section: Henchmen / 0-5 Cave Squigs / Keepers
  name_i18n:
    en: Keepers
