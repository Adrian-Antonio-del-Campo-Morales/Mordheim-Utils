- id: band--animosity
  name: Animosity
  effect: 'At the start of each Orc player''s turn, roll D6 for every Orc or Goblin Henchman not already engaged in close
    combat. On 2-6 the warrior acts normally. On 1, roll another D6: 1 = the warrior immediately attacks the nearest eligible
    friendly Orc/Goblin Henchman or Hired Sword. If one is within charge range, it charges immediately and fights one round
    of close combat; afterwards the models separate by 1". If no eligible target can be charged and the warrior has a missile
    weapon, it shoots the nearest eligible friendly target instead. If neither is possible, or the nearest Orc is a Hero,
    use the 2-5 result instead. The warrior does nothing else that turn except defend itself. 2-5 = the warrior spends the
    whole turn insulting the nearest companion and does nothing else except defend itself. 6 = the warrior immediately moves
    as quickly as possible toward the nearest visible enemy, charging if possible. If no enemy is visible it immediately makes
    a normal move. This is additional to its normal Movement-phase move, and if the extra move brings an enemy into charge
    range the warrior must charge during its normal Movement phase.'
  source:
    manual: chaos-in-the-streets
    printed_page: 127
    section: Special Rules / Animosity
  name_i18n:
    en: Animosity
    es: null
  effect_i18n:
    en: 'At the start of each Orc player''s turn, roll D6 for every Orc or Goblin Henchman not already engaged in close combat.
      On 2-6 the warrior acts normally. On 1, roll another D6: 1 = the warrior immediately attacks the nearest eligible friendly
      Orc/Goblin Henchman or Hired Sword. If one is within charge range, it charges immediately and fights one round of close
      combat; afterwards the models separate by 1". If no eligible target can be charged and the warrior has a missile weapon,
      it shoots the nearest eligible friendly target instead. If neither is possible, or the nearest Orc is a Hero, use the
      2-5 result instead. The warrior does nothing else that turn except defend itself. 2-5 = the warrior spends the whole
      turn insulting the nearest companion and does nothing else except defend itself. 6 = the warrior immediately moves as
      quickly as possible toward the nearest visible enemy, charging if possible. If no enemy is visible it immediately makes
      a normal move. This is additional to its normal Movement-phase move, and if the extra move brings an enemy into charge
      range the warrior must charge during its normal Movement phase.'
    es: null
  applies_to:
    band: true
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.chaos-streets-greenskins.band.animosity
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology or mounts.'
