- id: band--in-the-pit
  name: In the Pit!
  effect: >-
    A captured opponent may be sent to fight one of the warband's Pit Fighters. If the Pit Fighter
    wins, that warrior gains +2 Experience and the warband receives the captive's weapons and armour
    plus 50 gc. If the Pit Fighter loses, resolve death or injury normally but ignore Robbed,
    Captured, Hardened, Sold to the Pits and Survives Against the Odds; the Pit Fighter keeps its
    own equipment. A victorious captive gains 50 gc and +2 Experience, then rolls D6: on 4+ the
    captive is freed; on 1-3 the captive remains with the warband and may be sent to the pit again
    after future games.
  source:
    manual: chaos-in-the-streets
    printed_page: 118
    section: Special Rules / In the Pit!
  name_i18n:
    en: In the Pit!
    es: ¡Al foso!
  effect_i18n:
    en: 'A captured opponent may be sent to fight one of the warband''s Pit Fighters. If the Pit Fighter
      wins, that warrior gains +2 Experience and the warband receives the captive''s weapons and armour
      plus 50 gc. If the Pit Fighter loses, resolve death or injury normally but ignore Robbed, Captured,
      Hardened, Sold to the Pits and Survives Against the Odds; the Pit Fighter keeps its own equipment.
      A victorious captive gains 50 gc and +2 Experience, then rolls D6: on 4+ the captive is freed; on
      1-3 the captive remains with the warband and may be sent to the pit again after future games.'
    es: 'Un oponente capturado puede ser enviado a luchar contra uno de los Luchadores de Foso de la banda.
      Si el Luchador de Foso gana, ese guerrero gana +2 de Experiencia y la banda recibe las armas y la
      armadura del cautivo más 50 coronas. Si el Luchador de Foso pierde, resuelve la muerte o herida
      con normalidad pero ignora Robado, Capturado, Endurecido, Vendido al foso y Sobrevive contra pronóstico;
      el Luchador de Foso conserva su propio equipo. Un cautivo victorioso gana 50 coronas y +2 de Experiencia,
      y luego tira D6: con un 4+ el cautivo es liberado; con un 1-3 el cautivo permanece con la banda
      y puede ser enviado de nuevo al foso tras futuras partidas.'
  applies_to:
    band: true
  runtime:
