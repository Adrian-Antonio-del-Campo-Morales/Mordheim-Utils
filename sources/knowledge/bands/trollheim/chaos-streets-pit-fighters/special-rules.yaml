- id: band--fighting-styles
  name: Weapons & Armour — Fighting Styles
  effect: Pit Kings, Pit Veterans, Pit Fighters and Pursuers normally use the fixed fighting styles in their appropriate equipment
    lists. This restriction does not apply to the Dwarf Troll Slayer or Ogre Pit Fighter. Heroes may use equipment from other
    warbands if they have the appropriate skill. A warrior may change fighting style by swapping with another warband member
    or by buying a new style or its components. A Pit Fighter Henchman group may contain models using different fighting styles.
  source:
    manual: chaos-in-the-streets
    printed_page: 118
    section: Special Rules / Weapons and Armour
  name_i18n:
    en: Weapons & Armour — Fighting Styles
    es: null
  effect_i18n:
    en: Pit Kings, Pit Veterans, Pit Fighters and Pursuers normally use the fixed fighting styles in their appropriate equipment
      lists. This restriction does not apply to the Dwarf Troll Slayer or Ogre Pit Fighter. Heroes may use equipment from
      other warbands if they have the appropriate skill. A warrior may change fighting style by swapping with another warband
      member or by buying a new style or its components. A Pit Fighter Henchman group may contain models using different fighting
      styles.
    es: null
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: compiler.pit-fighter-fighting-styles
      scope: 'NO'
      binding: null
      reason: 'Out of scope: initial recruitment packages, gold costs, later purchases and swapping equipment between warband members require roster and campaign state.'
