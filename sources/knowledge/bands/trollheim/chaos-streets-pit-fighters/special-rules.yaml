- id: band--pit-fighter-skill-force-of-will
  kind: warband_skill
  name: Force of Will
  effect: When the Hero loses his last Wound and would be taken Out of Action, roll D6. If the result is equal to or below
    Toughness, he stands back up and continues fighting. Repeat this roll in each subsequent combat round with a cumulative
    -1 modifier. If he is taken Out of Action a second time, remove him normally.
  source:
    manual: chaos-in-the-streets
    printed_page: 121
    section: Pit Fighter Special Skills / Force of Will
  name_i18n:
    en: Force of Will
    es: null
  effect_i18n:
