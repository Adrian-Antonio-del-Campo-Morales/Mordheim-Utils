- id: band--in-the-pit
  name: In the Pit!
  effect: 'A captured opponent may be sent to fight one of the warband''s Pit Fighters. If the Pit Fighter wins, that warrior
    gains +2 Experience and the warband receives the captive''s weapons and armour plus 50 gc. If the Pit Fighter loses, resolve
    death or injury normally but ignore Robbed, Captured, Hardened, Sold to the Pits and Survives Against the Odds; the Pit
    Fighter keeps its own equipment. A victorious captive gains 50 gc and +2 Experience, then rolls D6: on 4+ the captive
    is freed; on 1-3 the captive remains with the warband and may be sent to the pit again after future games.'
  source:
    manual: chaos-in-the-streets
    printed_page: 118
    section: Special Rules / In the Pit!
  name_i18n:
    en: In the Pit!
    es: null
  effect_i18n:
    en: 'A captured opponent may be sent to fight one of the warband''s Pit Fighters. If the Pit Fighter wins, that warrior
      gains +2 Experience and the warband receives the captive''s weapons and armour plus 50 gc. If the Pit Fighter loses,
      resolve death or injury normally but ignore Robbed, Captured, Hardened, Sold to the Pits and Survives Against the Odds;
      the Pit Fighter keeps its own equipment. A victorious captive gains 50 gc and +2 Experience, then rolls D6: on 4+ the
      captive is freed; on 1-3 the captive remains with the warband and may be sent to the pit again after future games.'
    es: null
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
