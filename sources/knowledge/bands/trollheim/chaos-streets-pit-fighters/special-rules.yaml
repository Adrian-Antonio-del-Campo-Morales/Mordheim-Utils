- id: dwarf-troll-slayer--hard-to-kill
  kind: profile_ability
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: skill.hard-to-kill
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.hard-to-kill
  name: Hard to Kill
  effect: The Dwarf Troll Slayer is taken Out of Action only on a 6 on the Injury chart; 1-2 is Knocked
    Down and 3-5 is Stunned.
  source:
    manual: chaos-in-the-streets
    printed_page: 123
    section: Heroes / 0-1 Dwarf Troll Slayer / Special Rules / Hard to Kill
  name_i18n:
    en: Hard to Kill
    es: Difíciles de matar
  effect_i18n:
