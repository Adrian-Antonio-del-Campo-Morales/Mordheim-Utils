- id: giant-wolves--mount
  name: Mount
  effect: Every Giant Wolf that participates in a battle must normally be ridden by a member of the warband.
    The rider may not voluntarily dismount. If the rider is taken Out of Action, the Giant Wolf must pass
    a Leadership test; if it fails, the wolf immediately leaves the table and counts as Out of Action.
    The Wolf Tamer special skill provides the stated exceptions to these restrictions.
  source:
    manual: khemri
    printed_page: 81
    section: Henchmen / 0-5 Giant Wolves / Mounts
  name_i18n:
    en: Mount
    es: Montura
  effect_i18n:
    en: Every Giant Wolf that participates in a battle must normally be ridden by a member of the warband.
      The rider may not voluntarily dismount. If the rider is taken Out of Action, the Giant Wolf must
      pass a Leadership test; if it fails, the wolf immediately leaves the table and counts as Out of
      Action. The Wolf Tamer special skill provides the stated exceptions to these restrictions.
    es: Cada Lobo Gigante que participe en una batalla debe normalmente ser montado por un miembro de
      la banda. El jinete no puede desmontar voluntariamente. Si el jinete es puesto Fuera de combate,
      el Lobo Gigante debe superar un chequeo de Liderazgo; si lo falla, el lobo abandona inmediatamente
      la mesa y cuenta como Fuera de combate. La habilidad especial Domalobos proporciona las excepciones
      indicadas a estas restricciones.
  applies_to:
    profile_ids:
    - giant-wolves
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.khemri-hobgoblin-raiders.giant-wolves.mount
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology or mounts.'
- id: band--traitors
  name: Traitors
  effect: >-
    Each turn, roll D6 for every Hobgoblin Henchman that is not engaged in close combat. Only a roll
    of 1 fails the betrayal test. If the test fails, roll another D6 and apply the following result:
    1 = Traitor: the opponent immediately takes control of the model; in a multiplayer game it joins
    the opposing warband with the highest rating. The model must continue to take betrayal tests
    normally on subsequent turns. 2-5 = I Prefer Not to Die!: the model may not charge or shoot that
    turn, but may perform other actions. 6 = Blood for Morko!!!: the model no longer takes betrayal
    tests for the rest of the battle.
  source:
    manual: khemri
    printed_page: 78
    section: Hobgoblin Raiders Special Rules / Traitors
  name_i18n:
    en: Traitors
    es: Traidores
  effect_i18n:
    en: 'Each turn, roll D6 for every Hobgoblin Henchman that is not engaged in close combat. Only a roll
      of 1 fails the betrayal test. If the test fails, roll another D6 and apply the following result:
      1 = Traitor: the opponent immediately takes control of the model; in a multiplayer game it joins
      the opposing warband with the highest rating. The model must continue to take betrayal tests normally
      on subsequent turns. 2-5 = I Prefer Not to Die!: the model may not charge or shoot that turn, but
      may perform other actions. 6 = Blood for Morko!!!: the model no longer takes betrayal tests for
      the rest of the battle.'
    es: 'Cada asalto, tira D6 por cada secuaz Hobgoblin que no esté empeñado en combate cuerpo a cuerpo.
      Solo un resultado de 1 falla el chequeo de traición. Si el chequeo falla, tira otro D6 y aplica
      el siguiente resultado: 1 = Traidor: el oponente toma inmediatamente el control del modelo; en una
      partida multijugador se une a la banda rival con mayor valoración. El modelo debe seguir haciendo
      los chequeos de traición con normalidad en los asaltos siguientes. 2-5 = ¡Prefiero no morir!: el
      modelo no puede cargar ni disparar ese asalto, pero puede realizar otras acciones. 6 = ¡Sangre para
      Morko!: el modelo ya no hace chequeos de traición por el resto de la batalla.'
  eligibility:
  - hobgoblin-warriors
  - archers
  applies_to:
    band: true
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.khemri-hobgoblin-raiders.band.traitors
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology or mounts.'
