- id: band--traitors
  name: Traitors
  effect: 'Each turn, roll D6 for every Hobgoblin Henchman that is not engaged in close combat. Only a roll of 1 fails the
    betrayal test. If the test fails, roll another D6 and apply the following result: 1 = Traitor: the opponent immediately
    takes control of the model; in a multiplayer game it joins the opposing warband with the highest rating. The model must
    continue to take betrayal tests normally on subsequent turns. 2-5 = I Prefer Not to Die!: the model may not charge or
    shoot that turn, but may perform other actions. 6 = Blood for Morko!!!: the model no longer takes betrayal tests for the
    rest of the battle.'
  source:
    manual: khemri
    printed_page: 78
    section: Hobgoblin Raiders Special Rules / Traitors
  name_i18n:
    en: Traitors
    es: null
  effect_i18n:
    en: 'Each turn, roll D6 for every Hobgoblin Henchman that is not engaged in close combat. Only a roll of 1 fails the betrayal
      test. If the test fails, roll another D6 and apply the following result: 1 = Traitor: the opponent immediately takes
      control of the model; in a multiplayer game it joins the opposing warband with the highest rating. The model must continue
      to take betrayal tests normally on subsequent turns. 2-5 = I Prefer Not to Die!: the model may not charge or shoot that
      turn, but may perform other actions. 6 = Blood for Morko!!!: the model no longer takes betrayal tests for the rest of
      the battle.'
    es: null
  eligibility:
  - hobgoblin-warriors
  - archers
  applies_to:
    band: true
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.khemri-hobgoblin-raiders.band.traitors
