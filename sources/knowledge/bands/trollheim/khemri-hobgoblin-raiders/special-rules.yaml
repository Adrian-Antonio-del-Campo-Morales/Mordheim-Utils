- id: band--hobgoblin-special-skills-wolf-tamer
  kind: warband_skill
  name: Wolf Tamer
  effect: The Hero may direct one purchased Giant Wolf in battle without riding it; that wolf still counts
    toward the warband's normal 0-5 Giant Wolf limit. If the Hero rides a Giant Wolf, it may re-roll failed
    Riding tests but must accept the second result. The Hero may also voluntarily dismount whenever desired
    without requiring the wolf to take the normal Leadership test for being left without a rider.
  source:
    manual: khemri
    printed_page: 79
    section: Hobgoblin Special Skills / Wolf Tamer
  name_i18n:
    en: Wolf Tamer
    es: Domalobos
  effect_i18n:
    en: The Hero may direct one purchased Giant Wolf in battle without riding it; that wolf still counts
      toward the warband's normal 0-5 Giant Wolf limit. If the Hero rides a Giant Wolf, it may re-roll
      failed Riding tests but must accept the second result. The Hero may also voluntarily dismount whenever
      desired without requiring the wolf to take the normal Leadership test for being left without a rider.
    es: El Héroe puede dirigir en batalla un Lobo Gigante comprado sin montarlo; ese lobo sigue contando
      para el límite normal de 0-5 Lobos Gigantes de la banda. Si el Héroe monta un Lobo Gigante, puede
      repetir los chequeos de Equitación fallados, pero debe aceptar el segundo resultado. El Héroe también
      puede desmontar voluntariamente cuando lo desee, sin necesidad de que el lobo haga el chequeo normal
      de Liderazgo por quedarse sin jinete.
  eligibility:
  - khann
  - hobgoblin-shaman
  - scouts
  - sneaky
  applies_to:
    band: true
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.khemri-hobgoblin-raiders.band.hobgoblin-special-skills-wolf-tamer
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology or mounts.'
