    manual: khemri
    printed_page: 80
    section: Heroes / 0-1 Hobgoblin Shaman / Wizard
  name_i18n:
    en: Wizard
    es: Hechicero
  effect_i18n:
    en: The Hobgoblin Shaman is a Wizard and begins with one spell from Waaagh! Shamanic Magic. The spell
      list and spell effects are intentionally not modelled in this file.
    es: El Chamán Hobgoblin es un hechicero y comienza con un hechizo de la Magia Chamánica ¡WAAAGH!.
      La lista de hechizos y los efectos de los hechizos no están modelados intencionadamente en este
      archivo.
  applies_to:
    profile_ids:
    - hobgoblin-shaman
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.khemri-hobgoblin-raiders.hobgoblin-shaman.wizard
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: no effect applies to the isolated 1v1 duel or legal fighter skill/equipment
        construction.
