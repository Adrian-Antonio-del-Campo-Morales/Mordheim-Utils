- id: giant-wolves--mount
  name: Mount
  effect: Every Giant Wolf that participates in a battle must normally be ridden by a member of the warband. The rider may
    not voluntarily dismount. If the rider is taken Out of Action, the Giant Wolf must pass a Leadership test; if it fails,
    the wolf immediately leaves the table and counts as Out of Action. The Wolf Tamer special skill provides the stated exceptions
    to these restrictions.
  source:
    manual: khemri
    printed_page: 81
    section: Henchmen / 0-5 Giant Wolves / Mounts
  name_i18n:
    en: Mount
    es: null
  effect_i18n:
    en: Every Giant Wolf that participates in a battle must normally be ridden by a member of the warband. The rider may not
      voluntarily dismount. If the rider is taken Out of Action, the Giant Wolf must pass a Leadership test; if it fails,
      the wolf immediately leaves the table and counts as Out of Action. The Wolf Tamer special skill provides the stated
      exceptions to these restrictions.
    es: null
  applies_to:
