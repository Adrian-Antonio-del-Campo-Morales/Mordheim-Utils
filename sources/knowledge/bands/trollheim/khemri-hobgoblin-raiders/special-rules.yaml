- id: khann--leader
  name: Leader
  effect: Any warband model within 6" of the Khann may use his Leadership instead of its own.
  source:
    manual: khemri
    printed_page: 80
    section: Heroes / 1 Khann / Leader
  name_i18n:
    en: Leader
    es: Líder
  effect_i18n:
    en: Any warband model within 6" of the Khann may use his Leadership instead of its own.
    es: Cualquier modelo de la banda a 6" del Khann puede usar su Liderazgo en lugar del suyo propio.
  applies_to:
    profile_ids:
    - khann
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.khemri-hobgoblin-raiders.khann.leader
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology or mounts.'
- id: hobgoblin-shaman--wizard
  name: Wizard
  effect: The Hobgoblin Shaman is a Wizard and begins with one spell from Waaagh! Shamanic Magic. The
    spell list and spell effects are intentionally not modelled in this file.
