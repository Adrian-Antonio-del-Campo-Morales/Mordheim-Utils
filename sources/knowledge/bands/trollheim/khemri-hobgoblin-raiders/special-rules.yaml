- id: band--hobgoblin-special-skills-wolf-tamer
  kind: warband_skill
  name: Wolf Tamer
  effect: The Hero may direct one purchased Giant Wolf in battle without riding it; that wolf still counts toward the warband's
    normal 0-5 Giant Wolf limit. If the Hero rides a Giant Wolf, it may re-roll failed Riding tests but must accept the second
    result. The Hero may also voluntarily dismount whenever desired without requiring the wolf to take the normal Leadership
    test for being left without a rider.
  source:
    manual: khemri
    printed_page: 79
    section: Hobgoblin Special Skills / Wolf Tamer
  name_i18n:
    en: Wolf Tamer
    es: null
  effect_i18n:
    en: The Hero may direct one purchased Giant Wolf in battle without riding it; that wolf still counts toward the warband's
      normal 0-5 Giant Wolf limit. If the Hero rides a Giant Wolf, it may re-roll failed Riding tests but must accept the
      second result. The Hero may also voluntarily dismount whenever desired without requiring the wolf to take the normal
      Leadership test for being left without a rider.
    es: null
  eligibility:
