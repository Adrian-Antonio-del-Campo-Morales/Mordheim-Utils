schema_version: 2
band_id: khemri-hobgoblin-raiders
equipment_lists:
- id: hobgoblin-raider-equipment-list
  name: Raider Equipment List
  items:
  - item_id: dagger
    cost: 2
    notes: First dagger is free.
    notes_i18n:
      es: La primera daga es gratis.
  - item_id: mace
    cost: 3
  - item_id: axe
    cost: 5
  - item_id: sword
    cost: 10
  - item_id: spear
    cost: 10
  - item_id: sword_scimitar
    cost: 15
    notes: 'Source label: scimitar.'
    notes_i18n:
      es: 'Etiqueta de origen: scimitar.'
  - item_id: cutlass_sword
    cost: 15
    notes: 'Source label: cutlass.'
    notes_i18n:
      es: 'Etiqueta de origen: cutlass.'
  - item_id: poison_daggers
    cost: 8
    notes: >-
      A newly created warband may buy Poisoned Daggers for half the normal 15 gc cost, rounded up,
      so the warband-creation price is 8 gc. The normal price is 15 gc. Internal weapon and poison
      mechanics are intentionally not modelled here. Source label: poisoned daggers.
    notes_i18n:
      es: 'Una banda recién creada puede comprar Dagas Envenenadas por la mitad del coste normal de 15 gc, redondeando hacia arriba, así que el precio de creación de la banda es 8 gc. El precio normal es
        15 gc. La mecánica interna de esta arma y su veneno no se modela aquí deliberadamente. Etiqueta de origen: poisoned daggers.'
  - item_id: sling
    cost: 2
  - item_id: short_bow
    cost: 5
  - item_id: bow
    cost: 10
  - item_id: shield
    cost: 5
  - item_id: helmet
    cost: 10
  - item_id: light_armour
    cost: 20
  source:
    manual: khemri
    printed_page: 77
    section: Raider Equipment List
  name_i18n:
    es: Lista de Equipo de los Asaltantes
