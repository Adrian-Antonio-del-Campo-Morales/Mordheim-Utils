- id: band--skaven-special-skills-black-hunger
  kind: warband_skill
  name: Black Hunger
  effect: At the start of his turn, the Skaven Hero may invoke Black Hunger. For that turn he gains +1
    Attack and adds the result of 1D6 x 0.4" + 1" to his Movement. At the end of the turn he suffers 1D3
    Strength 3 hits with no armour save.
  source:
    manual: trollheim
    printed_page: 93
    section: Skaven Special Skills / Black Hunger
  name_i18n:
    en: Black Hunger
    es: Hambre negra
  effect_i18n:
    en: At the start of his turn, the Skaven Hero may invoke Black Hunger. For that turn he gains +1 Attack
      and adds the result of 1D6 x 0.4" + 1" to his Movement. At the end of the turn he suffers 1D3 Strength
      3 hits with no armour save.
    es: Al comienzo de su turno, el Héroe skaven puede invocar el Hambre negra. Durante ese turno gana
      +1 Ataque y añade a su Movimiento el resultado de 1D6 x 0,4" + 1". Al final del turno sufre 1D3
      impactos de Fuerza 3 sin tirada de salvación por armadura.
  eligibility:
  - assassin-adept
  - black-skaven
  - eshin-sorcerer
  - night-runners
  applies_to:
    band: true
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: mechanic.black-hunger
      scope: 'YES'
      binding:
        kind: mechanic
        id: mechanic.black-hunger
- id: band--skaven-special-skills-tail-fighting
  kind: warband_skill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: special-rule.band--skaven-special-skills-tail-fighting
      scope: 'YES'
      binding:
        kind: compiler
        id: special-rule.band--skaven-special-skills-tail-fighting
  runtime_selectable: true
  name: Tail Fighting
  effect: The Skaven may wield a Dagger, Shield or Sword with his tail. A weapon held this way grants
    one additional attack with that weapon; a Shield held this way grants +1 to the armour save instead.
  source:
    manual: trollheim
    printed_page: 93
    section: Skaven Special Skills / Tail Fighting
  name_i18n:
    en: Tail Fighting
    es: Combate con la cola
  effect_i18n:
    en: The Skaven may wield a Dagger, Shield or Sword with his tail. A weapon held this way grants one
      additional attack with that weapon; a Shield held this way grants +1 to the armour save instead.
    es: El skaven puede empuñar una Daga, un Escudo o una Espada con la cola. Un arma sostenida de esta
      manera otorga un ataque adicional con esa arma; un Escudo sostenido de esta manera otorga +1 en
      la tirada de salvación por armadura en su lugar.
  eligibility:
  - assassin-adept
  - black-skaven
  - eshin-sorcerer
  - night-runners
  applies_to:
    band: true
- id: band--skaven-special-skills-wall-runner
  kind: warband_skill
  name: Wall Runner
  effect: The Skaven does not need to take Initiative tests when climbing walls or other vertical surfaces.
  source:
    manual: trollheim
    printed_page: 93
    section: Skaven Special Skills / Wall Runner
  name_i18n:
    en: Wall Runner
    es: Corredor de muros
  effect_i18n:
    en: The Skaven does not need to take Initiative tests when climbing walls or other vertical surfaces.
    es: El skaven no necesita realizar chequeos de Iniciativa al escalar muros u otras superficies verticales.
  eligibility:
  - assassin-adept
  - black-skaven
  - eshin-sorcerer
  - night-runners
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.trollheim-skaven-clan-eshin.band.skaven-special-skills-wall-runner
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, magic, or non-duel context.'
- id: band--skaven-special-skills-infiltration
  kind: warband_skill
  name: Infiltration
  effect: The Skaven deploys after the opposing warband and may be placed anywhere outside the opponent's
    line of sight and more than 12" from every enemy model. If both players have infiltrating models,
    roll 1D6 for each such model; the model with the lower result deploys first.
  source:
    manual: trollheim
    printed_page: 93
    section: Skaven Special Skills / Infiltration
  name_i18n:
    en: Infiltration
    es: Infiltración
  effect_i18n:
    en: The Skaven deploys after the opposing warband and may be placed anywhere outside the opponent's
      line of sight and more than 12" from every enemy model. If both players have infiltrating models,
      roll 1D6 for each such model; the model with the lower result deploys first.
    es: El skaven se despliega después de la banda rival y puede colocarse en cualquier lugar fuera de
      la línea de visión del oponente y a más de 12" de cada modelo enemigo. Si ambos jugadores tienen
      modelos con infiltración, tira 1D6 por cada uno de esos modelos; el modelo con el resultado más
      bajo se despliega primero.
  eligibility:
  - assassin-adept
  - black-skaven
  - eshin-sorcerer
  - night-runners
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.trollheim-skaven-clan-eshin.band.skaven-special-skills-infiltration
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, magic, or non-duel context.'
- id: band--skaven-special-skills-art-of-silent-death
  kind: warband_skill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: skill.art-of-silent-death
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.art-of-silent-death
  name: Art of Silent Death
  effect: In close combat the Skaven may fight with bare claws without penalty and counts as using two
    close-combat weapons, gaining +1 Attack. The Hero causes a critical hit on a 'to wound' roll of 5-6
    instead of only 6. When combined with Eshin Fighting Claws, the skill grants +2 Attacks instead of
    +1.
  source:
    manual: trollheim
    printed_page: 93
    section: Skaven Special Skills / Art of Silent Death
  name_i18n:
    en: Art of Silent Death
    es: Arte de la muerte silenciosa
  effect_i18n:
    en: In close combat the Skaven may fight with bare claws without penalty and counts as using two close-combat
      weapons, gaining +1 Attack. The Hero causes a critical hit on a 'to wound' roll of 5-6 instead of
      only 6. When combined with Eshin Fighting Claws, the skill grants +2 Attacks instead of +1.
    es: En combate cuerpo a cuerpo, el skaven puede combatir con las garras desnudas sin penalización
      y cuenta como si usara dos armas de combate cuerpo a cuerpo, ganando +1 Ataque. El Héroe causa un
      golpe crítico con una tirada de herir de 5-6 en lugar de solo 6. Combinada con las Garras de combate
      de Eshin, la habilidad otorga +2 Ataques en lugar de +1.
  eligibility:
  - assassin-adept
  - black-skaven
  - eshin-sorcerer
  - night-runners
  applies_to:
    band: true
