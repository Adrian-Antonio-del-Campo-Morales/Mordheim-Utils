- id: band--skaven-special-skills-art-of-silent-death
  kind: warband_skill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: skill.art-of-silent-death
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.art-of-silent-death
  name: Art of Silent Death
  effect: In close combat the Skaven may fight with bare claws without penalty and counts as using two close-combat weapons,
    gaining +1 Attack. The Hero causes a critical hit on a 'to wound' roll of 5-6 instead of only 6. When combined with Eshin
    Fighting Claws, the skill grants +2 Attacks instead of +1.
  source:
    manual: trollheim
    printed_page: 93
    section: Skaven Special Skills / Art of Silent Death
  name_i18n:
    en: Art of Silent Death
    es: null
  effect_i18n:
    en: In close combat the Skaven may fight with bare claws without penalty and counts as using two close-combat weapons,
      gaining +1 Attack. The Hero causes a critical hit on a 'to wound' roll of 5-6 instead of only 6. When combined with Eshin
      Fighting Claws, the skill grants +2 Attacks instead of +1.
    es: null
  eligibility:
  - assassin-adept
  - black-skaven
  - eshin-sorcerer
  - night-runners
  applies_to:
    band: true
