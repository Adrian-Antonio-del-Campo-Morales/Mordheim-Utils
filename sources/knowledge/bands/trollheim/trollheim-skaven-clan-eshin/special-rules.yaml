schema_version: 2
band_id: trollheim-skaven-clan-eshin
rules:
- id: assassin-adept--leader
  name: Leader
  effect: Any warband warrior within 6" of the Assassin may use his Leadership instead of its own.
  source:
    manual: trollheim
    printed_page: 94
    section: Heroes / 1 Assassin / Leader
  name_i18n:
    en: Leader
    es: Líder
  effect_i18n:
    en: Any warband warrior within 6" of the Assassin may use his Leadership instead of its own.
    es: Cualquier guerrero de la banda a 6" del Asesino puede usar su Liderazgo en lugar del suyo propio.
  applies_to:
    profile_ids:
    - assassin-adept
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.trollheim-skaven-clan-eshin.assassin-adept.leader
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology or mounts.'
- id: assassin-adept--consummate-fighter
  name: Consummate Fighter
  effect: Any armour save caused by a Wound inflicted by the Assassin suffers an additional -1 modifier,
    whether the Wound was caused by a missile attack or in close combat.
  source:
    manual: trollheim
    printed_page: 94
    section: Heroes / 1 Assassin / Consummate Fighter
  name_i18n:
    en: Consummate Fighter
    es: Luchador consumado
  effect_i18n:
    en: Any armour save caused by a Wound inflicted by the Assassin suffers an additional -1 modifier,
      whether the Wound was caused by a missile attack or in close combat.
    es: Cualquier tirada de salvación por armadura causada por una Herida infligida por el Asesino sufre
      un modificador adicional de -1, tanto si la Herida fue causada por un ataque de misil como en combate
      cuerpo a cuerpo.
  applies_to:
    profile_ids:
    - assassin-adept
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: trait.perfect-killer
      scope: 'YES'
      binding:
        kind: trait
        id: trait.perfect-killer
        parameters:
          value: true
- id: eshin-sorcerer--spellcaster
  name: Spellcaster
  effect: The Eshin Sorcerer is a spellcaster and may use Magic of the Horned Rat. The spell list and
    spell effects are intentionally not modelled in this file.
  source:
    manual: trollheim
    printed_page: 94
    section: Heroes / 0-1 Eshin Sorcerer / Spellcaster
  name_i18n:
    en: Spellcaster
    es: Lanzador de hechizos
  effect_i18n:
    en: The Eshin Sorcerer is a spellcaster and may use Magic of the Horned Rat. The spell list and spell
      effects are intentionally not modelled in this file.
    es: El Hechicero de Eshin es un lanzador de hechizos y puede usar la Magia del Rata Cuernudo. La lista
      de hechizos y sus efectos no se modelan intencionadamente en este archivo.
  applies_to:
    profile_ids:
    - eshin-sorcerer
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.trollheim-skaven-clan-eshin.eshin-sorcerer.spellcaster
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, magic, or non-duel context.'
