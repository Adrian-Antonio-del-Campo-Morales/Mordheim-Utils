- id: assassin-adept--consummate-fighter
  name: Consummate Fighter
  effect: Any armour save caused by a Wound inflicted by the Assassin suffers an additional -1 modifier, whether the Wound
    was caused by a missile attack or in close combat.
  source:
    manual: trollheim
    printed_page: 94
    section: Heroes / 1 Assassin / Consummate Fighter
  name_i18n:
    en: Consummate Fighter
    es: null
  effect_i18n:
    en: Any armour save caused by a Wound inflicted by the Assassin suffers an additional -1 modifier, whether the Wound was
      caused by a missile attack or in close combat.
    es: null
  applies_to:
    profile_ids:
    - assassin-adept
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: trait.perfect-killer
      scope: 'YES'
      binding:
        kind: trait
        id: trait.perfect-killer
        parameters:
          value: true
