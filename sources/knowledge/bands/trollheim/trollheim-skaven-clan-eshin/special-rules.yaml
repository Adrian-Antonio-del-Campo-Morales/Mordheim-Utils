- id: rat-ogre--large-target
  name: Large Target
  effect: 'The Trollheim errata replaces the original Large rule with Large Target: the Rat Ogre counts
    as a Large Target as defined by the shooting rules.'
  source:
    manual: trollheim
    printed_page: 95
    section: Errata / P95 - Rat Ogre / Large Target
  name_i18n:
    en: Large Target
    es: Objetivo grande
  effect_i18n:
    en: 'The Trollheim errata replaces the original Large rule with Large Target: the Rat Ogre counts
      as a Large Target as defined by the shooting rules.'
    es: 'La errata de Trollheim reemplaza la regla original de Grande por Objetivo grande: el Ogro rata
      cuenta como Objetivo grande según lo definido por las reglas de disparo.'
  applies_to:
