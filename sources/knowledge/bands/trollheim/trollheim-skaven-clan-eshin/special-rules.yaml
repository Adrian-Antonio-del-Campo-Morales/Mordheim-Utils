- id: band--skaven-special-skills-infiltration
  kind: warband_skill
  name: Infiltration
  effect: The Skaven deploys after the opposing warband and may be placed anywhere outside the opponent's line of sight and
    more than 12" from every enemy model. If both players have infiltrating models, roll 1D6 for each such model; the model
    with the lower result deploys first.
  source:
    manual: trollheim
    printed_page: 93
    section: Skaven Special Skills / Infiltration
  name_i18n:
    en: Infiltration
    es: null
  effect_i18n:
    en: The Skaven deploys after the opposing warband and may be placed anywhere outside the opponent's line of sight and
      more than 12" from every enemy model. If both players have infiltrating models, roll 1D6 for each such model; the model
      with the lower result deploys first.
    es: null
  eligibility:
