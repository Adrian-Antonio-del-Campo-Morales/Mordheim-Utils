- id: necromantic-abomination--constant-evolution
  name: Constant Evolution
  effect: The Necromantic Abomination does not use the normal Henchman development table. When it would
    make a development roll, roll on the Necromantic Modification Table instead. Each modification may
    be obtained only once, and its listed additional material cost must be paid. Its Experience progression
    represents the Necromancer's modifications rather than learning from battle.
  source:
    manual: khemri
    printed_page: 55
    section: Henchmen / 0-1 Necromantic Abomination / Constant Evolution
  name_i18n:
    en: Constant Evolution
    es: Evolución constante
  effect_i18n:
    en: The Necromantic Abomination does not use the normal Henchman development table. When it would
      make a development roll, roll on the Necromantic Modification Table instead. Each modification may
      be obtained only once, and its listed additional material cost must be paid. Its Experience progression
      represents the Necromancer's modifications rather than learning from battle.
    es: La Abominación necromántica no usa la tabla normal de desarrollo de Soldados. Cuando le corresponda
      realizar una tirada de desarrollo, tira en la Tabla de Modificaciones Necrománticas en su lugar.
      Cada modificación solo puede obtenerse una vez, y debe pagarse su coste adicional de materiales
      indicado. Su progresión de Experiencia representa las modificaciones del Nigromante en lugar de
      un aprendizaje propio.
  applies_to:
    profile_ids:
    - necromantic-abomination
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.khemri-necromancers.necromantic-abomination.constant-evolution
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, magic, or non-duel context.'
- id: band--death-of-the-necromancer
  name: Death of the Necromancer
  effect: If the Necromancer dies, the Apprentice takes control of the warband, gathers the master's books
    and writings, and becomes the Necromancer. Only the Necromancer can keep the Undead animated. If both
    the Necromancer and the Apprentice are dead, all Undead members of the warband disappear.
  source:
    manual: khemri
    printed_page: 54
    section: Heroes / 1 Necromancer / Death of the Necromancer
  name_i18n:
    en: Death of the Necromancer
    es: Muerte del Nigromante
  effect_i18n:
    en: If the Necromancer dies, the Apprentice takes control of the warband, gathers the master's books
      and writings, and becomes the Necromancer. Only the Necromancer can keep the Undead animated. If
      both the Necromancer and the Apprentice are dead, all Undead members of the warband disappear.
    es: Si el Nigromante muere, el Aprendiz toma el control de la banda, reúne los libros y escritos de
      su maestro y se convierte en el Nigromante. Solo el Nigromante puede mantener animados a los No
      muertos. Si tanto el Nigromante como el Aprendiz mueren, todos los miembros No muertos de la banda
      desaparecen.
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.khemri-necromancers.band.death-of-the-necromancer
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, magic, or non-duel context.'
