- id: necromantic-abomination--constant-evolution
  name: Constant Evolution
  effect: The Necromantic Abomination does not use the normal Henchman development table. When it would make a development
    roll, roll on the Necromantic Modification Table instead. Each modification may be obtained only once, and its listed
    additional material cost must be paid. Its Experience progression represents the Necromancer's modifications rather than
    learning from battle.
  source:
    manual: khemri
    printed_page: 55
    section: Henchmen / 0-1 Necromantic Abomination / Constant Evolution
  name_i18n:
    en: Constant Evolution
    es: null
  effect_i18n:
    en: The Necromantic Abomination does not use the normal Henchman development table. When it would make a development roll,
      roll on the Necromantic Modification Table instead. Each modification may be obtained only once, and its listed additional
      material cost must be paid. Its Experience progression represents the Necromancer's modifications rather than learning
      from battle.
