- id: nehekharan-vultures--flight
  name: Flight
  effect: A Nehekharan Vulture ignores terrain while moving and may charge any visible target without
    restrictions from height or intercepting models. Shooting attacks against a flying Vulture suffer
    -1 To Hit.
  source:
    manual: khemri
    printed_page: 55
    section: Henchmen / 0-5 Nehekharan Vultures / Flight
  name_i18n:
    en: Flight
    es: Vuelo
  effect_i18n:
    en: A Nehekharan Vulture ignores terrain while moving and may charge any visible target without restrictions
      from height or intercepting models. Shooting attacks against a flying Vulture suffer -1 To Hit.
    es: Un Buitre nehekaranó ignora el terreno al moverse y puede cargar contra cualquier objetivo visible
      sin restricciones de altura ni modelos interpuestos. Los ataques de disparo contra un Buitre en
      vuelo sufren -1 por Golpear.
  applies_to:
    profile_ids:
    - nehekharan-vultures
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.khemri-necromancers.nehekharan-vultures.flight
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, magic, or non-duel context.'
- id: nehekharan-vultures--fragile
  name: Fragile
  effect: 'When a Nehekharan Vulture suffers a Wound, resolve injury as follows: 1-3 Knocked Down, including
    the Undead No Pain effect; 4-6 Out of Action.'
  source:
    manual: khemri
    printed_page: 55
    section: Henchmen / 0-5 Nehekharan Vultures / Fragile
  name_i18n:
    en: Fragile
    es: Frágil
  effect_i18n:
    en: 'When a Nehekharan Vulture suffers a Wound, resolve injury as follows: 1-3 Knocked Down, including
      the Undead No Pain effect; 4-6 Out of Action.'
    es: 'Cuando un Buitre nehekaranó sufre una Herida, resuelve la herida así: 1-3 Derribado, incluido
      el efecto de No muertos Sin dolor; 4-6 Fuera de Combate.'
  applies_to:
    profile_ids:
    - nehekharan-vultures
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: trait.injury-profile
      scope: 'YES'
      binding:
        kind: trait
        id: trait.injury-profile
        parameters:
          value: 3
