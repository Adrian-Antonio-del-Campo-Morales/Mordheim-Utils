- id: band--death-of-the-necromancer
  name: Death of the Necromancer
  effect: If the Necromancer dies, the Apprentice takes control of the warband, gathers the master's books and writings, and
    becomes the Necromancer. Only the Necromancer can keep the Undead animated. If both the Necromancer and the Apprentice
    are dead, all Undead members of the warband disappear.
  source:
    manual: khemri
    printed_page: 54
    section: Heroes / 1 Necromancer / Death of the Necromancer
  name_i18n:
    en: Death of the Necromancer
    es: null
  effect_i18n:
    en: If the Necromancer dies, the Apprentice takes control of the warband, gathers the master's books and writings, and
      becomes the Necromancer. Only the Necromancer can keep the Undead animated. If both the Necromancer and the Apprentice
      are dead, all Undead members of the warband disappear.
    es: null
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
