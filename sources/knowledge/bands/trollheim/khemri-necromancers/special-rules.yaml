schema_version: 2
band_id: khemri-necromancers
rules:
- id: necromancer--leader
  name: Leader
  effect: Any warband model within 6" of the Necromancer may use his Leadership instead of its own.
  source:
    manual: khemri
    printed_page: 54
    section: Heroes / 1 Necromancer / Leader
  name_i18n:
    en: Leader
    es: Líder
  effect_i18n:
    en: Any warband model within 6" of the Necromancer may use his Leadership instead of its own.
    es: Cualquier modelo de la banda a 6" del Nigromante puede usar su Liderazgo en lugar del suyo propio.
  applies_to:
    profile_ids:
    - necromancer
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.khemri-necromancers.necromancer.leader
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology or mounts.'
- id: necromancer--wizard
  name: Wizard
  effect: The Necromancer is a Wizard and begins with one Necromancy spell. The spell list and spell effects
    are intentionally not modelled in this file.
  source:
    manual: khemri
    printed_page: 54
    section: Heroes / 1 Necromancer / Wizard
  name_i18n:
    en: Wizard
    es: Hechicero
  effect_i18n:
    en: The Necromancer is a Wizard and begins with one Necromancy spell. The spell list and spell effects
      are intentionally not modelled in this file.
    es: El Nigromante es un Hechicero y comienza con un hechizo de Nigromancia. La lista de hechizos y
      sus efectos no se modelan intencionadamente en este archivo.
  applies_to:
    profile_ids:
    - necromancer
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.khemri-necromancers.necromancer.wizard
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, magic, or non-duel context.'
- id: apprentice--student
  name: Student
  effect: The Apprentice begins with no spells. Whenever the Apprentice gains a new skill, it may acquire
    a randomly generated Necromancy spell. The spell list and spell effects are intentionally not modelled
    in this file.
  source:
    manual: khemri
    printed_page: 54
    section: Heroes / 0-1 Apprentice / Student
  name_i18n:
    en: Student
    es: Discípulo
  effect_i18n:
    en: The Apprentice begins with no spells. Whenever the Apprentice gains a new skill, it may acquire
      a randomly generated Necromancy spell. The spell list and spell effects are intentionally not modelled
      in this file.
    es: El Aprendiz comienza sin hechizos. Siempre que el Aprendiz gane una nueva habilidad, puede adquirir
      un hechizo de Nigromancia generado al azar. La lista de hechizos y sus efectos no se modelan intencionadamente
      en este archivo.
  applies_to:
    profile_ids:
    - apprentice
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.khemri-necromancers.apprentice.student
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, magic, or non-duel context.'
- id: tomb-robbers--disable-traps
  name: Disable Traps
  effect: Tomb Robbers are experts at detecting and disabling traps. Resolve this using the trap rules
    referenced by the Khemri Experience section.
  source:
    manual: khemri
    printed_page: 54
    section: Heroes / 0-3 Tomb Robbers / Disable Traps
  name_i18n:
    en: Disable Traps
    es: Desactivar trampas
  effect_i18n:
    en: Tomb Robbers are experts at detecting and disabling traps. Resolve this using the trap rules referenced
      by the Khemri Experience section.
    es: Los Ladrones de tumbas son expertos en detectar y desactivar trampas. Resuélvelo usando las reglas
      de trampas referenciadas por la sección de Experiencia de Khemri.
  applies_to:
    profile_ids:
    - tomb-robbers
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.khemri-necromancers.tomb-robbers.disable-traps
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, magic, or non-duel context.'
