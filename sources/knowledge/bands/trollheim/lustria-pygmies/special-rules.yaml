- id: great-headhunter--leader
  name: Leader
  effect: Any warband warrior within 6" of the Great Headhunter may use his Leadership when taking Leadership
    tests.
  source:
    manual: lustria
    printed_page: 123
    section: Heroes / 1 Great Headhunter / Leader
  name_i18n:
    en: Leader
    es: Líder
  effect_i18n:
    en: Any warband warrior within 6" of the Great Headhunter may use his Leadership when taking Leadership
      tests.
    es: Cualquier guerrero de la banda a 6" del Gran cazacabezas puede usar su Liderazgo al realizar chequeos
      de Liderazgo.
  applies_to:
    profile_ids:
    - great-headhunter
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
