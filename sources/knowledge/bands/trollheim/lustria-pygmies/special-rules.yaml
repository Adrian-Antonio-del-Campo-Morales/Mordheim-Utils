- id: silent-walker--spirit-form
  name: Spirit Form
  effect: The Silent Walker may move through walls and obstacles as if they did not exist, but may not
    charge a target outside its line of sight. The Silent Walker never suffers falling damage.
  source:
    manual: lustria
    printed_page: 123
    section: Heroes / 0-1 Silent Walker / Spirit Form
  name_i18n:
    en: Spirit Form
    es: Forma espiritual
  effect_i18n:
    en: The Silent Walker may move through walls and obstacles as if they did not exist, but may not charge
      a target outside its line of sight. The Silent Walker never suffers falling damage.
    es: El Caminante silencioso puede moverse a través de muros y obstáculos como si no existieran, pero
      no puede cargar contra un objetivo fuera de su línea de visión. El Caminante silencioso nunca sufre
      daño por caídas.
  applies_to:
    profile_ids:
    - silent-walker
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.lustria-pygmies.silent-walker.spirit-form
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, magic, or non-duel context.'
- id: silent-walker--ethereal
  name: Ethereal
  effect: The Silent Walker has a 5+ special save against mundane attacks. This save is negated by magical
    attacks.
  source:
    manual: lustria
    printed_page: 123
    section: Heroes / 0-1 Silent Walker / Ethereal
  name_i18n:
    en: Ethereal
    es: Etéreo
  effect_i18n:
    en: The Silent Walker has a 5+ special save against mundane attacks. This save is negated by magical
      attacks.
    es: El Caminante silencioso tiene una salvación especial de 5+ contra ataques mundanos. Esta salvación
      queda anulada por los ataques mágicos.
  applies_to:
    profile_ids:
    - silent-walker
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: trait.ward-save
      scope: 'YES'
      binding:
        kind: trait
        id: trait.ward-save
        parameters:
          value: 5
    - id: trait.ward-save-mundane-only
      scope: 'YES'
      binding:
        kind: trait
        id: trait.ward-save-mundane-only
        parameters:
          value: true
