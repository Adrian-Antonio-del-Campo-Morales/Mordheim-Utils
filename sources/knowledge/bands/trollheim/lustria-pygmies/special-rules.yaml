- id: wild-lunatics--lunatics
  name: Lunatics
  effect: At the start of each turn, roll 1D6 for each Wild Lunatic in play. On 1-3 that model gains Frenzy;
    on 4-6 it gains Stupidity. The printed rule mistakenly says to roll for each Cannibal even though
    the rule appears under the Wild Lunatic profile.
  source:
    manual: lustria
    printed_page: 124
    section: Henchmen / 0-5 Wild Lunatics / Lunatics
  name_i18n:
    en: Lunatics
    es: Dementes
  effect_i18n:
    en: At the start of each turn, roll 1D6 for each Wild Lunatic in play. On 1-3 that model gains Frenzy;
      on 4-6 it gains Stupidity. The printed rule mistakenly says to roll for each Cannibal even though
      the rule appears under the Wild Lunatic profile.
    es: Al comienzo de cada turno, tira 1D6 por cada Demente salvaje sobre la mesa. Con 1-3 ese modelo
      gana Frenesí; con 4-6 gana Estupidez. La regla impresa dice por error que se tire por cada Caníbal,
      aunque la regla aparece bajo el perfil de Demente salvaje.
  applies_to:
    profile_ids:
    - wild-lunatics
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.lustria-pygmies.wild-lunatics.lunatics
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology or mounts.'
- id: band--jungle-natives
  name: Jungle Natives
  effect: Pygmies suffer no movement penalties for moving through woods or any kind of vegetation.
  source:
    manual: lustria
    printed_page: 121
    section: Pygmy Special Rules / Jungle Natives
  name_i18n:
    en: Jungle Natives
    es: Nativos de la selva
  effect_i18n:
    en: Pygmies suffer no movement penalties for moving through woods or any kind of vegetation.
    es: Los Pigmeos no sufren penalizaciones de movimiento por moverse por bosques ni por ningún tipo
      de vegetación.
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.lustria-pygmies.band.jungle-natives
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, magic, or non-duel context.'
