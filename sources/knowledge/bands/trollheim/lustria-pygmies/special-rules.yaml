- id: band--camouflage
  name: Camouflage
  effect: A Pygmy that is not wearing armour cannot be detected unless the detecting model first passes
    an Initiative test. Hardened Leather is explicitly allowed and does not prevent this rule from applying.
  source:
    manual: lustria
    printed_page: 121
    section: Pygmy Special Rules / Camouflage
  name_i18n:
    en: Camouflage
    es: Camuflaje
  effect_i18n:
    en: A Pygmy that is not wearing armour cannot be detected unless the detecting model first passes
      an Initiative test. Hardened Leather is explicitly allowed and does not prevent this rule from applying.
    es: Un Pigmeo que no lleve armadura no puede ser detectado a menos que el modelo que detecta supere
      primero un chequeo de Iniciativa. El Cuero curtido está permitido explícitamente y no impide que
      se aplique esta regla.
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.lustria-pygmies.band.camouflage
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, magic, or non-duel context.'
