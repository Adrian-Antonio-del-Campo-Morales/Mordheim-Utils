- id: wild-lunatics--lunatics
  name: Lunatics
  effect: At the start of each turn, roll 1D6 for each Wild Lunatic in play. On 1-3 that model gains Frenzy; on 4-6 it gains
    Stupidity. The printed rule mistakenly says to roll for each Cannibal even though the rule appears under the Wild Lunatic
    profile.
  source:
    manual: lustria
    printed_page: 124
    section: Henchmen / 0-5 Wild Lunatics / Lunatics
  name_i18n:
    en: Lunatics
    es: null
