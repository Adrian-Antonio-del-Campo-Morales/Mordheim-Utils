- id: lahmia-vampire--enchanting-beauty
  name: Enchanting Beauty
  effect: >-
    Any living enemy in base contact with the Lahmia Vampire suffers -1 Leadership. This has no
    effect on Undead or Daemons.
  source:
    manual: chaos-in-the-streets
    printed_page: 175
    section: 1 Lahmia Vampire / Enchanting Beauty
  name_i18n:
    es: Belleza Hechizante
  effect_i18n:
    es: >-
      Cualquier enemigo viviente en contacto de peana con el Vampiro Lahmia sufre -1 Liderazgo. Esto
      no tiene efecto sobre No-muertos ni Demonios.
  applies_to:
    profile_ids:
    - lahmia-vampire
  runtime:
