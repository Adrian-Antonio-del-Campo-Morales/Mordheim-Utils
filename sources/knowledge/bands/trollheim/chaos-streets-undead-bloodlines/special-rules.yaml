- id: band--choose-bloodline
  name: Choose a Bloodline
  effect: >-
    When the warband is created, choose exactly one Vampire bloodline. The choice cannot later be
    changed. The selected Vampire is the warband leader and no other Vampire may be recruited as a
    warband member; Dramatis Personae and Hired Swords are the only stated exceptions.
  source:
    manual: chaos-in-the-streets
    printed_page: 173
    section: Special Rules / Warband Creation
  name_i18n:
    es: Elige un Linaje
  effect_i18n:
    es: >-
      Cuando se crea la banda, elige exactamente un linaje de Vampiro. La elección no puede
      cambiarse más tarde. El Vampiro seleccionado es el líder de la banda y ningún otro Vampiro
      puede ser reclutado como miembro de la banda; los Personajes Dramáticos y las Espadas a Sueldo
      son las únicas excepciones indicadas.
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: compiler.choose-a-bloodline
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: choosing one immutable Vampire leader and excluding other Vampires is a
        warband-roster and campaign constraint.
