- id: blood-dragon-vampire--brave
  name: Brave
  effect: >-
    The warband may re-roll its first failed Rout test while the Blood Dragon Vampire is available.
  source:
    manual: chaos-in-the-streets
    printed_page: 176
    section: 1 Blood Dragon Vampire / Brave
  name_i18n:
    es: Valiente
  effect_i18n:
    es: >-
      La banda puede repetir su primer chequeo de huida fallido mientras el Vampiro Dragón de Sangre
      esté disponible.
  applies_to:
    profile_ids:
    - blood-dragon-vampire
  runtime:
    scope: LATER
    implemented: 'NO'
