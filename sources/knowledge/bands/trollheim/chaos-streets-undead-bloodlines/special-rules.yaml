    Once per turn, one enemy in base contact must pass a Leadership test using its own Leadership.
    If it fails, it may not attack the Lahmia Vampire that turn, though it may attack another model
    in base contact. Models immune to Psychology, Undead and Daemons are unaffected.
  source:
