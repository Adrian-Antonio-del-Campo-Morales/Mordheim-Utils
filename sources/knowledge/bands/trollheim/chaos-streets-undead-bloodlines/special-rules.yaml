- id: band--vampire-power-hypnotic-gaze
  kind: warband_skill
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.band-vampire-power-hypnotic-gaze
      scope: LATER
      binding: null
      reason: >-
        requires Leadership and psychology
  name: Hypnotic Gaze
  effect: >-
    Once per turn, one enemy in base contact must pass a Leadership test using its own Leadership,
    not the leader's. If it fails, it may not attack that turn and all attacks against it hit
    automatically. Models immune to Psychology are unaffected.
  source:
    manual: chaos-in-the-streets
    printed_page: 181
    section: Von Carstein Special Skills / Hypnotic Gaze
  name_i18n:
    es: Mirada Hipnótica
  effect_i18n:
    es: >-
      Una vez por asalto, un enemigo en contacto de peana debe superar un chequeo de Liderazgo
      usando su propio Liderazgo, no el del líder. Si falla, no puede atacar ese asalto y todos los
      ataques contra él impactan automáticamente. Los modelos inmunes a la Psicología no se ven
      afectados.
  eligibility:
  - von-carstein-vampire
  - lahmia-vampire
  applies_to:
    band: true
- id: band--von-carstein-power-dark-majesty
  kind: warband_skill
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.band-von-carstein-power-dark-majesty
      scope: LATER
      binding: null
      reason: >-
        affects warband Leadership range
  name: Dark Majesty
  effect: >-
    Increase the Vampire's Leader range by 6" (from 6" to 12"). While the Vampire remains on the
    battlefield, the warband may re-roll failed Rout tests.
  source:
    manual: chaos-in-the-streets
    printed_page: 181
    section: Von Carstein Special Skills / Dark Majesty
  name_i18n:
    es: Majestad Oscura
  effect_i18n:
    es: >-
      Aumenta el alcance de Líder del Vampiro en 6" (de 6" a 12"). Mientras el Vampiro permanezca en
      el campo de batalla, la banda puede repetir los chequeos de huida fallados.
  eligibility:
  - von-carstein-vampire
  applies_to:
    band: true
- id: band--von-carstein-power-call-the-bats
  kind: warband_skill
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.band-von-carstein-power-call-the-bats
      scope: 'NO'
      binding: null
      reason: >-
        summons additional models
  name: Call the Bats
  effect: >-
    Once per battle, automatically summon 1D3 Vampire Bats within 6" of the Vampire. The summoned
    bats disappear at the end of the battle if they have not already been taken Out of Action. Each
    bat is bound to the Vampire: if it moves beyond the Vampire's current Leader range it
    immediately leaves the battlefield, and all remaining bats disappear if the summoning Vampire is
    removed as a casualty.
  source:
    manual: chaos-in-the-streets
    printed_page: 181
    section: Von Carstein Special Skills / Call the Bats
  name_i18n:
    es: Llamar a los Murciélagos
  effect_i18n:
    es: >-
      Una vez por batalla, invoca automáticamente D3 Murciélagos Vampiro a 6" del Vampiro. Los
      murciélagos invocados desaparecen al final de la batalla si no han sido ya puestos Fuera de
      combate. Cada murciélago está ligado al Vampiro: si se mueve más allá del alcance de Líder
      actual del Vampiro, abandona inmediatamente el campo de batalla, y todos los murciélagos
      restantes desaparecen si el Vampiro invocador es retirado como baja.
  eligibility:
  - von-carstein-vampire
  summoned_profile_id: vampire-bat
  summoned_count: 1D3
  applies_to:
    band: true
- id: band--von-carstein-power-summon-storm
  kind: warband_skill
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.band-von-carstein-power-summon-storm
      scope: 'NO'
      binding: null
      reason: >-
        affects the shooting phase
  name: Summon the Storm
  effect: >-
    Once per battle at the start of the Shooting phase, roll D6. On 1 the attempt fails; on 2-6 the
    storm lasts until the Vampire's next turn. All shooting suffers -1 To Hit and no model may use
    Fly while the storm lasts. The storm ends immediately if the Vampire suffers a Wound or becomes
    engaged in close combat.
  source:
    manual: chaos-in-the-streets
    printed_page: 181
    section: Von Carstein Special Skills / Summon the Storm
  name_i18n:
    es: Invocar la Tormenta
  effect_i18n:
    es: >-
      Una vez por batalla, al inicio de la fase de Disparo, tira D6. Con un 1 el intento falla; con
      un 2-6 la tormenta dura hasta el siguiente turno del Vampiro. Todo el disparo sufre -1 para
      impactar y ningún modelo puede usar Volar mientras dure la tormenta. La tormenta termina
      inmediatamente si el Vampiro sufre una Herida o queda empeñado en combate cuerpo a cuerpo.
  eligibility:
  - von-carstein-vampire
  applies_to:
    band: true
