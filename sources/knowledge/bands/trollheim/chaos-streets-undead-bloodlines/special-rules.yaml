      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology or mounts.'
- id: von-carstein-vampire--immune-to-psychology
  name: Immune to Psychology
  effect: The Vampire is immune to Psychology and never leaves combat because of Psychology.
  source:
    manual: chaos-in-the-streets
    printed_page: 174
    section: 1 Von Carstein Vampire / Special Rules / Immune to Psychology
  name_i18n:
    en: Immune to Psychology
    es: Inmune a la psicología
  effect_i18n:
    en: The Vampire is immune to Psychology and never leaves combat because of Psychology.
    es: El Vampiro es inmune a la Psicología y nunca abandona el combate por causa de la Psicología.
  applies_to:
    profile_ids:
    - von-carstein-vampire
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.chaos-streets-undead-bloodlines.von-carstein-vampire.immune-to-psychology
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology or mounts.'
- id: von-carstein-vampire--immune-to-poison
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: trait.poison-immune
      scope: 'YES'
      binding:
        kind: trait
        id: trait.poison-immune
        parameters:
          value: true
  name: Immune to Poison
  effect: The Vampire is immune to poison.
  source:
    manual: chaos-in-the-streets
    printed_page: 174
    section: 1 Von Carstein Vampire / Special Rules / Immune to Poison
  name_i18n:
    en: Immune to Poison
    es: Inmune al veneno
  effect_i18n:
    en: The Vampire is immune to poison.
    es: El Vampiro es inmune al veneno.
  applies_to:
    profile_ids:
    - von-carstein-vampire
- id: von-carstein-vampire--no-pain
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: skill.ignore-pain
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.ignore-pain
  name: No Pain
  effect: The Vampire treats a Stunned result on the Injury chart as Knocked Down.
  source:
    manual: chaos-in-the-streets
    printed_page: 174
    section: 1 Von Carstein Vampire / Special Rules / No Pain
  name_i18n:
    en: No Pain
    es: Sin dolor
  effect_i18n:
    en: The Vampire treats a Stunned result on the Injury chart as Knocked Down.
    es: El Vampiro trata un resultado de Aturdido en la tabla de Heridas como Derribado.
  applies_to:
    profile_ids:
    - von-carstein-vampire
