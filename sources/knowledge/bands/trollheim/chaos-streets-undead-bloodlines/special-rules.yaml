      Una vez por asalto, un enemigo en contacto de peana debe superar un chequeo de Liderazgo
      usando su propio Liderazgo. Si falla, no puede atacar al Vampiro Lahmia ese asalto, aunque
      puede atacar a otro modelo en contacto de peana. Los modelos inmunes a la Psicología, los
      No-muertos y los Demonios no se ven afectados.
  eligibility:
  - lahmia-vampire
  applies_to:
    band: true
