- id: von-carstein-vampire--leader
  name: Leader
  effect: >-
    Any warband model within 6" of the Vampire may use the Vampire's Leadership instead of its own.
  source:
    manual: chaos-in-the-streets
    printed_page: 174
    section: 1 Von Carstein Vampire / Special Rules / Leader
  name_i18n:
    es: Líder
  effect_i18n:
    es: >-
      Cualquier modelo de la banda a 6" del Vampiro puede usar el Liderazgo del Vampiro en lugar del
      suyo propio.
  applies_to:
    profile_ids:
    - von-carstein-vampire
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.chaos-streets-undead-bloodlines.von-carstein-vampire.leader
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: psychology or mounts.
