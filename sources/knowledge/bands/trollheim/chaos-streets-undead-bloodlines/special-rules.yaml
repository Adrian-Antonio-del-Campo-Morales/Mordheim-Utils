- id: necrarch-vampire--wizard
  name: Wizard
  effect: >-
    The Necrarch Vampire is a Wizard and may use Necromantic Magic. The spell list itself is
    intentionally not modelled in this file.
  source:
    manual: chaos-in-the-streets
    printed_page: 177
    section: 1 Necrarch Vampire / Wizard
  name_i18n:
    es: Mago
  effect_i18n:
    es: >-
      El Vampiro Necrarca es un hechicero y puede usar la Magia Nigromántica. La lista de hechizos
      en sí no está modelada intencionadamente en este archivo.
  applies_to:
    profile_ids:
    - necrarch-vampire
  runtime:
