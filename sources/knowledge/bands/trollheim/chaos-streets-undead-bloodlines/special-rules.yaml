- id: blood-dragon-vampire--honour
  name: Honour
  effect: The Blood Dragon Vampire may not attempt to escape from close combat, and the warband may not
    voluntarily rout while the Vampire remains in play.
  source:
    manual: chaos-in-the-streets
    printed_page: 176
    section: 1 Blood Dragon Vampire / Honour
  name_i18n:
    en: Honour
    es: Honor
  effect_i18n:
    en: The Blood Dragon Vampire may not attempt to escape from close combat, and the warband may not
      voluntarily rout while the Vampire remains in play.
    es: El Vampiro Dragón de Sangre no puede intentar escapar del combate cuerpo a cuerpo, y la banda
      no puede huir voluntariamente mientras el Vampiro permanezca en juego.
  applies_to:
    profile_ids:
    - blood-dragon-vampire
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.chaos-streets-undead-bloodlines.blood-dragon-vampire.honour
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: no effect applies to the isolated 1v1 duel or legal fighter skill/equipment
        construction.
- id: blood-dragon-vampire--warriors-code
  name: Warrior's Code
  effect: The Blood Dragon Vampire may never use magic in any way, including through items or skills that
    would otherwise permit it.
  source:
    manual: chaos-in-the-streets
    printed_page: 176
    section: 1 Blood Dragon Vampire / Warrior's Code
  name_i18n:
    en: Warrior's Code
    es: Código del guerrero
  effect_i18n:
    en: The Blood Dragon Vampire may never use magic in any way, including through items or skills that
      would otherwise permit it.
    es: El Vampiro Dragón de Sangre jamás puede usar magia de ninguna manera, incluida mediante objetos
      o habilidades que de otro modo lo permitirían.
  applies_to:
    profile_ids:
    - blood-dragon-vampire
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: compiler.warrior-s-code
      scope: 'YES'
      binding:
        kind: compiler
        id: compiler.warrior-s-code
