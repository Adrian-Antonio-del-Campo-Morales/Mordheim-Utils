- id: band--tolerant
  name: Tolerant
  effect: The warband may hire Hired Swords provided they are not Chaotic or evil. The source explicitly excludes Skaven,
    Possessed, Beastmen, Dark Elves and Undead, and also forbids specialists in poison such as Assassins.
  source:
    manual: chaos-in-the-streets
    printed_page: 137
    section: Special Rules / Tolerant
  name_i18n:
    en: Tolerant
    es: null
  effect_i18n:
