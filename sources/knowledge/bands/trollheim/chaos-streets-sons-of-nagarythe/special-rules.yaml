      improves to 4+ for the attack type covered by that skill.
    es: null
  eligibility:
  - shadow-master
  - shadow-weaver
  - shadow-walker
  applies_to:
    band: true
- id: band--shadow-warrior-special-skills-powerful-build
  kind: warband_skill
  name: Powerful Build
  effect: The warrior may choose skills from the Strength skill list. A Shadow Weaver may never take this skill, and no more
    than two warriors in the warband may have it at the same time.
  source:
    manual: chaos-in-the-streets
    printed_page: 142
    section: Sons of Nagarythe Special Skills / Powerful Build
  name_i18n:
    en: Powerful Build
    es: null
  effect_i18n:
    en: The warrior may choose skills from the Strength skill list. A Shadow Weaver may never take this skill, and no more
      than two warriors in the warband may have it at the same time.
    es: null
  eligibility:
  - shadow-master
  - shadow-walker
  applies_to:
    band: true
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: profile.skill-access
      scope: 'YES'
      binding:
