- id: band--honourable
  name: Honourable
  effect: Warriors in the warband may not use poisons or drugs of any kind.
  source:
    manual: chaos-in-the-streets
    printed_page: 137
    section: Special Rules / Honourable
  name_i18n:
    en: Honourable
    es: null
  effect_i18n:
    en: Warriors in the warband may not use poisons or drugs of any kind.
    es: null
  applies_to:
    band: true
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: band
    effects:
    - id: compiler.forbid-item-categories
      scope: 'YES'
      binding:
        kind: compiler
        id: compiler.forbid-item-categories
        parameters:
          categories:
          - poison
          - drug
- id: band--unforgiving
  name: Unforgiving
  effect: In multiplayer games, the warband may never form an alliance with a Chaotic warband, including Possessed, Skaven,
    Beastmen and Dark Elves.
  source:
    manual: chaos-in-the-streets
    printed_page: 137
    section: Special Rules / Unforgiving
  name_i18n:
    en: Unforgiving
    es: null
