- id: band--shadow-warrior-special-skills-master-of-runes
  kind: warband_skill
  name: Master of Runes
  effect: When using Elven Runestones, the warrior gains +1 to the roll to dispel a spell. The warrior may also inscribe Elven
    runes on a warband member's weapon or armour; once during that battle, that model may re-roll one failed armour save or
    one failed parry, as appropriate. The rune loses its power after the battle. The Spanish source labels this skill 'Only
    Loremaster'; because the warband has no Loremaster profile, this restriction is mapped to the Shadow Weaver, the warband's
    wizard profile.
  source:
    manual: chaos-in-the-streets
    printed_page: 142
    section: Sons of Nagarythe Special Skills / Master of Runes
  name_i18n:
    en: Master of Runes
    es: null
  effect_i18n:
    en: When using Elven Runestones, the warrior gains +1 to the roll to dispel a spell. The warrior may also inscribe Elven
      runes on a warband member's weapon or armour; once during that battle, that model may re-roll one failed armour save
      or one failed parry, as appropriate. The rune loses its power after the battle. The Spanish source labels this skill
      'Only Loremaster'; because the warband has no Loremaster profile, this restriction is mapped to the Shadow Weaver, the
      warband's wizard profile.
    es: null
  eligibility:
  - shadow-weaver
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.chaos-streets-sons-of-nagarythe.band.shadow-warrior-special-skills-master-of-runes
      scope: 'NO'
      binding: null
      reason: 'Out of scope: no effect applies to the isolated 1v1 duel or legal fighter skill/equipment construction.'
- id: band--shadow-warrior-special-skills-elven-agility
  kind: warband_skill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: skill.elven-agility
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.elven-agility
  name: Elven Agility
  effect: The Elf avoids close-combat and missile attacks on a 6+. If he also has Dodge or Step Aside, the corresponding save
    improves to 4+ for the attack type covered by that skill.
  source:
    manual: chaos-in-the-streets
    printed_page: 142
