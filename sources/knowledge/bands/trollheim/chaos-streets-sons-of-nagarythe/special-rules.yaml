      reason: 'Out of scope: warband-level roster limit.'
- id: band--shadow-warrior-special-skills-infiltration
  kind: warband_skill
  name: Infiltration
  effect: The warrior deploys after the opposing warband and may be placed anywhere outside enemy line of sight and more than
    12" from every enemy model. If both players have infiltrating models, roll D6 for each; the lowest roll deploys first.
  source:
