- id: band--shadow-warrior-special-skills-hide-in-shadows
  kind: warband_skill
  name: Hide in Shadows
  effect: An enemy attempting to detect this Hidden warrior halves its Initiative before measuring the
    detection distance.
  source:
    manual: chaos-in-the-streets
    printed_page: 142
    section: Sons of Nagarythe Special Skills / Hide in Shadows
  name_i18n:
    en: Hide in Shadows
    es: Ocultarse en las sombras
  effect_i18n:
    en: An enemy attempting to detect this Hidden warrior halves its Initiative before measuring the detection
      distance.
    es: Un enemigo que intente detectar a este guerrero Oculto divide a la mitad su Iniciativa antes de
      medir la distancia de detección.
  eligibility:
  - shadow-master
