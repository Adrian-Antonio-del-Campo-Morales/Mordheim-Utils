- id: band--shadow-warrior-special-skills-see-in-shadows
  kind: warband_skill
  name: See in Shadows
  effect: If the warrior has enough Movement to reach an unseen opponent, he may re-roll the test made to charge that opponent;
    the source contrasts this with the normal 4" limit.
  source:
    manual: chaos-in-the-streets
    printed_page: 142
    section: Sons of Nagarythe Special Skills / See in Shadows
  name_i18n:
    en: See in Shadows
    es: null
  effect_i18n:
    en: If the warrior has enough Movement to reach an unseen opponent, he may re-roll the test made to charge that opponent;
      the source contrasts this with the normal 4" limit.
    es: null
  eligibility:
