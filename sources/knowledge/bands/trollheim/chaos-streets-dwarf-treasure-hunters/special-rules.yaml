schema_version: 2
band_id: chaos-streets-dwarf-treasure-hunters
rules:
- id: dwarf-noble--leader
  name: Leader
  effect: Any warband model within 15 cm of the Dwarf Noble may use his Leadership when taking Leadership tests.
  source:
    manual: chaos-in-the-streets
    printed_page: 114
    section: Heroes / 1 Dwarf Noble / Special Rules / Leader
  name_i18n:
    en: Leader
    es: null
  effect_i18n:
    en: Any warband model within 15 cm of the Dwarf Noble may use his Leadership when taking Leadership tests.
    es: null
  applies_to:
    profile_ids:
    - dwarf-noble
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.chaos-streets-dwarf-treasure-hunters.dwarf-noble.leader
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology or mounts.'
- id: dwarf-engineer--expert-armourer
  name: Expert Armourer
  effect: While the Dwarf Engineer remains in the warband, all missile weapons used by the warband increase their range by
    15 cm. The modifications require the Engineer's constant maintenance.
  source:
    manual: chaos-in-the-streets
    printed_page: 114
    section: Heroes / 0-1 Dwarf Engineer / Special Rules / Expert Armourer
  name_i18n:
    en: Expert Armourer
    es: null
  effect_i18n:
