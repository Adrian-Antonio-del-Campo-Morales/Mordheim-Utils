- id: band--dwarf-special-skills-master-of-blades
  kind: warband_skill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: skill.unbeatable-warrior
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.unbeatable-warrior
    - id: skill.sword-master
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.sword-master
  name: Master of Blades
  effect: When using a weapon with the Parry special rule, this Hero parries successfully if his roll equals or exceeds the
    opponent's highest To Hit roll. If using two weapons with Parry, he may attempt two parries against the two highest attack
    rolls. If using two Dwarf Axes, he may also re-roll failed parries.
  source:
    manual: chaos-in-the-streets
    printed_page: 113
    section: Dwarf Treasure Hunter Special Skills / Master of Blades
  name_i18n:
    en: Master of Blades
    es: null
  effect_i18n:
    en: When using a weapon with the Parry special rule, this Hero parries successfully if his roll equals or exceeds the
      opponent's highest To Hit roll. If using two weapons with Parry, he may attempt two parries against the two highest
      attack rolls. If using two Dwarf Axes, he may also re-roll failed parries.
    es: null
  eligibility:
  - dwarf-noble
  - dwarf-engineer
  - dwarf-troll-slayers
  applies_to:
    band: true
- id: band--dwarf-special-skills-extra-tough
  kind: warband_skill
  name: Extra Tough
  effect: After a battle in which this Hero was taken Out of Action, he may re-roll his result on the Heroes Serious Injury
    table once. The second result must be accepted even if it is worse.
  source:
    manual: chaos-in-the-streets
    printed_page: 113
    section: Dwarf Treasure Hunter Special Skills / Extra Tough
  name_i18n:
    en: Extra Tough
    es: null
