    effects:
    - id: unimplemented.chaos-streets-dwarf-treasure-hunters.dwarf-engineer.expert-armourer
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, or non-duel context.'
- id: dwarf-troll-slayers--death-oath
  name: Death Oath
  effect: Dwarf Troll Slayers are completely immune to all Psychology and do not need to take tests for fighting alone.
  source:
    manual: chaos-in-the-streets
    printed_page: 114
    section: Heroes / 0-2 Dwarf Troll Slayers / Special Rules / Death Oath
  name_i18n:
    en: Death Oath
    es: null
  effect_i18n:
    en: Dwarf Troll Slayers are completely immune to all Psychology and do not need to take tests for fighting alone.
    es: null
