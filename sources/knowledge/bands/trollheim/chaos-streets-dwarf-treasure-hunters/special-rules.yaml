- id: dwarf-troll-slayers--slayer-skills
  name: Slayer Skills
  effect: When gaining a new skill, a Dwarf Troll Slayer may choose from the Troll Slayer Special Skills. He may also choose
    from the Dwarf Treasure Hunter Special Skills.
  source:
    manual: chaos-in-the-streets
    printed_page: 113
    section: Troll Slayer Special Skills
  name_i18n:
    en: Slayer Skills
    es: null
  effect_i18n:
    en: When gaining a new skill, a Dwarf Troll Slayer may choose from the Troll Slayer Special Skills. He may also choose
      from the Dwarf Treasure Hunter Special Skills.
    es: null
  applies_to:
    profile_ids:
    - dwarf-troll-slayers
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: profile.skill-access
      scope: 'YES'
      binding:
        kind: profile
        id: profile.skill-access
        parameters:
          category: special
- id: band--hard-to-kill
  kind: profile_ability
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: band
    effects:
    - id: skill.hard-to-kill
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.hard-to-kill
  name: Hard to Kill
  effect: Dwarfs are taken Out of Action only on a 6 on the Injury chart; 1-2 is Knocked Down and 3-5 is Stunned.
  source:
    manual: chaos-in-the-streets
    printed_page: 111
    section: Special Rules / Hard to Kill
  name_i18n:
    en: Hard to Kill
    es: null
  effect_i18n:
    en: Dwarfs are taken Out of Action only on a 6 on the Injury chart; 1-2 is Knocked Down and 3-5 is Stunned.
    es: null
  applies_to:
    band: true
- id: band--hard-head
  name: Hard Head
  effect: Dwarfs ignore the special rules of maces, clubs and similar weapons that would make them easier to Stun.
  source:
    manual: chaos-in-the-streets
    printed_page: 111
    section: Special Rules / Hard Head
  name_i18n:
    en: Hard Head
    es: null
  effect_i18n:
    en: Dwarfs ignore the special rules of maces, clubs and similar weapons that would make them easier to Stun.
    es: null
  applies_to:
    band: true
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: band
    effects:
    - id: trait.concussion-immune
      scope: 'YES'
      binding:
        kind: trait
        id: trait.concussion-immune
        parameters:
          value: true
