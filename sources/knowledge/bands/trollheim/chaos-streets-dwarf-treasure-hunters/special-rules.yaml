  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: skill.monster-slayer
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.monster-slayer
  name: Monster Slayer
  effect: The Slayer always wounds an opponent on a 4+ regardless of Toughness, unless his modified Strength would normally
    allow him to wound on a lower result.
  source:
