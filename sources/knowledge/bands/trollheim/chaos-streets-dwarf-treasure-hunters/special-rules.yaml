- id: band--dwarf-special-skills-thick-skull
  kind: warband_skill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: skill.thick-skull
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.thick-skull
  name: Thick Skull
  effect: Whenever this Hero would be Stunned, he may make a 3+ save to be Knocked Down instead. If he is wearing a Helmet,
    this save becomes 2+ and replaces the Helmet's normal special rule.
  source:
    manual: chaos-in-the-streets
    printed_page: 113
    section: Dwarf Treasure Hunter Special Skills / Thick Skull
