- id: band--clan-pestilens-special-skills-rotten-body
  kind: warband_skill
  name: Rotten Body
  effect: The Hero is immune to poisons and diseases. If taken Out of Action because of a failed test while using a Censer,
    the Hero does not roll on the Serious Injury table after the battle and recovers automatically.
  source:
    manual: lustria
    printed_page: 80
    section: Clan Pestilens Special Skills / Rotten Body
  name_i18n:
    en: Rotten Body
    es: null
  effect_i18n:
    en: The Hero is immune to poisons and diseases. If taken Out of Action because of a failed test while using a Censer,
      the Hero does not roll on the Serious Injury table after the battle and recovers automatically.
    es: null
  eligibility:
  - plague-priest
  - pestilens-sorcerer
  - plague-monks
  - monk-initiates
  applies_to:
    band: true
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: trait.poison-immune
      scope: 'YES'
      binding:
        kind: trait
        id: trait.poison-immune
        parameters:
          value: true
    - id: campaign.censer-recovery
      scope: 'NO'
      binding: null
      reason: 'Out of scope: post-battle recovery and Serious Injury.'
- id: band--clan-pestilens-special-skills-contagious
  kind: warband_skill
  name: Contagious
  effect: Requires Rotten Body. A model that takes this Hero Out of Action in close combat must take a Toughness test. Roll
    D6; if the result is higher than that model's Toughness, it suffers one automatic Wound. A natural 6 always inflicts a
    Wound. Undead and Possessed are immune to this test.
  source:
    manual: lustria
    printed_page: 80
    section: Clan Pestilens Special Skills / Contagious
  name_i18n:
    en: Contagious
    es: null
  effect_i18n:
