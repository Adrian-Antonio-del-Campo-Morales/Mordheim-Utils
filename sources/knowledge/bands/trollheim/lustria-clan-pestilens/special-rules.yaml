- id: rat-ogre--large-target
  name: Large Target
  effect: The Rat Ogre may be selected as a shooting target even when it is not the closest eligible target,
    and missile attacks against it gain +1 To Hit.
  source:
    manual: lustria
    printed_page: 79
    section: Henchmen / 0-1 Rat Ogre / Large Target
  name_i18n:
    en: Large Target
    es: Objetivo grande
  effect_i18n:
    en: The Rat Ogre may be selected as a shooting target even when it is not the closest eligible target,
      and missile attacks against it gain +1 To Hit.
    es: El Ogro rata puede ser elegido como objetivo de disparo incluso cuando no es el objetivo elegible
      más cercano, y los ataques de misil contra él obtienen +1 por Golpear.
  applies_to:
