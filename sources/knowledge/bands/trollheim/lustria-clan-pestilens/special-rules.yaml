  - plague-monks
  - monk-initiates
  applies_to:
    band: true
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: compiler.censer-bearer-loadout
      scope: 'YES'
      binding:
        kind: compiler
        id: compiler.censer-bearer-loadout
  rule_ref: shared-rule.censer-bearer
- id: band--clan-pestilens-special-skills-rotten-body
  kind: warband_skill
  name: Rotten Body
  effect: >-
    The Hero is immune to poisons and diseases. If taken Out of Action because of a failed test
    while using a Censer, the Hero does not roll on the Serious Injury table after the battle and
    recovers automatically.
  source:
    manual: lustria
    printed_page: 80
    section: Clan Pestilens Special Skills / Rotten Body
  name_i18n:
    es: Cuerpo Podrido
  effect_i18n:
    es: >-
      El Héroe es inmune a los venenos y las enfermedades. Si sale de Combate por fallar un chequeo
      al usar un Incensario, el Héroe no tira en la tabla de Heridas Graves tras la batalla y se
      recupera automáticamente.
  eligibility:
  - plague-priest
  - pestilens-sorcerer
  - plague-monks
  - monk-initiates
  applies_to:
    band: true
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: trait.poison-immune
      scope: 'YES'
      binding:
        kind: trait
        id: trait.poison-immune
        parameters:
          value: true
      clauses:
      - id: immune-to-poison-and-disease
        scope: 'YES'
      - id: recovers-from-a-censer-failure
        scope: 'NO'
    - id: campaign.censer-recovery
      scope: 'NO'
      binding: null
      reason: out-of-scope.campaign
- id: band--clan-pestilens-special-skills-contagious
  kind: warband_skill
  name: Contagious
  effect: >-
    Requires Rotten Body. A model that takes this Hero Out of Action in close combat must take a
    Toughness test. Roll D6; if the result is higher than that model's Toughness, it suffers one
    automatic Wound. A natural 6 always inflicts a Wound. Undead and Possessed are immune to this
    test.
  source:
    manual: lustria
    printed_page: 80
    section: Clan Pestilens Special Skills / Contagious
  name_i18n:
    es: Contagioso
  effect_i18n:
    es: >-
      Requiere Cuerpo podrido. Un modelo que saque de Combate a este Héroe en combate cuerpo a
      cuerpo debe realizar un chequeo de Resistencia. Tira 1D6; si el resultado es mayor que la
      Resistencia de ese modelo, sufre una Herida automática. Un 6 natural siempre inflige una
      Herida. Los No muertos y los Poseídos son inmunes a este chequeo.
  eligibility:
  - plague-priest
  - pestilens-sorcerer
  - plague-monks
  - monk-initiates
  applies_to:
    band: true
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: trait.contagious
      scope: 'YES'
      binding:
        kind: trait
        id: trait.contagious
        parameters:
          value: true
      clauses:
      - id: contagious-reaction
        scope: 'YES'
      - id: contagious-rotten-body-prerequisite
        scope: 'YES'
- id: band--clan-pestilens-special-skills-ignore-pain
  kind: warband_skill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: skill.ignore-pain
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.ignore-pain
  name: Ignore Pain
  effect: >-
    Requires the Resilient Strength skill. The Hero treats a Stunned result on the Injury chart as
    Knocked Down.
  source:
    manual: lustria
    printed_page: 80
    section: Clan Pestilens Special Skills / Ignore Pain
  name_i18n:
    es: Ignorar el Dolor
  effect_i18n:
    es: >-
      Requiere la habilidad Fuerza resiliente. El Héroe trata un resultado Aturdido de la tabla de
      Heridas como Derribado.
  eligibility:
  - plague-priest
  - pestilens-sorcerer
  - plague-monks
  - monk-initiates
  applies_to:
    band: true
- id: band--clan-pestilens-special-skills-natural-climber
  kind: warband_skill
  name: Natural Climber
  effect: >-
    The Hero does not need to take Initiative tests when climbing walls or other vertical surfaces.
  source:
    manual: lustria
    printed_page: 80
    section: Clan Pestilens Special Skills / Natural Climber
  name_i18n:
    es: Trepanador Natural
  effect_i18n:
    es: >-
      El Héroe no necesita realizar chequeos de Iniciativa al escalar muros u otras superficies
      verticales.
  eligibility:
  - plague-priest
  - pestilens-sorcerer
  - plague-monks
  - monk-initiates
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.lustria-clan-pestilens.band.clan-pestilens-special-skills-natural-climber
      scope: 'NO'
      binding: null
      reason: out-of-scope.magic

- id: rat-ogre--natural-weapons
