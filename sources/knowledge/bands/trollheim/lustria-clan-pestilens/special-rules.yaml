- id: band--clan-pestilens-special-skills-black-hunger
  kind: warband_skill
  name: Black Hunger
  effect: At the beginning of his turn, the Hero may invoke Black Hunger. For that turn he gains +1 Attack
    and adds the result of 1D6 x 0.4" + 1" to his Movement. At the end of the turn he suffers 1D3 Strength
    3 hits with no armour save.
  source:
    manual: lustria
    printed_page: 80
    section: Clan Pestilens Special Skills / Black Hunger
  name_i18n:
    en: Black Hunger
    es: Hambre negra
  effect_i18n:
    en: At the beginning of his turn, the Hero may invoke Black Hunger. For that turn he gains +1 Attack
      and adds the result of 1D6 x 0.4" + 1" to his Movement. At the end of the turn he suffers 1D3 Strength
      3 hits with no armour save.
    es: Al comienzo de su turno, el Héroe puede invocar el Hambre negra. Durante ese turno gana +1 Ataque
      y añade a su Movimiento el resultado de 1D6 x 0,4" + 1". Al final del turno sufre 1D3 impactos de
      Fuerza 3 sin tirada de salvación por armadura.
  eligibility:
  - plague-priest
  - pestilens-sorcerer
  - plague-monks
  - monk-initiates
  applies_to:
    band: true
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: mechanic.black-hunger
      scope: 'YES'
      binding:
        kind: mechanic
        id: mechanic.black-hunger
- id: band--clan-pestilens-special-skills-censer-bearer
  kind: warband_skill
  name: Censer Bearer
  effect: Requires Black Hunger. The Hero gains Frenzy and may use only a Censer as a close-combat weapon.
  source:
    manual: lustria
    printed_page: 80
    section: Clan Pestilens Special Skills / Censer Bearer
  name_i18n:
    en: Censer Bearer
    es: Portador del incensario
  effect_i18n:
    en: Requires Black Hunger. The Hero gains Frenzy and may use only a Censer as a close-combat weapon.
    es: Requiere Hambre negra. El Héroe gana Frenesí y solo puede usar un Incensario como arma de combate
      cuerpo a cuerpo.
  eligibility:
  - plague-priest
  - pestilens-sorcerer
  - plague-monks
  - monk-initiates
  applies_to:
    band: true
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: compiler.censer-bearer-loadout
      scope: 'YES'
      binding:
        kind: compiler
        id: compiler.censer-bearer-loadout
- id: band--clan-pestilens-special-skills-rotten-body
  kind: warband_skill
  name: Rotten Body
  effect: The Hero is immune to poisons and diseases. If taken Out of Action because of a failed test
    while using a Censer, the Hero does not roll on the Serious Injury table after the battle and recovers
    automatically.
  source:
    manual: lustria
    printed_page: 80
    section: Clan Pestilens Special Skills / Rotten Body
  name_i18n:
    en: Rotten Body
    es: Cuerpo podrido
  effect_i18n:
    en: The Hero is immune to poisons and diseases. If taken Out of Action because of a failed test while
      using a Censer, the Hero does not roll on the Serious Injury table after the battle and recovers
      automatically.
    es: El Héroe es inmune a los venenos y las enfermedades. Si sale de Combate por fallar un chequeo
      al usar un Incensario, el Héroe no tira en la tabla de Heridas Graves tras la batalla y se recupera
      automáticamente.
  eligibility:
  - plague-priest
  - pestilens-sorcerer
  - plague-monks
  - monk-initiates
  applies_to:
    band: true
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: trait.poison-immune
      scope: 'YES'
      binding:
        kind: trait
        id: trait.poison-immune
        parameters:
          value: true
    - id: campaign.censer-recovery
      scope: 'NO'
      binding: null
      reason: 'Out of scope: post-battle recovery and Serious Injury.'
- id: band--clan-pestilens-special-skills-contagious
  kind: warband_skill
  name: Contagious
  effect: Requires Rotten Body. A model that takes this Hero Out of Action in close combat must take a
    Toughness test. Roll D6; if the result is higher than that model's Toughness, it suffers one automatic
    Wound. A natural 6 always inflicts a Wound. Undead and Possessed are immune to this test.
  source:
    manual: lustria
    printed_page: 80
    section: Clan Pestilens Special Skills / Contagious
  name_i18n:
    en: Contagious
    es: Contagioso
  effect_i18n:
    en: Requires Rotten Body. A model that takes this Hero Out of Action in close combat must take a Toughness
      test. Roll D6; if the result is higher than that model's Toughness, it suffers one automatic Wound.
      A natural 6 always inflicts a Wound. Undead and Possessed are immune to this test.
    es: Requiere Cuerpo podrido. Un modelo que saque de Combate a este Héroe en combate cuerpo a cuerpo
      debe realizar un chequeo de Resistencia. Tira 1D6; si el resultado es mayor que la Resistencia de
      ese modelo, sufre una Herida automática. Un 6 natural siempre inflige una Herida. Los No muertos
      y los Poseídos son inmunes a este chequeo.
  eligibility:
  - plague-priest
  - pestilens-sorcerer
  - plague-monks
  - monk-initiates
  applies_to:
    band: true
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: trait.contagious
      scope: 'YES'
      binding:
        kind: trait
        id: trait.contagious
        parameters:
          value: true
- id: band--clan-pestilens-special-skills-ignore-pain
  kind: warband_skill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: skill.ignore-pain
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.ignore-pain
  name: Ignore Pain
  effect: Requires the Resilient Strength skill. The Hero treats a Stunned result on the Injury chart
    as Knocked Down.
  source:
    manual: lustria
    printed_page: 80
    section: Clan Pestilens Special Skills / Ignore Pain
  name_i18n:
    en: Ignore Pain
    es: Ignorar el dolor
  effect_i18n:
    en: Requires the Resilient Strength skill. The Hero treats a Stunned result on the Injury chart as
      Knocked Down.
    es: Requiere la habilidad Fuerza resiliente. El Héroe trata un resultado Aturdido de la tabla de Heridas
      como Derribado.
  eligibility:
  - plague-priest
  - pestilens-sorcerer
  - plague-monks
  - monk-initiates
  applies_to:
    band: true
