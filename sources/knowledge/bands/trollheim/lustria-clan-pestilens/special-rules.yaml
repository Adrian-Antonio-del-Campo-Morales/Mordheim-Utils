schema_version: 2
band_id: lustria-clan-pestilens
rules:
- id: band--fog-warpstone-censer-requirement
  name: Fog Warpstone Fragments Require a Censer
  name_i18n:
    es: Los Fragmentos de Piedra Bruja de Niebla Requieren un Incensario
  effect: Fog-enhancing warpstone fragments require a Censer.
  effect_i18n:
    es: >-
      Los fragmentos de piedra bruja que potencian la niebla requieren un Incensario.
  source:
    manual: lustria
    printed_page: 77
    section: Special Equipment / Fog Warpstone Fragments
  applies_to:
    band: true
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: band
    effects:
    - id: profile.equipment-restrictions
      scope: 'YES'
      binding:
        kind: profile
        id: profile.equipment-restrictions
        parameters:
          when_items:
          - fog_warpstone_fragments
          required_kinds:
          - weapon.censer
- id: plague-priest--leader
  name: Leader
  effect: >-
    Any warband model within 6" of the Plague Priest may use his Leadership when taking Leadership
    tests.
  source:
    manual: lustria
    printed_page: 78
    section: Heroes / 1 Plague Priest / Leader
  name_i18n:
    es: Líder
  effect_i18n:
    es: >-
      Cualquier modelo de la banda a 6" del Sacerdote de la peste puede usar su Liderazgo al
      realizar chequeos de Liderazgo.
  applies_to:
    profile_ids:
    - plague-priest
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: mechanic.leader-six
      scope: 'YES'
      binding:
        kind: mechanic
        id: mechanic.leader-six
- id: pestilens-sorcerer--spellcaster
  name: Spellcaster
  effect: >-
    The Pestilens Sorcerer is a spellcaster and begins with one randomly generated spell from Magic
    of the Horned Rat. The spell list and spell effects are intentionally not modelled in this file.
  source:
    manual: lustria
    printed_page: 78
    section: Heroes / 0-1 Pestilens Sorcerer / Spellcaster
  name_i18n:
    es: Lanzador de Hechizos
  effect_i18n:
    es: >-
      El Hechicero de Pestilens es un lanzador de hechizos y comienza con un hechizo generado al
      azar de la Magia del Rata Cuernudo. La lista de hechizos y sus efectos no se modelan
      intencionadamente en este archivo.
  applies_to:
    profile_ids:
    - pestilens-sorcerer
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.lustria-clan-pestilens.pestilens-sorcerer.spellcaster
      scope: 'NO'
      binding: null
      reason: out-of-scope.magic
