schema_version: 2
band_id: lustria-clan-pestilens
rules:
- id: plague-priest--leader
  name: Leader
  effect: >-
    Any warband model within 6" of the Plague Priest may use his Leadership when taking Leadership
    tests.
  source:
    manual: lustria
    printed_page: 78
    section: Heroes / 1 Plague Priest / Leader
  name_i18n:
    es: Líder
  effect_i18n:
    es: >-
      Cualquier modelo de la banda a 6" del Sacerdote de la peste puede usar su Liderazgo al
      realizar chequeos de Liderazgo.
  applies_to:
    profile_ids:
    - plague-priest
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.lustria-clan-pestilens.plague-priest.leader
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: psychology or mounts.
- id: pestilens-sorcerer--spellcaster
  name: Spellcaster
  effect: >-
    The Pestilens Sorcerer is a spellcaster and begins with one randomly generated spell from Magic
    of the Horned Rat. The spell list and spell effects are intentionally not modelled in this file.
  source:
    manual: lustria
    printed_page: 78
    section: Heroes / 0-1 Pestilens Sorcerer / Spellcaster
  name_i18n:
    es: Lanzador de Hechizos
  effect_i18n:
    es: >-
      El Hechicero de Pestilens es un lanzador de hechizos y comienza con un hechizo generado al
      azar de la Magia del Rata Cuernudo. La lista de hechizos y sus efectos no se modelan
      intencionadamente en este archivo.
  applies_to:
    profile_ids:
    - pestilens-sorcerer
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.lustria-clan-pestilens.pestilens-sorcerer.spellcaster
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: campaign, shooting, movement, terrain, deployment, magic, or non-duel context.
