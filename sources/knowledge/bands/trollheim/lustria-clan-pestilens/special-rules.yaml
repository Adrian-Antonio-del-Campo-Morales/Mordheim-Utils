- id: band--clan-pestilens-special-skills-black-hunger
  kind: warband_skill
  name: Black Hunger
  effect: At the beginning of his turn, the Hero may invoke Black Hunger. For that turn he gains +1 Attack and adds the result
    of 1D6 x 0.4" + 1" to his Movement. At the end of the turn he suffers 1D3 Strength 3 hits with no armour save.
  source:
    manual: lustria
    printed_page: 80
    section: Clan Pestilens Special Skills / Black Hunger
  name_i18n:
    en: Black Hunger
    es: null
  effect_i18n:
    en: At the beginning of his turn, the Hero may invoke Black Hunger. For that turn he gains +1 Attack and adds the result
      of 1D6 x 0.4" + 1" to his Movement. At the end of the turn he suffers 1D3 Strength 3 hits with no armour save.
    es: null
  eligibility:
  - plague-priest
  - pestilens-sorcerer
  - plague-monks
  - monk-initiates
  applies_to:
    band: true
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: mechanic.black-hunger
      scope: 'YES'
      binding:
        kind: mechanic
        id: mechanic.black-hunger
