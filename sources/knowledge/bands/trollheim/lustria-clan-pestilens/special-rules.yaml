          - weapons
          - armour
    - id: profile.natural-attacks
      scope: 'YES'
      binding:
        kind: profile
        id: profile.natural-attacks
  name: Natural Weapons
  effect: Rat Ogres fight with jaws, claws and brute force and never use weapons or armour.
  source:
    manual: lustria
    printed_page: 79
    section: 0-1 Rat Ogre
  name_i18n:
    es: Armas Naturales
  effect_i18n:
    es: Los Ogros Rata luchan con mandíbulas, garras y fuerza bruta y nunca usan armas ni armaduras.
  applies_to:
    profile_ids:
    - rat-ogre
