      D6; if the result is higher than that model's Toughness, it suffers one automatic Wound. A natural 6 always inflicts
      a Wound. Undead and Possessed are immune to this test.
    es: null
  eligibility:
  - plague-priest
  - pestilens-sorcerer
  - plague-monks
  - monk-initiates
  applies_to:
    band: true
  runtime:
