    es: El Héroe no necesita realizar chequeos de Iniciativa al escalar muros u otras superficies verticales.
  eligibility:
  - plague-priest
  - pestilens-sorcerer
  - plague-monks
  - monk-initiates
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.lustria-clan-pestilens.band.clan-pestilens-special-skills-natural-climber
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, magic, or non-duel context.'
