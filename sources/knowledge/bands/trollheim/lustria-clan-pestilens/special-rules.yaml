- id: rat-ogre--large-target
  name: Large Target
  effect: >-
    The Rat Ogre may be selected as a shooting target even when it is not the closest eligible
    target, and missile attacks against it gain +1 To Hit.
  source:
    manual: lustria
    printed_page: 79
    section: Henchmen / 0-1 Rat Ogre / Large Target
  name_i18n:
    es: Objetivo Grande
  effect_i18n:
    es: >-
      El Ogro rata puede ser elegido como objetivo de disparo incluso cuando no es el objetivo
      elegible más cercano, y los ataques de misil contra él obtienen +1 por Golpear.
  applies_to:
    profile_ids:
    - rat-ogre
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.lustria-clan-pestilens.rat-ogre.large-target
      scope: 'NO'
      binding: null
      reason: out-of-scope.magic
- id: band--clan-pestilens-special-skills-black-hunger
  kind: warband_skill
  name: Black Hunger
  source:
    manual: lustria
    printed_page: 80
    section: Clan Pestilens Special Skills / Black Hunger
  name_i18n:
    es: Hambre Negra
  eligibility:
  - plague-priest
  - pestilens-sorcerer
  - plague-monks
  - monk-initiates
  applies_to:
    band: true
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: mechanic.black-hunger
      scope: 'YES'
      binding:
        kind: mechanic
        id: mechanic.black-hunger
      clauses:
      - id: attack-and-backlash
        scope: 'YES'
      - id: movement
        scope: 'NO'
  # Not shared: this source prints the metric Movement bonus (1D6 x 0.4" + 1"), not the +D3" of the
  # shared text, and the two are different magnitudes.
  effect: >-
    At the beginning of his turn, the Hero may invoke Black Hunger. For that turn he gains +1 Attack
    and adds the result of 1D6 x 0.4" + 1" to his Movement. At the end of the turn he suffers 1D3
    Strength 3 hits with no armour save.
  effect_i18n:
    es: >-
      Al comienzo de su turno, el Héroe puede invocar el Hambre negra. Durante ese turno gana +1
      Ataque y añade a su Movimiento el resultado de 1D6 x 0,4" + 1". Al final del turno sufre 1D3
      impactos de Fuerza 3 sin tirada de salvación por armadura.
- id: band--clan-pestilens-special-skills-censer-bearer
  kind: warband_skill
