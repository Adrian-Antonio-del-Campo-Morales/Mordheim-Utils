      profile are intentionally not modelled here.
  - item_id: liturgicus_infecticus
    cost: 30+2D6
    notes: Clan Pestilens only; the detailed entry is Rare 8. Internal item mechanics are intentionally not modelled here.
  - item_id: fog_warpstone_fragments
    cost: 100+1D6
    notes: Warband-creation price from the Hero Equipment List on printed page 75. The detailed entry on printed page 77 gives
      100+10D6 gc, Rare 9, and requires a Censer. Internal item mechanics are intentionally not modelled here.
