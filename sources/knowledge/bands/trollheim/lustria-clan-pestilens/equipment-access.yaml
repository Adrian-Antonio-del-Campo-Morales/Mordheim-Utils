      the general price list give 10 gc, Rare 5. Maximum one per warband. Internal item mechanics are intentionally not modelled
      here.
  - item_id: horned_rat_amulet
    cost: 10
    notes: Skaven only. Internal item mechanics are intentionally not modelled here.
  - item_id: rat_familiar_scroll
    cost: 25+1D6
