schema_version: 2
band_id: trollheim-undead
rules:
- id: vampire--leader
  name: Leader
  effect: Any warband model within 6" of the Vampire may use its Leadership instead of its own.
  source:
    manual: trollheim
    printed_page: 88
    section: Heroes / 1 Vampire / Leader
  name_i18n:
    es: Líder
  effect_i18n:
    es: >-
      Cualquier modelo de la banda a 6" del Vampiro puede usar su Liderazgo en lugar del suyo
      propio.
  applies_to:
    profile_ids:
    - vampire
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: mechanic.leader-six
      scope: 'YES'
      binding:
        kind: mechanic
        id: mechanic.leader-six
- id: vampire--fear
  name: Fear
  effect: The Vampire causes Fear.
  source:
    manual: trollheim
    printed_page: 88
    section: Heroes / 1 Vampire / Fear
  name_i18n:
    es: Miedo
  effect_i18n:
    es: El Vampiro causa Miedo.
  applies_to:
    profile_ids:
    - vampire
  runtime:
    grant: profile
    scope: 'YES'
    implemented: 'YES'
    effects:
    - id: mechanic.causes-fear
      scope: 'YES'
      binding:
        kind: mechanic
        id: mechanic.causes-fear
- id: vampire--immune-to-psychology
  name: Immune to Psychology
  source:
    manual: trollheim
    printed_page: 88
    section: Heroes / 1 Vampire / Immune to Psychology
  name_i18n:
    es: Inmune a la Psicología
  applies_to:
    profile_ids:
    - vampire
  runtime:
    grant: profile
    scope: 'YES'
    implemented: 'YES'
    effects:
    - id: mechanic.psychology-immunity
      scope: 'YES'
      binding:
        kind: mechanic
        id: mechanic.psychology-immunity
  rule_ref: shared-rule.immune-to-psychology
- id: vampire--immune-to-poison
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: trait.poison-immune
      scope: 'YES'
      binding:
        kind: trait
        id: trait.poison-immune
        parameters:
          value: true
  name: Immune to Poison
  effect: The Vampire is immune to poison.
  source:
    manual: trollheim
    printed_page: 88
    section: Heroes / 1 Vampire / Immune to Poison
  name_i18n:
    es: Inmune al Veneno
  effect_i18n:
    es: El Vampiro es inmune al veneno.
  applies_to:
    profile_ids:
    - vampire
- id: vampire--no-pain
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: skill.ignore-pain
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.ignore-pain
  name: No Pain
  source:
    manual: trollheim
    printed_page: 88
    section: Heroes / 1 Vampire / No Pain
  name_i18n:
    es: Sin Dolor
  applies_to:
    profile_ids:
    - vampire
  rule_ref: shared-rule.no-pain
- id: necromancer--spellcaster
  name: Spellcaster
  effect: >-
    The Necromancer is a spellcaster and may use Necromantic Magic. The spell list and spell effects
    are intentionally not modelled in this file.
  source:
    manual: trollheim
    printed_page: 88
    section: Heroes / 0-1 Necromancer / Spellcaster
  name_i18n:
    es: Lanzador de Hechizos
  effect_i18n:
    es: >-
      El Nigromante es un lanzador de hechizos y puede usar la Magia nigromántica. La lista de
      hechizos y sus efectos no se modelan intencionadamente en este archivo.
  applies_to:
    profile_ids:
    - necromancer
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.trollheim-undead.necromancer.spellcaster
      scope: 'NO'
      binding: null
      reason: out-of-scope.magic
