- id: dire-wolves--equipment-restrictions
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: profile.equipment-restrictions
      scope: 'YES'
      binding:
        kind: profile
        id: profile.equipment-restrictions
        parameters:
          forbids:
          - weapons
          - armour
  name: Equipment Restrictions
  effect: >-
    Dire Wolves use no weapons or armour; their attacks are natural.
  source:
    manual: trollheim
    printed_page: 89
    section: "0-5 Dire Wolves"
  name_i18n:
    es: Restricciones de Equipo
