schema_version: 2
band_id: trollheim-undead
rules:
- id: vampire--leader
  name: Leader
  effect: Any warband model within 6" of the Vampire may use its Leadership instead of its own.
  source:
    manual: trollheim
    printed_page: 88
    section: Heroes / 1 Vampire / Leader
  name_i18n:
    en: Leader
    es: Líder
  effect_i18n:
    en: Any warband model within 6" of the Vampire may use its Leadership instead of its own.
    es: Cualquier modelo de la banda a 6" del Vampiro puede usar su Liderazgo en lugar del suyo propio.
  applies_to:
    profile_ids:
    - vampire
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.trollheim-undead.vampire.leader
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology or mounts.'
- id: vampire--fear
  name: Fear
  effect: The Vampire causes Fear.
  source:
    manual: trollheim
    printed_page: 88
    section: Heroes / 1 Vampire / Fear
  name_i18n:
    en: Fear
    es: Miedo
  effect_i18n:
    en: The Vampire causes Fear.
    es: El Vampiro causa Miedo.
  applies_to:
    profile_ids:
    - vampire
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.trollheim-undead.vampire.fear
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology or mounts.'
- id: vampire--immune-to-psychology
  name: Immune to Psychology
  effect: The Vampire is immune to Psychology and never leaves close combat because of Psychology.
  source:
    manual: trollheim
    printed_page: 88
    section: Heroes / 1 Vampire / Immune to Psychology
  name_i18n:
    en: Immune to Psychology
    es: Inmune a la Psicología
  effect_i18n:
    en: The Vampire is immune to Psychology and never leaves close combat because of Psychology.
    es: El Vampiro es inmune a la Psicología y nunca abandona el combate cuerpo a cuerpo a causa de la
      Psicología.
  applies_to:
    profile_ids:
    - vampire
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.trollheim-undead.vampire.immune-to-psychology
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology or mounts.'
- id: vampire--immune-to-poison
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: trait.poison-immune
      scope: 'YES'
      binding:
        kind: trait
        id: trait.poison-immune
        parameters:
          value: true
  name: Immune to Poison
  effect: The Vampire is immune to poison.
  source:
    manual: trollheim
    printed_page: 88
    section: Heroes / 1 Vampire / Immune to Poison
  name_i18n:
    en: Immune to Poison
    es: Inmune al veneno
  effect_i18n:
    en: The Vampire is immune to poison.
    es: El Vampiro es inmune al veneno.
  applies_to:
    profile_ids:
    - vampire
- id: vampire--no-pain
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: skill.ignore-pain
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.ignore-pain
  name: No Pain
  effect: The Vampire treats a Stunned result on the Injury chart as Knocked Down.
  source:
    manual: trollheim
    printed_page: 88
    section: Heroes / 1 Vampire / No Pain
  name_i18n:
    en: No Pain
    es: Sin dolor
  effect_i18n:
    en: The Vampire treats a Stunned result on the Injury chart as Knocked Down.
    es: El Vampiro trata un resultado Aturdido de la tabla de Heridas como Derribado.
  applies_to:
    profile_ids:
    - vampire
- id: necromancer--spellcaster
  name: Spellcaster
  effect: The Necromancer is a spellcaster and may use Necromantic Magic. The spell list and spell effects
    are intentionally not modelled in this file.
  source:
    manual: trollheim
    printed_page: 88
    section: Heroes / 0-1 Necromancer / Spellcaster
  name_i18n:
    en: Spellcaster
    es: Lanzador de hechizos
  effect_i18n:
    en: The Necromancer is a spellcaster and may use Necromantic Magic. The spell list and spell effects
      are intentionally not modelled in this file.
    es: El Nigromante es un lanzador de hechizos y puede usar la Magia nigromántica. La lista de hechizos
      y sus efectos no se modelan intencionadamente en este archivo.
  applies_to:
    profile_ids:
    - necromancer
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.trollheim-undead.necromancer.spellcaster
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, magic, or non-duel context.'
