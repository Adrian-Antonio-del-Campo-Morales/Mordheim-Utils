schema_version: 2
band_id: khemri-mages
equipment_lists:
- id: mage-equipment-list
  name: Mage Equipment List
  items:
  - item_id: dagger
    cost: 2
    notes: First dagger is free.
    notes_i18n:
      es: La primera daga es gratis.
  - item_id: staff
    cost: 3
  - item_id: sword
    cost: 10
  - item_id: sling
    applies_to:
      profile_ids:
      - pupil
    cost: 2
    notes: Pupils only.
    notes_i18n:
      es: Solo aprendices.
  - item_id: pistol
    cost: 15
  - item_id: duelling_pistol
    cost: 25
  - item_id: mage_robes
    cost: 10
    notes: Special equipment. After warband creation the detailed entry is Rare 6 at 10 gc. Internal item mechanics are intentionally not modelled here.
    notes_i18n:
      es: Equipo especial. Tras crear la banda, la entrada detallada es Raro 6 a 10 gc. La mecánica interna de este objeto no se modela aquí deliberadamente.
  - item_id: familiar
    cost: 20
    notes: At warband creation, only the Archmage may buy a Familiar. Afterwards, a spellcaster may attempt to acquire one through Trading; the detailed entry is Rare 8 and costs 20+1D6 gc. Prayer users
      may not use a Familiar. Internal item mechanics are intentionally not modelled here.
    notes_i18n:
      es: Al crear la banda, solo el Archimago puede comprar un Familiar. Después, un lanzador de conjuros puede intentar adquirir uno mediante Comercio; la entrada detallada es Raro 8 y cuesta 20+1D6 gc.
        Quienes usan plegarias no pueden usar un Familiar. La mecánica interna de este objeto no se modela aquí deliberadamente.
  - item_id: dispelling_scroll
    cost: 25
    notes: Special equipment; internal item mechanics are intentionally not modelled here.
    notes_i18n:
      es: Equipo especial; la mecánica interna de este objeto no se modela aquí deliberadamente.
  - item_id: flying_carpet
    cost: 60
    notes: Special equipment; internal item mechanics are intentionally not modelled here.
    notes_i18n:
      es: Equipo especial; la mecánica interna de este objeto no se modela aquí deliberadamente.
  - item_id: icon_of_manann
    cost: 30
    notes: May be bought only when the warband is created. The later Trading entry is Rare 8 and costs 20+3D6 gc. Internal item mechanics are intentionally not modelled here.
    notes_i18n:
      es: Solo puede comprarse al crear la banda. La entrada posterior de Comercio es Raro 8 y cuesta 20+3D6 gc. La mecánica interna de este objeto no se modela aquí deliberadamente.
  source:
    manual: khemri
    printed_page: 59
    section: Mage Equipment List
  name_i18n:
    es: Lista de Equipo de los Magos
