    manual: khemri
    printed_page: 63
    section: Henchmen / Pupils / Minor Trick
  name_i18n:
    en: Minor Trick
    es: Truco menor
  effect_i18n:
    en: Minor Trick is the only magic a Pupil may use before becoming a Hero. Its spell mechanics are
      intentionally not modelled in this file.
    es: Truco menor es la única magia que un Aprendiz puede usar antes de convertirse en Héroe. Sus mecánicas
