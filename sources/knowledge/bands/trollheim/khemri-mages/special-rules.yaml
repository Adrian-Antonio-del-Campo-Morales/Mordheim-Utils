- id: band--mage-special-skills-dispel-magic
  kind: warband_skill
  name: Dispel Magic
  effect: Whenever an opponent successfully casts a spell, this Hero may attempt to dispel it by rolling 2D6 and exceeding
    the opponent's successful casting result. For example, a casting result of 10 requires an 11 or 12 to dispel.
  source:
    manual: khemri
    printed_page: 60
    section: Mage Special Skills / Dispel Magic
  name_i18n:
    en: Dispel Magic
    es: null
  effect_i18n:
    en: Whenever an opponent successfully casts a spell, this Hero may attempt to dispel it by rolling 2D6 and exceeding the
      opponent's successful casting result. For example, a casting result of 10 requires an 11 or 12 to dispel.
    es: null
  eligibility:
  - archmage
  - mage
  - witch
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
