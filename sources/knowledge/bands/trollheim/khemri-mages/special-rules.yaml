- id: band--mage-special-skills-mechanic
  kind: warband_skill
  name: Mechanic
  effect: The Hero may improve Mechanical Beasts by paying 5 gc to increase either WS by +1 or Movement by +1". The maximum
    improvement is +2 WS or +2" Movement respectively, and the whole Mechanical Beast group must be upgraded together.
  source:
    manual: khemri
