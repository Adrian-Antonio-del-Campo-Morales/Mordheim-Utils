- id: band--pupil-limit
  name: Pupil Limit
  effect: The warband may include no more than three Pupils per Mage and no more than six Pupils in total.
    If a Mage dies, it must be replaced as soon as possible. A Pupil that has advanced to Hero counts
    as a Mage for this rule.
  source:
    manual: khemri
    printed_page: 63
    section: Henchmen / Pupils / Apprentices
  name_i18n:
    en: Pupil Limit
    es: Límite de aprendices
  effect_i18n:
    en: The warband may include no more than three Pupils per Mage and no more than six Pupils in total.
      If a Mage dies, it must be replaced as soon as possible. A Pupil that has advanced to Hero counts
      as a Mage for this rule.
    es: La banda no puede incluir más de tres Aprendices por Mago ni más de seis Aprendices en total.
      Si un Mago muere, debe reemplazarse lo antes posible. Un Aprendiz que haya ascendido a Héroe cuenta
      como Mago para esta regla.
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.khemri-mages.band.pupil-limit
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, magic, or non-duel context.'
- id: band--mage-special-skills-dispel-magic
  kind: warband_skill
  name: Dispel Magic
  effect: Whenever an opponent successfully casts a spell, this Hero may attempt to dispel it by rolling
    2D6 and exceeding the opponent's successful casting result. For example, a casting result of 10 requires
    an 11 or 12 to dispel.
  source:
    manual: khemri
    printed_page: 60
    section: Mage Special Skills / Dispel Magic
  name_i18n:
    en: Dispel Magic
    es: Dispersar magia
  effect_i18n:
    en: Whenever an opponent successfully casts a spell, this Hero may attempt to dispel it by rolling
      2D6 and exceeding the opponent's successful casting result. For example, a casting result of 10
      requires an 11 or 12 to dispel.
    es: Siempre que un oponente lance con éxito un hechizo, este Héroe puede intentar dispersarlo tirando
      2D6 y superando el resultado exitoso de lanzamiento del oponente. Por ejemplo, un resultado de lanzamiento
      de 10 requiere un 11 o 12 para dispersar.
  eligibility:
  - archmage
  - mage
  - witch
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.khemri-mages.band.mage-special-skills-dispel-magic
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, magic, or non-duel context.'
- id: band--mage-special-skills-store-spell
  kind: warband_skill
  name: Store Spell
  effect: Requires a Staff. Before the battle, the Hero may store one chosen spell in the Staff and decide
    when to use it during the game. Resolve the stored spell with the source's additional +3 casting difficulty;
    if the casting roll is a double, the stored spell is lost.
  source:
    manual: khemri
    printed_page: 60
    section: Mage Special Skills / Store Spell
  name_i18n:
    en: Store Spell
    es: Almacenar hechizo
  effect_i18n:
    en: Requires a Staff. Before the battle, the Hero may store one chosen spell in the Staff and decide
      when to use it during the game. Resolve the stored spell with the source's additional +3 casting
      difficulty; if the casting roll is a double, the stored spell is lost.
    es: Requiere un Bastón. Antes de la batalla, el Héroe puede almacenar un hechizo elegido en el Bastón
      y decidir cuándo usarlo durante la partida. Resuelve el hechizo almacenado con la dificultad adicional
      de lanzamiento de +3 de la fuente; si la tirada de lanzamiento es un doble, el hechizo almacenado
      se pierde.
  eligibility:
  - archmage
  - mage
  - witch
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.khemri-mages.band.mage-special-skills-store-spell
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, magic, or non-duel context.'
- id: band--mage-special-skills-mechanic
  kind: warband_skill
  name: Mechanic
  effect: The Hero may improve Mechanical Beasts by paying 5 gc to increase either WS by +1 or Movement
    by +1". The maximum improvement is +2 WS or +2" Movement respectively, and the whole Mechanical Beast
    group must be upgraded together.
  source:
    manual: khemri
    printed_page: 60
    section: Mage Special Skills / Mechanic
  name_i18n:
    en: Mechanic
    es: Mecánico
  effect_i18n:
    en: The Hero may improve Mechanical Beasts by paying 5 gc to increase either WS by +1 or Movement
      by +1". The maximum improvement is +2 WS or +2" Movement respectively, and the whole Mechanical
      Beast group must be upgraded together.
    es: El Héroe puede mejorar las Bestias Mecánicas pagando 5 coronas para aumentar o bien +1 la HA o
      bien +1" el Movimiento. La mejora máxima es +2 HA o +2" de Movimiento respectivamente, y todo el
      grupo de Bestias Mecánicas debe mejorarse junto.
  eligibility:
  - archmage
  - mage
  - witch
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.khemri-mages.band.mage-special-skills-mechanic
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, magic, or non-duel context.'
