- id: pupil--experience
  name: Experience
  effect: When a Pupil becomes a Hero, choose one Elemental Magic lore or Lesser Magic and generate one
    random spell. Every later spell learned by that Hero must come from the same chosen lore.
  source:
    manual: khemri
    printed_page: 63
    section: Henchmen / Pupils / Experience
  name_i18n:
    en: Experience
    es: Experiencia
  effect_i18n:
    en: When a Pupil becomes a Hero, choose one Elemental Magic lore or Lesser Magic and generate one
      random spell. Every later spell learned by that Hero must come from the same chosen lore.
    es: Cuando un Aprendiz se convierte en Héroe, elige una tradición de Magia Elemental o Magia Menor
      y genera un hechizo aleatorio. Todo hechizo posterior que aprenda ese Héroe debe provenir de la
      misma tradición elegida.
  applies_to:
    profile_ids:
    - pupil
  runtime:
    scope: 'NO'
