schema_version: 2
band_id: khemri-mages
rules:
- id: archmage--leader
  name: Leader
  effect: Any warband model within 6" of the Archmage may use his Leadership instead of its own.
  source:
    manual: khemri
    printed_page: 62
    section: Heroes / 1 Archmage / Leader
  name_i18n:
    en: Leader
    es: Líder
  effect_i18n:
    en: Any warband model within 6" of the Archmage may use his Leadership instead of its own.
    es: Cualquier modelo de la banda a 6" del Arquimago puede usar su Liderazgo en lugar del suyo propio.
  applies_to:
    profile_ids:
    - archmage
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.khemri-mages.archmage.leader
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology or mounts.'
- id: archmage--spellcaster
  name: Spellcaster
  effect: The Archmage is a spellcaster and begins with two randomly generated spells. Choose two different
    Elemental Magic lores and generate one spell from each. Spell lists and spell effects are intentionally
    not modelled in this file.
  source:
    manual: khemri
    printed_page: 62
    section: Heroes / 1 Archmage / Spellcaster
  name_i18n:
    en: Spellcaster
    es: Lanzador de hechizos
  effect_i18n:
    en: The Archmage is a spellcaster and begins with two randomly generated spells. Choose two different
      Elemental Magic lores and generate one spell from each. Spell lists and spell effects are intentionally
      not modelled in this file.
    es: El Arquimago es un lanzador de hechizos y comienza con dos hechizos generados aleatoriamente.
      Elige dos tradiciones diferentes de Magia Elemental y genera un hechizo de cada una. Las listas
      de hechizos y los efectos de los hechizos no están modelados intencionadamente en este archivo.
  applies_to:
    profile_ids:
    - archmage
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.khemri-mages.archmage.spellcaster
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, magic, or non-duel context.'
- id: mage--spellcaster
  name: Spellcaster
  effect: When recruited, a Mage chooses one Elemental Magic lore and generates one random spell from
    it. Every later spell learned by that Mage must come from the same chosen lore. Spell lists and spell
    effects are intentionally not modelled in this file.
  source:
    manual: khemri
    printed_page: 62
    section: Heroes / 0-2 Mages / Spellcaster
  name_i18n:
    en: Spellcaster
    es: Lanzador de hechizos
  effect_i18n:
    en: When recruited, a Mage chooses one Elemental Magic lore and generates one random spell from it.
      Every later spell learned by that Mage must come from the same chosen lore. Spell lists and spell
      effects are intentionally not modelled in this file.
    es: Al ser reclutado, un Mago elige una tradición de Magia Elemental y genera un hechizo aleatorio
      de ella. Todo hechizo posterior que aprenda ese Mago debe provenir de la misma tradición elegida.
      Las listas de hechizos y los efectos de los hechizos no están modelados intencionadamente en este
      archivo.
  applies_to:
    profile_ids:
    - mage
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.khemri-mages.mage.spellcaster
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, magic, or non-duel context.'
