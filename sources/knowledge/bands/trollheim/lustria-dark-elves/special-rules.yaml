- id: cold-ones--beastmaster-dependency
  name: Beastmaster Dependency
  effect: If the Beastmaster is killed, the Cold Ones immediately escape and are removed from the warband roster. If the Beastmaster
    cannot participate in a battle for any reason, the Cold Ones may not participate either.
  source:
    manual: lustria
    printed_page: 64
    section: Henchmen / 0-2 Cold Ones / Beastmaster
  name_i18n:
    en: Beastmaster Dependency
    es: null
  effect_i18n:
