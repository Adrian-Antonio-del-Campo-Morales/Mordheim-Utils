- id: cold-ones--stupidity
  name: Stupidity
  effect: A Cold One may use the Beastmaster's own Leadership if it is within 6" of him. It may never use the warband leader's
    Leadership, directly or indirectly; if the Beastmaster is himself within the leader's 6" Leadership range, the Cold One
    may not benefit from that leader-derived value.
  source:
    manual: lustria
    printed_page: 64
    section: Henchmen / 0-2 Cold Ones / Stupidity
  name_i18n:
    en: Stupidity
    es: null
  effect_i18n:
    en: A Cold One may use the Beastmaster's own Leadership if it is within 6" of him. It may never use the warband leader's
      Leadership, directly or indirectly; if the Beastmaster is himself within the leader's 6" Leadership range, the Cold
      One may not benefit from that leader-derived value.
    es: null
