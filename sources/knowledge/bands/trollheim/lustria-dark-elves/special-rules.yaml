      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.elven-agility
  name: Elven Agility
  effect: The Hero has a 6+ special save against close-combat and missile attacks. If the Hero also has Dodge or Step Aside,
    the relevant save improves to 4+ and Elven Agility no longer applies to that attack type.
  source:
    manual: lustria
    printed_page: 65
