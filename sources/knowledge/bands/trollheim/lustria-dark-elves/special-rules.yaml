    section: Heroes / 1 Dark Prince / Leader
  name_i18n:
    en: Leader
    es: null
  effect_i18n:
    en: Any warband model within 6" of the Dark Prince may use his Leadership when taking Leadership tests.
    es: null
  applies_to:
    profile_ids:
    - dark-prince
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
