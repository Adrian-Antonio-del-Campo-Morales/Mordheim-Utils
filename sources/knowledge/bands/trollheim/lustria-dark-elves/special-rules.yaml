- id: band--dark-elf-special-skills-fury-of-khaine
  kind: warband_skill
  name: Fury of Khaine
  effect: If the Hero takes all current close-combat opponents Out of Action, the Hero may move up to 4". If this move brings
    the Hero into contact with another enemy, a new combat begins; that combat is resolved in the following turn and the move
    counts as a charge.
  source:
    manual: lustria
    printed_page: 65
    section: Dark Elf Special Skills / Fury of Khaine
  name_i18n:
    en: Fury of Khaine
    es: null
  effect_i18n:
