- id: band--dark-elf-special-skills-strong-constitution
  kind: warband_skill
  name: Strong Constitution
  effect: The Hero gains access to Strength skills. A Dark Elf Sorceress may never take this skill, and no more than two warriors
    in the warband may have it at the same time.
  source:
    manual: lustria
    printed_page: 65
    section: Dark Elf Special Skills / Strong Constitution
  name_i18n:
    en: Strong Constitution
    es: null
  effect_i18n:
    en: The Hero gains access to Strength skills. A Dark Elf Sorceress may never take this skill, and no more than two warriors
      in the warband may have it at the same time.
    es: null
  eligibility:
  - dark-prince
  - darkblades
  - beastmaster
  applies_to:
    band: true
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: profile.skill-access
      scope: 'YES'
      binding:
        kind: profile
        id: profile.skill-access
        parameters:
