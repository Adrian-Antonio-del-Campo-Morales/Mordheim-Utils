      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, magic, or non-duel context.'
- id: swabbies--rabble
  name: Rabble
  effect: Members of a Swabbie group do not need identical equipment. Each Swabbie may be equipped differently,
    but only with items from the Swabbie Equipment List. Swabbies may never use magic or cast spells.
  source:
    manual: lustria
    printed_page: 94
    section: Henchmen / 0-5 Swabbies / Rabble
  name_i18n:
    en: Rabble
    es: Chusma
  effect_i18n:
    en: Members of a Swabbie group do not need identical equipment. Each Swabbie may be equipped differently,
      but only with items from the Swabbie Equipment List. Swabbies may never use magic or cast spells.
    es: Los miembros de un grupo de Fregones no necesitan equipamiento idéntico. Cada Fregón puede ir
      equipado de forma diferente, pero solo con objetos de la Lista de equipo de Fregones. Los Fregones
      nunca pueden usar magia ni lanzar hechizos.
  applies_to:
    profile_ids:
    - swabbies
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: compiler.swabbie-rabble-loadout
      scope: 'YES'
      binding:
        kind: compiler
        id: compiler.swabbie-rabble-loadout
- id: swabbies--curse-they-have-escaped
  name: Curse Them, They've Escaped!
  effect: If the Pirate warband Routs, every Swabbie that had already left the table in an earlier turn
    because of the scenario or because it was taken Out of Action escapes permanently and is removed from
    the roster as though dead.
  source:
    manual: lustria
    printed_page: 94
    section: Henchmen / 0-5 Swabbies / Curse Them, They've Escaped!
  name_i18n:
    en: Curse Them, They've Escaped!
    es: Maldición, ¡se han escapado!
  effect_i18n:
    en: If the Pirate warband Routs, every Swabbie that had already left the table in an earlier turn
      because of the scenario or because it was taken Out of Action escapes permanently and is removed
      from the roster as though dead.
    es: Si la banda Pirata se Retira, cada Fregón que ya hubiera abandonado la mesa en un turno anterior
      por causa del escenario o porque salió de Combate escapa permanentemente y se retira de la lista
      como si hubiera muerto.
  applies_to:
    profile_ids:
    - swabbies
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.lustria-pirates.swabbies.curse-they-have-escaped
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, magic, or non-duel context.'
- id: swabbies--do-not-worry-about-them
  name: Don't Worry About Them
  effect: Swabbies that are fleeing or Out of Action are ignored when determining whether the warband
    must take a Rout test.
  source:
    manual: lustria
    printed_page: 94
    section: Henchmen / 0-5 Swabbies / Don't Worry About Them
  name_i18n:
    en: Don't Worry About Them
    es: No te preocupes por ellos
  effect_i18n:
    en: Swabbies that are fleeing or Out of Action are ignored when determining whether the warband must
      take a Rout test.
    es: Los Fregones que estén huyendo o Fuera de Combate se ignoran al determinar si la banda debe realizar
      un chequeo de Retirada.
  applies_to:
    profile_ids:
    - swabbies
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.lustria-pirates.swabbies.do-not-worry-about-them
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology or mounts.'
- id: band--swabbie-limit
  name: Swabbie Limit
  effect: The warband may never include more Swabbies than Crew models.
  source:
    manual: lustria
    printed_page: 82
    section: Choice of Warriors / Swabbies
  name_i18n:
    en: Swabbie Limit
    es: Límite de Fregones
  effect_i18n:
    en: The warband may never include more Swabbies than Crew models.
    es: La banda nunca puede incluir más Fregones que modelos de Tripulación.
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.lustria-pirates.band.swabbie-limit
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, magic, or non-duel context.'
- id: band--kidnapped
  name: Kidnapped!
  effect: 'If an enemy Human Hero suffers the Captured result on the Serious Injury table, the Pirates
    may attempt to press the captive into service instead of exchanging, ransoming or selling the Hero.
    Both players roll 2D6 and add the Pirate Captain''s Leadership or the captive Hero''s Leadership;
    the player who won the battle adds +1. If the Pirates score higher, the captive joins as the first
    member of a new Crew group or joins an existing Crew group of four or fewer models. Joining an experienced
    group costs no extra recruitment gold; the captive''s old equipment is sold to buy legal Crew equipment,
    and the model uses the characteristics and advances of a new Crew model or of the existing group it
    joins. If the opposing player scores higher, the captive is forced to become a Swabbie: all old equipment
    is stripped and redistributed, but the captive retains its original characteristics and skills and
    may thereafter use only the Swabbie Equipment List. Human Henchmen that were taken Out of Action and
    permanently lose contact with their original warband may be captured on a 4+; if the Pirates won the
    battle, resolve the same opposed roll, so the Pirates receive the winner''s +1. Hired Swords and special
    characters may be kidnapped but can never be recruited.'
  source:
    manual: lustria
    printed_page: 84
    section: Pirate Special Rules / Kidnapped!
  name_i18n:
    en: Kidnapped!
    es: ¡Secuestrado!
  effect_i18n:
    en: 'If an enemy Human Hero suffers the Captured result on the Serious Injury table, the Pirates may
      attempt to press the captive into service instead of exchanging, ransoming or selling the Hero.
      Both players roll 2D6 and add the Pirate Captain''s Leadership or the captive Hero''s Leadership;
      the player who won the battle adds +1. If the Pirates score higher, the captive joins as the first
      member of a new Crew group or joins an existing Crew group of four or fewer models. Joining an experienced
      group costs no extra recruitment gold; the captive''s old equipment is sold to buy legal Crew equipment,
      and the model uses the characteristics and advances of a new Crew model or of the existing group
      it joins. If the opposing player scores higher, the captive is forced to become a Swabbie: all old
      equipment is stripped and redistributed, but the captive retains its original characteristics and
      skills and may thereafter use only the Swabbie Equipment List. Human Henchmen that were taken Out
      of Action and permanently lose contact with their original warband may be captured on a 4+; if the
      Pirates won the battle, resolve the same opposed roll, so the Pirates receive the winner''s +1.
      Hired Swords and special characters may be kidnapped but can never be recruited.'
    es: Si un Héroe humano enemigo sufre el resultado Capturado en la tabla de Heridas Graves, los Piratas
      pueden intentar forzar al cautivo a servirles en lugar de intercambiarlo, rescatarlo o venderlo.
      Ambos jugadores tiran 2D6 y suman el Liderazgo del Capitán pirata o el del Héroe cautivo; el jugador
      con el total más alto decide el destino del cautivo.
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.lustria-pirates.band.kidnapped
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, magic, or non-duel context.'
- id: band--stragglers-and-prisoners
  name: Stragglers and Prisoners
  effect: When Exploration produces a Straggler, the Pirate Captain may take a Leadership test; if passed,
    the Straggler joins as a Swabbie. When Exploration produces Prisoners, roll 1D3 to determine how many
    are rescued. For each rescued Prisoner, the Captain takes a Leadership test. On a success the Prisoner
    joins the Crew for free, creating a new Crew group or joining an existing group of four or fewer models;
    a new group starts with the normal Crew profile and 0 Experience, while a model joining an experienced
    group adopts that group's characteristics and advances without an additional recruitment cost. The
    warband must still buy legal equipment for the new Crew member. If the Captain fails the test, or
    if the warband cannot afford the required Crew equipment, the Prisoner joins as a Swabbie.
  source:
    manual: lustria
    printed_page: 85
    section: Pirate Special Rules / Stragglers and Prisoners
  name_i18n:
    en: Stragglers and Prisoners
    es: Rezagados y prisioneros
  effect_i18n:
    en: When Exploration produces a Straggler, the Pirate Captain may take a Leadership test; if passed,
      the Straggler joins as a Swabbie. When Exploration produces Prisoners, roll 1D3 to determine how
      many are rescued. For each rescued Prisoner, the Captain takes a Leadership test. On a success the
      Prisoner joins the Crew for free, creating a new Crew group or joining an existing group of four
      or fewer models; a new group starts with the normal Crew profile and 0 Experience, while a model
      joining an experienced group adopts that group's characteristics and advances without an additional
      recruitment cost. The warband must still buy legal equipment for the new Crew member. If the Captain
      fails the test, or if the warband cannot afford the required Crew equipment, the Prisoner joins
      as a Swabbie.
    es: Cuando la Exploración produce un Rezagado, el Capitán pirata puede realizar un chequeo de Liderazgo;
      si lo supera, el Rezagado se une como Fregón. Cuando la Exploración produce Prisioneros, tira 1D3
      para determinar cuántos se rescatan. Por cada Prisionero rescatado, el Capitán realiza un chequeo
      de Liderazgo. Si tiene éxito, el Prisionero se une a la banda como Fregón.
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.lustria-pirates.band.stragglers-and-prisoners
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, magic, or non-duel context.'
- id: band--hired-swords
  name: Hired Swords
  effect: Unless stated otherwise, the Pirates may hire the same Hired Swords and access the same equipment
    as a Human Mercenary warband, following the same rules. If the warband includes Dwarfs and Elves,
    it must pay an additional 20 gc in upkeep.
  source:
    manual: lustria
    printed_page: 85
    section: Pirate Special Rules / Hired Swords
  name_i18n:
    en: Hired Swords
    es: Espadas contratadas
  effect_i18n:
    en: Unless stated otherwise, the Pirates may hire the same Hired Swords and access the same equipment
      as a Human Mercenary warband, following the same rules. If the warband includes Dwarfs and Elves,
      it must pay an additional 20 gc in upkeep.
    es: Salvo indicación contraria, los Piratas pueden contratar las mismas Espadas contratadas y acceder
      al mismo equipo que una banda Mercenaria humana, siguiendo las mismas reglas. Si la banda incluye
      enanos y elfos, debe pagar 20 coronas adicionales de manutención.
  applies_to:
    band: true
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: band
    effects:
    - id: compiler.pirate-human-mercenary-equipment-access
      scope: 'YES'
      binding:
        kind: compiler
        id: compiler.pirate-human-mercenary-equipment-access
- id: band--one-off-games
  name: One-Off Games
  effect: In games that are not part of a campaign, the Pirate warband begins with two free Swabbies.
  source:
    manual: lustria
    printed_page: 85
    section: Pirate Special Rules / One-Off Games
  name_i18n:
    en: One-Off Games
    es: Partidas sueltas
  effect_i18n:
    en: In games that are not part of a campaign, the Pirate warband begins with two free Swabbies.
    es: En partidas que no formen parte de una campaña, la banda Pirata comienza con dos Fregones gratuitos.
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.lustria-pirates.band.one-off-games
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, magic, or non-duel context.'
- id: band--succession
  name: Succession
  effect: If the Pirate Captain dies, one of the Ship's Mates becomes the new Captain and assumes leadership
    in the same way that a Mercenary Champion would take command.
  source:
    manual: lustria
    printed_page: 85
    section: Pirate Special Rules / Succession
  name_i18n:
    en: Succession
    es: Sucesión
  effect_i18n:
    en: If the Pirate Captain dies, one of the Ship's Mates becomes the new Captain and assumes leadership
      in the same way that a Mercenary Champion would take command.
    es: Si el Capitán pirata muere, uno de los Contramaestres se convierte en el nuevo Capitán y asume
      el liderazgo de la misma forma en que lo haría un Campeón mercenario.
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.lustria-pirates.band.succession
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, magic, or non-duel context.'
- id: band--pirate-special-skills-sea-shanty-singer
  kind: warband_skill
  name: Sea Shanty Singer
  effect: At the start of the Combat phase, choose one enemy model in base contact with the Hero. That
    model must pass a Leadership test or lose 1 Attack for that turn. Models immune to Psychology are
    unaffected.
  source:
    manual: lustria
    printed_page: 91
    section: Pirate Special Skills / Sea Shanty Singer
  name_i18n:
    en: Sea Shanty Singer
    es: Cantante de salomas
  effect_i18n:
    en: At the start of the Combat phase, choose one enemy model in base contact with the Hero. That model
      must pass a Leadership test or lose 1 Attack for that turn. Models immune to Psychology are unaffected.
    es: Al comienzo de la fase de Combate, elige un modelo enemigo en contacto de base con el Héroe. Ese
      modelo debe superar un chequeo de Liderazgo o perder 1 Ataque ese turno. Los modelos inmunes a la
      Psicología no se ven afectados.
  eligibility:
  - pirate-captain
  - ships-mates
  - cabin-boys
  applies_to:
    band: true
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.lustria-pirates.band.pirate-special-skills-sea-shanty-singer
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology or mounts.'
- id: band--pirate-special-skills-sea-legs
  kind: warband_skill
  name: Sea Legs
  effect: If the Hero falls, each of the 1D3 resulting hits may be ignored on a 4+ on D6, rolling separately
    for each hit. If the Hero is Knocked Down or Stunned within 1" of a precipice, the Hero may re-roll
    the Initiative test made to determine whether it falls.
  source:
    manual: lustria
    printed_page: 91
    section: Pirate Special Skills / Sea Legs
  name_i18n:
    en: Sea Legs
    es: Patas de mar
  effect_i18n:
    en: If the Hero falls, each of the 1D3 resulting hits may be ignored on a 4+ on D6, rolling separately
      for each hit. If the Hero is Knocked Down or Stunned within 1" of a precipice, the Hero may re-roll
      the Initiative test made to determine whether it falls.
    es: Si el Héroe cae, cada uno de los 1D3 impactos resultantes puede ignorarse con un 4+ en 1D6, tirando
      por separado cada impacto. Si el Héroe queda Derribado o Aturdido a 1" de un precipicio, puede repetir
      el chequeo de Iniciativa realizado para determinar si cae.
  eligibility:
  - pirate-captain
  - ships-mates
  - cabin-boys
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.lustria-pirates.band.pirate-special-skills-sea-legs
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, magic, or non-duel context.'
- id: band--pirate-special-skills-cutlass-master
  kind: warband_skill
  name: Cutlass Master
  effect: While armed with a Cutlass, the Hero may successfully parry an attack by matching the opponent's
    highest successful To Hit roll instead of needing to exceed it. This benefit applies only while the
    Hero is under cover, inside a building, or within 2" of terrain such as a wall or tree.
  source:
    manual: lustria
    printed_page: 91
    section: Pirate Special Skills / Cutlass Master
  name_i18n:
    en: Cutlass Master
    es: Maestro del sable
  effect_i18n:
    en: While armed with a Cutlass, the Hero may successfully parry an attack by matching the opponent's
      highest successful To Hit roll instead of needing to exceed it. This benefit applies only while
      the Hero is under cover, inside a building, or within 2" of terrain such as a wall or tree.
    es: Mientras empuñe un Sable, el Héroe puede efectuar una estocada con éxito igualando la tirada más
      alta por Golpear del oponente en lugar de tener que superarla. Este beneficio se aplica solo mientras
      el Héroe esté bajo cobertura, dentro de un edificio, o a 2" de un terreno como un muro o un árbol.
  eligibility:
  - pirate-captain
  - ships-mates
  - cabin-boys
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.lustria-pirates.band.pirate-special-skills-cutlass-master
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, magic, or non-duel context.'
- id: band--pirate-special-skills-booming-voice
  kind: warband_skill
  name: Booming Voice
  effect: Pirate Captain only. Once per turn, while the Captain is standing and not engaged in close combat,
    one Pirate within 8" who has just failed a test to flee from combat or to stop fleeing may re-roll
    that test.
  source:
    manual: lustria
    printed_page: 91
    section: Pirate Special Skills / Booming Voice
  name_i18n:
    en: Booming Voice
    es: Voz atronadora
  effect_i18n:
    en: Pirate Captain only. Once per turn, while the Captain is standing and not engaged in close combat,
      one Pirate within 8" who has just failed a test to flee from combat or to stop fleeing may re-roll
      that test.
    es: Solo el Capitán pirata. Una vez por turno, mientras el Capitán esté de pie y no enfrascado en
      combate cuerpo a cuerpo, un Pirata a 8" que acabe de fallar un chequeo para huir del combate o para
      dejar de huir puede repetirlo.
  eligibility:
  - pirate-captain
  applies_to:
    band: true
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.lustria-pirates.band.pirate-special-skills-booming-voice
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology or mounts.'
- id: band--pirate-special-skills-hardy-constitution
  kind: warband_skill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: skill.hardy-constitution
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.hardy-constitution
  name: Hardy Constitution
  effect: When the Hero suffers a critical hit, roll D6. On 5+ the critical effect is ignored and the
    wound is resolved normally; on a failure, resolve the critical hit normally.
  source:
    manual: lustria
    printed_page: 91
    section: Pirate Special Skills / Hardy Constitution
  name_i18n:
    en: Hardy Constitution
    es: Constitución recia
  effect_i18n:
    en: When the Hero suffers a critical hit, roll D6. On 5+ the critical effect is ignored and the wound
      is resolved normally; on a failure, resolve the critical hit normally.
    es: Cuando el Héroe sufre un golpe crítico, tira 1D6. Con 5+ se ignora el efecto crítico y la herida
