- id: gunners--carronades-are-dangerous
  name: Carronades Are Dangerous, Cabin Boy!
  effect: A Gunner carrying a Carronade must form a one-model Henchman group. The carrier may be recruited as a new Gunner
    or split from an existing Gunner group; if split from an existing group, the model retains its accumulated Experience
    and advances.
  source:
    manual: lustria
    printed_page: 93
    section: Henchmen / Gunners / Carronades Are Dangerous, Cabin Boy!
  name_i18n:
    en: Carronades Are Dangerous, Cabin Boy!
    es: null
