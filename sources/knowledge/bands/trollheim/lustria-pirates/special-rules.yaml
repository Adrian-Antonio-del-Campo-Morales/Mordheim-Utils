- id: band--pirate-special-skills-swashbuckler
  kind: warband_skill
  name: Swashbuckler
  effect: At the end of any close-combat phase, whether the Hero's or the opponent's, if the Hero is in base contact with
    an enemy model the Hero may take a Leadership test. If passed, the Hero may immediately make one normal move, but may
    not run or charge, and the enemy does not receive free attacks for the disengagement. If the test is failed, the Hero
    remains engaged and must continue fighting next turn.
  source:
    manual: lustria
    printed_page: 91
    section: Pirate Special Skills / Swashbuckler
  name_i18n:
    en: Swashbuckler
    es: null
