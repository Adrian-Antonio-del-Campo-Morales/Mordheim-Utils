schema_version: 2
band_id: lustria-pirates
rules:
- id: pirate-captain--leader
  name: Leader
  effect: Any warband warrior within 6" of the Pirate Captain may use his Leadership when taking Leadership
    tests.
  source:
    manual: lustria
    printed_page: 92
    section: Heroes / 1 Pirate Captain / Leader
  name_i18n:
    en: Leader
    es: Líder
  effect_i18n:
    en: Any warband warrior within 6" of the Pirate Captain may use his Leadership when taking Leadership
      tests.
    es: Cualquier guerrero de la banda a 6" del Capitán pirata puede usar su Liderazgo al realizar chequeos
      de Liderazgo.
  applies_to:
    profile_ids:
    - pirate-captain
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.lustria-pirates.pirate-captain.leader
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology or mounts.'
- id: gunners--carronades-are-dangerous
  name: Carronades Are Dangerous, Cabin Boy!
  effect: A Gunner carrying a Carronade must form a one-model Henchman group. The carrier may be recruited
    as a new Gunner or split from an existing Gunner group; if split from an existing group, the model
    retains its accumulated Experience and advances.
  source:
    manual: lustria
    printed_page: 93
    section: Henchmen / Gunners / Carronades Are Dangerous, Cabin Boy!
  name_i18n:
    en: Carronades Are Dangerous, Cabin Boy!
    es: ¡Los cañones de carrera son peligrosos, grumete!
  effect_i18n:
    en: A Gunner carrying a Carronade must form a one-model Henchman group. The carrier may be recruited
      as a new Gunner or split from an existing Gunner group; if split from an existing group, the model
      retains its accumulated Experience and advances.
    es: Un Artillero que lleve un Cañón de carrera debe formar un grupo de Soldados de un solo modelo.
      El portador puede reclutarse como un nuevo Artillero o separarse de un grupo de Artilleros existente;
      si se separa de un grupo existente, el modelo conserva la Experiencia y los avances acumulados.
  applies_to:
    profile_ids:
    - gunners
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.lustria-pirates.gunners.carronades-are-dangerous
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, magic, or non-duel context.'
- id: boatswains--expert-rigger
  name: Expert Rigger
  effect: A Boatswain may re-roll any failed Initiative test made to leap across a gap, jump down, make
    a diving charge, or climb up or down.
  source:
    manual: lustria
    printed_page: 93
    section: Henchmen / 0-5 Boatswains / Expert Rigger
  name_i18n:
    en: Expert Rigger
    es: Juez de aparejos experto
  effect_i18n:
    en: A Boatswain may re-roll any failed Initiative test made to leap across a gap, jump down, make
      a diving charge, or climb up or down.
    es: Un Contramaestre de verga puede repetir cualquier chequeo de Iniciativa fallado realizado para
      saltar un hueco, lanzarse desde arriba, efectuar una carga en picado, o trepar hacia arriba o hacia
      abajo.
  applies_to:
    profile_ids:
    - boatswains
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.lustria-pirates.boatswains.expert-rigger
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, magic, or non-duel context.'
- id: swabbies--special-recruitment
  name: Not Recruited Normally
  effect: Swabbies may not be hired through the normal recruitment procedure; they join only through the
    Pirates' special recruitment rules.
  source:
    manual: lustria
    printed_page: 94
    section: Henchmen / 0-5 Swabbies / Not Recruited Normally
  name_i18n:
    en: Not Recruited Normally
    es: No se reclutan con normalidad
  effect_i18n:
    en: Swabbies may not be hired through the normal recruitment procedure; they join only through the
      Pirates' special recruitment rules.
    es: Los Fregones no pueden contratarse mediante el procedimiento normal de reclutamiento; se unen
      solo a través de las reglas especiales de reclutamiento de los Piratas.
  applies_to:
    profile_ids:
    - swabbies
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.lustria-pirates.swabbies.special-recruitment
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, magic, or non-duel context.'
- id: swabbies--never-gain-experience
  name: Never Gain Experience
  effect: Swabbies never gain Experience.
  source:
    manual: lustria
    printed_page: 94
    section: Henchmen / 0-5 Swabbies / Never Gain Experience
  name_i18n:
    en: Never Gain Experience
    es: Nunca ganan Experiencia
  effect_i18n:
    en: Swabbies never gain Experience.
    es: Los Fregones nunca ganan Experiencia.
  applies_to:
