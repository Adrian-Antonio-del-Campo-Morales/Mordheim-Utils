- id: band--kidnapped
  name: Kidnapped!
  effect: 'If an enemy Human Hero suffers the Captured result on the Serious Injury table, the Pirates may attempt to press
    the captive into service instead of exchanging, ransoming or selling the Hero. Both players roll 2D6 and add the Pirate
    Captain''s Leadership or the captive Hero''s Leadership; the player who won the battle adds +1. If the Pirates score higher,
    the captive joins as the first member of a new Crew group or joins an existing Crew group of four or fewer models. Joining
    an experienced group costs no extra recruitment gold; the captive''s old equipment is sold to buy legal Crew equipment,
    and the model uses the characteristics and advances of a new Crew model or of the existing group it joins. If the opposing
    player scores higher, the captive is forced to become a Swabbie: all old equipment is stripped and redistributed, but
    the captive retains its original characteristics and skills and may thereafter use only the Swabbie Equipment List. Human
    Henchmen that were taken Out of Action and permanently lose contact with their original warband may be captured on a 4+;
    if the Pirates won the battle, resolve the same opposed roll, so the Pirates receive the winner''s +1. Hired Swords and
    special characters may be kidnapped but can never be recruited.'
  source:
    manual: lustria
    printed_page: 84
    section: Pirate Special Rules / Kidnapped!
  name_i18n:
    en: Kidnapped!
    es: null
  effect_i18n:
    en: 'If an enemy Human Hero suffers the Captured result on the Serious Injury table, the Pirates may attempt to press
      the captive into service instead of exchanging, ransoming or selling the Hero. Both players roll 2D6 and add the Pirate
      Captain''s Leadership or the captive Hero''s Leadership; the player who won the battle adds +1. If the Pirates score
      higher, the captive joins as the first member of a new Crew group or joins an existing Crew group of four or fewer models.
      Joining an experienced group costs no extra recruitment gold; the captive''s old equipment is sold to buy legal Crew
      equipment, and the model uses the characteristics and advances of a new Crew model or of the existing group it joins.
      If the opposing player scores higher, the captive is forced to become a Swabbie: all old equipment is stripped and redistributed,
      but the captive retains its original characteristics and skills and may thereafter use only the Swabbie Equipment List.
      Human Henchmen that were taken Out of Action and permanently lose contact with their original warband may be captured
      on a 4+; if the Pirates won the battle, resolve the same opposed roll, so the Pirates receive the winner''s +1. Hired
      Swords and special characters may be kidnapped but can never be recruited.'
    es: null
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.lustria-pirates.band.kidnapped
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, magic, or non-duel context.'
- id: band--stragglers-and-prisoners
  name: Stragglers and Prisoners
  effect: When Exploration produces a Straggler, the Pirate Captain may take a Leadership test; if passed, the Straggler joins
    as a Swabbie. When Exploration produces Prisoners, roll 1D3 to determine how many are rescued. For each rescued Prisoner,
    the Captain takes a Leadership test. On a success the Prisoner joins the Crew for free, creating a new Crew group or joining
    an existing group of four or fewer models; a new group starts with the normal Crew profile and 0 Experience, while a model
    joining an experienced group adopts that group's characteristics and advances without an additional recruitment cost.
    The warband must still buy legal equipment for the new Crew member. If the Captain fails the test, or if the warband cannot
    afford the required Crew equipment, the Prisoner joins as a Swabbie.
  source:
    manual: lustria
    printed_page: 85
    section: Pirate Special Rules / Stragglers and Prisoners
  name_i18n:
    en: Stragglers and Prisoners
    es: null
  effect_i18n:
    en: When Exploration produces a Straggler, the Pirate Captain may take a Leadership test; if passed, the Straggler joins
      as a Swabbie. When Exploration produces Prisoners, roll 1D3 to determine how many are rescued. For each rescued Prisoner,
      the Captain takes a Leadership test. On a success the Prisoner joins the Crew for free, creating a new Crew group or
      joining an existing group of four or fewer models; a new group starts with the normal Crew profile and 0 Experience,
      while a model joining an experienced group adopts that group's characteristics and advances without an additional recruitment
      cost. The warband must still buy legal equipment for the new Crew member. If the Captain fails the test, or if the warband
      cannot afford the required Crew equipment, the Prisoner joins as a Swabbie.
    es: null
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.lustria-pirates.band.stragglers-and-prisoners
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, magic, or non-duel context.'
