- id: band--guild-special-skills-pickpocket
  kind: warband_skill
  name: Pickpocket
  effect: If the Hero moves into contact with an enemy model that is Out of Action but has not yet been removed from the game,
    the Hero may try to steal one of that model's weapons. Roll D6; on 5+ the weapon is stolen. The Hero may take no other
    action that turn.
  source:
    manual: khemri
    printed_page: 75
    section: Thieves' Special Skills / Pickpocket
  name_i18n:
    en: Pickpocket
    es: null
  effect_i18n:
    en: If the Hero moves into contact with an enemy model that is Out of Action but has not yet been removed from the game,
      the Hero may try to steal one of that model's weapons. Roll D6; on 5+ the weapon is stolen. The Hero may take no other
      action that turn.
    es: null
  eligibility:
  - guild-chief
  - guild-master-thief
  - guild-ruffian
  - guild-hashashiyyin
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.khemri-thieves-guild.band.guild-special-skills-pickpocket
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, magic, or non-duel context.'
- id: band--guild-special-skills-knife-fighting
  kind: warband_skill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: skill.knife-fighting
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.knife-fighting
  name: Knife Fighting
  effect: While using a Yambiya or Dagger, the Hero gains +1 WS and +1 on the Injury roll. The opponent still receives the
    normal +1 armour-save modifier for being attacked with such a weapon.
  source:
