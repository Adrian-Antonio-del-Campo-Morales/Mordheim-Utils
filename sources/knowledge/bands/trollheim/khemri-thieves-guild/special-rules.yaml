- id: guild-hashashiyyin--consummate-fighter
  name: Consummate Fighter
  effect: >-
    Any Wound inflicted by the Hashashiyyin Assassin, whether in close combat or shooting, imposes
    an additional -1 modifier to the target's armour save.
  source:
    manual: khemri
    printed_page: 73
    section: Heroes / 0-1 Hashashiyyin Assassin / Consummate Fighter
  name_i18n:
    es: Luchador Consumado
  effect_i18n:
    es: >-
      Cualquier Herida infligida por el Asesino Hashashiyyin, ya sea en combate cuerpo a cuerpo o en
      disparo, impone un modificador adicional de -1 a la salvación por armadura del objetivo.
  applies_to:
    profile_ids:
    - guild-hashashiyyin
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: trait.perfect-killer
      scope: 'YES'
      binding:
        kind: trait
        id: trait.perfect-killer
        parameters:
          value: true
