- id: guild-beggar--alms
  name: Alms
  effect: >-
    Whenever the warband is in an oasis or a city, a Beggar may go begging. Roll D6: 1 = the Beggar
    is beaten and misses the next battle; 2-6 = the Beggar receives 1D3 gold crowns.
  source:
    manual: khemri
    printed_page: 74
    section: Henchmen / Beggars / Alms
  name_i18n:
    es: Limosna
  effect_i18n:
    es: >-
      Siempre que la banda esté en un oasis o en una ciudad, un Mendigo puede ir a mendigar. Tira
      D6: 1 = el Mendigo es apaleado y se pierde la siguiente batalla; 2-6 = el Mendigo recibe D3
      coronas de oro.
  applies_to:
    profile_ids:
    - guild-beggar
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.khemri-thieves-guild.guild-beggar.alms
      scope: 'NO'
      binding: null
      reason: out-of-scope.campaign
- id: band--guild-special-skills-pickpocket
  kind: warband_skill
  name: Pickpocket
  effect: >-
    If the Hero moves into contact with an enemy model that is Out of Action but has not yet been
    removed from the game, the Hero may try to steal one of that model's weapons. Roll D6; on 5+ the
    weapon is stolen. The Hero may take no other action that turn.
  source:
    manual: khemri
    printed_page: 75
    section: Thieves' Special Skills / Pickpocket
  name_i18n:
    es: Carterista
  effect_i18n:
    es: >-
      Si el Héroe se mueve hasta entrar en contacto con un modelo enemigo que esté Fuera de combate
      pero que aún no haya sido retirado del juego, el Héroe puede intentar robar una de las armas
      de ese modelo. Tira D6; con un 5+ el arma es robada. El Héroe no puede realizar ninguna otra
      acción ese asalto.
  eligibility:
  - guild-chief
  - guild-master-thief
  - guild-ruffian
  - guild-hashashiyyin
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.khemri-thieves-guild.band.guild-special-skills-pickpocket
      scope: 'NO'
      binding: null
      reason: out-of-scope.non-duel
- id: band--guild-special-skills-knife-fighting
  kind: warband_skill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: skill.knife-fighting
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.knife-fighting
  name: Knife Fighting
  effect: >-
    While using a Yambiya or Dagger, the Hero gains +1 WS and +1 on the Injury roll. The opponent
    still receives the normal +1 armour-save modifier for being attacked with such a weapon.
  source:
    manual: khemri
    printed_page: 75
    section: Thieves' Special Skills / Knife Fighting
  name_i18n:
    es: Pelea con Cuchillos
  effect_i18n:
    es: >-
      Mientras use una Yambiya o una Daga, el Héroe gana +1 HA y +1 en la tirada de heridas. El
      oponente sigue recibiendo el modificador normal de +1 a la salvación por armadura por ser
      atacado con tal arma.
  eligibility:
  - guild-chief
  - guild-master-thief
  - guild-ruffian
  - guild-hashashiyyin
  applies_to:
    band: true
- id: band--guild-special-skills-hide-in-shadows
  kind: warband_skill
  name: Hide in Shadows
  effect: >-
    While the Hero is within 1" of a wall or another linear obstacle such as a hedge, fence or well,
    an enemy model must pass an Initiative test before it can charge or shoot at the Hero.
  source:
    manual: khemri
    printed_page: 75
    section: Thieves' Special Skills / Hide in Shadows
  name_i18n:
    es: Ocultarse en las Sombras
  effect_i18n:
    es: >-
      Mientras el Héroe esté a 1" de un muro u otro obstáculo lineal como un seto, una valla o un
      pozo, un modelo enemigo debe superar un chequeo de Iniciativa antes de poder cargar o disparar
      contra el Héroe.
  eligibility:
  - guild-chief
  - guild-master-thief
  - guild-ruffian
  - guild-hashashiyyin
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.khemri-thieves-guild.band.guild-special-skills-hide-in-shadows
      scope: 'NO'
      binding: null
      reason: out-of-scope.movement
- id: band--guild-special-skills-poisoner
  kind: warband_skill
  name: Poisoner
  effect: >-
    Ruffians may not take this skill. At the start of each battle, choose two of the Hero's own
    weapons; each is coated with either Black Venom or Black Lotus, chosen before the battle. No
    gold is paid for these poisons and they may not be used to coat weapons belonging to other
    warband members. The internal poison effects are intentionally not modelled here.
  source:
    manual: khemri
    printed_page: 75
    section: Thieves' Special Skills / Poisoner
  name_i18n:
    es: Envenenador
  effect_i18n:
    es: >-
      Los Matones no pueden tomar esta habilidad. Al inicio de cada batalla, elige dos de las armas
      propias del Héroe; cada una se recubre con Veneno Negro o Loto Negro, elegidos antes de la
      batalla. No se paga oro por estos venenos y no pueden usarse para recubrir armas de otros
      miembros de la banda. Los efectos internos de los venenos no están modelados intencionadamente
      aquí.
  eligibility:
  - guild-chief
  - guild-master-thief
  - guild-hashashiyyin
  applies_to:
    band: true
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.khemri-thieves-guild.band.guild-special-skills-poisoner
      scope: LATER
      binding: null
      reason: pending-implementation
- id: band--guild-special-skills-fast-legs
  kind: warband_skill
  name: Fast Legs
  effect: >-
    Ruffians may not take this skill. The Hero increases its base Movement by +1". This skill may
    not be used while wearing Heavy Armour, carrying a Shield or wearing a Helmet.
  source:
    manual: khemri
    printed_page: 75
    section: Thieves' Special Skills / Fast Legs
  name_i18n:
    es: Piernas Veloces
  effect_i18n:
    es: >-
      Los Matones no pueden tomar esta habilidad. El Héroe aumenta su Movimiento base en +1". Esta
      habilidad no puede usarse llevando Armadura Pesada, escudo o Yelmo.
  eligibility:
  - guild-chief
  - guild-master-thief
  - guild-hashashiyyin
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.khemri-thieves-guild.band.guild-special-skills-fast-legs
      scope: 'NO'
      binding: null
      reason: out-of-scope.movement
- id: band--guild-special-skills-infiltration
  kind: warband_skill
  name: Infiltration
  source:
    manual: khemri
    printed_page: 75
    section: Thieves' Special Skills / Infiltration
  name_i18n:
    es: Infiltración
  eligibility:
  - guild-chief
  - guild-master-thief
  - guild-hashashiyyin
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.khemri-thieves-guild.band.guild-special-skills-infiltration
      scope: 'NO'
      binding: null
      reason: out-of-scope.movement
  # Not shared: the printed entry also names the profile that may not take the skill, which the
  # shared Infiltration text does not carry.
  effect: >-
    Ruffians may not take this skill. The Hero deploys after the opposing warband and may be placed
    anywhere outside enemy line of sight and more than 12" from every enemy model. If both players
    have infiltrating models, roll D6 for each; the lowest result deploys first.
  effect_i18n:
    es: >-
      Los Matones no pueden tomar esta habilidad. El Héroe se despliega después de la banda rival y
      puede colocarse en cualquier punto fuera de la línea de visión enemiga y a más de 12" de cada
      modelo enemigo. Si ambos jugadores tienen modelos que se infiltran, tira D6 por cada uno; el
      de menor resultado se despliega primero.

