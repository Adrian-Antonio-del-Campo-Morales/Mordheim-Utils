rules:
- id: guild-chief--leader
  name: Leader
  effect: Any warband model within 6" of the Guild Chief may use his Leadership instead of its own.
  source:
    manual: khemri
    printed_page: 72
    section: Heroes / 1 Guild Chief / Leader
  name_i18n:
    en: Leader
    es: null
  effect_i18n:
    en: Any warband model within 6" of the Guild Chief may use his Leadership instead of its own.
    es: null
  applies_to:
    profile_ids:
    - guild-chief
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.khemri-thieves-guild.guild-chief.leader
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology or mounts.'
- id: guild-chief--wanted
  name: Wanted
  effect: 'If the Guild Chief is captured by an enemy warband after a battle, that warband may sell him to the authorities
    for 1D6 plus his accumulated Experience in gold crowns. Then roll D6 for the captive: 1-3 = one of his hands is cut off;
    4-5 = he is branded on the forehead, suffering -1 Toughness and -3 on rolls to find Rare items; 6 = he is executed.'
  source:
    manual: khemri
    printed_page: 72
    section: Heroes / 1 Guild Chief / Wanted
  name_i18n:
    en: Wanted
    es: null
  effect_i18n:
    en: 'If the Guild Chief is captured by an enemy warband after a battle, that warband may sell him to the authorities for
      1D6 plus his accumulated Experience in gold crowns. Then roll D6 for the captive: 1-3 = one of his hands is cut off;
      4-5 = he is branded on the forehead, suffering -1 Toughness and -3 on rolls to find Rare items; 6 = he is executed.'
    es: null
  applies_to:
    profile_ids:
    - guild-chief
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.khemri-thieves-guild.guild-chief.wanted
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, magic, or non-duel context.'
