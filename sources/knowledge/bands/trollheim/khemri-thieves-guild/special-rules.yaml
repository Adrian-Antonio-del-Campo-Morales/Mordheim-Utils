      to the target's armour save.
    es: null
  applies_to:
    profile_ids:
    - guild-hashashiyyin
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: trait.perfect-killer
      scope: 'YES'
      binding:
        kind: trait
        id: trait.perfect-killer
        parameters:
          value: true
