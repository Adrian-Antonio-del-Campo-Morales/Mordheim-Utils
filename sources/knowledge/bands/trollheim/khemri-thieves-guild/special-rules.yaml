  eligibility:
  - guild-chief
  - guild-master-thief
  - guild-ruffian
  - guild-hashashiyyin
  applies_to:
    band: true
- id: band--guild-special-skills-hide-in-shadows
  kind: warband_skill
  name: Hide in Shadows
  effect: While the Hero is within 1" of a wall or another linear obstacle such as a hedge, fence or well, an enemy model
    must pass an Initiative test before it can charge or shoot at the Hero.
  source:
    manual: khemri
    printed_page: 75
    section: Thieves' Special Skills / Hide in Shadows
  name_i18n:
    en: Hide in Shadows
    es: null
  effect_i18n:
