        parameters:
          forbids:
          - weapon.spear
          - weapon.ankus
          - defence.shield
          - armour.heavy-armour
  name: Equipment Restrictions
  effect: >-
    May not select Spear, Ankus, Shield or Heavy Armour from the Thief Equipment List; those entries
    are Ruffians and Enforcers only.
  source:
    manual: khemri
    printed_page: 73
    section: "0-1 Hashashiyyin Assassin"
  name_i18n:
    es: Restricciones de Equipo
  effect_i18n:
    es: >-
      No puede elegir Lanza, Ankus, Escudo ni Armadura Pesada de la Lista de Equipo de Ladrones;
      esas entradas son solo para Rufianes y Ejecutores.
  applies_to:
    profile_ids:
    - guild-hashashiyyin
