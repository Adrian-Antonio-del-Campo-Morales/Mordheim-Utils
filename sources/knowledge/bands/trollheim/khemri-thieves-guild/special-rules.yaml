- id: guild-hashashiyyin--consummate-fighter
  name: Consummate Fighter
  effect: Any Wound inflicted by the Hashashiyyin Assassin, whether in close combat or shooting, imposes an additional -1
    modifier to the target's armour save.
  source:
    manual: khemri
    printed_page: 73
    section: Heroes / 0-1 Hashashiyyin Assassin / Consummate Fighter
  name_i18n:
    en: Consummate Fighter
    es: null
  effect_i18n:
