- id: guild-beggar--alms
  name: Alms
  effect: 'Whenever the warband is in an oasis or a city, a Beggar may go begging. Roll D6: 1 = the Beggar is beaten and misses
    the next battle; 2-6 = the Beggar receives 1D3 gold crowns.'
  source:
    manual: khemri
    printed_page: 74
    section: Henchmen / Beggars / Alms
  name_i18n:
    en: Alms
    es: null
