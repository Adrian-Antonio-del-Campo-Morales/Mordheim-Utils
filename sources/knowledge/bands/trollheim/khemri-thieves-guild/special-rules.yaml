- id: band--guild-special-skills-infiltration
  kind: warband_skill
  name: Infiltration
  effect: Ruffians may not take this skill. The Hero deploys after the opposing warband and may be placed anywhere outside
    enemy line of sight and more than 12" from every enemy model. If both players have infiltrating models, roll D6 for each;
    the lowest result deploys first.
  source:
    manual: khemri
    printed_page: 75
    section: Thieves' Special Skills / Infiltration
  name_i18n:
    en: Infiltration
    es: null
  effect_i18n:
