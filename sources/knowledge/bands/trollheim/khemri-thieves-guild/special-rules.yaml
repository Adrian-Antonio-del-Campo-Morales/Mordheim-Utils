- id: band--guild-special-skills-poisoner
  kind: warband_skill
  name: Poisoner
  effect: Ruffians may not take this skill. At the start of each battle, choose two of the Hero's own weapons; each is coated
    with either Black Venom or Black Lotus, chosen before the battle. No gold is paid for these poisons and they may not be
    used to coat weapons belonging to other warband members. The internal poison effects are intentionally not modelled here.
  source:
    manual: khemri
    printed_page: 75
    section: Thieves' Special Skills / Poisoner
  name_i18n:
    en: Poisoner
    es: null
  effect_i18n:
