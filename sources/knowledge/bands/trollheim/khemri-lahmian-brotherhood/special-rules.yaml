- id: band--death-of-the-vampire
  name: Death of the Vampire
  effect: If the Lahmian Vampire dies after a battle, the warband may not hire another Vampire while a
    Blood Sister remains available; it must wait for the Blood Sister to transform. Until then, the Hero
    with the highest Leadership acts as leader. If the warband has no Blood Sister, it may hire another
    Vampire. If both the Vampire and Necromancer are dead after a battle and there is no Blood Sister
    already transformed into a Vampire, all Henchmen with the Undead special rule are automatically destroyed.
  source:
    manual: khemri
    printed_page: 85
    section: Undead Special Rules / Death of the Vampire
  name_i18n:
    en: Death of the Vampire
    es: Muerte del Vampiro
  effect_i18n:
    en: If the Lahmian Vampire dies after a battle, the warband may not hire another Vampire while a Blood
      Sister remains available; it must wait for the Blood Sister to transform. Until then, the Hero with
      the highest Leadership acts as leader. If the warband has no Blood Sister, it may hire another Vampire.
      If both the Vampire and Necromancer are dead after a battle and there is no Blood Sister already
      transformed into a Vampire, all Henchmen with the Undead special rule are automatically destroyed.
    es: Si el Vampiro Lahmiano muere tras una batalla, la banda no puede contratar otro Vampiro mientras
      quede una Hermana de sangre disponible; debe esperar a que la Hermana de sangre se transforme. Hasta
      entonces, el Héroe con el Liderazgo más alto actúa como líder. Si la banda no tiene Hermana de sangre,
      puede contratar otro Vampiro. Si tanto el Vampiro como el Nigromante mueren tras una batalla y no
      hay ya una Hermana de sangre, la banda se disuelve.
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.khemri-lahmian-brotherhood.band.death-of-the-vampire
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, magic, or non-duel context.'
- id: band--lahmian-special-skills-celerity
  kind: warband_skill
  name: Celerity
  effect: The Vampire may run her full running distance, but for game purposes counts as if she had only
    moved normally. This allows actions such as running and shooting, running and Hiding, or other actions
    normally permitted only if the model did not run.
  source:
    manual: khemri
    printed_page: 90
    section: Lahmian Vampire Special Skills / Celerity
  name_i18n:
    en: Celerity
    es: Celeridad
  effect_i18n:
    en: The Vampire may run her full running distance, but for game purposes counts as if she had only
      moved normally. This allows actions such as running and shooting, running and Hiding, or other actions
      normally permitted only if the model did not run.
    es: El Vampiro puede correr toda su distancia de carrera, pero a efectos de juego cuenta como si solo
      se hubiera movido con normalidad. Esto permite acciones como correr y disparar, correr y Ocultarse,
      u otras acciones que normalmente solo se permiten si el modelo no corrió.
