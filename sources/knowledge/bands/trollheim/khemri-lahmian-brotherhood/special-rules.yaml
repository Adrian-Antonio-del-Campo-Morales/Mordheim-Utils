- id: band--death-of-the-vampire
  name: Death of the Vampire
  effect: If the Lahmian Vampire dies after a battle, the warband may not hire another Vampire while a Blood Sister remains
    available; it must wait for the Blood Sister to transform. Until then, the Hero with the highest Leadership acts as leader.
    If the warband has no Blood Sister, it may hire another Vampire. If both the Vampire and Necromancer are dead after a
    battle and there is no Blood Sister already transformed into a Vampire, all Henchmen with the Undead special rule are
    automatically destroyed.
  source:
    manual: khemri
    printed_page: 85
    section: Undead Special Rules / Death of the Vampire
  name_i18n:
    en: Death of the Vampire
    es: null
  effect_i18n:
    en: If the Lahmian Vampire dies after a battle, the warband may not hire another Vampire while a Blood Sister remains
      available; it must wait for the Blood Sister to transform. Until then, the Hero with the highest Leadership acts as
