- id: blood-sister--semi-vampire
  name: Semi-Vampire
  effect: If the Lahmian Vampire dies, on the Blood Sister's next advance roll D6 instead of rolling for
    a normal advance. On 4+ she becomes a Vampire for all purposes while retaining all Experience and
    skills gained before the transformation. This roll replaces that advance. If she transforms, the warband
    may recruit a new Blood Sister.
  source:
    manual: khemri
    printed_page: 87
    section: Heroes / 0-1 Blood Sister / Semi-Vampire
  name_i18n:
    en: Semi-Vampire
    es: Semivampira
  effect_i18n:
    en: If the Lahmian Vampire dies, on the Blood Sister's next advance roll D6 instead of rolling for
      a normal advance. On 4+ she becomes a Vampire for all purposes while retaining all Experience and
      skills gained before the transformation. This roll replaces that advance. If she transforms, the
      warband may recruit a new Blood Sister.
    es: Si el Vampiro Lahmiano muere, en su siguiente avance la Hermana de sangre tira 1D6 en lugar de
      realizar un avance normal. Con 4+ se convierte en Vampiro a todos los efectos, conservando toda
      la Experiencia y las habilidades adquiridas antes de la transformación. Esta tirada sustituye a
      ese avance. Si se transforma, la banda puede reclutar una nueva Hermana de sangre.
  applies_to:
    profile_ids:
    - blood-sister
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.khemri-lahmian-brotherhood.blood-sister.semi-vampire
      scope: 'NO'
      binding: null
