  name: Lost Innocence
  effect: The Vampire always strikes first in close combat. If another model has a similar ability, resolve
    the order by Initiative; if Initiative is tied, roll D6 to decide.
  source:
    manual: khemri
    printed_page: 90
    section: Lahmian Vampire Special Skills / Lost Innocence
