- id: band--lahmian-special-skills-vampire-reflexes
  kind: warband_skill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: skill.vampire-reflexes
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.vampire-reflexes
  name: Vampire Reflexes
  effect: The Vampire has an unmodifiable 6+ save against any Wound. If an attack causes multiple Wounds,
    make this save before multiplying the Wounds. This ability may be combined with Step Aside or Dodge
    to improve the save to 4+.
  source:
    manual: khemri
    printed_page: 90
    section: Lahmian Vampire Special Skills / Vampire Reflexes
  name_i18n:
    en: Vampire Reflexes
    es: Reflejos de vampiro
  effect_i18n:
    en: The Vampire has an unmodifiable 6+ save against any Wound. If an attack causes multiple Wounds,
      make this save before multiplying the Wounds. This ability may be combined with Step Aside or Dodge
      to improve the save to 4+.
    es: El Vampiro tiene una tirada de salvación inmodificable de 6+ contra cualquier Herida. Si un ataque
      causa varias Heridas, realiza esta tirada antes de multiplicar las Heridas. Esta habilidad puede
      combinarse con Apartarse o Esquivar para mejorar la salvación a 4+.
  eligibility:
  - lahmian-vampire
  applies_to:
    band: true
