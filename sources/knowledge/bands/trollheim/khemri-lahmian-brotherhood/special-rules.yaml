- id: beloved--devoted-to-the-vampire
  name: Devoted to the Vampire
  effect: If the Lahmian Vampire is Knocked Down in close combat, the Beloved enters Frenzy until the Vampire stands up. He
    must move toward her as quickly as possible and attacks anyone within 2" of the Vampire. If the Vampire is killed in close
    combat, the Beloved enters Frenzy and is subject to Hatred against her killer until that model dies; after the killer
    dies, the Beloved returns to normal.
  source:
    manual: khemri
    printed_page: 86
    section: Heroes / 0-1 Beloved / Devoted to the Vampire
  name_i18n:
    en: Devoted to the Vampire
    es: null
  effect_i18n:
    en: If the Lahmian Vampire is Knocked Down in close combat, the Beloved enters Frenzy until the Vampire stands up. He
      must move toward her as quickly as possible and attacks anyone within 2" of the Vampire. If the Vampire is killed in
      close combat, the Beloved enters Frenzy and is subject to Hatred against her killer until that model dies; after the
      killer dies, the Beloved returns to normal.
    es: null
  applies_to:
    profile_ids:
    - beloved
  runtime:
    scope: LATER
    implemented: 'NO'
