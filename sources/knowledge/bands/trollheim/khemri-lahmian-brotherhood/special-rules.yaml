    - id: unimplemented.khemri-lahmian-brotherhood.band.lahmian-special-skills-seduction
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology or mounts.'
- id: band--lahmian-special-skills-creature-of-the-night
  kind: warband_skill
  name: Creature of the Night
  effect: If the Vampire did not move during her Movement phase, any attempt to charge, shoot at, or cast
    a spell against her must first roll 4+ on D6. On a failed roll, that action cannot be attempted against
    her.
