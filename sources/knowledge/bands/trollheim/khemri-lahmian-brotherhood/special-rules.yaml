- id: band--lahmian-special-skills-hypnotize
  kind: warband_skill
  name: Hypnotize
  effect: At the start of the Combat phase, choose one enemy model in base contact with the Vampire. That
    model must pass a Leadership test or it may not attack that turn and all attacks directed against
    it gain +1 To Hit. Models immune to Psychology are unaffected.
  source:
    manual: khemri
    printed_page: 90
    section: Lahmian Vampire Special Skills / Hypnotize
  name_i18n:
    en: Hypnotize
    es: Hipnotizar
  effect_i18n:
    en: At the start of the Combat phase, choose one enemy model in base contact with the Vampire. That
      model must pass a Leadership test or it may not attack that turn and all attacks directed against
      it gain +1 To Hit. Models immune to Psychology are unaffected.
    es: Al comienzo de la fase de Combate, elige un modelo enemigo en contacto de base con el Vampiro.
      Ese modelo debe superar un chequeo de Liderazgo o no podrá atacar ese turno y todos los ataques
      dirigidos contra él obtienen +1 por Golpear. Los modelos inmunes a la Psicología no se ven afectados.
  eligibility:
  - lahmian-vampire
  applies_to:
