- id: blood-sister--semi-vampire
  name: Semi-Vampire
  effect: If the Lahmian Vampire dies, on the Blood Sister's next advance roll D6 instead of rolling for a normal advance.
    On 4+ she becomes a Vampire for all purposes while retaining all Experience and skills gained before the transformation.
    This roll replaces that advance. If she transforms, the warband may recruit a new Blood Sister.
  source:
    manual: khemri
    printed_page: 87
    section: Heroes / 0-1 Blood Sister / Semi-Vampire
  name_i18n:
    en: Semi-Vampire
    es: null
  effect_i18n:
