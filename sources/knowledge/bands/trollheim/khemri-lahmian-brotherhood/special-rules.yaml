- id: band--lahmian-special-skills-seduction
  kind: warband_skill
  name: Seduction
  effect: At the start of the Combat phase, the Vampire first takes a Leadership test. If she passes, choose one enemy model
    in base contact; that model must pass its own Leadership test or it becomes controlled by the Vampire's player. The original
    owner may attempt to regain control during each Recovery phase by passing a Leadership test. If the Vampire attacks the
    seduced warrior, control ends automatically. If the battle ends while the warrior is still controlled, that warrior counts
    as Out of Action. Only one warrior may be controlled at a time, and models immune to Psychology are unaffected.
  source:
