- id: lahmian-vampire--leader
  name: Leader
  effect: Any warband model within 6" of the Lahmian Vampire may use her Leadership instead of its own.
  source:
    manual: khemri
    printed_page: 86
    section: Heroes / 1 Lahmian Vampire / Leader
  name_i18n:
    en: Leader
    es: Líder
  effect_i18n:
    en: Any warband model within 6" of the Lahmian Vampire may use her Leadership instead of its own.
    es: Cualquier modelo de la banda a 6" del Vampiro Lahmiano puede usar su Liderazgo en lugar del suyo
      propio.
  applies_to:
    profile_ids:
    - lahmian-vampire
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.khemri-lahmian-brotherhood.lahmian-vampire.leader
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology or mounts.'
