- id: lahmian-vampire--local-knowledge
  name: Local Knowledge
  effect: Native warbands only, and only in a Khemri campaign. During Exploration, if the Lahmian Vampire
    was not taken Out of Action, the warband may re-roll one Exploration die and must keep the second
    result.
  source:
    manual: khemri
    printed_page: 86
    section: Heroes / 1 Lahmian Vampire / Local Knowledge
  name_i18n:
    en: Local Knowledge
    es: Conocimiento local
  effect_i18n:
    en: Native warbands only, and only in a Khemri campaign. During Exploration, if the Lahmian Vampire
      was not taken Out of Action, the warband may re-roll one Exploration die and must keep the second
      result.
    es: Solo bandas nativas, y solo en una campaña de Khemri. Durante la Exploración, si el Vampiro Lahmiano
      no salió de Combate, la banda puede repetir un dado de Exploración y debe conservar el segundo resultado.
  applies_to:
    profile_ids:
    - lahmian-vampire
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.khemri-lahmian-brotherhood.lahmian-vampire.local-knowledge
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, or non-duel context.'
