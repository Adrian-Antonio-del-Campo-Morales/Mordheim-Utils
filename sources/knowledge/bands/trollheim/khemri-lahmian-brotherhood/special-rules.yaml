- id: beloved--devoted-to-the-vampire
  name: Devoted to the Vampire
  effect: If the Lahmian Vampire is Knocked Down in close combat, the Beloved enters Frenzy until the
    Vampire stands up. He must move toward her as quickly as possible and attacks anyone within 2" of
    the Vampire. If the Vampire is killed in close combat, the Beloved enters Frenzy and is subject to
    Hatred against her killer until that model dies; after the killer dies, the Beloved returns to normal.
  source:
    manual: khemri
    printed_page: 86
    section: Heroes / 0-1 Beloved / Devoted to the Vampire
  name_i18n:
    en: Devoted to the Vampire
    es: Devoto del Vampiro
  effect_i18n:
    en: If the Lahmian Vampire is Knocked Down in close combat, the Beloved enters Frenzy until the Vampire
      stands up. He must move toward her as quickly as possible and attacks anyone within 2" of the Vampire.
      If the Vampire is killed in close combat, the Beloved enters Frenzy and is subject to Hatred against
      her killer until that model dies; after the killer dies, the Beloved returns to normal.
    es: Si el Vampiro Lahmiano es Derribado en combate cuerpo a cuerpo, el Amado entra en Frenesí hasta
      que el Vampiro se levante. Debe moverse hacia ella lo más rápido posible y ataca a cualquiera que
      esté a 2" del Vampiro. Si el Vampiro muere en combate cuerpo a cuerpo, el Amado entra en Frenesí
      y está sujeto a Odio contra quien lo mató hasta que ese modelo muera; tras la muerte del asesino,
      el Amado vuelve a la normalidad.
  applies_to:
    profile_ids:
    - beloved
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.khemri-lahmian-brotherhood.beloved.devoted-to-the-vampire
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology or mounts.'
- id: beloved--accustomed-to-fear
