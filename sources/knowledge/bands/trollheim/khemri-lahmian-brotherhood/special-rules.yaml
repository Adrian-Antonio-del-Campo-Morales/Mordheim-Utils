- id: band--background-selection
  name: Foreign or Native Background
  effect: Choose exactly one background when the warband is created. Foreign and Native backgrounds use different starting
    Henchmen and equipment lists. After the first battle in a Khemri campaign, all new recruitment and equipment purchases
    use the Native lists, even if the warband began as Foreign. When used in an Old World campaign, recruitment and resupply
    use the Foreign lists.
  source:
    manual: khemri
    printed_page: 83
    section: Choice of Warriors / Foreign and Native Backgrounds
  name_i18n:
    en: Foreign or Native Background
    es: null
  effect_i18n:
    en: Choose exactly one background when the warband is created. Foreign and Native backgrounds use different starting Henchmen
      and equipment lists. After the first battle in a Khemri campaign, all new recruitment and equipment purchases use the
      Native lists, even if the warband began as Foreign. When used in an Old World campaign, recruitment and resupply use
      the Foreign lists.
    es: null
  applies_to:
    band: true
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: band
    effects:
    - id: compiler.foreign-or-native-background
      scope: 'YES'
      binding:
        kind: compiler
        id: compiler.foreign-or-native-background
