  applies_to:
    band: true
- id: band--lahmian-special-skills-seduction
  kind: warband_skill
  name: Seduction
  effect: At the start of the Combat phase, the Vampire first takes a Leadership test. If she passes,
    choose one enemy model in base contact; that model must pass its own Leadership test or it becomes
    controlled by the Vampire's player. The original owner may attempt to regain control during each Recovery
    phase by passing a Leadership test. If the Vampire attacks the seduced warrior, control ends automatically.
    If the battle ends while the warrior is still controlled, that warrior counts as Out of Action. Only
    one warrior may be controlled at a time, and models immune to Psychology are unaffected.
  source:
    manual: khemri
    printed_page: 90
    section: Lahmian Vampire Special Skills / Seduction
  name_i18n:
    en: Seduction
    es: Seducción
  effect_i18n:
    en: At the start of the Combat phase, the Vampire first takes a Leadership test. If she passes, choose
      one enemy model in base contact; that model must pass its own Leadership test or it becomes controlled
      by the Vampire's player. The original owner may attempt to regain control during each Recovery phase
      by passing a Leadership test. If the Vampire attacks the seduced warrior, control ends automatically.
      If the battle ends while the warrior is still controlled, that warrior counts as Out of Action.
      Only one warrior may be controlled at a time, and models immune to Psychology are unaffected.
    es: Al comienzo de la fase de Combate, el Vampiro realiza primero un chequeo de Liderazgo. Si lo supera,
      elige un modelo enemigo en contacto de base; ese modelo debe superar su propio chequeo de Liderazgo
      o pasa a estar controlado por el jugador del Vampiro. El propietario original puede intentar recuperar
      el control durante cada fase de Recuperación superando un chequeo de Liderazgo. Si el Vampiro ataca
      al guerrero seducido, el control termina automáticamente.
  eligibility:
  - lahmian-vampire
  applies_to:
    band: true
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: selectable
