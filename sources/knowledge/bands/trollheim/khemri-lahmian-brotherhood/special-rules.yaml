- id: lackeys--favoured
  name: Favoured
  effect: If the Beloved dies, the Lahmian Vampire may give the Blood Kiss to one Lackey. That warrior
    becomes a Beloved for roster purposes, increases Leadership to 8, and the warband may recruit another
    Lackey. Granting the Blood Kiss counts as one advance roll.
  source:
    manual: khemri
    printed_page: 87
    section: Heroes / 0-2 Lackeys / Favoured
  name_i18n:
    en: Favoured
    es: Favorito
  effect_i18n:
    en: If the Beloved dies, the Lahmian Vampire may give the Blood Kiss to one Lackey. That warrior becomes
      a Beloved for roster purposes, increases Leadership to 8, and the warband may recruit another Lackey.
      Granting the Blood Kiss counts as one advance roll.
    es: Si el Amado muere, el Vampiro Lahmiano puede otorgar el Beso de sangre a un Lacayo. Ese guerrero
      pasa a ser un Amado a efectos de lista, aumenta su Liderazgo a 8, y la banda puede reclutar otro
      Lacayo. Conceder el Beso de sangre cuenta como una tirada de avance.
  applies_to:
