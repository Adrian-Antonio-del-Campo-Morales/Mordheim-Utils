        id: skill.expert-swordsman
  name: Expert Swordsmen
  effect: When charging, Swordsmen may re-roll failed To Hit rolls while armed with normal swords. This does not apply when
    using great swords or any other weapon.
  source:
    manual: trollheim
    printed_page: 71
    section: Henchmen / 0-5 Swordsmen / Expert Swordsmen
