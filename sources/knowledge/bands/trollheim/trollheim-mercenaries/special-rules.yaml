schema_version: 2
band_id: trollheim-mercenaries
rules:
- id: mercenary-captain--leader
  name: Leader
  effect: >-
    Any warrior within 6" of the Mercenary Captain may use his Leadership when taking Leadership
    tests.
  source:
    manual: trollheim
    printed_page: 71
    section: Heroes / 1 Mercenary Captain / Leader
  name_i18n:
    es: Líder
  effect_i18n:
    es: >-
      Cualquier guerrero a 6" del Capitán mercenario puede usar su Liderazgo al realizar chequeos de
      Liderazgo.
  applies_to:
    profile_ids:
    - mercenary-captain
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: mechanic.leader-six
      scope: 'YES'
      binding:
        kind: mechanic
        id: mechanic.leader-six
- id: swordsmen--expert-swordsmen
  kind: profile_ability
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: skill.expert-swordsman
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.expert-swordsman
  name: Expert Swordsmen
  effect: >-
    When charging, Swordsmen may re-roll failed To Hit rolls while armed with normal swords. This
    does not apply when using great swords or any other weapon.
  source:
    manual: trollheim
    printed_page: 71
    section: Henchmen / 0-5 Swordsmen / Expert Swordsmen
  name_i18n:
    es: Espadachines Expertos
  effect_i18n:
    es: >-
      Al cargar, los Espadachines pueden repetir las tiradas de Golpear falladas mientras empuñen
      espadas normales. Esto no se aplica al usar espadones ni cualquier otra arma.
  applies_to:
    profile_ids:
    - swordsmen
- id: band--reikland-command-radius
  name: Reikland — Military Discipline
  effect: >-
    Reikland warriors may use their Captain's Leadership while within 12" instead of the normal 6".
  source:
    manual: trollheim
    printed_page: 68
    section: Reikland / Special Rules / Military Discipline
  name_i18n:
    es: Reikland — Disciplina Militar
  effect_i18n:
    es: >-
      Los guerreros de Reikland pueden usar el Liderazgo de su Capitán estando dentro de 12" en
      lugar de los 6" normales.
  applies_to:
    band: true
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.trollheim-mercenaries.band.reikland-command-radius
      scope: LATER
      binding: null
      reason: deferred.psychology
- id: band--reikland-marksman-training
  name: Reikland — Marksman Training
  effect: >-
    All Reikland Marksmen add +1 to their Ballistic Skill, whether recruited when the warband is
    created or later during a campaign.
  source:
    manual: trollheim
    printed_page: 68
    section: Reikland / Special Rules / Marksman Training
  name_i18n:
    es: Reikland — Entrenamiento de Tirador
  effect_i18n:
    es: >-
      Todos los Tiradores de Reikland añaden +1 a su Habilidad de disparo, ya sea que se recluten al
      crear la banda o más tarde durante la campaña.
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.trollheim-mercenaries.band.reikland-marksman-training
      scope: 'NO'
      binding: null
      reason: out-of-scope.magic
- id: band--middenheim-physical-prowess
  kind: warband_variant
  name: Middenheim — Physical Prowess
  source:
    manual: trollheim
    printed_page: 69
    section: Middenheim / Special Rules
  name_i18n:
    es: Middenheim — Proeza Física
  applies_to:
    band: true
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: profile.characteristics
      scope: 'YES'
      binding:
        kind: profile
        id: profile.characteristics
        parameters:
          profile_ids:
          - mercenary-captain
          - champions
          bonuses:
            strength: 1
  eligibility:
  - mercenary-captain
  - champions
  rule_ref: shared-rule.middenheim-physical-prowess
- id: band--marienburg-traders
  name: Marienburg — Natural Traders
  source:
    manual: trollheim
    printed_page: 69
    section: Marienburg / Special Rules / Natural Traders
  name_i18n:
    es: Marienburgo — Comerciantes Natos
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.trollheim-mercenaries.band.marienburg-traders
      scope: 'NO'
      binding: null
      reason: out-of-scope.magic
  rule_ref: shared-rule.marienburg-natural-traders
- id: band--marienburg-wealth
