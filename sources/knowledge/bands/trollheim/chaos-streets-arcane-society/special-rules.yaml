rules:
- id: grand-wizard--leader
  name: Leader
  effect: Any warband model within 6" of the Grand Wizard may use his Leadership when taking Leadership
    tests.
  name_i18n:
    en: Leader
    es: Líder
  effect_i18n:
    en: Any warband model within 6" of the Grand Wizard may use his Leadership when taking Leadership
      tests.
    es: Cualquier modelo de la banda a 6" del Gran Mago puede usar su Liderazgo cuando realice chequeos
      de Liderazgo.
  applies_to:
    profile_ids:
    - grand-wizard
  source:
    manual: chaos-in-the-streets
    printed_page: 170
    section: Heroes / 1 Grand Wizard / Leader
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.chaos-streets-arcane-society.grand-wizard.leader
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology or mounts.'
- id: grand-wizard--spellcaster
  name: Spellcaster
  effect: At recruitment, choose an Elemental Art (Fire, Air, Water or Earth) or Lesser Magic, then generate
    two random spells from that school.
  name_i18n:
    en: Spellcaster
    es: Lanzador de hechizos
  effect_i18n:
    en: At recruitment, choose an Elemental Art (Fire, Air, Water or Earth) or Lesser Magic, then generate
      two random spells from that school.
    es: Al ser reclutado, elige un Arte Elemental (Fuego, Aire, Agua o Tierra) o Magia Menor, y luego
      genera dos hechizos aleatorios de esa escuela.
  applies_to:
    profile_ids:
    - grand-wizard
  source:
    manual: chaos-in-the-streets
    printed_page: 170
    section: Heroes / 1 Grand Wizard / Spellcaster
  runtime:
