- id: arcane-mage--respect-for-the-arcane-society
  name: Respect for the Arcane Society
  effect: An Arcane Mage may never know more spells than the warband leader.
  name_i18n:
    en: Respect for the Arcane Society
    es: Respeto por la Sociedad Arcana
  effect_i18n:
    en: An Arcane Mage may never know more spells than the warband leader.
    es: Un Mago Arcano jamás puede conocer más hechizos que el líder de la banda.
  applies_to:
    profile_ids:
    - arcane-mage
  source:
