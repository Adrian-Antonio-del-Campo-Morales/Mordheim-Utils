- id: band--secret-society
  name: Secret Society
  effect: The warband may not hire a Hired Sword or Dramatis Personae with Spellcaster except the Elf Mage and Nicodemus;
    it may hire any other one available to Human Mercenary warbands.
  name_i18n:
    en: Secret Society
    es: null
