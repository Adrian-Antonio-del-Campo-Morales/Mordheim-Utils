      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, or non-duel context.'
- id: arcane-aspirant--aspirant
  name: Aspirant
  effect: If an Aspirant gains The Lad's Got Talent and becomes a Hero, it gains Spellcaster and replaces
    that first advance with one random spell from a chosen Elemental Art or Lesser Magic.
  name_i18n:
    en: Aspirant
    es: Aspirante
  effect_i18n:
    en: If an Aspirant gains The Lad's Got Talent and becomes a Hero, it gains Spellcaster and replaces
      that first advance with one random spell from a chosen Elemental Art or Lesser Magic.
    es: Si un Aspirante obtiene 'El mozo tiene talento' y se convierte en Héroe, gana Lanzador de hechizos
      y sustituye esa primera mejora por un hechizo aleatorio de un Arte Elemental elegido o de Magia
      Menor.
  applies_to:
    profile_ids:
    - arcane-aspirant
  source:
    manual: chaos-in-the-streets
    printed_page: 171
    section: Henchmen / 0-5 Arcane Aspirants / Aspirant
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.chaos-streets-arcane-society.arcane-aspirant.aspirant
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, or non-duel context.'
- id: arcane-assistant--prove-your-talent
  name: Prove Your Talent!
  effect: The first time an Assistant rolls The Lad's Got Talent, it may remain a Henchman and gain Aspirant;
    it may later roll that result a second time and become a spellcaster Hero through Aspirant.
  name_i18n:
    en: Prove Your Talent!
    es: ¡Demuestra tu talento!
  effect_i18n:
    en: The first time an Assistant rolls The Lad's Got Talent, it may remain a Henchman and gain Aspirant;
      it may later roll that result a second time and become a spellcaster Hero through Aspirant.
    es: La primera vez que un Asistente saca 'El mozo tiene talento', puede permanecer como secuaz y ganar
      Aspirante; más adelante puede sacar ese resultado una segunda vez y convertirse en un Héroe lanzador
      de hechizos a través de Aspirante.
  applies_to:
    profile_ids:
    - arcane-assistant
  source:
    manual: chaos-in-the-streets
    printed_page: 171
    section: Henchmen / Arcane Assistants / Prove Your Talent!
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.chaos-streets-arcane-society.arcane-assistant.prove-your-talent
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, or non-duel context.'
- id: band--secret-society
  name: Secret Society
  effect: The warband may not hire a Hired Sword or Dramatis Personae with Spellcaster except the Elf
    Mage and Nicodemus; it may hire any other one available to Human Mercenary warbands.
  name_i18n:
    en: Secret Society
    es: Sociedad secreta
  effect_i18n:
    en: The warband may not hire a Hired Sword or Dramatis Personae with Spellcaster except the Elf Mage
      and Nicodemus; it may hire any other one available to Human Mercenary warbands.
    es: La banda no puede contratar ninguna Espada a Sueldo o Personaje Dramático con Lanzador de hechizos,
      salvo el Mago Elfo y Nicodemo; puede contratar cualquier otra disponible para las bandas Mercenarias
      Humanas.
  applies_to:
    band: true
  source:
    manual: chaos-in-the-streets
    printed_page: 167
    section: Special Rules / Secret Society
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.chaos-streets-arcane-society.band.secret-society
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: no effect applies to the isolated 1v1 duel or legal fighter skill/equipment
