- id: arcane-bodyguard--not-leader
  name: Not a Leader
  effect: An Arcane Bodyguard may never become the warband leader, and no other model may use the Bodyguard's
    Leadership.
  name_i18n:
    en: Not a Leader
    es: No es líder
  effect_i18n:
    en: An Arcane Bodyguard may never become the warband leader
    and no other model may use the Bodyguard's Leadership.: null
    es: Un Guardaespaldas Arcano jamás puede convertirse en el líder de la banda y ningún otro modelo
      puede usar el Liderazgo del Guardaespaldas.
  applies_to:
