- id: arcane-bodyguard--bodyguard
  name: Bodyguard
  effect: While within 2" of an Arcane Society spellcaster and not engaged in close combat, the Bodyguard may intercept shooting
    attacks and charges directed at that spellcaster, moving as required.
  name_i18n:
    en: Bodyguard
    es: null
