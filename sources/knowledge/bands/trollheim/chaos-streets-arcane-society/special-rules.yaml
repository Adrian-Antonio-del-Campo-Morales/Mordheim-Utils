- id: arcane-bodyguard--bodyguard
  name: Bodyguard
  effect: While within 2" of an Arcane Society spellcaster and not engaged in close combat, the Bodyguard
    may intercept shooting attacks and charges directed at that spellcaster, moving as required.
  name_i18n:
    en: Bodyguard
    es: Guardaespaldas
  effect_i18n:
    en: While within 2" of an Arcane Society spellcaster and not engaged in close combat, the Bodyguard
      may intercept shooting attacks and charges directed at that spellcaster, moving as required.
    es: Mientras esté a 2" de un lanzador de hechizos de la Sociedad Arcana y no esté empeñado en combate
      cuerpo a cuerpo, el Guardaespaldas puede interceptar ataques de disparo y cargas dirigidas a ese
      lanzador de hechizos, moviéndose según sea necesario.
  applies_to:
    profile_ids:
    - arcane-bodyguard
  source:
    manual: chaos-in-the-streets
    printed_page: 170
    section: Heroes / 0-2 Arcane Bodyguards / Bodyguard
  runtime:
    scope: 'NO'
    implemented: 'NO'
