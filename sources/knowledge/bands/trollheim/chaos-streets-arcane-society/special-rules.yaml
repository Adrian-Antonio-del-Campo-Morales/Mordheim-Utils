- id: arcane-aspirant--aspirant
  name: Aspirant
  effect: If an Aspirant gains The Lad's Got Talent and becomes a Hero, it gains Spellcaster and replaces that first advance
    with one random spell from a chosen Elemental Art or Lesser Magic.
  name_i18n:
    en: Aspirant
    es: null
