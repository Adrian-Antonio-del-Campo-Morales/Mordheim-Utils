- id: arcane-assistant--prove-your-talent
  name: Prove Your Talent!
  effect: The first time an Assistant rolls The Lad's Got Talent, it may remain a Henchman and gain Aspirant; it may later
    roll that result a second time and become a spellcaster Hero through Aspirant.
  name_i18n:
    en: Prove Your Talent!
    es: null
  effect_i18n:
