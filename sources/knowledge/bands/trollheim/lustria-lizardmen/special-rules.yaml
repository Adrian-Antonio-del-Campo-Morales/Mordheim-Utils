schema_version: 2
band_id: lustria-lizardmen
rules:
- id: skink-priest--leader
  name: Leader
  effect: Any warband model within 6" of the Skink Priest may use his Leadership instead of its own. If
    the Skink Priest is destroyed, a new Skink Priest may be recruited only after the warband has played
    one battle without one.
  source:
    manual: lustria
    printed_page: 54
    section: Heroes / 1 Skink Priest / Leader
  name_i18n:
    en: Leader
    es: Líder
  effect_i18n:
    en: Any warband model within 6" of the Skink Priest may use his Leadership instead of its own. If
      the Skink Priest is destroyed, a new Skink Priest may be recruited only after the warband has played
      one battle without one.
    es: Cualquier modelo de la banda a 6" del Sacerdote skink puede usar su Liderazgo en lugar del suyo
      propio. Si el Sacerdote skink es destruido, solo se puede reclutar un nuevo Sacerdote skink después
      de que la banda haya jugado una batalla sin él.
  applies_to:
    profile_ids:
    - skink-priest
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.lustria-lizardmen.skink-priest.leader
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology or mounts.'
- id: skink-priest--spellcaster
  name: Spellcaster
  effect: The Skink Priest is a spellcaster and may use the Ancient Psalms. The spell list and spell effects
    are intentionally not modelled in this file.
  source:
    manual: lustria
    printed_page: 54
    section: Heroes / 1 Skink Priest / Spellcaster
  name_i18n:
    en: Spellcaster
    es: Lanzador de hechizos
  effect_i18n:
    en: The Skink Priest is a spellcaster and may use the Ancient Psalms. The spell list and spell effects
      are intentionally not modelled in this file.
    es: El Sacerdote skink es un lanzador de hechizos y puede usar los Salmos antiguos. La lista de hechizos
      y sus efectos no se modelan intencionadamente en este archivo.
  applies_to:
    profile_ids:
    - skink-priest
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.lustria-lizardmen.skink-priest.spellcaster
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, magic, or non-duel context.'
