  name: Scaly Skin
  effect: Lizardmen have natural Scaly Skin saves. Strength modifiers may not reduce a Scaly Skin save beyond 6+, although
    an Injury-table result that denies armour saves also denies that 6+ Scaly Skin save. Scaly Skin may be combined with other
    armour, except Hardened Leather provides no additional bonus.
  source:
    manual: lustria
    printed_page: 53
    section: Lizardmen Special Rules / Scaly Skin
  name_i18n:
    en: Scaly Skin
    es: null
  effect_i18n:
    en: Lizardmen have natural Scaly Skin saves. Strength modifiers may not reduce a Scaly Skin save beyond 6+, although an
      Injury-table result that denies armour saves also denies that 6+ Scaly Skin save. Scaly Skin may be combined with other
      armour, except Hardened Leather provides no additional bonus.
    es: null
  applies_to:
    band: true
