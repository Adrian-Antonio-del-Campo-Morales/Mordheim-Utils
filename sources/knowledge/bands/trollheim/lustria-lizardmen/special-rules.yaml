    - id: special-rule.band--sacred-mark-venom-glands
      scope: 'YES'
      binding:
        kind: compiler
        id: special-rule.band--sacred-mark-venom-glands
  runtime_selectable: true
  name: Venom Glands
  effect: Costs 40 gc. Skink Heroes only. The Hero may make attacks with its teeth instead of its weapons; resolve them as
    Saurus Bite Attacks. These attacks give the target +1 to its armour save regardless of the Skink's Strength and gain +1
    on the Injury roll.
  source:
    manual: lustria
    printed_page: 57
    section: Sacred Marks / Venom Glands
  name_i18n:
    en: Venom Glands
    es: null
  effect_i18n:
