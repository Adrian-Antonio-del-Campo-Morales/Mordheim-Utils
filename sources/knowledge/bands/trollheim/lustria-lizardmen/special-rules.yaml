rules:
- id: skink-priest--leader
  name: Leader
  effect: Any warband model within 6" of the Skink Priest may use his Leadership instead of its own. If the Skink Priest is
    destroyed, a new Skink Priest may be recruited only after the warband has played one battle without one.
  source:
    manual: lustria
    printed_page: 54
    section: Heroes / 1 Skink Priest / Leader
  name_i18n:
    en: Leader
    es: null
  effect_i18n:
    en: Any warband model within 6" of the Skink Priest may use his Leadership instead of its own. If the Skink Priest is
      destroyed, a new Skink Priest may be recruited only after the warband has played one battle without one.
    es: null
  applies_to:
    profile_ids:
    - skink-priest
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.lustria-lizardmen.skink-priest.leader
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology or mounts.'
