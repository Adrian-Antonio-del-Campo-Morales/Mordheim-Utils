- id: band--sacred-marks
  name: Sacred Marks
  effect: A Lizardman Hero may have only one Sacred Mark. A Sacred Mark may be purchased only when that Hero is recruited,
    never later during a campaign.
  source:
    manual: lustria
    printed_page: 57
    section: Sacred Marks
  name_i18n:
    en: Sacred Marks
    es: null
  effect_i18n:
    en: A Lizardman Hero may have only one Sacred Mark. A Sacred Mark may be purchased only when that Hero is recruited, never
      later during a campaign.
    es: null
  eligibility:
  - skink-priest
  - saurus-totem-warrior
  - skink-great-crests
  applies_to:
