- id: saurus-totem-warrior--bite-attack
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: compiler.bite-attack
      scope: 'YES'
      binding:
        kind: compiler
        id: compiler.bite-attack
  name: Bite Attack
  effect: The Saurus Totem Warrior makes one additional bite attack using its own Strength to wound and
    suffers no penalty for fighting unarmed. The bite always strikes last, regardless of who charged or
    which weapons are used, and is resolved after attacks made with Great Weapons.
  source:
    manual: lustria
    printed_page: 54
    section: Heroes / 0-1 Saurus Totem Warrior / Bite Attack
  name_i18n:
    en: Bite Attack
    es: Ataque de mordisco
  effect_i18n:
    en: The Saurus Totem Warrior makes one additional bite attack using its own Strength to wound and
      suffers no penalty for fighting unarmed. The bite always strikes last, regardless of who charged
      or which weapons are used, and is resolved after attacks made with Great Weapons.
    es: El Guerrero tótem saurus realiza un ataque de mordisco adicional usando su propia Fuerza para
      herir y no sufre penalización por combatir desarmado. El mordisco siempre golpea en último lugar,
      sin importar quién cargó ni qué armas se usen, y se resuelve tras los ataques realizados con Armas
      a dos manos.
  applies_to:
    profile_ids:
    - saurus-totem-warrior
