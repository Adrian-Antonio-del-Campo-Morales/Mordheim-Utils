- id: band--scaly-skin
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: band
    effects:
    - id: compiler.lizardmen-scaly-skin
      scope: 'YES'
      binding:
        kind: compiler
        id: compiler.lizardmen-scaly-skin
  name: Scaly Skin
  effect: Lizardmen have natural Scaly Skin saves. Strength modifiers may not reduce a Scaly Skin save
    beyond 6+, although an Injury-table result that denies armour saves also denies that 6+ Scaly Skin
    save. Scaly Skin may be combined with other armour, except Hardened Leather provides no additional
    bonus.
  source:
    manual: lustria
    printed_page: 53
    section: Lizardmen Special Rules / Scaly Skin
  name_i18n:
    en: Scaly Skin
    es: Piel escamosa
  effect_i18n:
    en: Lizardmen have natural Scaly Skin saves. Strength modifiers may not reduce a Scaly Skin save beyond
      6+, although an Injury-table result that denies armour saves also denies that 6+ Scaly Skin save.
      Scaly Skin may be combined with other armour, except Hardened Leather provides no additional bonus.
    es: Los Hombres lagarto tienen salvaciones naturales de Piel escamosa. Los modificadores de Fuerza
      no pueden reducir una salvación de Piel escamosa por debajo de 6+, aunque un resultado de la tabla
      de Heridas que niegue las salvaciones por armadura también niega esa salvación de Piel escamosa
      de 6+. La Piel escamosa puede combinarse con otra armadura, salvo que el Cuero curtido no proporciona
      bono adicional.
  applies_to:
    band: true
- id: band--cold-blooded
  name: Cold-Blooded
  effect: When taking a Rout test or any other Psychology test, roll 3D6 and keep the two lowest results.
    The warband may never use the Leadership of a Saurus or Kroxigor when taking a Rout test.
  source:
    manual: lustria
    printed_page: 53
    section: Lizardmen Special Rules / Cold-Blooded
  name_i18n:
    en: Cold-Blooded
    es: Sangre fría
  effect_i18n:
    en: When taking a Rout test or any other Psychology test, roll 3D6 and keep the two lowest results.
      The warband may never use the Leadership of a Saurus or Kroxigor when taking a Rout test.
    es: Al realizar un chequeo de Retirada o cualquier otro chequeo de Psicología, tira 3D6 y conserva
      los dos resultados más bajos. La banda nunca puede usar el Liderazgo de un Saurus o un Kroxigor
      al realizar un chequeo de Retirada.
  applies_to:
    band: true
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.lustria-lizardmen.band.cold-blooded
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology or mounts.'
