      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, or non-duel context.'
- id: band--warrior-priest-death
  name: Death of the Warrior Priest
  effect: If the Warrior Priest dies, the Initiate with the most Experience takes the leader's place.
    That model changes its warrior type to Warrior Priest and gains the Warrior Priest's base rules, including
    Leader and Prayers of Sigmar. It does not immediately learn a Prayer. The next time it gains an advance,
    it may forgo the normal advance roll and instead roll directly on the Prayers of Sigmar table. Once
    the replacement has occurred, the warband may recruit another Initiate to fill the vacant slot.
  source:
    manual: chaos-in-the-streets
    printed_page: 150
    section: Special Rules / Death of the Warrior Priest
  name_i18n:
    en: Death of the Warrior Priest
    es: Muerte del Sacerdote Guerrero
  effect_i18n:
    en: If the Warrior Priest dies, the Initiate with the most Experience takes the leader's place. That
      model changes its warrior type to Warrior Priest and gains the Warrior Priest's base rules, including
      Leader and Prayers of Sigmar. It does not immediately learn a Prayer. The next time it gains an
      advance, it may forgo the normal advance roll and instead roll directly on the Prayers of Sigmar
      table. Once the replacement has occurred, the warband may recruit another Initiate to fill the vacant
      slot.
    es: Si el Sacerdote Guerrero muere, el Iniciado con más Experiencia ocupa el lugar del líder. Ese
      modelo cambia su tipo de guerrero a Sacerdote Guerrero y gana las reglas base del Sacerdote Guerrero,
      incluidas Líder y Oraciones de Sigmar. No aprende inmediatamente una Oración. La próxima vez que
      gane una mejora, puede renunciar a la tirada de mejora normal y tirar en su lugar directamente en
      la tabla de Oraciones de Sigmar. Una vez producido el reemplazo, la banda puede reclutar otro Iniciado
      para cubrir la plaza vacante.
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.chaos-streets-sigmar-protectorate.band.warrior-priest-death
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, or non-duel context.'
- id: band--ranger-templar-limit
  name: Ranger and Templar Limit
  effect: If the warband includes a Ranger, it may include no more than one Templar.
  source:
    manual: chaos-in-the-streets
    printed_page: 150
    section: Choice of Warriors / Ranger and Templars
  name_i18n:
    en: Ranger and Templar Limit
    es: Límite de Guardabosques y Templarios
  effect_i18n:
    en: If the warband includes a Ranger, it may include no more than one Templar.
    es: Si la banda incluye un Guardabosques, no puede incluir más de un Templario.
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.chaos-streets-sigmar-protectorate.band.ranger-templar-limit
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, or non-duel context.'
- id: band--protectorate-special-skills-protection-of-sigmar
  kind: warband_skill
  name: Protection of Sigmar
  effect: Any spell cast against the Hero is dispelled on a D6 roll of 4+. If the spell is dispelled,
    it does not affect any other model either.
  source:
    manual: chaos-in-the-streets
    printed_page: 153
    section: Sigmar's Protectorate Special Skills / Protection of Sigmar
  name_i18n:
    en: Protection of Sigmar
    es: Protección de Sigmar
  effect_i18n:
    en: Any spell cast against the Hero is dispelled on a D6 roll of 4+. If the spell is dispelled, it
      does not affect any other model either.
    es: Cualquier hechizo lanzado contra el Héroe se disipa con una tirada de 4+ en 1D6. Si el hechizo
      se disipa, tampoco afecta a ningún otro modelo.
  eligibility:
  - warrior-priest
  - templar
  - initiate
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.chaos-streets-sigmar-protectorate.band.protectorate-special-skills-protection-of-sigmar
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, or non-duel context.'
- id: band--protectorate-special-skills-absolute-faith
  kind: warband_skill
  name: Absolute Faith
  effect: The Hero may re-roll failed Fear tests and does not need to take a test for being engaged by
    multiple opponents.
  source:
    manual: chaos-in-the-streets
    printed_page: 153
    section: Sigmar's Protectorate Special Skills / Absolute Faith
  name_i18n:
    en: Absolute Faith
    es: Fe absoluta
  effect_i18n:
    en: The Hero may re-roll failed Fear tests and does not need to take a test for being engaged by multiple
      opponents.
    es: El Héroe puede repetir los chequeos de Miedo fallados y no necesita hacer un chequeo por estar
      empeñado con múltiples oponentes.
  eligibility:
  - warrior-priest
  - templar
  - initiate
  applies_to:
    band: true
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.chaos-streets-sigmar-protectorate.band.protectorate-special-skills-absolute-faith
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology or mounts.'
- id: band--protectorate-special-skills-absolute-determination
  kind: warband_skill
  name: Absolute Determination
  effect: Warrior Priest only. The Warrior Priest may re-roll failed Rout tests.
  source:
    manual: chaos-in-the-streets
    printed_page: 153
    section: Sigmar's Protectorate Special Skills / Absolute Determination
  name_i18n:
    en: Absolute Determination
    es: Determinación absoluta
  effect_i18n:
    en: Warrior Priest only. The Warrior Priest may re-roll failed Rout tests.
    es: Solo Sacerdote Guerrero. El Sacerdote Guerrero puede repetir los chequeos de huida fallados.
  eligibility:
  - warrior-priest
  applies_to:
    band: true
  runtime:
    scope: LATER
    implemented: 'NO'
