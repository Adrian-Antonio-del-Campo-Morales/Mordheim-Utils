- id: band--warrior-priest-death
  name: Death of the Warrior Priest
  effect: If the Warrior Priest dies, the Initiate with the most Experience takes the leader's place. That model changes its
    warrior type to Warrior Priest and gains the Warrior Priest's base rules, including Leader and Prayers of Sigmar. It does
    not immediately learn a Prayer. The next time it gains an advance, it may forgo the normal advance roll and instead roll
    directly on the Prayers of Sigmar table. Once the replacement has occurred, the warband may recruit another Initiate to
    fill the vacant slot.
  source:
    manual: chaos-in-the-streets
    printed_page: 150
    section: Special Rules / Death of the Warrior Priest
  name_i18n:
    en: Death of the Warrior Priest
    es: null
  effect_i18n:
    en: If the Warrior Priest dies, the Initiate with the most Experience takes the leader's place. That model changes its
      warrior type to Warrior Priest and gains the Warrior Priest's base rules, including Leader and Prayers of Sigmar. It
      does not immediately learn a Prayer. The next time it gains an advance, it may forgo the normal advance roll and instead
      roll directly on the Prayers of Sigmar table. Once the replacement has occurred, the warband may recruit another Initiate
      to fill the vacant slot.
    es: null
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
