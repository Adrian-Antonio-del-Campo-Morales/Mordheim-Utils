- id: band--protectorate-special-skills-rousing-sermon
  kind: warband_skill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: skill.inspiring-sermon
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.inspiring-sermon
  name: Rousing Sermon
  effect: 'Warrior Priest only. At the start of the Protectorate player''s turn, the Warrior Priest may declare a Rousing
    Sermon. He may not use Prayers that turn. The effect is automatic: the Warrior Priest and all friendly models within 6"
    gain +1 Attack for that turn.'
  source:
    manual: chaos-in-the-streets
    printed_page: 153
    section: Sigmar's Protectorate Special Skills / Rousing Sermon
  name_i18n:
    en: Rousing Sermon
