    printed_page: 155
    section: Henchmen / 0-5 Mastiffs / Animal
  name_i18n:
    en: Animal
    es: Animales
  effect_i18n:
    en: Mastiffs are animals and never gain Experience.
    es: Los Mastines son animales y nunca ganan Experiencia.
  applies_to:
