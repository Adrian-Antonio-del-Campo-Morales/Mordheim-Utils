schema_version: 2
band_id: chaos-streets-sigmar-protectorate
rules:
- id: warrior-priest--leader
  name: Leader
  effect: Any warband model within 6" of the Warrior Priest may use his Leadership when taking Leadership
    tests.
  source:
    manual: chaos-in-the-streets
    printed_page: 153
    section: Heroes / 1 Warrior Priest / Leader
  name_i18n:
    en: Leader
    es: Líder
  effect_i18n:
    en: Any warband model within 6" of the Warrior Priest may use his Leadership when taking Leadership
      tests.
    es: Cualquier modelo de la banda a 6" del Sacerdote Guerrero puede usar su Liderazgo cuando realice
      chequeos de Liderazgo.
  applies_to:
    profile_ids:
    - warrior-priest
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.chaos-streets-sigmar-protectorate.warrior-priest.leader
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology or mounts.'
- id: warrior-priest--prayers-of-sigmar
  name: Prayers of Sigmar
  effect: The Warrior Priest may use the Prayers of Sigmar. The prayer list and prayer effects are intentionally
    not modelled in this file.
  source:
    manual: chaos-in-the-streets
    printed_page: 153
    section: Heroes / 1 Warrior Priest / Prayers
  name_i18n:
    en: Prayers of Sigmar
    es: Oraciones de Sigmar
  effect_i18n:
    en: The Warrior Priest may use the Prayers of Sigmar. The prayer list and prayer effects are intentionally
      not modelled in this file.
    es: El Sacerdote Guerrero puede usar las Oraciones de Sigmar. La lista de oraciones y los efectos
      de las oraciones no están modelados intencionadamente en este archivo.
  applies_to:
    profile_ids:
    - warrior-priest
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.chaos-streets-sigmar-protectorate.warrior-priest.prayers-of-sigmar
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, or non-duel context.'
- id: ranger--animal-tamer
  name: Animal Tamer
  effect: Any animal in the warband within 6" of the Ranger may use his Leadership. Any animal attempting
    to charge the Ranger must first pass a Leadership test.
  source:
    manual: chaos-in-the-streets
    printed_page: 154
    section: Heroes / 0-1 Ranger / Animal Tamer
  name_i18n:
    en: Animal Tamer
    es: Domador
  effect_i18n:
    en: Any animal in the warband within 6" of the Ranger may use his Leadership. Any animal attempting
      to charge the Ranger must first pass a Leadership test.
    es: Cualquier animal de la banda a 6" del Guardabosques puede usar su Liderazgo. Cualquier animal
      que intente cargar contra el Guardabosques debe superar primero un chequeo de Liderazgo.
  applies_to:
    profile_ids:
    - ranger
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.chaos-streets-sigmar-protectorate.ranger.animal-tamer
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology or mounts.'
- id: templar--devout
  name: Devout
  effect: Templars are subject to Hatred against every model belonging to a Chaotic warband. The source
    explicitly includes Skaven, Possessed, Carnival of Chaos, Beastmen and any warband containing a Daemon.
  source:
    manual: chaos-in-the-streets
    printed_page: 154
    section: Heroes / 0-2 Templars / Devout
  name_i18n:
    en: Devout
    es: Devoto
  effect_i18n:
    en: Templars are subject to Hatred against every model belonging to a Chaotic warband. The source
      explicitly includes Skaven, Possessed, Carnival of Chaos, Beastmen and any warband containing a
      Daemon.
    es: Los Templarios están sujetos a Odio contra todo modelo perteneciente a una banda Caótica. La fuente
      incluye explícitamente a los Skaven, Poseídos, Carnaval del Caos, Beastmen y cualquier banda que
      contenga un Demonio.
  applies_to:
    profile_ids:
    - templar
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.chaos-streets-sigmar-protectorate.templar.devout
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology or mounts.'
- id: protectorate-mastiff--animal
  name: Animal
  effect: Mastiffs are animals and never gain Experience.
  source:
