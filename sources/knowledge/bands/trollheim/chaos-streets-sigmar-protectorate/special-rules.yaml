- id: band--protectorate-special-skills-rousing-sermon
  kind: warband_skill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: skill.inspiring-sermon
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.inspiring-sermon
  name: Rousing Sermon
  effect: >-
    Warrior Priest only. At the start of the Protectorate player's turn, the Warrior Priest may
    declare a Rousing Sermon. He may not use Prayers that turn. The effect is automatic: the Warrior
    Priest and all friendly models within 6" gain +1 Attack for that turn.
  source:
    manual: chaos-in-the-streets
    printed_page: 153
    section: Sigmar's Protectorate Special Skills / Rousing Sermon
  name_i18n:
    en: Rousing Sermon
    es: Sermón enardecedor
  effect_i18n:
    en: 'Warrior Priest only. At the start of the Protectorate player''s turn, the Warrior Priest may
      declare a Rousing Sermon. He may not use Prayers that turn. The effect is automatic: the Warrior
      Priest and all friendly models within 6" gain +1 Attack for that turn.'
    es: 'Solo Sacerdote Guerrero. Al inicio del turno del jugador del Protectorado, el Sacerdote Guerrero
      puede declarar un Sermón enardecedor. No puede usar Oraciones ese asalto. El efecto es automático:
      el Sacerdote Guerrero y todos los modelos amigos a 6" ganan +1 Ataque durante ese asalto.'
  eligibility:
  - warrior-priest
  applies_to:
    band: true
- id: band--protectorate-special-skills-guidance-of-sigmar
  kind: warband_skill
  name: Guidance of Sigmar
  effect: When using missile weapons, the Hero may freely choose a target and ignore the normal requirement
    to shoot at the nearest enemy.
  source:
    manual: chaos-in-the-streets
    printed_page: 153
    section: Sigmar's Protectorate Special Skills / Guidance of Sigmar
  name_i18n:
    en: Guidance of Sigmar
    es: Guía de Sigmar
  effect_i18n:
    en: When using missile weapons, the Hero may freely choose a target and ignore the normal requirement
      to shoot at the nearest enemy.
    es: Al usar armas de misil, el Héroe puede elegir libremente un objetivo e ignorar el requisito normal
      de disparar al enemigo más cercano.
  eligibility:
  - warrior-priest
  - templar
  - initiate
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
