      scroll list and its effects are intentionally not modelled in this file.
    es: El Sacerdote funerario es un lanzador de hechizos y puede usar los pergaminos de los Sacerdotes
      funerarios. La lista de pergaminos y sus efectos no se modelan intencionadamente en este archivo.
  applies_to:
    profile_ids:
