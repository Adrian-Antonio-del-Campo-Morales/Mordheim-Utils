      scope: 'YES'
      binding:
        kind: trait
        id: trait.flammable
        parameters:
          value: true
  name: Flammable
  effect: A fire-based attack that wounds the Tomb Lord causes double the normal number of Wounds.
  source:
    manual: khemri
    printed_page: 43
    section: Undead Special Rules / Flammable
  name_i18n:
    en: Flammable
    es: Inflamable
  effect_i18n:
