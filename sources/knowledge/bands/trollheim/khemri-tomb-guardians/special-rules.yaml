band_id: khemri-tomb-guardians
rules:
- id: tomb-lord--leader
  name: Leader
  effect: Any warband model within 6" of the Tomb Lord may use his Leadership instead of its own.
  source:
    manual: khemri
    printed_page: 44
    section: Heroes / 1 Tomb Lord / Leader
  name_i18n:
    en: Leader
    es: Líder
  effect_i18n:
    en: Any warband model within 6" of the Tomb Lord may use his Leadership instead of its own.
    es: Cualquier modelo de la banda a 6" del Señor de la tumba puede usar su Liderazgo en lugar del suyo
      propio.
  applies_to:
    profile_ids:
    - tomb-lord
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.khemri-tomb-guardians.tomb-lord.leader
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology or mounts.'
