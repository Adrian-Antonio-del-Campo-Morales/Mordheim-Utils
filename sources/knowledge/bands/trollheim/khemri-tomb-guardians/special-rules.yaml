      scope: 'YES'
      binding:
        kind: mechanic
        id: poison.black-lotus
  name: Scorpion's Sting
  effect: A Tomb Scorpion attacks with the poisonous sting in its tail. The source resolves this as though
    the attack used Black Lotus; the underlying poison-item mechanics are intentionally not duplicated
    in this file.
