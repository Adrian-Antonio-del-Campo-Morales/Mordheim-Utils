      the attack used Black Lotus; the underlying poison-item mechanics are intentionally not duplicated
      in this file.
    es: Un Escorpión de tumba ataca con el aguijón venenoso de su cola. La fuente lo resuelve como si
      el ataque usara Loto negro; la mecánica subyacente del objeto venenoso no se duplica intencionadamente
      en este archivo.
