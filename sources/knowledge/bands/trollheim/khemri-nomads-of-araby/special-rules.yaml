schema_version: 2
band_id: khemri-nomads-of-araby
rules:
- id: sheikh--leader
  name: Leader
  effect: Any warband model within 6" of the Sheikh may use his Leadership instead of its own.
  source:
    manual: khemri
    printed_page: 50
    section: Heroes / 1 Sheikh / Leader
  name_i18n:
    es: Líder
  effect_i18n:
    es: >-
      Cualquier modelo de la banda a 6" del Jeque puede usar su Liderazgo en lugar del suyo propio.
  applies_to:
    profile_ids:
    - sheikh
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.khemri-nomads-of-araby.sheikh.leader
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: psychology or mounts.
- id: mystic--wizard
  name: Wizard
  effect: >-
    The Desert Mystic is a Wizard and begins with one randomly generated spell from the Art of the
    Djinn. The spell list and spell effects are intentionally not modelled in this file.
  source:
    manual: khemri
    printed_page: 50
    section: Heroes / 0-1 Desert Mystic / Wizard
  name_i18n:
    es: Mago
  effect_i18n:
    es: >-
      El Místico del Desierto es un hechicero y comienza con un hechizo generado aleatoriamente del
      Arte del Djinn. La lista de hechizos y los efectos de los hechizos no están modelados
      intencionadamente en este archivo.
  applies_to:
    profile_ids:
    - mystic
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.khemri-nomads-of-araby.mystic.wizard
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: campaign, shooting, movement, terrain, deployment, magic, or non-duel context.
- id: bedouin--desert-trader
  name: Desert Trader
  effect: >-
    Add +1 to the Resupply Table after a battle. This bonus is capped at +1 even if the warband
    includes two Bedouins.
  source:
    manual: khemri
    printed_page: 51
    section: Henchmen / 0-2 Bedouins / Desert Trader
  name_i18n:
    es: Comerciante del Desierto
  effect_i18n:
    es: >-
      Suma +1 a la Tabla de Avituallamiento tras una batalla. Este bonificador se limita a +1
      incluso si la banda incluye dos Beduinos.
  applies_to:
    profile_ids:
    - bedouin
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.khemri-nomads-of-araby.bedouin.desert-trader
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: campaign, shooting, movement, terrain, deployment, magic, or non-duel context.
- id: slaves--life-of-slavery
  name: Life of Slavery
  effect: >-
    Slaves gain Experience normally. If a Slave Henchman group rolls The Lad's Got Talent, one model
    from that group is sold and removed from the roster, the warband receives 15 gc, and the rest of
    the group may roll again to determine its advance.
  source:
    manual: khemri
    printed_page: 51
    section: Henchmen / 0-5 Slaves / Life of Slavery
  name_i18n:
    es: Vida de Esclavitud
  effect_i18n:
    es: >-
      Los Esclavos ganan Experiencia con normalidad. Si un grupo de secuaces Esclavos saca 'El mozo
      tiene talento', se vende un modelo de ese grupo y se retira de la lista, la banda recibe 15
      coronas, y el resto del grupo puede volver a tirar para determinar su mejora.
  applies_to:
    profile_ids:
    - slaves
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.khemri-nomads-of-araby.slaves.life-of-slavery
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: campaign, shooting, movement, terrain, deployment, magic, or non-duel context.
- id: band--hate-undead
  name: Hate Undead
  effect: The entire warband is subject to Hatred against Undead.
  source:
    manual: khemri
    printed_page: 48
    section: Special Rules / Hate Undead
  name_i18n:
    es: Odio a los No-Muertos
  effect_i18n:
    es: Toda la banda está sujeta a Odio contra los No-muertos.
  applies_to:
    band: true
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.khemri-nomads-of-araby.band.hate-undead
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: psychology or mounts.
- id: band--nomad-special-skills-sand-worm
  kind: warband_skill
  name: Sand Worm
  effect: >-
    The Hero may Hide in open desert ground without needing terrain or scenery to conceal the model.
    This skill cannot be used inside buildings.
  source:
    manual: khemri
    printed_page: 49
    section: Nomad Special Skills / Sand Worm
  name_i18n:
    es: Gusano de Arena
  effect_i18n:
    es: >-
      El Héroe puede Ocultarse en terreno abierto de desierto sin necesitar terreno ni decorado que
      oculte el modelo. Esta habilidad no puede usarse dentro de edificios.
  eligibility:
  - sheikh
  - champions
  - mystic
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.khemri-nomads-of-araby.band.nomad-special-skills-sand-worm
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: campaign, shooting, movement, terrain, deployment, magic, or non-duel context.
- id: band--nomad-special-skills-run-and-shoot
  kind: warband_skill
  name: Run and Shoot
  effect: >-
    The Hero may run and shoot in the same turn, suffering -2 To Hit instead of the normal -1
    modifier for moving.
  source:
    manual: khemri
    printed_page: 49
    section: Nomad Special Skills / Run and Shoot
  name_i18n:
    es: Correr y Disparar
  effect_i18n:
    es: >-
      El Héroe puede correr y disparar en el mismo asalto, sufriendo -2 para impactar en lugar del
      modificador normal de -1 por moverse.
  eligibility:
  - sheikh
  - champions
  - mystic
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.khemri-nomads-of-araby.band.nomad-special-skills-run-and-shoot
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: campaign, shooting, movement, terrain, deployment, magic, or non-duel context.
- id: band--nomad-special-skills-climate-adapted
  kind: warband_skill
  name: Climate Adapted
  effect: The Hero ignores Heat and Infernal Heat results from the weather table.
  source:
    manual: khemri
    printed_page: 49
    section: Nomad Special Skills / Climate Adapted
  name_i18n:
    es: Aclimatado
  effect_i18n:
    es: El Héroe ignora los resultados de Calor y Calor Infernal de la tabla meteorológica.
  eligibility:
  - sheikh
  - champions
  - mystic
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.khemri-nomads-of-araby.band.nomad-special-skills-climate-adapted
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: campaign, shooting, movement, terrain, deployment, magic, or non-duel context.
- id: band--nomad-special-skills-contacts
  kind: warband_skill
  name: Contacts
  effect: >-
    When searching for rare items among merchants in an oasis, the Hero gains +1 on the roll to find
    those items.
  source:
    manual: khemri
    printed_page: 49
    section: Nomad Special Skills / Contacts
  name_i18n:
    es: Contactos
  effect_i18n:
    es: >-
      Al buscar objetos raros entre los mercaderes de un oasis, el Héroe obtiene +1 en la tirada
      para encontrar esos objetos.
  eligibility:
  - sheikh
  - champions
  - mystic
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.khemri-nomads-of-araby.band.nomad-special-skills-contacts
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: campaign, shooting, movement, terrain, deployment, magic, or non-duel context.
