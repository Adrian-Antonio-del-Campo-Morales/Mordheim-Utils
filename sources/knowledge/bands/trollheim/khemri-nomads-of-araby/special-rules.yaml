- id: band--nomad-special-skills-contacts
  kind: warband_skill
  name: Contacts
  effect: When searching for rare items among merchants in an oasis, the Hero gains +1 on the roll to
    find those items.
  source:
    manual: khemri
    printed_page: 49
    section: Nomad Special Skills / Contacts
  name_i18n:
    en: Contacts
    es: Contactos
  effect_i18n:
    en: When searching for rare items among merchants in an oasis, the Hero gains +1 on the roll to find
      those items.
    es: Al buscar objetos raros entre los mercaderes de un oasis, el Héroe obtiene +1 en la tirada para
      encontrar esos objetos.
