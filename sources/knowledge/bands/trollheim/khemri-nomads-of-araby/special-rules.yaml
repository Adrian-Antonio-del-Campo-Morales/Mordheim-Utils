- id: slaves--life-of-slavery
  name: Life of Slavery
  effect: Slaves gain Experience normally. If a Slave Henchman group rolls The Lad's Got Talent, one model from that group
    is sold and removed from the roster, the warband receives 15 gc, and the rest of the group may roll again to determine
    its advance.
  source:
    manual: khemri
    printed_page: 51
    section: Henchmen / 0-5 Slaves / Life of Slavery
  name_i18n:
    en: Life of Slavery
    es: null
