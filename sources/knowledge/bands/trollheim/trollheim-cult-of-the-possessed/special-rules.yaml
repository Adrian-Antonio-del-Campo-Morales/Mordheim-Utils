- id: the-possessed--mutations
  name: Mutations
  effect: When recruited, each Possessed may begin with one or two Mutations, with their costs added to recruitment. Mutations
    may not be added to that model later.
  source:
    manual: trollheim
    printed_page: 74
    section: Heroes / 0-2 The Possessed / Mutations
  name_i18n:
    en: Mutations
    es: null
  effect_i18n:
