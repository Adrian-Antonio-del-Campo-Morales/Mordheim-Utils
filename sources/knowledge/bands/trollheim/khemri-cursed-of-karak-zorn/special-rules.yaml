- id: band--karak-zorn-special-skills-very-tough
  kind: warband_skill
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.khemri-cursed-of-karak-zorn.band.karak-zorn-special-skills.very-tough
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: this rule only re-rolls a post-battle Serious Injury result.
  name: Very Tough
  effect: >-
    When rolling on the Serious Injury table for this Hero after a battle, the roll may be re-rolled
    once. The second result must be accepted even if it is worse.
  source:
    manual: khemri
    printed_page: 66
    section: Karak-Zorn Special Skills / Very Tough
  name_i18n:
    es: Muy Resistente
  effect_i18n:
    es: >-
      Al tirar en la tabla de Heridas Graves para este Héroe tras una batalla, la tirada puede
      repetirse una vez. Debe aceptarse el segundo resultado aunque sea peor.
  eligibility:
  - karak-zorn-noble
  - priest-of-grungni
  - longbeard
  - troll-slayer
  applies_to:
    band: true
