      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.monster-slayer-effective-strength-armour
  name: Monster Slayer
  effect: The Troll Slayer wounds any opponent on 4+ regardless of Toughness, unless his modified Strength
    would normally wound on a lower result. If this rule effectively increases the Strength needed to
    obtain a 4+ wound roll, use that effective Strength when calculating the armour-save modifier.
  source:
    manual: khemri
    printed_page: 67
    section: Troll Slayer Special Skills / Monster Slayer
  name_i18n:
    en: Monster Slayer
    es: Matamostro
  effect_i18n:
    en: The Troll Slayer wounds any opponent on 4+ regardless of Toughness, unless his modified Strength
      would normally wound on a lower result. If this rule effectively increases the Strength needed to
      obtain a 4+ wound roll, use that effective Strength when calculating the armour-save modifier.
    es: El Matatrolles hiere a cualquier oponente con 4+ sin importar la Resistencia, a menos que su Fuerza
      modificada normalmente hiera con un resultado menor. Si esta regla aumenta efectivamente la Fuerza
      necesaria para obtener una tirada de herir de 4+, usa esa Fuerza efectiva al calcular el modificador
      de tirada de salvación por armadura.
  eligibility:
  - troll-slayer
  applies_to:
    band: true
