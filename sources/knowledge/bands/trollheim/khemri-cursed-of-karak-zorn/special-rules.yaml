- id: band--karak-zorn-special-skills-magic-resistant
  kind: warband_skill
  name: Magic Resistant
  effect: Whenever this Hero would be affected by a spell, conjuration, scroll, prayer or similar magical
    effect, roll D6; on 4+ the Hero ignores that effect.
  source:
    manual: khemri
    printed_page: 66
    section: Karak-Zorn Special Skills / Magic Resistant
  name_i18n:
    en: Magic Resistant
    es: Resistente a la magia
  effect_i18n:
    en: Whenever this Hero would be affected by a spell, conjuration, scroll, prayer or similar magical
      effect, roll D6; on 4+ the Hero ignores that effect.
    es: Siempre que este Héroe vaya a ser afectado por un hechizo, conjuro, pergamino, plegaria o efecto
      mágico similar, tira 1D6; con 4+ el Héroe ignora ese efecto.
  eligibility:
  - karak-zorn-noble
  - priest-of-grungni
  - longbeard
  - troll-slayer
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.khemri-cursed-of-karak-zorn.band.karak-zorn-special-skills-magic-resistant
