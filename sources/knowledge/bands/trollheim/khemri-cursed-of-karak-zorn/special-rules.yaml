- id: karak-zorn-noble--leader
  name: Leader
  effect: Any warband model within 6" of the Karak-Zorn Noble may use his Leadership instead of its own.
  source:
    manual: khemri
    printed_page: 68
    section: Heroes / 1 Karak-Zorn Noble / Leader
  name_i18n:
    en: Leader
    es: Líder
  effect_i18n:
    en: Any warband model within 6" of the Karak-Zorn Noble may use his Leadership instead of its own.
    es: Cualquier modelo de la banda a 6" del Noble de Karak-Zorn puede usar su Liderazgo en lugar del
      suyo propio.
  applies_to:
    profile_ids:
    - karak-zorn-noble
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
