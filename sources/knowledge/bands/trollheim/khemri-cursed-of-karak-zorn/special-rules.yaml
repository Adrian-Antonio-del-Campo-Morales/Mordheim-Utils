- id: shadowed--immune-to-psychology
  name: Immune to Psychology
  effect: Shadowed are immune to Psychology and never leave combat because of Psychology.
  source:
    manual: khemri
    printed_page: 69
    section: Henchmen / 1-5 Shadowed / Immune to Psychology
  name_i18n:
    es: Inmune a la Psicología
  effect_i18n:
    es: >-
      Los Ensombrecidos son inmunes a la Psicología y nunca abandonan el combate a causa de la
      Psicología.
  applies_to:
    profile_ids:
