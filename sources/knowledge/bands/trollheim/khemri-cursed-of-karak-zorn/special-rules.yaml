- id: band--troll-slayer-special-skills-ferocious-charge
  kind: warband_skill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: skill.ferocious-charge
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.ferocious-charge
  name: Ferocious Charge
  effect: >-
    The Troll Slayer may double his Attacks during the turn he charges, but suffers -1 To Hit during
    that turn.
  source:
    manual: khemri
    printed_page: 67
    section: Troll Slayer Special Skills / Ferocious Charge
  name_i18n:
    es: Carga Feroz
  effect_i18n:
    es: >-
      El Matatrolles puede doblar sus Ataques durante el turno en el que carga, pero sufre -1 por
      Golpear ese turno.
  eligibility:
  - troll-slayer
  applies_to:
    band: true
- id: band--troll-slayer-special-skills-berserker
  kind: warband_skill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: skill.berserker
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.berserker
  name: Berserker
  effect: The Troll Slayer gains +1 To Hit during the turn he charges.
  source:
    manual: khemri
    printed_page: 67
    section: Troll Slayer Special Skills / Berserker
  name_i18n:
    es: Berserker
  effect_i18n:
    es: El Matatrolles gana +1 por Golpear durante el turno en el que carga.
  eligibility:
  - troll-slayer
  applies_to:
    band: true
- id: band--troll-slayer-special-skills-monster-slayer
  kind: warband_skill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: skill.monster-slayer
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.monster-slayer
    - id: skill.monster-slayer-effective-strength-armour
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.monster-slayer-effective-strength-armour
  name: Monster Slayer
  effect: >-
    The Troll Slayer wounds any opponent on 4+ regardless of Toughness, unless his modified Strength
    would normally wound on a lower result. If this rule effectively increases the Strength needed
    to obtain a 4+ wound roll, use that effective Strength when calculating the armour-save
    modifier.
  source:
    manual: khemri
    printed_page: 67
    section: Troll Slayer Special Skills / Monster Slayer
  name_i18n:
    es: Matamostro
  effect_i18n:
    es: >-
      El Matatrolles hiere a cualquier oponente con 4+ sin importar la Resistencia, a menos que su
      Fuerza modificada normalmente hiera con un resultado menor. Si esta regla aumenta
      efectivamente la Fuerza necesaria para obtener una tirada de herir de 4+, usa esa Fuerza
      efectiva al calcular el modificador de tirada de salvación por armadura.
  eligibility:
  - troll-slayer
  applies_to:
    band: true
