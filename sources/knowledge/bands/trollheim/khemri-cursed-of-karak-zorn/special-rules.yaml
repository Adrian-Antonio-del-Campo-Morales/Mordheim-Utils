    manual: khemri
    printed_page: 68
    section: Heroes / 0-1 Troll Slayer / Death Oath
  name_i18n:
    en: Death Oath
    es: Juramento de muerte
  effect_i18n:
    en: The Troll Slayer is completely immune to Psychology and does not need to take tests for fighting
      alone.
    es: El Matatrolles es completamente inmune a la Psicología y no necesita realizar chequeos por combatir
