- id: band--karak-zorn-special-skills-magic-resistant
  kind: warband_skill
  name: Magic Resistant
  effect: >-
    Whenever this Hero would be affected by a spell, conjuration, scroll, prayer or similar magical
    effect, roll D6; on 4+ the Hero ignores that effect.
  source:
    manual: khemri
    printed_page: 66
    section: Karak-Zorn Special Skills / Magic Resistant
  name_i18n:
    es: Resistente a la Magia
  effect_i18n:
    es: >-
      Siempre que este Héroe vaya a ser afectado por un hechizo, conjuro, pergamino, plegaria o
      efecto mágico similar, tira 1D6; con 4+ el Héroe ignora ese efecto.
  eligibility:
  - karak-zorn-noble
  - priest-of-grungni
  - longbeard
  - troll-slayer
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.khemri-cursed-of-karak-zorn.band.karak-zorn-special-skills-magic-resistant
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: campaign, shooting, movement, terrain, deployment, or non-duel context.
- id: band--karak-zorn-special-skills-smith
  kind: warband_skill
  name: Smith
  effect: >-
    After each battle, this Hero may buy one non-Rare weapon at half its normal price. Rare weapons
    are excluded from this skill.
  source:
    manual: khemri
    printed_page: 66
    section: Karak-Zorn Special Skills / Smith
  name_i18n:
    es: Herrero
  effect_i18n:
    es: >-
      Tras cada batalla, este Héroe puede comprar un arma no Rara a la mitad de su precio normal.
      Las armas Raras quedan excluidas de esta habilidad.
  eligibility:
  - karak-zorn-noble
  - priest-of-grungni
  - longbeard
  - troll-slayer
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.khemri-cursed-of-karak-zorn.band.karak-zorn-special-skills-smith
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: campaign, shooting, movement, terrain, deployment, or non-duel context.
- id: band--karak-zorn-special-skills-white-beard
  kind: warband_skill
  name: White Beard
  effect: Leader only. The warband may re-roll a failed Rout test.
  source:
    manual: khemri
    printed_page: 66
    section: Karak-Zorn Special Skills / White Beard
  name_i18n:
    es: Barba Blanca
  effect_i18n:
    es: Solo el Líder. La banda puede repetir un chequeo de Retirada fallado.
  eligibility:
