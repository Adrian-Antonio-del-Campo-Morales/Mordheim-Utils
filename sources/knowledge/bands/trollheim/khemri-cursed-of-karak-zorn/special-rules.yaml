- id: band--excellent-miners
  name: Excellent Miners
  effect: At the end of each battle, add +1 wyrdstone shard to the amount found through Exploration.
  source:
    manual: khemri
    printed_page: 65
    section: Special Rules / Excellent Miners
  name_i18n:
    es: Mineros Excelentes
  effect_i18n:
    es: >-
      Al final de cada batalla, añade +1 fragmento de piedra bruja a la cantidad encontrada mediante
      la Exploración.
  applies_to:
    band: true
  runtime:
    scope: 'NO'
