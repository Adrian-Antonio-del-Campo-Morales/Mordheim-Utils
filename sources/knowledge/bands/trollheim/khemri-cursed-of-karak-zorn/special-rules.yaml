schema_version: 2
band_id: khemri-cursed-of-karak-zorn
rules:
- id: karak-zorn-noble--leader
  name: Leader
  effect: >-
    Any warband model within 6" of the Karak-Zorn Noble may use his Leadership instead of its own.
  source:
    manual: khemri
    printed_page: 68
    section: Heroes / 1 Karak-Zorn Noble / Leader
  name_i18n:
    es: Líder
  effect_i18n:
    es: >-
      Cualquier modelo de la banda a 6" del Noble de Karak-Zorn puede usar su Liderazgo en lugar del
      suyo propio.
  applies_to:
    profile_ids:
    - karak-zorn-noble
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.khemri-cursed-of-karak-zorn.karak-zorn-noble.leader
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: psychology or mounts.
- id: priest-of-grungni--devout
  name: Devout
  effect: >-
    The Priest begins with one vial of Holy Water. For this Priest, Holy Water is treated as Common
    and a Holy Relic has rarity 6.
  source:
    manual: khemri
    printed_page: 68
    section: Heroes / 0-1 Priest of Grungni / Devout
  name_i18n:
    es: Devoto
  effect_i18n:
    es: >-
      El Sacerdote comienza con un vial de Agua Bendita. Para este Sacerdote, el Agua Bendita se
      trata como Común y una Reliquia Santa tiene rareza 6.
  applies_to:
    profile_ids:
    - priest-of-grungni
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.khemri-cursed-of-karak-zorn.priest-of-grungni.devout
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: campaign, shooting, movement, terrain, deployment, or non-duel context.
- id: troll-slayer--death-oath
  name: Death Oath
  effect: >-
    The Troll Slayer is completely immune to Psychology and does not need to take tests for fighting
    alone.
  source:
    manual: khemri
    printed_page: 68
    section: Heroes / 0-1 Troll Slayer / Death Oath
  name_i18n:
    es: Juramento de Muerte
  effect_i18n:
    es: >-
      El Matatrolles es completamente inmune a la Psicología y no necesita realizar chequeos por
      combatir en solitario.
  applies_to:
    profile_ids:
    - troll-slayer
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.khemri-cursed-of-karak-zorn.troll-slayer.death-oath
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: psychology or mounts.
- id: cannibal-dwarfs--fear
  name: Fear
  effect: Cannibal Dwarfs cause Fear.
  source:
    manual: khemri
    printed_page: 69
    section: Henchmen / 1-5 Cannibal Dwarfs / Fear
  name_i18n:
