    manual: chaos-in-the-streets
    printed_page: 108
    section: Heroes / 1 Questing Knight / Special Rules / Leader
  name_i18n:
    en: Leader
    es: Líder
  effect_i18n:
    en: Any warband model within 6" of the Questing Knight may use his Leadership when taking Leadership
      tests.
    es: Cualquier modelo de la banda a 6" del Caballero Andante puede usar su Liderazgo cuando realice
      chequeos de Liderazgo.
  applies_to:
    profile_ids:
    - questing-knight
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.chaos-streets-bretonnian-knights.questing-knight.leader
