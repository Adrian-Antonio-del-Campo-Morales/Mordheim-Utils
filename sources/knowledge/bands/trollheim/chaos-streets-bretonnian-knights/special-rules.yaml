- id: band--lady-of-the-lake-blessing
  name: Lady of the Lake's Blessing
  effect: Before each battle, make a Leadership test using the warband leader's Leadership. If successful, the Lady of the
    Lake blesses the warband. While the blessing is active, any enemy model attempting to fire a blackpowder weapon must roll
    4+ on D6 each time it tries to fire; on a failure it may not shoot. Other missile weapons do not require this roll unless
    targeting a Bretonnian Knight. Before shooting at a Questing Knight or Knight Errant with any missile weapon, an enemy
    model must first roll 4+ on D6.
  source:
    manual: chaos-in-the-streets
    printed_page: 105
    section: Special Rules / Lady of the Lake's Blessing
  name_i18n:
    en: Lady of the Lake's Blessing
    es: null
  effect_i18n:
    en: Before each battle, make a Leadership test using the warband leader's Leadership. If successful, the Lady of the Lake
      blesses the warband. While the blessing is active, any enemy model attempting to fire a blackpowder weapon must roll
      4+ on D6 each time it tries to fire; on a failure it may not shoot. Other missile weapons do not require this roll unless
      targeting a Bretonnian Knight. Before shooting at a Questing Knight or Knight Errant with any missile weapon, an enemy
      model must first roll 4+ on D6.
    es: null
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.chaos-streets-bretonnian-knights.band.lady-of-the-lake-blessing
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, or non-duel context.'
