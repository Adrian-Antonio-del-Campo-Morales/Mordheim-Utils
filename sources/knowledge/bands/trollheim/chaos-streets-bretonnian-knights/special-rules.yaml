- id: band--virtue-of-valour
  kind: warband_skill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: skill.virtue-of-valour
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.virtue-of-valour
  name: Virtue of Valour
  effect: When fighting a model with a higher Strength characteristic, this Knight may re-roll failed
    To Hit rolls in close combat.
  source:
    manual: chaos-in-the-streets
    printed_page: 106
    section: Bretonnian Knight Special Skills / Virtue of Valour
  name_i18n:
    en: Virtue of Valour
    es: Virtud del Valor
  effect_i18n:
    en: When fighting a model with a higher Strength characteristic, this Knight may re-roll failed To
      Hit rolls in close combat.
    es: Al luchar contra un modelo con una característica de Fuerza superior, este Caballero puede repetir
      las tiradas de impactar falladas en el combate cuerpo a cuerpo.
  eligibility:
  - questing-knight
  - knights-errant
  - squires
  applies_to:
    band: true
