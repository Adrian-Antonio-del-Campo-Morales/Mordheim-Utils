    - id: unimplemented.lustria-norse.wolves.animal
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, magic, or non-duel context.'
- id: wolves--pack-leader
  name: Pack Leader
  effect: The Wulfen is always the Wolves' alpha. If the Wulfen cannot fight in a battle, the Wolves may
    not fight either. If the Wulfen dies, the Wolves leave the warband until another Wulfen is recruited;
    at that point the new Wulfen calls them back.
  source:
    manual: lustria
    printed_page: 110
    section: Henchmen / 0-5 Wolves / Pack Leader
  name_i18n:
    en: Pack Leader
    es: Líder de la manada
  effect_i18n:
    en: The Wulfen is always the Wolves' alpha. If the Wulfen cannot fight in a battle, the Wolves may
      not fight either. If the Wulfen dies, the Wolves leave the warband until another Wulfen is recruited;
      at that point the new Wulfen calls them back.
    es: El Wulfen es siempre el alfa de los Lobos. Si el Wulfen no puede combatir en una batalla, los
      Lobos tampoco pueden combatir. Si el Wulfen muere, los Lobos abandonan la banda hasta que se reclute
      otro Wulfen; entonces el nuevo Wulfen los llama de vuelta.
  applies_to:
    profile_ids:
    - wolves
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.lustria-norse.wolves.pack-leader
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, magic, or non-duel context.'
- id: band--seafarers
  name: Seafarers
  effect: Every Norse warrior gains +2 Strength when rowing a boat.
  source:
    manual: lustria
    printed_page: 107
    section: Norse Special Rules / Seafarers
  name_i18n:
    en: Seafarers
    es: Navegantes
  effect_i18n:
    en: Every Norse warrior gains +2 Strength when rowing a boat.
    es: Cada guerrero Norse obtiene +2 de Fuerza cuando rema en un barco.
  eligibility:
  - jarl
  - berserkers
  - wulfen
  - bondsmen
  - marauders
  - hunters
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.lustria-norse.band.seafarers
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, magic, or non-duel context.'
- id: band--norse-special-skills-shield-mastery
  kind: warband_skill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: skill.shield-mastery
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.shield-mastery
  name: Shield Mastery
  effect: The Hero may parry with a Shield as if it were a Buckler while still receiving the Shield's
    normal armour-save bonus.
  source:
    manual: lustria
    printed_page: 111
    section: Norse Special Skills / Shield Mastery
  name_i18n:
    en: Shield Mastery
    es: Maestría con el escudo
  effect_i18n:
    en: The Hero may parry with a Shield as if it were a Buckler while still receiving the Shield's normal
      armour-save bonus.
    es: El Héroe puede efectuar una estocada con un Escudo como si fuera una Rodela, mientras sigue recibiendo
      el bono normal de salvación por armadura del Escudo.
  eligibility:
  - jarl
  - berserkers
  - wulfen
  - bondsmen
  applies_to:
    band: true
- id: band--norse-special-skills-northern-weapons
  kind: warband_skill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: skill.weapons-of-the-north
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.weapons-of-the-north
  name: Northern Weapons
  effect: When the Hero attacks with an Axe or a two-handed axe, the Hero may re-roll each failed To Hit
    roll once.
  source:
    manual: lustria
    printed_page: 111
    section: Norse Special Skills / Northern Weapons
  name_i18n:
    en: Northern Weapons
    es: Armas del norte
  effect_i18n:
    en: When the Hero attacks with an Axe or a two-handed axe, the Hero may re-roll each failed To Hit
      roll once.
    es: Cuando el Héroe ataca con un Hacha o un hacha a dos manos, puede repetir una vez cada tirada de
      Golpear fallada.
  eligibility:
  - jarl
  - berserkers
  - wulfen
  - bondsmen
  applies_to:
    band: true
