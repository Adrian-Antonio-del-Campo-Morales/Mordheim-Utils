schema_version: 2
band_id: lustria-norse
rules:
- id: jarl--leader
  name: Leader
  effect: Any warband warrior within 6" of the Jarl may use his Leadership when taking Leadership tests.
  source:
    manual: lustria
    printed_page: 108
    section: Heroes / 1 Jarl / Leader
  name_i18n:
    en: Leader
    es: Líder
  effect_i18n:
    en: Any warband warrior within 6" of the Jarl may use his Leadership when taking Leadership tests.
    es: Cualquier guerrero de la banda a 6" del Jarl puede usar su Liderazgo al realizar chequeos de Liderazgo.
  applies_to:
    profile_ids:
    - jarl
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.lustria-norse.jarl.leader
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology or mounts.'
