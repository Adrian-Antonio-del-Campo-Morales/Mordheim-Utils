- id: wolves--pack-leader
  name: Pack Leader
  effect: The Wulfen is always the Wolves' alpha. If the Wulfen cannot fight in a battle, the Wolves may not fight either.
    If the Wulfen dies, the Wolves leave the warband until another Wulfen is recruited; at that point the new Wulfen calls
    them back.
  source:
    manual: lustria
    printed_page: 110
    section: Henchmen / 0-5 Wolves / Pack Leader
  name_i18n:
    en: Pack Leader
    es: null
  effect_i18n:
