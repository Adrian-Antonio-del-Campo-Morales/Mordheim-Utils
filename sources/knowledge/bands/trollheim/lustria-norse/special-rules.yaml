- id: wulfen--hardened-hide
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: trait.natural-armour-save
      scope: 'YES'
      binding:
        kind: trait
        id: trait.natural-armour-save
        parameters:
          value: 6
  name: Hardened Hide
  effect: The Wulfen has a natural 6+ armour save, equivalent to Hardened Leather. This save is modified
    normally by high Strength as if it were ordinary armour.
  source:
    manual: lustria
    printed_page: 109
    section: Heroes / 0-1 Wulfen / Hardened Hide
  name_i18n:
    en: Hardened Hide
    es: Piel curtida
  effect_i18n:
    en: The Wulfen has a natural 6+ armour save, equivalent to Hardened Leather. This save is modified
      normally by high Strength as if it were ordinary armour.
    es: El Wulfen tiene una tirada de salvación por armadura natural de 6+, equivalente al Cuero curtido.
      Esta salvación se modifica con normalidad por una Fuerza alta, como si fuera armadura ordinaria.
  applies_to:
    profile_ids:
    - wulfen
- id: wolves--animal
  name: Animal
  effect: Wolves are animals and never gain Experience.
  source:
    manual: lustria
    printed_page: 110
    section: Henchmen / 0-5 Wolves / Animal
  name_i18n:
    en: Animal
    es: Animal
  effect_i18n:
    en: Wolves are animals and never gain Experience.
    es: Los Lobos son animales y nunca ganan Experiencia.
  applies_to:
    profile_ids:
    - wolves
  runtime:
    scope: 'NO'
    implemented: 'NO'
