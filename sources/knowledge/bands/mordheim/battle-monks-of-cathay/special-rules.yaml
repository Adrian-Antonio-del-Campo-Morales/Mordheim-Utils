      equipment may be bought. The new Emissary will then reclaim Leadership of the warband.
    es: null
  applies_to:
    profile_ids:
    - emissary
- id: dragon-monks--unarmed-fighting
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
