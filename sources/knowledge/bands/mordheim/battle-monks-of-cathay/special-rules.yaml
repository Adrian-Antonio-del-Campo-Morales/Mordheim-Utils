  name: Decree
  effect: When the Emissary dies, a new one must be hired as soon as possible. Until you have done so, no other warriors and/or
    equipment may be bought. The new Emissary will then reclaim Leadership of the warband.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Heroes / 1 Emissary / Special Rules / Decree
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/battle-monks-of-cathay
  name_i18n:
