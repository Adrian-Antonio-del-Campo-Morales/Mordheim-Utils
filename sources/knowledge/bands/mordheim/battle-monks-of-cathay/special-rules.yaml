      scope: 'NO'
      binding: null
      reason: 'Out of scope: no effect applies to the isolated 1v1 duel or legal fighter skill/equipment construction.'
  name: Human Characteristic Maximum
  effect: Cathayans are humans and therefore use the maximum characteristic profile for humans (campaign.limit.racial-maximum.human).
  source:
