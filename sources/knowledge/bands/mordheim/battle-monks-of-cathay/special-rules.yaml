- id: dragon-monks--art-of-silent-death
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: skill.unarmed-critical-strikes
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.unarmed-critical-strikes
  name: Art of Silent Death
  effect: Dragon Monks have become masters of the Cathayan art of open-hand fighting. In hand-to-hand combat, if fighting
    unarmed, they will cause a critical hit on a roll 'to wound' of 5-6 instead of a 6. If the Dragon Monk wields a quarter
    staff, only the unarmed attacks will cause a critical hit on 5+.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Heroes / 0 – 3 Dragon Monks / Special Rules / Art of Silent Death
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/battle-monks-of-cathay
  name_i18n:
    en: Art of Silent Death
    es: null
  effect_i18n:
    en: Dragon Monks have become masters of the Cathayan art of open-hand fighting. In hand-to-hand combat, if fighting unarmed,
      they will cause a critical hit on a roll 'to wound' of 5-6 instead of a 6. If the Dragon Monk wields a quarter staff,
      only the unarmed attacks will cause a critical hit on 5+.
    es: null
  applies_to:
    profile_ids:
    - dragon-monks
