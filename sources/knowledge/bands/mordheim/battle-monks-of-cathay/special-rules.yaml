      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.unarmed-fighting
  name: Unarmed Fighting
  effect: Monks suffer no penalties whatsoever for fighting unarmed and receive +1 Attack when doing so.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Heroes / 0 – 3 Dragon Monks / Weapons/Armour
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/battle-monks-of-cathay
  name_i18n:
