  name: Dead Horses
  effect: Dead horses must be replaced before any other income is spent, using Treasures if necessary. A warrior without a
    mount may not take part in a battle.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Further Mounted Rules / Dead Horses
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/imperial-outriders
