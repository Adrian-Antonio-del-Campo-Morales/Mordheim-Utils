- id: band--hired-swords
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.imperial-outriders.band.hired-swords
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: mounts.'
  name: Hired Swords
  effect: Imperial Outriders may only be accompanied by mounted Hired Swords. The Freelance Knight and
    Roadwarden are allowed; the Highwayman may not be hired.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: special rules / Hired Swords
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/imperial-outriders
  name_i18n:
    en: Hired Swords
    es: Espadas a Sueldo
  effect_i18n:
    en: Imperial Outriders may only be accompanied by mounted Hired Swords. The Freelance Knight and Roadwarden
      are allowed; the Highwayman may not be hired.
    es: Los Exploradores Imperiales solo pueden ir acompañados de Espadas a Sueldo montadas. Se permiten
      el Caballero Independiente y el Caminante de Caminos; el Salteador de Caminos no puede ser contratado.
  applies_to:
    band: true
- id: band--mounted-two-weapon-fighting
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.imperial-outriders.band.mounted-two-weapon-fighting
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: mounts.'
  name: Two Weapon Fighting
  effect: Mounted warriors may not fight with two weapons. A shield or buckler may be used normally, but
    two-handed weapons are not permitted. A pistol used in the first round of hand-to-hand combat replaces
    the rider's usual weapon for that round.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Further Mounted Rules / Two Weapon Fighting
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/imperial-outriders
  name_i18n:
    en: Two Weapon Fighting
    es: Combate con dos armas
  effect_i18n:
    en: Mounted warriors may not fight with two weapons. A shield or buckler may be used normally, but
      two-handed weapons are not permitted. A pistol used in the first round of hand-to-hand combat replaces
      the rider's usual weapon for that round.
    es: Los guerreros montados no pueden luchar con dos armas. Un escudo o broquel puede usarse con normalidad,
      pero las armas a dos manos no están permitidas. Una pistola usada en el primer asalto de combate
      cuerpo a cuerpo sustituye al arma habitual del jinete durante ese asalto.
  applies_to:
    band: true
- id: band--targeting-mounted-warriors
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.imperial-outriders.band.targeting-mounted-warriors
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: mounts.'
  name: Targeting Mounted Warriors
  effect: A ridden horse may not be targeted separately by shooting or hand-to-hand attacks. A mounted
    warrior may always be selected as a shooting target even if closer enemies exist, but shooters do
    not gain +1 to hit merely because the target is mounted.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Further Mounted Rules / Targeting Mounted Warriors
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/imperial-outriders
  name_i18n:
    en: Targeting Mounted Warriors
    es: Apuntar a guerreros montados
  effect_i18n:
    en: A ridden horse may not be targeted separately by shooting or hand-to-hand attacks. A mounted warrior
      may always be selected as a shooting target even if closer enemies exist, but shooters do not gain
      +1 to hit merely because the target is mounted.
    es: Un caballo montado no puede ser objetivo separado de disparos o ataques cuerpo a cuerpo. Un guerrero
      montado siempre puede ser seleccionado como objetivo de disparo incluso si existen enemigos más
      cercanos, pero los tiradores no obtienen +1 para impactar simplemente porque el objetivo esté montado.
  applies_to:
    band: true
- id: band--mounted-injuries
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.imperial-outriders.band.mounted-injuries
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: mounts.'
  name: Injuries
  effect: Resolve the effects of wounds on mounted models using the Whoa Boy! table from the Blazing Saddles
    mounted rules.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Further Mounted Rules / Injuries
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/imperial-outriders
  name_i18n:
    en: Injuries
    es: Heridas
  effect_i18n:
    en: Resolve the effects of wounds on mounted models using the Whoa Boy! table from the Blazing Saddles
      mounted rules.
    es: Resuelve los efectos de las heridas en modelos montados usando la tabla ¡Quieto, chico! de las
      reglas montadas de Blazing Saddles.
  applies_to:
    band: true
- id: band--stunned-riders
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.imperial-outriders.band.stunned-riders
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: mounts.'
  name: Stunned Riders
  effect: A Stunned rider falls from the mount as specified by the Whoa Boy! table. If the mount bolts,
    it may be remounted if the warrior reaches it before it leaves the table. A bolting mount is recovered
    unscathed after the battle whether or not it leaves the table.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Further Mounted Rules / Stunned Riders
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/imperial-outriders
  name_i18n:
    en: Stunned Riders
    es: Jinetes aturdidos
  effect_i18n:
    en: A Stunned rider falls from the mount as specified by the Whoa Boy! table. If the mount bolts,
      it may be remounted if the warrior reaches it before it leaves the table. A bolting mount is recovered
      unscathed after the battle whether or not it leaves the table.
    es: Un jinete Aturdido cae de la montura tal como especifica la tabla ¡Quieto, chico!. Si la montura
      se desboca, puede volverse a montar si el guerrero la alcanza antes de que abandone la mesa. Una
      montura desbocada se recupera ilesa tras la batalla, abandone o no la mesa.
  applies_to:
    band: true
- id: band--out-of-action-models
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.imperial-outriders.band.out-of-action-models
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: mounts.'
  name: Out-Of-Action Models
  effect: If a rider is killed but the mount survives, the replacement warrior may use that mount, reducing
    the replacement's cost by 40 gc.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Further Mounted Rules / Out-Of-Action Models
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/imperial-outriders
  name_i18n:
    en: Out-Of-Action Models
    es: Modelos Fuera de combate
  effect_i18n:
    en: If a rider is killed but the mount survives, the replacement warrior may use that mount, reducing
      the replacement's cost by 40 gc.
    es: Si un jinete muere pero la montura sobrevive, el guerrero de reemplazo puede usar esa montura,
      reduciendo el coste del reemplazo en 40 coronas.
  applies_to:
    band: true
- id: band--dead-horses
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.imperial-outriders.band.dead-horses
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: mounts.'
  name: Dead Horses
  effect: Dead horses must be replaced before any other income is spent, using Treasures if necessary.
    A warrior without a mount may not take part in a battle.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Further Mounted Rules / Dead Horses
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/imperial-outriders
  name_i18n:
    en: Dead Horses
    es: Caballos muertos
  effect_i18n:
    en: Dead horses must be replaced before any other income is spent, using Treasures if necessary. A
      warrior without a mount may not take part in a battle.
    es: Los caballos muertos deben reemplazarse antes de gastar cualquier otro ingreso, usando Tesoros
      si es necesario. Un guerrero sin montura no puede participar en una batalla.
  applies_to:
    band: true
- id: band--dense-terrain
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.imperial-outriders.band.dense-terrain
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: mounts.'
  name: Dense Terrain
  effect: Imperial Outriders ignore the normal warband limit of two mounts in areas of dense terrain.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Further Mounted Rules / Dense Terrain
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/imperial-outriders
  name_i18n:
    en: Dense Terrain
    es: Terreno denso
  effect_i18n:
    en: Imperial Outriders ignore the normal warband limit of two mounts in areas of dense terrain.
    es: Los Exploradores Imperiales ignoran el límite normal de la banda de dos monturas en áreas de terreno
      denso.
  applies_to:
    band: true
- id: band--mounted-scenarios
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.imperial-outriders.band.mounted-scenarios
      scope: 'NO'
      binding: null
      reason: 'Out of scope: movement.'
  name: Scenarios
  effect: In scenarios that require models to cross the table, sizeable areas of dense terrain should
    be placed so that crossing the board requires entering dense terrain, forcing the Outriders to dismount.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Further Mounted Rules / Scenarios
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/imperial-outriders
  name_i18n:
    en: Scenarios
    es: Escenarios
  effect_i18n:
    en: In scenarios that require models to cross the table, sizeable areas of dense terrain should be
      placed so that crossing the board requires entering dense terrain, forcing the Outriders to dismount.
    es: En los escenarios que requieren que los modelos crucen la mesa, deben colocarse áreas considerables
      de terreno denso de modo que cruzar la mesa requiera entrar en terreno denso, forzando a los Exploradores
      a desmontar.
  applies_to:
    band: true
