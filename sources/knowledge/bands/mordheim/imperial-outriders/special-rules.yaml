      are not permitted. A pistol used in the first round of hand-to-hand combat replaces the rider's usual weapon for that
      round.
    es: null
  applies_to:
    band: true
- id: band--targeting-mounted-warriors
  runtime:
    scope: "LATER"
    implemented: "NO"
    grant: band
    effects:
    - id: unimplemented.imperial-outriders.band.targeting-mounted-warriors
      scope: "LATER"
      binding: null
      reason: "Deferred subsystem: monturas."
  name: Targeting Mounted Warriors
  effect: A ridden horse may not be targeted separately by shooting or hand-to-hand attacks. A mounted warrior may always
    be selected as a shooting target even if closer enemies exist, but shooters do not gain +1 to hit merely because the target
    is mounted.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Further Mounted Rules / Targeting Mounted Warriors
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/imperial-outriders
  name_i18n:
    en: Targeting Mounted Warriors
    es: null
