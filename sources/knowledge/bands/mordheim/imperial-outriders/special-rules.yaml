- id: band--mounted-two-weapon-fighting
  runtime:
    scope: "LATER"
    implemented: "NO"
    grant: band
    effects:
    - id: unimplemented.imperial-outriders.band.mounted-two-weapon-fighting
      scope: "LATER"
      binding: null
      reason: "Deferred subsystem: monturas."
  name: Two Weapon Fighting
  effect: Mounted warriors may not fight with two weapons. A shield or buckler may be used normally, but two-handed weapons
    are not permitted. A pistol used in the first round of hand-to-hand combat replaces the rider's usual weapon for that
    round.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Further Mounted Rules / Two Weapon Fighting
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/imperial-outriders
  name_i18n:
    en: Two Weapon Fighting
    es: null
  effect_i18n:
