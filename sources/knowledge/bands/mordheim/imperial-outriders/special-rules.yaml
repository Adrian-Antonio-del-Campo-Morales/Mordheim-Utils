- id: band--stunned-riders
  runtime:
    scope: "LATER"
    implemented: "NO"
    grant: band
    effects:
    - id: unimplemented.imperial-outriders.band.stunned-riders
      scope: "LATER"
      binding: null
      reason: "Deferred subsystem: monturas."
  name: Stunned Riders
  effect: A Stunned rider falls from the mount as specified by the Whoa Boy! table. If the mount bolts, it may be remounted
    if the warrior reaches it before it leaves the table. A bolting mount is recovered unscathed after the battle whether
    or not it leaves the table.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Further Mounted Rules / Stunned Riders
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/imperial-outriders
  name_i18n:
    en: Stunned Riders
    es: null
  effect_i18n:
    en: A Stunned rider falls from the mount as specified by the Whoa Boy! table. If the mount bolts, it may be remounted
      if the warrior reaches it before it leaves the table. A bolting mount is recovered unscathed after the battle whether
      or not it leaves the table.
    es: null
  applies_to:
    band: true
