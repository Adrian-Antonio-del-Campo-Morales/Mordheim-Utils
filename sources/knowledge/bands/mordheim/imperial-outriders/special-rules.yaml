  name: Hired Swords
  effect: Imperial Outriders may only be accompanied by mounted Hired Swords. The Freelance Knight and Roadwarden are allowed;
    the Highwayman may not be hired.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: special rules / Hired Swords
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/imperial-outriders
