- id: snotling-mob-consists-of-5-snotlings--mob
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.night-goblins-mic.snotling-mob-consists-of-5-snotlings.mob
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: no effect applies to the isolated 1v1 duel or legal fighter skill/equipment
        construction.
  name: Mob
  effect: >-
    Snotlings are naturally gregarious creatures. They are initially bought in a mob of 5. You may
    replace mob members up to the maximum of 5. They will always move and fight as a mob. All
    members must stay within 1" and all will join in the same combat if possible.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 1 Snotling Mob (consists of 5 Snotlings) / Special Rules / Mob
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/night-goblins
  name_i18n:
    es: Horda
  effect_i18n:
    es: >-
      Los Snotlings son criaturas naturalmente gregarias. Se compran inicialmente en una horda de 5.
      Puedes reponer miembros de la horda hasta un máximo de 5. Siempre se moverán y lucharán como
      una horda. Todos los miembros deben permanecer a 1" y todos se unirán al mismo combate si es
      posible.
  applies_to:
    profile_ids:
    - snotling-mob-consists-of-5-snotlings
- id: snotling-mob-consists-of-5-snotlings--weedy
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: trait.injury-profile
      scope: 'YES'
      binding:
        kind: trait
        id: trait.injury-profile
        parameters:
          value: 1
  name: Weedy
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 1 Snotling Mob (consists of 5 Snotlings) / Special Rules / Weedy
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/night-goblins
  name_i18n:
    es: Debiluchos
  applies_to:
    profile_ids:
    - snotling-mob-consists-of-5-snotlings
  rule_ref: shared-rule.weedy
- id: snotling-mob-consists-of-5-snotlings--dodgy
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.night-goblins-mic.snotling-mob-consists-of-5-snotlings.dodgy
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: no effect applies to the isolated 1v1 duel or legal fighter skill/equipment
        construction.
  name: Dodgy
  effect: >-
    The little creatures are constantly ducking and diving in the most infuriating way. They get a
    6+ dodge save against shooting.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 1 Snotling Mob (consists of 5 Snotlings) / Special Rules / Dodgy
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/night-goblins
  name_i18n:
    es: Escurridizos
  effect_i18n:
    es: >-
      Las pequeñas criaturas se agachan y esquivan constantemente de la forma más irritante. Tienen
      una salvación de esquiva de 6+ contra disparos.
  applies_to:
    profile_ids:
    - snotling-mob-consists-of-5-snotlings
- id: snotling-mob-consists-of-5-snotlings--insignificant
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.night-goblins-mic.snotling-mob-consists-of-5-snotlings.insignificant
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: psychology.
  name: Insignificant
  effect: >-
    Nobody cares about the Snotlings. The whole mob counts as a single model for the purposes of
    rout tests, maximum warband size and calculating income. An enemy hero will only gain experience
    for taking the last Snotling Out of Action.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 1 Snotling Mob (consists of 5 Snotlings) / Special Rules / Insignificant
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/night-goblins
  name_i18n:
    es: Insignificante
  effect_i18n:
    es: >-
      A nadie le importan los Snotlings. Toda la horda cuenta como un único modelo a efectos de
      chequeos de huida, tamaño máximo de banda y cálculo de ingresos. Un héroe enemigo solo ganará
      experiencia por poner al último Snotling Fuera de combate.
  applies_to:
    profile_ids:
    - snotling-mob-consists-of-5-snotlings
- id: band--animosity
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.night-goblins-mic.band.animosity
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: psychology.
  name: Animosity
  effect: >-
    At the beginning of each Night Goblin turn roll a D6. On a 1, the Night Goblins squabble and do
    nothing else for the rest of that turn. Trolls, Cave Squigs, Snotlings and other non-Goblins are
    unaffected.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / Animosity
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/night-goblins
  name_i18n:
    es: Rencor
  effect_i18n:
    es: >-
      Al comienzo de cada turno de Goblins Nocturnos, tira 1D6. Con un 1, los Goblins Nocturnos se
      enzarzan en rencillas y no hacen nada más durante el resto de ese turno. Los trolls, Squigs de
      Cueva, Snotlings y otros no goblins no se ven afectados.
  applies_to:
    band: true
- id: band--hate-stunties
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.night-goblins-mic.band.hate-stunties
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: psychology.
  name: Hate Stunties
  effect: >-
    Night Goblins are subject to Hatred against Dwarfs. This does not affect other greenskins in the
    warband, and Fanatics are specifically exempt.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / Hate Stunties
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/night-goblins
  name_i18n:
    es: Odio a los Stunties
  effect_i18n:
    es: >-
      Los Goblins Nocturnos están sujetos a Odio contra los Enanos. Esto no afecta a otros
      pielesverdes de la banda, y los Fanáticos están específicamente exentos.
  applies_to:
    band: true
- id: band--squig-minder-ratio
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.night-goblins-mic.band.squig-minder-ratio
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: campaign.
  name: Cave Squig Limit
  effect: The warband may never include more Cave Squigs than Night Goblins.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Choice of warriors / Cave Squig
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/night-goblins
  name_i18n:
    es: Límite de Squigs de Cueva
  effect_i18n:
    es: La banda nunca puede incluir más Squigs de Cueva que Goblins Nocturnos.
  applies_to:
    band: true
- id: band--night-goblin-special-skills-ded-shooty
  kind: warband_skill
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.night-goblins-mic.band.night-goblin-special-skills-ded-shooty
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: shooting.
  name: Ded Shooty
  effect: >-
    The clever little git adds +6" to the range of any missile weapons he uses (not including nets)
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Night Goblin Special Skills / Ded Shooty
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/night-goblins
  name_i18n:
    es: Ded Shooty (Disparo Letal)
  effect_i18n:
    es: >-
      El pequeño pillo añade +6" al alcance de cualquier arma de misil que use (sin incluir redes).
  applies_to:
    band: true
- id: band--night-goblin-special-skills-sneaky-git
  kind: warband_skill
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.night-goblins-mic.band.night-goblin-special-skills-sneaky-git
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: movement.
  name: Sneaky Git
  effect: >-
    The greenskin is so sneaky that he can move D3 of his warband members after all other deployment
    is complete. Night Goblin Big Boss only.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Night Goblin Special Skills / Sneaky Git
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/night-goblins
  name_i18n:
    es: Pillo Furtivo (Sneaky Git)
  effect_i18n:
    es: >-
      El pielverde es tan furtivo que puede mover D3 miembros de su banda una vez completado el
      despliegue de todos los demás. Solo el Gran Jefe Goblin Nocturno.
  applies_to:
    band: true
- id: band--night-goblin-special-skills-infiltrate
  kind: warband_skill
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.night-goblins-mic.band.night-goblin-special-skills-infiltrate
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: movement.
  name: Infiltrate
  effect: >-
    A Night Goblin with this skill is always placed on the battlefield after the opposing warband
    and can be placed anywhere on the table as long as it is out of sight of the opposing warband
    and more than 12" away from any enemy model. If both players have models which infiltrate, roll
    a D6 for each, and the lowest roll sets up first.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Night Goblin Special Skills / Infiltrate
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/night-goblins
  name_i18n:
    es: Infiltración
  effect_i18n:
    es: >-
      Un Goblin Nocturno con esta habilidad siempre se sitúa en el campo de batalla después de la
      banda rival y puede colocarse en cualquier punto de la mesa mientras esté fuera de la línea de
      visión de la banda rival y a más de 12" de cualquier modelo enemigo. Si ambos jugadores tienen
      modelos que se infiltran, tira 1D6 por cada uno, y el que obtenga la tirada más baja se
      despliega primero.
  applies_to:
    band: true
- id: band--night-goblin-special-skills-netter
  kind: warband_skill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: mechanic.netter
      scope: 'YES'
      binding:
        kind: mechanic
        id: mechanic.netter
  name: Netter
  effect: >-
    The goblin is adept at using a net to disable his enemies. They learn their skill hunting wild
    cave squigs in the depths of the mountains. The technique he has mastered is 'chuck and charge'.
    The goblin may declare that he is making a net charge. He throws the net at a target in the same
    way as described in the Mordheim rulebook. If he hits and the target fails to escape the net
    then target counts as knocked down and the goblin completes his charge. If he misses or the
    target escapes then the goblin makes a failed charge. If the failed charge would take him into
    base contact then stop him 1" away. A warrior who is caught in a net will be automatically hit
    in combat. The goblin must still roll to wound just as with a knocked down enemy. In the
    warrior's next recovery phase, unless he is stunned or out of action he will cut himself out of
    the net but cannot do anything else and will go last in combat just as if he had stood up from
    being knocked down.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Night Goblin Special Skills / Netter
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/night-goblins
  name_i18n:
    es: Rededor
  effect_i18n:
    es: >-
      El goblin es experto en usar una red para inutilizar a sus enemigos. Aprenden esta habilidad
      cazando squigs de cueva salvajes en las profundidades de las montañas. La técnica que ha
      dominado es 'lanzar y cargar'. El goblin puede declarar que realiza una carga con red. Lanza
      la red a un objetivo de la misma manera que se describe en el reglamento de Mordheim. Si
      impacta y el objetivo no logra escapar de la red, el objetivo cuenta como derribado y el
      goblin completa su carga. Si falla o el objetivo escapa, el goblin realiza una carga fallida.
      Si la carga fallida lo llevaría a contacto de peana, deténlo a 1". Un guerrero atrapado en una
      red será impactado automáticamente en el combate. El goblin debe seguir tirando para herir,
      igual que con un enemigo derribado. En la siguiente fase de recuperación del guerrero, a menos
      que esté aturdido o Fuera de combate, se cortará la red, pero no podrá hacer nada más y
      luchará el último en el combate, igual que si se hubiera levantado de un derribo.
  applies_to:
    band: true
