schema_version: 2
band_id: night-goblins-mic
rules:
- id: big-boss--leader
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.night-goblins-mic.big-boss.leader
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: psychology.
  name: Leader
  effect: >-
    Any warrior within 6" of the Big Boss may use his Leadership characteristic when taking
    Leadership tests.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 1 Big Boss / Special Rules / Leader
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/night-goblins
  name_i18n:
    es: Líder
  effect_i18n:
    es: >-
      Cualquier guerrero a 6" del Gran Jefe puede usar su característica de Liderazgo cuando realice
      chequeos de Liderazgo.
  applies_to:
    profile_ids:
    - big-boss
- id: shaman--wizard
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.night-goblins-mic.shaman.wizard
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: magic.
  name: Wizard
  effect: A Shaman is a wizard and uses Waaagh! Magic.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 – 1 Shaman / Special Rules / Wizard
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/night-goblins
  name_i18n:
    es: Mago
  effect_i18n:
    es: Un Chamán es un hechicero y usa la Magia ¡WAAAGH!.
  applies_to:
    profile_ids:
    - shaman
- id: fanatics--addict
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.night-goblins-mic.fanatics.addict
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: campaign.
  name: Addict
  effect: >-
    The Fanatic is dependent on a regular supply of Madcap Mushrooms which must be bought each game.
    If he can't get any before a battle he will stay in his cave foaming at the mouth and not take
    part. If available he will eat his mushrooms before the battle.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 2 Fanatics / Special Rules / Addict
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/night-goblins
  name_i18n:
    es: Adicto
  effect_i18n:
    es: >-
      El Fanático depende de un suministro regular de Setas Locas que deben comprarse en cada
      partida. Si no consigue ninguna antes de una batalla, se quedará en su cueva echando espuma
      por la boca y no participará. Si hay disponibles, comerá sus setas antes de la batalla.
  applies_to:
    profile_ids:
    - fanatics
- id: fanatics--mushroom-brain
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.night-goblins-mic.fanatics.mushroom-brain
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: campaign.
  name: Mushroom Brain
  effect: >-
    Due to the effect of prolonged use of Madcap Mushrooms the Fanatic's brain is about useless. He
    cannot gain experience.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 2 Fanatics / Special Rules / Mushroom Brain
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/night-goblins
  name_i18n:
    es: Cerebro de Seta
  effect_i18n:
    es: >-
      Debido al efecto del uso prolongado de Setas Locas, el cerebro del Fanático está casi
      inutilizado. No puede ganar experiencia.
  applies_to:
    profile_ids:
    - fanatics
- id: fanatics--looney
  runtime:
    scope: LATER
    implemented: 'YES'
    grant: profile
    effects:
    - id: trait.frenzy
      scope: LATER
      binding:
        kind: trait
        id: trait.frenzy
        parameters:
          value: true
  name: Looney
  effect: >-
    Due to the effect of the Mushrooms he is subject to frenzy. He must also test for permanent
    damage after the battle as described in the rulebook.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 2 Fanatics / Special Rules / Looney
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/night-goblins
  name_i18n:
    es: Chiflado
  effect_i18n:
    es: >-
      Debido al efecto de las setas, está sujeto al frenesí. También debe hacer un chequeo de daño
      permanente tras la batalla, tal como se describe en el reglamento.
  applies_to:
    profile_ids:
    - fanatics
- id: fanatics--frantic
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: profile-rule.fanatics--frantic
      scope: 'YES'
      binding:
        kind: compiler
        id: profile-rule.fanatics--frantic
  name: Frantic
  effect: >-
    The Fanatic is hyperactive and will strike first in combat ignoring penalties or bonuses for
    weapons or initiative order.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 2 Fanatics / Special Rules / Frantic
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/night-goblins
  name_i18n:
    es: Frenético
  effect_i18n:
    es: >-
      El Fanático es hiperactivo y golpeará primero en el combate, ignorando penalizaciones o
      bonificaciones por armas u orden de iniciativa.
  applies_to:
    profile_ids:
    - fanatics
