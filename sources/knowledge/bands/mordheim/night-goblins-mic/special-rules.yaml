- id: band--night-goblin-special-skills-netter
  kind: warband_skill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: mechanic.netter
      scope: 'YES'
      binding:
        kind: mechanic
        id: mechanic.netter
  name: Netter
  effect: The goblin is adept at using a net to disable his enemies. They learn their skill hunting wild
    cave squigs in the depths of the mountains. The technique he has mastered is 'chuck and charge'. The
    goblin may declare that he is making a net charge. He throws the net at a target in the same way as
    described in the Mordheim rulebook. If he hits and the target fails to escape the net then target
    counts as knocked down and the goblin completes his charge. If he misses or the target escapes then
    the goblin makes a failed charge. If the failed charge would take him into base contact then stop
    him 1" away. A warrior who is caught in a net will be automatically hit in combat. The goblin must
    still roll to wound just as with a knocked down enemy. In the warrior's next recovery phase, unless
    he is stunned or out of action he will cut himself out of the net but cannot do anything else and
    will go last in combat just as if he had stood up from being knocked down.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Night Goblin Special Skills / Netter
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/night-goblins
  name_i18n:
    en: Netter
    es: Redeador (Netter)
  effect_i18n:
    en: 'The goblin is adept at using a net to disable his enemies. They learn their

      skill hunting wild cave squigs in the depths of the mountains. The technique he has

      mastered is ''chuck and charge''. The goblin may declare that he is making a net

      charge. He throws the net at a target in the same way as described in the Mordheim

      rulebook. If he hits and the target fails to escape the net then target counts as

      knocked down and the goblin completes his charge. If he misses or the target

      escapes then the goblin makes a failed charge. If the failed charge would take him

      into base contact then stop him 1" away. A warrior who is caught in a net will be

      automatically hit in combat. The goblin must still roll to wound just as with a knocked

      down enemy. In the warrior''s next recovery phase, unless he is stunned or out of

      action he will cut himself out of the net but cannot do anything else and will go last in

      combat just as if he had stood up from being knocked down.'
    es: El goblin es experto en usar una red para inutilizar a sus enemigos. Aprenden esta habilidad cazando
      squigs de cueva salvajes en las profundidades de las montañas. La técnica que ha dominado es 'lanzar
      y cargar'. El goblin puede declarar que realiza una carga con red. Lanza la red a un objetivo de
      la misma manera que se describe en el reglamento de Mordheim. Si impacta y el objetivo no logra
      escapar de la red, el objetivo cuenta como derribado y el goblin completa su carga. Si falla o el
      objetivo escapa, el goblin realiza una carga fallida. Si la carga fallida lo llevaría a contacto
      de peana, deténlo a 1". Un guerrero atrapado en una red será impactado automáticamente en el combate.
      El goblin debe seguir tirando para herir, igual que con un enemigo derribado. En la siguiente fase
      de recuperación del guerrero, a menos que esté aturdido o Fuera de combate, se cortará la red, pero
      no podrá hacer nada más y luchará el último en el combate, igual que si se hubiera levantado de
      un derribo.
  applies_to:
    band: true
