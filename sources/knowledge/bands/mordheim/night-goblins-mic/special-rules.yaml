schema_version: 2
band_id: night-goblins-mic
rules:
- id: big-boss--leader
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.night-goblins-mic.big-boss.leader
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology.'
  name: Leader
  effect: Any warrior within 6" of the Big Boss may use his Leadership characteristic when taking Leadership
    tests.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 1 Big Boss / Special Rules / Leader
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/night-goblins
  name_i18n:
    en: Leader
    es: Líder
  effect_i18n:
    en: Any warrior within 6" of the Big Boss may use his Leadership characteristic when taking Leadership
      tests.
    es: Cualquier guerrero a 6" del Gran Jefe puede usar su característica de Liderazgo cuando realice
      chequeos de Liderazgo.
  applies_to:
    profile_ids:
    - big-boss
- id: shaman--wizard
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.night-goblins-mic.shaman.wizard
      scope: 'NO'
      binding: null
      reason: 'Out of scope: magic.'
  name: Wizard
  effect: A Shaman is a wizard and uses Waaagh! Magic.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 – 1 Shaman / Special Rules / Wizard
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/night-goblins
  name_i18n:
    en: Wizard
    es: Hechicero
  effect_i18n:
    en: A Shaman is a wizard and uses Waaagh! Magic.
    es: Un Chamán es un hechicero y usa la Magia ¡WAAAGH!.
  applies_to:
    profile_ids:
    - shaman
- id: fanatics--addict
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.night-goblins-mic.fanatics.addict
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign.'
  name: Addict
  effect: The Fanatic is dependent on a regular supply of Madcap Mushrooms which must be bought each game.
    If he can't get any before a battle he will stay in his cave foaming at the mouth and not take part.
    If available he will eat his mushrooms before the battle.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 2 Fanatics / Special Rules / Addict
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/night-goblins
  name_i18n:
    en: Addict
    es: Adicto
  effect_i18n:
    en: The Fanatic is dependent on a regular supply of Madcap Mushrooms which must be bought each game.
      If he can't get any before a battle he will stay in his cave foaming at the mouth and not take part.
      If available he will eat his mushrooms before the battle.
    es: El Fanático depende de un suministro regular de Setas Locas que deben comprarse en cada partida.
      Si no consigue ninguna antes de una batalla, se quedará en su cueva echando espuma por la boca y
      no participará. Si hay disponibles, comerá sus setas antes de la batalla.
  applies_to:
    profile_ids:
    - fanatics
- id: fanatics--mushroom-brain
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.night-goblins-mic.fanatics.mushroom-brain
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign.'
  name: Mushroom Brain
  effect: Due to the effect of prolonged use of Madcap Mushrooms the Fanatic's brain is about useless.
    He cannot gain experience.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 2 Fanatics / Special Rules / Mushroom Brain
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/night-goblins
  name_i18n:
    en: Mushroom Brain
    es: Cerebro de seta
  effect_i18n:
    en: Due to the effect of prolonged use of Madcap Mushrooms the Fanatic's brain is about useless. He
      cannot gain experience.
    es: Debido al efecto del uso prolongado de Setas Locas, el cerebro del Fanático está casi inutilizado.
      No puede ganar experiencia.
  applies_to:
    profile_ids:
    - fanatics
- id: fanatics--looney
  runtime:
    scope: LATER
    implemented: 'YES'
    grant: profile
    effects:
    - id: trait.frenzy
      scope: LATER
      binding:
        kind: trait
        id: trait.frenzy
        parameters:
          value: true
  name: Looney
  effect: Due to the effect of the Mushrooms he is subject to frenzy. He must also test for permanent
    damage after the battle as described in the rulebook.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 2 Fanatics / Special Rules / Looney
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/night-goblins
  name_i18n:
    en: Looney
    es: Chiflado
  effect_i18n:
    en: Due to the effect of the Mushrooms he is subject to frenzy. He must also test for permanent damage
      after the battle as described in the rulebook.
    es: Debido al efecto de las setas, está sujeto al frenesí. También debe hacer un chequeo de daño permanente
      tras la batalla, tal como se describe en el reglamento.
  applies_to:
    profile_ids:
    - fanatics
- id: fanatics--frantic
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: profile-rule.fanatics--frantic
      scope: 'YES'
      binding:
        kind: compiler
        id: profile-rule.fanatics--frantic
  name: Frantic
  effect: The Fanatic is hyperactive and will strike first in combat ignoring penalties or bonuses for
    weapons or initiative order.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 2 Fanatics / Special Rules / Frantic
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/night-goblins
  name_i18n:
    en: Frantic
    es: Frenético
  effect_i18n:
    en: The Fanatic is hyperactive and will strike first in combat ignoring penalties or bonuses for weapons
      or initiative order.
    es: El Fanático es hiperactivo y golpeará primero en el combate, ignorando penalizaciones o bonificaciones
      por armas u orden de iniciativa.
  applies_to:
    profile_ids:
    - fanatics
- id: cave-squigs--movement
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.night-goblins-mic.cave-squigs.movement
      scope: 'NO'
      binding: null
      reason: 'Out of scope: movement.'
  name: Movement
  effect: Cave Squigs do not have a set Movement characteristic but move with an ungainly bouncing stride.
    To represent this, when moving Squigs, roll 2D6 for the distance they move. Squigs never run and never
    declare charges. Instead, they are allowed to contact enemy models with their normal 2D6" movement.
    If this happens, they count as charging for the following round of close combat, just as if they had
    declared a charge.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 5 Cave Squigs / Special Rules / Movement
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/night-goblins
  name_i18n:
    en: Movement
    es: Movimiento
  effect_i18n:
    en: 'Cave Squigs do not have a set Movement

      characteristic but move with an ungainly bouncing stride. To

      represent this, when moving Squigs, roll 2D6 for the distance

      they move. Squigs never run and never declare charges.

      Instead, they are allowed to contact enemy models with their

      normal 2D6" movement. If this happens, they count as

      charging for the following round of close combat, just as if

      they had declared a charge.'
    es: Los Squigs de Cueva no tienen una característica de Movimiento fija, sino que se mueven con un
      zancudo brinco desgarbado. Para representarlo, cuando muevas Squigs, tira 2D6 para la distancia
      que se desplazan. Los Squigs nunca corren ni declaran cargas. En cambio, se les permite contactar
      con modelos enemigos con su movimiento normal de 2D6". Si esto sucede, cuentan como cargando en
      el siguiente asalto de combate cuerpo a cuerpo, igual que si hubieran declarado una carga.
  applies_to:
    profile_ids:
    - cave-squigs
- id: cave-squigs--minderz
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.night-goblins-mic.cave-squigs.minderz
      scope: 'NO'
      binding: null
      reason: 'Out of scope: movement.'
  name: Minderz
  effect: Each Cave Squig must always remain within 6" of a Goblin Warrior, who keeps the creature in
    line. If a Cave Squig finds itself without a Goblin within 6" at the start of its Movement phase,
    it will go wild. From that point on, move the Squig 2D6" in a random direction during each of its
    Movement phases. If its movement takes it into contact with another model (friend or foe), it will
    engage the model in hand-to-hand combat as normal. The Cave Squig is out of the Orc & Goblin player's
    control until the end of the game.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 5 Cave Squigs / Special Rules / Minderz
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/night-goblins
  name_i18n:
    en: Minderz
    es: Cuidadores (Minderz)
  effect_i18n:
    en: 'Each Cave Squig must always remain within 6" of a

      Goblin Warrior, who keeps the creature in line. If a Cave

      Squig finds itself without a Goblin within 6" at the start of its

      Movement phase, it will go wild. From that point on, move

      the Squig 2D6" in a random direction during each of its

      Movement phases. If its movement takes it into contact with

      another model (friend or foe), it will engage the model in

      hand-to-hand combat as normal. The Cave Squig is out of the

      Orc & Goblin player''s control until the end of the game.'
    es: Cada Squig de Cueva debe permanecer siempre a 6" de un guerrero goblin, quien mantiene a la criatura
      a raya. Si un Squig de Cueva se encuentra sin ningún goblin a 6" al inicio de su fase de Movimiento,
      se volverá salvaje. A partir de ese momento, mueve el Squig 2D6" en una dirección aleatoria durante
      cada una de sus fases de Movimiento. Si su movimiento lo pone en contacto con otro modelo (amigo
      o enemigo), entablará combate cuerpo a cuerpo con él con normalidad. El Squig de Cueva queda fuera
      del control del jugador de Orcos y Goblins hasta el final de la partida.
  applies_to:
    profile_ids:
    - cave-squigs
- id: cave-squigs--animals
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.night-goblins-mic.cave-squigs.animals
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign.'
  name: Animals
  effect: Cave Squigs are animals of a sort and so do not gain experience.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 5 Cave Squigs / Special Rules / Animals
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/night-goblins
  name_i18n:
    en: Animals
    es: Animales
  effect_i18n:
    en: 'Cave Squigs are animals of a sort and so do not gain

      experience.'
    es: Los Squigs de Cueva son, en cierto modo, animales y por tanto no ganan experiencia.
  applies_to:
    profile_ids:
    - cave-squigs
- id: troll--fear
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.night-goblins-mic.troll.fear
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology.'
  name: Fear
  effect: Trolls are frightening monsters which cause fear.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 1 Troll / Special Rules / Fear
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/night-goblins
  name_i18n:
    en: Fear
    es: Miedo
  effect_i18n:
    en: Trolls are frightening monsters which cause fear.
    es: Los trolls son monstruos aterradores que causan miedo.
  applies_to:
    profile_ids:
    - troll
- id: troll--stupidity
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.night-goblins-mic.troll.stupidity
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology.'
  name: Stupidity
  effect: A Troll is subject to the rules for stupidity.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 1 Troll / Special Rules / Stupidity
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/night-goblins
  name_i18n:
    en: Stupidity
    es: Estupidez
  effect_i18n:
    en: A Troll is subject to the rules for stupidity.
    es: Un troll está sujeto a las reglas de estupidez.
  applies_to:
    profile_ids:
    - troll
- id: troll--regeneration
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: skill.regeneration
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.regeneration
    - id: campaign.post-battle-injury
      scope: 'NO'
      binding: null
      reason: Post-battle injury is a campaign state.
  name: Regeneration
  effect: Trolls have a unique physiology that allow them to regenerate wounds. Whenever an enemy successfully
    inflicts a wound on a Troll roll a D6, on a result of 4 or more the wound is ignored and the Troll
    is unhurt. Trolls may not regenerate wounds caused by fire or fire-based magic. Trolls never roll
    for Injury after a battle.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 1 Troll / Special Rules / Regeneration
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/night-goblins
  name_i18n:
    en: Regeneration
    es: Regeneración
  effect_i18n:
    en: 'Trolls have a unique physiology that allow

      them to regenerate wounds. Whenever an enemy successfully

      inflicts a wound on a Troll roll a D6, on a result of 4 or more

      the wound is ignored and the Troll is unhurt. Trolls may not

      regenerate wounds caused by fire or fire-based magic. Trolls

      never roll for Injury after a battle.'
    es: 'Los trolls tienen una fisiología única que les permite regenerar heridas. Siempre que un enemigo
      inflija con éxito una herida a un troll, tira 1D6: con un resultado de 4 o más la herida se ignora
      y el troll queda ileso. Los trolls no pueden regenerar heridas causadas por fuego o magia de fuego.
      Los trolls nunca tiran por heridas tras una batalla.'
  applies_to:
    profile_ids:
    - troll
- id: troll--dumb-monster
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.night-goblins-mic.troll.dumb-monster
      scope: 'NO'
      binding: null
      reason: 'Out of scope: psychology.'
  name: Dumb Monster
  effect: A Troll is far too stupid to ever learn any new skills. Trolls do not gain experience.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 1 Troll / Special Rules / Dumb Monster
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/night-goblins
  name_i18n:
    en: Dumb Monster
    es: Monstruo tarugo
  effect_i18n:
    en: 'A Troll is far too stupid to ever learn any

      new skills. Trolls do not gain experience.'
    es: Un troll es demasiado estúpido para aprender nuevas habilidades. Los trolls no ganan experiencia.
  applies_to:
    profile_ids:
    - troll
- id: troll--always-hungry
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.night-goblins-mic.troll.always-hungry
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign.'
  name: Always Hungry
  effect: A Troll requires an upkeep cost. This upkeep represents the copious amounts of food that must
    be fed to the Troll in order to keep him loyal to the warband. The warband must pay 15 gold crowns
    after every game in order to keep the Troll. If the warband lacks the gold to pay the upkeep, the
    Boss has the option of sacrificing two Goblin Warriors or Cave Squigs to the Troll in lieu of buying
    food (Trolls eat nearly anything). If this fee is not paid (either in gold or in warband members)
    the Troll gets hungry and wanders off in search of food.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 1 Troll / Special Rules / Always Hungry
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/night-goblins
  name_i18n:
    en: Always Hungry
    es: Siempre hambriento
  effect_i18n:
    en: 'A Troll requires an upkeep cost. This

      upkeep represents the copious amounts of food that must be

      fed to the Troll in order to keep him loyal to the warband.

      The warband must pay 15 gold crowns after every game in

      order to keep the Troll. If the warband lacks the gold to pay

      the upkeep, the Boss has the option of sacrificing two Goblin

      Warriors or Cave Squigs to the Troll in lieu of buying food

      (Trolls eat nearly anything). If this fee is not paid (either in

      gold or in warband members) the Troll gets hungry and

      wanders off in search of food.'
    es: Un troll requiere un coste de manutención. Este coste representa las cantidades copiosas de comida
      que hay que darle al troll para mantenerlo leal a la banda. La banda debe pagar 15 coronas de oro
      tras cada partida para conservar al troll. Si la banda carece de oro para pagar la manutención,
      el Jefe tiene la opción de sacrificar dos Guerreros Goblin o Squigs de Cueva al troll en lugar de
      comprar comida (los trolls comen casi cualquier cosa). Si no se paga esta cuota (ya sea en oro o
      en miembros de la banda), el troll se queda con hambre y se marcha en busca de comida.
  applies_to:
    profile_ids:
    - troll
- id: troll--vomit-attack
  kind: profile_ability
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: weapon.vomit-attack
      scope: 'YES'
      binding:
        kind: mechanic
        id: weapon.vomit-attack
  name: Vomit Attack
  effect: Instead of his normal attacks, a Troll can regurgitate its highly corrosive digestive juices
    on an unfortunate hand-to-hand combat opponent. This is a single attack that automatically hits with
    a Strength of 5 and ignores armour saves.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 1 Troll / Special Rules / Vomit Attack
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/night-goblins
  name_i18n:
    en: Vomit Attack
    es: Ataque de vómito
  effect_i18n:
    en: 'Instead of his normal attacks, a Troll can

      regurgitate its highly corrosive digestive juices on an

      unfortunate hand-to-hand combat opponent. This is a single

      attack that automatically hits with a Strength of 5 and ignores

      armour saves.'
    es: En lugar de sus ataques normales, un troll puede regurgitar sus jugos digestivos, altamente corrosivos,
      sobre un desdichado oponente en combate cuerpo a cuerpo. Es un ataque único que impacta automáticamente
      con una Fuerza de 5 e ignora las tiradas de salvación por armadura.
  applies_to:
    profile_ids:
    - troll
- id: troll--large-target
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.night-goblins-mic.troll.large-target
      scope: 'NO'
      binding: null
      reason: 'Out of scope: shooting.'
  name: Large Target
  effect: Trolls are Large Targets as defined in the shooting rules.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 1 Troll / Special Rules / Large Target
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/night-goblins
  name_i18n:
    en: Large Target
    es: Objetivo grande
  effect_i18n:
    en: Trolls are Large Targets as defined in the shooting rules.
    es: Los trolls son Objetivos Grandes tal como se define en las reglas de disparo.
  applies_to:
    profile_ids:
    - troll
- id: snotling-mob-consists-of-5-snotlings--mob
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.night-goblins-mic.snotling-mob-consists-of-5-snotlings.mob
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: no effect applies to the isolated 1v1 duel or legal fighter skill/equipment
        construction.
  name: Mob
  effect: Snotlings are naturally gregarious creatures. They are initially bought in a mob of 5. You may
    replace mob members up to the maximum of 5. They will always move and fight as a mob. All members
    must stay within 1" and all will join in the same combat if possible.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 1 Snotling Mob (consists of 5 Snotlings) / Special Rules / Mob
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/night-goblins
  name_i18n:
    en: Mob
    es: Horda
  effect_i18n:
    en: 'Snotlings are naturally gregarious creatures. They are initially bought in a mob of 5. You

      may replace mob members up to the maximum of 5. They will always move and fight as a

      mob. All members must stay within 1" and all will join in the same combat if

      possible.'
    es: Los Snotlings son criaturas naturalmente gregarias. Se compran inicialmente en una horda de 5.
      Puedes reponer miembros de la horda hasta un máximo de 5. Siempre se moverán y lucharán como una
      horda. Todos los miembros deben permanecer a 1" y todos se unirán al mismo combate si es posible.
  applies_to:
    profile_ids:
    - snotling-mob-consists-of-5-snotlings
- id: snotling-mob-consists-of-5-snotlings--weedy
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: trait.injury-profile
      scope: 'YES'
      binding:
        kind: trait
        id: trait.injury-profile
        parameters:
          value: 1
  name: Weedy
  effect: Snotlings are not the most robust of creatures. If wounded they will be knocked down on a 1,
    stunned on a 2-3 and go out of action on a 4-6.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 1 Snotling Mob (consists of 5 Snotlings) / Special Rules / Weedy
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/night-goblins
  name_i18n:
    en: Weedy
    es: Debiluchos
  effect_i18n:
    en: 'Snotlings are not the most robust of creatures. If wounded they will be knocked down

      on a 1, stunned on a 2-3 and go out of action on a 4-6.'
    es: Los Snotlings no son precisamente criaturas robustas. Si resultan heridos, quedarán derribados
      con un 1, aturdidos con un 2-3 y Fuera de combate con un 4-6.
  applies_to:
    profile_ids:
    - snotling-mob-consists-of-5-snotlings
- id: snotling-mob-consists-of-5-snotlings--dodgy
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.night-goblins-mic.snotling-mob-consists-of-5-snotlings.dodgy
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: no effect applies to the isolated 1v1 duel or legal fighter skill/equipment
        construction.
  name: Dodgy
  effect: The little creatures are constantly ducking and diving in the most infuriating way. They get
    a 6+ dodge save against shooting.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 1 Snotling Mob (consists of 5 Snotlings) / Special Rules / Dodgy
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/night-goblins
  name_i18n:
    en: Dodgy
    es: Escurridizos
  effect_i18n:
    en: 'The little creatures are constantly ducking and diving in the most infuriating way.

      They get a 6+ dodge save against shooting.'
    es: Las pequeñas criaturas se agachan y esquivan constantemente de la forma más irritante. Tienen
      una salvación de esquiva de 6+ contra disparos.
  applies_to:
