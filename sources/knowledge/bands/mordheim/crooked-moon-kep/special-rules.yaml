  name: Movement
  effect: >-
    Cave Squigs don't have a set movement characteristic but move with an unbelievably random
    distance they move. Squigs never run and never declare a charge. Instead they are allowed to
    contact an enemy model within their normal 2D6 movement. If this happens, they count as charging
    for the following round of close combat just as if they had declared a charge.
  source:
    manual: broheim.net
    printed_page: 14
    section: Henchmen / 0-5 Cave Squigs / Special Rules / Movement
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Crooked Moon Night Goblins.pdf
  name_i18n:
    es: Movimiento
  effect_i18n:
    es: >-
      Los Squigs de Cueva no tienen una característica de Movimiento fija, sino que se mueven una
      distancia increíblemente aleatoria. Los Squigs nunca corren ni declaran cargas. En su lugar,
      se les permite contactar con un modelo enemigo dentro de su movimiento normal de 2D6. Si esto
      ocurre, cuentan como que cargan para la siguiente ronda de combate cuerpo a cuerpo, igual que
      si hubieran declarado una carga.
  applies_to:
    profile_ids:
    - cave-squigs
