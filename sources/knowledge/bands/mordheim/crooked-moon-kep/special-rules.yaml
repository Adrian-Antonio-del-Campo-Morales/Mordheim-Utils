schema_version: 2
band_id: crooked-moon-kep
rules:
- id: band--animosity
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: band
    effects:
    - id: mechanic.goblin-squabble
      scope: 'YES'
      binding:
        kind: mechanic
        id: mechanic.goblin-squabble
  name: Animosity
  effect: >-
    Goblins spend much of their lives squabbling and fighting amongst themselves. Sometimes this
    will happen at the worst of times. At the beginning of each Night Goblin turn roll a D6. On a
    roll of 1 they start to squabble and will do nothing else for the rest of the turn. Only Night
    Goblins are affected. Trolls, Squigs, Snotlings and other non-goblins are not affected and will
    act as normal.
  source:
    manual: broheim.net
    printed_page: 8
    section: Special Rules / Animosity
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Crooked Moon Night Goblins.pdf
  name_i18n:
    es: Rencor
  effect_i18n:
    es: >-
      Los Goblins pasan gran parte de sus vidas reñían y peleando entre ellos. A veces esto ocurre
      en el peor de los momentos. Al inicio de cada turno de Goblins Nocturnos tira 1D6. Con un
      resultado de 1, empiezan a reñir y no harán nada más durante el resto del turno. Solo se ven
      afectados los Goblins Nocturnos. Trolls, Squigs, Snotlings y otros no goblins no se ven
      afectados y actuarán con normalidad.
  applies_to:
    band: true
    profile_ids:
    - big-boss
    - shaman
    - bosses
    - squig-hopper
    - night-goblins
    - fanatics
- id: band--hate-stunties-and-skaven
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: band
    effects:
    - id: mechanic.hatred-dwarfs-skaven
      scope: 'YES'
      binding:
        kind: mechanic
        id: mechanic.hatred-dwarfs-skaven
  name: Hate Stunties and Skaven
  effect: >-
    Night Goblins are subject to hatred towards Dwarfs and Skaven. This only affects Night Goblins,
    not any other greenskins. Fanatics are so out of their skull that they are not affected.
  source:
    manual: broheim.net
    printed_page: 8
    section: Special Rules / Hate Stunties and Skaven
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Crooked Moon Night Goblins.pdf
  name_i18n:
    es: Odio a los Stunties y Skaven
  effect_i18n:
    es: >-
      Los Goblins Nocturnos están sujetos a odio hacia los Enanos y los Skaven. Esto solo afecta a
      los Goblins Nocturnos, no a otros pieles verdes. Los Fanáticos están tan fuera de sí que no se
      ven afectados.
  applies_to:
    band: true
- id: band--night-goblin-special-skills
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.crooked-moon-kep.band.night-goblin-special-skills
      scope: LATER
      binding: null
      reason: >-
        Special skill list: Ded Shooty is a shooting modifier (out of scope), Sneaky Git is a
        deployment mechanic and Infiltrate/Netter resolve against the equivalent rules from the
        active KB at the equivalence review; preserved verbatim for now.
  name: Night Goblin Special Skills
  effect: >-
    Ded Shooty: the clever little git adds +6" to the range of any missile weapons he uses (not
    including nets). Sneaky Git: the greenskin is sneaky so that he can move D6" from a Night Goblin
    band member after all the other deployment is complete. Night Goblin Big Boss only. Infiltrate:
    as Skaven skill. Netter: a Night Goblin hunts Squigs in the depths of the mountains and has
    mastered the technique of the net and charge; the Goblin may declare that he is making a net
    charge, throwing the net at a target in the same way as described in the Mordheim rulebook; if
    he hits and the target fails to escape the net then the target counts as knocked down and the
    Goblin completes his charge; if he misses or the target escapes then the Goblin makes a failed
    charge (if the failed charge would take him into base contact then stop him 1" away); a warrior
    caught in a net will be automatically hit in combat but the Goblin must still roll to wound as
    with a knocked down enemy; in the warrior's next recovery phase, unless stunned or out of
    action, he will cut himself out of the net but cannot do anything else and will count as lasting
    in combat as if he had stood up from being knocked down.
  source:
    manual: broheim.net
    printed_page: 8
    section: Night Goblin Special Skills
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Crooked Moon Night Goblins.pdf
  name_i18n:
    es: Habilidades Especiales de Goblins Nocturnos
  effect_i18n:
    es: >-
      Muy Puntero: el astuto mierdas suma +6" al alcance de cualquier arma de misil que use (sin
      incluir redes). Git Listo: el piel verde es tan sigiloso que puede mover 1D6" desde un miembro
      Goblin Nocturno de la banda después de que todo el resto del despliegue esté completo; solo el
      Gran Jefe Goblin Nocturno. Infiltrarse: como la habilidad Skaven. Redador: un Goblin Nocturno
      caza Squigs en las profundidades de las montañas y ha dominado la técnica de la red y la
      carga; el Goblin puede declarar que efectúa una carga con red, lanzando la red contra un
      objetivo de la misma forma que se describe en el libro de reglas de Mordheim; si impacta y el
      objetivo no logra escapar de la red, el objetivo cuenta como derribado y el Goblin completa su
      carga; si falla o el objetivo escapa, el Goblin efectúa una carga fallida (si la carga fallida
      lo llevara a contacto, detenlo a 1" de distancia); un guerrero atrapado en una red será
      impactado automáticamente en combate, pero el Goblin aún debe tirar para herir como contra un
      enemigo derribado; en la siguiente fase de recuperación del guerrero, salvo que esté aturdido
      o fuera de combate, se cortará la red por sí mismo pero no podrá hacer nada más y contará como
      habiendo durado en combate como si se hubiera levantado de estar derribado.
  applies_to:
    band: true
- id: band--waagh-magic
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.crooked-moon-kep.band.waagh-magic
      scope: 'NO'
      binding: null
      reason: 'Outside the established 1v1 melee scope: shooting, casting or escape without resolving the duel. Source prose is retained; this is an exclusion, not deferred modular implementation.'
  name: WAAAGH Magic
  effect: >-
    WAAAGH spells are a ritual of art, prayer to Gork and Mork. The Shaman's spells: 1 Gork's Wacky
    Curse (Difficulty 5): regardless of the circumstances, the spell only lasts until the caster is
    knocked down, stunned or taken out of action. 2 Geronimoff! (Difficulty 7): a huge, green blob
    of ectoplasm hits and pushes an enemy away; range 6"; move any enemy model within range directly
    away from the Shaman; if the target collides with another model or building both suffer 1 hit;
    may not be cast on a model in hand-to-hand combat. 3 Zzap! (Difficulty 8): a crackling green
    bolt of WAAAGH! energy erupts from the Shaman's forehead to strike the nearest opponent; range
    12"; causes 4 hits on the closest enemy target with no armour saves allowed. 4 Fooled Ya!
    (Difficulty 6): the Shaman disappears in a green mist, confusing his enemies; no enemy may
    charge the Shaman during their next turn; if the Shaman is engaged in hand-to-hand combat he may
    immediately move 4" away. 5 Gork's Club (Difficulty 7): a huge, green ectoplasmic club appears
    in the hand of the Shaman; the ectoplasmic club counts as a normal club with a +2 strength bonus
    and gives the wielder +1 armour save against hand-to-hand combat attacks. 6 Fist of Gork
    (Difficulty 8): twin bolts of green flame shoot from the Shaman's eyes and strike the nearest
    enemy; range 12"; each of the two bolts causes a D6 hit; the bolts can either be fired both at
    the closest enemy target or split between the two closest enemy targets.
  source:
    manual: broheim.net
    printed_page: 15
    section: WAAAGH Magic
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Crooked Moon Night Goblins.pdf
  name_i18n:
    es: Magia WAAAGH
  effect_i18n:
    es: >-
      Los hechizos WAAAGH! son un ritual de arte, plegaria a Gork y Mork. Los hechizos del Chamán: 1
      Maldición Chiflada de Gork (Dificultad 5): sea cual sea la circunstancia, el hechizo solo dura
      hasta que el lanzador quede derribado, aturdido o Fuera de Combate. 2 ¡Geronimoff! (Dificultad
      7): una enorme y verde blob de ectoplasma impacta y empuja a un enemigo; alcance 6"; mueve
      cualquier modelo enemigo dentro del alcance directamente alejándolo del Chamán; si el objetivo
      colisiona con otro modelo o edificio, ambos sufren 1 impacto; no puede lanzarse sobre un
      modelo en combate cuerpo a cuerpo. 3 ¡Zzap! (Dificultad 8): un chispeante rayo verde de
      energía WAAAGH! irrumpe de la frente del Chamán para golpear al oponente más cercano; alcance
      12"; causa 4 impactos sobre el objetivo enemigo más cercano sin salvaciones por armadura. 4
      ¡Engañado! (Dificultad 6): el Chamán desaparece en una niebla verde, confundiendo a sus
      enemigos; ningún enemigo puede cargar contra el Chamán durante su siguiente turno; si el
      Chamán está en combate cuerpo a cuerpo puede moverse inmediatamente 4" alejándose. 5 Garra de
      Gork (Dificultad 7): una enorme garra ectoplásmica verde aparece en la mano del Chamán; la
      garra ectoplásmica cuenta como una maza normal con un bonificador de Fuerza de +2 y otorga al
      portador +1 a la salvación por armadura contra ataques de combate cuerpo a cuerpo. 6 Puño de
      Gork (Dificultad 8): dos rayos de llama verde salen disparados de los ojos del Chamán y
      golpean al enemigo más cercano; alcance 12"; cada uno de los dos rayos causa un impacto de
      1D6; los rayos pueden dispararse ambos contra el objetivo enemigo más cercano o repartirse
      entre los dos objetivos enemigos más cercanos.
  applies_to:
    band: true
