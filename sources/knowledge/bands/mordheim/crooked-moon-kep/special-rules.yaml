- id: squig-hopper--squig-jump
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.crooked-moon-kep.squig-hopper.squig-jump
      scope: 'NO'
      binding: null
      reason: 'Outside the established 1v1 melee scope: map, movement, deployment or visibility. Source prose is retained; this is an exclusion, not deferred modular implementation.'
  name: Squig Jump
  effect: >-
    Squig Hoppers move using the random 2D6 Movement characteristic of their Squig mount instead of
    a normal move; they never run and never declare a charge. Instead they are allowed to contact an
    enemy model within their normal 2D6 movement; if this happens, they count as having charged for
    the following round of close combat.
  source:
    manual: broheim.net
    printed_page: 13
    section: Heroes / 0-2 Squig Hoppers / Special Rules
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Crooked Moon Night Goblins.pdf
  name_i18n:
    es: Salto de Squig
  effect_i18n:
    es: >-
      Los Squig Hoppers se mueven usando la característica de Movimiento aleatoria 2D6 de su montura
      Squig en lugar de un movimiento normal; nunca corren ni declaran una carga. En su lugar, se
      les permite contactar con un modelo enemigo dentro de su movimiento normal de 2D6; si esto
      ocurre, cuentan como que han cargado para la siguiente ronda de combate cuerpo a cuerpo.
  applies_to:
    profile_ids:
    - squig-hopper
- id: fanatics--addict
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.crooked-moon-kep.fanatics.addict
      scope: 'NO'
      binding: null
      reason: 'Outside the established 1v1 melee scope: campaign, recruitment, progression or post-duel aftermath. Source prose is retained; this is an exclusion, not deferred modular implementation.'
  name: Addict
  effect: >-
    The Fanatic is dependent on a regular supply of Mad Cap mushrooms. If he can't get any before a
    battle he will stay in his cave foaming at the mouth and not take part. If available he will eat
    his mushrooms before the battle.
  source:
    manual: broheim.net
    printed_page: 14
    section: Henchmen / 0-2 Fanatics / Special Rules / Addict
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Crooked Moon Night Goblins.pdf
  name_i18n:
    es: Adicto
  effect_i18n:
    es: >-
      El Fanático depende de un suministro regular de setas Capachas. Si no consigue ninguna antes
      de una batalla, se quedará en su cueva echando espuma por la boca y no participará. Si hay
      disponibles, se comerá sus setas antes de la batalla.
  applies_to:
    profile_ids:
    - fanatics
- id: fanatics--looney
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.crooked-moon-kep.fanatics.looney
      scope: LATER
      binding: null
      reason: >-
        Frenzy is a psychology mechanic; verify against trait.frenzy semantics for band-wide frenzy
        at the equivalence review.
  name: Looney
  effect: >-
    Due to the effect of the mushrooms he is subject to frenzy. He must also test for permanent
    damage after the battle as described in the rulebook.
  source:
    manual: broheim.net
    printed_page: 14
    section: Henchmen / 0-2 Fanatics / Special Rules / Looney
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Crooked Moon Night Goblins.pdf
  name_i18n:
    es: Chiflado
  effect_i18n:
    es: >-
      Debido al efecto de las setas está sujeto a Frenesí. También debe hacer un chequeo de daño
      permanente tras la batalla, tal y como se describe en el libro de reglas.
  applies_to:
    profile_ids:
    - fanatics
- id: fanatics--frantic
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: mechanic.frantic
      scope: 'YES'
      binding:
        kind: mechanic
        id: mechanic.frantic
  name: Frantic
  effect: >-
    The Fanatic is hyperactive and will strike first in combat, ignoring penalties for weapons or
    initiative order.
  source:
    manual: broheim.net
    printed_page: 14
    section: Henchmen / 0-2 Fanatics / Special Rules / Frantic
    url: https://broheim.net/downloads/warbands/supplement/mutinyinmarienburg/Crooked Moon Night Goblins.pdf
  name_i18n:
    es: Frenético
  effect_i18n:
    es: >-
      El Fanático es hiperactivo y golpeará primero en combate, ignorando las penalizaciones por
      armas u orden de iniciativa.
  applies_to:
    profile_ids:
    - fanatics
- id: cave-squigs--movement
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
