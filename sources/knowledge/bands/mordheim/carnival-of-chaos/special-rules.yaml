schema_version: 2
band_id: carnival-of-chaos
rules:
- id: carnival-master--leader
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: mechanic.leader-six
      scope: 'YES'
      binding:
        kind: mechanic
        id: mechanic.leader-six
  name: Leader
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 1 Carnival Master / Special Rules / Leader
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/carnival-of-chaos
  name_i18n:
    es: Líder
  applies_to:
    profile_ids:
    - carnival-master
  rule_ref: shared-rule.leader
- id: carnival-master--wizard
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.carnival-of-chaos.carnival-master.wizard
      scope: 'NO'
      binding: null
      reason: out-of-scope.magic
  name: Wizard
  effect: The Master is a wizard and uses Nurgle Rituals.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 1 Carnival Master / Special Rules / Wizard
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/carnival-of-chaos
  name_i18n:
    es: Mago
  effect_i18n:
    es: El Maestro es un mago y usa los Rituales de Nurgle.
  applies_to:
    profile_ids:
    - carnival-master
- id: brutes--unnatural-strength
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: skill.strongman
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.strongman
  name: Unnatural Strength
  effect: >-
    Brutes start the game with the Strongman skill from the Strength skill list in the Mordheim
    rulebook.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 – 2 Brutes / Special Rules / Unnatural Strength
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/carnival-of-chaos
  name_i18n:
    es: Fuerza Antinatural
  effect_i18n:
    es: >-
      Los Brutos comienzan la partida con la habilidad Forzudo de la lista de habilidades de Fuerza
      del libro de reglas de Mordheim.
  applies_to:
    profile_ids:
    - brutes
- id: tainted-ones--nurgles-blessings
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: compiler.nurgle-s-blessings
      scope: 'YES'
      binding:
        kind: compiler
        id: compiler.nurgle-s-blessings
  name: Nurgle’s Blessings
  effect: >-
    Tainted Ones must start the game with one or more Blessings of Nurgle. See the Blessings of
    Nurgle that follow.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 – 2 Tainted Ones / Special Rules / Nurgle’s Blessings
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/carnival-of-chaos
  name_i18n:
    es: Bendiciones de Nurgle
  effect_i18n:
    es: >-
      Los Contaminados deben comenzar la partida con una o más Bendiciones de Nurgle. Ver las
      Bendiciones de Nurgle que siguen.
  applies_to:
    profile_ids:
    - tainted-ones
- id: plague-bearers--cloud-of-flies
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: trait.cloud-of-flies
      scope: 'YES'
      binding:
        kind: trait
        id: trait.cloud-of-flies
        parameters:
          value: true
      clauses:
      - id: whole
        scope: 'YES'
      - id: dodgy-ranged-part
        scope: 'NO'
    - id: unimplemented.carnival-of-chaos.plague-bearers.dodgy-ranged-part
      scope: 'NO'
      binding: null
      reason: out-of-scope.shooting
  name: Cloud of Flies
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 2 Plague Bearers / Special Rules / Cloud of Flies
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/carnival-of-chaos
  name_i18n:
    es: Nube de Moscas
  applies_to:
    profile_ids:
    - plague-bearers
  rule_ref: shared-rule.cloud-of-flies
- id: plague-bearers--stream-of-corruption
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.carnival-of-chaos.plague-bearers.stream-of-corruption
      scope: 'NO'
      binding: null
      reason: out-of-scope.shooting
  name: Stream of Corruption
  effect: >-
    Plague Bearers can spew forth a grotesque stream of maggots, entrails and filth. This is counted
    as a shooting attack with a range of 6" and is resolved at Strength 3 with no saves for armour.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 2 Plague Bearers / Special Rules / Stream of Corruption
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/carnival-of-chaos
  name_i18n:
    es: Chorro de Corrupción
  effect_i18n:
    es: >-
      Los Portadores de la Peste pueden escupir un grotesco chorro de larvas, entrañas y inmundicia.
      Esto cuenta como un ataque de disparo con un alcance de 6" y se resuelve con Fuerza 3 sin
      salvaciones por armadura.
  applies_to:
    profile_ids:
    - plague-bearers
- id: plague-bearers--demonic
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.carnival-of-chaos.plague-bearers.demonic
      scope: 'NO'
      binding: null
      reason: out-of-scope.campaign
  name: Demonic
  effect: >-
    Plague Bearers are Daemons of the lord of disease, Nurgle, and are not made of living flesh but
    the eternal and unchanging forces of Chaos. Therefore they never gain Experience.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 2 Plague Bearers / Special Rules / Demonic
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/carnival-of-chaos
  name_i18n:
    es: Demoníaco
  effect_i18n:
    es: >-
      Los Portadores de la Peste son Demonios del señor de la enfermedad, Nurgle, y no están hechos
      de carne viviente sino de las fuerzas eternas e inmutables del Caos. Por tanto, nunca ganan
      Experiencia.
  applies_to:
    profile_ids:
    - plague-bearers
- id: plague-bearers--immune-to-poison
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: trait.poison-immune
      scope: 'YES'
      binding:
        kind: trait
        id: trait.poison-immune
        parameters:
          value: true
      clauses:
      - id: poison-immunity
        scope: 'YES'
      - id: disease-immunity
        scope: 'NO'
  name: Immune to Poison
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 2 Plague Bearers / Special Rules / Immune to Poison
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/carnival-of-chaos
  name_i18n:
    es: Inmune al Veneno
  applies_to:
    profile_ids:
    - plague-bearers
  rule_ref: shared-rule.daemonic-immune-to-poison
- id: plague-bearers--immune-to-psychology
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: mechanic.automatic-leadership
      scope: 'YES'
      binding:
        kind: mechanic
        id: mechanic.automatic-leadership
  name: Immune to Psychology
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 2 Plague Bearers / Special Rules / Immune to Psychology
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/carnival-of-chaos
  name_i18n:
    es: Inmune a la Psicología
  applies_to:
    profile_ids:
    - plague-bearers
  rule_ref: shared-rule.daemonic-immune-to-psychology
- id: plague-bearers--cause-fear
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: mechanic.causes-fear
      scope: 'YES'
      binding:
        kind: mechanic
        id: mechanic.causes-fear
  name: Cause Fear
  effect: Plague Bearers are horrifying supernatural creatures and therefore cause fear.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 2 Plague Bearers / Special Rules / Cause Fear
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/carnival-of-chaos
  name_i18n:
    es: Causan Miedo
  effect_i18n:
    es: >-
      Los Portadores de la Peste son criaturas sobrenaturales horripilantes y por tanto provocan
      miedo.
  applies_to:
    profile_ids:
    - plague-bearers
- id: plague-bearers--daemonic-aura
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: trait.natural-armour-save
      scope: 'YES'
