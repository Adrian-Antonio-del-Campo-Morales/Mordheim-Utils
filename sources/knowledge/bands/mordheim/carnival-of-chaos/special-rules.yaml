  name: Plague Cart
  effect: While the Plague Cart is in the warband, the maximum number of warriors is increased by 2. Plague Bearers and Nurglings
    may re-roll Leadership tests for Daemonic Instability and add +1 to their Injury tests if taken out of action.
  source:
