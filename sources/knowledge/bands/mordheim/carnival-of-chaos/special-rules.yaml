  name: Nurgle’s Blessings
  effect: Tainted Ones must start the game with one or more Blessings of Nurgle. See the Blessings of Nurgle that follow.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 – 2 Tainted Ones / Special Rules / Nurgle’s Blessings
