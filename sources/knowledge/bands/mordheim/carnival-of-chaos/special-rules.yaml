  name: Leader
  effect: 'Any models in the warband within 6" of

    the Master may use his Leadership instead of their

    own.'
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 1 Carnival Master / Special Rules / Leader
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/carnival-of-chaos
