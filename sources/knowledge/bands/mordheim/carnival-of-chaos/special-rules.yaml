      reason: out-of-scope.campaign
  name: Swarm
  effect: >-
    You may summon as many Nurglings as you wish (ie. you may have more than five Nurglings in a
    Henchman group).
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / Nurglings / Special Rules / Swarm
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/carnival-of-chaos
  name_i18n:
    es: Enjambre
  effect_i18n:
    es: >-
      Puedes invocar tantos Nurglins como desees (es decir, puedes tener más de cinco Nurglins en un
      grupo de Secuaces).
  applies_to:
    profile_ids:
    - nurglings
