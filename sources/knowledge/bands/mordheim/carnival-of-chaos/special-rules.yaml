  name: Blessings of Nurgle
  effect: Those that worship at the fetid altar of the Lord of Decay suffer from terrible diseases and
    decay, which are known as Blessings of Nurgle. Blessings of Nurgle may be bought for Tainted Ones
    only when they are recruited; you may not buy new Blessings for a model after recruitment. Any Tainted
    may have one or more Blessings. The first Blessing is bought at the price indicated, but second and
    subsequent Blessings cost double.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Blessings of Nurgle
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/carnival-of-chaos
  name_i18n:
    en: Blessings of Nurgle
    es: Bendiciones de Nurgle
  effect_i18n:
    en: 'Those that worship at the fetid altar of the Lord of Decay suffer from terrible diseases

      and decay, which are known as Blessings of Nurgle.

      Blessings of Nurgle may be bought for Tainted Ones only when they are recruited; you

      may not buy new Blessings for a model after recruitment. Any Tainted may have one or

      more Blessings. The first Blessing is bought at the price indicated, but second and

      subsequent Blessings cost double.'
    es: Quienes rinden culto al fétido altar del Señor de la Decadencia sufren terribles enfermedades
      y putrefacción, conocidas como Bendiciones de Nurgle. Las Bendiciones de Nurgle pueden comprarse
      para los Contaminados solo cuando son reclutados; no puedes comprar nuevas Bendiciones para una
      miniatura tras el reclutamiento. Cualquier Contaminado puede tener una o más Bendiciones. La primera
      Bendición se compra al precio indicado, pero la segunda y sucesivas Bendiciones cuestan el doble.
  applies_to:
    band: true
