      Coste: 25 coronas de oro. El Contaminado está rodeado por una nube de moscas, que zumban a su
      alrededor y alrededor de su oponente de combate. No afectan al Contaminado pero distraen a los
      enemigos zumbando en ojos, fosas nasales y bocas. El oponente de combate del Contaminado sufre
      un modificador de -1 para impactar en todos los ataques.
  applies_to:
