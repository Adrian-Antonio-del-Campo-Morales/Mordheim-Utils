- id: plague-bearers--cloud-of-flies
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: trait.cloud-of-flies
      scope: 'YES'
      binding:
        kind: trait
        id: trait.cloud-of-flies
        parameters:
          value: true
  name: Cloud of Flies
  effect: 'Plague Bearers are surrounded

    by a cloud of flies, which buzz around them and

    their combat opponent. They do not affect the Plague Bearer but distract foes by buzzing into

    eyes, nostrils and mouths. A Plague Bearer’s close

    combat opponent suffers a -1 to hit modifier on all

    attacks.'
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 2 Plague Bearers / Special Rules / Cloud of Flies
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/carnival-of-chaos
  name_i18n:
    en: Cloud of Flies
    es: null
  effect_i18n:
    en: 'Plague Bearers are surrounded

      by a cloud of flies, which buzz around them and

      their combat opponent. They do not affect the Plague Bearer but distract foes by buzzing into

      eyes, nostrils and mouths. A Plague Bearer’s close

      combat opponent suffers a -1 to hit modifier on all

      attacks.'
    es: null
  applies_to:
    profile_ids:
    - plague-bearers
- id: plague-bearers--stream-of-corruption
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.carnival-of-chaos.plague-bearers.stream-of-corruption
      scope: 'NO'
      binding: null
      reason: 'Out of scope: shooting.'
  name: Stream of Corruption
  effect: 'Plague Bearers can

    spew forth a grotesque stream of maggots, entrails

    and filth. This is counted as a shooting attack with

    a range of 6" and is resolved at Strength 3 with no

    saves for armour.'
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 2 Plague Bearers / Special Rules / Stream of Corruption
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/carnival-of-chaos
  name_i18n:
    en: Stream of Corruption
    es: null
  effect_i18n:
    en: 'Plague Bearers can

      spew forth a grotesque stream of maggots, entrails

      and filth. This is counted as a shooting attack with

      a range of 6" and is resolved at Strength 3 with no

      saves for armour.'
    es: null
  applies_to:
    profile_ids:
    - plague-bearers
- id: plague-bearers--demonic
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.carnival-of-chaos.plague-bearers.demonic
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign.'
  name: Demonic
  effect: 'Plague Bearers are Daemons of the

    lord of disease, Nurgle, and are not made of living

    flesh but the eternal and unchanging forces of

    Chaos. Therefore they never gain Experience.'
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 2 Plague Bearers / Special Rules / Demonic
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/carnival-of-chaos
  name_i18n:
