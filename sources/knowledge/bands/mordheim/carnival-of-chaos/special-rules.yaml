  name: Guardian
  effect: The Guardian is permanently part of the Cart and can never dismount. It cannot be injured separately; if the Cart
    is destroyed, the Guardian is destroyed as well. The Guardian is Daemonic, never gains Experience, and its attacks cause
    Nurgle’s Rot.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 1 Plague Cart / Special Rules / Guardian
