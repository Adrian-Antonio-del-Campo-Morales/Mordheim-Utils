- id: plague-bearers--daemonic-aura
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: trait.natural-armour-save
      scope: 'YES'
      binding:
        kind: trait
        id: trait.natural-armour-save
        parameters:
          value: 5
    - id: trait.natural-armour-negated-by-magic
      scope: 'YES'
      binding:
        kind: trait
        id: trait.natural-armour-negated-by-magic
        parameters:
          value: true
    - id: trait.magical-attacks
      scope: 'YES'
      binding:
        kind: trait
        id: trait.magical-attacks
        parameters:
          value: true
  name: Daemonic Aura
  effect: 'Due to the magical, intangible

    nature of Daemons they have a special Armour

    save of 5+. This is modified by the Strength of the

    attack as normal and is completely negated by

    magic weapons and spells. Plague Bearers’ attacks

    are considered as magical also.'
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 2 Plague Bearers / Special Rules / Daemonic Aura
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/carnival-of-chaos
  name_i18n:
    en: Daemonic Aura
    es: null
  effect_i18n:
    en: 'Due to the magical, intangible

      nature of Daemons they have a special Armour

      save of 5+. This is modified by the Strength of the

      attack as normal and is completely negated by

      magic weapons and spells. Plague Bearers’ attacks

      are considered as magical also.'
    es: null
  applies_to:
    profile_ids:
