schema_version: 2
band_id: carnival-of-chaos
rules:
- id: carnival-master--leader
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.carnival-of-chaos.carnival-master.leader
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology.'
  name: Leader
  effect: Any models in the warband within 6" of the Master may use his Leadership instead of their own.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 1 Carnival Master / Special Rules / Leader
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/carnival-of-chaos
  name_i18n:
    en: Leader
    es: Líder
  effect_i18n:
    en: 'Any models in the warband within 6" of

      the Master may use his Leadership instead of their

      own.'
    es: Todas las miniaturas de la banda a 6" del Maestro pueden usar su Liderazgo en lugar del suyo propio.
  applies_to:
    profile_ids:
    - carnival-master
- id: carnival-master--wizard
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.carnival-of-chaos.carnival-master.wizard
      scope: 'NO'
      binding: null
      reason: 'Out of scope: magic.'
  name: Wizard
  effect: The Master is a wizard and uses Nurgle Rituals.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 1 Carnival Master / Special Rules / Wizard
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/carnival-of-chaos
  name_i18n:
    en: Wizard
    es: Mago
  effect_i18n:
    en: The Master is a wizard and uses Nurgle Rituals.
    es: El Maestro es un mago y usa los Rituales de Nurgle.
  applies_to:
    profile_ids:
    - carnival-master
- id: brutes--unnatural-strength
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: skill.strongman
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.strongman
  name: Unnatural Strength
  effect: Brutes start the game with the Strongman skill from the Strength skill list in the Mordheim
    rulebook.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 – 2 Brutes / Special Rules / Unnatural Strength
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/carnival-of-chaos
  name_i18n:
    en: Unnatural Strength
    es: Fuerza antinatural
  effect_i18n:
    en: 'Brutes start the game with

      the Strongman skill from the Strength skill list in

      the Mordheim rulebook.'
    es: Los Brutos comienzan la partida con la habilidad Forzudo de la lista de habilidades de Fuerza
      del libro de reglas de Mordheim.
  applies_to:
    profile_ids:
    - brutes
- id: tainted-ones--nurgles-blessings
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: compiler.nurgle-s-blessings
      scope: 'YES'
      binding:
        kind: compiler
        id: compiler.nurgle-s-blessings
  name: Nurgle’s Blessings
  effect: Tainted Ones must start the game with one or more Blessings of Nurgle. See the Blessings of
    Nurgle that follow.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 – 2 Tainted Ones / Special Rules / Nurgle’s Blessings
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/carnival-of-chaos
  name_i18n:
    en: Nurgle’s Blessings
    es: Bendiciones de Nurgle
  effect_i18n:
    en: 'Tainted Ones must start the

      game with one or more Blessings of Nurgle. See

      the Blessings of Nurgle that follow.'
    es: Los Contaminados deben comenzar la partida con una o más Bendiciones de Nurgle. Ver las Bendiciones
      de Nurgle que siguen.
  applies_to:
    profile_ids:
    - tainted-ones
- id: plague-bearers--cloud-of-flies
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: trait.cloud-of-flies
      scope: 'YES'
      binding:
        kind: trait
        id: trait.cloud-of-flies
        parameters:
          value: true
  name: Cloud of Flies
  effect: Plague Bearers are surrounded by a cloud of flies, which buzz around them and their combat opponent.
    They do not affect the Plague Bearer but distract foes by buzzing into eyes, nostrils and mouths.
    A Plague Bearer’s close combat opponent suffers a -1 to hit modifier on all attacks.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 2 Plague Bearers / Special Rules / Cloud of Flies
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/carnival-of-chaos
  name_i18n:
    en: Cloud of Flies
    es: Nube de moscas
  effect_i18n:
    en: 'Plague Bearers are surrounded

      by a cloud of flies, which buzz around them and

      their combat opponent. They do not affect the Plague Bearer but distract foes by buzzing into

      eyes, nostrils and mouths. A Plague Bearer’s close

      combat opponent suffers a -1 to hit modifier on all

      attacks.'
    es: Los Portadores de la Peste están rodeados por una nube de moscas, que zumban a su alrededor y
      alrededor de su oponente de combate. No afectan al Portador de la Peste pero distraen a los enemigos
      zumbando en ojos, fosas nasales y bocas. El oponente de combate de un Portador de la Peste sufre
      un modificador de -1 para impactar en todos los ataques.
  applies_to:
    profile_ids:
    - plague-bearers
- id: plague-bearers--stream-of-corruption
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.carnival-of-chaos.plague-bearers.stream-of-corruption
      scope: 'NO'
      binding: null
      reason: 'Out of scope: shooting.'
  name: Stream of Corruption
  effect: Plague Bearers can spew forth a grotesque stream of maggots, entrails and filth. This is counted
    as a shooting attack with a range of 6" and is resolved at Strength 3 with no saves for armour.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 2 Plague Bearers / Special Rules / Stream of Corruption
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/carnival-of-chaos
  name_i18n:
    en: Stream of Corruption
    es: Chorro de corrupción
  effect_i18n:
    en: 'Plague Bearers can

      spew forth a grotesque stream of maggots, entrails

      and filth. This is counted as a shooting attack with

      a range of 6" and is resolved at Strength 3 with no

      saves for armour.'
    es: Los Portadores de la Peste pueden escupir un grotesco chorro de larvas, entrañas y inmundicia.
      Esto cuenta como un ataque de disparo con un alcance de 6" y se resuelve con Fuerza 3 sin salvaciones
      por armadura.
  applies_to:
    profile_ids:
    - plague-bearers
- id: plague-bearers--demonic
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.carnival-of-chaos.plague-bearers.demonic
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign.'
  name: Demonic
  effect: Plague Bearers are Daemons of the lord of disease, Nurgle, and are not made of living flesh
    but the eternal and unchanging forces of Chaos. Therefore they never gain Experience.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 2 Plague Bearers / Special Rules / Demonic
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/carnival-of-chaos
  name_i18n:
    en: Demonic
    es: Demoníaco
  effect_i18n:
    en: 'Plague Bearers are Daemons of the

      lord of disease, Nurgle, and are not made of living

      flesh but the eternal and unchanging forces of

      Chaos. Therefore they never gain Experience.'
    es: Los Portadores de la Peste son Demonios del señor de la enfermedad, Nurgle, y no están hechos
      de carne viviente sino de las fuerzas eternas e inmutables del Caos. Por tanto, nunca ganan Experiencia.
  applies_to:
    profile_ids:
    - plague-bearers
- id: plague-bearers--immune-to-poison
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: trait.poison-immune
      scope: 'YES'
      binding:
        kind: trait
        id: trait.poison-immune
        parameters:
          value: true
  name: Immune to Poison
  effect: Plague Bearers are the Daemonic embodiment of disease and pestilence. They are totally immune
    to all poisons and diseases.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 2 Plague Bearers / Special Rules / Immune to Poison
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/carnival-of-chaos
  name_i18n:
    en: Immune to Poison
    es: Inmune al veneno
  effect_i18n:
    en: 'Plague Bearers are the

      Daemonic embodiment of disease and pestilence.

      They are totally immune to all poisons and

      diseases.'
    es: Los Portadores de la Peste son la encarnación demoníaca de la enfermedad y la pestilencia. Son
      totalmente inmunes a todos los venenos y enfermedades.
  applies_to:
    profile_ids:
    - plague-bearers
- id: plague-bearers--immune-to-psychology
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.carnival-of-chaos.plague-bearers.immune-to-psychology
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology.'
  name: Immune to Psychology
  effect: Plague Bearers are Daemons and do not know the concept of fear. They automatically pass any
    Leadership-based test they are required to take.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 2 Plague Bearers / Special Rules / Immune to Psychology
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/carnival-of-chaos
  name_i18n:
    en: Immune to Psychology
    es: Inmune a la psicología
  effect_i18n:
    en: 'Plague Bearers are

      Daemons and do not know the concept of fear.

      They automatically pass any Leadership-based test

      they are required to take.'
    es: Los Portadores de la Peste son Demonios y no conocen el concepto de miedo. Superan automáticamente
      cualquier chequeo basado en Liderazgo que deban realizar.
  applies_to:
    profile_ids:
    - plague-bearers
- id: plague-bearers--cause-fear
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.carnival-of-chaos.plague-bearers.cause-fear
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology.'
  name: Cause Fear
  effect: Plague Bearers are horrifying supernatural creatures and therefore cause fear.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 2 Plague Bearers / Special Rules / Cause Fear
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/carnival-of-chaos
  name_i18n:
    en: Cause Fear
    es: Provocar miedo
  effect_i18n:
    en: 'Plague Bearers are horrifying

      supernatural creatures and therefore cause fear.'
    es: Los Portadores de la Peste son criaturas sobrenaturales horripilantes y por tanto provocan miedo.
  applies_to:
    profile_ids:
    - plague-bearers
- id: plague-bearers--daemonic-aura
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: trait.natural-armour-save
      scope: 'YES'
      binding:
        kind: trait
        id: trait.natural-armour-save
        parameters:
          value: 5
    - id: trait.natural-armour-negated-by-magic
      scope: 'YES'
      binding:
        kind: trait
        id: trait.natural-armour-negated-by-magic
        parameters:
          value: true
    - id: trait.magical-attacks
      scope: 'YES'
      binding:
        kind: trait
        id: trait.magical-attacks
        parameters:
          value: true
  name: Daemonic Aura
  effect: Due to the magical, intangible nature of Daemons they have a special Armour save of 5+. This
    is modified by the Strength of the attack as normal and is completely negated by magic weapons and
    spells. Plague Bearers’ attacks are considered as magical also.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 2 Plague Bearers / Special Rules / Daemonic Aura
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/carnival-of-chaos
  name_i18n:
    en: Daemonic Aura
    es: Aura demoníaca
  effect_i18n:
    en: 'Due to the magical, intangible

      nature of Daemons they have a special Armour

      save of 5+. This is modified by the Strength of the

      attack as normal and is completely negated by

      magic weapons and spells. Plague Bearers’ attacks

      are considered as magical also.'
    es: Debido a la naturaleza mágica e intangible de los Demonios, tienen una salvación de armadura especial
      de 5+. Esta se modifica por la Fuerza del ataque con normalidad y queda completamente anulada por
      armas y hechizos mágicos. Los ataques de los Portadores de la Peste también se consideran mágicos.
  applies_to:
    profile_ids:
    - plague-bearers
- id: plague-bearers--daemonic-instability
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.carnival-of-chaos.plague-bearers.daemonic-instability
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology.'
  name: Daemonic Instability
  effect: Plague Bearers are bound to the world by Dark Sorcery that is highly volatile and unstable.
    If taken out of action a Plague Bearer is banished and effectively destroyed on a D6 roll of 1-3 (do
    not roll for injury). In addition, if the warband routs then every Plague Bearer in the warband must
    take an immediate Leadership test. If this test is failed, then the Plague Bearer counts as destroyed.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 2 Plague Bearers / Special Rules / Daemonic Instability
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/carnival-of-chaos
  name_i18n:
    en: Daemonic Instability
    es: Inestabilidad demoníaca
  effect_i18n:
    en: 'Plague Bearers are

      bound to the world by Dark Sorcery that is

      highly volatile and unstable. If taken out of

      action a Plague Bearer is banished and

      effectively destroyed on a D6 roll of 1-3 (do not

      roll for injury). In addition, if the warband routs

      then every Plague Bearer in the warband must

      take an immediate Leadership test. If this test is

      failed, then the Plague Bearer counts as

      destroyed.'
    es: Los Portadores de la Peste están atados al mundo por una Hechicería Oscura muy volátil e inestable.
      Si es puesto fuera de combate, un Portador de la Peste es desterrado y efectivamente destruido con
      una tirada de D6 de 1-3 (no tire para la herida). Además, si la banda huye, cada Portador de la
      Peste de la banda debe realizar un chequeo de Liderazgo inmediato. Si este chequeo falla, el Portador
      de la Peste cuenta como destruido.
  applies_to:
    profile_ids:
    - plague-bearers
