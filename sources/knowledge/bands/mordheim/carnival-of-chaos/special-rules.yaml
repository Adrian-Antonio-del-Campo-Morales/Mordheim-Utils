- id: band--blessings-of-nurgle-nurgles-rot
  kind: blessing
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: trait.poison-immune
      scope: 'YES'
      binding:
        kind: trait
        id: trait.poison-immune
        parameters:
          value: true
    - id: campaign.nurgles-rot-contagion
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: contagion, roster persistence, pre-battle Toughness tests and permanent
        characteristic loss are campaign effects.
  name: Nurgle’s Rot
  effect: >-
    Cost: 50 Gold Crowns The Tainted One is infected with the deadly pestilence of its lord –
    Nurgle’s Rot. In addition, the Tainted One is immune to all poisons. Nurgle’s Rot is a deadly
    contagion for which there is no known cure. This virulent disease can be passed on in
    hand-to-hand combat. If the Tainted One makes a successful to wound roll of 6 this will result
    in the target model contracting the Rot (note: Nurgle’s Rot only affects the living, so Undead,
    Daemons and the Possessed are immune). Once a warrior has contracted the Rot, mark this on the
    warband roster. Rather than killing the victim immediately, the Rot can take some time to set
    in. From now on, before the start of each battle, the warrior must pass a Toughness test. If
    successful, his constitution has managed to stave off the Rot’s effects. If unsuccessful, the
    warrior loses one point of Toughness permanently (if he reaches zero, he has succumbed to the
    Rot and died, remove him from the roster). In addition, if a 6 is rolled for the Toughness test
    then he has unwittingly passed the Rot on to another member of the warband (randomly allocate a
    warband member and mark this on the roster).
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Blessings of Nurgle / Nurgle’s Rot
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/carnival-of-chaos
  name_i18n:
    en: Nurgle’s Rot
    es: Podredumbre de Nurgle
  effect_i18n:
    en: 'Cost: 50 Gold Crowns

      The Tainted One is infected with the deadly pestilence of its lord – Nurgle’s Rot. In

      addition, the Tainted One is immune to all poisons. Nurgle’s Rot is a deadly contagion

      for which there is no known cure. This virulent disease can be passed on in hand-to-hand combat.
      If the Tainted One makes a successful to wound roll of 6 this will result in

      the target model contracting the Rot (note: Nurgle’s Rot only affects the living, so

      Undead, Daemons and the Possessed are immune). Once a warrior has contracted

      the Rot, mark this on the warband roster. Rather than killing the victim immediately,

      the Rot can take some time to set in. From now on, before the start of each battle, the

      warrior must pass a Toughness test. If successful, his constitution has managed to stave

      off the Rot’s effects. If unsuccessful, the warrior loses one point of Toughness

      permanently (if he reaches zero, he has succumbed to the Rot and died, remove him

      from the roster). In addition, if a 6 is rolled for the Toughness test then he has

      unwittingly passed the Rot on to another member of the warband (randomly allocate a

      warband member and mark this on the roster).'
    es: 'Coste: 50 coronas de oro. El Contaminado está infectado con la letal pestilencia de su señor:
      la Podredumbre de Nurgle. Además, el Contaminado es inmune a todos los venenos. La Podredumbre de
      Nurgle es un contagio letal para el que no se conoce cura. Esta virulenta enfermedad puede transmitirse
      en combate cuerpo a cuerpo. Si el Contaminado obtiene una tirada de herir exitosa de 6, esto hará
      que la miniatura objetivo contraiga la Podredumbre (nota: la Podredumbre de Nurgle solo afecta a
      los vivos, así que los Muertos Vivientes, Demonios y Poseídos son inmunes). Una vez que un guerrero
      ha contraído la Podredumbre, márcalo en la lista de la banda. En lugar de matar a la víctima de
      inmediato, la Podredumbre puede tardar cierto tiempo en asentarse. De ahora en adelante, antes del
      comienzo de cada batalla, el guerrero debe superar un chequeo de Resistencia. Si tiene éxito, su
      constitución ha logrado conjurar los efectos de la Podredumbre. Si falla, el guerrero pierde un
      punto de Resistencia permanentemente (si llega a cero, ha sucumbido a la Podredumbre y ha muerto,
      retíralo de la lista). Además, si se saca un 6 en el chequeo de Resistencia, entonces ha transmitido
      involuntariamente la Podredumbre a otro miembro de la banda (asigna aleatoriamente un miembro de
      la banda y márcalo en la lista).'
  applies_to:
    band: true
