- id: plague-cart--plague-cart
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.carnival-of-chaos.plague-cart.plague-cart
      scope: 'NO'
      binding: null
      reason: source-blocked
  name: Plague Cart
  effect: >-
    While the Plague Cart is in the warband, the maximum number of warriors is increased by 2.
    Plague Bearers and Nurglings may re-roll Leadership tests for Daemonic Instability and add +1 to
    their Injury tests if taken out of action.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 1 Plague Cart / Special Rules / Plague Cart
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/carnival-of-chaos
  name_i18n:
    es: Carro de la Peste
  effect_i18n:
    es: >-
      Mientras el Carro de la Peste esté en la banda, el número máximo de guerreros se incrementa en
      2. Los Portadores de la Peste y los Nurglins pueden repetir los chequeos de Liderazgo por
      Inestabilidad demoníaca y añaden +1 a sus chequeos de Herida si son puestos fuera de combate.
  applies_to:
    profile_ids:
    - plague-cart
- id: plague-cart--guardian
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.carnival-of-chaos.plague-cart.guardian
      scope: 'NO'
      binding: null
      reason: out-of-scope.non-duel
  name: Guardian
  effect: >-
    The Guardian is permanently part of the Cart and can never dismount. It cannot be injured
    separately; if the Cart is destroyed, the Guardian is destroyed as well. The Guardian is
    Daemonic, never gains Experience, and its attacks cause Nurgle’s Rot.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 1 Plague Cart / Special Rules / Guardian
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/carnival-of-chaos
  name_i18n:
    es: Guardián
  effect_i18n:
    es: >-
      El Guardián es permanentemente parte del Carro y nunca puede desmontar. No puede ser herido
      por separado; si el Carro es destruido, el Guardián también lo es. El Guardián es Demoníaco,
      nunca gana Experiencia y sus ataques causan la Podredumbre de Nurgle.
  applies_to:
    profile_ids:
    - plague-cart
- id: plague-cart--guardian-unarmed
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: mechanic.guardian-unarmed
      scope: 'YES'
      binding:
        kind: trait
        id: trait.guardian-unarmed
        parameters:
          value: true
  name: Guardian Unarmed
  effect: The Guardian suffers no penalties for fighting unarmed.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 1 Plague Cart / Weapons/Armour
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/carnival-of-chaos
  name_i18n:
    es: Guardián Desarmado
  effect_i18n:
    es: El Guardián no sufre penalizaciones por luchar desarmado.
  applies_to:
    profile_ids:
    - plague-cart
- id: plague-cart--immune-to-psychology
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: mechanic.automatic-leadership
      scope: 'YES'
      binding:
        kind: mechanic
        id: mechanic.automatic-leadership
  name: Immune to Psychology
  effect: >-
    The Plague Cart and Guardian are Daemonic. The Plague Cart automatically passes any
    Leadership-based test it is required to take.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 1 Plague Cart / Special Rules / Immune to Psychology
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/carnival-of-chaos
  name_i18n:
    es: Inmune a la Psicología
  effect_i18n:
    es: >-
      El Carro de la Peste y el Guardián son Demoníacos. El Carro de la Peste supera automáticamente
      cualquier chequeo basado en Liderazgo que deba realizar.
  applies_to:
    profile_ids:
    - plague-cart
- id: band--dangerous-to-know
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.carnival-of-chaos.band.dangerous-to-know
      scope: 'NO'
      binding: null
      reason: out-of-scope.campaign
  name: Dangerous to Know
  effect: A Carnival of Chaos may never hire any type of Hired Sword.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / Dangerous to Know
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/carnival-of-chaos
  name_i18n:
    es: Peligroso de Conocer
  effect_i18n:
    es: Un Carnaval del Caos nunca puede contratar ningún tipo de Espada a sueldo.
  applies_to:
    band: true
- id: band--tainted
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.carnival-of-chaos.band.tainted
      scope: 'NO'
      binding: null
      reason: out-of-scope.campaign
  name: Tainted
  effect: >-
    The Carnival counts as a Possessed warband for purposes of exploration and serious injuries.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / Tainted
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/carnival-of-chaos
  name_i18n:
    es: Contaminado
  effect_i18n:
    es: El Carnaval cuenta como una banda de Poseídos a efectos de exploración y heridas graves.
  applies_to:
    band: true
- id: band--blessings-of-nurgle
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: band
    effects:
    - id: mechanic.blessings-of-nurgle
      scope: 'YES'
