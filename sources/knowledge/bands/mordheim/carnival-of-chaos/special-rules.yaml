  name_i18n:
    en: Daemonic Instability
    es: Inestabilidad demoníaca
  effect_i18n:
    en: 'Nurglings are bound to

      the world by Dark Sorcery that is highly volatile

      and unstable. If taken out of action a Nurgling is

      banished and effectively destroyed on a D6 roll

      of 1-3 (do not roll for injury). In addition, if the

      warband routs then every Nurgling in the

      warband must take an immediate Leadership

      test. If this test is failed, then Nurgling counts as

      destroyed.'
    es: Los Nurglins están atados al mundo por una Hechicería Oscura muy volátil e inestable. Si es puesto
      fuera de combate, un Nurglin es desterrado y efectivamente destruido con una tirada de D6 de 1-3
      (no tire para la herida). Además, si la banda huye, cada Nurglin de la banda debe realizar un chequeo
      de Liderazgo inmediato. Si este chequeo falla, el Nurglin cuenta como destruido.
  applies_to:
