        scope: 'YES'
      - id: whole--scope--blessing-price
        scope: 'NO'
    - id: campaign.blessings-of-nurgle-purchase-history-and-costs
      scope: 'NO'
      binding: null
      reason: out-of-scope.campaign
  name: Blessings of Nurgle
  effect: >-
    Those that worship at the fetid altar of the Lord of Decay suffer from terrible diseases and
    decay, which are known as Blessings of Nurgle. Blessings of Nurgle may be bought for Tainted
    Ones only when they are recruited; you may not buy new Blessings for a model after recruitment.
    Any Tainted may have one or more Blessings. The first Blessing is bought at the price indicated,
    but second and subsequent Blessings cost double.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Blessings of Nurgle
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/carnival-of-chaos
  name_i18n:
    es: Bendiciones de Nurgle
  effect_i18n:
    es: >-
      Quienes rinden culto al fétido altar del Señor de la Decadencia sufren terribles enfermedades
      y putrefacción, conocidas como Bendiciones de Nurgle. Las Bendiciones de Nurgle pueden
      comprarse para los Contaminados solo cuando son reclutados; no puedes comprar nuevas
      Bendiciones para una miniatura tras el reclutamiento. Cualquier Contaminado puede tener una o
      más Bendiciones. La primera Bendición se compra al precio indicado, pero la segunda y
      sucesivas Bendiciones cuestan el doble.
  applies_to:
    band: true
- id: band--blessings-of-nurgle-stream-of-corruption
  kind: blessing
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.band-blessings-of-nurgle-stream-of-corruption
      scope: 'NO'
      binding: null
      reason: out-of-scope.shooting
  name: Stream of Corruption
  effect: >-
    Cost: 25 Gold Crowns The Tainted One can spew forth a grotesque stream of maggots, entrails and
    filth. This is counted as a shooting attack with a range of 6" and is resolved at Strength 3
    with no saves for armour.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Blessings of Nurgle / Stream of Corruption
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/carnival-of-chaos
  name_i18n:
    es: Chorro de Corrupción
  effect_i18n:
    es: >-
      Coste: 25 coronas de oro. El Contaminado puede escupir un grotesco chorro de larvas, entrañas
      e inmundicia. Esto cuenta como un ataque de disparo con un alcance de 6" y se resuelve con
      Fuerza 3 sin salvaciones por armadura.
  applies_to:
    band: true
- id: band--blessings-of-nurgle-nurgles-rot
  kind: blessing
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: trait.poison-immune
      scope: 'YES'
      binding:
        kind: trait
        id: trait.poison-immune
        parameters:
          value: true
      clauses:
      - id: poison-immunity
        scope: 'YES'
      - id: contagion
        scope: 'NO'
      - id: cost
        scope: 'NO'
    - id: campaign.nurgles-rot-contagion
      scope: 'NO'
      binding: null
      reason: out-of-scope.campaign
  name: Nurgle’s Rot
  effect: >-
    Cost: 50 Gold Crowns The Tainted One is infected with the deadly pestilence of its lord –
    Nurgle’s Rot. In addition, the Tainted One is immune to all poisons. Nurgle’s Rot is a deadly
    contagion for which there is no known cure. This virulent disease can be passed on in
    hand-to-hand combat. If the Tainted One makes a successful to wound roll of 6 this will result
    in the target model contracting the Rot (note: Nurgle’s Rot only affects the living, so Undead,
    Daemons and the Possessed are immune). Once a warrior has contracted the Rot, mark this on the
    warband roster. Rather than killing the victim immediately, the Rot can take some time to set
    in. From now on, before the start of each battle, the warrior must pass a Toughness test. If
    successful, his constitution has managed to stave off the Rot’s effects. If unsuccessful, the
    warrior loses one point of Toughness permanently (if he reaches zero, he has succumbed to the
    Rot and died, remove him from the roster). In addition, if a 6 is rolled for the Toughness test
    then he has unwittingly passed the Rot on to another member of the warband (randomly allocate a
    warband member and mark this on the roster).
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Blessings of Nurgle / Nurgle’s Rot
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/carnival-of-chaos
  name_i18n:
    es: Podredumbre de Nurgle
  effect_i18n:
    es: >-
      Coste: 50 coronas de oro. El Contaminado está infectado con la letal pestilencia de su señor:
      la Podredumbre de Nurgle. Además, el Contaminado es inmune a todos los venenos. La Podredumbre
      de Nurgle es un contagio letal para el que no se conoce cura. Esta virulenta enfermedad puede
      transmitirse en combate cuerpo a cuerpo. Si el Contaminado obtiene una tirada de herir exitosa
      de 6, esto hará que la miniatura objetivo contraiga la Podredumbre (nota: la Podredumbre de
      Nurgle solo afecta a los vivos, así que los Muertos Vivientes, Demonios y Poseídos son
      inmunes). Una vez que un guerrero ha contraído la Podredumbre, márcalo en la lista de la
      banda. En lugar de matar a la víctima de inmediato, la Podredumbre puede tardar cierto tiempo
      en asentarse. De ahora en adelante, antes del comienzo de cada batalla, el guerrero debe
      superar un chequeo de Resistencia. Si tiene éxito, su constitución ha logrado conjurar los
      efectos de la Podredumbre. Si falla, el guerrero pierde un punto de Resistencia
      permanentemente (si llega a cero, ha sucumbido a la Podredumbre y ha muerto, retíralo de la
      lista). Además, si se saca un 6 en el chequeo de Resistencia, entonces ha transmitido
      involuntariamente la Podredumbre a otro miembro de la banda (asigna aleatoriamente un miembro
      de la banda y márcalo en la lista).
  applies_to:
    band: true
