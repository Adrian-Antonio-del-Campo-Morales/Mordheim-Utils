  name: Spells (Sea Singer)
  effect: >-
    A Sea Singer starts with one spell from the Songs of Sorrow spell list (see Songs of Sorrow): 1
    Siren's Call (D10), 2 March of Sorrow (D7), 3 Wraith's Dirge (D9), 4 Lover's Lament (D6, D8 to
    resurrect a Gibbet), 5 Song of Discord (D9), 6 Hymn of Rebirth (D5).
  source:
    manual: broheim.net
    printed_page: 3
    section: Heroes / 0-1 Sea Singer / Special Rules
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Ghost%20Pirates.pdf
  name_i18n:
    es: Hechizos (Cantora del Mar)
  effect_i18n:
    es: >-
      Una Cantora del Mar empieza con un hechizo de la lista Cantos del Pesar (ver Cantos del
      Pesar): 1 Llamado de la Sirena (D10), 2 Marcha del Pesar (D7), 3 Endecha del Espectro (D9), 4
      Lamento del Amante (D6, D8 para resucitar a una Jaula de Hierro), 5 Canción de la Discordia
      (D9), 6 Himno del Renacimiento (D5).
  applies_to:
    profile_ids:
    - sea-singer
- id: sea-singer--beauty-of-the-sea
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.ghost-pirates-sar.sea-singer.beauty-of-the-sea
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Beauty of the Sea
  effect: >-
    In order for a male, non-animal enemy to charge a Sea Singer, he must pass a Leadership test, or
    else be dazzled at her beauty and remain in place. If charged by a Sea Singer, the model may not
    attack back in combat until he passes a Leadership Test in the beginning of the Combat Phase.
    Once a test is passed, the model doesn't need to test for the rest of the combat. The Sea Singer
    causes Fear in female models. The Singer's 'Beauty' counts as a form of Psychology.
  source:
    manual: broheim.net
    printed_page: 3
    section: Heroes / 0-1 Sea Singer / Special Rules
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Ghost%20Pirates.pdf
  name_i18n:
    es: Belleza del Mar
  effect_i18n:
    es: >-
      Para cargar contra una Cantora del Mar, un enemigo varón no animal debe superar una tirada de
      Liderazgo o, si la falla, queda deslumbrado por su belleza y se queda en su sitio. Si es
      cargado por una Cantora del Mar, el modelo no puede devolver el ataque en combate hasta
      superar una tirada de Liderazgo al comienzo de la fase de combate. Una vez superada la tirada,
      el modelo no necesita repetirla durante el resto del combate. La Cantora del Mar causa miedo a
      los modelos femeninos. La 'Belleza' de la Cantora cuenta como una forma de Psicología.
  applies_to:
    profile_ids:
    - sea-singer
