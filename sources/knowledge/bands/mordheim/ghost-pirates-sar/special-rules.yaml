- id: gibbets--sink
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.ghost-pirates-sar.gibbets.sink
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Sink
  effect: >-
    In their heavy cages, Gibbets sink to the bottom of any water they move through. The river or
    ocean bed counts as difficult terrain (1/2 speed), but while sunk, they are at -2 to hit and -2
    to be hit in combat or by missiles. When boarding ships, it is assumed they find a way to the
    surface (ex. climbing the anchor) and board the craft using the normal rules. They are immune to
    any water or drowning based damage.
  source:
    manual: broheim.net
    printed_page: 4
    section: Henchmen / 0-5 The Gibbets / Special Rules
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Ghost%20Pirates.pdf
  name_i18n:
    es: Hundirse
  effect_i18n:
    es: >-
      Con sus pesadas jaulas, las Jaulas de Hierro se hunden en el fondo de cualquier agua que
      atraviesen. El lecho del río o del mar cuenta como terreno difícil (velocidad 1/2), pero
      mientras están sumergidas reciben -2 para golpear y -2 para ser golpeadas en combate o por
      proyectiles. Al abordar barcos, se asume que encuentran el modo de salir a la superficie (p.
      ej., trepando por el ancla) y abordan con las reglas normales. Son inmunes a cualquier daño
      basado en agua o ahogamiento.
  applies_to:
    profile_ids:
    - gibbets
