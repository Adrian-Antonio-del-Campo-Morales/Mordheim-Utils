rules:
- id: band--ghost-pirate-rules
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.ghost-pirates-sar.band.ghost-pirate-rules
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Swabbies (Ghost Pirates)
  effect: >-
    Ghost Pirates may capture models, using the Swabbies rules. Willing members join the Crew,
    unwilling members become Bloated Zombies (see The Bloated).
  source:
    manual: broheim.net
    printed_page: 1
    section: Special Rules / Swabbies
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Ghost%20Pirates.pdf
  name_i18n:
    es: Fregones (Piratas Fantasma)
  effect_i18n:
    es: >-
      Los Piratas Fantasma pueden capturar modelos, usando las reglas de Fregones. Los miembros
      voluntarios se unen a la Tripulación; los que no, se convierten en Zombis Hinchados (ver Los
      Hinchos).
  applies_to:
    band: true
- id: band--ethereal
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.ghost-pirates-sar.band.ethereal
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Ethereal
  effect: >-
    Ghost Pirates and Screaming Ghosts have the ability 'Ethereal', which gives a 4+ unmodifiable
    save against all attacks. It may not be used with Dodge or Step Aside, and has no effect against
    magical attacks (Spells, Prayers, Artifacts, Gromril, Ithilmar, & Silver Bullets). Also, the
    model may take a Leadership test in the movement phase: if successful, they may move through any
    terrain piece and/or on top of water. If the model starts his next turn in the middle of a
    terrain piece or on top of water, they must take another Leadership test in the movement phase:
    if the test fails, the model is instantly taken out of action. However, after warband formation,
    all items cost double to purchase for Ethereal models. If the crew finds any items, roll a D6:
    on 5+ they can be used by both Ethereal and Non-Ethereal models. On 1-4, it can only be used by
    Non-Ethereal models (mark it as such on your roster).
  source:
    manual: broheim.net
    printed_page: 1
    section: Special Rules / Ethereal
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Ghost%20Pirates.pdf
  name_i18n:
    es: Etéreo
  effect_i18n:
    es: >-
      Los Piratas Fantasma y los Espectros Aullantes tienen la habilidad 'Etéreo', que otorga una
      tirada de salvación de 4+ no modificable contra todos los ataques. No puede usarse con Esquiva
      ni Apartar el golpe, y no tiene efecto contra ataques mágicos (hechizos, plegarias,
      artefactos, gromril, ithilmar y balas de plata). Además, el modelo puede hacer una tirada de
      Liderazgo en la fase de movimiento: si la supera, puede atravesar cualquier terreno y/o
      moverse sobre el agua. Si el modelo comienza su siguiente turno dentro de un terreno o sobre
      el agua, debe superar otra tirada de Liderazgo en la fase de movimiento: si falla, el modelo
      queda fuera de combate al instante. Sin embargo, tras la formación de la banda, todos los
      objetos cuestan el doble para los modelos Etéreos. Si la tripulación encuentra objetos, tira
      1D6: con 5+ pueden usarlos tanto modelos Etéreos como no Etéreos; con 1-4, solo pueden usarlos
      modelos no Etéreos (márcalo en tu lista).
  applies_to:
    band: true
- id: band--cursed-pistol
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.ghost-pirates-sar.item.cursed-pistol
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Cursed Pistol
  effect: >-
    5 gc (10 gc for a Brace) - Common. A pistol dragged into the depths of the ocean, clasped tight
    in the death grip of its former master. Range: 6", Strength: 4. Special Rules: Prepare Shot
    (takes a whole turn to reload, so you may only fire every other turn; with a brace you may fire
    every turn), Save Modifier (-2 armour save), Hand-to-hand (+1 Attack in close combat, resolved
    at Strength 4 with -2 save modifier, once per combat; with a brace the model fights with 2
    Attacks in the first turn of close combat, hitting only on natural 6s which may be parried by
    Cutlass Master or Master of Blades), Cursed Aim (only hits on a natural 6 to hit, receives no
    positive or negative modifiers from any source - including cover, range, moving or ballistic
    skill; never misfires; water and rain have no penalty; may only fire at non-Hiding models that
    they can see), Inhuman (may not use Fine Powder, Superior Gunpowder, Silver Bullets or any other
    enhancer; no living model may ever fire it; Ghosts may purchase Cursed Guns after warband
    creation at normal price, as they are easily used by Ethereal models).
  source:
    manual: broheim.net
    printed_page: 2
    section: Special Equipment / Cursed Pistol
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Ghost%20Pirates.pdf
  name_i18n:
    es: Pistola Maldita
  effect_i18n:
    es: >-
      5 coronas (10 por una pareja) - Común. Una pistola arrastrada a las profundidades del océano,
      aferrada en el puño de la muerte de su antiguo dueño. Alcance: 6", Fuerza: 4. Reglas
      especiales: Prepara el disparo (tarda un turno entero en recargarse, así que solo puedes
      disparar en turnos alternos; con una pareja puedes disparar cada turno), Modificador de
      salvación (-2 a la tirada de armadura), Cuerpo a cuerpo (+1 Ataque en combate, resuelto a
      Fuerza 4 con -2 al salvamento, una vez por combate; con una pareja el modelo pelea con 2
      Ataques en el primer turno, golpeando solo con 6 naturales que pueden ser detenidos con
      Maestro del Sable o Maestro de las Hojas), Punta Maldita (solo golpea con un 6 natural, sin
      modificadores positivos ni negativos de ninguna fuente -incluyendo cobertura, alcance,
      movimiento o Combate a Distancia-; nunca falla el disparo; la lluvia y el agua no penalizan la
      pólvora; solo puede disparar a modelos visibles que no estén Ocultos), Inhumana (no puede usar
      pólvora fina, pólvora superior, balas de plata ni otro potenciador; ningún modelo vivo puede
      dispararla; los Fantasmas pueden comprar Pistolas Malditas tras la creación de la banda a
      precio normal, pues los modelos Etéreos las usan con facilidad).
  applies_to:
    band: true
