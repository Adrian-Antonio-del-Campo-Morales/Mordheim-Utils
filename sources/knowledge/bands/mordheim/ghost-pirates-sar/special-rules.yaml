      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Dead Man's Float
  effect: >-
    The Bloated can float on the water, and thus can use this to their advantage. While in the
    water, the Bloated may move up to 4" as their movement, without penalty (They may do this as a
    charge, but the max move is still 4").
  source:
    manual: broheim.net
    printed_page: 4
    section: Henchmen / 0-5 The Bloated / Special Rules
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Ghost%20Pirates.pdf
  name_i18n:
    es: Flote del Hombre Muerto
  effect_i18n:
    es: >-
      Los Hinchos pueden flotar en el agua y usarlo a su favor. Mientras estén en el agua, pueden
      mover hasta 4" como su movimiento, sin penalización (pueden hacerlo como carga, pero el máximo
      sigue siendo 4").
  applies_to:
    profile_ids:
    - the-bloated
- id: the-bloated--weak-magic
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.ghost-pirates-sar.the-bloated.weak-magic
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Weak Magic
  effect: >-
    If the Ghost Pirate Warband itself Routs, any Bloated who have already left the table in
    previous turns are presumed to have fallen apart, and are never seen (or smelt!). Remove them
    from your warband roster as if they had been killed.
  source:
    manual: broheim.net
    printed_page: 4
    section: Henchmen / 0-5 The Bloated / Special Rules
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Ghost%20Pirates.pdf
  name_i18n:
    es: Magia Débil
  effect_i18n:
    es: >-
      Si la banda de Piratas Fantasma huye de la partida, se asume que los Hinchos que ya hayan
      salido de la mesa en turnos anteriores se han desmoronado, y nunca más volverán a verse (¡ni a
      olerse!). Retíralos de la lista de la banda como si hubieran muerto.
  applies_to:
    profile_ids:
    - the-bloated
- id: the-bloated--plenty-more-with-the-next-tide
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.ghost-pirates-sar.the-bloated.plenty-more-with-the-next-tide
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Plenty More with the Next Tide!
  effect: >-
    The rest of the crew barely notice if any Bloated go Out of Action - they know they'll find them
    plenty more in a few days time! Any Bloated who have been taken out of action do not count
    towards the need to take a Rout test for the warband.
  source:
    manual: broheim.net
    printed_page: 4
    section: Henchmen / 0-5 The Bloated / Special Rules
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Ghost%20Pirates.pdf
  name_i18n:
    es: ¡Habrá Más con la Próxima Marea!
  effect_i18n:
    es: >-
      Al resto de la tripulación apenas le importa que los Hinchos queden fuera de combate: ¡saben
      que encontrarán muchos más en unos días! Los Hinchos que queden fuera de combate no cuentan a
      la hora de hacer la tirada de Huida de la banda.
  applies_to:
    profile_ids:
    - the-bloated
- id: the-bloated--bloated-unarmed
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.ghost-pirates-sar.item.bloated-unarmed
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Unarmed Bloated
  effect: >-
    The Bloated do not REQUIRE equipment, and may make a single unarmed attack with no penalties.
    Alternatively, you choose to arm it with weapons from the Bloated equipment list. If you do, the
    Bloated requires two weapons to receive an additional hand attack.
  source:
    manual: broheim.net
    printed_page: 4
    section: Henchmen / 0-5 The Bloated / Weapons & Equipment
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Ghost%20Pirates.pdf
  name_i18n:
    es: Hinchos Desarmados
  effect_i18n:
    es: >-
      Los Hinchos NO NECESITAN equipo y pueden hacer un único ataque desarmado sin penalizaciones.
      Alternativamente, puedes armalos con armas de la lista de equipo de los Hinchos. Si lo haces,
      el Hincho necesita dos armas para recibir un ataque de mano adicional.
  applies_to:
    profile_ids:
    - the-bloated
