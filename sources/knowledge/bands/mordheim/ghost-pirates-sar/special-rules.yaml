  name: Squishy
  effect: >-
    While the Bloated are far beyond feeling pain, they are slightly easier to break than normal
    Zombies. They do NOT treat rolls of 'stunned' as knocked down.
  source:
    manual: broheim.net
    printed_page: 4
    section: Henchmen / 0-5 The Bloated / Special Rules
