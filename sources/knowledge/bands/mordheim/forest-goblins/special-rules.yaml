      reason: 'Deferred subsystem: mounts.'
  name: Ride Spiders
  effect: The Chieftain can ride Giant Spiders and the Gigantic Spider as detailed in the ‘Blazing Saddles’
    article .
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 1 Chieftain / Special Rules / Ride Spiders
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/forest-goblins
  name_i18n:
    en: Ride Spiders
    es: Montar arañas
  effect_i18n:
    en: The Chieftain can ride Giant Spiders and the Gigantic Spider as detailed in the ‘Blazing Saddles’
      article .
    es: El Jefe Tribal puede montar Arañas Gigantes y la Araña Gigantesca tal como se detalla en el artículo
      'Blazing Saddles'.
  applies_to:
    profile_ids:
    - chieftain
