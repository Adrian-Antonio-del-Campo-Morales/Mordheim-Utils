    es: Eliminar Rencor
  effect_i18n:
    en: When a Brave earns a skill advance, he may choose to remove his Animosity rule instead of choosing
      a skill.
    es: Cuando un Guerrero obtiene una mejora de habilidad, puede optar por eliminar su regla de Rencor
      en lugar de elegir una habilidad.
