- id: red-toof-goblins--berserkers
  runtime:
    scope: LATER
    implemented: 'YES'
    grant: profile
    effects:
    - id: trait.frenzy
      scope: LATER
      binding:
        kind: trait
        id: trait.frenzy
        parameters:
          value: true
  name: Berserkers
  effect: Forest Goblins of the Red Toof tribe allow themselves to be bitten by all sorts of poisonous
    wildlife before entering battle. The mingling venom drives them into frothing convulsions, making
    them extremely ferocious. Red Toof Boyz are affected by the rules for Frenzy as described in the Mordheim
    rulebook. In addition, if they begin their turn within charge range of an enemy, they are immune to
    animosity for that turn.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 5 Red Toof Goblins / Special Rules / Berserkers
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/forest-goblins
  name_i18n:
    en: Berserkers
    es: Berserker
  effect_i18n:
    en: Forest Goblins of the Red Toof tribe allow themselves to be bitten by all sorts of poisonous wildlife
      before entering battle. The mingling venom drives them into frothing convulsions, making them extremely
      ferocious. Red Toof Boyz are affected by the rules for Frenzy as described in the Mordheim rulebook.
      In addition, if they begin their turn within charge range of an enemy, they are immune to animosity
      for that turn.
    es: Los goblins del bosque de la tribu Colaroja se dejan morder por toda clase de fauna venenosa antes
      de entrar en batalla. El veneno mezclado los lleva a convulsiones espumantes que los vuelven extremadamente
      feroces. Los Chicos Colaroja se ven afectados por las reglas de Frenesí tal como se describen en
      el reglamento de Mordheim. Además, si comienzan su turno dentro del alcance de carga de un enemigo,
      son inmunes al Rencor durante ese turno.
  applies_to:
    profile_ids:
    - red-toof-goblins
