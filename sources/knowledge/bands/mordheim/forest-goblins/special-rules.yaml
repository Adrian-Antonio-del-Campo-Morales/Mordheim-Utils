    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/forest-goblins
  name_i18n:
    en: Fear
    es: Miedo
  effect_i18n:
    en: Gigantic Spiders cause fear as described in the Mordheim Rulebook.
    es: Las Arañas Gigantes causan miedo tal como se describe en el reglamento de Mordheim.
  applies_to:
    profile_ids:
    - gigantic-spider
