- id: band--animosity
  runtime:
    scope: "LATER"
    implemented: "NO"
    grant: band
    effects:
    - id: unimplemented.forest-goblins.band.animosity
      scope: "LATER"
      binding: null
      reason: "Deferred subsystem: psicología."
  name: Animosity
  effect: 'At the start of the Orc player''s turn, roll a D6 for each Orc or Goblin Henchman not engaged in hand-to-hand combat.
    On a 1, roll another D6: 1 = the warrior attacks the nearest eligible friendly Orc/Goblin Henchman or Hired Sword if possible
    (charge and fight one round; if no such charge is possible and the warrior has a missile weapon, shoot the nearest eligible
    friendly model). If no valid target exists, or the nearest friendly model is an Orc Hero, treat the result as 2-5. 2-5
    = the warrior may do nothing else that turn, but may defend itself if attacked. 6 = immediately move as quickly as possible
    toward the nearest visible enemy, charging if possible; if no enemy is visible, make a normal move. This is an extra move
    in addition to normal movement. If it brings an enemy into charge range, the warrior must charge during its normal Movement
    phase.'
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / Animosity
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/forest-goblins
  name_i18n:
    en: Animosity
    es: null
  effect_i18n:
    en: 'At the start of the Orc player''s turn, roll a D6 for each Orc or Goblin Henchman not engaged in hand-to-hand combat.
      On a 1, roll another D6: 1 = the warrior attacks the nearest eligible friendly Orc/Goblin Henchman or Hired Sword if
      possible (charge and fight one round; if no such charge is possible and the warrior has a missile weapon, shoot the
      nearest eligible friendly model). If no valid target exists, or the nearest friendly model is an Orc Hero, treat the
      result as 2-5. 2-5 = the warrior may do nothing else that turn, but may defend itself if attacked. 6 = immediately move
      as quickly as possible toward the nearest visible enemy, charging if possible; if no enemy is visible, make a normal
      move. This is an extra move in addition to normal movement. If it brings an enemy into charge range, the warrior must
      charge during its normal Movement phase.'
    es: null
  applies_to:
    band: true
