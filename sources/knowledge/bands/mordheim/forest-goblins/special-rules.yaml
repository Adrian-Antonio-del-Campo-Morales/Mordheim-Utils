  name: Large Monster
  effect: Gigantic Spiders are large targets, and may always be shot at.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 1 Gigantic Spider / Special Rules / Large Monster
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/forest-goblins
  name_i18n:
    en: Large Monster
    es: Monstruo grande
  effect_i18n:
    en: Gigantic Spiders are large targets, and may always be shot at.
    es: Las Arañas Gigantes son objetivos grandes y siempre pueden ser disparadas.
  applies_to:
    profile_ids:
    - gigantic-spider
- id: gigantic-spider--poisonous
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: trait.poisonous-injury
      scope: 'YES'
      binding:
        kind: trait
        id: trait.poisonous-injury
        parameters:
          value: true
  name: Poisonous
  effect: >-
    The Gigantic Spider's maw drips with vile poisons. When it wounds an enemy and a roll is made on
    the injury table, 1: knocked down, 2-4: stunned, and 5-6: Out of Action.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 1 Gigantic Spider / Special Rules / Poisonous
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/forest-goblins
  name_i18n:
    en: Poisonous
    es: Venenoso
  effect_i18n:
    en: 'The Gigantic Spider''s maw drips with vile poisons. When it wounds an enemy and a roll is made
      on the injury table, 1: knocked down, 2-4: stunned, and 5-6: Out of Action.'
    es: 'El hocico de la Araña Gigantesca gotea venenos repugnantes. Cuando hiere a un enemigo y se tira
      en la tabla de heridas: 1 = derribado, 2-4 = aturdido y 5-6 = Fuera de combate.'
  applies_to:
    profile_ids:
    - gigantic-spider
- id: gigantic-spider--native
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.forest-goblins.gigantic-spider.native
      scope: 'NO'
      binding: null
      reason: 'Out of scope: movement.'
  name: Native
  effect: Negotiating woodlands is no trouble for spiders. They move through any wooded terrain without
    penalty.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 1 Gigantic Spider / Special Rules / Native
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/forest-goblins
  name_i18n:
    en: Native
    es: Nativo
  effect_i18n:
    en: Negotiating woodlands is no trouble for spiders. They move through any wooded terrain without
      penalty.
    es: Negociar los bosques no es problema para las arañas. Se mueven por cualquier terreno arbolado
      sin penalización.
  applies_to:
    profile_ids:
    - gigantic-spider
- id: gigantic-spider--non-sentient
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.forest-goblins.gigantic-spider.non-sentient
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology.'
  name: Non-sentient
  effect: Spiders are affected by the stupidity rules in the Mordheim rulebook. In addition, they never
    gain experience, as they are animals. Note however that they may climb as normal.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 1 Gigantic Spider / Special Rules / Non-sentient
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/forest-goblins
  name_i18n:
    en: Non-sentient
    es: No sintiente
  effect_i18n:
    en: Spiders are affected by the stupidity rules in the Mordheim rulebook. In addition, they never
      gain experience, as they are animals. Note however that they may climb as normal.
    es: Las arañas se ven afectadas por las reglas de estupidez del reglamento de Mordheim. Además, nunca
      ganan experiencia, pues son animales. Ten en cuenta, sin embargo, que pueden trepar con normalidad.
  applies_to:
    profile_ids:
    - gigantic-spider
- id: gigantic-spider--may-ride
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.forest-goblins.gigantic-spider.may-ride
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: mounts.'
  name: May Ride
  effect: The Forest Goblin Chieftain, may ride the Gigantic Spider. He gains +1 armour save, and shall
    move at the Gigantic Spider's rate of 6. Shooting attacks hit the Chieftain on a die roll of 1-2,
    and the Gigantic Spider on a 3-6. In close combat, the opponent may choose which to hit. The Gigantic
    Spider no longer has to check for stupidity if it is being ridden, as the Chieftain is directing its
    actions.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 1 Gigantic Spider / Special Rules / May Ride
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/forest-goblins
  name_i18n:
    en: May Ride
    es: Montable
  effect_i18n:
    en: 'The Forest Goblin Chieftain, may ride the Gigantic Spider. He gains +1 armour save, and shall

      move at the Gigantic Spider''s rate of 6. Shooting attacks hit the Chieftain on a die roll of 1-2,
      and the

      Gigantic Spider on a 3-6. In close combat, the opponent may choose which to hit. The Gigantic Spider
      no longer has to check for stupidity if it is being ridden, as the Chieftain is directing its actions.'
    es: El Jefe Tribal de los Goblins del Bosque puede montar la Araña Gigantesca. Gana +1 a su salvación
      por armadura y se moverá al ritmo de la Araña Gigantesca (6). Los ataques de disparo impactan al
      Jefe Tribal con un resultado de 1-2 en el dado, y a la Araña Gigantesca con un 3-6. En el combate
      cuerpo a cuerpo, el oponente puede elegir a cuál golpear. La Araña Gigantesca ya no tiene que hacer
      chequeos de estupidez mientras sea montada, pues el Jefe Tribal dirige sus acciones.
  applies_to:
    profile_ids:
    - gigantic-spider
- id: gigantic-spider--chitin-armour
  name: Chitin Armour
  effect: The Gigantic Spider has an intrinsic 4+ natural armour save. This is part of the creature, not
    selectable equipment.
  source:
    manual: user-ruling
    printed_page: 0
    section: Gigantic Spider / Chitin Armour
  applies_to:
    profile_ids:
    - gigantic-spider
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: trait.natural-armour-save
      scope: 'YES'
      binding:
        kind: trait
        id: trait.natural-armour-save
        parameters:
          value: 4
  name_i18n:
    en: Chitin Armour
    es: Armadura de quitina
  effect_i18n:
    en: The Gigantic Spider has an intrinsic 4+ natural armour save. This is part of the creature, not
      selectable equipment.
    es: La Araña Gigantesca tiene una salvación natural intrínseca de 4+. Es parte de la criatura, no
      un equipo seleccionable.
- id: band--natives
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.forest-goblins.band.natives
      scope: 'NO'
      binding: null
      reason: 'Out of scope: movement.'
  name: Natives
  effect: Forest Goblins suffer no movement penalties for moving through wooded terrain.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / Natives
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/forest-goblins
  name_i18n:
    en: Natives
    es: Nativos
  effect_i18n:
    en: Forest Goblins suffer no movement penalties for moving through wooded terrain.
    es: Los Goblins del Bosque no sufren penalizaciones de movimiento al desplazarse por terreno arbolado.
  applies_to:
    band: true
- id: band--animosity
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.forest-goblins.band.animosity
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology.'
  name: Animosity
  effect: >-
    At the start of the Orc player's turn, roll a D6 for each Orc or Goblin Henchman not engaged in
    hand-to-hand combat. On a 1, roll another D6: 1 = the warrior attacks the nearest eligible
    friendly Orc/Goblin Henchman or Hired Sword if possible (charge and fight one round; if no such
    charge is possible and the warrior has a missile weapon, shoot the nearest eligible friendly
    model). If no valid target exists, or the nearest friendly model is an Orc Hero, treat the
    result as 2-5. 2-5 = the warrior may do nothing else that turn, but may defend itself if
    attacked. 6 = immediately move as quickly as possible toward the nearest visible enemy, charging
    if possible; if no enemy is visible, make a normal move. This is an extra move in addition to
    normal movement. If it brings an enemy into charge range, the warrior must charge during its
    normal Movement phase.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / Animosity
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/forest-goblins
  name_i18n:
    en: Animosity
    es: Rencor (Animosity)
  effect_i18n:
    en: 'At the start of the Orc player''s turn, roll a D6 for each Orc or Goblin Henchman not engaged
      in hand-to-hand combat. On a 1, roll another D6: 1 = the warrior attacks the nearest eligible friendly
      Orc/Goblin Henchman or Hired Sword if possible (charge and fight one round; if no such charge is
      possible and the warrior has a missile weapon, shoot the nearest eligible friendly model). If no
      valid target exists, or the nearest friendly model is an Orc Hero, treat the result as 2-5. 2-5
      = the warrior may do nothing else that turn, but may defend itself if attacked. 6 = immediately
      move as quickly as possible toward the nearest visible enemy, charging if possible; if no enemy
      is visible, make a normal move. This is an extra move in addition to normal movement. If it brings
      an enemy into charge range, the warrior must charge during its normal Movement phase.'
    es: 'Al inicio del turno del jugador orco, tira 1D6 por cada secuaz orco o goblin que no esté en combate
      cuerpo a cuerpo. Con un 1, tira otro 1D6: 1 = el guerrero ataca al secuaz orco/goblin amigo u Espada
      a Sueldo elegible más cercano si es posible (carga y lucha un asalto; si tal carga no es posible
      y el guerrero tiene un arma de misil, dispara al modelo amigo elegible más cercano). Si no existe
      objetivo válido, o el modelo amigo más cercano es un Héroe Orco, trata el resultado como 2-5. 2-5
      = el guerrero no puede hacer nada más ese asalto, pero puede defenderse si lo atacan. 6 = muévete
      inmediatamente lo más rápido posible hacia el enemigo visible más cercano, cargando si es posible;
      si no hay enemigo visible, realiza un movimiento normal. Este es un movimiento extra adicional al
      movimiento normal. Si acerca a un enemigo a alcance de carga, el guerrero debe cargar durante su
      fase normal de Movimiento.'
  applies_to:
    band: true
