- id: gigantic-spider--may-ride
  runtime:
    scope: "LATER"
    implemented: "NO"
    grant: profile
    effects:
    - id: unimplemented.forest-goblins.gigantic-spider.may-ride
      scope: "LATER"
      binding: null
      reason: "Deferred subsystem: monturas."
  name: May Ride
  effect: 'The Forest Goblin Chieftain, may ride the Gigantic Spider. He gains +1 armour save, and shall

    move at the Gigantic Spider''s rate of 6. Shooting attacks hit the Chieftain on a die roll of 1-2, and the

    Gigantic Spider on a 3-6. In close combat, the opponent may choose which to hit. The Gigantic Spider no longer has to
    check for stupidity if it is being ridden, as the Chieftain is directing its actions.'
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 1 Gigantic Spider / Special Rules / May Ride
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/forest-goblins
  name_i18n:
    en: May Ride
    es: null
  effect_i18n:
    en: 'The Forest Goblin Chieftain, may ride the Gigantic Spider. He gains +1 armour save, and shall

      move at the Gigantic Spider''s rate of 6. Shooting attacks hit the Chieftain on a die roll of 1-2, and the

      Gigantic Spider on a 3-6. In close combat, the opponent may choose which to hit. The Gigantic Spider no longer has to
      check for stupidity if it is being ridden, as the Chieftain is directing its actions.'
    es: null
  applies_to:
    profile_ids:
    - gigantic-spider
- id: gigantic-spider--chitin-armour
  name: Chitin Armour
  effect: The Gigantic Spider has an intrinsic 4+ natural armour save. This is part of the creature, not selectable equipment.
  source:
    manual: user-ruling
    printed_page: 0
    section: Gigantic Spider / Chitin Armour
  applies_to:
    profile_ids: [gigantic-spider]
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: trait.natural-armour-save
      scope: 'YES'
      binding:
        kind: trait
        id: trait.natural-armour-save
        parameters: {value: 4}
