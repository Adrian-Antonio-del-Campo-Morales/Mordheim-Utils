  name: Sluggas
  effect: In the shooting phase, the Sluggas may throw thrown weapons up to three times. This may not
    be combined with Quick Shot if they should be promoted to hero status.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 5 Sluggas / Special Rules / Sluggas
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/forest-goblins
  name_i18n:
    en: Sluggas
    es: Apedreadores (Sluggas)
  effect_i18n:
    en: In the shooting phase, the Sluggas may throw thrown weapons up to three times. This may not be
      combined with Quick Shot if they should be promoted to hero status.
    es: En la fase de disparo, los Apedreadores pueden lanzar armas arrojadizas hasta tres veces. Esto
      no puede combinarse con Disparo Rápido si llegaran a ser ascendidos a estatus de héroe.
  applies_to:
    profile_ids:
    - sluggas
- id: gigantic-spider--fear
