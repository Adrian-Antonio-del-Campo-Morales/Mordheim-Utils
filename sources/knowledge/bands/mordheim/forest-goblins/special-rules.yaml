  name: Leader
  effect: Any warrior within 6" of the Chieftain may use his Leadership characteristic when taking Leadership
    tests.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 1 Chieftain / Special Rules / Leader
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/forest-goblins
  name_i18n:
    en: Leader
    es: Líder
  effect_i18n:
    en: 'Any warrior within 6" of the Chieftain may use his

      Leadership characteristic when taking Leadership tests.'
    es: Cualquier guerrero a 6" del Jefe Tribal puede usar su característica de Liderazgo cuando realice
      chequeos de Liderazgo.
  applies_to:
    profile_ids:
    - chieftain
- id: chieftain--ride-spiders
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
