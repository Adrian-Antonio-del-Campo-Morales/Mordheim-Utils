    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.horned-hunters.initiates.infiltrator
      scope: 'NO'
      binding: null
      reason: 'Out of scope: movement.'
  name: Infiltrator
  effect: 'A warrior with this skill is always placed on the battlefield after the opposing warband and can be placed anywhere
    on the table as long as it is out of sight of the opposing warband and more than 12" away from any enemy model.

    If both players have models which infiltrate, roll a D6 for each, and the lowest roll sets up first.'
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 – 3 Initiates / Special Rules / Infiltrator
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/horned-hunters
  name_i18n:
    en: Infiltrator
    es: null
  effect_i18n:
    en: 'A warrior with this skill is always placed on the battlefield after the opposing warband and can be placed anywhere
      on the table as long as it is out of sight of the opposing warband and more than 12" away from any enemy model.

      If both players have models which infiltrate, roll a D6 for each, and the lowest roll sets up first.'
    es: null
  applies_to:
    profile_ids:
    - initiates
