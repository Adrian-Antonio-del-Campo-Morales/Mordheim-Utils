    effects:
    - id: profile.equipment-restrictions
      scope: 'YES'
      binding:
        kind: profile
        id: profile.equipment-restrictions
        parameters:
          forbids: armour
  name: Strictures
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 – 3 Initiates / Special Rules / Strictures
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/horned-hunters
  name_i18n:
    es: Preceptos
  applies_to:
    profile_ids:
    - initiates
  rule_ref: shared-rule.no-armour
- id: drunken-gang--drunk
  runtime:
    grant: profile
    scope: 'YES'
    implemented: 'YES'
    effects:
    - id: mechanic.automatic-leadership
      scope: 'YES'
      binding:
        kind: mechanic
        id: mechanic.automatic-leadership
  name: Drunk
  effect: The Drunken Gang automatically passes all Leadership-based tests it is required to take.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 5 Drunken Gang / Special Rules / Drunk
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/horned-hunters
  name_i18n:
    es: Ebrio
  effect_i18n:
    es: >-
      La Pandilla Borracha supera automáticamente todos los chequeos basados en Liderazgo que deba
      realizar.
  applies_to:
    profile_ids:
    - drunken-gang
- id: zealots--strictures
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: profile.equipment-restrictions
      scope: 'YES'
      binding:
        kind: profile
        id: profile.equipment-restrictions
        parameters:
          forbids: armour
  name: Strictures
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / Zealots / Special Rules / Strictures
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/horned-hunters
  name_i18n:
    es: Preceptos
  applies_to:
