schema_version: 2
band_id: horned-hunters
rules:
- id: horned-hunter--leader
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.horned-hunters.horned-hunter.leader
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology.'
  name: Leader
  effect: Any warrior within 6" of the Horned Hunter may use his Leadership value when taking Leadership
    tests.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 1 Horned Hunter / Special Rules / Leader
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/horned-hunters
  name_i18n:
    en: Leader
    es: Líder
  effect_i18n:
    en: Any warrior within 6" of the Horned Hunter may use his Leadership value when taking Leadership
      tests.
    es: Cualquier guerrero a 6" del Cazador de Cuernos puede usar su valor de Liderazgo cuando realice
      chequeos de Liderazgo.
  applies_to:
    profile_ids:
    - horned-hunter
- id: horned-hunter--hang-the-bandit
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.horned-hunters.horned-hunter.hang-the-bandit
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology.'
  name: Hang the Bandit!
  effect: A Horned Hunter hates all Bandits and Outlaws.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 1 Horned Hunter / Special Rules / Hang the Bandit!
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/horned-hunters
  name_i18n:
    en: Hang the Bandit!
    es: ¡Ahorcad al bandido!
  effect_i18n:
    en: A Horned Hunter hates all Bandits and Outlaws.
    es: Un Cazador de Cuernos odia a todos los Bandidos y Forajidos.
  applies_to:
    profile_ids:
    - horned-hunter
- id: priest-of-taal--prayers
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.horned-hunters.priest-of-taal.prayers
      scope: 'NO'
      binding: null
      reason: 'Out of scope: magic.'
  name: Prayers
  effect: A Priest of Taal may use the Prayers of Taal.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 – 1 Priest of Taal / Special Rules / Prayers
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/horned-hunters
  name_i18n:
    en: Prayers
    es: Oraciones
  effect_i18n:
    en: A Priest of Taal may use the Prayers of Taal.
    es: Un Sacerdote de Taal puede usar las Oraciones de Taal.
  applies_to:
    profile_ids:
    - priest-of-taal
- id: priest-of-taal--strictures
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: profile.equipment-restrictions
      scope: 'YES'
      binding:
        kind: profile
        id: profile.equipment-restrictions
        parameters:
          forbids: heavy-armour
  name: Strictures
  effect: Priests of Taal may never wear heavy armour.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 – 1 Priest of Taal / Special Rules / Strictures
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/horned-hunters
  name_i18n:
    en: Strictures
    es: Preceptos
  effect_i18n:
    en: Priests of Taal may never wear heavy armour.
    es: Los Sacerdotes de Taal jamás pueden llevar armadura pesada.
  applies_to:
    profile_ids:
    - priest-of-taal
- id: initiates--infiltrator
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.horned-hunters.initiates.infiltrator
      scope: 'NO'
      binding: null
      reason: 'Out of scope: movement.'
  name: Infiltrator
  effect: A warrior with this skill is always placed on the battlefield after the opposing warband and
    can be placed anywhere on the table as long as it is out of sight of the opposing warband and more
    than 12" away from any enemy model. If both players have models which infiltrate, roll a D6 for each,
    and the lowest roll sets up first.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 – 3 Initiates / Special Rules / Infiltrator
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/horned-hunters
  name_i18n:
    en: Infiltrator
    es: Infiltrado
  effect_i18n:
    en: 'A warrior with this skill is always placed on the battlefield after the opposing warband and
      can be placed anywhere on the table as long as it is out of sight of the opposing warband and more
      than 12" away from any enemy model.

      If both players have models which infiltrate, roll a D6 for each, and the lowest roll sets up first.'
    es: Un guerrero con esta habilidad siempre se sitúa en el campo de batalla después de la banda rival
      y puede colocarse en cualquier punto de la mesa mientras esté fuera de la línea de visión de la
      banda rival y a más de 12" de cualquier modelo enemigo. Si ambos jugadores tienen modelos que se
      infiltran, tira 1D6 por cada uno, y el que obtenga la tirada más baja se despliega primero.
  applies_to:
    profile_ids:
    - initiates
