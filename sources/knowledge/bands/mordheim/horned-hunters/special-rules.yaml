  applies_to:
    band: true
- id: band--horned-hunter-special-skills-foul-odour
  kind: warband_skill
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.horned-hunters.band.horned-hunter-special-skills-foul-odour
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology.'
  name: Foul Odour
  effect: Worshippers of Taal are one and all prodigious drinkers and none too hygienic! This warrior
    rises head and shoulders above the rest. After a lifetime of drinking, liquor has little effect on
    him any more... not that this stops him from consuming massive quantities! His unwashed clothes and
    sweat reek of alcohol and all living enemies (not Undead or Possessed) are at -1 to hit him in close
    combat. In addition, the warrior cannot carry any open flames (torch, lantern, etc.) and fire attacks
    made against him are resolved at +1 Strength as his beer soaked clothing burns readily.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Horned Hunter Special Skills / foul odour
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/horned-hunters
  name_i18n:
    en: Foul Odour
    es: Hedor
  effect_i18n:
    en: 'Worshippers of Taal are one and all prodigious

      drinkers and none too hygienic! This warrior rises head

      and shoulders above the rest. After a lifetime of

      drinking, liquor has little effect on him any more... not

      that this stops him from consuming massive quantities!

      His unwashed clothes and sweat reek of alcohol and all

      living enemies (not Undead or Possessed) are at -1 to hit him in close combat. In addition, the
      warrior cannot carry any open flames (torch, lantern, etc.) and fire

      attacks made against him are resolved at +1 Strength as

      his beer soaked clothing burns readily.'
    es: Los adoradores de Taal son todos unos bebedores prodigiosos y nada higiénicos. Este guerrero sobresale
      por encima del resto. Tras toda una vida de bebida, el licor apenas le afecta ya... lo que no le
      impide consumir cantidades masivas. Su ropa sin lavar y su sudor huelen a alcohol y todos los enemigos
      vivientes (no No-muertos ni Poseídos) sufren -1 para impactarlo en el combate cuerpo a cuerpo. Además,
      el guerrero no puede llevar ninguna llama abierta (antorcha, farol, etc.) y los ataques de fuego
      que recibe se repiten contra él.
  applies_to:
    band: true
- id: band--horned-hunter-special-skills-animal-friendship
  kind: warband_skill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: trait.animal-friendship
      scope: 'YES'
      binding:
        kind: trait
        id: trait.animal-friendship
        parameters:
          value: true
  name: Animal Friendship
  effect: Having grown up amidst the animals of the forest this warrior exudes a certain charm to all
    'normal' animals (warhorses, warhounds, etc.). Animals will never attack him and up to two wardogs
    that the warrior owns do not count against the maximum number of models in the Warband.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Horned Hunter Special Skills / animal friendship
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/horned-hunters
  name_i18n:
    en: Animal Friendship
    es: Amistad animal
  effect_i18n:
    en: 'Having grown up amidst the animals of the forest this warrior exudes a certain charm to all ''normal''
      animals (warhorses, warhounds, etc.). Animals will never attack him and up to two wardogs that the
      warrior owns do not count against the

      maximum number of models in the Warband.'
    es: Habiéndose criado entre los animales del bosque, este guerrero irradia un cierto encanto a todos
      los animales 'normales' (corceles de guerra, sabuesos de guerra, etc.). Los animales jamás lo atacarán
      y hasta dos perros de guerra que posea el guerrero no cuentan para el número máximo de modelos de
      la banda.
  applies_to:
    band: true
- id: band--horned-hunter-special-skills-pathfinder
  kind: warband_skill
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.horned-hunters.band.horned-hunter-special-skills-pathfinder
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign.'
  name: Pathfinder
  effect: Taal has gifted this hunter with an uncanny ability to find paths through unexplored territories.
    Roll one additional D6 during the exploration phase. A warband may only contain one pathfinder.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Horned Hunter Special Skills / pathfinder
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/horned-hunters
  name_i18n:
    en: Pathfinder
    es: Explorador
  effect_i18n:
    en: 'Taal has gifted this hunter with an uncanny ability to

      find paths through unexplored territories. Roll one

      additional D6 during the exploration phase. A warband

      may only contain one pathfinder.'
    es: Taal ha dotado a este cazador de una asombrosa capacidad para encontrar caminos por territorios
      inexplorados. Tira 1D6 adicional durante la fase de exploración. Una banda solo puede contener un
      explorador.
  applies_to:
    band: true
- id: band--horned-hunter-special-skills-hide-in-shadows
  kind: warband_skill
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.horned-hunters.band.horned-hunter-special-skills-hide-in-shadows
      scope: 'NO'
      binding: null
      reason: 'Out of scope: movement.'
  name: Hide in Shadows
  effect: The hunter has learned to crouch unseen in any cover they can find. Enemy models must halve
    their Initiative when attempting to find this warrior when he is Hidden.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Horned Hunter Special Skills / hide in shadows
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/horned-hunters
  name_i18n:
    en: Hide in Shadows
    es: Ocultarse en las sombras
  effect_i18n:
    en: 'The hunter has learned to crouch unseen in any cover

      they can find. Enemy models must halve their Initiative

      when attempting to find this warrior when he is Hidden.'
    es: El cazador ha aprendido a agazaparse sin ser visto en cualquier cobertura que encuentre. Los modelos
      enemigos deben dividir a la mitad su Iniciativa al intentar encontrar a este guerrero cuando esté
      Oculto.
  applies_to:
    band: true
