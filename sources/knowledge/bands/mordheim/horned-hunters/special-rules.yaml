    en: Infiltration
    es: null
  effect_i18n:
    en: 'A warrior with this skill is always placed on the

      battlefield after the opposing warband and can be

      placed anywhere on the table as long as it is out of

      sight of the opposing warband and more than 12" away

      from any enemy model.

      If both players have models which infiltrate, roll a D6

      for each, and the lowest roll sets up first.'
    es: null
  applies_to:
    band: true
- id: band--horned-hunter-special-skills-foul-odour
  kind: warband_skill
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.horned-hunters.band.horned-hunter-special-skills-foul-odour
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology.'
  name: Foul Odour
  effect: 'Worshippers of Taal are one and all prodigious

    drinkers and none too hygienic! This warrior rises head

    and shoulders above the rest. After a lifetime of

    drinking, liquor has little effect on him any more... not

    that this stops him from consuming massive quantities!

    His unwashed clothes and sweat reek of alcohol and all

    living enemies (not Undead or Possessed) are at -1 to hit him in close combat. In addition, the warrior cannot carry any
    open flames (torch, lantern, etc.) and fire

    attacks made against him are resolved at +1 Strength as

    his beer soaked clothing burns readily.'
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Horned Hunter Special Skills / foul odour
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/horned-hunters
  name_i18n:
    en: Foul Odour
    es: null
  effect_i18n:
    en: 'Worshippers of Taal are one and all prodigious

      drinkers and none too hygienic! This warrior rises head

      and shoulders above the rest. After a lifetime of

      drinking, liquor has little effect on him any more... not

      that this stops him from consuming massive quantities!

      His unwashed clothes and sweat reek of alcohol and all

      living enemies (not Undead or Possessed) are at -1 to hit him in close combat. In addition, the warrior cannot carry
      any open flames (torch, lantern, etc.) and fire

      attacks made against him are resolved at +1 Strength as

      his beer soaked clothing burns readily.'
    es: null
  applies_to:
    band: true
- id: band--horned-hunter-special-skills-animal-friendship
  kind: warband_skill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: trait.animal-friendship
      scope: 'YES'
      binding:
        kind: trait
        id: trait.animal-friendship
        parameters:
          value: true
  name: Animal Friendship
  effect: Having grown up amidst the animals of the forest this warrior exudes a certain charm to all 'normal' animals (warhorses,
    warhounds, etc.). Animals will never attack him and up to two wardogs that the warrior owns do not count against the maximum
    number of models in the Warband.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Horned Hunter Special Skills / animal friendship
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/horned-hunters
  name_i18n:
    en: Animal Friendship
    es: null
  effect_i18n:
    en: 'Having grown up amidst the animals of the forest this warrior exudes a certain charm to all ''normal'' animals (warhorses,
      warhounds, etc.). Animals will never attack him and up to two wardogs that the warrior owns do not count against the

      maximum number of models in the Warband.'
    es: null
  applies_to:
    band: true
