- id: band--woodcraft
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.horned-hunters.band.woodcraft
      scope: 'NO'
      binding: null
      reason: 'Out of scope: movement.'
  name: Woodcraft
  effect: Horned Hunter warbands move through any difficult terrain without suffering movement penalties.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: special rules / Woodcraft
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/horned-hunters
  name_i18n:
    en: Woodcraft
    es: Artes bosque
  effect_i18n:
    en: Horned Hunter warbands move through any difficult terrain without suffering movement penalties.
    es: Las bandas de Cazadores de Cuernos se mueven por cualquier terreno dificultoso sin sufrir penalizaciones
      de movimiento.
  applies_to:
    band: true
- id: band--horned-hunter-special-skills-master-trapper
  kind: warband_skill
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.horned-hunters.band.horned-hunter-special-skills-master-trapper
      scope: 'NO'
      binding: null
      reason: 'Out of scope: movement.'
  name: Master Trapper
  effect: This huntsman is a masterful trap setter. Trip wire range has been extended by this warrior
    to reach 4". Traps set by a master trapper are triggered by a score of 2+.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Horned Hunter Special Skills / master trapper
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/horned-hunters
  name_i18n:
    en: Master Trapper
    es: Maestro trampero
  effect_i18n:
    en: 'This huntsman is a masterful trap setter. Trip wire range has been extended by this warrior to
      reach 4".

      Traps set by a master trapper are triggered by a score of 2+.'
    es: Este cazador es un maestro tendiendo trampas. Este guerrero ha extendido el alcance del cable
      trampa hasta 4". Las trampas tendidas por un maestro trampero se activan con un resultado de 2+.
  applies_to:
    band: true
- id: band--horned-hunter-special-skills-infiltration
  kind: warband_skill
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.horned-hunters.band.horned-hunter-special-skills-infiltration
      scope: 'NO'
      binding: null
      reason: 'Out of scope: movement.'
  name: Infiltration
  effect: A warrior with this skill is always placed on the battlefield after the opposing warband and
    can be placed anywhere on the table as long as it is out of sight of the opposing warband and more
    than 12" away from any enemy model. If both players have models which infiltrate, roll a D6 for each,
