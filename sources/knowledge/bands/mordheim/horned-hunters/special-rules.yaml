schema_version: 2
band_id: horned-hunters
rules:
- id: horned-hunter--leader
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: mechanic.leader-six
      scope: 'YES'
      binding:
        kind: mechanic
        id: mechanic.leader-six
  name: Leader
  effect: >-
    Any warrior within 6" of the Horned Hunter may use his Leadership value when taking Leadership
    tests.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 1 Horned Hunter / Special Rules / Leader
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/horned-hunters
  name_i18n:
    es: Líder
  effect_i18n:
    es: >-
      Cualquier guerrero a 6" del Cazador de Cuernos puede usar su valor de Liderazgo cuando realice
      chequeos de Liderazgo.
  applies_to:
    profile_ids:
    - horned-hunter
- id: horned-hunter--hang-the-bandit
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: mechanic.hang-the-bandit
      scope: 'YES'
      binding:
        kind: mechanic
        id: mechanic.hang-the-bandit
  name: Hang the Bandit!
  effect: A Horned Hunter hates all Bandits and Outlaws.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 1 Horned Hunter / Special Rules / Hang the Bandit!
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/horned-hunters
  name_i18n:
    es: ¡Ahorcad al Bandido!
  effect_i18n:
    es: Un Cazador de Cuernos odia a todos los Bandidos y Forajidos.
  applies_to:
    profile_ids:
    - horned-hunter
- id: priest-of-taal--prayers
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.horned-hunters.priest-of-taal.prayers
      scope: 'NO'
      binding: null
      reason: out-of-scope.magic
  name: Prayers
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 – 1 Priest of Taal / Special Rules / Prayers
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/horned-hunters
  name_i18n:
    es: Plegarias
  applies_to:
    profile_ids:
    - priest-of-taal
  rule_ref: shared-rule.prayers
- id: priest-of-taal--strictures
  runtime:
    scope: 'YES'
    implemented: 'YES'
