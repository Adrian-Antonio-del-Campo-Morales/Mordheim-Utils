  rule_ref: shared-rule.infiltration
- id: initiates--hang-the-bandit
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: mechanic.hang-the-bandit
      scope: 'YES'
      binding:
        kind: mechanic
        id: mechanic.hang-the-bandit
  name: Hang the Bandit!
  effect: Taal's Initiates hate all Bandits and Outlaws.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 – 3 Initiates / Special Rules / Hang the Bandit!
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/horned-hunters
  name_i18n:
    es: ¡Ahorcad al Bandido!
  effect_i18n:
    es: Los Iniciados de Taal odian a todos los Bandidos y Forajidos.
  applies_to:
    profile_ids:
    - initiates
- id: initiates--strictures
  runtime:
