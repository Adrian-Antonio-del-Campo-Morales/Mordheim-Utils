      scope: 'YES'
      binding:
        kind: profile
        id: profile.equipment-restrictions
        parameters:
          forbids: heavy-armour
  name: Strictures
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 – 1 Priest of Taal / Special Rules / Strictures
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/horned-hunters
  name_i18n:
    es: Preceptos
  applies_to:
    profile_ids:
    - priest-of-taal
  rule_ref: shared-rule.strictures
- id: initiates--infiltrator
  runtime:
    scope: 'NO'
    implemented: 'NO'
