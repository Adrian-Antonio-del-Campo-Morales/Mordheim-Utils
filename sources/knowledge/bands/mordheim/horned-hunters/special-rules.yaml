    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/horned-hunters
  name_i18n:
    en: Drunk
    es: Borracho
  effect_i18n:
    en: The Drunken Gang automatically passes all Leadership-based tests it is required to take.
    es: La Pandilla Borracha supera automáticamente todos los chequeos basados en Liderazgo que deba realizar.
  applies_to:
    profile_ids:
    - drunken-gang
