    - zealots
  rule_ref: shared-rule.no-armour
- id: warhounds--animals
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.horned-hunters.warhounds.animals
      scope: 'NO'
      binding: null
      reason: out-of-scope.campaign
  name: Animals
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 5 Warhounds / Special Rules / Animals
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/horned-hunters
  name_i18n:
    es: Animales
  applies_to:
    profile_ids:
    - warhounds
  rule_ref: shared-rule.animal
- id: band--woodcraft
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.horned-hunters.band.woodcraft
      scope: 'NO'
      binding: null
      reason: out-of-scope.movement
  name: Woodcraft
  effect: >-
    Horned Hunter warbands move through any difficult terrain without suffering movement penalties.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: special rules / Woodcraft
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/horned-hunters
  name_i18n:
    es: Artes Bosque
  effect_i18n:
    es: >-
      Las bandas de Cazadores de Cuernos se mueven por cualquier terreno dificultoso sin sufrir
      penalizaciones de movimiento.
  applies_to:
    band: true
- id: band--horned-hunter-special-skills-master-trapper
  kind: warband_skill
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.horned-hunters.band.horned-hunter-special-skills-master-trapper
      scope: 'NO'
      binding: null
      reason: out-of-scope.movement
  name: Master Trapper
  effect: >-
    This huntsman is a masterful trap setter. Trip wire range has been extended by this warrior to
    reach 4". Traps set by a master trapper are triggered by a score of 2+.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Horned Hunter Special Skills / master trapper
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/horned-hunters
  name_i18n:
    es: Maestro Trampero
  effect_i18n:
    es: >-
      Este cazador es un maestro tendiendo trampas. Este guerrero ha extendido el alcance del cable
      trampa hasta 4". Las trampas tendidas por un maestro trampero se activan con un resultado de
      2+.
  applies_to:
    band: true
- id: band--horned-hunter-special-skills-infiltration
  kind: warband_skill
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.horned-hunters.band.horned-hunter-special-skills-infiltration
      scope: 'NO'
      binding: null
      reason: out-of-scope.movement
  name: Infiltration
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Horned Hunter Special Skills / infiltration
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/horned-hunters
  name_i18n:
    es: Infiltración
  applies_to:
    band: true
  rule_ref: shared-rule.infiltration
- id: band--horned-hunter-special-skills-foul-odour
  kind: warband_skill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: mechanic.foul-odour
      scope: 'YES'
      binding:
        kind: mechanic
        id: mechanic.foul-odour
  name: Foul Odour
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Horned Hunter Special Skills / foul odour
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/horned-hunters
  name_i18n:
    es: Hedor
  applies_to:
    band: true
  rule_ref: shared-rule.foul-odour
- id: band--horned-hunter-special-skills-animal-friendship
  kind: warband_skill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: trait.animal-friendship
      scope: 'YES'
      binding:
        kind: trait
        id: trait.animal-friendship
        parameters:
          value: true
      clauses:
      - id: whole--scope--animals-never-attack
        scope: 'YES'
      - id: whole--scope--wardog-count
        scope: 'NO'
      - id: wardog-count
        scope: 'NO'
  name: Animal Friendship
  effect: >-
    Having grown up amidst the animals of the forest this warrior exudes a certain charm to all
    'normal' animals (warhorses, warhounds, etc.). Animals will never attack him and up to two
    wardogs that the warrior owns do not count against the maximum number of models in the Warband.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Horned Hunter Special Skills / animal friendship
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/horned-hunters
  name_i18n:
    es: Amistad Animal
  effect_i18n:
    es: >-
      Habiéndose criado entre los animales del bosque, este guerrero irradia un cierto encanto a
      todos los animales 'normales' (corceles de guerra, sabuesos de guerra, etc.). Los animales
      jamás lo atacarán y hasta dos perros de guerra que posea el guerrero no cuentan para el número
      máximo de modelos de la banda.
  applies_to:
    band: true
- id: band--horned-hunter-special-skills-pathfinder
  kind: warband_skill
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.horned-hunters.band.horned-hunter-special-skills-pathfinder
      scope: 'NO'
      binding: null
      reason: out-of-scope.campaign
  name: Pathfinder
  effect: >-
    Taal has gifted this hunter with an uncanny ability to find paths through unexplored
    territories. Roll one additional D6 during the exploration phase. A warband may only contain one
    pathfinder.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Horned Hunter Special Skills / pathfinder
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/horned-hunters
  name_i18n:
    es: Explorador
  effect_i18n:
    es: >-
      Taal ha dotado a este cazador de una asombrosa capacidad para encontrar caminos por
      territorios inexplorados. Tira 1D6 adicional durante la fase de exploración. Una banda solo
      puede contener un explorador.
  applies_to:
    band: true
- id: band--horned-hunter-special-skills-hide-in-shadows
  kind: warband_skill
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.horned-hunters.band.horned-hunter-special-skills-hide-in-shadows
      scope: 'NO'
      binding: null
      reason: out-of-scope.movement
  name: Hide in Shadows
  effect: >-
    The hunter has learned to crouch unseen in any cover they can find. Enemy models must halve
    their Initiative when attempting to find this warrior when he is Hidden.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Horned Hunter Special Skills / hide in shadows
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/horned-hunters
  name_i18n:
    es: Ocultarse en las Sombras
  effect_i18n:
    es: >-
      El cazador ha aprendido a agazaparse sin ser visto en cualquier cobertura que encuentre. Los
      modelos enemigos deben dividir a la mitad su Iniciativa al intentar encontrar a este guerrero
      cuando esté Oculto.
  applies_to:
    band: true

- id: warhounds--equipment-restrictions
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: profile.equipment-restrictions
      scope: 'YES'
      binding:
        kind: profile
        id: profile.equipment-restrictions
        parameters:
          forbids:
          - weapons
          - armour
  name: Equipment Restrictions
  source:
    manual: mordheimer.net
    printed_page: 0
    section: "0 \u2013 5 Warhounds"
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/horned-hunters
  name_i18n:
    es: Restricciones de Equipo
  applies_to:
    profile_ids:
    - warhounds
  rule_ref: shared-rule.no-weapons-or-armour
- id: drunken-gang--equipment-restrictions
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: profile.equipment-restrictions
      scope: 'YES'
      binding:
        kind: profile
        id: profile.equipment-restrictions
        parameters:
          forbids:
          - armour
  name: Equipment Restrictions
  effect: >-
    May select weapons from the Henchmen Equipment List; the profile entry does not allow armour.
  source:
    manual: mordheimer.net
    printed_page: 0
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/horned-hunters
    section: Henchmen / Drunken Gang
  name_i18n:
    es: Restricciones de Equipo
  effect_i18n:
    es: >-
      Puede seleccionar armas de la Lista de Equipo de Secuaces; la entrada del perfil no permite
      armadura.
  applies_to:
    profile_ids:
    - drunken-gang
