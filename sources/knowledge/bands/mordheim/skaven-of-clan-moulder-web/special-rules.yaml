  rule_ref: shared-rule.experience
- id: rat-ogres--large-target
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.skaven-of-clan-moulder-web.rat-ogres.large-target
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: Large Target shooting modifiers are outside the current engine scope.
  name: Large Target
  source:
    manual: mordheimer.net
    printed_page: 0
    section: 0-2 Rat Ogres / Special Rules / Large Target
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/skaven-of-clan-moulder
  name_i18n:
    es: Objetivo Grande
  applies_to:
    profile_ids:
    - rat-ogres
  rule_ref: shared-rule.large-target
- id: rat-ogres--its-alive
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.skaven-of-clan-moulder-web.rat-ogres.its-alive
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: mutation purchases are roster-construction/campaign mechanics outside
        the duel scope.
  name: It's Alive!
  effect: >-
    Moulder Rat Ogres are twisted creatures ever subject to the cruel curiosity of their masters.
    When hired each Rat Ogre must purchase a single Mutation from the list in the Mordheim Rulebook
    at the listed price (see Possessed Warband section).
  source:
    manual: mordheimer.net
    printed_page: 0
    section: 0-2 Rat Ogres / Special Rules / It's Alive!
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/skaven-of-clan-moulder
  name_i18n:
    es: ¡Está Vivo!
  effect_i18n:
    es: >-
      Los Ogros Rata de Moulder son criaturas retorcidas siempre expuestas a la cruel curiosidad de
      sus amos. Al ser contratado, cada Ogro Rata debe comprar una única Mutación de la lista del
      libro de reglas de Mordheim por el precio indicado (ver la sección de la banda de los
      Endemoniados).
  applies_to:
    profile_ids:
    - rat-ogres
- id: rat-ogres--hard-to-handle
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.skaven-of-clan-moulder-web.rat-ogres.hard-to-handle
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: henchmen grouping rules are roster-construction mechanics outside the
        duel scope.
  name: Hard to Handle
  effect: >-
    Rat Ogres can only be bought individually, they never form a Henchmen Group even if you hire
    more than one.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: 0-2 Rat Ogres / Special Rules / Hard to Handle
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/skaven-of-clan-moulder
  name_i18n:
    es: Difíciles de Manejar
  effect_i18n:
    es: >-
      Los Ogros Rata solo pueden comprarse individualmente; nunca forman un Grupo de Secuaces
      incluso si contratas más de uno.
  applies_to:
    profile_ids:
    - rat-ogres
- id: band--clan-moulder-special-skills
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.skaven-of-clan-moulder-web.special.clan-moulder-special-skills
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: skill selections on promotion are advancement-time mechanics outside the
        duel scope (Black Hunger's combat-relevant effect is a candidate for later implementation).
  name: Clan Moulder Special Skills
  effect: >-
    Clan Moulder heroes may choose to use the following Skill list instead of any of the standard
    Skill tables available to them. Black Hunger: the Hero may declare at the beginning of his turn
    that he is using this skill; he may add +1 attack and +D3" to the total move on his profile for
    the duration of his own turn, but will suffer D3 S3 hits with no armour save possible at the end
    of the turn. Beastkin: the range at which any Beast/Animal Handling skills operate is doubled to
    12". Hypnotic Musk: any animal or beast from an opposing warband wishing to charge him must pass
    a Leadership test to do so unless said charge is the result of Goading; mounts are immune.
    Subjugator of Mankind: if a Hero with this skill and equipped with a Thingcatcher takes an
    opposing model out of action, do not roll for injuries post-battle, instead treat the enemy as
    if they'd rolled Captured on the Serious Injuries chart; large creatures such as Ogres cannot be
    caught this way, but animals can. Twistkin (Stormvermin only): upon taking this skill the Hero
    must buy a Mutation from the list in the Mordheim Rulebook (see Possessed Warband) at half the
    listed cost.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Skills
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/skaven-of-clan-moulder
  name_i18n:
    es: Habilidades Especiales del Clan Moulder
  effect_i18n:
    es: >-
      Los héroes del Clan Moulder pueden elegir usar la siguiente lista de habilidades en lugar de
      cualquiera de las tablas de habilidades estándar disponibles para ellos. Hambre Negra: el
      Héroe puede declarar al comienzo de su turno que usa esta habilidad; puede añadir +1 ataque y
      +D3" a su movimiento total durante su propio turno, pero sufrirá D3 impactos de F3 sin posible
      salvación por armadura al final del turno. Semejante a Bestias: el alcance al que operan las
      habilidades de Manejo de Bestias/Animales se duplica a 12". Almizcle Hipnótico: cualquier
      animal o bestia de una banda oponente que quiera cargar contra él debe superar una prueba de
      Liderazgo para hacerlo, salvo que la carga sea resultado de un Azuzamiento; las monturas son
      inmunes. Sojuzgador de la Humanidad: si un Héroe con esta habilidad y equipado con un
      Atrapacosas deja Fuera de Combate a un modelo oponente, no tires heridas tras la partida; en
      su lugar, trata al enemigo como si hubiera sacado Capturado en la tabla de Heridas Graves;
      criaturas grandes como los Ogros no pueden capturarse así, pero los animales sí. Retorcido
      (solo Guerreros Tormenta): al tomar esta habilidad, el Héroe debe comprar una Mutación de la
      lista del libro de reglas de Mordheim (ver banda de los Endemoniados) a mitad del precio
      indicado.
  applies_to:
    band: true
