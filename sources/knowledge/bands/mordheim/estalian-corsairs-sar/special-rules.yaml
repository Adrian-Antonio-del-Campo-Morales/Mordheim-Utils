  name: Estalian Special Rules
  effect: >-
    All Estalian Captains and Champions start off with the skill Expert Swordsman. In addition,
    Rapiers and Heavy Armor are added to the Pirate Equipment List. Alternatively, Crossbows are
    removed from the Pirate Equipment list.
  source:
    manual: broheim.net
    printed_page: 2
    section: Estalian Special Rules
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Human%20Pirates.pdf
  name_i18n:
    es: Reglas Especiales Estalianas
  effect_i18n:
    es: >-
      Todos los Capitanes y Campeones Estalianos empiezan con la habilidad Espadachín Experto.
      Además, las Estoque y la Armadura Pesada se añaden a la Lista de Equipo Pirata. Por su parte,
      las Ballestas se retiran de la Lista de Equipo Pirata.
  applies_to:
    band: true
