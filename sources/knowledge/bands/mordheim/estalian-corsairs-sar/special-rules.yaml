- id: pirates--no-armour
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: profile.equipment-restrictions
      scope: 'YES'
      binding:
        kind: profile
        id: profile.equipment-restrictions
        parameters:
          # The Estalian Special Rules add the heavy armour line to the Pirate
          # Equipment List, so the printed 'may not wear armour' refuses the
          # other body armour that same list offers and leaves the added heavy
          # armour selectable, per the F074-pirate-variants ruling.
          forbids:
          - armour.light-armour
          - armour.toughened-leathers
  name: No Armour
  source:
    manual: broheim.net
    printed_page: 2
    section: profile entries / No Armour
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Human%20Pirates.pdf
  name_i18n:
    es: Sin Armadura
  applies_to:
    profile_ids:
    - captain
    - mates
    - cabin-boys
    - crew
    - gunners
    - boatswains
  # Not shared: the Estalian variant forbids only light armour and toughened leathers, so heavy armour
  # stays selectable (F074-pirate-variants).
  effect: >-
    This warrior may not wear light armour or toughened leathers. The heavy armour the Estalian
    Special Rules add to the Pirate Equipment List remains available, and shields, bucklers and
    helmets are not affected by this restriction.
  effect_i18n:
    es: >-
      Este guerrero no puede llevar armadura ligera ni cuero endurecido. La armadura pesada que las
      Reglas especiales estalianas añaden a la Lista de equipo pirata sigue disponible, y los
      escudos, las rodelas y los yelmos no se ven afectados por esta restricción.
