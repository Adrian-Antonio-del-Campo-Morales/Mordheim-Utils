      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: no effect applies to the isolated 1v1 duel or legal fighter skill/equipment
        construction.
- id: band--restless-dead-special-skills-deathspeaker
  kind: warband_skill
  name: Deathspeaker
  effect: At the start of the battle, the undead player may deploy D3 Zombies for free. These zombies
    do not count towards the maximum number of models in the warband, but increase the warband's rating
    as normal. Zombies created in this way may not be used as Corpse Bombs. These Zombies only last for
    the duration of the battle.
