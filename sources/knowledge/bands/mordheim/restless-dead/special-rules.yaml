    - scarecrows
- id: scarecrows--animated-construct
  name: Animated Construct
  effect: Each Scarecrow must be assigned to either the Liche or the Necromancer as its controller, and
    each controller may control only one Scarecrow. Therefore two Scarecrows may only be fielded if both
    a Liche and a Necromancer are present. If a controller cannot participate in a battle, its Scarecrow
    cannot participate either. Whenever the controller loses a Wound, it must pass an unmodified Leadership
    test or the magical bond is broken and the Scarecrow is immediately taken Out of Action.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 - 2 Scarecrows / Special Rules / Animated Construct
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/restless-dead
  name_i18n:
    en: Animated Construct
    es: Construcción animada
  effect_i18n:
    en: Each Scarecrow must be assigned to either the Liche or the Necromancer as its controller, and
      each controller may control only one Scarecrow. Therefore two Scarecrows may only be fielded if
      both a Liche and a Necromancer are present. If a controller cannot participate in a battle, its
      Scarecrow cannot participate either. Whenever the controller loses a Wound, it must pass an unmodified
      Leadership test or the magical bond is broken and the Scarecrow is immediately taken Out of Action.
    es: Cada Espantapájaros debe ser asignado al Liche o al Nigromante como su controlador, y cada controlador
      solo puede controlar un Espantapájaros. Por tanto, solo pueden desplegarse dos Espantapájaros si
      están presentes tanto un Liche como un Nigromante. Si un controlador no puede participar en una
      batalla, su Espantapájaros tampoco puede participar. Siempre que el controlador pierda una Herida,
      debe superar un chequeo de Liderazgo sin modificadores o el vínculo mágico se romperá y el Espantapájaros
      será inmediatamente puesto Fuera de combate.
  applies_to:
    profile_ids:
    - scarecrows
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
