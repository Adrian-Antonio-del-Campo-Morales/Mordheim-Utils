- id: band--restless-dead-special-skills-corpse-bomb
  kind: warband_skill
  name: Corpse Bomb
  effect: Special magics and rituals can cause a Zombie to explode when they are near the enemy. Secretly
    nominate one Zombie at the beginning of the battle to be a Corpse Bomb. If the enemy charges or is
    charged by the Zombie, it immediately detonates. All models within D6 inches take D3 Strength 4 hits.
    The detonated Zombie may never be used again as it is splattered in a million pieces! Corpse bombs
    killed by shooting do not detonate. Only one Zombie at a time can be a corpse bomb although the skill
    can be taken by both the Necromancer and the Liche.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Restless Dead special skills / corpse bomb
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/restless-dead
  name_i18n:
    en: Corpse Bomb
    es: Bomba de cadáver
  effect_i18n:
    en: 'Special magics and rituals can cause a Zombie to

      explode when they are near the enemy. Secretly

      nominate one Zombie at the beginning of the battle to

      be a Corpse Bomb. If the enemy charges or is charged

      by the Zombie, it immediately detonates. All models

      within D6 inches take D3 Strength 4 hits. The

      detonated Zombie may never be used again as it is

      splattered in a million pieces! Corpse bombs killed by

      shooting do not detonate. Only one Zombie at a time

      can be a corpse bomb although the skill can be taken

      by both the Necromancer and the Liche.'
    es: Magias y rituales especiales pueden hacer que un Zombi explote cuando está cerca del enemigo.
      Designa en secreto un Zombi al comienzo de la batalla como Bomba de cadáver. Si el enemigo carga
      o es cargado por el Zombi, este detona inmediatamente. Todas las miniaturas dentro de D6 pulgadas
      sufren D3 impactos de Fuerza 4. ¡El Zombi detonado nunca puede usarse de nuevo, ya que queda salpicado
      en un millón de trozos! Las bombas de cadáver muertas por disparo no detonan. Solo un Zombi a la
      vez puede ser una bomba de cadáver, aunque la habilidad puede ser tomada tanto por el Nigromante
      como por el Liche.
  eligibility:
