    printed_page: 0
    section: henchmen / 0 - 2 Scarecrows / Special Rules / Construct
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/restless-dead
  name_i18n:
    en: Construct
    es: Construcción
  effect_i18n:
    en: The scarecrow is an undead construct and may re-roll any rolls on the injury table except for
      wounds caused by fire.
    es: El espantapájaros es una construcción muerta viviente y puede repetir cualquier tirada en la tabla
      de heridas excepto las heridas causadas por el fuego.
  applies_to:
