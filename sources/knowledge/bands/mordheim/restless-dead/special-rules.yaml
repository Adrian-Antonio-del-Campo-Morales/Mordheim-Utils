    es: Toque de espectro
  effect_i18n:
    en: 'The hero may make a Wraith Touch attack instead of their normal attacks in close combat. The
      hero making

      a Wraith Touch makes a single unarmed attack, if it

      hits, it wounds automatically, all rules that apply to

      unarmed attacks apply to the Wraith Touch. If a Liche

      uses this skill and wounds, then he may regain one

      lost wound. This may not take the hero beyond his

      starting total. Necromancers do not regain wounds

      with this skill. This skill has no effect on the Possessed

      or Undead.'
    es: El héroe puede realizar un ataque de Toque de espectro en lugar de sus ataques normales en combate
      cuerpo a cuerpo. El héroe que realiza un Toque de espectro hace un único ataque desarmado; si impacta,
      hiere automáticamente; todas las reglas que aplican a los ataques desarmados aplican al Toque de
      espectro. Si un Liche usa esta habilidad y hiere, puede recuperar una herida perdida. Esto no puede
      llevar al héroe más allá de su total inicial. Los Nigromantes no recuperan heridas con esta habilidad.
