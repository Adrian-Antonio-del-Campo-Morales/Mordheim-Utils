- id: necromancer--apprentices
  name: Apprentices
  effect: Necromancers may only ever know spells known by their Liche masters. Even if they did know spells
    the Liche didn't, they wouldn't dare use them for fear of their master's response for their arrogance!
    If the Liche is ever killed, the Necromancer can continue to learn magic spells as a normal wizard,
    ignoring the Apprentice rule.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 - 1 Necromancer / Special Rules / Apprentices
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/restless-dead
  name_i18n:
    en: Apprentices
    es: Aprendices
  effect_i18n:
    en: 'Necromancers may only ever know spells known by their Liche masters. Even if they did know

      spells the Liche didn''t, they wouldn''t dare use them

      for fear of their master''s response for their arrogance!

      If the Liche is ever killed, the Necromancer can continue to learn magic spells as a normal wizard,

      ignoring the Apprentice rule.'
    es: Los Nigromantes solo pueden conocer jamás los hechizos conocidos por sus amos liches. ¡Aunque
      conocieran hechizos que el Liche no, no se atreverían a usarlos por temor a la respuesta de su amo
      ante su arrogancia! Si el Liche muere alguna vez, el Nigromante puede continuar aprendiendo hechizos
      de magia como un mago normal, ignorando la regla de Aprendiz.
  applies_to:
    profile_ids:
    - necromancer
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.restless-dead.necromancer.apprentices
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology or mounts.'
- id: necromancer--gofer
  name: Gofer
  effect: as an Apprentice, the Necromancer spends much of their time running errands for their Liche
    masters and over the years get exceptionally good at it. When a Necromancer searches for rare items,
    they roll 3D6 and pick the two highest.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 - 1 Necromancer / Special Rules / Gofer
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/restless-dead
  name_i18n:
    en: Gofer
    es: Recadero
  effect_i18n:
    en: 'as an Apprentice, the Necromancer spends much of their time running errands for their Liche

      masters and over the years get exceptionally good at it.

      When a Necromancer searches for rare items, they roll 3D6 and pick the two highest.'
    es: Como aprendiz, el Nigromante pasa gran parte de su tiempo haciendo recados para sus amos liches
      y con los años se vuelve excepcionalmente bueno en ello. Cuando un Nigromante busca objetos raros,
      tira 3D6 y elige los dos más altos.
  applies_to:
    profile_ids:
    - necromancer
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.restless-dead.necromancer.gofer
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, or non-duel context.'
- id: grave-guards--wight-blades
  name: Wight Blades
  effect: Grave Guards carry weapons laden with evil magic. All close combat 'to hit' rolls of a 6 will
    automatically wound. You may roll 'to wound' as normal to determine if it is a 'critical hit', but
    even a failed 'to wound' roll will still cause a wound if a 6 was rolled first 'to hit'.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 - 3 Grave Guards / Special Rules / Wight Blades
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/restless-dead
  name_i18n:
    en: Wight Blades
    es: Hojas de espectro
  effect_i18n:
    en: Grave Guards carry weapons laden with evil magic. All close combat 'to hit' rolls of a 6 will
      automatically wound. You may roll 'to wound' as normal to determine if it is a 'critical hit', but
      even a failed 'to wound' roll will still cause a wound if a 6 was rolled first 'to hit'.
    es: Los Guardianes de la Tumba portan armas cargadas de magia maligna. Todas las tiradas de 'impactar'
      de combate cuerpo a cuerpo de un 6 hieren automáticamente. Puedes tirar 'para herir' con normalidad
      para determinar si es un 'golpe crítico', pero incluso una tirada de 'herir' fallida seguirá causando
      una herida si primero se sacó un 6 'para impactar'.
  applies_to:
    profile_ids:
    - grave-guards
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: trait.wight-blades
      scope: 'YES'
      binding:
        kind: trait
        id: trait.wight-blades
        parameters:
          value: true
