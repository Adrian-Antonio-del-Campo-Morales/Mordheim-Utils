schema_version: 2
band_id: restless-dead
rules:
- id: liche--wizard
  name: Wizard
  effect: The Liche is a Wizard and starts with two randomly generated Necromantic spells. The spell list
    itself is not modelled here.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 1 Liche / Special Rules / Wizard
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/restless-dead
  name_i18n:
    en: Wizard
    es: Mago
  effect_i18n:
    en: The Liche is a Wizard and starts with two randomly generated Necromantic spells. The spell list
      itself is not modelled here.
    es: El Liche es un Mago y comienza con dos hechizos Nigrománticos generados aleatoriamente. La propia
      lista de hechizos no está modelada aquí.
  applies_to:
    profile_ids:
    - liche
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.restless-dead.liche.wizard
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, or non-duel context.'
- id: liche--cause-fear
  name: Cause Fear
  effect: A Liche is a horrible abomination and causes fear.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 1 Liche / Special Rules / Cause Fear
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/restless-dead
  name_i18n:
    en: Cause Fear
    es: Provocar miedo
  effect_i18n:
    en: A Liche is a horrible abomination and causes fear.
    es: Un Liche es una abominación horrible y provoca miedo.
  applies_to:
    profile_ids:
    - liche
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.restless-dead.liche.cause-fear
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology or mounts.'
- id: liche--immune-to-psychology
  name: Immune to Psychology
  effect: A Liche is not affected by psychology and never leaves combat.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 1 Liche / Special Rules / Immune to Psychology
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/restless-dead
  name_i18n:
    en: Immune to Psychology
    es: Inmune a la psicología
  effect_i18n:
    en: A Liche is not affected by psychology and never leaves combat.
    es: Un Liche no se ve afectado por la psicología y nunca abandona el combate.
  applies_to:
    profile_ids:
    - liche
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.restless-dead.liche.immune-to-psychology
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology or mounts.'
- id: liche--no-pain
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: skill.ignore-pain
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.ignore-pain
  name: No Pain
  effect: A Liche treats a stunned result on the injury chart as knocked down.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 1 Liche / Special Rules / No Pain
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/restless-dead
  name_i18n:
    en: No Pain
    es: Sin dolor
  effect_i18n:
    en: A Liche treats a stunned result on the injury chart as knocked down.
    es: Un Liche trata un resultado de Aturdido en la tabla de heridas como Derribado.
  applies_to:
    profile_ids:
    - liche
- id: liche--immune-to-poison
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: trait.poison-immune
      scope: 'YES'
      binding:
        kind: trait
        id: trait.poison-immune
        parameters:
          value: true
  name: Immune to Poison
  effect: A Liche is not affected by poison.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 1 Liche / Special Rules / Immune to Poison
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/restless-dead
  name_i18n:
    en: Immune to Poison
    es: Inmune al veneno
  effect_i18n:
    en: A Liche is not affected by poison.
    es: Un Liche no se ve afectado por el veneno.
  applies_to:
    profile_ids:
    - liche
- id: liche--eternal
  name: Eternal
  effect: A Liche can choose to ignore any result on the Hero's Serious Injury chart except Killed by
    taking a permanent -1 on their starting Wound profile. Obviously, a Liche with 1 Wound remaining on
    their starting profile does not have this option. A Liche that gets a Killed result instead takes
    a permanent -D3 Wounds on their starting profile. If this takes their starting Wound total to 0 or
    less, the Liche is Killed as normal.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 1 Liche / Special Rules / Eternal
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/restless-dead
  name_i18n:
    en: Eternal
    es: Eterno
  effect_i18n:
    en: 'A Liche can choose to ignore any result on the Hero''s Serious Injury chart except Killed by
      taking a permanent -1 on their starting Wound profile. Obviously, a Liche with 1 Wound remaining
      on their

      starting profile does not have this option. A Liche that

      gets a Killed result instead takes a permanent -D3 Wounds on their starting profile. If this takes
      their

      starting Wound total to 0 or less, the Liche is Killed as normal.'
    es: Un Liche puede elegir ignorar cualquier resultado de la tabla de Heridas Graves de Héroes excepto
      Muerto, tomando un -1 permanente en su perfil inicial de Heridas. Obviamente, un Liche con 1 Herida
      restante en su perfil inicial no tiene esta opción. Un Liche que obtenga un resultado de Muerto
      en su lugar toma un -D3 de Heridas permanente en su perfil inicial. Si esto lleva su total inicial
      de Heridas a 0 o menos, el Liche muere con normalidad.
  applies_to:
    profile_ids:
    - liche
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.restless-dead.liche.eternal
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: no effect applies to the isolated 1v1 duel or legal fighter skill/equipment
        construction.
- id: liche--feed-upon-magic
  name: Feed Upon Magic
  effect: A Liche can perform spells that, with the consumption of D3 Treasures, can give the Liche a
    permanent +1 Wound on their starting profile. This can only be used in between battles and cannot
    be used if the Liche searches for rare items or was put out of action in the previous battle. If the
    warband does not have enough Treasures to complete the spell, then the Treasures are consumed anyway
    and the Liche does not gain the Wound.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 1 Liche / Special Rules / Feed Upon Magic
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/restless-dead
  name_i18n:
    en: Feed Upon Magic
    es: Alimentarse de magia
  effect_i18n:
    en: 'A Liche can perform spells that, with the consumption of D3 Treasures, can give the

      Liche a permanent +1 Wound on their starting profile.

      This can only be used in between battles and cannot

      be used if the Liche searches for rare items or was put out of action in the previous battle. If
      the warband does not have enough Treasures to complete the spell, then the Treasures are consumed
      anyway and the Liche does not gain the Wound.'
    es: Un Liche puede realizar hechizos que, con el consumo de D3 Tesoros, pueden darle al Liche un +1
      permanente de Heridas en su perfil inicial. Esto solo puede usarse entre batallas y no puede usarse
      si el Liche busca objetos raros o fue puesto fuera de combate en la batalla anterior. Si la banda
      no tiene suficientes Tesoros para completar el hechizo, los Tesoros se consumen de todos modos y
      el Liche no gana la Herida.
  applies_to:
    profile_ids:
    - liche
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.restless-dead.liche.feed-upon-magic
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, or non-duel context.'
- id: liche--warrior-wizard
  name: Warrior Wizard
  effect: The Liche may wear armour and cast spells. Indeed, it is often the clothing and armour alone
    that gives the Liche substance and form!
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 1 Liche / Special Rules / Warrior Wizard
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/restless-dead
  name_i18n:
    en: Warrior Wizard
    es: Guerrero mago
  effect_i18n:
    en: 'The Liche may wear armour and cast spells. Indeed, it is often the clothing and armour

      alone that gives the Liche substance and form!'
    es: El Liche puede llevar armadura y lanzar hechizos. De hecho, ¡a menudo son solo las ropas y la
      armadura las que dan al Liche sustancia y forma!
  applies_to:
    profile_ids:
    - liche
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: compiler.warrior-wizard
      scope: 'YES'
      binding:
        kind: compiler
        id: compiler.warrior-wizard
- id: liche--advancement
  name: Advancement
  effect: If a Liche gets an advance roll of +1 Wound, they may instead pick a new skill from their available
    lists.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 1 Liche / Special Rules / Advancement
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/restless-dead
  name_i18n:
    en: Advancement
    es: Progresión
  effect_i18n:
    en: 'If a Liche gets an advance roll of +1 Wound, they may instead pick a new skill from their

      available lists.'
    es: Si un Liche obtiene una tirada de progreso de +1 Herida, puede en su lugar elegir una nueva habilidad
      de sus listas disponibles.
  applies_to:
    profile_ids:
    - liche
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.restless-dead.liche.advancement
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, or non-duel context.'
- id: necromancer--wizard
  name: Wizard
  effect: The Necromancer is a Wizard and starts knowing one of the Liche's two Necromantic spells. The
