- id: scarecrows--no-substance
  name: No Substance
  effect: The scarecrow is incredibly difficult to take down with shooting as there are few vital parts
    to hit. The scarecrow counts as having a T6 against all shooting and magical missiles, likewise, a
    scarecrow is immune to critical hits caused by shooting. The exception to this rule is missile weapons
    or spells that are fire based which deal damage as normal.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 - 2 Scarecrows / Special Rules / No Substance
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/restless-dead
  name_i18n:
    en: No Substance
    es: Sin sustancia
  effect_i18n:
    en: The scarecrow is incredibly difficult to take down with shooting as there are few vital parts
      to hit. The scarecrow counts as having a T6 against all shooting and magical missiles, likewise,
      a scarecrow is immune to critical hits caused by shooting. The exception to this rule is missile
      weapons or spells that are fire based which deal damage as normal.
    es: El espantapájaros es increíblemente difícil de derribar con disparos, ya que hay pocas partes
      vitales a las que golpear. El espantapájaros cuenta como si tuviera R6 contra todos los disparos
      y proyectiles mágicos; asimismo, un espantapájaros es inmune a los golpes críticos causados por
      disparos. La excepción a esta regla son las armas arrojadizas o hechizos de base fuego, que causan
      daño con normalidad.
  applies_to:
    profile_ids:
    - scarecrows
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.restless-dead.scarecrows.no-substance
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, or non-duel context.'
- id: scarecrows--flammable
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: trait.flammable
      scope: 'YES'
      binding:
        kind: trait
        id: trait.flammable
        parameters:
          value: true
    - id: trait.caught-fire-threshold
      scope: 'YES'
      binding:
        kind: trait
        id: trait.caught-fire-threshold
        parameters:
          value: 3
  name: Flammable
  effect: The scarecrow is primarily ratty cloth, straw and preserved body parts so as a result they burn
    very easily. Scarecrows count as being flammable. In addition, a scarecrow will be 'caught fire' on
    the roll of a 3+ as opposed to the normal 4+.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 - 2 Scarecrows / Special Rules / Flammable
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/restless-dead
  name_i18n:
    en: Flammable
    es: Inflamable
  effect_i18n:
    en: 'The scarecrow is primarily ratty cloth, straw and preserved body parts so as a result they

      burn very easily. Scarecrows count as being flammable. In addition, a scarecrow will be ''caught
      fire'' on the roll of a 3+ as opposed to the normal 4+.'
    es: El espantapájaros es principalmente trapo raído, paja y partes del cuerpo conservadas, por lo
      que arde con mucha facilidad. Los Espantapájaros cuentan como inflamables. Además, un espantapájaros
      'prenderá fuego' con una tirada de 3+ en lugar de los 4+ normales.
  applies_to:
    profile_ids:
    - scarecrows
