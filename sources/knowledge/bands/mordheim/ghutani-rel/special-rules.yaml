schema_version: 2
band_id: ghutani-rel
rules:
- id: band--bitter-enmity
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.ghutani-rel.band.bitter-enmity
      scope: LATER
      binding: null
      reason: deferred.other
      clauses:
      - id: injury-chart-substitution
        scope: 'NO'
  name: Bitter Enmity (Blood Must Be Repaid with Blood)
  effect: >-
    The Ghutani live by their ancient code of honour that demands that blood must be repaid with
    blood. Any injured Ghutani hero that rolls 51-56 on the injury chart counts as gaining the
    Bitter Enmity result.
  source:
    manual: broheim.net
    printed_page: 2
    section: Arabian Tribes / Ghutani / Special Rules
    url: https://broheim.net/downloads/fo/97RelicsoftheCrusadesPt2.pdf
  name_i18n:
    es: Rencor Amargo (Sangre Debe Pagarse con Sangre)
  effect_i18n:
    es: >-
      Los Ghutani viven según su antiguo código de honor que exige que la sangre debe pagarse con
      sangre. Cualquier héroe Ghutani herido que saque 51-56 en la tabla de heridas cuenta como
      obteniendo el resultado de Rencor Amargo.
  applies_to:
    band: true
- id: band--ghutani-flagellants
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.ghutani-rel.band.ghutani-flagellants
      scope: 'NO'
      binding: null
      reason: out-of-scope.campaign
  name: Flagellants
  effect: >-
    A Ghutani that has seen too much dishonour heaped upon his people may become slightly unhinged.
    Therefore a Ghutani warband may hire up to 5 Flagellants as henchmen and they can choose
    equipment from the Townsmen equipment list.
  source:
    manual: broheim.net
    printed_page: 2
    section: Arabian Tribes / Ghutani / Special Rules
    url: https://broheim.net/downloads/fo/97RelicsoftheCrusadesPt2.pdf
  name_i18n:
    es: Flagelantes
  effect_i18n:
    es: >-
      Un Ghutani que ha visto demasiado deshonor acumulado sobre su gente puede volverse ligeramente
      desquiciado. Por tanto, una banda Ghutani puede contratar hasta 5 Flagelantes como secuaces y
      estos pueden elegir equipo de la lista de equipo de los Ciudadanos.
  applies_to:
    band: true
- id: band--ghutani-scholar-fields
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.ghutani-rel.band.ghutani-scholar-fields
      scope: 'NO'
      binding: null
      reason: pending-classification
  name: Scholar Fields of Study
  effect: Ghutani scholar fields of study may only be poetry or theology.
  source:
    manual: broheim.net
    printed_page: 2
    section: Arabian Tribes / Ghutani / Special Rules
    url: https://broheim.net/downloads/fo/97RelicsoftheCrusadesPt2.pdf
  name_i18n:
    es: Campos de Estudio de los Eruditos
  effect_i18n:
    es: Los campos de estudio de los eruditos Ghutani solo pueden ser poesía o teología.
  applies_to:
    band: true
- id: band--slaves-can-lead
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.ghutani-rel.band.slaves-can-lead
      scope: LATER
      binding: null
      reason: deferred.other
      clauses:
      - id: whole
        scope: 'NO'
  name: Slaves May Become Warband Leader
  effect: >-
    The honour code of the Arabian tribes demands that they treat slaves fairly. It is a regular
    occurrence for slaves, or the sons of slaves, to gain high positions in Araby, especially if
    they can prove themselves on the battlefield. Therefore, it is possible for a slave in an
    Arabian warband to become a warband leader.
  source:
    manual: broheim.net
    printed_page: 2
    section: Arabian Tribes / Ghutani / Special Rules
    url: https://broheim.net/downloads/fo/97RelicsoftheCrusadesPt2.pdf
  name_i18n:
    es: Los Esclavos Pueden Llegar a Líderes de Banda
  effect_i18n:
    es: >-
      El código de honor de las tribus arábigas exige que traten a los esclavos con justicia. Es
      habitual que los esclavos, o los hijos de esclavos, alcancen posiciones elevadas en Araby,
      sobre todo si demuestran su valía en el campo de batalla. Por tanto, es posible que un esclavo
      de una banda árabe se convierta en el líder de la banda.
  applies_to:
    band: true
- id: emir--leader
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: mechanic.leader-six
      scope: 'YES'
      binding:
        kind: mechanic
        id: mechanic.leader-six
  name: Leader
  source:
    manual: broheim.net
    printed_page: 4
    section: Heroes / 1 Emir / Special Rules / Leader
    url: https://broheim.net/downloads/fo/97RelicsoftheCrusadesPt2.pdf
  name_i18n:
    es: Líder
  applies_to:
    profile_ids:
    - emir
  rule_ref: shared-rule.leader
- id: scholar--field-of-scholarship
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: none
    effects:
    # Admitted half: the printed Poetry bonus raises the leader's own Leadership
    # by one on his first Leadership test of the scenario, and the caller
    # supplies the printed "won the last battle" fact as a current condition.
    - id: condition.poetry-victorious-leader
      scope: 'YES'
      binding:
        kind: mechanic
        id: condition.poetry-victorious-leader
    - id: scholar--field-of-scholarship.cartography-and-physiology
      scope: 'NO'
      binding: null
      reason: out-of-scope.campaign
    # The +1 Weapon Skill a turn for friendly models within six inches.
    - id: scholar--field-of-scholarship.poetry-ws-aura
      scope: 'NO'
      binding: null
      reason: out-of-scope.group
  name: Field of Scholarship
  source:
    manual: broheim.net
    printed_page: 4
    section: Heroes / 0-1 Scholar / Special Rules / Field of Scholarship
    url: https://broheim.net/downloads/fo/97RelicsoftheCrusadesPt2.pdf
  name_i18n:
    es: Campo de Erudición
  applies_to:
    profile_ids:
    - scholar
  rule_ref: shared-rule.field-of-scholarship
