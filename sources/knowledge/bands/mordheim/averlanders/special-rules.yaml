- id: bergjaeger--set-traps
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.averlanders.bergjaeger.set-traps
      scope: 'NO'
      binding: null
      reason: 'Out of scope: no effect applies to the isolated 1v1 duel or legal fighter skill/equipment
        construction.'
  name: Set Traps
  effect: Bergjaeger are expert trappers and hunters and these skills can be put to great use in the ruins
    of Mordheim. A Bergjaeger may set a trap if he spends a turn doing nothing else (he may not set traps
    if he’s just recovered from being Knocked Down). Place a marker in base contact with the Bergjager.
    When a model, friend or foe, moves within 2" of the marker he risks setting off the trap – roll a
    D6. On a score of 3+ he has triggered the trap and suffers a S4 hit (note that the Bergjager won’t
    trigger his own traps). If the trap did not wound the model or it didn’t trigger, the ‘victim’ may
    finish his move otherwise he is placed knocked Down or Stunned 2" from the marker. Regardless whether
    the trap was triggered or not, the marker is removed.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 – 2 Bergjaeger / Special Rules / Set Traps
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/averlander
  name_i18n:
    en: Set Traps
    es: Colocar trampas
  effect_i18n:
    en: Bergjaeger are expert trappers and hunters and these skills can be put to great use in the ruins
      of Mordheim. A Bergjaeger may set a trap if he spends a turn doing nothing else (he may not set
      traps if he’s just recovered from being Knocked Down). Place a marker in base contact with the Bergjager.
      When a model, friend or foe, moves within 2" of the marker he risks setting off the trap – roll
      a D6. On a score of 3+ he has triggered the trap and suffers a S4 hit (note that the Bergjager won’t
      trigger his own traps). If the trap did not wound the model or it didn’t trigger, the ‘victim’ may
      finish his move otherwise he is placed knocked Down or Stunned 2" from the marker. Regardless whether
      the trap was triggered or not, the marker is removed.
    es: 'Los Bergjäger son tramperos y cazadores expertos, y estas habilidades pueden resultar de gran
      utilidad en las ruinas de Mordheim. Un Bergjäger puede colocar una trampa si dedica un turno a no
      hacer nada más (no puede colocar trampas si acaba de recuperarse de estar Derribado). Coloca un
      marcador en contacto con el Bergjäger. Cuando un modelo, amigo o enemigo, se mueva a 2" del marcador,
      corre el riesgo de activar la trampa: tira 1D6. Con un resultado de 3+ ha activado la trampa y sufre
      un impacto de F4 (ten en cuenta que el Bergjäger no activará sus propias trampas). Si la trampa
      no hirió al modelo o no se activó, la ''víctima'' puede terminar su movimiento; de lo contrario,
      se coloca Derribado o Aturdido a 2" del marcador. Independientemente de si la trampa se activó o
      no, el marcador se retira.'
  applies_to:
    profile_ids:
    - bergjaeger
- id: halflings-scouts--promotion
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: compiler.promoted-hero-no-strength-access
      scope: 'YES'
      binding:
        kind: compiler
        id: compiler.promoted-hero-no-strength-access
  name: Promotion
  effect: A Halfling that is promoted to hero through the “The lad’s got talent” advance may not choose
    Strength skills as one of his two skill lists. Halflings are not known for their great strength!
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 3 Halflings Scouts / Special Rules / Promotion
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/averlander
  name_i18n:
    en: Promotion
    es: Promoción
  effect_i18n:
    en: A Halfling that is promoted to hero through the “The lad’s got talent” advance may not choose
      Strength skills as one of his two skill lists. Halflings are not known for their great strength!
    es: Un mediano ascendido a héroe mediante la mejora de 'El chico tiene talento' no puede elegir habilidades
      de Fuerza como una de sus dos listas de habilidades. ¡Los medianos no son conocidos por su gran
      fuerza!
  applies_to:
    profile_ids:
    - halflings-scouts
