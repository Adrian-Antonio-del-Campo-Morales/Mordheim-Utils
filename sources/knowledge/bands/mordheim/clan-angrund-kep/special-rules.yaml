- id: band--slayer-special-skills-ferocious-charge
  kind: warband_skill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: skill.ferocious-charge
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.ferocious-charge
  name: Ferocious Charge
  effect: >-
    The Slayer may double his attacks on the turn in which he charges. He the suffers a -1 to hit
    penalty that turn.
  source:
    manual: broheim.net
    printed_page: 20
    section: Troll Slayer Skills / Ferocious Charge
    url: https://broheim.net/downloads/campaigns/karakazgal/Karak Azgal.pdf
  name_i18n:
    es: Carga Feroz
  eligibility:
  - dwarf-troll-slayers
  effect_i18n:
    es: >-
      El Matatrolles puede doblar sus ataques en el turno en el que carga. Sufre entonces una
      penalización de -1 por impactar ese turno.
  applies_to:
    band: true
- id: band--slayer-special-skills-monster-slayer
  kind: warband_skill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: skill.monster-slayer
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.monster-slayer
      clauses:
      - id: wounds-on-four-plus
        scope: 'YES'
      - id: effective-strength-for-armour
        scope: 'YES'
  name: Monster Slayer
  effect: >-
    The Slayer always wounds any opponent on a roll of 4+, regardless of Toughness, unless his own
    Strength (after all modifiers for weapons used, etc) would mean that a lower roll than this is
    needed.
  source:
    manual: broheim.net
    printed_page: 20
    section: Troll Slayer Skills / Monster Slayer
    url: https://broheim.net/downloads/campaigns/karakazgal/Karak Azgal.pdf
  name_i18n:
    es: Matamostro
  eligibility:
  - dwarf-troll-slayers
  effect_i18n:
    es: >-
      El Matatrolles siempre hiere a cualquier oponente con una tirada de 4+, independientemente de
      la Resistencia, a menos que su propia Fuerza (tras todos los modificadores por armas usadas,
      etc.) signifique que se necesita una tirada menor.
  applies_to:
    band: true
- id: band--slayer-special-skills-berserker
  kind: warband_skill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: skill.berserker
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.berserker
  name: Berserker
  effect: >-
    The Slayer may add +1 to his 'close combat to hit' rolls during the turn in which he charges.
  source:
    manual: broheim.net
    printed_page: 20
    section: Troll Slayer Skills / Berserker
    url: https://broheim.net/downloads/campaigns/karakazgal/Karak Azgal.pdf
  name_i18n:
    es: Berserker
  eligibility:
  - dwarf-troll-slayers
  effect_i18n:
    es: >-
      El Matatrolles puede sumar +1 a sus tiradas «por impactar en combate cerrado» durante el turno
      en el que carga.
  applies_to:
    band: true

