  applies_to:
    profile_ids:
    - dwarf-troll-slayers
  rule_ref: shared-rule.deathwish
- id: dwarf-troll-slayers--slayer-skills
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: profile.skill-access
      scope: 'YES'
      binding:
        kind: profile
        id: profile.skill-access
        parameters:
          category: special
          skills:
          - skill.berserker
          - skill.ferocious-charge
          - skill.monster-slayer
  name: Slayer Skills
  effect: >-
    Troll Slayers may choose a kill from the Troll Slayer skill table instead of the normal skill
    table when they gain a new skill.
  source:
    manual: broheim.net
    printed_page: 20
    section: Heroes / 0-1 Dwarf Troll Slayer / Special Rules / Slayer Kills
    url: https://broheim.net/downloads/campaigns/karakazgal/Karak Azgal.pdf
  name_i18n:
    es: Habilidades de Matatrolles
  effect_i18n:
    es: >-
      Los Matatrolles pueden escoger una habilidad de la Tabla de Habilidades de Matatrolles en
      lugar de la tabla de habilidades normal cuando ganan una habilidad nueva.
  applies_to:
    profile_ids:
    - dwarf-troll-slayers
- id: ironbreaker--watch-out
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.clan-angrund-kep.ironbreaker.watch-out
      scope: LATER
      binding: null
      reason: out-of-scope.campaign
      clauses:
      - id: whole
        scope: 'NO'
  name: Watch Out!
  effect: >-
    An Ironbreaker knows all about the Underdeep and its perils and so he or any Dwarf 6" away may
    decide to reroll the result on the Encounter table that affects them.
  source:
    manual: broheim.net
    printed_page: 20
    section: Heroes / 0-1 Ironbreaker / Special Rules / Watch Out!
    url: https://broheim.net/downloads/campaigns/karakazgal/Karak Azgal.pdf
  name_i18n:
    es: ¡Cuidado!
  effect_i18n:
    es: >-
      Un Rompehierros conoce todas las profundidades y sus peligros, de modo que él o cualquier
      Enano a 6" puede decidir repetir el resultado en la tabla de Encuentros que les afecta.
  applies_to:
    profile_ids:
    - ironbreaker
