      scope: 'YES'
      binding:
        kind: mechanic
        id: mechanic.psychology-immunity
      clauses:
      - id: psychology-immunity
        scope: 'YES'
      - id: all-alone
        scope: 'NO'
  name: Deathwish
  source:
    manual: broheim.net
    printed_page: 20
    section: Heroes / 0-1 Dwarf Troll Slayer / Special Rules / Deathwish
    url: https://broheim.net/downloads/campaigns/karakazgal/Karak Azgal.pdf
  name_i18n:
