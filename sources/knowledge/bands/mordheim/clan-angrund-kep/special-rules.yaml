- id: dwarf-engineer--expert-weaponsmith
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.clan-angrund-kep.dwarf-engineer.expert-weaponsmith
      scope: 'NO'
      binding: null
      reason: out-of-scope.shooting
  name: Expert Weaponsmith
  effect: >-
    A Dwarf Engineer is a master of mechanical devices. By using stronger construction materials and
    time-tested secrets of Dwarf engineering, a Dwarf Engineer can increase the distance the
    warband's missile weapons can shoot. All Dwarf missile weapons in the warband have their range
    increased by 3" for pistols and 6" for crossbows and handguns. Any range increases are only
    maintained as long as the Dwarf Engineer remains with the warband.
  source:
    manual: broheim.net
    printed_page: 19
    section: Heroes / 0-1 Dwarf Engineer / Special Rules / Expert Weaponsmith
    url: https://broheim.net/downloads/campaigns/karakazgal/Karak Azgal.pdf
  name_i18n:
    es: Armero Experto
  effect_i18n:
    es: >-
      Un Ingeniero Enano es un maestro de los dispositivos mecánicos. Usando materiales de
      construcción más resistentes y secretos testificados por el tiempo de la ingeniería Enana, un
      Ingeniero Enano puede aumentar la distancia a la que disparan las armas de misil de la banda.
      Todas las armas de misil Enanas de la banda aumentan su alcance en 3" para pistolas y 6" para
      ballestas y armas de fuego. Los aumentos de alcance solo se mantienen mientras el Ingeniero
      Enano permanezca con la banda.
  applies_to:
    profile_ids:
    - dwarf-engineer
- id: dwarf-troll-slayers--deathwish
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
