          forbids:
          - armour
          - constant-save-cloak
          - non-thrown-ranged
  name: Equipment Restrictions
  source:
    manual: broheim.net
    printed_page: 19
    section: "Heroes / 0-1 Dwarf Troll Slayer"
    url: https://broheim.net/downloads/campaigns/karakazgal/Karak Azgal.pdf
  name_i18n:
    es: Restricciones de Equipo
  applies_to:
    profile_ids:
    - dwarf-troll-slayers
  rule_ref: shared-rule.no-missiles-or-armour
