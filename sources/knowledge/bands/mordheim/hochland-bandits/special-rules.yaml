  name: Sniper
  effect: The bandit is an expert at shooting his victims from the comfort of cover. When Hiding, the warrior may cast spells
    or shoot and still remain Hidden. Note that the bandit may not use this skill if he is shooting a Blackpowder weapon!
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Bandit Special Skills / sniper
