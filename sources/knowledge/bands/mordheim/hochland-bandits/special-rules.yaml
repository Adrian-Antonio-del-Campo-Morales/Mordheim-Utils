- id: huckster--slick-operator
  runtime:
    scope: "NO"
    implemented: "NO"
    grant: profile
    effects:
    - id: unimplemented.hochland-bandits.huckster.slick-operator
      scope: "NO"
      binding: null
      reason: "Out of scope: campaign."
  name: Slick Operator
  effect: 'In between games the player may choose to have the huckster run a con on the local

    inhabitants of the region. Roll a D6: On a result of 2-6,

    the con is successful and the warband gains 2D6 gold

    (the huckster keeps the rest). However, on a result of 1

    the huckster''s con has backfired and he is on the run

    (he misses the next game and no gold is received by

    the warband).'
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 – 1 Huckster / Special Rules / Slick Operator
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/hochland-bandits
  name_i18n:
    en: Slick Operator
    es: null
  effect_i18n:
