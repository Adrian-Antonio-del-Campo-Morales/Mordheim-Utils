  name: Trailblazers
  effect: Poachers are experts at finding new game or safe campsites for the warband. In the game this is represented by allowing
    the warband to reroll one D6 for each Poacher in the Exploration phase. Poachers are not as good as Elf Rangers for scouting,
    but they are often darned close!
  source:
