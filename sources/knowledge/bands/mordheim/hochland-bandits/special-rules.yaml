  name: Hardened
  effect: Blackhearts are not as put off by the evils of the world when they come across them… in fact persons of this nature
    are often more uncomfortable around situations where warmth and love are in abundance! Blackhearts are immune to Fear,
    and never have to take All-Alone tests (they prefer to work alone anyway…).
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 2 Blackhearts / Special Rules / Hardened
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/hochland-bandits
