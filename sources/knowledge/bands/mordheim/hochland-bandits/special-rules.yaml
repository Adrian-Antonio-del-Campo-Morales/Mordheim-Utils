- id: footpads--concealment
  runtime:
    scope: "NO"
    implemented: "NO"
    grant: profile
    effects:
    - id: unimplemented.hochland-bandits.footpads.concealment
      scope: "NO"
      binding: null
      reason: "Out of scope: movement."
  name: Concealment
  effect: Enemy warriors often find it difficult to detect a Footpad until he strikes. If an enemy warrior wishes to charge
    a Footpad that he cannot see (but was not declared as Hidden), he must subtract 1 from his Initiative before making his
    Initiative test. Note that a roll of ‘6’ always fails when rolling to charge a Footpad that the warrior cannot see. Also,
    models halve their Initiative when checking the range to see if they can detect a Footpad who has been declared as Hiding.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 – 2 Footpads / Special Rules / Concealment
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/hochland-bandits
  name_i18n:
    en: Concealment
    es: null
  effect_i18n:
    en: Enemy warriors often find it difficult to detect a Footpad until he strikes. If an enemy warrior wishes to charge
      a Footpad that he cannot see (but was not declared as Hidden), he must subtract 1 from his Initiative before making
      his Initiative test. Note that a roll of ‘6’ always fails when rolling to charge a Footpad that the warrior cannot see.
      Also, models halve their Initiative when checking the range to see if they can detect a Footpad who has been declared
      as Hiding.
    es: null
  applies_to:
    profile_ids:
    - footpads
- id: duelist--swordmaster
  runtime:
    scope: "YES"
    implemented: "YES"
    grant: profile
    effects:
    - id: skill.swordmaster
      scope: "YES"
      binding:
        kind: mechanic
        id: skill.swordmaster
  name: Swordmaster
  effect: In order to remain alive, a Duelist picks up swordfighting techniques that few others master. The Duelist successfully
    parries an enemy blow on a roll equal to or over the roll to hit, not just over the roll as with normal parries. Obviously
    a Duelist must first be armed with a weapon or armour that allows him to Parry in order to use this rule.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 – 1 Duelist / Special Rules / Swordmaster
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/hochland-bandits
  name_i18n:
    en: Swordmaster
    es: null
  effect_i18n:
    en: In order to remain alive, a Duelist picks up swordfighting techniques that few others master. The Duelist successfully
      parries an enemy blow on a roll equal to or over the roll to hit, not just over the roll as with normal parries. Obviously
      a Duelist must first be armed with a weapon or armour that allows him to Parry in order to use this rule.
    es: null
  applies_to:
    profile_ids:
    - duelist
- id: duelist--weapon-knowledge
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: compiler.weapon-knowledge
      scope: 'YES'
      binding:
        kind: compiler
        id: compiler.weapon-knowledge
  name: Weapon Knowledge
  effect: A Duelist must be prepared to fight an opponent with any weapon at any time, so a working knowledge of even exotic
    weapons is critical for his survival. The weapons in the Bandit equipment chart merely represent the weapons a Duelist may
    start with. A Duelist may use any close combat or missile weapon that the warband members can get hold of.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 – 1 Duelist / Special Rules / Weapon Knowledge
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/hochland-bandits
  name_i18n:
    en: Weapon Knowledge
    es: null
  effect_i18n:
    en: A Duelist must be prepared to fight an opponent with any weapon at any time, so a working knowledge of even exotic
      weapons is critical for his survival. The weapons in the Bandit equipment chart merely represent the weapons a Duelist
      may start with. A Duelist may use any close combat or missile weapon that the warband members can get hold of.
    es: null
  applies_to:
    profile_ids:
    - duelist
- id: huckster--convincing-manner
  runtime:
    scope: "LATER"
    implemented: "NO"
    grant: profile
    effects:
    - id: unimplemented.hochland-bandits.huckster.convincing-manner
      scope: "LATER"
      binding: null
      reason: "Deferred subsystem: psychology."
  name: Convincing Manner
  effect: 'Hucksters specialize in convincing strangers of their benevolent intentions. When an enemy warrior attempts to
    charge a member of the

    huckster''s warband within 12” of the huckster, the

    enemy must first pass a successful Leadership test. If

    the warrior fails the test he may not charge and remains

    stationary for the turn (treat as a failed charge), exactly

    as if he had failed a test to charge a Fear-causing

    enemy. Note that individuals subject to stupidity and

    animals are immune to this effect (they are too stupid

    to understand what the huckster is saying).'
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 – 1 Huckster / Special Rules / Convincing Manner
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/hochland-bandits
  name_i18n:
    en: Convincing Manner
    es: null
  effect_i18n:
    en: 'Hucksters specialize in convincing strangers of their benevolent intentions. When an enemy warrior attempts to charge
      a member of the

      huckster''s warband within 12” of the huckster, the

      enemy must first pass a successful Leadership test. If

      the warrior fails the test he may not charge and remains

      stationary for the turn (treat as a failed charge), exactly

      as if he had failed a test to charge a Fear-causing

      enemy. Note that individuals subject to stupidity and

      animals are immune to this effect (they are too stupid

      to understand what the huckster is saying).'
