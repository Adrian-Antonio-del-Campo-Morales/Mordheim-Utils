- id: band--bandit-special-skills-jump-back
  kind: warband_skill
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.hochland-bandits.band.bandit-special-skills-jump-back
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: no effect applies to the isolated 1v1 duel or legal fighter skill/equipment
        construction.
  name: Jump Back
  effect: This warrior is an expert at getting himself out of sticky situations. If the warrior is in
    close combat with an enemy warrior (and not Knocked Down or Stunned) at the start of his Movement
    Phase, he may attempt to jump out of combat. To attempt to do so, the warrior must make an Initiative
    test. If he fails the test, the warrior will automatically strike last in that round of combat. However,
    if he passes, immediately move him 1" away from the enemy warrior (this does not count against his
    movement for that Movement Phase); he may then move and otherwise act normally for the test of that
    that turn (even charging back into combat if he chooses!).
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Bandit Special Skills / jump back
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/hochland-bandits
  name_i18n:
    en: Jump Back
    es: Salto atrás
  effect_i18n:
    en: 'This warrior is an expert at getting himself out of sticky

      situations. If the warrior is in close combat with an enemy warrior (and not Knocked Down or Stunned)
      at

      the start of his Movement Phase, he may attempt to

      jump out of combat. To attempt to do so, the warrior

      must make an Initiative test. If he fails the test, the

      warrior will automatically strike last in that round of

      combat. However, if he passes, immediately move him

      1" away from the enemy warrior (this does not count

      against his movement for that Movement Phase); he

      may then move and otherwise act normally for the test

      of that that turn (even charging back into combat if he

      chooses!).'
    es: Este guerrero es un experto en salir de situaciones comprometidas. Si el guerrero está en combate
      cuerpo a cuerpo con un guerrero enemigo (y no está Derribado ni Aturdido) al inicio de su fase de
      Movimiento, puede intentar saltar fuera del combate. Para intentarlo, el guerrero debe superar un
      chequeo de Iniciativa. Si falla el chequeo, el guerrero golpeará automáticamente el último en ese
      asalto de combate. Sin embargo, si lo supera, muévelo inmediatamente 1" lejos del guerrero enemigo
      (esto no cuenta contra su movimiento para esa fase de Movimiento); puede entonces moverse y actuar
      con normalidad durante el resto de ese asalto (¡incluso volver a cargar al combate si lo desea!).
  applies_to:
    band: true
