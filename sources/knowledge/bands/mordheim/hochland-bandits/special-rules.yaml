  effect_i18n:
    en: 'This rogue has mastered the art of misdirecting

      enemies who get too close by making them hear noises

      or voices some distance from his location. If an

      enemy warrior is attempting to detect the bandit

      while he is Hidden, roll a D6 - on a result of

      4 or better, the bandit is undetected and

