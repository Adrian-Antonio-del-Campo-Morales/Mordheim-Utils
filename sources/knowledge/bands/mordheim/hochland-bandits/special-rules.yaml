      inhabitants of the region. Roll a D6: On a result of 2-6,

      the con is successful and the warband gains 2D6 gold

      (the huckster keeps the rest). However, on a result of 1

      the huckster''s con has backfired and he is on the run

      (he misses the next game and no gold is received by

      the warband).'
    es: null
  applies_to:
    profile_ids:
    - huckster
- id: looters--looting-the-dead
  runtime:
    scope: "NO"
    implemented: "NO"
    grant: profile
    effects:
    - id: unimplemented.hochland-bandits.looters.looting-the-dead
      scope: "NO"
      binding: null
      reason: "Out of scope: injuries."
  name: Looting the Dead
  effect: 'Normally when a warrior is killed or his wounds cause him to leave the warband and he is taken off the warband''s
    roster, all of his equipment is lost. However, some unscrupulous individuals will stoop to robbing a dead or incapacitated
    warrior, thereby gaining his equipment for themselves. When rolling for warriors who were taken Out of Action at the end
    of a battle, the Bandit player may roll a D6 for any warriors who are to be removed from their warband''s roster. On a
    roll of 4+ the looter has taken all of the warrior’s equipment — it is the Bandit player’s to keep. Failure indicates
    that the Looter either didn''t notice the warrior going down, or he didn''t get the opportunity to rob the body. Obviously
    any warrior can only be

    looted once, but multiple Looters allow the Bandit player multiple chances that his warband members got the equipment
    off of each downed warrior. Note also

    that warriors to be looted can be from any warband participating in the game, including the Bandit warband — Bandits are
    certainly not above looting their own dead!'
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 4 Looters / Special Rules / Looting the Dead
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/hochland-bandits
  name_i18n:
    en: Looting the Dead
    es: null
  effect_i18n:
    en: 'Normally when a warrior is killed or his wounds cause him to leave the warband and he is taken off the warband''s
      roster, all of his equipment is lost. However, some unscrupulous individuals will stoop to robbing a dead or incapacitated
      warrior, thereby gaining his equipment for themselves. When rolling for warriors who were taken Out of Action at the
      end of a battle, the Bandit player may roll a D6 for any warriors who are to be removed from their warband''s roster.
      On a roll of 4+ the looter has taken all of the warrior’s equipment — it is the Bandit player’s to keep. Failure indicates
      that the Looter either didn''t notice the warrior going down, or he didn''t get the opportunity to rob the body. Obviously
      any warrior can only be

      looted once, but multiple Looters allow the Bandit player multiple chances that his warband members got the equipment
      off of each downed warrior. Note also

      that warriors to be looted can be from any warband participating in the game, including the Bandit warband — Bandits
      are certainly not above looting their own dead!'
    es: null
  applies_to:
    profile_ids:
    - looters
