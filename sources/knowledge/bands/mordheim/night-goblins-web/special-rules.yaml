      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, or non-duel context.'
- id: band--night-goblin-special-skills-ride-squig
  kind: warband_skill
  name: Ride Squig
  effect: This Goblin can ride one of the warband's Cave Squigs, or even a Great Squig! The pair deploy
    as a single model. Standard mount rules are not used, although the rider counts as being mounted for
    the Cavelry Bonus rule (see spears and lances). While the Squig is being ridden, it and the rider
    move as a single model using the Squig's movement rules, but attack separately in Close Combat. In
    this skill's text, the use of “Squig” refers to both Cave Squigs and Great Squigs. Any shooting or
    close combat attacks will hit the rider on a D6 roll of 1-2, and the Squig on a 3-6. If the Squig
    is stunned or taken out of action, the rider takes a Strength 2 hit with no Armour save as they crash
    to the ground. If the Rider is stunned or taken out of action, the Squig reverts to normal Squig behavior.
    In either case the rider is now dismounted for the rest of the battle. Squigs don't like being ridden.
    If the movement roll results in a double or triple, the rider must roll a D6 before the Squig moves.
    If the result is over the rider's Strength, they are thrown off before the Squig moves away, and take
    a Strength 2 hit with no Armour save as they crash to the ground. The rider is now dismounted for
    the rest of the battle. If the roll is equal to or below their Strength, the rider keeps their grip
    and remains atop the Squig.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Night Goblin Special Skills / Ride Squig
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/night-goblins-web
  name_i18n:
    en: Ride Squig
    es: Montar squig
  effect_i18n:
    en: 'This Goblin can ride one of the warband''s Cave

      Squigs, or even a Great Squig! The pair deploy as a

      single model. Standard mount rules are not used,

      although the rider counts as being mounted for the

      Cavelry Bonus rule (see spears and lances). While the

      Squig is being ridden, it and the rider move as a single

      model using the Squig''s movement rules, but attack

      separately in Close Combat. In this skill''s text, the use

      of “Squig” refers to both Cave Squigs and Great

      Squigs.

      Any shooting or close combat attacks will hit the rider

      on a D6 roll of 1-2, and the Squig on a 3-6.

      If the Squig is stunned or taken out of action, the

      rider takes a Strength 2 hit with no Armour save as

      they crash to the ground. If the Rider is stunned or

      taken out of action, the Squig reverts to normal Squig

      behavior. In either case the rider is now dismounted

      for the rest of the battle.

      Squigs don''t like being ridden. If the movement roll

      results in a double or triple, the rider must roll a D6

      before the Squig moves. If the result is over the rider''s

      Strength, they are thrown off before the Squig moves

      away, and take a Strength 2 hit with no Armour save as

      they crash to the ground. The rider is now

      dismounted for the rest of the battle. If the roll is

      equal to or below their Strength, the rider keeps their

      grip and remains atop the Squig.'
    es: Este goblin puede montar uno de los Squigs de Cueva de la banda, ¡o incluso un Gran Squig! La
      pareja se despliega como un único modelo. No se usan las reglas estándar de monturas, aunque el
      jinete cuenta como montado para la regla de Bonus de Caballería (ver lanzas y picas). Mientras se
      monta el Squig, este y el jinete se mueven como un único modelo usando las reglas de movimiento
      del Squig, pero atacan por separado en el Combate Cuerpo a Cuerpo. En el texto de esta habilidad,
      el uso de 'Squig' se refiere tanto a los Squigs de Cueva como a los Grandes Squigs. Cualquier ataque
      de disparo o cuerpo a cuerpo impacta al jinete con un resultado de 1-2 en 1D6, y al Squig con un
      3-6. Si el Squig queda aturdido o Fuera de combate, el jinete sufre un impacto de Fuerza 2 sin salvación
      por armadura al estrellarse contra el suelo. Si el jinete queda aturdido o Fuera de combate, el
      Squig vuelve al comportamiento normal de un squig. En cualquier caso, el jinete queda desmontado
      durante el resto de la batalla. A los Squigs no les gusta que los monten. Si la tirada de movimiento
      da un doble o un triple, el jinete debe tirar 1D6 antes de que el Squig se mueva. Si el resultado
      supera la Fuerza del jinete, este es expulsado antes de que el Squig se aleje, y sufre un impacto
      de Fuerza 2 sin salvación por armadura al estrellarse contra el suelo. El jinete queda desmontado
      durante el resto de la batalla. Si la tirada es igual o inferior a su Fuerza, el jinete mantiene
      su agarre y permanece sobre el Squig.
  applies_to:
    band: true
  runtime:
    scope: LATER
