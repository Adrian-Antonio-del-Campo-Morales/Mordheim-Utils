      the wound is ignored and the Troll is unhurt. Trolls may not

      regenerate wounds caused by fire or fire-based magic. Trolls

      never roll for Injury after a battle.'
    es: 'Los trolls tienen una fisiología única que les permite regenerar heridas. Siempre que un enemigo
      inflija con éxito una herida a un troll, tira 1D6: con un resultado de 4 o más la herida se ignora
      y el troll queda ileso. Los trolls no pueden regenerar heridas causadas por fuego o magia de fuego.
      Los trolls nunca tiran por heridas tras una batalla.'
