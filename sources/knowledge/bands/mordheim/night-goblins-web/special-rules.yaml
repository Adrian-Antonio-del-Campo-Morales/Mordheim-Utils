- id: band--night-goblin-special-skills-fungus-farmer
  kind: warband_skill
  name: Fungus Farmer
  effect: The industrious little git has a mushroom crop back at the cave. If the Hero doesn't search
    for rare items, it may pick D3-1 Mad Cap Mushrooms instead. There is a chance of getting none, as
    there is no guarantee they will be ready for harvest. Each Mad Cap Mushroom must be used in the next
    battle, and they cannot be sold or traded to other warbands These are a special high yield/low shelf
    life crop.
