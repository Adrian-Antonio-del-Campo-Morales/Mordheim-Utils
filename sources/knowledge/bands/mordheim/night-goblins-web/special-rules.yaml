  name: Animosity
  effect: >-
    At the start of the Night Goblin player's turn, roll a D6 for each Night Goblin Warrior Henchman
    not engaged in hand-to-hand combat. On a 1, roll another D6: 1 = attack the nearest eligible
    friendly Orc/Goblin Henchman or Hired Sword if possible; charge and fight one round, or shoot
    the nearest eligible friendly model if no charge is possible and the warrior has a missile
    weapon. If no valid target exists, or the nearest friendly model is an Orc Hero, treat as 2-5.
    2-5 = the warrior may do nothing else that turn, but may defend itself if attacked. 6 =
    immediately move as quickly as possible toward the nearest visible enemy, charging if possible;
    if none is visible, make a normal move. This is an extra move. If it brings an enemy into charge
    range, the warrior must charge during its normal Movement phase.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / Animosity
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/night-goblins-web
  name_i18n:
    en: Animosity
    es: Rencor (Animosity)
  effect_i18n:
    en: 'At the start of the Night Goblin player''s turn, roll a D6 for each Night Goblin Warrior Henchman
      not engaged in hand-to-hand combat. On a 1, roll another D6: 1 = attack the nearest eligible friendly
      Orc/Goblin Henchman or Hired Sword if possible; charge and fight one round, or shoot the nearest
      eligible friendly model if no charge is possible and the warrior has a missile weapon. If no valid
      target exists, or the nearest friendly model is an Orc Hero, treat as 2-5. 2-5 = the warrior may
      do nothing else that turn, but may defend itself if attacked. 6 = immediately move as quickly as
      possible toward the nearest visible enemy, charging if possible; if none is visible, make a normal
      move. This is an extra move. If it brings an enemy into charge range, the warrior must charge during
      its normal Movement phase.'
    es: 'Al inicio del turno del jugador de Goblins Nocturnos, tira 1D6 por cada secuaz Guerrero Goblin
      Nocturno que no esté en combate cuerpo a cuerpo. Con un 1, tira otro 1D6: 1 = ataca al secuaz orco/goblin
      amigo u Espada a Sueldo elegible más cercano si es posible; carga y lucha un asalto, o dispara al
      modelo amigo elegible más cercano si no es posible cargar y el guerrero tiene un arma de misil.
      Si no existe objetivo válido, o el modelo amigo más cercano es un Héroe Orco, trátalo como 2-5.
      2-5 = el guerrero no puede hacer nada más ese asalto, pero puede defenderse si lo atacan. 6 = muévete
      inmediatamente lo más rápido posible hacia el enemigo visible más cercano, cargando si es posible;
      si no hay ninguno visible, realiza un movimiento normal. Este es un movimiento extra. Si acerca
      a un enemigo a alcance de carga, el guerrero debe cargar durante su fase normal de Movimiento.'
  applies_to:
    band: true
