- id: band--night-goblin-special-skills-netter
  kind: warband_skill
  name: Netter
  effect: The Goblin applies techniques learned hunting wild Cave Squigs in the depths of the mountains
    to disable charging enemies. Instead of their normal use, the Goblin may throw a Net they are equipped
    with at an enemy who is charging them. This will reduce the charge range of the attacker by D6 inches
    as the charger either slows down to avoid the net, or gets tangled up in it. If this means that the
    attacker cannot reach the Goblin then it is a failed charge. Regardless of the outcome the Net is
    lost when this skill is used.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Night Goblin Special Skills / Netter
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/night-goblins-web
  name_i18n:
    en: Netter
    es: Redeador (Netter)
  effect_i18n:
    en: 'The Goblin applies techniques learned hunting wild

      Cave Squigs in the depths of the mountains to disable

      charging enemies. Instead of their normal use, the

      Goblin may throw a Net they are equipped with at an

      enemy who is charging them. This will reduce the

      charge range of the attacker by D6 inches as the

      charger either slows down to avoid the net, or gets

      tangled up in it. If this means that the attacker cannot

      reach the Goblin then it is a failed charge. Regardless

      of the outcome the Net is lost when this skill is used.'
    es: El goblin aplica las técnicas aprendidas cazando Squigs de Cueva salvajes en las profundidades
      de las montañas para inutilizar a los enemigos que cargan. En lugar de su uso normal, el goblin
      puede lanzar la Red que lleva equipada a un enemigo que lo esté cargando. Esto reduce el alcance
      de carga del atacante en D6", ya que el cargador o bien frena para evitar la red o bien se enreda
      en ella. Si esto significa que el atacante no puede alcanzar al goblin, es una carga fallida. Independientemente
      del resultado, la Red se pierde al usar esta habilidad.
