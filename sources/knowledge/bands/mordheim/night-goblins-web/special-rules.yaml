  effect_i18n:
    en: 'A Night Goblin with this skill is always placed on the

      battlefield after the opposing warband and can be

      placed anywhere on the table as long as it is out of

      sight of the opposing warband, and more than 12"

      away from any enemy model. If both players have

      models which infiltrate, roll a D6 for each, and the

      lowest roll sets up first.'
    es: Un Goblin Nocturno con esta habilidad siempre se sitúa en el campo de batalla después de la banda
      rival y puede colocarse en cualquier punto de la mesa mientras esté fuera de la línea de visión
      de la banda rival y a más de 12" de cualquier modelo enemigo. Si ambos jugadores tienen modelos
