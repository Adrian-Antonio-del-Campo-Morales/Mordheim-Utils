schema_version: 2
band_id: night-goblins-web
rules:
- id: boss--leader
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.night-goblins-web.boss.leader
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology.'
  name: Leader
  effect: Any warrior within 6" of the Boss may use their Leadership value when taking Leadership tests.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Heroes / 1 Boss / Special Rules / Leader
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/night-goblins-web
  name_i18n:
    en: Leader
    es: Líder
  effect_i18n:
    en: 'Any warrior within 6" of the Boss may use their

      Leadership value when taking Leadership tests.'
    es: Cualquier guerrero a 6" del Jefe puede usar su valor de Liderazgo cuando realice chequeos de Liderazgo.
  applies_to:
    profile_ids:
    - boss
- id: boss--da-biggest-boss
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: profile.skill-access
      scope: 'YES'
      binding:
        kind: profile
        id: profile.skill-access
        parameters:
          category: strength
    - id: campaign.leader-inheritance
      scope: 'NO'
      binding: null
      reason: 'Out of scope: leader succession after death.'
  name: Da Biggest Boss
  effect: The Boss is so big, compared to other Night Goblins that is, that they may choose Strength skills.
    If the Boss dies, the promoted leader will gain this rule. No other member of the warband except the
    current leader may ever use Strength skills.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Heroes / 1 Boss / Special Rules / Da Biggest Boss
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/night-goblins-web
  name_i18n:
    en: Da Biggest Boss
    es: El Jefe más grande (Da Biggest Boss)
  effect_i18n:
    en: 'The Boss is so big, compared to other

      Night Goblins that is, that they may choose Strength skills.

      If the Boss dies, the promoted leader will gain this rule. No

      other member of the warband except the current leader

      may ever use Strength skills.'
    es: El Jefe es tan grande, comparado con otros Goblins Nocturnos, claro, que puede elegir habilidades
      de Fuerza. Si el Jefe muere, el líder ascendido ganará esta regla. Ningún otro miembro de la banda,
      salvo el líder actual, podrá usar jamás habilidades de Fuerza.
  applies_to:
    profile_ids:
    - boss
- id: squig-herder--handle-animal-squig
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.night-goblins-web.squig-herder.handle-animal-squig
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology.'
  name: Handle Animal - Squig
  effect: Any Cave Squig within 6" (12" with a Squig Prodder) of the herder can use their Leadership value
    when taking Leadership tests.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Heroes / 0 – 1 Squig Herder / Special Rules / Handle Animal - Squig
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/night-goblins-web
  name_i18n:
    en: Handle Animal - Squig
    es: Manejo de animales - Squig
  effect_i18n:
    en: Any Cave Squig within 6" (12" with a Squig Prodder) of the herder can use their Leadership value
      when taking Leadership tests.
    es: Cualquier Squig de Cueva a 6" (12" con un Pinchador de Squigs) del pastor puede usar su valor
      de Liderazgo cuando realice chequeos de Liderazgo.
  applies_to:
    profile_ids:
    - squig-herder
- id: squig-herder--master-herder
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.night-goblins-web.squig-herder.master-herder
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology.'
  name: Master Herder
  effect: During the recovery phase, any out of control Cave Squigs or Great Squigs in the herder's control
    range (6", or 12" with a Squig Prodder) will stop running amok, and may be controlled normally, if
    the Herder can pass a Leadership test.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Heroes / 0 – 1 Squig Herder / Special Rules / Master Herder
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/night-goblins-web
  name_i18n:
    en: Master Herder
    es: Gran pastor
  effect_i18n:
    en: 'During the recovery phase, any out of control Cave Squigs or Great Squigs in the herder''s control

      range (6", or 12" with a Squig Prodder) will stop running

      amok, and may be controlled normally, if the Herder can

      pass a Leadership test.'
    es: Durante la fase de recuperación, cualquier Squig de Cueva o Gran Squig fuera de control dentro
      del alcance de control del pastor (6", o 12" con un Pinchador de Squigs) dejará de desbocarse y
      podrá controlarse con normalidad, si el Pastor supera un chequeo de Liderazgo.
  applies_to:
    profile_ids:
    - squig-herder
- id: squig-herder--squig-herder-skill-gassy-squigs
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.night-goblins-web.squig-herder.squig-herder-skill-gassy-squigs
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: no effect applies to the isolated 1v1 duel or legal fighter skill/equipment
        construction.
  name: Gassy Squigs
  effect: When an untrained Cave Squig goes Out of Action, roll immediately instead of making its normal
    post-battle recovery roll. On 1-2 it explodes, is dead, and every model within D6 inches suffers a
    Strength 3 hit.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Heroes / Squig Herder / Squig Herder Skills / Gassy Squigs
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/night-goblins-web
  name_i18n:
    en: Gassy Squigs
    es: Squigs flatulentos
  effect_i18n:
    en: When an untrained Cave Squig goes Out of Action, roll immediately instead of making its normal
      post-battle recovery roll. On 1-2 it explodes, is dead, and every model within D6 inches suffers
      a Strength 3 hit.
    es: Cuando un Squig de Cueva sin adiestrar cae Fuera de combate, tira inmediatamente en lugar de hacer
      su tirada normal de recuperación posbatalla. Con 1-2 explota, muere, y cada modelo a D6" sufre un
      impacto de Fuerza 3.
  applies_to:
    profile_ids:
    - squig-herder
- id: squig-herder--squig-herder-skill-threaten
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.night-goblins-web.squig-herder.squig-herder-skill-threaten
      scope: 'NO'
      binding: null
      reason: 'Out of scope: movement.'
  name: Threaten
  effect: During the Movement phase, all Cave Squigs and Great Squigs within 6" of the Squig Herder (12"
    if the Herder has a Squig Prodder) may re-roll their movement dice.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Heroes / Squig Herder / Squig Herder Skills / Threaten
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/night-goblins-web
  name_i18n:
    en: Threaten
    es: Intimidar
  effect_i18n:
    en: During the Movement phase, all Cave Squigs and Great Squigs within 6" of the Squig Herder (12"
      if the Herder has a Squig Prodder) may re-roll their movement dice.
    es: Durante la fase de Movimiento, todos los Squigs de Cueva y Grandes Squigs a 6" del Pastor de Squigs
      (12" si el Pastor tiene un Pinchador de Squigs) pueden repetir sus dados de movimiento.
  applies_to:
    profile_ids:
    - squig-herder
- id: squig-herder--squig-herder-skill-trainin
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.night-goblins-web.squig-herder.squig-herder-skill-trainin
      scope: 'NO'
      binding: null
      reason: 'Out of scope: injuries.'
  name: Trainin'
  effect: The next Cave Squig bought may become the warband's single Trained Squig. It gains Experience
    normally and rolls on the Henchman Advance table, re-rolling Lad's Got Talent. It still counts against
    the Cave Squig maximum. If the Herder dies, the Trained Squig is removed; if the Squig dies, another
    may later be trained. A Trained Squig dies after going Out of Action only on a roll of 1. If the Herder
    goes Out of Action while the Trained Squig has not gone wild, remove the Squig from the table and
    treat Sold to the Pits, Captured and Robbed results for the Herder as Full Recovery.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Heroes / Squig Herder / Squig Herder Skills / Trainin'
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/night-goblins-web
  name_i18n:
    en: Trainin'
    es: Adiestramiento (Trainin')
  effect_i18n:
    en: The next Cave Squig bought may become the warband's single Trained Squig. It gains Experience
      normally and rolls on the Henchman Advance table, re-rolling Lad's Got Talent. It still counts against
      the Cave Squig maximum. If the Herder dies, the Trained Squig is removed; if the Squig dies, another
      may later be trained. A Trained Squig dies after going Out of Action only on a roll of 1. If the
      Herder goes Out of Action while the Trained Squig has not gone wild, remove the Squig from the table
      and treat Sold to the Pits, Captured and Robbed results for the Herder as Full Recovery.
    es: El siguiente Squig de Cueva comprado puede convertirse en el único Squig Adiestrado de la banda.
      Gana Experiencia con normalidad y tira en la tabla de mejoras de secuaces, repitiendo 'El mozo tiene
      talento'. Sigue contando para el máximo de Squigs de Cueva. Si el Pastor muere, el Squig Adiestrado
      se retira; si el Squig muere, otro podrá adiestrarse más adelante. Un Squig Adiestrado muere tras
      caer Fuera de combate solo con un resultado de 1. Si el Pastor cae Fuera de combate mientras el
      Squig Adiestrado no se ha vuelto salvaje, retira el Squig de la mesa y trata los resultados Vendido
      al foso, Capturado y Robado del Pastor como Recuperación total.
  applies_to:
    profile_ids:
    - squig-herder
- id: shaman--wizard
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.night-goblins-web.shaman.wizard
      scope: 'NO'
      binding: null
      reason: 'Out of scope: magic.'
  name: Wizard
  effect: The Shaman is a Wizard and begins with one randomly chosen Goblin Magic spell.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Heroes / 0 – 1 Shaman / Special Rules / Wizard
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/night-goblins-web
  name_i18n:
    en: Wizard
    es: Hechicero
  effect_i18n:
    en: The Shaman is a Wizard and begins with one randomly chosen Goblin Magic spell.
    es: El Chamán es un hechicero y comienza con un hechizo de Magia Goblin elegido aleatoriamente.
  applies_to:
    profile_ids:
    - shaman
- id: shaman--fungus-brew
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.night-goblins-web.shaman.fungus-brew
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology.'
  name: Fungus Brew
  effect: >-
    Before a battle, the Shaman may brew Fungus Brew using 1 to 3 Mad Cap Mushrooms. The brew
    affects one Night Goblin Warrior henchman group until the end of the battle. Roll once per
    mushroom; if any dice duplicate a result, the batch is ruined and has no effect. Results: 1
    Rowdy = affected by Animosity on 1 or 2; 2 Dizzy = -1 Initiative; 3 Fearless = immune to Fear
    and All Alone tests; 4 Numbed = +1 armour save, which may not be reduced below 6+; 5 Belligerent
    = Hatred against the opposing warband(s); 6 Loony = Frenzy, followed by Stupidity if Frenzy is
    lost because the Goblin is Knocked Down or Stunned.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Heroes / 0 – 1 Shaman / Special Rules / Fungus Brew
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/night-goblins-web
  name_i18n:
    en: Fungus Brew
    es: Poción de hongos
  effect_i18n:
    en: 'Before a battle, the Shaman may brew Fungus Brew using 1 to 3 Mad Cap Mushrooms. The brew affects
      one Night Goblin Warrior henchman group until the end of the battle. Roll once per mushroom; if
      any dice duplicate a result, the batch is ruined and has no effect. Results: 1 Rowdy = affected
      by Animosity on 1 or 2; 2 Dizzy = -1 Initiative; 3 Fearless = immune to Fear and All Alone tests;
      4 Numbed = +1 armour save, which may not be reduced below 6+; 5 Belligerent = Hatred against the
      opposing warband(s); 6 Loony = Frenzy, followed by Stupidity if Frenzy is lost because the Goblin
      is Knocked Down or Stunned.'
    es: 'Antes de una batalla, el Chamán puede preparar una poción de hongos usando de 1 a 3 Setas Locas.
      La poción afecta a un grupo de secuaces de Guerreros Goblin Nocturno hasta el final de la batalla.
      Tira un dado por seta; si algún resultado se repite, la tanda se arruina y no tiene efecto. Resultados:
      1 Camorrista = afectado por Rencor con 1 o 2; 2 Mareado = -1 Iniciativa; 3 Intrepido = inmune a
      los chequeos de Miedo y de Estar Solo; 4 Anestesiado = +1 salvación por armadura, que no puede reducirse
      por debajo de 6+; 5 Belicoso = Odio contra la(s) banda(s) rival(es); 6 Chiflado = Frenesí, seguido
      de Estupidez si pierde el Frenesí porque el goblin es Derribado o Aturdido.'
  applies_to:
    profile_ids:
    - shaman
- id: night-goblin-warriors--animosity
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.night-goblins-web.night-goblin-warriors.animosity
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology.'
  name: Animosity
  effect: Night Goblins are subject to the rules for Animosity.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Henchmen / Night Goblin Warriors / Special Rules / Animosity
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/night-goblins-web
  name_i18n:
    en: Animosity
    es: Rencor (Animosity)
  effect_i18n:
    en: Night Goblins are subject to the rules for Animosity.
    es: Los Goblins Nocturnos están sujetos a las reglas de Rencor.
  applies_to:
    profile_ids:
    - night-goblin-warriors
- id: night-goblin-fanatics--addict
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.night-goblins-web.night-goblin-fanatics.addict
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign.'
  name: Addict
  effect: Fanatics are dependent on a regular supply of Mad Cap Mushrooms which must be bought each game.
    If a fanatic can't get any before a battle they will stay in their cave foaming at the mouth and not
    take part. If available they will eat their mushrooms before the battle.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Henchmen / 0 – 3 Night Goblin Fanatics / Special Rules / Addict
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/night-goblins-web
  name_i18n:
    en: Addict
    es: Adicto
  effect_i18n:
    en: 'Fanatics are dependent on a regular supply of Mad Cap Mushrooms which must be bought each game.
      If a fanatic can''t get any before a battle they will stay in their cave foaming at the mouth and
      not take part. If available they will eat their mushrooms

      before the battle.'
    es: Los Fanáticos dependen de un suministro regular de Setas Locas que deben comprarse en cada partida.
      Si un fanático no consigue ninguna antes de una batalla, se quedará en su cueva echando espuma por
      la boca y no participará. Si hay disponibles, comerá sus setas antes de la batalla.
  applies_to:
    profile_ids:
    - night-goblin-fanatics
- id: night-goblin-fanatics--loony
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.night-goblins-web.night-goblin-fanatics.loony
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology.'
  name: Loony
  effect: Fanatics are so far gone from reality that they are not subject to the rules for Animosity.
    Fanatics must re-roll results of “Lad's Got Talent.”
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Henchmen / 0 – 3 Night Goblin Fanatics / Special Rules / Loony
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/night-goblins-web
  name_i18n:
    en: Loony
    es: Chiflado
  effect_i18n:
    en: Fanatics are so far gone from reality that they are not subject to the rules for Animosity. Fanatics
      must re-roll results of “Lad's Got Talent.”
    es: Los Fanáticos están tan lejos de la realidad que no están sujetos a las reglas de Rencor. Los
      Fanáticos deben repetir los resultados de 'El mozo tiene talento'.
  applies_to:
    profile_ids:
    - night-goblin-fanatics
- id: cave-squigs--movement
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.night-goblins-web.cave-squigs.movement
      scope: 'NO'
      binding: null
      reason: 'Out of scope: movement.'
  name: Movement
  effect: Cave Squigs do not have a set Movement characteristic but move with an ungainly bouncing stride.
    When moving Squigs, declare a direction of movement and roll 2D6 for the distance they move. Squigs
    never run and never declare charges. Instead, they are allowed to contact enemy models with their
    normal 2D6" movement, stopping short if they do. If this happens, they count as charging for the following
    round of hand-to-hand combat, just as if they had declared a charge.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Henchmen / 0 – 5 Cave Squigs / Special Rules / Movement
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/night-goblins-web
  name_i18n:
    en: Movement
    es: Movimiento
  effect_i18n:
    en: 'Cave Squigs do not have a set Movement characteristic but move with an ungainly

      bouncing stride. When moving Squigs, declare a

      direction of movement and roll 2D6 for the distance

      they move. Squigs never run and never declare

      charges. Instead, they are allowed to contact enemy

      models with their normal 2D6" movement, stopping

      short if they do. If this happens, they count as

      charging for the following round of hand-to-hand

      combat, just as if they had declared a charge.'
    es: Los Squigs de Cueva no tienen una característica de Movimiento fija, sino que se mueven con un
      zancudo brinco desgarbado. Al mover Squigs, declara una dirección de movimiento y tira 2D6 para
      la distancia que se desplazan. Los Squigs nunca corren ni declaran cargas. En cambio, se les permite
      contactar con modelos enemigos con su movimiento normal de 2D6", deteniéndose antes si lo hacen.
      Si esto sucede, cuentan como cargando en el siguiente asalto de combate cuerpo a cuerpo, igual que
      si hubieran declarado una carga.
  applies_to:
    profile_ids:
    - cave-squigs
- id: cave-squigs--minderz
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.night-goblins-web.cave-squigs.minderz
      scope: 'NO'
      binding: null
      reason: 'Out of scope: movement.'
  name: Minderz
  effect: Each Cave Squig must always remain within 6" of a Goblin, who keeps the creature in line. If
    a Cave Squig finds itself without a Goblin within 6" at the start of its Movement phase, it will go
    wild. From that point on, move the Squig 2D6" in a random direction during each of its Movement phases.
    If its movement takes it into contact with another model (friend or foe), it will engage the model
    in hand-tohand combat as normal. The Cave Squig is out of the Night Goblin player's control until
    the end of the game.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Henchmen / 0 – 5 Cave Squigs / Special Rules / Minderz
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/night-goblins-web
  name_i18n:
    en: Minderz
    es: Cuidadores (Minderz)
  effect_i18n:
    en: 'Each Cave Squig must always remain

      within 6" of a Goblin, who keeps the creature in line.

      If a Cave Squig finds itself without a Goblin within 6"

      at the start of its Movement phase, it will go wild.

      From that point on, move the Squig 2D6" in a random

      direction during each of its Movement phases. If its

      movement takes it into contact with another model

      (friend or foe), it will engage the model in hand-tohand combat as normal. The Cave Squig is out
      of the

      Night Goblin player''s control until the end of the

      game.'
    es: Cada Squig de Cueva debe permanecer siempre a 6" de un goblin, quien mantiene a la criatura a
      raya. Si un Squig de Cueva se encuentra sin ningún goblin a 6" al inicio de su fase de Movimiento,
      se volverá salvaje. A partir de ese momento, mueve el Squig 2D6" en una dirección aleatoria durante
      cada una de sus fases de Movimiento. Si su movimiento lo pone en contacto con otro modelo (amigo
      o enemigo), entablará combate cuerpo a cuerpo con él con normalidad. El Squig de Cueva queda fuera
      del control del jugador de Goblins Nocturnos hasta el final de la partida.
  applies_to:
    profile_ids:
    - cave-squigs
- id: cave-squigs--just-squigs
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.night-goblins-web.cave-squigs.just-squigs
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology.'
  name: Just Squigs
  effect: Night Goblins don't care much whether Squigs die because there will always be more mysteriously
    popping up where ever the Goblins go. Squigs only count as a half a model for Rout test purposes.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Henchmen / 0 – 5 Cave Squigs / Special Rules / Just Squigs
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/night-goblins-web
  name_i18n:
    en: Just Squigs
    es: Solo squigs
  effect_i18n:
    en: 'Night Goblins don''t care much whether

      Squigs die because there will always be more

      mysteriously popping up where ever the Goblins go.

      Squigs only count as a half a model for Rout test

      purposes.'
    es: A los Goblins Nocturnos les da bastante igual que mueran Squigs, porque siempre aparecerán más
      misteriosamente allá donde vayan los goblins. Los Squigs solo cuentan como medio modelo a efectos
      de chequeos de huida.
  applies_to:
    profile_ids:
    - cave-squigs
- id: cave-squigs--animals
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.night-goblins-web.cave-squigs.animals
      scope: 'NO'
      binding: null
      reason: 'Out of scope: movement.'
  name: Animals
  effect: Cave Squigs are animals of a sort and so do not gain experience, or climb ladders. They can
    move to higher levels or over obstacles using the normal climb rules, just imagine it as a particularly
    high bounce.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Henchmen / 0 – 5 Cave Squigs / Special Rules / Animals
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/night-goblins-web
  name_i18n:
    en: Animals
    es: Animales
  effect_i18n:
    en: 'Cave Squigs are animals of a sort and so

      do not gain experience, or climb ladders. They can

      move to higher levels or over obstacles using the

      normal climb rules, just imagine it as a particularly

      high bounce.'
    es: Los Squigs de Cueva son, en cierto modo, animales y por tanto no ganan experiencia, ni trepan
      por escaleras. Pueden subir a niveles superiores o superar obstáculos usando las reglas normales
      de trepar; imagínatelo como un bote especialmente alto.
  applies_to:
    profile_ids:
    - cave-squigs
- id: snotlings--mob
  runtime:
