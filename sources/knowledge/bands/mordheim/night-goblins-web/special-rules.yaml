  name: Regeneration
  effect: Trolls have a unique physiology that allow them to regenerate wounds. Whenever an enemy successfully
    inflicts a wound on a Troll roll a D6, on a result of 4 or more the wound is ignored and the Troll
    is unhurt. Trolls may not regenerate wounds caused by fire or fire-based magic. Trolls never roll
    for Injury after a battle.
