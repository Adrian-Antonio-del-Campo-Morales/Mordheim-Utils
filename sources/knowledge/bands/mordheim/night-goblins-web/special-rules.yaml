    to the ferocity of these beasts, if the scatter die results in a “hit” for a wild Great Squig it moves
    towards the closest model (friend or foe) it can see. If this movement takes it into contact with
    another model it will engage it in close combat and count as charging, even with a member of the Night
    Goblin warband.
