- id: band--night-goblin-special-skills-sneaky-git
  kind: warband_skill
  name: Sneaky Git
  effect: The Goblin specializes in attacking their targets from the shadows. They may charge an opponent
    from hiding, even if they cannot see the target. There is no need for an initiative test, and the
    target may be over the normal 4” limit for charging unseen targets. If the charge is successful, the
    Goblin surprises their opponent who will attack at half Weapon Skill and half Initiative, rounded
    up. This penalty lasts for the first round of combat only, as the opponent will swiftly recover their
    wits if the initial assault is survived.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Night Goblin Special Skills / Sneaky Git
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/night-goblins-web
  name_i18n:
    en: Sneaky Git
    es: Pillo furtivo (Sneaky Git)
  effect_i18n:
    en: 'The Goblin specializes in attacking their targets from

      the shadows. They may charge an opponent from

      hiding, even if they cannot see the target. There is no

      need for an initiative test, and the target may be over

      the normal 4” limit for charging unseen targets. If the

      charge is successful, the Goblin surprises their

      opponent who will attack at half Weapon Skill and

      half Initiative, rounded up. This penalty lasts for the

      first round of combat only, as the opponent will

      swiftly recover their wits if the initial assault is

      survived.'
    es: El goblin se especializa en atacar a sus objetivos desde las sombras. Puede cargar contra un oponente
      desde su escondite, incluso si no puede ver al objetivo. No hace falta un chequeo de iniciativa,
      y el objetivo puede estar más allá del límite normal de 4" para cargar contra objetivos no vistos.
      Si la carga tiene éxito, el goblin sorprende a su oponente, que atacará con la mitad de su Habilidad
      de Armas y la mitad de su Iniciativa, redondeando hacia arriba. Esta penalización dura solo el primer
      asalto de combate, ya que el oponente recuperará rápidamente la compostura si sobrevive al asalto
      inicial.
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.night-goblins-web.band.night-goblin-special-skills-sneaky-git
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: no effect applies to the isolated 1v1 duel or legal fighter skill/equipment
        construction.
