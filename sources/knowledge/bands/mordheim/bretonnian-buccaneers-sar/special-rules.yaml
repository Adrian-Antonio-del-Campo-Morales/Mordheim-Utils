- id: pirates--no-armour
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: profile.equipment-restrictions
      scope: 'YES'
      binding:
        kind: profile
        id: profile.equipment-restrictions
        parameters:
          forbids: armour-suit
  name: No Armour
  effect: >-
    Pirate Captains, Ship's Mates, Cabin Boys, Crew, Gunners and Boatswains may not wear armour.
  source:
    manual: broheim.net
    printed_page: 3
    section: Pirate Equipment List / profile entries
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Human%20Pirates.pdf
  name_i18n:
    es: Sin Armadura
  effect_i18n:
    es: >-
      Los capitanes piratas, compañeros de barco, grumetes, tripulación, artilleros y contramaestres
      no pueden llevar armadura.
  applies_to:
    profile_ids:
    - captain
    - mates
    - cabin-boys
    - crew
    - gunners
    - boatswains
