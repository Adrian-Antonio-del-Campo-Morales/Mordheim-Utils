- id: vampire-hunters-hero-equipment-list
  name: Vampire Hunters Hero Equipment List
  items:
  - item_id: dagger
    cost: 2
    notes: 1st free/2 gc
    notes_i18n:
      es: Primera daga gratis; las siguientes cuestan 2 co.
  - item_id: hammer
