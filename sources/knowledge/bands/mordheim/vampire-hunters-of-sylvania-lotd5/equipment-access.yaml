    cost: 5
  - item_id: sword
    cost: 10
  - item_id: scythe
    cost: 10
  - item_id: silver_tip_stake
    cost: 10
    notes: >-
      SOURCE CONFLICT (RESOLVED): the Hero Equipment List prints 10 gc but the Special Equipment
      section prints 'Cost: 15 gc' for the same item. VERDICT (the 2A discrepancy verdicts of the
      staging tree case 1): internal erratum of the original LotD #5 PDF (both prices verified
      verbatim on p.10 of LOD5.pdf). Editorial decision (2026-09-15): 10 gc is the operative cost
      (hiring lists); the 15 gc figure is marked as an erratum of the Special Equipment summary
      block.
    notes_i18n:
      es: 'CONFLICTO EN LA FUENTE (RESUELTO): la Lista de equipo de héroes imprime 10 gc, pero la sección de Equipo Especial imprime ''Coste: 15 gc'' para el mismo objeto. VEREDICTO (los veredictos de discrepancia
        2A del caso 1 del árbol de preparación): erratum interno del PDF original de LotD n.º 5 (ambos precios verificados literalmente en la p. 10 de LOD5.pdf). Decisión editorial (2026-09-15): 10 gc es
        el coste operativo (listas de contratación); la cifra de 15 gc queda marcada como erratum del bloque resumen de Equipo Especial.'
