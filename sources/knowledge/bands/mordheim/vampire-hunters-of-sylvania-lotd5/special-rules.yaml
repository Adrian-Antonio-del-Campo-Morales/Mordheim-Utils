rules:
- id: band--hired-swords
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.vampire-hunters-of-sylvania-lotd5.band.hired-swords
      scope: 'NO'
      binding: null
      reason: out-of-scope.campaign
  name: Hired Swords
  effect: >-
    Vampire Hunters accept nearly all aid that is available. As such, they may recruit Hired Swords
    as if they were Human Mercenaries.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / Hired Swords
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/vampire-hunters-of-sylvania
  name_i18n:
    es: Espadas a Sueldo
  effect_i18n:
    es: >-
      Los Cazadores de Vampiros aceptan casi toda la ayuda disponible. Por tanto, pueden reclutar
      Espadas Contratadas como si fueran Mercenarios Humanos.
  applies_to:
    band: true
