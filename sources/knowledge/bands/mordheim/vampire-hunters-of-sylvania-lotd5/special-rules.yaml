- id: priest-of-morr--funerary-rites
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.vampire-hunters-of-sylvania-lotd5.priest-of-morr.funerary-rites
      scope: 'NO'
      binding: null
      reason: out-of-scope.magic
  name: Funerary Rites
  effect: >-
    Priests of Morr are not wizards, however they do have numerous Funerary Rites which they may
    perform. As such, priests of Morr may randomly choose a Funerary Rite listed on the following
    page.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0-1 Priest of Morr / Special Rules / Funerary Rites
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/vampire-hunters-of-sylvania
  name_i18n:
    es: Ritos Funerarios
  effect_i18n:
    es: >-
      Los sacerdotes de Morr no son hechiceros; sin embargo, disponen de numerosos Ritos Funerarios
      que pueden realizar. Por tanto, los sacerdotes de Morr pueden elegir aleatoriamente un Rito
      Funerario de los listados en la página siguiente.
  applies_to:
    profile_ids:
    - priest-of-morr
