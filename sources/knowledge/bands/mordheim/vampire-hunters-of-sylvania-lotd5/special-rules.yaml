- id: pilgrim--fanatical
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.vampire-hunters-of-sylvania-lotd5.pilgrim.fanatical
      scope: 'NO'
      binding: null
      reason: out-of-scope.campaign
  name: Fanatical
  effect: >-
    A Pilgrim of Pain believes that the end of the world is nigh should the undead threat not be
    stopped. As such, nothing holds any terror for them in the mortal world. Pilgrims automatically
    pass any leadership-based tests they are required to take. A Pilgrim may never become a Warband
    leader.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0-4 Pilgrims / Special Rules / Fanatical
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/vampire-hunters-of-sylvania
  name_i18n:
    es: Fanáticos
  effect_i18n:
    es: >-
      Un Peregrino del Dolor cree que el fin del mundo está cerca si la amenaza no-muerta no se
      detiene. Por tanto, nada le causa terror en el mundo mortal. Los Peregrinos superan
      automáticamente cualquier prueba basada en Liderazgo que deban realizar. Un Peregrino nunca
      puede convertirse en líder de la banda.
  applies_to:
    profile_ids:
    - pilgrim
- id: pilgrim--blunt
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.vampire-hunters-of-sylvania-lotd5.pilgrim.blunt
      scope: 'NO'
      binding: null
      reason: out-of-scope.construction
  name: Blunt
  effect: >-
    Due to bludgeoning weapons having a much more profound effect upon the undead, Pilgrims ignore
    all bladed and ranged weapons in favor of maces, hammers and staffs. The only exception to this
    is the silver-tip stake, for it's incredible destructive powers against Vampires.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0-4 Pilgrims / Special Rules / Blunt
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/vampire-hunters-of-sylvania
  name_i18n:
    es: Contundentes
  effect_i18n:
    es: >-
      Dado que las armas contundentes tienen un efecto mucho más profundo sobre los no-muertos, los
      Peregrinos ignoran todas las armas de hoja y a distancia en favor de mazas, martillos y
      bastones. La única excepción es la estaca de punta de plata, por su increíble poder
      destructivo contra los Vampiros.
  applies_to:
    profile_ids:
    - pilgrim
- id: wolfhound--animal
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.vampire-hunters-of-sylvania-lotd5.wolfhound.animal
      scope: 'NO'
      binding: null
      reason: out-of-scope.campaign
  name: Animal
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0-4 Wolfhounds / Special Rules / Animal
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/vampire-hunters-of-sylvania
  name_i18n:
    es: Animal
  applies_to:
    profile_ids:
    - wolfhound
  rule_ref: shared-rule.animal
- id: band--special-skill-iron-will
  kind: warband_skill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: mechanic.fear-immunity
      scope: 'YES'
      binding:
        kind: mechanic
        id: mechanic.fear-immunity
  name: Iron Will
  effect: >-
    Such is the work of Slayers that there is little room for hesitation. When the opportunity
    arises, one must be able to strike! As such, the warrior is hardened and immune to Fear.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Skills / Iron Will
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/vampire-hunters-of-sylvania
  name_i18n:
    es: Voluntad de Hierro
  effect_i18n:
    es: >-
      Tal es la labor de los Asesinos que hay poco espacio para la vacilación. Cuando surge la
      oportunidad, ¡hay que ser capaz de golpear! Por tanto, el guerrero está endurecido y es inmune
      al Miedo.
  applies_to:
    band: true
  eligibility:
  - vampire-hunter
  - slayer
- id: band--special-skill-righteous-aura
  kind: warband_skill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: skill.sigmar-s-sign
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.sigmar-s-sign
  name: Righteous Aura
  effect: >-
    Carrying many talismans from various gods, the warrior heads into battle assured of victory.
    Possessed or Undead opponents lose their first attack against the warrior in the first round of
    hand-to-hand combat (down to a minimum of 1).
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Skills / Righteous Aura
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/vampire-hunters-of-sylvania
  name_i18n:
    es: Aura Justa
  effect_i18n:
    es: >-
      Llevando muchos talismanes de varios dioses, el guerrero entra en batalla seguro de la
      victoria. Los oponentes Posesos o No Muertos pierden su primer ataque contra el guerrero en la
      primera ronda de combate cuerpo a cuerpo (hasta un mínimo de 1).
  applies_to:
    band: true
- id: band--special-skill-thirst-for-vengeance
  kind: warband_skill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: mechanic.thirst-for-vengeance
      scope: 'YES'
      binding:
        kind: mechanic
        id: mechanic.thirst-for-vengeance
      clauses:
      - id: hatred-undead
        scope: 'YES'
      - id: charge-attack-bonus
        scope: 'YES'
  name: Thirst for Vengeance
  effect: >-
    The warrior Hates all undead. In his quest for revenge, he gains +1 attack in a turn where he
    has charged.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Skills / Thirst for Vengeance
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/vampire-hunters-of-sylvania
  name_i18n:
    es: Sed de Venganza
  effect_i18n:
    es: >-
      El guerrero Odia a todos los no-muertos. En su búsqueda de venganza, gana +1 ataque en un
      turno en el que haya cargado.
  applies_to:
    band: true
- id: band--special-skill-blessing-of-morr
  kind: warband_skill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: mechanic.blessing-of-morr
      scope: 'YES'
      binding:
        kind: mechanic
        id: mechanic.blessing-of-morr
  name: Blessing of Morr
  effect: >-
    The warrior has the Death god's blessing in his work. Add +1 to all injury rolls against the
    undead.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Skills / Blessing of Morr
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/vampire-hunters-of-sylvania
  name_i18n:
    es: Bendición de Morr
  effect_i18n:
    es: >-
      El guerrero cuenta con la bendición del dios de la Muerte en su labor. Suma +1 a todas las
      tiradas de herida contra los no-muertos.
  applies_to:
    band: true
- id: band--special-skill-touch-of-darkness
  kind: warband_skill
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.vampire-hunters-of-sylvania-lotd5.band.touch-of-darkness
      scope: 'NO'
      binding: null
      reason: out-of-scope.shooting
  name: Touch of Darkness
  effect: >-
    Long has the Slayer been dealing in death. Perhaps too long. Due to his heightened intuition, he
    ignores darkness penalties.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Skills / Touch of Darkness
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/vampire-hunters-of-sylvania
  name_i18n:
    es: Toque de Oscuridad
  effect_i18n:
    es: >-
      Mucho tiempo ha llevado el Asesino tratando con la muerte. Quizá demasiado. Debido a su
      aguzada intuición, ignora las penalizaciones por oscuridad.
  applies_to:
    band: true
- id: priest-of-morr--equipment-restrictions
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: profile.equipment-restrictions
      scope: 'YES'
      binding:
        kind: profile
        id: profile.equipment-restrictions
        parameters:
          forbids:
          - armour
          allowed_kinds:
          - weapon.dagger
          - weapon.scythe
  name: Equipment Restrictions
  effect: >-
    As priests of Morr seldom engage in martial activities, they may only be armed with a Dagger
    and a Scythe as weapons. Priests of Morr may never wear Armour.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Heroes / 0-1 Priest of Morr
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/vampire-hunters-of-sylvania
  name_i18n:
    es: Restricciones de Equipo
  effect_i18n:
    es: >-
      Como los sacerdotes de Morr rara vez participan en actividades marciales, solo pueden equiparse
      con una Daga y una Guadaña como armas. Los Sacerdotes de Morr nunca pueden llevar armadura.
  applies_to:
    profile_ids:
    - priest-of-morr
