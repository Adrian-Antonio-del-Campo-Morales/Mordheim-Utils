  name: Wholesale
  effect: The Merchant is known for buying items in greater numbers and so is especially welcome at the other merchants. He
    may search for D3+1 rare items after each battle instead of one item only (if he was not taken out of action, of course!).
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Merchant Special Skills / Wholesale
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/merchant-caravans
