  name: Lightning Reflexes
  effect: If the Knights Vanguard is charged, he will 'strike first' against those that charged that turn. As the charger(s)
    will also normally 'strike first' (for charging), the order of attack between the charger(s) and the Knights Vanguard
    will be determined by comparing Initiative values.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Heroes / 0 – 2 Knights Vanguard / Special Rules / Lightning Reflexes
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/merchant-caravans
  name_i18n:
    en: Lightning Reflexes
    es: null
  effect_i18n:
