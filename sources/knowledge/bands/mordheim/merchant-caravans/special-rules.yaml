- id: band--merchant-leadership
  runtime:
    scope: 'LATER'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.merchant-caravans.band.merchant-leadership
      scope: 'LATER'
      binding: null
      reason: 'Deferred subsystem: psychology or mounts.'
  name: Merchant
  effect: The Merchant is the warband leader and warriors within 6" may use his Leadership for Leadership tests. If the Merchant
    permanently leaves the warband, determine a new leader normally. The new leader gains the Merchant special rule, counts
    as a Merchant for all purposes, and may choose Merchant Special Skills. If no current model may become leader, an Apprentice
    must be bought as soon as possible to become the leader.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special rules / Merchant
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/merchant-caravans
  name_i18n:
    en: Merchant
    es: null
  effect_i18n:
    en: The Merchant is the warband leader and warriors within 6" may use his Leadership for Leadership tests. If the Merchant
      permanently leaves the warband, determine a new leader normally. The new leader gains the Merchant special rule, counts
      as a Merchant for all purposes, and may choose Merchant Special Skills. If no current model may become leader, an Apprentice
      must be bought as soon as possible to become the leader.
    es: null
  applies_to:
    band: true
- id: band--trade
  runtime:
    scope: "NO"
    implemented: "NO"
    grant: band
    effects:
    - id: unimplemented.merchant-caravans.band.trade
      scope: "NO"
      binding: null
      reason: "Out of scope: campaña."
  name: Trade
  effect: 'Instead of searching for a rare item, the Merchant may try to sell one rare item that was stored in the Trade Wagon
    during the preceding battle, before Heroes search for rare items. Roll D6: 1-2 = half the item''s basic price; 3-4 = the
    item''s full basic price; 5-6 = the full basic price plus half again. The Merchant may decline the offered price and try
    again after a later battle. Wholesale can increase the number of items sold this way.'
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special rules / Trade
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/merchant-caravans
  name_i18n:
    en: Trade
    es: null
  effect_i18n:
    en: 'Instead of searching for a rare item, the Merchant may try to sell one rare item that was stored in the Trade Wagon
      during the preceding battle, before Heroes search for rare items. Roll D6: 1-2 = half the item''s basic price; 3-4 =
      the item''s full basic price; 5-6 = the full basic price plus half again. The Merchant may decline the offered price
      and try again after a later battle. Wholesale can increase the number of items sold this way.'
    es: null
  applies_to:
    band: true
- id: band--open-for-business
  runtime:
    scope: "NO"
    implemented: "NO"
    grant: band
    effects:
    - id: unimplemented.merchant-caravans.band.open-for-business
      scope: "NO"
      binding: null
      reason: "Out of scope: campaña."
  name: Open for Business
  effect: Other players may send a Hero to the Merchant instead of searching for rare items. That Hero may buy one stored
    item from the Merchant Caravan or sell one item to it if both players agree on the price or exchange. If no agreement
    is reached, the visit is wasted.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special rules / Open for Business
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/merchant-caravans
  name_i18n:
    en: Open for Business
    es: null
  effect_i18n:
    en: Other players may send a Hero to the Merchant instead of searching for rare items. That Hero may buy one stored item
      from the Merchant Caravan or sell one item to it if both players agree on the price or exchange. If no agreement is
      reached, the visit is wasted.
    es: null
  applies_to:
    band: true
