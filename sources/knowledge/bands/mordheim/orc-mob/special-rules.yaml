- id: band--animosity
  name: Animosity
  effect: >-
    At the start of the Orc player's turn, roll a D6 for each Orc or Goblin Henchman not already
    engaged in hand-to-hand combat. On a 1, roll another D6: 1 = 'I 'Erd Dat!': the warrior
    immediately attacks the nearest eligible friendly Orc/Goblin Henchman or Hired Sword. If one is
    within charge reach, charge it and fight one round of close combat, then move the models 1 inch
    apart. If none can be charged and the warrior has a missile weapon, immediately shoot the
    nearest eligible friendly Orc/Goblin Henchman or Hired Sword. If neither applies, or the nearest
    friendly model is an Orc Hero, treat the result as 2-5. In all cases the warrior takes no other
    action that turn except defending itself if attacked. 2-5 = 'Wud Yoo Say?': the warrior does
    nothing else that turn, but may defend itself if attacked. 6 = 'I'll Show Yer!': immediately
    move as quickly as possible toward the nearest visible enemy, charging if possible; if no enemy
    is visible, make a normal move immediately. This is an extra move in addition to normal
    movement. If the extra move brings an enemy into charge range, the warrior must charge during
    its normal Movement phase.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / Animosity
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/orc-mob
  name_i18n:
    es: Rencor
  effect_i18n:
    es: >-
      Al comienzo del turno del jugador orco, tira un D6 por cada Secuaz orco o goblin que aún no
      esté trabado en combate cuerpo a cuerpo. Con un 1, tira otro D6: 1 = '¡Yo lo oí!': el guerrero
      ataca inmediatamente al Secuaz orco/goblin amistoso o Espada a sueldo elegible más cercano. Si
      hay uno al alcance de carga, cárgalo y lucha una ronda de combate cuerpo a cuerpo, y luego
      separa las miniaturas 1 pulgada. Si no puede cargarse a ninguno y el guerrero tiene un arma
      arrojadiza, dispara inmediatamente al Secuaz orco/goblin amistoso o Espada a sueldo elegible
      más cercano. Si no aplica ninguno de los dos, o la miniatura amistosa más cercana es un Héroe
      orco, trata el resultado como 2-5. En todos los casos el guerrero no realiza ninguna otra
      acción ese turno excepto defenderse si es atacado. 2-5 = '¿Qué dijiste?': el guerrero no hace
      nada más ese turno, pero puede defenderse si es atacado. 6 = '¡Ya lo verás!': muévete
      inmediatamente lo más rápido posible hacia el enemigo visible más cercano, cargando si es
      posible; si no hay ningún enemigo visible, realiza un movimiento normal de inmediato. Este es
      un movimiento extra además del movimiento normal. Si el movimiento extra pone a un enemigo en
      alcance de carga, el guerrero debe cargar durante su fase de Movimiento normal.
  applies_to:
    band: true
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.orc-mob.band.animosity
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: psychology or mounts.
