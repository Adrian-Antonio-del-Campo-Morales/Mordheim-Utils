- id: goblin-warriors--animosity
  name: Animosity
  effect: Goblin Warriors are subject to the warband's Animosity rule. If a Goblin fails Animosity and
    rolls a 1 on the result table, it will never charge an Orc Henchman, though it may still shoot an
    Orc Henchman with a missile weapon as normal.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / Goblin Warriors / Special Rules / Animosity
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/orc-mob
  name_i18n:
    en: Animosity
    es: Rencor
  effect_i18n:
    en: Goblin Warriors are subject to the warband's Animosity rule. If a Goblin fails Animosity and rolls
      a 1 on the result table, it will never charge an Orc Henchman, though it may still shoot an Orc
      Henchman with a missile weapon as normal.
    es: Los Guerreros goblin están sujetos a la regla de Rencor de la banda. Si un Goblin falla el Rencor
      y saca un 1 en la tabla de resultados, nunca cargará contra un Secuaz orco, aunque aún puede disparar
      a un Secuaz orco con un arma arrojadiza con normalidad.
  applies_to:
    profile_ids:
    - goblin-warriors
  runtime:
    scope: LATER
    implemented: 'NO'
