- id: troll--always-hungry
  name: Always Hungry
  effect: A Troll requires an upkeep cost. This upkeep represents the copious amounts of food that must
    be fed to the Troll in order to keep him loyal to the warband. The warband must pay 15 gold crowns
    after every game in order to keep the Troll. If the warband lacks the gold to pay the upkeep, the
    Boss has the option of sacrificing two Goblin Warriors or Cave Squigs to the Troll in lieu of buying
    food (Trolls eat nearly anything). If this fee is not paid (either in gold or in warband members)
    the Troll gets hungry and wanders off in search of food.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 1 Troll / Special Rules / Always Hungry
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/orc-mob
  name_i18n:
    en: Always Hungry
    es: Siempre hambriento
  effect_i18n:
    en: 'A Troll requires an upkeep cost. This

      upkeep represents the copious amounts of food that must be

      fed to the Troll in order to keep him loyal to the warband.

      The warband must pay 15 gold crowns after every game in

      order to keep the Troll. If the warband lacks the gold to pay

      the upkeep, the Boss has the option of sacrificing two Goblin

      Warriors or Cave Squigs to the Troll in lieu of buying food

      (Trolls eat nearly anything). If this fee is not paid (either in

      gold or in warband members) the Troll gets hungry and

      wanders off in search of food.'
    es: Un Trol requiere un coste de mantenimiento. Este mantenimiento representa las copiosas cantidades
      de comida que deben darse al Trol para mantenerlo leal a la banda. La banda debe pagar 15 coronas
      de oro después de cada partida para conservar al Trol. Si a la banda le falta oro para pagar el
      mantenimiento, el Jefe tiene la opción de sacrificar dos Guerreros goblin o Squigs de las cavernas
      al Trol en lugar de comprar comida (los Trolles comen casi cualquier cosa). Si esta tarifa no se
      paga (ni en oro ni en miembros de la banda), el Trol se queda hambriento y se marcha en busca de
      comida.
  applies_to:
    profile_ids:
    - troll
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.orc-mob.troll.always-hungry
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, or non-duel context.'
