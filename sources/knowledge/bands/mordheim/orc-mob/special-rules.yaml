- id: orc-boss--leader
  name: Leader
  effect: >-
    Any warrior within 6" of the Orc Boss may use his Leadership characteristic when taking
    Leadership tests.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 1 Orc Boss / Special Rules / Leader
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/orc-mob
  name_i18n:
    es: Líder
  effect_i18n:
    es: >-
      Cualquier guerrero a 6" del Jefe orco puede usar su característica de Liderazgo al realizar
      chequeos de Liderazgo.
  applies_to:
    profile_ids:
    - orc-boss
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.orc-mob.orc-boss.leader
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: psychology or mounts.
