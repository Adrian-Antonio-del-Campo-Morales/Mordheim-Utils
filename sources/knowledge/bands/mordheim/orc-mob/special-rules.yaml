      binding: null
      reason: 'Deferred subsystem: psychology or mounts.'
- id: goblin-warriors--not-orcs
  name: Not Orcs
  effect: Orcs don't expect much from non-Orcs, and are therefore not unsettled if Goblins or Cave Squigs
    break or get cut down in battle. In fact, they expect as much from these weaklings! Therefore, when
    testing to see if an Orc Warband needs to take a Rout test, each Goblin Warrior or Cave Squig taken
    out of action only counts as half a model. Therefore, a band of 5 Orcs and 10 Goblins (15 models)
    would only have to take a test if 4 models fell (4 Orcs or 8 Goblins, or some combination thereof
    ).
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / Goblin Warriors / Special Rules / Not Orcs
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/orc-mob
  name_i18n:
    en: Not Orcs
    es: No son orcos
  effect_i18n:
    en: 'Orcs don''t expect much from non-Orcs, and are

      therefore not unsettled if Goblins or Cave Squigs break or get

      cut down in battle. In fact, they expect as much from these

      weaklings! Therefore, when testing to see if an Orc Warband

      needs to take a Rout test, each Goblin Warrior or Cave Squig

      taken out of action only counts as half a model. Therefore, a

      band of 5 Orcs and 10 Goblins (15 models) would only have

      to take a test if 4 models fell (4 Orcs or 8 Goblins, or some

      combination thereof ).'
    es: Los orcos no esperan mucho de los no orcos, y por tanto no se inquietan si los Goblins o los Squigs
      de las cavernas se baten en retirada o caen en batalla. De hecho, ¡esperan tanto de estos debiluchos!
      Por tanto, al chequear si una Banda Orca necesita realizar un chequeo de Huida, cada Guerrero goblin
      o Squig de las cavernas puesto fuera de combate solo cuenta como media miniatura. Por tanto, una
      banda de 5 orcos y 10 goblins (15 miniaturas) solo tendría que chequear si caen 4 miniaturas (4
      orcos u 8 goblins, o alguna combinación de ambos).
  applies_to:
    profile_ids:
    - goblin-warriors
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.orc-mob.goblin-warriors.not-orcs
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology or mounts.'
