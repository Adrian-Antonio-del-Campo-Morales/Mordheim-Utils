- id: centigors--trample
  runtime:
    scope: "YES"
    implemented: "YES"
    grant: profile
    effects:
    - id: profile-rule.centigors--trample
      scope: "YES"
      binding:
        kind: compiler
        id: profile-rule.centigors--trample
  name: Trample
  effect: 'As well as their weapons,

    Centigors use their hooves and sheer size to

    crush their enemies. This counts as an

    additional attack, which does not benefit

    from weapon bonuses or penalties...'
