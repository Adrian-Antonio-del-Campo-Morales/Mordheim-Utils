- id: band--beastmen-special-skills-shaggy-hide
  kind: warband_skill
  runtime:
    scope: "YES"
    implemented: "YES"
    grant: selectable
    effects:
    - id: trait.natural-armour-save
      scope: "YES"
      binding:
        kind: trait
        id: trait.natural-armour-save
        parameters:
          value: 6
    - id: trait.natural-armour-stacks
      scope: "YES"
      binding:
        kind: trait
        id: trait.natural-armour-stacks
        parameters:
          value: true
  name: Shaggy Hide
  effect: 'The Beastman’s massively shaggy hide acts as armour, deflecting sword strokes and

    protecting him from harm. The model gains a 6+ Armour Save that can be combined

    with other armour as normal.'
  source:
