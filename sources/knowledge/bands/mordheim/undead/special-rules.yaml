- id: band--undead-maximum-characteristics
  name: Undead Maximum Characteristics
  effect: Vampires use the Vampire racial maximum profile (campaign.limit.racial-maximum.vampire). Necromancers
    and Dregs use the Human racial maximum profile (campaign.limit.racial-maximum.human). Ghouls use the
    Ghoul racial maximum profile (campaign.limit.racial-maximum.ghoul). Dire Wolves and Zombies do not
    gain Experience and therefore do not use advancement maximums.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Racial Maximum Characteristics / Vampire; Human; Ghoul
    url: https://mordheimer.net/docs/campaigns/experience
  name_i18n:
    en: Undead Maximum Characteristics
    es: Características máximas de los Muertos Vivientes
  effect_i18n:
    en: Vampires use the Vampire racial maximum profile (campaign.limit.racial-maximum.vampire). Necromancers
      and Dregs use the Human racial maximum profile (campaign.limit.racial-maximum.human). Ghouls use
      the Ghoul racial maximum profile (campaign.limit.racial-maximum.ghoul). Dire Wolves and Zombies
      do not gain Experience and therefore do not use advancement maximums.
    es: Los Vampiros usan el perfil racial máximo de Vampiro (campaign.limit.racial-maximum.vampire).
      Los Nigromantes y los Secuaces usan el perfil racial máximo Humano (campaign.limit.racial-maximum.human).
      Los Gulles usan el perfil racial máximo de Gul (campaign.limit.racial-maximum.ghoul). Los Lobos
      terrible y los Zombis no ganan Experiencia y por tanto no usan máximos de progresión.
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.undead.band.undead-maximum-characteristics
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: no effect applies to the isolated 1v1 duel or legal fighter skill/equipment
        construction.
