schema_version: 2
band_id: undead
rules:
- id: vampire--leader
  name: Leader
  effect: >-
    Any model in the warband within 6" of the Vampire may use the Vampire's Leadership instead of
    its own.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 1 Vampire / Special Rules / Leader
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/undead
  name_i18n:
    es: Líder
  effect_i18n:
    es: >-
      Cualquier miniatura de la banda a 6" del Vampiro puede usar el Liderazgo del Vampiro en lugar
      del suyo propio.
  applies_to:
    profile_ids:
    - vampire
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.undead.vampire.leader
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: psychology or mounts.
