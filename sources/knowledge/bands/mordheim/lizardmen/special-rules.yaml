schema_version: 2
band_id: lizardmen
rules:
- id: skink-priest--leader
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: mechanic.leader-six
      scope: 'YES'
      binding:
        kind: mechanic
        id: mechanic.leader-six
      clauses:
      - id: leader-six
        scope: 'YES'
      - id: leader-replacement
        scope: 'NO'
  name: Leader
  effect: >-
    The Skink Priest is the leader of the Warband and any Lizardmen within 6" may use his Leadership
    characteristic for any Leadership tests. If the Skink Priest is killed you may recruit a new
    Skink Priest but you must play at least one game without the leader to give him time to join up.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 1 Skink Priest / Special Rules / Leader
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/lizardmen
  name_i18n:
    es: Líder
  effect_i18n:
    es: >-
      El Sacerdote Skink es el líder de la banda y cualquier Hombre Lagarto a 6" puede usar su
      característica de Liderazgo para cualquier chequeo de Liderazgo. Si el Sacerdote Skink muere
      puedes reclutar un nuevo Sacerdote Skink, pero debes jugar al menos una partida sin líder para
      darle tiempo a incorporarse.
  applies_to:
    profile_ids:
    - skink-priest
- id: skink-priest--wizard
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.lizardmen.skink-priest.wizard
      scope: 'NO'
      binding: null
      reason: out-of-scope.magic
  name: Wizard
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 1 Skink Priest / Special Rules / Wizard
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/lizardmen
  name_i18n:
    es: Mago
  applies_to:
    profile_ids:
    - skink-priest
  rule_ref: shared-rule.skink-priest-wizard
- id: kroxigor--scaly-skin
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: trait.natural-armour-save
      scope: 'YES'
      binding:
        kind: trait
        id: trait.natural-armour-save
        parameters:
          value: 4
  name: Scaly Skin
  effect: Kroxigor has a natural save of 4+.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 1 Kroxigor / Special Rules / Scaly skin
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/lizardmen
  name_i18n:
    es: Piel Escamosa
  effect_i18n:
    es: El Kroxigor tiene una salvación natural de 4+.
  applies_to:
    profile_ids:
    - kroxigor
- id: kroxigor--aquatic
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.lizardmen.kroxigor.aquatic
      scope: 'NO'
      binding: null
      reason: out-of-scope.movement
  name: Aquatic
  effect: >-
    Kroxigor may move through water with no penalty, and count as being in cover whilst in water.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 1 Kroxigor / Special Rules / Aquatic
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/lizardmen
  name_i18n:
    es: Acuático
  effect_i18n:
    es: >-
      El Kroxigor puede moverse por el agua sin penalización y cuenta como estando en cobertura
      mientras esté en el agua.
  applies_to:
    profile_ids:
    - kroxigor
- id: kroxigor--cause-fear
  runtime:
