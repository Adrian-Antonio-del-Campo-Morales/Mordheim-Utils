    es: La banda jamás puede incluir más Saurus Guerreros que Skinks Guerreros.
  applies_to:
    band: true
- id: band--saurus-skill-prohibitions
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: band
    effects:
    - id: compiler.saurus-skill-prohibitions
      scope: 'YES'
      binding:
        kind: compiler
        id: compiler.saurus-skill-prohibitions
  name: Saurus Skill Prohibitions
  effect: Saurus can never receive Academic skills and can never use missile weapons.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Lizardmen Skill Table / Skills list prohibitions
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/lizardmen
  name_i18n:
    en: Saurus Skill Prohibitions
    es: Prohibiciones de habilidades Saurus
  effect_i18n:
    en: Saurus can never receive Academic skills and can never use missile weapons.
    es: Los Saurus jamás pueden recibir habilidades Académicas y jamás pueden usar armas de misil.
  applies_to:
    band: true
- id: band--lizardmen-special-skills-skinks-only-infiltration
  kind: warband_skill
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.lizardmen.band.lizardmen-special-skills-skinks-only-infiltration
      scope: 'NO'
      binding: null
      reason: 'Out of scope: movement.'
  name: Infiltration
  effect: The Skink is a great hunter and is an expert at sneaking upon his prey unnoticed. The Hero may
    set up anywhere on the table but no closer than 12" to an enemy and he must start the game in hiding.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Lizardmen special skills / Skinks Only / Infiltration
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/lizardmen
  name_i18n:
    en: Infiltration
    es: Infiltración
  effect_i18n:
    en: 'The Skink is a great hunter and is an expert at sneaking upon his prey unnoticed.

      The Hero may set up anywhere on the table but no closer than 12" to an enemy and he must start the
      game in hiding.'
    es: El Skink es un gran cazador y es experto en acechar a su presa sin ser notado. El héroe puede
      desplegarse en cualquier punto de la mesa, pero no a menos de 12" de un enemigo, y debe comenzar
      la partida oculto.
  eligibility:
  - skink-priest
  - skink-great-crests
  applies_to:
    band: true
- id: band--lizardmen-special-skills-skinks-only-great-hunter
  kind: warband_skill
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.lizardmen.band.lizardmen-special-skills-skinks-only-great-hunter
      scope: 'NO'
      binding: null
      reason: 'Out of scope: shooting.'
  name: Great Hunter
  effect: The Skink Great Crest is adept at making the most of the cover available and imposes an additional
    -1 to hit the Skink if he is in cover, i.e. a -2 to hit penalty.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Lizardmen special skills / Skinks Only / Great Hunter
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/lizardmen
  name_i18n:
    en: Great Hunter
    es: Gran cazador
  effect_i18n:
    en: The Skink Great Crest is adept at making the most of the cover available and imposes an additional
      -1 to hit the Skink if he is in cover, i.e. a -2 to hit penalty.
    es: El Skink Gran Cresta es experto en sacar el máximo provecho de la cobertura disponible e impone
      un -1 adicional para impactar al Skink si está en cobertura, es decir, una penalización de -2 para
      impactar.
  eligibility:
  - skink-priest
  - skink-great-crests
  applies_to:
    band: true
- id: band--lizardmen-special-skills-saurus-only-bellowing-battle-roar
  kind: warband_skill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: skill.bellowing-battle-roar
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.bellowing-battle-roar
  name: Bellowing Battle Roar
  effect: The Saurus' roar is so deafening that enemy models in base contact suffer -1 to hit in the first
    round of combat against them.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Lizardmen special skills / Saurus Only / Bellowing Battle Roar
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/lizardmen
  name_i18n:
    en: Bellowing Battle Roar
    es: Rugido de batalla atronador
  effect_i18n:
    en: The Saurus' roar is so deafening that enemy models in base contact suffer -1 to hit in the first
      round of combat against them.
    es: El rugido del Saurus es tan ensordecedor que los modelos enemigos en contacto de peana sufren
      -1 para impactar en el primer asalto de combate contra ellos.
  eligibility:
  - saurus-totem-warrior
  applies_to:
    band: true
- id: band--lizardmen-special-skills-saurus-only-toughened-hide
  kind: warband_skill
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.lizardmen.band.lizardmen-special-skills-saurus-only-toughened-hide
