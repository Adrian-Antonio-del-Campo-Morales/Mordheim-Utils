      reason: 'Out of scope: injuries.'
  name: Toughened Hide
  effect: Through years of battle the Saurus' hide has become hardened and the Saurus will only be taken
    out of action on a 6+.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Lizardmen special skills / Saurus Only / Toughened Hide
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/lizardmen
  name_i18n:
    en: Toughened Hide
    es: Piel endurecida
  effect_i18n:
    en: Through years of battle the Saurus' hide has become hardened and the Saurus will only be taken
      out of action on a 6+.
    es: Tras años de batalla, la piel del Saurus se ha endurecido y el Saurus solo será puesto Fuera de
      combate con un 6+.
  eligibility:
  - saurus-totem-warrior
  applies_to:
    band: true
