- id: band--saurus-rarity
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.lizardmen.band.saurus-rarity
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign.'
  name: Saurus Rarity
  effect: The warband may never include more Saurus Braves than Skink Braves.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: special rules / Saurus Rarity
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/lizardmen
  name_i18n:
