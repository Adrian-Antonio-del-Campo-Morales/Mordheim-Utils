      scope: 'YES'
      binding:
        kind: trait
        id: trait.natural-armour-save
        parameters:
          value: 4
  name: Scaly skin
  effect: Kroxigor has a natural save of 4+.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 1 Kroxigor / Special Rules / Scaly skin
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/lizardmen
  name_i18n:
    en: Scaly skin
    es: Piel escamosa
  effect_i18n:
    en: Kroxigor has a natural save of 4+.
    es: El Kroxigor tiene una salvación natural de 4+.
  applies_to:
    profile_ids:
    - kroxigor
- id: kroxigor--aquatic
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.lizardmen.kroxigor.aquatic
      scope: 'NO'
      binding: null
      reason: 'Out of scope: movement.'
  name: Aquatic
  effect: Kroxigor may move through water with no penalty, and count as being in cover whilst in water.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 1 Kroxigor / Special Rules / Aquatic
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/lizardmen
  name_i18n:
    en: Aquatic
    es: Acuático
  effect_i18n:
    en: Kroxigor may move through water with no penalty, and count as being in cover whilst in water.
    es: El Kroxigor puede moverse por el agua sin penalización y cuenta como estando en cobertura mientras
      esté en el agua.
  applies_to:
    profile_ids:
    - kroxigor
- id: kroxigor--cause-fear
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.lizardmen.kroxigor.cause-fear
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology.'
  name: Cause Fear
  effect: Kroxigor are large and frightening monsters that cause Fear.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 1 Kroxigor / Special Rules / Cause Fear
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/lizardmen
  name_i18n:
    en: Cause Fear
    es: Causar miedo
  effect_i18n:
    en: Kroxigor are large and frightening monsters that cause Fear.
    es: Los Kroxigor son monstruos grandes y aterradores que causan Miedo.
  applies_to:
    profile_ids:
    - kroxigor
- id: kroxigor--large
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.lizardmen.kroxigor.large
      scope: 'NO'
      binding: null
      reason: 'Out of scope: shooting.'
  name: Large
  effect: Kroxigor stand out amongst the rest of the Warband and may be picked out by an archer even if
    he is not the closest model.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 1 Kroxigor / Special Rules / Large
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/lizardmen
  name_i18n:
    en: Large
    es: Grande
  effect_i18n:
    en: Kroxigor stand out amongst the rest of the Warband and may be picked out by an archer even if
      he is not the closest model.
    es: Los Kroxigor destacan entre el resto de la banda y pueden ser elegidos por un arquero incluso
      si no es el modelo más cercano.
  applies_to:
    profile_ids:
    - kroxigor
- id: kroxigor--animal
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.lizardmen.kroxigor.animal
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign.'
  name: Animal
  effect: Kroxigor are slow-witted creatures that never learn from their mistakes. The Kroxigor doesn't
    gain experience.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 1 Kroxigor / Special Rules / Animal
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/lizardmen
  name_i18n:
    en: Animal
    es: Animal
  effect_i18n:
    en: Kroxigor are slow-witted creatures that never learn from their mistakes. The Kroxigor doesn't
      gain experience.
    es: Los Kroxigor son criaturas lentas de entendimiento que nunca aprenden de sus errores. El Kroxigor
      no gana experiencia.
  applies_to:
    profile_ids:
    - kroxigor
- id: band--scaly-skin
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: band
    effects:
    - id: compiler.lizardmen-scaly-skin
      scope: 'YES'
      binding:
        kind: compiler
        id: compiler.lizardmen-scaly-skin
  name: Scaly Skin
  effect: Skinks have a natural 6+ armour save and Saurus have a natural 5+ armour save. The Kroxigor
    uses its own 4+ Scaly Skin rule instead. Strength modifiers cannot reduce the Skink/Saurus natural
    save below 6+, but effects that allow no save negate it. Light armour adds +1 to the save, as does
    a shield.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: special rules / Scaly Skin
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/lizardmen
  name_i18n:
    en: Scaly Skin
    es: Piel escamosa
  effect_i18n:
    en: Skinks have a natural 6+ armour save and Saurus have a natural 5+ armour save. The Kroxigor uses
      its own 4+ Scaly Skin rule instead. Strength modifiers cannot reduce the Skink/Saurus natural save
      below 6+, but effects that allow no save negate it. Light armour adds +1 to the save, as does a
      shield.
    es: Los Skinks tienen una salvación natural por armadura de 6+ y los Saurus una salvación natural
      de 5+. El Kroxigor usa en su lugar su propia regla de Piel escamosa de 4+. Los modificadores de
      Fuerza no pueden reducir la salvación natural de Skink/Saurus por debajo de 6+, pero los efectos
      que no permiten salvación la anulan. La armadura ligera suma +1 a la salvación, al igual que un
      escudo.
  applies_to:
    band: true
- id: band--armour
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.lizardmen.band.armour
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: no effect applies to the isolated 1v1 duel or legal fighter skill/equipment
        construction.
  name: Armour
  effect: Light armour always costs 50 gc for Lizardmen, including when bought from the Equipment chart.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: special rules / Armour
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/lizardmen
  name_i18n:
    en: Armour
    es: Armadura
  effect_i18n:
    en: Light armour always costs 50 gc for Lizardmen, including when bought from the Equipment chart.
    es: La armadura ligera siempre cuesta 50 coronas para los Hombres Lagarto, incluida cuando se compra
      de la tabla de Equipo.
  applies_to:
    band: true
- id: band--bite-attack
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: compiler.bite-attack
      scope: 'YES'
      binding:
        kind: compiler
        id: compiler.bite-attack
  name: Bite Attack
  effect: Each Saurus makes one additional bite attack using its own Strength and with no unarmed penalty.
    The bite always strikes last, after all other attacks, including attacks made with double-handed weapons.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: special rules / Bite Attack
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/lizardmen
  name_i18n:
    en: Bite Attack
    es: Ataque de mordisco
  effect_i18n:
    en: Each Saurus makes one additional bite attack using its own Strength and with no unarmed penalty.
      The bite always strikes last, after all other attacks, including attacks made with double-handed
      weapons.
    es: Cada Saurus realiza un ataque de mordisco adicional usando su propia Fuerza y sin penalización
      por ir sin armas. El mordisco siempre golpea el último, después de todos los demás ataques, incluidos
      los ataques hechos con armas a dos manos.
  applies_to:
    profile_ids:
    - saurus-totem-warrior
    - saurus-braves
- id: band--cold-blooded
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.lizardmen.band.cold-blooded
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology.'
  name: Cold Blooded
  effect: When taking a Psychology test or Rout test, Lizardmen roll 3D6 and use the lowest two dice.
    A Lizardmen warband may never use the Leadership of a Saurus or Kroxigor for a Rout test.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: special rules / Cold Blooded
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/lizardmen
  name_i18n:
    en: Cold Blooded
    es: Sangre fría
  effect_i18n:
    en: When taking a Psychology test or Rout test, Lizardmen roll 3D6 and use the lowest two dice. A
      Lizardmen warband may never use the Leadership of a Saurus or Kroxigor for a Rout test.
    es: Al hacer un chequeo de Psicología o un chequeo de huida, los Hombres Lagarto tiran 3D6 y usan
      los dos dados más bajos. Una banda de Hombres Lagarto jamás puede usar el Liderazgo de un Saurus
      o Kroxigor para un chequeo de huida.
  applies_to:
    band: true
