schema_version: 2
band_id: lizardmen
rules:
- id: skink-priest--leader
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.lizardmen.skink-priest.leader
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology.'
  name: Leader
  effect: The Skink Priest is the leader of the Warband and any Lizardmen within 6" may use his Leadership
    characteristic for any Leadership tests. If the Skink Priest is killed you may recruit a new Skink
    Priest but you must play at least one game without the leader to give him time to join up.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 1 Skink Priest / Special Rules / Leader
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/lizardmen
  name_i18n:
    en: Leader
    es: Líder
  effect_i18n:
    en: 'The Skink Priest is the leader of the Warband and any Lizardmen within 6" may use his Leadership
      characteristic for any Leadership tests.

      If the Skink Priest is killed you may recruit a new Skink Priest but you must play at least one
      game without the leader to give him time to join up.'
    es: El Sacerdote Skink es el líder de la banda y cualquier Hombre Lagarto a 6" puede usar su característica
      de Liderazgo para cualquier chequeo de Liderazgo. Si el Sacerdote Skink muere puedes reclutar un
      nuevo Sacerdote Skink, pero debes jugar al menos una partida sin líder para darle tiempo a incorporarse.
  applies_to:
    profile_ids:
    - skink-priest
- id: skink-priest--wizard
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.lizardmen.skink-priest.wizard
      scope: 'NO'
      binding: null
      reason: 'Out of scope: magic.'
  name: Wizard
  effect: The Skink Priest is a Wizard and may use Lizardmen magic.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 1 Skink Priest / Special Rules / Wizard
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/lizardmen
  name_i18n:
    en: Wizard
    es: Hechicero
  effect_i18n:
    en: The Skink Priest is a Wizard and may use Lizardmen magic.
    es: El Sacerdote Skink es un hechicero y puede usar la magia de los Hombres Lagarto.
  applies_to:
    profile_ids:
    - skink-priest
- id: kroxigor--scaly-skin
  runtime:
