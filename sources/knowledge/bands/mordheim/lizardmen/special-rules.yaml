- id: kroxigor--animal
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.lizardmen.kroxigor.animal
      scope: 'NO'
      binding: null
      reason: out-of-scope.campaign
  name: Animal
  effect: >-
    Kroxigor are slow-witted creatures that never learn from their mistakes. The Kroxigor doesn't
    gain experience.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 1 Kroxigor / Special Rules / Animal
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/lizardmen
  name_i18n:
    es: Animal
  effect_i18n:
    es: >-
      Los Kroxigor son criaturas lentas de entendimiento que nunca aprenden de sus errores. El
      Kroxigor no gana experiencia.
  applies_to:
    profile_ids:
    - kroxigor
- id: band--scaly-skin
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: band
    effects:
    - id: compiler.lizardmen-scaly-skin
      scope: 'YES'
      binding:
        kind: compiler
        id: compiler.lizardmen-scaly-skin
  name: Scaly Skin
  effect: >-
    Skinks have a natural 6+ armour save and Saurus have a natural 5+ armour save. The Kroxigor uses
    its own 4+ Scaly Skin rule instead. Strength modifiers cannot reduce the Skink/Saurus natural
    save below 6+, but effects that allow no save negate it. Light armour adds +1 to the save, as
    does a shield.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: special rules / Scaly Skin
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/lizardmen
  name_i18n:
    es: Piel Escamosa
  effect_i18n:
    es: >-
      Los Skinks tienen una salvación natural por armadura de 6+ y los Saurus una salvación natural
      de 5+. El Kroxigor usa en su lugar su propia regla de Piel escamosa de 4+. Los modificadores
      de Fuerza no pueden reducir la salvación natural de Skink/Saurus por debajo de 6+, pero los
      efectos que no permiten salvación la anulan. La armadura ligera suma +1 a la salvación, al
      igual que un escudo.
  applies_to:
    band: true
- id: band--armour
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.lizardmen.band.armour
      scope: 'NO'
      binding: null
      reason: out-of-scope.construction
  name: Armour
  effect: >-
    Light armour always costs 50 gc for Lizardmen, including when bought from the Equipment chart.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: special rules / Armour
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/lizardmen
  name_i18n:
    es: Armadura
  effect_i18n:
    es: >-
      La armadura ligera siempre cuesta 50 coronas para los Hombres Lagarto, incluida cuando se
      compra de la tabla de Equipo.
  applies_to:
    band: true
- id: band--bite-attack
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: compiler.bite-attack
      scope: 'YES'
      binding:
        kind: compiler
        id: compiler.bite-attack
  name: Bite Attack
  effect: >-
    Each Saurus makes one additional bite attack using its own Strength and with no unarmed penalty.
    The bite always strikes last, after all other attacks, including attacks made with double-handed
    weapons.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: special rules / Bite Attack
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/lizardmen
  name_i18n:
    es: Ataque de Mordisco
  effect_i18n:
    es: >-
      Cada Saurus realiza un ataque de mordisco adicional usando su propia Fuerza y sin penalización
      por ir sin armas. El mordisco siempre golpea el último, después de todos los demás ataques,
      incluidos los ataques hechos con armas a dos manos.
  applies_to:
    profile_ids:
    - saurus-totem-warrior
    - saurus-braves
- id: band--cold-blooded
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: band
    effects:
    - id: mechanic.cold-blooded-psychology
      scope: 'YES'
      binding:
        kind: mechanic
        id: mechanic.cold-blooded-psychology
      clauses:
      - id: cold-blooded-psychology
        scope: 'YES'
      - id: rout-test
        scope: 'NO'
    - id: unimplemented.lizardmen.band.cold-blooded.rout
      scope: 'NO'
      binding: null
      reason: out-of-scope.group
  name: Cold Blooded
  effect: >-
    When taking a Psychology test or Rout test, Lizardmen roll 3D6 and use the lowest two dice. A
    Lizardmen warband may never use the Leadership of a Saurus or Kroxigor for a Rout test.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: special rules / Cold Blooded
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/lizardmen
  name_i18n:
    es: Sangre Fría
  effect_i18n:
    es: >-
      Al hacer un chequeo de Psicología o un chequeo de huida, los Hombres Lagarto tiran 3D6 y usan
      los dos dados más bajos. Una banda de Hombres Lagarto jamás puede usar el Liderazgo de un
      Saurus o Kroxigor para un chequeo de huida.
  applies_to:
    band: true
