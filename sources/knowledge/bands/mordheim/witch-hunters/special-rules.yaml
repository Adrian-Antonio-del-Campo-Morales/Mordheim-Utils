- id: witch-hunter-captain--leader
  name: Leader
  effect: Any warrior within 6" of the Witch Hunter Captain may use his Leadership when taking Leadership
    tests.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 1 Witch Hunter Captain / Special Rules / Leader
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/witch-hunters
  name_i18n:
    en: Leader
    es: Líder
  effect_i18n:
    en: Any warrior within 6" of the Witch Hunter Captain may use his Leadership when taking Leadership
      tests.
    es: Cualquier guerrero a 6" del Capitán cazador de brujas puede usar su Liderazgo cuando realice chequeos
      de Liderazgo.
  applies_to:
    profile_ids:
    - witch-hunter-captain
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
