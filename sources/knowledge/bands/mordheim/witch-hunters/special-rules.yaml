- id: band--human-maximum-characteristics
  name: Human Maximum Characteristics
  effect: Witch Hunter Captains, Witch Hunters, Warrior-Priests, Flagellants and Zealots use the Human
    racial maximum profile (campaign.limit.racial-maximum.human). Warhounds do not gain Experience and
    therefore do not use advancement maximums.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Racial Maximum Characteristics / Human
    url: https://mordheimer.net/docs/campaigns/experience
  name_i18n:
    en: Human Maximum Characteristics
    es: Máximos de características humanos
  effect_i18n:
    en: Witch Hunter Captains, Witch Hunters, Warrior-Priests, Flagellants and Zealots use the Human racial
      maximum profile (campaign.limit.racial-maximum.human). Warhounds do not gain Experience and therefore
      do not use advancement maximums.
    es: Los Capitanes cazadores de brujas, los Cazadores de Brujas, los Sacerdotes guerreros, los Flagelantes
      y los Zealots usan el perfil máximo racial humano (campaign.limit.racial-maximum.human). Los perros
      de guerra no ganan Experiencia y por tanto no usan los máximos de avance.
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.witch-hunters.band.human-maximum-characteristics
      scope: 'NO'
      binding: null
      reason: 'Out of scope: no effect applies to the isolated 1v1 duel or legal fighter skill/equipment
        construction.'
