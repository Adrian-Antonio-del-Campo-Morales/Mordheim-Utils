- id: warrior-priest--prayers
  name: Prayers
  effect: >-
    The Warrior-Priest may use the Prayers of Sigmar and begins with one randomly generated prayer.
    When gaining a new skill, the Warrior-Priest may learn a new Prayer instead. Prayer effects are
    intentionally not modelled in this file.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 – 1 Warrior-priest / Special Rules / Prayers
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/witch-hunters
  name_i18n:
    es: Plegarias
  effect_i18n:
    es: >-
      El Sacerdote guerrero puede usar las Plegarias de Sigmar y comienza con una plegaria generada
      al azar. Al ganar una nueva habilidad, el Sacerdote guerrero puede aprender una nueva Plegaria
      en su lugar. Los efectos de las plegarias no se modelan deliberadamente en este fichero.
  applies_to:
    profile_ids:
    - warrior-priest
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.witch-hunters.warrior-priest.prayers
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: no effect applies to the isolated 1v1 duel or legal fighter skill/equipment
        construction.
- id: flagellants--fanatical
  name: Fanatical
  effect: >-
    Flagellants automatically pass all Leadership-based tests they are required to take and may
    never become the warband leader.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 5 Flagellants / Special Rules / Fanatical
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/witch-hunters
  name_i18n:
    es: Fanáticos
  effect_i18n:
    es: >-
      Los Flagelantes superan automáticamente todos los chequeos basados en Liderazgo que deban
      realizar y no pueden convertirse nunca en el líder de la banda.
  applies_to:
    profile_ids:
    - flagellants
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.witch-hunters.flagellants.fanatical
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: psychology or mounts.
- id: war-hounds--animals
  name: Animals
  effect: Warhounds are animals and never gain Experience.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 5 War hounds / Special Rules / Animals
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/witch-hunters
  name_i18n:
    es: Animales
  effect_i18n:
    es: Los perros de guerra son animales y nunca ganan Experiencia.
  applies_to:
    profile_ids:
    - war-hounds
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.witch-hunters.war-hounds.animals
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: campaign, shooting, movement, terrain, deployment, or non-duel context.
- id: band--human-maximum-characteristics
  name: Human Maximum Characteristics
  effect: >-
    Witch Hunter Captains, Witch Hunters, Warrior-Priests, Flagellants and Zealots use the Human
    racial maximum profile (campaign.limit.racial-maximum.human). Warhounds do not gain Experience
    and therefore do not use advancement maximums.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Racial Maximum Characteristics / Human
    url: https://mordheimer.net/docs/campaigns/experience
  name_i18n:
    es: Máximos de Características Humanos
  effect_i18n:
    es: >-
      Los Capitanes cazadores de brujas, los Cazadores de Brujas, los Sacerdotes guerreros, los
      Flagelantes y los Zealots usan el perfil máximo racial humano
      (campaign.limit.racial-maximum.human). Los perros de guerra no ganan Experiencia y por tanto
      no usan los máximos de avance.
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.witch-hunters.band.human-maximum-characteristics
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: no effect applies to the isolated 1v1 duel or legal fighter skill/equipment
        construction.
- id: flagellants--no-missile-weapons
  name: No Missile Weapons
  effect: >-
    Flagellants may never use missile weapons, even if an Advance would otherwise allow access to them.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 5 Flagellants / Special Rules / No Missile Weapons
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/witch-hunters
  name_i18n:
    es: Sin Armas de Proyectil
  effect_i18n:
    es: >-
      Los Flagelantes jamás pueden usar armas de proyectil, incluso si una Mejora les permitiera acceder a ellas.
  applies_to:
    profile_ids:
    - flagellants
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: compiler.no-missile-weapons
      scope: 'YES'
      binding:
        kind: compiler
        id: compiler.no-missile-weapons
