- id: warrior-priest--prayers
  name: Prayers
  effect: The Warrior-Priest may use the Prayers of Sigmar and begins with one randomly generated prayer.
    When gaining a new skill, the Warrior-Priest may learn a new Prayer instead. Prayer effects are intentionally
    not modelled in this file.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 – 1 Warrior-priest / Special Rules / Prayers
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/witch-hunters
  name_i18n:
    en: Prayers
    es: Plegarias
  effect_i18n:
    en: The Warrior-Priest may use the Prayers of Sigmar and begins with one randomly generated prayer.
      When gaining a new skill, the Warrior-Priest may learn a new Prayer instead. Prayer effects are
      intentionally not modelled in this file.
    es: El Sacerdote guerrero puede usar las Plegarias de Sigmar y comienza con una plegaria generada
      al azar. Al ganar una nueva habilidad, el Sacerdote guerrero puede aprender una nueva Plegaria en
      su lugar. Los efectos de las plegarias no se modelan deliberadamente en este fichero.
  applies_to:
    profile_ids:
    - warrior-priest
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.witch-hunters.warrior-priest.prayers
      scope: 'NO'
      binding: null
      reason: 'Out of scope: no effect applies to the isolated 1v1 duel or legal fighter skill/equipment
        construction.'
- id: flagellants--fanatical
  name: Fanatical
  effect: Flagellants automatically pass all Leadership-based tests they are required to take and may
    never become the warband leader.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 5 Flagellants / Special Rules / Fanatical
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/witch-hunters
  name_i18n:
    en: Fanatical
    es: Fanático
  effect_i18n:
    en: Flagellants automatically pass all Leadership-based tests they are required to take and may never
      become the warband leader.
    es: Los Flagelantes superan automáticamente todos los chequeos basados en Liderazgo que deban realizar
      y no pueden convertirse nunca en el líder de la banda.
  applies_to:
    profile_ids:
    - flagellants
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.witch-hunters.flagellants.fanatical
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology or mounts.'
