- id: warrior-priest--prayers
  name: Prayers
  effect: The Warrior-Priest may use the Prayers of Sigmar and begins with one randomly generated prayer. When gaining a new
    skill, the Warrior-Priest may learn a new Prayer instead. Prayer effects are intentionally not modelled in this file.
  source:
