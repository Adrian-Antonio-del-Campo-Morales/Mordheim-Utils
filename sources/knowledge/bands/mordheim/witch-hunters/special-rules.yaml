- id: band--human-maximum-characteristics
  name: Human Maximum Characteristics
  effect: 'Witch Hunter Captains, Witch Hunters, Warrior-Priests, Flagellants and Zealots use the Human racial maximum profile:
    M4, WS6, BS6, S4, T4, W3, I6, A4, Ld9. Warhounds do not gain Experience and therefore do not use advancement maximums.'
