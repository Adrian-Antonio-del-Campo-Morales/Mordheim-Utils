schema_version: 2
band_id: tileans
rules:
- id: captain--leader
  name: Leader
  effect: Any warrior within 6" of the Captain may use his Leadership characteristic when taking Leadership
    tests.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 1 Captain / Special Rules / Leader
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/tileans
  name_i18n:
    en: Leader
    es: Líder
  effect_i18n:
    en: 'Any warrior within 6" of the Captain may use his Leadership characteristic when

      taking Leadership tests.'
    es: Cualquier guerrero a 6" del Capitán puede usar su característica de Liderazgo al realizar chequeos
      de Liderazgo.
  applies_to:
    profile_ids:
    - captain
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.tileans.captain.leader
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology or mounts.'
- id: duelists--cloak-dagger
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: trait.counts-as-buckler
      scope: 'YES'
      binding:
        kind: trait
        id: trait.counts-as-buckler
        parameters:
          value: true
  name: Cloak & Dagger
  effect: A Duellist counts as using a buckler in close combat because of the defensive use of the cloak.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 5 Duelists / Special Rules / Cloak & Dagger
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/tileans
  name_i18n:
    en: Cloak & Dagger
    es: Capa y daga
  effect_i18n:
    en: A Duellist counts as using a buckler in close combat because of the defensive use of the cloak.
    es: Un Duelista cuenta como si usara una rodela en combate cuerpo a cuerpo debido al uso defensivo
      de la capa.
  applies_to:
    profile_ids:
    - duelists
- id: band--human-maximum-characteristics
  name: Human Maximum Characteristics
  effect: Tileans use the Human racial maximum profile (campaign.limit.racial-maximum.human).
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Racial Maximum Characteristics / Human
    url: https://mordheimer.net/docs/campaigns/experience
  name_i18n:
    en: Human Maximum Characteristics
    es: Características máximas humanas
  effect_i18n:
    en: Tileans use the Human racial maximum profile (campaign.limit.racial-maximum.human).
    es: Los Tileanos usan el perfil racial máximo humano (campaign.limit.racial-maximum.human).
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.tileans.band.human-maximum-characteristics
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: no effect applies to the isolated 1v1 duel or legal fighter skill/equipment
        construction.
- id: band--miraglean-crossbow-mastery
  name: Miraglean — Crossbow Mastery
  effect: Miraglean Heroes gain +1 to hit when using crossbows. The bonus applies only to crossbows.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / Miragleans
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/tileans
  name_i18n:
    en: Miraglean — Crossbow Mastery
    es: Miragleo — Maestría con la ballesta
  effect_i18n:
    en: Miraglean Heroes gain +1 to hit when using crossbows. The bonus applies only to crossbows.
    es: Los Héroes miragleos obtienen +1 para impactar al usar ballestas. El bonus solo aplica a ballestas.
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.tileans.band.miraglean-crossbow-mastery
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, or non-duel context.'
- id: band--miraglean-marksman-accuracy
  name: Miraglean — Marksman Accuracy
  effect: Miraglean Marksmen gain +1 to hit with any missile weapon they use.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / Miragleans
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/tileans
  name_i18n:
    en: Miraglean — Marksman Accuracy
    es: Miragleo — Precisión de tirador
  effect_i18n:
    en: Miraglean Marksmen gain +1 to hit with any missile weapon they use.
    es: Los Tiradores miragleos obtienen +1 para impactar con cualquier arma arrojadiza que usen.
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.tileans.band.miraglean-marksman-accuracy
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, or non-duel context.'
- id: band--miraglean-hatred-skaven
  name: Miraglean — Hatred of Skaven
  effect: All Miraglean warband members are subject to Hatred against Skaven. Hired Swords do not gain
    this Hatred.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / Miragleans
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/tileans
  name_i18n:
    en: Miraglean — Hatred of Skaven
    es: Miragleo — Odio a los skaven
  effect_i18n:
    en: All Miraglean warband members are subject to Hatred against Skaven. Hired Swords do not gain this
      Hatred.
    es: Todos los miembros de una banda miraglea están sujetos a Odio contra los skaven. Las Espadas a
      sueldo no ganan este Odio.
  applies_to:
    band: true
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.tileans.band.miraglean-hatred-skaven
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology or mounts.'
- id: band--miraglean-hired-sword-restriction
  name: Miraglean — Hired Sword Restriction
  effect: A Miraglean warband may not hire Skaven Hired Swords.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / Miragleans
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/tileans
  name_i18n:
    en: Miraglean — Hired Sword Restriction
    es: Miragleo — Restricción de Espadas a sueldo
  effect_i18n:
    en: A Miraglean warband may not hire Skaven Hired Swords.
    es: Una banda miraglea no puede contratar Espadas a sueldo skaven.
  applies_to:
