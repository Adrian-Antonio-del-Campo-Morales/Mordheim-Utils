- id: band--trantio-wealth
  name: Trantio — Wealth and Experience
  effect: A Trantio warband starts a one-off match with an extra 100 gc. In a Lustrian campaign it starts
    with 20% more gold crowns, which is 600 gc when the normal starting amount is 500 gc.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / Trantios
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/tileans
  name_i18n:
    en: Trantio — Wealth and Experience
    es: Trantio — Riqueza y experiencia
  effect_i18n:
    en: A Trantio warband starts a one-off match with an extra 100 gc. In a Lustrian campaign it starts
      with 20% more gold crowns, which is 600 gc when the normal starting amount is 500 gc.
    es: Una banda trantina comienza un enfrentamiento puntual con 100 coronas extra. En una campaña de
      Lustria comienza con un 20% más de coronas de oro, es decir, 600 coronas cuando la cantidad inicial
      normal es de 500 coronas.
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.tileans.band.trantio-wealth
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, or non-duel context.'
