- id: band--remasen-dark-elf-rout
  name: Remasen — Defiance Against Dark Elves
  effect: When fighting a Dark Elf warband, a Remasen warband may re-roll one failed Rout test. The second
    result must be accepted.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / Remasens
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/tileans
  name_i18n:
    en: Remasen — Defiance Against Dark Elves
    es: Remasén — Desafío contra los elfos oscuros
  effect_i18n:
    en: When fighting a Dark Elf warband, a Remasen warband may re-roll one failed Rout test. The second
      result must be accepted.
    es: Al luchar contra una banda de elfos oscuros, una banda remasén puede repetir un chequeo de Huida
      fallido. El segundo resultado debe aceptarse.
  applies_to:
    band: true
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.tileans.band.remasen-dark-elf-rout
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology or mounts.'
