      binding: null
      reason: "Deferred subsystem: psychology."
  name: Bear Handler
  effect: 'A Kislevite Warband that includes a Bear

    Tamer is allowed to purchase a Bear as a henchman. This

    bear has been trained to follow the Tamer''s commands, and

    so will automatically pass its stupidity tests when within 6"

    of the Bear Tamer (even if the Tamer has been Knocked

    Down or Stunned).'
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 – 1 Bear Tamer / Special Rules / Bear Handler
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/kislevites
  name_i18n:
    en: Bear Handler
    es: null
  effect_i18n:
