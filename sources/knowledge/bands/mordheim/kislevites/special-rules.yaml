- id: streltsi--gun-rest
  runtime:
    scope: "NO"
    implemented: "NO"
    grant: profile
    effects:
    - id: unimplemented.kislevites.streltsi.gun-rest
      scope: "NO"
      binding: null
      reason: "Out of scope: to-hit rolls."
  name: Gun-Rest
  effect: 'A Streltsi warrior armed with both halberd and

    handgun may use the halberd as a gun-rest. The warrior

    receives a +1 on his ‘to hit’ roll with the handgun, as long as

    he did not move that turn (this applies even if the warrior has

    a skill that allows him to move and shoot with his handgun –

    he must not move if he is to rest the gun).'
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 3 Streltsi / Special Rules / Gun-Rest
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/kislevites
