  name: Ancient Enemies
  effect: Kislevite warbands may never ally with Chaos warbands, including Possessed, Beastmen, Carnival
    of Chaos, Skaven, Dark Elves, Chaos Dwarfs, and other warbands the players judge sufficiently Chaotic.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special rules / Ancient Enemies
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/kislevites
  name_i18n:
    en: Ancient Enemies
    es: Enemigos ancestrales
  effect_i18n:
    en: Kislevite warbands may never ally with Chaos warbands, including Possessed, Beastmen, Carnival
      of Chaos, Skaven, Dark Elves, Chaos Dwarfs, and other warbands the players judge sufficiently Chaotic.
    es: Las bandas kislevitas nunca pueden aliarse con bandas del Caos, incluyendo Poseídos, Hombres bestia,
      Carnaval del Caos, Skaven, Elfos Oscuros, Enanos del Caos y otras bandas que los jugadores consideren
      suficientemente Caóticas.
  applies_to:
    band: true
