- id: druzhina-captain--inheritance
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.kislevites.druzhina-captain.inheritance
      scope: 'NO'
      binding: null
      reason: 'Out of scope: no effect applies to the isolated 1v1 duel or legal fighter skill/equipment construction.'
  name: Inheritance
  effect: When the Kislevite warband is first created, the Druzhina Captain is allowed to purchase one item from the Kislevite
    Warrior equipment list at half the normal cost. This item represents a treasured family heirloom that has been passed down
    through the generations. Losing an ancestral item is considered very disrespectful and if the item is ever lost (e.g. from
    a Robbed result on the Serious Injury chart), the Captain MUST replace it with a finely-made substitute as quickly as possible
    or risk being haunted by the angry spirits of his ancestors. To replace an ancestral item, the Captain must purchase the
    same item of equipment at 150% of its normal price. This higher cost represents the fine detail and valuable materials used
    in the item's manufacture. Until the item is replaced, the Captain suffers a -1 penalty to all tests and rolls to hit.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 1 Druzhina Captain / Special Rules / Inheritance
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/kislevites
  name_i18n:
    en: Inheritance
    es: null
  effect_i18n:
    en: 'When the Kislevite warband is first created, the

      Druzhina Captain is allowed to purchase one item from the

      Kislevite Warrior equipment list at half the normal cost. This

      item represents a treasured family heirloom that has been

      passed down through the generations. Losing an ancestral

      item is considered very disrespectful and if the item is ever

      lost (e.g. from a Robbed result on the Serious Injury chart),

      the Captain MUST replace it with a finely-made substitute as

      quickly as possible or risk being haunted by the angry spirits

      of his ancestors. To replace an ancestral item, the Captain

      must purchase the same item of equipment at 150% of its

      normal price. This higher cost represents the fine detail and

      valuable materials used in the item''s manufacture. Until the

      item is replaced, the Captain suffers a -1 penalty to all tests

      and rolls to hit.'
    es: null
  applies_to:
    profile_ids:
    - druzhina-captain
- id: bear-tamer--bear-handler
  runtime:
    scope: "LATER"
    implemented: "NO"
    grant: profile
    effects:
    - id: unimplemented.kislevites.bear-tamer.bear-handler
