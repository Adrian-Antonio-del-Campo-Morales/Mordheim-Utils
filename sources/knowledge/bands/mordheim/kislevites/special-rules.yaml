  name: Requires Bear Tamer
  effect: A Trained Bear may only be included in the warband if it includes a Bear Tamer, and it may not take part in a game
    in which the Bear Tamer does not take part.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Choice of warriors / Trained Bear
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/kislevites
  name_i18n:
    en: Requires Bear Tamer
    es: null
  effect_i18n:
    en: A Trained Bear may only be included in the warband if it includes a Bear Tamer, and it may not take part in a game
      in which the Bear Tamer does not take part.
    es: null
  applies_to:
    profile_ids:
    - trained-bear
- id: trained-bear--trained
  runtime:
    scope: 'LATER'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.kislevites.trained-bear.trained
      scope: 'LATER'
      binding: null
      reason: 'Deferred subsystem: psychology or mounts.'
  name: Trained
  effect: A bear doesn’t care about the warband's mission or enmity for other warbands – it’s just following the orders of its
    trainer. Sometimes it gets bored waiting for orders; for this reason Trained Bears are subject to the rules for Stupidity.
    If given ‘special attention’ by its trainer, it will mind a bit better, so a bear is not required to take these Stupidity
    tests if the warband's Bear Tamer is within 6". In fact this is the only member of the warband the bear will listen to;
    a Trained Bear will never use the warband leader’s Leadership for any tests it is required to take. It may use the Bear
    Tamer's leadership if within 6" of him however. Note that the warband cannot control the bear without a Bear Tamer. The
    Trained Bear may not be used in any game in which the warband's Bear Tamer does not take part (and this means that if the
    warband does not include a Bear Tamer at all, the warband must keep the bear staked back at camp until they hire a new one!).
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 1 Trained Bear / Special Rules / Trained
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/kislevites
  name_i18n:
    en: Trained
    es: null
  effect_i18n:
    en: A bear doesn’t care about the warband's mission or enmity for other warbands – it’s just following the orders of its
      trainer. Sometimes it gets bored waiting for orders; for this reason Trained Bears are subject to the rules for Stupidity.
      If given ‘special attention’ by its trainer, it will mind a bit better, so a bear is not required to take these Stupidity
      tests if the warband's Bear Tamer is within 6". In fact this is the only member of the warband the bear will listen
      to; a Trained Bear will never use the warband leader’s Leadership for any tests it is required to take. It may use the
      Bear Tamer's leadership if within 6" of him however. Note that the warband cannot control the bear without a Bear Tamer.
      The Trained Bear may not be used in any game in which the warband's Bear Tamer does not take part (and this means that
      if the warband does not include a Bear Tamer at all, the warband must keep the bear staked back at camp until they hire
      a new one!).
    es: null
  applies_to:
    profile_ids:
    - trained-bear
