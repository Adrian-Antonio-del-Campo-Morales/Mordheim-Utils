schema_version: 2
band_id: dwarf-treasure-hunters
rules:
- id: dwarf-noble--leader
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.dwarf-treasure-hunters.dwarf-noble.leader
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: psychology.
  name: Leader
  effect: >-
    Any models in the warband within 6" of the Dwarf Noble may use his Leadership instead of their
    own.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 1 Dwarf Noble / Special Rules / Leader
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/dwarf-treasure-hunters
  name_i18n:
    es: Líder
  effect_i18n:
    es: >-
      Todas las miniaturas de la banda a 6" del Noble enano pueden usar su Liderazgo en lugar del
      suyo propio.
  applies_to:
    profile_ids:
    - dwarf-noble
- id: dwarf-engineer--expert-weaponsmith
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.dwarf-treasure-hunters.dwarf-engineer.expert-weaponsmith
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: shooting.
  name: Expert Weaponsmith
  effect: >-
    A Dwarf Engineer is a master of mechanical devices. By using stronger construction materials and
    time-tested secrets of Dwarf engineering, a Dwarf Engineer can increase the distance the
    warband's missile weapons can shoot. Missile weapons bought from the warband's basic equipment
    lists have their range increased by 3" for pistols and 6" for crossbows and handguns. Range
    increases only apply in battles in which the Engineer takes part (though they do apply even if
    he is yet to enter the battlefield or has already been taken out of action in this battle). He
    has no effect on the equipment of Hired Swords.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 – 1 Dwarf Engineer / Special Rules / Expert Weaponsmith
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/dwarf-treasure-hunters
  name_i18n:
    es: Armero Experto
  effect_i18n:
    es: >-
      Un Ingeniero enano es un maestro de los dispositivos mecánicos. Usando materiales de
      construcción más resistentes y los secretos probados de la ingeniería enana, un Ingeniero
      enano puede aumentar la distancia a la que disparan las armas arrojadizas de la banda. Las
      armas arrojadizas compradas en las listas de equipo básicas de la banda ven su alcance
      aumentado en 3" para pistolas y 6" para ballestas y armas de fuego. Los aumentos de alcance
      solo aplican en las batallas en las que participa el Ingeniero (aunque aplican incluso si aún
      no ha entrado en el campo de batalla o ya ha sido retirado del combate en esta batalla). No
      tiene ningún efecto sobre el equipo de las Espadas a sueldo.
  applies_to:
    profile_ids:
    - dwarf-engineer
- id: dwarf-troll-slayers--deathwish
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.dwarf-treasure-hunters.dwarf-troll-slayers.deathwish
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: psychology.
  name: Deathwish
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 – 2 Dwarf Troll Slayers / Special Rules / Deathwish
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/dwarf-treasure-hunters
  name_i18n:
    es: Deseo de Muerte
  applies_to:
    profile_ids:
    - dwarf-troll-slayers
  rule_ref: shared-rule.deathwish
- id: dwarf-troll-slayers--slayer-skills
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: profile.skill-access
      scope: 'YES'
      binding:
        kind: profile
        id: profile.skill-access
        parameters:
          category: special
  name: Slayer Skills
  effect: >-
    Troll Slayers may choose a skill from the Troll Slayer Skill table instead of the normal Skill
    tables when they gain a new skill.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 – 2 Dwarf Troll Slayers / Special Rules / Slayer Skills
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/dwarf-treasure-hunters
  name_i18n:
    es: Habilidades de Matatrolles
  effect_i18n:
    es: >-
      Los Matatrolles pueden elegir una habilidad de la tabla de Habilidades de Matatrolles en lugar
      de las tablas de Habilidades normales cuando ganan una nueva habilidad.
  applies_to:
    profile_ids:
    - dwarf-troll-slayers
