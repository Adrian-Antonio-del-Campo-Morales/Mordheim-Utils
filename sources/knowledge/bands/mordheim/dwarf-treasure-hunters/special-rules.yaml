  name: Armour
  effect: Dwarfs never suffer movement penalties for wearing armour.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / Armour
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/dwarf-treasure-hunters
  name_i18n:
    en: Armour
    es: Armadura
  effect_i18n:
    en: Dwarfs never suffer movement penalties for wearing armour.
    es: Los enanos nunca sufren penalizaciones de movimiento por llevar armadura.
  applies_to:
    band: true
- id: band--hate-orcs-and-goblins
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.dwarf-treasure-hunters.band.hate-orcs-and-goblins
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology.'
  name: Hate Orcs and Goblins
  effect: All Dwarfs hate Orcs and Goblins.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / Hate Orcs and Goblins
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/dwarf-treasure-hunters
  name_i18n:
    en: Hate Orcs and Goblins
    es: Odio a orcos y goblins
  effect_i18n:
    en: All Dwarfs hate Orcs and Goblins.
    es: Todos los enanos odian a los orcos y los goblins.
  applies_to:
    band: true
- id: band--grudgebearers
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.dwarf-treasure-hunters.band.grudgebearers
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign.'
  name: Grudgebearers
  effect: A Dwarf warband may never include any kind of Elven Hired Sword or Dramatis Personae.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / Grudgebearers
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/dwarf-treasure-hunters
  name_i18n:
    en: Grudgebearers
    es: Portadores del agravio
  effect_i18n:
    en: A Dwarf warband may never include any kind of Elven Hired Sword or Dramatis Personae.
    es: Una banda enana nunca puede incluir ningún tipo de Espada a sueldo o Dramatis Personae élfico.
  applies_to:
    band: true
- id: band--incomparable-miners
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.dwarf-treasure-hunters.band.incomparable-miners
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign.'
  name: Incomparable Miners
  effect: When checking for wyrdstone at the end of a game, add +1 to the number of pieces found by the
    Dwarf warband.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / Incomparable Miners
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/dwarf-treasure-hunters
  name_i18n:
    en: Incomparable Miners
    es: Mineros incomparables
  effect_i18n:
    en: When checking for wyrdstone at the end of a game, add +1 to the number of pieces found by the
      Dwarf warband.
    es: Al buscar wyrdstone al final de una partida, añade +1 al número de fragmentos encontrados por
      la banda enana.
  applies_to:
    band: true
- id: band--dwarf-special-skills-master-of-blades
  kind: warband_skill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: skill.unbeatable-warrior
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.unbeatable-warrior
    - id: skill.sword-master
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.sword-master
  name: Master of Blades
  effect: This Dwarf’s martial skills surpass those of a normal warrior; he has fought unscathed against
    hordes of Orcs and Goblins. When using a weapon that has a Parry special rule, this hero parries successfully
    if he beats or matches his opponents highest ‘to hit’ roll, not just if he beats the roll. In addition,
    if this warrior is using two weapons that have the Parry special rule, he is allowed to parry two
    attacks (if his two dice match or beat the two highest Attack dice against him) instead of the normal
    maximum of one. Note that if this Dwarf has two Dwarf axes (as detailed above) he can reroll any failed
    parries.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Dwarf Special Skills / Master of Blades
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/dwarf-treasure-hunters
  name_i18n:
    en: Master of Blades
    es: Maestro de las hojas
  effect_i18n:
    en: 'This Dwarf’s martial skills surpass those of a normal warrior; he

      has fought unscathed against hordes of Orcs and Goblins. When

      using a weapon that has a Parry special rule, this hero parries

      successfully if he beats or matches his opponents highest ‘to hit’

      roll, not just if he beats the roll. In addition, if this warrior is

      using two weapons that have the Parry

      special rule, he is allowed to parry

      two attacks (if his two dice

      match or beat the two

      highest Attack dice

      against him) instead

      of the normal

      maximum of one.

      Note that if this

      Dwarf has two Dwarf

      axes (as detailed

      above) he can reroll any failed

      parries.'
    es: Las habilidades marciales de este enano superan las de un guerrero normal; ha luchado ileso contra
      hordas de orcos y goblins. Al usar un arma con la regla especial Aturdir (Parry), este héroe aturde
      con éxito si iguala o supera la tirada de 'impactar' más alta de su oponente, no solo si la supera.
      Además, si este guerrero usa dos armas con la regla especial Aturdir, se le permite aturdir dos
      ataques (si sus dos dados igualan o superan los dos dados de ataque más altos contra él) en lugar
      del máximo normal de uno. Nótese que si este enano lleva dos hachas enanas (como se detalla arriba)
      puede repetir cualquier aturdimiento fallido.
  applies_to:
    band: true
- id: band--dwarf-special-skills-extra-tough
  kind: warband_skill
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.dwarf-treasure-hunters.band.dwarf-special-skills-extra-tough
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: no effect applies to the isolated 1v1 duel or legal fighter skill/equipment
        construction.
  name: Extra Tough
  effect: This Dwarf is notorious for walking away from wounds that would kill a lesser being. When rolling
    on the Heroes Serious Injury chart for this Hero after a game in which he has been taken out of action,
    the dice may be re-rolled once. The result of this second dice roll must be accepted, even if it is
    a worse result.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Dwarf Special Skills / Extra Tough
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/dwarf-treasure-hunters
  name_i18n:
    en: Extra Tough
    es: Extra resistente
  effect_i18n:
    en: 'This Dwarf is notorious for walking away from wounds that

      would kill a lesser being. When rolling on the Heroes Serious

      Injury chart for this Hero after a game in which he has been

      taken out of action, the dice may be re-rolled once. The result

      of this second dice roll must be accepted, even if it is a worse

      result.'
    es: Este enano es famoso por sobrevivir a heridas que matarían a un ser inferior. Al tirar en la tabla
      de Heridas Graves de Héroes para este héroe tras una partida en la que haya sido retirado del combate,
      el dado puede repetirse una vez. El resultado de esta segunda tirada debe aceptarse, incluso si
      es peor.
  applies_to:
    band: true
- id: band--dwarf-special-skills-resource-hunter
  kind: warband_skill
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.dwarf-treasure-hunters.band.dwarf-special-skills-resource-hunter
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign.'
  name: Resource Hunter
  effect: This Dwarf is especially good at locating valuable resources. When rolling on the Exploration
    chart at the end of a game, the Hero may modify one dice roll by +1/-1.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Dwarf Special Skills / Resource Hunter.
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/dwarf-treasure-hunters
  name_i18n:
    en: Resource Hunter
    es: Cazador de recursos
  effect_i18n:
    en: 'This Dwarf is especially good at locating valuable resources.

      When rolling on the Exploration chart at the end of a game,

      the Hero may modify one dice roll by +1/-1.'
    es: Este enano es especialmente bueno localizando recursos valiosos. Al tirar en la tabla de Exploración
      al final de una partida, el Héroe puede modificar una tirada de dado en +1/-1.
  applies_to:
    band: true
- id: band--dwarf-special-skills-true-grit
  kind: warband_skill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: skill.tough-as-steel
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.tough-as-steel
  name: True Grit
  effect: Dwarfs are hardy individuals and this Hero is hardy even for a Dwarf! When rolling on the Injury
    table for this Hero, a roll of 1-3 is treated as knocked down, 4-5 as stunned, and 6 as out of action.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Dwarf Special Skills / True Grit
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/dwarf-treasure-hunters
  name_i18n:
    en: True Grit
    es: Entereza
  effect_i18n:
    en: 'Dwarfs are hardy individuals and this Hero is hardy even for

      a Dwarf! When rolling on the Injury table for this Hero, a roll

      of 1-3 is treated as knocked down, 4-5 as stunned, and 6 as

      out of action.'
    es: ¡Los enanos son individuos duros y este Héroe lo es incluso para un enano! Al tirar en la tabla
      de Heridas para este Héroe, un resultado de 1-3 se trata como Derribado, 4-5 como Aturdido y 6 como
      Fuera de combate.
  applies_to:
    band: true
- id: band--dwarf-special-skills-thick-skull
  kind: warband_skill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: skill.thick-skull
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.thick-skull
  name: Thick Skull
  effect: The Hero has a thick skull, even for a Dwarf. He has a 3+ save on a D6 to avoid being stunned.
    If the save is made, treat a stunned result as knocked down instead. If the Dwarf also wears a helmet,
    this save is 2+ instead of 3+ (this takes the place of the normal Helmet special rule).
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Dwarf Special Skills / Thick Skull
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/dwarf-treasure-hunters
  name_i18n:
    en: Thick Skull
    es: Cráneo grueso
  effect_i18n:
    en: 'The Hero has a thick skull, even for a Dwarf. He

      has a 3+ save on a D6 to avoid being stunned. If

      the save is made, treat a stunned result as knocked

      down instead. If the Dwarf also wears a helmet,

      this save is 2+ instead of 3+ (this takes the

      place of the normal Helmet special rule).'
    es: El Héroe tiene un cráneo grueso, incluso para un enano. Tiene una salvación de 3+ en un D6 para
      evitar quedar Aturdido. Si supera la salvación, trata un resultado de Aturdido como Derribado en
      su lugar. Si el enano además lleva casco, esta salvación es 2+ en lugar de 3+ (esto sustituye a
      la regla especial normal de Casco).
  applies_to:
    band: true
- id: band--slayer-special-skills-ferocious-charge
  kind: warband_skill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: skill.ferocious-charge
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.ferocious-charge
  name: Ferocious Charge
  effect: The Slayer may double his attacks on the turn in which he charges, but suffers a -1 to hit penalty
    that turn.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: TROLL SLAYER SKILLS / Ferocious Charge
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/dwarf-treasure-hunters
  name_i18n:
    en: Ferocious Charge
    es: Carga feroz
  effect_i18n:
    en: The Slayer may double his attacks on the turn in which he charges, but suffers a -1 to hit penalty
      that turn.
    es: El Matatrolles puede doblar sus ataques en el turno en que carga, pero sufre una penalización
      de -1 para impactar ese turno.
  eligibility:
  - dwarf-troll-slayers
  applies_to:
    band: true
- id: band--slayer-special-skills-monster-slayer
  eligibility:
  - dwarf-troll-slayers
  kind: warband_skill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: skill.monster-slayer
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.monster-slayer
  name: Monster Slayer
  effect: The Slayer always wounds on a 4+ regardless of the opponent's Toughness, unless his modified
    Strength would require a lower roll.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: TROLL SLAYER SKILLS / Monster Slayer
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/dwarf-treasure-hunters
  name_i18n:
    en: Monster Slayer
    es: Matamostro
  effect_i18n:
    en: The Slayer always wounds on a 4+ regardless of the opponent's Toughness, unless his modified Strength
      would require a lower roll.
    es: El Matatrolles siempre hiere con un 4+ sin importar la Resistencia del oponente, a menos que su
      Fuerza modificada requiera un resultado menor.
  applies_to:
    band: true
- id: band--slayer-special-skills-berserker
  eligibility:
  - dwarf-troll-slayers
  kind: warband_skill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: skill.berserker
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.berserker
  name: Berserker
  effect: The Slayer adds +1 to his close combat to-hit rolls during the turn in which he charges.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: TROLL SLAYER SKILLS / Berserker
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/dwarf-treasure-hunters
  name_i18n:
    en: Berserker
    es: Berserker
  effect_i18n:
    en: The Slayer adds +1 to his close combat to-hit rolls during the turn in which he charges.
    es: El Matatrolles añade +1 a sus tiradas para impactar en combate cuerpo a cuerpo durante el turno
      en que carga.
  applies_to:
    band: true
