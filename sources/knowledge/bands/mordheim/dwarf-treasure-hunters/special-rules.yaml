        scope: 'YES'
      - id: all-alone
        scope: 'NO'
  name: Deathwish
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 – 2 Dwarf Troll Slayers / Special Rules / Deathwish
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/dwarf-treasure-hunters
