- id: band--dwarf-special-skills-master-of-blades
  kind: warband_skill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: skill.unbeatable-warrior
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.unbeatable-warrior
    - id: skill.sword-master
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.sword-master
  name: Master of Blades
  effect: >-
    This Dwarf’s martial skills surpass those of a normal warrior; he has fought unscathed against
    hordes of Orcs and Goblins. When using a weapon that has a Parry special rule, this hero parries
    successfully if he beats or matches his opponents highest ‘to hit’ roll, not just if he beats
    the roll. In addition, if this warrior is using two weapons that have the Parry special rule, he
    is allowed to parry two attacks (if his two dice match or beat the two highest Attack dice
    against him) instead of the normal maximum of one. Note that if this Dwarf has two Dwarf axes
    (as detailed above) he can reroll any failed parries.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Dwarf Special Skills / Master of Blades
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/dwarf-treasure-hunters
  name_i18n:
    es: Maestro de las Hojas
  effect_i18n:
    es: >-
      Las habilidades marciales de este enano superan las de un guerrero normal; ha luchado ileso
      contra hordas de orcos y goblins. Al usar un arma con la regla especial Aturdir (Parry), este
      héroe aturde con éxito si iguala o supera la tirada de 'impactar' más alta de su oponente, no
      solo si la supera. Además, si este guerrero usa dos armas con la regla especial Aturdir, se le
      permite aturdir dos ataques (si sus dos dados igualan o superan los dos dados de ataque más
      altos contra él) en lugar del máximo normal de uno. Nótese que si este enano lleva dos hachas
      enanas (como se detalla arriba) puede repetir cualquier aturdimiento fallido.
  applies_to:
    band: true
