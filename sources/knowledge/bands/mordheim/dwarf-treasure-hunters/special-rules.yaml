schema_version: 2
band_id: dwarf-treasure-hunters
rules:
- id: dwarf-noble--leader
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.dwarf-treasure-hunters.dwarf-noble.leader
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology.'
  name: Leader
  effect: Any models in the warband within 6" of the Dwarf Noble may use his Leadership instead of their
    own.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 1 Dwarf Noble / Special Rules / Leader
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/dwarf-treasure-hunters
  name_i18n:
    en: Leader
    es: Líder
  effect_i18n:
    en: 'Any models in the warband within 6" of the Dwarf

      Noble may use his Leadership instead of their own.'
    es: Todas las miniaturas de la banda a 6" del Noble enano pueden usar su Liderazgo en lugar del suyo
      propio.
  applies_to:
    profile_ids:
    - dwarf-noble
- id: dwarf-engineer--expert-weaponsmith
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.dwarf-treasure-hunters.dwarf-engineer.expert-weaponsmith
      scope: 'NO'
      binding: null
      reason: 'Out of scope: shooting.'
  name: Expert Weaponsmith
  effect: A Dwarf Engineer is a master of mechanical devices. By using stronger construction materials
    and time-tested secrets of Dwarf engineering, a Dwarf Engineer can increase the distance the warband's
    missile weapons can shoot. Missile weapons bought from the warband's basic equipment lists have their
    range increased by 3" for pistols and 6" for crossbows and handguns. Range increases only apply in
    battles in which the Engineer takes part (though they do apply even if he is yet to enter the battlefield
    or has already been taken out of action in this battle). He has no effect on the equipment of Hired
    Swords.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 – 1 Dwarf Engineer / Special Rules / Expert Weaponsmith
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/dwarf-treasure-hunters
  name_i18n:
    en: Expert Weaponsmith
    es: Armero experto
  effect_i18n:
    en: A Dwarf Engineer is a master of mechanical devices. By using stronger construction materials and
      time-tested secrets of Dwarf engineering, a Dwarf Engineer can increase the distance the warband's
      missile weapons can shoot. Missile weapons bought from the warband's basic equipment lists have
      their range increased by 3" for pistols and 6" for crossbows and handguns. Range increases only
      apply in battles in which the Engineer takes part (though they do apply even if he is yet to enter
      the battlefield or has already been taken out of action in this battle). He has no effect on the
      equipment of Hired Swords.
    es: Un Ingeniero enano es un maestro de los dispositivos mecánicos. Usando materiales de construcción
      más resistentes y los secretos probados de la ingeniería enana, un Ingeniero enano puede aumentar
      la distancia a la que disparan las armas arrojadizas de la banda. Las armas arrojadizas compradas
      en las listas de equipo básicas de la banda ven su alcance aumentado en 3" para pistolas y 6" para
      ballestas y armas de fuego. Los aumentos de alcance solo aplican en las batallas en las que participa
      el Ingeniero (aunque aplican incluso si aún no ha entrado en el campo de batalla o ya ha sido retirado
      del combate en esta batalla). No tiene ningún efecto sobre el equipo de las Espadas a sueldo.
  applies_to:
    profile_ids:
    - dwarf-engineer
- id: dwarf-troll-slayers--deathwish
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.dwarf-treasure-hunters.dwarf-troll-slayers.deathwish
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology.'
  name: Deathwish
  effect: Troll Slayers seek an honourable death in combat. They are completely immune to all psychology
    and never need to test if fighting alone.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 – 2 Dwarf Troll Slayers / Special Rules / Deathwish
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/dwarf-treasure-hunters
  name_i18n:
    en: Deathwish
    es: Deseo de muerte
  effect_i18n:
    en: 'Troll Slayers seek an honourable death in

      combat. They are completely immune to all psychology and

      never need to test if fighting alone.'
    es: Los Matatrolles buscan una muerte honorable en combate. Son completamente inmunes a toda la psicología
      y nunca necesitan chequear si luchan solos.
  applies_to:
    profile_ids:
    - dwarf-troll-slayers
- id: dwarf-troll-slayers--slayer-skills
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: profile.skill-access
      scope: 'YES'
      binding:
        kind: profile
        id: profile.skill-access
        parameters:
          category: special
  name: Slayer Skills
  effect: Troll Slayers may choose a skill from the Troll Slayer Skill table instead of the normal Skill
    tables when they gain a new skill.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 – 2 Dwarf Troll Slayers / Special Rules / Slayer Skills
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/dwarf-treasure-hunters
  name_i18n:
    en: Slayer Skills
    es: Habilidades de Matatrolles
  effect_i18n:
    en: 'Troll Slayers may choose a skill from the Troll

      Slayer Skill table instead of the normal Skill tables when they

      gain a new skill.'
    es: Los Matatrolles pueden elegir una habilidad de la tabla de Habilidades de Matatrolles en lugar
      de las tablas de Habilidades normales cuando ganan una nueva habilidad.
  applies_to:
    profile_ids:
    - dwarf-troll-slayers
- id: band--hard-to-kill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: band
    effects:
    - id: skill.hard-to-kill
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.hard-to-kill
  name: Hard to Kill
  effect: Dwarfs are taken out of action only on a 6 on the Injury chart; 1-2 is Knocked Down and 3-5
    is Stunned.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / Hard to Kill
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/dwarf-treasure-hunters
  name_i18n:
    en: Hard to Kill
    es: Difíciles de matar
  effect_i18n:
    en: Dwarfs are taken out of action only on a 6 on the Injury chart; 1-2 is Knocked Down and 3-5 is
      Stunned.
    es: Los enanos se retiran del combate solo con un 6 en la tabla de Heridas; 1-2 es Derribado y 3-5
      es Aturdido.
  applies_to:
    band: true
- id: band--hard-head
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: band
    effects:
    - id: trait.concussion-immune
      scope: 'YES'
      binding:
        kind: trait
        id: trait.concussion-immune
        parameters:
          value: true
  name: Hard Head
  effect: Dwarfs ignore the special rules for maces, clubs and similar weapons.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / Hard Head
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/dwarf-treasure-hunters
  name_i18n:
    en: Hard Head
    es: Cabeza dura
  effect_i18n:
    en: Dwarfs ignore the special rules for maces, clubs and similar weapons.
    es: Los enanos ignoran las reglas especiales de mazas, garrotes y armas similares.
  applies_to:
    band: true
- id: band--armour
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.dwarf-treasure-hunters.band.armour
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: no effect applies to the isolated 1v1 duel or legal fighter skill/equipment
