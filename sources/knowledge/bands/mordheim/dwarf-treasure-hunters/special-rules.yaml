  name: Monster Slayer
  effect: >-
    The Slayer always wounds on a 4+ regardless of the opponent's Toughness, unless his modified
    Strength would require a lower roll.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: TROLL SLAYER SKILLS / Monster Slayer
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/dwarf-treasure-hunters
  name_i18n:
    es: Matamostro
  effect_i18n:
    es: >-
      El Matatrolles siempre hiere con un 4+ sin importar la Resistencia del oponente, a menos que
      su Fuerza modificada requiera un resultado menor.
  applies_to:
    band: true
