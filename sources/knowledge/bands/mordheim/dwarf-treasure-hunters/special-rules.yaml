    printed_page: 0
    section: TROLL SLAYER SKILLS / Ferocious Charge
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/dwarf-treasure-hunters
  name_i18n:
    es: Carga Feroz
  effect_i18n:
