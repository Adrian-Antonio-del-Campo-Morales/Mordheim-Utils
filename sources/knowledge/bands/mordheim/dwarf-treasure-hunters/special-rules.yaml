    implemented: 'YES'
    grant: selectable
    effects:
    - id: skill.ferocious-charge
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.ferocious-charge
  name: Ferocious Charge
  effect: >-
    The Slayer may double his attacks on the turn in which he charges, but suffers a -1 to hit
    penalty that turn.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: TROLL SLAYER SKILLS / Ferocious Charge
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/dwarf-treasure-hunters
  name_i18n:
    es: Carga Feroz
  effect_i18n:
    es: >-
      El Matatrolles puede doblar sus ataques en el turno en que carga, pero sufre una penalización
      de -1 para impactar ese turno.
  eligibility:
  - dwarf-troll-slayers
  applies_to:
    band: true
- id: band--slayer-special-skills-monster-slayer
  eligibility:
  - dwarf-troll-slayers
  kind: warband_skill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: skill.monster-slayer
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.monster-slayer
  name: Monster Slayer
  effect: >-
    The Slayer always wounds on a 4+ regardless of the opponent's Toughness, unless his modified
    Strength would require a lower roll.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: TROLL SLAYER SKILLS / Monster Slayer
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/dwarf-treasure-hunters
  name_i18n:
    es: Matamostro
  effect_i18n:
    es: >-
      El Matatrolles siempre hiere con un 4+ sin importar la Resistencia del oponente, a menos que
      su Fuerza modificada requiera un resultado menor.
  applies_to:
    band: true
- id: band--slayer-special-skills-berserker
