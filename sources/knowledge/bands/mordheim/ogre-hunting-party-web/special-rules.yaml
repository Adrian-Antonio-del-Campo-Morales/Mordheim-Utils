- id: band--ogre-hunting-skills
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: band
    effects:
    - id: profile.skill-access
      scope: 'YES'
      binding:
        kind: profile
        id: profile.skill-access
        parameters:
          category: special
    # The table grants the printed choice; each named member keeps its own
    # record, so an excluded member is never granted by the access itself.
  name: Ogre Hunting Party Special Skills
  effect: >-
    Crude Belch: Ogres and Gnoblars eat almost anything. A Hero with this 'condition' may unleash
    his noxious fumes on all enemies engaged in close combat. Those that do not pass a Ld test
    suffer a -1 'to hit' modifier for the turn. The Hero must wait until a new enemy engages him in
    combat before he relieves himself again. Scent Hound: the Ogre or Gnoblar has the keen nose of
    an expert tracker; the hero spots Hidden enemies from two times as far away as other warriors
    (ie, twice his Initiative value in inches). Maneater (Ogres only): this Ogre may immediately
    learn one skill from the Shooting or Academic skill lists; this skill may be taken only once.
    Bull Charge (Ogres only): when charging, an Ogre with this skill may attempt a single attack
    with a +1 'to hit' modifier rather than making his normal attacks; if successful the enemy model
    is automatically knocked down. Bellowing Roar (Leader only, Ogres only): this skill may only be
    taken by the warband leader, allowing him to reroll the first failed Rout test. Set Traps
    (Gnoblars only): Trappers are experts at dropping snares. A Trapper may set a trap if he spends
    a turn doing nothing else (he may not set traps if he's just recovered from being Knocked Down).
    Place a marker in base contact with the Trapper. When another model, friend or foe, moves within
    2" of the marker he risks setting off the trap: roll a D6. On a score of 3+ he has triggered the
    trap and suffers a S4 hit (note that the Trapper won't trigger his own traps). If the trap did
    not wound the model, the injured model has multiple wounds, or it didn't trigger, the 'victim'
    may finish his move; however, if the model was knocked Down or Stunned, place him 2" from the
    marker. Regardless whether the trap was triggered or not, the marker is removed. Infiltration
    (Gnoblars only): as the standard Infiltration skill. Netter (Gnoblars only): each game, the hero
    starts with 3 Nets; these may not be sold, traded, or given to another warrior; if not used
    during the game, they are assumed to be stashed away or fallen apart. The next game, the hero
    will start with 3 nets again, without penalty or cost.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Skills
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/ogre-hunting-party
  name_i18n:
    es: Habilidades Especiales de la Partida de Caza de Ogros
  effect_i18n:
    es: >-
      Eructo Basto: los Ogros y los Gnoblars comen casi cualquier cosa. Un Héroe con esta "afección"
      puede soltar sus vapores nocivos sobre todos los enemigos en combate cuerpo a cuerpo con él.
      Los que no superen una prueba de Liderazgo sufren un modificador de -1 por impactar durante el
      turno. El Héroe debe esperar a que un nuevo enemigo se enfrente a él en combate antes de
      aliviarse de nuevo. Olfato de Sabueso: el Ogro o Gnoblar tiene el olfato fino de un rastreador
      experto; el héroe detecta enemigos Ocultos al doble de distancia que otros guerreros (es
      decir, al doble de su valor de Iniciativa en pulgadas). Devorador de Hombres (solo Ogros):
      este Ogro puede aprender inmediatamente una habilidad de las listas de Disparo o Académicas;
      esta habilidad solo puede tomarse una vez. Carga de Toro (solo Ogros): al cargar, un Ogro con
      esta habilidad puede intentar un único ataque con un modificador de +1 por impactar en lugar
      de hacer sus ataques normales; si tiene éxito, el modelo enemigo queda automáticamente
      derribado. Rugido Estentóreo (solo Líder, solo Ogros): esta habilidad solo puede tomarla el
      líder de la banda, permitiéndole repetir la primera tirada de Huida fallida. Poner Trampas
      (solo Gnoblars): los Tramperos son expertos en colocar cepos. Un Trampero puede poner una
      trampa si pasa un turno sin hacer nada más (no puede poner trampas si acaba de recuperarse de
      estar Derribado). Coloca un marcador en contacto base con el Trampero. Cuando otro modelo,
      amigo o enemigo, se mueva a 2" del marcador corre el riesgo de activar la trampa: tira un D6.
      Con un resultado de 3+ ha activado la trampa y sufre un impacto de F4 (nota: el Trampero no
      activa sus propias trampas). Si la trampa no hirió al modelo, el modelo herido tiene varias
      heridas o no se activó, la 'víctima' puede terminar su movimiento; sin embargo, si el modelo
      quedó Derribado o Aturdido, colócalo a 2" del marcador. Independientemente de si la trampa se
      activó o no, el marcador se retira. Infiltración (solo Gnoblars): como la habilidad estándar
      de Infiltración. Redador (solo Gnoblars): en cada partida, el héroe comienza con 3 Redes; no
      pueden venderse, intercambiarse ni darse a otro guerrero; si no se usan durante la partida, se
      supone que quedan guardadas o se han descompuesto. En la siguiente partida, el héroe comenzará
      de nuevo con 3 redes, sin penalización ni coste.
  applies_to:
    band: true
    profile_ids:
    - ogre-hunter
    - trappers
    - sabre-baiter

