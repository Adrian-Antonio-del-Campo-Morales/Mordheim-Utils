    scope: 'NO'
    implemented: 'NO'
    grant: none
    effects:
    # No technique is granted here: the printed text names three Nets per game
    # for a Gnoblar hero and says nothing about the Night Goblin net charge, so
    # no netter operator belongs on this record.
    - id: band--ogre-hunting-skills-netter.net-supply
      scope: 'NO'
      binding: null
      reason: >-
        This clause supplies three Nets per game and regulates their restock and transfer; it grants
        no attack, defence or characteristic modifier in melee, and does not grant the Night Goblin
        net-charge technique. Using the nets requires the excluded throw producer; its already-caught
        victim may independently be supplied as condition.netted. Quantity three and the named Gnoblar
        recipients remain printed facts, not an unlimited technique. Restock between games and sale,
        trade or transfer restrictions belong to the excluded campaign/inventory lifecycle. This
        disposition follows the clause's content, not missing equipment lists or binding support.
