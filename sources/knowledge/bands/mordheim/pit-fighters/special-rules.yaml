- id: band--in-the-pit
  name: In the Pit!
  effect: A captured opponent may be sent to fight in the pits against one or more warriors from the Pit Fighter warband.
    If a Pit Fighter wins, that warrior gains +2 Experience and the warband receives the captive's armour and weapons plus
    50 gc. If a Pit Fighter loses, resolve death/injury normally but ignore Robbed, Captured, Hardened, Sold to the Pits and
    Survives Against the Odds; the Pit Fighter keeps its equipment. A victorious captive gains 50 gc and +2 Experience, then
    goes free on 4+; on 1-3 the captive remains held and may be sent to the pits again after later games.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / In the Pit!
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/pit-fighters
  name_i18n:
    en: In the Pit!
    es: null
  effect_i18n:
    en: A captured opponent may be sent to fight in the pits against one or more warriors from the Pit Fighter warband. If
      a Pit Fighter wins, that warrior gains +2 Experience and the warband receives the captive's armour and weapons plus
      50 gc. If a Pit Fighter loses, resolve death/injury normally but ignore Robbed, Captured, Hardened, Sold to the Pits
      and Survives Against the Odds; the Pit Fighter keeps its equipment. A victorious captive gains 50 gc and +2 Experience,
      then goes free on 4+; on 1-3 the captive remains held and may be sent to the pits again after later games.
    es: null
  applies_to:
