- id: dwarf-troll-slayer--hard-to-kill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: skill.hard-to-kill
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.hard-to-kill
  name: Hard to Kill
  effect: >-
    Dwarfs are tough, resilient individuals who can only be taken out of action on a roll of a 6
    instead of 5-6 when rolling on the Injury chart. Treat a roll of 1-2 as knocked down, 3-5 as
    stunned, and 6 as out of action.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 – 1 Dwarf Troll Slayer / Special Rules / Hard to Kill
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/pit-fighters
  name_i18n:
    es: Difíciles de Matar
  effect_i18n:
    es: >-
      Los enanos son individuos duros y resistentes que solo pueden ser puestos Fuera de combate con
      un resultado de 6 en lugar de 5-6 al tirar en la tabla de Heridas. Trata un resultado de 1-2
      como derribado, 3-5 como aturdido y 6 como Fuera de combate.
  applies_to:
    profile_ids:
    - dwarf-troll-slayer
- id: dwarf-troll-slayer--hard-head
  name: Hard Head
  effect: Dwarfs ignores the special rules for maces, clubs, etc. They are not easy to knock out!
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 – 1 Dwarf Troll Slayer / Special Rules / Hard Head
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/pit-fighters
  name_i18n:
    es: Cráneo Grueso
  effect_i18n:
    es: Los enanos ignoran las reglas especiales de mazas, porras, etc. ¡No es fácil dejarlos K.O.!
  applies_to:
    profile_ids:
    - dwarf-troll-slayer
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: trait.concussion-immune
      scope: 'YES'
      binding:
        kind: trait
        id: trait.concussion-immune
        parameters:
          value: true
- id: dwarf-troll-slayer--hate-orcs-and-goblins
  name: Hate Orcs and Goblins
  effect: >-
    All Dwarfs hate Orcs and Goblins. See the psychology section of the Mordheim rules for details
    on the effects of hatred.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 – 1 Dwarf Troll Slayer / Special Rules / Hate Orcs and Goblins
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/pit-fighters
  name_i18n:
    es: Odio a Orcos y Goblins
  effect_i18n:
    es: >-
      Todos los enanos odian a los orcos y goblins. Consulta la sección de psicología de las reglas
      de Mordheim para más detalles sobre los efectos del odio.
  applies_to:
    profile_ids:
    - dwarf-troll-slayer
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.pit-fighters.dwarf-troll-slayer.hate-orcs-and-goblins
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: psychology or mounts.
- id: dwarf-troll-slayer--grudgebearers
  name: Grudgebearers
  effect: >-
    Dwarfs hold an ancient grudge against Elves from the days when the two races fought for the
    supremacy of the Old World. If the Pit Fighters ever hire any kind of Elven Hired Sword, he will
    leave the warband immediately, he refuses to fight alongside these pansy Elves!
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 – 1 Dwarf Troll Slayer / Special Rules / Grudgebearers
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/pit-fighters
  name_i18n:
    es: Rencorosos
  effect_i18n:
    es: >-
      Los enanos guardan un rencor ancestral contra los elfos desde los días en que ambas razas
      lucharon por la supremacía del Viejo Mundo. Si los Luchadores de Foso contratan alguna vez
      cualquier tipo de Espada a Sueldo Elfa, esta abandonará la banda inmediatamente: ¡se niega a
      luchar junto a estos elfos acalorados!
  applies_to:
    profile_ids:
    - dwarf-troll-slayer
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.pit-fighters.dwarf-troll-slayer.grudgebearers
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: no effect applies to the isolated 1v1 duel or legal fighter skill/equipment
        construction.
- id: dwarf-troll-slayer--death-wish
  name: Death Wish
  effect: >-
    Troll Slayers seek an honourable death in combat. They are completely immune to all psychology
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 – 1 Dwarf Troll Slayer / Special Rules / Death Wish
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/pit-fighters
  name_i18n:
    es: Deseo de Muerte
  effect_i18n:
    es: >-
      Los Asesatrolls buscan una muerte honorable en combate. Son completamente inmunes a toda la
      psicología.
  applies_to:
    profile_ids:
    - dwarf-troll-slayer
  runtime:
    scope: LATER
    implemented: 'NO'
