- id: dwarf-troll-slayer--grudgebearers
  name: Grudgebearers
  effect: 'Dwarfs hold an ancient

    grudge against Elves from the days when the

    two races fought for the supremacy of the Old

    World. If the Pit Fighters ever hire any kind of

    Elven Hired Sword, he will leave the warband

    immediately, he refuses to fight alongside

    these pansy Elves!'
