- id: pursuers--evade
  name: Evade
  effect: When an enemy charges a Pursuer, the Pursuer may attempt to evade. On a successful Initiative
    test the charge counts as failed and the normal failed-charge rules apply.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 7 Pursuers / Special Rules / Evade
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/pit-fighters
  name_i18n:
    en: Evade
    es: Evadir
  effect_i18n:
    en: When an enemy charges a Pursuer, the Pursuer may attempt to evade. On a successful Initiative
      test the charge counts as failed and the normal failed-charge rules apply.
    es: Cuando un enemigo carga contra un Perseguidor, este puede intentar evadir. Con un chequeo de Iniciativa
      con éxito, la carga cuenta como fallida y se aplican las reglas normales de carga fallida.
  applies_to:
    profile_ids:
    - pursuers
  runtime:
