- id: band--pit-fighter-skill-force-of-will
  kind: warband_skill
  name: Force of Will
  effect: When taken Out of Action by losing the last Wound, roll D6 equal to or under Toughness. On success the warrior gets
    back up and may continue fighting. Repeat in each following round with a cumulative -1 modifier. If the warrior is taken
    Out of Action a second time, remove it normally.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Pit Fighter Skills / Force of Will
