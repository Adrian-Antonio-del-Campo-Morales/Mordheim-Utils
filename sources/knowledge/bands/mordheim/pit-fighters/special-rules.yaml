- id: band--fighting-styles
  name: Weapons & Armour — Fighting Styles
  effect: Pit Kings, Veterans, Pit Fighters and Pursuers must select one of the fighting styles in their
    appropriate equipment list; the style determines their initial weapons and armour. Troll Slayers and
    Ogres instead choose from the Ogre & Slayer Equipment List. A Pit Fighter may later change style by
    swapping styles with another warrior or buying a new style or its separate components. Heroes are
    not prevented from using other items if they later learn the appropriate skills. A Pit Fighter Henchman
    group may mix multiple fighting styles and its members do not need identical equipment.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / Weapons & Armour
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/pit-fighters
  name_i18n:
    en: Weapons & Armour — Fighting Styles
    es: 'Armas y armadura: estilos de lucha'
  effect_i18n:
    en: Pit Kings, Veterans, Pit Fighters and Pursuers must select one of the fighting styles in their
      appropriate equipment list; the style determines their initial weapons and armour. Troll Slayers
      and Ogres instead choose from the Ogre & Slayer Equipment List. A Pit Fighter may later change style
      by swapping styles with another warrior or buying a new style or its separate components. Heroes
      are not prevented from using other items if they later learn the appropriate skills. A Pit Fighter
      Henchman group may mix multiple fighting styles and its members do not need identical equipment.
    es: Los Reyes del Foso, Veteranos, Luchadores de Foso y Perseguidores deben seleccionar uno de los
      estilos de lucha de su lista de equipo correspondiente; el estilo determina sus armas y armadura
      iniciales. Los Asesatrolls y los Ogros eligen en su lugar de la Lista de Equipo de Ogro y Asesatrolls.
      Un Luchador de Foso puede cambiar de estilo más tarde intercambiándolo con otro guerrero o comprando
      un estilo nuevo o sus componentes por separado. No se impide a los héroes usar otros objetos si
      más tarde aprenden las habilidades apropiadas. Un grupo de secuaces Luchador de Foso puede mezclar
      varios estilos de lucha y sus miembros no necesitan equipo idéntico.
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: compiler.pit-fighter-fighting-styles
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: initial recruitment packages, gold costs, later purchases and swapping
        equipment between warband members require roster and campaign state.
- id: band--free-the-slaves
  name: Free the Slaves!
  effect: Pit Fighters hate slavers and will never sell captured opponents to slavers.
  source:
