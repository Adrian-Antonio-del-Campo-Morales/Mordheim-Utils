- id: ogre-pit-fighter--large
  name: Large
  effect: Ogre Pit Fighters are huge, lumbering creatures and therefore make tempting targets for archers.
    Any model may shoot at the Ogre Pit Fighter, even if he is not the closest target.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 1 Ogre Pit Fighter / Special Rules / Large
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/pit-fighters
  name_i18n:
    en: Large
    es: Grande
  effect_i18n:
    en: 'Ogre Pit Fighters are huge, lumbering

      creatures and therefore make tempting targets

      for archers. Any model may shoot at the Ogre

      Pit Fighter, even if he is not the closest target.'
    es: Los Luchadores de Foso Ogro son criaturas enormes y torpes y por tanto constituyen objetivos tentadores
      para los arqueros. Cualquier modelo puede disparar al Luchador de Foso Ogro, incluso si no es el
      objetivo más cercano.
  applies_to:
    profile_ids:
    - ogre-pit-fighter
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.pit-fighters.ogre-pit-fighter.large
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, or non-duel context.'
- id: ogre-pit-fighter--skills
  name: Skills
  effect: If the Ogre Pit Fighter becomes a Hero through The Lad's Got Talent, it may choose Combat, Strength
    and Pit Fighter Special Skills.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 1 Ogre Pit Fighter / Special Rules / Skills
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/pit-fighters
  name_i18n:
    en: Skills
    es: Habilidades
  effect_i18n:
    en: If the Ogre Pit Fighter becomes a Hero through The Lad's Got Talent, it may choose Combat, Strength
      and Pit Fighter Special Skills.
    es: Si el Luchador de Foso Ogro se convierte en Héroe mediante 'El mozo tiene talento', puede elegir
      Habilidades de Combate, Fuerza y Habilidades Especiales de Luchador de Foso.
  applies_to:
    profile_ids:
    - ogre-pit-fighter
  runtime:
    scope: 'YES'
    implemented: 'YES'
