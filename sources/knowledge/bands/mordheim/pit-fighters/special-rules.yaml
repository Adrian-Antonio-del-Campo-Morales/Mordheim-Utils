      binding:
        kind: compiler
        id: compiler.promoted-hero-skill-access
        parameters:
          allowed_skill_lists:
          - combat
          - strength
          - special
- id: ogre-pit-fighter--slow-witted
  name: Slow Witted
  effect: Although Ogres are capable of earning experience and bettering themselves, they are not the
    smartest creatures. Ogres only gain advances at half the rate of everyone else (i.e., they must accrue
    twice as much experience as normal to get an advance).
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 1 Ogre Pit Fighter / Special Rules / Slow Witted
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/pit-fighters
  name_i18n:
    en: Slow Witted
    es: Torpes
  effect_i18n:
    en: 'Although Ogres are capable of

      earning experience and bettering themselves,

      they are not the smartest creatures. Ogres

      only gain advances at half the rate of everyone

      else (i.e., they must accrue twice as much

      experience as normal to get an advance).'
    es: Aunque los ogros son capaces de ganar experiencia y superarse, no son las criaturas más listas.
      Los ogros solo ganan mejoras a la mitad del ritmo del resto (es decir, deben acumular el doble de
      experiencia de lo normal para obtener una mejora).
  applies_to:
    profile_ids:
    - ogre-pit-fighter
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.pit-fighters.ogre-pit-fighter.slow-witted
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, or non-duel context.'
