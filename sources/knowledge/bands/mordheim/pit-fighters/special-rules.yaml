    es: ¡Libertad a los esclavos!
  effect_i18n:
    en: Pit Fighters hate slavers and will never sell captured opponents to slavers.
    es: Los Luchadores de Foso odian a los tratantes de esclavos y jamás venderán oponentes capturados
