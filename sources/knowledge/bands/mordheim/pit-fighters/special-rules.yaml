- id: ogre-pit-fighter--slow-witted
  name: Slow Witted
  effect: >-
    Although Ogres are capable of earning experience and bettering themselves, they are not the
    smartest creatures. Ogres only gain advances at half the rate of everyone else (i.e., they must
    accrue twice as much experience as normal to get an advance).
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 1 Ogre Pit Fighter / Special Rules / Slow Witted
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/pit-fighters
  name_i18n:
    es: Torpes
  effect_i18n:
    es: >-
      Aunque los ogros son capaces de ganar experiencia y superarse, no son las criaturas más
      listas. Los ogros solo ganan mejoras a la mitad del ritmo del resto (es decir, deben acumular
      el doble de experiencia de lo normal para obtener una mejora).
  applies_to:
    profile_ids:
    - ogre-pit-fighter
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.pit-fighters.ogre-pit-fighter.slow-witted
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: campaign, shooting, movement, terrain, deployment, or non-duel context.
- id: band--pit-fighter-skill
  name: Pit Fighter
  effect: >-
    All Pit Fighters have the Pit Fighter skill: they gain +1 WS and +1 A when fighting in ruins,
    buildings or The Pit.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/pit-fighters
  name_i18n:
    es: Luchador de Foso
  effect_i18n:
    es: >-
      Todos los Luchadores de Foso tienen la habilidad Luchador de foso: ganan +1 HA y +1 A cuando
      luchan en ruinas, edificios o el Foso.
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.pit-fighters.band.pit-fighter-skill
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: campaign, shooting, movement, terrain, deployment, or non-duel context.
- id: band--hired-swords
  name: Hired Swords
  effect: Pit Fighters may hire all normally available Hired Swords except the Elf Ranger.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / Hired Swords
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/pit-fighters
  name_i18n:
    es: Espadas a Sueldo
  effect_i18n:
    es: >-
      Los Luchadores de Foso pueden contratar todas las Espadas a Sueldo normalmente disponibles,
      excepto el Guardabosques Elfo.
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.pit-fighters.band.hired-swords
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: no effect applies to the isolated 1v1 duel or legal fighter skill/equipment
        construction.
- id: band--fighting-styles
  name: Weapons & Armour — Fighting Styles
  effect: >-
    Pit Kings, Veterans, Pit Fighters and Pursuers must select one of the fighting styles in their
    appropriate equipment list; the style determines their initial weapons and armour. Troll Slayers
    and Ogres instead choose from the Ogre & Slayer Equipment List. A Pit Fighter may later change
    style by swapping styles with another warrior or buying a new style or its separate components.
    Heroes are not prevented from using other items if they later learn the appropriate skills. A
    Pit Fighter Henchman group may mix multiple fighting styles and its members do not need
    identical equipment.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / Weapons & Armour
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/pit-fighters
  name_i18n:
    es: 'Armas y Armadura: Estilos de Lucha'
  effect_i18n:
    es: >-
      Los Reyes del Foso, Veteranos, Luchadores de Foso y Perseguidores deben seleccionar uno de los
      estilos de lucha de su lista de equipo correspondiente; el estilo determina sus armas y
      armadura iniciales. Los Asesatrolls y los Ogros eligen en su lugar de la Lista de Equipo de
      Ogro y Asesatrolls. Un Luchador de Foso puede cambiar de estilo más tarde intercambiándolo con
      otro guerrero o comprando un estilo nuevo o sus componentes por separado. No se impide a los
      héroes usar otros objetos si más tarde aprenden las habilidades apropiadas. Un grupo de
      secuaces Luchador de Foso puede mezclar varios estilos de lucha y sus miembros no necesitan
      equipo idéntico.
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: compiler.pit-fighter-fighting-styles
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: initial recruitment packages, gold costs, later purchases and swapping
        equipment between warband members require roster and campaign state.
- id: band--free-the-slaves
  name: Free the Slaves!
  source:
