- id: band--in-the-pit
  name: In the Pit!
  effect: A captured opponent may be sent to fight in the pits against one or more warriors from the Pit
    Fighter warband. If a Pit Fighter wins, that warrior gains +2 Experience and the warband receives
    the captive's armour and weapons plus 50 gc. If a Pit Fighter loses, resolve death/injury normally
