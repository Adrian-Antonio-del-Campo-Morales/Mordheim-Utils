- id: ogre-pit-fighter--large
  name: Large
  effect: >-
    Ogre Pit Fighters are huge, lumbering creatures and therefore make tempting targets for archers.
    Any model may shoot at the Ogre Pit Fighter, even if he is not the closest target.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 1 Ogre Pit Fighter / Special Rules / Large
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/pit-fighters
  name_i18n:
    es: Grande
  effect_i18n:
    es: >-
      Los Luchadores de Foso Ogro son criaturas enormes y torpes y por tanto constituyen objetivos
      tentadores para los arqueros. Cualquier modelo puede disparar al Luchador de Foso Ogro,
      incluso si no es el objetivo más cercano.
  applies_to:
