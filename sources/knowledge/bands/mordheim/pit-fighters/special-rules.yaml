- id: band--fighting-styles
  name: Weapons & Armour — Fighting Styles
  effect: Pit Kings, Veterans, Pit Fighters and Pursuers must select one of the fighting styles in their appropriate equipment
    list; the style determines their initial weapons and armour. Troll Slayers and Ogres instead choose from the Ogre & Slayer
    Equipment List. A Pit Fighter may later change style by swapping styles with another warrior or buying a new style or
    its separate components. Heroes are not prevented from using other items if they later learn the appropriate skills. A
    Pit Fighter Henchman group may mix multiple fighting styles and its members do not need identical equipment.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / Weapons & Armour
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/pit-fighters
  name_i18n:
    en: Weapons & Armour — Fighting Styles
    es: null
  effect_i18n:
    en: Pit Kings, Veterans, Pit Fighters and Pursuers must select one of the fighting styles in their appropriate equipment
      list; the style determines their initial weapons and armour. Troll Slayers and Ogres instead choose from the Ogre &
      Slayer Equipment List. A Pit Fighter may later change style by swapping styles with another warrior or buying a new
      style or its separate components. Heroes are not prevented from using other items if they later learn the appropriate
      skills. A Pit Fighter Henchman group may mix multiple fighting styles and its members do not need identical equipment.
    es: null
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
