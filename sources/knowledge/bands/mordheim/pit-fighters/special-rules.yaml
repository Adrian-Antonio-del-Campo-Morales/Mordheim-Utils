- id: band--in-the-pit
  name: In the Pit!
  effect: >-
    A captured opponent may be sent to fight in the pits against one or more warriors from the Pit
    Fighter warband. If a Pit Fighter wins, that warrior gains +2 Experience and the warband
    receives the captive's armour and weapons plus 50 gc. If a Pit Fighter loses, resolve
    death/injury normally but ignore Robbed, Captured, Hardened, Sold to the Pits and Survives
    Against the Odds; the Pit Fighter keeps its equipment. A victorious captive gains 50 gc and +2
    Experience, then goes free on 4+; on 1-3 the captive remains held and may be sent to the pits
    again after later games.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / In the Pit!
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/pit-fighters
  name_i18n:
    es: ¡Al Foso!
  effect_i18n:
    es: >-
      Un oponente capturado puede ser enviado a luchar en los fosos contra uno o más guerreros de la
      banda de Luchadores de Foso. Si un Luchador de Foso gana, ese guerrero gana +2 de Experiencia
      y la banda recibe la armadura y las armas del cautivo más 50 coronas. Si un Luchador de Foso
      pierde, resuelve la muerte/herida con normalidad pero ignora Robado, Capturado, Endurecido,
      Vendido al foso y Sobrevive contra pronóstico; el Luchador de Foso conserva su equipo. Un
      cautivo victorioso gana 50 coronas y +2 de Experiencia, y luego queda libre con un 4+; con un
      1-3 el cautivo sigue retenido y puede ser enviado de nuevo a los fosos tras partidas
      posteriores.
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.pit-fighters.band.in-the-pit
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: campaign, shooting, movement, terrain, deployment, or non-duel context.
- id: band--pit-fighter-skill-bulging-biceps
  kind: warband_skill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: skill.mighty-biceps
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.mighty-biceps
  name: Bulging Biceps
  effect: >-
    The warrior ignores the penalty from the Heavy weapon special rule; a weapon's Strength bonus
    therefore applies in every round of close combat.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Pit Fighter Skills / Bulging Biceps
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/pit-fighters
  name_i18n:
    es: Bíceps Desbordantes
  effect_i18n:
    es: >-
      El guerrero ignora la penalización de la regla especial de Arma Pesada; el bonificador de
      Fuerza del arma se aplica por tanto en cada asalto de combate cuerpo a cuerpo.
  applies_to:
    band: true
- id: band--pit-fighter-skill-force-of-will
  kind: warband_skill
  name: Force of Will
  effect: >-
    When taken Out of Action by losing the last Wound, roll D6 equal to or under Toughness. On
    success the warrior gets back up and may continue fighting. Repeat in each following round with
    a cumulative -1 modifier. If the warrior is taken Out of Action a second time, remove it
    normally.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Pit Fighter Skills / Force of Will
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/pit-fighters
  name_i18n:
    es: Fuerza de Voluntad
  effect_i18n:
    es: >-
      Cuando sea puesto Fuera de combate por perder la última Herida, tira D6 igual o menor que su
      Resistencia. Con éxito, el guerrero se levanta y puede seguir luchando. Repite en cada asalto
