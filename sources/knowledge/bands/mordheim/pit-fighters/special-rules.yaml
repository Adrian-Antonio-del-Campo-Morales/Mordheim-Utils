schema_version: 2
band_id: pit-fighters
rules:
- id: pit-king--leader
  name: Leader
  effect: >-
    Any models in the warband within 6" of the King may use his Leadership instead of their own.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 1 Pit King / Special Rules / Leader
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/pit-fighters
  name_i18n:
    es: Líder
  effect_i18n:
    es: >-
      Todos los modelos de la banda a 6" del Rey pueden usar su Liderazgo en lugar del suyo propio.
  applies_to:
    profile_ids:
    - pit-king
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.pit-fighters.pit-king.leader
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: psychology or mounts.
- id: pit-king--pit-fighter
  name: Pit Fighter
  effect: This warrior has the warband's Pit Fighter skill.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 1 Pit King / Special Rules / Pit Fighter
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/pit-fighters
  name_i18n:
    es: Luchador de Foso
  effect_i18n:
    es: Este guerrero tiene la habilidad Luchador de foso de la banda.
  applies_to:
    profile_ids:
    - pit-king
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: trait.pit-fighter
      scope: 'YES'
      binding:
        kind: trait
        id: trait.pit-fighter
        parameters:
          value: true
