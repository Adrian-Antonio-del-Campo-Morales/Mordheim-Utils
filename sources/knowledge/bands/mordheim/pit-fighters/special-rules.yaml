  name: Hard to Kill
  effect: 'Dwarfs are tough, resilient

    individuals who can only be taken out of

    action on a roll of a 6 instead of 5-6 when

    rolling on the Injury chart. Treat a roll of 1-2

    as knocked down, 3-5 as stunned, and 6 as

    out of action.'
