- id: orc-shootaz--uncommon
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.black-orcs.orc-shootaz.uncommon
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: no effect applies to the isolated 1v1 duel or legal fighter skill/equipment
        construction.
  name: Uncommon
  effect: A warband may not hire more Shootaz than they have Boyz. If a boy dies and the Shootaz outnumber
    the Boyz, the next hire must be a boy so that the balance is restored.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / Orc Shootaz / Special Rules / Uncommon
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/black-orcs
  name_i18n:
    en: Uncommon
    es: Poco común
  effect_i18n:
    en: 'A warband may not

      hire more Shootaz than they

      have Boyz. If a boy dies and

      the Shootaz outnumber the

      Boyz, the next hire must be

      a boy so that the balance

      is restored.'
    es: Una banda no puede contratar más Disparadores que Chicos tenga. Si un chico muere y los Disparadores
      superan en número a los Chicos, la próxima contratación debe ser un chico para restablecer el equilibrio.
  applies_to:
    profile_ids:
    - orc-shootaz
- id: orc-nuttaz--unstable
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.black-orcs.orc-nuttaz.unstable
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology.'
  name: Unstable
  effect: These Orcs are not quite all there. They do not suffer from Animosity, but instead have a host
    of their own issues to deal with.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 4 Orc Nuttaz / Special Rules / Unstable
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/black-orcs
  name_i18n:
    en: Unstable
    es: Inestable
  effect_i18n:
    en: 'These Orcs are not quite all there. They do

      not suffer from Animosity, but instead have a host of

      their own issues to deal with.'
    es: Estos orcos no están del todo bien de la cabeza. No sufren Rencor, pero tienen infinidad de problemas
      propios con los que lidiar.
  applies_to:
    profile_ids:
    - orc-nuttaz
- id: orc-nuttaz--crazy
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.black-orcs.orc-nuttaz.crazy
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology.'
  name: Crazy
  effect: Nuttaz always pass any Leadership-based Tests they have to take. A side effect of this is that
    their minds are too far-gone and they may never learn Academic Skills should they become a Hero on
    an Advance Roll.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 4 Orc Nuttaz / Special Rules / Crazy
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/black-orcs
  name_i18n:
    en: Crazy
    es: Chalado
  effect_i18n:
    en: 'Nuttaz always pass any Leadership-based Tests

      they have to take. A side effect of this is that their

      minds are too far-gone and they may never learn

      Academic Skills should they become a Hero on an

      Advance Roll.'
    es: Los Chalados superan siempre cualquier chequeo basado en Liderazgo que deban realizar. Un efecto
      secundario de esto es que sus mentes están demasiado trastornadas y jamás podrán aprender Habilidades
      Académicas si se convierten en héroes mediante una tirada de mejora.
  applies_to:
    profile_ids:
    - orc-nuttaz
- id: orc-nuttaz--savage
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: skill.extra-attack
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.extra-attack
    - id: profile.equipment-restrictions
      scope: 'YES'
      binding:
        kind: profile
        id: profile.equipment-restrictions
        parameters:
          forbids:
          - armour
          - ranged-weapons
    - id: movement.compulsory-charge
      scope: 'NO'
      binding: null
      reason: Movement is outside the duel runtime.
    - id: psychology.leadership-restrictions
      scope: LATER
      binding: null
      reason: Psychology is deferred.
  name: Savage
  effect: Nuttaz must always run or charge their maximum distance towards the nearest opponent they can
    see. Friendly models do not block line of sight. Additionally they fight with an extra attack whilst
    in combat. This does not appear on their profile nor does it count towards the racial maximum. If
    no enemy is visible they are moved under the player’s control. They can never use any form of armour
    or ranged weapons. Nuttaz are also too unstable for other Boyz and can never have the Leader ability
    or use their Ld stat for rout tests, excepting them as being the only models left on the board.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 4 Orc Nuttaz / Special Rules / Savage
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/black-orcs
  name_i18n:
    en: Savage
    es: Salvaje
  effect_i18n:
    en: 'Nuttaz must always run or charge their

      maximum distance towards the nearest opponent

      they can see. Friendly models do not block line of

      sight. Additionally they fight with an extra attack

      whilst in combat. This does not appear on their

      profile nor does it count towards the racial maximum.

      If no enemy is visible they are moved under the

      player’s control. They can never use any form of

      armour or ranged weapons. Nuttaz

      are also too unstable for other Boyz and

      can never have the Leader ability or

      use their Ld stat for rout tests, excepting

      them as being the only models left on

      the board.'
    es: Los Chalados deben correr o cargar siempre su distancia máxima hacia el oponente visible más cercano.
      Los modelos amigos no bloquean la línea de visión. Además, luchan con un ataque extra mientras estén
      en combate. Esto no aparece en su perfil ni cuenta para el máximo racial. Si no hay enemigos visibles
      se mueven bajo el control del jugador. Nunca pueden usar armadura de ningún tipo ni armas a distancia.
      Los Chalados también son demasiado inestables para los demás Chicos y jamás pueden tener la capacidad
      de Líder ni usar su Ld para chequeos de huida, salvo que sean los únicos modelos que quedan en la
      mesa.
  applies_to:
    profile_ids:
    - orc-nuttaz
