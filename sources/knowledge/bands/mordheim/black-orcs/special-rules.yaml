    - troll
- id: troll--regeneration
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: skill.regeneration
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.regeneration
    - id: campaign.post-battle-injury
      scope: 'NO'
      binding: null
      reason: Post-battle injury is a campaign state.
  name: Regeneration
  effect: Trolls have a unique physiology that allows them to regenerate wounds. Whenever an enemy successfully
    inflicts a wound on a Troll roll a D6, on a result of 4 or more the wound is ignored and the Troll
    is unhurt. Trolls may not regenerate wounds caused by fire or fire-based magic. Trolls never roll
    for Injury after a battle, unless they were taken Out of Action by a Flaming weapon or spell. Then
    they roll after the battle as a normal Henchman.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 1 Troll / Special Rules / Regeneration
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/black-orcs
  name_i18n:
    en: Regeneration
    es: Regeneración
  effect_i18n:
    en: Trolls have a unique physiology that allows them to regenerate wounds. Whenever an enemy successfully
      inflicts a wound on a Troll roll a D6, on a result of 4 or more the wound is ignored and the Troll
      is unhurt. Trolls may not regenerate wounds caused by fire or fire-based magic. Trolls never roll
      for Injury after a battle, unless they were taken Out of Action by a Flaming weapon or spell. Then
      they roll after the battle as a normal Henchman.
    es: 'Los trolls tienen una fisiología única que les permite regenerar heridas. Siempre que un enemigo
      inflija con éxito una herida a un troll, tira 1D6: con un resultado de 4 o más la herida se ignora
      y el troll queda ileso. Los trolls no pueden regenerar heridas causadas por fuego o magia de fuego.
      Los trolls nunca tiran por heridas tras una batalla, salvo que hayan sido puestos Fuera de combate
      por un arma o hechizo ígneo; entonces tiran tras la batalla como un secuaz normal.'
  applies_to:
    profile_ids:
    - troll
- id: troll--dumb-monster
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.black-orcs.troll.dumb-monster
      scope: 'NO'
      binding: null
      reason: 'Out of scope: psychology.'
  name: Dumb Monster
  effect: A Troll is far too stupid to ever learn any new skills. Trolls do not gain experience.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 1 Troll / Special Rules / Dumb Monster
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/black-orcs
  name_i18n:
    en: Dumb Monster
    es: Monstruo tarugo
  effect_i18n:
    en: 'A Troll is far too stupid to ever learn any

      new skills. Trolls do not gain experience.'
    es: Un troll es demasiado estúpido para aprender nuevas habilidades. Los trolls no ganan experiencia.
  applies_to:
    profile_ids:
    - troll
- id: troll--always-hungry
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.black-orcs.troll.always-hungry
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign.'
  name: Always Hungry
  effect: A Troll requires an upkeep cost. This upkeep represents the copious amounts of food that must
    be fed to the Troll in order to keep him loyal to the warband. The warband must pay 20 gold crowns
    after every game in order to keep the Troll. If a warband lacks the gold to pay the upkeep, the Boss
    has the option to let him count as 2 members, letting the Troll cost only 5 crowns. However this does
    effectively drop your maximum warband size down to 11 models.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 1 Troll / Special Rules / Always Hungry
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/black-orcs
  name_i18n:
    en: Always Hungry
    es: Siempre hambriento
  effect_i18n:
    en: A Troll requires an upkeep cost. This upkeep represents the copious amounts of food that must
      be fed to the Troll in order to keep him loyal to the warband. The warband must pay 20 gold crowns
      after every game in order to keep the Troll. If a warband lacks the gold to pay the upkeep, the
      Boss has the option to let him count as 2 members, letting the Troll cost only 5 crowns. However
      this does effectively drop your maximum warband size down to 11 models.
    es: Un troll requiere un coste de manutención. Este coste representa las cantidades copiosas de comida
      que hay que darle al troll para mantenerlo leal a la banda. La banda debe pagar 20 coronas de oro
      tras cada partida para conservar al troll. Si la banda carece de oro para pagar la manutención,
      el Jefe tiene la opción de que cuente como 2 miembros, de modo que el troll solo cueste 5 coronas.
      Sin embargo, esto reduce efectivamente el tamaño máximo de tu banda a 11 modelos.
  applies_to:
    profile_ids:
    - troll
- id: troll--vomit-attack
  kind: profile_ability
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: weapon.vomit-attack
      scope: 'YES'
      binding:
        kind: mechanic
        id: weapon.vomit-attack
  name: Vomit Attack
  effect: Instead of his normal attacks, a Troll can regurgitate its highly corrosive digestive juices
    on an unfortunate hand-to-hand combat opponent. This is a single attack that automatically hits with
    a Strength of 5 and ignores armour saves.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 1 Troll / Special Rules / Vomit Attack
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/black-orcs
  name_i18n:
    en: Vomit Attack
    es: Ataque de vómito
  effect_i18n:
    en: Instead of his normal attacks, a Troll can regurgitate its highly corrosive digestive juices on
      an unfortunate hand-to-hand combat opponent. This is a single attack that automatically hits with
      a Strength of 5 and ignores armour saves.
    es: En lugar de sus ataques normales, un troll puede regurgitar sus jugos digestivos, altamente corrosivos,
      sobre un desdichado oponente en combate cuerpo a cuerpo. Es un ataque único que impacta automáticamente
      con una Fuerza de 5 e ignora las tiradas de salvación por armadura.
  applies_to:
    profile_ids:
