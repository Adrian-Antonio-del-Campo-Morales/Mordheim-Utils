  runtime:
    scope: "YES"
    implemented: "YES"
    grant: profile
    effects:
    - id: skill.extra-attack
      scope: "YES"
      binding:
        kind: mechanic
        id: skill.extra-attack
    - id: profile.equipment-restrictions
      scope: "YES"
      binding:
        kind: profile
        id: profile.equipment-restrictions
        parameters:
          forbids: [armour, ranged-weapons]
