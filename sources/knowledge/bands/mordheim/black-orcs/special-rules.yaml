  effect: The warrior has a thick skull even for an Orc. He has a special 3+ save on a D6 to avoid being
    stunned. If the save is made, treat a stunned result as knocked down instead. If the Orc also wears
    a helmet, this save is 2+ instead of 3+ (this takes the place of the normal helmet special rule).
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Black Orc Special Skills / ’ard ead
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/black-orcs
  name_i18n:
    en: ’ard ead
    es: Cráneo grueso
  effect_i18n:
    en: The warrior has a thick skull even for an Orc. He has a special 3+ save on a D6 to avoid being
      stunned. If the save is made, treat a stunned result as knocked down instead. If the Orc also wears
      a helmet, this save is 2+ instead of 3+ (this takes the place of the normal helmet special rule).
    es: El guerrero tiene el cráneo grueso incluso para ser un orco. Tiene una salvación especial de 3+
      con 1D6 para evitar ser aturdido. Si supera la salvación, trata un resultado de aturdido como derribado.
      Si el orco además lleva yelmo, esta salvación es de 2+ en lugar de 3+ (esto sustituye a la regla
      especial normal del yelmo).
