  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 1 Troll / Special Rules / Fear
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/black-orcs
  name_i18n:
    en: Fear
    es: Miedo
  effect_i18n:
    en: Trolls are frightening monsters which cause fear.
    es: Los trolls son monstruos aterradores que causan miedo.
  applies_to:
    profile_ids:
    - troll
