schema_version: 2
band_id: black-orcs
rules:
- id: black-orc-boss--leader
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.black-orcs.black-orc-boss.leader
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology.'
  name: Leader
  effect: Any warrior within 6" of the Boss may use his Leadership characteristic when taking Leadership
    tests.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 1 Black Orc Boss / Special Rules / Leader
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/black-orcs
  name_i18n:
    en: Leader
    es: Líder
  effect_i18n:
    en: 'Any warrior within 6" of the Boss may use his

      Leadership characteristic when taking Leadership tests.'
    es: Cualquier guerrero a 6" del Jefe puede usar su característica de Liderazgo cuando realice chequeos
      de Liderazgo.
  applies_to:
    profile_ids:
    - black-orc-boss
- id: black-orc-boss--black-orc
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: trait.natural-armour-save
      scope: 'YES'
      binding:
        kind: trait
        id: trait.natural-armour-save
        parameters:
          value: 6
    - id: trait.natural-armour-stacks
      scope: 'YES'
      binding:
        kind: trait
        id: trait.natural-armour-stacks
        parameters:
          value: true
  name: Black Orc
  effect: Model starts with a natural 6+ Armour Black Orc Save. This save may be combined with other equipment
    to improve it.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 1 Black Orc Boss / Special Rules / Black Orc
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/black-orcs
  name_i18n:
    en: Black Orc
    es: Orco Negro
  effect_i18n:
    en: Model starts with a natural 6+ Armour Black Orc Save. This save may be combined with other equipment
      to improve it.
    es: El modelo empieza con una tirada de salvación de Orco Negro natural de 6+. Esta salvación puede
      combinarse con otro equipo para mejorarla.
  applies_to:
    profile_ids:
    - black-orc-boss
- id: black-orc-boss--oi-behave
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.black-orcs.black-orc-boss.oi-behave
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology.'
  name: Oi Behave!
  effect: If any Henchman fails his Animosity test within 6” of the Boss, the player may opt to have the
    boss stamp his authority (and clenched fist) on the situation. The misbehaving Henchman will receive
    an automatic hit at the strength of the Orc player’s choosing. If the Henchman is still on his feet
    after his slap, he may add a number equal to the strength of the slap to his subsequent roll to determine
    the effects of Animosity. E.g. The player decides that the Boss will hit a misbehaving Henchman with
    a S2 slap. If the slap fails to Knock Down, Stun or Out of Action the Henchman, then he adds +2 to
    the Animosity Effect roll.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 1 Black Orc Boss / Special Rules / Oi Behave!
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/black-orcs
  name_i18n:
    en: Oi Behave!
    es: ¡Pórtate bien! (Oi Behave!)
  effect_i18n:
    en: 'If any Henchman fails his Animosity test

      within 6” of the Boss, the player may opt to have the

      boss stamp his authority (and clenched fist) on the

      situation.

      The misbehaving Henchman will receive an automatic

      hit at the strength of the Orc player’s choosing. If the

      Henchman is still on his feet after his slap, he may

      add a number equal to the strength of the slap to his

      subsequent roll to determine the effects of Animosity.

      E.g. The player decides that the Boss will hit a

      misbehaving Henchman with a S2 slap. If the slap fails

      to Knock Down, Stun or Out of Action the

      Henchman, then he adds +2 to the Animosity Effect

      roll.'
    es: 'Si algún secuaz falla su chequeo de Rencor a 6" del Jefe, el jugador puede optar por que el jefe
      imponga su autoridad (y su puño cerrado) en la situación. El secuaz que se porta mal recibirá un
      impacto automático con la Fuerza que elija el jugador orco. Si el secuaz sigue en pie tras el bofetón,
      puede sumar una cantidad igual a la Fuerza del bofetón a su tirada posterior para determinar los
      efectos del Rencor. Por ejemplo: el jugador decide que el Jefe golpee a un secuaz que se porta mal
      con un bofetón de F2. Si el bofetón no logra Derribar, Aturdir ni poner Fuera de combate al secuaz,
      este suma +2 a la tirada de Efecto de Rencor.'
  applies_to:
    profile_ids:
    - black-orc-boss
- id: black-orcs--black-orc
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
