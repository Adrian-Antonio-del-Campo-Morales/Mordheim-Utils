- id: band--let-the-goons-do-the-work
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.black-orcs.band.let-the-goons-do-the-work
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: mounts.
  name: Let the Goons Do the Work
  effect: >-
    Black Orcs do not ride mounts of any kind. Only normal Orcs in the warband may ride a boar or
    another permitted mount.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / Let the goons do the work
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/black-orcs
  name_i18n:
    es: Que Trabajen los Matones
  effect_i18n:
    es: >-
      Los Orcos Negros no montan monturas de ningún tipo. Solo los orcos normales de la banda pueden
      montar un jabalí u otra montura permitida.
  applies_to:
    band: true
- id: band--da-boss-is-dead
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.black-orcs.band.da-boss-is-dead
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: psychology.
  name: Da Boss Is Dead!
  effect: >-
    If the Boss is killed, a Black Orc takes over leadership before any other warrior regardless of
    relative experience, and the replacement automatically gains "Oi Behave!".
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / Da Boss is Dead!
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/black-orcs
  name_i18n:
    es: ¡El Jefe Ha Muerto!
  effect_i18n:
    es: >-
      Si el Jefe muere, un Orco Negro asume el liderazgo antes que cualquier otro guerrero
      independientemente de su experiencia relativa, y el sustituto gana automáticamente '¡Pórtate
      bien! (Oi Behave!)'.
  applies_to:
    band: true
- id: band--animosity
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.black-orcs.band.animosity
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: psychology.
  name: Animosity
  effect: >-
    At the start of the Orc player's turn, roll a D6 for each Orc or Goblin Henchman not engaged in
    hand-to-hand combat. On a 1, roll another D6: 1 = attack the nearest eligible friendly
    Orc/Goblin Henchman or Hired Sword if possible (charge and fight one round; otherwise shoot the
    nearest eligible friendly model if armed with a missile weapon); if no valid target exists,
    treat as 2-5. 2-5 = the warrior may do nothing else that turn, but may defend itself if
    attacked. 6 = immediately make an extra move as quickly as possible toward the nearest visible
    enemy, charging if possible; if no enemy is visible, make a normal move. If the extra move puts
    an enemy in charge range, the warrior must charge during its normal Movement phase.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / Animosity
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/black-orcs
  name_i18n:
    es: Rencor
  effect_i18n:
    es: >-
      Al inicio del turno del jugador orco, tira 1D6 por cada secuaz orco o goblin que no esté en
      combate cuerpo a cuerpo. Con un 1, tira otro 1D6: 1 = ataca al secuaz orco/goblin amigo u
      Espada a Sueldo elegible más cercano si es posible (carga y lucha un asalto; de lo contrario,
      dispara al modelo amigo elegible más cercano si está armado con un arma de misil); si no
      existe objetivo válido, trátalo como 2-5. 2-5 = el guerrero no puede hacer nada más ese
      asalto, pero puede defenderse si lo atacan. 6 = haz inmediatamente un movimiento extra lo más
      rápido posible hacia el enemigo visible más cercano, cargando si es posible; si no hay enemigo
      visible, realiza un movimiento normal. Si el movimiento extra pone a un enemigo en alcance de
      carga, el guerrero debe cargar durante su fase normal de Movimiento.
  applies_to:
    band: true
- id: band--black-orc-special-skills
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: band
    effects:
    - id: profile.skill-access
      scope: 'YES'
      binding:
        kind: profile
        id: profile.skill-access
        parameters:
          category: special
  name: Black Orc Special Skills
  effect: >-
    Black Orc Heroes may use the following Skill list instead of the standard skill lists available
    to them.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Black Orc Special Skills
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/black-orcs
  name_i18n:
    es: Habilidades Especiales de los Orcos Negros
  effect_i18n:
    es: >-
      Los héroes orcos negros pueden usar la siguiente lista de habilidades en lugar de las listas
      de habilidades estándar disponibles para ellos.
  applies_to:
    band: true
- id: band--black-orc-special-skills-proven-warrior
  kind: warband_skill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: compiler.proven-warrior
      scope: 'YES'
      binding:
        kind: compiler
        id: compiler.proven-warrior
  name: Proven Warrior
  effect: >-
    This young warrior has proven himself worthy of his Black Orc heritage. This skill may only be
    taken by a Young’un with the Black Orc blood ability and 25 experience. Once he gains this
    skill, the model is now considered a full Black Orc Warrior (yet still retains the title of
    Young’un). He follows all the rules for Black Orcs and uses their equipment list and has access
    to the same skill lists as a Black Orc.
  source:
    manual: mordheimer.net
