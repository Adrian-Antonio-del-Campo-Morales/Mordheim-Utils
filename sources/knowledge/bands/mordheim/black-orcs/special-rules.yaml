  name: Animosity
  effect: 'At the start of the Orc player''s turn, roll a D6 for each Orc or Goblin Henchman not engaged in hand-to-hand combat.
    On a 1, roll another D6: 1 = attack the nearest eligible friendly Orc/Goblin Henchman or Hired Sword if possible (charge
    and fight one round; otherwise shoot the nearest eligible friendly model if armed with a missile weapon); if no valid
    target exists, treat as 2-5. 2-5 = the warrior may do nothing else that turn, but may defend itself if attacked. 6 = immediately
    make an extra move as quickly as possible toward the nearest visible enemy, charging if possible; if no enemy is visible,
    make a normal move. If the extra move puts an enemy in charge range, the warrior must charge during its normal Movement
    phase.'
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / Animosity
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/black-orcs
  name_i18n:
    en: Animosity
    es: null
  effect_i18n:
    en: 'At the start of the Orc player''s turn, roll a D6 for each Orc or Goblin Henchman not engaged in hand-to-hand combat.
      On a 1, roll another D6: 1 = attack the nearest eligible friendly Orc/Goblin Henchman or Hired Sword if possible (charge
      and fight one round; otherwise shoot the nearest eligible friendly model if armed with a missile weapon); if no valid
      target exists, treat as 2-5. 2-5 = the warrior may do nothing else that turn, but may defend itself if attacked. 6 =
      immediately make an extra move as quickly as possible toward the nearest visible enemy, charging if possible; if no
      enemy is visible, make a normal move. If the extra move puts an enemy in charge range, the warrior must charge during
      its normal Movement phase.'
    es: null
  applies_to:
    band: true
