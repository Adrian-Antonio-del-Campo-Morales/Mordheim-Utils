- id: band--animosity
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.black-orcs.band.animosity
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology.'
  name: Animosity
  effect: >-
    At the start of the Orc player's turn, roll a D6 for each Orc or Goblin Henchman not engaged in
    hand-to-hand combat. On a 1, roll another D6: 1 = attack the nearest eligible friendly
    Orc/Goblin Henchman or Hired Sword if possible (charge and fight one round; otherwise shoot the
    nearest eligible friendly model if armed with a missile weapon); if no valid target exists,
    treat as 2-5. 2-5 = the warrior may do nothing else that turn, but may defend itself if
    attacked. 6 = immediately make an extra move as quickly as possible toward the nearest visible
    enemy, charging if possible; if no enemy is visible, make a normal move. If the extra move puts
    an enemy in charge range, the warrior must charge during its normal Movement phase.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / Animosity
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/black-orcs
  name_i18n:
    en: Animosity
    es: Rencor (Animosity)
  effect_i18n:
    en: 'At the start of the Orc player''s turn, roll a D6 for each Orc or Goblin Henchman not engaged
      in hand-to-hand combat. On a 1, roll another D6: 1 = attack the nearest eligible friendly Orc/Goblin
      Henchman or Hired Sword if possible (charge and fight one round; otherwise shoot the nearest eligible
      friendly model if armed with a missile weapon); if no valid target exists, treat as 2-5. 2-5 = the
      warrior may do nothing else that turn, but may defend itself if attacked. 6 = immediately make an
      extra move as quickly as possible toward the nearest visible enemy, charging if possible; if no
      enemy is visible, make a normal move. If the extra move puts an enemy in charge range, the warrior
      must charge during its normal Movement phase.'
    es: 'Al inicio del turno del jugador orco, tira 1D6 por cada secuaz orco o goblin que no esté en combate
      cuerpo a cuerpo. Con un 1, tira otro 1D6: 1 = ataca al secuaz orco/goblin amigo u Espada a Sueldo
      elegible más cercano si es posible (carga y lucha un asalto; de lo contrario, dispara al modelo
      amigo elegible más cercano si está armado con un arma de misil); si no existe objetivo válido, trátalo
      como 2-5. 2-5 = el guerrero no puede hacer nada más ese asalto, pero puede defenderse si lo atacan.
      6 = haz inmediatamente un movimiento extra lo más rápido posible hacia el enemigo visible más cercano,
      cargando si es posible; si no hay enemigo visible, realiza un movimiento normal. Si el movimiento
      extra pone a un enemigo en alcance de carga, el guerrero debe cargar durante su fase normal de Movimiento.'
  applies_to:
    band: true
