- id: younguns--black-orc-blood
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.black-orcs.younguns.black-orc-blood
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign.'
  name: Black Orc Blood
  effect: One Young’un may be upgraded to a Black Orc Young’un for 10gc. This upgrade allows him to take
    the ‘Proven Warrior’ skill upgrade, thus making him a fully-fledged Black Orc Warrior.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 – 2 Young’uns / Special Rules / Black Orc Blood
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/black-orcs
  name_i18n:
    en: Black Orc Blood
    es: Sangre de Orco Negro
  effect_i18n:
    en: 'One Young’un may be upgraded to

      a Black Orc Young’un for 10gc. This upgrade allows

      him to take the ‘Proven Warrior’ skill upgrade, thus

      making him a fully-fledged Black Orc Warrior.'
    es: Un Jóven puede ascendido a Jóven Orco Negro por 10 coronas. Esta mejora le permite escoger la
      mejora de habilidad 'Guerrero probado', convirtiéndose así en un guerrero Orco Negro plenamente
      consolidado.
  applies_to:
    profile_ids:
    - younguns
- id: orc-boyz--animosity
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.black-orcs.orc-boyz.animosity
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology.'
  name: Animosity
  effect: Subject to the warband's Animosity rule. At the start of the Orc player's turn, roll a D6 for
    this Orc Henchman if it is not in hand-to-hand combat; on a 1, roll on the Animosity result table.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / Orc Boyz / Special Rules / Animosity
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/black-orcs
  name_i18n:
    en: Animosity
    es: Rencor (Animosity)
  effect_i18n:
    en: Subject to the warband's Animosity rule. At the start of the Orc player's turn, roll a D6 for
      this Orc Henchman if it is not in hand-to-hand combat; on a 1, roll on the Animosity result table.
    es: Sujeto a la regla especial Rencor de la banda. Al inicio del turno del jugador orco, tira 1D6
      por este secuaz orco si no está en combate cuerpo a cuerpo; con un 1, tira en la tabla de resultados
      de Rencor.
  applies_to:
    profile_ids:
    - orc-boyz
