  name: proven warrior
  effect: This young warrior has proven himself worthy of his Black Orc heritage. This skill may only
    be taken by a Young’un with the Black Orc blood ability and 25 experience. Once he gains this skill,
    the model is now considered a full Black Orc Warrior (yet still retains the title of Young’un). He
    follows all the rules for Black Orcs and uses their equipment list and has access to the same skill
    lists as a Black Orc.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Black Orc Special Skills / proven warrior
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/black-orcs
  name_i18n:
    en: proven warrior
    es: Guerrero probado
  effect_i18n:
    en: 'This young warrior has proven himself worthy of his

      Black Orc heritage. This skill may only be taken by a

      Young’un with the Black Orc blood ability and 25

      experience. Once he gains this skill, the model is now

      considered a full Black Orc Warrior (yet still retains

      the title of Young’un). He follows all the rules for

      Black Orcs and uses their equipment list and has

      access to the same skill lists as a Black Orc.'
    es: Este joven guerrero ha demostrado ser digno de su herencia de Orco Negro. Esta habilidad solo
      puede ser elegida por un Jóven con la capacidad Sangre de Orco Negro y 25 puntos de experiencia.
      Una vez que obtiene esta habilidad, el modelo se considera un guerrero Orco Negro plenamente consolidado
      (aunque aún conserva el título de Jóven). Sigue todas las reglas de los Orcos Negros, usa su lista
      de equipo y tiene acceso a las mismas listas de habilidades que un Orco Negro.
  applies_to:
    band: true
