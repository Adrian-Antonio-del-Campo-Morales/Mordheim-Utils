schema_version: 2
band_id: black-orcs
rules:
- id: black-orc-boss--leader
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.black-orcs.black-orc-boss.leader
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: psychology.
  name: Leader
  effect: >-
    Any warrior within 6" of the Boss may use his Leadership characteristic when taking Leadership
    tests.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 1 Black Orc Boss / Special Rules / Leader
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/black-orcs
  name_i18n:
    es: Líder
  effect_i18n:
    es: >-
      Cualquier guerrero a 6" del Jefe puede usar su característica de Liderazgo cuando realice
      chequeos de Liderazgo.
  applies_to:
    profile_ids:
    - black-orc-boss
- id: black-orc-boss--black-orc
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: trait.natural-armour-save
      scope: 'YES'
      binding:
        kind: trait
        id: trait.natural-armour-save
        parameters:
          value: 6
    - id: trait.natural-armour-stacks
      scope: 'YES'
      binding:
        kind: trait
        id: trait.natural-armour-stacks
        parameters:
          value: true
  name: Black Orc
  effect: >-
    Model starts with a natural 6+ Armour Black Orc Save. This save may be combined with other
    equipment to improve it.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 1 Black Orc Boss / Special Rules / Black Orc
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/black-orcs
  name_i18n:
    es: Orco Negro
  effect_i18n:
    es: >-
      El modelo empieza con una tirada de salvación de Orco Negro natural de 6+. Esta salvación
      puede combinarse con otro equipo para mejorarla.
  applies_to:
    profile_ids:
    - black-orc-boss
- id: black-orc-boss--oi-behave
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.black-orcs.black-orc-boss.oi-behave
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: psychology.
  name: Oi Behave!
  effect: >-
    If any Henchman fails his Animosity test within 6” of the Boss, the player may opt to have the
    boss stamp his authority (and clenched fist) on the situation. The misbehaving Henchman will
    receive an automatic hit at the strength of the Orc player’s choosing. If the Henchman is still
    on his feet after his slap, he may add a number equal to the strength of the slap to his
    subsequent roll to determine the effects of Animosity. E.g. The player decides that the Boss
    will hit a misbehaving Henchman with a S2 slap. If the slap fails to Knock Down, Stun or Out of
    Action the Henchman, then he adds +2 to the Animosity Effect roll.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 1 Black Orc Boss / Special Rules / Oi Behave!
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/black-orcs
  name_i18n:
    es: ¡Pórtate Bien! (Oi Behave!)
  effect_i18n:
    es: >-
      Si algún secuaz falla su chequeo de Rencor a 6" del Jefe, el jugador puede optar por que el
      jefe imponga su autoridad (y su puño cerrado) en la situación. El secuaz que se porta mal
      recibirá un impacto automático con la Fuerza que elija el jugador orco. Si el secuaz sigue en
      pie tras el bofetón, puede sumar una cantidad igual a la Fuerza del bofetón a su tirada
      posterior para determinar los efectos del Rencor. Por ejemplo: el jugador decide que el Jefe
      golpee a un secuaz que se porta mal con un bofetón de F2. Si el bofetón no logra Derribar,
      Aturdir ni poner Fuera de combate al secuaz, este suma +2 a la tirada de Efecto de Rencor.
  applies_to:
    profile_ids:
    - black-orc-boss
- id: black-orcs--black-orc
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: trait.natural-armour-save
      scope: 'YES'
      binding:
        kind: trait
        id: trait.natural-armour-save
        parameters:
          value: 6
    - id: trait.natural-armour-stacks
      scope: 'YES'
      binding:
        kind: trait
        id: trait.natural-armour-stacks
        parameters:
          value: true
  name: Black Orc
  effect: >-
    Model starts with a natural 6+ Armour Black Orc Save. This save may be combined with other
    equipment to improve it.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 – 2 Black Orcs / Special Rules / Black Orc
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/black-orcs
  name_i18n:
    es: Orco Negro
  effect_i18n:
    es: >-
      El modelo empieza con una tirada de salvación de Orco Negro natural de 6+. Esta salvación
      puede combinarse con otro equipo para mejorarla.
  applies_to:
    profile_ids:
    - black-orcs
- id: younguns--black-orc-blood
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.black-orcs.younguns.black-orc-blood
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: campaign.
  name: Black Orc Blood
  effect: >-
    One Young’un may be upgraded to a Black Orc Young’un for 10gc. This upgrade allows him to take
    the ‘Proven Warrior’ skill upgrade, thus making him a fully-fledged Black Orc Warrior.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 – 2 Young’uns / Special Rules / Black Orc Blood
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/black-orcs
  name_i18n:
    es: Sangre de Orco Negro
  effect_i18n:
    es: >-
      Un Jóven puede ascendido a Jóven Orco Negro por 10 coronas. Esta mejora le permite escoger la
      mejora de habilidad 'Guerrero probado', convirtiéndose así en un guerrero Orco Negro
      plenamente consolidado.
  applies_to:
    profile_ids:
    - younguns
- id: orc-boyz--animosity
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.black-orcs.orc-boyz.animosity
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: psychology.
  name: Animosity
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / Orc Boyz / Special Rules / Animosity
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/black-orcs
  name_i18n:
    es: Rencor
  applies_to:
    profile_ids:
    - orc-boyz
  rule_ref: shared-rule.animosity
- id: orc-shootaz--animosity
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.black-orcs.orc-shootaz.animosity
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: psychology.
  name: Animosity
  effect: >-
    Subject to the warband's Animosity rule. At the start of the Orc player's turn, roll a D6 for
    this Orc Henchman if it is not in hand-to-hand combat; on a 1, roll on the Animosity result
    table.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / Orc Shootaz / Special Rules / Animosity
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/black-orcs
  name_i18n:
    es: Rencor
  effect_i18n:
    es: >-
      Sujeto a la regla especial Rencor de la banda. Al inicio del turno del jugador orco, tira 1D6
      por este secuaz orco si no está en combate cuerpo a cuerpo; con un 1, tira en la tabla de
      resultados de Rencor.
  applies_to:
    profile_ids:
    - orc-shootaz
- id: orc-shootaz--uncommon
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.black-orcs.orc-shootaz.uncommon
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: no effect applies to the isolated 1v1 duel or legal fighter skill/equipment
        construction.
  name: Uncommon
  effect: >-
    A warband may not hire more Shootaz than they have Boyz. If a boy dies and the Shootaz outnumber
    the Boyz, the next hire must be a boy so that the balance is restored.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / Orc Shootaz / Special Rules / Uncommon
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/black-orcs
  name_i18n:
    es: Poco Común
  effect_i18n:
    es: >-
      Una banda no puede contratar más Disparadores que Chicos tenga. Si un chico muere y los
      Disparadores superan en número a los Chicos, la próxima contratación debe ser un chico para
      restablecer el equilibrio.
  applies_to:
    profile_ids:
    - orc-shootaz
- id: orc-nuttaz--unstable
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.black-orcs.orc-nuttaz.unstable
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: psychology.
  name: Unstable
  effect: >-
    These Orcs are not quite all there. They do not suffer from Animosity, but instead have a host
    of their own issues to deal with.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 4 Orc Nuttaz / Special Rules / Unstable
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/black-orcs
  name_i18n:
    es: Inestable
  effect_i18n:
    es: >-
      Estos orcos no están del todo bien de la cabeza. No sufren Rencor, pero tienen infinidad de
      problemas propios con los que lidiar.
  applies_to:
    profile_ids:
    - orc-nuttaz
- id: orc-nuttaz--crazy
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.black-orcs.orc-nuttaz.crazy
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: psychology.
  name: Crazy
  effect: >-
    Nuttaz always pass any Leadership-based Tests they have to take. A side effect of this is that
    their minds are too far-gone and they may never learn Academic Skills should they become a Hero
    on an Advance Roll.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 4 Orc Nuttaz / Special Rules / Crazy
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/black-orcs
  name_i18n:
    es: Chalado
  effect_i18n:
    es: >-
      Los Chalados superan siempre cualquier chequeo basado en Liderazgo que deban realizar. Un
      efecto secundario de esto es que sus mentes están demasiado trastornadas y jamás podrán
      aprender Habilidades Académicas si se convierten en héroes mediante una tirada de mejora.
  applies_to:
    profile_ids:
    - orc-nuttaz
- id: orc-nuttaz--savage
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: skill.extra-attack
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.extra-attack
    - id: profile.equipment-restrictions
      scope: 'YES'
      binding:
        kind: profile
        id: profile.equipment-restrictions
        parameters:
          forbids:
          - armour
          - ranged-weapons
    - id: movement.compulsory-charge
      scope: 'NO'
      binding: null
      reason: >-
        Movement is outside the duel runtime.
    - id: psychology.leadership-restrictions
      scope: LATER
      binding: null
      reason: >-
        Psychology is deferred.
  name: Savage
  effect: >-
    Nuttaz must always run or charge their maximum distance towards the nearest opponent they can
    see. Friendly models do not block line of sight. Additionally they fight with an extra attack
    whilst in combat. This does not appear on their profile nor does it count towards the racial
    maximum. If no enemy is visible they are moved under the player’s control. They can never use
    any form of armour or ranged weapons. Nuttaz are also too unstable for other Boyz and can never
    have the Leader ability or use their Ld stat for rout tests, excepting them as being the only
    models left on the board.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 4 Orc Nuttaz / Special Rules / Savage
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/black-orcs
  name_i18n:
    es: Salvaje
  effect_i18n:
    es: >-
      Los Chalados deben correr o cargar siempre su distancia máxima hacia el oponente visible más
      cercano. Los modelos amigos no bloquean la línea de visión. Además, luchan con un ataque extra
      mientras estén en combate. Esto no aparece en su perfil ni cuenta para el máximo racial. Si no
      hay enemigos visibles se mueven bajo el control del jugador. Nunca pueden usar armadura de
      ningún tipo ni armas a distancia. Los Chalados también son demasiado inestables para los demás
      Chicos y jamás pueden tener la capacidad de Líder ni usar su Ld para chequeos de huida, salvo
      que sean los únicos modelos que quedan en la mesa.
  applies_to:
    profile_ids:
    - orc-nuttaz
