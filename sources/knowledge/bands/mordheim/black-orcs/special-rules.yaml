  name: Regeneration
  effect: Trolls have a unique physiology that allows them to regenerate wounds. Whenever an enemy successfully inflicts a
    wound on a Troll roll a D6, on a result of 4 or more the wound is ignored and the Troll is unhurt. Trolls may not regenerate
    wounds caused by fire or fire-based magic. Trolls never roll for Injury after a battle, unless they were taken Out of
    Action by a Flaming weapon or spell. Then they roll after the battle as a normal Henchman.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 1 Troll / Special Rules / Regeneration
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/black-orcs
