- id: instructor--expert-weaponsmith
  runtime:
    scope: "NO"
    implemented: "NO"
    grant: profile
    effects:
    - id: unimplemented.gunnery-school-of-nuln.instructor.expert-weaponsmith
      scope: "NO"
      binding: null
      reason: "Out of scope: disparo."
  name: Expert Weaponsmith
  effect: 'The Instructors know every trick in the book when it comes to working with black

    powder weapons. While there is an Instructor in the warband all Pistol weapons receive a +3” range

    bonus and all other black powder weapons receive a +6” range bonus.'
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 – 1 Instructor / Special Rules / Expert Weaponsmith
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/gunnery-school-of-nuln
  name_i18n:
    en: Expert Weaponsmith
    es: null
  effect_i18n:
    en: 'The Instructors know every trick in the book when it comes to working with black

      powder weapons. While there is an Instructor in the warband all Pistol weapons receive a +3” range

      bonus and all other black powder weapons receive a +6” range bonus.'
    es: null
  applies_to:
    profile_ids:
    - instructor
- id: marksmen--quick-reload
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: compiler.quick-reload
      scope: 'YES'
      binding:
        kind: compiler
        id: compiler.quick-reload
  name: Quick Reload
  effect: Marksmen trained at the Gunnery School are forced to practice many drills day after day, including those that teach
    them to load their weapons for speed under high-pressure conditions. Marksmen have the Hunter skill from the Mordheim rulebook.
    A Marksman who becomes a Hero gains no further effect from taking the Hunter skill in addition to this.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 7 Marksmen / Special Rules / Quick Reload
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/gunnery-school-of-nuln
  name_i18n:
    en: Quick Reload
    es: null
  effect_i18n:
    en: 'Marksmen trained at the Gunnery School are forced to practice many drills day after

      day, including those that teach them to load their

      weapons for speed under high-pressure conditions.

      Marksmen have the Hunter skill from the Mordheim

      rulebook. A Marksman who becomes a Hero gains no further effect from taking the Hunter skill in addition to this.'
    es: null
  applies_to:
    profile_ids:
    - marksmen
- id: pistoliers--crack-shot
  runtime:
    scope: "YES"
    implemented: "YES"
    grant: profile
    effects:
    - id: skill.crack-shot
      scope: "YES"
      binding:
        kind: mechanic
        id: skill.crack-shot
  name: Crack Shot
  effect: 'Experts with pistols in close quarters; they have an uncanny ability to turn what should have

    missed its target into a success. When using pistols in close combat, they may re-roll any missed to-hit rolls

    with the pistol in the first round of combat.'
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 5 Pistoliers / Special Rules / Crack Shot
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/gunnery-school-of-nuln
  name_i18n:
    en: Crack Shot
    es: null
  effect_i18n:
    en: 'Experts with pistols in close quarters; they have an uncanny ability to turn what should have

      missed its target into a success. When using pistols in close combat, they may re-roll any missed to-hit rolls

      with the pistol in the first round of combat.'
    es: null
  applies_to:
    profile_ids:
    - pistoliers
- id: band--impeccable-care
  runtime:
    scope: "NO"
    implemented: "NO"
