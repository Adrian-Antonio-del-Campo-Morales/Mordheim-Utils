  name_i18n:
    en: Impeccable Care
    es: null
  effect_i18n:
    en: The warband may always use the reduced black-powder weapon costs listed in its starting Equipment Lists and gains
      +2 on rarity rolls to find black-powder weapons.
    es: null
  applies_to:
    band: true
- id: band--properly-used
  runtime:
    scope: "NO"
    implemented: "NO"
    grant: band
    effects:
    - id: unimplemented.gunnery-school-of-nuln.band.properly-used
      scope: "NO"
      binding: null
      reason: "Out of scope: disparo."
  name: Properly Used
  effect: 'When using the optional Misfire rules, if a 1 is rolled, roll another D6. On a 3+ the misfire is ignored: the shot
    still misses, but the weapon does not explode.'
  source:
    manual: mordheimer.net
    printed_page: 0
    section: special rules / Properly Used
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/gunnery-school-of-nuln
  name_i18n:
    en: Properly Used
    es: null
  effect_i18n:
    en: 'When using the optional Misfire rules, if a 1 is rolled, roll another D6. On a 3+ the misfire is ignored: the shot
      still misses, but the weapon does not explode.'
    es: null
  applies_to:
    band: true
- id: band--proud-to-a-fault
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: band
    effects:
    - id: compiler.proud-to-a-fault
      scope: 'YES'
      binding:
        kind: compiler
        id: compiler.proud-to-a-fault
  name: Proud To A Fault!
  effect: Members of the Gunnery School warband may never use non-black-powder ranged weapons. This restriction does not apply
    to Hired Swords or Dramatis Personae.
  source:
    manual: mordheimer.net
    printed_page: 0
