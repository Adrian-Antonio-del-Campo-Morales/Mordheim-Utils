- id: band--hard-to-kill
  name: Hard to Kill
  effect: Chaos Dwarfs and Bull Centaurs are taken Out of Action only on a 6 on the Injury chart; 1-2
    is Knocked Down and 3-5 is Stunned.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special rules / Hard to Kill
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/sons-of-hashut
  name_i18n:
    en: Hard to Kill
    es: Difíciles de matar
  effect_i18n:
    en: Chaos Dwarfs and Bull Centaurs are taken Out of Action only on a 6 on the Injury chart; 1-2 is
      Knocked Down and 3-5 is Stunned.
    es: Los Enanos del Caos y los Centauros toro se retiran del combate solo con un 6 en la tabla de Heridas;
      1-2 es Derribado y 3-5 es Aturdido.
