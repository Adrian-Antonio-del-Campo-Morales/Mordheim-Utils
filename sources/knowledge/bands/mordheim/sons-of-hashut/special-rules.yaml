      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, or non-duel context.'
- id: band--indentured-servants
  name: Indentured Servants
  effect: The warband must begin with at least four Hobgoblins. If it later falls below four Hobgoblins,
    no other type of new warrior may be recruited until the warband has at least four Hobgoblins again.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special rules / Indentured Servants
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/sons-of-hashut
  name_i18n:
    en: Indentured Servants
    es: Sirvientes contratados
  effect_i18n:
    en: The warband must begin with at least four Hobgoblins. If it later falls below four Hobgoblins,
      no other type of new warrior may be recruited until the warband has at least four Hobgoblins again.
    es: La banda debe comenzar con al menos cuatro Hobgoblins. Si posteriormente baja de cuatro Hobgoblins,
      no puede reclutarse ningún otro tipo de guerrero nuevo hasta que la banda vuelva a tener al menos
      cuatro Hobgoblins.
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.sons-of-hashut.band.indentured-servants
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: no effect applies to the isolated 1v1 duel or legal fighter skill/equipment
        construction.
- id: band--hired-swords
  name: Hired Swords
  effect: The warband may hire an Ogre Bodyguard, Pit Fighter, Warlock, Imperial Assassin, Hobgoblin Scout,
    any Hired Sword described as available to all, and Hired Swords allowed to Orc or Chaos warbands.
    It may never hire Elves.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special rules / Hired Swords
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/sons-of-hashut
  name_i18n:
    en: Hired Swords
    es: Espadas a sueldo
  effect_i18n:
    en: The warband may hire an Ogre Bodyguard, Pit Fighter, Warlock, Imperial Assassin, Hobgoblin Scout,
      any Hired Sword described as available to all, and Hired Swords allowed to Orc or Chaos warbands.
      It may never hire Elves.
    es: La banda puede contratar un Guardaespaldas ogro, un Luchador de fosa, un Brujo, un Asesino imperial,
      un Explorador hobgoblin, cualquier Espada a sueldo descrita como disponible para todas, y las Espadas
      a sueldo permitidas a bandas de orcos o del Caos. Nunca puede contratar elfos.
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.sons-of-hashut.band.hired-swords
      scope: 'NO'
