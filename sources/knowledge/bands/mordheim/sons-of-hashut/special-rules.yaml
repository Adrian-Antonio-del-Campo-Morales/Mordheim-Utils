      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology or mounts.'
- id: apprentice-sorcerer--rituals-of-chaos
  name: Rituals of Chaos
  effect: The Apprentice Sorcerer is a wizard and may learn a random spell from the Chaos Dwarf spell
    list. The spell list itself is intentionally not modelled in this file.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Heroes / 1 Apprentice Sorcerer / Special Rules / Rituals of Chaos
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/sons-of-hashut
  name_i18n:
    en: Rituals of Chaos
    es: Rituales del Caos
  effect_i18n:
    en: The Apprentice Sorcerer is a wizard and may learn a random spell from the Chaos Dwarf spell list.
      The spell list itself is intentionally not modelled in this file.
    es: El Hechicero aprendiz es un mago y puede aprender un hechizo aleatorio de la lista de hechizos
      de los Enanos del Caos. La propia lista de hechizos no está modelada intencionadamente en este fichero.
  applies_to:
    profile_ids:
    - apprentice-sorcerer
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.sons-of-hashut.apprentice-sorcerer.rituals-of-chaos
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: no effect applies to the isolated 1v1 duel or legal fighter skill/equipment
        construction.
- id: bull-centaur--large-target
  name: Large Target
  effect: >-
    The Bull Centaur is a Large Target: shooting attacks against it gain +1 to hit and it may be
    selected even if it is not the closest target. It adds +20 to the warband rating instead of the
    normal +5.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Heroes / 0 – 1 Bull Centaur / Special Rules / Large Target
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/sons-of-hashut
  name_i18n:
    en: Large Target
    es: Objetivo grande
  effect_i18n:
    en: 'The Bull Centaur is a Large Target: shooting attacks against it gain +1 to hit and it may be
      selected even if it is not the closest target. It adds +20 to the warband rating instead of the
      normal +5.'
    es: 'El Centauro toro es un Objetivo Grande: los ataques de disparo contra él obtienen +1 para impactar
      y puede ser seleccionado incluso si no es el objetivo más cercano. Añade +20 a la valoración de
      la banda en lugar de los +5 normales.'
  applies_to:
    profile_ids:
    - bull-centaur
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.sons-of-hashut.bull-centaur.large-target
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, or non-duel context.'
- id: hobgoblins--skinny
  name: Skinny
  effect: When making post-battle Serious Injury rolls for a Hobgoblin, a result of 1-3 means it abandons
    the warband.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Henchmen / 4+ Hobgoblins / Special Rules / Skinny
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/sons-of-hashut
  name_i18n:
    en: Skinny
    es: Enclenque
  effect_i18n:
    en: When making post-battle Serious Injury rolls for a Hobgoblin, a result of 1-3 means it abandons
      the warband.
    es: Al realizar las tiradas de Heridas Graves posteriores a la partida para un Hobgoblin, un resultado
      de 1-3 significa que abandona la banda.
  applies_to:
    profile_ids:
    - hobgoblins
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.sons-of-hashut.hobgoblins.skinny
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: no effect applies to the isolated 1v1 duel or legal fighter skill/equipment
        construction.
- id: hobgoblins--nobody-cares-about-them
  name: Nobody cares about them
  effect: Hobgoblins count as half a model each when calculating casualties for Rout tests. They can never
    become Heroes; re-roll any The Lad's Got Talent result.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Henchmen / 4+ Hobgoblins / Special Rules / Nobody cares about them
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/sons-of-hashut
  name_i18n:
    en: Nobody cares about them
    es: Nadie se preocupa por ellos
  effect_i18n:
    en: Hobgoblins count as half a model each when calculating casualties for Rout tests. They can never
      become Heroes; re-roll any The Lad's Got Talent result.
    es: Los Hobgoblins cuentan como media miniatura cada uno al calcular bajas para los chequeos de Huida.
      Nunca pueden convertirse en Héroes; repite cualquier resultado de The Lad's Got Talent.
  applies_to:
    profile_ids:
    - hobgoblins
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.sons-of-hashut.hobgoblins.nobody-cares-about-them
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology or mounts.'
- id: band--hard-head
  name: Hard Head
  effect: Chaos Dwarfs and Bull Centaurs ignore the special rules of clubs, maces and similar weapons
    that would make them easier to Stun.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special rules / Hard Head
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/sons-of-hashut
  name_i18n:
    en: Hard Head
    es: Cabeza dura
  effect_i18n:
    en: Chaos Dwarfs and Bull Centaurs ignore the special rules of clubs, maces and similar weapons that
      would make them easier to Stun.
    es: Los Enanos del Caos y los Centauros toro ignoran las reglas especiales de garrotes, mazas y armas
      similares que facilitarían Aturdirlos.
  applies_to:
    profile_ids: &id001
