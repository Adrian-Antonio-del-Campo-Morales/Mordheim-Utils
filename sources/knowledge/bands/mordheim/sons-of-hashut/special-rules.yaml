- id: band--slavers
  name: Slavers
  effect: >-
    The warband never frees a captive. For each captive, choose either Sacrifice or Put to Work.
    Sacrifice gives the Apprentice Sorcerer +1 Experience. Put to Work grants +1 wyrdstone at the
    end of the next game for that slave, then roll D6: on 2-6 the captive dies and the Chaos Dwarfs
    keep its equipment; on 1 it escapes with its equipment intact and gains D3 Experience (or +1
    Experience if it is a Henchman).
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special rules / Slavers
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/sons-of-hashut
  name_i18n:
    en: Slavers
    es: Esclavistas
  effect_i18n:
    en: 'The warband never frees a captive. For each captive, choose either Sacrifice or Put to Work.
      Sacrifice gives the Apprentice Sorcerer +1 Experience. Put to Work grants +1 wyrdstone at the end
      of the next game for that slave, then roll D6: on 2-6 the captive dies and the Chaos Dwarfs keep
      its equipment; on 1 it escapes with its equipment intact and gains D3 Experience (or +1 Experience
      if it is a Henchman).'
    es: 'La banda nunca libera a un cautivo. Por cada cautivo, elige entre Sacrificio o Puesto a trabajar.
      Sacrificio otorga al Hechicero aprendiz +1 de Experiencia. Puesto a trabajar otorga +1 wyrdstone
      al final de la siguiente partida por ese esclavo, y luego tira un D6: con 2-6 el cautivo muere y
      los Enanos del Caos conservan su equipo; con 1 escapa con su equipo intacto y gana D3 de Experiencia
      (o +1 de Experiencia si es un Secuaz).'
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.sons-of-hashut.band.slavers
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, or non-duel context.'
- id: band--uncommon
  name: Uncommon
  effect: When recruiting new Chaos Dwarf Henchmen into experienced groups, the veterancy Experience requirement
    is multiplied by 1.5, rounding up. This rule does not apply to Hobgoblins.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special rules / Uncommon
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/sons-of-hashut
  name_i18n:
    en: Uncommon
    es: Poco comunes
  effect_i18n:
    en: When recruiting new Chaos Dwarf Henchmen into experienced groups, the veterancy Experience requirement
      is multiplied by 1.5, rounding up. This rule does not apply to Hobgoblins.
    es: Al reclutar nuevos Secuaces Enanos del Caos en grupos veteranos, el requisito de Experiencia de
      veteranía se multiplica por 1,5, redondeando hacia arriba. Esta regla no aplica a los Hobgoblins.
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
