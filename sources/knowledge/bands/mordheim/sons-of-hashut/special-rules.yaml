- id: band--sons-of-hashut-maximum-characteristics
  name: Sons of Hashut Maximum Characteristics
  effect: Chaos Dwarfs use the Dwarf racial maximum profile (campaign.limit.racial-maximum.dwarf). Bull
    Centaurs in the Sons of Hashut use the Bull Centaur racial maximum profile (campaign.limit.racial-maximum.bull-centaur-sons-of-hashut).
    Hobgoblins in the Sons of Hashut use the Hobgoblin racial maximum profile (campaign.limit.racial-maximum.hobgoblin-sons-of-hashut).
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Racial Maximum Characteristics / Dwarf; Bull Centaur (The Sons of Hashut); Hobgoblin (The
      Sons of Hashut)
    url: https://mordheimer.net/docs/campaigns/experience
  name_i18n:
    en: Sons of Hashut Maximum Characteristics
    es: Características máximas de los Hijos de Hashut
  effect_i18n:
    en: Chaos Dwarfs use the Dwarf racial maximum profile (campaign.limit.racial-maximum.dwarf). Bull
      Centaurs in the Sons of Hashut use the Bull Centaur racial maximum profile (campaign.limit.racial-maximum.bull-centaur-sons-of-hashut).
      Hobgoblins in the Sons of Hashut use the Hobgoblin racial maximum profile (campaign.limit.racial-maximum.hobgoblin-sons-of-hashut).
    es: Los Enanos del Caos usan el perfil racial máximo Enano (campaign.limit.racial-maximum.dwarf).
      Los Centauros toro de los Hijos de Hashut usan el perfil racial máximo del Centauro toro (campaign.limit.racial-maximum.bull-centaur-sons-of-hashut).
      Los Hobgoblins de los Hijos de Hashut usan el perfil racial máximo del Hobgoblin (campaign.limit.racial-maximum.hobgoblin-sons-of-hashut).
  applies_to:
    band: true
