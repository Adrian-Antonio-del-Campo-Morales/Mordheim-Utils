- id: apprentice-sorcerer--leader
  name: Leader
  effect: Any warrior within 6" of the Apprentice Sorcerer may use his Leadership when taking Leadership
    tests.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Heroes / 1 Apprentice Sorcerer / Special Rules / Leader
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/sons-of-hashut
  name_i18n:
    en: Leader
    es: Líder
  effect_i18n:
    en: Any warrior within 6" of the Apprentice Sorcerer may use his Leadership when taking Leadership
      tests.
    es: Cualquier guerrero a 6" del Hechicero aprendiz puede usar su Liderazgo al realizar chequeos de
      Liderazgo.
  applies_to:
    profile_ids:
    - apprentice-sorcerer
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
