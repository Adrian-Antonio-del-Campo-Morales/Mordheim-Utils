- id: cold-one-beasthounds--scaly-skin
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: trait.natural-armour-save
      scope: 'YES'
      binding:
        kind: trait
        id: trait.natural-armour-save
        parameters:
          value: 6
    - id: trait.natural-armour-unmodified
      scope: 'YES'
      binding:
        kind: trait
        id: trait.natural-armour-unmodified
        parameters:
          value: true
  name: Scaly Skin
  effect: Cold One Beasthounds have tough scaly skin, and are considered to have a 6+ armour save. This save cannot be modified
    beyond 6 due to strength modifiers but any result of ‘no save’ on the Critical Hit chart will negate the unmodified 6+
    save.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 2 Cold One Beasthounds / Special Rules / Scaly Skin
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/dark-elves
  name_i18n:
    en: Scaly Skin
    es: null
  effect_i18n:
    en: Cold One Beasthounds have tough scaly skin, and are considered to have a 6+ armour save. This save cannot be modified
      beyond 6 due to strength modifiers but any result of ‘no save’ on the Critical Hit chart will negate the unmodified
      6+ save.
    es: null
  applies_to:
    profile_ids:
    - cold-one-beasthounds
