  - fellblades
- id: band--dark-elf-special-skills-fey-quickness
  kind: warband_skill
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.dark-elves.band.dark-elf-special-skills-fey-quickness
      scope: 'NO'
      binding: null
      reason: 'Out of scope: ataques.'
  name: Fey Quickness
  effect: 'Few can ever hope to match an Elf’s inhuman

    quickness and agility. An Elf with Fey Quickness can avoid melee

    or missile attacks on a roll of 6. If the Elf also has Step Aside or

    Dodge this will increase to a 4+ in the relevant area. For example,

    an Elf with Fey Quickness and Step Aside avoids melee attacks on a

    4+ and missile attacks on a 6.'
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Dark Elf Special Skills / Fey Quickness
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/dark-elves
  name_i18n:
    en: Fey Quickness
    es: null
  effect_i18n:
