- id: shades--natural-stealth
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.dark-elves.shades.natural-stealth
      scope: 'NO'
      binding: null
      reason: 'Out of scope: no effect applies to the isolated 1v1 duel or legal fighter skill/equipment construction.'
  name: Natural Stealth
  effect: The first thing that Dark Elf Scouts master is the art of moving without being seen or heard. If a Dark Elf is Hiding,
    enemy models suffer -1 to their Initiative value for determining if they can detect him.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 5 Shades / Special Rules / Natural Stealth
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/dark-elves
  name_i18n:
    en: Natural Stealth
    es: null
  effect_i18n:
    en: 'The first thing that Dark Elf Scouts master

      is the art of moving without being seen or heard. If a Dark Elf

      is Hiding, enemy models suffer -1 to their Initiative value for

      determining if they can detect him.'
    es: null
  applies_to:
    profile_ids:
    - shades
