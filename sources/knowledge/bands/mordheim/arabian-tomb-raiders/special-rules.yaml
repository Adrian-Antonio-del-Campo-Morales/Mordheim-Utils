      scope: "LATER"
      binding: null
      reason: "Deferred subsystem: psicología."
  name: Hate Undead
  effect: The men of Araby have suffered heavily at the hands (or should that be claws!) of the Tomb King’s armies in the
    Land of the Dead. Therefore, Araby Nomad Heroes hate all Undead.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: special rules / Hate Undead
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/arabian-tomb-raiders
  name_i18n:
