  runtime:
    scope: "NO"
    implemented: "NO"
    grant: profile
    effects:
    - id: unimplemented.arabian-tomb-raiders.slaves.life-of-slavery
      scope: "NO"
      binding: null
      reason: "Out of scope: campaña."
  name: Life of Slavery
  effect: A Slave may gain experience, but if he rolls Lad’s got Talent, the leader executes the Slave, and he is removed
    from the roster. The rest of the group may then re-roll their advance.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 5 Slaves / Special Rules / Life of Slavery
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/arabian-tomb-raiders
