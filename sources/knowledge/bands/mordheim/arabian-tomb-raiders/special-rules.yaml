  runtime:
    scope: "LATER"
    implemented: "NO"
    grant: profile
    effects:
    - id: unimplemented.arabian-tomb-raiders.sheikh.leader
      scope: "LATER"
      binding: null
      reason: "Deferred subsystem: psicología."
  name: Leader
  effect: The Sheikh is the leader of the Warband and any Tomb Raiders within 6" may use his Leadership characteristic for
    any Leadership tests.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 1 Sheikh / Special Rules / Leader
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/arabian-tomb-raiders
