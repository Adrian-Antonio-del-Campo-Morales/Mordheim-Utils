schema_version: 2
band_id: arabian-tomb-raiders
rules:
- id: sheikh--leader
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.arabian-tomb-raiders.sheikh.leader
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology.'
  name: Leader
  effect: The Sheikh is the leader of the Warband and any Tomb Raiders within 6" may use his Leadership
    characteristic for any Leadership tests.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 1 Sheikh / Special Rules / Leader
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/arabian-tomb-raiders
  name_i18n:
    en: Leader
    es: Líder
  effect_i18n:
    en: The Sheikh is the leader of the Warband and any Tomb Raiders within 6" may use his Leadership
      characteristic for any Leadership tests.
    es: El Jeque es el líder de la banda y cualquier Saqueador de Tumbas a 6" puede usar su característica
      de Liderazgo para cualquier chequeo de Liderazgo.
  applies_to:
    profile_ids:
    - sheikh
- id: mystic--wizard
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.arabian-tomb-raiders.mystic.wizard
      scope: 'NO'
      binding: null
      reason: 'Out of scope: magic.'
  name: Wizard
  effect: A Mystic is a Wizard. He uses spells from the Elemental Magic list. He starts with a single
    spell chosen at random from the list.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 – 1 Mystic / Special Rules / Wizard
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/arabian-tomb-raiders
  name_i18n:
    en: Wizard
    es: Hechicero
  effect_i18n:
    en: A Mystic is a Wizard. He uses spells from the Elemental Magic list. He starts with a single spell
      chosen at random from the list.
    es: Un Místico es un hechicero. Usa hechizos de la lista de Magia Elemental. Comienza con un único
      hechizo elegido al azar de la lista.
  applies_to:
    profile_ids:
    - mystic
- id: bedouin--desert-trader
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.arabian-tomb-raiders.bedouin.desert-trader
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign.'
  name: Desert Trader
  effect: Add +1 to your search for Equipping/Trading result. Note that you only get +1 even if you have
    two Bedouins.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 2 Bedouin / Special Rules / Desert Trader
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/arabian-tomb-raiders
  name_i18n:
    en: Desert Trader
    es: Comerciante del desierto
  effect_i18n:
    en: Add +1 to your search for Equipping/Trading result. Note that you only get +1 even if you have
      two Bedouins.
    es: Suma +1 a tu búsqueda de resultado de Equipamiento/Comercio. Ten en cuenta que solo obtienes +1,
      aunque tengas dos Beduinos.
  applies_to:
    profile_ids:
    - bedouin
- id: slaves--life-of-slavery
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.arabian-tomb-raiders.slaves.life-of-slavery
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign.'
  name: Life of Slavery
  effect: A Slave may gain experience, but if he rolls Lad’s got Talent, the leader executes the Slave,
    and he is removed from the roster. The rest of the group may then re-roll their advance.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 5 Slaves / Special Rules / Life of Slavery
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/arabian-tomb-raiders
  name_i18n:
    en: Life of Slavery
    es: Vida de esclavitud
  effect_i18n:
    en: A Slave may gain experience, but if he rolls Lad’s got Talent, the leader executes the Slave,
      and he is removed from the roster. The rest of the group may then re-roll their advance.
    es: Un Esclavo puede ganar experiencia, pero si saca 'El mozo tiene talento', el líder ejecuta al
      Esclavo y se retira de la lista. El resto del grupo puede entonces repetir su mejora.
  applies_to:
    profile_ids:
    - slaves
- id: band--hate-undead
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.arabian-tomb-raiders.band.hate-undead
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology.'
  name: Hate Undead
  effect: The men of Araby have suffered heavily at the hands (or should that be claws!) of the Tomb King’s
    armies in the Land of the Dead. Therefore, Araby Nomad Heroes hate all Undead.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: special rules / Hate Undead
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/arabian-tomb-raiders
  name_i18n:
    en: Hate Undead
    es: Odio a los no-muertos
  effect_i18n:
    en: The men of Araby have suffered heavily at the hands (or should that be claws!) of the Tomb King’s
      armies in the Land of the Dead. Therefore, Araby Nomad Heroes hate all Undead.
    es: Los hombres de Araby han sufrido enormemente a manos (¿o deberíamos decir garras?) de los ejércitos
      del Rey de las Tumbas en la Tierra de los Muertos. Por ello, los héroes Nómadas de Araby odian a
      todos los No-muertos.
  applies_to:
    band: true
- id: band--arabian-tomb-raiders-special-skills
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: band
    effects:
    - id: profile.skill-access
      scope: 'YES'
      binding:
        kind: profile
        id: profile.skill-access
        parameters:
          category: special
  name: Arabian Tomb Raiders special skills
  effect: Arab Heroes may use the following skill table instead of any of the standard skill tables available
    to them.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Arabian Tomb Raiders special skills
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/arabian-tomb-raiders
  name_i18n:
    en: Arabian Tomb Raiders special skills
    es: Habilidades especiales de los Saqueadores de Tumbas de Araby
  effect_i18n:
    en: Arab Heroes may use the following skill table instead of any of the standard skill tables available
      to them.
    es: Los héroes árabes pueden usar la siguiente tabla de habilidades en lugar de cualquiera de las
      tablas de habilidades estándar disponibles para ellos.
  applies_to:
    band: true
- id: band--arabian-tomb-raiders-special-skills-sand-worm
  kind: warband_skill
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.arabian-tomb-raiders.band.arabian-tomb-raiders-special-skills-sand-worm
      scope: 'NO'
      binding: null
      reason: 'Out of scope: movement.'
  name: Sand Worm
  effect: The warrior can bury himself in sand and become almost undetectable. The model can hide in open
    ground. Cannot be used inside buildings.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Arabian Tomb Raiders special skills / Sand Worm
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/arabian-tomb-raiders
  name_i18n:
    en: Sand Worm
    es: Gusano de arena
  effect_i18n:
    en: The warrior can bury himself in sand and become almost undetectable. The model can hide in open
      ground. Cannot be used inside buildings.
    es: El guerrero puede enterrarse en la arena y volverse casi indetectable. El modelo puede ocultarse
      en terreno abierto. No puede usarse dentro de edificios.
  applies_to:
    band: true
- id: band--arabian-tomb-raiders-special-skills-hit-and-run
  kind: warband_skill
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.arabian-tomb-raiders.band.arabian-tomb-raiders-special-skills-hit-and-run
      scope: 'NO'
      binding: null
      reason: 'Out of scope: to-hit rolls.'
  name: Hit and Run
  effect: The warrior can run and shoot but suffer -2 to hit instead of the -1 to hit for moving.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Arabian Tomb Raiders special skills / Hit and Run
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/arabian-tomb-raiders
  name_i18n:
    en: Hit and Run
    es: Correr y disparar
  effect_i18n:
    en: The warrior can run and shoot but suffer -2 to hit instead of the -1 to hit for moving.
    es: El guerrero puede correr y disparar, pero sufre -2 para impactar en lugar del -1 para impactar
      por moverse.
  applies_to:
    band: true
- id: band--arabian-tomb-raiders-special-skills-weather-tolerant
  kind: warband_skill
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.arabian-tomb-raiders.band.arabian-tomb-raiders-special-skills-weather-tolerant
      scope: 'NO'
      binding: null
      reason: 'Out of scope: movement.'
  name: Weather Tolerant
  effect: The warrior has grown so used to the weather it doesn't even affect him anymore. Weather conditions
    such as heat and such no longer affect this model.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Arabian Tomb Raiders special skills / Weather Tolerant
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/arabian-tomb-raiders
  name_i18n:
    en: Weather Tolerant
    es: Aclimatado
  effect_i18n:
    en: The warrior has grown so used to the weather it doesn't even affect him anymore. Weather conditions
      such as heat and such no longer affect this model.
    es: El guerrero se ha acostumbrado tanto al clima que ya ni siquiera le afecta. Las condiciones meteorológicas,
      como el calor y similares, ya no afectan a este modelo.
  applies_to:
    band: true
