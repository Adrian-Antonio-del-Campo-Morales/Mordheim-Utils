- id: jaguar-warriors--one-with-the-jungle
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.amazons-lustria.jaguar-warriors.one-with-the-jungle
      scope: 'NO'
      binding: null
      reason: 'Out of scope: movement.'
  name: One with the Jungle
  effect: A Jaguar has lived her life in the deepest parts and can move through jungle terrain without
    penalty.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchwomen / 0 – 3 Jaguar Warriors / Special Rules / One with the Jungle
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/amazons-lustria
  name_i18n:
    en: One with the Jungle
    es: Una con la selva
  effect_i18n:
    en: 'A Jaguar has lived her life in the deepest parts and can move

      through jungle terrain without penalty.'
    es: Una Jaguar ha vivido su vida en las partes más profundas y puede moverse por terreno de selva
      sin penalización.
  applies_to:
    profile_ids:
    - jaguar-warriors
- id: band--special-rules
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: band
    effects:
    - id: mechanic.amazon-isolationists
      scope: 'YES'
      binding:
        kind: mechanic
        id: mechanic.amazon-isolationists
  name: Special Rules
  effect: >-
    Isolationists: The Amazons are constantly battling against the predations of the Lizardmen and
    greedy treasure-seeking Norse. Amazon culture reflects their dislike and distrust of outsiders
    and in battle they are particularly savage. Amazons get to re-roll any attack rolls that miss in
    the first round of combat against Lizardmen and Norse. Sacrifice: The Amazons are quick to
    sacrifice any captive to their gods. The Amazons follow the rules for Possessed in the Rulebook
    when it comes to captives. If an Amazon Warband captures a Lizardman, they may sacrifice him as
    normal, plus get a free Skins and Charms. Norse Enmity: When facing a Norse Warband an Amazon
    Warband will fight to the death. The Amazons can re-roll their first failed Rout against the
    Norse. Remember you can't re-roll a failed re-roll. In addition, Amazons can never choose to
    voluntarily rout when facing a Norse warband unless their Warband Leader has been taken Out of
    Action. Not one of us: Due to the Amazons' isolationism and suspicions about other races they
    never side with anyone else. For this reason, the Amazons may not have any Hired Swords or
    Dramatis Personae unless they are Amazons themselves.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/amazons-lustria
  name_i18n:
    en: Special Rules
    es: Reglas especiales
  effect_i18n:
    en: 'Isolationists: The Amazons are constantly battling against the predations of the Lizardmen and
      greedy treasure-seeking Norse. Amazon culture reflects their dislike and distrust of outsiders and
      in battle they are particularly savage. Amazons get to re-roll any attack rolls that miss in the
      first round of combat against Lizardmen and Norse.

      Sacrifice: The Amazons are quick to sacrifice any captive to their gods. The Amazons follow the
      rules for Possessed in the Rulebook when it comes to captives. If an Amazon Warband captures a Lizardman,
      they may sacrifice him as normal, plus get a free Skins and Charms.

      Norse Enmity: When facing a Norse Warband an Amazon Warband will fight to the death. The Amazons
      can re-roll their first failed Rout against the Norse. Remember you can''t re-roll a failed re-roll.
      In addition, Amazons can never choose to voluntarily rout when facing a Norse warband unless their
      Warband Leader has been taken Out of Action.

      Not one of us: Due to the Amazons'' isolationism and suspicions about other races they never side
      with anyone else. For this reason, the Amazons may not have any Hired Swords or Dramatis Personae
      unless they are Amazons themselves.'
    es: 'Aislacionistas: Las Amazonas luchan constantemente contra los ataques de los Hombres Lagarto
      y los avariciosos Norse buscatesoros. La cultura amazona refleja su aversión y desconfianza hacia
      los forasteros y, en la batalla, son particularmente feroces. Las Amazonas pueden repetir cualquier
      tirada de ataque que falle en el primer asalto de combate contra Hombres Lagarto y Norse. Sacrificio:
      Las Amazonas no dudan en sacrificar a cualquier cautivo ante sus dioses. Las Amazonas siguen las
      reglas de los Poseídos del reglamento en lo referente a cautivos. Si una banda Amazona captura a
      un Hombre Lagarto, puede sacrificarlo con normalidad y, además, obtener Pieles y Amuletos gratis.
      Enemistad Norse: Al enfrentarse a una banda Norse, una banda Amazona luchará hasta la muerte. Las
      Amazonas pueden repetir su primera huida fallida contra los Norse. Recuerda que no puedes repetir
      una repetición fallida. Además, las Amazonas nunca pueden optar por huir voluntariamente al enfrentarse
      a una banda Norse, salvo que su líder haya sido puesto Fuera de combate. No es de las nuestras:
      Debido al aislacionismo de las Amazonas y sus sospechas sobre otras razas, nunca se alían con nadie.
      Por esta razón, las Amazonas no pueden tener Espadas a Sueldo ni Personajes Dramáticos, salvo que
      sean ellas mismas Amazonas.'
  applies_to:
    band: true
- id: band--amazon-special-skills
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: band
    effects:
    - id: profile.skill-access
