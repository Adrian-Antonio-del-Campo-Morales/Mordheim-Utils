  name: Amazon special skills
  effect: Amazon Heroines may use the following skill table instead of any of the standard skill tables
    available to them.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Amazon special skills
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/amazons-lustria
  name_i18n:
    en: Amazon special skills
    es: Habilidades especiales de las Amazonas
  effect_i18n:
    en: Amazon Heroines may use the following skill table instead of any of the standard skill tables
      available to them.
    es: Las heroinas Amazonas pueden usar la siguiente tabla de habilidades en lugar de cualquiera de
      las tablas de habilidades estándar disponibles para ellas.
  applies_to:
    band: true
- id: band--amazon-special-skills-skink-hunter
  kind: warband_skill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: mechanic.strike-first-vs-skinks-first-round
      scope: 'YES'
      binding:
        kind: mechanic
        id: mechanic.strike-first-vs-skinks-first-round
  name: skink hunter
  effect: Through her exploits the Amazon has proven herself a master when it comes to hunting Lizardmen,
    particularly Skinks. An Amazon with this skill will always strike first in the first round of combat
    against Skink models no matter who charged.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Amazon special skills / skink hunter
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/amazons-lustria
  name_i18n:
    en: skink hunter
    es: Cazadora de skinks
  effect_i18n:
    en: Through her exploits the Amazon has proven herself a master when it comes to hunting Lizardmen,
      particularly Skinks. An Amazon with this skill will always strike first in the first round of combat
      against Skink models no matter who charged.
    es: Con sus hazañas, la Amazona ha demostrado ser una maestra cazando Hombres Lagarto, particularmente
      Skinks. Una Amazona con esta habilidad siempre golpeará primero en el primer asalto de combate contra
      modelos Skink, sin importar quién haya cargado.
  applies_to:
    band: true
- id: band--amazon-special-skills-elixir-of-life
  kind: warband_skill
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.amazons-lustria.band.amazon-special-skills-elixir-of-life
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign.'
  name: elixir of life
  effect: After years of service among her tribe an Amazon is granted access to the waters that make the
    Elixir of Life. The Elixir is said to heal wounds and make the Amazons immortal. Any Amazon with this
    Elixir can re-roll a Serious Injury roll once after the battle accepting the result of the second
    roll.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Amazon special skills / elixir of life
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/amazons-lustria
  name_i18n:
    en: elixir of life
    es: Elixir de vida
  effect_i18n:
    en: After years of service among her tribe an Amazon is granted access to the waters that make the
      Elixir of Life. The Elixir is said to heal wounds and make the Amazons immortal. Any Amazon with
      this Elixir can re-roll a Serious Injury roll once after the battle accepting the result of the
      second roll.
    es: Tras años de servicio entre su tribu, a una Amazona se le concede acceso a las aguas que componen
      el Elixir de Vida. Se dice que el Elixir sana las heridas y hace inmortales a las Amazonas. Cualquier
      Amazona con este Elixir puede repetir una vez una tirada de Herida Grave tras la batalla, aceptando
      el resultado de la segunda tirada.
  applies_to:
    band: true
- id: band--amazon-special-skills-mesmerising-dance
  kind: warband_skill
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.amazons-lustria.band.amazon-special-skills-mesmerising-dance
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology.'
  name: mesmerising dance
  effect: Some Amazon women develop their fighting motions into a graceful dance that can transfix their
    foes. Any model fighting in base contact with the Amazon must take a Leadership test at the start
    of each turn. If they fail they cannot attack that turn but may defend themselves. The dance however
    is useless against Lizardmen and undead who are immune to their charms.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Amazon special skills / mesmerising dance
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/amazons-lustria
  name_i18n:
    en: mesmerising dance
    es: Danza hipnótica
  effect_i18n:
    en: Some Amazon women develop their fighting motions into a graceful dance that can transfix their
      foes. Any model fighting in base contact with the Amazon must take a Leadership test at the start
      of each turn. If they fail they cannot attack that turn but may defend themselves. The dance however
      is useless against Lizardmen and undead who are immune to their charms.
    es: Algunas mujeres amazonas desarrollan sus movimientos de combate hasta convertirlos en una danza
      graceful capaz de hipnotizar a sus enemigos. Cualquier modelo que luche en contacto de peana con
      la Amazona debe superar un chequeo de Liderazgo al inicio de cada asalto. Si lo fallan, no pueden
      atacar ese asalto, pero pueden defenderse. Sin embargo, la danza es inútil contra Hombres Lagarto
      y no-muertos, inmunes a sus encantos.
  applies_to:
    band: true
- id: band--amazon-special-skills-savage-fury
  kind: warband_skill
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.amazons-lustria.band.amazon-special-skills-savage-fury
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology.'
  name: savage fury
  effect: The Amazon has learned to channel her anger and aggression making her a veritable animal while
    attacking her foes. Any Amazon model with this skill receives + 1 A when charging and is immune to
    charm effects and fear.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Amazon special skills / savage fury
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/amazons-lustria
  name_i18n:
    en: savage fury
    es: Furia salvaje
  effect_i18n:
    en: The Amazon has learned to channel her anger and aggression making her a veritable animal while
      attacking her foes. Any Amazon model with this skill receives + 1 A when charging and is immune
      to charm effects and fear.
    es: La Amazona ha aprendido a canalizar su ira y agresividad, convirtiéndose en un auténtico animal
      al atacar a sus enemigos. Cualquier modelo Amazona con esta habilidad recibe +1 A al cargar y es
      inmune a los efectos de encantamiento y al miedo.
  applies_to:
    band: true
- id: band--amazon-special-skills-concealment
  kind: warband_skill
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.amazons-lustria.band.amazon-special-skills-concealment
      scope: 'NO'
      binding: null
      reason: 'Out of scope: movement.'
  name: concealment
  effect: The Amazon is adept at blending in with her surroundings. When hiding in jungle terrain all
    enemy models must halve the range at which they can spot them.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Amazon special skills / concealment
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/amazons-lustria
  name_i18n:
    en: concealment
    es: Camuflaje
  effect_i18n:
    en: The Amazon is adept at blending in with her surroundings. When hiding in jungle terrain all enemy
      models must halve the range at which they can spot them.
    es: La Amazona es experta en fundirse con su entorno. Cuando se oculte en terreno de selva, todos
      los modelos enemigos deben dividir a la mitad la distancia a la que pueden detectarla.
  applies_to:
    band: true
