  name: mesmerising dance
  effect: Some Amazon women develop their fighting motions into a graceful dance that can transfix their foes. Any model fighting
    in base contact with the Amazon must take a Leadership test at the start of each turn. If they fail they cannot attack
    that turn but may defend themselves. The dance however is useless against Lizardmen and undead who are immune to their
    charms.
  source:
