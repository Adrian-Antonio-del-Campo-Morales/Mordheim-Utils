      binding:
        kind: mechanic
        id: mechanic.strike-first-vs-skinks-first-round
  name: skink hunter
  effect: Through her exploits the Amazon has proven herself a master when it comes to hunting Lizardmen, particularly Skinks.
    An Amazon with this skill will always strike first in the first round of combat against Skink models no matter who charged.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Amazon special skills / skink hunter
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/amazons-lustria
  name_i18n:
    en: skink hunter
    es: null
  effect_i18n:
    en: Through her exploits the Amazon has proven herself a master when it comes to hunting Lizardmen, particularly Skinks.
      An Amazon with this skill will always strike first in the first round of combat against Skink models no matter who charged.
    es: null
  applies_to:
    band: true
