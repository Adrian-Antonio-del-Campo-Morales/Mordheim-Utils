  name_i18n:
    en: Wizard
    es: Hechicera
  effect_i18n:
    en: 'The Priestess is a Wizard and may

      use Amazon Rituals . She starts with one ritual

      chosen at random from the list.'
    es: La Sacerdotisa es una hechicera y puede usar los Rituales de las Amazonas. Comienza con un ritual
