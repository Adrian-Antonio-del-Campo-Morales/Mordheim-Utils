  name_i18n:
    en: Leader
    es: Líder
  effect_i18n:
    en: 'Any models in the warband within 6"

      of the Priestess may use her Leadership

      instead of their own.'
    es: Todos los modelos de la banda a 6" de la Sacerdotisa pueden usar su Liderazgo en lugar del suyo
