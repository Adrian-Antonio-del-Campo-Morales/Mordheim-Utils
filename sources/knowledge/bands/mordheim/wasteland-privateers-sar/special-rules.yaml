- id: band--wasteland-special-rules
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.wasteland-privateers-sar.band.wasteland-special-rules
      scope: 'NO'
      binding: null
      reason: pending-classification
  name: Wasteland Special Rules
  effect: >-
    In a Wasteland Privateer Warband, any Henchmen Gunners may fire and reload Handguns in the same
    turn, like the skill Hunter (applies only to Handguns). The Pirate Equipment list has Handgun
    added to it. When purchasing Superior Gunpowder, it counts as Rarity 5.
  source:
    manual: broheim.net
    printed_page: 2
    section: Wasteland Special Rules
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Human%20Pirates.pdf
  name_i18n:
    es: Reglas Especiales del Yermo
  effect_i18n:
    es: >-
      En una banda de Corsarios del Yermo, cualquier Artillero bracero puede disparar y recargar
      Arcabuces en el mismo turno, como la habilidad Cazador (solo se aplica a Arcabuces). La lista
      de Equipo Pirata incluye el Arcabuz. Al comprar pólvora superior, cuenta como Rareza 5.
  applies_to:
    band: true
