schema_version: 2
band_id: mercenaries
rules:
- id: mercenary-captain--leader
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.mercenaries.mercenary-captain.leader
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: psychology.
  name: Leader
  effect: >-
    Any warrior within 6" of the Mercenary Captain may use his Leadership characteristic when taking
    Leadership tests.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 1 Mercenary captain / Special Rules / Leader
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/mercenaries
  name_i18n:
    es: Líder
  effect_i18n:
    es: >-
      Cualquier guerrero a 6" del Capitán mercenario puede usar su característica de Liderazgo
      cuando realice chequeos de Liderazgo.
  applies_to:
    profile_ids:
    - mercenary-captain
- id: swordsmen--expert-swordsmen
  kind: profile_ability
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: skill.expert-swordsman
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.expert-swordsman
  name: Expert Swordsmen
  effect: >-
    Swordsmen are so skilled with their weapons that they may re-roll any failed hits when charging.
    Note that this only applies when they are armed with normal swords, and not with doublehanded
    swords or any other weapons.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 5 Swordsmen / Special Rules / Expert Swordsmen
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/mercenaries
  name_i18n:
    es: Espadachines Expertos
  effect_i18n:
    es: >-
      Los Espadachines son tan hábiles con sus armas que pueden repetir los impactos fallidos cuando
      cargan. Ten en cuenta que esto solo se aplica cuando van armados con espadas normales, y no
      con espadas a dos manos ni cualquier otra arma.
  applies_to:
    profile_ids:
    - swordsmen
- id: band--reikland-command-radius
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.mercenaries.band.reikland-command-radius
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: psychology.
  name: Reikland — Military Discipline
  effect: >-
    Reikland fighters may use their Captain's Leadership while within 12" instead of the normal 6".
  source:
    manual: mordheimer.net
    printed_page: 0
    section: special rules / Reikland / Reiklander Special rules
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/mercenaries
  name_i18n:
    es: Reikland — Disciplina Militar
  effect_i18n:
    es: >-
      Los guerreros de Reikland pueden usar el Liderazgo de su Capitán estando a 12" en lugar de los
      6" habituales.
  applies_to:
    band: true
- id: band--reikland-marksman-training
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.mercenaries.band.reikland-marksman-training
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: shooting.
  name: Reikland — Marksman Training
  effect: >-
    All Reikland Marksmen have +1 Ballistic Skill, including Marksmen recruited after the warband is
    created.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: special rules / Reikland / Reiklander Special rules
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/mercenaries
  name_i18n:
    es: Reikland — Entrenamiento de Tirador
  effect_i18n:
    es: >-
      Todos los Tiradores de Reikland tienen +1 a Habilidad con Disparo, incluidos los Tiradores
      reclutados después de crear la banda.
  applies_to:
    band: true
- id: band--middenheim-physical-prowess
  kind: warband_variant
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: profile.characteristics
      scope: 'YES'
      binding:
        kind: profile
        id: profile.characteristics
        parameters:
          profile_ids:
          - mercenary-captain
          - champions
          bonuses:
            strength: 1
  name: Middenheim — Physical Prowess
  source:
    manual: mordheimer.net
    printed_page: 0
    section: special rules / Middenheim / Middenheimer Special rules
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/mercenaries
  name_i18n:
    es: Middenheim — Proeza Física
  applies_to:
    band: true
  eligibility:
  - mercenary-captain
  - champions
  rule_ref: shared-rule.middenheim-physical-prowess
- id: band--marienburg-traders
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.mercenaries.band.marienburg-traders
      scope: 'NO'
      binding: null
      reason: >-
