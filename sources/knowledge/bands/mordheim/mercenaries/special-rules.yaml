- id: band--ostermark-stubborn-resolve
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.mercenaries.band.ostermark-stubborn-resolve
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: psychology.
  name: Ostermark — Stubborn Resolve
  effect: >-
    Ostermark Heroes and Henchmen may re-roll a failed Leadership test for All Alone, and the
    warband may re-roll a failed Rout test. The second result must be accepted.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: special rules / Ostermark / Ostermarker Special rules
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/mercenaries
  name_i18n:
    es: Ostermark — Firmeza Obstinada
  effect_i18n:
    es: >-
      Los Héroes y Secuaces de Ostermark pueden repetir un chequeo de Liderazgo fallido por Solo
      (All Alone), y la banda puede repetir un chequeo de huida fallido. El segundo resultado debe
      aceptarse.
  applies_to:
    band: true
