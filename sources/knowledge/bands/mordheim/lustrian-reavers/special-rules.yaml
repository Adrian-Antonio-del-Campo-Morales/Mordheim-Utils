- id: jungle-shadow--silent-hunter
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.lustrian-reavers.jungle-shadow.silent-hunter
      scope: 'NO'
      binding: null
      reason: 'Out of scope: shooting.'
  name: Silent Hunter
  effect: Jungle Shadow is always considered to be Hidden if the model is touching any piece of terrain
    of 1" high. Shooting does not reveal Jungle Shadow's position, though spellcasting does.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Heroes / 0 – 1 Jungle Shadow / Special Rules / Silent Hunter
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/lustrian-reavers
  name_i18n:
    en: Silent Hunter
    es: Cazador silencioso
  effect_i18n:
    en: Jungle Shadow is always considered to be Hidden if the model is touching any piece of terrain
      of 1" high. Shooting does not reveal Jungle Shadow's position, though spellcasting does.
    es: La Sombra de la Selva siempre se considera Oculta si el modelo toca cualquier pieza de terreno
      de 1" de alto. Disparar no revela la posición de la Sombra de la Selva, aunque lanzar hechizos sí
      lo hace.
  applies_to:
    profile_ids:
    - jungle-shadow
- id: jungle-shadow--surprise-attack
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.lustrian-reavers.jungle-shadow.surprise-attack
      scope: 'NO'
      binding: null
      reason: 'Out of scope: shooting.'
  name: Surprise attack
  effect: If the Shadow attacks an enemy that has its back turned to the Jungle Shadow (i.e. the shot
    is coming from 180 degree angle from behind its facing), the Shadow can re-roll missed to hit rolls.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Heroes / 0 – 1 Jungle Shadow / Special Rules / Surprise attack
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/lustrian-reavers
  name_i18n:
    en: Surprise attack
    es: Ataque sorpresa
  effect_i18n:
    en: If the Shadow attacks an enemy that has its back turned to the Jungle Shadow (i.e. the shot is
      coming from 180 degree angle from behind its facing), the Shadow can re-roll missed to hit rolls.
    es: Si la Sombra ataca a un enemigo que tiene la espalda girada hacia la Sombra de la Selva (es decir,
      el ataque viene desde un ángulo de 180 grados desde atrás de su frente), la Sombra puede repetir
      las tiradas de impactar falladas.
  applies_to:
    profile_ids:
    - jungle-shadow
- id: jungle-shadow--canopy-walker
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.lustrian-reavers.jungle-shadow.canopy-walker
      scope: 'NO'
      binding: null
      reason: 'Out of scope: movement.'
  name: Canopy Walker
  effect: Jungle Shadow automatically passes all climbing , jumping and falling off ledges tests.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Heroes / 0 – 1 Jungle Shadow / Special Rules / Canopy Walker
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/lustrian-reavers
  name_i18n:
    en: Canopy Walker
    es: Caminante de las copas
  effect_i18n:
    en: Jungle Shadow automatically passes all climbing , jumping and falling off ledges tests.
    es: La Sombra de la Selva supera automáticamente todos los chequeos de trepar, saltar y caer desde
      cornisas.
  applies_to:
    profile_ids:
    - jungle-shadow
- id: trapmaster--deadeye
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.lustrian-reavers.trapmaster.deadeye
      scope: 'NO'
      binding: null
      reason: 'Out of scope: shooting.'
  name: Deadeye
  effect: Trapmaster suffers no penalties for shooting at long range.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Heroes / 0 – 1 Trapmaster / Special Rules / Deadeye
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/lustrian-reavers
  name_i18n:
    en: Deadeye
    es: Ojo certero
  effect_i18n:
    en: Trapmaster suffers no penalties for shooting at long range.
    es: El Maestro de Trampas no sufre penalizaciones por disparar a larga distancia.
  applies_to:
    profile_ids:
    - trapmaster
- id: trapmaster--traps
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.lustrian-reavers.trapmaster.traps
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: no effect applies to the isolated 1v1 duel or legal fighter skill/equipment
        construction.
  name: Traps
  effect: The Trapmaster starts each game with 1 Trap and can buy up to 5 further of the following Traps
    before the start of the game at the cost of 5 GC each. Each trap is one use only. Traps are used in
    the Shooting Phase instead of shooting, 1 trap at a time, and cannot be used in Melee combat. When
    you use a trap, put 2 1" diameter Trap counters (one false, one real) anywhere within 3" of the Trapmaster,
    but at least 3" away from any other models. Any model that moves within 2" of the counter must flip
    it over. If it is a false one, nothing happens. If it is a real one, the model suffers D3 S5 Hits
    immediately. Traps do not cause Criticals. Remove the counters when the trap is sprung.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Heroes / 0 – 1 Trapmaster / Special Rules / Traps
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/lustrian-reavers
  name_i18n:
    en: Traps
    es: Trampas
  effect_i18n:
    en: The Trapmaster starts each game with 1 Trap and can buy up to 5 further of the following Traps
      before the start of the game at the cost of 5 GC each. Each trap is one use only. Traps are used
      in the Shooting Phase instead of shooting, 1 trap at a time, and cannot be used in Melee combat.
      When you use a trap, put 2 1" diameter Trap counters (one false, one real) anywhere within 3" of
      the Trapmaster, but at least 3" away from any other models. Any model that moves within 2" of the
      counter must flip it over. If it is a false one, nothing happens. If it is a real one, the model
      suffers D3 S5 Hits immediately. Traps do not cause Criticals. Remove the counters when the trap
      is sprung.
    es: El Maestro de Trampas comienza cada partida con 1 Trampa y puede comprar hasta 5 trampas adicionales
      de las siguientes antes del inicio de la partida a un coste de 5 coronas cada una. Cada trampa es
      de un solo uso. Las trampas se usan en la fase de Disparo en lugar de disparar, de 1 en 1, y no
      pueden usarse en combate de melé. Cuando uses una trampa, coloca 2 contadores de Trampa de 1" de
      diámetro (uno falso, uno real) en cualquier punto a 3" del Maestro de Trampas, pero al menos a 3"
      de cualquier otro modelo. Cualquier modelo que se mueva a 2" del contador debe darle la vuelta.
      Si es falso, no sucede nada. Si es real, el modelo sufre inmediatamente D3 impactos de F5. Las trampas
      no causan críticos. Retira los contadores cuando la trampa se accione.
  applies_to:
    profile_ids:
    - trapmaster
- id: prospects--promotion-only
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.lustrian-reavers.prospects.promotion-only
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign.'
  name: Promotion Only
  effect: Re-roll any Lad's Got Talent results on Henchmen Advancement table. When promoted, you can then
    hire a new Prospect as the model no longer counts as one of them.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Henchmen / 0 – 5 Prospects / Special Rules / Promotion Only
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/lustrian-reavers
  name_i18n:
    en: Promotion Only
    es: Solo ascenso
  effect_i18n:
    en: Re-roll any Lad's Got Talent results on Henchmen Advancement table. When promoted, you can then
      hire a new Prospect as the model no longer counts as one of them.
    es: Repite cualquier resultado de 'El mozo tiene talento' en la tabla de Mejoras de Secuaces. Cuando
      lo asciendas, puedes contratar entonces un nuevo Aspirante, pues el modelo ya no cuenta como uno
      de ellos.
  applies_to:
    profile_ids:
    - prospects
- id: band--rare-heroes
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.lustrian-reavers.band.rare-heroes
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign.'
  name: Rare Heroes
  effect: During the lifetime of the warband, each named Hero type may only ever be bought once. A lost
    Hero cannot simply be rehired.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / Rare Heroes
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/lustrian-reavers
  name_i18n:
    en: Rare Heroes
    es: Héroes raros
  effect_i18n:
    en: During the lifetime of the warband, each named Hero type may only ever be bought once. A lost
      Hero cannot simply be rehired.
    es: Durante la vida de la banda, cada tipo de Héroe con nombre solo puede comprarse una vez. Un Héroe
      perdido no puede simplemente volver a contratarse.
  applies_to:
    band: true
- id: band--promotions
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: compiler.promotions
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: replacing a fallen Hero, transferring recovered equipment and advancing a
        Prospect require roster and campaign history.
  name: Promotions
  effect: When a Hero is lost, a new copy cannot be bought. Instead, a Prospect may be promoted into that
    Hero position. The promoted Prospect becomes that warrior type, gains its special rules and wargear
    access, chooses any two skill lists available to the warband's Heroes, and immediately makes one roll
    on the Heroes Advance table. The fallen Hero's recovered equipment is transferred to the promoted
    Hero. If no Prospect is currently present, the next Prospect hired may be promoted.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / Promotions
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/lustrian-reavers
  name_i18n:
    en: Promotions
    es: Ascensos
  effect_i18n:
    en: When a Hero is lost, a new copy cannot be bought. Instead, a Prospect may be promoted into that
      Hero position. The promoted Prospect becomes that warrior type, gains its special rules and wargear
      access, chooses any two skill lists available to the warband's Heroes, and immediately makes one
      roll on the Heroes Advance table. The fallen Hero's recovered equipment is transferred to the promoted
      Hero. If no Prospect is currently present, the next Prospect hired may be promoted.
    es: Cuando se pierde un Héroe, no puede comprarse una copia nueva. En su lugar, un Aspirante puede
      ser ascendido a esa posición de Héroe. El Aspirante ascendido se convierte en ese tipo de guerrero,
      gana sus reglas especiales y acceso a pertrechos, elige dos listas de habilidades cualesquiera disponibles
      para los Héroes de la banda, e inmediatamente hace una tirada en la tabla de Mejoras de Héroes.
      El equipo recuperado del Héroe caído se transfiere al Héroe ascendido. Si no hay ningún Aspirante
      presente actualmente, el siguiente Aspirante contratado puede ser ascendido.
  applies_to:
    band: true
- id: band--hired-swords
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.lustrian-reavers.band.hired-swords
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: no effect applies to the isolated 1v1 duel or legal fighter skill/equipment
        construction.
  name: Hired Swords
  effect: The warband may hire only an Ogre Bodyguard, Dwarf Trollslayer, Tilean Marksman, or Big Game
    Hunter.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / Hired Swords
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/lustrian-reavers
  name_i18n:
    en: Hired Swords
    es: Espadas a Sueldo
  effect_i18n:
    en: The warband may hire only an Ogre Bodyguard, Dwarf Trollslayer, Tilean Marksman, or Big Game Hunter.
    es: La banda solo puede contratar un Guardaespaldas Ogro, Asesatrolls Enano, Tirador Tíleo o Cazador
      de Caza Mayor.
  applies_to:
    band: true
- id: band--hero-required
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.lustrian-reavers.band.hero-required
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign.'
  name: Hero Required
  effect: The warband must include at least one Hero. Any Hero in the warband may be chosen as the Leader
    and then uses the normal Leader rules.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Choice Of Warriors / Heroes
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/lustrian-reavers
  name_i18n:
    en: Hero Required
    es: Héroe requerido
  effect_i18n:
    en: The warband must include at least one Hero. Any Hero in the warband may be chosen as the Leader
      and then uses the normal Leader rules.
    es: La banda debe incluir al menos un Héroe. Cualquier Héroe de la banda puede ser elegido como Líder
      y entonces usa las reglas normales de Líder.
  applies_to:
    band: true
