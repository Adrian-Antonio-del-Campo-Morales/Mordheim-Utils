    - prospects
- id: band--rare-heroes
  runtime:
    scope: "NO"
    implemented: "NO"
    grant: band
    effects:
    - id: unimplemented.lustrian-reavers.band.rare-heroes
      scope: "NO"
      binding: null
      reason: "Out of scope: campaign."
  name: Rare Heroes
  effect: During the lifetime of the warband, each named Hero type may only ever be bought once. A lost Hero cannot simply
    be rehired.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / Rare Heroes
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/lustrian-reavers
  name_i18n:
    en: Rare Heroes
    es: null
  effect_i18n:
    en: During the lifetime of the warband, each named Hero type may only ever be bought once. A lost Hero cannot simply be
      rehired.
    es: null
  applies_to:
    band: true
- id: band--promotions
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: compiler.promotions
      scope: 'NO'
      binding: null
      reason: 'Out of scope: replacing a fallen Hero, transferring recovered equipment and advancing a Prospect require roster and campaign history.'
  name: Promotions
  effect: When a Hero is lost, a new copy cannot be bought. Instead, a Prospect may be promoted into that Hero position. The
    promoted Prospect becomes that warrior type, gains its special rules and wargear access, chooses any two skill lists available
    to the warband's Heroes, and immediately makes one roll on the Heroes Advance table. The fallen Hero's recovered equipment
    is transferred to the promoted Hero. If no Prospect is currently present, the next Prospect hired may be promoted.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / Promotions
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/lustrian-reavers
  name_i18n:
    en: Promotions
    es: null
  effect_i18n:
    en: When a Hero is lost, a new copy cannot be bought. Instead, a Prospect may be promoted into that Hero position. The
      promoted Prospect becomes that warrior type, gains its special rules and wargear access, chooses any two skill lists
      available to the warband's Heroes, and immediately makes one roll on the Heroes Advance table. The fallen Hero's recovered
      equipment is transferred to the promoted Hero. If no Prospect is currently present, the next Prospect hired may be promoted.
    es: null
  applies_to:
    band: true
