schema_version: 2
band_id: lustrian-reavers
rules:
- id: conqueror--survivor
  runtime:
    scope: "YES"
    implemented: "YES"
    grant: profile
    effects:
    - id: trait.survivor
      scope: "YES"
      binding:
        kind: trait
        id: trait.survivor
        parameters:
          value: true
  name: Survivor
  effect: 'Cannot be taken out of Action unless the model is already Knocked Down or Stunned. Treat Out of Action as Stunned
    if the Conqueror is standing when receiving the Wound.

    In addition, the first time a Conqueror suffers a Dead result on the Serious Injury Chart, treat it as Multiple Injuries
    instead. This ability can save the Conqueror only one time.'
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Heroes / 0 – 1 Conqueror / Special Rules / Survivor
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/lustrian-reavers
  name_i18n:
    en: Survivor
    es: null
  effect_i18n:
    en: 'Cannot be taken out of Action unless the model is already Knocked Down or Stunned. Treat Out of Action as Stunned
      if the Conqueror is standing when receiving the Wound.

      In addition, the first time a Conqueror suffers a Dead result on the Serious Injury Chart, treat it as Multiple Injuries
      instead. This ability can save the Conqueror only one time.'
    es: null
  applies_to:
    profile_ids:
    - conqueror
- id: saurus-slayer--duellist
  runtime:
    scope: "YES"
    implemented: "YES"
    grant: profile
    effects:
    - id: skill.duellist
      scope: "YES"
      binding:
        kind: mechanic
        id: skill.duellist
  name: Duellist
  effect: If the Saurus Slayer is engaged with only a single opponent in melee, he may re-roll missed hits in the first round
    whether he charged or was charged.
