- id: reaver-beastmaster--war-beasts
  runtime:
    scope: "LATER"
    implemented: "NO"
    grant: profile
    effects:
    - id: unimplemented.lustrian-reavers.reaver-beastmaster.war-beasts
      scope: "LATER"
      binding: null
      reason: "Deferred subsystem: psychology."
  name: War Beasts
  effect: If the warband includes a Reaver Beastmaster, it may include up to 2 War Beasts in total. They count towards the
    warband's maximum size, must initially be bought with the Beastmaster, may be replaced if killed, and may use the Beastmaster's
    Leadership while within 6 inches.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Heroes / 0 – 1 Reaver Beastmaster / Special Rules / War Beasts
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/lustrian-reavers
