schema_version: 2
band_id: lustrian-reavers
rules:
- id: conqueror--survivor
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: trait.survivor
      scope: 'YES'
      binding:
        kind: trait
        id: trait.survivor
        parameters:
          value: true
  name: Survivor
  effect: Cannot be taken out of Action unless the model is already Knocked Down or Stunned. Treat Out
    of Action as Stunned if the Conqueror is standing when receiving the Wound. In addition, the first
    time a Conqueror suffers a Dead result on the Serious Injury Chart, treat it as Multiple Injuries
    instead. This ability can save the Conqueror only one time.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Heroes / 0 – 1 Conqueror / Special Rules / Survivor
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/lustrian-reavers
  name_i18n:
    en: Survivor
    es: Superviviente
  effect_i18n:
    en: 'Cannot be taken out of Action unless the model is already Knocked Down or Stunned. Treat Out
      of Action as Stunned if the Conqueror is standing when receiving the Wound.

      In addition, the first time a Conqueror suffers a Dead result on the Serious Injury Chart, treat
      it as Multiple Injuries instead. This ability can save the Conqueror only one time.'
    es: No puede ser puesto Fuera de combate salvo que el modelo ya esté Derribado o Aturdido. Trata Fuera
      de combate como Aturdido si el Conquistador está de pie cuando recibe la Herida. Además, la primera
      vez que un Conquistador sufre un resultado Muerto en la tabla de Heridas Graves, trátalo como Heridas
      Múltiples en su lugar. Esta habilidad puede salvar al Conquistador solo una vez.
  applies_to:
    profile_ids:
    - conqueror
- id: saurus-slayer--duellist
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: skill.duellist
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.duellist
  name: Duellist
  effect: If the Saurus Slayer is engaged with only a single opponent in melee, he may re-roll missed
    hits in the first round whether he charged or was charged.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Heroes / 0 – 1 Saurus Slayer / Special Rules / Duellist
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/lustrian-reavers
  name_i18n:
    en: Duellist
    es: Duelista
  effect_i18n:
    en: If the Saurus Slayer is engaged with only a single opponent in melee, he may re-roll missed hits
      in the first round whether he charged or was charged.
    es: Si el Matareaus está empeñado con un único oponente en melé, puede repetir los impactos fallados
      en el primer asalto, ya sea que haya cargado o sido cargado.
  applies_to:
    profile_ids:
    - saurus-slayer
- id: reaver-beastmaster--war-beasts
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.lustrian-reavers.reaver-beastmaster.war-beasts
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology.'
  name: War Beasts
  effect: If the warband includes a Reaver Beastmaster, it may include up to 2 War Beasts in total. They
    count towards the warband's maximum size, must initially be bought with the Beastmaster, may be replaced
    if killed, and may use the Beastmaster's Leadership while within 6 inches.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Heroes / 0 – 1 Reaver Beastmaster / Special Rules / War Beasts
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/lustrian-reavers
  name_i18n:
    en: War Beasts
    es: Bestias de guerra
  effect_i18n:
    en: If the warband includes a Reaver Beastmaster, it may include up to 2 War Beasts in total. They
      count towards the warband's maximum size, must initially be bought with the Beastmaster, may be
      replaced if killed, and may use the Beastmaster's Leadership while within 6 inches.
    es: Si la banda incluye un Maestro de Bestias Asaltante, puede incluir hasta 2 Bestias de Guerra en
      total. Cuentan para el tamaño máximo de la banda, deben comprarse inicialmente junto al Maestro
      de Bestias, pueden reemplazarse si mueren, y pueden usar el Liderazgo del Maestro de Bestias mientras
      estén a 6 pulgadas.
  applies_to:
    profile_ids:
    - reaver-beastmaster
- id: estalian-warhound--armoured
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: trait.natural-armour-save
      scope: 'YES'
      binding:
        kind: trait
        id: trait.natural-armour-save
        parameters:
          value: 5
  name: 5+ Armour Save
  effect: The Estalian Warhound has a 5+ armour save from its padded armour and iron collar.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Heroes / Reaver Beastmaster / 0 – 2 Estalian Warhound
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/lustrian-reavers
  name_i18n:
    en: 5+ Armour Save
    es: Salvación por armadura 5+
  effect_i18n:
    en: The Estalian Warhound has a 5+ armour save from its padded armour and iron collar.
    es: El Sabueso de Guerra Estaliano tiene una salvación por armadura de 5+ gracias a su armadura acolchada
      y collar de hierro.
  applies_to:
    profile_ids:
    - estalian-warhound
- id: estalian-warhound--animal
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.lustrian-reavers.estalian-warhound.animal
      scope: 'NO'
      binding: null
      reason: 'Out of scope: injuries.'
  name: Animal
  effect: The Warhound is an Animal, may not gain Experience, and if taken Out of Action is dead on a
    D6 roll of 1–2.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Heroes / Reaver Beastmaster / War Beasts
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/lustrian-reavers
  name_i18n:
    en: Animal
    es: Animal
  effect_i18n:
    en: The Warhound is an Animal, may not gain Experience, and if taken Out of Action is dead on a D6
      roll of 1–2.
    es: El Sabueso es un Animal, no puede ganar Experiencia, y si es puesto Fuera de combate muere con
      una tirada de 1-2 en 1D6.
  applies_to:
    profile_ids:
    - estalian-warhound
- id: estalian-warhound--beastmaster-leadership
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.lustrian-reavers.estalian-warhound.beastmaster-leadership
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology.'
  name: Beastmaster Leadership
  effect: If within 6 inches of the Reaver Beastmaster, the Warhound may use the Beastmaster's Leadership.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Heroes / Reaver Beastmaster / War Beasts
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/lustrian-reavers
  name_i18n:
    en: Beastmaster Leadership
    es: Liderazgo del Maestro de Bestias
  effect_i18n:
    en: If within 6 inches of the Reaver Beastmaster, the Warhound may use the Beastmaster's Leadership.
    es: Si está a 6 pulgadas del Maestro de Bestias Asaltante, el Sabueso puede usar el Liderazgo del
      Maestro de Bestias.
  applies_to:
    profile_ids:
    - estalian-warhound
- id: barbary-monkey--nimble
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: trait.ward-save
      scope: 'YES'
      binding:
        kind: trait
        id: trait.ward-save
        parameters:
          value: 5
  name: Nimble
  effect: The Barbary Monkey automatically climbs sheer surfaces without Initiative tests, may re-roll
    failed Diving Charge tests, may enter buildings despite being an Animal, and has a 5+ Ward save against
    wounds from melee, shooting, magic, or falling.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Heroes / Reaver Beastmaster / 0 – 1 Barbary Monkey
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/lustrian-reavers
  name_i18n:
    en: Nimble
    es: Ágil
  effect_i18n:
    en: The Barbary Monkey automatically climbs sheer surfaces without Initiative tests, may re-roll failed
      Diving Charge tests, may enter buildings despite being an Animal, and has a 5+ Ward save against
      wounds from melee, shooting, magic, or falling.
    es: El Mono de Berbería trepa automáticamente superficies escarpadas sin chequeos de Iniciativa, puede
      repetir los chequeos de Carga en picado fallados, puede entrar en edificios a pesar de ser un Animal,
      y tiene una salvación de Guardia de 5+ contra heridas de melé, disparo, magia o caídas.
  applies_to:
    profile_ids:
    - barbary-monkey
