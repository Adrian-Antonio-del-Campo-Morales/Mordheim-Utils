  name: Surprise attack
  effect: If the Shadow attacks an enemy that has its back turned to the Jungle Shadow (i.e. the shot is coming from 180 degree
    angle from behind its facing), the Shadow can re-roll missed to hit rolls.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Heroes / 0 – 1 Jungle Shadow / Special Rules / Surprise attack
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/lustrian-reavers
