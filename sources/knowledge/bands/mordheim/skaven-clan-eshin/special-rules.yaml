    printed_page: 0
    section: Skaven Special Skills / wall runner
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/skaven-eshin
  name_i18n:
    en: Wall Runner
    es: Corredor de muros
  effect_i18n:
    en: The Skaven automatically passes Initiative tests required to climb walls and other sheer surfaces.
    es: El skaven supera automáticamente los chequeos de Iniciativa necesarios para trepar por muros y
      otras superficies verticales.
  eligibility:
  - assassin-adept
  - black-skaven
  - eshin-sorcerer
  - night-runners
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
