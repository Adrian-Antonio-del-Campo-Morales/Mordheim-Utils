      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, or non-duel context.'
- id: band--skaven-special-skills-infiltration
  kind: warband_skill
  name: Infiltration
  effect: The Skaven deploys after the opposing warband and may be placed anywhere out of enemy sight
    and more than 12" from every enemy model. If both players have infiltrators, roll a D6 for each; the
    lowest roll deploys first.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Skaven Special Skills / infiltration
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/skaven-eshin
  name_i18n:
    en: Infiltration
    es: Infiltración
  effect_i18n:
    en: The Skaven deploys after the opposing warband and may be placed anywhere out of enemy sight and
      more than 12" from every enemy model. If both players have infiltrators, roll a D6 for each; the
      lowest roll deploys first.
    es: El skaven se despliega después de la banda contraria y puede situarse en cualquier lugar fuera
      de la vista enemiga y a más de 12" de cada miniatura enemiga. Si ambos jugadores tienen infiltradores,
      tira un D6 por cada uno; la tirada más baja despliega primero.
  eligibility:
  - assassin-adept
  - black-skaven
  - eshin-sorcerer
  - night-runners
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.skaven-clan-eshin.band.skaven-special-skills-infiltration
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, or non-duel context.'
- id: band--skaven-special-skills-art-of-silent-death
  kind: warband_skill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: skill.art-of-silent-death
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.art-of-silent-death
  name: Art of Silent Death
  effect: The Skaven may fight unarmed without penalties and counts as using two weapons, gaining +1 Attack.
    He scores a critical hit on a To Wound roll of 5-6 instead of only 6. When used with Eshin Fighting
    Claws, this grants +2 Attacks instead of +1.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Skaven Special Skills / art of silent death
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/skaven-eshin
  name_i18n:
    en: Art of Silent Death
    es: Arte de la muerte silenciosa
  effect_i18n:
    en: The Skaven may fight unarmed without penalties and counts as using two weapons, gaining +1 Attack.
      He scores a critical hit on a To Wound roll of 5-6 instead of only 6. When used with Eshin Fighting
      Claws, this grants +2 Attacks instead of +1.
    es: El skaven puede luchar desarmado sin penalizaciones y cuenta como si usara dos armas, ganando
      +1 Ataque. Obtiene un golpe crítico con una tirada de Herir de 5-6 en lugar de solo 6. Cuando se
      usa con las Garras de combate de Eshin, concede +2 Ataques en lugar de +1.
  eligibility:
  - assassin-adept
  - black-skaven
  - eshin-sorcerer
  - night-runners
  applies_to:
    band: true
