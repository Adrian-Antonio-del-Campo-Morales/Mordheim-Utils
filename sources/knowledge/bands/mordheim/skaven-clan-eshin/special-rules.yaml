- id: band--skaven-special-skills-art-of-silent-death
  kind: warband_skill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: skill.art-of-silent-death
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.art-of-silent-death
  name: Art of Silent Death
  effect: The Skaven may fight unarmed without penalties and counts as using two weapons, gaining +1 Attack. He scores a critical
    hit on a To Wound roll of 5-6 instead of only 6. When used with Eshin Fighting Claws, this grants +2 Attacks instead of
    +1.
  source:
