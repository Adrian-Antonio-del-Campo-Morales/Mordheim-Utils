- id: band--skaven-special-skills-black-hunger
  kind: warband_skill
  name: Black Hunger
  effect: At the start of his turn, the Skaven Hero may invoke Black Hunger. For that turn he gains +1
    Attack and +D3 inches to his total Movement, then suffers D3 Strength 3 hits with no armour save at
    the end of the turn.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Skaven Special Skills / black hunger
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/skaven-eshin
  name_i18n:
    en: Black Hunger
    es: Hambre negra
  effect_i18n:
    en: At the start of his turn, the Skaven Hero may invoke Black Hunger. For that turn he gains +1 Attack
      and +D3 inches to his total Movement, then suffers D3 Strength 3 hits with no armour save at the
      end of the turn.
    es: Al comienzo de su turno, el Héroe skaven puede invocar el Hambre negra. Durante ese turno gana
      +1 Ataque y +D3 pulgadas a su Movimiento total, y luego sufre D3 impactos de Fuerza 3 sin salvación
      por armadura al final del turno.
  eligibility:
  - assassin-adept
  - black-skaven
  - eshin-sorcerer
  - night-runners
  applies_to:
    band: true
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: mechanic.black-hunger
      scope: 'YES'
      binding:
        kind: mechanic
        id: mechanic.black-hunger
- id: band--skaven-special-skills-tail-fighting
  kind: warband_skill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: special-rule.band--skaven-special-skills-tail-fighting
      scope: 'YES'
      binding:
        kind: compiler
        id: special-rule.band--skaven-special-skills-tail-fighting
  runtime_selectable: true
  name: Tail Fighting
  effect: The Skaven may wield a shield, knife or sword with his tail. A weapon grants one additional
    attack with that weapon; a shield grants +1 to the model's armour save.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Skaven Special Skills / tail fighting
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/skaven-eshin
  name_i18n:
    en: Tail Fighting
    es: Combate con la cola
  effect_i18n:
    en: The Skaven may wield a shield, knife or sword with his tail. A weapon grants one additional attack
      with that weapon; a shield grants +1 to the model's armour save.
    es: El skaven puede empuñar un escudo, cuchillo o espada con su cola. Un arma concede un ataque adicional
      con esa arma; un escudo concede +1 a la salvación por armadura de la miniatura.
  eligibility:
  - assassin-adept
  - black-skaven
  - eshin-sorcerer
  - night-runners
  applies_to:
    band: true
- id: band--skaven-special-skills-wall-runner
  kind: warband_skill
