- id: band--skaven-special-skills-black-hunger
  kind: warband_skill
  name: Black Hunger
  effect: At the start of his turn, the Skaven Hero may invoke Black Hunger. For that turn he gains +1 Attack and +D3 inches
    to his total Movement, then suffers D3 Strength 3 hits with no armour save at the end of the turn.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Skaven Special Skills / black hunger
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/skaven-eshin
  name_i18n:
    en: Black Hunger
    es: null
  effect_i18n:
    en: At the start of his turn, the Skaven Hero may invoke Black Hunger. For that turn he gains +1 Attack and +D3 inches
      to his total Movement, then suffers D3 Strength 3 hits with no armour save at the end of the turn.
    es: null
  eligibility:
  - assassin-adept
  - black-skaven
  - eshin-sorcerer
  - night-runners
  applies_to:
    band: true
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: mechanic.black-hunger
      scope: 'YES'
      binding:
        kind: mechanic
        id: mechanic.black-hunger
