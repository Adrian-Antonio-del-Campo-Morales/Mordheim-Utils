schema_version: 2
band_id: skaven-clan-eshin
rules:
- id: assassin-adept--leader
  name: Leader
  effect: Any warrior within 6" of the Assassin Adept may use his Leadership instead of his own.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 1 Assassin adept / Special Rules / Leader
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/skaven-eshin
  name_i18n:
    en: Leader
    es: Líder
  effect_i18n:
    en: Any warrior within 6" of the Assassin Adept may use his Leadership instead of his own.
    es: Cualquier guerrero a 6" del Adepto asesino puede usar su Liderazgo en lugar del suyo propio.
  applies_to:
    profile_ids:
    - assassin-adept
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.skaven-clan-eshin.assassin-adept.leader
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology or mounts.'
- id: assassin-adept--perfect-killer
  name: Perfect Killer
  effect: Wounds inflicted by the Assassin Adept, whether in shooting or close combat, impose an additional
    -1 modifier to the enemy's armour save.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 1 Assassin adept / Special Rules / Perfect Killer
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/skaven-eshin
  name_i18n:
    en: Perfect Killer
    es: Asesino perfecto
  effect_i18n:
    en: Wounds inflicted by the Assassin Adept, whether in shooting or close combat, impose an additional
      -1 modifier to the enemy's armour save.
    es: Las heridas infligidas por el Adepto asesino, ya sea en disparo o en combate cuerpo a cuerpo,
      imponen un modificador adicional de -1 a la salvación por armadura del enemigo.
  applies_to:
    profile_ids:
    - assassin-adept
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: trait.perfect-killer
      scope: 'YES'
      binding:
        kind: trait
        id: trait.perfect-killer
        parameters:
          value: true
- id: eshin-sorcerer--magic-user
  name: Magic User
  effect: The Eshin Sorcerer is a magic user and begins with one randomly generated spell from Magic of
    the Horned Rat. When gaining a new skill, the Sorcerer may instead learn a new spell. The spell list
    itself is not modelled here.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 – 1 Eshin sorcerer / Special Rules / Magic User
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/skaven-eshin
  name_i18n:
    en: Magic User
    es: Usuario de magia
  effect_i18n:
    en: The Eshin Sorcerer is a magic user and begins with one randomly generated spell from Magic of
      the Horned Rat. When gaining a new skill, the Sorcerer may instead learn a new spell. The spell
      list itself is not modelled here.
    es: El Hechicero de Eshin es un usuario de magia y comienza con un hechizo generado aleatoriamente
      de la Magia de la Rata Cornuda. Al ganar una nueva habilidad, el Hechicero puede en su lugar aprender
      un nuevo hechizo. La propia lista de hechizos no está modelada aquí.
  applies_to:
    profile_ids:
    - eshin-sorcerer
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.skaven-clan-eshin.eshin-sorcerer.magic-user
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: no effect applies to the isolated 1v1 duel or legal fighter skill/equipment
        construction.
- id: giant-rats--pack-size
  name: Pack Size
  effect: The warband may recruit any number of Giant Rats, subject only to the overall warband maximum.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Henchmen / Giant Rats / Pack Size
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/skaven-eshin
  name_i18n:
    en: Pack Size
    es: Tamaño de la manada
  effect_i18n:
    en: The warband may recruit any number of Giant Rats, subject only to the overall warband maximum.
    es: La banda puede reclutar cualquier número de Ratas gigantes, sujeto únicamente al máximo total
      de la banda.
  applies_to:
    profile_ids:
    - giant-rats
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.skaven-clan-eshin.giant-rats.pack-size
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, or non-duel context.'
