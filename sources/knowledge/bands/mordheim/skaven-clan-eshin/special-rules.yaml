- id: band--skaven-maximum-characteristics
  name: Skaven Maximum Characteristics
  effect: >-
    Clan Eshin Skaven use the Skaven racial maximum profile (campaign.limit.racial-maximum.skaven).
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Racial Maximum Characteristics / Skaven
    url: https://mordheimer.net/docs/campaigns/experience
  name_i18n:
    es: Características Máximas Skaven
  effect_i18n:
    es: >-
      Los skaven del Clan Eshin usan el perfil racial máximo skaven
      (campaign.limit.racial-maximum.skaven).
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.skaven-clan-eshin.band.skaven-maximum-characteristics
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: no effect applies to the isolated 1v1 duel or legal fighter skill/equipment
        construction.
- id: band--skaven-special-skills-black-hunger
  kind: warband_skill
  name: Black Hunger
  effect: >-
    At the start of his turn, the Skaven Hero may invoke Black Hunger. For that turn he gains +1
    Attack and +D3 inches to his total Movement, then suffers D3 Strength 3 hits with no armour save
    at the end of the turn.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Skaven Special Skills / black hunger
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/skaven-eshin
  name_i18n:
    es: Hambre Negra
  effect_i18n:
    es: >-
      Al comienzo de su turno, el Héroe skaven puede invocar el Hambre negra. Durante ese turno gana
      +1 Ataque y +D3 pulgadas a su Movimiento total, y luego sufre D3 impactos de Fuerza 3 sin
      salvación por armadura al final del turno.
  eligibility:
  - assassin-adept
  - black-skaven
  - eshin-sorcerer
  - night-runners
  applies_to:
    band: true
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: mechanic.black-hunger
      scope: 'YES'
      binding:
        kind: mechanic
        id: mechanic.black-hunger
- id: band--skaven-special-skills-tail-fighting
  kind: warband_skill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: special-rule.band--skaven-special-skills-tail-fighting
      scope: 'YES'
      binding:
        kind: compiler
        id: special-rule.band--skaven-special-skills-tail-fighting
  runtime_selectable: true
  name: Tail Fighting
  effect: >-
    The Skaven may wield a shield, knife or sword with his tail. A weapon grants one additional
    attack with that weapon; a shield grants +1 to the model's armour save.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Skaven Special Skills / tail fighting
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/skaven-eshin
  name_i18n:
    es: Combate con la Cola
  effect_i18n:
    es: >-
      El skaven puede empuñar un escudo, cuchillo o espada con su cola. Un arma concede un ataque
      adicional con esa arma; un escudo concede +1 a la salvación por armadura de la miniatura.
  eligibility:
  - assassin-adept
  - black-skaven
  - eshin-sorcerer
  - night-runners
  applies_to:
    band: true
- id: band--skaven-special-skills-wall-runner
  kind: warband_skill
  name: Wall Runner
  effect: >-
    The Skaven automatically passes Initiative tests required to climb walls and other sheer
    surfaces.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Skaven Special Skills / wall runner
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/skaven-eshin
  name_i18n:
    es: Corredor de Muros
  effect_i18n:
    es: >-
      El skaven supera automáticamente los chequeos de Iniciativa necesarios para trepar por muros y
      otras superficies verticales.
  eligibility:
  - assassin-adept
  - black-skaven
  - eshin-sorcerer
  - night-runners
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.skaven-clan-eshin.band.skaven-special-skills-wall-runner
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: campaign, shooting, movement, terrain, deployment, or non-duel context.
- id: band--skaven-special-skills-infiltration
  kind: warband_skill
  name: Infiltration
  effect: >-
    The Skaven deploys after the opposing warband and may be placed anywhere out of enemy sight and
    more than 12" from every enemy model. If both players have infiltrators, roll a D6 for each; the
    lowest roll deploys first.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Skaven Special Skills / infiltration
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/skaven-eshin
  name_i18n:
    es: Infiltración
  effect_i18n:
    es: >-
      El skaven se despliega después de la banda contraria y puede situarse en cualquier lugar fuera
      de la vista enemiga y a más de 12" de cada miniatura enemiga. Si ambos jugadores tienen
      infiltradores, tira un D6 por cada uno; la tirada más baja despliega primero.
  eligibility:
  - assassin-adept
  - black-skaven
  - eshin-sorcerer
  - night-runners
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.skaven-clan-eshin.band.skaven-special-skills-infiltration
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: campaign, shooting, movement, terrain, deployment, or non-duel context.
- id: band--skaven-special-skills-art-of-silent-death
  kind: warband_skill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: skill.art-of-silent-death
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.art-of-silent-death
  name: Art of Silent Death
  effect: >-
    The Skaven may fight unarmed without penalties and counts as using two weapons, gaining +1
    Attack. He scores a critical hit on a To Wound roll of 5-6 instead of only 6. When used with
    Eshin Fighting Claws, this grants +2 Attacks instead of +1.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Skaven Special Skills / art of silent death
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/skaven-eshin
  name_i18n:
    es: Arte de la Muerte Silenciosa
  effect_i18n:
    es: >-
      El skaven puede luchar desarmado sin penalizaciones y cuenta como si usara dos armas, ganando
      +1 Ataque. Obtiene un golpe crítico con una tirada de Herir de 5-6 en lugar de solo 6. Cuando
      se usa con las Garras de combate de Eshin, concede +2 Ataques en lugar de +1.
  eligibility:
  - assassin-adept
  - black-skaven
  - eshin-sorcerer
  - night-runners
  applies_to:
    band: true
