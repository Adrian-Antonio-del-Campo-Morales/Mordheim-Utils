- id: assassin-adept--leader
  name: Leader
  effect: Any warrior within 6" of the Assassin Adept may use his Leadership instead of his own.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 1 Assassin adept / Special Rules / Leader
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/skaven-eshin
  name_i18n:
    en: Leader
    es: null
  effect_i18n:
    en: Any warrior within 6" of the Assassin Adept may use his Leadership instead of his own.
    es: null
  applies_to:
    profile_ids:
    - assassin-adept
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.skaven-clan-eshin.assassin-adept.leader
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology or mounts.'
- id: assassin-adept--perfect-killer
  name: Perfect Killer
  effect: Wounds inflicted by the Assassin Adept, whether in shooting or close combat, impose an additional -1 modifier to
    the enemy's armour save.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 1 Assassin adept / Special Rules / Perfect Killer
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/skaven-eshin
  name_i18n:
    en: Perfect Killer
    es: null
  effect_i18n:
    en: Wounds inflicted by the Assassin Adept, whether in shooting or close combat, impose an additional -1 modifier to the
      enemy's armour save.
    es: null
  applies_to:
    profile_ids:
    - assassin-adept
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: trait.perfect-killer
      scope: 'YES'
      binding:
        kind: trait
        id: trait.perfect-killer
        parameters:
          value: true
- id: eshin-sorcerer--magic-user
  name: Magic User
  effect: The Eshin Sorcerer is a magic user and begins with one randomly generated spell from Magic of the Horned Rat. When
    gaining a new skill, the Sorcerer may instead learn a new spell. The spell list itself is not modelled here.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 – 1 Eshin sorcerer / Special Rules / Magic User
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/skaven-eshin
  name_i18n:
