schema_version: 2
band_id: dwarf-rangers
rules:
- id: runesmith--leader
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.dwarf-rangers.runesmith.leader
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: psychology.
  name: Leader
  effect: >-
    Any models in the warband within 6" of the Dwarf Runesmith may use his Leadership instead of
    their own.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 1 Runesmith / Special Rules / Leader
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/dwarf-rangers
  name_i18n:
    es: Líder
  effect_i18n:
    es: >-
      Todas las miniaturas de la banda a 6" del Herrumorco enano pueden usar su Liderazgo en lugar
      del suyo propio.
  applies_to:
    profile_ids:
    - runesmith
- id: runesmith--inscribe-runes
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.dwarf-rangers.runesmith.inscribe-runes
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: no effect applies to the isolated 1v1 duel or legal fighter skill/equipment
        construction.
  name: Inscribe Runes
  effect: >-
    A Runesmith knows one minor rune (see list at the end of this warband list ), determined
    randomly when the warband is first created. He may inscribe the rune on an item carried by one
    of the warriors of his warband, and (if successful, see below) the item will gain a bonus from
    the rune for that game. When a Runesmith advances and rolls a skill on the Hero Advance table,
    he may choose to learn a new rune instead of learning a skill (exactly like a spellcaster
    advancing and learning a new spell).
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 1 Runesmith / Special Rules / Inscribe Runes
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/dwarf-rangers
  name_i18n:
    es: Grabar Runas
  effect_i18n:
    es: >-
      Un Herrumorco conoce una runa menor (ver la lista al final de esta lista de banda),
      determinada aleatoriamente cuando se crea la banda por primera vez. Puede grabar la runa en un
      objeto que lleve uno de los guerreros de su banda y (si tiene éxito, ver más abajo) el objeto
      ganará un bonus de la runa para esa partida. Cuando un Herrumorco progresa y saca una
      habilidad en la tabla de Progresos de Héroe, puede elegir aprender una nueva runa en lugar de
      aprender una habilidad (exactamente igual que un lanzador de hechizos que progresa y aprende
      un nuevo hechizo).
  applies_to:
    profile_ids:
    - runesmith
- id: apprentice-runesmith--extra-set-of-hands
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.dwarf-rangers.apprentice-runesmith.extra-set-of-hands
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: campaign.
  name: Extra Set of Hands
  effect: >-
    An Apprentice Runesmith helps his master fashion runic items, doing all the boring grunge-work
    that makes his master more efficient in his efforts. An Apprentice Runesmith in the warband
    allows a Master Runesmith to inscribe on two items before each game, instead of only one.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 – 1 Apprentice Runesmith / Special Rules / Extra Set of Hands
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/dwarf-rangers
  name_i18n:
    es: Un Par de Manos Extra
  effect_i18n:
    es: >-
      Un Herrumorco aprendiz ayuda a su maestro a confeccionar objetos rúnicos, haciendo todo el
      trabajo tedioso que hace a su maestro más eficiente. Un Herrumorco aprendiz en la banda
      permite a un Herrumorco maestro grabar dos objetos antes de cada partida, en lugar de solo
      uno.
  applies_to:
    profile_ids:
    - apprentice-runesmith
- id: dwarf-troll-slayers--deathwish
  runtime:
    scope: LATER
    implemented: 'NO'
