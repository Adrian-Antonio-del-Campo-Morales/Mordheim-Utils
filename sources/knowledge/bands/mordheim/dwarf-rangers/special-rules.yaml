- id: runesmith--inscribe-runes
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.dwarf-rangers.runesmith.inscribe-runes
      scope: 'NO'
      binding: null
      reason: 'Out of scope: no effect applies to the isolated 1v1 duel or legal fighter skill/equipment construction.'
  name: Inscribe Runes
  effect: A Runesmith knows one minor rune (see list at the end of this warband list ), determined randomly when the warband
    is first created. He may inscribe the rune on an item carried by one of the warriors of his warband, and (if successful,
    see below) the item will gain a bonus from the rune for that game. When a Runesmith advances and rolls a skill on the Hero
    Advance table, he may choose to learn a new rune instead of learning a skill (exactly like a spellcaster advancing and learning
    a new spell).
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 1 Runesmith / Special Rules / Inscribe Runes
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/dwarf-rangers
  name_i18n:
    en: Inscribe Runes
    es: null
  effect_i18n:
    en: 'A Runesmith knows one minor rune

      (see list at the end of this warband list ), determined

      randomly when the warband is first created. He may

      inscribe the rune on an item carried by one of the

      warriors of his warband, and (if successful, see below)

      the item will gain a bonus from the rune for that

      game. When a Runesmith advances and rolls a skill on

      the Hero Advance table, he may choose to learn an ew

      rune instead of learning a skill (exactly like a

      spellcaster advancing and learning an ew spell).'
    es: null
  applies_to:
    profile_ids:
    - runesmith
- id: apprentice-runesmith--extra-set-of-hands
  runtime:
    scope: "NO"
    implemented: "NO"
    grant: profile
