- id: band--slayer-special-skills-ferocious-charge
  kind: warband_skill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: skill.ferocious-charge
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.ferocious-charge
  name: Ferocious Charge
  effect: >-
    The Slayer may double his attacks on the turn in which he charges. He will suffer a –1 to hit
    penalty on that turn.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Slayer Special Skills / Ferocious Charge
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/dwarf-rangers
  name_i18n:
    es: Carga Feroz
  effect_i18n:
    es: >-
      El Matatrolles puede doblar sus ataques en el turno en que carga. Sufrirá una penalización de
      -1 para impactar en ese turno.
  eligibility:
  - dwarf-troll-slayers
  applies_to:
    band: true
- id: band--slayer-special-skills-monster-slayer
  eligibility:
  - dwarf-troll-slayers
  kind: warband_skill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: skill.monster-slayer
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.monster-slayer
  name: Monster Slayer
  effect: >-
    The Slayer always wounds any opponent on a roll of 4+, regardless of Toughness, unless his own
    strength (with weapon modifiers) would mean that a lower roll than this is needed.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Slayer Special Skills / Monster Slayer
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/dwarf-rangers
  name_i18n:
    es: Matamostro
  effect_i18n:
    es: >-
      El Matatrolles siempre hiere a cualquier oponente con un resultado de 4+, sin importar la
      Resistencia, a menos que su propia Fuerza (con los modificadores del arma) signifique que se
      necesita un resultado menor.
  applies_to:
    band: true
- id: band--slayer-special-skills-berserker
