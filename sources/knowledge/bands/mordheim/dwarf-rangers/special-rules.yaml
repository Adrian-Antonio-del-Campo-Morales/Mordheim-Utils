  name: Deathwish
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 – 2 Dwarf Troll Slayers / Special Rules / Deathwish
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/dwarf-rangers
  name_i18n:
    es: Deseo de Muerte
  applies_to:
    profile_ids:
    - dwarf-troll-slayers
  rule_ref: shared-rule.deathwish
- id: dwarf-longbeards--stubborn
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.dwarf-rangers.dwarf-longbeards.stubborn
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: psychology.
  name: Stubborn
  effect: >-
    Dwarf Longbeards have seen just about everything in their long careers and they know it. They
    are used to fighting by themselves against impossible odds and it hasn’t killed them yet. On top
    of all this they are just generally more set in their ways than other Dwarfs and they’re not
    about to let a bunch of weedy goblins drive them off! A Dwarf Longbeard may reroll any failed
    Leadership test he is required to take. Remember that you can never reroll a reroll, so the
    result of this second roll must always be accepted.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 5 Dwarf Longbeards / Special Rules / Stubborn
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/dwarf-rangers
  name_i18n:
    es: Obstinado
  effect_i18n:
    es: >-
      Los Barbilargos enanos lo han visto casi todo en sus largas carreras y lo saben. Están
      acostumbrados a luchar solos contra probabilidades imposibles y eso aún no los ha matado.
      Además de todo esto, son generalmente más aferrados a sus costumbres que otros enanos, ¡y no
      están dispuestos a dejar que una pandilla de trasgos enclenques los eche! Un Barbilargo enano
      puede repetir cualquier chequeo de Liderazgo fallido que deba realizar. Recuerda que nunca se
      puede repetir una repetición, así que el resultado de esta segunda tirada debe aceptarse
      siempre.
  applies_to:
    profile_ids:
    - dwarf-longbeards
- id: band--dont-trust-em
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.dwarf-rangers.band.dont-trust-em
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: psychology.
  name: Don’t Trust ‘Em
  effect: >-
    In multiplayer games, Dwarf Rangers may ally with other Dwarf warbands, but models from the two
    warbands are never considered friendly models to each other. They can prevent each other from
    marching and do not prevent each other from taking All Alone tests, although they are not
    enemies.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / Don’t Trust ‘Em
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/dwarf-rangers
  name_i18n:
    es: No Te Fíes de Ellos
  effect_i18n:
    es: >-
      En partidas multijugador, los Exploradores Enanos pueden aliarse con otras bandas enanas, pero
      las miniaturas de las dos bandas nunca se consideran miniaturas amigas entre sí. Pueden
      impedirse mutuamente la marcha y no se evitan mutuamente los chequeos de Luchando solo, aunque
      no son enemigos.
  applies_to:
    band: true
