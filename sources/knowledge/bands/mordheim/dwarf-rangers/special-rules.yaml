  name: No Arcane Lore
  effect: Dwarfs may never take the Arcane Lore skill and cannot learn to cast spells.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Dwarf Skill Table / Note
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/dwarf-rangers
  name_i18n:
    es: Sin Lore Arcano
  effect_i18n:
    es: >-
      Los enanos nunca pueden tomar la habilidad Lore Arcano y no pueden aprender a lanzar hechizos.
  applies_to:
    band: true
- id: band--dwarf-special-skills-combat-master
  kind: warband_skill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: skill.unbeatable-warrior
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.unbeatable-warrior
  name: Combat Master
  effect: >-
    This Dwarf’s martial skills surpass those of an ormal warrior; he is used to fighting by himself
    against hordes of opponents and coming through unscathed. When using a weapon that has a Parry
    special rule, this hero parries successfully if he beats OR MATCHES his opponent’s highest ‘to
    hit’ roll, not just if he beats the roll. In addition, if this warrior is using two weapons that
    have the Parry special rule, he is allowed to parry two attacks (if his two dice match or beat
    the highest two attack dice against him) instead of the normal maximum of one.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Dwarf Special Skills / Combat Master
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/dwarf-rangers
  name_i18n:
    es: Maestro de Combate
  effect_i18n:
    es: >-
      Las habilidades marciales de este enano superan las de un guerrero normal; está acostumbrado a
      luchar solo contra hordas de oponentes y salir indemne. Al usar un arma con la regla especial
      Aturdir (Parry), este héroe aturde con éxito si iguala o supera la tirada de 'impactar' más
      alta de su oponente, no solo si la supera. Además, si este guerrero usa dos armas con la regla
      especial Aturdir, se le permite aturdir dos ataques (si sus dos dados igualan o superan los
      dos dados de ataque más altos contra él) en lugar del máximo normal de uno.
  applies_to:
    band: true
