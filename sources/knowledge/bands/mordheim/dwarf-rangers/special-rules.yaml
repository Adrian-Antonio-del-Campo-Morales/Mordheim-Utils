      reason: "Deferred subsystem: psychology."
  name: Don’t Trust ‘Em
  effect: In multiplayer games, Dwarf Rangers may ally with other Dwarf warbands, but models from the two warbands are never
    considered friendly models to each other. They can prevent each other from marching and do not prevent each other from
    taking All Alone tests, although they are not enemies.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / Don’t Trust ‘Em
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/dwarf-rangers
  name_i18n:
    en: Don’t Trust ‘Em
    es: null
  effect_i18n:
    en: In multiplayer games, Dwarf Rangers may ally with other Dwarf warbands, but models from the two warbands are never
      considered friendly models to each other. They can prevent each other from marching and do not prevent each other from
      taking All Alone tests, although they are not enemies.
    es: null
  applies_to:
    band: true
