schema_version: 2
band_id: dwarf-rangers
rules:
- id: runesmith--leader
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.dwarf-rangers.runesmith.leader
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology.'
  name: Leader
  effect: Any models in the warband within 6" of the Dwarf Runesmith may use his Leadership instead of
    their own.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 1 Runesmith / Special Rules / Leader
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/dwarf-rangers
  name_i18n:
    en: Leader
    es: Líder
  effect_i18n:
    en: 'Any models in the warband within 6" of the Dwarf

      Runesmith may use his Leadership instead of their own.'
    es: Todas las miniaturas de la banda a 6" del Herrumorco enano pueden usar su Liderazgo en lugar del
      suyo propio.
  applies_to:
    profile_ids:
    - runesmith
- id: runesmith--inscribe-runes
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.dwarf-rangers.runesmith.inscribe-runes
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: no effect applies to the isolated 1v1 duel or legal fighter skill/equipment
        construction.
  name: Inscribe Runes
  effect: A Runesmith knows one minor rune (see list at the end of this warband list ), determined randomly
    when the warband is first created. He may inscribe the rune on an item carried by one of the warriors
    of his warband, and (if successful, see below) the item will gain a bonus from the rune for that game.
    When a Runesmith advances and rolls a skill on the Hero Advance table, he may choose to learn a new
    rune instead of learning a skill (exactly like a spellcaster advancing and learning a new spell).
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 1 Runesmith / Special Rules / Inscribe Runes
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/dwarf-rangers
  name_i18n:
    en: Inscribe Runes
    es: Grabar runas
  effect_i18n:
    en: 'A Runesmith knows one minor rune

      (see list at the end of this warband list ), determined

      randomly when the warband is first created. He may

      inscribe the rune on an item carried by one of the

      warriors of his warband, and (if successful, see below)

      the item will gain a bonus from the rune for that

      game. When a Runesmith advances and rolls a skill on

      the Hero Advance table, he may choose to learn an ew

      rune instead of learning a skill (exactly like a

      spellcaster advancing and learning an ew spell).'
    es: Un Herrumorco conoce una runa menor (ver la lista al final de esta lista de banda), determinada
      aleatoriamente cuando se crea la banda por primera vez. Puede grabar la runa en un objeto que lleve
      uno de los guerreros de su banda y (si tiene éxito, ver más abajo) el objeto ganará un bonus de
      la runa para esa partida. Cuando un Herrumorco progresa y saca una habilidad en la tabla de Progresos
      de Héroe, puede elegir aprender una nueva runa en lugar de aprender una habilidad (exactamente igual
      que un lanzador de hechizos que progresa y aprende un nuevo hechizo).
  applies_to:
    profile_ids:
    - runesmith
- id: apprentice-runesmith--extra-set-of-hands
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.dwarf-rangers.apprentice-runesmith.extra-set-of-hands
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign.'
  name: Extra Set of Hands
  effect: An Apprentice Runesmith helps his master fashion runic items, doing all the boring grunge-work
    that makes his master more efficient in his efforts. An Apprentice Runesmith in the warband allows
    a Master Runesmith to inscribe on two items before each game, instead of only one.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 – 1 Apprentice Runesmith / Special Rules / Extra Set of Hands
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/dwarf-rangers
  name_i18n:
    en: Extra Set of Hands
    es: Un par de manos extra
  effect_i18n:
    en: 'An Apprentice Runesmith helps

      his master fashion runic items, doing all the boring

      grunge-work that makes his master more efficient in

      his efforts. An Apprentice Runesmith in the warband

      allows a Master Runesmith to inscribe on two items

      before each game, instead of only one.'
    es: Un Herrumorco aprendiz ayuda a su maestro a confeccionar objetos rúnicos, haciendo todo el trabajo
      tedioso que hace a su maestro más eficiente. Un Herrumorco aprendiz en la banda permite a un Herrumorco
      maestro grabar dos objetos antes de cada partida, en lugar de solo uno.
  applies_to:
    profile_ids:
    - apprentice-runesmith
- id: dwarf-troll-slayers--deathwish
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.dwarf-rangers.dwarf-troll-slayers.deathwish
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology.'
  name: Deathwish
  effect: Troll Slayers seek an honourable death in combat. They are completely immune to all psychology
    and never need to test if fighting alone.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 – 2 Dwarf Troll Slayers / Special Rules / Deathwish
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/dwarf-rangers
  name_i18n:
    en: Deathwish
    es: Deseo de muerte
  effect_i18n:
    en: 'Troll Slayers seek an honourable death in

      combat. They are completely immune to all psychology and

      never need to test if fighting alone.'
    es: Los Matatrolles buscan una muerte honorable en combate. Son completamente inmunes a toda la psicología
      y nunca necesitan chequear si luchan solos.
  applies_to:
    profile_ids:
    - dwarf-troll-slayers
- id: dwarf-longbeards--stubborn
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.dwarf-rangers.dwarf-longbeards.stubborn
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology.'
  name: Stubborn
  effect: Dwarf Longbeards have seen just about everything in their long careers and they know it. They
    are used to fighting by themselves against impossible odds and it hasn’t killed them yet. On top of
    all this they are just generally more set in their ways than other Dwarfs and they’re not about to
    let a bunch of weedy goblins drive them off! A Dwarf Longbeard may reroll any failed Leadership test
    he is required to take. Remember that you can never reroll a reroll, so the result of this second
    roll must always be accepted.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 5 Dwarf Longbeards / Special Rules / Stubborn
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/dwarf-rangers
  name_i18n:
    en: Stubborn
    es: Testarudos
  effect_i18n:
    en: 'Dwarf Longbeards have seen just about

      everything in their long careers and they know it.

      They are used to fighting by themselves against

      impossible odds and it hasn’t killed them yet. On top

      of all this they are just generally more set in their

      ways than other Dwarfs and they’re not about to let a

      bunch of weedy goblins drive them off!

      A Dwarf Longbeard may reroll any failed Leadership test he is

      required to take. Remember that you can never reroll

      a reroll, so the result of this second roll must always

      be accepted.'
    es: Los Barbilargos enanos lo han visto casi todo en sus largas carreras y lo saben. Están acostumbrados
      a luchar solos contra probabilidades imposibles y eso aún no los ha matado. Además de todo esto,
      son generalmente más aferrados a sus costumbres que otros enanos, ¡y no están dispuestos a dejar
      que una pandilla de trasgos enclenques los eche! Un Barbilargo enano puede repetir cualquier chequeo
      de Liderazgo fallido que deba realizar. Recuerda que nunca se puede repetir una repetición, así
      que el resultado de esta segunda tirada debe aceptarse siempre.
  applies_to:
    profile_ids:
    - dwarf-longbeards
- id: band--dont-trust-em
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.dwarf-rangers.band.dont-trust-em
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology.'
  name: Don’t Trust ‘Em
  effect: In multiplayer games, Dwarf Rangers may ally with other Dwarf warbands, but models from the
    two warbands are never considered friendly models to each other. They can prevent each other from
    marching and do not prevent each other from taking All Alone tests, although they are not enemies.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / Don’t Trust ‘Em
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/dwarf-rangers
  name_i18n:
    en: Don’t Trust ‘Em
    es: No te fíes de ellos
  effect_i18n:
    en: In multiplayer games, Dwarf Rangers may ally with other Dwarf warbands, but models from the two
      warbands are never considered friendly models to each other. They can prevent each other from marching
      and do not prevent each other from taking All Alone tests, although they are not enemies.
    es: En partidas multijugador, los Exploradores Enanos pueden aliarse con otras bandas enanas, pero
      las miniaturas de las dos bandas nunca se consideran miniaturas amigas entre sí. Pueden impedirse
      mutuamente la marcha y no se evitan mutuamente los chequeos de Luchando solo, aunque no son enemigos.
  applies_to:
    band: true
- id: band--hard-to-kill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: band
    effects:
    - id: skill.hard-to-kill
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.hard-to-kill
  name: Hard to Kill
  effect: Dwarfs are taken out of action only on a 6 on the Injury chart; 1–2 is Knocked Down and 3–5
    is Stunned.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / Hard to Kill
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/dwarf-rangers
  name_i18n:
    en: Hard to Kill
    es: Difíciles de matar
  effect_i18n:
    en: Dwarfs are taken out of action only on a 6 on the Injury chart; 1–2 is Knocked Down and 3–5 is
      Stunned.
    es: Los enanos se retiran del combate solo con un 6 en la tabla de Heridas; 1–2 es Derribado y 3–5
      es Aturdido.
  applies_to:
    band: true
- id: band--hard-head
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: band
    effects:
    - id: trait.concussion-immune
      scope: 'YES'
      binding:
        kind: trait
        id: trait.concussion-immune
        parameters:
          value: true
  name: Hard Head
  effect: Dwarfs ignore the special rules for maces, clubs and similar weapons.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / Hard Head
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/dwarf-rangers
  name_i18n:
    en: Hard Head
    es: Cabeza dura
  effect_i18n:
    en: Dwarfs ignore the special rules for maces, clubs and similar weapons.
    es: Los enanos ignoran las reglas especiales de mazas, garrotes y armas similares.
  applies_to:
    band: true
- id: band--armour
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.dwarf-rangers.band.armour
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: no effect applies to the isolated 1v1 duel or legal fighter skill/equipment
        construction.
  name: Armour
  effect: Dwarfs never suffer movement penalties for wearing armour.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / Armour
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/dwarf-rangers
  name_i18n:
    en: Armour
    es: Armadura
  effect_i18n:
    en: Dwarfs never suffer movement penalties for wearing armour.
    es: Los enanos nunca sufren penalizaciones de movimiento por llevar armadura.
  applies_to:
    band: true
- id: band--hate-orcs-and-goblins
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.dwarf-rangers.band.hate-orcs-and-goblins
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology.'
  name: Hate Orcs and Goblins
  effect: All Dwarfs hate Orcs and Goblins.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / Hate Orcs and Goblins
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/dwarf-rangers
  name_i18n:
    en: Hate Orcs and Goblins
    es: Odio a orcos y goblins
  effect_i18n:
    en: All Dwarfs hate Orcs and Goblins.
    es: Todos los enanos odian a los orcos y los goblins.
  applies_to:
    band: true
- id: band--grudgebearers
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.dwarf-rangers.band.grudgebearers
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign.'
  name: Grudgebearers
  effect: A Dwarf warband may never include any kind of Elven Hired Sword or Dramatis Personae.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / Grudgebearers
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/dwarf-rangers
  name_i18n:
    en: Grudgebearers
    es: Portadores del agravio
  effect_i18n:
    en: A Dwarf warband may never include any kind of Elven Hired Sword or Dramatis Personae.
    es: Una banda enana nunca puede incluir ningún tipo de Espada a sueldo o Dramatis Personae élfico.
  applies_to:
    band: true
- id: band--incomparable-miners
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.dwarf-rangers.band.incomparable-miners
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign.'
  name: Incomparable Miners
  effect: When checking for wyrdstone at the end of a game, add +1 to the number of pieces found by the
    Dwarf warband.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / Incomparable Miners
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/dwarf-rangers
  name_i18n:
    en: Incomparable Miners
    es: Mineros incomparables
  effect_i18n:
    en: When checking for wyrdstone at the end of a game, add +1 to the number of pieces found by the
      Dwarf warband.
    es: Al buscar wyrdstone al final de una partida, añade +1 al número de fragmentos encontrados por
      la banda enana.
  applies_to:
    band: true
- id: band--no-arcane-lore
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: band
    effects:
    - id: compiler.no-arcane-lore
      scope: 'YES'
      binding:
        kind: compiler
        id: compiler.no-arcane-lore
  name: No Arcane Lore
  effect: Dwarfs may never take the Arcane Lore skill and cannot learn to cast spells.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Dwarf Skill Table / Note
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/dwarf-rangers
  name_i18n:
    en: No Arcane Lore
    es: Sin lore arcano
  effect_i18n:
    en: Dwarfs may never take the Arcane Lore skill and cannot learn to cast spells.
    es: Los enanos nunca pueden tomar la habilidad Lore Arcano y no pueden aprender a lanzar hechizos.
  applies_to:
    band: true
- id: band--dwarf-special-skills-combat-master
  kind: warband_skill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: skill.unbeatable-warrior
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.unbeatable-warrior
  name: Combat Master
  effect: This Dwarf’s martial skills surpass those of an ormal warrior; he is used to fighting by himself
    against hordes of opponents and coming through unscathed. When using a weapon that has a Parry special
    rule, this hero parries successfully if he beats OR MATCHES his opponent’s highest ‘to hit’ roll,
    not just if he beats the roll. In addition, if this warrior is using two weapons that have the Parry
    special rule, he is allowed to parry two attacks (if his two dice match or beat the highest two attack
    dice against him) instead of the normal maximum of one.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Dwarf Special Skills / Combat Master
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/dwarf-rangers
  name_i18n:
    en: Combat Master
    es: Maestro de combate
  effect_i18n:
    en: 'This Dwarf’s martial skills surpass those of an ormal

      warrior; he is used to fighting by himself against

      hordes of opponents and coming through unscathed.

      When using a weapon that has a Parry special rule,

      this hero parries successfully if he beats OR MATCHES

      his opponent’s highest ‘to hit’ roll, not just if he beats

      the roll. In addition, if this warrior is using two

      weapons that have the Parry special rule, he is

      allowed to parry two attacks (if his two dice match or

      beat the highest two attack dice against him) instead

      of the normal maximum of one.'
    es: Las habilidades marciales de este enano superan las de un guerrero normal; está acostumbrado a
      luchar solo contra hordas de oponentes y salir indemne. Al usar un arma con la regla especial Aturdir
      (Parry), este héroe aturde con éxito si iguala o supera la tirada de 'impactar' más alta de su oponente,
      no solo si la supera. Además, si este guerrero usa dos armas con la regla especial Aturdir, se le
      permite aturdir dos ataques (si sus dos dados igualan o superan los dos dados de ataque más altos
      contra él) en lugar del máximo normal de uno.
  applies_to:
    band: true
- id: band--dwarf-special-skills-extra-tough
  kind: warband_skill
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.dwarf-rangers.band.dwarf-special-skills-extra-tough
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: no effect applies to the isolated 1v1 duel or legal fighter skill/equipment
        construction.
  name: Extra Tough
  effect: This Dwarf is notorious for walking away from wounds that would kill a lesser being. When rolling
    on the Heroes Serious Injury chart for this Hero after a game in which he has been taken out of action,
    the dice may be re-rolled once. The result of this second dice roll must be accepted, even if it is
    a worse result.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Dwarf Special Skills / Extra Tough
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/dwarf-rangers
  name_i18n:
    en: Extra Tough
    es: Extra resistente
  effect_i18n:
    en: 'This Dwarf is notorious for walking away from wounds that

      would kill a lesser being. When rolling on the Heroes Serious

      Injury chart for this Hero after a game in which he has been

      taken out of action, the dice may be re-rolled once. The result

      of this second dice roll must be accepted, even if it is a worse

      result.'
    es: Este enano es famoso por sobrevivir a heridas que matarían a un ser inferior. Al tirar en la tabla
      de Heridas Graves de Héroes para este héroe tras una partida en la que haya sido retirado del combate,
      el dado puede repetirse una vez. El resultado de esta segunda tirada debe aceptarse, incluso si
      es peor.
  applies_to:
    band: true
- id: band--dwarf-special-skills-resource-hunter
  kind: warband_skill
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.dwarf-rangers.band.dwarf-special-skills-resource-hunter
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign.'
  name: Resource Hunter
  effect: This Dwarf is especially good at locating valuable resources. When rolling on the Exploration
    chart at the end of a game, the Hero may modify one dice roll by +1/-1.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Dwarf Special Skills / Resource Hunter
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/dwarf-rangers
  name_i18n:
    en: Resource Hunter
    es: Cazador de recursos
  effect_i18n:
    en: 'This Dwarf is especially good at locating valuable resources.

      When rolling on the Exploration chart at the end of a game,

      the Hero may modify one dice roll by +1/-1.'
    es: Este enano es especialmente bueno localizando recursos valiosos. Al tirar en la tabla de Exploración
      al final de una partida, el Héroe puede modificar una tirada de dado en +1/-1.
  applies_to:
    band: true
- id: band--dwarf-special-skills-true-grit
  kind: warband_skill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: skill.tough-as-steel
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.tough-as-steel
  name: True Grit
  effect: Dwarfs are hardy individuals and this Hero is hardy even for a Dwarf! When rolling on the Injury
    table for this Hero, a roll of 1-3 is treated as knocked down, 4-5 as stunned, and 6 as out of action.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Dwarf Special Skills / True Grit
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/dwarf-rangers
  name_i18n:
    en: True Grit
    es: Entereza
  effect_i18n:
    en: 'Dwarfs are hardy individuals and this Hero is hardy even for

      a Dwarf! When rolling on the Injury table for this Hero, a roll

      of 1-3 is treated as knocked down, 4-5 as stunned, and 6 as

      out of action.'
    es: ¡Los enanos son individuos duros y este Héroe lo es incluso para un enano! Al tirar en la tabla
      de Heridas para este Héroe, un resultado de 1-3 se trata como Derribado, 4-5 como Aturdido y 6 como
      Fuera de combate.
  applies_to:
    band: true
- id: band--dwarf-special-skills-thick-skull
  kind: warband_skill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: skill.thick-skull
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.thick-skull
  name: Thick Skull
  effect: The Hero has a thick skull, even for a Dwarf. He has a 3+ save on a D6 to avoid being stunned.
    If the save is made, treat a stunned result as knocked down instead. If the Dwarf also wears a helmet,
    this save is 2+ instead of 3+ (this takes the place of the normal Helmet special rule).
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Dwarf Special Skills / Thick Skull
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/dwarf-rangers
  name_i18n:
    en: Thick Skull
    es: Cráneo grueso
  effect_i18n:
    en: 'The Hero has a thick skull, even for a Dwarf. He

      has a 3+ save on a D6 to avoid being stunned. If

      the save is made, treat a stunned result as knocked

      down instead. If the Dwarf also wears a helmet,

      this save is 2+ instead of 3+ (this takes the

      place of the normal Helmet special rule).'
    es: El Héroe tiene un cráneo grueso, incluso para un enano. Tiene una salvación de 3+ en un D6 para
      evitar quedar Aturdido. Si supera la salvación, trata un resultado de Aturdido como Derribado en
      su lugar. Si el enano además lleva casco, esta salvación es 2+ en lugar de 3+ (esto sustituye a
      la regla especial normal de Casco).
  applies_to:
    band: true
- id: band--slayer-special-skills-ferocious-charge
  kind: warband_skill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: skill.ferocious-charge
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.ferocious-charge
  name: Ferocious Charge
  effect: The Slayer may double his attacks on the turn in which he charges. He will suffer a –1 to hit
