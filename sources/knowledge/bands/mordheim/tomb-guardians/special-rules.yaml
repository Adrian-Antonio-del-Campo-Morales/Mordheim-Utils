      as if using Black Lotus; the underlying poison-item mechanics are intentionally not duplicated in
      this file.
    es: El Escorpión de la Tumba ataca con su aguijón venenoso. La fuente lo resuelve como un ataque tratado
      como si usara Loto Negro; las mecánicas subyacentes del objeto veneno no están duplicadas intencionadamente
      en este fichero.
  applies_to:
