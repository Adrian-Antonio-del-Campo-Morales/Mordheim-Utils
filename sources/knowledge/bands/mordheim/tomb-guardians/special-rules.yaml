- id: band--drive-chariot
  name: Drive Chariot
  effect: A warrior needs this Academic skill to drive a Skeleton Chariot effectively in combat; without
    it, the charioteer cannot charge. The Skeleton Chariot itself is special equipment and is intentionally
    not modelled in this file.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Tomb Guardian additional skills / drive chariot (academic)
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/tomb-guardians
  name_i18n:
    en: Drive Chariot
    es: Conducir carro
  effect_i18n:
    en: A warrior needs this Academic skill to drive a Skeleton Chariot effectively in combat; without
      it, the charioteer cannot charge. The Skeleton Chariot itself is special equipment and is intentionally
      not modelled in this file.
    es: Un guerrero necesita esta habilidad Académica para conducir un Carro Esqueleto con eficacia en
      combate; sin ella, el auriga no puede cargar. El propio Carro Esqueleto es un equipo especial y
      no está modelado intencionadamente en este fichero.
  skill_category: academic
  applies_to:
    band: true
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.tomb-guardians.band.drive-chariot
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology or mounts.'
- id: band--tomb-guardian-experience-clarification
  name: Tomb Guardian Experience Clarification
  effect: The Town Cryer text is inconsistent about 'No Brain'. Mordheimer notes that the original Khemri
    material specifically states that Tomb Guardians do gain Experience, and recommends using the Tomb
    Lord maximum characteristic profile (campaign.limit.racial-maximum.tomb-lord) for them.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Inconsistencies / No Brain Rule Ambiguity
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/tomb-guardians
  name_i18n:
    en: Tomb Guardian Experience Clarification
    es: Aclaración de experiencia del Guardián de la Tumba
  effect_i18n:
    en: The Town Cryer text is inconsistent about 'No Brain'. Mordheimer notes that the original Khemri
      material specifically states that Tomb Guardians do gain Experience, and recommends using the Tomb
      Lord maximum characteristic profile (campaign.limit.racial-maximum.tomb-lord) for them.
    es: El texto de Town Cryer es incoherente respecto a 'Sin cerebro'. Mordheimer señala que el material
      original de Khemri establece específicamente que los Guardianes de la Tumba sí ganan Experiencia,
      y recomienda usar el perfil de características máximas del Señor de la Tumba (campaign.limit.racial-maximum.tomb-lord)
      para ellos.
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.tomb-guardians.band.tomb-guardian-experience-clarification
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: no effect applies to the isolated 1v1 duel or legal fighter skill/equipment
        construction.
- id: band--tomb-guardian-maximum-characteristics
  name: Tomb Guardian Maximum Characteristics
  effect: Tomb Lords use the Tomb Lord racial maximum profile (campaign.limit.racial-maximum.tomb-lord).
    Liche Priests and Acolytes use the Liche Priest racial maximum profile (campaign.limit.racial-maximum.liche-priest).
    For advancing Tomb Guardians, Mordheimer recommends using the Tomb Lord racial maximum profile (campaign.limit.racial-maximum.tomb-lord).
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Racial Maximum Characteristics / Tomb Guardians
    url: https://mordheimer.net/docs/campaigns/experience
  name_i18n:
    en: Tomb Guardian Maximum Characteristics
    es: Características máximas del Guardián de la Tumba
  effect_i18n:
    en: Tomb Lords use the Tomb Lord racial maximum profile (campaign.limit.racial-maximum.tomb-lord).
      Liche Priests and Acolytes use the Liche Priest racial maximum profile (campaign.limit.racial-maximum.liche-priest).
      For advancing Tomb Guardians, Mordheimer recommends using the Tomb Lord racial maximum profile (campaign.limit.racial-maximum.tomb-lord).
    es: Los Señores de la Tumba usan el perfil racial máximo del Señor de la Tumba (campaign.limit.racial-maximum.tomb-lord).
      Los Sacerdotes liche y los Acólitos usan el perfil racial máximo del Sacerdote liche (campaign.limit.racial-maximum.liche-priest).
      Para los Guardianes de la Tumba que progresan, Mordheimer recomienda usar el perfil racial máximo
      del Señor de la Tumba (campaign.limit.racial-maximum.tomb-lord).
