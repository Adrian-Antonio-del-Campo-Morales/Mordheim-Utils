- id: band--tomb-lord-skill-memory
  name: Tomb Lord Skill Memory
  effect: When a Tomb Lord gains a new skill, it represents remembering knowledge from life rather than
    learning something new; mechanically it follows the normal skill-advance process.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special rules / Note
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/tomb-guardians
  name_i18n:
    en: Tomb Lord Skill Memory
    es: Memoria de habilidades del Señor de la Tumba
  effect_i18n:
    en: When a Tomb Lord gains a new skill, it represents remembering knowledge from life rather than
      learning something new; mechanically it follows the normal skill-advance process.
    es: Cuando un Señor de la Tumba gana una nueva habilidad, representa recordar conocimiento de su vida
      en lugar de aprender algo nuevo; mecánicamente sigue el proceso normal de progreso de habilidades.
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
