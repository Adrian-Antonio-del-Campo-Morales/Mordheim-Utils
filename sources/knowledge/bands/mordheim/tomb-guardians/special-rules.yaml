- id: band--no-brain
  name: No Brain
  effect: >-
    Skeleton Warriors never gain Experience. This rule does not prevent Tomb Guardians from gaining
    Experience.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special rules / No Brain
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/tomb-guardians
  name_i18n:
    es: Sin Cerebro
  effect_i18n:
    es: >-
      Los Guerreros esqueleto nunca ganan Experiencia. Esta regla no impide que los Guardianes de la
      Tumba ganen Experiencia.
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.tomb-guardians.band.no-brain
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: campaign, shooting, movement, terrain, deployment, or non-duel context.
- id: band--tomb-lord-skill-memory
  name: Tomb Lord Skill Memory
  effect: >-
    When a Tomb Lord gains a new skill, it represents remembering knowledge from life rather than
    learning something new; mechanically it follows the normal skill-advance process.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special rules / Note
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/tomb-guardians
  name_i18n:
    es: Memoria de Habilidades del Señor de la Tumba
  effect_i18n:
    es: >-
      Cuando un Señor de la Tumba gana una nueva habilidad, representa recordar conocimiento de su
      vida en lugar de aprender algo nuevo; mecánicamente sigue el proceso normal de progreso de
      habilidades.
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.tomb-guardians.band.tomb-lord-skill-memory
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: campaign, shooting, movement, terrain, deployment, or non-duel context.
- id: band--do-not-drink
  name: Do Not Drink
  effect: >-
    Undead models do not need food or water. Living animals accompanying the warband follow any
    applicable water rules normally.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special rules / Do not Drink
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/tomb-guardians
  name_i18n:
    es: No Beben
  effect_i18n:
    es: >-
      Las miniaturas muertas vivientes no necesitan comida ni agua. Los animales vivientes que
      acompañan a la banda siguen con normalidad cualquier regla de agua aplicable.
  applies_to:
    band: true
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.tomb-guardians.band.do-not-drink
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: psychology or mounts.
- id: band--home-ground
  name: Home Ground
  effect: A Tomb Guardian warband always rolls one extra die in the Exploration phase.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special rules / Home Ground
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/tomb-guardians
  name_i18n:
    es: Terreno Propio
  effect_i18n:
    es: Una banda de Guardianes de la Tumba siempre tira un dado extra en la fase de Exploración.
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.tomb-guardians.band.home-ground
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: campaign, shooting, movement, terrain, deployment, or non-duel context.
- id: band--drive-chariot
  name: Drive Chariot
  effect: >-
    A warrior needs this Academic skill to drive a Skeleton Chariot effectively in combat; without
    it, the charioteer cannot charge. The Skeleton Chariot itself is special equipment and is
    intentionally not modelled in this file.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Tomb Guardian additional skills / drive chariot (academic)
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/tomb-guardians
  name_i18n:
    es: Conducir Carro
  effect_i18n:
    es: >-
      Un guerrero necesita esta habilidad Académica para conducir un Carro Esqueleto con eficacia en
      combate; sin ella, el auriga no puede cargar. El propio Carro Esqueleto es un equipo especial
      y no está modelado intencionadamente en este fichero.
  skill_category: academic
  applies_to:
    band: true
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.tomb-guardians.band.drive-chariot
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: psychology or mounts.
- id: band--tomb-guardian-experience-clarification
  name: Tomb Guardian Experience Clarification
  effect: >-
    The Town Cryer text is inconsistent about 'No Brain'. Mordheimer notes that the original Khemri
    material specifically states that Tomb Guardians do gain Experience, and recommends using the
    Tomb Lord maximum characteristic profile (campaign.limit.racial-maximum.tomb-lord) for them.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Inconsistencies / No Brain Rule Ambiguity
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/tomb-guardians
  name_i18n:
    es: Aclaración de Experiencia del Guardián de la Tumba
  effect_i18n:
    es: >-
      El texto de Town Cryer es incoherente respecto a 'Sin cerebro'. Mordheimer señala que el
      material original de Khemri establece específicamente que los Guardianes de la Tumba sí ganan
      Experiencia, y recomienda usar el perfil de características máximas del Señor de la Tumba
      (campaign.limit.racial-maximum.tomb-lord) para ellos.
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.tomb-guardians.band.tomb-guardian-experience-clarification
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: no effect applies to the isolated 1v1 duel or legal fighter skill/equipment
        construction.
- id: band--tomb-guardian-maximum-characteristics
  name: Tomb Guardian Maximum Characteristics
  effect: >-
    Tomb Lords use the Tomb Lord racial maximum profile (campaign.limit.racial-maximum.tomb-lord).
    Liche Priests and Acolytes use the Liche Priest racial maximum profile
    (campaign.limit.racial-maximum.liche-priest). For advancing Tomb Guardians, Mordheimer
    recommends using the Tomb Lord racial maximum profile (campaign.limit.racial-maximum.tomb-lord).
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Racial Maximum Characteristics / Tomb Guardians
    url: https://mordheimer.net/docs/campaigns/experience
  name_i18n:
    es: Características Máximas del Guardián de la Tumba
  effect_i18n:
    es: >-
      Los Señores de la Tumba usan el perfil racial máximo del Señor de la Tumba
      (campaign.limit.racial-maximum.tomb-lord). Los Sacerdotes liche y los Acólitos usan el perfil
      racial máximo del Sacerdote liche (campaign.limit.racial-maximum.liche-priest). Para los
      Guardianes de la Tumba que progresan, Mordheimer recomienda usar el perfil racial máximo del
      Señor de la Tumba (campaign.limit.racial-maximum.tomb-lord).
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.tomb-guardians.band.tomb-guardian-maximum-characteristics
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: no effect applies to the isolated 1v1 duel or legal fighter skill/equipment
        construction.
- id: liche-priest--no-armour
  name: No Armour
  effect: >-
    A Liche Priest may never wear armour because it interferes with spell casting.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 – 1 Liche Priest / Special Rules / No Armour
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/tomb-guardians
  name_i18n:
    es: Sin Armadura
  effect_i18n:
    es: >-
      Un Sacerdote Liche jamás puede llevar armadura porque interfiere con el lanzamiento de conjuros.
  applies_to:
    profile_ids:
    - liche-priest
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: profile.equipment-restrictions
      scope: 'YES'
      binding:
        kind: profile
        id: profile.equipment-restrictions
        parameters:
          forbids: armour
