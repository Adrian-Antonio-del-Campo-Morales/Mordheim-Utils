- id: tomb-guardians--experience
  name: Experience
  effect: >-
    Tomb Guardians gain Experience. Mordheimer recommends using the Tomb Lord racial maximum
    characteristics for Tomb Guardians when they advance.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Henchmen / Tomb Guardians / Experience
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/tomb-guardians
  name_i18n:
    es: Experiencia
  effect_i18n:
    es: >-
      Los Guardianes de la Tumba ganan Experiencia. Mordheimer recomienda usar las características
      máximas raciales del Señor de la Tumba para los Guardianes de la Tumba cuando progresan.
  applies_to:
    profile_ids:
    - tomb-guardians
  runtime:
