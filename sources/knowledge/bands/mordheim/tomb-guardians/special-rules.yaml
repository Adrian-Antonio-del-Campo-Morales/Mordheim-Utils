  name: Scorpion's Sting
  effect: >-
    The Tomb Scorpion attacks with its poisonous sting. The source resolves this as an attack
    treated as if using Black Lotus; the underlying poison-item mechanics are intentionally not
    duplicated in this file.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Henchmen / Tomb Scorpions / Special Rules / Scorpions sting
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/tomb-guardians
  name_i18n:
    es: Aguijón de Escorpión
  effect_i18n:
    es: >-
      El Escorpión de la Tumba ataca con su aguijón venenoso. La fuente lo resuelve como un ataque
      tratado como si usara Loto Negro; las mecánicas subyacentes del objeto veneno no están
      duplicadas intencionadamente en este fichero.
  applies_to:
    profile_ids:
    - tomb-scorpions
