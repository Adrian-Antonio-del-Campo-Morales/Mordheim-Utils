      scope: 'YES'
      binding:
        kind: mechanic
        id: poison.black-lotus
  name: Scorpion's Sting
  effect: The Tomb Scorpion attacks with its poisonous sting. The source resolves this as an attack treated
    as if using Black Lotus; the underlying poison-item mechanics are intentionally not duplicated in
    this file.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Henchmen / Tomb Scorpions / Special Rules / Scorpions sting
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/tomb-guardians
  name_i18n:
    en: Scorpion's Sting
    es: Aguijón de escorpión
  effect_i18n:
