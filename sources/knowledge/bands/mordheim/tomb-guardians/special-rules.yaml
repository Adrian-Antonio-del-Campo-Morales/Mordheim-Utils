schema_version: 2
band_id: tomb-guardians
rules:
- id: tomb-lord--leader
  name: Leader
  effect: The Tomb Lord is the warband's Leader and follows all the rules for Leaders.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 1 Tomb Lord / Special Rules / Leader
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/tomb-guardians
  name_i18n:
    es: Líder
  effect_i18n:
    es: El Señor de la Tumba es el Líder de la banda y sigue todas las reglas de los Líderes.
  applies_to:
    profile_ids:
    - tomb-lord
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.tomb-guardians.tomb-lord.leader
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: psychology or mounts.
- id: tomb-lord--undead
  name: Undead
  effect: The Tomb Lord is undead and follows all rules for the Undead.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 1 Tomb Lord / Special Rules / Undead
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/tomb-guardians
  name_i18n:
    es: Muerto Viviente
  effect_i18n:
    es: >-
      El Señor de la Tumba es un muerto viviente y sigue todas las reglas de los Muertos Vivientes.
  applies_to:
    profile_ids:
    - tomb-lord
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.tomb-guardians.tomb-lord.undead
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: psychology or mounts.
- id: tomb-lord--flammable
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: trait.flammable
      scope: 'YES'
      binding:
        kind: trait
        id: trait.flammable
        parameters:
          value: true
  name: Flammable
  effect: A fire-based attack that hits the Tomb Lord causes double the normal number of Wounds.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special rules / Flammable
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/tomb-guardians
  name_i18n:
    es: Inflamable
  effect_i18n:
    es: >-
      Un ataque de base fuego que impacte al Señor de la Tumba causa el doble del número normal de
      Heridas.
  applies_to:
    profile_ids:
    - tomb-lord
- id: liche-priest--wizard
  name: Wizard
  effect: >-
    The Liche Priest is a Wizard and uses Mortuary Cult scrolls. The scroll/spell list itself is
    intentionally not modelled in this file.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 – 1 Liche Priest / Special Rules / Wizard
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/tomb-guardians
  name_i18n:
    es: Mago
  effect_i18n:
    es: >-
      El Sacerdote liche es un Mago y usa pergaminos del Culto Mortuorio. La propia lista de
      pergaminos/hechizos no está modelada intencionadamente en este fichero.
  applies_to:
    profile_ids:
    - liche-priest
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.tomb-guardians.liche-priest.wizard
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: campaign, shooting, movement, terrain, deployment, or non-duel context.
