  effect: 'The mutant has a long barbed tail with a venomed tip, allowing him to make an extra Strength 5 attack in each hand-to-hand
    combat phase. If the model hit by the tail is immune to poison, the Strength of the hit is reduced to 2.

    Cost: 40 gold crowns'
  source:
