  name: Great Claw
  effect: 'One of the mutant’s arms ends in a great, crab-like claw. He may carry no weapons in this arm, but gains an extra
    attack in hand-to-hand combat with a +1 Strength bonus.

    Cost: 50 gold crowns.'
  source:
