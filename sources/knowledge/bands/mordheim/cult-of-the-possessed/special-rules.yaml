  name: Tentacle
  effect: 'One of the mutant’s arms ends in a tentacle. He may grapple his opponent in close combat to reduce his attacks
    by -1, down to a minimum of 1. The mutant may decide which attack his opponent loses.

    Cost: 35 gold crowns'
  source:
