    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.cult-of-the-possessed.magister.magic-user
      scope: 'NO'
      binding: null
      reason: 'Out of scope: no effect applies to the isolated 1v1 duel or legal fighter skill/equipment construction.'
  name: Magic User
  effect: The Magister has the ability to use magic and casts spells like any other magicians, and the Magister starts with
    one spell generated at random from the Chaos Rituals. In addition the Magister may learn a new Spell instead of a new
    skill.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 1 Magister / Special Rules / Magic User
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/cult-of-the-possessed
  name_i18n:
