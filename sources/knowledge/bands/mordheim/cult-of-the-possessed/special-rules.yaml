  kind: mutation
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.band-mutations-hideous
      scope: LATER
      binding: null
      reason: fear/psychology is outside the duel runtime
  name: Hideous
  effect: 'The mutant causes fear. Cost: 40 gold crowns'
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Mutations / hideous
