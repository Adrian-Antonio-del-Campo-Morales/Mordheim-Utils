  name: Crazed
  effect: Darksouls have been driven insane by daemonic possession and know no fear. They automatically pass any Leadership
    tests they are required to take.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 5 Darksouls / Special Rules / Crazed
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/cult-of-the-possessed
