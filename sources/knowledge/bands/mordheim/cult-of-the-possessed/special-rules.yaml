    - id: unimplemented.band-mutations-daemon-soul
      scope: 'NO'
      binding: null
      reason: only affects spells and prayers
  name: Daemon Soul
  effect: 'A Daemon lives within the mutant’s soul. This gives him a 4+ save against the effects of spells or prayers.

    Cost: 20 gold crowns.'
  source:
