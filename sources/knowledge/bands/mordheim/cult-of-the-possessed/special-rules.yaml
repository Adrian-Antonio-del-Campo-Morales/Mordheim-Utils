  runtime_selectable: true
  name: Extra Arm
  effect: 'The mutant may use any single-handed weapon in the extra arm, giving him +1 attack when fighting in hand-to-hand
    combat. Alternatively, he may carry a shield or a buckler in the extra arm. If a Possessed chooses to do this, he gains
    an extra attack but still cannot carry a weapon.

    Cost: 40 gold crowns'
  source:
