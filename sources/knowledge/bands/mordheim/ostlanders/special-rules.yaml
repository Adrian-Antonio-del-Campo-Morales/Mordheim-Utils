- id: band--ostlander-special-skills-animal-friendship
  kind: warband_skill
  name: Animal Friendship
  effect: 'Having grown up amidst the animals of the forest, this

    warrior exudes a certain charm

    to all ''normal'' animals (ie,

    warhorses, warhounds, etc)

    Animals will never attack him

    and up to two wardogs (see Mordheim book, page 54) that

    the warrior owns do not count

    against the maximum number

    of models in the warband.'
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Ostlander Special Skills / Animal friendship
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/ostlander
