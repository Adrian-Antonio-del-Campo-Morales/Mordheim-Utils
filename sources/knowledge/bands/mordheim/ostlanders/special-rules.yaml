schema_version: 2
band_id: ostlanders
rules:
- id: elder--leader
  name: Leader
  effect: Any warrior within 6" of the Elder may use his Leadership characteristic when taking Leadership
    tests.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 1 Elder / Special Rules / Leader
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/ostlander
  name_i18n:
    en: Leader
    es: Líder
  effect_i18n:
    en: 'Any warrior within 6" of the Elder may use his Leadership characteristic when

      taking Leadership tests.'
    es: Cualquier guerrero a 6" del Anciano puede usar su característica de Liderazgo al realizar chequeos
      de Liderazgo.
  applies_to:
    profile_ids:
    - elder
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.ostlanders.elder.leader
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology or mounts.'
