- id: band--ostlander-special-skills-taunt
  kind: warband_skill
  name: Taunt
  effect: 'After years of baiting opponents into drunken

    brawls, this Ostlander has learned some of

    most vile insults in the Empire. During the

    Shooting phase, the warrior may choose to

    taunt one enemy instead of shooting with a

    missile weapon or casting a spell. The warrior

    must be able to see the enemy and taunting

    follows all the LOS rules for shooting (you

    must taunt the nearest opponent, etc). The

    player should insult the enemy model in some

    manner whenever possible (perhaps his hat

    looks like a strangled parrot or his mother was

    a Bretonnian!). The enemy then takes a

    Leadership test. If he passes, nothing happens,

    but if he fails he must spend his next

    Movement phase trying to get into close

    combat with the warrior who taunted

    him.'
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Ostlander Special Skills / Taunt
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/ostlander
  name_i18n:
    en: Taunt
    es: null
  effect_i18n:
