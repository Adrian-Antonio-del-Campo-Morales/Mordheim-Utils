  name: Squire Retinue Limit
  effect: The warband may not include more Squires than Knights. For this limit, Knights are the Questing Knight plus all
    Knights Errant in the warband.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Choice of warriors / Squires
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/bretonnian
  name_i18n:
    en: Squire Retinue Limit
    es: Límite de Escuderos
  effect_i18n:
    en: The warband may not include more Squires than Knights. For this limit, Knights are the Questing Knight plus all Knights
      Errant in the warband.
    es: La banda no puede incluir más Escuderos que Caballeros. Para este límite cuentan el Caballero Andante y todos los
      Caballeros Noveles de la banda.
  applies_to:
    band: true
