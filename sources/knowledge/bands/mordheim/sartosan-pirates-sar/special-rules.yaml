- id: band--sartosan-special-rules
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.sartosan-pirates-sar.band.sartosan-special-rules
      scope: 'NO'
      binding: null
      reason: pending-classification
  name: Sartosan Special Rules
  effect: >-
    Unlike other Human Pirates, Sartosan Pirates can start with a Swivel Gun (must purchase it, of
    course). When playing one-off games, they start off with two free Swabbies. Also, in addition to
    being able to access New Pirate Skills, Sartosan Pirates have access to the following Skills,
    unique to them alone, hereby dubbed 'Old' Pirate Skills (see Sartosan Old Pirate Skills).
  source:
    manual: broheim.net
    printed_page: 1
    section: Sartosan Special Rules
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Human%20Pirates.pdf
  name_i18n:
    es: Reglas Especiales Sartosanas
  effect_i18n:
    es: >-
      A diferencia de otros Piratas Humanos, los Piratas Sartosanos pueden empezar con un cañón
      giratorio (deben comprarlo, claro). Al jugar partidas sueltas, empiezan con dos Fregones
      gratis. Además, además de poder acceder a las Nuevas Habilidades de Pirata, los Piratas
      Sartosanos tienen acceso a las siguientes habilidades, únicas de ellos, denominadas
      Habilidades de Pirata 'Antiguas' (ver Habilidades de Pirata Antiguas Sartosanas).
  applies_to:
    band: true
- id: band--sartosan-old-pirate-skills
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.sartosan-pirates-sar.band.sartosan-old-pirate-skills
      scope: 'NO'
      binding: null
      reason: pending-classification
  name: Sartosan 'Old' Pirate Skills
  effect: >-
    Sea Shanty Singer: the pirate is renowned throughout the seas as one of the greatest singers
    aboard a ship; at the start of his Close Combat phase he can suddenly burst out in song,
    distracting one opponent in base contact of his choosing; that enemy must pass a Leadership
    test, or lose 1 Attack that turn (does not affect Undead or other non-living creatures, such as
    Possessed). Cutlass Master: if the pirate is equipped with a Sword, this skill gives him the
    additional benefit of also being able to parry successfully if the player rolls equal to the
    number rolled to hit, not just higher as normal; this extra ability only applies if the Pirate
    is not in the open (i.e. only when in cover or in a building, within 2" of a terrain feature
    like a wall or tree, etc). Booming Voice (Captain only): once per turn, the captain may shout
    encouraging words (or threats) at any one pirate within 8" who just failed his test to see if he
    runs away from combat, or to stop running away if he was already fleeing; that pirate may then
    re-roll the test; this can only be done if the Captain is on his feet, but not if the Captain is
    in close combat himself. Hardy Constitution: during the battle, the pirate may ignore any
    Critical Hits on a roll of 5+ (the wound is treated as normal if the roll is successful); if the
    roll is failed, the Critical Hit is worked out as normal.
  source:
    manual: broheim.net
    printed_page: 1
    section: Sartosan Special Rules / Old Pirate Skills
    url: https://broheim.net/downloads/warbands/supplement/sartosa/Human%20Pirates.pdf
  name_i18n:
    es: Habilidades de Pirata 'Antiguas' Sartosanas
  effect_i18n:
    es: >-
      Cantante de Salomas: el pirata es renombrado en todos los mares como uno de los mejores
      cantantes de a bordo; al comienzo de su fase de Combate Cuerpo a Cuerpo puede estallar en
      canción, distrayendo a un oponente en contacto base de su elección; ese enemigo debe superar
      un chequeo de Liderazgo o perder 1 Ataque ese turno (no afecta a No Muertos ni otras criaturas
      no vivas, como los Poseídos). Maestro del Sable: si el pirata lleva una Espada, esta habilidad
      le otorga el beneficio adicional de poder efectuar paradas con éxito si el jugador saca el
      mismo número que el sacado para impactar, no solo uno mayor como es normal; esta habilidad
      extra solo aplica si el Pirata no está a campo abierto (es decir, solo en cobertura o dentro
      de un edificio, a 2" de un rasgo de terreno como un muro o un árbol, etc.). Voz Retumbante
      (solo Capitán): una vez por turno, el capitán puede gritar palabras de ánimo (o amenazas) a
      cualquier pirata a 8" que acabe de fallar su chequeo para ver si huye del combate, o para que
      deje de huir si ya estaba huyendo; ese pirata puede repetir el chequeo; solo puede hacerse si
      el Capitán está en pie, pero no si el Capitán está en combate cuerpo a cuerpo. Constitución
      Recia: durante la batalla, el pirata puede ignorar cualquier Impacto Crítico con un resultado
      de 5+ (la herida se resuelve con normalidad si la tirada tiene éxito); si la tirada falla, el
      Impacto Crítico se resuelve con normalidad.
  applies_to:
    band: true
