    - id: unimplemented.lizardmen-lus.kroxigor.animal
      scope: LATER
      binding: null
      reason: deferred.other
      clauses:
      - id: whole
        scope: 'NO'
  name: Animal
  effect: >-
    Kroxigor are slow-witted creatures that never learn from their mistakes; they do not gain
    experience.
  source:
    manual: broheim.net
    printed_page: 5
    section: 0-1 Kroxigor / Special Rules / Animal
    url: https://broheim.net/downloads/warbands/supplement/lustria/Lizardmen.pdf
  name_i18n:
    es: Animal
  effect_i18n:
    es: >-
      Los Kroxigor son criaturas de ingenio lento que nunca aprenden de sus errores; no ganan
      experiencia.
  applies_to:
    profile_ids:
    - kroxigor
- id: band--maximum-characteristics
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.lizardmen-lus.band.maximum-characteristics
      scope: LATER
      binding: null
      reason: out-of-scope.campaign
      clauses:
      - id: whole
        scope: 'NO'
  name: Lizardmen Maximum Characteristics
  effect: >-
    Characteristics for Lizardmen may not be increased beyond the maximum limits. Skink maximums: M
    6, WS 5, BS 6, S 4, T 3, W 3, I 7, A 4, Ld 8. Saurus maximums: M 4, WS 6, BS 0, S 5, T 5, W 3, I
    4, A 4+1, Ld 10. If a characteristic is at its maximum, take the other option or roll again if
    you can only increase one characteristic. If both are already at their maximum, you may increase
    any other by +1 instead. Remember that Henchman can only add +1 to any characteristic.
  source:
    manual: broheim.net
    printed_page: 1
    section: Maximum Characteristics
    url: https://broheim.net/downloads/warbands/supplement/lustria/Lizardmen.pdf
  name_i18n:
    es: Características Máximas de los Hombres Lagarto
  effect_i18n:
    es: >-
      Las características de los Hombres Lagarto no pueden aumentarse más allá de los límites
      máximos. Máximos de Skink: M 6, HA 5, HP 6, F 4, R 3, H 3, I 7, A 4, L 8. Máximos de Saurus: M
      4, HA 6, HP 0, F 5, R 5, H 3, I 4, A 4+1, L 10. Si una característica está en su máximo, toma
      la otra opción o vuelve a tirar si solo puedes aumentar una característica. Si ambas están ya
      en su máximo, puedes aumentar cualquier otra en +1 en su lugar. Recuerda que los secuaces solo
      pueden añadir +1 a cualquier característica.
  applies_to:
    band: true
- id: band--bite-attack
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: compiler.bite-attack
      scope: 'YES'
      binding:
        kind: compiler
        id: compiler.bite-attack
  name: Bite Attack
  effect: >-
    The Saurus have a powerful bite attack, this bite attack uses the Saurus' own strength to wound
    and receives no penalty for not using a weapon. The bite attack always strikes last, regardless
    of who charged or which weapon is used, even after double-handed weapons.
  source:
    manual: broheim.net
    printed_page: 1
    section: Special Rules / Bite Attack
    url: https://broheim.net/downloads/warbands/supplement/lustria/Lizardmen.pdf
  name_i18n:
    es: Ataque de Mordisco
  effect_i18n:
    es: >-
      Los Saurus tienen un poderoso ataque de mordisco; este ataque usa la propia Fuerza del Saurus
      para herir y no recibe penalización por no usar un arma. El ataque de mordisco siempre golpea
      el último, sin importar quién cargó ni qué arma se use, incluso después de armas a dos manos.
  applies_to:
    profile_ids:
    - saurus-totem-warriors
    - saurus-braves
- id: band--aquatic
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.lizardmen-lus.band.aquatic
      scope: 'NO'
      binding: null
      reason: out-of-scope.movement
  name: Aquatic
  effect: >-
    Skinks may move through water terrain with no penalty, and count as being in cover whilst they
    are in the water.
  source:
    manual: broheim.net
    printed_page: 1
    section: Special Rules / Aquatic
    url: https://broheim.net/downloads/warbands/supplement/lustria/Lizardmen.pdf
  name_i18n:
    es: Acuático
  effect_i18n:
    es: >-
      Los Skinks pueden moverse por terreno de agua sin penalización y cuentan como estando en
      cobertura mientras estén en el agua.
  applies_to:
    profile_ids:
    - skink-priest
    - skink-great-crests
    - skink-braves
