      scope: 'YES'
      binding:
        kind: trait
        id: trait.natural-armour-save
        parameters:
          value: 4
  name: Scaly Skin
  effect: Kroxigor have a natural save of 4+.
  source:
    manual: broheim.net
    printed_page: 5
    section: 0-1 Kroxigor / Special Rules / Scaly Skin
    url: https://broheim.net/downloads/warbands/supplement/lustria/Lizardmen.pdf
  name_i18n:
    es: Piel Escamosa
  effect_i18n:
    es: Los Kroxigor tienen una salvación natural de 4+.
  applies_to:
    profile_ids:
    - kroxigor
- id: kroxigor--aquatic
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.lizardmen-lus.kroxigor.aquatic
      scope: 'NO'
      binding: null
      reason: out-of-scope.non-duel
  name: Aquatic
  effect: >-
    Kroxigor may move through water with no penalty and count as being in cover while in the water.
  source:
    manual: broheim.net
    printed_page: 5
    section: 0-1 Kroxigor / Special Rules / Aquatic
    url: https://broheim.net/downloads/warbands/supplement/lustria/Lizardmen.pdf
  name_i18n:
    es: Acuático
  effect_i18n:
    es: >-
      Los Kroxigor pueden moverse por el agua sin penalización y cuentan como en cobertura mientras
      estén en el agua.
  applies_to:
    profile_ids:
    - kroxigor
- id: kroxigor--cause-fear
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: mechanic.causes-fear
      scope: 'YES'
      binding:
        kind: mechanic
        id: mechanic.causes-fear
  name: Cause Fear
  source:
    manual: broheim.net
    printed_page: 5
    section: 0-1 Kroxigor / Special Rules / Cause Fear
    url: https://broheim.net/downloads/warbands/supplement/lustria/Lizardmen.pdf
