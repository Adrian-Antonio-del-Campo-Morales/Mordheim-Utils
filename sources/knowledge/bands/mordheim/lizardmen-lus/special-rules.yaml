- id: band--skink-poison-application
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: profile.equipment-restrictions
      scope: 'YES'
      binding:
        kind: profile
        id: profile.equipment-restrictions
        parameters:
          poisons:
          - poison.black-venom
          - poison.black-lotus
          weapon_kinds:
          - ranged-weapon
  name: Skink Poison Application
  effect: >-
    Skink Heroes may apply Dark Venom and Black Lotus to missile weapons only; a Skink never coats
    a close combat weapon with them. The clause qualifies the application, not the acquisition route.
  source:
    manual: broheim.net
    printed_page: 2
    section: Poisoned Weapons / Skinks
    url: https://broheim.net/downloads/warbands/supplement/lustria/Lizardmen.pdf
  name_i18n:
    es: Aplicación de Venenos Skink
  effect_i18n:
    es: >-
      Los Héroes Skink solo pueden aplicar Veneno Oscuro y Loto Negro a armas de proyectil; un
      Skink nunca impregna un arma de cuerpo a cuerpo con ellos. La cláusula califica la
      aplicación, no la vía de adquisición.
  applies_to:
    profile_ids:
    - skink-priest
    - skink-great-crests
- id: band--skink-henchman-poison-application
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: profile.equipment-restrictions
      scope: 'YES'
      binding:
        kind: profile
        id: profile.equipment-restrictions
        parameters:
          poisons:
          - poison.reptile-venom
          weapon_kinds:
          - ranged-weapon
      clauses:
      - id: whole
        scope: 'NO'
  name: Skink Henchman Poison Application
  effect: >-
    Skink henchmen may coat their missile weapons with Reptile Venom for one battle; it is never
    applied to a close combat weapon.
  source:
    manual: broheim.net
    printed_page: 2
    section: Poisoned Weapons / Skinks
    url: https://broheim.net/downloads/warbands/supplement/lustria/Lizardmen.pdf
  name_i18n:
    es: Aplicación de Veneno de los Secuaces Skink
  effect_i18n:
    es: >-
      Los secuaces Skink pueden impregnar sus armas de proyectil con Veneno de Reptil durante una
      batalla; nunca se aplica a un arma de cuerpo a cuerpo.
  applies_to:
    profile_ids:
    - skink-braves
- id: band--saurus-poison-application
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: profile.equipment-restrictions
      scope: 'YES'
      binding:
        kind: profile
        id: profile.equipment-restrictions
        parameters:
          poisons:
          - poison.black-venom
          - poison.black-lotus
          weapon_kinds:
          - close-combat-weapon
  name: Saurus Poison Application
  effect: >-
    Saurus may apply Dark Venom and Black Lotus to close combat weapons; the Trading procedure
    does not change which weapons the poison may coat.
  source:
    manual: broheim.net
    printed_page: 2
    section: Poisoned Weapons / Saurus
    url: https://broheim.net/downloads/warbands/supplement/lustria/Lizardmen.pdf
  name_i18n:
    es: Aplicación de Venenos Saurus
  effect_i18n:
    es: >-
      Los Saurus pueden aplicar Veneno Oscuro y Loto Negro a armas de cuerpo a cuerpo; el
      procedimiento de Comercio no cambia qué armas puede impregnar el veneno.
  applies_to:
    profile_ids:
    - saurus-totem-warriors
    - saurus-braves
