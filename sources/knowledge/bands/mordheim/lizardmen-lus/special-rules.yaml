schema_version: 2
band_id: lizardmen-lus
rules:
- id: band--scaly-skin
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: band
    effects:
    - id: compiler.lizardmen-scaly-skin
      scope: 'YES'
      binding:
        kind: compiler
        id: compiler.lizardmen-scaly-skin
  name: Scaly Skin
  effect: >-
    All Lizardmen have a natural save thanks to their thick scales: Saurus 5+, Skinks 6+. Strength
    modifiers cannot alter the save beyond 6, but a "no save" result on the injury chart negates it.
    Light armour adds +1 to the save, as does a shield.
  source:
    manual: broheim.net
    printed_page: 1
    section: Special Rules / Scaly Skin
    url: https://broheim.net/downloads/warbands/supplement/lustria/Lizardmen.pdf
  name_i18n:
    es: Piel Escamosa
  effect_i18n:
    es: >-
      Todos los Hombres Lagarto tienen una salvación natural gracias a sus escamas gruesas: Saurus
      5+, Skinks 6+. Los modificadores de Fuerza no pueden alterar la salvación más allá de 6, pero
      un resultado de "sin salvación" en la tabla de heridas la anula. La armadura ligera suma +1 a
      la salvación, al igual que un escudo.
  applies_to:
    band: true
- id: band--armour-cost
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.lizardmen-lus.band.armour-cost
      scope: 'NO'
      binding: null
      reason: pending-classification
  name: Armour
  effect: >-
    Armour is rare amongst the Lizardmen and the cost of light armour is always 50 gold crowns.
  source:
    manual: broheim.net
    printed_page: 1
    section: Special Rules / Armour
    url: https://broheim.net/downloads/warbands/supplement/lustria/Lizardmen.pdf
  name_i18n:
    es: Armadura
  effect_i18n:
    es: >-
      La armadura es rara entre los Hombres Lagarto y la armadura ligera siempre cuesta 50 coronas
      de oro.
  applies_to:
    band: true
- id: band--cold-blooded
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: band
    effects:
    - id: mechanic.cold-blooded-psychology
      scope: 'YES'
      binding:
        kind: mechanic
        id: mechanic.cold-blooded-psychology
      clauses:
      - id: cold-blooded-psychology
        scope: 'YES'
      - id: rout-test
        scope: 'NO'
    - id: unimplemented.lizardmen-lus.band.cold-blooded.rout
      scope: 'NO'
      binding: null
      reason: out-of-scope.group
  name: Cold Blooded
  effect: >-
    Lizardmen roll 3D6 and select the lowest two dice when taking a psychology or Rout test. A
    Lizardmen warband may never use the Leadership of the Saurus or Kroxigor for a Rout test.
  source:
    manual: broheim.net
    printed_page: 1
    section: Special Rules / Cold Blooded
    url: https://broheim.net/downloads/warbands/supplement/lustria/Lizardmen.pdf
  name_i18n:
    es: Sangre Fría
  effect_i18n:
    es: >-
      Los Hombres Lagarto tiran 3D6 y eligen los dos dados más bajos al realizar un chequeo de
      psicología o de huida. Una banda de Hombres Lagarto nunca puede usar el Liderazgo del Saurus
      ni del Kroxigor en un chequeo de huida.
  applies_to:
    band: true
- id: band--saurus-rarity
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.lizardmen-lus.band.saurus-rarity
      scope: 'NO'
      binding: null
      reason: pending-classification
  name: Saurus Rarity
  effect: >-
    You can never have more Saurus Braves than Skink Braves in the warband; the Slann mage-priests
    would never allow it.
  source:
    manual: broheim.net
    printed_page: 1
    section: Special Rules / Saurus Rarity
    url: https://broheim.net/downloads/warbands/supplement/lustria/Lizardmen.pdf
  name_i18n:
    es: Rareza de los Saurus
  effect_i18n:
    es: >-
      Nunca puede haber más Valientes Saurus que Valientes Skink en la banda; los sacerdotes-mago
      Slann nunca lo permitirían.
  applies_to:
    band: true
- id: skink-priest--leader
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: mechanic.leader-six
      scope: 'YES'
      binding:
        kind: mechanic
        id: mechanic.leader-six
      clauses:
      - id: leader-six
        scope: 'YES'
      - id: leader-replacement
        scope: 'NO'
  name: Leader
  effect: >-
    The Skink Priest is the leader of the warband; any Lizardmen within 6 inches may use his
    Leadership for any Leadership test. If he is killed, a new Skink Priest may be recruited, but
    the warband must play at least one game without a leader first.
  source:
    manual: broheim.net
    printed_page: 4
    section: 1 Skink Priest / Special Rules / Leader
    url: https://broheim.net/downloads/warbands/supplement/lustria/Lizardmen.pdf
  name_i18n:
    es: Líder
  effect_i18n:
    es: >-
      El Sacerdote Skink es el líder de la banda; cualquier Hombre Lagarto a 6 pulgadas puede usar
      su Liderazgo en cualquier chequeo de Liderazgo. Si muere, puede reclutarse un nuevo Sacerdote
      Skink, pero la banda debe jugar al menos una partida sin líder antes.
  applies_to:
    profile_ids:
    - skink-priest
- id: skink-priest--wizard
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.lizardmen-lus.skink-priest.wizard
      scope: 'NO'
      binding: null
      reason: out-of-scope.non-duel
  name: Wizard
  source:
    manual: broheim.net
    printed_page: 4
    section: 1 Skink Priest / Special Rules / Wizard
    url: https://broheim.net/downloads/warbands/supplement/lustria/Lizardmen.pdf
  name_i18n:
    es: Mago
  applies_to:
    profile_ids:
    - skink-priest
  rule_ref: shared-rule.skink-priest-wizard
- id: kroxigor--scaly-skin
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
