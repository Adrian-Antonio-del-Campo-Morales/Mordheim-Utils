  name: Flyers
  effect: >-
    Sgulls are granted a mockery of flight in their undeath. They ignore all terrain and can move at
    any angle.
  source:
    manual: broheim.net
    printed_page: 14
    section: Henchmen / 0-3 Sgulls / Special Rules / Flyers
    url: https://broheim.net/downloads/fo/97RelicsoftheCrusadesPt2.pdf
  name_i18n:
    es: Voladores
  effect_i18n:
    es: >-
      Los buitres muertos reciben una burla del vuelo en su no-muerte. Ignoran todo terreno y pueden
      moverse en cualquier ángulo.
  applies_to:
