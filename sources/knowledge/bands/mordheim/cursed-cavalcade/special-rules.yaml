  name_i18n:
    en: The Throne of Worms
    es: El Trono de los Gusanos
  effect_i18n:
    en: 'For each enemy captured, instead of rolling normally on the Serious Injury Table after the battle,
      roll a D6: 1-2 = remove the warrior permanently from the original warband; 3-5 = remove the warrior
      from the original warband and add one Captured Thrall to the Cavalcade; 6 = remove the warrior from
      the original warband and one random Cavalcade Hero gains +1 Experience. This replaces the standard
      Captured! Serious Injury rules for Heroes.'
    es: 'Por cada enemigo capturado, en lugar de tirar con normalidad en la tabla de Heridas Graves tras
      la batalla, tira un D6: 1-2 = retira al guerrero permanentemente de su banda original; 3-5 = retira
      al guerrero de su banda original y añade un Siervo capturado a la Cabalgada; 6 = retira al guerrero
      de su banda original y un Héroe aleatorio de la Cabalgada gana +1 de Experiencia. Esto sustituye
      a las reglas estándar de Herida Grave ¡Capturado! para Héroes.'
  applies_to:
    band: true
