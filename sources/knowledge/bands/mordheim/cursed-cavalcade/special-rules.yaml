- id: cursed-piper--danse-macabre
  runtime:
    scope: "LATER"
    implemented: "NO"
    grant: profile
    effects:
    - id: unimplemented.cursed-cavalcade.cursed-piper.danse-macabre
      scope: "LATER"
      binding: null
      reason: "Deferred subsystem: psychology."
  name: Danse Macabre
  effect: 'The Piper plays the Danse Macabre in

    combat. During the shooting phase the Cursed Piper can

    direct the cursed melody of his flute against one enemy model

    he can see within 6” from the Piper. The enemy model must

    take a Ld test.

    If failed, the warrior is cursed by the Danse

    Macabre loses control of his body and forced to dance under

    the Piper’s will. The Piper can move the enemy model in any

    direction he wishes also out of close combat or force him to

    fall from height.

    At the beginning of the enemy’s turn, in the

    recovery phase the warrior will have to pass a Ld test or will

    continue to be under the Pipers’ control and cannot shoot,

    charge or cast spells. If engaged in close combat the model

    cannot attack (it is too busy dancing!).

    Only one enemy

    warrior at time can be controlled by the Danse Macabre. If

    the Piper targets another warrior the previous one is

    immediately free from the curse.'
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Heroes / 0 – 1 Cursed Piper / Special Rules / Danse Macabre
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/cursed-cavalcade
  name_i18n:
    en: Danse Macabre
    es: null
  effect_i18n:
    en: 'The Piper plays the Danse Macabre in

      combat. During the shooting phase the Cursed Piper can

      direct the cursed melody of his flute against one enemy model

      he can see within 6” from the Piper. The enemy model must

      take a Ld test.

      If failed, the warrior is cursed by the Danse

      Macabre loses control of his body and forced to dance under

      the Piper’s will. The Piper can move the enemy model in any

      direction he wishes also out of close combat or force him to

      fall from height.

      At the beginning of the enemy’s turn, in the

      recovery phase the warrior will have to pass a Ld test or will

      continue to be under the Pipers’ control and cannot shoot,

      charge or cast spells. If engaged in close combat the model

      cannot attack (it is too busy dancing!).

      Only one enemy

      warrior at time can be controlled by the Danse Macabre. If

      the Piper targets another warrior the previous one is

      immediately free from the curse.'
    es: null
  applies_to:
    profile_ids:
    - cursed-piper
