- id: twisted-scholar--magical-adept
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.cursed-cavalcade.twisted-scholar.magical-adept
      scope: 'NO'
      binding: null
      reason: 'Out of scope: magic.'
  name: Magical Adept
  effect: When hiring a Twisted Scholar, you may pay 10 additional GC to upgrade it to a Wizard. If you
    do this then the twisted scholar uses Lesser Magic and knows 1 spell chosen randomly.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Heroes / 0 – 1 Twisted Scholar / Special Rules / Magical Adept
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/cursed-cavalcade
  name_i18n:
    en: Magical Adept
    es: Adepto mágico
  effect_i18n:
    en: 'When hiring a Twisted Scholar, you may

      pay 10 additional GC to upgrade it to a Wizard. If you do

      this then the twisted scholar uses Lesser Magic and knows 1 spell chosen randomly.'
    es: Al contratar a un Estudioso retorcido, puedes pagar 10 coronas adicionales para ascenderlo a Mago.
      Si lo haces, el Estudioso retorcido usa Magia Menor y conoce 1 hechizo elegido aleatoriamente.
  applies_to:
    profile_ids:
    - twisted-scholar
- id: twisted-scholar--story-teller
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.cursed-cavalcade.twisted-scholar.story-teller
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign.'
  name: Story Teller
  effect: When hiring a Twisted Scholar, if you did not upgrade it to a Wizard, you may pay 10 additional
    GC to make it a Chronicler. A Chronicler has in-depth knowledge of the city of Mordheim and may reroll
    an extra dice during Exploration phase and may decide which of the two dice to keep.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Heroes / 0 – 1 Twisted Scholar / Special Rules / Story Teller
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/cursed-cavalcade
  name_i18n:
    en: Story Teller
    es: Narrador de historias
  effect_i18n:
    en: 'When hiring a Twisted Scholar, if you did not

      upgrade it to a Wizard, you may pay 10 additional GC to

      make it a Chronicler. A Chronicler has in-depth knowledge

      of the city of Mordheim and may reroll an extra dice during

      Exploration phase and may decide which of the two dice to

      keep.'
    es: Al contratar a un Estudioso retorcido, si no lo has ascendido a Mago, puedes pagar 10 coronas
      adicionales para convertirlo en Cronista. Un Cronista tiene un conocimiento profundo de la ciudad
      de Mordheim y puede repetir un dado extra durante la fase de Exploración y decidir cuál de los dos
      dados conservar.
  applies_to:
    profile_ids:
    - twisted-scholar
- id: cursed-piper--danse-macabre
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.cursed-cavalcade.cursed-piper.danse-macabre
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology.'
  name: Danse Macabre
  effect: The Piper plays the Danse Macabre in combat. During the shooting phase the Cursed Piper can
    direct the cursed melody of his flute against one enemy model he can see within 6” from the Piper.
    The enemy model must take a Ld test. If failed, the warrior is cursed by the Danse Macabre loses control
    of his body and forced to dance under the Piper’s will. The Piper can move the enemy model in any
    direction he wishes also out of close combat or force him to fall from height. At the beginning of
    the enemy’s turn, in the recovery phase the warrior will have to pass a Ld test or will continue to
    be under the Pipers’ control and cannot shoot, charge or cast spells. If engaged in close combat the
    model cannot attack (it is too busy dancing!). Only one enemy warrior at time can be controlled by
    the Danse Macabre. If the Piper targets another warrior the previous one is immediately free from
    the curse.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Heroes / 0 – 1 Cursed Piper / Special Rules / Danse Macabre
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/cursed-cavalcade
  name_i18n:
    en: Danse Macabre
    es: Danza de la muerte
  effect_i18n:
    en: 'The Piper plays the Danse Macabre in

      combat. During the shooting phase the Cursed Piper can

      direct the cursed melody of his flute against one enemy model

      he can see within 6” from the Piper. The enemy model must

      take a Ld test.

      If failed, the warrior is cursed by the Danse

      Macabre loses control of his body and forced to dance under

      the Piper’s will. The Piper can move the enemy model in any

      direction he wishes also out of close combat or force him to

      fall from height.

      At the beginning of the enemy’s turn, in the

      recovery phase the warrior will have to pass a Ld test or will

      continue to be under the Pipers’ control and cannot shoot,

      charge or cast spells. If engaged in close combat the model

      cannot attack (it is too busy dancing!).

      Only one enemy

      warrior at time can be controlled by the Danse Macabre. If

      the Piper targets another warrior the previous one is

      immediately free from the curse.'
    es: El Flautista toca la Danza de la muerte en combate. Durante la fase de disparo, el Flautista maldito
      puede dirigir la melodía maldita de su flauta contra una miniatura enemiga que pueda ver a 6” del
      Flautista. La miniatura enemiga debe superar un chequeo de L. Si falla, el guerrero es maldito por
      la Danza de la muerte, pierde el control de su cuerpo y se ve forzado a bailar bajo la voluntad
      del Flautista. El Flautista puede mover la miniatura enemiga en cualquier dirección que desee, incluso
      fuera del combate cuerpo a cuerpo, o forzarlo a caer desde las alturas. Al comienzo del turno del
      enemigo, en la fase de recuperación, el guerrero deberá superar un chequeo de L o seguirá bajo el
      control del Flautista y no podrá disparar, cargar ni lanzar hechizos. Si está trabado en combate
      cuerpo a cuerpo, la miniatura no puede atacar (¡está demasiado ocupada bailando!). Solo un guerrero
      enemigo a la vez puede ser controlado por la Danza de la muerte. Si el Flautista apunta a otro guerrero,
      el anterior queda inmediatamente libre de la maldición.
  applies_to:
    profile_ids:
    - cursed-piper
- id: captured-thrall--extra-servitors-worthless-but-still-precious
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.cursed-cavalcade.captured-thrall.extra-servitors-worthless-but-still-precious
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign.'
  name: Extra servitors, worthless, but still precious
  effect: Captured Thralls do not count toward the maximum number of models allowed in your warband, effectively
    increasing the maximum capacity from 13 to 18. You cannot dismiss any Captured Thrall you own.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Henchmen / 0 – 5 Captured Thrall / Special Rules / Extra servitors, worthless, but still
      precious
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/cursed-cavalcade
  name_i18n:
    en: Extra servitors, worthless, but still precious
    es: Sirvientes extra, inútiles pero aún preciosos
  effect_i18n:
    en: 'Captured

      Thralls do not count toward the maximum number of models

      allowed in your warband, effectively increasing the

      maximum capacity from 13 to 18. You cannot dismiss any

      Captured Thrall you own.'
    es: Los Siervos capturados no cuentan contra el número máximo de miniaturas permitidas en tu banda,
      aumentando efectivamente la capacidad máxima de 13 a 18. No puedes despedir a ningún Siervo capturado
      que poseas.
  applies_to:
    profile_ids:
    - captured-thrall
