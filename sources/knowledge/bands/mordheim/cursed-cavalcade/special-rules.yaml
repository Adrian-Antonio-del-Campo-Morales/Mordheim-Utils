  name: The Throne of Worms
  effect: 'For each enemy captured, instead of rolling normally on the Serious Injury Table after the battle, roll a D6: 1-2
    = remove the warrior permanently from the original warband; 3-5 = remove the warrior from the original warband and add
    one Captured Thrall to the Cavalcade; 6 = remove the warrior from the original warband and one random Cavalcade Hero gains
    +1 Experience. This replaces the standard Captured! Serious Injury rules for Heroes.'
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / The Throne of Worms
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/cursed-cavalcade
