  name: Noblesse obliges
  effect: The warrior feels utterly superior to his opponents, with long lineage and prestige to look
    down upon his common enemies, seen as nothing more than cattle to be slaughtered. The Warrior is immune
    to fear and can stomp opponents who are knocked down with is iron-shod boots. This gives them additional
    attack against Knocked down opponents at their own Strength.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Cursed Cavalcade Special Skills / Noblesse obliges
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/cursed-cavalcade
  name_i18n:
    en: Noblesse obliges
    es: Noblesse oblige
  effect_i18n:
    en: 'The warrior feels utterly superior to his opponents, with long

      lineage and prestige to look down upon his common

      enemies, seen as nothing more than cattle to be slaughtered.

      The Warrior is immune to fear and can stomp

      opponents who are knocked down with is

      iron-shod boots.

      This gives them additional attack

      against Knocked down opponents at

      their own Strength.'
    es: El guerrero se siente totalmente superior a sus oponentes, con un largo linaje y prestigio para
      mirar por encima del hombro a sus enemigos plebeyos, vistos como nada más que ganado para ser sacrificado.
      El Guerrero es inmune al miedo y puede pisotear a los oponentes Derribados con sus botas con suela
      de hierro. Esto les otorga un ataque adicional contra oponentes Derribados con su propia Fuerza.
  applies_to:
    band: true
- id: band--cursed-cavalcade-special-skills-torturer
  kind: warband_skill
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.cursed-cavalcade.band.cursed-cavalcade-special-skills-torturer
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology.'
  name: Torturer
  effect: Having learned the craft of torture in the Ritual of the Comet, the warrior knows how to inflict
    maximum pain on the body and uses it in a sadistic and cruel way in combat. Any model successfully
    wounded (and not saved) in close combat by this Hero loses 1 point of Strength permanently for the
    duration of the battle as the pain from the wound causes agony. The effect is accumulative and can
    reduce the Strength of the target to a minimum of 1. The Undead are immune to this effect.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Cursed Cavalcade Special Skills / Torturer
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/cursed-cavalcade
  name_i18n:
    en: Torturer
    es: Torturador
  effect_i18n:
    en: 'Having learned the craft of torture in the Ritual of the Comet,

      the warrior knows how to inflict maximum pain on the body

      and uses it in a sadistic and cruel way in combat.

      Any model successfully wounded (and not saved) in close

      combat by this Hero loses 1 point of Strength permanently

      for the duration of the battle as the pain from the wound

      causes agony. The effect is accumulative and can reduce the

      Strength of the target to a minimum of 1. The Undead are

      immune to this effect.'
    es: Habiendo aprendido el oficio de la tortura en el Ritual del Cometa, el guerrero sabe cómo infligir
      el máximo dolor al cuerpo y lo usa de forma sádica y cruel en combate. Cualquier miniatura herida
      con éxito (y no salvada) en combate cuerpo a cuerpo por este Héroe pierde 1 punto de Fuerza permanentemente
      durante el resto de la batalla, ya que el dolor de la herida causa agonía. El efecto es acumulativo
      y puede reducir la Fuerza del objetivo a un mínimo de 1. Los Muertos Vivientes son inmunes a este
      efecto.
  applies_to:
    band: true
- id: band--cursed-cavalcade-special-skills-duelist
  kind: warband_skill
  runtime:
