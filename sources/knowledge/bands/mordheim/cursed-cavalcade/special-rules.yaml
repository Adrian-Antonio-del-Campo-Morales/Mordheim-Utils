  name: Leader
  effect: Any warrior of the Cavalcade Warband within 6" of the Aristocrat may use his Leadership value
    when taking Leadership tests.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Heroes / 1 Aristocrat / Special Rules / Leader
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/cursed-cavalcade
  name_i18n:
    en: Leader
    es: Líder
  effect_i18n:
    en: Any warrior of the Cavalcade Warband within 6" of the Aristocrat may use his Leadership value
      when taking Leadership tests.
    es: Cualquier guerrero de la banda de la Cabalgata a 6" del Aristócrata puede usar su valor de Liderazgo
      al realizar chequeos de Liderazgo.
  applies_to:
    profile_ids:
    - aristocrat
- id: aristocrat--expert-horseman
