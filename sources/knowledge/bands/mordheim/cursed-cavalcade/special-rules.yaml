- id: band--foolish-nobleness
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.cursed-cavalcade.band.foolish-nobleness
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign.'
  name: Foolish Nobleness
  effect: The Cursed Cavalcade is treated as an Evil warband for all game-effect purposes, similarly to
    the Cult of the Possessed. It cannot hire Hired Swords or Dramatis Personae except the Crow Master
    and any entry that specifically says otherwise.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / Foolish Nobleness
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/cursed-cavalcade
  name_i18n:
    en: Foolish Nobleness
    es: Nobleza necia
  effect_i18n:
    en: The Cursed Cavalcade is treated as an Evil warband for all game-effect purposes, similarly to
      the Cult of the Possessed. It cannot hire Hired Swords or Dramatis Personae except the Crow Master
      and any entry that specifically says otherwise.
    es: La Cabalgata Maldita se trata como una banda Maligna a todos los efectos de juego, de forma similar
      al Culto de los Poseídos. No puede contratar Espadas a sueldo ni Dramatis Personae, excepto el Maestro
      de las Cuervos y cualquier entrada que especifique lo contrario.
  applies_to:
    band: true
- id: band--capture
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.cursed-cavalcade.band.capture
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: no effect applies to the isolated 1v1 duel or legal fighter skill/equipment
        construction.
  name: Capture!
  effect: >-
    If a Hero takes an enemy human Henchman Out of Action with a Misericordia and the warband has
    fewer than 5 Captured Thralls, roll a D6: on 5+ the model is captured. Enemy Heroes can only be
    captured through a 61 - Captured! Serious Injury result. No more than 2 models may be captured
    per game. If 2 models have already been captured, or the warband already has 5 Captured Thralls,
    reroll 61 - Captured! results for enemy Heroes.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / Capture!
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/cursed-cavalcade
  name_i18n:
    en: Capture!
    es: ¡Captura!
  effect_i18n:
    en: 'If a Hero takes an enemy human Henchman Out of Action with a Misericordia and the warband has
      fewer than 5 Captured Thralls, roll a D6: on 5+ the model is captured. Enemy Heroes can only be
      captured through a 61 - Captured! Serious Injury result. No more than 2 models may be captured per
      game. If 2 models have already been captured, or the warband already has 5 Captured Thralls, reroll
      61 - Captured! results for enemy Heroes.'
    es: 'Si un Héroe saca del combate a un Secuaz humano enemigo con una Misericordia y la banda tiene
      menos de 5 Siervos capturados, tira un D6: con 5+ la miniatura es capturada. Los Héroes enemigos
      solo pueden ser capturados mediante un resultado de Herida Grave de 61 - ¡Capturado!. No pueden
      capturarse más de 2 miniaturas por partida. Si ya se han capturado 2 miniaturas, o la banda ya tiene
      5 Siervos capturados, repite los resultados de 61 - ¡Capturado! para Héroes enemigos.'
  applies_to:
    band: true
- id: band--throne-of-worms
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.cursed-cavalcade.band.throne-of-worms
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign.'
  name: The Throne of Worms
  effect: >-
    For each enemy captured, instead of rolling normally on the Serious Injury Table after the
    battle, roll a D6: 1-2 = remove the warrior permanently from the original warband; 3-5 = remove
    the warrior from the original warband and add one Captured Thrall to the Cavalcade; 6 = remove
    the warrior from the original warband and one random Cavalcade Hero gains +1 Experience. This
    replaces the standard Captured! Serious Injury rules for Heroes.
  source:
    manual: mordheimer.net
    printed_page: 0
