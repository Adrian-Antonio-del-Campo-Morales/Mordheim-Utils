- id: fighting-ape--cymbals
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.cursed-cavalcade.fighting-ape.cymbals
      scope: 'NO'
      binding: null
      reason: 'Out of scope: shooting.'
  name: Cymbals
  effect: when hiring a Fighting Ape, you may give her a pair of cymbals at 15 gc, which it frenziedly
    beats together to the forbidding tune of Danse Macabre. Any enemy model within 6" will be so disturbed
    by the sound that they suffer a penalty of -1 to BS and Ld.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Henchmen / 0 – 1 Fighting Ape / Special Rules / Cymbals
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/cursed-cavalcade
  name_i18n:
    en: Cymbals
    es: Platillos
  effect_i18n:
    en: 'when hiring a Fighting Ape, you may give her a

      pair of cymbals at 15 gc, which it frenziedly beats together

      to the forbidding tune of Danse Macabre.

      Any enemy model within 6" will be so disturbed by the

      sound that they suffer a penalty of -1 to BS and Ld.'
    es: Al contratar a un Mono de combate, puedes darle un par de platillos por 15 coronas, que golpea
      frenéticamente al ritmo prohibitivo de la Danza de la muerte. Cualquier miniatura enemiga a 6" se
      verá tan perturbada por el sonido que sufre una penalización de -1 a HA y L.
  applies_to:
    profile_ids:
    - fighting-ape
- id: fighting-ape--agile
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.cursed-cavalcade.fighting-ape.agile
      scope: 'NO'
      binding: null
      reason: 'Out of scope: movement.'
  name: Agile
  effect: The Fighting Apes are fantastically agile and nimble, putting even the greatest acrobat or Skaven
    Assassin to shame. The Fighting Ape has the Scale Sheer Surfaces Skill, Acrobat Skill, and Dodge Skill.
    In addition, the Fighting Ape can make a diving charge from up to 10" high.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Henchmen / 0 – 1 Fighting Ape / Special Rules / Agile
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/cursed-cavalcade
  name_i18n:
    en: Agile
    es: Ágil
  effect_i18n:
    en: 'The Fighting Apes are fantastically agile and nimble,

      putting even the greatest acrobat or Skaven Assassin to

      shame. The Fighting Ape has the Scale Sheer Surfaces Skill, Acrobat Skill, and Dodge Skill. In addition,
      the Fighting Ape

      can make a diving charge from up to 10" high.'
    es: Los Monos de combate son fantásticamente ágiles y diligentes, avergonzando incluso al mayor acróbata
      o Asesino skaven. El Mono de combate tiene la habilidad Trepar superficies verticales, la habilidad
      Acróbata y la habilidad Esquiva. Además, el Mono de combate puede realizar una carga en picado desde
      hasta 10" de altura.
  applies_to:
    profile_ids:
    - fighting-ape
