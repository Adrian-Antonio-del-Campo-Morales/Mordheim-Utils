      Thralls, roll a D6: on 5+ the model is captured. Enemy Heroes can only be captured through a 61 - Captured! Serious
      Injury result. No more than 2 models may be captured per game. If 2 models have already been captured, or the warband
      already has 5 Captured Thralls, reroll 61 - Captured! results for enemy Heroes.'
    es: null
  applies_to:
    band: true
