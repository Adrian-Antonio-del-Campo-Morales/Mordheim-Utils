    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/cursed-cavalcade
  name_i18n:
    en: Not really clever
    es: No muy listos
  effect_i18n:
    en: 'Captured Thralls cannot earn experience

      points, and therefore cannot gain any advancement.'
    es: Los Siervos capturados no pueden ganar puntos de experiencia y, por tanto, no pueden obtener ninguna
      mejora.
  applies_to:
    profile_ids:
    - captured-thrall
