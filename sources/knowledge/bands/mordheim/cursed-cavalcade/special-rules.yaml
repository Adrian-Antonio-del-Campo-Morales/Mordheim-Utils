        Out of scope: no effect applies to the isolated 1v1 duel or legal fighter skill/equipment
        construction.
  name: Duelist
  effect: The warrior is an expert in hand-to-hand combat method of the Imperial duelist, aristocrats
    famed for their skill in single combat. At the end of each Close Combat phase, the Duelist can force
    any non-large opponent he is fighting one-on-one to pass a Strength test or be pushed 2" in any direction
    chosen by the Duelist. If this brings the target in contact with another model, both suffer an automatic
    Strength 2 hit. If this pushes the opponent off from a high place, then he falls and takes damage
    as normal. The duelist stays on the elevated area.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Cursed Cavalcade Special Skills / Duelist
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/cursed-cavalcade
  name_i18n:
    en: Duelist
    es: Duelista
  effect_i18n:
    en: 'The warrior is an expert in hand-to-hand combat method of

      the Imperial duelist, aristocrats famed for their skill in single

      combat.

      At the end of each Close Combat phase, the Duelist

      can force any non-large opponent he is fighting one-on-one

      to pass a Strength test or be pushed 2" in any direction

      chosen by the Duelist. If this brings the target in contact

      with another model, both suffer an automatic Strength 2 hit.

      If this pushes the opponent off from a high place, then he

      falls and takes damage as normal. The duelist stays on the

      elevated area.'
    es: El guerrero es un experto en el método de combate cuerpo a cuerpo del duelista imperial, aristócratas
      famosos por su destreza en el combate singular. Al final de cada fase de Combate Cuerpo a Cuerpo,
      el Duelista puede forzar a cualquier oponente no enorme contra el que luche uno a uno a superar
      un chequeo de Fuerza o ser empujado 2" en cualquier dirección elegida por el Duelista. Si esto lleva
      al objetivo a contacto con otra miniatura, ambas sufren un impacto automático de Fuerza 2. Si esto
      empuja al oponente desde un lugar elevado, entonces cae y sufre daño con normalidad. El duelista
      permanece en la zona elevada.
  applies_to:
    band: true
