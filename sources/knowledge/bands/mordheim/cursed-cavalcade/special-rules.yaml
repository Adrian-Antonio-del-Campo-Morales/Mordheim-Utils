        kind: mechanic
        id: skill.expert-swordsman
  name: Expert Swordsman
  effect: As imperial nobles, the Companions have been taught the way of the sword since an early age.
    Companions all have Expert Swordsman Skill.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Heroes / 0 – 2 Companions / Special Rules / Expert Swordsman
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/cursed-cavalcade
  name_i18n:
    en: Expert Swordsman
    es: Espadachín experto
  effect_i18n:
    en: 'As imperial nobles, the Companions

      have been taught the way of the sword since an early age.

      Companions all have Expert Swordsman Skill.'
    es: Como nobles imperiales, los Compañeros han sido instruidos en el manejo de la espada desde temprana
      edad. Todos los Compañeros tienen la habilidad Esgrimista experto.
