      reason: 'Out of scope: no effect applies to the isolated 1v1 duel or legal fighter skill/equipment construction.'
  name: Capture!
  effect: 'If a Hero takes an enemy human Henchman Out of Action with a Misericordia and the warband has fewer than 5 Captured
    Thralls, roll a D6: on 5+ the model is captured. Enemy Heroes can only be captured through a 61 - Captured! Serious Injury
    result. No more than 2 models may be captured per game. If 2 models have already been captured, or the warband already has
    5 Captured Thralls, reroll 61 - Captured! results for enemy Heroes.'
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / Capture!
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/cursed-cavalcade
