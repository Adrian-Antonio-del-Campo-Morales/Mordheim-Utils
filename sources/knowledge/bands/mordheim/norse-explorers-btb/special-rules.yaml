- id: wolves--pack-leader
  name: Pack Leader
  effect: Wolves may only be included in the warband if it includes a Wulfen. If the Wulfen is dead or unavailable because
    of injury, the Wolves cannot be used until a Wulfen is available again.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 5 Wolves / Special Rules / Pack Leader
