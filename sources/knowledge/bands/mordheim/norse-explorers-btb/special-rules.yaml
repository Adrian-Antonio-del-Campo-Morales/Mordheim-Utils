- id: band--norse-special-skills-berserk-charge
  kind: warband_skill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: special-rule.band--norse-special-skills-berserk-charge
      scope: 'YES'
      binding:
        kind: compiler
        id: special-rule.band--norse-special-skills-berserk-charge
  name: Berserk Charge
  effect: 'The Norse are very skilled with weapons that many other races see as primitive and savage. When this hero is armed
    with an axe or double handed weapon,

    he may re-roll all failed to hit rolls when he charges.'
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Norse special skills / berserk charge
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/norse
  name_i18n:
