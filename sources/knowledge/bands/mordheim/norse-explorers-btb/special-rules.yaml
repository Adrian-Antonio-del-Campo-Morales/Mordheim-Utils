- id: wulfen--bestial
  name: Bestial
  effect: 'Wulfen are ravenous beasts and therefore immune to psychology. Also despite being greatly revered by their barbarian
    kinsmen, Wulfen are

    too feral and uncontrolled to become the leader of the warband.'
