- id: band--norse-special-skills-barbarian-courage
  kind: warband_skill
  name: Barbarian Courage
  effect: As Norse warriors strive to die bravely in battle, they learn to fear nothing and embrace hardship. This hero never
    needs to take all alone tests and may re-roll failed fear tests.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Norse special skills / barbarian courage
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/norse
