- id: band--norse-special-skills-crushing-blow
  kind: warband_skill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: skill.crushing-blow
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.crushing-blow
  name: Crushing Blow
  effect: Norse warriors train in almost all of their spare time. They are expert fighters and learn to put all of their strength
    into very powerful attacks. No enemy may parry an attack made by this hero because it strikes with such great power that
    it pushes right through a buckler or sword.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Norse special skills / crushing blow
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/norse
  name_i18n:
    en: Crushing Blow
    es: null
  effect_i18n:
    en: Norse warriors train in almost all of their spare time. They are expert fighters and learn to put all of their strength
      into very powerful attacks. No enemy may parry an attack made by this hero because it strikes with such great power
      that it pushes right through a buckler or sword.
    es: null
  applies_to:
    band: true
- id: band--norse-special-skills-shield-master
  kind: warband_skill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: skill.shield-mastery
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.shield-mastery
  name: Shield Master
  effect: Norse warriors begin training with shields when they are still children. Some warriors become so skilled with these
    weapons they can block almost any blow against them. When this hero is armed with a shield he may parry with it in addition
    to getting a 6+ save.
  source:
