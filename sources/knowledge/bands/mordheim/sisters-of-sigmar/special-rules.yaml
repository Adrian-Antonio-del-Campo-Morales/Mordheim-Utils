      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology or mounts.'
- id: band--special-skills-protection-of-sigmar
  kind: warband_skill
  name: Protection of Sigmar
  effect: The Sister has been blessed by the High Matriarch. Any spell which would affect her is nullified on a D6 roll of
    4+. Note that if the spell is nullified it will not affect any other models either.
  source:
    manual: mordheimer.net
    printed_page: 0
