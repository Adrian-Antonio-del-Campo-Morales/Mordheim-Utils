- id: band--special-skills-sign-of-sigmar
  kind: warband_skill
  name: Sign of Sigmar
  effect: The Sister is favoured by the great god Sigmar. Possessed or Undead opponents lose their first attack against the
    Priestess in the first round of hand-to-hand combat (down to a minimum of 1).
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Skills / Sign of Sigmar
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/sisters-of-sigmar
  name_i18n:
    en: Sign of Sigmar
    es: null
  effect_i18n:
    en: The Sister is favoured by the great god Sigmar. Possessed or Undead opponents lose their first attack against the
      Priestess in the first round of hand-to-hand combat (down to a minimum of 1).
    es: null
  eligibility:
  - sigmarite-matriarch
  - sister-superior
  - augur
  applies_to:
