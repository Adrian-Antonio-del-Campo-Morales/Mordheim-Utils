    es: Determinación absoluta
  effect_i18n:
    en: Only the Matriarch may have this skill, which allows her to re-roll any failed Rout tests.
    es: Solo la Matriarca puede tener esta habilidad, que le permite repetir cualquier chequeo de huida
      fallido.
  eligibility:
