schema_version: 2
band_id: sisters-of-sigmar
rules:
- id: sigmarite-matriarch--leader
  name: Leader
  effect: Any warband member within 6" of the Sigmarite Matriarch may use her Leadership characteristic
    when taking any Leadership tests.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroines / 1 Sigmarite matriarch / Special Rules / Leader
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/sisters-of-sigmar
  name_i18n:
    en: Leader
    es: Líder
  effect_i18n:
    en: Any warband member within 6" of the Sigmarite Matriarch may use her Leadership characteristic
      when taking any Leadership tests.
    es: Cualquier miembro de la banda a 6" de la Matriarca sigmarita puede usar su característica de Liderazgo
      cuando realice cualquier chequeo de Liderazgo.
  applies_to:
    profile_ids:
    - sigmarite-matriarch
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.sisters-of-sigmar.sigmarite-matriarch.leader
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology or mounts.'
- id: sigmarite-matriarch--prayers-of-sigmar
  name: Prayers of Sigmar
  effect: The Sigmarite Matriarch may use the Prayers of Sigmar and begins with one randomly generated
    prayer. She may learn a new Prayer instead of a new skill. Prayer effects are intentionally not modelled
    in this file.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroines / 1 Sigmarite matriarch / Special Rules / Prayers of Sigmar
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/sisters-of-sigmar
  name_i18n:
    en: Prayers of Sigmar
    es: Plegarias de Sigmar
  effect_i18n:
    en: The Sigmarite Matriarch may use the Prayers of Sigmar and begins with one randomly generated prayer.
      She may learn a new Prayer instead of a new skill. Prayer effects are intentionally not modelled
      in this file.
    es: La Matriarca sigmarita puede usar las Plegarias de Sigmar y comienza con una plegaria generada
      al azar. Puede aprender una nueva Plegaria en lugar de una nueva habilidad. Los efectos de las plegarias
      no se modelan deliberadamente en este fichero.
  applies_to:
    profile_ids:
    - sigmarite-matriarch
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.sisters-of-sigmar.sigmarite-matriarch.prayers-of-sigmar
      scope: 'NO'
      binding: null
      reason: 'Out of scope: no effect applies to the isolated 1v1 duel or legal fighter skill/equipment
        construction.'
- id: augur--blessed-sight
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: skill.blessed-sight
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.blessed-sight
  name: Blessed Sight
  effect: The Augur may re-roll failed characteristic tests and failed rolls to hit in close combat or
    shooting; the second result must be accepted. If she was not taken Out of Action, she rolls two dice
    for her contribution during Exploration and may choose either die as the result.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroines / 0 – 1 Augur / Special Rules / Blessed Sight
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/sisters-of-sigmar
  name_i18n:
    en: Blessed Sight
    es: Vista bendecida
  effect_i18n:
    en: The Augur may re-roll failed characteristic tests and failed rolls to hit in close combat or shooting;
      the second result must be accepted. If she was not taken Out of Action, she rolls two dice for her
      contribution during Exploration and may choose either die as the result.
    es: La Augur puede repetir los chequeos de característica fallidos y las tiradas para impactar fallidas
      en combate cuerpo a cuerpo o con disparos; debe aceptarse el segundo resultado. Si no quedó Fuera
      de combate, tira dos dados por su contribución durante la Exploración y puede elegir cualquiera
      de los dos como resultado.
  applies_to:
    profile_ids:
    - augur
- id: band--human-maximum-characteristics
  name: Human Maximum Characteristics
  effect: Sisters of Sigmar are Humans and use the Human racial maximum profile (campaign.limit.racial-maximum.human).
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Racial Maximum Characteristics / Human
    url: https://mordheimer.net/docs/campaigns/experience
  name_i18n:
    en: Human Maximum Characteristics
    es: Máximos de características humanos
  effect_i18n:
    en: Sisters of Sigmar are Humans and use the Human racial maximum profile (campaign.limit.racial-maximum.human).
    es: Las Hermanas de Sigmar son Humanas y usan el perfil máximo racial humano (campaign.limit.racial-maximum.human).
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.sisters-of-sigmar.band.human-maximum-characteristics
      scope: 'NO'
      binding: null
      reason: 'Out of scope: no effect applies to the isolated 1v1 duel or legal fighter skill/equipment
        construction.'
- id: band--special-skills-sign-of-sigmar
  kind: warband_skill
  name: Sign of Sigmar
  effect: The Sister is favoured by the great god Sigmar. Possessed or Undead opponents lose their first
    attack against the Priestess in the first round of hand-to-hand combat (down to a minimum of 1).
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Skills / Sign of Sigmar
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/sisters-of-sigmar
  name_i18n:
    en: Sign of Sigmar
    es: Signo de Sigmar
  effect_i18n:
    en: The Sister is favoured by the great god Sigmar. Possessed or Undead opponents lose their first
      attack against the Priestess in the first round of hand-to-hand combat (down to a minimum of 1).
    es: La Hermana es favorecida por el gran dios Sigmar. Los oponentes Posesos o No-muertos pierden su
      primer ataque contra la Sacerdotisa en la primera ronda de combate cuerpo a cuerpo (hasta un mínimo
      de 1).
  eligibility:
  - sigmarite-matriarch
  - sister-superior
  - augur
  applies_to:
    band: true
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.sisters-of-sigmar.band.special-skills-sign-of-sigmar
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology or mounts.'
- id: band--special-skills-protection-of-sigmar
  kind: warband_skill
  name: Protection of Sigmar
  effect: The Sister has been blessed by the High Matriarch. Any spell which would affect her is nullified
    on a D6 roll of 4+. Note that if the spell is nullified it will not affect any other models either.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Skills / Protection of Sigmar
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/sisters-of-sigmar
  name_i18n:
    en: Protection of Sigmar
    es: Protección de Sigmar
  effect_i18n:
    en: The Sister has been blessed by the High Matriarch. Any spell which would affect her is nullified
      on a D6 roll of 4+. Note that if the spell is nullified it will not affect any other models either.
    es: La Hermana ha sido bendecida por la Gran Matriarca. Cualquier conjuro que pudiera afectarla se
      anula con un resultado de 4+ en 1D6. Ten en cuenta que, si el conjuro se anula, tampoco afectará
      a ningún otro modelo.
  eligibility:
  - sigmarite-matriarch
  - sister-superior
  - augur
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.sisters-of-sigmar.band.special-skills-protection-of-sigmar
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, or non-duel context.'
- id: band--special-skills-utter-determination
  kind: warband_skill
  name: Utter Determination
  effect: Only the Matriarch may have this skill, which allows her to re-roll any failed Rout tests.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Skills / Utter Determination
