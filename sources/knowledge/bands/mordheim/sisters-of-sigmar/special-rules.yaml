- id: augur--blessed-sight
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: skill.blessed-sight
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.blessed-sight
  name: Blessed Sight
  effect: The Augur may re-roll failed characteristic tests and failed rolls to hit in close combat or shooting; the second
    result must be accepted. If she was not taken Out of Action, she rolls two dice for her contribution during Exploration
    and may choose either die as the result.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroines / 0 – 1 Augur / Special Rules / Blessed Sight
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/sisters-of-sigmar
