- id: band--special-skills-absolute-faith
  kind: warband_skill
  name: Absolute Faith
  effect: The Sister puts her faith in Sigmar, and faces dangers unflinchingly. She may re-roll any fear tests and does not
    have to test if she is fighting alone against several opponents.
