- id: sigmarite-matriarch--prayers-of-sigmar
  name: Prayers of Sigmar
  effect: The Sigmarite Matriarch may use the Prayers of Sigmar and begins with one randomly generated prayer. She may learn
    a new Prayer instead of a new skill. Prayer effects are intentionally not modelled in this file.
  source:
