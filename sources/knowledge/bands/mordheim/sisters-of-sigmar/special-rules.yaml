- id: band--special-skills-righteous-fury
  kind: warband_skill
  name: Righteous Fury
  effect: The Sister hates all Skaven, Undead, Possessed, Beastmen, Dark Elves, and other warbands classed
    as evil. Non-Chaos human warbands whose members are merely killers or looters are not included.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Skills / Righteous Fury
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/sisters-of-sigmar
  name_i18n:
    en: Righteous Fury
    es: Ira justa
  effect_i18n:
    en: The Sister hates all Skaven, Undead, Possessed, Beastmen, Dark Elves, and other warbands classed
      as evil. Non-Chaos human warbands whose members are merely killers or looters are not included.
    es: La Hermana odia a todos los Skaven, No-muertos, Posesos, Bestias del Caos, Elfos Oscuros y demás
      bandas clasificadas como malvadas. Las bandas humanas que no son del Caos, cuyos miembros son solo
      asesinos o saqueadores, no están incluidas.
  eligibility:
  - sigmarite-matriarch
  - sister-superior
  - augur
  applies_to:
    band: true
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.sisters-of-sigmar.band.special-skills-righteous-fury
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology or mounts.'
- id: band--special-skills-absolute-faith
  kind: warband_skill
  name: Absolute Faith
  effect: The Sister puts her faith in Sigmar, and faces dangers unflinchingly. She may re-roll any fear
    tests and does not have to test if she is fighting alone against several opponents.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Skills / Absolute Faith
    url: https://mordheimer.net/docs/warbands/grade-1a-warbands/sisters-of-sigmar
  name_i18n:
    en: Absolute Faith
    es: Fe absoluta
  effect_i18n:
    en: The Sister puts her faith in Sigmar, and faces dangers unflinchingly. She may re-roll any fear
      tests and does not have to test if she is fighting alone against several opponents.
    es: La Hermana deposita su fe en Sigmar y afronta los peligros sin flaquear. Puede repetir cualquier
      chequeo de miedo y no tiene que superarlo si lucha sola contra varios oponentes.
  eligibility:
  - sigmarite-matriarch
  - sister-superior
  - augur
  applies_to:
