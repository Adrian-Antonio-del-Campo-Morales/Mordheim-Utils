- id: band--special-skills-righteous-fury
  kind: warband_skill
  name: Righteous Fury
  effect: The Sister hates all Skaven, Undead, Possessed, Beastmen, Dark Elves, and other warbands classed as evil. Non-Chaos
    human warbands whose members are merely killers or looters are not included.
  source:
