schema_version: 2
band_id: skaven-of-clan-skryre-kaz
rules:
- id: band--rulebook-inheritance
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: band
    effects:
    # The printed access is construction legality: the list the clause grants is
    # published with its explicit recipients and its named denial. The members
    # themselves are the selectable Hero rules below, each bound to the engine
    # contract the rulebook Skaven table already uses in the active bands.
    - id: profile.skill-access
      scope: 'YES'
      binding:
        kind: profile
        id: profile.skill-access
        parameters:
          category: special
          skills:
          - band--skaven-special-skills-black-hunger
          - band--skaven-special-skills-tail-fighting
          - band--skaven-special-skills-wall-runner
          - band--skaven-special-skills-infiltration
    - id: unimplemented.skaven-of-clan-skryre-kaz.band.rulebook-inheritance.art-of-silent-death
      scope: 'NO'
      binding: null
      reason: >-
        Printed exclusion, refused instead of granted: the rulebook Skaven table's fifth member, the
        Art of Silent Death, is published as no member rule for this band, so a selection is refused
        as unavailable for these Heroes. The denial is recorded here rather than being converted
        into a silent ability.
  name: Rulebook Inheritance
  effect: >-
    Skaven Clan Skryre may use the Skaven weapons as detailed in the rulebook. Skaven Heroes may use
    any of the Skaven Special Skills in the rulebook except for the Art of Silent Death. The Skaven
    weapons travel in the declared Skaven Hero and Henchmen equipment lists; the admitted special
    skills are published as the four member rules Black Hunger, Tail Fighting, Wall Runner and
    Infiltration, each naming the Heroes it reaches, while the Art of Silent Death stays refused.
  source:
    manual: broheim.net
    printed_page: 41
    section: Special Weapons / Skaven Special Skills
    url: https://broheim.net/downloads/campaigns/karakazgal/Karak Azgal.pdf
  name_i18n:
    es: Herencia del Libro de Reglas
  effect_i18n:
    es: >-
      Los Skaven del Clan Skryre pueden usar las armas Skaven tal y como se detallan en el libro de
      reglas. Los Héroes Skaven pueden usar cualquiera de las Habilidades Especiales Skaven del
      libro de reglas, excepto el Arte de la Muerte Silenciosa. Las armas Skaven viajan en las
      listas de equipo declaradas de Héroes y Secuaces Skaven; las habilidades especiales admitidas
      se publican como las cuatro reglas miembro Hambre Negra, Combate con la Cola, Corredor de
      Muros e Infiltración, cada una nombrando a los Héroes a los que alcanza, mientras que el Arte
      de la Muerte Silenciosa queda rechazado.
  applies_to:
    band: true
    profile_types: [hero]
- id: band--skaven-special-skills-black-hunger
  kind: warband_skill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: mechanic.black-hunger
      scope: 'YES'
      binding:
        kind: mechanic
        id: mechanic.black-hunger
  runtime_selectable: true
  name: Black Hunger
  effect: >-
    At the start of his turn, the Skaven Hero may invoke Black Hunger. For that turn he gains +1
    Attack and +D3 inches to his total Movement, then suffers D3 Strength 3 hits with no armour save
    at the end of the turn.
  source:
    manual: broheim.net
    printed_page: 41
    section: Special Weapons / Skaven Special Skills (Skaven special skills, Black Hunger)
    url: https://broheim.net/downloads/campaigns/karakazgal/Karak Azgal.pdf
  name_i18n:
    es: Hambre Negra
  effect_i18n:
    es: >-
      Al comienzo de su turno, el Héroe skaven puede invocar el Hambre negra. Durante ese turno gana
      +1 Ataque y +D3 pulgadas a su Movimiento total, y luego sufre D3 impactos de Fuerza 3 sin
      salvación por armadura al final del turno.
  eligibility:
  - master-engineer
  - engineers
  - warlock-engineer
  - engineer-apprentices
  - clanrats
  - skavenslaves
  applies_to:
    band: true
    profile_types: [hero]
- id: band--skaven-special-skills-tail-fighting
  kind: warband_skill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: special-rule.band--skaven-special-skills-tail-fighting
      scope: 'YES'
      binding:
        kind: compiler
        id: special-rule.band--skaven-special-skills-tail-fighting
  runtime_selectable: true
  name: Tail Fighting
  effect: >-
    The Skaven may wield a shield, knife or sword with his tail. A weapon grants one additional
    attack with that weapon; a shield grants +1 to the model's armour save.
  source:
    manual: broheim.net
    printed_page: 41
    section: Special Weapons / Skaven Special Skills (Skaven special skills, Tail Fighting)
    url: https://broheim.net/downloads/campaigns/karakazgal/Karak Azgal.pdf
  name_i18n:
    es: Combate con la Cola
  effect_i18n:
    es: >-
      El skaven puede empuñar un escudo, cuchillo o espada con su cola. Un arma concede un ataque
      adicional con esa arma; un escudo concede +1 a la salvación por armadura de la miniatura.
  eligibility:
  - master-engineer
  - engineers
  - warlock-engineer
  - engineer-apprentices
  - clanrats
  - skavenslaves
  applies_to:
    band: true
    profile_types: [hero]
- id: band--skaven-special-skills-wall-runner
  kind: warband_skill
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.skaven-of-clan-skryre-kaz.band.skaven-special-skills-wall-runner
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: climbing walls and other sheer surfaces is a movement and terrain consequence
        the isolated duel never resolves. The printed member stays published for its Hero recipients
        instead of being dropped for lacking a duel contract.
  name: Wall Runner
  effect: >-
    The Skaven automatically passes Initiative tests required to climb walls and other sheer
    surfaces.
  source:
    manual: broheim.net
    printed_page: 41
    section: Special Weapons / Skaven Special Skills (Skaven special skills, Wall Runner)
    url: https://broheim.net/downloads/campaigns/karakazgal/Karak Azgal.pdf
  name_i18n:
    es: Corredor de Muros
  effect_i18n:
    es: >-
      El skaven supera automáticamente los chequeos de Iniciativa necesarios para trepar por muros y
      otras superficies verticales.
  eligibility:
  - master-engineer
  - engineers
  - warlock-engineer
  - engineer-apprentices
  - clanrats
  - skavenslaves
  applies_to:
    band: true
    profile_types: [hero]
- id: band--skaven-special-skills-infiltration
  kind: warband_skill
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.skaven-of-clan-skryre-kaz.band.skaven-special-skills-infiltration
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: deployment order and placement of a fighter before the duel are outside the
        isolated 1v1 runtime. The printed member stays published for its Hero recipients instead of
        being dropped for lacking a duel contract.
  name: Infiltration
  effect: >-
    The Skaven deploys after the opposing warband and may be placed anywhere out of enemy sight and
    more than 12" from every enemy model. If both players have infiltrators, roll a D6 for each; the
    lowest roll deploys first.
  source:
    manual: broheim.net
    printed_page: 41
    section: Special Weapons / Skaven Special Skills (Skaven special skills, Infiltration)
    url: https://broheim.net/downloads/campaigns/karakazgal/Karak Azgal.pdf
  name_i18n:
    es: Infiltración
  effect_i18n:
    es: >-
      El skaven se despliega después de la banda contraria y puede situarse en cualquier lugar fuera
      de la vista enemiga y a más de 12" de cada miniatura enemiga. Si ambos jugadores tienen
      infiltradores, tira un D6 por cada uno; la tirada más baja despliega primero.
  eligibility:
  - master-engineer
  - engineers
  - warlock-engineer
  - engineer-apprentices
  - clanrats
  - skavenslaves
  applies_to:
    band: true
    profile_types: [hero]
- id: band--jezzail
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.skaven-of-clan-skryre-kaz.band.jezzail
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: the jezzail is a ranged weapon with crew, reload and targeting rules; all of
        its text is preserved in the provisional item catalog/items/weapons-ranged.yaml (item id
        jezzail).
  name: Jezzail (Skaven Clan Skryre Special Equipment)
  effect: >-
    The warplock jezzail is a fiendish invention of the Skaven Clan Skryre. It is a huge and long
    ranged firearm, more like a small cannon than an ordinary gun. It fires a special missile made
    of warpstone. Range 36\", Strength 5, armour save modifier -3. Move or fire, Prepare shot, Pick
    target, Save modifier, Assistant and Pavise rules as item text. 175 gc, Rare 11, heroes only,
    may be purchased as part of their starting equipment.
  source:
    manual: broheim.net
    printed_page: 40
    section: Skaven Clan Skryre Special Equipment / Jezzail
    url: https://broheim.net/downloads/campaigns/karakazgal/Karak Azgal.pdf
  name_i18n:
    es: Jezzail (Equipo Especial del Clan Skryre)
  effect_i18n:
    es: >-
      El jezzail de cerrojo urtico es un diabólico invento del Clan Skryre Skaven. Es un arma de
      fuego enorme y de gran alcance, más parecida a un pequeño cañón que a un arma ordinaria.
      Dispara un proyectil especial hecho de piedra bruja. Alcance 36", Fuerza 5, modificador de
      salvación por armadura -3. Reglas de Disparar o Preparar, Apuntar, Modificador de Salvación,
      Asistente y Pavés tal y como el texto del objeto. 175 coronas, Rareza 11, solo héroes, puede
      comprarse como parte de su equipo inicial.
  applies_to:
    band: true
- id: master-engineer--leader
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: mechanic.leader-six
      scope: 'YES'
      binding:
        kind: mechanic
        id: mechanic.leader-six
  name: Leader
  source:
    manual: broheim.net
    printed_page: 41
    section: heroes / 1 Master Engineer / Special Rules / Leader
    url: https://broheim.net/downloads/campaigns/karakazgal/Karak Azgal.pdf
  name_i18n:
    es: Líder
  applies_to:
    profile_ids:
    - master-engineer
  rule_ref: shared-rule.leader
- id: master-engineer--master-engineer
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.skaven-of-clan-skryre-kaz.master-engineer.master-engineer
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: re-rolling fumbles of blackpowder or wyrdstone-powered weapons is a shooting
        mechanic.
  name: Master Engineer
  effect: >-
    The Master Engineer may re-roll any fumbles with any blackpowder or wyrdstone-powered weapons he
    carries. The result of the re-roll must be accepted.
  source:
    manual: broheim.net
    printed_page: 41
    section: heroes / 1 Master Engineer / Special Rules / Master Engineer
    url: https://broheim.net/downloads/campaigns/karakazgal/Karak Azgal.pdf
  name_i18n:
    es: Ingeniero Maestro
  effect_i18n:
    es: >-
      El Ingeniero Maestro puede repetir cualquier pifia con las armas de pólvora o propulsadas por
      piedra bruja que lleve. El resultado de la repetición debe aceptarse.
  applies_to:
    profile_ids:
    - master-engineer
- id: warlock-engineer--wizard
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.skaven-of-clan-skryre-kaz.warlock-engineer.wizard
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: magic subsystem (Magic of the Horned Rat).
  name: Wizard
  source:
    manual: broheim.net
    printed_page: 42
    section: heroes / 0-1 Warlock Engineer / Special Rules / Wizard
    url: https://broheim.net/downloads/campaigns/karakazgal/Karak Azgal.pdf
  name_i18n:
    es: Mago
  applies_to:
    profile_ids:
    - warlock-engineer
  rule_ref: shared-rule.wizard
- id: skavenslaves--experience
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.skaven-of-clan-skryre-kaz.skavenslaves.experience
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: experience progression is a campaign mechanic.
  name: Experience
  source:
    manual: broheim.net
    printed_page: 43
    section: henchmen / Skavenslaves / Special Rules / Experience
    url: https://broheim.net/downloads/campaigns/karakazgal/Karak Azgal.pdf
  name_i18n:
    es: Experiencia
  applies_to:
    profile_ids:
    - skavenslaves
  rule_ref: shared-rule.experience
- id: skavenslaves--all-races
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.skaven-of-clan-skryre-kaz.skavenslaves.all-races
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: warband-flavour rule with no combat effect.
  name: All Races
  effect: >-
    Skaven slaves may be from any race including their fellow Skaven. The above profile represents
    the weakened state of all of them.
  source:
    manual: broheim.net
    printed_page: 43
    section: henchmen / Skavenslaves / Special Rules / All Races
    url: https://broheim.net/downloads/campaigns/karakazgal/Karak Azgal.pdf
  name_i18n:
    es: Todas las Razas
  effect_i18n:
    es: >-
      Los esclavos Skaven pueden ser de cualquier raza, incluidos sus propios compañeros Skaven. El
      perfil anterior representa el estado debilitado de todos ellos.
  applies_to:
    profile_ids:
    - skavenslaves
- id: skavenslaves--slavers
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.skaven-of-clan-skryre-kaz.skavenslaves.slavers
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: capture is a campaign mechanic.
  name: Slavers
  effect: >-
    Any enemy warrior who is captured may be added to a Skavenslave group. He will have the above
    profile and will have to be equipped the same as the rest of the group. Any equipment he carried
    when he was captured may be kept or sold by the warband.
  source:
    manual: broheim.net
    printed_page: 43
    section: henchmen / Skavenslaves / Special Rules / Slavers
    url: https://broheim.net/downloads/campaigns/karakazgal/Karak Azgal.pdf
  name_i18n:
    es: Esclavistas
  effect_i18n:
    es: >-
      Cualquier guerrero enemigo que sea capturado puede añadirse a un grupo de Esclavos Skaven.
      Tendrá el perfil anterior y deberá equiparse igual que el resto del grupo. Cualquier equipo
      que llevara cuando fue capturado puede quedarse la banda o venderse.
  applies_to:
    profile_ids:
    - skavenslaves
