- id: plague-priest--leader
  name: Leader
  effect: Any warrior within 6" of the Plague Priest may use his Leadership instead of its own.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 1 Plague Priest / Special Rules / Leader
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/skaven-pestilens
  name_i18n:
    es: Líder
  effect_i18n:
    es: >-
      Cualquier guerrero a 6" del Sacerdote de la Peste puede usar su Liderazgo en lugar del suyo
      propio.
  applies_to:
    profile_ids:
    - plague-priest
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.skaven-clan-pestilens.plague-priest.leader
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: psychology or mounts.
- id: pestilens-sorcerer--spellcaster
  name: Spellcaster
  effect: >-
    The Pestilens Sorcerer is a spellcaster and may cast spells from Magic of the Horned Rat. The
    spell list itself is not modelled in this file.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 – 1 Pestilens Sorcerer / Special Rules / Spellcaster
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/skaven-pestilens
  name_i18n:
    es: Lanzador de Hechizos
  effect_i18n:
    es: >-
      El Hechicero de Pestilens es un lanzador de hechizos y puede lanzar hechizos de la Magia de la
      Rata Cornuda. La propia lista de hechizos no está modelada en este fichero.
  applies_to:
    profile_ids:
    - pestilens-sorcerer
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.skaven-clan-pestilens.pestilens-sorcerer.spellcaster
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: campaign, shooting, movement, terrain, deployment, or non-duel context.
