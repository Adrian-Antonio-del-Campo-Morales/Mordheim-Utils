- id: band--clan-pestilens-special-skills-rotten-body
  kind: warband_skill
  name: Rotten Body
  effect: >-
    The Hero is immune to poisons and diseases. If taken Out of Action because of a failed
    Censer-related test, he automatically recovers after the battle and does not roll for injury.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Clan Pestilens Special Skills / rotten body
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/skaven-pestilens
  name_i18n:
    es: Cuerpo Podrido
  effect_i18n:
    es: >-
      El Héroe es inmune a los venenos y a las enfermedades. Si es puesto Fuera de combate debido a
      un chequeo fallido relacionado con el Incensario, se recupera automáticamente tras la batalla
      y no tira para la herida.
  eligibility:
  - plague-priest
  - pestilens-sorcerer
  - plague-monks
  - monk-initiates
  applies_to:
    band: true
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: trait.poison-immune
      scope: 'YES'
      binding:
        kind: trait
        id: trait.poison-immune
        parameters:
          value: true
    - id: campaign.censer-recovery
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: post-battle recovery and Serious Injury.
- id: band--clan-pestilens-special-skills-contagious
  kind: warband_skill
  name: Contagious
  effect: >-
    Requires Rotten Body. A model that inflicts the close-combat injury which takes this Hero Out of
    Action must take a Toughness test. If the D6 result is higher than its Toughness it suffers one
    automatic Wound; a 6 always causes a Wound. Undead and Possessed are immune to this test.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Clan Pestilens Special Skills / contagious
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/skaven-pestilens
  name_i18n:
    es: Contagioso
  effect_i18n:
    es: >-
      Requiere Cuerpo podrido. Una miniatura que inflinja la herida de combate cuerpo a cuerpo que
      pone a este Héroe Fuera de combate debe superar un chequeo de Resistencia. Si el resultado del
      D6 es mayor que su Resistencia, sufre una Herida automática; un 6 siempre causa una Herida.
      Los Muertos Vivientes y los Poseídos son inmunes a este chequeo.
  eligibility:
  - plague-priest
  - pestilens-sorcerer
  - plague-monks
  - monk-initiates
  applies_to:
    band: true
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.skaven-clan-pestilens.band.clan-pestilens-special-skills-contagious
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: psychology or mounts.
- id: band--clan-pestilens-special-skills-ignore-pain
  kind: warband_skill
  name: Ignore Pain
  effect: >-
    Requires the Resilient Strength skill. The Hero treats Stunned injury results as Knocked Down.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Clan Pestilens Special Skills / ignore pain
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/skaven-pestilens
  name_i18n:
    es: Ignorar el Dolor
  effect_i18n:
    es: >-
      Requiere la habilidad Fuerza Resistente. El Héroe trata los resultados de herida de Aturdido
      como Derribado.
  eligibility:
  - plague-priest
  - pestilens-sorcerer
  - plague-monks
  - monk-initiates
  applies_to:
    band: true
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: skill.ignore-pain
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.ignore-pain
