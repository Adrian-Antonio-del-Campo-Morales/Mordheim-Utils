- id: band--clan-pestilens-special-skills-rotten-body
  kind: warband_skill
  name: Rotten Body
  effect: The Hero is immune to poisons and diseases. If taken Out of Action because of a failed Censer-related test, he automatically
    recovers after the battle and does not roll for injury.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Clan Pestilens Special Skills / rotten body
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/skaven-pestilens
  name_i18n:
    en: Rotten Body
    es: null
  effect_i18n:
    en: The Hero is immune to poisons and diseases. If taken Out of Action because of a failed Censer-related test, he automatically
      recovers after the battle and does not roll for injury.
    es: null
  eligibility:
  - plague-priest
  - pestilens-sorcerer
  - plague-monks
  - monk-initiates
  applies_to:
    band: true
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: trait.poison-immune
      scope: 'YES'
      binding:
        kind: trait
        id: trait.poison-immune
        parameters:
          value: true
    - id: campaign.censer-recovery
      scope: 'NO'
      binding: null
      reason: 'Out of scope: post-battle recovery and Serious Injury.'
- id: band--clan-pestilens-special-skills-contagious
  kind: warband_skill
  name: Contagious
  effect: Requires Rotten Body. A model that inflicts the close-combat injury which takes this Hero Out of Action must take
    a Toughness test. If the D6 result is higher than its Toughness it suffers one automatic Wound; a 6 always causes a Wound.
    Undead and Possessed are immune to this test.
  source:
    manual: mordheimer.net
    printed_page: 0
