- id: band--clan-pestilens-maximum-characteristics
  name: Clan Pestilens Maximum Characteristics
  effect: >-
    Clan Pestilens Skaven use their own racial maximum profile
    (campaign.limit.racial-maximum.skaven-clan-pestilens).
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Racial Maximum Characteristics / Skaven (Clan Pestilens)
    url: https://mordheimer.net/docs/campaigns/experience
  name_i18n:
    es: Características Máximas del Clan Pestilens
  effect_i18n:
    es: >-
      Los skaven del Clan Pestilens usan su propio perfil racial máximo
      (campaign.limit.racial-maximum.skaven-clan-pestilens).
  applies_to:
    band: true
  runtime:
