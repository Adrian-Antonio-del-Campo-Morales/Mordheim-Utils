- id: band--clan-pestilens-special-skills-black-hunger
  kind: warband_skill
  name: Black Hunger
  effect: >-
    At the beginning of his turn, the Hero may invoke Black Hunger. For that turn he gains +1 Attack
    and +D3" to his total Movement, then suffers D3 Strength 3 hits with no armour save at the end
    of the turn.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Clan Pestilens Special Skills / black hunger
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/skaven-pestilens
  name_i18n:
    es: Hambre Negra
  effect_i18n:
    es: >-
      Al comienzo de su turno, el Héroe puede invocar el Hambre negra. Durante ese turno gana +1
      Ataque y +D3" a su Movimiento total, y luego sufre D3 impactos de Fuerza 3 sin salvación por
      armadura al final del turno.
  eligibility:
  - plague-priest
  - pestilens-sorcerer
  - plague-monks
  - monk-initiates
  applies_to:
    band: true
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: mechanic.black-hunger
      scope: 'YES'
      binding:
        kind: mechanic
        id: mechanic.black-hunger
