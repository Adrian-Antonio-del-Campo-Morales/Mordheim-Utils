- id: band--shadow-warrior-special-skills-infiltration
  kind: warband_skill
  name: Infiltration
  effect: An Elf with this skill is always placed on the battlefield after the opposing warband and can be placed anywhere
    on the table as long as it is out of sight of the opposing warband and more than 12" away from any enemy model. If both
    players have models which infiltrate, roll a D6 for each, and the lowest roll sets up first.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Shadow Warrior Special Skills / Infiltration
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/shadow-warriors
  name_i18n:
    en: Infiltration
    es: null
  effect_i18n:
    en: An Elf with this skill is always placed on the battlefield after the opposing warband and can be placed anywhere on
      the table as long as it is out of sight of the opposing warband and more than 12" away from any enemy model. If both
      players have models which infiltrate, roll a D6 for each, and the lowest roll sets up first.
