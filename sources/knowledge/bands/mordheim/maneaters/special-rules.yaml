  name: Trained
  effect: Sabretusks may only be included if the warband includes a Mountain Guide. They may use the Mountain Guide's Leadership
    while within 6 inches. If no Mountain Guide is available because of death or injury, the Sabretusks cannot be used until
    a Mountain Guide is replaced and must remain at the camp.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 2 Sabretusks / Special Rules / Trained
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/maneaters
