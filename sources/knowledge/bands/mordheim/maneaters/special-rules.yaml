  name: Gluttony
  effect: Each Ogre model counts as two models when selling wyrdstone or treasure. Captured models may be devoured and their
    possessions kept, reducing the effective warband model count for income by 1, or by 2 if the consumed captive is a Large
    Target, but each Ogre always counts as at least one model. An Ogre Hero gains 1 Experience for each captured model it
    devours. Members, animals and mounts from the Ogre warband may also be consumed and are then removed from the roster.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / Gluttony
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/maneaters
  name_i18n:
    en: Gluttony
    es: null
  effect_i18n:
