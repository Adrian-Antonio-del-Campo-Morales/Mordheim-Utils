  name: Maneater
  effect: 'Ogres are not civilized of their own accord but it is

    proven they are prone to absorb foreign customs

    when travelling the world. Some eventually learn

    strange new skills before returning home to their

    tribes. This Ogre may immediately learn one skill from

    the Shooting or Academic skill lists. This skill may be

    taken only once and may not be taken by the Guide.'
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Ogres special skills / maneater
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/maneaters
