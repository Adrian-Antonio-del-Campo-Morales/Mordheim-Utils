schema_version: 2
band_id: maneaters
rules:
- id: captain--leader
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.maneaters.captain.leader
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology.'
  name: Leader
  effect: Any warrior within 6" of the Captain may use his Leadership when taking Ld tests.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 1 Captain / Special Rules / Leader
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/maneaters
  name_i18n:
    en: Leader
    es: Líder
  effect_i18n:
    en: 'Any warrior within 6" of the Captain may use

      his Leadership when taking Ld tests.'
    es: Cualquier guerrero a 6" del Capitán puede usar su Liderazgo cuando realice chequeos de Ld.
  applies_to:
    profile_ids:
    - captain
- id: mountain-guide--ranger
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.maneaters.mountain-guide.ranger
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign.'
  name: Ranger
  effect: A Mountain Guide is a dedicated tracker. If he's not put out of action in the battle, you may
    roll two dice for Exploration and pick one as the result. Note that this is not a re-roll.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 – 1 Mountain Guide / Special Rules / Ranger
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/maneaters
  name_i18n:
    en: Ranger
    es: Guardabosques
  effect_i18n:
    en: A Mountain Guide is a dedicated tracker. If he's not put out of action in the battle, you may
      roll two dice for Exploration and pick one as the result. Note that this is not a re-roll.
    es: Un Guía de Montaña es un rastreador dedicado. Si no es puesto Fuera de combate en la batalla,
      puedes tirar dos dados de Exploración y elegir uno como resultado. Ten en cuenta que esto no es
      una repetición.
  applies_to:
    profile_ids:
    - mountain-guide
- id: mountain-guide--loner
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.maneaters.mountain-guide.loner
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology.'
  name: Loner
  effect: Mountain Guides are Ogre Hunters. They become used to the solitude of the highest peaks in the
    Mountains of Mourn. A Mountain Guide hunts the slopes alone and will never claim a Gnoblar or take
    one as a pet. They are immune to all alone tests and may never become the warband leader.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 – 1 Mountain Guide / Special Rules / Loner
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/maneaters
  name_i18n:
    en: Loner
    es: Solitario
  effect_i18n:
    en: 'Mountain Guides are Ogre Hunters. They

      become used to the solitude of the highest peaks in

      the Mountains of Mourn. A Mountain Guide hunts the

      slopes alone and will never claim a Gnoblar or take

      one as a pet. They are immune to all alone tests and

      may never become the warband leader.'
    es: Los Guías de Montaña son Cazadores Ogro. Se han acostumbrado a la soledad de los picos más altos
      de las Montañas del Luto. Un Guía de Montaña caza en solitario por las laderas y jamás reclamará
      un Gnoblar ni tomará uno como mascota. Son inmunes a los chequeos de Estar Solo y jamás pueden convertirse
      en el líder de la banda.
  applies_to:
    profile_ids:
    - mountain-guide
- id: bulls--bull-charge
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: mechanic.bull-charge
      scope: 'YES'
      binding:
        kind: mechanic
        id: mechanic.bull-charge
  name: Bull Charge
  effect: Ogres learn to use their vast bulk in a charge, trampling the enemy to the ground. When charging,
    Bulls may attempt a single attack with a +1 'to hit' modifier rather than making their normal attacks.
    If successful the enemy model is automatically knocked down.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 2 Bulls / Special Rules / Bull Charge
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/maneaters
  name_i18n:
    en: Bull Charge
    es: Carga de toro
  effect_i18n:
    en: 'Ogres learn to use their vast bulk in a

      charge, trampling the enemy to the ground. When

      charging, Bulls may attempt a single attack with a +1

      ''to hit'' modifier rather than making their normal

      attacks. If successful the enemy model is automatically

      knocked down.'
    es: Los ogros aprenden a usar su enorme mole al cargar, arrollando al enemigo. Al cargar, los Toros
      pueden intentar un único ataque con un modificador de +1 para impactar en lugar de realizar sus
      ataques normales. Si tiene éxito, el modelo enemigo queda automáticamente derribado.
  applies_to:
    profile_ids:
    - bulls
- id: sabretusks--trained
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.maneaters.sabretusks.trained
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology or mounts.'
  name: Trained
  effect: Sabretusks may only be included if the warband includes a Mountain Guide. They may use the Mountain
    Guide's Leadership while within 6 inches. If no Mountain Guide is available because of death or injury,
    the Sabretusks cannot be used until a Mountain Guide is replaced and must remain at the camp.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 2 Sabretusks / Special Rules / Trained
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/maneaters
  name_i18n:
    en: Trained
    es: Adiestrado
  effect_i18n:
    en: Sabretusks may only be included if the warband includes a Mountain Guide. They may use the Mountain
      Guide's Leadership while within 6 inches. If no Mountain Guide is available because of death or
      injury, the Sabretusks cannot be used until a Mountain Guide is replaced and must remain at the
      camp.
    es: Los Dientes de Sable solo pueden incluirse si la banda incluye un Guía de Montaña. Pueden usar
      el Liderazgo del Guía de Montaña mientras estén a 6 pulgadas. Si no hay ningún Guía de Montaña disponible
      por muerte o herida, los Dientes de Sable no pueden usarse hasta que se reemplace el Guía de Montaña
      y deben permanecer en el campamento.
  applies_to:
    profile_ids:
    - sabretusks
- id: sabretusks--feral-instinct
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.maneaters.sabretusks.feral-instinct
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology.'
  name: Feral Instinct
  effect: Even a Guide has difficulty controlling such feral beasts. At the beginning of the Ogres turn
    the Sabretusk must pass a Leadership test. If the test is failed, the opponent may move the Sabretusk
    this turn. An uncontrolled Sabretusk may charge models from his own warband!
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 2 Sabretusks / Special Rules / Feral Instinct
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/maneaters
  name_i18n:
    en: Feral Instinct
    es: Instinto feral
  effect_i18n:
    en: 'Even a Guide has difficulty controlling

      such feral beasts. At the beginning of the Ogres turn

      the Sabretusk must pass a Leadership test. If the test is

      failed, the opponent may move the Sabretusk this

      turn. An uncontrolled Sabretusk may charge models

      from his own warband!'
    es: Incluso un Guía tiene dificultades para controlar bestias tan feroces. Al comienzo del turno del
      ogro, el Diente de Sable debe superar un chequeo de Liderazgo. Si falla el chequeo, el oponente
      puede mover al Diente de Sable este turno. Un Diente de Sable descontrolado ¡puede cargar contra
      modelos de su propia banda!
  applies_to:
    profile_ids:
    - sabretusks
- id: sabretusks--ignored
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.maneaters.sabretusks.ignored
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology.'
  name: Ignored
  effect: Sabretusks that are out of action do not count to the number of out of action models for the
    purpose of Rout tests.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 2 Sabretusks / Special Rules / Ignored
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/maneaters
  name_i18n:
    en: Ignored
    es: Ignorado
  effect_i18n:
    en: 'Sabretusks that are out of action do not count to the number of out of action models for the

      purpose of Rout tests.'
    es: Los Dientes de Sable que estén Fuera de combate no cuentan en el número de modelos Fuera de combate
      a efectos de chequeos de huida.
  applies_to:
    profile_ids:
    - sabretusks
- id: sabretusks--fear
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.maneaters.sabretusks.fear
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology.'
  name: Fear
  effect: Sabretusks are huge feline predators and thus cause fear.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 2 Sabretusks / Special Rules / Fear
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/maneaters
  name_i18n:
    en: Fear
    es: Miedo
  effect_i18n:
    en: Sabretusks are huge feline predators and thus cause fear.
    es: Los Dientes de Sable son enormes depredadores felinos y por tanto causan miedo.
  applies_to:
    profile_ids:
    - sabretusks
- id: sabretusks--animals
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.maneaters.sabretusks.animals
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign.'
  name: Animals
  effect: Sabretusks are animals and thus do not gain experience.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 2 Sabretusks / Special Rules / Animals
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/maneaters
  name_i18n:
    en: Animals
    es: Animales
  effect_i18n:
    en: Sabretusks are animals and thus do not gain experience.
    es: Los Dientes de Sable son animales y por tanto no ganan experiencia.
  applies_to:
    profile_ids:
    - sabretusks
- id: band--fear
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.maneaters.band.fear
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology.'
  name: Fear
  effect: All Ogre warriors in the warband cause Fear except Youngbloods.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / Fear
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/maneaters
  name_i18n:
    en: Fear
    es: Miedo
  effect_i18n:
    en: All Ogre warriors in the warband cause Fear except Youngbloods.
    es: Todos los guerreros ogro de la banda causan Miedo, excepto los Jóvenes Promesas.
  applies_to:
    band: true
- id: band--large
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.maneaters.band.large
      scope: 'NO'
      binding: null
      reason: 'Out of scope: to-hit rolls.'
  name: Large
  effect: >-
    All Ogre warriors except Youngbloods and Half-growns are Large targets: they may be selected as
    shooting targets even when they are not the closest target, and attacks made against them gain
    +1 to hit.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / Large
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/maneaters
  name_i18n:
    en: Large
    es: Grande
  effect_i18n:
    en: 'All Ogre warriors except Youngbloods and Half-growns are Large targets: they may be selected
      as shooting targets even when they are not the closest target, and attacks made against them gain
      +1 to hit.'
    es: 'Todos los guerreros ogro, excepto Jóvenes Promesas y Mediano Crecidos, son objetivos Grandes:
      pueden seleccionarse como objetivos de disparo incluso cuando no son el objetivo más cercano, y
      los ataques realizados contra ellos obtienen +1 para impactar.'
  applies_to:
    band: true
- id: band--gluttony
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.maneaters.band.gluttony
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: mounts.'
  name: Gluttony
  effect: Each Ogre model counts as two models when selling wyrdstone or treasure. Captured models may
    be devoured and their possessions kept, reducing the effective warband model count for income by 1,
    or by 2 if the consumed captive is a Large Target, but each Ogre always counts as at least one model.
    An Ogre Hero gains 1 Experience for each captured model it devours. Members, animals and mounts from
    the Ogre warband may also be consumed and are then removed from the roster.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / Gluttony
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/maneaters
  name_i18n:
    en: Gluttony
    es: Gula
  effect_i18n:
    en: Each Ogre model counts as two models when selling wyrdstone or treasure. Captured models may be
      devoured and their possessions kept, reducing the effective warband model count for income by 1,
      or by 2 if the consumed captive is a Large Target, but each Ogre always counts as at least one model.
      An Ogre Hero gains 1 Experience for each captured model it devours. Members, animals and mounts
      from the Ogre warband may also be consumed and are then removed from the roster.
    es: Cada modelo ogro cuenta como dos modelos al vender piedra bruja o tesoros. Los modelos capturados
      pueden ser devorados y sus pertenencias conservadas, reduciendo el recuento efectivo de modelos
      de la banda para los ingresos en 1, o en 2 si el cautivo consumido es un objetivo Grande, pero cada
      ogro siempre cuenta como mínimo como un modelo. Un héroe ogro gana 1 punto de Experiencia por cada
      modelo capturado que devore. Los miembros, animales y monturas de la propia banda ogro también pueden
      ser consumidos y se retiran entonces de la lista.
  applies_to:
    band: true
- id: band--slow-witted
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.maneaters.band.slow-witted
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign.'
  name: Slow Witted
  effect: Ogres gain advances at half the normal rate and must earn twice the usual number of Experience
    points for each advance.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / Slow Witted
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/maneaters
  name_i18n:
    en: Slow Witted
    es: Torpes
  effect_i18n:
    en: Ogres gain advances at half the normal rate and must earn twice the usual number of Experience
      points for each advance.
    es: Los ogros obtienen mejoras a la mitad del ritmo normal y deben ganar el doble de puntos de Experiencia
      de lo habitual por cada mejora.
  applies_to:
    band: true
- id: band--difficult-customers
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.maneaters.band.difficult-customers
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign.'
  name: Difficult Customers
  effect: Ogre Heroes suffer -1 on rolls to find Rare items unless those items are exclusively available
    to Ogres.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / Difficult Customers
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/maneaters
  name_i18n:
    en: Difficult Customers
    es: Clientes difíciles
  effect_i18n:
    en: Ogre Heroes suffer -1 on rolls to find Rare items unless those items are exclusively available
      to Ogres.
    es: Los héroes ogro sufren -1 en las tiradas para encontrar objetos raros, salvo que esos objetos
      estén disponibles exclusivamente para ogros.
  applies_to:
    band: true
- id: band--cannibals
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.maneaters.band.cannibals
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: no effect applies to the isolated 1v1 duel or legal fighter skill/equipment
        construction.
  name: Cannibals
  effect: The warband may not hire Hired Swords except Halflings such as Scouts or Thieves, the Ogre Bodyguard,
    or entries that specifically permit Ogre warbands.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / Cannibals
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/maneaters
  name_i18n:
    en: Cannibals
    es: Caníbales
  effect_i18n:
    en: The warband may not hire Hired Swords except Halflings such as Scouts or Thieves, the Ogre Bodyguard,
      or entries that specifically permit Ogre warbands.
    es: La banda no puede contratar Espadas a Sueldo, salvo Halflings como Exploradores o Ladrones, el
      Guardaespaldas Ogro, o entradas que permitan específicamente bandas ogro.
  applies_to:
    band: true
- id: band--ogre-maximum-characteristics
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.maneaters.band.ogre-maximum-characteristics
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: no effect applies to the isolated 1v1 duel or legal fighter skill/equipment
        construction.
  name: Ogre Maximum Characteristics
  effect: Ogre warriors use the Ogre maximum characteristic profile when gaining advances (campaign.limit.racial-maximum.ogre).
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Maximum characteristics
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/maneaters
  name_i18n:
    en: Ogre Maximum Characteristics
    es: Características máximas de los ogros
  effect_i18n:
    en: Ogre warriors use the Ogre maximum characteristic profile when gaining advances (campaign.limit.racial-maximum.ogre).
    es: Los guerreros ogro usan el perfil de características máximas de ogro al obtener mejoras (campaign.limit.racial-maximum.ogre).
  applies_to:
    band: true
- id: band--ogres-special-skills-master-of-arms
  kind: warband_skill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: mechanic.master-of-arms
      scope: 'YES'
      binding:
        kind: compiler
        id: compiler.master-of-arms
  name: Master of Arms
  effect: The Ogre learns how to use his size. He may now wield a Difficult to Use weapon and a hand weapon
    at the same time, but not two Difficult to Use weapons.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Ogres special skills / master of arms
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/maneaters
  name_i18n:
    en: Master of Arms
    es: Maestro de armas
  effect_i18n:
    en: 'The Ogre learns how to use his size. He may now

      wield a Difficult to Use weapon and a hand weapon at

      the same time, but not two Difficult to Use weapons.'
    es: El ogro aprende a usar su tamaño. Ahora puede empuñar un arma Difícil de Usar y un arma de mano
      al mismo tiempo, pero no dos armas Difíciles de Usar.
  applies_to:
    band: true
- id: band--ogres-special-skills-crude-belch
  kind: warband_skill
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.maneaters.band.ogres-special-skills-crude-belch
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology or mounts.'
  name: Crude Belch
  effect: Ogres eat almost anything. Consequences are to be expected from those inconsiderate enough to
    consume a rich meal before battle. A Hero with this 'condition' may unleash his thunderous fumes on
    all enemies engaged in close combat. Those that do not pass a Ld test suffer a -1 'to hit' modifier
    for the turn. The Ogre must wait until a new enemy engages him in combat before he relieves himself
    again.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Ogres special skills / crude belch
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/maneaters
  name_i18n:
    en: Crude Belch
    es: Eructo grosero
  effect_i18n:
    en: 'Ogres eat almost anything. Consequences are to be

      expected from those inconsiderate enough to

      consume a rich meal before battle. A Hero with this

      ''condition'' may unleash his thunderous fumes on all

      enemies engaged in close combat. Those that do not

      pass a Ld test suffer a -1 ''to hit'' modifier for the turn.

      The Ogre must wait until a new enemy engages him in

      combat before he relieves himself again.'
    es: Los ogros comen casi cualquier cosa. De los inconscientes que consumen una comida copiosa antes
      de la batalla son de esperar consecuencias. Un héroe con esta 'afección' puede soltar sus humos
      atronadores sobre todos los enemigos empeñados en combate cuerpo a cuerpo. Los que no superen un
      chequeo de Ld sufren un modificador de -1 para impactar durante el asalto. El ogro debe esperar
      a que un nuevo enemigo lo entable en combate antes de aliviarse de nuevo.
  applies_to:
    band: true
- id: band--ogres-special-skills-maneater
  kind: warband_skill
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.maneaters.band.ogres-special-skills-maneater
      scope: 'NO'
      binding: null
      reason: 'Out of scope: shooting.'
  name: Maneater
  effect: Ogres are not civilized of their own accord but it is proven they are prone to absorb foreign
    customs when travelling the world. Some eventually learn strange new skills before returning home
    to their tribes. This Ogre may immediately learn one skill from the Shooting or Academic skill lists.
    This skill may be taken only once and may not be taken by the Guide.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Ogres special skills / maneater
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/maneaters
  name_i18n:
    en: Maneater
    es: Devorador de hombres
  effect_i18n:
    en: 'Ogres are not civilized of their own accord but it is

      proven they are prone to absorb foreign customs

      when travelling the world. Some eventually learn

      strange new skills before returning home to their

      tribes. This Ogre may immediately learn one skill from

      the Shooting or Academic skill lists. This skill may be

      taken only once and may not be taken by the Guide.'
    es: Los ogros no son civilizados por propia naturaleza, pero está demostrado que son propensos a absorber
      costumbres extranjeras al recorrer el mundo. Algunos finalmente aprenden extrañas habilidades nuevas
      antes de volver con sus tribus. Este ogro puede aprender inmediatamente una habilidad de las listas
      de Disparo o Académicas. Esta habilidad solo puede tomarse una vez y no puede ser tomada por el
      Guía.
  applies_to:
    band: true
- id: band--ogres-special-skills-bull-charge
  kind: warband_skill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: mechanic.bull-charge
      scope: 'YES'
      binding:
        kind: mechanic
        id: mechanic.bull-charge
  name: Bull Charge
  effect: Ogres learn to use their vast bulk in a charge, trampling the enemy to the ground. When charging,
    an Ogre with this skill may attempt a single attack with a +1 'to hit' modifier rather than making
    his normal attacks. If successful the enemy model is automatically knocked down.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Ogres special skills / bull charge
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/maneaters
  name_i18n:
    en: Bull Charge
    es: Carga de toro
  effect_i18n:
    en: 'Ogres learn to use their vast bulk in a charge,

      trampling the enemy to the ground. When charging,

      an Ogre with this skill may attempt a single attack with

      a +1 ''to hit'' modifier rather than making his normal

      attacks. If successful the enemy model is automatically knocked down.'
    es: Los ogros aprenden a usar su enorme mole al cargar, arrollando al enemigo. Al cargar, un ogro
      con esta habilidad puede intentar un único ataque con un modificador de +1 para impactar en lugar
      de realizar sus ataques normales. Si tiene éxito, el modelo enemigo queda automáticamente derribado.
  applies_to:
    band: true
