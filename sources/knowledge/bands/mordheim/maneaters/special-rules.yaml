  effect: 'An Ogre leader expects challenges to his authority.

    One of the best ways to suppress a mutineer in the

    ranks is to give his ear drums a good pounding. This

    skill may only be taken by the warband leader,

    allowing him to re-roll the first failed Rout test.'
