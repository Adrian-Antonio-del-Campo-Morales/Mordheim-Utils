  name: Ranger
  effect: A Mountain Guide is a dedicated tracker. If he's not put out of action in the battle, you may roll two dice for
    Exploration and pick one as the result. Note that this is not a re-roll.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 – 1 Mountain Guide / Special Rules / Ranger
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/maneaters
