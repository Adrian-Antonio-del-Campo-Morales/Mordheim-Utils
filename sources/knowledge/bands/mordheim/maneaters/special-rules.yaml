  name: Crude Belch
  effect: Ogres eat almost anything. Consequences are to be expected from those inconsiderate enough to consume a rich meal
    before battle. A Hero with this 'condition' may unleash his thunderous fumes on all enemies engaged in close combat. Those
    that do not pass a Ld test suffer a -1 'to hit' modifier for the turn. The Ogre must wait until a new enemy engages him
    in combat before he relieves himself again.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Ogres special skills / crude belch
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/maneaters
  name_i18n:
    en: Crude Belch
    es: null
  effect_i18n:
    en: 'Ogres eat almost anything. Consequences are to be

      expected from those inconsiderate enough to

      consume a rich meal before battle. A Hero with this

      ''condition'' may unleash his thunderous fumes on all

      enemies engaged in close combat. Those that do not

      pass a Ld test suffer a -1 ''to hit'' modifier for the turn.

      The Ogre must wait until a new enemy engages him in

      combat before he relieves himself again.'
    es: null
  applies_to:
    band: true
