- id: band--hard-to-kill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: band
    effects:
    - id: skill.hard-to-kill
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.hard-to-kill
  name: Hard to Kill
  effect: Applies to all warriors except Informers. When rolling on the Injury chart, the warrior is taken out of action only
    on a 6; 1-2 is knocked down and 3-5 is stunned.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / Hard to Kill
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/black-dwarfs
  name_i18n:
    en: Hard to Kill
    es: null
  effect_i18n:
    en: Applies to all warriors except Informers. When rolling on the Injury chart, the warrior is taken out of action only
      on a 6; 1-2 is knocked down and 3-5 is stunned.
    es: null
  applies_to:
    band: true
