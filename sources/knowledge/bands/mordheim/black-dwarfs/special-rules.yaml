- id: band--chaos-dwarf-special-skills-extra-tough
  kind: warband_skill
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.black-dwarfs.band.chaos-dwarf-special-skills-extra-tough
      scope: 'NO'
      binding: null
      reason: 'Out of scope: no effect applies to the isolated 1v1 duel or legal fighter skill/equipment construction.'
  name: extra tough
  effect: A Chaos Dwarf with this skill is notorious for walking away from wounds that would kill a lesser warrior. When rolling
    on the Heroes Serious Injury chart for this Hero after a game in which he has been taken out of action, the dice may be
    re-rolled once. The result of this second dice roll must be accepted, even if it is a worse result.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Chaos Dwarf special skills / extra tough
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/black-dwarfs
  name_i18n:
    en: extra tough
    es: null
  effect_i18n:
    en: 'A Chaos Dwarf with this skill is notorious for walking

      away from wounds that would kill a lesser warrior.

      When rolling on the Heroes Serious Injury chart for

      this Hero after a game in which he has been taken out

      of action, the dice may be re-rolled once. The result

      of this second dice roll must be accepted, even if it is a

      worse result.'
    es: null
  applies_to:
    band: true
- id: band--chaos-dwarf-special-skills-chaos-engineer
  kind: warband_skill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: mechanic.chaos-engineer
      scope: 'YES'
      binding:
        kind: compiler
        id: compiler.chaos-engineer
  name: chaos engineer
  effect: The Hero has great technical skill and can use this to craft wicked armours and weapons. Whenever a Hero with this
    skill searches for Chaos armour (including Mechanical Suits) or Obsidian Weapons, he gets +3 on the roll. This represents
    the Engineer’s ability to craft these items himself. The Hero ignores the Rarity and Gift of Chaos special rules and may
    never wear the Chaos Armours.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Chaos Dwarf special skills / chaos engineer
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/black-dwarfs
  name_i18n:
    en: chaos engineer
    es: null
  effect_i18n:
    en: 'The Hero has great technical skill and can use this to

      craft wicked armours and weapons. Whenever a Hero

      with this skill searches for Chaos armour (including

      Mechanical Suits) or Obsidian Weapons, he gets +3

      on the roll. This represents the Engineer’s ability to

      craft these items himself. The Hero ignores the Rarity

      and Gift of Chaos special rules and may never wear

      the Chaos Armours.'
    es: null
  applies_to:
    band: true
- id: band--chaos-dwarf-special-skills-thick-skull
  kind: warband_skill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: skill.thick-skull
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.thick-skull
  name: thick skull
  effect: 'The Hero has a thick skull, even for a Chaos Dwarf.

    He has a 3+ save on a D6 to avoid being stunned. If

    the save is made, treat a stunned result as knocked

    down instead. If the Chaos Dwarf also wears a helmet,

    this save is 2+ instead of 3+ (this takes the place of

    the normal Helmet special rule).'
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Chaos Dwarf special skills / thick skull
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/black-dwarfs
  name_i18n:
    en: thick skull
    es: null
  effect_i18n:
    en: 'The Hero has a thick skull, even for a Chaos Dwarf.

      He has a 3+ save on a D6 to avoid being stunned. If

      the save is made, treat a stunned result as knocked

      down instead. If the Chaos Dwarf also wears a helmet,

      this save is 2+ instead of 3+ (this takes the place of

      the normal Helmet special rule).'
    es: null
  applies_to:
    band: true
