schema_version: 2
band_id: black-dwarfs
rules:
- id: sorcerer--leader
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.black-dwarfs.sorcerer.leader
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology.'
  name: Leader
  effect: Any warrior within 6“ of the Sorcerer may use his Leadership when taking Ld tests.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 1 Sorcerer / Special Rules / Leader
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/black-dwarfs
  name_i18n:
    en: Leader
    es: Líder
  effect_i18n:
    en: 'Any warrior within 6“ of the Sorcerer may use

      his Leadership when taking Ld tests.'
    es: Cualquier guerrero a 6“ del Hechicero puede usar su Liderazgo al realizar chequeos de L.
  applies_to:
    profile_ids:
    - sorcerer
- id: sorcerer--wizard
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.black-dwarfs.sorcerer.wizard
      scope: 'NO'
      binding: null
      reason: 'Out of scope: magic.'
  name: Wizard
  effect: The Sorcerer is a wizard and follows the rules for wizards in the magic section. Sorcerers may
    cast Rituals of Hashut .
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 1 Sorcerer / Special Rules / Wizard
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/black-dwarfs
  name_i18n:
    en: Wizard
    es: Mago
  effect_i18n:
    en: 'The Sorcerer is a wizard and follows the rules

      for wizards in the magic section. Sorcerers may cast Rituals of Hashut .'
    es: El Hechicero es un mago y sigue las reglas de los magos en la sección de magia. Los Hechiceros
      pueden lanzar los Rituales de Hashut.
  applies_to:
    profile_ids:
    - sorcerer
- id: sorcerer--priest
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.black-dwarfs.sorcerer.priest
      scope: 'NO'
      binding: null
      reason: 'Out of scope: magic.'
  name: Priest
  effect: The Sorcerer starts with two rituals. One of them is the Sacrificial Ritual . The other spell
    is determined as usual from the Rituals of Hashut .
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 1 Sorcerer / Special Rules / Priest
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/black-dwarfs
  name_i18n:
    en: Priest
    es: Sacerdote
  effect_i18n:
    en: 'The Sorcerer starts with two rituals. One of

      them is the Sacrificial Ritual . The other spell is

      determined as usual from the Rituals of Hashut .'
    es: El Hechicero comienza con dos rituales. Uno de ellos es el Ritual de Sacrificio. El otro hechizo
      se determina como de costumbre de entre los Rituales de Hashut.
  applies_to:
    profile_ids:
    - sorcerer
- id: bull-centaur--large-target
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.black-dwarfs.bull-centaur.large-target
      scope: 'NO'
      binding: null
      reason: 'Out of scope: shooting.'
  name: Large target
  effect: Bull centaurs are large creatures and therefore make tempting targets for archers. Anyone shooting
    at the Bull Centaur gains a +1 ‘to hit’ and may shoot at it even if it is not the closest target.
    As large targets a Bull Centaur adds an extra +20 to the warband’s rating.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 – 1 Bull Centaur / Special Rules / Large target
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/black-dwarfs
  name_i18n:
    en: Large target
    es: Objetivo grande
  effect_i18n:
    en: 'Bull centaurs are large creatures and

      therefore make tempting targets for archers. Anyone

      shooting at the Bull Centaur gains a +1 ‘to hit’ and

      may shoot at it even if it is not the closest target. As

      large targets a Bull Centaur adds an extra +20 to the

      warband’s rating.'
    es: Los centauros toro son criaturas enormes y por tanto constituyen objetivos tentadores para los
      arqueros. Cualquiera que dispare al Centauro toro obtiene +1 'para impactar' y puede dispararle
      incluso si no es el objetivo más cercano. Como objetivos grandes, un Centauro toro añade +20 extra
      a la valoración de la banda.
  applies_to:
    profile_ids:
    - bull-centaur
- id: gaolers--nasty-reputation
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.black-dwarfs.gaolers.nasty-reputation
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology.'
  name: Nasty Reputation
  effect: Gaolers are known for their brutality. The dreaded sight of them and the very thought of being
    captured causes fear in Humans.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 – 2 Gaolers / Special Rules / Nasty Reputation
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/black-dwarfs
  name_i18n:
    en: Nasty Reputation
    es: Mala reputación
  effect_i18n:
    en: 'Gaolers are known for their

      brutality. The dreaded sight of them and the very

      thought of being captured causes fear in Humans.'
    es: Los Carceleros son conocidos por su brutalidad. La temible visión de ellos y la mera idea de ser
      capturado provoca miedo en los Humanos.
  applies_to:
    profile_ids:
    - gaolers
- id: informers--drudgery
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.black-dwarfs.informers.drudgery
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign.'
  name: Drudgery
  effect: Informers have had their will broken by their masters. Informers may never become Heroes. Re-roll
    all results of ‘The lad’s got talent’ for them.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / Informers / Special Rules / Drudgery
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/black-dwarfs
  name_i18n:
    en: Drudgery
    es: Servidumbre
  effect_i18n:
    en: 'Informers have had their will broken by

      their masters. Informers may never become Heroes.

      Re-roll all results of ‘The lad’s got talent’ for them.'
    es: Los Soplones han tenido su voluntad quebrantada por sus amos. Los Soplones nunca pueden convertirse
      en Héroes. Repite todos los resultados de 'The Lad's Got Talent' para ellos.
  applies_to:
    profile_ids:
    - informers
- id: band--hard-to-kill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: band
    effects:
    - id: skill.hard-to-kill
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.hard-to-kill
  name: Hard to Kill
  effect: Applies to all warriors except Informers. When rolling on the Injury chart, the warrior is taken
    out of action only on a 6; 1-2 is knocked down and 3-5 is stunned.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / Hard to Kill
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/black-dwarfs
  name_i18n:
    en: Hard to Kill
    es: Difíciles de matar
  effect_i18n:
    en: Applies to all warriors except Informers. When rolling on the Injury chart, the warrior is taken
      out of action only on a 6; 1-2 is knocked down and 3-5 is stunned.
    es: Aplica a todos los guerreros excepto los Soplones. Al tirar en la tabla de Heridas, el guerrero
      se retira del combate solo con un 6; 1-2 es Derribado y 3-5 es Aturdido.
  applies_to:
    band: true
  eligibility:
  - sorcerer
  - bull-centaur
  - gaolers
  - chaos-dwarfs
- id: band--hard-head
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.black-dwarfs.band.hard-head
      scope: 'NO'
      binding: null
      reason: 'Out of scope: injuries.'
  name: Hard Head
  effect: Applies to all warriors except Informers. Chaos Dwarfs ignore the special rules for clubs, maces,
    and similar weapons.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / Hard Head
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/black-dwarfs
  name_i18n:
    en: Hard Head
    es: Cabeza dura
  effect_i18n:
    en: Applies to all warriors except Informers. Chaos Dwarfs ignore the special rules for clubs, maces,
      and similar weapons.
    es: Aplica a todos los guerreros excepto los Soplones. Los Enanos del Caos ignoran las reglas especiales
      de garrotes, mazas y armas similares.
  applies_to:
    band: true
- id: band--armour
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.black-dwarfs.band.armour
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: no effect applies to the isolated 1v1 duel or legal fighter skill/equipment
        construction.
  name: Armour
  effect: Applies to all warriors except Informers. Chaos Dwarfs never suffer movement penalties for wearing
    armour.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / Armour
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/black-dwarfs
  name_i18n:
    en: Armour
    es: Armadura
  effect_i18n:
    en: Applies to all warriors except Informers. Chaos Dwarfs never suffer movement penalties for wearing
      armour.
    es: Aplica a todos los guerreros excepto los Soplones. Los Enanos del Caos nunca sufren penalizaciones
      de movimiento por llevar armadura.
  applies_to:
    band: true
- id: band--hired-swords
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.black-dwarfs.band.hired-swords
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: no effect applies to the isolated 1v1 duel or legal fighter skill/equipment
        construction.
  name: Hired Swords
  effect: The warband may hire Ogre Bodyguards, Pit Fighters, Warlocks, Imperial Assassins and Hobgoblin
    Scouts, plus Hired Swords available to all warbands or to Orc or Chaos warbands. It may never hire
    Elves.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / Hired Swords
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/black-dwarfs
  name_i18n:
    en: Hired Swords
    es: Espadas a sueldo
  effect_i18n:
    en: The warband may hire Ogre Bodyguards, Pit Fighters, Warlocks, Imperial Assassins and Hobgoblin
      Scouts, plus Hired Swords available to all warbands or to Orc or Chaos warbands. It may never hire
      Elves.
    es: La banda puede contratar Guardaespaldas ogros, Luchadores de fosa, Brujos, Asesinos imperiales
      y Exploradores hobgoblin, más las Espadas a sueldo disponibles para todas las bandas o para bandas
      de orcos o del Caos. Nunca puede contratar elfos.
  applies_to:
    band: true
- id: band--characteristic-maximum
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.black-dwarfs.band.characteristic-maximum
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: no effect applies to the isolated 1v1 duel or legal fighter skill/equipment
        construction.
  name: Characteristic Maximum
  effect: Chaos Dwarf warriors use the Dwarf maximum characteristic profile (campaign.limit.racial-maximum.dwarf);
    Bull Centaurs use the Bull Centaur (Black Dwarfs) maximum characteristic profile (campaign.limit.racial-maximum.bull-centaur-black-dwarfs).
    Informers use the human maximum characteristics from the Mordheim rulebook (campaign.limit.racial-maximum.human).
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Characteristic increase
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/black-dwarfs
  name_i18n:
    en: Characteristic Maximum
    es: Característica máxima
  effect_i18n:
    en: Chaos Dwarf warriors use the Dwarf maximum characteristic profile (campaign.limit.racial-maximum.dwarf);
      Bull Centaurs use the Bull Centaur (Black Dwarfs) maximum characteristic profile (campaign.limit.racial-maximum.bull-centaur-black-dwarfs).
      Informers use the human maximum characteristics from the Mordheim rulebook (campaign.limit.racial-maximum.human).
    es: Los guerreros Enanos del Caos usan el perfil de características máximas Enano (campaign.limit.racial-maximum.dwarf);
      los Centauros toro usan el perfil de características máximas del Centauro toro (Enanos Negros) (campaign.limit.racial-maximum.bull-centaur-black-dwarfs).
      Los Soplones usan las características máximas humanas del libro de reglas de Mordheim (campaign.limit.racial-maximum.human).
  applies_to:
    band: true
- id: band--chaos-dwarf-special-skills
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: band
    effects:
    - id: profile.skill-access
      scope: 'YES'
      binding:
        kind: profile
        id: profile.skill-access
        parameters:
          category: special
  name: Chaos Dwarf special skills
  effect: Chaos Dwarfs may choose to use the following skill list instead of the standard skill lists.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Chaos Dwarf special skills
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/black-dwarfs
  name_i18n:
    en: Chaos Dwarf special skills
    es: Habilidades especiales de los Enanos del Caos
  effect_i18n:
    en: Chaos Dwarfs may choose to use the following skill list instead of the standard skill lists.
    es: Los Enanos del Caos pueden elegir usar la siguiente lista de habilidades en lugar de las listas
      de habilidades estándar.
  applies_to:
    band: true
- id: band--chaos-dwarf-special-skills-extra-tough
  kind: warband_skill
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.black-dwarfs.band.chaos-dwarf-special-skills-extra-tough
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: no effect applies to the isolated 1v1 duel or legal fighter skill/equipment
        construction.
  name: extra tough
  effect: A Chaos Dwarf with this skill is notorious for walking away from wounds that would kill a lesser
    warrior. When rolling on the Heroes Serious Injury chart for this Hero after a game in which he has
    been taken out of action, the dice may be re-rolled once. The result of this second dice roll must
    be accepted, even if it is a worse result.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Chaos Dwarf special skills / extra tough
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/black-dwarfs
  name_i18n:
    en: extra tough
    es: Extra resistente
  effect_i18n:
    en: 'A Chaos Dwarf with this skill is notorious for walking

      away from wounds that would kill a lesser warrior.

      When rolling on the Heroes Serious Injury chart for

      this Hero after a game in which he has been taken out

      of action, the dice may be re-rolled once. The result

      of this second dice roll must be accepted, even if it is a

      worse result.'
    es: Un Enano del Caos con esta habilidad es famoso por sobrevivir a heridas que matarían a un guerrero
      inferior. Al tirar en la tabla de Heridas Graves de Héroes para este héroe tras una partida en la
      que haya sido retirado del combate, el dado puede repetirse una vez. El resultado de esta segunda
      tirada debe aceptarse, incluso si es peor.
  applies_to:
    band: true
- id: band--chaos-dwarf-special-skills-chaos-engineer
  kind: warband_skill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: mechanic.chaos-engineer
      scope: 'YES'
      binding:
        kind: compiler
        id: compiler.chaos-engineer
  name: chaos engineer
  effect: The Hero has great technical skill and can use this to craft wicked armours and weapons. Whenever
    a Hero with this skill searches for Chaos armour (including Mechanical Suits) or Obsidian Weapons,
    he gets +3 on the roll. This represents the Engineer’s ability to craft these items himself. The Hero
    ignores the Rarity and Gift of Chaos special rules and may never wear the Chaos Armours.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Chaos Dwarf special skills / chaos engineer
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/black-dwarfs
  name_i18n:
    en: chaos engineer
    es: Ingeniero del Caos
  effect_i18n:
    en: 'The Hero has great technical skill and can use this to

      craft wicked armours and weapons. Whenever a Hero

      with this skill searches for Chaos armour (including

      Mechanical Suits) or Obsidian Weapons, he gets +3

      on the roll. This represents the Engineer’s ability to

      craft these items himself. The Hero ignores the Rarity

      and Gift of Chaos special rules and may never wear

      the Chaos Armours.'
    es: El Héroe tiene grandes habilidades técnicas y puede usarlas para forjar armaduras y armas perversas.
      Siempre que un Héroe con esta habilidad busque armadura del Caos (incluyendo Trajes Mecánicos) o
      Armas de Obsidiana, obtiene +3 en la tirada. Esto representa la capacidad del Ingeniero de forjar
      estos objetos él mismo. El Héroe ignora las reglas especiales de Rareza y Don del Caos y nunca puede
      vestir las Armaduras del Caos.
  applies_to:
    band: true
- id: band--chaos-dwarf-special-skills-thick-skull
  kind: warband_skill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: skill.thick-skull
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.thick-skull
  name: thick skull
  effect: The Hero has a thick skull, even for a Chaos Dwarf. He has a 3+ save on a D6 to avoid being
    stunned. If the save is made, treat a stunned result as knocked down instead. If the Chaos Dwarf also
    wears a helmet, this save is 2+ instead of 3+ (this takes the place of the normal Helmet special rule).
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Chaos Dwarf special skills / thick skull
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/black-dwarfs
  name_i18n:
    en: thick skull
    es: Cráneo grueso
  effect_i18n:
    en: 'The Hero has a thick skull, even for a Chaos Dwarf.

      He has a 3+ save on a D6 to avoid being stunned. If

      the save is made, treat a stunned result as knocked

      down instead. If the Chaos Dwarf also wears a helmet,

      this save is 2+ instead of 3+ (this takes the place of

      the normal Helmet special rule).'
    es: El Héroe tiene un cráneo grueso, incluso para un Enano del Caos. Tiene una salvación de 3+ en
      un D6 para evitar quedar Aturdido. Si supera la salvación, trata un resultado de Aturdido como Derribado
      en su lugar. Si el Enano del Caos además lleva casco, esta salvación es 2+ en lugar de 3+ (esto
      sustituye a la regla especial normal de Casco).
  applies_to:
    band: true
- id: band--chaos-dwarf-special-skills-resource-hunter
  kind: warband_skill
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.black-dwarfs.band.chaos-dwarf-special-skills-resource-hunter
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign.'
  name: resource hunter
  effect: This Chaos Dwarf is especially good at locating valuable resources. When rolling on the Exploration
    chart at the end of a game, the hero may modify one dice roll by +1/-1.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Chaos Dwarf special skills / resource hunter
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/black-dwarfs
  name_i18n:
    en: resource hunter
    es: Cazador de recursos
  effect_i18n:
    en: 'This Chaos Dwarf is especially good at locating

      valuable resources. When rolling on the Exploration

      chart at the end of a game, the hero may modify one

      dice roll by +1/-1.'
    es: Este Enano del Caos es especialmente bueno localizando recursos valiosos. Al tirar en la tabla
      de Exploración al final de una partida, el héroe puede modificar una tirada de dado en +1/-1.
  applies_to:
    band: true
- id: band--chaos-dwarf-special-skills-tyrant
  kind: warband_skill
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.black-dwarfs.band.chaos-dwarf-special-skills-tyrant
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology.'
  name: tyrant
  effect: This skill is for the Chaos Dwarf leader only. This Priest of Hashut is renowned for his tyranny.
    His word is absolute so his own warband fears his cruelty more then the enemy. When making a Rout
    test, and if led by a leader with this skill, the leader may inspire his warband to stick around.
    This skill allows the leader to re-roll any failed Rout test, as long as the leader is not knocked
    down or stunned. If re-rolled, the new result will apply even if the new result is worse. If the leader
    is taken out of action the warband must make an immediate Rout test.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Chaos Dwarf special skills / tyrant
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/black-dwarfs
  name_i18n:
    en: tyrant
    es: Tirano
  effect_i18n:
    en: 'This skill is for the Chaos Dwarf leader only. This

      Priest of Hashut is renowned for his tyranny. His word

      is absolute so his own warband fears his cruelty more

      then the enemy. When making a Rout test, and if led

      by a leader with this skill, the leader may inspire his

      warband to stick around. This skill allows the leader to

      re-roll any failed Rout test, as long as the leader is not

      knocked down or stunned. If re-rolled, the new result

      will apply even if the new result is worse. If the leader

      is taken out of action the warband must make an

      immediate Rout test.'
    es: Esta habilidad es solo para el líder Enano del Caos. Este Sacerdote de Hashut es renombrado por
      su tiranía. Su palabra es absoluta, así que su propia banda teme su crueldad más que al enemigo.
      Al realizar un chequeo de Huida, si está dirigida por un líder con esta habilidad, el líder puede
      inspirar a su banda para que aguante. Esta habilidad permite al líder repetir cualquier chequeo
      de Huida fallido, siempre que el líder no esté Derribado o Aturdido. Si se repite, el nuevo resultado
      aplicará incluso si es peor. Si el líder es puesto fuera de combate, la banda debe realizar un chequeo
      de Huida inmediato.
  applies_to:
    band: true
- id: band--chaos-dwarf-special-skills-true-grit
  kind: warband_skill
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: selectable
    effects:
    - id: skill.tough-as-steel
      scope: 'YES'
      binding:
        kind: mechanic
        id: skill.tough-as-steel
  name: true grit
  effect: Chaos Dwarfs are hardy individuals and this Hero is resolute, even for a Chaos Dwarf! When rolling
    on the Injury table for this Hero, a roll of 1-3 is treated as knocked down , 4-5 as stunned , and
    6 as out of action .
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Chaos Dwarf special skills / true grit
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/black-dwarfs
  name_i18n:
    en: true grit
    es: Entereza
  effect_i18n:
    en: 'Chaos Dwarfs are hardy individuals and this Hero is

      resolute, even for a Chaos Dwarf! When rolling on the

      Injury table for this Hero, a roll of 1-3 is treated as knocked down , 4-5 as stunned , and 6 as
      out of action .'
    es: ¡Los Enanos del Caos son individuos duros y este Héroe es resuelto, incluso para un Enano del
      Caos! Al tirar en la tabla de Heridas para este Héroe, un resultado de 1-3 se trata como Derribado,
      4-5 como Aturdido y 6 como Fuera de combate.
  applies_to:
    band: true
