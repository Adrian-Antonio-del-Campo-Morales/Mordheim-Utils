      Prisoners are found, roll D3 for their number and test the Captain's Leadership separately for each. A successful test
      adds the Prisoner as Crew; a failed test adds the Prisoner as a Swabbie. A new Crewman starts at normal Crew characteristics
      and 0 Experience unless joining an existing Crew group of four or fewer models, in which case it matches that group's
      characteristics and advances. If the warband cannot pay to equip a successful Prisoner as Crew, it becomes a Swabbie
      instead.
    es: null
