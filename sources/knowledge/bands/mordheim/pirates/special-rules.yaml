- id: band--pirate-special-skills-swashbuckler
  kind: warband_skill
  name: Swashbuckler
  effect: The pirate cuts a dashing figure in combat, mixing dazzling swordplay and acrobatic feats with
    charm and witty comments. Even the basest villains in Mordheim respect (and curse) his ability to
    always seem to effortlessly slip from their grasp. The pirate may make a Leadership Test at the end
    of any Hand-to-Hand phase (pirate's or enemy's turn) if he is still in base contact with any enemy
    models. If he passes he may make a normal movement away from the enemy (he may not run or charge),
    without the enemy striking any blows on him. If he fails the test he remains in combat and must fight
    as normal in the following turn.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Pirate Special Skills / Swashbuckler
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/pirates
  name_i18n:
    en: Swashbuckler
    es: Esgrimista gallardo
  effect_i18n:
    en: 'The pirate cuts a dashing figure in combat,

      mixing dazzling swordplay and acrobatic feats

      with charm and witty comments. Even the

      basest villains in Mordheim respect (and curse)

      his ability to always seem to effortlessly slip

      from their grasp. The pirate may make a

      Leadership Test at the end of any Hand-to-Hand

      phase (pirate''s or enemy''s turn) if he is still in

      base contact with any enemy models. If he

      passes he may make a normal movement away

      from the enemy (he may not run or charge),

      without the enemy striking any blows on him. If

      he fails the test he remains in combat and must

      fight as normal in the following turn.'
    es: El pirata luce una figura gallarda en el combate, mezclando un deslumbrante juego de espada y
      hazañas acrobáticas con encanto y comentarios ingeniosos. Incluso los villanos más viles de Mordheim
      respetan (y maldicen) su habilidad de siempre parecer escapar sin esfuerzo de su alcance. El pirata
      puede hacer un Chequeo de Liderazgo al final de cualquier fase de Combate Cuerpo a Cuerpo (turno
      del pirata o del enemigo) si sigue en contacto de peana con algún modelo enemigo. Si lo supera,
      puede realizar un movimiento normal alejándose del enemigo (no puede correr ni cargar), sin que
      el enemigo le golpee. Si falla el chequeo, permanece en combate y debe luchar con normalidad en
      el siguiente asalto.
  applies_to:
    band: true
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.pirates.band.pirate-special-skills-swashbuckler
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology or mounts.'
