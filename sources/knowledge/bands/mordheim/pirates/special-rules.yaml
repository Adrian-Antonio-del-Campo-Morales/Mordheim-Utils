- id: band--pirate-special-skills-cutlass-master
  kind: warband_skill
  name: Cutlass Master
  effect: These short, single bladed swords are the mainstay weapon of any pirate crew, and in the hands
    of a trained seaman they are superb weapons for close quarters fighting. If the pirate is equipped
    with a Sword, this skill will give him the additional benefit of also being able to parry successfully
    if the player rolls equal to number rolled to hit, not just higher as normal. This extra ability only
    apply if the Pirate is not in the open; ie., only when in cover or in a building, within 2" of a terrain
    feature like a wall or tree, etc.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Pirate Special Skills / Cutlass Master
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/pirates
  name_i18n:
    en: Cutlass Master
    es: Maestro del sable
  effect_i18n:
    en: 'These short, single bladed swords are the

      mainstay weapon of any pirate crew, and in the

      hands of a trained seaman they are superb

      weapons for close quarters fighting. If the pirate

      is equipped with a Sword, this skill will give him

      the additional benefit of also being able to parry

      successfully if the player rolls equal to number

      rolled to hit, not just higher as normal. This

      extra ability only apply if the Pirate is not in the

      open; ie., only when in cover or in a building,

      within 2" of a terrain feature like a wall or tree,

      etc.'
    es: Estas espadas cortas de hoja única son el arma principal de cualquier tripulación pirata y, en
      manos de un marino entrenado, son armas soberbias para el combate a corta distancia. Si el pirata
      está equipado con una Espada, esta habilidad le otorga el beneficio adicional de poder emparañar
      con éxito si el jugador saca un número igual al de la tirada para impactar, no solo superior como
      es normal. Esta habilidad extra solo se aplica si el Pirata no está a campo abierto; es decir, solo
      cuando está en cobertura o en un edificio, a 2" de un rasgo de terreno como un muro o un árbol,
      etc.
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.pirates.band.pirate-special-skills-cutlass-master
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, or non-duel context.'
- id: band--pirate-special-skills-booming-voice
  kind: warband_skill
  name: Booming Voice
  effect: (Captain only) The Captain has spent many a battle bellowing orders to his crew, yelling above
    the roar of the cannons and the screams of the enemy. Once per turn, the captain may shout encouraging
    words (or threats) at any one pirate within 8" who just failed his test to see if he runs away from
    combat, or to stop running away if he was already fleeing. That pirate may then re-roll the test.
    This can only be done if the Captain is on his feet, but not if the Captain is in close combat himself.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Pirate Special Skills / Booming Voice
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/pirates
