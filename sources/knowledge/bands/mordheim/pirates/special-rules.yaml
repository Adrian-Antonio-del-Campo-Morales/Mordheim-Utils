- id: band--kidnapped
  name: Kidnapped!
  effect: A captured enemy Human Hero may be offered a chance to join instead of being ransomed or sold. Both players roll
    2D6 and add the Leadership of the Pirate Captain or captive respectively; the winner of the battle adds +1. If the Pirate
    total is higher, the captive becomes Crew, either creating a new Crew group or joining one of four or fewer models, and
    adopts the Crew group's characteristics and advances. Otherwise the captive becomes a Swabbie, retaining its own characteristics
    and skills but losing its old equipment and using only the Swabbie Equipment List. Enemy Human Henchmen permanently lost
    after being taken Out of Action may be captured on a 4+ if the Pirates won, and then test in the same way. Hired Swords
    and Special Characters can never be recruited by this rule.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / Swabbies / Kidnapped!
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/pirates
  name_i18n:
    en: Kidnapped!
    es: null
  effect_i18n:
    en: A captured enemy Human Hero may be offered a chance to join instead of being ransomed or sold. Both players roll 2D6
      and add the Leadership of the Pirate Captain or captive respectively; the winner of the battle adds +1. If the Pirate
      total is higher, the captive becomes Crew, either creating a new Crew group or joining one of four or fewer models,
      and adopts the Crew group's characteristics and advances. Otherwise the captive becomes a Swabbie, retaining its own
      characteristics and skills but losing its old equipment and using only the Swabbie Equipment List. Enemy Human Henchmen
      permanently lost after being taken Out of Action may be captured on a 4+ if the Pirates won, and then test in the same
      way. Hired Swords and Special Characters can never be recruited by this rule.
    es: null
  applies_to:
    band: true
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.pirates.band.kidnapped
      scope: 'NO'
      binding: null
      reason: 'Out of scope: no effect applies to the isolated 1v1 duel or legal fighter skill/equipment construction.'
- id: band--stragglers-and-prisoners
  name: Stragglers and Prisoners
  effect: When exploration finds Stragglers, the Captain may pass a Leadership test to turn the Straggler into a Swabbie.
    When Prisoners are found, roll D3 for their number and test the Captain's Leadership separately for each. A successful
    test adds the Prisoner as Crew; a failed test adds the Prisoner as a Swabbie. A new Crewman starts at normal Crew characteristics
    and 0 Experience unless joining an existing Crew group of four or fewer models, in which case it matches that group's
    characteristics and advances. If the warband cannot pay to equip a successful Prisoner as Crew, it becomes a Swabbie instead.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / Swabbies / Stragglers and Prisoners
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/pirates
  name_i18n:
    en: Stragglers and Prisoners
    es: null
  effect_i18n:
