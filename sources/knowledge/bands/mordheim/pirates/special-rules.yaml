- id: band--pirate-special-skills-sea-shanty-singer
  kind: warband_skill
  name: Sea Shanty Singer
  effect: 'The pirate is renowned throughout the seas as

    one of the greatest singers aboard a ship, able to

    raise the spirits of any crew with his stirring

    renditions of ''The Sloop Johan Bee'', ''What do

    you do with a Drunken Halfling?'', and other

    famous pirate ditties. At the start of his Close

    Combat phase he can suddenly burst out in

    song, distracting one opponent in base contact

    of his choosing. That enemy must pass a

    Leadership test, or lose 1 Attack that turn. This

    does not affect Undead or other non-living creatures, such as Possessed.'
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Pirate Special Skills / Sea Shanty Singer
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/pirates
