      pirate within 8" who just failed his test to see if

      he runs away from combat, or to stop running

      away if he was already fleeing. That pirate may

      then re-roll the test. This can only be done if the

      Captain is on his feet, but not if the Captain is in

      close combat himself.'
    es: (Solo el Capitán) El Capitán ha pasado muchas batallas bramando órdenes a su tripulación, gritando
      por encima del rugido de los cañones y los gritos del enemigo. Una vez por asalto, el capitán puede
      gritar palabras de aliento (o amenazas) a cualquier pirata a 8" que acabe de fallar su chequeo para
