- id: swabbies--rabble
  name: Rabble
  effect: Swabbies in the same Henchman group do not need identical equipment. Each may use different
    items, but only from the Swabbie Equipment List. Swabbies can never use magic or cast spells, regardless
    of their original background.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Henchmen / Swabbies / Rabble
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/pirates
  name_i18n:
    en: Rabble
    es: Chusma
  effect_i18n:
    en: Swabbies in the same Henchman group do not need identical equipment. Each may use different items,
      but only from the Swabbie Equipment List. Swabbies can never use magic or cast spells, regardless
      of their original background.
    es: Las Fregonas en el mismo grupo de secuaces no necesitan equipo idéntico. Cada una puede usar objetos
      diferentes, pero solo de la Lista de Equipo de Fregonas. Las Fregonas jamás pueden usar magia ni
      lanzar hechizos, independientemente de su trasfondo original.
  applies_to:
