      Mercenary warband. If the Pirate warband contains both Dwarf and Elf Hired Swords at the same time,
      it pays an additional 20 gc total upkeep.
    es: Salvo que se indique específicamente lo contrario, los Piratas usan el mismo acceso a Espadas
