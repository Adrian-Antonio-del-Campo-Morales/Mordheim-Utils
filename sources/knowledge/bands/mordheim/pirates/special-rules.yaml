- id: band--pirate-special-skills-sea-shanty-singer
  kind: warband_skill
  name: Sea Shanty Singer
  effect: The pirate is renowned throughout the seas as one of the greatest singers aboard a ship, able
    to raise the spirits of any crew with his stirring renditions of 'The Sloop Johan Bee', 'What do you
    do with a Drunken Halfling?', and other famous pirate ditties. At the start of his Close Combat phase
    he can suddenly burst out in song, distracting one opponent in base contact of his choosing. That
    enemy must pass a Leadership test, or lose 1 Attack that turn. This does not affect Undead or other
    non-living creatures, such as Possessed.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Pirate Special Skills / Sea Shanty Singer
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/pirates
  name_i18n:
    en: Sea Shanty Singer
    es: Cantante de coplas de mar
  effect_i18n:
    en: 'The pirate is renowned throughout the seas as

      one of the greatest singers aboard a ship, able to

      raise the spirits of any crew with his stirring

      renditions of ''The Sloop Johan Bee'', ''What do

      you do with a Drunken Halfling?'', and other

      famous pirate ditties. At the start of his Close

      Combat phase he can suddenly burst out in

      song, distracting one opponent in base contact

      of his choosing. That enemy must pass a

      Leadership test, or lose 1 Attack that turn. This

      does not affect Undead or other non-living creatures, such as Possessed.'
    es: El pirata es renombrado en todos los mares como uno de los mejores cantantes de a bordo, capaz
      de levantar los ánimos de cualquier tripulación con sus conmovedoras versiones de 'La Goleta Johan
      Bee', '¿Qué se hace con un Halfling Borracho?' y otras famosas coplas piratas. Al inicio de su fase
      de Combate Cuerpo a Cuerpo puede estallar de repente en canción, distrayendo a un oponente en contacto
      de peana de su elección. Ese enemigo debe superar un chequeo de Liderazgo, o perder 1 Ataque ese
      asalto. Esto no afecta a No-muertos ni otras criaturas no vivientes, como los Poseídos.
  applies_to:
    band: true
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.pirates.band.pirate-special-skills-sea-shanty-singer
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology or mounts.'
- id: band--pirate-special-skills-sea-legs
  kind: warband_skill
  name: Sea Legs
  effect: Even in the strongest seas, the pirate has learned to keep his footing and equilibrium. If he
    Falls during a battle, he may ignore the effects of the D3 hits on a roll of 4+ (make a single roll
    to see if the any of the hits take effect or not). In addition, if he is knocked down or stunned within
    1" of a precipice he may re-roll his Initiative test to see if he falls down or not.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Pirate Special Skills / Sea Legs
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/pirates
  name_i18n:
    en: Sea Legs
    es: Piernas de mar
  effect_i18n:
    en: 'Even in the strongest seas, the pirate has

      learned to keep his footing and equilibrium. If

      he Falls during a battle, he may ignore the

      effects of the D3 hits on a roll of 4+ (make a

      single roll to see if the any of the hits take effect

      or not). In addition, if he is knocked down or

      stunned within 1" of a precipice he may re-roll

      his Initiative test to see if he falls down or not.'
    es: Incluso en los mares más agitados, el pirata ha aprendido a mantener el equilibrio y la estabilidad.
      Si Cae durante una batalla, puede ignorar los efectos de los D3 impactos con una tirada de 4+ (haz
      una única tirada para ver si alguno de los impactos surte efecto o no). Además, si es derribado
      o aturdido a 1" de un precipicio, puede repetir su chequeo de Iniciativa para ver si cae o no.
