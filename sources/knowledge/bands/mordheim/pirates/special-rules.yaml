- id: gunners--swivel-gun-is-dangerous-matey
  name: Swivel Guns Is Dangerous, Matey!
  effect: A Gunner equipped with the warband's single Swivel Gun must always form a one-model Henchman
    group. If split from an existing Gunner group to carry it, the Gunner retains the Experience and advances
    already earned by that group.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Henchmen / Gunners / Special Rules
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/pirates
  name_i18n:
    en: Swivel Guns Is Dangerous, Matey!
    es: ¡Los cañones giratorios son peligrosos, grumete!
  effect_i18n:
    en: A Gunner equipped with the warband's single Swivel Gun must always form a one-model Henchman group.
      If split from an existing Gunner group to carry it, the Gunner retains the Experience and advances
      already earned by that group.
    es: Un Artillero equipado con el único Cañón Giratorio de la banda debe formar siempre un grupo de
      secuaces de un solo modelo. Si se separa de un grupo de Artilleros existente para portarlo, el Artillero
      conserva la Experiencia y las mejoras ya ganadas por ese grupo.
  applies_to:
    profile_ids:
    - gunners
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.pirates.gunners.swivel-gun-is-dangerous-matey
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, or non-duel context.'
- id: boatswains--expert-riggers
  name: Expert Riggers
  effect: Boatswains are highly trained in using their ropes, as they are the ones who maintain the complex
    network of rigging throughout the ship. They may re-roll failed Initiative tests Leaping over Gaps,
    Jumping Down, and performing a Diving Charge, as well as the normal test for Climbing Up or Down that
    a Rope allows.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 5 Boatswains / Special Rules / Expert Riggers
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/pirates
  name_i18n:
    en: Expert Riggers
    es: Jarcia experta
  effect_i18n:
    en: 'Boatswains are highly trained

      in using their ropes, as they are the ones who

      maintain the complex network of rigging

      throughout the ship. They may re-roll failed

      Initiative tests Leaping over Gaps, Jumping

      Down, and performing a Diving Charge, as well

      as the normal test for Climbing Up or Down that

      a Rope allows.'
    es: Los Contramaestres están altamente entrenados en usar sus cuerdas, pues son quienes mantienen
      la compleja red de jarcia a lo largo del barco. Pueden repetir los chequeos de Iniciativa fallados
      para Saltar Huecos, Saltar desde Altura y realizar una Carga en picado, así como el chequeo normal
      de Trepar Arriba o Abajo que permite una Cuerda.
  applies_to:
    profile_ids:
    - boatswains
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.pirates.boatswains.expert-riggers
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign, shooting, movement, terrain, deployment, or non-duel context.'
