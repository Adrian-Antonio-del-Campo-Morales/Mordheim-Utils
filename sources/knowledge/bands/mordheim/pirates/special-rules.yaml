- id: band--pirate-special-skills-hardy-constitution
  kind: warband_skill
  name: Hardy Constitution
  effect: Many months at sea, and especially many months eating hardtack, have hardened the pirate's body
    to effects that would cause a lesser man to collapse. During the battle, the pirate may ignore any
    Critical Hits on a roll of 5+ (the wound is treated as normal if the roll is successful). If the roll
    is failed, the Critical Hit is worked out as normal.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Pirate Special Skills / Hardy Constitution
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/pirates
  name_i18n:
    en: Hardy Constitution
    es: Constitución recia
  effect_i18n:
    en: 'Many months at sea, and especially many

      months eating hardtack, have hardened the

      pirate''s body to effects that would cause a lesser

      man to collapse. During the battle, the pirate

      may ignore any Critical Hits on a roll of 5+ (the

      wound is treated as normal if the roll is

      successful). If the roll is failed, the Critical Hit is

      worked out as normal.'
    es: Muchos meses en el mar, y especialmente muchos meses comiendo galleta, han endurecido el cuerpo
      del pirata contra efectos que harían colapsar a un hombre menor. Durante la batalla, el pirata puede
      ignorar cualquier Impacto Crítico con una tirada de 5+ (la herida se trata con normalidad si la
      tirada tiene éxito). Si la tirada falla, el Impacto Crítico se resuelve con normalidad.
