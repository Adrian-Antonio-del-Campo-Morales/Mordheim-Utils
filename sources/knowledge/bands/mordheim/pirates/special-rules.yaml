  effect: Any pirate within 6" of the Captain may use his Leadership characteristic when taking any Leadership
    tests.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 1 Pirate Captain / Special Rules / Leader
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/pirates
  name_i18n:
    en: Leader
    es: Líder
  effect_i18n:
    en: 'Any pirate within 6" of the Captain may

      use his Leadership characteristic when taking

      any Leadership tests.'
    es: Cualquier pirata a 6" del Capitán puede usar su característica de Liderazgo cuando realice cualquier
      chequeo de Liderazgo.
  applies_to:
    profile_ids:
    - pirate-captain
  runtime:
    scope: LATER
