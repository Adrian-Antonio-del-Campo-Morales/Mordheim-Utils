  effect: The warband may hire Pit Fighters, Ogres, Norse Shamans and Imperial Assassins, plus entries that explicitly allow
    Marauders of Chaos. Witches and Warlocks may be hired unless the warband contains a warrior with the Mark of Arkhar.
