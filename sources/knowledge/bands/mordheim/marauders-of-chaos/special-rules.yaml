schema_version: 2
band_id: marauders-of-chaos
rules:
- id: marauder-chieftain--leader
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.marauders-of-chaos.marauder-chieftain.leader
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology.'
  name: Leader
  effect: Any Warrior within 6" of the Marauder Chieftain may use his Leadership instead of his own when
    taking Ld tests.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 1 Marauder Chieftain / Special Rules / Leader
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/marauders-of-chaos
  name_i18n:
    en: Leader
    es: Líder
  effect_i18n:
    en: Any Warrior within 6" of the Marauder Chieftain may use his Leadership instead of his own when
      taking Ld tests.
    es: Cualquier Guerrero a 6" del Jefe saqueador puede usar su Liderazgo en lugar del suyo propio al
      realizar chequeos de L.
  applies_to:
    profile_ids:
    - marauder-chieftain
- id: seer--wizard
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.marauders-of-chaos.seer.wizard
      scope: 'NO'
      binding: null
      reason: 'Out of scope: magic.'
  name: Wizard
  effect: A Seer is a Wizard and may use Magic as detailed in the Magic section.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 – 1 Seer / Special Rules / Wizard
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/marauders-of-chaos
  name_i18n:
    en: Wizard
    es: Mago
  effect_i18n:
    en: A Seer is a Wizard and may use Magic as detailed in the Magic section.
    es: Un Vidente es un Mago y puede usar la Magia según se detalla en la sección de Magia.
  applies_to:
    profile_ids:
    - seer
- id: seer--mark-of-chaos
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.marauders-of-chaos.seer.mark-of-chaos
      scope: 'NO'
      binding: null
      reason: 'Out of scope: magic.'
  name: Mark of Chaos
  effect: The Seer gets a Mark of Chaos when hired to determine the kind of magic he uses. He can have
    the Mark of the Serpent, the Mark of the Crow, the Mark of the Eagle, the Mark of Arkhar or the Mark
    of Chaos Undivided.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 – 1 Seer / Special Rules / Mark of Chaos
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/marauders-of-chaos
  name_i18n:
    en: Mark of Chaos
    es: Marca del Caos
  effect_i18n:
    en: The Seer gets a Mark of Chaos when hired to determine the kind of magic he uses. He can have the
      Mark of the Serpent, the Mark of the Crow, the Mark of the Eagle, the Mark of Arkhar or the Mark
      of Chaos Undivided.
    es: El Vidente recibe una Marca del Caos al ser contratado para determinar el tipo de magia que usa.
      Puede tener la Marca de la Serpiente, la Marca del Cuervo, la Marca del Águila, la Marca de Arkhar
      o la Marca del Caos Indiviso.
  applies_to:
    profile_ids:
    - seer
- id: warhounds-of-chaos--natural-weapons
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: profile.natural-attacks
      scope: 'YES'
      binding:
        kind: profile
        id: profile.natural-attacks
  name: Natural Weapons
  effect: Warhounds have no weapons but fight without the normal penalties for being unarmed.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 5 Warhounds of Chaos / Weapons/Armour
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/marauders-of-chaos
  name_i18n:
    en: Natural Weapons
    es: Armas naturales
  effect_i18n:
    en: Warhounds have no weapons but fight without the normal penalties for being unarmed.
    es: Los Sabuesos no tienen armas pero luchan sin las penalizaciones normales por estar desarmados.
  applies_to:
    profile_ids:
    - warhounds-of-chaos
- id: warhounds-of-chaos--animals
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.marauders-of-chaos.warhounds-of-chaos.animals
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign.'
  name: Animals
  effect: Warhounds are animals and thus do not gain experience.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 5 Warhounds of Chaos / Special Rules / Animals
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/marauders-of-chaos
  name_i18n:
    en: Animals
    es: Animales
  effect_i18n:
    en: 'Warhounds are animals and thus do not gain

      experience.'
    es: Los Sabuesos son animales y por tanto no ganan experiencia.
  applies_to:
    profile_ids:
    - warhounds-of-chaos
- id: condemned--inconsistency
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: profile.random-characteristics
      scope: 'YES'
      binding:
        kind: profile
        id: profile.random-characteristics
        parameters:
          characteristics:
          - WS
          - S
          - T
          - A
  name: Inconsistency
  effect: WS, S, T and A are variable. Whenever one of these characteristics is needed, roll its indicated
    die once for that turn.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 – 1 Condemned / Special Rules / Inconsistency
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/marauders-of-chaos
  name_i18n:
    en: Inconsistency
    es: Incoherencia
  effect_i18n:
    en: WS, S, T and A are variable. Whenever one of these characteristics is needed, roll its indicated
      die once for that turn.
    es: HA, F, R y A son variables. Siempre que se necesite una de estas características, tira su dado
      indicado una vez para ese turno.
  applies_to:
    profile_ids:
    - condemned
- id: condemned--fear
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.marauders-of-chaos.condemned.fear
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology.'
  name: Fear
  effect: The Condemned causes Fear.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 – 1 Condemned / Special Rules / Fear
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/marauders-of-chaos
  name_i18n:
    en: Fear
    es: Miedo
  effect_i18n:
    en: The Condemned causes Fear.
    es: El Condenado provoca Miedo.
  applies_to:
    profile_ids:
    - condemned
- id: condemned--variable-experience
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.marauders-of-chaos.condemned.variable-experience
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: no effect applies to the isolated 1v1 duel or legal fighter skill/equipment
        construction.
  name: Experience
  effect: When an advance would increase a variable characteristic, roll its die instead. The player may
    permanently set the characteristic to the result; otherwise it remains variable and the advance is
    lost. These fixed values may exceed normal Marauder maximum characteristics.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 – 1 Condemned / Special Rules / Experience
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/marauders-of-chaos
  name_i18n:
    en: Experience
    es: Experiencia
  effect_i18n:
    en: When an advance would increase a variable characteristic, roll its die instead. The player may
      permanently set the characteristic to the result; otherwise it remains variable and the advance
      is lost. These fixed values may exceed normal Marauder maximum characteristics.
    es: Cuando una mejora aumentaría una característica variable, tira su dado en su lugar. El jugador
      puede fijar permanentemente la característica al resultado; de lo contrario permanece variable y
      la mejora se pierde. Estos valores fijados pueden exceder las características máximas normales de
      los Saqueadores.
  applies_to:
    profile_ids:
    - condemned
- id: condemned--fate
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.marauders-of-chaos.condemned.fate
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: no effect applies to the isolated 1v1 duel or legal fighter skill/equipment
        construction.
  name: Fate
  effect: Once all variable characteristics are permanently fixed, the Condemned may use equipment normally.
    If he reaches 90 Experience while any variable characteristic remains, he becomes a Spawn of Chaos.
    If the warband already contains a Spawn, the Condemned is removed from the warband instead.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 – 1 Condemned / Special Rules / Fate
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/marauders-of-chaos
  name_i18n:
    en: Fate
    es: Destino
  effect_i18n:
    en: Once all variable characteristics are permanently fixed, the Condemned may use equipment normally.
      If he reaches 90 Experience while any variable characteristic remains, he becomes a Spawn of Chaos.
      If the warband already contains a Spawn, the Condemned is removed from the warband instead.
    es: Una vez que todas las características variables están fijadas permanentemente, el Condenado puede
      usar equipo con normalidad. Si alcanza 90 de Experiencia mientras quede alguna característica variable,
      se convierte en un Engendro del Caos. Si la banda ya contiene un Engendro, el Condenado es retirado
      de la banda en su lugar.
  applies_to:
    profile_ids:
    - condemned
- id: spawn-of-chaos--special-attacks
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: mechanic.spawn-special-attacks
      scope: 'YES'
      binding:
        kind: mechanic
        id: mechanic.spawn-special-attacks
  name: Special Attacks
  effect: Roll at the beginning of each Close Combat phase to determine the Spawn's Attacks for that phase.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 1 Spawn of Chaos / Special Rules / Special Attacks
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/marauders-of-chaos
  name_i18n:
    en: Special Attacks
    es: Ataques especiales
  effect_i18n:
    en: Roll at the beginning of each Close Combat phase to determine the Spawn's Attacks for that phase.
    es: Tira al comienzo de cada fase de Combate Cuerpo a Cuerpo para determinar los Ataques del Engendro
      para esa fase.
  applies_to:
    profile_ids:
    - spawn-of-chaos
- id: spawn-of-chaos--fear
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.marauders-of-chaos.spawn-of-chaos.fear
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology.'
  name: Fear
  effect: A Spawn of Chaos causes Fear.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 1 Spawn of Chaos / Special Rules / Fear
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/marauders-of-chaos
  name_i18n:
    en: Fear
    es: Miedo
  effect_i18n:
    en: A Spawn of Chaos causes Fear.
    es: Un Engendro del Caos provoca Miedo.
  applies_to:
    profile_ids:
    - spawn-of-chaos
- id: spawn-of-chaos--special-movement
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.marauders-of-chaos.spawn-of-chaos.special-movement
      scope: 'NO'
      binding: null
      reason: 'Out of scope: movement.'
  name: Special Movement
  effect: The Spawn moves 2D6" straight ahead in each Movement phase after choosing its facing. It does
    not double movement when charging; if this move contacts a model, it counts as charging and engages
    it in close combat.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 1 Spawn of Chaos / Special Rules / Special Movement
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/marauders-of-chaos
  name_i18n:
    en: Special Movement
    es: Movimiento especial
  effect_i18n:
    en: The Spawn moves 2D6" straight ahead in each Movement phase after choosing its facing. It does
      not double movement when charging; if this move contacts a model, it counts as charging and engages
      it in close combat.
    es: El Engendro se mueve 2D6" recto hacia adelante en cada fase de Movimiento tras elegir su orientación.
      No dobla su movimiento al cargar; si este movimiento contacta con una miniatura, cuenta como una
      carga y la involucra en combate cuerpo a cuerpo.
  applies_to:
    profile_ids:
    - spawn-of-chaos
- id: spawn-of-chaos--psychology
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.marauders-of-chaos.spawn-of-chaos.psychology
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology.'
  name: Psychology
  effect: The Spawn automatically passes all Leadership-based tests it is required to take.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 1 Spawn of Chaos / Special Rules / Psychology
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/marauders-of-chaos
  name_i18n:
    en: Psychology
    es: Psicología
  effect_i18n:
    en: The Spawn automatically passes all Leadership-based tests it is required to take.
    es: El Engendro supera automáticamente todos los chequeos basados en Liderazgo que deba realizar.
  applies_to:
    profile_ids:
    - spawn-of-chaos
- id: spawn-of-chaos--no-brain
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.marauders-of-chaos.spawn-of-chaos.no-brain
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign.'
  name: No Brain
  effect: The Spawn never gains Experience.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 1 Spawn of Chaos / Special Rules / No Brain
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/marauders-of-chaos
  name_i18n:
    en: No Brain
    es: Sin cerebro
  effect_i18n:
    en: The Spawn never gains Experience.
    es: El Engendro nunca gana Experiencia.
  applies_to:
    profile_ids:
    - spawn-of-chaos
- id: spawn-of-chaos--large
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.marauders-of-chaos.spawn-of-chaos.large
      scope: 'NO'
      binding: null
      reason: 'Out of scope: shooting.'
  name: Large
  effect: The Spawn counts as a Large Target.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 1 Spawn of Chaos / Special Rules / Large
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/marauders-of-chaos
  name_i18n:
    en: Large
    es: Enorme
  effect_i18n:
    en: The Spawn counts as a Large Target.
    es: El Engendro cuenta como un Objetivo Grande.
  applies_to:
    profile_ids:
    - spawn-of-chaos
- id: band--eye-of-the-gods
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.marauders-of-chaos.band.eye-of-the-gods
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign.'
  name: Eye of the Gods
  effect: After each battle, if the warband leader took part, roll 2D6. If the battle was lost, add +1
    for each Hero taken Out of Action; on 12+ the leader becomes a Spawn of Chaos and loses all previous
    experience, skills, injuries and equipment. If a Spawn is already present, the leader is removed instead.
    If the battle was won, add +1 for each enemy the leader took Out of Action; on 12+ the leader gains
    a Mark of Chaos. Once a leader gains a Mark, Eye of the Gods is no longer rolled for that leader.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: special rules / Eye of the Gods
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/marauders-of-chaos
  name_i18n:
    en: Eye of the Gods
    es: Ojo de los dioses
  effect_i18n:
    en: After each battle, if the warband leader took part, roll 2D6. If the battle was lost, add +1 for
      each Hero taken Out of Action; on 12+ the leader becomes a Spawn of Chaos and loses all previous
      experience, skills, injuries and equipment. If a Spawn is already present, the leader is removed
      instead. If the battle was won, add +1 for each enemy the leader took Out of Action; on 12+ the
      leader gains a Mark of Chaos. Once a leader gains a Mark, Eye of the Gods is no longer rolled for
      that leader.
    es: Tras cada batalla, si el líder de la banda participó, tira 2D6. Si la batalla se perdió, añade
      +1 por cada Héroe puesto Fuera de combate; con 12+ el líder se convierte en un Engendro del Caos
      y pierde toda su experiencia, habilidades, heridas y equipo previos. Si ya hay un Engendro, el líder
      es retirado en su lugar. Si la batalla se ganó, añade +1 por cada enemigo que el líder puso Fuera
      de combate; con 12+ el líder gana una Marca del Caos. Una vez que un líder gana una Marca, el Ojo
      de los dioses ya no se tira para ese líder.
  applies_to:
    band: true
- id: band--hired-swords
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.marauders-of-chaos.band.hired-swords
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: no effect applies to the isolated 1v1 duel or legal fighter skill/equipment
        construction.
  name: Hired Swords
  effect: The warband may hire Pit Fighters, Ogres, Norse Shamans and Imperial Assassins, plus entries
    that explicitly allow Marauders of Chaos. Witches and Warlocks may be hired unless the warband contains
    a warrior with the Mark of Arkhar.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: special rules / Hired Swords
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/marauders-of-chaos
  name_i18n:
    en: Hired Swords
    es: Espadas a sueldo
  effect_i18n:
    en: The warband may hire Pit Fighters, Ogres, Norse Shamans and Imperial Assassins, plus entries that
      explicitly allow Marauders of Chaos. Witches and Warlocks may be hired unless the warband contains
      a warrior with the Mark of Arkhar.
    es: La banda puede contratar Luchadores de fosa, Ogros, Chamanes nórdicos y Asesinos imperiales, más
      entradas que permitan explícitamente Saqueadores del Caos. Brujas y Brujos pueden contratarse a
      menos que la banda contenga un guerrero con la Marca de Arkhar.
  applies_to:
    band: true
- id: band--tribe-choice
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: mechanic.follow-the-darkest-tribe
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: this is an immutable warband-creation choice whose listed consequences concern
        roster limits, campaign rarity, post-game rewards, riding and mounted campaign options.
  name: Follow the Darkest Tribe
  effect: >-
    When the warband is created, choose one tribe: Norse, Kurgan or Hung. Apply only the special
    rules belonging to the chosen tribe.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Follow the Darkest tribe
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/marauders-of-chaos
  name_i18n:
    en: Follow the Darkest Tribe
    es: Sigue a la tribu más oscura
  effect_i18n:
    en: 'When the warband is created, choose one tribe: Norse, Kurgan or Hung. Apply only the special
      rules belonging to the chosen tribe.'
    es: 'Cuando se crea la banda, elige una tribu: Nórdica, Kurgan o Hung. Aplica solo las reglas especiales
      de la tribu elegida.'
  applies_to:
    band: true
- id: band--norse-reavers
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.marauders-of-chaos.band.norse-reavers
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign.'
  name: Norse — Reavers
  effect: Norse warbands gain +1 on rarity rolls during the post-game sequence.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Follow the Darkest tribe / The Norse / Special Rules / Reavers
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/marauders-of-chaos
  name_i18n:
    en: Norse — Reavers
    es: Nórdicos — Saqueadores
  effect_i18n:
    en: Norse warbands gain +1 on rarity rolls during the post-game sequence.
    es: Las bandas nórdicas obtienen +1 en las tiradas de rareza durante la secuencia posterior a la partida.
  applies_to:
    band: true
- id: band--norse-pantheon
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.marauders-of-chaos.band.norse-pantheon
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign.'
  name: Norse — Pantheon
  effect: For a Norse warband, Eye of the Gods normally triggers on 13+ instead of 12+. If the leader
    has Tattooed Body, the threshold is 11+ instead of 10+.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Follow the Darkest tribe / The Norse / Special Rules / Pantheon
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/marauders-of-chaos
  name_i18n:
    en: Norse — Pantheon
    es: Nórdicos — Panteón
  effect_i18n:
    en: For a Norse warband, Eye of the Gods normally triggers on 13+ instead of 12+. If the leader has
      Tattooed Body, the threshold is 11+ instead of 10+.
    es: Para una banda nórdica, el Ojo de los dioses normalmente se activa con 13+ en lugar de 12+. Si
      el líder tiene Cuerpo tatuado, el umbral es 11+ en lugar de 10+.
  applies_to:
    band: true
- id: band--kurgan-pedigree
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.marauders-of-chaos.band.kurgan-pedigree
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign.'
  name: Kurgan — Pedigree
  effect: A Kurgan warband may include any number of Warhounds of Chaos instead of being limited to five.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Follow the Darkest tribe / The Kurgan / Special Rules / Pedigree
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/marauders-of-chaos
  name_i18n:
    en: Kurgan — Pedigree
    es: Kurgan — Pedigrí
  effect_i18n:
