  name: Mark of Shornaal the Serpent
  effect: Enemy models that are not Immune to Psychology cannot attack a marked leader in close combat
    unless they pass a Leadership test on 3D6, discarding the lowest die. On failure, they are hit automatically
    in close combat. Once passed, no further test is required that battle. Lizardmen Cold Blooded cannot
    be used for this test. Seer ritual and item-creation effects are intentionally not modelled here.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Mark of the Dark Gods / Mark of Shornaal the Serpent
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/marauders-of-chaos
  name_i18n:
    en: Mark of Shornaal the Serpent
    es: Marca de Shornaal la Serpiente
  effect_i18n:
    en: Enemy models that are not Immune to Psychology cannot attack a marked leader in close combat unless
      they pass a Leadership test on 3D6, discarding the lowest die. On failure, they are hit automatically
      in close combat. Once passed, no further test is required that battle. Lizardmen Cold Blooded cannot
      be used for this test. Seer ritual and item-creation effects are intentionally not modelled here.
    es: Las miniaturas enemigas que no sean Inmunes a la Psicología no pueden atacar a un líder marcado
      en combate cuerpo a cuerpo a menos que superen un chequeo de Liderazgo con 3D6, descartando el dado
      más bajo. Si fallan, son impactadas automáticamente en combate cuerpo a cuerpo. Una vez superado,
      no se requiere ningún chequeo más esa batalla. La Sangre Fría de los Hombres Lagarto no puede usarse
      para este chequeo. Los efectos de ritual y creación de objetos del Vidente no están modelados intencionadamente
      aquí.
  applies_to:
    band: true
