- id: band--eye-of-the-gods
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.marauders-of-chaos.band.eye-of-the-gods
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign.'
  name: Eye of the Gods
  effect: After each battle, if the warband leader took part, roll 2D6. If the battle was lost, add +1 for each Hero taken
    Out of Action; on 12+ the leader becomes a Spawn of Chaos and loses all previous experience, skills, injuries and equipment.
    If a Spawn is already present, the leader is removed instead. If the battle was won, add +1 for each enemy the leader
    took Out of Action; on 12+ the leader gains a Mark of Chaos. Once a leader gains a Mark, Eye of the Gods is no longer
    rolled for that leader.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: special rules / Eye of the Gods
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/marauders-of-chaos
  name_i18n:
    en: Eye of the Gods
    es: null
  effect_i18n:
    en: After each battle, if the warband leader took part, roll 2D6. If the battle was lost, add +1 for each Hero taken Out
      of Action; on 12+ the leader becomes a Spawn of Chaos and loses all previous experience, skills, injuries and equipment.
      If a Spawn is already present, the leader is removed instead. If the battle was won, add +1 for each enemy the leader
      took Out of Action; on 12+ the leader gains a Mark of Chaos. Once a leader gains a Mark, Eye of the Gods is no longer
      rolled for that leader.
    es: null
  applies_to:
    band: true
