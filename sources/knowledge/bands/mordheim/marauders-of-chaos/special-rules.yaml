- id: band--mark-of-arkhar
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.marauders-of-chaos.band.mark-of-arkhar
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology.'
  name: Mark of Arkhar the Dog
  effect: >-
    A marked leader is subject to Frenzy and spells targeting him fail on 4+. A Seer with this mark
    becomes a Bloodfather: he cannot cast spells; whenever he takes an enemy Out of Action in
    hand-to-hand combat, he may pass a Leadership test to gain +1 WS, S, T or I until the end of the
    battle, with each characteristic increased at most once. A Bloodfather may also take Strength
    skills.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Mark of the Dark Gods / Mark of Arkhar the Dog
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/marauders-of-chaos
  name_i18n:
    en: Mark of Arkhar the Dog
    es: Marca de Arkhar el Perro
  effect_i18n:
    en: 'A marked leader is subject to Frenzy and spells targeting him fail on 4+. A Seer with this mark
      becomes a Bloodfather: he cannot cast spells; whenever he takes an enemy Out of Action in hand-to-hand
      combat, he may pass a Leadership test to gain +1 WS, S, T or I until the end of the battle, with
      each characteristic increased at most once. A Bloodfather may also take Strength skills.'
    es: 'Un líder marcado está sujeto a Frenesí y los hechizos dirigidos contra él fallan con un 4+. Un
      Vidente con esta marca se convierte en un Padre de Sangre: no puede lanzar hechizos; siempre que
      saque del combate a un enemigo en combate cuerpo a cuerpo, puede superar un chequeo de Liderazgo
      para ganar +1 HA, F, R o I hasta el final de la batalla, con cada característica aumentada como
      máximo una vez. Un Padre de Sangre también puede tomar habilidades de Fuerza.'
  applies_to:
    band: true
