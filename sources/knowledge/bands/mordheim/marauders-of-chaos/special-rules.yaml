  name: Mark of Chaos Undivided
  effect: A marked leader allows all warband members within the Leader radius to re-roll failed Leadership
    tests. If the Seer has this mark, the warband may include 0-3 Gors counting toward the normal warband
    maximum; The Lad's Got Talent results for those Gors are re-rolled. Spell details are not modelled
    here.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Mark of the Dark Gods / Mark of Chaos Undivided
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/marauders-of-chaos
  name_i18n:
    en: Mark of Chaos Undivided
    es: Marca del Caos Indiviso
  effect_i18n:
    en: A marked leader allows all warband members within the Leader radius to re-roll failed Leadership
      tests. If the Seer has this mark, the warband may include 0-3 Gors counting toward the normal warband
      maximum; The Lad's Got Talent results for those Gors are re-rolled. Spell details are not modelled
      here.
    es: Un líder marcado permite a todos los miembros de la banda dentro del radio del líder repetir los
      chequeos de Liderazgo fallidos. Si el Vidente tiene esta marca, la banda puede incluir 0-3 Gores
      que cuentan contra el máximo normal de la banda; los resultados de The Lad's Got Talent para esos
      Gores se repiten. Los detalles de hechizos no están modelados aquí.
  applies_to:
    band: true
