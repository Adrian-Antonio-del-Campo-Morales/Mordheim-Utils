      scope: 'NO'
      binding: null
      reason: 'Out of scope: no effect applies to the isolated 1v1 duel or legal fighter skill/equipment construction.'
  name: Fate
  effect: Once all variable characteristics are permanently fixed, the Condemned may use equipment normally. If he reaches
    90 Experience while any variable characteristic remains, he becomes a Spawn of Chaos. If the warband already contains
    a Spawn, the Condemned is removed from the warband instead.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 – 1 Condemned / Special Rules / Fate
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/marauders-of-chaos
  name_i18n:
