  name: Mark of Chaos
  effect: The Seer gets a Mark of Chaos when hired to determine the kind of magic he uses. He can have the Mark of the Serpent,
    the Mark of the Crow, the Mark of the Eagle, the Mark of Arkhar or the Mark of Chaos Undivided.
