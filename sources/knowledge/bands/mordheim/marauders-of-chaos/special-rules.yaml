    es: Una banda kurgan puede incluir cualquier número de Sabuesos del Caos en lugar de estar limitada
      a cinco.
  applies_to:
    band: true
- id: band--kurgan-difficult-customers
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.marauders-of-chaos.band.kurgan-difficult-customers
      scope: 'NO'
      binding: null
      reason: 'Out of scope: campaign.'
  name: Kurgan — Difficult Customers
  effect: A Kurgan warband suffers -1 on rolls to find Rare items, except Great Axes and Barbed Whips.
  source:
    manual: mordheimer.net
    printed_page: 0
