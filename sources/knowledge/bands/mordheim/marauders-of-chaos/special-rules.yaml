  name: Experience
  effect: When an advance would increase a variable characteristic, roll its die instead. The player may permanently set the
    characteristic to the result; otherwise it remains variable and the advance is lost. These fixed values may exceed normal
    Marauder maximum characteristics.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 – 1 Condemned / Special Rules / Experience
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/marauders-of-chaos
  name_i18n:
    en: Experience
    es: null
