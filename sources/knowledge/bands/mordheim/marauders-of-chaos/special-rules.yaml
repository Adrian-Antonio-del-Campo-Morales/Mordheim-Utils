- id: condemned--inconsistency
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: profile.random-characteristics
      scope: 'YES'
      binding:
        kind: profile
        id: profile.random-characteristics
