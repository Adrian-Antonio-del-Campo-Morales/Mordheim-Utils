  name: Virtue of Purity
  effect: A Knight may never voluntarily break from combat unless knocked down. The Knight is immune to
    All Alone and other mundane effects that would cause him to leave combat; magical effects that cause
    fleeing work normally.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: special rules / Virtue of Purity
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/bretonnian-chapel-guard
  name_i18n:
    en: Virtue of Purity
    es: Virtud de Pureza
  effect_i18n:
    en: A Knight may never voluntarily break from combat unless knocked down. The Knight is immune to
      All Alone and other mundane effects that would cause him to leave combat; magical effects that cause
      fleeing work normally.
    es: Un Caballero jamás puede abandonar el combate voluntariamente salvo que esté derribado. El Caballero
      es inmune a Estar Solo y a otros efectos mundanos que le hagan abandonar el combate; los efectos
      mágicos que causan huida funcionan con normalidad.
  applies_to:
    band: true
