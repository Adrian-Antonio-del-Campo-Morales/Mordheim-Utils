    - id: unimplemented.bretonnian-chapel-guard.battle-pilgrims.holy-relics
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology.'
  name: Holy Relics
  effect: >-
    Battle Pilgrims may be given a Holy Relic, regardless of the fact that henchman are not normally
    allowed to take Miscellaneous items. If a Battle Pilgrim owns a Holy Relic, he gains the ability
    Frenzy (Reminder: when frenzied, he is immune to Hatred.) It is possible to give a Holy Relic to
    Battle Pilgrim that is a part of a larger henchman group. If you do not have enough Holy Relics
    for every member of the group, the Pilgrim with the relic will break off and form his own
    individual henchman group.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 5 Battle pilgrims / Special Rules / Holy Relics
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/bretonnian-chapel-guard
  name_i18n:
    en: Holy Relics
    es: Reliquias sagradas
  effect_i18n:
    en: 'Battle Pilgrims may be given a Holy Relic, regardless of the fact that henchman are not normally
      allowed to take Miscellaneous items. If a Battle Pilgrim owns a Holy Relic, he gains the ability
      Frenzy (Reminder: when frenzied, he is immune to Hatred.) It is possible to give a Holy Relic to
      Battle Pilgrim that is a part of a larger henchman group. If you do not have enough Holy Relics
      for every member of the group, the Pilgrim with the relic will break off and form his own individual
      henchman group.'
    es: 'Los Peregrinos de Guerra pueden recibir una Reliquia Sagrada, a pesar de que los secuaces normalmente
      no tienen permitido tomar objetos varios. Si un Peregrino de Guerra posee una Reliquia Sagrada,
      gana la capacidad Frenesí (Recordatorio: cuando está en frenesí, es inmune al Odio). Es posible
      dar una Reliquia Sagrada a un Peregrino de Guerra que forme parte de un grupo de secuaces más grande.
      Si no tienes suficientes Reliquias Sagradas para cada miembro del grupo, el Peregrino con la reliquia
      se separará y formará su propio grupo de secuaces individual.'
  applies_to:
    profile_ids:
    - battle-pilgrims
