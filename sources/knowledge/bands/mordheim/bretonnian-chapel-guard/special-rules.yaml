  name: Chivalry
  effect: No Knight may use missile weapons except Holy Water. Knights will never use drugs or poisons
    and may not learn spells; prayers are allowed.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: special rules / Chivalry
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/bretonnian-chapel-guard
