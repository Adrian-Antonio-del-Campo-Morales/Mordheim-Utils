  name: Holy Relics
  effect: 'Battle Pilgrims may be given a Holy Relic, regardless of the fact that henchman are not normally allowed to take
    Miscellaneous items. If a Battle Pilgrim owns a Holy Relic, he gains the ability Frenzy (Reminder: when frenzied, he is
    immune to Hatred.) It is possible to give a Holy Relic to Battle Pilgrim that is a part of a larger henchman group. If
    you do not have enough Holy Relics for every member of the group, the Pilgrim with the relic will break off and form his
    own individual henchman group.'
