  name: Lord’s Boon
  effect: When a Knight is recruited, one Warhorse, Light Armour, or Heavy Armour may be bought for that
    Knight at half cost. The boon item may not be traded, given to another warrior, or sold; if the Knight
    dies, the item is removed from the warband.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: special rules / Lord’s Boon
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/bretonnian-chapel-guard
  name_i18n:
    en: Lord’s Boon
    es: Don del Señor
  effect_i18n:
    en: When a Knight is recruited, one Warhorse, Light Armour, or Heavy Armour may be bought for that
      Knight at half cost. The boon item may not be traded, given to another warrior, or sold; if the
      Knight dies, the item is removed from the warband.
    es: Cuando se recluta a un Caballero, puede comprarse para él un Corcel de Guerra, Armadura Ligera
      o Armadura Pesada a mitad de precio. El objeto del don no puede comerciarse, darse a otro guerrero
      ni venderse; si el Caballero muere, el objeto se retira de la banda.
  applies_to:
    band: true
