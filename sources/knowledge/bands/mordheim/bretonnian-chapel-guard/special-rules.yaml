  name: Low Caste
  effect: Battle Pilgrims are peasants, and while they are not stupid, there is a glass ceiling to what
    they can attain in Bretonnian society. Low Caste henchmen learn experience and advance as normal,
    but reroll any results of “The Lad's Got Talent”, and may never become heroes.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 5 Battle pilgrims / Special Rules / Low Caste
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/bretonnian-chapel-guard
  name_i18n:
    en: Low Caste
    es: Baja cuna
  effect_i18n:
    en: Battle Pilgrims are peasants, and while they are not stupid, there is a glass ceiling to what
      they can attain in Bretonnian society. Low Caste henchmen learn experience and advance as normal,
      but reroll any results of “The Lad's Got Talent”, and may never become heroes.
    es: Los Peregrinos de Guerra son campesinos y, aunque no son estúpidos, hay un techo de cristal en
      lo que pueden alcanzar en la sociedad bretoniana. Los secuaces de Baja cuna ganan experiencia y
      mejoran con normalidad, pero repiten cualquier resultado de 'El mozo tiene talento' y jamás pueden
      convertirse en héroes.
  applies_to:
