- id: knights-errant--impetuous
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.bretonnian-chapel-guard.knights-errant.impetuous
      scope: LATER
      binding: null
      reason: 'Deferred subsystem: psychology.'
  name: Impetuous
  effect: During each Movement Phase, after declaring charges, a Knight Errant that is not in combat and
    did not charge this turn must charge an opposing standing warrior (not knocked down or stunned) that
    is within range if they are able. Likewise, a Knight Errant that declared a charge against a knocked
    down or stunned opponent will be compelled to charge a viable standing opponent instead. If you wish,
    you may choose to have the Knight take a leadership test (they may use their Leader's Leadership if
    they are within range); if the test is passed, they may move as normal or charge their original target.
    When making a compelled charge, the Knight Errant automatically passes all fear tests or any other
    psychology tests that would prevent them from charging.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 – 3 Knights Errant / Special Rules / Impetuous
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/bretonnian-chapel-guard
  name_i18n:
    en: Impetuous
    es: Impetuoso
  effect_i18n:
    en: 'During each Movement Phase, after declaring charges, a Knight Errant that is not in combat and
      did not charge this turn must charge an opposing standing warrior (not knocked down or stunned)
      that is within range if they are able.

      Likewise, a Knight Errant that declared a charge against a knocked down or stunned opponent will
      be compelled to charge a viable standing opponent instead. If you wish, you may choose to have the
      Knight take a leadership test (they may use their Leader''s Leadership if they are within range);
      if the test is passed, they may move as normal or charge their original target.

      When making a compelled charge, the Knight Errant automatically passes all fear tests or any other
      psychology tests that would prevent them from charging.'
    es: Durante cada fase de Movimiento, tras declarar cargas, un Caballero Novel que no esté en combate
      y no haya cargado este asalto debe cargar contra un guerrero enemigo de pie (no derribado ni aturdido)
      que esté a su alcance, si le es posible. Del mismo modo, un Caballero Novel que haya declarado una
      carga contra un oponente derribado o aturdido se verá compelido a cargar en su lugar contra un oponente
      de pie viable. Si lo deseas, puedes optar por que el Caballero haga un chequeo de liderazgo (pueden
      usar el Liderazgo de su Líder si están a su alcance); si supera el chequeo, puede moverse con normalidad
      o cargar contra su objetivo original. Al realizar una carga compelida, el Caballero Novel supera
      automáticamente todos los chequeos de miedo o cualquier otro chequeo de psicología que le impida
      cargar.
  applies_to:
    profile_ids:
    - knights-errant
- id: squires--knighthood
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: compiler.knighthood
      scope: 'YES'
      binding:
        kind: compiler
        id: compiler.knighthood
  name: Knighthood
  effect: >-
    When a Squire rolls “The Lad's Got Talent”, you may choose one of two options when promoting him
    to a hero: to have him remain a Squire, or to have him become a Knight Errant. (Note: in this
    manner, you may have more than three Knights Errant in your Warband). If you choose to keep him
    a Squire, he may choose two skill lists from following lists: Combat, Academic, Strength, or
    Speed. He retains his normal Squire equipment tables. If you choose to make him a Knight Errant,
    he immediately gains the following rules/bonuses instead of receiving an immediate advancement:
    ‘Knight’, ‘Vain’ and ‘Impetuous’. The new knight may learn Special Skills, in addition to two
    other skill sets, but must immediately switch his equipment to Knight Equipment list. The new
    knight may never use missile weapons.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: henchmen / 0 – 5 Squires / Special Rules / Knighthood
    url: https://mordheimer.net/docs/warbands/grade-1c-warbands/bretonnian-chapel-guard
  name_i18n:
    en: Knighthood
    es: Caballería
  effect_i18n:
    en: 'When a Squire rolls “The Lad''s Got Talent”, you may choose one of two options when promoting
      him to a hero: to have him remain a Squire, or to have him become a Knight Errant. (Note: in this
      manner, you may have more than three Knights Errant in your Warband).

      If you choose to keep him a Squire, he may choose two skill lists from following lists: Combat,
      Academic, Strength, or Speed. He retains his normal Squire equipment tables.

      If you choose to make him a Knight Errant, he immediately gains the following rules/bonuses instead
      of receiving an immediate advancement: ‘Knight’, ‘Vain’ and ‘Impetuous’. The new knight may learn
      Special Skills, in addition to two other skill sets, but must immediately switch his equipment to
      Knight Equipment list. The new knight may never use missile weapons.'
    es: 'Cuando un Escudero saca ''El mozo tiene talento'', puedes elegir una de dos opciones al ascenderlo
      a héroe: que permanezca como Escudero, o que se convierta en Caballero Novel. (Nota: de esta manera
      puedes tener más de tres Caballeros Noveles en tu banda). Si eliges mantenerlo como Escudero, puede
      elegir dos listas de habilidades entre las siguientes: Combate, Académicas, Fuerza o Velocidad.
      Conserva sus tablas de equipo normales de Escudero. Si eliges convertirlo en Caballero Novel, gana
      inmediatamente las siguientes reglas/bonificaciones en lugar de recibir una mejora inmediata: ''Caballero'',
      ''Vanidoso'' e ''Impetuoso''. El nuevo caballero puede aprender Habilidades Especiales, además de
      otros dos conjuntos de habilidades, pero debe cambiar inmediatamente su equipo a la lista de Equipo
      de Caballero. El nuevo caballero jamás puede usar armas de misil.'
  applies_to:
    profile_ids:
    - squires
