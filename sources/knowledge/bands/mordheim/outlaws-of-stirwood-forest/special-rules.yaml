- id: band--bow-discipline
  name: Bow Discipline
  effect: Every warrior may carry only one missile weapon at a time. Every warrior except the Cleric must carry a bow-type
    missile weapon, and crossbows are not permitted even if later skills would otherwise allow them.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/outlaws-of-stirwood-forest
