- id: cleric--disciple-of-sigmar
  name: Disciple of Sigmar
  effect: The Cleric is a follower of Sigmar and may never learn Sorcery or Arcane Lore. The Cleric begins with a Prayer of
    Sigmar, but prayer mechanics are intentionally not modelled in this file.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0 – 1 Cleric / Special Rules / Disciple of Sigmar
    url: https://mordheimer.net/docs/warbands/grade-1b-warbands/outlaws-of-stirwood-forest
