- id: band--skill-mutating-experiment
  kind: warband_skill
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.skaven-of-clan-pristekk-sc.band.mutating-experiment
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: rolling on the Stygian Mutation Chart is an advancement-time interaction with the
        mutation subsystem. Chieftain and Packmaster only.
  name: Mutating Experiment
  effect: >-
    Chieftain & Packmaster only, may be chosen multiple times. This hero may force any of your heroes
    (including himself) immediately to roll on the Stygian Mutation Chart. You may re-roll one of the
    dice involved in the D66 once.
  source:
    manual: broheim.net
    printed_page: 2
    section: Special skills / Mutating Experiment
    url: https://broheim.net/downloads/warbands/supplement/sealedcity/Clan Pristekk.pdf
  name_i18n:
    es: Experimento Mutante
  effect_i18n:
    es: >-
      Solo Jefe y Maestro de Manadas, puede elegirse varias veces. Este héroe puede obligar a cualquiera
      de tus héroes (incluido él mismo) a tirar de inmediato en la Tabla de Mutaciones Estigias. Puedes
      repetir una de las tiradas del D66 una vez.
  applies_to:
    band: true
- id: band--skill-thing-handler
  kind: warband_skill
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.skaven-of-clan-pristekk-sc.band.thing-handler
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: lending Leadership to animal henchmen inside 6" is a Leadership-range interaction.
  name: Thing Handler
  effect: >-
    This Skaven has a beneficial effect on the animals under his care. Any Giant rats, Rat Ogres and
    converted Things may use his Leadership provided he is within 6".
  source:
    manual: broheim.net
    printed_page: 2
    section: Special skills / Thing handler
    url: https://broheim.net/downloads/warbands/supplement/sealedcity/Clan Pristekk.pdf
  name_i18n:
    es: Cuidador de Cosas
  effect_i18n:
    es: >-
      Este Skaven tiene un efecto beneficioso sobre los animales a su cargo. Cualquier Rata Gigante, Ogro
      Rata o Cosa convertida puede usar su Liderazgo siempre que esté a 6" o menos.
  applies_to:
    band: true
