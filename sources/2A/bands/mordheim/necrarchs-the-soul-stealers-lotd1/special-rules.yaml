schema_version: 2
band_id: necrarchs-the-soul-stealers-lotd1
rules:
- id: band--death-of-the-leader
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.necrarchs-the-soul-stealers-lotd1.band.death-of-the-leader
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: leader replacement, warband-wide crumble cascade and hiring rules are campaign
        mechanics outside the duel scope.
  name: Death of the Leader
  effect: >-
    Should the Necrarch perish, the Thrall shall pick up the mantle of Leader and all conferred
    bonuses shall be transferred to him. He may immediately roll on the spell list for one spell.
    You cannot hire another Necrarch, but you may create another Thrall from your current list of
    Acolyte Heroes. They will retain their current stat-line, but shall gain the benefits of being
    undead: Immune to Poison & Psychology, causes Fear & suffers No Pain. Should both Necrarch and
    Thrall be destroyed at once, the evil magics that bind the warband together fade, and all turns
    to dust.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / Death of the Leader
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/necrarchs-the-soul-stealers
  name_i18n:
    es: Muerte del Líder
  effect_i18n:
    es: >-
      Si el Necrarca perece, el Vasallo tomará el manto de Líder y todas las bonificaciones
      concedidas se transferirán a él. Puede tirar inmediatamente en la lista de hechizos por un
      hechizo. No se puede contratar otro Necrarca, pero puedes crear otro Vasallo a partir de tu
      lista actual de Héroes Acólitos. Mantendrán su línea de características actual, pero ganará
      los beneficios de ser no-muerto: inmune al veneno y a la psicología, causa miedo y sufre Sin
      Dolor. Si Necrarca y Vasallo son destruidos a la vez, las mágias malignas que mantienen unida
      a la banda se desvanecen y todo se convierte en polvo.
  applies_to:
    band: true
