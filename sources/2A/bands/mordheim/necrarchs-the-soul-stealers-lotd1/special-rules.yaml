- id: acolyte--vassal
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.necrarchs-the-soul-stealers-lotd1.acolyte.vassal
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: spell-casting relay and casting-failure penalties are magic-subsystem
        interactions.
  name: Vassal
  effect: >-
    The Acolyte has given himself over to his dark lord. At a whim, the Necrarch can see what the
    Acolyte sees, hear what he hears, and even speak through his slave. As long as the Necrarch has
    line of sight to an Acolyte, and the Acolyte is not engaged in hand-to-hand combat, he may use
    it as a casting point for a spell. Upon a critical failure of a casting (rolling double 1's)
    regardless of skills such as Mind Focus or the like, the Acolyte must roll on the Injury table
    and add +1.
  source:
    manual: mordheimer.net
    printed_page: 0
    section: heroes / 0-3 Acolytes / Special Rules / Vassal
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/necrarchs-the-soul-stealers
  name_i18n:
    es: Vasallaje
  effect_i18n:
    es: >-
      El Acólito se ha entregado a su señor oscuro. A su antojo, el Necrarca puede ver lo que el
      Acólito ve, oír lo que oye e incluso hablar a través de su esclavo. Mientras el Necrarca tenga
      línea de visión a un Acólito, y el Acólito no esté trabado en combate cuerpo a cuerpo, puede
      usarlo como punto de lanzamiento de un hechizo. Ante un fallo crítico de lanzamiento (doble
      1), independientemente de habilidades como Enfoque Mental o similares, el Acólito debe tirar
      en la tabla de Heridas sumando +1.
  applies_to:
    profile_ids:
    - acolyte
