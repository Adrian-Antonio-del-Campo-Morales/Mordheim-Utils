  name_i18n:
    es: Ritos de Matatroll
  effect_i18n:
    es: >-
      El Rito de Matarrollear: si un secuaz matatroll deja Fuera de Combate a un enemigo que era
      Grande y comenzó la partida con múltiples heridas, en la fase posterior a la partida el secuaz
      gana experiencia suficiente para alcanzar su siguiente mejora (o, si está al máximo, hasta 16
      puntos), y se trata como si sacara "¡Ese Chico Tiene Talento!". El Rito de MatarDragones: si
      un matatroll deja fuera de combate a un modelo que cumpla todas estas condiciones —monstruo
      grande o gigantesco con escamas (incluyendo, entre otros: Hidra, Dragón, Viverna, Drago de Mar,
      Merwyrm, Turtigón, o cualquiera de sus versiones jóvenes), tiene Cráneo de Hierro y/o 4+
      heridas, y es un PNJ o
      saca herida de muerte—, tras la partida el matatroll puede curtir la piel y obtener gratis una
      Capa de Draco Marino, siempre que no posea ya una; no puede venderla ni dársela a otro
      guerrero. Esta es la excepción a la regla de que un Matatroll no puede llevar armadura.
  applies_to:
    band: true
