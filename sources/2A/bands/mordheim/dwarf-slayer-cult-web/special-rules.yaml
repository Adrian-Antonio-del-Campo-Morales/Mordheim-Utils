        outside the duel scope.
  name: Grudgebearers
  source:
    manual: mordheimer.net
    printed_page: 0
    section: Special Rules / Dwarf Special Rules / Grudgebearers
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/dwarf-slayer-cult
