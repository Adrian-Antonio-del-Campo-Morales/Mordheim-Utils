    effects:
    - id: unimplemented.dreamwalkers-cult-of-morr-fbg.dreamer.choosen-of-morr
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: cross-reference to the band rule; pending equivalence review.
  name: Choosen of Morr
  effect: See the special rules section for more information.
  source:
    manual: mordheim-facebook-group
    printed_page: 0
    section: Heroes / 0-1 Dreamer / Special Rules / Choosen Of Morr
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/dreamwalkers-cult-of-morr
  name_i18n:
    es: Elegido de Morr
  effect_i18n:
    es: Ver la sección de reglas especiales para más información.
  applies_to:
