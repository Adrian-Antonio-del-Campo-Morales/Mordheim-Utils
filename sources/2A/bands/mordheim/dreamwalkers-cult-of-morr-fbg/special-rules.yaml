    es: Presencia Inspiradora
  effect_i18n:
    es: >-
      Cuando un Soñador demuestra ser un líder valiente y un verdadero elegido de Morr, sus
      seguidores seguirán a su soñador hasta la muerte con valentía inquebrantable. Para
      representarlo, los Adoradores de Morr pueden usar el Liderazgo del soñador si están a 12" o
