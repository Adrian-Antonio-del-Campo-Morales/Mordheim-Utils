  name: Blessed by Morr
  effect: >-
    The hero has been blessed by Morr and has his protection against the magic that his enemies cast
    against him. Any spell that could affect the model is nullified with a D6 roll of +4 when
    fighting the undead. Note that if the spell is nullified, it does not affect this model, but it
    does affect any other model as it normally would.
  source:
    manual: mordheim-facebook-group
    printed_page: 0
    section: Special Skills / Blessed by Morr
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/dreamwalkers-cult-of-morr
  name_i18n:
    es: Bendecido por Morr
  effect_i18n:
    es: >-
      El héroe ha sido bendecido por Morr y cuenta con su protección contra la magia que sus
      enemigos lanzan contra él. Cualquier hechizo que pudiera afectar a la miniatura se anula con
      una tirada de D6 de 4+ cuando lucha contra los no muertos. Ten en cuenta que si el hechizo se
      anula, no afecta a esta miniatura, pero sí afecta a cualquier otra como lo haría normalmente.
  applies_to:
    band: true
  kind: warband_skill
- id: band--special-equipment-scythe
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.dreamwalkers-cult-of-morr-fbg.item.scythe
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: two-handed weapon stats pending engine weapon binding.
  name: Scythe
  effect: >-
    Range: Close Combat. Strength: As user +1. Special Rules: Two Handed. Scythes are normally
    implements used in the fields by farmers. It is rare to see them wielded as weapons of warfare.
    However, the scythe also carries with it an image of death. It is the symbol of the Grim Reaper,
    the representation of famine and starvation and disease through the lack of harvested food.
    Priests of Morr, when they need to, may carry a Scythe as a weapon. This is of heavier
    manufacture, and designed to reap warriors rather than wheat. Because the Scythe is unwieldy, it
    must be used with two-hands and cannot be used with another weapon, shield or buckler.
  source:
    manual: mordheim-facebook-group
    printed_page: 0
    section: Special Equipment / Scythe
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/dreamwalkers-cult-of-morr
  name_i18n:
    es: Guadaña
  effect_i18n:
    es: >-
      Alcance: combate cuerpo a cuerpo. Fuerza: la del usuario +1. Reglas especiales: a dos manos.
      Las guadañas son normalmente herramientas usadas en los campos por los granjeros; es raro
      verlas empuñadas como armas de guerra. Sin embargo, la guadaña también lleva consigo una
      imagen de muerte: es el símbolo de la Parca, la representación del hambre, la inanición y la
      enfermedad por la falta de cosecha. Los sacerdotes de Morr, cuando lo necesitan, pueden llevar
      una Guadaña como arma; esta es de fabricación más pesada y diseñada para segar guerreros en
      lugar de trigo. Como la Guadaña es difícil de manejar, debe usarse a dos manos y no puede
      usarse con otra arma, escudo o broquel.
  applies_to:
    band: true
