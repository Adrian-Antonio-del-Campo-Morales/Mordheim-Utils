schema_version: 2
band_id: dreamwalkers-cult-of-morr-fbg
rules:
- id: band--undead-foes-no-fear
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.dreamwalkers-cult-of-morr-fbg.band.undead-foes-no-fear
      scope: LATER
      binding: null
      reason: >-
        Psychology subsystem: not covered by the current engine scope; to be revisited with the
        corresponding engine milestone.
  name: Fearless Against the Undead Servants of Necromancers
  effect: >-
    Such is the faith of the followers of Morr in their god and in his protection, that in order to
    fulfill the destiny that their god entrusts to them, they do not feel any fear when fighting
    both vampires and necromancers and their undead followers, torn from the kingdom of Morr by the
    dark magic of their masters.
  source:
    manual: mordheim-facebook-group
    printed_page: 0
    section: Special Rules / Necromancers and vampires are Morr's ultimate enemies
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/dreamwalkers-cult-of-morr
  name_i18n:
    es: Sin Miedo Ante los Siervos No Muertos de los Nigromantes
  effect_i18n:
    es: >-
      Tal es la fe de los seguidores de Morr en su dios y en su protección que, para cumplir el
      destino que su dios les encomienda, no sienten ningún miedo al luchar contra los vampiros y
      nigromantes y sus seguidores no muertos, arrancados del reino de Morr por la magia oscura de
      sus amos.
  applies_to:
    band: true
- id: band--choosen-of-morr
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.dreamwalkers-cult-of-morr-fbg.band.choosen-of-morr
      scope: LATER
      binding: null
      reason: >-
        Warband-creation ritual and leader-swap subsystem: not covered by the current engine scope.
  name: Choosen of Morr
  effect: >-
    A Priest of Morr must ALWAYS certify that each dreamer is genuine, not a heretic...or worse!
    which means that he must prove through a ritual that the dreamer's dreams truly come from Morr
    and are not the product of necromantic magic or the corruption of chaos. When creating a band of
    dreamwalkers, the Priest of Morr must roll a D6. If you get a +4, you can hire the Dreamer;
    Otherwise, the Priest of Morr rejects him, through the necessary ritual he learns that the
    dreams of that dreamer do not come from Morr. Then the priest himself will take leadership of
    the warband to fulfill Morr's will. (in game effects the priest of Morr will be considered the
    Leader). They will be able to try to find (hire) a new genuine Morr Dreamer again after their
    next battle... paying their costs normally. If the priest finds a genuine dreamer, he will give
    him the leadership of the band. (For game purposes the Dreamer will be considered the leader,
    until he dies, in which case leadership will revert to the priest again. Once a band has a
    genuine Dreamer and he or she dies, they will not be able to hire another one again.)
  source:
    manual: mordheim-facebook-group
    printed_page: 0
    section: Special Rules / Choosen Of Morr
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/dreamwalkers-cult-of-morr
  name_i18n:
    es: Elegido de Morr
  effect_i18n:
    es: >-
      Un Sacerdote de Morr debe SIEMPRE certificar que cada soñador es genuino, ¡y no un hereje... o
      algo peor!, lo que significa que debe demostrar mediante un ritual que los sueños del soñador
      provienen realmente de Morr y no son producto de la magia necromántica o de la corrupción del
      caos. Al crear una banda de caminantes del sueño, el Sacerdote de Morr debe lanzar un D6. Si
      obtienes un 4+, puedes contratar al Soñador; de lo contrario, el Sacerdote de Morr lo rechaza:
      mediante el ritual necesario aprende que los sueños de ese soñador no provienen de Morr.
      Entonces el propio sacerdote tomará el liderazgo de la banda para cumplir la voluntad de Morr
      (a efectos de juego, el sacerdote de Morr será considerado el Líder). Podrán intentar buscar
      (contratar) de nuevo un Soñador de Morr genuino tras su próxima batalla... pagando sus costes
      con normalidad. Si el sacerdote encuentra un soñador genuino, le entregará el liderazgo de la
      banda (a efectos de juego, el Soñador será considerado el líder hasta que muera, en cuyo caso
      el liderazgo revertirá de nuevo al sacerdote. Una vez que una banda ha tenido un Soñador
      genuino y este muere, no podrán contratar otro nunca más).
  applies_to:
    band: true
- id: band--hired-swords
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.dreamwalkers-cult-of-morr-fbg.band.hired-swords
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Hired Swords
  effect: >-
    Dreamwalkers may hire any Hired Swords allowed to a Human Mercenary warband, Witch Hunters and
    Sisters of Sigmar. Of course they can't hire any Hired Sword of a Necromantic or Chaotic nature.
  source:
    manual: mordheim-facebook-group
    printed_page: 0
    section: Special Rules / Hired Swords
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/dreamwalkers-cult-of-morr
  name_i18n:
    es: Espadas a Sueldo
  effect_i18n:
    es: >-
      Los Caminantes del Sueño pueden contratar cualquier Espada a Sueldo permitida a una banda
      humana de Mercenarios, Cazadores de Brujas y Hermanas de Sigmar. Por supuesto, no pueden
      contratar ninguna Espada a Sueldo de naturaleza Necromántica o Caótica.
  applies_to:
    band: true
- id: band--alliances
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.dreamwalkers-cult-of-morr-fbg.band.alliances
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: Alliances
  effect: >-
    In multiplayer games, a Dreamwalkers warband may never forge an alliance with any Warband of a
    Necromantic or Chaotic nature (Undead, Possessed, Skaven, Beastmen, Dark Elves etc.)
  source:
    manual: mordheim-facebook-group
    printed_page: 0
    section: Special Rules / Alliances
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/dreamwalkers-cult-of-morr
  name_i18n:
    es: Alianzas
  effect_i18n:
    es: >-
      En partidas multijugador, una banda de Caminantes del Sueño nunca puede forjar una alianza con
      ninguna banda de naturaleza Necromántica o Caótica (No Muertos, Poseídos, Skaven, Hombres
      Bestia, Elfos Oscuros, etc.).
  applies_to:
    band: true
- id: band--hate-undead
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.dreamwalkers-cult-of-morr-fbg.band.hate-undead
      scope: LATER
      binding: null
      reason: >-
        Psychology subsystem (hatred): not covered by the current engine scope.
  name: Hate Undead
  effect: >-
    Vampires, necromancers, are Morr's ultimate enemies: they steal from his kingdom, violate his
    protection for their own benefit, and flout his authority. All heroes in a Dreamwalkers Warband
    hate all vampires, necromancers and undead.
  source:
    manual: mordheim-facebook-group
    printed_page: 0
    section: Special Rules / Hate Undead
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/dreamwalkers-cult-of-morr
  name_i18n:
    es: Odian a los No Muertos
  effect_i18n:
    es: >-
      Los vampiros y los nigromantes son los enemigos últimos de Morr: roban su reino, violan su
      protección para su propio beneficio y se burlan de su autoridad. Todos los héroes de una banda
      de Caminantes del Sueño odian a todos los vampiros, nigromantes y no muertos.
  applies_to:
    band: true
- id: band--new-skills
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.dreamwalkers-cult-of-morr-fbg.band.new-skills
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: no engine effect assigned yet; pending scope refinement and
        equivalence review before promotion.
  name: New Skills
  effect: >-
    When a hero from a band of Dreamwalkers gains a new skill on an advance roll, they have the same
    restrictions as witch hunters and sisters of sigmar when choosing skills from the skill list
    described in the Mordheim rulebook.
  source:
    manual: mordheim-facebook-group
    printed_page: 0
    section: Special Rules / New skills
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/dreamwalkers-cult-of-morr
  name_i18n:
    es: Nuevas Habilidades
  effect_i18n:
    es: >-
      Cuando un héroe de una banda de Caminantes del Sueño gana una habilidad nueva en una tirada de
      mejora, tiene las mismas restricciones que los Cazadores de Brujas y las Hermanas de Sigmar al
      elegir habilidades de la lista descrita en el libro de Mordheim.
  applies_to:
    band: true
