    - dreamer
- id: dreamer--guiding-dream
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.dreamwalkers-cult-of-morr-fbg.dreamer.guiding-dream
      scope: LATER
      binding: null
      reason: >-
        Pre-battle D6 table with per-battle modifiers: deferred to the scenario/pre-battle engine
        milestone.
  name: Guiding Dream
  effect: >-
    At the beginning of each battle, the Dreamer must roll D6 and consult the Guiding Dream table to
    discover what kind of vision Morr is sending him. 1 - Disturbing Vision: The vision of the
    previous night is clear, but incomplete. That worries the dreamer too much and he feels very
    tired the next day. The dreamer suffers a -1" Movement penalty. 2-3 - Vision of Truth: Morr
    shows the dreamer the combat tactics of his enemy and images of himself defeating his enemy with
    accurate blows to their weak points, which makes it easier for the dreamer to land his blows
    against them. Designate one of your opponent's heroes as a target. The dreamer gets a +1 to hit
    this model. 4-5 - Empowering Vision: Morr sends a vision to the dreamer in which he sees himself
    in the heat of battle fighting against his enemies without ever failing and emerging victorious
    despite his wounds, which imbues the dreamer with great strength. Designate one of your
    opponent's heroes as a target. The dreamer has +1 Strength when fighting this model. 6 -
    Infuriating Vision: Morr shows the dreamer the face of his enemy, this gives the dreamer a clear
    vision of his goal and an inexhaustible determination to finish him off. Designate one of your
    opponent's heroes as a target. The dreamer will have Frenzy against this model. The hero has a
    dream related to a specific action that Morr wants you to perform. These dreams are always
    perfectly clear, but never complete. It will never be explained in them why Morr wants you to
    act that way. In visions you usually appear performing a specific action in a specific place and
    at a specific time, and in some way you will know what the place is called and where it is, as
    well as the exact date you must be there (even if it is not obvious). You have no control over
    the content of the dream, and there are no guarantees that you will survive to fulfill Morr's
    assignment.
  source:
    manual: mordheim-facebook-group
    printed_page: 0
    section: Guiding Dream
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/dreamwalkers-cult-of-morr
  name_i18n:
    es: Sueño Guía
  effect_i18n:
    es: >-
      Al comienzo de cada batalla, el Soñador debe lanzar un D6 y consultar la tabla de Sueño Guía
      para descubrir qué tipo de visión le envía Morr. 1 - Visión Inquietante: la visión de la noche
      anterior es clara, pero incompleta. Eso preocupa demasiado al soñador y al día siguiente se
      siente muy cansado; sufre una penalización de -1" de Movimiento. 2-3 - Visión de Verdad: Morr
      muestra al soñador las tácticas de combate de su enemigo e imágenes de sí mismo derrotándolo
      con golpes certeros a sus puntos débiles, lo que le facilita alcanzarlo. Designa a uno de los
      héroes de tu oponente como objetivo; el soñador obtiene +1 por impactar a esa miniatura. 4-5 -
      Visión de Fortalecimiento: Morr envía al soñador una visión en la que se ve en pleno combate
      luchando contra sus enemigos sin fallar jamás y saliendo victorioso pese a sus heridas, lo que
      le infunde gran fuerza. Designa a uno de los héroes de tu oponente como objetivo; el soñador
      tiene +1 de Fuerza al luchar contra esa miniatura. 6 - Visión Enfurecedora: Morr muestra al
      soñador el rostro de su enemigo, lo que le da una visión clara de su objetivo y una
      determinación inagotable de acabar con él. Designa a uno de los héroes de tu oponente como
      objetivo; el soñador tendrá Frenesí contra esa miniatura. El héroe tiene un sueño relacionado
      con una acción específica que Morr quiere que realices. Estos sueños son siempre perfectamente
      claros, pero nunca completos. Nunca se explicará en ellos por qué Morr quiere que actúes así.
      En las visiones normalmente apareces realizando una acción concreta en un lugar concreto y en
      un momento concreto, y de alguna manera sabrás cómo se llama el lugar y dónde está, así como
      la fecha exacta a la que debes estar allí (aunque no sea obvio). No tienes control sobre el
      contenido del sueño y no hay garantías de que sobrevivas para cumplir el encargo de Morr.
  applies_to:
    profile_ids:
    - dreamer
- id: priest-of-morr--funerary-rites
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.dreamwalkers-cult-of-morr-fbg.priest-of-morr.funerary-rites
      scope: 'NO'
      binding: null
      reason: >-
        Magic-phase content: the Funerary Rites list lives in the KB (lore.funerary-rites); casting
        is out of engine scope.
  name: Funerary Rites
  effect: >-
    Priests of Morr are not wizards by any means, however, they do have numerous Funerary Rites,
    which they may perform. As such, priests of Morr may choose a Funerary Rite, using the rules for
    Magic. See the Magic section for details. Priest Of Morr may choose skills from the Academic and
    Speed skills list, or they may randomly determine a new funerary from the Funerary Rites list.
  source:
    manual: mordheim-facebook-group
    printed_page: 0
    section: Heroes / 1 Priest Of Morr / Special Rules
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/dreamwalkers-cult-of-morr
  name_i18n:
    es: Ritos Funerarios
  effect_i18n:
    es: >-
      Los sacerdotes de Morr no son magos en absoluto; sin embargo, tienen numerosos Ritos
      Funerarios que pueden realizar. Así, los sacerdotes de Morr pueden elegir un Rito Funerario
      usando las reglas de Magia. Ver la sección de Magia para más detalles. El Sacerdote de Morr
      puede elegir habilidades de las listas de Académicas y Velocidad, o determinar al azar un
      nuevo rito funerario de la lista de Ritos Funerarios.
  applies_to:
    profile_ids:
    - priest-of-morr
- id: priest-of-morr--loner
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.dreamwalkers-cult-of-morr-fbg.priest-of-morr.loner
      scope: LATER
      binding: null
      reason: >-
        Psychology subsystem (All Alone immunity): not covered by the current engine scope.
  name: Loner
  effect: >-
    Few people care to spend any length of time in the company of a priest of Morr - even when it is
    their duty to do so. As such, a priest of Morr is used to being alone and probably prefers it
    that way. Priests of Morr do not suffer from the all alone rules.
  source:
    manual: mordheim-facebook-group
    printed_page: 0
    section: Heroes / 1 Priest Of Morr / Special Rules / Loner
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/dreamwalkers-cult-of-morr
  name_i18n:
    es: Solitario
  effect_i18n:
    es: >-
      Poca gente se detiene a pasar tiempo en compañía de un sacerdote de Morr, aunque sea su deber
      hacerlo. Así, un sacerdote de Morr está acostumbrado a estar solo y probablemente lo prefiere
      así. Los sacerdotes de Morr no sufren las reglas de Todo Solo.
  applies_to:
    profile_ids:
    - priest-of-morr
- id: black-guards--silent-guardian
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.dreamwalkers-cult-of-morr-fbg.black-guards.silent-guardian
      scope: LATER
      binding: null
      reason: >-
        Hidden-movement and armour-movement subsystems: not covered by the current engine scope.
  name: Silent Guardian
  effect: >-
    If a Black Guard has been declared Hidden, enemies must take an Initiative test to spot them.
    And never suffer movement penalties for wearing armour.
  source:
    manual: mordheim-facebook-group
    printed_page: 0
    section: Heroes / 0-2 Black Guards Of Morr / Special Rules / Silent Guardian
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/dreamwalkers-cult-of-morr
  name_i18n:
    es: Guardián Silencioso
  effect_i18n:
    es: >-
      Si un Guardia Negro ha sido declarado Oculto, los enemigos deben superar una tirada de
      Iniciativa para descubrirlo. Y nunca sufre penalizaciones de movimiento por llevar armadura.
  applies_to:
    profile_ids:
    - black-guards
- id: black-guards--mount-option
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.dreamwalkers-cult-of-morr-fbg.black-guards.mount-option
      scope: 'NO'
      binding: null
      reason: >-
        Mounted-models optional rule: out of engine scope.
  name: Mount Option
  effect: >-
    If using the optional rules for mounted models or the Blazing Saddles expanded mounted rules,
    the Black Guard may ride a Warhorse, paying its cost. If so increasing their save to +4 while
    mounted.
  source:
    manual: mordheim-facebook-group
    printed_page: 0
    section: Heroes / 0-2 Black Guards Of Morr / Weapons-Armour
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/dreamwalkers-cult-of-morr
  name_i18n:
    es: Opción de Montura
  effect_i18n:
    es: >-
      Si se usan las reglas opcionales para miniaturas montadas o las reglas ampliadas de monturas
      Blazing Saddles, el Guardia Negro puede montar un Caballo de Guerra, pagando su coste. Si lo
      hace, aumenta su salvación a +4 mientras esté montado.
  applies_to:
    profile_ids:
    - black-guards
- id: andanti--estalian-tecnique
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.dreamwalkers-cult-of-morr-fbg.andanti.estalian-tecnique
      scope: LATER
      binding: null
      reason: >-
        Modified parry mechanics: deferred to the close-combat engine milestone.
  name: Estalian Tecnique
  effect: >-
    The Andanti may parry using his rapier and Main Gauche if he can roll under his weapon skill as
    opposed to over his opponent's highest hit roll as per the normal rules.
  source:
    manual: mordheim-facebook-group
    printed_page: 0
    section: Heroes / 0-1 The Andanti / Special Rules / Estalian Tecnique
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/dreamwalkers-cult-of-morr
  name_i18n:
    es: Técnica Estalia
  effect_i18n:
    es: >-
      Los Andanti pueden parar usando su estoque y su Daga de Guardia si consiguen una tirada
      inferior a su Habilidad de Armas, en lugar de superior a la tirada de impacto más alta de su
      oponente según las reglas normales.
  applies_to:
    profile_ids:
    - andanti
- id: andanti--andanti-knowledge
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.dreamwalkers-cult-of-morr-fbg.andanti.andanti-knowledge
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: conditional to-hit bonus pending scope refinement.
  name: Andanti Knowledge
  effect: >-
    Their secret knowledge passed from member to member makes them skilled fighters against
    vampires. When fighting a vampire they get +1 to hit in close combat.
  source:
    manual: mordheim-facebook-group
    printed_page: 0
    section: Heroes / 0-1 The Andanti / Special Rules / Andanti Knowledge
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/dreamwalkers-cult-of-morr
  name_i18n:
    es: Conocimiento Andanti
  effect_i18n:
    es: >-
      Su conocimiento secreto, transmitido de miembro a miembro, los convierte en luchadores
      diestros contra los vampiros. Al luchar contra un vampiro obtienen +1 por impactar en combate
      cuerpo a cuerpo.
  applies_to:
    profile_ids:
    - andanti
- id: deaths-heads--expert-halberdier
  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.dreamwalkers-cult-of-morr-fbg.deaths-heads.expert-halberdier
      scope: 'NO'
      binding: null
      reason: >-
        Provisional classification: weapon-combination exception pending scope refinement.
  name: Expert Halberdier
  effect: >-
    Death's Heads are so skilled with their weapons that they may combat carrying his halberd in one
    hand and shield at the other.
  source:
    manual: mordheim-facebook-group
    printed_page: 0
    section: Henchmen / 0-5 Death's Heads Of Ostermark / Special Rules
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/dreamwalkers-cult-of-morr
  name_i18n:
    es: Alabardero Experto
  effect_i18n:
    es: >-
      Las Cabezas de Muerte son tan diestros con sus armas que pueden combatir llevando su alabarda
      en una mano y el escudo en la otra.
  applies_to:
    profile_ids:
    - deaths-heads
- id: band--special-skill-inspiring-presence
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: selectable
    effects:
    - id: unimplemented.dreamwalkers-cult-of-morr-fbg.special-skill.inspiring-presence
      scope: LATER
      binding: null
      reason: >-
        Leadership-range modification: deferred to the psychology engine milestone.
  name: Inspiring Presence
  effect: >-
    When a Dreamer proves to be a brave leader and truly chosen of Morr, his followers will follow
    their dreamer to death with unwavering courage. To represent this, Morr Worshwishpers can use
    the dreamer's lead if they are 12" away instead of the usual 6". (Only for Dreamer).
  source:
    manual: mordheim-facebook-group
    printed_page: 0
    section: Special Skills / Inspiring Presence
