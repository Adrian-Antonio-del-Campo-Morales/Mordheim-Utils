schema_version: 2
band_id: masters-of-horror-sylv
rules:
- id: band--hired-swords
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.masters-of-horror-sylv.band.hired-swords
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: hiring rules are campaign mechanics outside the duel scope.
  name: Hired Swords
  effect: Masters of Horror warbands may hire the same Hired Swords as an Undead warband.
  source:
    manual: sylvania-supplement
    printed_page: 0
    section: Special Rules / Hired Swords
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/masters-of-horror
  name_i18n:
    es: Espadas a Sueldo
  effect_i18n:
    es: >-
      Las bandas de Maestros del Horror pueden contratar las mismas Espadas a Sueldo que una banda
      de No Muertos.
  applies_to:
    band: true
- id: band--no-promotion
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.masters-of-horror-sylv.band.no-promotion
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: Lads Got Talent promotion is a post-duel/campaign progression mechanic.
  name: No Promotion
  effect: Neither Zombies nor Flesh Constructs may become Heroes through Lads Got Talent.
  source:
    manual: sylvania-supplement
    printed_page: 0
    section: Special Rules / No Promotion
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/masters-of-horror
  name_i18n:
    es: Sin Ascenso
  effect_i18n:
    es: >-
      Ni los Zombis ni los Construidos de Carne pueden convertirse en Héroes mediante el talento de
      los muchachos (Lads Got Talent).
  applies_to:
    band: true
- id: band--wolfman-max-stats
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: band
    effects:
    - id: unimplemented.masters-of-horror-sylv.band.wolfman-max-stats
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: characteristic-increase caps on advancement are outside the duel scope.
  name: Wolfman Max Stats
  effect: >-
    The Wolfman's characteristics may never be increased beyond the following maximums: M 6, WS 4,
    BS 3, S 5, T 4, W 3, I 7, A 4, Ld 8.
  source:
    manual: sylvania-supplement
    printed_page: 0
    section: Special Rules / Wolfman max stats
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/masters-of-horror
  name_i18n:
    es: Máximos del Hombre Lobo
  effect_i18n:
    es: >-
      Las características del Hombre Lobo nunca pueden aumentarse más allá de los siguientes
      máximos: M 6, HA 4, HP 3, F 5, R 4, H 3, I 7, A 4, L 8.
  applies_to:
    band: true
- id: mad-scientist--leader
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.masters-of-horror-sylv.mad-scientist.leader
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: Leader aura (friendly models within 6" use his Leadership) is a
        psychology/rout mechanic outside the duel scope.
  name: Leader
  source:
    manual: sylvania-supplement
    printed_page: 0
    section: 1 Mad Scientist / Special Rules / Leader
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/masters-of-horror
  name_i18n:
    es: Líder
  applies_to:
    profile_ids:
    - mad-scientist
  rule_ref: shared-rule.leader
- id: mad-scientist--immune-to-psychology
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.masters-of-horror-sylv.mad-scientist.immune-to-psychology
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: psychology (Fear, etc.) is not covered by the current engine scope.
  name: Immune to Psychology
  effect: >-
    Mad Scientists are not affected by psychology (such as fear) due to the shattered state of their
    minds.
  source:
    manual: sylvania-supplement
    printed_page: 0
    section: 1 Mad Scientist / Special Rules / Immune to Psychology
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/masters-of-horror
  name_i18n:
    es: Inmune a la Psicología
  effect_i18n:
    es: >-
      Los Científicos Locos no se ven afectados por la psicología (como el miedo) debido al estado
      destrozado de sus mentes.
  applies_to:
    profile_ids:
    - mad-scientist
- id: thrall--cause-fear
