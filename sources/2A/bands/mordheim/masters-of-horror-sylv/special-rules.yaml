- id: flesh-construct--a-bit-unhinged
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.masters-of-horror-sylv.flesh-construct.a-bit-unhinged
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: experience gain with a Leadership gate is a post-duel/ campaign
        progression mechanic.
  name: A Bit Unhinged
  effect: >-
    Flesh Constructs do not gain experience normally. They must make a successful Leadership test in
    order to gain the experience for surviving the game; dead brains can only be expected to learn
    so much, after all.
  source:
    manual: sylvania-supplement
    printed_page: 0
    section: 0-1 Flesh Construct / Special Rules / A Bit Unhinged
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/masters-of-horror
  name_i18n:
    es: Un Poco Desquiciado
  effect_i18n:
    es: >-
      Los Construidos de Carne no ganan experiencia con normalidad. Deben superar una prueba de
      Liderazgo para ganarse la experiencia por sobrevivir a la partida; al fin y al cabo, a los
      cerebros muertos solo se les puede exigir que aprendan cierto.
  applies_to:
    profile_ids:
    - flesh-construct
- id: flesh-construct--its-only-a-flesh-wound
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.masters-of-horror-sylv.flesh-construct.its-only-a-flesh-wound
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: post-battle injury rolls and repair costs are post-duel/campaign
        resolution mechanics.
  name: Its Only a Flesh Wound
  effect: >-
    When a Flesh Construct is taken OOA, roll on the Henchmen Injury table as normal. On a roll of
    1-2, the player is able to repair the damage to the golem for D6x5gc (to represent the time and
    effort it takes to obtain new parts). If the warband is unable to pay for the extra part
    immediately, the Construct is not able to participate in the next battle. It will remain on the
    roster until abandoned or repaired.
  source:
    manual: sylvania-supplement
    printed_page: 0
    section: 0-1 Flesh Construct / Special Rules / Its only a flesh wound
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/masters-of-horror
  name_i18n:
    es: Solo Es un Rasguño
  effect_i18n:
    es: >-
      Cuando un Construido de Carne queda Fuera de Combate, tira en la tabla de heridas de los
      secuaces con normalidad. Con un resultado de 1-2, el jugador puede reparar los daños del gólem
      por D6x5 coronas (para representar el tiempo y esfuerzo que cuesta conseguir las piezas
      nuevas). Si la banda no puede pagar la pieza adicional inmediatamente, el Construido no podrá
      participar en la próxima batalla. Permanecerá en la plantilla hasta que sea abandonado o
      reparado.
  applies_to:
    profile_ids:
    - flesh-construct
- id: flesh-construct--cannot-run
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.masters-of-horror-sylv.flesh-construct.cannot-run
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: movement/restrictions on running are outside the current engine scope.
  name: Cannot Run
  effect: >-
    After being pieced together from various stiffs, ones legs are often, well, stiff. Constructs
    may still charge normally.
  source:
    manual: sylvania-supplement
    printed_page: 0
    section: 0-1 Flesh Construct / Special Rules / Cannot Run
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/masters-of-horror
  name_i18n:
    es: No Puede Correr
  effect_i18n:
    es: >-
      Después de ser ensamblado con varios cadáveres, las piernas suelen estar, bueno, rígidas. Los
      Construidos pueden seguir cargando con normalidad.
  applies_to:
    profile_ids:
    - flesh-construct
- id: the-bitten--transform
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.masters-of-horror-sylv.the-bitten.transform
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: per-turn transformation with Frenzy/Sprint grants and equipment dropping
        is outside the current engine scope.
  name: Transform
  effect: >-
    Roll a D6 each turn and consult the following. Once transformed, the Bitten cast off all
    equipment (save for a dagger) and suffer no penalties for fighting unarmed. 1: Madness: your
    Bitten suffers from Stupidity this turn. If Transformed, they revert to human form. 2 to 5: Act
    as normal 6: Transformed: your Bitten gains Frenzy and Sprint. This lasts until a 1 is rolled.
    Transformed do not roll when in combat.
  source:
    manual: sylvania-supplement
    printed_page: 0
    section: 0-3 The Bitten / Special Rules / Transform
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/masters-of-horror
  name_i18n:
    es: Transformación
  effect_i18n:
    es: >-
      Tira un D6 en cada turno y consulta lo siguiente. Una vez transformados, los Mordidos se
      deshacen de todo su equipo (salvo una daga) y no sufren penalizaciones por luchar desarmados.
      1: Locura: tu Mordido sufre Estupidez este turno. Si estaba Transformado, vuelve a su forma
      humana. 2 a 5: Actúa con normalidad. 6: Transformado: tu Mordido gana Frenesí y Esprintar.
      Esto dura hasta que se saque un 1. Los Transformados no tiran cuando están en combate.
  applies_to:
    profile_ids:
    - the-bitten
- id: mad-scientist--surgeon
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.masters-of-horror-sylv.special.surgeon
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: post-injury rerolls are post-duel/campaign resolution mechanics.
  name: Surgeon
  effect: >-
    The Mad Scientist can attempt to operate upon an injured minion. Reroll one dice of a single
    injury roll. You must accept the second roll.
  source:
    manual: sylvania-supplement
    printed_page: 0
    section: Special Skills / Surgeon
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/masters-of-horror
  name_i18n:
    es: Cirujano
  effect_i18n:
    es: >-
      El Científico Loco puede intentar operar a un secuaz herido. Repite un dado de una única
      tirada de herida. Debes aceptar la segunda tirada.
  applies_to:
    profile_ids:
    - mad-scientist
- id: mad-scientist--alchemist
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.masters-of-horror-sylv.special.alchemist
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: game-start random potion table with out-of-combat addiction effects is
        outside the current engine scope.
  name: Alchemist
  effect: >-
    The Mad Scientist fancies himself an alchemist and brews all sorts of concoctions and potions to
    guzzle down prior to battle. Roll a D6 at game-start and consult the following table. 1: Potion
    of Resilience — Add +1 to Toughness for duration of game. 2: Brew of Strength — Add +1 to
    Strength for duration of game. 3-4: Quicksilver — Add +1 to Movement for duration of game. 5:
    Backley's Brew — Remove -1 from both Strength and Initiative until a Toughness test is passed.
    6: Aberrantius Vigortia — Adds +1 to both Strength and Toughness. Highly addictive. Roll D6
    after battle. On 5+, Scientist becomes addicted and will not engage in any other activity during
    a game until he has had his Aberrantius Vigortia potion. He will stand and brew potions until a
    6 is rolled.
