  name_i18n:
    es: Causa Miedo
  effect_i18n:
    es: Los vampiros son criaturas no muertas aterradoras y por tanto causan Miedo.
  applies_to:
    profile_ids:
    - thrall
- id: thrall--immune-to-psychology
  runtime:
    scope: LATER
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.masters-of-horror-sylv.thrall.immune-to-psychology
      scope: LATER
      binding: null
      reason: >-
        Deferred subsystem: psychology (Fear, never leaving combat) is not covered by the current
        engine scope.
  name: Immune to Psychology
  effect: Vampires are not affected by psychology (such as fear) and never leave combat.
  source:
    manual: sylvania-supplement
    printed_page: 0
    section: 0-1 Thrall / Special Rules / Immune to Psychology
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/masters-of-horror
  name_i18n:
    es: Inmune a la Psicología
  effect_i18n:
    es: >-
      Los vampiros no se ven afectados por la psicología (como el miedo) y nunca abandonan el
      combate.
  applies_to:
    profile_ids:
    - thrall
- id: thrall--immune-to-poison
  runtime:
    scope: 'YES'
    implemented: 'YES'
    grant: profile
    effects:
    - id: trait.poison-immune
      scope: 'YES'
      binding:
        kind: trait
        id: trait.poison-immune
        parameters:
          value: true
  name: Immune to Poison
  effect: Vampires are not affected by any poison.
  source:
    manual: sylvania-supplement
    printed_page: 0
    section: 0-1 Thrall / Special Rules / Immune to Poison
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/masters-of-horror
  name_i18n:
    es: Inmune al Veneno
  effect_i18n:
    es: Los vampiros no se ven afectados por ningún veneno.
  applies_to:
