        Deferred subsystem: injury-table result conversion is a post-duel/campaign resolution
        mechanic.
  name: No Pain
  effect: Vampires treat a Stunned result on the Injury chart as Knocked Down.
  source:
    manual: sylvania-supplement
    printed_page: 0
    section: 0-1 Thrall / Special Rules / No Pain
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/masters-of-horror
  name_i18n:
    es: Sin Dolor
  effect_i18n:
    es: Los vampiros tratan un resultado Aturdido de la tabla de heridas como Derribado.
  applies_to:
    profile_ids:
    - thrall
