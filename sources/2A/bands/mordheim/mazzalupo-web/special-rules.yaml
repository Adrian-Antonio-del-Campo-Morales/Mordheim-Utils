  runtime:
    scope: 'NO'
    implemented: 'NO'
    grant: profile
    effects:
    - id: unimplemented.mazzalupo-web.black-sheep.animals
      scope: 'NO'
      binding: null
      reason: >-
        Out of scope: the Animals classification (no experience, no equipment) is a roster/campaign
        mechanic outside the duel scope.
  name: Animals
  source:
    manual: mordheimer.net
    printed_page: 0
    section: 0-5 Black Sheep / Special Rules / Animals
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/mazzalupo
  name_i18n:
    es: Animales
  applies_to:
    profile_ids:
    - black-sheep
  rule_ref: shared-rule.animal
- id: black-sheep--butchers-meat
  runtime:
    scope: 'NO'
    implemented: 'NO'
