        los Peregrinos imprimen 10 co para el mismo objeto; la cifra de 15 co es una errata interna del PDF
        original de LotD #5 (ambos precios verificados literalmente en la p. 10 de LOD5.pdf).
    structure:
      repeats_entry: true
