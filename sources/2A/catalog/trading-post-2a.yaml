items:
- id: campaign.trading-post.bearcloak
  item_id: bearcloak
  price:
    base_gc: 10
  availability:
    kind: common
  restrictions:
  - type: warband_only
    band_ids:
    - mazzalupo-web
  - type: condition
    note: Special. To acquire a bearcloak, a Sheepherder must pay 10 gc (to represent expense of taking
      part to the hunt). In addition, the Sheepherder must roll equal to or under his Strength on a D6.
      If successful, the Sheepherder finds and slays the bear and can wear its cloak as a mark of skill
      and prowess. Sheepherders may buy bearcloaks when starting their warband without making a test for
      availability.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Special Equipment / Bearcloak
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/mazzalupo
