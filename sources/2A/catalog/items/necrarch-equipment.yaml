schema_version: 2
ruleset: mordheim
items:
- id: staff_of_damnation
  kind: combat-equipment
  name: Staff of Damnation
  name_i18n:
    es: Bastón de la Perdición
  effect: >-
    The preferred weapon of these ancient mages, the Staff of Damnation allows them to bear deadly
    magic against their foes. Range: Close Combat. Strength: As user. Special Rules: Two-Handed,
    Magic-well. Two-Handed: As the Staff of Damnation requires two hands to wield, a model equipped
    with it may not use a shield, buckler or secondary weapon in close combat. If the model has a
    shield it will still get a +1 bonus to its armour save against shooting. Magic-Well: A Necrarch
    Vampire may cast a spell into the Staff of Damnation during his Magic phase instead of casting
    as normal. Upon a successful casting, the spell is stored within the staff. The spell may be
    released during a later shooting phase in lieu of casting another spell.
  effect_i18n:
    es: >-
      El arma predilecta de estos magos ancestrales, el Bastón de la Perdición les permite descargar
      magia letal contra sus enemigos. Alcance: combate cuerpo a cuerpo. Fuerza: como el usuario.
      Reglas Especiales: A Dos Manos, Pozo de magia. A Dos Manos: Como el Bastón de la Perdición
      requiere dos manos para empuñarlo, una miniatura equipada con él no puede usar escudo, broquel
      ni arma secundaria en combate cuerpo a cuerpo. Si la miniatura lleva escudo, sigue recibiendo
      el bonificador de +1 a su salvación por armadura contra disparos. Pozo de Magia: Un Vampiro
      Necrarca puede lanzar un hechizo dentro del Bastón de la Perdición durante su fase de Magia en
      lugar de lanzarlo con normalidad. Si el lanzamiento tiene éxito, el hechizo queda almacenado
      en el bastón. El hechizo puede liberarse en una fase de Disparo posterior en lugar de lanzar
      otro hechizo.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Special Equipment / Staff of Damnation
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/necrarchs-the-soul-stealers
  combat_status: out_of_scope
