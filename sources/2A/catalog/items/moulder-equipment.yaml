schema_version: 2
ruleset: mordheim
status: staging
items:
- id: beastwhip
  kind: close-combat-weapon
  name: Beastwhip
  name_i18n:
    es: Látigo de Bestias
  effect: >-
    These warpstone-studded corded leather whips are an essential tool for Clan Moulder, nothing
    motivates living creatures quite like the sting of the lash. Range: Close Combat. Strength: As
    user. Save modifier: -. Special rules: Cannot be parried, Whipcrack, Cruel Barbs. Cannot be
    parried: the Beastwhip coils and twists like a serpent, attempts to parry its attacks are
    futile. A model attacked with a Beastwhip may not make parries with weapons or bucklers.
    Whipcrack: when the wielder charges they gain +1A that turn. This bonus is added after any other
    modifications. When charged they gain +1A only against the charger, striking first. If
    simultaneously charged by 2+ opponents, they still only gain +1A. If dual-wielding, only one
    whip gains the bonus from Whipcrack. Cruel Barbs: Models equipped with a Beastwhip gain a +1
    bonus to their roll when making Difficulty checks during Goading attempts. Note this bonus
    applies only once in each attempt even if the model is armed with two Beastwhips.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Special Equipment / Beastwhip
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/skaven-of-clan-moulder
  rarity: 8
  availability_note: Clan Moulder only. 25 Warp Tokens.
  combat_status: out_of_scope
  effect_i18n:
    es: >-
      Estos látigos de cuero trenzado tachonados de piedra bruja son una herramienta esencial para
      el Clan Moulder; nada motiva a las criaturas vivientes como el latigazo del azote. Alcance:
      combate cuerpo a cuerpo. Fuerza: como el usuario. Modificador de salvación: -. Reglas
      especiales: No puede pararse, Latigazo, Púas Crueles. No puede pararse: el Látigo de Bestias
      se enrosca y retuerce como una serpiente; los intentos de parar sus ataques son inútiles. Una
      miniatura atacada con un Látigo de Bestias no puede hacer paradas con armas ni broqueles.
      Latigazo: cuando el portador carga, gana +1A ese turno. Este bonificador se añade después de
      cualquier otra modificación. Cuando es cargado, gana +1A solo contra el cargador, golpeando
      primero. Si es cargado simultáneamente por 2+ oponentes, aun así solo gana +1A. Si empuña dos,
      solo un látigo gana el bonificador de Latigazo. Púas Crueles: los modelos equipados con un
      Látigo de Bestias obtienen +1 a su tirada al hacer pruebas de Dificultad durante intentos de
      Azuzamiento. Ten en cuenta que este bonificador se aplica solo una vez en cada intento,
      incluso si el modelo está armado con dos Látigos de Bestias.
- id: thingcatcher
  kind: close-combat-weapon
  name: Thingcatcher
  name_i18n:
    es: Cazacosas
  effect: >-
    The spiked jaws of the Thingcatcher can subdue even the most stubborn or monstrous of beasts.
    Range: Close Combat. Strength: As user +1. Save modifier: -. Special rules: Two-handed, Iron
    Grip. Two-handed: a model armed with a Thingcatcher may not use a shield, buckler, or additional
    weapon in close combat. If the model has a shield it still gains a +1 bonus to armour save
    against shooting. Iron Grip: models equipped with a Thingcatcher can force beasts to reroll a
    failed Stupidity test resulting from a failed Goading attempt.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Special Equipment / Thingcatcher
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/skaven-of-clan-moulder
  rarity: 9
  availability_note: Clan Moulder only. 20 Warp Tokens.
  combat_status: out_of_scope
  effect_i18n:
    es: >-
      Las mandíbulas con púas del Cazacosas pueden someter incluso a las bestias más tercas o
      monstruosas. Alcance: combate cuerpo a cuerpo. Fuerza: como el usuario +1. Modificador de
      salvación: -. Reglas especiales: A Dos Manos, Garra de Hierro. A Dos Manos: una miniatura
      armada con un Cazacosas no puede usar escudo, broquel ni arma adicional en combate cuerpo a
      cuerpo. Si el modelo lleva escudo, sigue obteniendo el bonificador de +1 a la salvación por
      armadura contra disparos. Garra de Hierro: los modelos equipados con un Cazacosas pueden
      obligar a las bestias a repetir una prueba de Estupidez fallida como resultado de un intento
      de Azuzamiento fallido.
- id: wolf_rat_mount
  kind: mount
  name: Wolf Rat Mount
  name_i18n:
    es: Montura de Rata Lobo
  effect: >-
    Though it is extremely challenging, a few Packmasters have developed methods to break the will
    of a Wolf Rat sufficiently for them to be ridden. While not as tough as a Great Pox Rat or Brood
    Horror, many Skaven leaders value the speed of a Wolf Rat mount if the incompetence of
    underlings makes a "tactical withdrawal" necessary. Profile: M9 WS3 BS0 S4 T3 W1 I4 A1 Ld4.
    Poisoned Attack: the mouths of Wolf Rats fester with any number of poxes and corrosive agents.
    Any attacks made by a Wolf Rat Mount are considered to be Strength 4, but do not modify armour
    saves.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Special Equipment / Wolf Rat Mount
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/skaven-of-clan-moulder
  rarity: 11
  availability_note: Clan Moulder only. 90 Warp Tokens.
  combat_status: out_of_scope
  effect_i18n:
    es: >-
      Aunque es sumamente difícil, algunos Maestros de Manada han desarrollado métodos para quebrar
      la voluntad de una Rata Lobo lo suficiente como para ser montada. Aunque no es tan resistente
      como una Gran Rata de Peste o un Horror de Cría, muchos líderes skaven valoran la velocidad de
      una montura de Rata Lobo cuando la incompetencia de los subordinados hace necesaria una
      «retirada táctica». Perfil: M9 HA3 HP0 F4 R3 H1 I4 A1 L4. Ataque Envenenado: las bocas de las
      Ratas Lobo están podridas por todo tipo de viruelas y agentes corrosivos. Cualquier ataque
      realizado por una Montura de Rata Lobo se considera de Fuerza 4, pero no modifica las
      salvaciones por armadura.
