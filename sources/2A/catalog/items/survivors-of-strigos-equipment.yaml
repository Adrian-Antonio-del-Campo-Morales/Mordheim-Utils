schema_version: 2
ruleset: mordheim
status: staging
items:
- id: chest_talon
  kind: combat-equipment
  name: Chest Talon
  name_i18n:
    es: Garra de Pecho
  effect: >-
    Designed for the Domnu, these pick-like great weapons are ideal for pinning von Carstein
    blood-thirsters. Range: Close Combat. Strength: As User +1. Special Rules: Two-Handed,
    Heart-Pierce.
  effect_i18n:
    es: >-
      Diseñadas para el Domnu, estas armas a dos manos en forma de pico son ideales para rematar a
      los sedientos de sangre von Carstein. Alcance: combate cuerpo a cuerpo. Fuerza: como el
      usuario +1. Reglas Especiales: A Dos Manos, Perforacorazones.
  source_refs:
  - manual: mordheimer.net (Sylvania Supplement)
    printed_page: 0
    section: Special Equipment / Chest Talon
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/survivors-of-strigos
  rarity: null
  availability_note: Strigany only. Cost 15 gc.
  combat_status: out_of_scope
  special_rules:
  - id: two-handed
    name: Two-Handed
    effect: >-
      As the Chest Talon requires two hands to wield, a model equipped with it may not use a shield,
      buckler or secondary weapon in close combat. If the model has a shield he still gets a +1
      bonus to his armour save against shooting.
    effect_i18n:
      es: >-
        Como la Garra de Pecho requiere dos manos para empuñarla, una miniatura equipada con ella no
        puede usar escudo, broquel ni arma secundaria en combate cuerpo a cuerpo. Si la miniatura
        lleva escudo, sigue recibiendo el bonificador de +1 a su salvación por armadura contra
        disparos.
    name_i18n:
      es: A Dos Manos
  - id: heart-pierce
    name: Heart-Pierce
    effect: >-
      Such is the destructive design of the weapon that it adds +1 to wound against a
      blood-thirster.
    effect_i18n:
      es: Tal es el diseño destructivo del arma que suma +1 por herir contra un sediento de sangre.
    name_i18n:
      es: Atraviesa-Corazones
- id: black_gold_wristbands
  kind: miscellaneous
  name: Black Gold Wristbands
  name_i18n:
    es: Brazaletes de Oro Negro
  effect: >-
    Created with dark magic of ages past, the wristbands enable the wearer to better protect himself
    from missile fire. Quickened: a model wearing Black Gold Wristbands gains a 6+ save against all
    missile-fire, including magical. This ability will stack with the Dodge skill.
  effect_i18n:
    es: >-
      Creados con la magia oscura de épocas pasadas, los brazaletes permiten a quien los lleva
      protegerse mejor del fuego de misiles. Acelerado: una miniatura que lleve Brazaletes de Oro
      Negro obtiene una salvación de 6+ contra todo fuego de misiles, incluido el mágico. Esta
      habilidad se acumula con la habilidad de Esquiva.
  source_refs:
  - manual: mordheimer.net (Sylvania Supplement)
    printed_page: 0
    section: Special Equipment / Black Gold Wristbands
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/survivors-of-strigos
  rarity: 10
  availability_note: Cost 35 + 2D6 gc.
  combat_status: out_of_scope
- id: ring_of_strigos
  kind: miscellaneous
  name: Ring of Strigos
  name_i18n:
    es: Anillo de Strigos
  effect: >-
    Forged with the blood of Necrarchs, these rings once adorned the fingers of Strigos' nobility.
    Arcane Barrier: a model wearing a Ring of Strigos gains a 6+ save versus all spells that they
    are a target of, or find themselves affected by.
  effect_i18n:
    es: >-
      Forjados con la sangre de los Necrarcas, estos anillos adornaron antaño los dedos de la
      nobleza de Strigos. Barrera Arcana: una miniatura que lleve un Anillo de Strigos obtiene una
      salvación de 6+ contra todos los hechizos de los que sea objetivo o se vea afectada.
  source_refs:
  - manual: mordheimer.net (Sylvania Supplement)
    printed_page: 0
    section: Special Equipment / Ring of Strigos
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/survivors-of-strigos
  rarity: 9
  availability_note: Cost 20 + D6 gc.
  combat_status: out_of_scope
- id: cursed_book
  kind: miscellaneous
  name: Cursed Book
  name_i18n:
    es: Libro Maldito
  effect: >-
    Written by spiteful Seers, the Cursed Book offers its bearer some protection against those that
    would do him harm. Cursed Aura: a model bearing the Cursed Book causes all enemy models within
    2" to suffer a -1 penalty to hit in close combat.
  effect_i18n:
    es: >-
      Escrito por Videntes rencorosos, el Libro Maldito ofrece a su portador cierta protección
      contra quienes quieran dañarlo. Aura Maldita: una miniatura que porte el Libro Maldito hace
      que todas las miniaturas enemigas a 2" sufran una penalización de -1 por impactar en combate
      cuerpo a cuerpo.
  source_refs:
  - manual: mordheimer.net (Sylvania Supplement)
    printed_page: 0
    section: Special Equipment / Cursed Book
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/survivors-of-strigos
  rarity: 11
  availability_note: Cost 50 + 3D6 gc.
  combat_status: out_of_scope
