items:
- id: bearcloak
  kind: miscellaneous
  name: Bearcloak
  name_i18n:
    es: Capa de Oso
  effect: >-
    A model wearing a bearcloak will gain +1 to their armour saves against all shooting attacks.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Special Equipment / Bearcloak
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/mazzalupo
  rarity: null
  availability_note: Special. To acquire a bearcloak, a Sheepherder must pay 10 gc (to represent expense
    of taking part to the hunt). In addition, the Sheepherder must roll equal to or under his Strength
    on a D6. If successful, the Sheepherder finds and slays the bear and can wear its cloak as a mark
    of skill and prowess. Sheepherders may buy bearcloaks when starting their warband without making a
    test for availability.
  availability_note_i18n:
    es: Especial. Para conseguir una capa de oso, un Pastor debe pagar 10 coronas (en concepto de los
      gastos de participar en la caza). Además, el Pastor debe sacar igual o menos que su Fuerza en 1D6.
      Si lo logra, el Pastor encuentra y mata al oso y puede vestir su capa como muestra de habilidad
      y destreza. Los Pastores pueden comprar capas de oso al crear su banda sin hacer la prueba de consecución.
  combat_status: out_of_scope
  effect_i18n:
    es: >-
      Una miniatura que lleve una capa de oso gana +1 a sus salvaciones por armadura contra todos
      los ataques de disparo.
