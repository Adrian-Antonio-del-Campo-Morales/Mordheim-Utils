schema_version: 2
ruleset: mordheim
status: staging
items:
- id: darksteel_blade
  kind: material-or-upgrade
  name: Darksteel Blade
  name_i18n:
    es: Hoja de Acero Oscuro
  effect: >-
    Darksteel weapons are forged in the city of Hag Graef, the Dark Crag. They are fashioned from
    black steel, a rare form of steel found deep within the mountains around the city and are forged
    using an ancient technique known only to the Dark Elves. Weapons with Darksteel blades have
    wicked protrusions and serrated edges, which inflict serious damage on an opponent. Any Druchii
    hero can use a close-combat weapon with a Darksteel blade. Getting it, however, is not that
    easy. Range: Close combat. Strength: As user. Special Rules: Critical damage, Wicked edge.
  effect_i18n:
    es: >-
      Las armas de Acero Oscuro se forjan en la ciudad de Hag Graef, el Risco Oscuro. Están forjadas
      con acero negro, una forma rara de acero que se encuentra en las profundidades de las montañas
      que rodean la ciudad, empleando una técnica ancestral conocida únicamente por los Elfos
      Oscuros. Las armas con hojas de Acero Oscuro tienen protuberancias afiladas y bordes dentados,
      que infligen graves daños al oponente. Cualquier héroe Druchii puede usar un arma de combate
      cuerpo a cuerpo con hoja de Acero Oscuro. Conseguirla, sin embargo, no es tarea fácil.
      Alcance: combate cuerpo a cuerpo. Fuerza: como el usuario. Reglas Especiales: Daño crítico,
      Filo cruel.
  source_refs:
  - manual: mordheimer.net (Mordheim Index Catalog)
    printed_page: 0
    section: Special Equipment / Darksteel Blade
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/druchii
  rarity: 9
  availability_note: Cost 3 x base weapon price.
  combat_status: out_of_scope
  special_rules:
  - id: critical-damage
    name: Critical Damage
    effect: >-
      Darksteel weapons inflict serious damage on their opponents. When rolling on the critical hit
      chart, a Darksteel weapon will add +1 to the result.
    effect_i18n:
      es: >-
        Las armas de Acero Oscuro infligen graves daños a sus oponentes. Al tirar en la tabla de
        impactos críticos, un arma de Acero Oscuro suma +1 al resultado.
    name_i18n:
      es: Daño Crítico
  - id: wicked-edge
    name: Wicked Edge
    effect: >-
      Darksteel weapons are set with sharp protrusions and serrated edges which inflict serious
      damage on an opponent. A roll of 2-4 on the injury table is a stunned result.
    effect_i18n:
      es: >-
        Las armas de Acero Oscuro están tachonadas de protuberancias afiladas y bordes dentados que
        infligen graves daños al oponente. Un resultado de 2-4 en la tabla de heridas es un
        resultado de aturdido.
    name_i18n:
      es: Filo Maléfico
