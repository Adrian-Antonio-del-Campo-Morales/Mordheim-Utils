schema_version: 2
ruleset: mordheim
items:
- id: silver_tip_stake
  kind: combat-equipment
  name: Silver-Tip Stake
  name_i18n:
    es: Estaca de Punta de Plata
  effect: >-
    Such is the destructive power of silver over a Vampire's form that the silver-tip stake adds +1
    to the injury roll when it causes a wound. Range: Close Combat. Strength: As User. Special
    Rules: Heart-seeker. Heart-Seeker: The silver-tip stake adds +1 to the injury roll when it
    causes a wound.
  effect_i18n:
    es: >-
      Tal es el poder destructivo de la plata sobre la forma de un Vampiro que la estaca de punta de
      plata suma +1 a la tirada de heridas cuando causa una herida. Alcance: combate cuerpo a
      cuerpo. Fuerza: como el usuario. Reglas Especiales: Buscacorazones. Busca-Corazones: La estaca
      de punta de plata suma +1 a la tirada de heridas cuando causa una herida.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Special Equipment / Silver-tip Stake
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/vampire-hunters-of-sylvania
  combat_status: out_of_scope
- id: throat_guard
  kind: armour
  name: Throat Guard
  name_i18n:
    es: Protector de Garganta
  effect: >-
    As the vampires of Sylvania rely upon hapless human victims to sate their thirst for blood, it
    is only prudent to protect vulnerable areas. As such, the Throat Guard allows a Slayer the peace
    of mind knowing that their blood shall remain in their veins. All injury rolls caused by a
    Vampire have a special 6+ save while this equipment is worn. This save is not modified by
    strength, but can be bypassed by criticals that ignore armour. It does not add any armour-save
    modifiers, and can be worn on its own, or combined with light or heavy armour. Life Saver: All
    injury rolls caused by a Vampire have a special 6+ save while this equipment is worn. The save
    is not modified by strength, but can be bypassed by criticals that ignore armour. It adds no
    armour-save modifiers.
  effect_i18n:
    es: >-
      Como los vampiros de Sylvania dependen de desdichadas víctimas humanas para saciar su sed de
      sangre, es prudente proteger las zonas vulnerables. Así, el Protector de Garganta permite al
      Slayer tener la tranquilidad de saber que su sangre permanecerá en sus venas. Todas las
      tiradas de heridas causadas por un Vampiro tienen una salvación especial de 6+ mientras se
      lleve este equipo. Esta salvación no se ve modificada por la Fuerza, pero puede evitarse con
      críticos que ignoren la armadura. No añade ningún modificador a la salvación por armadura, y
      puede llevarse solo o combinado con armadura ligera o pesada. Salvavidas: Todas las tiradas de
      heridas causadas por un Vampiro tienen una salvación especial de 6+ mientras se lleve este
      equipo. La salvación no se ve modificada por la Fuerza, pero puede evitarse con críticos que
      ignoren la armadura. No añade ningún modificador a la salvación por armadura.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Special Equipment / Throat Guard
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/vampire-hunters-of-sylvania
  combat_status: out_of_scope
