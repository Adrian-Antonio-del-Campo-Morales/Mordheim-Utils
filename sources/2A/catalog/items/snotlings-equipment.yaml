schema_version: 2
ruleset: mordheim
items:
- id: small_pebble
  kind: ranged-weapon
  name: Small Pebble
  name_i18n:
    es: Piedrecita
  effect: >-
    Range: 6". Strength: As user. Special Rule: Thrown weapon, +1 Enemy Armour Piercing, Easy to
    Find. Thrown Weapon: Models using pebbles do not suffer penalties for range or moving as these
    weapons are perfectly balanced for throwing. They cannot be used in close combat. +1 Enemy
    Armour Piercing: Any model wounded with a Pebble gains +1 to its armour save. Easy to Find:
    Finding a Pebble is easy! They are free for Snotling warband members. If lost, they can easily
    be found for no cost. Also, Pebbles do NOT count towards the maximum number of missile weapons a
    warrior can carry.
  effect_i18n:
    es: >-
      Alcance: 6". Fuerza: como el usuario. Regla Especial: Arma arrojadiza, +1 Perforación de
      Armadura Enemiga, Fácil de Encontrar. Arma Arrojadiza: Las miniaturas que usan piedrecitas no
      sufren penalizaciones por alcance ni por movimiento, ya que estas armas están perfectamente
      equilibradas para el lanzamiento. No pueden usarse en combate cuerpo a cuerpo. +1 de
      Perforación de Armadura Enemiga: Cualquier miniatura herida con una Piedrecita obtiene +1 a su
      salvación por armadura. Fácil de Encontrar: ¡Encontrar una Piedrecita es fácil! Son gratis
      para los miembros de la banda Snotling. Si se pierde, puede encontrarse otra sin coste.
      Además, las Piedrecitas NO cuentan para el número máximo de armas de misil que un guerrero
      puede llevar.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: New Equipment / Small Pebble
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/snotlings
  combat_status: out_of_scope
- id: slingshot
  kind: ranged-weapon
  name: Slingshot
  name_i18n:
    es: Hondita
  effect: >-
    Maximum Range: 18". Strength: 2. Special Rule: Fire twice at half range. Fire Twice at Half
    Range: A sling-shooter may fire twice in the shooting phase if he does not move in the movement
    phase. He cannot shoot over half range (9") though, if he fires twice. If the model fires twice
    then each shot is at -1 to hit.
  effect_i18n:
    es: >-
      Alcance máximo: 18". Fuerza: 2. Regla Especial: Disparar dos veces a media distancia. Dispara
      Dos Veces a Media Distancia: Un tirador con hondita puede disparar dos veces en la fase de
      Disparo si no se mueve en la fase de Movimiento. Pero no puede disparar a más de media
      distancia (9") si dispara dos veces. Si la miniatura dispara dos veces, cada disparo recibe -1
      por impactar.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: New Equipment / Slingshot
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/snotlings
  combat_status: out_of_scope
- id: power_squig
  kind: out-of-scope
  name: Power Squig
  name_i18n:
    es: Squig de Poder
  effect: >-
    The Power Squig acts exactly the same as a Familiar available to all warbands from the Shadow
    Warrior Equipment List. It's just more Snotlingish!
  effect_i18n:
    es: >-
      El Squig de Poder funciona exactamente igual que un Familiar disponible para todas las bandas
      en la Lista de Equipo del Guerrero Sombra. ¡Solo que es más snotlinguesco!
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: New Equipment / Power Squig
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/snotlings
  combat_status: out_of_scope
