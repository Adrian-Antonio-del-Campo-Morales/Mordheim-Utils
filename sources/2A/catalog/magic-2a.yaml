lores:
- id: lore.dreaded-scrolls-of-nagash
  name: Dreaded Scrolls of Nagash
  name_i18n:
    es: Pergaminos Malditos de Nagash
  note: 'The Necromancy spell list of the Necrarchs (LotD #1), written upon the flesh of elven children.
    The Necrarch Vampire''s Wizard rule generates one spell randomly from this list.'
  spells:
  - id: spell.dreaded-scrolls-of-nagash.soulcage
    roll: '1'
    name: Soulcage
    name_i18n:
      es: Jaula de Almas
    difficulty: 9
    effect: >-
      Wracked with pain unimaginable, the victim shoulders the burden that belongs to the caster.
      You may choose a single model within 6''. All wounds are transferred to this model at +1 to
      the Injury Roll. Should a natural 6 be rolled on the Injury chart, not only is the Soulcaged
      model removed from action, but the caster is treated as Stunned. Only one Soulcage spell may
      be in effect at a time.
    effect_i18n:
      es: >-
        Presa de un dolor inimaginable, la víctima carga con la carga que pertenece al lanzador.
        Puedes elegir una sola miniatura a 6 pulgadas. Todas las heridas se transfieren a esa
        miniatura sumando +1 a la Tirada de Herida. Si se obtiene un 6 natural en la tabla de
        Heridas, no solo se retira del combate la miniatura enjaulada, sino que el lanzador se
        considera Aturdido. Solo puede haber un hechizo Jaula de Almas activo a la vez.
  - id: spell.dreaded-scrolls-of-nagash.black-breath
    roll: '2'
    name: Black Breath
    name_i18n:
      es: Aliento Negro
    difficulty: 8
    effect: >-
      The mage belches forth a toxic wind of death, engulfing all within the embrace of slumber
      eternal. The spell has a range of 8'', and hits the first model within its path. It causes 2
      S4 hits on its target, and one S3 hit on all models within 2''.
    effect_i18n:
      es: >-
        El mago escupe un viento tóxico de muerte, envolviendo a todos en el abrazo del sueño
        eterno. El hechizo tiene un alcance de 8 pulgadas y alcanza a la primera miniatura en su
        trayectoria. Causa 2 impactos de F4 a su objetivo y un impacto de F3 a todas las miniaturas
        dentro de 2 pulgadas.
  - id: spell.dreaded-scrolls-of-nagash.servants-eternal
    roll: '3'
    name: Servants Eternal
    name_i18n:
      es: Sirvientes Eternos
    difficulty: auto
    effect: >-
      Calling upon the powers of darkness, the caster summons undying servants to do his bidding.
      This spell must be used before the game, and may only be used once. When cast, the spell
      summons D3 Zombies to the caster's side. The evil that sustains the abominations will fade
      after the battle, turning their damned flesh to dust. As such, these zombies do not count
      towards the warband's maximum size.
    effect_i18n:
      es: >-
        Invocando los poderes de la oscuridad, el lanzador convoca sirvientes inmortales para hacer
        su voluntad. Este hechizo debe usarse antes de la partida y solo puede usarse una vez. Al
        ser lanzado, convoca D3 Zombis al lado del lanzador. El mal que sostiene las abominaciones
        se desvanecerá tras la batalla, convirtiendo su carne maldita en polvo. Por tanto, estos
        zombis no cuentan para el tamaño máximo de la banda.
  - id: spell.dreaded-scrolls-of-nagash.fear-of-the-ages
    roll: '4'
    name: Fear of the Ages
    name_i18n:
      es: Miedo de los Siglos
    difficulty: 9
    effect: >-
      Like a wave of pure despair, the mage releases the fear of the ages over those around him. All
      enemy models within 4'' of the caster suffer a S3 hit. No armour saves are allowed. The
      servants of Morr, Sigmar and Ulric are especially susceptible to this evil, and suffer a S4
      hit instead.
    effect_i18n:
      es: >-
        Como una ola de puro desesperación, el mago libera el miedo de los siglos sobre quienes lo
        rodean. Todas las miniaturas enemigas a 4 pulgadas del lanzador sufren un impacto de F3. No
        se permiten tiradas de salvación por armadura. Los sirvientes de Morr, Sigmar y Ulric son
        especialmente susceptibles a este mal y sufren un impacto de F4 en su lugar.
  - id: spell.dreaded-scrolls-of-nagash.wall-of-despair
    roll: '5'
    name: Wall of Despair
    name_i18n:
      es: Muro de la Desesperación
    difficulty: 6
    effect: >-
      The caster weaves about him a wall of pure despair, rendering himself immune to the will of
      others. The caster is immune to all spells and prayers. Roll at the beginning of each turn
      during the Recovery Phase. On a roll of 1 or 2, the Wall of Despair disappears.
    effect_i18n:
      es: >-
        El lanzador teje a su alrededor un muro de pura desesperación, volviéndose inmune a la
        voluntad de los demás. El lanzador es inmune a todos los hechizos y plegarias. Tira al
        principio de cada turno durante la Fase de Recuperación. Con un resultado de 1 o 2, el Muro
        de la Desesperación desaparece.
  - id: spell.dreaded-scrolls-of-nagash.claws-of-nagash
    roll: '6'
    name: Claws of Nagash
    name_i18n:
      es: Garras de Nagash
    difficulty: 10
    effect: >-
      The withered hands of the caster grow and flash with the dark power of Nagash. The Claws of
      Nagash grant the caster +1 Weapon Skill, and the caster becomes Frenzied. Test at the
      beginning of each turn during the Recovery Phase. On a roll of 2 or less, the Claws of Nagash
      vanish.
    effect_i18n:
      es: >-
        Las manos marchitas del lanzador crecen y destellan con el poder oscuro de Nagash. Las
        Garras de Nagash otorgan al lanzador +1 Habilitad con las Armas y el lanzador se vuelve
        Frenético. Tira al principio de cada turno durante la Fase de Recuperación. Con un resultado
        de 2 o menos, las Garras de Nagash desaparecen.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Spells - Dreaded Scrolls of Nagash
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/necrarchs-the-soul-stealers
- id: lore.elemental-water
  name: Elemental Lore of Water
  name_i18n:
    es: Lore Elemental del Agua
  note: Elemental spell list available to Sorcerous Society wizards (LotD
  spells:
  - id: spell.elemental-water.geyser
    roll: '1'
    name: Geyser
    name_i18n:
      es: Géiser
    difficulty: 9
    effect: >-
      Calling upon the earth, the caster beckons a steaming geyser to erupt. The spell has a range
      of 10 inches and cannot target elevated targets. The unit suffers a S4 hit and is blown 2
      inches in a random direction. Should the model collide with something, both will suffer an
      additional S2 hit.
    effect_i18n:
      es: >-
        Invocando la tierra, el lanzador hace erupcionar un géiser humeante. El hechizo tiene un
        alcance de 10 pulgadas y no puede apuntar a objetivos elevados. La unidad sufre un impacto
        de F4 y es lanzada 2 pulgadas en una dirección aleatoria. Si la miniatura choca con algo,
        ambas sufren un impacto adicional de F2.
  - id: spell.elemental-water.portent-of-amul
    roll: '2'
    name: Portent of Amul
    name_i18n:
      es: Presagio de Amul
    difficulty: 6
    effect: >-
      Divining auspicious signs, the wizard guides the minds of his fellow warriors, allowing them
      to predict the actions of their foes. This spell affects all of the wizard's friendly units.
      During this and their opponents' Close Combat phase, any 1's that are cast may be re-rolled.
      Re-rolled scores of 1 must stand, as you may never re-roll a re-roll.
    effect_i18n:
      es: >-
        Adivinando señales auspiciosas, el hechicero guía las mentes de sus compañeros guerreros,
        permitiéndoles predecir las acciones de sus enemigos. Este hechizo afecta a todas las
        unidades amigas del hechicero. Durante esta fase de Combate Cuerpo a Cuerpo y la del
        oponente, se puede repetir cualquier 1 obtenido. Los resultados repetidos de 1 deben
        mantenerse, pues nunca se puede repetir una repetición.
  - id: spell.elemental-water.premonition
    roll: '3'
    name: Premonition
    name_i18n:
      es: Presentimiento
    difficulty: 8
    effect: >-
      The wizard closes his eyes and seeks to foresee the outcome of the battle. As long as the
      wizard stands, the warband will gain +1 to its Leadership and the ability to re-roll any
      failed Rout Tests. The wizard has foretold of their victory, and they are not easily swayed
      from his Premonition.
    effect_i18n:
      es: >-
        El hechicero cierra los ojos e intenta prever el desenlace de la batalla. Mientras el
        hechicero siga en pie, la banda gana +1 a su Liderazgo y la capacidad de repetir cualquier
        tirada de Huida fallida. El hechicero ha profetizado su victoria, y no se dejan convencer
        fácilmente en contra de su Presentimiento.
  - id: spell.elemental-water.frostbolts
    roll: '4'
    name: Frostbolts
    name_i18n:
      es: Saetas de Escarcha
    difficulty: 8
    effect: >-
      Holding a small icicle aloft, the wizard channels the power of the Winds of Magic into it.
      Borne upon the arcane winds, the frozen bolts arc through the skies at the wizard's foe.
      Frostbolts is a magic missile with a range of 16 inches. If successfully cast, a squall of
      frozen missiles hit the target and causes D3 S3 hits.
    effect_i18n:
      es: >-
        Sosteniendo un pequeño carámbano en alto, el hechicero canaliza en él el poder de los
        Vientos de la Magia. Sobre los vientos arcanos, los carámbanos helados surcan el cielo hacia
        el enemigo del hechicero. Saetas de Escarcha es un misil mágico con un alcance de 16
        pulgadas. Si se lanza con éxito, una squall de misiles helados alcanza al objetivo y causa
        D3 impactos de F3.
  - id: spell.elemental-water.blindness-of-the-depths
    roll: '5'
    name: Blindness of the Depths
    name_i18n:
      es: Ceguera de las Profundidades
    difficulty: 7
    effect: >-
      The caster binds the enemy in the shadows and silence of the deep, rendering him oblivious to
      the world around him. This spell has a range of 12 inches. The target may make an immediate
      Initiative test. If passed, the spell has no effect. If the test is failed, the model is Blind
      and may not fight or shoot any missile weapons, nor cast any spells. Furthermore, the model
      may not be charged or targeted for ranged fire or spells, as it is completely engulfed in
      shadow. The model may make an Initiative test during each of its own Recovery Phases. Once
      passed, the spell fades.
    effect_i18n:
      es: >-
        El lanzador ata al enemigo en las sombras y el silencio de las profundidades, dejándolo
        ajeno al mundo que lo rodea. Este hechizo tiene un alcance de 12 pulgadas. El objetivo puede
        hacer una prueba de Iniciativa inmediata. Si la supera, el hechizo no tiene efecto. Si la
        falla, la miniatura queda Ciega y no puede luchar ni disparar armas de misiles, ni lanzar
        hechizos. Además, no se puede cargar contra la miniatura ni elegir como objetivo de fuego a
        distancia o hechizos, pues está completamente envuelta en sombras. La miniatura puede hacer
        una prueba de Iniciativa durante cada una de sus propias Fases de Recuperación. Una vez
        superada, el hechizo se desvanece.
  - id: spell.elemental-water.lifespring
    roll: '6'
    name: Lifespring
    name_i18n:
      es: Manantial de Vida
    difficulty: 8
    effect: >-
      Bearing the gift of life, the wizard wisely taps into the Lifespring and offers its blessing
      to his friends. Any one friendly model within 4 inches of the wizard instantly regains a
      wound, and recovers from being Knocked Down or Stunned and may act as normal this turn.
    effect_i18n:
      es: >-
        Portando el don de la vida, el hechicero aprovecha sabiamente el Manantial de Vida y ofrece
        su bendición a sus amigos. Cualquier miniatura amiga a 4 pulgadas del hechicero recupera
        instantáneamente una herida, se recupera de estar Derribada o Aturdida y puede actuar con
        normalidad este turno.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Elemental Lore of Water
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/sorcerous-society
- id: lore.elemental-fire
  name: Elemental Lore of Fire
  name_i18n:
    es: Lore Elemental del Fuego
  note: Elemental spell list available to Sorcerous Society wizards (LotD
  spells:
  - id: spell.elemental-fire.joruns-blast-of-brimstone
    roll: '1'
    name: Jorun's Blast of Brimstone
    name_i18n:
      es: Explosión de Azufre de Jorun
    difficulty: 9
    effect: >-
      The Mage casts a small ball of mixed stuffs, mostly ash, sulfur and coal, at his enemies. The
      results are, to say the least, explosive. Range of the spell equals the caster's Strength plus
      1D6 inches. The caster then throws the small sulfurous rock at any model he has Line of Sight
      to within that range, and it explodes upon impact. The rock does a S3 hit to that model, and
      any others within 1.5 inches from it.
    effect_i18n:
      es: >-
        El Mago lanza una pequeña bola de materiales mixtos, principalmente ceniza, azufre y carbón,
        a sus enemigos. Los resultados son, por decirlo suavemente, explosivos. El alcance del
        hechizo es igual a la Fuerza del lanzador más 1D6 pulgadas. El lanzador arroja la pequeña
        roca sulfurosa a cualquier miniatura con Línea de Visión dentro de ese alcance, y explota al
        impactar. La roca causa un impacto de F3 a esa miniatura y a cualquier otra a 1,5 pulgadas
        de ella.
  - id: spell.elemental-fire.tazouls-burning-skull
    roll: '2'
    name: Tazoul's Burning Skull
    name_i18n:
      es: Cráneo Ardiente de Tazoul
    difficulty: 9
    effect: >-
      Throwing one's own head o'er the battlefield is never recommended, especially when it's
      aflame. The Wizard known as Tazoul never heeded such warnings. The flaming skull has a range
      of 8 inches and causes one S5 hit. On a roll of 5+ it will hit the nearest enemy model with a
      S3 hit. On a further roll of 4+ it will hit the next nearest enemy model with a S2 hit. The
      spell may not target the same model during one casting.
    effect_i18n:
      es: >-
        Lanzar la propia cabeza sobre el campo de batalla nunca es recomendable, y menos aún cuando
        está en llamas. El hechicero conocido como Tazoul nunca hizo caso de tales advertencias. El
        cráneo llameante tiene un alcance de 8 pulgadas y causa un impacto de F5. Con un resultado
        de 5+ alcanzará a la miniatura enemiga más cercana con un impacto de F3. Con una tirada
        adicional de 4+ alcanzará a la siguiente miniatura enemiga más cercana con un impacto de F2.
        El hechizo no puede apuntar a la misma miniatura en un mismo lanzamiento.
  - id: spell.elemental-fire.hades-heat
    roll: '3'
    name: Hades Heat
    name_i18n:
      es: Calor de Hades
    difficulty: 6
    effect: >-
      The wizard calls upon the sun to intensify its rays o'er a small area. Place a small Blast
      Template (3 inches) anywhere within 8 inches of the caster. Models that are under or partially
      under the template suffer -1WS and -1S due to the exhaustion the intense heat causes until the
      caster's next turn.
    effect_i18n:
      es: >-
        El hechicero invoca al sol para que intensifique sus rayos sobre una pequeña zona. Coloca
        una plantilla pequeña de explosión (3 pulgadas) en cualquier punto a 8 pulgadas del
        lanzador. Las miniaturas bajo la plantilla, total o parcialmente, sufren -1HA y -1F por el
        agotamiento que causa el calor intenso hasta el próximo turno del lanzador.
  - id: spell.elemental-fire.shield-of-flame
    roll: '4'
    name: Shield of Flame
    name_i18n:
      es: Escudo de Llamas
    difficulty: 8
    effect: >-
      The wizard weaves a shield of pure flame, aiding him in his defense. The Shield of Flame
      hovers between the wizard and his foes. He is free to use his weapons normally as the Shield
      of Flame moves in conjunction with the Wizard's attacks. The shield grants the Wizard an
      Armour Save of 4+ in Close Combat and 5+ to ranged attacks. These do not stack and are
      unmodifiable.
    effect_i18n:
      es: >-
        El hechicero teje un escudo de llama pura que le ayuda en su defensa. El Escudo de Llamas
        flota entre el hechicero y sus enemigos. Puede usar sus armas con normalidad, pues el Escudo
        de Llamas se mueve en conjunción con los ataques del Hechicero. El escudo otorga al
        Hechicero una Tirada de Salvación por Armadura de 4+ en Combate Cuerpo a Cuerpo y de 5+
        contra ataques a distancia. Estas no se acumulan y no son modificables.
  - id: spell.elemental-fire.uzhuls-inferno
    roll: '5'
    name: U'Zhuls Inferno
    name_i18n:
      es: Infierno de U'Zhul
    difficulty: 9
    effect: >-
      A pillar of flame erupts from the caster's hand, engulfing all in its path. The pillar of
      flame has a range of 12 inches and is 1 inch wide. It hits all models in its path with a S2
      hit. The target of the spell suffers the brunt of the attack, receiving a S4 hit. All hits
      have a -1 AS modifier.
    effect_i18n:
      es: >-
        Un pilar de llamas brota de la mano del lanzador, envolviendo todo a su paso. El pilar de
        fuego tiene un alcance de 12 pulgadas y 1 pulgada de ancho. Golpea a todas las miniaturas en
        su trayectoria con un impacto de F2. El objetivo del hechizo sufre el grueso del ataque,
        recibiendo un impacto de F4. Todos los impactos tienen un modificador de -1 a la TS.
  - id: spell.elemental-fire.flesh-of-the-forge
    roll: '6'
    name: Flesh of the Forge
    name_i18n:
      es: Carne de la Forja
    difficulty: 6
    effect: >-
      Surrendering himself to the winds of magic, the alchemist imbues his flesh with the heat of
      the forge. The Wizard's skin becomes hot, smoldering with the heat of a thousand coals. All
      hits against the wizard in Close Combat are at -1 to hit. Roll a D6 during the Wizard's
      Recovery phase. On a roll of 1-2, his flesh reverts to its natural form.
    effect_i18n:
      es: >-
        Entregándose a los vientos de la magia, el alquimista impregna su carne con el calor de la
        forja. La piel del Hechicero se calienta, ardiendo con el calor de mil brasas. Todos los
        impactos contra el hechicero en Combate Cuerpo a Cuerpo sufren -1 para impactar. Tira un D6
        durante la fase de Recuperación del Hechicero. Con un resultado de 1-2, su carne vuelve a su
        forma natural.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Elemental Lore of Fire
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/sorcerous-society
- id: lore.elemental-earth
  name: Elemental Lore of Earth
  name_i18n:
    es: Lore Elemental de la Tierra
  note: Elemental spell list available to Sorcerous Society wizards (LotD
  spells:
  - id: spell.elemental-earth.flesh-of-clay
    roll: '1'
    name: Flesh of Clay
    name_i18n:
      es: Carne de Arcilla
    difficulty: 8
    effect: >-
      Attuning himself to the earth, the wizard's flesh becomes as dense as clay. The wizard doubles
      his Toughness, but halves his Movement and Initiative. The spell remains in effect until the
      caster is Knocked Down, Stunned or taken Out of Action.
    effect_i18n:
      es: >-
        Sintonizándose con la tierra, la carne del hechicero se vuelve densa como la arcilla. El
        hechicero duplica su Resistencia, pero reduce a la mitad su Movimiento e Iniciativa. El
        hechizo permanece en vigor hasta que el lanzador sea Derribado, Aturdido o puesto Fuera de
        Combate.
  - id: spell.elemental-earth.healing-might
    roll: '2'
    name: Healing Might
    name_i18n:
      es: Poder Curativo
    difficulty: 9
    effect: >-
      Allowing the healing power of the earth to rise up within him, the wizard aids even those with
      the most grievous wounds around him. All models within 4 inches of the wizard rise from the
      ground, shrugging off the effects of being Knocked Down or Stunned. Furthermore, any units
      within 2 inches of the wizard have all of their wounds restored.
    effect_i18n:
      es: >-
        Permitiendo que el poder curativo de la tierra se alce dentro de él, el hechicero socorre
        incluso a los que tienen las heridas más graves a su alrededor. Todas las miniaturas a 4
        pulgadas del hechicero se levantan del suelo, liberándose de los efectos de estar Derribadas
        o Aturdidas. Además, cualquier unidad a 2 pulgadas del hechicero recupera todas sus heridas.
  - id: spell.elemental-earth.curse-of-thorns
    roll: '3'
    name: Curse of Thorns
    name_i18n:
      es: Maldición de Espinas
    difficulty: 6
    effect: >-
      The caster curses his foes, calling upon their life-force to transform into a jagged and
      thorny essence. The target of the spell must be within 18 inches. The model must pass a
      Toughness test or be wracked with unimaginable pain. The model will remain immobile and will
      only defend himself if attacked. A Toughness test must be passed before the spell will fade.
    effect_i18n:
      es: >-
        El lanzador maldice a sus enemigos, invocando su fuerza vital para transformarla en una
        esencia dentada y espinosa. El objetivo del hechizo debe estar a 18 pulgadas. La miniatura
        debe superar una prueba de Resistencia o quedará presa de un dolor inimaginable. La
        miniatura permanecerá inmóvil y solo se defenderá si es atacada. Debe superarse una prueba
        de Resistencia antes de que el hechizo se desvanezca.
  - id: spell.elemental-earth.jozuns-decay
    roll: '4'
    name: Jozun's Decay
    name_i18n:
      es: Decadencia de Jozun
    difficulty: 9
    effect: >-
      Ashes and dust. The caster calls upon the earth to reclaim what is rightfully hers. This spell
      has a range of 12 inches. Upon a successful casting, the target must pass a Leadership Test or
      suffer a one point reduction to its Toughness attribute. Each Recovery phase the model must
      attempt to pass a Leadership test, reducing its Toughness a further point for each failure.
      Should a model be reduced to 0 Toughness, it is removed from the game irrespective of how many
      wounds it has left. Should a Leadership test be passed, the model must play the remainder of
      the game at its modified Toughness score. A model may not be targeted by Eternal Rot more than
      once per game.
    effect_i18n:
      es: >-
        Cenizas y polvo. El lanzador invoca a la tierra para reclamar lo que por derecho le
        pertenece. Este hechizo tiene un alcance de 12 pulgadas. Tras un lanzamiento con éxito, el
        objetivo debe superar una prueba de Liderazgo o sufrir una reducción de un punto en su
        atributo de Resistencia. En cada fase de Recuperación la miniatura debe intentar superar una
        prueba de Liderazgo, reduciendo su Resistencia un punto adicional por cada fallo. Si una
        miniatura queda reducida a 0 de Resistencia, se retira del juego sin importar cuántas
        heridas le queden. Si se supera una prueba de Liderazgo, la miniatura debe jugar el resto de
        la partida con su Resistencia modificada. Una miniatura no puede ser objetivo de esta
        podredumbre eterna más de una vez por partida.
  - id: spell.elemental-earth.the-hunters-spear
    roll: '5'
    name: The Hunter's Spear
    name_i18n:
      es: Lanza del Cazador
    difficulty: 8
    effect: >-
      Beseeching Venor the Hunter, the caster conjures a pure manifestation of amber-hued magic in
      the shape of a mighty hunting spear. The wizard's weapon takes on an amber-hue and transmutes
      into a hunting spear. It grants the caster an additional two points to his Strength, and
      grants him an additional attack. The caster must make a Leadership test during his Recovery
      phases. The spear fades away if the test is failed.
    effect_i18n:
      es: >-
        Implorando a Venor el Cazador, el lanzador conjura una pura manifestación de magia ámbar en
        forma de una poderosa lanza de caza. El arma del hechicero toma un tono ámbar y se transmuta
        en una lanza de caza. Otorga al lanzador dos puntos adicionales de Fuerza y un ataque
        adicional. El lanzador debe hacer una prueba de Liderazgo durante sus fases de Recuperación.
        La lanza se desvanece si falla la prueba.
  - id: spell.elemental-earth.shifting-sands
    roll: '6'
    name: Shifting Sands
    name_i18n:
      es: Arenas Movedizas
    difficulty: 8
    effect: >-
      Calling upon the very fibers of the earth, the mage forces the ground to swallow his foes.
      This spell may be cast on any enemy model within sight of the wizard. The model in question
      must make a successful Initiative test or be treated as Knocked Down until its next Recovery
      phase, where it has another chance to pass an Initiative test. Any friendly models within 1
      inch of the trapped model reduce the difficulty of the Initiative test by 1, to a minimum of
      1.
    effect_i18n:
      es: >-
        Invocando las propias fibras de la tierra, el mago obliga al suelo a tragarse a sus
        enemigos. Este hechizo puede lanzarse sobre cualquier miniatura enemiga con línea de visión
        del hechicero. La miniatura en cuestión debe superar una prueba de Iniciativa o se la
        considera Derribada hasta su siguiente fase de Recuperación, donde tiene otra oportunidad de
        superar una prueba de Iniciativa. Cualquier miniatura amiga a 1 pulgada de la miniatura
        atrapada reduce en 1 la dificultad de la prueba de Iniciativa, hasta un mínimo de 1.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Elemental Lore of Earth
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/sorcerous-society
- id: lore.elemental-air
  name: Elemental Lore of Air
  name_i18n:
    es: Lore Elemental del Aire
  note: Elemental spell list available to Sorcerous Society wizards (LotD
  spells:
  - id: spell.elemental-air.winters-gale
    roll: '1'
    name: Winter's Gale
    name_i18n:
      es: Vendaval de Invierno
    difficulty: 10
    effect: >-
      Calling to the northern winds, the wizard brings forth freezing air and biting snow. Place the
      large blast template (5 inches) over a location within 12 inches of the caster. Any model
      covered or partially covered will suffer a S4 hit. Undead and Possessed models do not suffer
      as mortals do from the cold, and thus only suffer a S2 hit instead.
    effect_i18n:
      es: >-
        Llamando a los vientos del norte, el hechicero trae aire gélido y nieve cortante. Coloca la
        plantilla grande de explosión (5 pulgadas) sobre un punto a 12 pulgadas del lanzador.
        Cualquier miniatura cubierta, total o parcialmente, sufre un impacto de F4. Las miniaturas
        No Muertas y Posesas no sufren el frío como los mortales, y por tanto solo sufren un impacto
        de F2.
  - id: spell.elemental-air.crows-feast
    roll: '2'
    name: Crow's Feast
    name_i18n:
      es: Banquete del Cuervo
    difficulty: 9
    effect: >-
      With dark intentions, the caster brings the attentions of Corvos the Crow upon his enemies.
      Crow's Feast is a magic missile spell, with a range of 24 inches. If successfully cast, the
      spell causes D6 S3 hits.
    effect_i18n:
      es: >-
        Con oscuras intenciones, el lanzador atrae la atención de Corvos el Cuervo sobre sus
        enemigos. El Banquete del Cuervo es un hechizo de misil mágico con un alcance de 24
        pulgadas. Si se lanza con éxito, el hechizo causa D6 impactos de F3.
  - id: spell.elemental-air.dust-dervish
    roll: '3'
    name: Dust Dervish
    name_i18n:
      es: Derviche de Polvo
    difficulty: 9
    effect: >-
      Calling upon minor elementals, the caster bids them to seek out and attack his foes. The spell
      summons D3 Dust Dervishes, who attack a model each who are within 12 inches of the caster. No
      other targeting restrictions apply, so even a model that is hidden may be sought out by the
      air elementals. Each Dust Dervish delivers a rapid succession of attacks, delivering D6 S1
      hits to its target prior to vanishing back from whence it came.
    effect_i18n:
      es: >-
        Invocando elementales menores, el lanzador les ordena buscar y atacar a sus enemigos. El
        hechizo invoca D3 Derviches de Polvo, cada uno de los cuales ataca a una miniatura a 12
        pulgadas del lanzador. No se aplican otras restricciones de objetivo, de modo que incluso
        una miniatura oculta puede ser hallada por los elementales del aire. Cada Derviche de Polvo
        entrega una rápida sucesión de ataques, causando D6 impactos de F1 a su objetivo antes de
        desvanecerse de donde vino.
  - id: spell.elemental-air.howler-wind
    roll: '4'
    name: Howler Wind
    name_i18n:
      es: Viento Aullador
    difficulty: 8
    effect: >-
      The fury of the skies unbound is a force that few can hold at bay. This spell is cast upon the
      wizard himself. Both he and any models within 8 inches of him gain the protection of the
      Howler Wind. Anyone targeting these models with mundane ranged weapons suffer a -2 penalty to
      their Ballistic Skill, however shooting past these models does not affect the missile in any
      way.
    effect_i18n:
      es: >-
        La furia desatada de los cielos es una fuerza que pocos pueden contener. Este hechizo se
        lanza sobre el propio hechicero. Tanto él como cualquier miniatura a 8 pulgadas de él
        obtienen la protección del Viento Aullador. Quien apunte a estas miniaturas con armas a
        distancia mundanas sufre una penalización de -2 en su Habilitad de Disparo; sin embargo,
        disparar más allá de estas miniaturas no afecta en nada al proyectil.
  - id: spell.elemental-air.celestial-shield
    roll: '5'
    name: Celestial Shield
    name_i18n:
      es: Escudo Celestial
    difficulty: 8
    effect: >-
      The wizard manipulates the magic of the cosmos to create a scintillating blue shield capable
      of turning aside even the most powerful of projectile or spell. This spell can be cast upon
      any friendly model within 6 inches of the caster, or the caster himself. The Celestial Shield
      provides a 4+ save versus all ranged attacks, and a 5+ save versus all hostile spells. Should
      the recipient of the Shield be the primary target of an area-effect spell and the save be
      made, no models shall suffer any of the spell's effects.
    effect_i18n:
      es: >-
        El hechicero manipula la magia del cosmos para crear un escudo azul centelleante capaz de
        desviar incluso el proyectil o hechizo más poderoso. Este hechizo puede lanzarse sobre
        cualquier miniatura amiga a 6 pulgadas del lanzador, o sobre el propio lanzador. El Escudo
        Celestial otorga una salvación de 4+ contra todos los ataques a distancia y de 5+ contra
        todos los hechizos hostiles. Si el receptor del Escudo es el objetivo principal de un
        hechizo de área y supera la salvación, ninguna miniatura sufrirá los efectos del hechizo.
  - id: spell.elemental-air.shade-mount
    roll: '6'
    name: Shade Mount
    name_i18n:
      es: Montura de Sombras
    difficulty: 8
    effect: >-
      Darkness forms about the caster, carrying him aloft upon wings of shadow. This spell may be
      cast upon the wizard himself, or a hero within 8 inches of him. Upon a successful casting, the
      model may immediately fly up to 12 inches. Should this movement bring the model into Base to
      Base contact with an enemy model, consider it a charge.
    effect_i18n:
      es: >-
        La oscuridad se forma alrededor del lanzador y lo eleva sobre alas de sombra. Este hechizo
        puede lanzarse sobre el propio hechicero, o sobre un héroe a 8 pulgadas de él. Tras un
        lanzamiento con éxito, la miniatura puede volar inmediatamente hasta 12 pulgadas. Si este
        movimiento lleva a la miniatura a contacto Base con Base con una miniatura enemiga,
        considérese una carga.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Elemental Lore of Air
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/sorcerous-society
- id: lore.funerary-rites-lotd5
  name: Funerary Rites (Vampire Hunters of Sylvania Variant)
  name_i18n:
    es: Ritos Funerarios (Variante de los Cazadores de Vampiros de Sylvania)
  note: VARIANT of the active KB lore lore.funerary-rites (core Mordheim, Priest of Morr). This page (LotD
    no. 5) prints the same six rites with different difficulties (3. Sanctity of the Fallen 5 vs 7; 5.
    Do You Know Who I Am? 9 vs 7; 6. I Am Death! 7 vs 8). Per the no-fusion rule the variant is preserved
    verbatim for this band; equivalence review happens at promotion.
  spells:
  - id: spell.funerary-rites-lotd5.morrs-protection
    roll: '1'
    name: Morr's Protection
    name_i18n:
      es: Protección de Morr
    difficulty: 6
    effect: >-
      'Morr, watch over your faithful servants!' The Priest of Morr calls out to his god when
      confronted by an abomination and asks that he be shielded from the corrupted magic of the
      tainted. Any Magical attacks made by a Necromancer, a Magister or Daemons, which would be
      considered a direct attack on the priest, will be negated if this rite is successful. This
      effect remains until the priest's next shooting phase.
    effect_i18n:
      es: >-
        «¡Morr, vela por tus fieles servidores!» El Sacerdote de Morr llama a su dios al enfrentarse
        a una abominación y pide ser protegido de la magia corrompida de los contaminados. Cualquier
        ataque mágico realizado por un Nigromante, un Magister o Demonios, que se considere un
        ataque directo contra el sacerdote, se anulará si el rito tiene éxito. Este efecto permanece
        hasta la próxima fase de disparo del sacerdote.
  - id: spell.funerary-rites-lotd5.death-holds-no-fear
    roll: '2'
    name: Death Holds No Fear
    name_i18n:
      es: La Muerte No Da Miedo
    difficulty: auto
    effect: >-
      Priests of Morr must be steadfast in their resolution and as such must, above all else, have
      no fear of death. The Priest of Morr is now Fearless for the remainder of the game.
    effect_i18n:
      es: >-
        Los sacerdotes de Morr deben ser firmes en su resolución y, como tales, deben, por encima de
        todo, no temer a la muerte. El Sacerdote de Morr es ahora Incapaz de Temor por el resto de
        la partida.
  - id: spell.funerary-rites-lotd5.sanctity-of-the-fallen
    roll: '3'
    name: Sanctity of the Fallen
    name_i18n:
      es: Santidad de los Caídos
    difficulty: 5
    effect: >-
      'Those who fall shall be sanctified and their soul freed, in the name of Morr, god of death.'
      The Priest of Morr may attempt to perform the Rite of Sanctity on a model (friend or foe) who
      has been taken Out of Action. The Priest must be within 6 inches of the model in question. If
      successful, the model may not be raised up by a Necromancer.
    effect_i18n:
      es: >-
        «Los que caigan serán santificados y su alma liberada, en el nombre de Morr, dios de la
        muerte.» El Sacerdote de Morr puede intentar realizar el Rito de Santidad sobre una
        miniatura (amiga o enemiga) que haya sido puesta Fuera de Combate. El Sacerdote debe estar a
        6 pulgadas de la miniatura en cuestión. Si tiene éxito, la miniatura no puede ser resucitada
        por un Nigromante.
  - id: spell.funerary-rites-lotd5.hand-of-morr
    roll: '4'
    name: Hand of Morr
    name_i18n:
      es: Mano de Morr
    difficulty: 9
    effect: >-
      'By the hand of Morr, the Undead shall become as dust and ashes.' The Priest of Morr must be
      in base-to-base contact with the Undead model. Before Hand-to-Hand combat occurs, the Priest
      may attempt to use the Hand of Morr rite. If successful, the foe immediately goes Out of
      Action (this affects Zombies, Dire Wolves and Vampires). Ghouls, Possessed, Daemons and
      creatures of Chaos affected will immediately flee their full Move away from the Priest of
      Morr.
    effect_i18n:
      es: >-
        «Por la mano de Morr, los No Muertos se convertirán en polvo y cenizas.» El Sacerdote de
        Morr debe estar en contacto base con base con la miniatura No Muerta. Antes de que ocurra el
        combate cuerpo a cuerpo, el Sacerdote puede intentar usar el rito de la Mano de Morr. Si
        tiene éxito, el enemigo queda inmediatamente Fuera de Combate (esto afecta a Zombis, Lobos
        Siniestros y Vampiros). Los Gulles, Posesos, Demonios y criaturas del Caos afectados huirán
        inmediatamente su Movimiento completo alejándose del Sacerdote de Morr.
  - id: spell.funerary-rites-lotd5.do-you-know-who-i-am
    roll: '5'
    name: Do You Know Who I Am?
    name_i18n:
      es: ¿Sabes Quién Soy?
    difficulty: 9
    effect: >-
      'Gaze upon me, abomination, for I am a Priest of Morr.' This rite has a range of 6 inches and
      must be directed at the closest Undead model first, or if no Undead are within range, at the
      next closest human servant of the Undead (Dregs, Ghouls, Necromancers), or finally at any
      model. If successful, that model is immediately Stunned. If the model cannot be Stunned, then
      it is Knocked Down instead.
    effect_i18n:
      es: >-
        «Contémplame, abominación, pues soy un Sacerdote de Morr.» Este rito tiene un alcance de 6
        pulgadas y debe dirigirse primero a la miniatura No Muerta más cercana, o si no hay No
        Muertos dentro del alcance, al siguiente sirviente humano de los No Muertos más cercano
        (Dregs, Gulles, Nigromantes), o finalmente a cualquier miniatura. Si tiene éxito, esa
        miniatura queda inmediatamente Aturdida. Si la miniatura no puede quedar Aturdida, entonces
        queda Derribada.
  - id: spell.funerary-rites-lotd5.i-am-death
    roll: '6'
    name: I Am Death!
    name_i18n:
      es: ¡Yo Soy la Muerte!
    difficulty: 7
    effect: >-
      'I am a Priest of Morr, god of death!' There are times when a Priest of Morr will be called to
      engage in combat, and who would be more feared than a representative of the god of Death? This
      spell gives the Priest of Morr a 6+ armour save and increases their WS by either +1 or makes
      it 4, whichever is the greater. A Leadership test is required to maintain this spell in
      subsequent rounds.
    effect_i18n:
      es: >-
        «¡Yo soy un Sacerdote de Morr, dios de la muerte!» Hay momentos en que un Sacerdote de Morr
        será llamado a entrar en combate, ¿y a quién se temería más que a un representante del dios
        de la Muerte? Este hechizo otorga al Sacerdote de Morr una salvación por armadura de 6+ y
        aumenta su HA en +1 o la fija en 4, lo que sea mayor. Se requiere una prueba de Liderazgo
        para mantener este hechizo en rondas posteriores.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Funerary Rites
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/vampire-hunters-of-sylvania
- id: lore.snotling-waaagh-magic
  name: Snotling Waaagh! Magic
  name_i18n:
    es: Magia ¡Waaagh! Snotling
  note: The self-destructive spell list of the Snotling Shaman.
  spells:
  - id: spell.snotling-waaagh-magic.morks-blessing
    roll: '1'
    name: Mork's Blessing
    name_i18n:
      es: Bendición de Mork
    difficulty: 6
    effect: >-
      The warrior targeted by this spell has become Blessed by the Greenskin God Mork, who gets
      quite irate when anyone inflicts harm on the Little Fellow. Mork's Blessing can be used to
      target any friendly greenskin hero on the board regardless of line of sight to the caster or
      not. In any game that the Hero is put Out of Action, roll a D6. On a roll of 4+, the inflictor
      of the damage suffers an automatic wound with no saving throw allowed. Once cast, the blessing
      remains active till the end of the game or the blessed hero is put out of action. It may be
      recast, but once successfully recast, the original blessing fades (if the original Blessed
      model is still on the board). It may be cast on the shaman himself.
    effect_i18n:
      es: >-
        El guerrero objetivo de este hechizo ha sido Bendecido por el Dios Pielesverde Mork, que se
        pone bastante furioso cuando alguien hace daño al Pequeño Compañero. La Bendición de Mork
        puede usarse sobre cualquier héroe pielesverde amistoso en la mesa, haya o no línea de
        visión con el lanzador. En cualquier partida en que el Héroe quede Fuera de Combate, tira un
        D6. Con un resultado de 4+, el causante del daño sufre una herida automática sin salvación
        posible. Una vez lanzada, la bendición permanece activa hasta el final de la partida o hasta
        que el héroe bendecido quede fuera de combate. Puede volverse a lanzar, pero al relanzarse
        con éxito, la bendición original se desvanece (si el modelo bendecido original sigue en la
        mesa). Puede lanzarse sobre el propio chamán.
  - id: spell.snotling-waaagh-magic.we-can-fly
    roll: '2'
    name: '''We Can Fly!'''
    name_i18n:
      es: ¡Podemos Volar!
    difficulty: 7
    effect: >-
      The Shaman draws upon the might of the Waaagh! energy in the air to propel himself and a group
      of Snotlings nearby, towards the enemy. The Shaman and the closest 1D6 Friendly models within
      6 inches are immediately moved 12 inches towards the closest enemy model. If they contact the
      enemy, they count as Charging in the close combat phase.
    effect_i18n:
      es: >-
        El Chamán se nutre del poder de la energía del ¡Waaagh! en el aire para impulsionarse a sí
        mismo y a un grupo de Snotlings cercanos hacia el enemigo. El Chamán y los 1D6 modelos
        Amistosos más cercanos a 6 pulgadas se mueven inmediatamente 12 pulgadas hacia el modelo
        enemigo más cercano. Si entran en contacto con el enemigo, cuentan como que Cargan en la
        fase de combate cuerpo a cuerpo.
  - id: spell.snotling-waaagh-magic.foot-of-gork
    roll: '3'
    name: Foot of Gork!
    name_i18n:
      es: ¡Pie de Gork!
    difficulty: 9
    effect: >-
      The great Greenskin God Gork sees that the Snotlings are engaging a far superior force then
      themselves and decides that he'll give them a little bit of help as a reward for being so
      audacious. Randomly select an enemy model on the board. That model, and any other model
      (friend or foe) within 3 inches are automatically crushed under a giant green foot that
      descends from the heavens. Each model in range suffers D3 hits wounding enemies on a 3+ and
      snotling warband members on a 5+. All hits are at a -3 save modifier.
    effect_i18n:
      es: >-
        El gran Dios Pielesverde Gork ve que los Snotlings se enfrentan a una fuerza muy superior a
        ellos y decide darles una pequeña ayuda como recompensa por ser tan audaces. Elige
        aleatoriamente un modelo enemigo en la mesa. Ese modelo, y cualquier otro modelo (amigo o
        enemigo) a 3 pulgadas, es automáticamente aplastado bajo un pie verde gigante que desciende
        de los cielos. Cada modelo en el área sufre D3 impactos que hieren a los enemigos con un 3+
        y a los miembros de la banda snotling con un 5+. Todos los impactos tienen un modificador de
        salvación de -3.
  - id: spell.snotling-waaagh-magic.pebbles-of-doom
    roll: '4'
    name: Pebbles of Doom
    name_i18n:
      es: Piedrecitas de la Perdición
    difficulty: 6
    effect: >-
      Any friendly Hero within 6" gains D6 magical pebbles blessed by Gork. These may be thrown or
      shot from a slingshot, and count as having +1 to hit and +1 Strength from the respective
      weapon. These pebbles last until they are each used up, until the hero is taken out of action,
      until the end of the game, or until the spell is successfully recast. If the spell is
      successfully recast, any existing Pebbles of Doom created by your shaman that are already on
      the board dissipate.
    effect_i18n:
      es: >-
        Cualquier Héroe amistoso a 6" gana D6 piedrecitas mágicas bendecidas por Gork. Pueden
        lanzarse a mano o con una hondita, y cuentan con +1 al impacto y +1 de Fuerza sobre el arma
        respectiva. Estas piedrecitas duran hasta agotarse, hasta que el héroe quede fuera de
        combate, hasta el final de la partida o hasta que el hechizo se relance con éxito. Si el
        hechizo se relanza con éxito, cualquier Piedrecita de la Perdición existente creada por tu
        chamán que ya esté en la mesa se disipa.
  - id: spell.snotling-waaagh-magic.pointy-stick-of-death
    roll: '5'
    name: Pointy Stick of Death
    name_i18n:
      es: Palo Afilado de la Muerte
    difficulty: 7
    effect: >-
      The Shaman is blessed with the Pointy Stick of Death. It grants the Shaman +2 WS, +1 Strength,
      and the Shaman strikes first in every round of combat (even when charged). The Shaman must
      make a Difficulty test at the start of each Recovery Phase if he wants to maintain the Pointy
      Stick of Death.
    effect_i18n:
      es: >-
        El Chamán es bendecido con el Palo Afilado de la Muerte. Le otorga +2 HA, +1 de Fuerza, y el
        Chamán golpea primero en cada ronda de combate (incluso cuando es cargado). El Chamán debe
        hacer una prueba de Dificultad al comienzo de cada Fase de Recuperación si quiere mantener
        el Palo Afilado de la Muerte.
  - id: spell.snotling-waaagh-magic.blessing-of-the-shrimp
    roll: '6'
    name: Blessing of the Shrimp
    name_i18n:
      es: Bendición del Camarón
    difficulty: 6
    effect: >-
      Target Hero within 6" gains +1WS, +1T and +1 Leadership. If used on your Leader, all models
      within 12" may test off his Leadership. If not used on your Leader, all models within 6" may
      test off its Leadership as if he was an additional Leader. The Blessing will fade after 1D3
      Rounds (thus, a blessing that lasts 1 Round would wear off at the beginning of your next
      Recovery Phase.) Only one friendly model may have the Blessing of the Shrimp at any given
      time, and if recast before it fades, the new model gains the bonus while the old one loses it.
    effect_i18n:
      es: >-
        El Héroe objetivo a 6" gana +1HA, +1R y +1 de Liderazgo. Si se usa en tu Líder, todos los
        modelos a 12" pueden usar su Liderazgo para las pruebas. Si no se usa en tu Líder, todos los
        modelos a 6" pueden usar su Liderazgo como si fuera un Líder adicional. La Bendición se
        desvanece tras 1D3 Rondas (así, una bendición que dure 1 Ronda se extinguiría al comienzo de
        tu próxima Fase de Recuperación). Solo un modelo amistoso puede tener la Bendición del
        Camarón en un momento dado, y si se relanza antes de que se desvanezca, el nuevo modelo gana
        el bonificador mientras el anterior lo pierde.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Magic - Snotling Waaagh! Magic
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/snotlings
- id: lore.blessings-of-the-mare
  name: Blessings of the Mare
  name_i18n:
    es: Bendiciones de la Yegua
  note: The prayer list of the Dame of the Mare (Order of the Mare, by Fredrik Edman). The Dame's Prayers
    rule generates one prayer randomly from this list.
  spells:
  - id: spell.blessings-of-the-mare.unnerving-gaze
    roll: '1'
    name: Unnerving Gaze
    name_i18n:
      es: Mirada Inquietante
    difficulty: 7
    effect: >-
      The Dame of the Mare, with her daunting gaze, petrifies her adversaries and renders them
      hesitant to act against her. All attacks targeting the Dame in hand-to-hand combat are at -1
      to hit. Furthermore, all enemy models that are in base contact with the Dame must strike last,
      no matter their target. The effects of the spell lasts until the beginning of the Order of the
      Mare player's next Shooting phase.
    effect_i18n:
      es: >-
        La Dama de la Yegua, con su mirada imponente, petrifica a sus adversarios y les hace dudar
        de actuar contra ella. Todos los ataques dirigidos a la Dama en combate cuerpo a cuerpo
        sufren -1 por impactar. Además, todas las miniaturas enemigas en contacto base con la Dama
        deben golpear en último lugar, independientemente de su objetivo. Los efectos del hechizo
        duran hasta el comienzo de la próxima fase de Disparo del jugador de la Orden de la Yegua.
  - id: spell.blessings-of-the-mare.phantom-hoof
    roll: '2'
    name: Phantom Hoof
    name_i18n:
      es: Casco Espectral
    difficulty: 9
    effect: >-
      The Dame channels a spectral force to deliver a distant and impactful strike, akin to a
      horse's kick. Target any enemy warrior within 6" of the Dame, that model suffers a Strength 5
      hit with the concussion special rule.
    effect_i18n:
      es: >-
        La Dama canaliza una fuerza espectral para asestar un golpe distante e impactante, semejante
        a una coz de caballo. Elige a cualquier guerrero enemigo a 6" de la Dama; esa miniatura
        sufre un impacto de Fuerza 5 con la regla especial Conmoción.
  - id: spell.blessings-of-the-mare.dames-inspiration
    roll: '3'
    name: Dame's Inspiration
    name_i18n:
      es: Inspiración de la Dama
    difficulty: 7
    effect: >-
      Infused with equine fervour, the Dame enhances her striking power and agility, allowing a
      relentless onslaught in the heat of battle. The Dame's attacks in combat gain +1 to hit and +1
      to their Strength. The Dame must test, by rolling the prayer's difficulty or greater on 2D6,
      at the start of each of her turns to see if the effect remains in play.
    effect_i18n:
      es: >-
        Impregnada de fervor equino, la Dama aumenta su poder de golpe y su agilidad, lo que le
        permite un asedio implacable en el fragor de la batalla. Los ataques de la Dama en combate
        obtienen +1 por impactar y +1 a su Fuerza. La Dama debe hacer una prueba, sacando la
        dificultad de la plegaria o más en 2D6, al comienzo de cada uno de sus turnos para ver si el
        efecto sigue en juego.
  - id: spell.blessings-of-the-mare.thirst-for-valour
    roll: '4'
    name: Thirst for Valour
    name_i18n:
      es: Sed de Valentía
    difficulty: 8
    effect: >-
      The Dame ignites one of her allies (it can't be herself) within 12" with inspiration and an
      insatiable thirst for glory and honour in the name of the Prophetess of the Mare. The target
      warrior is now frenzied. Only one warrior can be affected by this spell at a time, if the Dame
      chooses a new warrior the former target loses their frenzy.
    effect_i18n:
      es: >-
        La Dama enciende a uno de sus aliados (no puede ser ella misma) dentro de 12" con
        inspiración y una sed insaciable de gloria y honor en nombre de la Profetisa de la Yegua. El
        guerrero objetivo queda ahora en frenesí. Solo un guerrero puede verse afectado por este
        hechizo a la vez; si la Dama elige a un nuevo guerrero, el objetivo anterior pierde su
        frenesí.
  - id: spell.blessings-of-the-mare.aura-of-dauntlessness
    roll: '5'
    name: Aura of Dauntlessness
    name_i18n:
      es: Aura de Impavidez
    difficulty: 10
    effect: >-
      The Dame says a prayer to bestow unwavering courage upon her entire retinue, empowering them
      to face adversity with resolute bravery and unyielding determination on the battlefield. For
      the duration of the battle, the save provided by Dame's and friendly Companion fillies'
      special armour save is increased by 1. The rest of the warband gains a special unmodifiable 6+
      save against all non-magical attacks, this save is in addition to (and taken after) any other
      saves they may have.
    effect_i18n:
      es: >-
        La Dama reza una plegaria para otorgar valor inquebrantable a todo su séquito,
        capacitándolos para enfrentar la adversidad con bravura resuelta y determinación
        inquebrantable en el campo de batalla. Durante el resto de la batalla, la salvación especial
        por armadura de la Dama y de las Potrancas Compañeras amistosas aumenta en 1. El resto de la
        banda obtiene una salvación especial inmodificable de 6+ contra todos los ataques no
        mágicos; esta salvación es adicional a (y se resuelve después de) cualquier otra salvación
        que puedan tener.
  - id: spell.blessings-of-the-mare.dames-charger
    roll: '6'
    name: The Dame's Charger
    name_i18n:
      es: Corcel de la Dama
    difficulty: 8
    effect: >-
      Eerie lights engulf the Dame who suddenly sits upon a spectral steed from ancient history:
      this counts as her becoming mounted on a warhorse with a modified statline. It will remain in
      play until the end of the game or until the Dame is dismounted. The Spectral charger offers no
      armour save like other mounts, but increases the special save from the Dame's own armour by 1.
      In addition, the Spectral charger is such a ghastly apparition that it and its rider cause
      fear. M8 WS4 BS0 S4 T4 W1 I4 A2 Ld7.
    effect_i18n:
      es: >-
        Luces escalofriantes envuelven a la Dama, que de repente se sienta sobre un corcel espectral
        de la historia antigua: esto cuenta como si se montara en un corcel de guerra con una línea
        de características modificada. Permanecerá en juego hasta el final de la partida o hasta que
        la Dama sea desmontada. El corcel espectral no ofrece salvación por armadura como otras
        monturas, pero aumenta en 1 la salvación especial de la armadura de la propia Dama. Además,
        el corcel espectral es una aparición tan espeluznante que él y su jinete causan miedo. M8
        HA4 HP0 F4 R4 H1 I4 A2 L7.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Blessings of the Mare
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/order-of-the-mare
- id: lore.commands
  name: Commands
  name_i18n:
    es: Órdenes
  note: The Command list of the Mazzalupo Wandering Knight (Mordheim Italia, V3.5). Commands do not count
    as spells and the knight is not a wizard, but they are cast following the rules for Magic (difficulty
    listed per Command) during the recovery phase, if the knight is not knocked down, stunned, or out
    of action, instead of running. Commands affect friendly models within 6" that can hear him (not stunned
    or knocked down); models may only benefit from one Command per turn.
  spells:
  - id: spell.commands.raise-our-insignia
    roll: '1'
    name: Raise Our Insignia!
    name_i18n:
      es: ¡Enarbola Nuestra Insignia!
    difficulty: 6
    effect: >-
      Encouraging the Squire to raise a handkerchief in the army's colours, the Mazzalupo regain
      courage, united under the same banner. This Command can only be issued to the Squire if it is
      within 12" and is not fleeing, knocked down, stunned, or taken out of action. Until the
      beginning of the next Shooting phase, every model of the Mazzalupo warband, including the
      Wandering knight, who has line of sight to the Squire can reroll failed Leadership tests,
      including the warband's Rout test.
    effect_i18n:
      es: >-
        Animando al Escudero a enarbolar un pañuelo con los colores del ejército, los Mazzalupo
        recuperan el valor, unidos bajo la misma bandera. Esta Orden solo puede darse al Escudero si
        está a 12" y no está huyendo, derribado, aturdido ni Fuera de Combate. Hasta el comienzo de
        la próxima fase de Disparo, cada modelo de la banda Mazzalupo, incluido el Caballero
        Errante, que tenga línea de visión al Escudero puede repetir las pruebas de Liderazgo
        fallidas, incluida la tirada de Huida de la banda.
  - id: spell.commands.move-ye-miscreant
    roll: '2'
    name: Move, Ye Miscreant!
    name_i18n:
      es: ¡Muévete, Granuja!
    difficulty: 6
    effect: >-
      The booming voice of the Knight Errant urges even the most slothful of the Mazzalupo to spring
      into action. A single Mazzalupo warrior within 6" of the Wandering knight may immediately move
      again up to its maximum Movement distance. If this moves them into base contact with an enemy
      model, they count as charging.
    effect_i18n:
      es: >-
        La voz atronadora del Caballero Andante insta incluso al más perezoso de los Mazzalupo a
        ponerse en acción. Un único guerrero Mazzalupo a 6" del Caballero Errante puede moverse
        inmediatamente de nuevo hasta su distancia máxima de Movimiento. Si esto lo pone en contacto
        base con un modelo enemigo, cuenta como carga.
  - id: spell.commands.follow-me-mine-pugnacious-ones
    roll: '3'
    name: Follow Me, Mine Pugnacious Ones!
    name_i18n:
      es: ¡Seguidme, Peleadores Míos!
    difficulty: 8
    effect: >-
      With heroic demeanour, the Wandering knight rallies his men and bolsters their fighting
      spirit. Members of the Mazzalupo warband within 4" of the Wandering knight gain a +1 bonus to
      hit in hand-to-hand combat until the end of the turn.
    effect_i18n:
      es: >-
        Con aire heroico, el Caballero Errante reúne a sus hombres y vigoriza su espíritu de lucha.
        Los miembros de la banda Mazzalupo a 4" del Caballero Errante obtienen un bonificador de +1
        por impactar en combate cuerpo a cuerpo hasta el final del turno.
  - id: spell.commands.be-on-guard-my-brave-ones
    roll: '4'
    name: Be on Guard, My Brave Ones!
    name_i18n:
      es: ¡Estad Alertas, Valientes Míos!
    difficulty: 7
    effect: >-
      A true commander knows the importance of caution and teaches his comrades that there is no
      shame in fleeing from a fight, only wisdom. Choose a member of the Mazzalupo warband within
      12" that is engaged in hand-to-hand combat. That model can immediately move away from the
      combat up to the maximum distance allowed by their Movement value but cannot come into contact
      with other enemy models.
    effect_i18n:
      es: >-
        Un verdadero comandante conoce la importancia de la cautela y enseña a sus camaradas que no
        hay vergüenza alguna en huir de una pelea, solo sabiduría. Elige a un miembro de la banda
        Mazzalupo a 12" que esté en combate cuerpo a cuerpo. Ese modelo puede alejarse
        inmediatamente del combate hasta la distancia máxima que permita su valor de Movimiento,
        pero no puede entrar en contacto con otros modelos enemigos.
  - id: spell.commands.pay-them-no-heed
    roll: '5'
    name: Pay Them No Heed!
    name_i18n:
      es: ¡No Les Hagáis Caso!
    difficulty: 6
    effect: >-
      Ever watchful of battlefield developments, the Knight Errant issues orders on which targets
      are the highest priority. Choose a Mazzalupo model within 12". Until the next Shooting phase,
      the model can target any enemy warrior even if they are not the closest.
    effect_i18n:
      es: >-
        Siempre atento a la evolución del campo de batalla, el Caballero Andante da órdenes sobre
        qué objetivos son prioritarios. Elige un modelo Mazzalupo a 12". Hasta la próxima fase de
        Disparo, el modelo puede atacar a cualquier guerrero enemigo aunque no sea el más cercano.
  - id: spell.commands.art-thou-ready-to-die-fighting
    roll: '6'
    name: Art Thou Ready to Die Fighting?
    name_i18n:
      es: ¿Estáis Listos a Morir Luchando?
    difficulty: 8
    effect: >-
      The Wandering knight appeals to the tenacity of his men to withstand the enemy's blows. Every
      Mazzalupo model within 4", including the Wandering knight, can only be taken out of action on
      a roll of 6 until the next Mazzalupo turn.
    effect_i18n:
      es: >-
        El Caballero Errante apela a la tenacidad de sus hombres para resistir los golpes del
        enemigo. Todos los modelos Mazzalupo a 4", incluido el Caballero Errante, solo pueden ser
        dejados Fuera de Combate con un resultado de 6 hasta el próximo turno Mazzalupo.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Commands
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/mazzalupo
- id: lore.woodland-incantations
  name: Woodland Incantations
  name_i18n:
    es: Encantamientos del Bosque
  note: The nature-magic spell list of the Wood Elves of Athel Loren Forest Mage.
  spells:
  - id: spell.woodland-incantations.song-of-thorns
    roll: '1'
    name: Song of Thorns
    name_i18n:
      es: Canción de Espinas
    difficulty: 8
    effect: >-
      Branches strike out to the foe under influence of the singer cadence. If no plants are present
      wooden chips fly at the victim, as if they want to be thorns… Victim suffers 2D6 S1 hits,
      range 8".
    effect_i18n:
      es: >-
        Las ramas golpean al enemigo bajo la influencia de la cadencia del cantor. Si no hay plantas
        presentes, astillas de madera vuelan hacia la víctima, como si quisieran ser espinas… La
        víctima sufre 2D6 impactos de F1, alcance 8".
  - id: spell.woodland-incantations.murmuring-of-the-wind
    roll: '2'
    name: Murmuring of the Wind
    name_i18n:
      es: Murmullo del Viento
    difficulty: 7
    effect: >-
      Very softly the wind increases around the caster and takes him wherever he wants. Caster may
      move anywhere within 12", if he gets into HtH it counts as a charge.
    effect_i18n:
      es: >-
        Muy suavemente el viento se intensifica alrededor del lanzador y lo lleva a donde quiera. El
        lanzador puede moverse a cualquier lugar dentro de 12", si entra en combate cuerpo a cuerpo
        cuenta como carga.
  - id: spell.woodland-incantations.the-rain-song
    roll: '3'
    name: The Rain Song
    name_i18n:
      es: La Canción de la Lluvia
    difficulty: 9
    effect: >-
      The air around the caster becomes moist and it starts to rain, until it looks like a major
      downpour… Everything, except Woodelves, within 6" of the caster suffers -1 to hit and suffers
      -1 Initiative. This lasts until the beginning of the caster's next magic phase.
    effect_i18n:
      es: >-
        El aire alrededor del lanzador se vuelve húmedo y empieza a llover, hasta que parece un gran
        diluvio… Todo, excepto los Elfos del Bosque, a 6" del lanzador sufre -1 al impacto y -1
        Iniciativa. Esto dura hasta el comienzo de la siguiente fase de magia del lanzador.
  - id: spell.woodland-incantations.lyrics-of-feral-infatuation
    roll: '4'
    name: Lyrics of Feral Infatuation
    name_i18n:
      es: Letras de Enamoramiento Feral
    difficulty: 8
    effect: >-
      This soothing song seems to calm even the most ferocious monsters and sends them into a
      lethargic state. Any animal or monster has to pass a Ld-test, on his own Ld, in order to
      attack an opponent. If it fails it will do nothing else that turn, not even fighting back if
      attacked.
    effect_i18n:
      es: >-
        Esta canción apacible parece calmar incluso a los monstruos más feroces y los envía a un
        estado letárgico. Cualquier animal o monstruo debe superar una prueba de Ld, con su propia
        Ld, para atacar a un oponente. Si falla, no hará nada más ese turno, ni siquiera defenderse
        si es atacado.
  - id: spell.woodland-incantations.song-of-the-sun
    roll: '5'
    name: Song of the Sun
    name_i18n:
      es: Canción del Sol
    difficulty: 6
    effect: >-
      While the caster sings his victim believes he is in a scorching desert. His movement slows and
      throat becomes parched. The target must be within 18" and is -1M until the caster's next magic
      phase, he also must make a test, if he fails, he suffers a S4 hit.
    effect_i18n:
      es: >-
        Mientras el lanzador canta, su víctima cree estar en un desierto abrasador. Su movimiento se
        ralentiza y su garganta se seca. El objetivo debe estar a 18" y sufre -1M hasta la siguiente
        fase de magia del lanzador; también debe hacer una prueba, si falla, sufre un impacto de F4.
  - id: spell.woodland-incantations.eagles-cry
    roll: '6'
    name: Eagle's Cry
    name_i18n:
      es: Grito del Águila
    difficulty: 8
    effect: >-
      The caster utters a melodious cry, which sounds like a great eagle. This inspires the elves so
      much they gain the legendary sight of Thuarindir. All Wood elves within 6" gain +1 to hit and
      +1 on the critical hit table. This lasts until the beginning of the caster's next magic phase.
    effect_i18n:
      es: >-
        El lanzador emite un grito melodioso, que suena como una gran águila. Esto inspira tanto a
        los elfos que ganan la legendaria visión de Thuarindir. Todos los Elfos del Bosque a 6"
        ganan +1 al impacto y +1 en la tabla de impactos críticos. Esto dura hasta el comienzo de la
        siguiente fase de magia del lanzador.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Woodland Incantations
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/wood-elves-of-athel-loren
- id: lore.charms-and-hexes-strigos
  name: Charms & Hexes
  name_i18n:
    es: Encantos y Maldiciones
  note: 'The spell list of the Survivors of Strigos Seer. Newly ingested during the final completeness
    sweep of 2026-09-15; previously deferred as out of scope. VARIANT of the KB lore.charms-and-hexes
    (used by the Witch): the Sylvania page prints the six-spell list with different difficulties (Scry
    8 vs 6, Curse 8 vs 6, Dust of the Blind 9) and expanded wording, and its sixth spell is Cure of Thorns
    (D9) where the KB keeps Cure (D6). Kept apart so a source change stays auditable.'
  spells:
  - id: spell.charms-and-hexes-strigos.scry
    roll: '1'
    name: Scry
    name_i18n:
      es: Adivinación
    difficulty: 8
    effect: >-
      The Seer uses ancient scrying crystals to foretell the future and influence the actions of her
      comrades. For the duration of the turn, one hero or henchman may re-roll D3 dice rolls and
      modify the results by +/- 1.
    effect_i18n:
      es: >-
        La Vidente usa antiguos cristales adivinatorios para predecir el futuro e influir en las
        acciones de sus compañeros. Durante el turno, un héroe o secuaz puede repetir tiradas D3 de
        dados y modificar los resultados en +/- 1.
  - id: spell.charms-and-hexes-strigos.curse
    roll: '2'
    name: Curse
    name_i18n:
      es: Maldición
    difficulty: 8
    effect: >-
      The Seer bestows a powerful curse on one of her enemies that saps their confidence and
      resolve. One enemy model within 12" of the Seer must re-roll all successful dice rolls for the
      duration of this and their next turn.
    effect_i18n:
      es: >-
        La Vidente lanza una poderosa maldición sobre uno de sus enemigos que socava su confianza y
        determinación. Un modelo enemigo a 12" de la Vidente debe repetir todas las tiradas de dados
        exitosas durante este turno y el siguiente.
  - id: spell.charms-and-hexes-strigos.dust-of-the-blind
    roll: '3'
    name: Dust of the Blind
    name_i18n:
      es: Polvo del Ciego
    difficulty: 9
    effect: >-
      Casting a handful of dust into the air, the Seer blows it around her blinding her enemies. One
      enemy model within 16" of the Seer is struck instantly blind. They may not shoot, charge, or
      run, are at half Weapon Skill, and will move in a random direction at the start of their turn.
      The Blindness lasts until the Seer casts another spell or moves.
    effect_i18n:
      es: >-
        Lanzando un puñado de polvo al aire, la Vidente lo esparce cegando a sus enemigos. Un modelo
        enemigo a 16" de la Vidente queda instantáneamente ciego. No puede disparar, cargar ni
        correr, tiene la Habilidad de Combate a la mitad y se moverá en una dirección aleatoria al
        comienzo de su turno. La Ceguera dura hasta que la Vidente lance otro hechizo o se mueva.
  - id: spell.charms-and-hexes-strigos.age-of-stone
    roll: '4'
    name: Age of Stone
    name_i18n:
      es: Era de Piedra
    difficulty: 8
    effect: >-
      Whispering words of ancient power, the Seer causes an enemy to age rapidly before their very
      eyes, making them weak and feeble. One enemy model within 12" of the Seer will be severely
      debilitated and all of their characteristics are reduced by -1 for the duration of this and
      their next turn.
    effect_i18n:
      es: >-
        Susurrando palabras de poder ancestral, la Vidente hace que un enemigo envejezca rápidamente
        ante sus ojos, dejándolo débil y endeble. Un modelo enemigo a 12" de la Vidente quedará
        gravemente debilitado y todas sus características se reducen en -1 durante este turno y el
        siguiente.
  - id: spell.charms-and-hexes-strigos.warriors-bane
    roll: '5'
    name: Warrior's Bane
    name_i18n:
      es: Ruina del Guerrero
    difficulty: 7
    effect: >-
      Muttering a dark and malicious incantation, the Seer causes a warrior's grip to loosen, making
      it almost impossible for them to attack. One enemy model within 18" of the Seer will be unable
      to use any of their weapons as they perpetually slip from their grasp. They will be unable to
      shoot and count as fighting with fists in hand-to-hand combat. The enchantment lasts for the
      duration of this and their next turn.
    effect_i18n:
      es: >-
        Recitando un conjuro oscuro y malicioso, la Vidente hace que el agarre de un guerrero se
        afloje, volviendo casi imposible que ataque. Un modelo enemigo a 18" de la Vidente no podrá
        usar ninguna de sus armas, pues se le escapan constantemente. No podrá disparar y contará
        como combatir con los puños en el combate cuerpo a cuerpo. El encantamiento dura este turno
        y el siguiente.
  - id: spell.charms-and-hexes-strigos.cure-of-thorns
    roll: '6'
    name: Cure of Thorns
    name_i18n:
      es: Curación de Espinas
    difficulty: 9
    effect: >-
      A faint aura extends from the Seer's body. All who are touched by it feel its power. The Seer
      attempts to aid her comrades by passing their injuries to their enemies. For every Knocked
      Down or Stunned friendly model within 6", one enemy model within the same area is Knocked Down
      or Stunned. There must be an even transfer. If no enemy models are in range, the Seer may
      instead choose to take the injury herself to stand a friendly model up. Models who have just
      stood up act as such and can only cast spells or shoot, but may not charge or run.
    effect_i18n:
      es: >-
        Un aura tenue se extiende desde el cuerpo de la Vidente. Todos los que la tocan sienten su
        poder. La Vidente intenta ayudar a sus compañeros transfiriendo sus heridas a sus enemigos.
        Por cada modelo amistoso Derribado o Aturdido a 6", un modelo enemigo en la misma zona queda
        Derribado o Aturdido. La transferencia debe ser equitativa. Si no hay modelos enemigos al
        alcance, la Vidente puede elegir recibir la herida ella misma para levantar a un modelo
        amistoso. Los modelos que acaban de levantarse actúan como tales y solo pueden lanzar
        hechizos o disparar, pero no cargar ni correr.
  source_refs:
  - manual: mordheimer.net
    printed_page: 0
    section: Charms & Hexes
    url: https://mordheimer.net/docs/warbands/grade-2a-warbands/survivors-of-strigos
- id: lore.dark-arts-strigos
  name: Dark Arts
  name_i18n:
    es: Artes Oscuras
  note: The spell list of the Survivors of Strigos Strigoi Vampire. Newly ingested during the final completeness
    sweep of 2026-09-15; previously deferred as out of scope.
  spells:
  - id: spell.dark-arts-strigos.fires-of-strigos
    roll: '1'
    name: Fires of Strigos
    name_i18n:
      es: Fuegos de Strigos
    difficulty: 7
    effect: >-
      Borne from the eve of Mourkain's destruction, the Strigoi releases his hatred in a fiery ball
      of death. The fireball has a range of 18" and causes one Strength 4 hit. It strikes the first
      model in its path. Armour saves are taken as normal (i.e. at -1 AS).
    effect_i18n:
      es: >-
        Nacido de la víspera de la destrucción de Mourkain, el Strigoi libera su odio en una
        ardiente bola de fuego mortal. La bola de fuego tiene un alcance de 18" y causa un impacto
        de Fuerza 4. Golpea al primer modelo en su trayectoria. Las tiradas de salvación por
        armadura se hacen con normalidad (es decir, a -1 AS).
  - id: spell.dark-arts-strigos.winged-flight
    roll: '2'
    name: Winged Flight
    name_i18n:
      es: Vuelo Alado
    difficulty: 9
    effect: >-
      The Strigoi sprouts great wings and takes to the night sky. The Vampire may immediately move
      anywhere within 18", including into base contact with an enemy, in which case he counts as
      charging. If he engages a fleeing enemy in the close combat phase, he will score 1 automatic
      hit and then his opponent will flee again.
    effect_i18n:
      es: >-
        El Strigoi despliega grandes alas y se lanza al cielo nocturno. El Vampiro puede moverse
        inmediatamente a cualquier lugar dentro de 18", incluyendo contacto base con base con un
        enemigo, en cuyo caso cuenta como cargando. Si alcanza a un enemigo en huida en la fase de
        combate cuerpo a cuerpo, conseguirá 1 impacto automático y su oponente volverá a huir.
  - id: spell.dark-arts-strigos.lifestealer
    roll: '3'
    name: Lifestealer
    name_i18n:
      es: Robavida
    difficulty: 10
    effect: >-
      The Strigoi sucks out the very essence of life from his victim, stealing its vigor for
      himself. You may choose a single model within 6". The target suffers a wound (no save
      allowed), and the Vampire gains an extra Wound for the duration of the battle. This may take
      the Vampire's Wounds above his original maximum value. This spell will not affect the
      Possessed. Should the Vampire attempt to cast this spell upon another Vampire, increase the
      difficulty by 1.
    effect_i18n:
      es: >-
        El Strigoi absorbe la esencia misma de la vida de su víctima, robando su vigor para sí.
        Puedes elegir un único modelo a 6". El objetivo sufre una herida (sin tirada de salvación) y
        el Vampiro gana una Herida adicional durante el resto de la batalla. Esto puede llevar las
        Heridas del Vampiro por encima de su valor máximo original. Este hechizo no afecta a los
        Posídos. Si el Vampiro intenta lanzar este hechizo sobre otro Vampiro, aumenta la dificultad
        en 1.
