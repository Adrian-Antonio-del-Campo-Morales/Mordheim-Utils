[build-system]
requires = ["setuptools>=69", "cython>=3.1"]
build-backend = "setuptools.build_meta"

[project]
name = "mordheim-utils"
version = "2.0.0a1"
description = "Shared Mordheim tooling: knowledge-driven duel engine and campaign manager"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "PyYAML>=6,<7",
    "openpyxl>=3.1,<4",
    "Pillow>=10,<13",
    "jsonschema>=4.18,<5",
    "mini-racer==0.14.1",
]

[project.scripts]
mordheim-combat-lab = "mordheim_combat_lab.cli.commands:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-xdist>=3.6,<4", "coverage>=7.0", "wheel>=0.43", "pyinstaller>=6.0"]

[tool.setuptools.packages.find]
where = ["packages/python/combat-engine", "packages/python/roster-construction", "packages/python/core", "packages/python/knowledge", "apps/combat-lab"]

[tool.setuptools.package-data]
mordheim_construction = ["_eligibility.js"]

[tool.pytest.ini_options]
pythonpath = ["packages/python/combat-engine", "packages/python/roster-construction", "packages/python/core", "packages/python/knowledge", "apps/combat-lab"]
testpaths = ["tests"]
addopts = "--strict-markers"
# One primary category per executable test, chosen from its assertions (see
# docs/reference/test-sequence.md). Registering them here makes
# `pytest -m <category>` the selection mechanism and rejects unknown markers.
markers = [
    "architecture: component and dependency boundaries are respected",
    "data_contract: documents and requests conform to structural contracts",
    "knowledge_integrity: canonical KB records are consistent and preserve source facts",
    "data_transport: information survives generation, loading and projection",
    "eligibility: a choice is offered, admitted or rejected for the correct reason",
    "compilation: an admitted configuration becomes the correct executable representation",
    "operator: a local operation produces its defined value or distribution",
    "rule_behavior: one game rule has its source-defined consequences",
    "interaction: multiple rules or phases compose in the required order",
    "workflow: an application or execution service connects its steps correctly",
    "persistence: saved state is preserved and invalid storage is handled",
    "presentation: visible and interactive results are correct",
    "end_to_end: a complete connected product path meets observable acceptance",
    "test_infrastructure: testing and diagnostic mechanisms detect faults reliably",
    "evidence: coverage, provenance and certification records are valid",
    "parity: implementations or execution modes agree under a defined comparison",
    "performance: a measured execution or delivery budget is met",
    "delivery: the built or packaged product contains required usable artefacts",
]
