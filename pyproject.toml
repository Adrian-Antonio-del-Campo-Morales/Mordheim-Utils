[build-system]
requires = ["setuptools>=69", "cython>=3.1"]
build-backend = "setuptools.build_meta"

[project]
name = "mordheim-utils"
version = "2.0.0a1"
description = "Shared Mordheim tooling: knowledge-driven duel engine and campaign manager"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "PyYAML>=6,<7",
    "openpyxl>=3.1,<4",
    "Pillow>=10,<13",
    "jsonschema>=4.18,<5",
    "mini-racer==0.14.1",
]

[project.scripts]
mordheim-combat-lab = "mordheim_combat_lab.cli.commands:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-xdist>=3.6,<4", "coverage>=7.0", "wheel>=0.43", "pyinstaller>=6.0"]

[tool.setuptools.packages.find]
where = ["packages/python/combat-engine", "packages/python/roster-construction", "packages/python/core", "packages/python/knowledge", "apps/combat-lab"]

[tool.setuptools.package-data]
mordheim_construction = ["_eligibility.js"]

[tool.pytest.ini_options]
pythonpath = ["packages/python/combat-engine", "packages/python/roster-construction", "packages/python/core", "packages/python/knowledge", "apps/combat-lab"]
testpaths = ["tests"]
addopts = "--strict-markers"
# One phase category per executable test, chosen from its assertions (see
# docs/reference/test-sequence.md). Registering them here makes
# `pytest -m <category>` the selection mechanism and rejects unknown markers.
# phase0..phase7 are the functional dependency order; the last three are
# additional categories outside that sequence.
markers = [
    "phase0_preflight: architecture boundaries and the test infrastructure itself",
    "phase1_kb_contracts: KB schemas, references, integrity, loading and its contracts",
    "phase2_construction: eligibility, profiles, compilation and rule grants produce fighters",
    "phase3_rules: modular conditions, operators, effects and isolated rule application",
    "phase4_modular: modular interactions, combat sequences, integration and E2E",
    "phase5_vectorized: vectorized engine tests and parity against the oracle",
    "phase6_native: native engine tests and parity against the oracle",
    "phase7_warband: Warband Manager persistence, flows, presentation, integration and E2E",
    "evidence: evidence generation, coverage, provenance and certification records",
    "packaging: the built or packaged product contains required usable artefacts",
    "performance: a measured execution or delivery budget is met",
]
