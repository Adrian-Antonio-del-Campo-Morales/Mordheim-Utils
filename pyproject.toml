[build-system]
requires = ["setuptools>=69", "cython>=3.1"]
build-backend = "setuptools.build_meta"

[project]
name = "mordheim-utils"
version = "2.0.0a1"
description = "Shared Mordheim tooling: knowledge-driven duel engine and campaign manager"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "PyYAML>=6,<7",
    "openpyxl>=3.1,<4",
    "fpdf2>=2.7,<3",
    "Pillow>=10,<13",
    "jsonschema>=4.18,<5",
]

[project.scripts]
mordheim-combat-lab = "mordheim_combat_lab.cli.commands:main"
mordheim-campaign-manager = "mordheim_desktop.app:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "coverage>=7.0", "wheel>=0.43", "pyinstaller>=6.0"]

[tool.setuptools.packages.find]
where = ["packages/python/combat-engine", "packages/python/roster-construction", "packages/python/core", "packages/python/knowledge", "packages/python/adapters/desktop-ui", "packages/python/campaign", "apps/combat-lab", "apps/warband-manager-desktop"]

[tool.pytest.ini_options]
pythonpath = ["packages/python/combat-engine", "packages/python/roster-construction", "packages/python/core", "packages/python/knowledge", "packages/python/adapters/desktop-ui", "packages/python/campaign", "apps/combat-lab", "apps/warband-manager-desktop"]
testpaths = ["tests"]
