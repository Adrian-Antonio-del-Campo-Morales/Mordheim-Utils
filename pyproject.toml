[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mordheim-utils"
version = "2.0.0a1"
description = "Minimal precompiled-test slice for modular and NumPy combat engines"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-xdist>=3.6,<4"]

[tool.setuptools.packages.find]
where = ["packages/python/combat-engine", "packages/python/core"]

[tool.pytest.ini_options]
pythonpath = [".", "packages/python/combat-engine", "packages/python/core"]
testpaths = ["tests/engines/modular", "tests/engines/vectorized", "tests/engines/shared"]
addopts = "--strict-markers"
markers = [
    "evidence: fixture and contract evidence",
    "performance: runtime and execution measurements",
]
