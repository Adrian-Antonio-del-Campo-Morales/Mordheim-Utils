schema_version: 1
specifications:
- id: natural-attacks-beastmen
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: permanent
  sources:
  - {target: rule/mordheim/beastmen-raiders/warhounds-of-chaos--natural-weapons/profile.natural-attacks, digest: 324cb141c7199e456730a15098964ba730fba0f0620c940194749a9d68705f98}
  interpretation: El perfil lucha con dientes y garras sin la penalizacion de -1 Fuerza del puño.
    Conserva exactamente sus 1 ataques de perfil y cada ataque se asigna al arma natural.
  cases:
  - id: recipient
    roles: [grant]
    operation: grant
    defender: {collection: mordheim, band_id: beastmen-raiders, profile_id: warhounds-of-chaos}
    context: {rule_id: warhounds-of-chaos--natural-weapons}
    expect: {result.recipients: [warhounds-of-chaos]}
  - id: compiled-strength
    roles: [compiled, active, consumer]
    operation: strength
    attacker: {collection: mordheim, band_id: beastmen-raiders, profile_id: warhounds-of-chaos}
    expect: {result.wound: 4, result.armour: 4}
  - id: attack-count
    roles: [consumer, boundary]
    operation: attacks
    attacker: {collection: mordheim, band_id: beastmen-raiders, profile_id: warhounds-of-chaos}
    expect: {result.attacks: 1}
  - id: natural-allocation
    roles: [consumer]
    operation: allocate
    attacker: {collection: mordheim, band_id: beastmen-raiders, profile_id: warhounds-of-chaos}
    expect: {result.count: 1, result.weapons.0.tags: [weapon.natural-attacks, material.normal]}
  - id: untrained-fist-control
    roles: [inactive]
    operation: strength
    attacker: {main_weapon_id: weapon.fist}
    expect: {result.wound: 2, result.armour: 2}
  mutations:
  - id: remove-natural-weapon
    path: attacker.main_weapon.strength_bonus
    value: -1
    cases: [compiled-strength]
