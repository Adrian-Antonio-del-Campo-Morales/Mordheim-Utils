schema_version: 1
specifications:
- id: khemri-foreign-native-construction
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: construction
  sources:
  - {target: rule/trollheim/khemri-lahmian-brotherhood/band--background-selection/compiler.foreign-or-native-background, digest: 3f77ed18714849cd5582c7c7147cd2eb18a4a8af38506b839786fa454ffc6fa2}
  interpretation: FighterBuild representa el trasfondo aplicable a su construcción mediante background.foreign o background.native; no puede combinar ambos. Los cambios de campaña posteriores quedan fuera del runtime del duelo.
  cases:
  - id: alternatives-exclusive
    roles: [grant, accepted, rejected, boundary]
    operation: selection_choices
    attacker: {collection: trollheim, band_id: khemri-lahmian-brotherhood, profile_id: lahmian-vampire}
    context: {choices: {foreign: {variant_ids: [background.foreign]}, native: {variant_ids: [background.native]}, both: {variant_ids: [background.foreign, background.native]}}}
    expect: {result.accepted: [foreign, native], result.rejected: {both: choose exactly one Foreign or Native background}}
  - id: foreign-only-profile
    roles: [consumer]
    operation: selection_choices
    attacker: {collection: trollheim, band_id: khemri-lahmian-brotherhood, profile_id: blood-slaves, variant_ids: [background.foreign]}
    context: {choices: {foreign: {variant_ids: [background.foreign]}, native: {variant_ids: [background.native]}}}
    expect: {result.accepted: [foreign], result.rejected: {native: blood-slaves requires the Foreign background}}
  - id: native-only-profile
    operation: selection_choices
    attacker: {collection: trollheim, band_id: khemri-lahmian-brotherhood, profile_id: spirits, variant_ids: [background.native]}
    context: {choices: {native: {variant_ids: [background.native]}, foreign: {variant_ids: [background.foreign]}}}
    expect: {result.accepted: [native], result.rejected: {foreign: spirits requires the Native background}}
  - id: contract
    operation: construction_tag_presence
    attacker: {collection: trollheim, band_id: khemri-lahmian-brotherhood, profile_id: lahmian-vampire}
    context: {tag: compiler.foreign-or-native-background}
    expect: {result.present: true}
  mutations:
  - {id: remove-background-contract, path: attacker.construction_tags, value: [], cases: [contract]}
