schema_version: 1
specifications:
- id: undead-band-poison-mordheim-tomb-guardians
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: permanent
  sources:
  - {target: rule/mordheim/tomb-guardians/band--immune-to-poison/trait.poison-immune, digest: f7297b0c27c13cb631e79e3bb02ad66bead90e8587748ead0674b661922620f6}
  depends_on: [mechanic/preparation.tears-of-shallaya]
  interpretation: Immune to Poison, reglas generales de no muertos (Mordheimer o Khemri pp.43,53,85).
    Solo los perfiles con Undead reciben esta concesion. Los seres vivos de la banda no la heredan.
    Stone Golem posee una inmunidad propia, no esta concesion. La matriz completa de venenos
    reutiliza el consumidor verificado con Tears of Shallaya, sin conceder esa preparacion.
  cases:
  - id: exact-undead-recipients
    roles: [grant]
    operation: grant
    defender: {collection: mordheim, band_id: tomb-guardians, profile_id: acolytes}
    context: {rule_id: band--immune-to-poison}
    expect: {result.recipients: [acolytes, liche-priest, skeleton-warriors, tomb-guardians, tomb-lord]}
  - id: acolytes-immune
    roles: [compiled, active, consumer, boundary]
    operation: strength
    attacker: {main_weapon_id: weapon.mace, main_poison_id: poison.black-venom}
    defender: {collection: mordheim, band_id: tomb-guardians, profile_id: acolytes}
    expect: {defender.global_effects.poison_immunity: true, result.wound: 3, result.armour: 3}
  - id: liche-priest-immune
    roles: [compiled, active, consumer, boundary]
    operation: strength
    attacker: {main_weapon_id: weapon.mace, main_poison_id: poison.black-venom}
    defender: {collection: mordheim, band_id: tomb-guardians, profile_id: liche-priest}
    expect: {defender.global_effects.poison_immunity: true, result.wound: 3, result.armour: 3}
  - id: skeleton-warriors-immune
    roles: [compiled, active, consumer, boundary]
    operation: strength
    attacker: {main_weapon_id: weapon.mace, main_poison_id: poison.black-venom}
    defender: {collection: mordheim, band_id: tomb-guardians, profile_id: skeleton-warriors}
    expect: {defender.global_effects.poison_immunity: true, result.wound: 3, result.armour: 3}
  - id: tomb-guardians-immune
    roles: [compiled, active, consumer, boundary]
    operation: strength
    attacker: {main_weapon_id: weapon.mace, main_poison_id: poison.black-venom}
    defender: {collection: mordheim, band_id: tomb-guardians, profile_id: tomb-guardians}
    expect: {defender.global_effects.poison_immunity: true, result.wound: 3, result.armour: 3}
  - id: tomb-lord-immune
    roles: [compiled, active, consumer, boundary]
    operation: strength
    attacker: {main_weapon_id: weapon.mace, main_poison_id: poison.black-venom}
    defender: {collection: mordheim, band_id: tomb-guardians, profile_id: tomb-lord}
    expect: {defender.global_effects.poison_immunity: true, result.wound: 3, result.armour: 3}
  - id: tomb-scorpions-living-control
    roles: [compiled, inactive, boundary]
    operation: strength
    attacker: {main_weapon_id: weapon.mace, main_poison_id: poison.black-venom}
    defender: {collection: mordheim, band_id: tomb-guardians, profile_id: tomb-scorpions}
    expect: {defender.global_effects.poison_immunity: false, result.wound: 4, result.armour: 4}
  - id: no-poison-no-change
    roles: [boundary]
    operation: strength
    attacker: {main_weapon_id: weapon.mace}
    defender: {collection: mordheim, band_id: tomb-guardians, profile_id: acolytes}
    expect: {result.wound: 3, result.armour: 3}
  mutations:
  - id: remove-undead-immunity
    changes:
    - {path: defender.global_effects.poison_immunity, value: false}
    - {path: defender.global_effects.tags, value: []}
    cases: [acolytes-immune, liche-priest-immune, skeleton-warriors-immune, tomb-guardians-immune, tomb-lord-immune]
