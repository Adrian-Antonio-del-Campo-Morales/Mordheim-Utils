schema_version: 1
specifications:
- id: editorial-red-fury-grant
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: permanent
  sources:
  - target: rule/trollheim/chaos-streets-undead-bloodlines/band--blood-dragon-power-red-fury/skill.red-fury
    digest: 5798dfcd95d5a07c60942e6e30be5d6e27161e2d6aa6ed5519c4fbe73307f32e
  depends_on: [mechanic/skill.red-fury]
  interpretation: Red Fury grants the Blood Dragon Vampire one additional Attack, giving three rather than two.
  cases:
  - id: exact-recipient
    roles: [grant, compiled]
    operation: selectable_grant
    defender: {collection: trollheim, band_id: chaos-streets-undead-bloodlines, profile_id: blood-dragon-vampire}
    context: {rule_id: band--blood-dragon-power-red-fury}
    expect: {result.recipients: [blood-dragon-vampire]}
  - id: granted-consumer
    roles: [consumer, boundary]
    operation: attacks
    attacker:
      collection: trollheim
      band_id: chaos-streets-undead-bloodlines
      profile_id: blood-dragon-vampire
      special_rule_ids: [band--blood-dragon-power-red-fury]
    expect:
      attacker.global_effects.attacks_bonus: 1
      result.attacks: 3
  - id: without-grant
    roles: [boundary]
    operation: attacks
    attacker: {collection: trollheim, band_id: chaos-streets-undead-bloodlines, profile_id: blood-dragon-vampire}
    expect:
      result.attacks: 2
  mutations:
  - id: remove-contribution
    path: attacker.global_effects.attacks_bonus
    value: 0
    cases: [granted-consumer]
