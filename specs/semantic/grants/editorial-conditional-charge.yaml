- id: conditional-berserk-norse-explorers-btb
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: contextual
  sources:
  - target: rule/mordheim/norse-explorers-btb/band--norse-special-skills-berserk-charge/special-rule.band--norse-special-skills-berserk-charge
    digest: 862277247e3dcee113bd62fc2dae44bc636d875c5525b1822a52b7384b17ea25
  interpretation: 'Norse special skills / Berserk Charge: repite fallos al cargar exclusivamente con hacha o arma
    a dos manos. No exige primera ronda. HA4 contra HA3 impacta a 3+: 2/3 sin repetición y 8/9 con ella. Cada variante
    prueba la lista exacta de destinatarios.'
  cases:
  - id: recipients
    roles:
    - grant
    operation: selectable_grant
    defender:
      band_id: norse-explorers-btb
      profile_id: jarl
    context:
      rule_id: band--norse-special-skills-berserk-charge
    expect:
      result.recipients:
      - beserkers
      - bondsmen
      - jarl
      - wulfen
  - id: axe-false-false
    roles:
    - inactive
    - consumer
    - boundary
    operation: hit
    attacker:
      band_id: norse-explorers-btb
      profile_id: jarl
      special_rule_ids:
      - band--norse-special-skills-berserk-charge
      main_weapon_id: weapon.axe
    context:
      first_round: false
      charging: false
    distribution:
      observable: result.success
      max_rolls: 2
      expected:
        'true': 2/3
        'false': 1/3
