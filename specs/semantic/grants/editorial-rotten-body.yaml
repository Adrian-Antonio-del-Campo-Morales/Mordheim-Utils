schema_version: 1
specifications:
- id: rotten-body-mordheim
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: permanent
  sources:
  - {target: rule/mordheim/skaven-clan-pestilens/band--clan-pestilens-special-skills-rotten-body/trait.poison-immune, digest: 198c0429d4388eb43905de6eb2c0c25c7386eed7d7863872f27eed028681240a}
  depends_on: [mechanic/preparation.tears-of-shallaya]
  interpretation: Clan Pestilens Special Skills / Rotten Body (Mordheimer y Lustria p.80).
    Inmunidad al veneno al elegir la habilidad, no innata a todos los Pestilens. La recuperacion de campana
    del incensario queda fuera del scope. La matriz de los nueve venenos comparte el consumidor de inmunidad
    ya probado por Tears of Shallaya; no se concede esa preparacion al heroe.
  cases:
  - id: exact-recipients
    roles: [grant]
    operation: selectable_grant
    defender: {collection: mordheim, band_id: skaven-clan-pestilens, profile_id: plague-priest}
    context: {rule_id: band--clan-pestilens-special-skills-rotten-body}
    expect: {result.recipients: [monk-initiates, pestilens-sorcerer, plague-monks, plague-priest]}
  - id: monk-initiates-venom-cancelled
    roles: [compiled, active, consumer]
    operation: strength
    attacker: {main_weapon_id: weapon.mace, main_poison_id: poison.black-venom}
    defender: {collection: mordheim, band_id: skaven-clan-pestilens, profile_id: monk-initiates, special_rule_ids: [band--clan-pestilens-special-skills-rotten-body]}
    expect: {defender.global_effects.poison_immunity: true, result.wound: 3, result.armour: 3}
  - id: pestilens-sorcerer-venom-cancelled
    roles: [compiled, active, consumer]
    operation: strength
    attacker: {main_weapon_id: weapon.mace, main_poison_id: poison.black-venom}
    defender: {collection: mordheim, band_id: skaven-clan-pestilens, profile_id: pestilens-sorcerer, special_rule_ids: [band--clan-pestilens-special-skills-rotten-body]}
    expect: {defender.global_effects.poison_immunity: true, result.wound: 3, result.armour: 3}
  - id: plague-monks-venom-cancelled
    roles: [compiled, active, consumer]
    operation: strength
    attacker: {main_weapon_id: weapon.mace, main_poison_id: poison.black-venom}
    defender: {collection: mordheim, band_id: skaven-clan-pestilens, profile_id: plague-monks, special_rule_ids: [band--clan-pestilens-special-skills-rotten-body]}
    expect: {defender.global_effects.poison_immunity: true, result.wound: 3, result.armour: 3}
  - id: plague-priest-venom-cancelled
    roles: [compiled, active, consumer]
    operation: strength
    attacker: {main_weapon_id: weapon.mace, main_poison_id: poison.black-venom}
    defender: {collection: mordheim, band_id: skaven-clan-pestilens, profile_id: plague-priest, special_rule_ids: [band--clan-pestilens-special-skills-rotten-body]}
    expect: {defender.global_effects.poison_immunity: true, result.wound: 3, result.armour: 3}
  - id: without-selection-venom-applies
    roles: [inactive]
    operation: strength
    attacker: {main_weapon_id: weapon.mace, main_poison_id: poison.black-venom}
    defender: {collection: mordheim, band_id: skaven-clan-pestilens, profile_id: plague-priest}
    expect: {defender.global_effects.poison_immunity: false, result.wound: 4, result.armour: 4}
  - id: no-poison-ordinary-strength
    roles: [boundary]
    operation: strength
    attacker: {main_weapon_id: weapon.mace}
    defender: {collection: mordheim, band_id: skaven-clan-pestilens, profile_id: plague-priest, special_rule_ids: [band--clan-pestilens-special-skills-rotten-body]}
    expect: {result.wound: 3, result.armour: 3}
  mutations:
  - id: remove-selected-immunity
    changes:
    - {path: defender.global_effects.poison_immunity, value: false}
    - {path: defender.global_effects.tags, value: []}
    cases: [plague-priest-venom-cancelled, plague-monks-venom-cancelled, pestilens-sorcerer-venom-cancelled, monk-initiates-venom-cancelled]
