schema_version: 1
specifications:
- id: stacking-hide-shaggy-hide
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: local
  sources:
  - {target: rule/mordheim/beastmen-raiders/band--beastmen-special-skills-shaggy-hide/trait.natural-armour-save, digest: af6e65a8569bfbcca94fafc433b3481b875e5fc3d908b37071f2ba1456a63549}
  - {target: rule/mordheim/beastmen-raiders/band--beastmen-special-skills-shaggy-hide/trait.natural-armour-stacks, digest: af6e65a8569bfbcca94fafc433b3481b875e5fc3d908b37071f2ba1456a63549}
  interpretation: Mordheimer / Beastmen Special Skills / Shaggy Hide.
    Armadura natural 6+ acumulable con equipo; armadura ligera 6+ y piel producen 5+,
    mas escudo producen 4+. Fuerza 4 empeora un punto; ignorar armaduras suprime la salvacion.
    No se trata de una salvacion especial ni de una segunda tirada independiente.
  cases:
  - id: recipients
    roles: [grant]
    operation: selectable_grant
    defender: {band_id: beastmen-raiders, profile_id: beastmen-chieftain}
    context: {rule_id: band--beastmen-special-skills-shaggy-hide}
    expect: {result.recipients: [beastmen-chieftain, beastmen-shaman, bestigors, centigors]}
  - id: beastmen-shaman-selected-consumer
    roles: [compiled, active, consumer]
    operation: armour
    attacker: {main_weapon_id: weapon.mace}
    defender: {band_id: beastmen-raiders, profile_id: beastmen-shaman, special_rule_ids: [band--beastmen-special-skills-shaggy-hide]}
    rolls: [{key: armour, value: 6}]
    expect: {result.target: 6, result.saved: true}
  - id: bestigors-selected-consumer
    roles: [compiled, active, consumer]
    operation: armour
    attacker: {main_weapon_id: weapon.mace}
    defender: {band_id: beastmen-raiders, profile_id: bestigors, special_rule_ids: [band--beastmen-special-skills-shaggy-hide]}
    rolls: [{key: armour, value: 6}]
    expect: {result.target: 6, result.saved: true}
  - id: centigors-selected-consumer
    roles: [compiled, active, consumer]
    operation: armour
    attacker: {main_weapon_id: weapon.mace}
    defender: {band_id: beastmen-raiders, profile_id: centigors, special_rule_ids: [band--beastmen-special-skills-shaggy-hide]}
    rolls: [{key: armour, value: 6}]
    expect: {result.target: 6, result.saved: true}
  - id: gor-cannot-select-skill
    roles: [rejected]
    operation: compile
    defender: {band_id: beastmen-raiders, profile_id: gor, special_rule_ids: [band--beastmen-special-skills-shaggy-hide]}
    reject: special rule is not available
  - id: ungor-cannot-select-skill
    roles: [rejected]
    operation: compile
    defender: {band_id: beastmen-raiders, profile_id: ungor, special_rule_ids: [band--beastmen-special-skills-shaggy-hide]}
    reject: special rule is not available
  - id: minotaur-cannot-select-skill
    roles: [rejected]
    operation: compile
    defender: {band_id: beastmen-raiders, profile_id: minotaur, special_rule_ids: [band--beastmen-special-skills-shaggy-hide]}
    reject: special rule is not available
  - id: warhounds-of-chaos-cannot-select-skill
    roles: [rejected]
    operation: compile
    defender: {band_id: beastmen-raiders, profile_id: warhounds-of-chaos, special_rule_ids: [band--beastmen-special-skills-shaggy-hide]}
    reject: special rule is not available
  - id: bare-face-1
    roles: [compiled, active, consumer, boundary]
    operation: armour
    attacker: {main_weapon_id: weapon.mace}
    defender: {band_id: beastmen-raiders, profile_id: beastmen-chieftain, special_rule_ids: [band--beastmen-special-skills-shaggy-hide]}
    rolls: [{key: armour, value: 1}]
    expect: {defender.natural_armour_save: 6, result.target: 6, result.saved: false}
  - id: bare-face-2
    roles: [compiled, active, consumer, boundary]
    operation: armour
    attacker: {main_weapon_id: weapon.mace}
    defender: {band_id: beastmen-raiders, profile_id: beastmen-chieftain, special_rule_ids: [band--beastmen-special-skills-shaggy-hide]}
    rolls: [{key: armour, value: 2}]
    expect: {defender.natural_armour_save: 6, result.target: 6, result.saved: false}
  - id: bare-face-3
    roles: [compiled, active, consumer, boundary]
    operation: armour
    attacker: {main_weapon_id: weapon.mace}
    defender: {band_id: beastmen-raiders, profile_id: beastmen-chieftain, special_rule_ids: [band--beastmen-special-skills-shaggy-hide]}
    rolls: [{key: armour, value: 3}]
    expect: {defender.natural_armour_save: 6, result.target: 6, result.saved: false}
  - id: bare-face-4
    roles: [compiled, active, consumer, boundary]
    operation: armour
    attacker: {main_weapon_id: weapon.mace}
    defender: {band_id: beastmen-raiders, profile_id: beastmen-chieftain, special_rule_ids: [band--beastmen-special-skills-shaggy-hide]}
    rolls: [{key: armour, value: 4}]
    expect: {defender.natural_armour_save: 6, result.target: 6, result.saved: false}
  - id: bare-face-5
    roles: [compiled, active, consumer, boundary]
    operation: armour
    attacker: {main_weapon_id: weapon.mace}
    defender: {band_id: beastmen-raiders, profile_id: beastmen-chieftain, special_rule_ids: [band--beastmen-special-skills-shaggy-hide]}
    rolls: [{key: armour, value: 5}]
    expect: {defender.natural_armour_save: 6, result.target: 6, result.saved: false}
  - id: bare-face-6
    roles: [compiled, active, consumer, boundary]
    operation: armour
    attacker: {main_weapon_id: weapon.mace}
    defender: {band_id: beastmen-raiders, profile_id: beastmen-chieftain, special_rule_ids: [band--beastmen-special-skills-shaggy-hide]}
    rolls: [{key: armour, value: 6}]
    expect: {defender.natural_armour_save: 6, result.target: 6, result.saved: true}
  - id: light-armour-combines
    roles: [active, consumer, boundary]
    operation: armour
    attacker: {main_weapon_id: weapon.mace}
    defender: {band_id: beastmen-raiders, profile_id: beastmen-chieftain, special_rule_ids: [band--beastmen-special-skills-shaggy-hide], armour_id: armour.light-armour}
    distribution:
      observable: result.saved
      max_rolls: 1
      expected: {'true': 1/3, 'false': 2/3}
  - id: light-armour-shield-combines
    roles: [active, consumer, boundary]
    operation: armour
    attacker: {main_weapon_id: weapon.mace}
    defender: {band_id: beastmen-raiders, profile_id: beastmen-chieftain, special_rule_ids: [band--beastmen-special-skills-shaggy-hide], armour_id: armour.light-armour, off_hand_id: defence.shield}
    distribution:
      observable: result.saved
      max_rolls: 1
      expected: {'true': 1/2, 'false': 1/2}
  - id: strength-four-negates-bare-hide
    roles: [inactive, boundary]
    operation: armour
    attacker: {main_weapon_id: weapon.mace, characteristics: {weapon_skill: 3, strength: 4, toughness: 3, wounds: 1, initiative: 3, attacks: 1}}
    defender: {band_id: beastmen-raiders, profile_id: beastmen-chieftain, special_rule_ids: [band--beastmen-special-skills-shaggy-hide]}
    expect: {result.eligible: false, result.saved: false, result.roll: null}
  - id: strength-four-modifies-combined-armour
    roles: [boundary]
    operation: armour
    attacker: {main_weapon_id: weapon.mace, characteristics: {weapon_skill: 3, strength: 4, toughness: 3, wounds: 1, initiative: 3, attacks: 1}}
    defender: {band_id: beastmen-raiders, profile_id: beastmen-chieftain, special_rule_ids: [band--beastmen-special-skills-shaggy-hide], armour_id: armour.light-armour}
    rolls: [{key: armour, value: 5}]
    expect: {result.target: 6, result.saved: false}
  - id: ignores-armour
    roles: [inactive, boundary]
    operation: armour
    attacker: {main_weapon_id: weapon.vomit-attack}
    defender: {band_id: beastmen-raiders, profile_id: beastmen-chieftain, special_rule_ids: [band--beastmen-special-skills-shaggy-hide], armour_id: armour.light-armour}
    expect: {result.eligible: false, result.saved: false, result.roll: null}
  - id: not-granted-control
    roles: [inactive]
    operation: armour
    attacker: {main_weapon_id: weapon.mace}
    defender: {band_id: beastmen-raiders, profile_id: beastmen-chieftain}
    expect: {result.eligible: false, result.saved: false}
  mutations:
  - id: remove-natural-save
    changes:
    - {path: defender.natural_armour_save, value: 7}
    - {path: defender.armour_save, value: 7}
    cases: [bare-face-6]
  - id: omit-stacking-bonus
    path: defender.armour_save
    value: 6
    cases: [light-armour-combines]
