schema_version: 1
specifications:
- id: gigantic-spider-poisonous-injuries
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: local
  sources:
  - {target: rule/mordheim/forest-goblins/gigantic-spider--poisonous/trait.poisonous-injury, digest: 1b108c2b745f9f1ba96d0130578e8276e480a78265a327d226ff447618294785}
  interpretation: Mordheimer / Forest Goblins / Gigantic Spider / Poisonous.
    La tabla 1 Knocked Down, 2-4 Stunned, 5-6 Out of Action modifica las heridas CAUSADAS
    por la arana, no las que recibe. El adversario sin inmunidades usa esa tabla;
    la regla general de inmunidad al veneno cancela el efecto venenoso.
  cases:
  - id: recipients
    roles: [grant]
    operation: grant
    defender: {band_id: forest-goblins, profile_id: gigantic-spider}
    context: {rule_id: gigantic-spider--poisonous}
    expect: {result.recipients: [gigantic-spider]}
  - id: outgoing-face-1
    roles: [compiled, active, consumer, boundary]
    operation: injury
    attacker: {band_id: forest-goblins, profile_id: gigantic-spider}
    rolls: [{key: test.injury, value: 1}]
    expect: {result.condition: KNOCKED_DOWN}
    expect_contains: {attacker.global_effects.tags: [poisonous_injury]}
  - id: incoming-face-1
    roles: [inactive, boundary]
    operation: injury
    attacker: {main_weapon_id: weapon.sword}
    defender: {band_id: forest-goblins, profile_id: gigantic-spider}
    rolls: [{key: test.injury, value: 1}]
    expect: {result.condition: KNOCKED_DOWN}
  - id: outgoing-face-2
    roles: [compiled, active, consumer, boundary]
    operation: injury
    attacker: {band_id: forest-goblins, profile_id: gigantic-spider}
    rolls: [{key: test.injury, value: 2}]
    expect: {result.condition: STUNNED}
    expect_contains: {attacker.global_effects.tags: [poisonous_injury]}
  - id: incoming-face-2
    roles: [inactive, boundary]
    operation: injury
    attacker: {main_weapon_id: weapon.sword}
    defender: {band_id: forest-goblins, profile_id: gigantic-spider}
    rolls: [{key: test.injury, value: 2}]
    expect: {result.condition: KNOCKED_DOWN}
  - id: outgoing-face-3
    roles: [compiled, active, consumer, boundary]
    operation: injury
    attacker: {band_id: forest-goblins, profile_id: gigantic-spider}
    rolls: [{key: test.injury, value: 3}]
    expect: {result.condition: STUNNED}
    expect_contains: {attacker.global_effects.tags: [poisonous_injury]}
  - id: incoming-face-3
    roles: [inactive, boundary]
    operation: injury
    attacker: {main_weapon_id: weapon.sword}
    defender: {band_id: forest-goblins, profile_id: gigantic-spider}
    rolls: [{key: test.injury, value: 3}]
    expect: {result.condition: STUNNED}
  - id: outgoing-face-4
    roles: [compiled, active, consumer, boundary]
    operation: injury
    attacker: {band_id: forest-goblins, profile_id: gigantic-spider}
    rolls: [{key: test.injury, value: 4}]
    expect: {result.condition: STUNNED}
    expect_contains: {attacker.global_effects.tags: [poisonous_injury]}
  - id: incoming-face-4
    roles: [inactive, boundary]
    operation: injury
    attacker: {main_weapon_id: weapon.sword}
    defender: {band_id: forest-goblins, profile_id: gigantic-spider}
    rolls: [{key: test.injury, value: 4}]
    expect: {result.condition: STUNNED}
  - id: outgoing-face-5
    roles: [compiled, active, consumer, boundary]
    operation: injury
    attacker: {band_id: forest-goblins, profile_id: gigantic-spider}
    rolls: [{key: test.injury, value: 5}]
    expect: {result.condition: OUT}
    expect_contains: {attacker.global_effects.tags: [poisonous_injury]}
  - id: incoming-face-5
    roles: [inactive, boundary]
    operation: injury
    attacker: {main_weapon_id: weapon.sword}
    defender: {band_id: forest-goblins, profile_id: gigantic-spider}
    rolls: [{key: test.injury, value: 5}]
    expect: {result.condition: OUT}
  - id: outgoing-face-6
    roles: [compiled, active, consumer, boundary]
    operation: injury
    attacker: {band_id: forest-goblins, profile_id: gigantic-spider}
    rolls: [{key: test.injury, value: 6}]
    expect: {result.condition: OUT}
    expect_contains: {attacker.global_effects.tags: [poisonous_injury]}
  - id: incoming-face-6
    roles: [inactive, boundary]
    operation: injury
    attacker: {main_weapon_id: weapon.sword}
    defender: {band_id: forest-goblins, profile_id: gigantic-spider}
    rolls: [{key: test.injury, value: 6}]
    expect: {result.condition: OUT}
  - id: ordinary-attacker-two-knocks-down
    roles: [inactive]
    operation: injury
    attacker: {main_weapon_id: weapon.sword}
    rolls: [{key: test.injury, value: 2}]
    expect: {result.condition: KNOCKED_DOWN}
  - id: outgoing-distribution
    roles: [active, consumer, boundary]
    operation: injury
    attacker: {band_id: forest-goblins, profile_id: gigantic-spider}
    distribution:
      observable: result.condition
      max_rolls: 1
      expected: {KNOCKED_DOWN: 1/6, STUNNED: 1/2, OUT: 1/3}
  - id: poison-immunity-cancels-change
    roles: [inactive, boundary]
    operation: injury
    attacker: {band_id: forest-goblins, profile_id: gigantic-spider}
    defender: {preparation_ids: [preparation.tears-of-shallaya]}
    rolls: [{key: test.injury, value: 2}]
    expect: {result.condition: KNOCKED_DOWN}
  - id: actual-attack-injury
    roles: [active, consumer]
    operation: attack
    attacker: {band_id: forest-goblins, profile_id: gigantic-spider}
    defender_state: {wounds: 1}
    rolls: [{key: test.hit, value: 4}, {key: test.wound, value: 4}, {key: test.injury.0, value: 2}]
    expect: {result.damage: 1, result.defender.condition: STUNNED}
  mutations:
  - id: remove-attacking-poison
    path: attacker.global_effects.tags
    value: []
    cases: [outgoing-face-2, actual-attack-injury]
  - id: remove-defending-immunity
    changes:
    - {path: defender.global_effects.poison_immunity, value: false}
    - {path: defender.global_effects.tags, value: []}
    cases: [poison-immunity-cancels-change]
