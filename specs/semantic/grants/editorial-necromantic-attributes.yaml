      result.recipients:
      - necromantic-abomination
  - id: selected-consumer
    roles:
    - compiled
    - active
    - consumer
    - boundary
    operation: hit
    attacker:
      collection: trollheim
      band_id: khemri-necromancers
      profile_id: necromantic-abomination
      main_weapon_id: weapon.mace
      special_rule_ids:
      - band--necromantic-modification-killers-precision
    expect:
      attacker.characteristics.weapon_skill: 4
      result.target: 3
    rolls:
    - key: hit
      value: 4
  - id: unselected-consumer
    roles:
