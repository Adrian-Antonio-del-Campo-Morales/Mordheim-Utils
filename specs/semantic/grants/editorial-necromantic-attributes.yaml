    - boundary
    operation: hit
    attacker:
      collection: trollheim
      band_id: khemri-necromancers
      profile_id: necromantic-abomination
      main_weapon_id: weapon.mace
    expect:
      result.target: 4
    rolls:
    - key: hit
      value: 4
  mutations:
  - id: remove-attribute-bonus
    path: attacker.characteristics.weapon_skill
    value: 3
    cases:
    - selected-consumer
