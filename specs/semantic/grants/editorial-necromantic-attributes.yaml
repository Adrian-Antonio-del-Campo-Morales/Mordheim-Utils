schema_version: 1
specifications:
- id: editorial-necromantic-bone-armour
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: local
  sources:
  - target: rule/trollheim/khemri-necromancers/band--necromantic-modification-bone-armour/profile.characteristics
    digest: 23c87bb9cea4ee5ca8eeda4bd75064c3546520eeb64a08c1967b674294494d48
  interpretation: Khemri p.56, Necromantic Modification Table / bone-armour. La mejora seleccionada suma uno a toughness
    del perfil de Abominación (valor base 4). Se comprueba su concesión exclusiva y su consumo por la fase wound;
    costes y adquisición 2D6 quedan fuera de esta prueba de combate.
  cases:
  - id: recipients
    roles:
    - grant
    operation: selectable_grant
    defender:
      collection: trollheim
      band_id: khemri-necromancers
      profile_id: necromantic-abomination
      main_weapon_id: weapon.mace
    context:
      rule_id: band--necromantic-modification-bone-armour
    expect:
      result.recipients:
      - necromantic-abomination
  - id: selected-consumer
    roles:
    - compiled
    - active
    - consumer
    - boundary
    operation: wound
    defender:
      collection: trollheim
      band_id: khemri-necromancers
      profile_id: necromantic-abomination
      main_weapon_id: weapon.mace
      special_rule_ids:
      - band--necromantic-modification-bone-armour
    expect:
      defender.characteristics.toughness: 5
      result.target: 6
    attacker:
      main_weapon_id: weapon.mace
    rolls:
    - key: wound
      value: 4
  - id: unselected-consumer
    roles:
    - inactive
    - boundary
    operation: wound
    defender:
      collection: trollheim
      band_id: khemri-necromancers
      profile_id: necromantic-abomination
      main_weapon_id: weapon.mace
    expect:
      result.target: 5
    attacker:
      main_weapon_id: weapon.mace
    rolls:
    - key: wound
      value: 4
  mutations:
  - id: remove-attribute-bonus
    path: defender.characteristics.toughness
    value: 4
    cases:
    - selected-consumer
- id: editorial-necromantic-killers-precision
