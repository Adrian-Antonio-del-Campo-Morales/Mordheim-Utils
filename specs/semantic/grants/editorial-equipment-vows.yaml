schema_version: 1
specifications:
- id: equipment-vows-bretonnian-chapel-guard-questing-knight
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: construction
  sources:
  - target: rule/mordheim/bretonnian-chapel-guard/questing-knight--vow-of-poverty/profile.equipment-restrictions
    digest: 69be99b5623f640ee5925cee23a2f2103b0032aa4b215a81b5c2bbe41d48cc88
  interpretation: >
    questing-knight / vow-of-poverty: prohibición explícita de lance.
    La construcción ordinaria sigue siendo legal. La categoría de armadura pesada
    incluye sus variantes gromril, ithilmar y plate; la prohibición de casco
    incluye el casco improvisado. Se exige el motivo de rechazo específico.
  cases:
  - id: recipients
    roles: [grant]
    operation: grant
    defender: {band_id: bretonnian-chapel-guard, profile_id: questing-knight}
    context: {rule_id: questing-knight--vow-of-poverty}
    expect: {result.recipients: [questing-knight]}
  - id: equipment-boundaries
    roles: [accepted, rejected]
    operation: equipment_choices
    attacker: {band_id: bretonnian-chapel-guard, profile_id: questing-knight}
    context:
      choices:
        ordinary: {}
        lance: {"main_weapon_id":"weapon.lance"}
    expect:
      result.accepted: [ordinary]
      result.rejected:
        lance: lance is forbidden for bretonnian-chapel-guard/questing-knight
  mutations:
  - id: remove-explicit-prohibition
    runtime_fault: suppress-bound-equipment-restrictions
    cases: [equipment-boundaries]
