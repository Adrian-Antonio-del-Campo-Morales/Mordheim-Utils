schema_version: 1
specifications:
- id: mootlander-fragile-halflings
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: local
  sources:
  - {target: rule/mordheim/mootlanders/band--fragile-halflings/trait.fragile-halflings, digest: b87206062ca2e08a60022c786c7da1fd476f67f38dd08e472a07cc22ff54bfaf}
  interpretation: Mordheimer / Mootlanders / Special Rules. Solo cambia el resultado 2 a Stunned.
    La tabla sin modificadores queda 1 Knocked Down, 2-4 Stunned, 5-6 Out of Action.
    Se usa una espada para no confundir este efecto con Concussion de una maza.
  cases:
  - id: all-halfling-recipients
    roles: [grant]
    operation: grant
    defender: {band_id: mootlanders, profile_id: moot-elder}
    context: {rule_id: band--fragile-halflings}
    expect: {result.recipients: [halfling-thieves, master-chef, moot-elder, scouts, warriors]}
  - id: moot-elder-face-1
    roles: [compiled, inactive, boundary]
    operation: injury
    attacker: {main_weapon_id: weapon.sword}
    defender: {band_id: mootlanders, profile_id: moot-elder}
    rolls: [{key: test.injury, value: 1}]
    expect: {result.condition: KNOCKED_DOWN}
    expect_contains: {defender.global_effects.tags: [fragile_halflings]}
  - id: moot-elder-face-2
    roles: [compiled, active, consumer, boundary]
    operation: injury
    attacker: {main_weapon_id: weapon.sword}
    defender: {band_id: mootlanders, profile_id: moot-elder}
    rolls: [{key: test.injury, value: 2}]
    expect: {result.condition: STUNNED}
    expect_contains: {defender.global_effects.tags: [fragile_halflings]}
  - id: moot-elder-face-3
    roles: [compiled, inactive, boundary]
