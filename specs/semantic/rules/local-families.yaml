schema_version: 1
specifications:
- id: skill.iron-sinews
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: permanent
  sources:
  - target: mechanic/skill.iron-sinews
    digest: 335e5c79c86a19609693d1fdf74bf830bfb91870cee8809db4171177620ff3af
  interpretation: The written +1 Strength applies when wounding and calculating armour penetration. A Strength 3
    wielder becomes Strength 4 and wounds Toughness 3 on 3+.
  cases:
  - id: compiled
    roles:
    - compiled
    operation: compile
    attacker:
      main_weapon_id: weapon.mace
      skill_ids:
      - skill.iron-sinews
    expect:
      attacker.global_effects.strength_bonus: 1
  - id: wound-consumer
    roles:
    - consumer
    operation: wound
    attacker:
      main_weapon_id: weapon.mace
      skill_ids:
      - skill.iron-sinews
    distribution:
      observable: result.success
      max_rolls: 1
      expected:
        'true': 2/3
        'false': 1/3
  - id: minimum-strength
    roles:
    - boundary
    operation: strength
    attacker:
      main_weapon_id: weapon.mace
      skill_ids:
      - skill.iron-sinews
      characteristics:
        weapon_skill: 3
        strength: 1
        toughness: 3
        wounds: 3
        initiative: 3
        attacks: 1
    expect:
      result.wound: 2
      result.armour: 2
  - id: ordinary-strength
    roles:
    - consumer
    operation: strength
    attacker:
      main_weapon_id: weapon.mace
      skill_ids:
      - skill.iron-sinews
    expect:
      result.wound: 4
      result.armour: 4
  mutations:
  - id: remove-strength
    path: attacker.global_effects.strength_bonus
    value: 0
    cases:
    - wound-consumer
    - ordinary-strength
  interaction_contract:
    reads:
    - fighter.strength
    writes:
    - attack.strength
    - armour.strength
