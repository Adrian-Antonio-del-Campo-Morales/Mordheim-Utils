schema_version: 1
specifications:
- id: mighty-blow
  interaction_contract:
    reads:
    - fighter.strength
    - weapon.kind
    writes:
    - attack.strength
    - armour.strength
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: permanent
  sources:
  - target: mechanic/skill.mighty-blow
    digest: 90e3a20d279e166a42a5d9332852f105bb8c0b05f0e6234dfcc95bc40f0de20d
  interpretation: The written +1 Strength close-combat bonus applies to ordinary weapons, not to pistols. Expected
    values below are authored from this statement, not from execution parameters.
  cases:
  - id: compiled
    roles:
    - compiled
    operation: compile
    attacker:
      skill_ids:
      - skill.mighty-blow
      main_weapon_id: weapon.mace
    expect:
      attacker.global_effects.strength_bonus: 1
  - id: ordinary-strength
    roles:
    - consumer
    operation: strength
    attacker:
      skill_ids:
      - skill.mighty-blow
      main_weapon_id: weapon.mace
    expect:
      result.wound: 4
      result.armour: 4
  - id: minimum-base
    roles:
    - boundary
    operation: strength
    attacker:
      skill_ids:
      - skill.mighty-blow
      main_weapon_id: weapon.mace
      characteristics:
        weapon_skill: 3
        strength: 1
        toughness: 3
        wounds: 3
        initiative: 3
        attacks: 1
    expect:
      result.wound: 2
      result.armour: 2
  - id: without-skill
    roles:
    - inactive
    operation: strength
    attacker:
      main_weapon_id: weapon.mace
    expect:
      result.wound: 3
      result.armour: 3
  - id: pistol-excluded
    roles:
    - boundary
    operation: strength
    attacker:
      skill_ids:
      - skill.mighty-blow
      main_weapon_id: weapon.pistol
    context:
      first_round: true
    expect:
      result.wound: 4
      result.armour: 4
  mutations:
  - id: remove-bonus
    path: attacker.global_effects.strength_bonus
    value: 0
    cases:
    - ordinary-strength
  - id: wrong-magnitude
    path: attacker.global_effects.strength_bonus
    value: 2
    cases:
    - ordinary-strength
    - minimum-base
- id: regeneration-five-plus-fire
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: contextual
  sources:
  - target: mechanic/skill.regeneration-5-plus
    digest: 696041a7c52dce76d761c74874d2dd412453066e8bd914ac8ec2101690039e98
  interpretation: Ignore a wound on 5 or 6 except fire wounds; a blocked regeneration roll must not be requested.
  cases:
  - id: compiled
    roles:
    - compiled
    operation: compile
    defender:
      skill_ids:
      - skill.regeneration-5-plus
    expect:
      defender.global_effects.regeneration_save: 5
      defender.global_effects.regeneration_blocked_by_fire: true
  - id: ordinary-d6
    roles:
    - active
    - boundary
    - consumer
    operation: special_save
    defender:
      skill_ids:
      - skill.regeneration-5-plus
    distribution:
      observable: result.saved
      max_rolls: 1
      expected:
        'true': 1/3
        'false': 2/3
  - id: fire-denies-roll
    roles:
    - inactive
    operation: special_save
    attacker:
      main_weapon_id: weapon.brazier-iron
    defender:
      skill_ids:
      - skill.regeneration-5-plus
    expect:
      context.regeneration_blocked: true
      result.saved: false
      result.regeneration_roll: null
  - id: no-regeneration
    roles:
    - inactive
    operation: special_save
    expect:
      result.saved: false
      result.regeneration_roll: null
  mutations:
  - id: allow-fire-regeneration
    path: defender.global_effects.regeneration_blocked_by_fire
    value: false
    cases:
    - fire-denies-roll
  - id: wrong-threshold
    path: defender.global_effects.regeneration_save
    value: 4
    cases:
    - ordinary-d6
  interaction_contract:
    reads:
    - attack.fire
    - damage.wound
    writes:
    - damage.unsaved
