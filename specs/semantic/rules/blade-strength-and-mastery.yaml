schema_version: 1
specifications:
- id: blade-contract-broadsword
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: local
  sources:
  - target: mechanic/weapon.broadsword
    digest: 12fdd4a0c2adb20085dda253bae5da65ce0469432546fcb0d4f593af2993cfb2
  interpretation: 'Close Combat / Broadsword: Fuerza del usuario +1. Difficult to Use impide segunda arma y rodela,
    pero permite escudo y kite shield. No es por sí misma un arma que ataque última.'
  cases:
  - id: compiled
    roles:
    - compiled
    operation: compile
    attacker:
      main_weapon_id: weapon.broadsword
    expect:
      attacker.main_weapon.strength_bonus: 1
      attacker.main_weapon.two_handed: false
  - id: strength
    roles:
    - active
    - consumer
    operation: strength
    attacker:
      main_weapon_id: weapon.broadsword
    expect:
      result.wound: 4
      result.armour: 4
  - id: control
    roles:
    - inactive
    operation: strength
    attacker:
      main_weapon_id: weapon.mace
    expect:
      result.wound: 3
      result.armour: 3
  - id: wound-1
    roles:
    - active
    - consumer
    - boundary
    operation: wound
    attacker:
      main_weapon_id: weapon.broadsword
    rolls:
    - key: wound
      value: 1
    expect:
      result.target: 3
      result.success: false
  - id: wound-2
    roles:
    - active
    - consumer
    - boundary
    operation: wound
    attacker:
      main_weapon_id: weapon.broadsword
    rolls:
    - key: wound
      value: 2
    expect:
      result.target: 3
      result.success: false
  - id: wound-3
    roles:
    - active
    - consumer
    - boundary
    operation: wound
    attacker:
      main_weapon_id: weapon.broadsword
    rolls:
    - key: wound
      value: 3
    expect:
      result.target: 3
      result.success: true
  - id: wound-4
    roles:
    - active
    - consumer
    - boundary
    operation: wound
    attacker:
      main_weapon_id: weapon.broadsword
    rolls:
    - key: wound
      value: 4
    expect:
      result.target: 3
      result.success: true
  - id: wound-5
    roles:
    - active
    - consumer
    - boundary
    operation: wound
    attacker:
      main_weapon_id: weapon.broadsword
    rolls:
    - key: wound
      value: 5
    expect:
      result.target: 3
      result.success: true
  - id: wound-6
    roles:
    - active
    - consumer
    - boundary
    operation: wound
    attacker:
      main_weapon_id: weapon.broadsword
    rolls:
    - key: wound
      value: 6
    expect:
      result.target: 3
      result.success: true
  - id: hands
    roles:
    - boundary
    - accepted
    - rejected
    operation: equipment_choices
    attacker:
      main_weapon_id: weapon.broadsword
    context:
      choices:
        alone: {}
        shield:
          off_hand_id: defence.shield
        kite:
          off_hand_id: defence.kite-shield
        buckler:
          off_hand_id: defence.buckler
        dagger:
          off_hand_id: weapon.dagger
        sword:
          off_hand_id: weapon.sword
    expect:
      result.accepted:
      - alone
      - kite
      - shield
      result.rejected:
        buckler: weapon.broadsword cannot be combined with defence.buckler
        dagger: weapon.broadsword cannot be combined with weapon.dagger
        sword: weapon.broadsword cannot be combined with weapon.sword
  - id: armour-penetration-from-strength
    roles:
    - consumer
    - boundary
    operation: armour
    attacker:
      main_weapon_id: weapon.broadsword
    defender:
      armour_id: armour.heavy-armour
    rolls:
    - key: armour
      value: 5
    expect:
      result.saved: false
  mutations:
  - id: remove-strength
    path: attacker.main_weapon.strength_bonus
    value: 0
    cases:
    - strength
    - wound-3
