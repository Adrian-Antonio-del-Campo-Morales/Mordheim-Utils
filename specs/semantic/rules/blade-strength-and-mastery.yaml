- id: blade-contract-cathayan-longsword
  scope_digest: fcb37e89b6a5fa8ee7e3d91a7612e8e591b9c19a96f087940d32276517be73c9
  category: local
  sources:
  - target: mechanic/weapon.cathayan-longsword
    digest: 0df12ef3ae270b61e547521742086ffa3ea2391a972d0efc5c448c63ec326322
  interpretation: 'Close Combat / Cathayan Longsword / Mastercrafted: +1 HA y +1 I al portador; no +1 Fuerza. HA3
    pasa a HA4 y supera HA3 enemiga (3+). El bono de HA de la mano secundaria no se añade al ataque de la mano principal.'
  cases:
  - id: compiled
    roles:
    - compiled
    operation: compile
    attacker:
      main_weapon_id: weapon.cathayan-longsword
    expect:
      attacker.main_weapon.weapon_skill_bonus: 1
      attacker.main_weapon.initiative_bonus: 1
  - id: strength-unchanged
    roles:
    - inactive
    operation: strength
    attacker:
      main_weapon_id: weapon.cathayan-longsword
    expect:
      result.wound: 3
      result.armour: 3
  - id: initiative
    roles:
    - active
    - consumer
    - boundary
    operation: priority
    attacker:
      main_weapon_id: weapon.cathayan-longsword
    expect:
      result.initiative: 4
  - id: ordinary-initiative
    roles:
    - inactive
    operation: priority
    attacker:
      main_weapon_id: weapon.mace
    expect:
      result.initiative: 3
  - id: hit-1
    roles:
    - active
    - consumer
    - boundary
    operation: hit
    attacker:
      main_weapon_id: weapon.cathayan-longsword
    rolls:
    - key: hit
      value: 1
    expect:
      result.target: 3
      result.success: false
  - id: hit-2
    roles:
    - active
    - consumer
    - boundary
    operation: hit
    attacker:
      main_weapon_id: weapon.cathayan-longsword
    rolls:
    - key: hit
      value: 2
    expect:
      result.target: 3
      result.success: false
  - id: hit-3
    roles:
    - active
    - consumer
    - boundary
    operation: hit
    attacker:
      main_weapon_id: weapon.cathayan-longsword
    rolls:
    - key: hit
      value: 3
    expect:
      result.target: 3
      result.success: true
  - id: hit-4
    roles:
    - active
    - consumer
    - boundary
    operation: hit
    attacker:
      main_weapon_id: weapon.cathayan-longsword
    rolls:
    - key: hit
      value: 4
    expect:
      result.target: 3
      result.success: true
  - id: hit-5
    roles:
    - active
    - consumer
    - boundary
    operation: hit
    attacker:
      main_weapon_id: weapon.cathayan-longsword
    rolls:
    - key: hit
      value: 5
    expect:
      result.target: 3
      result.success: true
  - id: hit-6
    roles:
    - active
    - consumer
    - boundary
    operation: hit
    attacker:
      main_weapon_id: weapon.cathayan-longsword
    rolls:
    - key: hit
      value: 6
    expect:
      result.target: 3
      result.success: true
  - id: offhand-only-ws
    roles:
    - active
    - consumer
    - boundary
    operation: pool
    attacker:
      main_weapon_id: weapon.mace
      off_hand_id: weapon.cathayan-longsword
    context:
      count: 2
    rolls:
    - key: test.attack.0.hit
      value: 3
    - key: test.attack.1.hit
      value: 3
    - key: test.attack.1.wound
      value: 1
    expect:
      result.attacks.0.hit: false
      result.attacks.1.hit: true
      result.defender.wounds: 3
  mutations:
  - id: remove-ws
    path: attacker.main_weapon.weapon_skill_bonus
    value: 0
    cases:
    - hit-3
  - id: remove-initiative
    path: attacker.main_weapon.initiative_bonus
    value: 0
    cases:
    - initiative
