name: CI

# Web application validation workflow.
# A failure of the KB validation, the campaign-file v5 contract checks, the Python tests,
# the TypeScript tests or the web build must block the pipeline. Publishing
# is a separate, gated workflow (deploy-pages.yml) that runs only after this
# one succeeds on the default branch.
#
# The Python regression net below runs `tests/knowledge`, including the
# artefact audits and bilingual parity vectors under `tests/knowledge/web`.
# Run the same selection locally with `python tools/mordheim-utils.py check ci`,
# or only the web audits with `python -m pytest tests/knowledge/web`, after
# touching the KB, the generator or the contracts.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python — contract, KB and regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package (reproducible)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate the KB sources build a clean artefact
        run: |
          python tools/knowledge/generate_knowledge_web.py
          python tools/knowledge/generate_knowledge_web.py --check

      # The fast net: contracts, architecture, the knowledge catalogue, the
      # web artefact audits and the shared eligibility bridge.
      - name: Run the Python regression net
        run: python -m pytest tests/applications/warband_manager/persistence/campaign_file tests/tooling/architecture tests/knowledge tests/construction/test_shared_eligibility.py -q

      # The modular engine E2E battery is listed separately: the Python
      # regression net above deliberately excludes tests/integration/e2e.  This step runs
      # the strict support checks, the full-loop proofs, the declared scenarios
      # and the shared-variant isolation checks, and reconciles them against
      # the audit register.  Incomplete admitted-clause coverage is reported,
      # and fails only under MORDHEIM_E2E_REQUIRE_COMPLETE=1.
      - name: Run the modular engine E2E battery
        run: python -m pytest tests/integration/e2e -q --ignore=tests/integration/e2e/integrity/test_non_regression.py

      # Separated from the battery so a lost accepted scenario, clause
      # reference or identity is visible on its own rather than hidden among
      # unrelated E2E output.  It compares the live corpus with the reviewed
      # evidence/coverage-baseline.yaml set-wise; counts alone would let a
      # reviewed scenario be substituted by another one.
      - name: Check accepted E2E coverage has not regressed
        run: python -m pytest tests/integration/e2e/integrity/test_non_regression.py -q

      - name: Verify the artefact is deterministic and untouched by a rebuild
        run: python tools/knowledge/generate_knowledge_web.py --check

  typescript:
    name: TypeScript — packages and web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install the workspace (reproducible, lockfile-driven)
        run: npm ci

      - name: Generate the KB artefact for the tests and the browser
        run: |
          pip install -e ".[dev]"
          python tools/knowledge/generate_knowledge_web.py
          python tools/knowledge/generate_knowledge_web.py --check

      - name: Typecheck and test the packages
        run: |
          npm run check:eligibility
          cd packages/typescript && npm run typecheck && npm test

      # This is intentionally separate from the complete web suite below:
      # it makes the bilingual KB presentation contract visible in CI and
      # prevents a regression from being hidden among unrelated test output.
      - name: Verify localized KB text, accessible tooltips and hidden technical IDs
        run: |
          cd apps/warband-manager-web
          npx vitest run --pool=forks --maxWorkers=1 --testTimeout=200000 \
            ../../tests/applications/warband_manager/features/campaign/knowledge-display-coverage.test.tsx \
            ../../tests/applications/warband_manager/features/campaign/ui_i18n.test.ts \
            ../../tests/applications/warband_manager/features/campaign/displayText.test.ts \
            ../../tests/applications/warband_manager/features/campaign/KnowledgeHint.test.tsx

      - name: Typecheck, lint, test and build the web app
        run: |
          cd apps/warband-manager-web
          npm run typecheck
          npm run lint
          npm test
          npm run build

      # P7.3 bundle guardrails: src/architecture/boundaries.test.ts only
      # runs with dist/ present, so it executes here — after the build —
      # asserting the bundle excludes NumPy/Cython/Tkinter/Combat Lab and
      # ships no .mordheim files (the pre-build `npm test` run skips it).
      - name: Post-build bundle guardrails (boundaries.test.ts)
        run: cd apps/warband-manager-web && npx vitest run ../../tests/tooling/architecture/web-boundaries.test.ts ../../tests/applications/warband_manager/packaging/bundle-boundaries.test.ts

      - name: Upload the built app for inspection
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/warband-manager-web/dist/
          retention-days: 7

  # Gate: everything above must be green. deploy-pages.yml re-runs the build
  # in its own workflow; this check name is what it awaits.
  ci-green:
    name: CI green
    needs: [python, typescript]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Fail if any job failed
        if: needs.python.result != 'success' || needs.typescript.result != 'success'
        run: exit 1
      - name: All green
        run: echo "Python and TypeScript pipelines passed."
